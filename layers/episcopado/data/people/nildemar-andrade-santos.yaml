id: nildemar-andrade-santos
name: Nildemar Andrade Santos
full_name: Nildemar Andrade Santos
aliases:
- Dom Nildemar Andrade
- Nildemar Andrade dos Santos
- Padre Nildemar
- Rev. Nildemar Santos
biography: >-
  Ex-padre da Diocese católica de Ilhéus (BA), onde serviu 28 anos (ordenado presbítero em 16/12/1989, por Bernardo
  Valfredo Tepe, segundo o site da IACES); renunciou ao estado clerical em 2011 e foi excomungado em fevereiro de
  2012. Em 2012 integrou, com o padre Adauto, o Ponto Missionário anglicano da Santíssima Trindade (Paróquia do
  Bom Pastor, Diocese do Recife, IEAB). Em 2020 consta como presbítero da Igreja Anglo-Católica do Espírito Santo
  (IACES), de José Fernando de Faria. Segundo o site da IVCM, foi consagrado bispo diocesano de Ilhéus em 06/03/2022
  por Faria. Em 2025 aparece como primaz da Igreja Vetero Católica Independente do Brasil, da qual é presidente
  no CNPJ (2024).
