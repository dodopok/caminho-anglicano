    quote: >-
      Em 23 de abril daquele ano, às 20h, os trabalhos foram oficialmente retomados na paróquia sob a responsabilidade
      do então postulante Josafá Batista dos Santos, nomeado pelo Bispo Diocesano D. Clovis Erly Rodrigues
    page: '183'
