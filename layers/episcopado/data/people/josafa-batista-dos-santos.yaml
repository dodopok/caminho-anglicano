    quote: 'Considerando a solicitação dos clérigos e clérigas a seguir relacionados:'
  - source: ieab-2004-decreto-recife
    quote: Rev. Josafá Batista dos Santos
  - source: dar-clero-diocesano
    quote: Revdo. Josafá Batista dos Santos (Emérito)
  - source: costa2021
    quote: >-
      Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Rev. Josafá Batista dos Santos
    page: '545'
  - source: costa2021
    quote: Rev. Josafá Batista dos Santos
    page: '217'
  - source: costa2021
    quote: >-
      Em 23 de abril daquele ano, às 20h, os trabalhos foram oficialmente retomados na paróquia sob a responsabilidade
      do então postulante Josafá Batista dos Santos, nomeado pelo Bispo Diocesano D. Clovis Erly Rodrigues
    page: '183'
  - source: costa2021
    quote: exerceu a função de pároco da comunidade entre os anos de 1998 e 2003
    page: '183'
  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Emérito (página consultada
    em 2026-10). Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife e foi um dos 13 que pediram à Câmara
    dos Bispos supervisão episcopal alternativa (decreto de 16/09/2004), mantendo a comunhão com a IEAB. Início
    e fim do vínculo não informados. Signatário de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise de 2004-2005.
    Cônego honorário da Catedral do Bom Samaritano (julho de 2018). Local: Paróquia do Bom Pastor, Salvador. Postulante
    encarregado desde 23/04/1995; pároco 1998-2003. Tese cita BÍBLIA, 2015.
events:
- type: other
  date: '2004-09-01'
  description: >-
    Documento 'Não sairemos', assinado pelo bispo sufragâneo Filadelfo Oliveira e clérigos e leigos da Diocese Anglicana
    do Recife, reafirmando o vínculo com a IEAB independentemente das decisões do diocesano.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em 1º de setembro de 2004, foi publicado o texto intitulado Não sairemos, o primeiro documento que enfrentou
      Robinson quando este sinalizou que romperia com a Província, assinado pelo bispo sufragâneo, Filadelfo Oliveira,
      e vários outros clérigos e leigos da Diocese
    page: '217'
  - source: costa2021
    quote: >-
      Assinaram este documento: Dom Filadelfo Oliveira Neto, ose (Bispo Sufragâneo da DAR); Revmo. Sérgio L. Andrade
      (Deão da Catedral Anglicana da SS. Trindade)
    page: '217'
