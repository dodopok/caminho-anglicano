# yaml-language-server: $schema=../../schemas/person.json
id: josafa-batista-dos-santos
name: Josafá Batista dos Santos
biography: >-
  Foi ordenado diácono em 26/06/1997 e presbítero em 07/02/1998 na IEAB, atuou como pároco entre 1998 e 2003 e consta
  como emérito do clero da Diocese Anglicana do Recife. Está entre os clérigos relacionados no decreto da IEAB de
  2004 sobre essa diocese.
sources:
