id: josafa-batista-dos-santos
name: Josafá Batista dos Santos
biography: >-
  Clérigo(a) da Diocese Anglicana do Recife que em 2004 pediu supervisão episcopal alternativa à Câmara dos Bispos
  da IEAB, permanecendo na IEAB.
sources:
- source: costa2021
  quote: >-
    Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Rev. Josafá Batista dos Santos
  page: '545'
ordinations:
- order: diaconate
  date: '1997-06-26'
  jurisdiction: ieab
  ordained_by: clovis-erly-rodrigues
  status: probable
  sources:
  - source: costa2021
    quote: Josafá foi ordenado diácono em 26/06/1997 e presbítero em 07/02/1998
    page: '183'
  - source: dard2-hist3
    quote: Josafá Batista (aposentado em Salvador-BA, na dissidência local pró-IEAB)
  notes: >-
    Diocese Anglicana do Recife (Salvador, BA). Ordenante não informado. A tese cita BÍBLIA, 2015, p. 2-3 (edição
    sobre os 200 anos de anglicanismo na Bahia). Citado por Robinson Cavalcanti entre os ordenados "apenas ao Diaconato"
    no período do bispo Clóvis Erly Rodrigues (1986-1997); em 2006 aposentado em Salvador (BA), na dissidência local
    ligada à IEAB. Data e local não constam; o ordenante é entendido como o bispo diocesano da época. A identificação
    com a pessoa de mesmo nome é por nome e período.
- order: presbyterate
  date: '1998-02-07'
  jurisdiction: ieab
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Josafá foi ordenado diácono em 26/06/1997 e presbítero em 07/02/1998 e exerceu a função de pároco da comunidade
      entre os anos de 1998 e 2003
    page: '183'
  notes: Ordenante não informado (Robinson era o diocesano desde out/1997). A tese cita BÍBLIA, 2015.
