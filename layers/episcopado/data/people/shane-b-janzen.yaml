# yaml-language-server: $schema=../../schemas/person.json
id: shane-b-janzen
name: Shane B. Janzen
full_name: Shane B. Janzen
aliases:
- Archbishop Shane Janzen
- Shane Janzen
biography: >-
  Arcebispo, primaz da Traditional Anglican Church e metropolita da Igreja Católica Anglicana do Canadá; em 2020
  a TAC passou de comunhão de igrejas nacionais a uma única igreja global, e em maio de 2025 realizou seu primeiro
  Sínodo Geral.
sources:
- source: tac-londrina-home
  quote: >-
    Reverendíssimo Arcebispo Shane B. Janzen Primaz da Traditional Anglican Church e Metropolita da Igreja Católica
    Anglicana do Canadá
- source: tac-natal-5anos
  quote: The Most Reverend Shane B. Janzen Primate of the Traditional Anglican Church
- source: cant-novas-igrejas-2024
  quote: o Bispo Primaz, Shane Janzen (metropolita do Canadá)
  page: '81'
- source: cont-tac-global-church-2020
  quote: This decision changes the TAC from a communion of national churches into a single global church.
- source: cont-tac-synod-prayers-2025
  quote: >-
    first General Synod of the worldwide Traditional Anglican Church (to be held at St. George’s Cathedral in Columbus,
    Georgia from May 20 to 23)
affiliations:
- jurisdiction: tac
  role: primate
  status: confirmed
  sources:
  - source: tac-natal-5anos
    quote: The Most Reverend Shane B. Janzen Primate of the Traditional Anglican Church
  - source: cant-novas-igrejas-2024
    quote: o Bispo Primaz, Shane Janzen (metropolita do Canadá)
    page: '81'
  notes: Primaz em 2021–2023.
events:
- type: other
  date: '2020-01-16'
  description: >-
    Em 16/01/2020 a TAC passa de 'Comunhão' de igrejas nacionais a uma única igreja global ('Traditional Anglican
    Church'), com oito províncias (Austrália, Canadá, EUA/ACA, Índia, América Latina, África, Irlanda rito tradicional,
    Grã-Bretanha, Torres Strait); a Igreja no Brasil não consta. As dioceses brasileiras de Natal e São Paulo-Paraná
    foram recebidas em 2025.
  status: confirmed
  sources:
  - source: cont-tac-global-church-2020
    quote: This decision changes the TAC from a communion of national churches into a single global church.
  - source: cont-tac-global-church-2020
    quote: >-
      The Traditional Anglican Church will be comprised of eight Provinces: The Anglican Catholic Church in Australia;
      The Anglican Catholic Church of Canada; The Anglican Church in America; The Anglican Church of India; The
      Province of the Anglican Church in Latin America;
- type: other
  date: 2025-05
  description: >-
    Primeiro Sínodo Geral da Traditional Anglican Church, em St. George's Cathedral, Columbus (Geórgia, EUA), 20-23/05/2025;
    o padre Melque Ambrósio (Diocese Anglicana do Natal) participou; a Ad Clerum 2025.2 (já na base) registra que
    as dioceses do Brasil foram 'oficialmente recebidas por unanimidade' nesse sínodo.
  status: confirmed
  sources:
  - source: cont-tac-synod-prayers-2025
    quote: >-
      first General Synod of the worldwide Traditional Anglican Church (to be held at St. George’s Cathedral in
      Columbus, Georgia from May 20 to 23)
  - source: cont-tac-synod-feedback-2025
    quote: Fr Melque Ambrósio (Diocese Anglicana do Natal – Brazil, South America)
- type: other
  date: '2021'
  description: >-
    Contato do clero de Natal (Rodson e Melque) com o arcebispo Michael Gill e início do diálogo com a TAC; reunião
    com o primaz Shane Janzen.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Junto com o reverendo Melque, em 2021 foi feito contato com o Arcebispo da África do Sul, Michael Gill, de
      Joanesburgo, e assim, iniciou-se o diálogo com a TAC.
    page: '81'
