id: francisco-pagtakhan
name: Francisco Pagtakhan
biography: Bispo da Igreja Filipina Independente; co-sagrante dos quatro bispos do Movimento Contínuo em 1978.
sources:
- source: cant-novas-igrejas-2024
  quote: O Movimento foi endossado com o apoio do bispo Francisco Pagtakhan, da Igreja Filipina Independente
