# yaml-language-server: $schema=../../schemas/person.json
id: marcio-meira
name: Márcio Meira
full_name: Márcio Medeiros Meira
aliases:
- Márcio Medeiros Meira
biography: >-
  Eleito bispo auxiliar no sínodo extraordinário de 06/05/2017 e sagrado em junho de 2017; primeiro bispo da Diocese
  de João Pessoa da IAB.
sources:
- source: iab-dois-novos-bispos
  quote: 'elegeu dois novos Bispos auxiliares: Rev. Márcio Simões e Rev. Márcio Meira.'
ordinations:
- order: episcopate
  date: '2017-06-11'
  place: Catedral PAES, Recife
  jurisdiction: diocese-anglicana-recife
  office: auxiliary
  principal_consecrator: miguel-uchoa
  co_consecrators:
  - bill-atwood
  - evilasio-tenorio
  - flavio-soares
  - leonides-menezes
  status: contested
  sources:
  - source: iab-dois-novos-bispos
    quote: >-
      elegeu dois novos Bispos auxiliares: Rev. Márcio Simões e Rev. Márcio Meira.  A Igreja Anglicana no Brasil
      – Diocese de Recife está em plena expansão, implantando igrejas em todo o Brasil, obedecendo ao IDE de Cristo.
      Em Junho acontecerá a  Sagração Episcopal
  - source: iab-poster-linhagem-meira
    quote: >-
      Em 11 de junho de 2017, na Catedral PAES, em Recife, o arcebispo Miguel Uchoa, juntamente com os bispos Bill
      Atwood, Flávio Soares, Evilásio Tenório e Leônides Menezes, sagraram: Márcio Medeiros Meira como o primeiro
      bispo da Diocese de João Pessoa, da Igreja Anglicana no Brasil.
  discrepancies:
  - field: jurisdiction
    value: iab
    sources:
    - source: iab-poster-linhagem-meira
      quote: >-
        Em 11 de junho de 2017, na Catedral PAES, em Recife, o arcebispo Miguel Uchoa, juntamente com os bispos
        Bill Atwood, Flávio Soares, Evilásio Tenório e Leônides Menezes, sagraram: Márcio Medeiros Meira como o
        primeiro bispo da Diocese de João Pessoa, da Igreja Anglicana no Brasil.
  - field: office
    value: diocesan
    sources:
    - source: iab-poster-linhagem-meira
      quote: >-
        Em 11 de junho de 2017, na Catedral PAES, em Recife, o arcebispo Miguel Uchoa, juntamente com os bispos
        Bill Atwood, Flávio Soares, Evilásio Tenório e Leônides Menezes, sagraram: Márcio Medeiros Meira como o
        primeiro bispo da Diocese de João Pessoa, da Igreja Anglicana no Brasil.
  notes: >-
    O pôster da IAB dá 11/06/2017 na PAES, sagrante Uchoa com Atwood, Soares, Tenório e Leônides Menezes; o site
    da Diocese de Vitória dá 10/06/2017 para Márcio Simões (eleito no mesmo sínodo) — provavelmente a mesma cerimônia;
    dia exato e sagrantes não confirmados. O pôster chama Uchoa de 'arcebispo' em 2017; a IAB como província é de
    2018 — verificar a jurisdição exata na data (Diocese do Recife / Cone Sul?).
affiliations:
