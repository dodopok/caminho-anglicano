    (Rua Vicente Gomes de Almeida, 278, Ramadinha I), com cerca de 90 presentes; pregou o Rev. Márcio Meira (Paróquia
    Anglicana Comunhão), com a presença da Revda. Verônica de Lourdes Pereira (Ponto Missionário Anglicano Compaixão).
  status: confirmed
  sources:
  - source: d2s20-vida-espaco
    quote: >-
      Em um culto bem festivo, foi inaugurado o novo espaço de cultos do Ponto Missionário Anglicano Vida , em Campina
      Grande (PB).
  - source: d2s20-vida-espaco
    quote: >-
      Foi o pregador do culto inaugural o Rev. Márcio Meira (Paróquia Anglicana Comunhão), contando, ainda, com
      a presença da Revda. Verônica de Lourdes Pereira (Ponto Missionário Anglicano Compaixão).
