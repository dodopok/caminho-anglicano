  notes: >-
    Fonte é anúncio PRÉVIO do GAFCON (cerimônia conjunta com Márcio Simões, sábado 10/06/2017); o site da Diocese
    de Vitória confirma que a de Simões ocorreu em 10/06/2017. O pôster da IAB dá 11/06/2017 (domingo) na PAES,
    sagrante Uchoa com Atwood, Soares, Tenório e Leônides Menezes — data e co-sagrantes do pôster não confirmados;
    10/06/2017 é mais provável. O pôster chama Uchoa de 'arcebispo' em 2017; a IAB como província é de 2018 — verificar
    a jurisdição exata na data (Diocese do Recife / Cone Sul?). Eleição 06/05/2017; sagração anunciada para junho
    de 2017. Simões (site da Diocese de Vitória) dá 10/06/2017; o pôster da IAB dá 11/06/2017 para Meira. O site
    da Diocese de João Pessoa diz "Foi consagrado bispo em 2021" (ver afirmação contestada). Diverge de todas as
    demais fontes (eleição em 2017, presença como bispo na GAFCON 2018, ordenação em Guiné-Bissau em set/2021 já
    como bispo diocesano). Provável erro do site ou confusão com outra data; mantido como contestado.
