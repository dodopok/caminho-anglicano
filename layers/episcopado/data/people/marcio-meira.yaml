      Ordens, os clérigos a seguir mencionados: … Rev. Márcio Medeiros Meira … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Listado como "Rev." no clero da Diocese do Recife (IEAB) em jan/2002, endereço no Bessa (João Pessoa). Data/ordenante
    de diaconato e presbiterato não encontrados. Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom
    Filadelfo Oliveira Neto, Autoridade Eclesiástica da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a)
    'da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas Ordens' por abandono
    de comunhão. motivo_fim 'deposicao' porque o efeito é a perda das ordens na IEAB e a carta do Anexo S chama
    o grupo de 'clérigos depostos'; o fato de fundo é a adesão ao cisma de Robinson Cavalcanti. Início do vínculo
    com a IEAB não informado.
