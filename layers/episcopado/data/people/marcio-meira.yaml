biography: >-
  Márcio Medeiros Meira, natural de Fortaleza (CE) e ligado à Ordem Evangélica de Santo Estevão Mártir (OSE), foi
  ordenado diácono por Robinson Cavalcanti em outubro de 2000, em João Pessoa, e já constava como presbítero da
  Diocese Anglicana do Recife (DAR) em 2002. Nela foi pároco da Paróquia Anglicana Comunhão, em João Pessoa, reitor
  do Seminário Anglicano Teológico da Paraíba (SAT-PB), secretário diocesano de Missão e Evangelismo, arcediago
  adjunto e depois arcediago do Arcediagado Paraíba/Rio Grande do Norte e coordenador administrativo do IAT. Em
  23/08/2005 consta entre os clérigos excluídos da comunhão da IEAB. Em 06/05/2017 um sínodo extraordinário da Diocese
  de Recife, em Olinda, o elegeu bispo auxiliar, com Márcio Simões; as fontes divergem sobre a sagração, datada
  de 10/06/2017 e atribuída a Miguel Uchôa, para liderar a nova Diocese de João Pessoa. Em 27/04/2018 passou a bispo
  diocesano de João Pessoa, na Igreja Anglicana no Brasil (IAB), e é pastor da Catedral Anglicana Comunhão, cujo
  novo templo foi inaugurado em 27/11/2023; aparece também ligado à Diocese Anglicana Família. Conduziu o primeiro
  Sínodo Extraordinário Online da IAB, em 13/03/2023, que elegeu Miguel Neto e Eric Rodrigues bispos auxiliares.
  Participou de 11 ordenações de diáconos ou presbíteros e de três sagrações episcopais, entre elas a de Eric Rodrigues,
  em 08/05/2023, que presidiu, e a de Ivan Rocha, na IECB, em janeiro de 2024.
