      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Local: Paróquia Anglicana Comunhão, João Pessoa-PB. Presbítero da Diocese do Recife sob o Cone Sul até a sagração
    episcopal (2017). No artigo de 2011 diz ter sido 'o primeiro paraibano a concluir o Curso Bacharel em Teologia,
    e, consequentemente, a ser Ordenado na Igreja Anglicana aqui na Paraíba' (data não informada). Arcediago da
    Paraíba/Rio Grande do Norte em 2013. Local: Paróquia Anglicana da Comunhão. Atendido pelo Rev. Márcio Meira
    e pelo Rev. Henrique Lacerda em out/nov de 2006; o boletim não diz o cargo na paróquia (usa "Reitor" apenas
    para o SAT-PB). Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006
    (Nota de Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta
    à convocação de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente
    em 2005. Início dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é
    anterior, sem data exata.
