# yaml-language-server: $schema=../../schemas/person.json
id: marcio-meira
name: Márcio Meira
full_name: Márcio Medeiros Meira
aliases:
- '@bispomarciomeira'
- Bp. Marcio
- Márcio Medeiros Meira
- Rev. Márcio Medeiros Meira, OSE
biography: >-
  Natural de Fortaleza; presbítero na Diocese do Recife (IEAB) já em 2002; fundador da Igreja (Catedral) Anglicana
  Comunhão em João Pessoa; bispo auxiliar sagrado em 2017 e primeiro bispo diocesano de João Pessoa na IAB.
sources:
- source: djp-meira
  quote: >-
    O Bispo Márcio Meira é o primeiro bispo da Diocese de João Pessoa da Igreja Anglicana no Brasil. Natural de
    Fortaleza (CE)
- source: ieabrecife-clero-2002
  quote: Márcio Medeiros Meira, OSE (28/03)
ordinations:
- order: diaconate
  date: '2000-10-28'
  place: Paróquia da Ressurreição, João Pessoa-PB
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-ord-marcio-claudio-lilian
    quote: (Márcio, Cláudio e Lílian)
  - source: rcor-drv-ord-marcio-claudio-lilian
    quote: Paróquia da Ressurreição – João Pessoa, PB 29 de Outubro de 2000.
  - source: rcor-drv-ord-marcio-claudio-lilian
    quote: >-
      Pela primeira vez estamos ordenando um grupo de diáconos em que todos são integrantes de Ordens Religiosas.
      Filhos espirituais anglicanos de Santo Estevão e de Francisco de Assis.
  - source: rcor-drv-ord-marcio-claudio-lilian
    quote: Recebereis esta noite a ordem de diáconos para sempre
  - source: testemunho-mantenedor-2026-10-09-sermoes
    quote: Márcio é o Meira sim
  - source: testemunho-mantenedor-2026-10-09-sermoes
    quote: Pode passar os dois pra 28/10 também
  discrepancies:
  - field: date
    value: '2000-10-29'
    sources:
    - source: rcor-drv-ord-marcio-claudio-lilian
      quote: Paróquia da Ressurreição – João Pessoa, PB 29 de Outubro de 2000.
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti) na ordenação diaconal de Márcio, Cláudio e Lílian, todos membros
    de ordens religiosas (OSE ou franciscana). O sermão diz só 'Márcio'; a identificação com Márcio Medeiros Meira,
    OSE (depois bispo de João Pessoa), foi confirmada pelo mantenedor. A data do cabeçalho do sermão é 29/10/2000,
    mas o texto cita a festa de São Simão e São Judas (28/10), a data que Lílian Linhares, ordenada na mesma cerimônia,
    dá para o seu diaconato; o mantenedor adotou 28/10/2000.
- order: episcopate
  date: '2017-06-10'
  place: Catedral PAES, Recife
  jurisdiction: diocese-anglicana-recife
  office: missionary
  principal_consecrator: miguel-uchoa
  co_consecrators:
  - bill-atwood
  - evilasio-tenorio
  - flavio-soares
  - leonides-de-menezes-ferreira
  status: contested
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 10 de junho de 2017, o clérigo foi sagrado ao episcopado para liderar uma nova unidade diocesana da denominação:
      a Diocese de João Pessoa.
    page: '32'
  - source: iab-dois-novos-bispos
    quote: 'elegeu dois novos Bispos auxiliares: Rev. Márcio Simões e Rev. Márcio Meira.'
  - source: iab-dois-novos-bispos
    quote: Em Junho acontecerá a  Sagração Episcopal
  - source: gafcon-2017-two-bishops
    quote: >-
      The Anglican Church in Brazil and the Diocese of Recife have announced that Revd. Márcio Simões and Revd.
      Márcio Medeiros Meira are to be ordained and consecrated as missionary bishops.
  - source: gafcon-2017-two-bishops
    quote: >-
      The ceremony will be conducted by The Right Revd. Miguel Uchôa Cavalcanti, Bishop of Recife, with proceedings
      due to begin at 10am, Saturday June 10th 2017.
  - source: djp-meira
    quote: Foi consagrado bispo em 2021
  - source: iab-poster-linhagem-meira
    quote: >-
      Em 11 de junho de 2017, na Catedral PAES, em Recife, o arcebispo Miguel Uchoa, juntamente com os bispos Bill
      Atwood, Flávio Soares, Evilásio Tenório e Leônides Menezes, sagraram: Márcio Medeiros Meira como o primeiro
      bispo da Diocese de João Pessoa, da Igreja Anglicana no Brasil.
  - source: costa2021
    quote: >-
      Em 2017, foram sagrados dois bispos para liderar novas dioceses: Márcio Simões, para a Diocese de Vitória
      de Santo Antão e Márcio Meira, para a Diocese de João Pessoa.
    page: '253'
  - source: costa2021
    quote: liderada pelo bispo Márcio Meira, eleito em maio de 2017.
    page: '255'
  discrepancies:
  - field: date
    value: '2021'
    sources:
    - source: djp-meira
      quote: Foi consagrado bispo em 2021
  - field: date
    value: '2017-06-11'
    sources:
    - source: iab-poster-linhagem-meira
      quote: >-
        Em 11 de junho de 2017, na Catedral PAES, em Recife, o arcebispo Miguel Uchoa, juntamente com os bispos
        Bill Atwood, Flávio Soares, Evilásio Tenório e Leônides Menezes, sagraram: Márcio Medeiros Meira como o
        primeiro bispo da Diocese de João Pessoa, da Igreja Anglicana no Brasil.
  notes: >-
    Sagrantes não nomeados. Eleito bispo auxiliar em 06/05/2017. O anúncio do GAFCON marca a sagração conjunta com
    Márcio Simões para 10/06/2017, conduzida por Miguel Uchoa (anúncio prévio; nenhum relato posterior encontrado).
    O pôster da IAB dá 11/06/2017 e co-sagrantes Bill Atwood, Flávio Adair, Evilásio Tenório e Leônides Menezes
    (não confirmados). O site da Diocese de João Pessoa diz 'consagrado bispo em 2021' (ver afirmação contestada).
    Diverge de todas as demais fontes (eleição em 2017, presença como bispo na GAFCON 2018, ordenação em Guiné-Bissau
    em set/2021 já como bispo diocesano). Provável erro do site ou confusão com outra data; mantido como contestado.
    O pôster chama Uchoa de 'arcebispo' em 2017; a IAB como província é de 2018 — verificar a jurisdição exata na
    data (Diocese do Recife / Cone Sul?). Fonte é anúncio PRÉVIO do GAFCON (cerimônia conjunta com Márcio Simões,
    sábado 10/06/2017); o site da Diocese de Vitória confirma que a de Simões ocorreu em 10/06/2017. O pôster da
    IAB dá 11/06/2017 (domingo) na PAES, sagrante Uchoa com Atwood, Soares, Tenório e Leônides Menezes — data e
    co-sagrantes do pôster não confirmados; 10/06/2017 é mais provável. Diocese de João Pessoa (catedral 'Anglicana
    Comunhão'); eleito em maio de 2017. Data exata, local e sagrantes não informados.
