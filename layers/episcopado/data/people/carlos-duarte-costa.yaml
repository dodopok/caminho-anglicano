biography: >-
  Bispo católico romano de Botucatu (1924-1937), excomungado em 1945; fundador da Igreja Católica Apostólica Brasileira.
  Nasceu em 21/07/1888 e morreu em 26/03/1961 (Rio de Janeiro).
