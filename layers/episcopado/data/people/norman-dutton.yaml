# yaml-language-server: $schema=../../schemas/person.json
id: norman-dutton
name: Norman Dutton
biography: >-
  Bispo independente, um dos bispos pelos quais Ricardo Lorite e Rui Barbosa receberam a ordenação episcopal em
  15/01/2006.
sources:
- source: cant-novas-igrejas-2024
  quote: através dos bispos Norman Dutton, Frank Peachey e Lucas Macieira da Silva
  page: '118'
ordinations:
- order: episcopate
  date: c.1999
  jurisdiction: null
  principal_consecrator: peter-a-compton-caputo
  status: probable
  sources:
  - source: cont-aeci-news
    quote: >-
      Archbishop Victor Manuel Cruz-Blanco was one of the consecrators of Bishop Peter Compton Caputo who in turn
      was Consecrator of Norman S Dutton. This maintains an historic link in our Apostolic Succession.
  - source: cont-aeci-succession
    quote: >-
      Peter A. Compton-Caputo c1993 Presiding Bishop of The Anglican Independent Communion Norman Sydney Dutton
      c1999
  notes: >-
    Linhagem declarada pela AECI: Compton-Caputo (c.1993) -> Dutton (c.1999) -> Rui Costa Barbosa e Ricardo Lorite
    (15/01/2006, com Peachey e Macieira). A AECI afirma que Cruz-Blanco foi co-sagrante de Compton-Caputo, o que
    liga, segundo a própria AECI, a linhagem de Barbosa/IATB à de Cruz-Blanco (e, portanto, à de Roque). Fonte única/autodeclarada;
    a página de sucessão lista a linha anglicana independente por Luther-Ingram-St. Peters-Wharton-Compton-Caputo-Dutton,
    sem citar Cruz-Blanco.
events:
- type: other
  date: '2013-01-12'
  description: >-
    Linhagem declarada pela IAOB para Adolfo Batista Teodoro Júnior: Pedro A. Compton-Caputo (1993) -> Norman Sydney
    Dutton (1999) -> Barry Frank Peachey (2005) -> Josué Souza Torres (15/01/2006) -> Adolfo Batista Teodoro Junior
    (12/01/2013); linha 'Old Catholic' paralela: Cícero Cruz de Souza (2001) -> Iranildo Macieira da Silva (2004)
    -> Josué Souza Torres (2006) -> Adolfo (2013). Mesma cadeia Compton-Caputo/Dutton que a AECI publica para Rui
    Costa Barbosa.
  status: probable
  sources:
  - source: cont-iaob-sucessao
    quote: >-
      Pedro A. Compton-Caputo (1993) – Arcebispo Primaz da Comunhão Anglicana Independente nas Américas. Norman
      Sydney Dutton (1999)
  - source: cont-iaob-sucessao
    quote: Barry Frank Peachey (2005)
  - source: cont-iaob-sucessao
    quote: >-
      JOSUÉ SOUZA TORRES (15/01/2006) – ARCEBISPO PRIMAZ DA IGREJA EPISCOPAL DO EVANGELHO PLENO, BRASIL. ADOLFO
      BATISTA TEODORO JUNIOR (12/01/2013) BISPO PRIMAZ DA IGREJA ANGLICANA ORTODOXA NO BRASIL.
  - source: cont-iaob-sucessao
    quote: >-
      (146) Tau Iranildo Macieira da Silva, 2004. (147) Dom Josué Douza Torres (148) 2006. (148) Dom Adolfo Batista
      Teodoro Junior 2013.
