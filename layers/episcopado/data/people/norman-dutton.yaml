biography: >-
  Norman Sydney Dutton foi sagrado bispo por volta de 1999, em St. Paul's, Crownsville, por Peter A. Compton-Caputo,
  e foi arcebispo metropolita da Anglican Independent Communion Worldwide, tendo formado a primeira diocese dessa
  comunhão nas Ilhas Britânicas. Foi o fundador da Anglican Episcopal Church International (AECI), formada em maio
  de 2008, e a liderou até se aposentar, em 08/04/2012, como metropolita emérito. Segundo a AECI, faleceu em março
  de 2022. Participou de quatro sagrações episcopais, entre elas as de Barry Frank Peachey (2005) e Marcos de Santa
  Helena (2006).
