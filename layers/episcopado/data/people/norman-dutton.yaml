  discrepancies:
  - field: date
    value: '1999'
    sources:
    - source: meel-elcemir-blog-2026
      quote: >-
        Norman Sydney Dutton – Em 1999 foi sagrado ao Bispado pelo Bispo Peter A. Compton-Caputo em Crownsville,
        Maryland (MD), EUA.
  notes: >-
    A AECI e a IATB dão 1999 e Peter A. Compton-Caputo como sagrante (a AECI afirma ainda que Victor Manuel Cruz-Blanco
    foi um dos co-sagrantes de Compton-Caputo, que sagrou Dutton). Linhagem declarada: Compton-Caputo (1993) ->
    Dutton (1999) -> Peachey (2005) -> Rui Costa Barbosa (2006). Linhagem declarada pela AECI: Compton-Caputo (c.1993)
    -> Dutton (c.1999) -> Rui Costa Barbosa e Ricardo Lorite (15/01/2006, com Peachey e Macieira). A AECI afirma
    que Cruz-Blanco foi co-sagrante de Compton-Caputo, o que liga, segundo a própria AECI, a linhagem de Barbosa/IATB
    à de Cruz-Blanco (e, portanto, à de Roque). Fonte única/autodeclarada; a página de sucessão lista a linha anglicana
    independente por Luther-Ingram-St. Peters-Wharton-Compton-Caputo-Dutton, sem citar Cruz-Blanco. Linha de sucessão
    publicada pelo próprio Elcemir Durans em seu blog (2026) e, sem as notas históricas, na página de sucessão do
    CNBP (2016).
