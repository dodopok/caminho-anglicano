# yaml-language-server: $schema=../../schemas/person.json
id: vicente-brande
name: Vicente Brande
death:
  date: '1940'
  sources:
  - source: drv-efemerides-reb
    quote: Fundador do Anglicanismo Brasileiro (IEAB), Sacerdote e Missionário, 1940
biography: >-
  Segundo uma fonte, acompanhou os missionários Kinsolving e Morris a Porto Alegre, onde chegaram em 21/04/1890;
  outra o descreve como diretor de um colégio misto e membro da Igreja Presbiteriana, procurado pelos missionários
  na chegada. Em 1892 participou, como catequista, da primeira convocação da missão, em Porto Alegre. Em 28/08/1893
  foi ordenado diácono por George William Peterkin, bispo de Virgínia Ocidental em visita à missão, o primeiro ministro
  nativo da igreja. Em 13/05/1897 foi ordenado presbítero por Waite Hockin Stirling, entre os três primeiros presbíteros
  brasileiros, com Américo Vespúcio Cabral e Antônio Machado Fraga. Consta como falecido em 1940.
sources:
- source: wp-en-kinsolving
  quote: >-
    accompanied by four Brazilians, of whom Vicente Brande, Antonio M. de Fraga and Americo V. Cabral would all
    serve the church for many years
- source: wp-en-kinsolving
  quote: The young Americans arrived at Porto Alegre on April 21, 1890, accompanied by four Brazilians
- source: liv-implantacao-ieab
  quote: >-
    Chegaram e foram a procura do Sr Vicente Brande, diretor de un colégio misto, e também membro da Igreja presbiteriana.
  page: '15'
- source: kickhofel
  quote: >-
    Presentes: reverendos Morris, Brown, Meem e Kinsolving, e catequistas Boaventura, Brande e Cabral. Presidida
    por Kinsolving e secretariada por Cabral.
- source: drv-kinsolving-ivo
  quote: >-
    Em 28 de Agosto de 1893, no mesmo local, o Revmo. Peterkin ordenou diácono o Sr. Vicente Brande, o primeiro
    ministro nativo da Igreja que desabrochava.
- source: kickhofel
  quote: >-
    Ordenação de quatro diáconos: Vicente Brande, Américo Vespúcio Cabral, Antônio Machado Fraga e Boaventura de
    Souza Oliveira.
- source: kickhofel
  quote: 'Ordenação dos três primeiros presbíteros: Cabral, Brande e Fraga.'
- source: wp-en-kinsolving
  quote: >-
    Bishop Stirling ordained three of the Brazilian deacons to the priesthood (Peterkin having deposed the fourth).
- source: drv-kinsolving-ivo
  quote: >-
    Esse prelado impôs as mãos sôbre 159 convertidos, elevando para 301 o número de eclesianos; e ordenou em presbíteros
    os diáconos Vicente Brande, Américo Vespúcio Cabral e Antônio Machado de Fraga.
- source: drv-efemerides-reb
  quote: Fundador do Anglicanismo Brasileiro (IEAB), Sacerdote e Missionário, 1940
ordinations:
- order: diaconate
  date: '1893-08-28'
  place: Capela do Salvador, Rio Grande (RS)
  jurisdiction: dmsb
  ordained_by: george-william-peterkin
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Ordenação de quatro diáconos: Vicente Brande, Américo Vespúcio Cabral, Antônio Machado Fraga e Boaventura
      de Souza Oliveira.
  - source: wit-1952-03-20
    quote: >-
      the visit of Bishop Peterkin in 1893 when almost one hun- dred and fifty persons were confirmed and four Brazilians
      were ordained to the diaconate.
  - source: wp-en-kinsolving
    quote: >-
      West Virginia's bishop George Peterkin made an episcopal visit in 1893, during which he ordained four Brazilians
      as deacons
  - source: drv-kinsolving-ivo
    quote: >-
      Em 28 de Agosto de 1893, no mesmo local, o Revmo. Peterkin ordenou diácono o Sr. Vicente Brande, o primeiro
      ministro nativo da Igreja que desabrochava.
  - source: liv-implantacao-ieab
    quote: Esse Vicente Brande se tornaria no ano de 1893 o primeiro Reverendo bra sileiro da Igreja Episcopal.
    page: '15'
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1893 - … Vicente Brande
    page: '369'
  - source: costa2021
    quote: >-
      O primeiro brasileiro a ser ordenado pelo bispo George Peterkin foi Vicente Brande, na Capela do Salvador,
      em Rio Grande, no dia 28 de agosto de 1893.
    page: '53'
  - source: d2s27-sinopse
    quote: >-
      dos primeiros diáconos brasileiros: Vicente Brande, Antônio Machado Fraga, Américo Vespúcio Cabral e Boaventura
      de Souza Oliveira.
  notes: >-
    Fato (4 diáconos por Peterkin em 1893) confirmado por várias fontes; o nome deste ordenando consta só em Kickhofel.
    Visita episcopal de Peterkin; biografia de Kinsolving (1961) dá a data completa. O 'mesmo local' é a cidade
    do Rio Grande (Capela do Salvador, citada no parágrafo anterior). A monografia diz que Brande se tornou em 1893
    o primeiro 'Reverendo' brasileiro da Igreja Episcopal; interpretado aqui como a ordenação diaconal de 1893 (a
    fonte não detalha a ordem). Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel,
    1995); ordenante não informado. Citado entre os primeiros diáconos brasileiros da missão episcopal no Rio Grande
    do Sul, em 1893; a cronologia não dá dia, local nem ordenante.
- order: presbyterate
  date: '1897-05-13'
  jurisdiction: dmsb
  ordained_by: waite-hockin-stirling
  status: probable
  sources:
  - source: kickhofel
    quote: 'Ordenação dos três primeiros presbíteros: Cabral, Brande e Fraga.'
  - source: wp-en-kinsolving
    quote: >-
      Bishop Stirling ordained three of the Brazilian deacons to the priesthood (Peterkin having deposed the fourth).
  - source: drv-kinsolving-ivo
    quote: >-
      Esse prelado impôs as mãos sôbre 159 convertidos, elevando para 301 o número de eclesianos; e ordenou em presbíteros
      os diáconos Vicente Brande, Américo Vespúcio Cabral e Antônio Machado de Fraga.
  - source: costa2021
    quote: >-
      de maio de 1987, o bispo Stirling ordenou três dos diáconos brasileiros – Brande, Fraga e Cabral – para a
      ordem do presbiterato
    page: '54'
  notes: >-
    Stirling, bispo das Falkland (Igreja da Inglaterra), agiu a pedido de Peterkin. Nomes só em Kickhofel. O bispo
    é chamado 'Isterling', bispo das ilhas Falkland residente em Buenos Aires (Waite Hockin Stirling); a biografia
    não dá a data (outras fontes: 1897). A tese escreve '13 de maio de 1987', erro evidente por 1897 (a visita de
    Stirling começou em 6/5/1897).
