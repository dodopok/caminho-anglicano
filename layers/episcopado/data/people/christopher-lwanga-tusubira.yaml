# yaml-language-server: $schema=../../schemas/person.json
id: christopher-lwanga-tusubira
name: Christopher Lwanga Tusubira
aliases:
- C. Lwanga Tusubira
- Lwanga Tusubira
- Lwangu Tusubira
biography: >-
  Arcebispo primaz e patriarca da Worldwide Anglican Church (WAC), cuja sede patriarcal fica em Uganda. O site da
  WAC o apresenta como patriarca desde 2019 e, noutro texto, como instalado quando a Igreja adotou o nome atual,
  em julho de 2017. No Sínodo Provincial da WAC no Brasil, em Imbituba (SC), em julho de 2024, foi representado
  pelo arcebispo Felix Nzeyimana.
sources:
- source: lwac-wac-hob
  quote: The Most Rev Dr C Lwanga Tusubira – Patriarch since 2019.
- source: lwac-wac-about
  quote: >-
    the ACW renounced its name and became the Worldwide Anglican Church (WAC) in July 2017, and Installed its new
    Patriarch, His Grace the Most Rev ++ Christopher Lwanga Tusubira
- source: cant-novas-igrejas-2024
  quote: >-
    A sede patriarcal da WAC está localizada em Uganda e o atual Patriarca e Arcebispo Primaz é Christopher Lwanga
    Tusubira
  page: '128'
- source: cant-novas-igrejas-2024
  quote: >-
    Nos dias 11 a 14 de julho de 2024, a cidade de Imbituba, Santa Catarina, sediou o Sínodo Provincial da Igreja
    Anglicana Mundial no Brasil.
  page: '128'
- source: cant-novas-igrejas-2024
  quote: >-
    O evento contou com a presença arcebispo Felix Nzeyimana, residente no Canadá, que representou o Patriarca da
    Comunhão, o Arcebispo Lwanga Tusubira.
  page: '128'
