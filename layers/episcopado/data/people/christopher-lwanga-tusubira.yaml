events:
- type: other
  date: '2024-07-14'
  description: >-
    Sínodo Provincial da WAC no Brasil em Imbituba (SC), 11 a 14/07/2024: reescrita dos cânones provinciais; em
    13/07 três diaconatos (Frei Mauro Ossoski, Rubens Cirilo da Silva, Deives Aparecido de Godoi); em 14/07 um presbiterato
    (Samuel F. de Santana, Recife) e a sagração episcopal de Antônio Carlos Silva Santos e Wilson Limeira Dias;
    incardinação do bispo Claudinei Rodrigo Ferreira. Presente o arcebispo e núncio Felix Nzeyimana, representando
    o patriarca Lwanga Tusubira.
  status: confirmed
  sources:
  - source: lwac-wacbr-sinodo
    quote: Na cidade de Ibituba - SC, nos dias 11, 12, 13 e 14 de julho, tivemos o nosso Sínodo Provincial
  - source: lwac-wacbr-sinodo
    quote: >-
      tivemos a presença do nosso Núncio Apostólico, Arcebispo Felix Nzeyimana, que reside no Canadá e que veio
      representando nosso Patriarca, o Arcebispo Dr. C Lwanga Tusubira.
  - source: lwac-wacbr-sinodo
    quote: sendo recebido no grau de presbítero o Pastor, SAMUEL F. DE SANTANA
- type: other
  date: 2019-08
  description: >-
    Conferência da WAC em agosto de 2019 resolveu expandir a Igreja nomeando novos bispos nos EUA, Europa, Índia,
    China, Sul da Ásia, América Latina e demais regiões, "regulando a expansão da Igreja e a herança de ordens do
    Oriente e do Ocidente"; esta resolução antecede a constituição da província brasileira (2020).
  status: confirmed
  sources:
  - source: lwac-wac-about
    quote: >-
      In August 2019, a conference was held to expand ongoing theological traditions within the church. As a result
      of the deliberations, the conference resolved to expand the church by appointing new Bishops in The United
      States, Europe,  India, China, South Asia, Latin America and the rest of the world.
- type: other
