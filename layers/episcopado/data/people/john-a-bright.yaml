id: john-a-bright
name: John A. Bright
full_name: John A. Bright
birth:
  date: '1927-09-01'
  sources:
  - source: rta-ecd1962
    quote: b Portland Ore 1 Sep 27
biography: >-
  John A. Bright nasceu em Portland (Oregon) em 1/9/1927. Foi ordenado diácono em junho de 1956 e presbítero em
  janeiro de 1957 na Igreja Episcopal dos EUA, por Benjamin Dunlap Dagwell. Atuou como missionário no Distrito Missionário
  do Sul do Brasil de 1960 a 1962, em Pelotas, como capelão do Colégio Santa Margarida e auxiliar de Cristo Redentor,
  e a partir de 1962 foi reitor da Igreja da Trindade, em Bend (Oregon).
