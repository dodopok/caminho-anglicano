events:
- type: other
  date: '2011'
  description: >-
    Em 2011 (viagem relatada em 05/07/2011), o bispo Robinson Cavalcanti participou em Abuja, Nigéria, de uma conferência/consulta
    sobre direitos humanos reunindo bispos e outros participantes, onde foi recebido pelo novo Arcebispo Primaz
    da Igreja Anglicana da Nigéria, Nicholas Okoh, seu colega no Grupo de Recursos Teológicos do GAFCON.
  status: confirmed
  sources:
  - source: darb1-nigeria
    quote: >-
      Fui muito bem recebido pelo novo Arcebispo Primaz, Revmo. Nicholas Okoh , que havia sido meu colega no Grupo
      de Recursos Teológicos que elaborou o material preparatório para o GAFCON.
  - source: darb1-nigeria
    quote: Umas 40 pessoas, entre Bispos, Presbíteros, Professores Universitários, Juízes e Advogados.
  - source: darb1-abuja-ad
    quote: como conferencista em nossa Consulta sobre Direitos Humanos, em Abuja, Nigéria
