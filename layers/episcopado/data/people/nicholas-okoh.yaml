biography: >-
  Nicholas Okoh nasceu em 10 de novembro de 1952, em Owa-Alero, no estado do Delta (Nigéria), e foi ordenado diácono
  em julho de 1979 e presbítero em julho de 1980 na Igreja da Nigéria. Foi sagrado em maio de 2001 como segundo
  bispo da Diocese de Asaba, tendo Peter Akinola como sagrante segundo uma fonte. Eleito arcebispo da Província
  Eclesiástica de Bendel em 22 de julho de 2005, foi instalado primaz da Igreja Anglicana da Nigéria em 25 de março
  de 2010, sucedendo Akinola, e se aposentou em 25 de março de 2020. Em 2014, era vice-presidente da Fraternidade
  Global dos Anglicanos Confessantes. Sagrou um bispo, Julian Dobbs, em 25 de setembro de 2011, em Lagos.
