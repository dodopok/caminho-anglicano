# yaml-language-server: $schema=../../schemas/person.json
id: leonardo-marin-saavedra
name: Leonardo Marin-Saavedra
biography: >-
  Primaz e arcebispo da Latin American Anglican Church (IAL / Old Anglo-Catholic Movement). A lista da própria IAL
  o registra como nº 026, consagrado em 15/06/2003 em Huntington Beach, Califórnia, na linha Chambers - Seeland
  - Marin-Saavedra.
sources:
- source: lac-ial-sucessao
  quote: >-
    026. MARIN-Saavedra Leonardo, Huntington Beach, California, United States. 15 June 2003. - (Still living)
ordinations:
- order: episcopate
  date: '2003-06-15'
  place: Huntington Beach, Califórnia (EUA) (o site da IAL também diz "Los Angeles")
  jurisdiction: iala
  principal_consecrator: arthur-david-seeland
  co_consecrators:
  - jorge-enrique-rodriguez-villa
  - juan-de-dios-correa-salazar
  status: probable
  sources:
  - source: lac-ial-sucessao
    quote: 026. MARIN-Saavedra Leonardo, Huntington Beach, California, United States. 15 June 2003.
  - source: lac-ial-sucessao
    quote: (Pope Leo X - Arthur Albert Chambers - Arthur David Seeland - Leonardo Marin-Saavedra)
  - source: lac-ial-sucessao
    quote: >-
      Archbishop Arthur David Seeland (The Holy Catholic Church Anglican Rite), Bishop Juan de Dios Correa-Salazar
      (The Holy Hispanic Church Byzantine Rite), and Archbishop Jorge Enrique Rodriguez-Villa (The Old Catholic
      Church Orthodox Rite).
  - source: lac-ial-site
    quote: >-
      This succession was renewed on June 15, 2003 (in the city of Los Angeles, California, United States), under
      the leadership of three ancient Anglo-Catholic Christian organizations
  notes: >-
    Fonte única e autodeclarada (o próprio site da IAL). A lista não diz quem foi o sagrante principal; Seeland
    aparece como o elo da sucessão (Chambers - Seeland - Marin-Saavedra) e Correa-Salazar e Rodriguez-Villa como
    os outros dois bispos das "três organizações". A atribuição de Seeland como principal é inferência da cadeia
    indicada pela própria IAL. O local diverge dentro do mesmo site (lista: Huntington Beach; página inicial: Los
    Angeles).
affiliations:
- jurisdiction: icala
  role: archbishop
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Leonardo Marin-Saavedra, que foi o Arcebispo da Província da América Latina da Comunhão Anglicana Independente
      (Worldwide Anglican Independent Communion) – também conhecida como Igreja Anglicana Latina –
    page: '117'
- jurisdiction: iala
  role: archbishop
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2019, o arcebispo Leonardo Marin-Saavedra da Igreja Anglicana Latino-Americana realizou algumas visitas
      ao Brasil, consagrando novos bispos para o continente, ratificando as Ordens de clérigos com sucessão apostólica
      considerada duvidosa, e ordenando novos diáconos e presbíteros para diferentes Igrejas. Uma dessas sagrações
      episcopais realizadas foi a de Antônio Bessa, na cidade de Fortaleza.
    page: '161'
events:
