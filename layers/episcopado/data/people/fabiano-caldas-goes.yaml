biography: >-
  Presbítero em processo de reconhecimento de ordem na Diocese Anglicana do Recife, foi instalado em 11/4/2010 como
  ministro local encarregado do Ponto Missionário Anglicano São Mateus, em São Luís (MA), recebido na diocese por
  Robinson Cavalcanti.
