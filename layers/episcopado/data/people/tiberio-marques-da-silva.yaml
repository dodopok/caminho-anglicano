    quote: >-
      Hoje, seis anos depois da nossa instituição como Diocesano, estamos completando a ordenação de 53 Diáconos.
  - source: drp2-ord-diac-2003-12-27
    quote: >-
      Ordenação Diaconal de: Décio da Silva Elias Leôncio de Brito Filho, ose Raniere Almeida de Oliveira Solange
      Cristina Pereira Tibério Marques da Silva, ose Paróquia Anglicana Emanuel Olinda/PE — 27/12/2003
