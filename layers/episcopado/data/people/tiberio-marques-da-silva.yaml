events:
- type: other
  date: '1997-11-17'
  description: >-
    A Paróquia Anglicana da Redenção (bairro de Rio Doce) foi fundada em 17/11/1997, quando o bispo Robinson Cavalcanti
    passou o bastão à Revda. Gorete Marques, após confirmar a primeira remessa de membros; em dezembro de 2008 Gorete
    era pároca e arcediaga da região Norte e o Rev. Tibério Marques, secretário diocesano de Homens e contador diocesano.
  status: confirmed
  sources:
  - source: darl3-n4616
    quote: Fundada em 17 de novembro de 1997
  - source: darl3-n4616
    quote: >-
      quando passava o bastão para a Revda. Gorete Marques, ose, após ter Confirmado a primeira remessa de membros
  - source: darl3-n4616
    quote: >-
      Revda. Gorete é Pároca e Arcediaga na região Norte da Diocese; Rev. Tibério Marques é Secretário Diocesano
      de Homens e Contador Diocesano
