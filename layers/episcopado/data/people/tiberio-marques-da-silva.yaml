id: tiberio-marques-da-silva
name: Tibério Marques da Silva
aliases:
- Rev. Tibério Marques, OSE
biography: >-
  Ordenado diácono em 27/12/2003, na Paróquia Anglicana Emanuel (Olinda), por Robinson Cavalcanti, é diácono permanente
  da Diocese Anglicana do Recife e membro da Ordem de Santo Estevão Mártir, da qual foi ecônomo. Atuou como auxiliar
  na Paróquia Anglicana da Redenção e como coadjutor na Paróquia Jesus de Nazaré, e foi secretário diocesano de
  Homens e contador diocesano. Em 23/08/2005 foi excluído da comunhão da IEAB, com outros clérigos que declararam
  manter plena comunhão com Robinson Cavalcanti, e permaneceu na Diocese Anglicana do Recife.
