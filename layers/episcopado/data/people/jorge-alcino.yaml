# yaml-language-server: $schema=../../schemas/person.json
id: jorge-alcino
name: Jorge Alcino
aliases:
- Jorge Alcino (Pastor anglicano • Jorge Alcino)
- Pastor Jorge Alcino
- Pr. Jorge Alcino
biography: >-
  Pastor e plantador da Igreja Anglicana Rio (Irajá, Rio de Janeiro), com mais de dez anos de atuação em plantação
  de igrejas. Em 5/04/2026 (domingo de Páscoa), em Vitória (ES), foi confirmado anglicano e teve o ministério pastoral
  reconhecido pelo bispo Eric Rodrigues e pela Rede Episcopal Brasileira, voltando ao Rio de Janeiro para plantar
  a igreja. A denominação e as igrejas anteriores não constam nas fontes consultadas.
sources:
- source: arj-ig-jorge
  quote: Pastor anglicano • Jorge Alcino
- source: arj-ig-jorge-5abr
  quote: >-
    Tivemos o privilégio de sermos confirmados anglicanos e a honra de ter nosso ministério pastoral reconhecido
    pelo @bispoericrodrigues , pelos clérigos e por todos os irmãos da igreja e da @redeepiscopalbrasileira .
- source: arj-site
  quote: Já moraram no Sul do Brasil, mas é o calor do Rio de Janeiro que chamam de lar.
affiliations:
- jurisdiction: iar
  role: other
  role_description: ministro_local
  start: '2026-04-05'
  status: confirmed
  sources:
  - source: arj-site
    quote: Pastor Jorge Alcino e Pastora Raquel Fernandes com os elementos da Eucaristia
  - source: arj-ig-bio-igreja
    quote: Prs. @ofantasticomundodejorge & @raquel.fernandessss
  - source: arj-ig-igreja-tbt
    quote: >-
      enviados como ministros locais para uma missão que ainda estava começando: plantar a Igreja Anglicana Rio
  notes: >-
    Local: REB. Pastor da Igreja Anglicana Rio; enviado como ministro local da REB após a confirmação de 05/04/2026.
    Ainda sem ordem sacra na REB segundo as fontes.
events:
- type: other
  date: '2026-04-05'
  description: >-
    Em 5 de abril de 2026 (domingo de Páscoa), em Vitória (ES), Jorge Alcino e Raquel Fernandes foram confirmados
    anglicanos na Igreja (Catedral) Âncora e tiveram o ministério pastoral reconhecido pelo bispo Eric Rodrigues,
    pelos clérigos e pela Rede Episcopal Brasileira, sendo autorizados a plantar a Igreja Anglicana Rio, primeira
    igreja da REB no Rio de Janeiro. Equivale à recepção do casal e da igreja na REB.
  status: confirmed
  sources:
  - source: arj-ig-jorge-5abr
    quote: 5 de abril de 2026 — uma data que ficará em nossas memórias para sempre.
  - source: arj-ig-jorge-5abr
    quote: >-
      Eu e Raquel desembarcamos cedinho em Vitória - ES e fomos acolhidos pela nossa nova família de fé, a @igrejaancora
  - source: arj-ig-jorge-5abr
    quote: >-
      Voltamos ao RJ com os corações radiando fé, alegria e esperança — oficialmente legitimados a plantar a @igrejaanglicanario
      - a primeira igreja da @redeepiscopalbrasileira no Rio de Janeiro!
  - source: arj-ig-igreja-tbt
    quote: >-
      Em pleno domingo da ressurreição, fomos confirmados como anglicanos, tivemos nosso ministério pastoral reconhecido
      diante da nossa amada diocese @igrejaancora e em seguida, enviados como ministros locais para uma missão que
      ainda estava começando: plantar a Igreja Anglicana Rio.
