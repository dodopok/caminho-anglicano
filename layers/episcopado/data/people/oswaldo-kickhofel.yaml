    início e fim não constam dos trechos.
events:
- type: death
  date: '2017'
  description: >-
    Falecimento do Rev. Oswaldo Kickhofel, comunicado pelo Primaz da IEAB em nota de 6 de julho de 2017 (a nota
    usa 'Páscoa' no sentido de falecimento); a data exata do óbito não consta da nota.
  status: probable
  sources:
  - source: f8kic-psj-necrologio
    quote: >-
      A IEAB está profundamente e respeitosamente silenciosa diante da noticia da Páscoa de nosso irmão Reverendo
      Oswaldo Kickhofel.
  - source: f8kic-psj-necrologio
    quote: Francisco de Assis da Silva Primaz da Igreja Episcopal Anglicana do Brasil Diocesano em Santa Maria
