biography: >-
  Nascido em Pelotas (RS) em 1934, foi ordenado diácono em dezembro de 1964 e presbítero em julho de 1965, ambos
  pelo bispo Egmont Krischke, no Distrito Missionário do Sul do Brasil, e foi transferido para a Igreja Episcopal
  do Brasil em 25 de abril de 1965.
