    quote: 'Sua grande vocação foi dedicar-se a duas áreas essenciais da vida da Igreja: comunicação e memória.'
  - source: f8kic-psj-necrologio
    quote: >-
      Foi um grande servidor a Igreja Provincial, por 19 anos foi editor do Estandarte Cristão, e de 1990 a 2003
      serviu e desenvolveu o Projeto Memória, recuperando o Arquivo Nacional e produzindo vários livros
  - source: f8kic-psj-necrologio
    quote: >-
      Também foi Diretor do Departamento de Comunicação da Província, Presidente do Conselho Diretor do FAPIEB,
      Estatístico e Arquivista provincial e Diretor do Estandarte Cristão por 18 anos
  - source: f8kic-psj-necrologio
    quote: Foi pároco de diversas comunidades, além de ocupar diversas funções dentro da Diocese Meridional.
  - source: f8kic-psj-necrologio
    quote: >-
      Sua última contribuição à Província, já como aposentado, foi ajudar o Projeto de memória Digital do Estandarte
      Cristão, levado a efeito em 2008-2009
  - source: f8kic-psj-necrologio
    quote: >-
      A IEAB está profundamente e respeitosamente silenciosa diante da noticia da Páscoa de nosso irmão Reverendo
      Oswaldo Kickhofel.
  - source: f8kic-psj-necrologio
    quote: tendo sido a sua principal obra ” Notas da História da IEAB, publicada em 1996.
  - source: f8kic-psj-necrologio
    quote: >-
      além de autor de diversos livros que contam a história da IEAB, inclusive de algumas Paróquias centenárias.
