- source: f8kic-psj-necrologio
  quote: >-
    Reverendo Oswaldo Kickchofel, nascido em 7 de julho de 1934 no interior do município de Pelotas/RS, frequentou
    a escola primária e a escola dominical da Paróquia do Amor Divino.
- source: f8kic-psj-necrologio
  quote: >-
