    quote: >-
      A IEAB está profundamente e respeitosamente silenciosa diante da noticia da Páscoa de nosso irmão Reverendo
      Oswaldo Kickhofel.
  notes: >-
    Transferência do distrito missionário (SBra) para a Igreja Episcopal do Brasil autônoma, conforme o Clerical
    Directory 1968. Transferido para a Igreja Episcopal do Brasil autônoma em 25/04/1965. Consta da lista do clero
    nacional da IEAB (Kickhöfel, 1995); início = ano do diaconato. Presbítero da IEAB até o falecimento; aposentado
    (emérito) em 2016.
