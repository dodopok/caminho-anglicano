biography: >-
  Reverendo; seminarista da IEAB (2012), fundador da Igreja Anglicana Episcopal de São Jorge (Rio Claro, SP); ordenado
  sacerdote em 2014 na Catedral Anglicana de São Paulo; incardinado na Diocese Anglicana de Votorantim (2016–2017);
  desde agosto de 2017 no clero da Igreja Episcopal Anglicana do Chile.
