# yaml-language-server: $schema=../../schemas/person.json
id: andre-luiz-de-souza
name: André Luiz de Souza
biography: >-
  André Luiz de Souza, ministro leigo da Missão Anglicana Filadélfia em 2004, foi ordenado presbítero em 30/09/2006
  por Robinson Cavalcanti, na Diocese Anglicana do Recife. Liderou a equipe pastoral a partir de 2006, foi coadjutor
  até 15/06/2008 e depois ministro encarregado, além de integrar a Comissão de Novas Paróquias e Missões.
sources:
- source: dard1-carta-bispos-2004
  quote: André Luiz de Souza Missão Anglicana Filadélfia
- source: drv-sermao-9-anos-sagracao
  quote: 'Ordenação Presbiteral dos Reverendos: André Luiz de Souza e Stephen Dass'
- source: drp2-breves-02-2006
  quote: quando será substituído por uma Equipe Pastoral liderada pelo Rev. André Luiz de Souza
- source: drp2-posse-deao-2008
  quote: >-
    agradecer ao Rev. André Luiz de Souza, meu Coadjutor por esse período, mas de fato o pastor de todos os dias
- source: dard1-comissoes-2009a
  quote: Comissão de Novas Paróquias e Missões Rev. André Luiz de Souza
- source: dard1-com-sul-2009a
  quote: 'Encarregado: Rev. André Luiz de Souza'
