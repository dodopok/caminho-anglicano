events:
- type: other
  date: 2006-10
  description: >-
    Congregações norte-americanas ligadas à Diocese Anglicana do Recife (Arcediagado Especial da América do Norte)
    citadas no boletim de oração de out/nov de 2006: Anglican Fellowship (High Springs, Flórida; Revda. Cláudia
    Kalis), Paróquia St. Charles (Poulsbo, WA), Paróquia St. Stephen (Oak Harbor, WA), Christ the King (Spokane,
    WA), Fellowship of the Living Word (Eugene, OR) e Light of Christ (South Milwaukee, WI).
  status: probable
