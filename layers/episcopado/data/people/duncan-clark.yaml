- type: other
  date: '2005'
  description: >-
    A partir do congresso 'Esperança e Fé no Futuro do Anglicanismo na América' (Pittsburgh, 2005), clérigos norte-americanos
    transferiram sua residência canônica para a Diocese do Recife, formando o Arcediagado Norte-Americano (20 clérigos
    e 7 paróquias e missões em 2007).
  status: confirmed
  sources:
  - source: drp2-memorias-decada-ix
    quote: >-
      Naquele Congresso se dá a primeira reunião dos clérigos norte-americanos que transferem a sua residência canônica
      para a Diocese do Recife, com suas Paróquias e Missões se colocando, em caráter especial, sob a sua Autoridade
      Episcopal.
- type: other
  date: '2007-01-14'
  description: >-
    Em janeiro de 2007 Dom Robinson Cavalcanti fez uma visitação de cerca de 18 dias ao Arcediagado Norte-Americano
    da Diocese do Recife (arcediago: Rev. Duncan Clark), passando por St. Stephens (Oak Harbor, Washington), Christ
    the King (Spokane), Walla Walla, St. Charles (Poulsbo), a missão de Eugene (Oregon), o Seminário Trinity (Ambridge,
    Pensilvânia) e as missões da Flórida; em Poulsbo houve confirmações e uma ordenação diaconal, apresentada como
    a primeira em território norte-americano da diocese (o Rev. Michael La Cagnina fora ordenado no Brasil), e o
    bispo entrevistou nove aspirantes às ordens sagradas.
  status: confirmed
  sources:
  - source: darb2-breves-06
    quote: >-
      A primeira Confirmação desde o episódio dos 11, de Ohio, em 2004, e a primeira Ordenação em território norte-americano
      (o Michael La Cagnina foi Ordenado no Brasil)
  - source: darb2-breves-06
    quote: Dezoito dias de abençoado trabalho
  - source: darb2-breves-06
    quote: entrevistar mais um (o nono) Aspirante às Sagradas Ordens
  - source: darb2-breves-05
    quote: A noite foi o ensaio para as Confirmações e Ordenação Diaconal do próximo domingo
  - source: darb2-breves-08
    quote: Missão Anglicana da Santíssima Trindade
- type: other
  date: 2004-10
  description: >-
    Em outubro de 2004 Robinson Cavalcanti acolheu, por determinação da Rede da Comunhão Anglicana, as paróquias
    anglicanas de St. Charles (Poulsbo, WA) e St. Stephen (Oak Harbor, WA), que haviam deixado a Diocese de Olympia
    da Igreja Episcopal (EUA); o acordo de 2006 com a diocese de Olympia reconheceu o bispo do Recife como autoridade
    espiritual das duas paróquias, cujo reitor, Rev. Duncan Clark, tornou-se arcediago das paróquias norte-americanas
    do Recife.
  status: confirmed
  sources:
  - source: darl3-n4177
    quote: >-
      A Rede (ACN) determinou que ambas as paróquias se colocassem sob a supervisão do Bispo Robinson Cavalcanti,
      do Recife, e ele, generosamente, lhes deu as boas-vindas em outubro de 2004
  - source: darl3-n4177
    quote: >-
      Conquanto o Bispo Cavalcanti foi reconhecido pelo bispo Warner como a autoridade espiritual de ambas as paróquias
