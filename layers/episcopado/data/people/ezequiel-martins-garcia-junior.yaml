biography: >-
  Ezequiel Martins Garcia Júnior criou, em 2016, a Igreja Anglicana de Comunhão Livre (Joinville, SC), a partir
  da Missão Santa Mãe de Deus, e é seu primaz. Anunciou ordenação a diácono e presbítero em 20 e 21 de agosto de
  2016, e foi sagrado bispo em 2017; as fontes divergem quanto ao sagrante, citando Wellington Pedroso Rodrigues
  ou uma sucessão recebida de Elias Batista Nogueira. Preside o CEATEO e a CONIE e, em 2018, candidatou-se a deputado
  estadual em Santa Catarina como Dom Ezequiel.
sources:
- source: lpq-iacl-wb-ordenacao
  quote: >-
    em breve estarei sendo Ordenado Diácono e Presbítero, para a Igreja Anglicana de Joinville, nas respectivas
    datas dos dias 20 e 21 de Agosto de 2016
- source: lpq-iacl-wb-ordenacao
  quote: >-
    em breve estarei sendo Ordenado Diácono e Presbítero, para a Igreja Anglicana de Joinville, nas respectivas
    datas dos dias 20 e 21 de Agosto de 2016, em minha "CAPELA PESSOAL" da SANTA MÃE DE DEUS
- source: lpq-iacl-wb-sucessao
  quote: o mesmo foi Sagrado Bispo por Dom Wellington Pedroso Rodrigues).
- source: lpq-iacl-wb-sucessao
  quote: >-
    Sucessão Apostólica de Dom Ezequiel Martins Garcia Júnior, recebida da Comunhão Episcopal Protestante, através
    do Bispo Dom Elias Batista Nogueira.
- source: cant-novas-igrejas-2024
  quote: >-
    Ele foi o responsável por criar a Igreja a partir da Missão Santa Mãe de Deus (Anglo Católica), quando presbítero.
