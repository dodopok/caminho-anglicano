  notes: >-
    Versão A do site da IACL: Ezequiel teria sido sagrado por Wellington Pedroso Rodrigues, no contexto de "Estado
    de Necessidade" e dos "8 Decretos do CONIE" do Sínodo Episcopal Conciliar. Ver a versão B (sagrante Elias Batista
    Nogueira) e as dúvidas. Local e dia não informados; "Joinville" é inferência pela sede da igreja. Versão B,
    da mesma página: a linha numerada de sucessão (261 Elias, 262 Ezequiel, 263 Wellington) e o título "recebida
    ... através do Bispo Dom Elias Batista Nogueira" indicam Elias como fonte da sucessão de Ezequiel, e Ezequiel
    como sagrante de Wellington. O texto não diz literalmente que Elias foi o sagrante em cerimônia.
