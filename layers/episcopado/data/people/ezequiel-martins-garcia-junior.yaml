- source: lpq-yt-chancelaria
  quote: >-
    Olá Catarinenses sou Dom Ezequiel, Bispo Anglicano, e peço o seu voto, contra a corrupção uma nova opção. Sou
    padre casado, tenho um filho de 7 meses de idade, e trabalho como Vigilante Patrimonial.
