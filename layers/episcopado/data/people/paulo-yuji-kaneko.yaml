biography: >-
  Nascido em Nagaoka (Japão) em 1907, foi ordenado diácono em dezembro de 1941 e presbítero em junho de 1946, ambos
  pelo bispo William Matthews Merrick Thomas. Clérigo do Distrito Missionário do Brasil Central, foi transferido
  para a Igreja Episcopal do Brasil em 25 de abril de 1965.
