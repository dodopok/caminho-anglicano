biography: >-
  Antônio José da Costa Raposo nasceu em Santa Clara, Ponta Delgada (Açores), em 08/02/1948, e morreu em 03/03/2024.
  Foi sagrado bispo em 28/11/1982, em Brasília, por Luiz Fernando Castillo Mendez, com Bartolomeu Sebastião Vilela
  e Josivaldo Pereira de Oliveira como co-sagrantes (outra fonte dá 22/11/1982), e foi nomeado bispo diocesano de
  Portugal em 08/02/1988, com posse em 25/02/1988, como arcebispo primaz da IAEP. Participou de quatro sagrações
  episcopais, entre elas as de Antonin Jelinek (2001) e Lucas Macieira da Silva (2004).
