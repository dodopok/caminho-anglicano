  notes: >-
    Wikipédia polonesa acrescenta Rainer Laufers entre os co-sagrantes; blogs da IELB (e da DAE) dão 22/11/1982
    e listam Castillo Mendez, Josivaldo Pereira de Oliveira, Bartolomeu Sebastião Vilela e Rainer Laufers (este
    "sagrado por bispos da Igreja Vétero Católica"). Nomeado bispo diocesano de Portugal em 08/02/1988. O site da
    própria igreja de Raposo dá 22/11/1982 e quatro sagrantes sem distinguir o principal; outras fontes dão 28/11/1982
    em Brasília, com Castillo Mendez como principal sagrante. Na lista de sucessão publicada pela diocese em 20/11/2025,
    o item de Raposo traz como co-sagrantes Josivaldo Pereira de Oliveira, Bartolomeu Sebastião Vilela e Rainer
    Laufers e a data 22/11/1982. O post está truncado no texto exibido e a disposição das datas na lista é ambígua;
    outras fontes dão 28/11/1982 para a sagração de Raposo. A numeração do blog indica a linhagem: os bispos com
    código 4.x descendem do bispo nº 4 da lista, Luís Fernando Castillo Méndez; a fonte não diz com todas as letras
    'sagrado por'.
