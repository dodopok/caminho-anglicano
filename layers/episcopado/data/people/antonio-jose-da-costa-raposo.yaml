wikidata: Q9158189
biography: >-
  Nascido em Santa Clara, Ponta Delgada (Açores). Clérigo da ICAB em Brasília, sagrado bispo em 1982 por Luiz Fernando
  Castillo Mendez, bispo diocesano de Portugal desde 1988 (Igreja Apostólica Episcopal Portuguesa / Igreja Vétero-Católica
  em Portugal) e arcebispo primaz. Principal sagrante de Lucas Macieira em 2004.
