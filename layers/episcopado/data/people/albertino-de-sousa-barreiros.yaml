birth:
  date: '1966-05-03'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Albertino de Sousa Barreiros nasceu em 03 de maio de 1966, na cidade de Nova Olinda, no sertão paraibano.
    page: '80'
biography: >-
  Bispo ordinário da Diocese Anglicana do Natal (TAC no Brasil), fundada em 2019; antes padre (segundo blog local,
  ordenado presbítero católico romano em 1994 — não verificado). Em 2025 enfrentava tratamento de câncer.
sources:
- source: tac-natal-5anos
  quote: >-
    The Right Reverend Albertino Barreiros Bishop Ordinary of the Diocese of Natal Traditional Anglican Church in
    Brazil
- source: tac-natal-noticias
  quote: uma oração e uma bênção do nosso bispo diocesano, Dom Albertino De Sousa Barreiros.
ordinations:
- order: presbyterate
  date: '1994-05-28'
  place: Nova Olinda (PB)
  jurisdiction: null
  ordained_by: gerardo-andrade-ponte
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Foi ordenado presbítero em 28 de maio de 1994, em sua terra natal, pelas mãos de Dom Gerardo Andrade Ponte,
      então bispo da Diocese de Patos (PB).
    page: '80'
  notes: Ordenação na Igreja Católica Romana (Diocese de Patos).
- order: episcopate
  date: '2019-07-15'
  place: Capela do Campus da Universidade Federal do Rio Grande do Norte, Natal (RN)
  jurisdiction: iacc
  office: diocesan
  principal_consecrator: james-antonio-roque
  status: probable
  sources:
  - source: cant-anglo-catolicismo-2026
    quote: >-
      sendo sagrado em 15 de julho de 2019 na capela da Universidade Federal do Rio Grande do Norte. A cerimônia
      foi presidida por Dom James Antônio Roque, que também coordenou a instalação oficial da Diocese.
  - source: cant-novas-igrejas-2024
    quote: >-
      O bispo ordinante principal e bispo responsável pela coordenação dos trabalhos de criação e instalação da
      Diocese foi dom James Roque.
  - source: costa2021
    quote: >-
      em seguida, ordenou muitas pessoas ao episcopado, a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino
      de Sousa Barreiros, Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa
      da Silva.
  - source: cant-novas-igrejas-2024
    quote: A cerimônia de sagração de dom
    page: '80'
  - source: cant-novas-igrejas-2024
    quote: >-
      Albertino aconteceu em 15 de julho de 2019, na Capela do Campus da Universidade Federal do Rio Grande do Norte,
      quando também ocorreu a instalação oficial da recém-criada Diocese. O bispo ordinante principal e bispo responsável
      pela coordenação dos trabalhos de criação e instalação da Diocese foi dom James Roque.
    page: '81'
  - source: cant-novas-igrejas-2024
    quote: >-
      Entre os bispos ordenados por James estavam: Dom José Kennedy de Freitas, organizador da Igreja Anglicana
      de Confissão Continuante; Dom Marcos Mattos, nomeado bispo da Diocese Anglicana Continuante do Rio de Janeiro
      (falecido prematuramente, antes da consolidação da diocese); Dom Albertino de Sousa Barreiros, da Diocese
      Anglicana do Natal; Dom Claudinei Rodrigo Ferreira, da Diocese Anglicana de Santa Catarina; Dom Itabira Jonas,
      da Diocese Anglicana de São Paulo e Paraná; Dom Francisco de Assis Coelho e Pinho, bispo eleito e delegado
      episcopal da Pró-Diocese Anglicana do Amazonas; e dom José Barbosa da Silva, da Diocese Anglicana de Portugal,
      na União Europeia.
    page: '157'
  - source: costa2021
    quote: >-
      ordenou muitas pessoas ao episcopado, a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de Sousa
      Barreiros, Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da
      Silva.
    page: '138'
  notes: >-
    Fecha a data (jurisdicoes-menores.json tinha data nula). Diocese Anglicana do Natal (hoje ligada à TAC). Costa
    (2021) e o site da IACC dizem que James Roque 'ordenou' estes bispos. Para Itabira Jonas, a data de 11/1/2018
    vem do site da diocese (registro separado); para Barreiros, c. 2019. Pode tratar-se do mesmo evento já registrado.
    Co-sagrantes não nomeados. A p. 76 inclui Albertino na lista de bispos ordenados por James Roque entre seus
    'primeiros atos' episcopais (contexto do Japi, extinto em 2016) — ver dúvidas. 'da Diocese Anglicana do Natal'.
    Data não informada. Datas não informadas; a Diocese do Japí foi depois extinta e esses bispos fundaram igrejas
    anglicanas independentes.
