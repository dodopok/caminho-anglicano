biography: >-
  John Robert Day nasceu em Hoquiam (Washington) em 28/10/1931. Foi ordenado diácono em junho de 1959 e presbítero
  em dezembro de 1959, na Igreja Episcopal dos EUA, atuou no Distrito Missionário do Brasil Central e foi transferido
  para a Igreja Episcopal do Brasil em 25/4/1965.
