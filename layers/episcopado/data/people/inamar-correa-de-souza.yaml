# yaml-language-server: $schema=../../schemas/person.json
id: inamar-correa-de-souza
name: Inamar Corrêa de Souza
biography: >-
  Inamar Corrêa de Souza foi ordenada diácona em 20 de junho de 1999 e presbítera em 26 de novembro de 2000, na
  IEAB. Integrou o Comitê Permanente do Conselho Consultivo Anglicano (ACC), representando a IEAB, inclusive na
  reunião de Amã, na Jordânia, em outubro de 2025.
sources:
- source: rta-livro35
  quote: 'Diaconato: 20 de junho de 1999.'
- source: rta-livro35
  quote: 'Presbiterado: 26 de novembro de 2000.'
- source: f8mar-ieab-acc-comite-2025
  quote: >-
    O Comitê Permanente do Conselho Consultivo Anglicano (ACC) esteve reunido, entre os dias 13 e 15 de outubro,
    em Amã, na Jordânia, para seu encontro presencial anual. Nossa IEAB esteve representada pela reverenda Inamar
    Corrêa de Souza e pela bispa primaz, Marinez Bassotto.
- source: cabs-ieab-acc19-encerramento
  quote: >-
    A eleição marca também o encerramento do mandato da reverenda Inamar Correa de Souza, da IEAB, que integrou
    o Comitê Permanente nos últimos anos, representando a Igreja brasileira nesse importante organismo da Comunhão
    Anglicana.
ordinations:
- order: diaconate
  date: '1999-06-20'
  jurisdiction: ieab
  status: confirmed
  sources:
  - source: rta-livro35
    quote: 'Diaconato: 20 de junho de 1999.'
  notes: >-
    Datas informadas pela própria clériga no livro comemorativo '35 anos de Ordenação de Mulheres na IEAB' (2021).
- order: presbyterate
  date: '2000-11-26'
  jurisdiction: ieab
  status: confirmed
  sources:
  - source: rta-livro35
    quote: 'Presbiterado: 26 de novembro de 2000.'
  notes: >-
    Datas informadas pela própria clériga no livro comemorativo '35 anos de Ordenação de Mulheres na IEAB' (2021).
events:
- type: other
  date: '2025-10-13'
  description: >-
    Reunião anual do Comitê Permanente do Conselho Consultivo Anglicano (ACC), em Amã (Jordânia), de 13 a 15 de
    outubro de 2025. A IEAB foi representada pela reverenda Inamar Corrêa de Souza (integrante do Comitê) e pela
    bispa primaz Marinez Bassotto.
  status: confirmed
  sources:
  - source: f8mar-ieab-acc-comite-2025
    quote: >-
      O Comitê Permanente do Conselho Consultivo Anglicano (ACC) esteve reunido, entre os dias 13 e 15 de outubro,
      em Amã, na Jordânia, para seu encontro presencial anual. Nossa IEAB esteve representada pela reverenda Inamar
      Corrêa de Souza e pela bispa primaz, Marinez Bassotto.
  - source: cabs-ieab-acc19-encerramento
    quote: >-
      A eleição marca também o encerramento do mandato da reverenda Inamar Correa de Souza, da IEAB, que integrou
      o Comitê Permanente nos últimos anos, representando a Igreja brasileira nesse importante organismo da Comunhão
      Anglicana.
