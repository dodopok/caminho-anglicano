biography: >-
  André Pinheiro Vargas, nascido no 3º Distrito de Triunfo (RS) em 03/05/1913, foi ordenado diácono em dezembro
  de 1952 por Athalício Pithan e presbítero em julho de 1962 por Egmont Krischke, no Distrito Missionário do Sul
  do Brasil. Foi transferido para a Igreja Episcopal do Brasil em 25/04/1965.
