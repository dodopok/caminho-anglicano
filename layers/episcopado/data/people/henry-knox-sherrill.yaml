events:
- type: other
  date: '1955'
  description: >-
    Acordo de 1955 entre a Igreja da Inglaterra e a Igreja Episcopal dos EUA sobre as capelanias inglesas no Brasil:
    toda a Comunhão Anglicana no Brasil fica nas dioceses da Igreja Episcopal dos EUA, salvo as capelanias inglesas,
    sob jurisdição exclusiva de um bispo da Igreja da Inglaterra nomeado pelo Arcebispo de Cantuária (por ora, o
    bispo da Argentina, América do Sul e Ilhas Falklands).
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Acordo assinado em 1955 entre a Igreja da Inglaterra e a Igreja Episcopal dos Estados Unidos sobre as capelanias
      inglesas no Brasil.
    page: '525'
  - source: costa2021
    quote: >-
      O bispo credenciado, por ora, continuará exercendo jurisdição independente como bispo da Argentina, América
      do Sul e Ilhas Falklands
    page: '526'
  - source: costa2021
    quote: + Geoffrey Cantuar + Henry Knox Sherrill
    page: '527'
