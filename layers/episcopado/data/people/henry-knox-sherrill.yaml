      quote: >-
        158c. Henry St. George Tucker (1912-1958) que, em 1930, sagrou Henry Knox Sherrill como bispo de Massachusetts.
  notes: >-
    CORRIGE pontes-estrangeiras.json, que marcava o sagrante como 'provavel'. A fonte primária (The Living Church,
    25/10/1930) dá Perry como 'consecrator' e Lawrence e Alexander Mann como co-sagrantes. A Wikipédia põe Logan
    H. Roots no lugar de Mann; Roots só impôs as mãos. CORRIGIDO: o pôster diz que Henry St. George Tucker sagrou
    Sherrill em 1930; a Wikipédia (artigo e lista de sucessão) dá James De Wolf Perry (então Presiding Bishop) como
    sagrante principal, com William Lawrence e Logan H. Roots. Data e local confirmados por fonte primária (The
    Witness, 16/10/1930), que não nomeia o sagrante; por isso o sagrante fica "provavel". Tucker não aparece em
    nenhuma fonte desta sagração.
