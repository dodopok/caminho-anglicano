biography: >-
  Sagrado bispo de Massachusetts em 14/10/1930, por James De Wolf Perry. Bispo Presidente da Igreja Episcopal (1947-1958),
  foi sagrante principal de Melcher (1948) e de Edmund K. Sherrill (1959) e assinou em 1955, com Geoffrey Fisher,
  o acordo sobre as capelanias inglesas no Brasil.
