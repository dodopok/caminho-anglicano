    anglicana, reformada, evangélica e protestante' que 'Não está ligada a nenhuma igreja fora do Brasil', e a considera
    'até certo ponto, como fruto do trabalho da Igreja Episcopal Reformada brasileira'; ou seja, em 2012 a IARB
    ainda era independente (a recepção pela FCE ocorreu em 2014).
