      page: '152'
  notes: >-
    Sagrado "for Brazil"; a lista oficial da FCE o dá como renunciado em 2021 e traz a lista dos três sagrantes
    (Fenwick, Hunt e Gerhard Meyer da Reformierte Episkopalkirche na Alemanha). Data não informada; o site da CICEB
    já o chama 'Bispo Joseph Rosselo' em jan/2004, o que sugere sagração até 2004. 'Igreja Evangélica Episcopal'
    é o nome que Costa e Cavalcanti também usam para a comunhão à qual Leonides se filiou (CEEC), mas a identidade
    exata não está estabelecida. Na lista, nº 68 = John R. K. Fenwick (Bishop Primus da FCE), 67 = Paul Nigel Hunt
    (FCE), 69 = Gerhard Meyer (REC, Alemanha). A ordem dos números sugere Fenwick como principal, sem confirmação.
    A fonte citada pela Wikipédia é o Journal do 55º Conselho Geral da REC (2017), não consultado. Há sagração anterior
    na 'Igreja Evangélica Episcopal' (Costa 2021); a de 2014 seria ressagração ou sagração sub conditione, mas nenhuma
    fonte usa esse termo. Biografia no site da IARB (autodescrição); não informa data exata, local nem sagrantes.
    Fonte primária (REC Journal 2017, p. 210 do apêndice 'Consecrations of Bishops') — é a fonte que a Wikipédia
    cita. Resolve local (Bentley, West Midlands), data e os três sagrantes; a ordem de citação (Fenwick, Hunt, Meyer)
    não declara quem é o principal; Fenwick era Bishop Primus da FCE. 'for Brazil' = sagração para a Diocese da
    América do Sul/IARB. Gerhard Meyer é bispo REC (Alemanha, sagrado 22/10/2006). A jurisdição é a FCE (Free Church
    of England) em sucessão REC, e não a 'Igreja Evangélica Episcopal': A PRIMEIRA sagração (antes da FCE) não tem
    fonte primária localizada — ver dúvidas. O livro não informa data nem sagrantes. A tese diz 'Igreja Evangélica
    Episcopal' — identificação com a EEC (Evangelical Episcopal Communion) da base é incerta. Data e sagrantes não
    informados.
