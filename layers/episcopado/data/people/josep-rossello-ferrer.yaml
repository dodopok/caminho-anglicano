  notes: >-
    O livro não informa data nem sagrantes. Data não informada; o site da CICEB já o chama 'Bispo Joseph Rosselo'
    em jan/2004, o que sugere sagração até 2004. 'Igreja Evangélica Episcopal' é o nome que Costa e Cavalcanti também
    usam para a comunhão à qual Leonides se filiou (CEEC), mas a identidade exata não está estabelecida. Na lista,
    nº 68 = John R. K. Fenwick (Bishop Primus da FCE), 67 = Paul Nigel Hunt (FCE), 69 = Gerhard Meyer (REC, Alemanha).
    A ordem dos números sugere Fenwick como principal, sem confirmação. A fonte citada pela Wikipédia é o Journal
    do 55º Conselho Geral da REC (2017), não consultado. Há sagração anterior na 'Igreja Evangélica Episcopal' (Costa
    2021); a de 2014 seria ressagração ou sagração sub conditione, mas nenhuma fonte usa esse termo.
