- bispo Josep Rosselo
biography: >-
  Bispo espanhol (natural de Benissa) que serviu 12 anos no Brasil, supervisionando a IARB e depois a Diocese da
  América do Sul da FCE; primaz eleito da IARB em 2012; depois Servant General da NAMS (2023) e ligado à Anglican
  Convocation in Europe (2025). Segundo Costa (2021), começou na IERE (Igreja Espanhola Reformada Episcopal, Comunhão
  Anglicana) e foi sagrado bispo missionário na 'Igreja Evangélica Episcopal' (aparentemente o ambiente CEEC/EEC);
  a FCE o sagrou (de novo) em 28/9/2014.
sources:
- source: ai-2021-fce-withdraw
  quote: >-
    the Rt Rev Josep M Rossello-Ferrer, that has served the diocese faithfully and sacrificially for twelve years.
- source: ai-2025-rossello-ace
  quote: >-
    having served for 12 years in Brazil where they planted a diocese that began with 2 couples and grew to include
    28 churches and missions in Brazil and Venezuela
- source: costa2021
  quote: >-
    Posteriormente saiu da IERE, filiandose à Igreja Evangélica Episcopal, na qual foi sagrado como bispo missionário.
