# yaml-language-server: $schema=../../schemas/person.json
id: luciano-alves-campelo
name: Luciano Alves Campelo
aliases:
- Luciano Campelo
biography: >-
  Foi membro e postulante da IEAB na Diocese Anglicana do Recife e, em 10/12/2023, ordenado diácono por Eduardo
  Faria, da Igreja Anglicana do Brasil, da qual depois se desligou. Ordenado presbítero em 23/04/2025 por Nildemar
  Andrade Santos, é cofundador da Igreja Católica Apostólica Anglicana (Ilhéus, BA).
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    reverendo Luciano Campelo, que foi membro e postulante da Igreja Episcopal Anglicana do Brasil, na Diocese Anglicana
    do Recife.
  page: '140'
- source: cant-novas-igrejas-2024
  quote: >-
    foi ordenado ao diaconato no dia 10 de dezembro de 2023, pelo bispo dom Eduardo Faria, da Igreja Anglicana do
    Brasil
  page: '140'
- source: cant-novas-igrejas-2024
  quote: porém, também se desligou da denominação, passando a caminhar junto ao bispo Agostinho de Jesus.
  page: '140'
- source: cant-novas-igrejas-2024
  quote: >-
    No dia 23 de abril de 2025, o reverendo Luciano Alves Campelo foi ordenado ao presbiterato pelo Arcebispo Primaz
    da Igreja Vétero-Católica Independente do Brasil, dom Nildemar Andrade Santos
  page: '140'
- source: cant-novas-igrejas-2024
  quote: o reverendo Luciano Alves Campelo foi ordenado ao presbiterato
  page: '140'
- source: cant-novas-igrejas-2024
  quote: Ela tem origem a partir de duas lideranças religiosas.
  page: '140'
- source: cant-novas-igrejas-2024
  quote: A segunda, no reverendo Luciano Campelo
  page: '140'
