  - source: ies-dap-maiztegui
    quote: a cerimônia de sagração ao episcopado do Rev. Humberto Eugênio Maiztegui Gonçalves
  - source: ies-dap-maiztegui
    quote: >-
      Além do Primaz, Dom  Mauricio Andrade, que foi o bispo sagrante, vários outros bispos estavam também presentes,  inclusive
      Dom Miguel Tamayo e Dom Gilberto Porcal, da Diocese Anglicana do Uruguai
  notes: >-
    Eleito bispo coadjutor da Diocese Meridional em 20/10/2012 (120o Concilio); primeiro nativo do Uruguai bispo
    na IEAB. A fonte diocesana não nomeia o sagrante principal nem os co-sagrantes. Instituído bispo diocesano em
    5 de maio de 2013, no encerramento do 121º Concílio Diocesano. Notícia no site da Diocese Anglicana de Pelotas
    (12/12/2012). Diz que o primaz Maurício Andrade foi o 'bispo sagrante'; menciona outros bispos presentes, entre
    eles Miguel Tamayo e Gilberto Porcal (Diocese Anglicana do Uruguai), sem dizer que foram co-sagrantes. A pregadora
    foi a revda. Carmen Etel Alves Gomes. O então bispo da Diocese Meridional, Orlando Santos de Oliveira, continuaria
    à frente até o concílio de maio de 2013, quando Humberto seria instituído bispo diocesano. Coadjutor. A tese
    NÃO nomeia sagrante principal nem co-sagrantes ('inúmeros bispos nacionais e de outros países').
