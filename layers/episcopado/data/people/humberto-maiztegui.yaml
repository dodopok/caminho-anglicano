biography: >-
  Humberto Maiztegui Gonçalves foi ordenado diácono em 26 de maio de 1990, na Diocese Anglicana do Uruguai, por
  William Godfrey, e presbítero em 12 de abril de 1992, por Cláudio Vinícius de Senna Gastal, na Diocese Meridional
  da IEAB. Eleito bispo coadjutor dessa diocese em 20 de outubro de 2012, foi sagrado em 9 de dezembro de 2012,
  em Porto Alegre, por Maurício José Araújo de Andrade, e instituído bispo diocesano em 5 de maio de 2013. Preside
  a Comissão de Incidência Pública, Direitos Humanos e Combate ao Racismo da IEAB.
sources:
- source: lic-dm-bispo-maiztegui
  quote: >-
    em 26 de maio, dia de Santo Agostinho de Cantuária, e dia também da visita do Arcebispo de Cantuária Robert
    Runcie ao Uruguai, foi ordenado ao diaconato pelo Bispo William Godfrey, na Catedral da Santíssima Trinidad,
    da Diocese Anglicana do Uruguai
- source: lic-dm-bispo-maiztegui
  quote: >-
    Ao retornar à Diocese Meridional, assumiu a Paróquia da Bênção Divina, em São Francisco de Paula, RS, cidade
    em que, no dia 12 de Abril de 1992, foi ordenado ao presbiterado por Dom Cláudio Vinícius de Senna Gastal.
- source: lic-dm-bispo-maiztegui
  quote: >-
    foi eleito Bispo Coadjutor da Diocese Meridional em segunda sessão do 120º Concílio Extraordinário, ocorrida
    no dia 20 de outubro de 2012, na Paróquia da Ascensão, em Porto Alegre.
- source: costa2021
  quote: >-
    Sua sagração ocorreu no dia 09 de dezembro de 2012, na Catedral Nacional da Santíssima Trindade de Porto Alegre,
    que contou com a participação de inúmeros bispos nacionais e de outros países.
- source: costa2021
