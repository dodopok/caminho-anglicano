id: patricio-viveros-robles
name: Patricio Viveros Robles
aliases:
- Patricio Robles
biography: >-
  Eleito bispo da IEACH em 2003, foi consagrado em novembro de 2004, em Talcahuano, com a participação de Max Broussard,
  Casey Miner, Bruce Taylor, G. J. Hoyos e R. U. Higuita. Em 2006, com a autonomia da IEACH como Igreja Nacional,
  tornou-se seu primeiro arcebispo. Em julho de 2023 esteve na instituição de Fernando Nobile como bispo diocesano
  da Diocese Sul/Sudeste da IAEB.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Em 2003, dom Patricio Viveros Robles foi eleito bispo da IEACH, sendo consagrado solenemente em novembro de
    2004, na cidade de Talcahuano
  page: '123'
- source: cant-novas-igrejas-2024
  quote: >-
    sendo consagrado solenemente em novembro de 2004, na cidade de Talcahuano, durante o Sínodo Ordinário da Província
    de Cristo Bom Pastor. A consagração contou com a participação de vários bispos, incluindo Max Broussard, Casey
    Miner, Bruce Taylor, G.J. Hoyos e R.U. Higuita.
- source: cant-novas-igrejas-2024
  quote: >-
    Em 2006, a IEACH obteve sua autonomia como uma Igreja Nacional, elegendo como seu primeiro arcebispo, Patricio
    Viveros Robles.
  page: '123'
- source: cant-novas-igrejas-2024
  quote: >-
    Somente em julho de 2023, na Paróquia Anglicana de São Jorge, o bispo Patricio Robles e o bispo James Tavares
    estiveram na instituição de dom Fernando Nobile como diocesano da Diocese Sul/Sudeste, da IAEB.
  page: '125'
