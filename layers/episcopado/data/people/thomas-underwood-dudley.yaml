biography: >-
  Nascido em 1837 em Richmond (Virgínia), foi sagrado em 27/01/1875, em Baltimore, bispo coadjutor de Kentucky por
  Benjamin Bosworth Smith, com Johns, Stevens e Pinkney, e tornou-se bispo diocesano em 1884, com a morte de Smith.
  Presidiu a sagração de Kinsolving em 1899 e morreu em 22/01/1904.
