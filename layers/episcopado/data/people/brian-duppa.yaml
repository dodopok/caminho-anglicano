biography: >-
  Brian Duppa foi sagrado bispo em 17/06/1638, em Lambeth, pelo arcebispo William Laud, e foi bispo de Chichester
  (1638), de Salisbury (1641) e de Winchester (1660), até morrer, em 26/03/1662.
