biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Matsuyama,
  Ehime, Japão (1937-03-13). Ordenado diácono em nov/1960 e presbítero em jan/1964. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
sources:
