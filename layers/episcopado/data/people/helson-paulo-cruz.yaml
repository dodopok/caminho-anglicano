id: helson-paulo-cruz
name: Helson Paulo Cruz
full_name: Helson Paulo Cruz
aliases:
- Bispo Helson
- Dom Helson Cruz
- Pastor Helson
- Rev. Helson Cruz
biography: Bispo/clérigo ligado à jurisdição ICEB; ver afirmações.
sources:
- source: ciceb-quemsomos
  quote: O corpo atual de clérigos é formado por 1 bispo diocesano (Revmo Helson Paulo Cruz)
ordinations:
- order: episcopate
  date: null
  place: Catedral Betânia, Recife (PE) (canal que transmitiu)
  jurisdiction: iceb
  office: diocesan
  status: probable
  sources:
  - source: lie-yt-busca-helson
    quote: Sagração do Bispo Helson e  Instituição da Província da Igreja Cristã Episcopal do Brasil
  - source: lie-yt-busca-helson
    quote: Transmitido há 5 anos
  - source: lie-yt-busca-helson
    quote: Culto Eucarístico (tarde) - 29/08/2021
  - source: lie-yt-busca-helson
    quote: Culto de ações de graças 18 anos da Paróquia do Redentor - 13/02/2022
  - source: lie-fb-redentor-helson
    quote: Nosso domingo foi de alegria com a presença do do nosso querido Bispo Helson
  - source: ier-yt-iceb-helson-provincia
    quote: Sagração do Bispo Helson e  Instituição da Província da Igreja Cristã Episcopal do Brasil
  notes: >-
    Data não encontrada em texto. O YouTube (consulta de 8/10/2026) mostra a transmissão feita pelo canal da Catedral
    Betânia como "há 5 anos", enquanto a abertura do 1º Sínodo da Província aparece como "há 4 anos" e vídeos de
    29/08/2021 e 13/02/2022 aparecem como "há 5 anos" e "há 4 anos", respectivamente; isso sugere que a transmissão
    da sagração/instituição da Província é anterior a outubro de 2021, e não de dezembro de 2021, data que o site
    da CICEB dá para a constituição da Província. Indício indireto, a confirmar na página do vídeo. Sagrantes não
    informados. Título do vídeo liga a sagração à "Instituição da Província da Igreja Cristã Episcopal do Brasil";
    o site da CICEB (ciceb-quemsomos, já na base) data a constituição da Província em dezembro de 2021, o que sugere
    o mesmo mês/ano para a sagração, mas o vídeo não traz data nem sagrantes. Ver duvidas.
