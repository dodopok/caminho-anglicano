  Ex-cerimonialista na Abadia de Santa Maria (SP); seminarista na IEAB (época do bispo Glauco); diácono e presbítero
  por Josué Torres (IEEP); reordenado sob condição por James Roque (Diocese do Japi); sagrado bispo em 2011 por
  Josué Torres (Província Brasileira de Confissão Anglicana); primaz da Igreja Católica de Tradição Anglicana.
