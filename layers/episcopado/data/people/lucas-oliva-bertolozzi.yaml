# yaml-language-server: $schema=../../schemas/person.json
id: lucas-oliva-bertolozzi
name: Lucas Oliva Bertolozzi
aliases:
- Dom Lucas
- Reverendo Lucas
biography: >-
  Passou pela IEAB na época do bispo Glauco, como seminarista, e saiu; foi ordenado diácono e presbítero por Josué
  Torres (IEEP) e, na Diocese do Japi, ordenado sob condição por James Roque. Sagrado bispo em 2011 por Josué Torres,
  pela Província Brasileira de Confissão Anglicana, é primaz da Igreja Católica de Tradição Anglicana, que tem origem
  em sua pessoa.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Depois ele foi para a Igreja Episcopal Anglicana do Brasil, na época do bispo Glauco, sendo um dos presentes
    na organização da Ordem de São Bento da Igreja Anglicana no estado de São Paulo. Passou um tempo como seminarista.
    Depois saiu da Igreja
  page: '142'
