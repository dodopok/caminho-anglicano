id: lucas-oliva-bertolozzi
name: Lucas Oliva Bertolozzi
aliases:
- Dom Lucas
- Reverendo Lucas
biography: >-
  Lucas Oliva Bertolozzi teve formação espiritual na tradição beneditina e atuou como cerimonialista na Abadia de
  Santa Maria, em São Paulo. Passou pela Igreja Episcopal Anglicana do Brasil, na época do bispo Glauco, onde esteve
  presente na organização da Ordem de São Bento da Igreja Anglicana no estado de São Paulo e foi seminarista, e
  saiu. Foi ordenado diácono e presbítero por Josué Torres (IEEP) e, na Diocese do Japi, foi ordenado sob condição
  por James Roque. Foi sagrado bispo em 2011 por Josué Torres, pela Província Brasileira de Confissão Anglicana.
  É primaz da Igreja Católica de Tradição Anglicana, que tem origem em sua pessoa, e fundador do Oratório de Nossa
  Senhora das Almas, em São Paulo.
