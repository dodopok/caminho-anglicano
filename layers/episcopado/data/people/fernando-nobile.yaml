  role: clergy
  start: '2006'
  end: '2018'
  end_reason: left
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      o reverendo Fernando Nobile ingressou na Igreja Anglicana – Diocese do Recife – em 2006, a convite de dom
      Robinson
    page: '124'
  - source: cant-novas-igrejas-2024
    quote: >-
      Fernando Nobile permaneceu como clérigo nesta denominação até o ano de 2018, quando esta se tornou a Igreja
      Anglicana no Brasil (IAB), a Província da GAFCON.
    page: '124'
  notes: >-
    Ordens reconhecidas pela IA-DR (então sob supervisão de Gregory Venables, Cone Sul). Arcediagado do Sul/Sudeste
    dissolvido em 2018; a Igreja Anglicana Cristo Redentor (Ribeirão Preto) voltou a ser independente.
