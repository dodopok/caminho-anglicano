id: fernando-nobile
name: Fernando Nobile
full_name: Luiz Fernando Salgado
aliases:
- Luis Fernando Salgado
- Luiz Fernando Salgado
biography: >-
  Fernando Nobile, nome religioso de Luiz Fernando Salgado, iniciou o caminho no anglicanismo como membro da IEAB,
  com estudos no IAET de São Paulo, e saiu por volta de 2004, com um grupo da Diocese Anglicana de São Paulo. Foi
  ordenado diácono em 26/3/2005 e presbítero em 27/3/2005, em Ribeirão Preto (SP), pelo bispo vetero-católico Lucas
  Macieira da Silva. Em 2006 ingressou na Igreja Anglicana – Diocese do Recife, a convite de Robinson Cavalcanti,
  e foi ministro encarregado do Ponto Missionário Anglicano Cristo Redentor, em Ribeirão Preto. Em 19/12/2010 foi
  inaugurado o Ponto Missionário Anglicano Bom Pastor, em São Carlos (SP), vinculado a esse ponto, e em 2011 ele
  integrava a Comissão de Direito Canônico da diocese. Permaneceu como clérigo da diocese até 2018, quando ela se
  tornou a Igreja Anglicana no Brasil (IAB). Foi sagrado bispo em 20/11/2018 por Josué Sousa Torres, com Ricardo
  Lorite, Josué Augusto e Cassio Prado. Em julho de 2023 foi instituído bispo diocesano da Diocese Sul/Sudeste da
  IAEB, na Paróquia Anglicana de São Jorge, com catedral na Igreja Anglicana Cristo Redentor, em Ribeirão Preto.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Nobile iniciou a sua caminhada no Anglicanismo como membro da IEAB, realizando seus estudos seminarísticos no
    IAET de São Paulo, quando o bispo Hiroshi Ito era o diocesano.
