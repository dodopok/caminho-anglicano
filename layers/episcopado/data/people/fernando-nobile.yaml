id: fernando-nobile
name: Fernando Nobile
full_name: Luiz Fernando Salgado
aliases:
- Luis Fernando Salgado
- Luiz Fernando Salgado
biography: >-
  Nome religioso de Luiz Fernando Salgado. Iniciou os estudos no IAET (São Paulo) como membro da IEAB e saiu, por
  volta de 2004, com um grupo da Diocese Anglicana de São Paulo. Foi ordenado diácono em 26/03/2005 e presbítero
  em 27/03/2005, em Ribeirão Preto (SP), por Lucas Macieira da Silva. Ingressou em 2006 na Igreja Anglicana – Diocese
  do Recife, onde foi ministro encarregado do Ponto Missionário Anglicano Cristo Redentor (Ribeirão Preto), e permaneceu
  até 2018. Foi sagrado bispo em 20/11/2018 por Josué Sousa Torres, com participação de Ricardo Lorite, Josué Augusto
  e Cassio Prado. Em julho de 2023 foi instituído bispo diocesano da Diocese Sul/Sudeste da IAEB, na Paróquia Anglicana
  de São Jorge (Rio Claro, SP), com catedral na Igreja Anglicana Cristo Redentor, em Ribeirão Preto.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Nobile iniciou a sua caminhada no Anglicanismo como membro da IEAB, realizando seus estudos seminarísticos no
    IAET de São Paulo, quando o bispo Hiroshi Ito era o diocesano.
  page: '124'
- source: cant-novas-igrejas-2024
  quote: >-
    O atual quadro complexo tem origem a partir da saída de membros da Diocese Anglicana de São Paulo da Igreja
    Episcopal Anglicana do Brasil (IEAB). Dentre eles estavam Ricardo Lorite de Lima, Rui Costa Barbosa, Luis Fernando
    Salgado e Josué Sousa Torres.
  page: '117'
- source: lielb-iab-historia
  quote: >-
    No dia 26 de março de 2005, Sábado Santo, os ministros licenciados Ricardo Lorite de Lima, Rui Costa Barbosa,
