biography: >-
  George Abbot foi sagrado em 3 de dezembro de 1609, em Lambeth, pelo arcebispo Richard Bancroft, como bispo de
  Lichfield, e foi transferido para Londres em 1610. Em 1611 tornou-se arcebispo de Cantuária, cargo que ocupou
  até sua morte, em 4 de agosto de 1633.
