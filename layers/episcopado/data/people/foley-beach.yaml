biography: >-
  Foley Beach nasceu em Atlanta (Geórgia) em 31 de outubro de 1958 e foi ordenado diácono e presbítero na Diocese
  Episcopal da Geórgia (TEC) em 1992. Sagrado em 9 de outubro de 2010 por Robert Duncan, foi o primeiro bispo da
  Diocese do Sul da Igreja Anglicana na América do Norte (ACNA), da qual ainda era bispo em abril de 2023. Eleito
  em 21 de junho de 2014 segundo arcebispo e primaz da ACNA, foi empossado em 9 de outubro de 2014 e deixou o cargo
  em junho de 2024, quando Wood foi eleito para sucedê-lo. Presidiu o Conselho dos Primazes do GAFCON até abril
  de 2023, quando Mbanda foi eleito para sucedê-lo. Sagrou um bispo, Andy Lines, em 2017.
