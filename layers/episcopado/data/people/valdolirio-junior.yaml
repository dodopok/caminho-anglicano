id: valdolirio-junior
name: Valdolírio Junior
biography: >-
  Ordenado diácono em 01/05/2013, por Miguel Uchôa, na Diocese Anglicana do Recife; em 2025 consta ligado à Igreja
  Anglicana Videira (PB), na Diocese de João Pessoa (IAB).
sources:
- source: dar-2013-ordenacoes-1maio
  quote: >-
    deu-se inicio o Culto de ordenação dos novos 04 Diáconos de nossa Diocese, por ordem: Rev. Elton Roney, Revda.
    Lindiane Meira, Revda Rosemary Gomes e Rev. Valdolírio Junior.
- source: dar-2013-ordenacoes-1maio
  quote: o culto de ordenação Presidido pelo nosso Bispo Diocesano
- source: dar-2013-ordenacoes-1maio
  quote: sermão proferido pelo Nosso Bispo Diocesano, Revmo. Miguel Uchoa
- source: djp-igrejas-2025
  quote: Igreja Anglicana Videira – PB Rev. Valdolirio Junior
