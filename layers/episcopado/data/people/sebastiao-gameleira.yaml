biography: >-
  Nascido em São Miguel dos Campos (AL) em 1945, foi recebido na Igreja Episcopal Anglicana do Brasil em 1993, nomeado
  reitor do Seminário em 1995 e ordenado diácono em 05/01/1997 e presbítero seis meses depois, por Clóvis Erly Rodrigues,
  atuando inicialmente na Paróquia do Semeador, em Olinda. Eleito bispo da Diocese Anglicana de Pelotas, foi sagrado
  em 23/07/2000, embora uma fonte o dê como bispo de Pelotas desde fevereiro de 2000, e a dirigiu até 2006. Em 11/10/2006
  foi instalado, com a presença do primaz Maurício Andrade, como quarto bispo da Diocese Anglicana do Recife, que
  dirigiu após a ruptura de Robinson Cavalcanti com a IEAB, até 2013.
