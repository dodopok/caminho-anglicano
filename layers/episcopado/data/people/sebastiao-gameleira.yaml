events:
- type: other
  date: 1999/2000
  description: >-
    Depois de uma 'Confraternização de Natal' em 1999, Paulo Garcia e Sebastião Gameleira teriam instigado clérigos
    e ministros leigos contra o bispo diocesano; houve audiência presidida pelo bispo primaz, em que quase todo
    o clero declarou solidariedade ao bispo. Segundo a fonte, nesse período era criada a Igreja Episcopal Carismática
    do Brasil, para a qual saíram o Rev. Antônio Carlos (João Pessoa) e o ministro leigo Antônio Eça (Recife).
  status: probable
  sources:
  - source: drv-resgatando-iv
    quote: >-
      os reverendos: Paulo Garcia e Sebastião Gameleira instigaram clérigos e ministros leigos contra o Bispo Diocesano
  - source: drv-resgatando-iv
    quote: >-
      enquanto (na surdina) era criada a Igreja Episcopal Carismática do Brasil, saindo para ela – no primeiro episódio
      cismático – o Rev. Antônio Carlos, em João Pessoa-PB e o ML. Antônio Eça, no Recife-PE
- type: other
  date: '2006-10-11'
  description: >-
    Gameleira instalado em 11/10/2006 como bispo diocesano do Recife (IEAB), com o primaz Maurício Andrade e delegação
    da Igreja Episcopal (TEC) chefiada por Mark Sisk; segundo a Diocese Anglicana do Recife, a 'Diocese Missionária'
    fora criada pelo Sínodo Geral da IEAB em julho de 2006 e o novo bispo e a nova diocese não eram por ela reconhecidos.
  status: confirmed
  sources:
  - source: drv-nota-esclarecimento-2006
    quote: >-
      o ex-Bispo Diocesano de Pelotas-RS, Dom Sebastião Armando Gameleira Soares, estaria sendo instalado, no último
      dia 11 de Outubro, com a presença do Primaz da Igreja Episcopal Anglicana do Brasil, Dom Maurício Andrade
  - source: drv-nota-esclarecimento-2006
    quote: criação pelo último Sínodo Geral da IEAB, em julho passado de uma “Diocese Missionária”
- type: deposition
  date: '2006-10-11'
  description: >-
    Sebastião Armando Gameleira Soares, bispo de Pelotas desde fevereiro de 2000, é instalado em 11/10/2006 como
    quarto bispo da Diocese do Recife (IEAB), eleito no Sínodo Geral de julho de 2006 para suceder Robinson Cavalcanti,
    deposto em 10/06/2005; o primaz Maurício Andrade presidiu a investidura.
  status: probable
  sources:
  - source: ens-102306-1-a
    quote: >-
      celebrated the start of a new chapter in its complicated life with the installation on October 11 of its fourth
      bishop, the Rt. Rev. Sebastiao Armando Gameleira Soares. The newly elected primate of Brazil, the Most Rev.
      Mauricio Andrade, presided over the investiture
