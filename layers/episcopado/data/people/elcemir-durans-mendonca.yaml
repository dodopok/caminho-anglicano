biography: >-
  Elcemir Durans Mendonça nasceu em 1989 em Penalva (MA), é graduado em Teologia, licenciado em História e professor
  de ensino fundamental. Foi sagrado bispo em 10 de novembro de 2012, em Belford Roxo (RJ), por Elias Batista Nogueira,
  em sagração feita pela Ordem Anglicana Filhos da Promessa, com Josué Sousa Torres e José Demontier como
  co-sagrantes.
  É presidente da Igreja Última Aliança, ministério que fundou com a esposa, Vânia Durans. A página de sucessão
  apostólica do Conselho Nacional de Bispos Protestantes do Brasil o descreve como bispo, teólogo e historiador
  e lhe atribui a apuração da linha de sucessão ali publicada.
