id: thomas-church-brownell
name: Thomas Church Brownell
full_name: Thomas Church Brownell
aliases:
- Bp. Brownell
wikidata: Q7788419
biography: >-
  Sagrado em 27/10/1819, em New Haven, por William White, com Hobart e Griswold, sucedeu Seabury e Jarvis como bispo
  de Connecticut (TEC). Participou de cinco sagrações episcopais, entre elas as de William Meade e Alfred Lee, como
  co-sagrante.
sources:
