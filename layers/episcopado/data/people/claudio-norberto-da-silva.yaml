id: claudio-norberto-da-silva
name: Cláudio Norberto da Silva
full_name: Cláudio Norberto Melo da Silva
aliases:
- Cláudio Norberto Melo da Silva
biography: >-
  Cláudio Norberto da Silva nasceu em Bezerros (PE), é médico oftalmologista e diplomou-se em Teologia Ministerial
  pelo SAET. Iniciou sua caminhada anglicana na Paróquia da Trindade, hoje catedral da Diocese Anglicana do Recife.
  Foi ordenado diácono em 13/07/2002, na Missão Jardim das Oliveiras, e presbítero em 12/04/2003, em Caruaru (PE),
  ambos por Robinson Cavalcanti. Clérigo da diocese e membro da Ordem de São Francisco, esteve ligado à Paróquia
  da Reconciliação, como auxiliar, e foi capelão da Fraternidade Caruaru da ordem. Uma lista diocesana o inclui
  entre os clérigos aposentados.
