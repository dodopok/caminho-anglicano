  notes: >-
    Sermão de ordenação assinado por Dom Robinson Cavalcanti, bispo diocesano, que conta esta como parte das suas
    ordenações ('como bispo, estou completando a ordenação de 40 ministros').  Ordenação diaconal conjunta de Vera,
    Evilásio e Cláudio Norberto na Paróquia/Missão Jardim das Oliveiras; o bispo diz que completa a ordenação de
    40 ministros em menos de cinco anos. Vera e Evilásio aparecem só pelo primeiro nome. O texto é o sermão do bispo
    diocesano, que fala em primeira pessoa como quem confere a ordem; a página não traz assinatura, e o bispo diocesano
    em exercício era Robinson Cavalcanti (instalado em 19/10/1997).
