biography: >-
  João Yasoji Ito iniciou em 1923, como catequista nomeado pelo bispo Kinsolving, o trabalho missionário entre imigrantes
  japoneses no Brasil; foi ordenado diácono em 1926, por Lucien Lee Kinsolving, e presbítero em 24 de abril de 1928,
  por William Thomas. Teve Registro como campo missionário e foi transferido do Distrito Missionário do Brasil Central
  para a Igreja Episcopal do Brasil em 25 de abril de 1965. Morreu em 7 de agosto de 1969.
sources:
- source: ens-xxvi-24
  quote: >-
    in 1923 a new missionary work, among Japanese immigrants to Brazil, was begun by the Rev. J. Yasoji Ito
- source: drv-kinsolving-ivo
  quote: >-
    trazendo credenciais do Bispo de Tókio; e encontra o Revmo. Dr. Kinsolving, que o faz catequista entre os de
    sua raça
- source: costa2021
  quote: >-
    o bispo Kinsolving delegou a realização dos serviços a Ito, que, diante do reconhecimento do seu trabalho junto
    à comunidade nipônica, ordenou-o ao diaconato, em 1926, na Igreja do Mediador, em Santa Maria.
  page: '60'
