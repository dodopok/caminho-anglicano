# yaml-language-server: $schema=../../schemas/person.json
id: reinaldo-de-souza-pinto
name: Reinaldo de Souza Pinto
biography: >-
  Foi ministro local da Região Missionária da IAB de 2018 a 2024 e, em 20 de dezembro de 2024, teve suas ordens
  de presbítero reconhecidas na fundação da Rede Episcopal Brasileira (REB). É presbítero da Igreja Anglicana Família,
  em Jacareí (SP), e presidiu o Conselho Diocesano da REB em 2025.
sources:
- source: iab-regiao-missionaria
  quote: 'Ministro Encarregado: Ministro Local: Reinaldo de Souza'
- source: reb-portaria-01-2024
  quote: >-
    1. Rev. Cícero Miranda Pontara– Presbítero. 2. Rev. Elionai Lisboa de Aguiar Rodrigues – Presbítero. 3. Rev.
    Reinaldo de Souza Pinto – Presbítero. 4. Rev. Weiden de Morais Mendes – Diácono.
- source: reb-portaria-01-2024
  quote: Ficam reconhecidos as ordens sagradas dos seguintes clérigos
- source: rbc-reb-post-jacarei
  quote: >-
    Dou graças a Deus pela vida e pelo ministério do Reverendo Reinaldo, da Reverenda Andreia, da Reverenda Paula
    e de toda a equipe da Anglicana Família.
- source: testemunho-mantenedor-2026-10-08-douglas-cargos
  quote: >-
    Douglas sei que é presidente da Comissão de Liturgia, assumiu a presidência do Conselho Diocesano em 2026 (após
    o Rev. Reinaldo que foi em 2025), e também é o custódio do Livro de Oração Comum 2027, a ser lançado em breve.
