biography: >-
  Edward Venables-Vernon-Harcourt foi sagrado em 6/11/1791 em Whitehall, pelo arcebispo William Markham de York,
  e foi bispo de Carlisle. Tornou-se arcebispo de York em 1808 e permaneceu no cargo até morrer, em 12/11/1847.
