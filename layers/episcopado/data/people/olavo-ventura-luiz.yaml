    (grafado "Ventura Ruiz"); morreu em 09/03/1993. ENS (17/03/1993) diz que morreu em 8 de marco (Costa: 9 de marco)
    e que se tornou primaz em 1984 (provavel confusao; Sherrill era primaz em exercicio em 1984). O livro dá só
    o início de cada primado; o fim é o início do primado seguinte. Primeiro interino (1986), depois eleito em 1986
    e reeleito em 1988 e 1990. Anexo E da tese (primazes da IEAB). A tese grafa 'Olavo Ventura Ruiz' (= Olavo Ventura
    Luiz). A nota 76 diz 'por dois anos', mas o texto o chama Primaz em março, abril e outubro de 1989; fim incerto.
    Primaz em fevereiro de 1990. A cronologia dá 1986 como ano da eleição do novo primaz; outras fontes divergem
    quanto ao início do primado.
