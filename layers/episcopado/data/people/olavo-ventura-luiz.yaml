- order: episcopate
  date: '1976-11-28'
  jurisdiction: ieab
  office: diocesan
  status: contested
  sources:
  - source: costa2021
    quote: >-
      Foi eleito pelo Concílio para ser o terceiro bispo da Diocese Sul-Ocidental, sendo sagrado em 28 de novembro
      de 1976.
  - source: ens-93049m
    quote: >-
      Luiz became primate in 1984 following his service as bishop of southwestern Brazil, for which he was consecrated
      in 1976.
  - source: sinopse-2003
