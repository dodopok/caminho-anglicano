  notes: >-
    Primaz em fevereiro de 1990. A nota 76 diz 'por dois anos', mas o texto o chama Primaz em março, abril e outubro
    de 1989; fim incerto. O livro dá só o início de cada primado; o fim é o início do primado seguinte. Primeiro
    interino (1986), depois eleito em 1986 e reeleito em 1988 e 1990. O ENS dá 1984 como início do primado; as fontes
    brasileiras dizem interino em 1986 e eleito no Sínodo de 1986. Fontes divergem: lista oficial (via Wikipedia
    EN) 1986-1992; Costa (Anexo E) interino 1986-1988 e titular 1988-1993 (grafado "Ventura Ruiz"); morreu em 09/03/1993.
    ENS (17/03/1993) diz que morreu em 8 de marco (Costa: 9 de marco) e que se tornou primaz em 1984 (provavel confusao;
    Sherrill era primaz em exercicio em 1984).
