biography: >-
  Ordenado diácono em 1969 e presbítero em 1970, foi pároco em Jaguarão. Eleito em 4 de setembro de 1976 no segundo
  concílio extraordinário, foi sagrado em 28 de novembro de 1976 como terceiro bispo da Diocese Sul-Ocidental, que
  governou até o fim da vida. Foi primaz da IEAB, cargo cuja data de início varia conforme as fontes (1984 ou 1986),
  e nessa condição esteve presente em 12 de março de 1989 na elevação da Igreja do Redentor, em Pelotas, a catedral.
  Faleceu em março de 1993, vítima de malária cerebral contraída em visita a Moçambique. Participou de quatro ordenações
  de diáconos ou presbíteros e de quatro sagrações episcopais, entre elas as de Sumio Takatsu e, como sagrante principal,
  Almir dos Santos.
