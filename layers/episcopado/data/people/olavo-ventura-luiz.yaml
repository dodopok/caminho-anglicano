    "No início do ano de 1976 foi sagrado o novo bispo da Diocese Sul-Ocidental, o reverendo Olavo Ventura Luiz";
    a nota de rodape da 28/11/1976. Ver duvidas. Conflito interno: o texto diz 'No início do ano de 1976' e a nota
    76 dá 28/11/1976. Local e sagrantes não informados. Nota 138: nº 03.
