    quote: >-
      Dois clérigos não puderam estar presentes, mas concordaram com as conclusões: Revs. Alberto Pires e Raimundo
      Nonato.
  notes: >-
    Local: Diocese do Recife. Citado pelo nome abreviado (“Rev. Raimundo Nonato”) como clérigo ausente do retiro
