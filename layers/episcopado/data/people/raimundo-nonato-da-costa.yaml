id: raimundo-nonato-da-costa
name: Raimundo Nonato da Costa
aliases:
- Raimundo Nonato
biography: >-
  Presbítero ordenado em Belém (PA), no Distrito Missionário da Amazônia, durante o episcopado de Clóvis Erly Rodrigues,
  e clérigo emérito da Diocese Anglicana da Amazônia.
sources:
- source: darl3-hist3
  quote: Raimundo Nonato (em Belém-PA, Distrito Missionário da Amazônia)
- source: darl3-hist3
  quote: Foram ordenados, durante o seu período os seguintes reverendos
- source: daa-clero
  quote: Revdo. Raimundo Nonato da Costa (emérito)
- source: d2s25-paudalho
  quote: >-
    Dois clérigos não puderam estar presentes, mas concordaram com as conclusões: Revs. Alberto Pires e Raimundo
    Nonato.
ordinations:
- order: presbyterate
  date: null
  jurisdiction: ieab-dar
  ordained_by: clovis-erly-rodrigues
  status: probable
  sources:
  - source: darl3-hist3
    quote: Raimundo Nonato (em Belém-PA, Distrito Missionário da Amazônia)
  - source: darl3-hist3
    quote: Foram ordenados, durante o seu período os seguintes reverendos
  notes: >-
    Ordenação durante o episcopado de Clóvis Erly Rodrigues na diocese (1986-1997), conforme lista de Dom Robinson
    Cavalcanti; o texto não dá data nem local e não diz expressamente "ordenado por"; ordenante inferido do período.
    A lista separa os ordenados ao presbiterado (aqui incluídos) dos ordenados "apenas ao Diaconato".
