# yaml-language-server: $schema=../../schemas/person.json
id: james-orin-mote
name: James Orin Mote
aliases:
- James O. Mote
biography: >-
  Um dos quatro bispos do Movimento Contínuo sagrados em 1978 (de Denver); participou da sagração de Louis Falk
  (1981).
sources:
- source: cant-novas-igrejas-2024
  quote: foram os reverendos James O. Mote de Denver
  page: '71'
ordinations:
- order: episcopate
  date: '1978-01-28'
  place: Denver, Colorado (EUA)
  jurisdiction: null
  office: diocesan
  principal_consecrator: albert-arthur-chambers
  co_consecrators:
  - francisco-pagtakhan
  status: confirmed
  sources:
  - source: ia-gc-journal-1979
    quote: >-
      On January 28, 1978, he was the chief consecrator of four bishops for the Anglican Church in North America.
  - source: cant-anglo-catolicismo-2026
    quote: >-
      Em janeiro de 1978, juntamente com o Bispo Francisco Pagtakhan, da Igreja Filipina Independente, consagrou
      quatro novos bispos: James O. Mote, Peter F. Watterson, Robert S. Morse e Charles Dale Doren.
  - source: lac-ial-sucessao
    quote: 002. MOTE, James Orin Chambers, Pagtakhan, 001, 28 January, 1978.
  - source: cant-novas-igrejas-2024
    quote: >-
      Os quatro bispos consagrados pelos bispos Albert Chambers e Francisco Pagtakhan foram os reverendos James
      O. Mote de Denver
    page: '71'
  notes: >-
    Sagrante principal confirmado pelo Journal da Convenção Geral de 1979 (fonte primária, sem nomes dos sagrados)
    + Costa (nomes). Costa (2024) acrescenta o consentimento in absentia do bispo Mark Pae (Coreia). Local "Denver"
    vem da tradição; o Journal não dá o local. Registrado como elo de ligação: a lista da IAL indica 28/01/1978,
    sagrante Albert Arthur Chambers e Francisco Pagtakhan (a mesma data dos quatro bispos sagrados por Chambers
    e Pagtakhan em 1978, junto com Doren, Morse e Watterson). Consagrado por Albert Chambers e Francisco Pagtakhan
    (o livro não distingue o principal); Mark Pae consentiu in absentia. Para a 'nova Igreja Anglicana na América
    do Norte' de 1978 (não confundir com a ACNA de 2009).
