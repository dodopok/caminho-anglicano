biography: >-
  Gabriel Moreira Uchoa Cavalcanti, filho do arcebispo primaz Miguel Uchôa, é bacharel em Administração de Empresas
  e clérigo da Diocese do Recife, da Igreja Anglicana no Brasil, desde 2019. Foi ministro auxiliar da Paróquia Anglicana
  Espírito Santo (PAES, Catedral Nacional), cujo reitor era o pai. Em 23 de agosto de 2026, no culto de encerramento
  dos 30 anos da igreja, plantada por Miguel Uchôa em 1996, foi instituído deão da Catedral Anglicana do Espírito
  Santo, em Recife, assumindo a reitoria que o pai deixava. A cerimônia contou com a presença de Laurent Mbanda
  e de líderes da Comunhão Anglicana Global.
