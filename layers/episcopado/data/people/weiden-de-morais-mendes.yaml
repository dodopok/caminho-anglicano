# yaml-language-server: $schema=../../schemas/person.json
id: weiden-de-morais-mendes
name: Weiden de Morais Mendes
aliases:
- Weiden Mendes
biography: >-
  Ordenado diácono em 12/11/2022 por Márcio Meira (IAB), em culto na Igreja Âncora (Vitória-ES). Em 20/12/2024,
  na fundação da Rede Episcopal Brasileira (REB), teve a ordem reconhecida e consta como diácono da REB.
sources:
- source: testemunho-mantenedor-2026-10-08-ordenante-ancora
  quote: Quem ordenou lorrayne, cícero e weiden foi marcio meira
- source: testemunho-mantenedor-2026-10-08-ancora-2022
  quote: >-
    o Cícero também foi ordenado diácono nesse dia, eu estava lá. Weiden também. E a Lorrayne Muniz (esposa do Rev.
    Pedro Muniz) também
- source: iabord-yt-juqrsmo82ny
  quote: >-
    Sermão ministrado na Ordenação Pastoral do Rev. Cícero (Igreja Âncora), Revª. Elionai (Igreja Âncora), Revª.
    Lorrayne (Anglicana Trindade) e Rev. Weiden (Anglicana Metamorfose).
- source: reb-portaria-01-2024
  quote: Rev. Weiden de Morais Mendes – Diácono.
- source: reb-portaria-01-2024
  quote: Ficam reconhecidos as ordens sagradas dos seguintes clérigos
- source: reb-calendario-2026
  quote: "Diáconos \nWeiden de Morais Mendes\nAndreia Rodrigues Nogueira Pinto\nPaula Pires do Nascimento Silva\n\
    Rafael Santos Rodrigues"
ordinations:
- order: diaconate
  date: '2022-11-12'
  place: Igreja Anglicana Âncora, Vitória (ES)
  jurisdiction: iab
  ordained_by: marcio-meira
  status: confirmed
  sources:
