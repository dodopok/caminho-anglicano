    quote: >-
      o Cícero também foi ordenado diácono nesse dia, eu estava lá. Weiden também. E a Lorrayne Muniz (esposa do
      Rev. Pedro Muniz) também
  - source: reb-calendario-2026
    quote: 12/11/2022 – Aniversário de Ordenação • Rev. Weidem
  - source: testemunho-mantenedor-2026-10-08-ordenante-ancora
    quote: Quem ordenou lorrayne, cícero e weiden foi marcio meira
  - source: reb-calendario-2026
    quote: "Diáconos \nWeiden de Morais Mendes"
  notes: >-
    Ordenações diaconais no mesmo culto de 12/11/2022 na Âncora (Elionai Rodrigues, Cícero Pontara, Weiden Mendes
    e Lorrayne Muniz), segundo testemunho presencial do mantenedor. Bispo ordenante: Márcio Meira, segundo o mantenedor.
    Diácono em 2026, logo a ordenação de 12/11/2022 é diaconal. Anterior à fundação da REB (dez/2024); jurisdição
    da época não informada.
