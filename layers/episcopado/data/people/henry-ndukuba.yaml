# yaml-language-server: $schema=../../schemas/person.json
id: henry-ndukuba
name: Henry Ndukuba
full_name: Henry Chukwudum Ndukuba
aliases:
- Henry Chukwudum Ndukuba
- Most Revd Henry Ndukuba
- The Most Revd Henry Chukwudum Ndukuba
birth:
  date: '1961-07-18'
  sources:
  - source: gacl-con-primate-page
    quote: >-
      He was born on the 18 th July 1961, to Mr. and Mrs. Silas O. Ndukuba of Ogberuru in orlu Local Government
      Area of Imo State.
biography: >-
  Henry Ndukuba foi ordenado diácono em 1984 e presbítero em 1985 na Igreja da Nigéria e, em 21 de setembro de 1999,
  sagrado bispo (por Joseph Adetiloye, segundo uma fonte), como primeiro bispo da Diocese de Gombe, que ocupou até
  2020. Eleito arcebispo da Província Eclesiástica de Jos em 22 de setembro de 2017, foi eleito primaz da Nigéria
  em 2019 e confirmado no cargo em 25 de março de 2020. Foi membro do Conselho dos Primazes do GAFCON até março
  de 2026, quando passou ao Global Anglican Council.
sources:
- source: gacl-con-primate-page
  quote: He was ordained into the Holy Order diaconate 1984, and priesthood 1985.
- source: gacl-ai-2019-ndukuba
  quote: >-
    He rose though its rank and was elected Pioneer Bishop of the Diocese of Gombe. He was consecrated on the 21st
    September, 1999. On 25 November 1999 the new diocese was inaugurated as the 71st diocese of the Church of Nigeria.
- source: gacl-wp-ndukuba
  quote: '| consecration = September 1999

    | consecrated_by = [[J. Abiodun Adetiloye]]'
- source: gacl-wp-ndukuba
  quote: Bishop of [[Anglican Diocese of Gombe]] (1999–2020)
- source: gacl-ai-2019-ndukuba
  quote: >-
    on the 22nd September 2017, the Rt Revd Henry Chukwudum Ndukuba was elected as Archbishop of the Ecclesiastical
    Province of Jos.
- source: gacl-ai-2019-ndukuba
  quote: >-
    September 24th 2019 in an Episcopal Synod ... The Most Revd Henry Chukwudum Ndukuba is elected, 5th Archbishop,
    Metropolitan and Primate of All Nigeria. ... He will assume office in March 2020 at the expiration of the term
    in office of the current Primate of the Church (The Most Revd Dr Nicholas Okoh).
- source: gace-gac-page
  quote: was confirmed as the Primate of the Church of Nigeria (Anglican Communion) on 25th March 2020.
- source: gacl-ai-2023-uxbridge
  quote: The Most Reverend Henry Ndukuba – Church of All Nigeria
- source: gace-gac-page
  quote: The Most Revd Henry Chukwudum Ndukuba Primate of the Church of Nigeria (Anglican Communion)
