  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      O então reverendo Rafael Mendes Martins foi sagrado ao episcopado em cerimônia ocorrida em 10 de outubro de
      2021, na Paróquia Anglicana São Miguel, em Paraisópolis. O rito foi presidido pelos bispos dom Rafael Moraes
      e dom Lucas Macieira
    page: '105'
  - source: cant-novas-igrejas-2024
    quote: No dia 21 de novembro de 2021, o monsenhor Rafael Mendes Martins foi ordenado ao episcopado.
    page: '161'
  discrepancies:
  - field: date
    value: '2021-11-21'
    sources:
    - source: cant-novas-igrejas-2024
      quote: No dia 21 de novembro de 2021, o monsenhor Rafael Mendes Martins foi ordenado ao episcopado.
      page: '161'
  notes: >-
    O livro diz que o rito foi 'presidido pelos bispos dom Rafael Moraes e dom Lucas Macieira', sem distinguir o
    sagrante principal. CONTESTADO internamente: o mesmo livro (p. 161) diz "No dia 21 de novembro de 2021, o monsenhor
    Rafael Mendes Martins foi ordenado ao episcopado". O trecho principal diz "presidido pelos bispos dom Rafael
    Moraes e dom Lucas Macieira" (dois presidentes; ordem dos nomes não indica o principal). Sagrantes não informados;
    contexto da ICACA/Província Anglo-Católica.
