- monsenhor Rafael Mendes Martins
biography: >-
  Ordenado presbítero na IATB (2016); passou por uma paróquia bizantina independente e voltou ao anglicanismo anglo-católico;
  fundou a Paróquia São Miguel Arcanjo (Paraisópolis, 2019); sagrado bispo em 10/10/2021; bispo da Diocese Anglo-Católica
  de Minas Gerais.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    A Diocese tem origem na ordenação presbiteral de Rafael Mendes, ocorrida em 2016, através da Igreja Anglicana
    Tradicional do Brasil (IATB)
  page: '105'
- source: cant-novas-igrejas-2024
  quote: >-
    O então reverendo Rafael Mendes Martins foi sagrado ao episcopado em cerimônia ocorrida em 10 de outubro de
    2021, na Paróquia Anglicana São Miguel, em Paraisópolis.
  page: '105'
