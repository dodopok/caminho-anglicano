name: Alexander Viets Griswold
full_name: Alexander Viets Griswold
aliases:
- Bp. Griswold
wikidata: Q1678303
biography: >-
  Alexander Viets Griswold foi sagrado em 29 de maio de 1811, na Trinity Church, em Nova York, por William White,
  com Provoost e Jarvis, na mesma cerimônia de Hobart, e atuou como bispo da Eastern Diocese, na Nova Inglaterra,
  na TEC. Participou de seis sagrações episcopais, entre elas as de Thomas Church Brownell (1819) e William Meade
  (1829).
