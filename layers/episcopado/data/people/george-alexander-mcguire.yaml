biography: >-
  George Alexander McGuire, nascido em Antigua em 1866, foi reitor episcopal e é apontado como primeiro bispo e
  fundador da African Orthodox Church; foi sagrado em Chicago em setembro de 1921 (datas divergentes entre as fontes,
  21 ou 28), por Joseph René Vilatte, e morreu em 1934.
