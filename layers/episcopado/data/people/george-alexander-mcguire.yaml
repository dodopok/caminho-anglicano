biography: >-
  George Alexander McGuire nasceu em 28/3/1866, em Antigua, e foi reitor episcopal e capelão-geral da Universal
  Negro Improvement Association. Fundou em 1918, com Marcus Garvey, a African Orthodox Church, da qual é apontado
  como primeiro bispo e patriarca. Foi sagrado em Chicago em setembro de 1921 (as fontes dão 21 ou 28), por Joseph
  René Vilatte, assistido por Carl A. Nybladh, e morreu em 10/11/1934.
