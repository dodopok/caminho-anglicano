id: ovid-americus-kinsolving
name: Ovid Americus Kinsolving
aliases:
- Ovid Kinsolving
biography: >-
  Sacerdote da Diocese de Virgínia, pai de Lucien Lee Kinsolving; formado no Kenyon College (1842) e no Seminário
  Teológico de Virgínia; reitor em Middleburg e, em 1870, de St. John's, Halifax Courthouse.
sources:
