- Reverendo Dom Josué
biography: >-
  Egresso da Diocese Anglicana de São Paulo, da IEAB, Josué Sousa Torres foi ordenado diácono em 26/3/2005 e presbítero
  em 27/3/2005, em Ribeirão Preto (SP), por Lucas Macieira da Silva, com Ricardo Lorite de Lima, Rui Costa Barbosa
  e Luis Fernando Salgado. Fundou em Taboão da Serra a Igreja Episcopal do Evangelho Pleno (IEEP), ministério evangélico
  desde 1997, que adotou formalmente a doutrina anglicana e o governo episcopal em 2005. Foi sagrado bispo em 15/1/2006
  por Barry Frank Peachey, em Taboão da Serra, e é bispo primaz da IEEP e arcebispo emérito do Conselho Nacional
  de Bispos Protestantes do Brasil. Em janeiro de 2013 ordenou o clero da recém-criada Igreja Anglicana Ortodoxa
  no Brasil, entre eles os bispos Dirceu Falcão Ibaldo e Adolfo Batista Teodoro Júnior. Ordenou cinco diáconos e
  presbíteros e participou de 13 sagrações episcopais, entre elas as de Lucas Oliva Bertolozzi e Elias Batista Nogueira.
