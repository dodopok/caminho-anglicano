  notes: >-
    Acrescenta o local (Taboão da Serra) à data e ao sagrante já conhecidos; o blog da CEFIP dá só o ano (2006).
    Fundador da Igreja Episcopal do Evangelho Pleno (IEEP). Mesma data da sagração de Ricardo Lorite e Rui Barbosa
    (p. 118), na qual Peachey também atuou.
