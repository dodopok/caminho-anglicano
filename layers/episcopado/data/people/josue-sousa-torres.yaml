  status: probable
  sources:
  - source: lac-cnbp-sucessao
    quote: >-
      Josué Souza Torres (Brasileiro) – Em 15/01/2006 foi sagrado ao Bispado por Dom Barry Frank Peachey em Taboão
      da Serra, São Paulo (SP), Brasil.
  - source: lpq-cefip-sagracoes
    quote: >-
      Josué Souza Torres, Bispo Primaz da Igreja Episcopal do Evangelho Pleno e Arcebispo Emérito do Conselho Nacional
