# yaml-language-server: $schema=../../schemas/person.json
id: decio-da-silva
name: Décio da Silva
biography: >-
  Décio da Silva foi ordenado diácono em 27/12/2003, na Paróquia Anglicana Emanuel (Olinda, PE), por Robinson Cavalcanti.
  Foi ordenado presbítero por Cavalcanti em 04/12/2004, no XXIV Concílio Diocesano, também em Olinda. Em 2004 constava
  como ministro auxiliar da Paróquia Anglicana Emanuel, sob a Revda. Vera Nascimento. Em 2005 estava à frente da
  Missão Anglicana Filadélfia, em Maceió. Em 23/08/2005 seu nome constou na lista de clérigos da Diocese Anglicana
  do Recife excluídos da Comunhão da IEAB, que responderam por carta manter plena comunhão com Cavalcanti.
sources:
- source: rcor-drv-ord-decio-2003
  quote: Paróquia Anglicana Emanuel - Olinda/PE — 27/12/2003
- source: rcor-drv-ord-decio-2003
  quote: >-
    Décio da Silva, Elias Leôncio de Brito Filho, ose, Raniere Almeida de Oliveira, Solange Cristina Pereira e Tibério
    Marques da Silva, ose
- source: drp2-concilio-xxiv-2004
  quote: >-
    foi celebrado um Culto Eucarístico com a Ordenação Presbiteral dos Reverendos: Décio da Silva, Fred Souto, Marconi
    Oliveira, Solange Cristina Pereira e Raniere Oliveira
- source: drp2-ord-presb-xxiv-concilio-2004
  quote: Ordenação presbiteral XXIV C Diocesano- Olinda PE
- source: d2s28-comun04
  quote: 'PARÓQUIA ANGLICANA EMANUEL (05/02) Revda. Vera Nascimento Auxiliar: Rev. Décio da Silva'
- source: drp2-breves-08-2005
  quote: >-
    Oremos pelo trabalho evangelístico da Missão Anglicana Filadélfia, em Maceió, e pela vida do Rev. Décio da Silva
    à frente desse trabalho
- source: costa2021
  quote: >-
    Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
    Ordens, os clérigos a seguir mencionados: … Rev. Décio da Silva … Recife, 23 de agosto de 2005.
  page: 560-561
- source: costa2021
  quote: >-
    Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
    Ordens, os clérigos a seguir mencionados: … Rev. Décio da Silva … Os clérigos não atenderam à convocação e declararam,
    via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo plena comunhão
    com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
  page: 560-562
