- type: other
  date: 1964-10
  description: >-
    61ª Convenção Geral (St. Louis, out. 1964) concede autonomia à Igreja Episcopal Brasileira, 19ª igreja da Comunhão
    Anglicana; os três bispos brasileiros (Krischke, Simões, Sherrill) recebem assento na Câmara dos Bispos dos
    EUA.
  status: confirmed
  sources:
  - source: ens-xxvi-8
    quote: >-
      The House of Bishops approved by a standing vote the resolution granting autonomy to the Brazilian Episcopal
      Church.
  - source: ens-xxvi-1
    quote: >-
      For Brazil: Independence - In action pointing the way for greater impact of MRI proposals on the life of the
      Church, the Brazilian Episcopal Church became the 19th independent church in the world-wide Anglican Communion.
- type: other
  date: '1965-04-25'
  description: >-
    Autonomia: a Igreja Episcopal Brasileira torna-se a 19a provincia da Comunhao Anglicana; proclamacao pelo Bispo
    Presidente John E. Hines no Sinodo de Porto Alegre (25/04/1965) e investidura de Egmont Machado Krischke como
    primeiro primaz.
  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      O projeto do Sínodo foi levado à votação na 61ª Convenção Geral, realizada de 11 a 23 de outubro do mesmo
      ano, na cidade de St. Louis, no Missouri, sendo aprovada a autonomia plena da Igreja Brasileira.
  - source: wp-en-ieab
    quote: >-
      The Anglican community of Brazil was a missionary district of the Episcopal Church until 1965, when it gained
      its ecclesiastical independence and became a separate province of the Anglican Communion.
