biography: >-
  Egmont Machado Krischke nasceu em 26/6/1909 em São Leopoldo (RS). Foi ordenado diácono em 30/11/1930 e presbítero
  em 10/12/1933 pelo bispo William M. M. Thomas e, em 1940, reitor da Igreja da Ascensão em Porto Alegre, foi nomeado
  para a Igreja do Crucificado, em Bagé. Eleito em 1949, foi sagrado em 12/3/1950 por Louis C. Melcher e foi bispo
  do novo distrito do Brasil Sul-Ocidental (Santa Maria) até 1955, quando foi transferido para o Brasil Meridional
  (Porto Alegre), no lugar de Athalicio Pithan. Em 25/4/1965, com a autonomia da Igreja Episcopal do Brasil, foi
  investido como seu primeiro primaz. Resignou da diocese, mas permaneceu primaz até morrer, em 28/6/1971. Ordenou
  37 diáconos e presbíteros e participou de duas sagrações episcopais, as de Plínio Lauer Simões e Edmund Knox Sherrill.
