  - source: wit-1950-03-30
    quote: >-
      Bishop John B. Bentley of New York, vice- president of the National Coun- cil and director of the overseas
      department, was a oo-consecra- tor and presenter, with Bishop Pithan.
  - source: wit-1950-03-02
    quote: >-
      Krischke is to be consecrated at the Church of the Crucified, Bage, Brazil, March 12th, with Bishop Melcher
      the consecrator and Bishop Bentley and Bishop Pithan the co-consecrators.
  - source: wp-en-krischke
    quote: >-
      Egmont Machado Krischke was consecrated on March 12, 1950, by: Louis Chester Melcher (475), I Missionary Bishop
      of Southern Brazil; John Boyd Bentley (379), retired Missionary Bishop of Alaska; and, Athalicio Theodore
      Pithan (422)
  notes: >-
    Primeira sagração no próprio Brasil segundo a nota ('the first consecra­tion to be held in Brazil in two years'
    — i.e., há dois anos não havia; a de Pithan em 1940 foi no Brasil). Presbíteros assistentes: Rev. George U.
    Krischke (pai) e Rev. N. Duval da Silva; Pithan foi litanista e pregador.
