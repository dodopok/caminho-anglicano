    havia; a de Pithan em 1940 foi no Brasil). Presbíteros assistentes: Rev. George U. Krischke (pai) e Rev. N.
    Duval da Silva; Pithan foi litanista e pregador. Certificado oficial de sagração publicado no Journal da Convenção
    Geral de 1952, para o Distrito Missionário do Brasil Sudoeste. O certificado dá Melcher como o primeiro bispo
    nomeado; que seja o principal sagrante vem de outras fontes. Sagrantes não informados.
