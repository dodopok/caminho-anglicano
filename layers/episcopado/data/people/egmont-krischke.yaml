wikidata: Q23585620
biography: >-
  Filho do Rev. George U. Krischke; reitor em Porto Alegre e Bagé; sagrado em 12/03/1950 em Bagé primeiro bispo
  do Sudoeste do Brasil; transferido ao Sul do Brasil em 1955; bispo sênior em 1964 e primeiro primaz da IEAB (1965-1971/72).
sources:
- source: wit-1950-03-30
  quote: >-
    The Rev. Edmont Machado Krischke was c o n s e c r a t e d Bishop to be head of the newly-formed Missionary
    District of Southwestern Brazil on Sunday, March 12, at the Church of the Crucified in Bage.
- source: wp-en-krischke
  quote: >-
    Egmont Machado Krischke was first primate of the Anglican Episcopal Church of Brazil, serving from 1965 to 1971.
- source: wd-q23585620
  quote: Egmont M. Krischke | Anglican bishop in Brazil
