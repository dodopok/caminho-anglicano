    Wikipédia: primaz 1965–1971; ENS (out. 1972) diz que morreu 'a few months ago' — data da morte (1971 ou 1972)
    a verificar. O livro dá só o início de cada primado; o fim é o início do primado seguinte. Anexo E da tese (primazes
    da IEAB). Cronologia da IEAB: em 1965 a igreja passa a chamar-se Igreja Episcopal do Brasil e elege seu primeiro
    primaz.
