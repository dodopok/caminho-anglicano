id: patricia-ann-powers
name: Patricia Ann Powers
full_name: Patricia Ann Powers
aliases:
- Patricia Powers
- Patrícia Powers
biography: >-
  Missionária norte-americana no Brasil desde 1979, foi ordenada diácona em 29/06/1986 e presbítera em 28/12/1986
  na IEAB, sendo a segunda mulher ordenada presbítera da igreja. Foi deã da Catedral da Ressurreição, em Brasília,
  e atuou na Diocese Anglicana de Brasília entre 1985 e 1988. Em 1988, no Sínodo, disputou com Almir dos Santos
  a eleição para bispo missionário de Brasília, sendo a primeira mulher a concorrer ao episcopado na IEAB.
sources:
- source: lic-livro35
  quote: 'Diaconato: 29 de junho de 1986. Presbiterado: 28 de dezembro de 1986.'
- source: lic-livro35
  quote: >-
    Ordenada ao diaconato em 29 de junho 1986, aos 38 anos; e ao Presbiterado, em 28 de dezembro de 1986.
- source: lic-livro35
