biography: >-
  Sagrado em 12/02/1775 por Frederick Cornwallis, foi bispo de Bangor até 1783 e arcebispo de Cantuária de 1783
  até morrer, em 18/01/1805. Sagrou três bispos, entre eles William White e Samuel Provoost.
sources:
