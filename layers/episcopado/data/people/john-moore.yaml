  quote: >-
    a. d. 1775, Feb. 12. Richard Hurd. Lichfield; Worcester, 1781 ; d. 1808, May 28 ; and John Moore. Bangor; Canterbury,
    1783; d. 1805, Jan. 18. Consecrated at Lambeth by Archbishop Cornwallis, Edmund of Ely, Robert of Oxford, and
    John of Rochester ; Reg. Cornwallis, 193, 204.
- source: stubbs-1897
  quote: John Moore. Bangor; Canterbury, 1783; d. 1805, Jan. 18.
- source: perry-1895
  quote: >-
    on the fourth day of February, 1787, at Lambeth Chapel, at the hands of the archbishop of Canterbury, Dr. Moore,
    the archbishop of York, Dr. Markham, the bishop of Bath and Wells, Dr. Moss, and the bishop of Peterborough,
    Dr. Hinchcliffe, William White and Samuel Provoost were duly and canonically, by the laying on of hands, made
    bishops of the Church of God.
- source: stubbs-1897
  quote: >-
    a. d. 1787, Feb. 4. William White. Pennsylvania ; d. 1836 ; and Samuel Provoost. New York ; d. 1815. Consecrated
