biography: >-
  Ordenado diácono em fevereiro de 1962 e presbítero em novembro de 1965, ambos por Plínio Lauer Simões, atuou no
  distrito missionário do Sudoeste do Brasil (DMSOB) e foi transferido para a Igreja Episcopal do Brasil em 25/04/1965.
