events:
- type: other
  date: '2017-11-25'
  description: >-
    Clérigos saídos da IAB em 2014 (entre eles Daniel Barbosa) ingressam na IAOB, que reconhece suas ordens, em
    cerimônia no templo da Igreja Evangélica Pernambucana (Congregacional).
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 25 de novembro de 2017, em cerimônia realizada no templo da Igreja Evangélica Pernambucana (Congregacional),
      eles ingressaram na Igreja Anglicana Ortodoxa no Brasil e suas ordens foram reconhecidas pelo então Bispo
      Primaz da IAOB, Dom Adolfo Batista Teodoro Júnior.
    page: '34'
- type: other
  date: '2017-11-25'
  description: >-
    Um grupo de clérigos (entre eles Daniel Barbosa, ex-secretário de Robinson) deixou a Igreja de Miguel Uchôa
    e ingressou na Igreja Anglicana Ortodoxa no Brasil, tendo as ordens reconhecidas pelo Primaz Adolfo Batista
    Teodoro Júnior, em cerimônia na Igreja Evangélica Congregacional Pernambucana.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Entre eles, estava o reverendo Daniel Barbosa, que foi secretário de Robinson por muitos anos. Em 25 de novembro
      de 2017, em cerimônia realizada na Igreja Evangélica Congregacional Pernambucana, eles ingressaram na Igreja
      Anglicana Ortodoxa no Brasil
    page: '259'
  - source: costa2021
    quote: e suas ordens foram reconhecidas pelo Bispo Primaz da IAOB, Dom Adolfo Batista Teodoro Júnior.
    page: '259'
- type: other
  date: 2013-01
  description: >-
    Na fundação da Igreja Anglicana Ortodoxa no Brasil (Corumbá de Goiás, janeiro de 2013), o novo clero, incluindo
    os bispos Dirceu Falcão Ibaldo e Adolfo Batista Teodoro Júnior, foi ordenado pelo bispo Josué Sousa Torres (Igreja
    Evangélica do Evangelho Pleno).
  status: probable
  sources:
  - source: costa2021
    quote: >-
      A Igreja Anglicana Ortodoxa no Brasil surgiu em janeiro de 2013, na cidade de Corumbá de Goiás (GO), a partir
      de um grupo de clérigos de diferentes denominações. O novo clero foi ordenado pelo bispo Josué Sousa Torres
      (da Igreja Evangélica do Evangelho Pleno), entre eles, os bispos Dirceu Falcão Ibaldo e Adolfo Batista Teodoro
      Júnior.
    page: '259'
