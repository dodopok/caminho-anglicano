ordinations:
- order: diaconate
  date: '2012-06-12'
  jurisdiction: ieep
  ordained_by: josue-sousa-torres
  status: probable
  sources:
  - source: cont-iaob-sucessao
    quote: >-
      Ordenado Diácono, no dia 12 de Junho de 2012, através da imposição de mãos do Bispo Primaz da Igreja Episcopal
      do Evangelho Pleno “Igreja de Tradição Anglicana”, Dom Josué Souza Torres.
  notes: >-
    Antes: ordenado ao ministério pastoral presbiteriano em 9/2/1987 (Presbitério do Planalto Central, Igreja Presbiteriana
    Renovada do Brasil) — fora do episcopado histórico.
- order: presbyterate
  date: '2012-06-14'
  place: Fazenda Shangri-lá, Corumbá de Goiás (GO)
  jurisdiction: ieep
  ordained_by: josue-sousa-torres
  status: probable
  sources:
  - source: cont-iaob-sucessao
    quote: >-
      Na data de 14 de Junho de 2012, o Reverendo Diácono Adolfo Batista Teodoro Junior foi elevado ao Ministério
      Presbiteral através da imposição das mãos do Reverendíssimo Bispo Primaz da Igreja Episcopal do Evangelho
      Pleno Dom Josué Souza Torres na sede provisória da Igreja Anglicana Ortodoxa no Brasil na Fazenda Shangri-lá
      em Corumbá de Goiás GO – Brasil.
  notes: >-
    Diaconato (12/06/2012) e presbiterato (14/06/2012) com dois dias de intervalo, ambos por Josué Torres. A mesma
    página lista as duas datas por extenso; a página inicial da IAOB diz que a igreja em Corumbá começou no segundo
    semestre de 2012 (contradição aparente: a 'sede provisória da IAOB' é citada já em junho/2012).
- order: episcopate
  date: '2013-01-12'
  place: Fazenda Shangri-lá (sede provisória da IAOB), Corumbá de Goiás (GO)
  jurisdiction: ieep
  office: primate
  principal_consecrator: josue-sousa-torres
  co_consecrators:
  - dirceu-falcao-ibaldo
  - osiel-luiz-santos
  status: confirmed
  sources:
  - source: cont-iaob-sucessao
    quote: >-
      Na data de 12 de Janeiro de 2013, o Reverendo Padre Adolfo Batista Teodoro Junior, foi Sagrado ao Sacro Ministério
      Episcopal através da imposição das mãos do Reverendíssimo Bispo Dom ++ Josué Souza Torres Primaz da Igreja
      Episcopal do Evangelho Pleno, na sede provisória da Igreja Anglicana Ortodoxa no Brasil na Fazenda Shangri-lá
      em Corumbá de Goiás, sendo consagrantes os Reverendíssimos Bispos Dom ++ Osiel Luiz Santos (Nome Apostólico
      Dom ++ João Paulo) da Igreja Católica Apostólica Libertadora e Dom ++ Dirceu Falcão Ibaldo da Igreja Anglicana
      Ortodoxa no Brasil Diocese Sul Brasileira.
  - source: cont-iaob-home
    quote: >-
      Rev. Adolfo quando presidiu o COPIEB Concilio Presbiteriano de Igrejas Evangélicas do Brasil no Distrito Federal,
      recebeu por imposição das mãos dos ministros do referido Concilio o título de Bispo, porém sem sucessão apostólica.
  - source: cant-novas-igrejas-2024
    quote: >-
      A fundação da Igreja foi precedida pela sagração ao episcopado do bispo Adolfo Batista, ocorrida em 12 de
      Janeiro de 2013, através da imposição das mãos do Bispo Josué Souza Torres, Primaz da Igreja Episcopal do
      Evangelho Pleno, tendo como cosagrantes os bispos Osiel Luiz Santos da Igreja Católica Apostólica Libertadora
      e Dirceu Falcão Ibaldo
  - source: cant-novas-igrejas-2024
    quote: >-
      o ministro recebeu, por imposição de mãos de outros ministros daquele concílio, o título de bispo – contudo,
      sem linhagem de sucessão apostólica.
    page: '131'
  discrepancies:
  - field: jurisdiction
    value: copieb
    sources:
    - source: cant-novas-igrejas-2024
      quote: >-
        o ministro recebeu, por imposição de mãos de outros ministros daquele concílio, o título de bispo – contudo,
        sem linhagem de sucessão apostólica.
      page: '131'
  - field: jurisdiction
    value: iaob-2013
    sources:
    - source: cant-novas-igrejas-2024
      quote: >-
        A fundação da Igreja foi precedida pela sagração ao episcopado do bispo Adolfo Batista, ocorrida em 12 de
        Janeiro de 2013, através da imposição das mãos do Bispo Josué Souza Torres, Primaz da Igreja Episcopal do
        Evangelho Pleno, tendo como cosagrantes os bispos Osiel Luiz Santos da Igreja Católica Apostólica Libertadora
        e Dirceu Falcão Ibaldo
      page: '131'
  notes: >-
    RESPOSTA À DÚVIDA: a sagração de 12/01/2013 foi por Josué Sousa Torres como Primaz da IEEP (Igreja Episcopal
    do Evangelho Pleno), com Osiel Luiz Santos (ICALib) e Dirceu Falcão Ibaldo (IAOB Sul) como consagrantes, em
    Corumbá de Goiás — NÃO pelo COPIEB. O COPIEB (Concílio Presbiteriano) é outro evento, anterior: o título de
    'bispo' conferido por ministros presbiterianos 'sem sucessão apostólica' (fonte: o próprio site da IAOB). A
    jurisdição do ato é a IEEP; a IAOB como instituição é fundada depois (assembleia de 20/04/2014 segundo Cant
    2024; Costa 2021 fala em janeiro de 2013), embora o site da IAOB chame o local de 'sede provisória da IAOB'
    e Dirceu Falcão Ibaldo de bispo da 'IAOB Diocese Sul Brasileira' já em 2013. Título de bispo conferido por imposição
    de mãos de ministros do COPIEB, 'sem linhagem de sucessão apostólica'; data não informada. Precedeu a fundação
    da IAOB (20/04/2014). Osiel Luiz Santos era da Igreja Católica Apostólica Libertadora; Dirceu Falcão Ibaldo,
    primaz da Congregação Missionária de Tradição Anglicana (Santa Maria, RS).
