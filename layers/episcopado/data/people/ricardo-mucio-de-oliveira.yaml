    quote: >-
      o Rev. Ricardo Múcio, com a Paróquia do Parnamirim, regressa à Igreja Presbiteriana do Brasil – IPB. Um cisma
      tríplice.
  notes: >-
    Local: Diocese do Recife, Paróquia do Parnamirim. Voltou em 2002 à Igreja Presbiteriana do Brasil com a Paróquia
    do Parnamirim.
- jurisdiction: ieab-dar
  role: priest
  end: '2002'
  end_reason: left
  status: probable
