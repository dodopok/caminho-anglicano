  date: '1999-07-31'
  description: >-
    Recepção de quatro ministros oriundos de outras denominações, ordenados diáconos em 31/07/1999 após período
    de retreinamento e cumprimento dos requisitos canônicos: Severino Abel (ex-capuchinho) e três ex-pastores presbiterianos,
    entre eles Luiz Marcos e Jorge Aquino.
  status: probable
  sources:
  - source: d2s28-m15
