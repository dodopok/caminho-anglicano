# yaml-language-server: $schema=../../schemas/person.json
id: ricardo-mucio-de-oliveira
name: Ricardo Múcio de Oliveira
aliases:
- Ricardo Mácio
biography: >-
  Ricardo Múcio de Oliveira foi ordenado diácono em 31 de julho de 1999 por Robinson Cavalcanti, atuou como presbítero
  na Diocese Anglicana do Recife e em 2002 retornou com a Paróquia do Parnamirim à Igreja Presbiteriana do Brasil.
sources:
- source: rcor-drv-ord-ose-1999
  quote: ORDENAÇÃO DE DIÁCONOS E INSTITUIÇÃO DA ORDEM EVANGÉLICA DE SANTO ESTEVÃO MÁRTIR - 31/07/99.
- source: rcor-drv-ord-ose-1999
  quote: >-
    Os outros três ordinandos são todos ex-pastores presbiterianos. Ricardo Múcio conheço há mais de 20 anos
- source: rta-ier-clero-2002
  quote: Ricardo Múcio De Oliveira (12/02)
- source: drp2-memorias-decada-vii
  quote: >-
    o Rev. Ricardo Múcio, com a Paróquia do Parnamirim, regressa à Igreja Presbiteriana do Brasil – IPB. Um cisma
    tríplice.
- source: d2s25-cismas
  quote: >-
    O Rev. Ricardo Mácio sai com a Paróquia de Casa Forte para se tornarem “independentes”. Leigos informam que
    assinaram a desfiliação sem saber exatamente do que se tratava.
- source: d2s28-m15
  quote: Os outros três ordinandos são todos ex-pastores presbiterianos
ordinations:
- order: diaconate
  date: '1999-07-31'
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-ord-ose-1999
    quote: ORDENAÇÃO DE DIÁCONOS E INSTITUIÇÃO DA ORDEM EVANGÉLICA DE SANTO ESTEVÃO MÁRTIR - 31/07/99.
  - source: rcor-drv-ord-ose-1999
    quote: >-
      Os outros três ordinandos são todos ex-pastores presbiterianos. Ricardo Múcio conheço há mais de 20 anos
  notes: >-
    Ordenação diaconal de quatro 'ministros em trânsito' vindos de outras denominações (Severino Abel, ex-capuchinho;
    Ricardo Múcio, Luiz Marcos e Jorge Aquino, ex-presbiterianos), no culto em que se instituiu a Ordem de Santo
    Estêvão. O pregador fala como bispo diocesano ('Em 17 meses do nosso episcopado'), isto é, Robinson Cavalcanti.
    Local não informado (o texto menciona 'esta catedral').
