events:
- type: other
  date: '2005-06-27'
  description: >-
    Em carta de 27/06/2005 ao arcebispo de Cantuária e aos primazes, a Diocese Anglicana do Recife (Robinson Cavalcanti
    e Maurício R. Fernandes Coelho, presidente do Conselho Diocesano) pede a revogação da deposição do bispo diocesano,
    a transferência da diocese a outra província, a criação de um arcediagado especial não territorial para a minoria
    e uma comissão bilateral; afirma que o Primaz depôs o bispo antes de qualquer ação do Painel de Referência e
    convoca Concílio Extraordinário para 6 de agosto.
  status: confirmed
  sources:
  - source: drv-carta-cantuaria
    quote: Recife, 27 de junho de 2005.
  - source: drv-carta-cantuaria
    quote: >-
      e depôs o Bispo Diocesano do Recife antes que qualquer ação do Painel de Referência pudesse ser tomada
  - source: drv-carta-cantuaria
    quote: Revogação imediata da deposição do Bispo Diocesano
- type: other
  date: 2003-07
  description: >-
    Em julho de 2003, Dom Robinson Cavalcanti levou sete clérigos e ministros leigos da Diocese do Recife à Consulta
    da EFAC em Limuru, Quênia.
  status: confirmed
  sources:
  - source: drp2-memorias-decada-viii
    quote: >-
      Em julho de 2003, sete clérigos e Ministros Leigos (Reverendos: Maurício Coelho, Siméa Meldrum, Estevão Menezes,
      Jorge Aquino e Fábio Vasconcelos, Gustavo Gilson e a ML Roberta Araújo) foram comigo a Limuru, Quênia, África,
      para participar da Consulta da EFAC
- type: other
  date: 2004-12
  description: >-
    Em dezembro de 2004, três dias antes do Concílio Diocesano do Recife, o Primaz Orlando Santos de Oliveira decretou
    sua suspensão; os delegados, reunidos em assembleia presidida pelo Rev. Maurício Coelho (presidente do Conselho
    Diocesano), decidiram realizá-lo, e o Concílio apelou ao Arcebispo de Cantuária e aos Primazes por 'Supervisão
    Primacial Alternativa Com Jurisdição'.
  status: confirmed
  sources:
  - source: drp2-memorias-decada-ix
    quote: >-
      Três dias antes (com despesas feitas e pastas dos delegados prontas) o Primaz, Dom Orlando, outra vez sem
      base legal, decreta a sua suspensão.
  - source: drp2-memorias-decada-ix
    quote: >-
      Uma assembléia diocesana é instalada, dirigida pelo presidente do Conselho Diocesano, Rev. Maurício Coelho.
  - source: drp2-memorias-decada-ix
    quote: >-
      O Concílio delibera apelar para o Arcebispo de Cantuária e para os Primazes da Comunhão Anglicana, pedindo
      uma “Supervisão Primacial Alternativa Com Jurisdição”.
