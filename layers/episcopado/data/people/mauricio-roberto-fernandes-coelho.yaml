- type: other
  date: 2004-12
  description: >-
    Em dezembro de 2004, três dias antes do Concílio Diocesano do Recife, o Primaz Orlando Santos de Oliveira decretou
    sua suspensão; os delegados, reunidos em assembleia presidida pelo Rev. Maurício Coelho (presidente do Conselho
    Diocesano), decidiram realizá-lo, e o Concílio apelou ao Arcebispo de Cantuária e aos Primazes por 'Supervisão
    Primacial Alternativa Com Jurisdição'.
  status: confirmed
  sources:
  - source: drp2-memorias-decada-ix
    quote: >-
      Três dias antes (com despesas feitas e pastas dos delegados prontas) o Primaz, Dom Orlando, outra vez sem
      base legal, decreta a sua suspensão.
  - source: drp2-memorias-decada-ix
    quote: >-
      Uma assembléia diocesana é instalada, dirigida pelo presidente do Conselho Diocesano, Rev. Maurício Coelho.
  - source: drp2-memorias-decada-ix
    quote: >-
      O Concílio delibera apelar para o Arcebispo de Cantuária e para os Primazes da Comunhão Anglicana, pedindo
      uma “Supervisão Primacial Alternativa Com Jurisdição”.
- type: other
  date: 2004-12
  description: >-
    O XXIV Sínodo (Concílio) Diocesano da Diocese Anglicana do Recife aprovou, por maioria de delegados clérigos
    e leigos, carta ao Arcebispo de Cantuária e aos Primazes pedindo que a diocese fosse considerada em estado de
    emergência, com suspensão provisória de seus vínculos com a liderança provincial da IEAB, e solicitando supervisão
    episcopal alternativa adequada, com plena jurisdição, de um primaz de outra Província. A carta, assinada por
    Robinson Cavalcanti (bispo diocesano) e Maurício R. F. Coelho (presidente do Conselho Diocesano), cita a "supervisão
    episcopal alternativa" imposta a clérigos e paróquias, a suspensão dos recursos da JUNET, o processo disciplinar
    contra o bispo diocesano e a tentativa do Primaz de suspender o sínodo por decreto.
  status: probable
  sources:
  - source: darl2-open-letter
    quote: >-
      The Anglican Diocese of Recife, of the Episcopal Anglican Church of Brazil (19 th . Province of the Anglican
      Communion) convened in its XXIV Diocesan Synod, hereby makes an official communication of its deliberations
  - source: darl2-open-letter
    quote: >-
      To consider the Anglican Diocese of Recife as currently in a state of emergency, and to suspend, in exceptional
      and provisory character, its bonds with the ecclesiastical power-base which drives this Province.
  - source: darl2-open-letter
    quote: >-
      so as to honour and approve our request for an Alternative Adequate Episcopal Supervision (of a Primate) with
      full jurisdiction, to be exercised by the Primate of a different Province, in common agreement.
- type: other
  date: '2009-07-31'
  description: >-
