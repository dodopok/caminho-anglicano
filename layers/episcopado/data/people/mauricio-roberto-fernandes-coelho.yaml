# yaml-language-server: $schema=../../schemas/person.json
id: mauricio-roberto-fernandes-coelho
name: Maurício Roberto Fernandes Coelho
biography: Presidente do Conselho Diocesano em 2005.
sources:
- source: drp-carta-venables-pt-2005
  quote: Rev. Maurício Roberto Fernandes Coelho – Presidente do Conselho Diocesano
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Maurício R. Fernandes Coelho
  - source: drv-nota-esclarecimento-2006
    quote: Maurício R. Fernandes Coelho
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Maurício Roberto Fernandes Coelho … Os clérigos não atenderam
      à convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: vigário geral
  start: 2006-02
  status: confirmed
  sources:
  - source: drp2-breves-02-2006
    quote: >-
      O Bispo Diocesano, no uso de suas atribuições, resolveu designar para o cargo de confiança de Vigário Geral
      Diocesano o Rev. Maurício Roberto Fernandes Coelho
  notes: >-
    Na mesma época, no terceiro mandato anual como presidente do Conselho Diocesano e indicado ao Cabido da Catedral
    do Bom Samaritano.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: pároco
  start: '2008-06-08'
  status: confirmed
  sources:
  - source: drp2-instituicao-paroco-gravata-2008
    quote: Gravatá (PE), 08 de junho de 2008
  - source: drp2-instituicao-paroco-gravata-2008
    quote: >-
      nós declaramos e proclamamos que o Rev. Maurício Coelho é o novo Pároco da Paróquia Anglicana Gravatá, da
      Diocese do Recife, no Arcediagado Centro.
  notes: >-
    Local: Paróquia Anglicana Gravatá (Arcediagado Centro). Nomeado pelo bispo diocesano Dom Robinson Cavalcanti
    e instituído pelo arcediago Fred Souto.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: presidente_conselho_diocesano
  status: confirmed
  sources:
  - source: drp-carta-venables-pt-2005
    quote: Rev. Maurício Roberto Fernandes Coelho – Presidente do Conselho Diocesano
  - source: drv-carta-clero-primaz
    quote: Rev. Maurício Roberto Fernandes Coelho – Presidente do Conselho Diocesano
  notes: >-
    Assina a carta a Venables (17/10/2005) como presidente do Conselho Diocesano. Cargo exercido em julho de 2007
    (carta do clero ao primaz do Cone Sul); início e fim não informados.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Maurício Roberto Fernandes Coelho … Recife, 23 de agosto
      de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
