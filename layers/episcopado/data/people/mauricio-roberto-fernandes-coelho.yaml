biography: >-
  Clérigo da Diocese Anglicana do Recife, foi arcediago do Arcediagado Sul, pároco da Paróquia Anglicana Jardim
  das Oliveiras e várias vezes presidente do Conselho Diocesano, função em que presidiu a assembleia diocesana de
  dezembro de 2004. Em 23 de agosto de 2005, foi incluído entre os clérigos excluídos da comunhão da IEAB e das
  ordens por resolução da Igreja, mas declarou manter comunhão com o bispo Robinson Cavalcanti. Em fevereiro de
  2006, foi designado vigário geral diocesano; em 8 de junho de 2008, foi instituído pároco da Paróquia Anglicana
  de Gravatá, e em 21 de agosto de 2010 recebeu o título de arcipreste, passando a pároco emérito. Também atuou
  como arcediago adjunto do Arcediagado Centro, assessor diocesano de relações internacionais e secretário administrativo.
