    criada por recomendação do Encontro do Clero para encaminhar um status estável da Diocese do Recife na Comunhão
    Anglicana; integram-na Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente do Conselho
    Diocesano) e os arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório e Carlos Alberto
    Fernandes
  status: confirmed
  sources:
  - source: darn2-comissao-2009
    quote: >-
      o Bispo Diocesano, Dom Robinson Cavalcanti, deu posse à Comissão Especial de Assessoria Institucional criada
      por recomendação do recente Encontro do Clero, visando os encaminhamentos necessários a um status estável
      para a Diocese do Recife na Comunhão Anglicana
  - source: darn2-comissao-2009
    quote: >-
      Integram essa comissão os reverendos Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente
      do Conselho Diocesano) e os Arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório
      e Carlos Alberto Fernandes
- type: other
  date: 2009-11
  description: >-
    A Diocese de Springfield (TEC), liderada pelo bispo Peter Beckwith, renova por unanimidade em seu sínodo o status
    de Diocese Companheira da Diocese do Recife, vínculo de cinco anos; o rev. Maurício Coelho representa a Diocese
    do Recife e oficializa o status de Paróquias Companheiras entre Gravatá (PE) e High Springs (Flórida)
  status: confirmed
  sources:
  - source: darn2-springfield-2009
    quote: >-
      deliberou, por unanimidade, renovar o seu status de Diocese Companheira com a Diocese do Recife, vínculo fraterno
      que já dura há cinco anos
  - source: darn2-springfield-2009
    quote: >-
      Representou a Diocese do Recife naquele evento o reverendo Maurício Coelho , que também oficializou o status
      de Paróquia Companheira entre Gravatá, Pernambuco e High Springs, Flórida
- type: other
  date: '2004-06-25'
  description: >-
    Em 25/06/2004 os arcediagos da DAR (Maurício Coelho, Quintino Orengo, Maria Gorete Marques e Luiz Souza de França)
    enviaram carta aberta ao Primaz da IEAB, Dom Orlando Santos de Oliveira, repudiando o texto da Comissão Especial
    designada por ele para estudar a conjuntura eclesial, no que se referia ao bispo diocesano do Recife.
  status: confirmed
  sources:
  - source: darl3-primaz-0406
    quote: >-
      vimos por meio desta explicitar de forma indignada nosso público repúdio às palavras injuriosas contidas no
      citado documento
  - source: darl3-primaz-0406
    quote: Recife, 25 de junho de 2004.
- type: other
  date: '2005-02-26'
  description: >-
    Em 26/02/2005, na Paróquia Anglicana Jardim das Oliveiras (Setúbal, Recife), reuniu-se o Concílio Diocesano
    Extraordinário da DAR, com 32 delegados clericais, 58 delegados laicos e 15 observadores representando 35 paróquias,
    missões e pontos missionários; aprovou a "Carta de Setúbal", que rejeitou as Resoluções 001/2005 e 002/2005
    do Primaz da IEAB, reconheceu Robinson Cavalcanti como bispo diocesano, suspendeu por tempo indeterminado o
    relacionamento com a direção da IEAB e apelou aos Instrumentos de Unidade da Comunhão Anglicana por "Supervisão
    Episcopal Primacial Adequada Alternativa com Jurisdição".
  status: confirmed
  sources:
  - source: darl3-setubal
    quote: >-
      Nós, 32 delegados clericais, 58 delegados laicos e 15 observadores, representando 35 Paróquias, Missões e
      Pontos Missionários, reunidos em Concílio Diocesano Extraordinário da Diocese Anglicana do Recife, no dia
      vinte e seis do mês de fevereiro do ano graça do Nosso Senhor Jesus Cristo de dois mil e cinco
  - source: darl3-setubal
    quote: >-
      continuamos, fortemente determinados, por unanimidade, a reconhecer o Revmo. Bispo Dom Edward Robinson de
      Barros Cavalcanti como nosso Bispo Diocesano
  - source: darl3-setubal
    quote: >-
      o apelo aos Instrumentos de Unidade da Comunhão Anglicana, por uma “Supervisão Episcopal Primacial Adequada
      Alternativa com Jurisdição”
