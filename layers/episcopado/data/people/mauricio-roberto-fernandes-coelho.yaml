events:
- type: other
  date: '2005-06-27'
  description: >-
    Em carta de 27/06/2005 ao arcebispo de Cantuária e aos primazes, a Diocese Anglicana do Recife (Robinson Cavalcanti
    e Maurício R. Fernandes Coelho, presidente do Conselho Diocesano) pede a revogação da deposição do bispo diocesano,
    a transferência da diocese a outra província, a criação de um arcediagado especial não territorial para a minoria
    e uma comissão bilateral; afirma que o Primaz depôs o bispo antes de qualquer ação do Painel de Referência e
    convoca Concílio Extraordinário para 6 de agosto.
  status: confirmed
  sources:
  - source: drv-carta-cantuaria
    quote: Recife, 27 de junho de 2005.
  - source: drv-carta-cantuaria
    quote: >-
      e depôs o Bispo Diocesano do Recife antes que qualquer ação do Painel de Referência pudesse ser tomada
  - source: drv-carta-cantuaria
    quote: Revogação imediata da deposição do Bispo Diocesano
- type: other
  date: 2003-07
  description: >-
    Em julho de 2003, Dom Robinson Cavalcanti levou sete clérigos e ministros leigos da Diocese do Recife à Consulta
    da EFAC em Limuru, Quênia.
  status: confirmed
  sources:
  - source: drp2-memorias-decada-viii
    quote: >-
      Em julho de 2003, sete clérigos e Ministros Leigos (Reverendos: Maurício Coelho, Siméa Meldrum, Estevão Menezes,
      Jorge Aquino e Fábio Vasconcelos, Gustavo Gilson e a ML Roberta Araújo) foram comigo a Limuru, Quênia, África,
      para participar da Consulta da EFAC
- type: other
  date: 2004-12
  description: >-
    Em dezembro de 2004, três dias antes do Concílio Diocesano do Recife, o Primaz Orlando Santos de Oliveira decretou
    sua suspensão; os delegados, reunidos em assembleia presidida pelo Rev. Maurício Coelho (presidente do Conselho
    Diocesano), decidiram realizá-lo, e o Concílio apelou ao Arcebispo de Cantuária e aos Primazes por 'Supervisão
    Primacial Alternativa Com Jurisdição'.
  status: confirmed
  sources:
  - source: drp2-memorias-decada-ix
    quote: >-
      Três dias antes (com despesas feitas e pastas dos delegados prontas) o Primaz, Dom Orlando, outra vez sem
      base legal, decreta a sua suspensão.
  - source: drp2-memorias-decada-ix
    quote: >-
      Uma assembléia diocesana é instalada, dirigida pelo presidente do Conselho Diocesano, Rev. Maurício Coelho.
  - source: drp2-memorias-decada-ix
    quote: >-
      O Concílio delibera apelar para o Arcebispo de Cantuária e para os Primazes da Comunhão Anglicana, pedindo
      uma “Supervisão Primacial Alternativa Com Jurisdição”.
- type: other
  date: 2004-12
  description: >-
    O XXIV Sínodo (Concílio) Diocesano da Diocese Anglicana do Recife aprovou, por maioria de delegados clérigos
    e leigos, carta ao Arcebispo de Cantuária e aos Primazes pedindo que a diocese fosse considerada em estado de
    emergência, com suspensão provisória de seus vínculos com a liderança provincial da IEAB, e solicitando supervisão
    episcopal alternativa adequada, com plena jurisdição, de um primaz de outra Província. A carta, assinada por
    Robinson Cavalcanti (bispo diocesano) e Maurício R. F. Coelho (presidente do Conselho Diocesano), cita a "supervisão
    episcopal alternativa" imposta a clérigos e paróquias, a suspensão dos recursos da JUNET, o processo disciplinar
    contra o bispo diocesano e a tentativa do Primaz de suspender o sínodo por decreto.
  status: probable
  sources:
  - source: darl2-open-letter
    quote: >-
      The Anglican Diocese of Recife, of the Episcopal Anglican Church of Brazil (19 th . Province of the Anglican
      Communion) convened in its XXIV Diocesan Synod, hereby makes an official communication of its deliberations
  - source: darl2-open-letter
    quote: >-
      To consider the Anglican Diocese of Recife as currently in a state of emergency, and to suspend, in exceptional
      and provisory character, its bonds with the ecclesiastical power-base which drives this Province.
  - source: darl2-open-letter
    quote: >-
      so as to honour and approve our request for an Alternative Adequate Episcopal Supervision (of a Primate) with
      full jurisdiction, to be exercised by the Primate of a different Province, in common agreement.
- type: other
  date: '2009-07-31'
  description: >-
    O bispo diocesano Robinson Cavalcanti dá posse, em 31/07/2009, à Comissão Especial de Assessoria Institucional,
    criada por recomendação do Encontro do Clero para encaminhar um status estável da Diocese do Recife na Comunhão
    Anglicana; integram-na Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente do Conselho
    Diocesano) e os arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório e Carlos Alberto
    Fernandes
  status: confirmed
  sources:
  - source: darn2-comissao-2009
    quote: >-
      o Bispo Diocesano, Dom Robinson Cavalcanti, deu posse à Comissão Especial de Assessoria Institucional criada
      por recomendação do recente Encontro do Clero, visando os encaminhamentos necessários a um status estável
      para a Diocese do Recife na Comunhão Anglicana
  - source: darn2-comissao-2009
    quote: >-
      Integram essa comissão os reverendos Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente
      do Conselho Diocesano) e os Arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório
      e Carlos Alberto Fernandes
- type: other
  date: 2009-11
  description: >-
    A Diocese de Springfield (TEC), liderada pelo bispo Peter Beckwith, renova por unanimidade em seu sínodo o status
    de Diocese Companheira da Diocese do Recife, vínculo de cinco anos; o rev. Maurício Coelho representa a Diocese
    do Recife e oficializa o status de Paróquias Companheiras entre Gravatá (PE) e High Springs (Flórida)
  status: confirmed
  sources:
  - source: darn2-springfield-2009
    quote: >-
      deliberou, por unanimidade, renovar o seu status de Diocese Companheira com a Diocese do Recife, vínculo fraterno
      que já dura há cinco anos
  - source: darn2-springfield-2009
    quote: >-
      Representou a Diocese do Recife naquele evento o reverendo Maurício Coelho , que também oficializou o status
      de Paróquia Companheira entre Gravatá, Pernambuco e High Springs, Flórida
