events:
- type: other
  date: '2004-06-25'
  description: >-
    Em 25/06/2004 os arcediagos da DAR (Maurício Coelho, Quintino Orengo, Maria Gorete Marques e Luiz Souza de França)
    enviaram carta aberta ao Primaz da IEAB, Dom Orlando Santos de Oliveira, repudiando o texto da Comissão Especial
    designada por ele para estudar a conjuntura eclesial, no que se referia ao bispo diocesano do Recife.
  status: confirmed
  sources:
  - source: darl3-primaz-0406
    quote: >-
      vimos por meio desta explicitar de forma indignada nosso público repúdio às palavras injuriosas contidas no
      citado documento
  - source: darl3-primaz-0406
    quote: Recife, 25 de junho de 2004.
- type: other
  date: 2003-12
  description: >-
    Concílio Diocesano da Diocese Anglicana do Recife (provavelmente o de dezembro de 2003) recebeu documentos de
    16 paróquias e missões com abaixo-assinado de mais de 800 membros em plena comunhão, que apoiavam o bispo diocesano,
    o bispo sufragâneo e o Conselho Diocesano, em especial a 'Afirmação do Recife' e a Resolução 1.10 de Lambeth
    (1998), conforme carta de arcediagos e do deão de 25/06/2004.
  status: probable
  sources:
  - source: darl3-primaz-0406
    quote: >-
      quando foi-lhe entregue solenemente documentos oriundos de 16 paróquias e missões contendo um "abaixo-assinado"
      com mais de 800 assinaturas de membros em plena comunhão dessas comunidades diocesanas
  - source: darl3-primaz-0406
    quote: >-
      hipotecamos o mais amplo e sólido apoio às posturas e deliberações do nosso bispo diocesano, bispo sufragâneo
      e Conselho Diocesano
- type: other
  date: '2004-02-15'
  description: >-
    Em 15/02/2004, na Paróquia da Santíssima Trindade (Recife), a 'Catedral no exílio', realizou-se a reorganização
    e instalação do Cabido da catedral, com a instituição do Cônego Quintino Orengo e o retorno do Cônego Washington
    Franco à atividade ministerial. O bispo diz que o templo da catedral está 'ocupado pelos invasores' (posição
    do bispo diocesano), que a diocese tinha 55 diáconos ordenados em seis anos e meio, 35 ministros leigos e cerca
    de 80 seminaristas na região, e registra a inauguração recente do Campus de João Pessoa (mais de 30 estudantes
    matriculados).
  status: confirmed
  sources:
  - source: d2s29-m44
    quote: >-
      A reorganização e instalação do seu Cabido implicam em uma continuidade no papel histórico dessa congregação
      pioneira, como Sé Episcopal
  - source: d2s29-m44
    quote: >-
      Gostaria de estender o meu abraço ao Cônego Washington Franco, por seu retorno à atividade ministerial, e
      ao novo Cônego, ora instalado, Venerável Rev. Quintino Orengo
  - source: d2s29-m44
    quote: Esta amada Catedral vive o seu exílio, com o seu templo ocupado pelos invasores.
