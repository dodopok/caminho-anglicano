# yaml-language-server: $schema=../../schemas/person.json
id: quintino-jose-orengo-da-silva
name: Quintino José Orengo da Silva
biography: Arcediago em 2004, cônego em 2005 e 2007; pároco da Paróquia do Semeador em 2006.
sources:
- source: drp-calendario-2004
  quote: Ven. Arced. Rev. Quintino José Orengo da Silva
- source: drp-carta-venables-pt-2005
  quote: Rev. Côn. Quintino José O. da Silva
ordinations:
- order: diaconate
  date: '2001-12-29'
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: ORDENAÇÕES DIACONAIS - 29/12/2001 (Karla, Lilian e Quintino)
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: Hoje recebem o diaconato, ordem para o serviço
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: Vocês sabem que não me chamo Edmund ou Clóvis, mas Robinson.
  notes: >-
    Sermão assinado por Dom Robinson Cavalcanti, bispo diocesano. Quintino foi ordenado presbítero em 30/11/2002.
- order: presbyterate
  date: '2002-11-30'
  place: Paróquia Anglicana da Ressurreição, João Pessoa-PB
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-costa-quintino-2002
    quote: Paróquia Anglicana da Ressurreição João Pessoa / PB – 30/11/2002
  - source: rcor-drv-costa-quintino-2002
    quote: >-
      Fostes provado e aprovado como diácono. Hoje te tornarás sacerdote para sempre, como um presbítero da Igreja.
  - source: rcor-drv-costa-quintino-2002
    quote: Como bispo, e em nome da Diocese, espero a fidelidade e a coerência de vocês
  notes: Sermão do bispo diocesano (Robinson Cavalcanti) na ordenação presbiteral do Rev. Quintino Orengo.
affiliations:
- jurisdiction: ieab
  role: other
  role_description: cônego
  diocese: ieab-dar
  start: '2004-02-15'
  status: confirmed
  sources:
  - source: rcor-drv-diac-daniel-fred
    quote: Instituição do Cônego Quintino Orengo
  - source: rcor-drv-diac-daniel-fred
    quote: ao novo Cônego, ora instalado, Venerável Rev. Quintino Orengo
  notes: >-
    Local: Catedral Anglicana da Santíssima Trindade. Instituído cônego na instalação do Cabido da Catedral.
- jurisdiction: ieab-dar
  role: other
  role_description: cônego
  start: '2004-02-15'
  status: confirmed
  sources:
  - source: drp2-ord-diac-daniel-fred-2004
    quote: Instalação do Cabido Instituição do Cônego Quintino Orengo
  - source: drp2-ord-diac-daniel-fred-2004
    quote: ao novo Cônego, ora instalado, Venerável Rev. Quintino Orengo
  notes: 'Local: Diocese do Recife, Cabido da Catedral da Santíssima Trindade.'
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Quintino José Orengo da Silva
  - source: drv-nota-esclarecimento-2006
    quote: Quintino José Orengo da Silva
  - source: drp-boletim-oracao-2006
    quote: Orar pela Paróquia Anglicana do Semeador; pelo Rev. Quintino
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Quintino José Orengo da Silva … Os clérigos não atenderam
      à convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Paróquia Anglicana do Semeador. Clérigo citado
    como pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão). Anexo
    R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti,
    ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005 é a da exclusão
    pela IEAB, e a adesão à DAR é anterior, sem data exata.
- jurisdiction: ieab-dar
  role: other
  role_description: arcediago
  status: confirmed
  sources:
  - source: drp-calendario-2004
    quote: Ven. Arced. Rev. Quintino José Orengo da Silva
  notes: >-
    Local: Diocese Anglicana do Recife. Título de arcediago atestado no calendário diocesano de 2004 (publicado
    em 2003). Em 2005 assina como cônego e em 2006 aparece como Rev. Quintino da Paróquia do Semeador.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: conego
  status: confirmed
  sources:
  - source: drp-carta-venables-pt-2005
    quote: Rev. Côn. Quintino José O. da Silva
  - source: drp-calendario-2007
    quote: Rev. Côn. Quintino José Orengo da Silva
  notes: >-
    Assina a carta a Venables (17/10/2005) como cônego. Título de cônego no calendário diocesano de 2007.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Quintino José Orengo da Silva … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: arcediago, cônego e clérigo da Paróquia Anglicana do Semeador
  status: probable
  sources:
  - source: darl2-compromisso-278
    quote: Ven. Arc. Côn. Rev. Quintino José Orengo da Silva
  - source: darl2-compromisso-278
    quote: Paróquia Anglicana do Semeador
  notes: Assinatura de artigo sem data própria; os títulos aparecem como "Ven. Arc. Côn.".
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: reitor da Paróquia Anglicana do Semeador
  status: confirmed
  sources:
  - source: darl2-novo-nasc-308
    quote: Quando o nosso Reitor, Rev. Quintino Orengo, me solicitou no domingo passado, para pregar hoje
  - source: darl2-novo-nasc-308
    quote: (*) Sermão entregue no dia 18 de março de 2007 na Paróquia Anglicana do Semeador.
  notes: Atestado em março de 2007 (sermão de 18/03/2007); início não informado.
