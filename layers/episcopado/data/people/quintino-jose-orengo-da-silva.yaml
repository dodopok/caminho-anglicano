id: quintino-jose-orengo-da-silva
name: Quintino José Orengo da Silva
aliases:
- Quintino Orengo
biography: >-
  Quintino José Orengo da Silva foi ordenado diácono em 29 de dezembro de 2001 e presbítero em 30 de novembro de
  2002, pelo bispo Robinson Cavalcanti, na Diocese Anglicana do Recife. Foi instituído cônego em 15 de fevereiro
  de 2004, atuou como arcediago do Arcediagado Centro e foi reitor da Paróquia Anglicana do Semeador. Em 25 de junho
  de 2004 integrou os arcediagos que enviaram carta aberta ao primaz da IEAB repudiando palavras de um documento,
  e em 23 de agosto de 2005 foi excluído da comunhão da IEAB e das Sagradas Ordens, com outros clérigos da diocese,
  que declararam manter comunhão com o bispo diocesano. Continuou na Diocese do Recife, como pároco do Semeador
  e membro da Comissão de Ministério.
