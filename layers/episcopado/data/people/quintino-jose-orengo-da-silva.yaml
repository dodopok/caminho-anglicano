ordinations:
- order: diaconate
  date: '2001-12-29'
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: ORDENAÇÕES DIACONAIS - 29/12/2001 (Karla, Lilian e Quintino)
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: Hoje recebem o diaconato, ordem para o serviço
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: Vocês sabem que não me chamo Edmund ou Clóvis, mas Robinson.
  - source: d2s29-m27
    quote: ORDENAÇÕES DIACONAIS - 29/12/2001 (Karla, Lilian e Quintino)
  - source: d2s29-m27
    quote: Hoje recebem o diaconato, ordem para o serviço, a renúncia, a doação
  notes: >-
    Sermão assinado por Dom Robinson Cavalcanti, bispo diocesano. Quintino foi ordenado presbítero em 30/11/2002.
    Ordenações diaconais de Karla, Lilian e Quintino, citados só pelo primeiro nome. A identificação de Quintino
    com Quintino Orengo (ordenado presbítero em 30/11/2002 e que no sermão daquele dia é lembrado como diácono 'provado
    e aprovado') é provável, não declarada na página. O bispo, nesse sermão, define como desafios da diocese a 'sanidade',
    a 'ortodoxia' e a 'santidade' e diz aos ordinandos que 'não me chamo Edmund ou Clóvis, mas Robinson'. O texto
    é o sermão do bispo diocesano, que fala em primeira pessoa como quem confere a ordem; a página não traz assinatura,
    e o bispo diocesano em exercício era Robinson Cavalcanti (instalado em 19/10/1997).
