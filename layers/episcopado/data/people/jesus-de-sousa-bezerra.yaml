biography: >-
  Jesus de Sousa Bezerra foi ordenado diácono em maio de 1958, por Egmont Krischke, e presbítero em agosto de 1960,
  por Plínio Lauer Simões, no Distrito Missionário do Sul do Brasil, e foi transferido para a Igreja Episcopal do
  Brasil em 25 de abril de 1965.
