biography: >-
  Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra) segundo o Clerical Directory 1965. Nascido em Marcelino
  Ramos, RGS, Brasil (1927-01-09). Ordenado diácono em ago/1957 e presbítero em jun/1959. Transferido para a Igreja
  Episcopal do Brasil em 25/04/1965 (Clerical Directory 1968).
