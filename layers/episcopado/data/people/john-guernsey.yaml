id: john-guernsey
name: John Guernsey
biography: >-
  Sagrado bispo em setembro de 2007 por Henry Orombi, em Mbarara (Uganda), para congregações dos EUA, era reitor
  da Paróquia de All Saints, na Virgínia; foi co-sagrante de Stephen Dwain Wood.
sources:
- source: darl3-n4213
  quote: >-
    A Igreja Anglicana de Uganda sagrou um ministro norte-americano como Bispo para liderar algumas congregações
    daquele país que se opõem ao homossexualismo
- source: darl3-n4213
  quote: O Arcebispo Henri Orombi presidiu a cerimônia na Catedral de St. James, Ruharo, em Mbarara
- source: darl3-n4213
  quote: O novo Bispo, Rev. John Guernsey é Reitor da Paróquia de All Saints, na Virgínia, EUA
- source: gacl-acna-wood-bio
  quote: >-
    Archbishop Wood was elected as the first Bishop of the Diocese of the Carolinas by the College of Bishops on
    June 5, 2012. He was consecrated Bishop at St. Andrew’s Anglican Church in Mt. Pleasant, SC by Archbishop Robert
    Duncan on August 25, 2013. Co-Consecrators included ACNA Bishops Roger Ames, Alphonza Gadsen, and John Guernsey.
ordinations:
- order: episcopate
  date: 2007-09
  place: Catedral de St. James, Ruharo, Mbarara (Uganda)
  jurisdiction: cou
  office: missionary
  principal_consecrator: henry-orombi
  co_consecrators:
  - robinson-cavalcanti
  status: confirmed
  sources:
  - source: darl3-n4213
    quote: >-
      A Igreja Anglicana de Uganda sagrou um ministro norte-americano como Bispo para liderar algumas congregações
      daquele país que se opõem ao homossexualismo
  - source: darl3-n4213
    quote: O Arcebispo Henri Orombi presidiu a cerimônia na Catedral de St. James, Ruharo, em Mbarara
  - source: darl3-n4213
    quote: O novo Bispo, Rev. John Guernsey é Reitor da Paróquia de All Saints, na Virgínia, EUA
  - source: darl3-n4219
    quote: >-
      Agora fui ao Quênia e Uganda participar da Sagração episcopal de alguns amigos e companheiros de luta, como
      bispos missionários a congregações Anglicanas de linha ortodoxa nos Estados Unidos: Bill Attwood, Bill Murdoch
      e John Guernesey
  notes: >-
    Sagrado pela Igreja Anglicana de Uganda para liderar comunidades norte-americanas (33 congregações); a notícia
    reproduz o Daily Monitor de 03/09/2007, sem dar o dia. Entre os sessenta bispos co-sagrantes estava Dom Robinson
    Cavalcanti; assistiram 4 primazes (Cone Sul: Gregory Venables; Quênia: Benjamin Nzimbi; Ruanda: Emmanuel Kolini).
events:
- type: other
  date: '2010-10-19'
  description: >-
    No Congresso Lausanne III (Cidade do Cabo), realiza-se em 19/10/2010 uma reunião sobre a crise da Comunhão Anglicana
    com os primazes Henri Orombi (Uganda), Mouneer Anis (Oriente Médio), John Chew (Sudeste da Ásia) e Robert Duncan
    (ACNA); Robinson Cavalcanti descreve a reunião como de caráter analítico e prospectivo. No mesmo dia ele relata
    ter encontrado Duncan e os bispos Bill Murdock e John Guernsey, além de Chris Sugden, que representava também
    a FCA.
  status: confirmed
  sources:
  - source: d2s13-viagem-v
    quote: >-
      Seguiu-se uma reunião bem concorrida e especial sobre a crise da Comunhão Anglicana, com os Primazes Orombi
      (Uganda), Anis (Oriente Médio), Chew (Sudeste da Ásia) e Duncan (ACNA).
  - source: d2s13-viagem-v
    quote: >-
      Um dia bem puxado, mas com muito conteúdo, além do valor da reunião dos anglicanos, por seu caráter analítico
      e prospectivo.
  - source: d2s13-viagem-iv
    quote: bem como o Primaz da ACNA Robert Duncan e os Bispos Bill Murdock e John Guernesey
  - source: d2s13-viagem-iv
    quote: representando, também, a FCA – Fraternidade dos Anglicanos Evangélicos
