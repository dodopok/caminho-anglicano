    Anglicana do Recife em dissenso com o bispo Robinson Cavalcanti, nomeando o bispo Maurício Andrade (Brasília)
    supervisor; o bispo sufragâneo Filadelfo Oliveira continua seu ministério na diocese
  status: confirmed
  sources:
