  notes: >-
    Sagrado junto com Franciney Pantoja. Eleito em 16/11/2015 pela Câmara Episcopal (então 'Administrador Diocesano
    da Diocese da Bahia' e, desde então, bispo eleito). Co-celebrantes (tratados como co-sagrantes): Ricardo Vicente
    dos Anjos e Orvandil Moreira Barbosa.
