# yaml-language-server: $schema=../../schemas/person.json
id: alfredo-dorea
name: Alfredo Dórea
full_name: Alfredo Souza Dorea
aliases:
- Alfredo Souza Dorea
- Dom Alfredo Souza Dorea
biography: >-
  Padre incardinado na IATB, na Diocese do Nordeste, em 15 de junho de 2014, foi eleito bispo em 16 de novembro
  de 2015 e sagrado em 17 de julho de 2016, em Cametá (PA), por Rui Costa Barbosa, como bispo diocesano da Bahia.
  Foi arcebispo provincial em exercício em 2017, empossado no cargo em 25 de janeiro de 2018, e ainda o era em 2021.
sources:
- source: lia-iatb-noticias-2014
  quote: >-
    Informa-nos o Revmo. Bispo Diocesano do Nordeste, Dom +Jorge dos Santos da incardinação do Padre Alfredo Dorea
    no domingo dia 15 de junho, Festa de Santo Antonio.
- source: lia-iatb-home-2015
  quote: >-
    após decisão unânime da Câmara Episcopal na data de 16 de novembro de 2015 eleger o Revmo Padre Alfredo Dorea
    para ser elevado ao Alto Grau do Episcopado em data a ser definida
- source: lia-iatb-home-2016-08
  quote: >-
    Encerrando o V Encontro Provincial da IATB realizou-se na cidade de Cametá-PA, no dia 17 de julho de 2016 às
    9:00 hs, nas dependências da UFPA, a ordenação episcopal e a sagração de dois noovos bispos
- source: lia-iatb-home-2016-08
  quote: >-
    a ordenação episcopal e a sagração de dois noovos bispos para a Igreja Indivisa de Cristo: Dom Franciney Pantoja,
    de Cametá-PA e Dom Alfredo Dorea, de Salvador-BA.
- source: lia-iatb-clero-2017
  quote: Revmº Dom Alfredo Souza Dorea Diocese da Bahia
- source: lia-iatb-home-2017-10
  quote: >-
    No dia 08 de abril de 2017, sábado, às 19:00 hs, o Revmo. Arcebispo Provincial em Exercício Dom Alfredo Dorea
    procedeu na cidade de Natal-RN a ordenação diaconal do agora Rev. Willians Portela Lima.
- source: lia-iatb-home-2018-12
  quote: >-
    o Arcebispo Dom Alfredo Souza Dorea foi canonicamente empossado no cargo de Arcebispo Provincial da Igreja Anglicana
    Tradicional do Brasil
- source: lia-iatb-home-2018-12
  quote: >-
    Em cerimônia presidida por Monsenhor Antônio Furtado Leite, bispo diocesano de Aracaju (ICAB) naquela cidade,
    ocorrida no dia 25 de janeiro de 2018, o Arcebispo Dom Alfredo Souza Dorea foi canonicamente empossado no cargo
    de Arcebispo Provincial da Igreja Anglicana Tradicional do Brasil
- source: lia-iatb-clerigos-2021
  quote: Arcebispo Provincial Dom Alfredo Souza Dorea Salvador-BA
ordinations:
- order: episcopate
  date: '2016-07-17'
  place: dependências da UFPA, Cametá (PA)
  jurisdiction: iatb
  office: diocesan
  principal_consecrator: rui-costa-barbosa
  co_consecrators:
  - orvandil-moreira-barbosa
  - ricardo-vicente-dos-anjos
  status: confirmed
  sources:
  - source: lia-iatb-home-2016-08
    quote: >-
      Encerrando o V Encontro Provincial da IATB realizou-se na cidade de Cametá-PA, no dia 17 de julho de 2016
      às 9:00 hs, nas dependências da UFPA, a ordenação episcopal e a sagração de dois noovos bispos
  - source: lia-iatb-home-2016-08
    quote: >-
      A celebração da Santa Eucaristia foi presidida pelo Arcebispo Provincial e Bispo da Diocese do Sudeste, Revmo.
      Dom Rui Costa tendo como co-celebrantes os Exelentíssimos Bispos Dom Ricardo Vicente dos Anjos, de Ananindeua-PA
      e Dom Orvandil Moreira Barbosa, de Goiânia-GO
  - source: lia-iatb-home-2016-11
    quote: >-
      Durante o Encontro realizou-se a sagração de dois novos bispos para a Igreja, Dom Franciney Pantoja e Dom
