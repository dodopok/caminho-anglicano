id: virgilio-cezar-henrique-pereira-torres
name: Virgílio Cezar Henrique Pereira Torres
full_name: Virgílio Cezar Henrique Pereira Torres
aliases:
- Dom Virgílio Cezar Torres
- Dom Virgílio Torres
- Rev. Virgílio Torres
- Virgilio Cezar
- Virgílio Cezar
- Virgílio César
biography: >-
  Clérigo nascido em Santos/SP, residente em Ribeirão Preto/SP, professor de Português/Literatura. Em 2006-2007
  aparece como "colaborador fraterno" da IAOB (com Hermany Soares); foi clérigo da Igreja Anglicana Reformada do
  Brasil (IARB), da qual saiu para fundar a Igreja Episcopal Protestante (dez/2011, ligada a uma "PECUSA"); hoje
  é Bispo Moderador (Presidente) da Igreja Anglicana Unida – Província da América do Sul e Bispo do Sínodo do Brasil,
  vinculada à Free Protestant Episcopal Church of England, e reitor da Comunidade da Reconciliação (Ribeirão Preto).
