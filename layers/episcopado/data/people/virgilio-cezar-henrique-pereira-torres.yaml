biography: >-
  Ordenado presbítero por Francisco Buzzo Rodrigues, atuou em 2006–2007 como colaborador fraterno da Igreja Anglicana
  Ortodoxa do Brasil, tendo assinado a Declaração da Boa Viagem. Saiu da Igreja Anglicana Reformada do Brasil e
  fundou, em dezembro de 2011, a Igreja Episcopal Protestante, de breve duração. Foi sagrado bispo por Ricardo Lorite
  de Lima em 19/07/2025 e é bispo moderador da Igreja Anglicana Unida (Província da América do Sul) e bispo do Sínodo
  do Brasil; foi também chanceler da Diocese Missionária da Igreja Episcopal Reformada no Brasil.
