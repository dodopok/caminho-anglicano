      Os bispos sagrantes presentes na cerimônia foram o Reverendíssimo Dr. Ricardo Lorite de Lima (04:10) e Dom
      Frei Eduardo (1:21:20).
  - source: testemunho-mantenedor-2026-10-08-data-virgilio
    quote: sagração do virgilio foi 19 de jul. de 2025
  notes: >-
    Em 24/03/2025 Virgílio anunciou que seria sagrado por Lorite; em 18/12/2025 a IAU já o apresenta como bispo
    moderador. Data exata não encontrada. Sagrantes presentes: Lorite (04:10 do vídeo) e Dom Frei Eduardo (1:21:20).
    Vários bispos enviaram cartas e bulas de sagração demonstrando apoio, mesmo não estando presentes fisicamente
    (o que o celebrante chama de "sagrantes in absente"). No encerramento (1:32:46–1:34:25) foram lidas cartas do
    arcebispo emérito Richard Palmer; de Dom José Augusto da Silva (São José do Rio Preto); de Dom Jeferson (Igreja
    Católica Ecumênica); de Dom Rogério Ribeiro Campos (Prelazia Apostólica); de Dom Rogério Sidaí (Igreja Protestante
    Livre, França); do arcebispo primaz da Igreja Ortodoxa Russa (Brasil e América do Sul); do bispo Vítor (Colômbia)
    e de um bispo da comunhão no México. Esses não estão registrados como co-sagrantes, por não terem imposto as
    mãos. O título do vídeo fala em posse como bispo moderador da IEP.
