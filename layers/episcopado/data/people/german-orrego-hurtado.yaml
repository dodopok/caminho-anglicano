# yaml-language-server: $schema=../../schemas/person.json
id: german-orrego-hurtado
name: Germán Orrego-Hurtado
biography: >-
  Bispo ordinário da Diocese de Nova Granada (Colômbia), da Anglican Catholic Church (ACC), cuja área inclui o Brasil;
  foi sagrado em 17/10/2010. Instituiu no Brasil a Paróquia Anglicana Cristo Rei, em Anápolis (GO), ligada à Igreja
  Anglicana Tradicional do Brasil (IATB), de onde surgiram outras igrejas continuantes.
sources:
- source: acc-administration
  quote: The Right Reverend German Orrego-Hurtado, Bishop Ordinary
- source: acc-administration
  quote: Diocese of New Granada The Right Reverend German Orrego-Hurtado, Bishop Ordinary
- source: acc-newgranada-25anos
  quote: Bishop Orrego, who will be celebrating the 10th anniversary of his consecration on October 17th.
- source: acc-newgranada-25anos
  quote: >-
    This growth has in large part been due to the leadership of Bishop Orrego, who will be celebrating the 10th
    anniversary of his consecration on October 17th.
- source: cant-novas-igrejas-2024
  quote: através da Diocese de Nova Granada, na Colômbia, liderada pelo bispo Germán Orrego Hurtado.
  page: '74'
- source: cant-novas-igrejas-2024
  quote: >-
    Este, por sua vez, instituiu uma comunidade no Brasil, a Paróquia Anglicana Cristo Rei, em Anápolis, Goiás,
    ligada à Igreja Anglicana Tradicional do Brasil (IATB).
  page: '74'
- source: costa2021
  quote: >-
    No Brasil, a Anglican Catholic Church também se estabeleceu através da Diocese de Nova Granada, na Colômbia,
    liderada pelo bispo Germán Orrego Hurtado
  page: '139'
