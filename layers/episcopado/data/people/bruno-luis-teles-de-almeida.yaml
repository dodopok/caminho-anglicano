  quote: >-
    13 de julho de 2002 foram iniciados os trabalhos do Ponto Missionário da Natividade do Nosso Senhor Jesus Cristo
    em Camaçarí-Bahia pelo Frei Bruno Luiz Teles de Almeida
- source: d2s23-bahia-paroquia
