    page: '217'
  - source: costa2021
    quote: >-
      Em junho de 2003 assumiu como ministro encarregado da Paróquia Anglicana do Bom Pastor o postulante Bruno
      Luiz Teles de Almeida, nomeado pelo Bispo Diocesano D. Robinson Cavalcanti.
    page: '190'
  - source: costa2021
    quote: >-
      Atualmente são arcediagos os reverendos Bruno Almeida (Arcediagado Sul), Gecionny Pinto (Arcediagado Norte)
      e Cláudio Linhares (Arcediagado Oeste).
    page: '249'
  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Paróquia do Bom Pastor
    e Capela Cristo o Salvador; OSF. Depois pároco do Bom Pastor (Salvador) e arcediago da Região Sul da DAR Listado
    no clero diocesano da DAR (página consultada em 2026-10). A página grafa "Luiz"; o decreto de 2004, "Luís".
    Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife e foi um dos 13 que pediram à Câmara dos Bispos
    supervisão episcopal alternativa (decreto de 16/09/2004), mantendo a comunhão com a IEAB. Início e fim do vínculo
    não informados. Signatário de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise de 2004-2005. Hoje arcediago
    do Arcediagado Sul. Local: Paróquia do Bom Pastor, Salvador. Pároco desde 25/01/2005 (nomeado por Filadelfo).
    Arcediago Sul em 2021.
