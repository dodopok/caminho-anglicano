- source: dar-clero-diocesano
  quote: CLERO DIOCESANO
- source: dar-2026-feira
  quote: >-
    A missão teve início em 2015 , a partir de uma proposta do então pároco da Paróquia Anglicana Bom Pastor, em
    Salvador, rev. Bruno Almeida , para que o rev. Adriano Portela , à época em processo de reconhecimento de ordens,
    desse início a um trabalho missionário em Feira de Santana.
