    no clero diocesano da DAR (página consultada em 2026-10). A página grafa "Luiz"; o decreto de 2004, "Luís".
    Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife e foi um dos 13 que pediram à Câmara dos Bispos
    supervisão episcopal alternativa (decreto de 16/09/2004), mantendo a comunhão com a IEAB. Início e fim do vínculo
    não informados. Signatário de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise de 2004-2005. Hoje arcediago
    do Arcediagado Sul. Local: Paróquia do Bom Pastor, Salvador. Pároco desde 25/01/2005 (nomeado por Filadelfo).
    Arcediago Sul em 2021. Local: Paróquia do Bom Pastor e Capela Cristo o Salvador. Relacionado no decreto da Câmara
    dos Bispos da IEAB (16/09/2004) entre os clérigos da Diocese Anglicana do Recife que, segundo o decreto, solicitaram
    supervisão episcopal especial; em exercício em setembro de 2004.
