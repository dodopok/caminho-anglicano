id: bruno-luis-teles-de-almeida
name: Bruno Luís Teles de Almeida
aliases:
- Bruno Almeida
- Bruno Luiz Teles de Almeida
- Revdo. Bruno Almeida
biography: >-
  Bruno Luís Teles de Almeida, frei da Ordem de São Francisco, iniciou em 13/07/2002 os trabalhos do Ponto Missionário
  da Natividade, em Camaçari (BA), e integra o clero da Diocese Anglicana do Recife. Foi ordenado diácono em 25/10/2003
  e presbítero em 25/01/2005 na IEAB, assumindo no mesmo dia a função de pároco, nomeado pelo bispo Filadelfo Oliveira.
  Consta como guardião da Fraternidade Bahia da Ordem de São Francisco e como membro da Comissão de Credenciais
  e Diplomacia da diocese. Pároco da Paróquia Anglicana Bom Pastor, em Salvador, propôs em 2015 que o rev. Adriano
  Portela iniciasse o trabalho missionário anglicano em Feira de Santana (BA).
