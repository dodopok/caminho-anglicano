id: bruno-luis-teles-de-almeida
name: Bruno Luís Teles de Almeida
aliases:
- Bruno Almeida
- Bruno Luiz Teles de Almeida
- Revdo. Bruno Almeida
biography: >-
  Ordenado diácono em 25/10/2003 e presbítero em 25/01/2005 na IEAB, assumindo no mesmo dia a função de pároco,
  nomeado pelo bispo Filadelfo Oliveira. Clérigo da Diocese Anglicana do Recife, foi pároco da Paróquia Anglicana
  Bom Pastor, em Salvador, e em 2015 convidou o Rev. Adriano Portela a iniciar o trabalho missionário anglicano
  em Feira de Santana (BA).
sources:
