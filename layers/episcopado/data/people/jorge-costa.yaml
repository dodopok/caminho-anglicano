# yaml-language-server: $schema=../../schemas/person.json
id: jorge-costa
name: Jorge Costa
full_name: Jorge dos Santos Costa
aliases:
- Dom Jorge dos Santos Costa
- Jorge dos Santos Costa
birth:
  date: '1958-07-02'
  sources:
  - source: lia-iatb-juris-2013
    quote: Nascido no dia 2 de Julho de 1958, na Cidade de Salvador, Estado da Bahia.
biography: >-
  Bispo de Salvador (BA), ex-seminarista católico romano; diácono (1977) e presbítero (1978) na ICAB e sagrado em
  1980; recebido na IATB em 2012 como bispo diocesano da Bahia e do Nordeste; co-sagrante de Ricardo Vicente dos
  Anjos (2012).
sources:
- source: lia-iatb-juris-2013
  quote: Nascido no dia 2 de Julho de 1958, na Cidade de Salvador, Estado da Bahia.
ordinations:
- order: diaconate
  date: '1977-01-02'
  jurisdiction: icab
  ordained_by: jose-barbosa-dos-anjos
  status: probable
  sources:
  - source: lia-iatb-juris-2013
    quote: em 02 de Janeiro de 1977 foi Ordenado Diácono, por Dom José Barbosa dos Anjos (ICAB).
  notes: Autobiografia publicada pela IATB (Diocese da Bahia, 2013).
- order: presbyterate
  date: '1978-04-09'
  place: São Paulo (SP)
  jurisdiction: null
  ordained_by: luigi-mascolo
  status: probable
  sources:
  - source: lia-iatb-juris-2013
    quote: No dia 9 de Abril de 1978, foi Ordenado Presbítero por Dom Luiggi Mascolo, em São Paulo.
  notes: Autobiografia publicada pela IATB.
- order: episcopate
  date: '1980-09-07'
  jurisdiction: icaj
  principal_consecrator: dylmar-balduino-correia-da-costa
  status: probable
  sources:
  - source: lia-iatb-juris-2013
    quote: >-
      Em 07 de Setembro de 1980, foi Sagrado Bispo, por Dom Dylmar Balduino Correia da Costa, Arcebispo Primaz da
      ICAJ.
  - source: lia-iatb-juris-2013
    quote: >-
      Em 19 de Julho 2009 foi confirmado no Episcopado na Igreja Ortodoxa Bielo Russa Eslava, por Mar Athanasio
      I.
  notes: >-
    Em 19/07/2009 teve o episcopado 'confirmado' na Igreja Ortodoxa Bielo-Russa Eslava por Mar Athanasio I (mesma
    fonte). ICAJ na grafia da fonte.
affiliations:
- jurisdiction: iatb
  role: other
  role_description: bispo diocesano
  diocese: iatb-diocese-da-bahia
  start: '2012'
  status: confirmed
  sources:
  - source: lia-iatb-noticias-2012
    quote: >-
      Com grande alegria a Igreja comunica da recepção do Bispo Revmo. Dom Jorge dos Santos Costa, da Cidade de
      Salvador na Bahia.
  - source: lia-iatb-noticias-2014
    quote: >-
      O titular da Diocese da Bahia, Revmo. Dom +Jorge dos Santos Costa assume a titularidade de toda a Diocese
      do Nordeste ora reconstituída.
  notes: >-
    Recebido em 2012 (Decreto Arquiepiscopal 001/2012, de 12/03/2012, criou a Diocese Santa Cruz da Bahia); consagrante
    de Ricardo Vicente dos Anjos (15/07/2012); titular da Diocese do Nordeste reconstituída em 05-07/07/2013. Nascido
    em Salvador em 02/07/1958 (autobiografia da IATB).
- jurisdiction: ica-brasil
  role: bishop
  start: '2018'
  end: '2018'
  end_reason: schism
  status: probable
  sources:
  - source: lica-iaces-clero
    quote: 'Bispo co-ordenante: + Dom Jorge dos Santos Costa, ICA-Brasil'
  - source: lica-iaces-historia
    quote: >-
      Nós + Dom José Fernando de Faria, + Dom Jorge dos Santos Costa, + Dom Orestes Calazans Filho achamos por bem
      e para maior glória de Deus nos desligarmos da Província Católica Anglicana do Brasil
  notes: >-
    Fim em 2018 (data do desligamento não indicada precisamente; a elevação de Faria a arcebispo, que o texto cita,
    é de 11/10/2018). Jorge Costa não consta na lista de bispos do site da ICA-Brasil em 2024-2025.
- jurisdiction: ica
  role: bishop
  end: '2018-05-24'
  end_reason: schism
  status: confirmed
  sources:
  - source: lica-ica-notificacao
    quote: Dom Jorge dos Santos Costa
  - source: lica-ica-sobre
    quote: >-
      Dom Orvandil Moreira Barbosa, Dom Jorge Costa, Dom Ricardo Vicente dos Anjos e Dom Franciney Rodrigues Pantoja
  - source: cant-novas-igrejas-2024
    quote: >-
      que funcionam sob os cuidados de dom Orvandil Moreira Barbosa, dom Jorge Costa, dom Ricardo Vicente dos Anjos
      e dom Franciney Rodrigues Pantoja
    page: '138'
  notes: >-
    A página "Sobre" da ICA liga o trabalho na Bahia a Dom Jorge Costa (ordem "Goiás, Bahia e Pará ... respectivamente");
    o site ainda traz a legenda "Dom Jorge celebra missa em Salvador, BH".
events:
- type: other
  date: '2018-05-24'
  description: >-
    Notificação da Câmara Episcopal e Arcebispado Primaz da ICA: Altamiro Pereira do Amaral, Jorge dos Santos Costa
    e Ricardo Vicente dos Anjos "não mais integram esta Mitra Primacial"; as dioceses de Belém e de Santa Cruz de
    Salvador passam à responsabilidade do arcebispo primaz e a Diocese de Mato Grosso do Sul é extinta e reintegrada
    à do Centro Oeste.
  status: confirmed
  sources:
  - source: lica-ica-notificacao
    quote: >-
      A Diocese de Mato Grosso do Sul é extinta e reintegrada à Diocese Católica Anglicana do Centro Oeste.
  - source: lica-ica-notificacao
    quote: Goiânia, 24 de maio de 2018
