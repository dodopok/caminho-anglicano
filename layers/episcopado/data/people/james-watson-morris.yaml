biography: >-
  Missionário norte-americano (VTS), companheiro de Kinsolving na fundação da missão em Porto Alegre (1890); reabriu
  o seminário teológico em 1920.
sources:
- source: wp-en-ieab
  quote: >-
    In 1890, the priests Lucien Lee Kinsolving and James Watson Morris were sent to Brazil from the Virginia Theological
    Seminary.
- source: wp-en-kinsolving
  quote: >-
    Morris upon his return to Brazil in 1920 (after 18 years in the United States for family heath reasons) reopened
    the theological seminary in Porto Alegre
ordinations:
- order: diaconate
  date: '1889-06-29'
  jurisdiction: tec
  ordained_by: francis-mcneece-whittle
  status: probable
  sources:
  - source: wp-en-kinsolving
    quote: >-
      ordained Kinsolving and fellow Virginia Seminary graduate James Watson Morris deacons in June and priests
      in August, 1889
  - source: costa2021
    quote: >-
      O bispo da Diocese de Virgínia, Francis McNeece Whittle realizou a ordenação diaconal de Lucien Lee Kinsolving
      e de James Vson Watson Morris, em 29 de junho de 1889.
    page: '50'
  notes: A tese grafa 'James Vson Watson Morris' (erro de digitação).
- order: presbyterate
  date: '1889-08-04'
  place: Capela do Seminário Teológico de Virgínia
  jurisdiction: tec
  ordained_by: francis-mcneece-whittle
  status: probable
  sources:
  - source: wp-en-kinsolving
    quote: >-
      ordained Kinsolving and fellow Virginia Seminary graduate James Watson Morris deacons in June and priests
      in August, 1889
  - source: costa2021
    quote: No dia 04 de agosto do mesmo ano, ambos foram ordenados presbíteros na Capela do Seminário.
    page: '50'
  notes: >-
    A tese não nomeia o ordenante do presbiterato (a frase anterior trata da ordenação diaconal por Whittle).
affiliations:
- jurisdiction: dmsb
  role: clergy
  start: '1890'
  status: probable
  sources:
  - source: wp-en-ieab
    quote: >-
      They established themselves in a rented house later known as the Mission House (Casa da Missão) in Porto Alegre,
      where they held the first Anglican Mass in Portuguese on 1 June 1890.
  notes: 'Local: Porto Alegre.'
events:
- type: other
  date: '1890-06-01'
  description: >-
    Chegada de Kinsolving e Morris (com quatro brasileiros) a Porto Alegre em 21/04/1890 e primeiro culto público
    em 1/06/1890 (domingo da Trindade).
  status: probable
  sources:
  - source: wp-en-kinsolving
    quote: The young Americans arrived at Porto Alegre on April 21, 1890, accompanied by four Brazilians
  - source: wp-en-ieab
    quote: where they held the first Anglican Mass in Portuguese on 1 June 1890.
- type: other
  date: '1892-05-23'
  description: >-
    Primeira convocação (não autorizada) da missão, Casa da Missão, Porto Alegre, 23-26/05/1892: presentes os revs.
    Morris, Brown, Meem e Kinsolving e os catequistas Boaventura, Brande e Cabral.
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Presentes: reverendos Morris, Brown, Meem e Kinsolving, e catequistas Boaventura, Brande e Cabral. Presidida
      por Kinsolving e secretariada por Cabral.
- type: other
  date: '1903-06-13'
  description: >-
    O Seminário Teológico da Igreja Episcopal Brasileira foi inaugurado em 13/06/1903 na Igreja do Salvador, Rio
    Grande (RS), com William Cabell Brown como primeiro reitor; foi fechado temporariamente por Kinsolving em 1910
    e reaberto cerca de dez anos depois sob Morris. Três de seus alunos chegaram ao episcopado: Athalício Pithan,
    Egmont Krischke e Plínio Lauer Simões.
  status: probable
  sources:
  - source: drv-kinsolving-ivo
    quote: >-
      Afinal, a 13 de Junho de 1903, justa, 13 anos após ter sido estabelecida a Igreja Episcopal Brasileira, concretizou-se
      a sua alta pretensão.
  - source: drv-kinsolving-ivo
    quote: >-
      Dêsse número, três, já atingiram o episcopado: os Revmos. Drs. Athalicio Pithan, Egmont Machado Krischke e
      Plínio Lauer Simões
