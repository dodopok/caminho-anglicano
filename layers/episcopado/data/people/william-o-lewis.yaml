# yaml-language-server: $schema=../../schemas/person.json
id: william-o-lewis
name: William O. Lewis
biography: >-
  Bispo do Movimento Contínuo presente na sagração de Louis Falk (1981). Participou de três sagrações episcopais,
  entre elas as de Arthur David Seeland e, como sagrante principal, Victor Manuel Cruz-Blanco (1993).
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Estiveram presentes na sagração os bispos James Orin Mote, Carmino de Catanzaro, William F. Burns, William O.
    Lewis e William D. J. Rutherford
  page: '79'
- source: lac-ial-sucessao
  quote: 025. SEELAND, Arthur David, 002, 006, 013, 014, 016, 022. 6 May 1993. - (Died 2009)
- source: lin-cruzblanco-cv
  quote: 'Chief Consecrator: The Metropolitan, The Most Rev. William O. Lewis,'
- source: lin-cruzblanco-cv
  quote: >-
    Co-consecrators: The Rt. Rt. Thomas L. Kleppinger, The Rt. Rev. Arthur David Seeland, The Rt. Rev.James R, McNeley,
    The Rt. Rev. M. Dean Stephens, and the Most Rev. John C. Gramley,Presiding Bishop of the United Episcopal Church.
