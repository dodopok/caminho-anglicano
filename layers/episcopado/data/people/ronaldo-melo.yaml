id: ronaldo-melo
name: Ronaldo Melo
aliases:
- dom Ronaldo
biography: >-
  Ex-padre católico romano de Machado (MG); cofundador da Igreja Católica da Fé; sagrado bispo em 2014 por Emmanuel
  Milingo; elevado/sagrado bispo da Diocese Anglicana no Brasil em 18/11/2018; deixou a Catedral pouco depois, antes
  da pandemia.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Em 2014, Ronaldo foi sagrado bispo por dom Emmanuel Milingo – bispo católico independente –, servindo na Igreja
    da Fé.
  page: '103'
- source: cant-novas-igrejas-2024
  quote: >-
    Em 18 de novembro de 2018, o bispo Ronaldo Melo foi elevado ao episcopado da então criada Diocese Anglicana
    no Brasil
  page: '103'
