# yaml-language-server: $schema=../../schemas/person.json
id: ronaldo-melo
name: Ronaldo Melo
full_name: Ronaldo Robster de Melo
aliases:
- Ronaldo Robster de Melo
- dom Ronaldo
biography: >-
  Ex-padre católico (pároco em Poços de Caldas por nove anos) que pediu desligamento da Diocese de Guaxupé em 2015
  e fundou a Igreja Católica Apostólica da Fé em Machado (MG). Segundo o decreto de Roger Bird de 29/05/2019, foi
  consagrado bispo e designado para a região de Poços de Caldas e Machado na Diocese Anglicana no Brasil; o decreto
  declarou nulas essas ordens. Em 2020-2021 aparece na imprensa local como bispo de Poços de Caldas e Machado.
sources:
- source: lq-g1-ronaldo-2015
  quote: A Igreja Católica Apostólica da Fé, a ICAF, foi criada há três meses pelo padre Ronaldo Melo
- source: lq-gazeta-machadense-2019
  quote: Declaro nula a ordenação e sagração episcopal do bispo Ronaldo Robster de Melo
ordinations:
- order: episcopate
  date: '2014'
  jurisdiction: danb
  office: missionary
  principal_consecrator: emmanuel-milingo
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2014, Ronaldo foi sagrado bispo por dom Emmanuel Milingo – bispo católico independente –, servindo na Igreja
      da Fé.
  - source: lq-gazeta-machadense-2019
    quote: No caso em análise trata-se da ordenação e sagração episcopal do bispo Ronaldo Robster de Melo
  - source: lq-gazeta-machadense-2019
    quote: >-
      ambos incumbidos de cuidar da missão religiosa dessa Igreja na região de Poços de Caldas e Machado, no Sul
      de Minas Gerais.
  notes: >-
    O decreto episcopal de Roger Bird (29/05/2019) trata a 'ordenação e sagração episcopal' de Ronaldo Robster de
    Melo como ato realizado no âmbito da Diocese Anglicana no Brasil – Catedral Anglicana de São Paulo e o declara
    nulo ex tunc. A data (18/11/2018 no livro de Costa) e os sagrantes não constam do decreto; uma notícia de vídeo
    da TV Poços (título 'Igreja Anglicana Padre Ronaldo') indicaria a cerimônia na Catedral num domingo (18), mas
    a descrição não pôde ser aberta.
affiliations:
- jurisdiction: icf
  role: founder
  start: '2015'
  status: confirmed
  sources:
  - source: lq-g1-ronaldo-2015
    quote: A Igreja Católica Apostólica da Fé, a ICAF, foi criada há três meses pelo padre Ronaldo Melo
  - source: lq-g1-ronaldo-2015
    quote: Mas em maio deste ano, ele decidiu pedir seu desligamento da igreja.
  - source: lq-pocosja-2015
    quote: foi excomungado pela Igreja Católica neste sábado (19)
  - source: cant-novas-igrejas-2024
    quote: >-
      Na mesma época, outro sacerdote católico, padre Ronaldo Melo, da cidade de Machado, também deixou o sacerdócio,
      e junto com Dionísio criaram a Igreja Católica da Fé
    page: '103'
  notes: >-
    Local: Machado, MG. Reportagem de 26/12/2015: ICAF criada cerca de três meses antes (c. setembro/2015). Em 19/12/2015
    a Diocese de Guaxupé a considerou cisma; Ronaldo afirma que o desligamento foi pedido por ele.
  discrepancies:
  - field: start
    value: c.2014
    sources:
    - source: cant-novas-igrejas-2024
      quote: >-
        Na mesma época, outro sacerdote católico, padre Ronaldo Melo, da cidade de Machado, também deixou o sacerdócio,
        e junto com Dionísio criaram a Igreja Católica da Fé
      page: '103'
- jurisdiction: danb
  role: bishop
  start: '2018-11-18'
  end: '2019-05-29'
  end_reason: schism
  status: confirmed
  sources:
  - source: lq-gazeta-machadense-2019
    quote: >-
      reverendo André Luiz dos Santos Firmino afirma que tanto ele como o bispo Ronaldo Robster de Melo são independentes,
      e, portanto, não pertencem à Diocese Anglicana do Brasil – Catedral Anglicana de São Paulo
  - source: lq-gazeta-machadense-2019
    quote: Declaro nula a ordenação e sagração episcopal do bispo Ronaldo Robster de Melo
  - source: cant-novas-igrejas-2024
    quote: >-
      A primeira ocorreu dois anos após a sagração de Ronaldo Melo, em 18 de novembro de 2018, para ser o novo bispo
      da então Diocese Anglicana no Brasil
    page: '96'
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 18 de novembro de 2018, o bispo Ronaldo Melo foi elevado ao episcopado da então criada Diocese Anglicana
      no Brasil, a nova jurisdição da Catedral Anglicana de São Paulo.
    page: '103'
  - source: cant-novas-igrejas-2024
    quote: >-
      O bispo Ronaldo atuou nas paróquias Nossa Senhora da Rosa Mística e Nossa Senhora Desatadora dos Nós, no Sul
      de Minas, em Machado e Poços de Caldas.
    page: '103'
  notes: >-
    Local: Poços de Caldas e Machado, MG. Versão da Diocese: Ronaldo e André Firmino teriam declarado independência
    e Bird, ao saber de 'vida pregressa' dos dois, declarou nulas as ordenações em 29/05/2019. Ronaldo não é ouvido
    nesta fonte. Em 2020-2021 a imprensa local o chama 'bispo de Poços de Caldas e Machado'. O livro fala em 'sagração'
    (p. 96) e 'elevado ao episcopado da então criada Diocese' (p. 103), mas Ronaldo já fora sagrado em 2014 por
    Milingo; tratado como posse como bispo da DAnB. Não há fonte para uma sagração sub conditione nem sagrantes
    em 2018. 'pouco tempo depois de sagrado, e meses antes do início da Pandemia, dom Ronaldo saiu da Catedral Anglicana
    de São Paulo' (p. 103).
- jurisdiction: manb
  role: clergy
  start: c.2016
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Outros sacerdotes que se uniram à Catedral na mesma época, foram os padres Ronaldo Melo e Dionísio Pereira.
    page: '95'
events:
- type: other
  date: '2018-11-18'
  description: >-
    Ronaldo Melo, já sagrado bispo em 2014 por Emmanuel Milingo (bispo católico independente), é "elevado ao episcopado"
    da recém-criada Diocese Anglicana no Brasil em 18/11/2018.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2014, Ronaldo foi sagrado bispo por dom Emmanuel Milingo – bispo católico independente –, servindo na Igreja
      da Fé.
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 18 de novembro de 2018, o bispo Ronaldo Melo foi elevado ao episcopado da então criada Diocese Anglicana
      no Brasil
- type: other
  date: '2019-05-29'
  description: >-
    Decreto Episcopal ex-tunc do bispo diocesano Roger Douglas Bird (São Paulo, 29/05/2019) declarando nulas a ordenação
    e sagração episcopal de Ronaldo Robster de Melo e a ordenação presbiteral de André Luiz dos Santos Firmino,
    depois de eles afirmarem em rede social que eram independentes e não reconheciam Bird como superior; publicado
    na Gazeta Machadense em 12/06/2019.
  status: confirmed
  sources:
  - source: lq-gazeta-machadense-2019
    quote: São Paulo, 29 de maio de 2019.
  - source: lq-gazeta-machadense-2019
    quote: >-
      Declaro nula a ordenação e sagração episcopal do bispo Ronaldo Robster de Melo e a ordenação presbiteral do
      reverendo André Luiz dos Santos Firmino, conferindo a esta decisão o efeito EX-TUNC.
- type: excommunication
  date: '2015-12-19'
  description: >-
    Diocese de Guaxupé comunica que Ronaldo Melo foi desligado/excomungado por ter criado a Igreja Católica Apostólica
    da Fé em Machado, caracterizada como cisma; Ronaldo diz ter pedido o desligamento em maio de 2015 por 'liberdade
    litúrgica'.
  status: confirmed
  sources:
  - source: lq-pocosja-2015
    quote: >-
      O padre Ronaldo Melo, que esteve em Poços de Caldas na Paróquia Nossa Senhora Aparecida, foi excomungado pela
      Igreja Católica neste sábado (19).
  - source: lq-g1-ronaldo-2015
    quote: O bispo de Guaxupé, dom José Lanza Neto, não aceitou o desligamento, e então, ele deixou a igreja.
