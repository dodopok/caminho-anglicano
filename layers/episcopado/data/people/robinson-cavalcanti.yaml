  status: probable
  sources:
  - source: costa2021
    quote: >-
      todos estes clérigos e clérigas foram desligados da Igreja Episcopal Anglicana do Brasil e destituídos das
      suas Sagradas Ordens, por meio do Decreto Diocesano nº 01 de 2005.
- type: death
  date: '2012-02-26'
  description: Morte de Edward Robinson de Barros Cavalcanti em Olinda (26/02/2012).
  status: probable
  sources:
  - source: costa2021
    quote: Faleceu na cidade de Olinda, em 26 de fevereiro de 2012.
- type: deposition
  date: '2005-06-17'
  description: >-
    Versao divergente da data da deposicao: o ENS (citando ACNS) diz que o primaz e um comite da Camara dos Bispos
    depuseram Robinson Cavalcanti "por contumacia" em 17 de junho [2005], determinando que o sufraganeo Filadelfo
    Oliveira Neto assumisse a autoridade eclesiastica.
  status: contested
  sources:
  - source: ens-100705-2-a
    quote: >-
      The Primate of Brazil, the Most Rev. Orlando de Oliveira, and a House of Bishops' committee deposed Robinson
      Cavalcanti for contumacy (resistance to authority) June 17, directing his suffragan, the Rt. Rev. Filadelfo
      Oliveira Neto, to assume ecclesiastical authority for the diocese.
- type: other
  date: '2004-03-16'
  description: >-
    Primaz Orlando Santos de Oliveira reprova (carta de 16/03/2004) a participacao do bispo Robinson Cavalcanti
    em confirmacoes irregulares em Ohio (EUA) sem permissao do bispo local.
  status: confirmed
  sources:
  - source: ens-032204-2
    quote: >-
      Santos de Oliveira expressed "strong disapproval" of Cavalcanti's participation, saying that in doing so he
      had violated the constitution and canons of the church in Brazil and in the United States.
- type: other
  date: 2002-10
  description: >-
    Saida do Rev. Paulo Garcia, deao da Catedral da Santissima Trindade do Recife (2002); o bispo Robinson nomeia
    Filadelfo Oliveira deao interino.
  status: confirmed
  sources:
  - source: ens-2002-241-15
    quote: >-
      the bishop of the Anglican Diocese of Recife, Robinson Cavalcanti, has appointed the Rev. Filadelfo Oliveira
