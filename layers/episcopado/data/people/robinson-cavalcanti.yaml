events:
- type: other
  date: '1985'
  description: >-
    Robinson Cavalcanti, então diácono da Diocese Setentrional, foi "apresentador" na sagração do novo bispo (Clóvis
    Erly Rodrigues) em Porto Alegre e afirma que Edmund Sherrill seria um dos co-sagrantes do seu próprio episcopado
    (1997).
  status: probable
  sources:
  - source: cant-meninos-eu-vi-2004
    quote: Eu vi – e fui “apresentador” (de quem não conhecia) na sagração do novo Bispo, em Porto Alegre
  - source: cant-meninos-eu-vi-2004
    quote: (e ele seria um dos co-sagrantes do meu episcopado)
  - source: cant-resgatando-2006
    quote: >-
      Tive, por determinação do Bispo Sherrill, juntamente com a irmã Dalila, da Paróquia Anglicana do Bom Samaritano,
      de me deslocar para a cerimônia de Sagração na Catedral de Porto Alegre (não havia qualquer clima para que
      a mesma se desse aqui) e saudar o consagrado na festa que se seguiu no Teresópolis Tênis Clube.
- type: other
  date: '2010-12-04'
  description: >-
    Robinson Cavalcanti, bispo da Diocese do Recife, chega ao 100º clérigo ordenado em 13 anos de episcopado (86
    presbíteros até dez/2010; 88–89 presbíteros e 103 diáconos até ago/2011); em 2006 a nota biográfica dizia 68
    diáconos e 59 presbíteros ordenados em nove anos
  status: probable
  sources:
  - source: dar-2010-centesimo
    quote: >-
      o Bispo Robinson Cavalcanti ao conceder a Ordem Diaconal ao Candidato às Sagradas Ordens Davi Amado , de Campina
      Grande, Paraíba, estará ordenando o centésimo clérigo do seu ministério episcopal de treze anos. Na mesma
      ocasião a Revda. Sônia Santos , de Goianinha, Rio Grande do Norte, será a 86ª a receber a Ordem Presbiteral.
  - source: dar-2011-dois-presbiteros
    quote: >-
      Eles serão os Presbíteros de número 88 e 89 Ordenados pelo Bispo Robinson Cavalcanti durante os seus quatorze
      anos de Episcopado (e 103 Diáconos)
  - source: dar-resgatando-historia-6
    quote: >-
      (há nove anos) é Bispo da Diocese do Recife (com jurisdição sobre o nordeste); durante o seu Episcopado ordenou
      68 Diáconos e 59 Presbíteros
- type: other
  date: '2010-06-28'
  description: >-
    A Diocese do Recife (sob o Cone Sul) declara ter 17 mulheres entre 59 ministros ordenados (presbíteras e diáconas),
    mais de 25%
  status: confirmed
  sources:
  - source: dar-2010-ordenacao-feminina
    quote: >-
      A Diocese do Recife tem uma das mais altas percentagens de Presbíteras e Diáconas na Comunhão Anglicana (mais
      de 25% = 17 no total de 59 ministros)
- type: other
  date: '2007-10-15'
  description: >-
    Robinson Cavalcanti afirma que os Cânones da Diocese do Recife (já fora da IEAB, sob o Cone Sul) admitem a ordenação
    feminina às três ordens, inclusive o episcopado, com 'respeito às consciências' — diferentemente da IAB posterior,
    que não sagra mulheres ao episcopado
  status: confirmed
  sources:
  - source: dar-2007-ordenacao-feminina
    quote: >-
      Na Diocese do Recife, os Cânones admitem a Ordenação feminina às três ordens: Diaconal, Presbiteral e Episcopal,
      mas, vivemos uma atmosfera de respeito às consciências, e convivência entre as pessoas de ambas as posições.
  - source: dar-2007-ordenacao-feminina
    quote: 'Quando me perguntam se ordeno mulheres, sempre respondo: algumas!'
- type: other
  date: 2008-12
  description: >-
    XXVIII Concílio da Diocese do Recife: por unanimidade, exclui dos Cânones o dispositivo que permitia eleger
    bispas (herança da IEAB), mantendo a ordenação de mulheres ao diaconato e presbiterato; a diocese tinha 14 'reverendas'
  status: confirmed
  sources:
  - source: dar-2008-pastoras-nao-bispas
    quote: >-
      A Diocese do Recife, que conta com 14 reverendas (pastoras), ao nível de Presbíteras e Diáconas, ocupando
      todos os tipos de cargos e funções, deliberou, por unanimidade do plenário do seu XXVIII Concílio, excluir
      o dispositivo canônico que permitia a eleição de Bispas (Episcopisas), como um gesto de maior integração à
      maioria ortodoxa do Anglicanismo (o dispositivo era uma herança da IEAB).
- type: other
