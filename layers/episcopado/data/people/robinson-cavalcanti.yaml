  - source: dard1-arcediagados-2009a
    quote: Arcediagado Especial da América do Norte - EUA
  - source: dard1-arcediagados-2009a
    quote: Arcediagado Brasil Sul/Suldeste
- type: other
  date: 1997-06
  description: >-
    Pacto de Paudalho e eleição episcopal de 1997: o Concílio Extraordinário (final de junho de 1997, Ilha de Itaparica,
    BA) elegeu bispo coadjutor, "na véspera da festa de São Pedro", o Rev. Robinson Cavalcanti, entre os três nomes
    indicados (Maurício Andrade, Ian Meldrum e Robinson Cavalcanti); a eleição foi homologada pela maioria dos bispos
    e dos Conselhos Diocesanos da Província.
  status: confirmed
  sources:
  - source: darl3-hist3
    quote: >-
      Na ocasião foram indicados 3 nomes: os reverendos Maurício Andrade, Ian Meldrum e Robinson Cavalcanti
  - source: darl3-hist3
    quote: >-
      Na véspera da festa de São Pedro de 1997, foi eleito como terceiro Bispo da Diocese Anglicana do Recife (o
      primeiro eleito aqui e o primeiro nativo) o Rev. Robinson Cavalcanti , por maioria absoluta das urnas do clero
      e dos leigos, posteriormente homologado pela maioria dos Bispos e dos Conselhos Diocesanos da Província
- type: other
  date: '1997-10-19'
  description: >-
    Em 19/10/1997 Robinson Cavalcanti, ainda como bispo coadjutor, instalou o então Ponto Missionário do Espírito
    Santo (Jaboatão dos Guararapes, PE), depois elevado diretamente a Paróquia Anglicana do Espírito Santo (PAES),
    cujo reitor é o Rev. Miguel Uchoa.
  status: confirmed
  sources:
  - source: darl3-n4617
    quote: >-
      Em seu único ato sacramental como Bispo-coadjutor, em 19.10.1997, Dom Robinson Cavalcanti instalou o então
      Ponto Missionário do Espírito Santo
  - source: darl3-hist4
    quote: >-
      reconhecer, confirmar e empossar membros e clero da Paróquia Anglicana do Espírito Santo (até então oficialmente
      “não existente” ), que passou de Ponto Missionário Anglicano diretamente para Paróquia
- type: other
  date: 1998/2002
  description: >-
    Durante o episcopado de Robinson Cavalcanti (1998-2002) o organograma diocesano foi reformulado com a criação
    dos Arcediagados (sub-regiões) e de secretarias diocesanas, e foi criada a Igreja Catedral, com seu Deão e Cabido;
    foram regulamentados o Diácono Permanente e o Ministro Local e estabelecidos seminários menores (ITAR, em João
    Pessoa, e IAT, no Recife/Olinda).
  status: confirmed
  sources:
  - source: darl3-hist4
    quote: >-
      O Organograma Diocesano foi reformulado com a criação dos Arcediagados (sub-regiões) e das Secretarias
  - source: darl3-hist4
    quote: Foi criada a Igreja Catedral, com seu Deão e Cabido
  - source: darl3-hist4
    quote: >-
      Dois Seminários Menores foram estabelecidos: o ITAR, em João Pessoa-PB e o IAT, em Recife, depois em Olinda-PE
- type: other
  date: '2000'
  description: >-
    Em 2000 o Sínodo Geral da IEAB, com a concordância do Concílio Diocesano da DAR, aprovou a criação do Distrito
    Missionário da Amazônia (AM, RR, PA e AP) e do Distrito Missionário do Oeste (AC, RO e outros estados); em agosto
    de 2000, em culto solene, o bispo da DAR transmitiu essa jurisdição ao Bispo Primaz, e o território da diocese
    passou a ser os nove estados do Nordeste.
  status: confirmed
  sources:
  - source: darl3-hist4
    quote: >-
      Ainda em 2000, o Sínodo Geral da IEAB (após concordância do Concílio Diocesano da DAR) aprovou a criação do
      Distrito Missionário da Amazônia (Amazonas, Roraima, Pará e Amapá), e do Distrito Missionário do Oeste (Acre
      e Rondônia da DAR e outros Estados de outras Dioceses)
  - source: darl3-hist4
    quote: >-
      Em Agosto o Bispo da DAR em Culto Solene, transmitiu aquela jurisdição ao Bispo Primaz. Desde então o território
      da DAR passou a ser os nove Estados da região Nordeste
- type: other
  date: '2000'
  description: >-
    Em 2000 foi criada, "na surdina", a Igreja Episcopal Carismática do Brasil, para a qual saíram, no que Dom Robinson
    descreve como o primeiro episódio cismático, o Rev. Antônio Carlos (João Pessoa, PB) e o Ministro Leigo Antônio
    Eça (Recife), além de uma seminarista e parcelas de comunidades de João Pessoa.
  status: confirmed
  sources:
  - source: darl3-hist4
    quote: >-
      enquanto (na surdina) era criada a Igreja Episcopal Carismática do Brasil, saindo para ela – no primeiro episódio
      cismático – o Rev. Antônio Carlos , em João Pessoa-PB e o ML. Antônio Eça , no Recife-PE
- type: other
  date: 2002-09
  description: >-
    Em setembro de 2002 o deão da Catedral da Santíssima Trindade (Recife), Rev. Paulo Garcia, rompeu com a diocese
    e filiou-se à Igreja Episcopal Carismática, levando as comunidades do Janga, Timbaúba e Vitória de Santo Antão
    e os reverendos Frederico, Célio, Adonias e Edgar; segundo o relato diocesano o cisma foi "trifonte": o grupo
    do Deão (Igreja Episcopal Carismática), os reverendos Leonides e Karla com a Paróquia Betânia (Igreja Episcopal
    Evangélica) e o Rev. Múcio com a comunidade do Parnamirim (de volta à Igreja Presbiteriana do Brasil). Parte
    da Catedral, liderada pelo Coadjutor Sérgio, permaneceu na DAR.
  status: confirmed
  sources:
  - source: darl3-hist4
    quote: rompe com a Diocese e se filia, em setembro de 2002, àquele grupo
  - source: darl3-hist4
    quote: >-
      Leva com ele as comunidades do Janga, Timbaúba e Vitória do Santo Antão-PE, e os reverendos: Frederico, Célio,
      Adonias e Edgar
  - source: darl3-hist4
    quote: O cisma foi, na realidade, trifonte
  - source: darl3-dout-hist
    quote: primeiro Deão, Rev. Paulo Ruiz Garcia
- type: other
  date: '2003-05-23'
  description: >-
    Em carta de 23/05/2003 aos Primazes da Comunhão Anglicana, Robinson Cavalcanti informou que a diocese, com jurisdição
    sobre os nove estados do Nordeste, havia crescido nos seis anos anteriores de 10 para mais de 40 paróquias,
    missões e pontos missionários, com a ordenação de quarenta sacerdotes e a instituição de cinquenta ministros
    leigos, e que a Catedral da Santíssima Trindade havia perdido o deão e parte da congregação em setembro de 2002.
  status: confirmed
  sources:
  - source: darl3-primazes-2003
    quote: >-
      Nos últimos seis anos, nós crescemos de 10 para mais de 40 Paróquias, Missões e Pontos Missionários, com a
      ordenação de quarenta sacerdotes e a instituição de cinqüenta pessoas ao ministério leigo
- type: other
  date: 2000/2003
  description: >-
    Em dezembro de 2000 o Concílio Diocesano, por maioria de 90% dos delegados, incluiu nos Cânones diocesanos norma
    sobre a ordenação (proibindo a ordenação de pessoas em prática homossexual e de quem defendesse a normalidade
    dessa prática); em junho de 2003 os bispos e o Conselho Diocesano emitiram "A Afirmação do Recife", reiterando
    o apoio à Resolução 1.10 da Conferência de Lambeth de 1998; e no Concílio de dezembro de 2003, em João Pessoa,
    foi aprovado dispositivo canônico limitando o relacionamento institucional da DAR a províncias, dioceses e entidades
    anglicanas que subscrevessem os princípios daquela resolução.
  status: confirmed
  sources:
  - source: darl3-hist5
    quote: >-
      No Concílio Diocesano de dezembro de 2000, por uma maioria de 90% dos delegados clericais e laicos, a DAR
      havia incluído em seus Cânones proibição para a ordenação de homossexuais praticantes
  - source: darl3-hist5
    quote: >-
      Os Bispos e o Conselho Diocesano da DAR, em junho daquele ano, emitiram um documento “A Afirmação do Recife”
  - source: darl3-hist5
    quote: >-
      No Concílio Diocesano de dezembro de 2003, em João Pessoa-PB, foi aprovado um dispositivo canônico que estabeleceu
      que a DAR apenas manteria relacionamento institucional com Províncias, Dioceses, Paróquias e entidades Anglicanas
- type: other
  date: '2004-09-16'
  description: >-
    Em 16/09/2004 a Câmara dos Bispos da IEAB, reunida em Porto Alegre sem a presença do bispo diocesano do Recife,
    expediu uma Carta-Resolução prevendo "supervisão episcopal especial" para parte do clero e das comunidades da
    Diocese Anglicana do Recife, apontando o bispo de Brasília, Maurício Andrade, para exercê-la; em 17/09/2004
    o bispo diocesano, os arcediagos, o Conselho Diocesano, o Secretariado, presbíteros, diáconos e ministros leigos
    da DAR responderam rejeitando a medida e declarando sem legitimidade a presença de qualquer bispo nessa função.
  status: confirmed
  sources:
  - source: darl3-carta-0904
    quote: >-
      surpreendidos com a Carta-Resolução s/n da Câmara dos Bispos, reunida em Porto Alegre-RS, em 16 de setembro
      de 2004 – sem a presença do Bispo Diocesano da DAR
  - source: darl3-carta-0904
    quote: >-
      A presença do Revmo. Dom Maurício Andrade , ou de qualquer outro Bispo, no que diz respeito ao item 2 da Carta-Resolução
      em epígrafe, não será bem-vindo à DAR, nem considerado legítima a sua pretensa “ supervisão episcopal especial
      ”
  - source: darl3-hist5
    quote: >-
      colocando alguns clérigos, Paróquias e Missões sob a autoridade de um pretenso “Supervisor Episcopal Especial”
      , o Bispo de Brasília
- type: other
  date: '2004-09-17'
  description: >-
    A carta de 17/09/2004 da Diocese Anglicana do Recife afirmou que o bispo sufragâneo, Dom Filadelfo Oliveira
    Neto, teria agido de modo desleal no episódio, o que afetaria a legitimidade do exercício de sua função na diocese,
    nos termos do Cânon 19, art. 1º, dos Cânones Gerais ("O Bispo Sufragâneo é um assistente do Bispo Diocesano
    e age sob a direção do mesmo").
  status: confirmed
  sources:
  - source: darl3-carta-0904
    quote: >-
      Expressamos a nossa surpresa e o nosso desapontamento com o comportamento desleal e antiético do Bispo Sufragâneo
      Dom Filadelfo Oliveira Neto , em todo esse episódio, o que afeta profundamente a legitimidade para o exercício
      de sua função nesta Diocese
- type: other
  date: '2004-12-02'
  description: >-
    Em 02/12/2004 o XXIV Concílio Diocesano da Diocese Anglicana do Recife (Olinda), por unanimidade dos delegados
    clericais e laicos, reafirmou lealdade à Sé de Cantuária e à Comunhão Anglicana, declarou a diocese em "Estado
    de Emergência", suspendeu provisoriamente os vínculos com a liderança provincial da IEAB e pediu ao Arcebispo
    de Cantuária e aos Primazes uma "Supervisão Episcopal Primacial Adequada Alternativa com Jurisdição" exercida
    por um Primaz de outra Província; o documento cita, entre as razões, a "Supervisão Episcopal Especial" imposta
    a alguns clérigos e comunidades, o corte de recursos da JUNET, o processo disciplinar contra o bispo diocesano
    e a tentativa do Primaz de suspender o próprio Concílio por decreto episcopal.
  status: confirmed
  sources:
  - source: darl3-cantuaria-2004
    quote: >-
      Considerar a Diocese Anglicana do Recife, em decorrência, em Estado de Emergência , e suspender, em caráter
      provisório e emergencial, seus vínculos com o estamento de poder eclesiástico que dirige esta Província
  - source: darl3-cantuaria-2004
    quote: >-
      honrar e aprovar nosso pedido por uma Supervisão Episcopal (de um Primaz) Primacial Alternativa Adequada com
      Jurisdição , a ser exercida por um Primaz de uma outra Província, em comum acordo
  - source: darl3-hist5
    quote: >-
      o XXIV Concílio Diocesano, convocado publicamente um ano antes, foi “suspenso” por um Decreto do Primaz
- type: other
  date: '2005-02-18'
  description: >-
    Em 18/02/2005 o Bispo Primaz da IEAB, Orlando Santos de Oliveira, emitiu a Resolução 001/2005 (suspensão do
    ofício e ministério do bispo diocesano do Recife, Robinson Cavalcanti) e, em 22/02/2005, a Resolução 002/2005
    (instituição de nova "Autoridade Eclesiástica" na diocese); em 21/02/2005 o Fórum de Clérigos e Ministros Leigos
    da DAR rejeitou a Resolução 001/2005 e recomendou ao Concílio Extraordinário continuar a reconhecer Robinson
    Cavalcanti como bispo diocesano.
  status: confirmed
  sources:
  - source: darl3-setubal
    quote: >-
      Protestamos e rejeitamos as Resoluções 001/2005 de 18/02/2005 (que pretende determinar suspensão do Ofício
      e Ministério do Bispo Diocesano) e 002/2005 de 22/02/2005 (que pretende instituir nova Autoridade Eclesiástica)
      emitida pelo Bispo Primaz da IEAB
  - source: darl3-forum
    quote: >-
      rejeitar a Resolução 001/2005, do Primaz da IEAB, de 18.02.2005, continuando a reconhecer o Revmo. Dom Edward
      Robinson de Barros Cavalcanti como o seu Bispo Diocesano
- type: other
  date: '2005-02-26'
  description: >-
    Em 26/02/2005, na Paróquia Anglicana Jardim das Oliveiras (Setúbal, Recife), reuniu-se o Concílio Diocesano
    Extraordinário da DAR, com 32 delegados clericais, 58 delegados laicos e 15 observadores representando 35 paróquias,
    missões e pontos missionários; aprovou a "Carta de Setúbal", que rejeitou as Resoluções 001/2005 e 002/2005
    do Primaz da IEAB, reconheceu Robinson Cavalcanti como bispo diocesano, suspendeu por tempo indeterminado o
    relacionamento com a direção da IEAB e apelou aos Instrumentos de Unidade da Comunhão Anglicana por "Supervisão
    Episcopal Primacial Adequada Alternativa com Jurisdição".
  status: confirmed
  sources:
  - source: darl3-setubal
    quote: >-
      Nós, 32 delegados clericais, 58 delegados laicos e 15 observadores, representando 35 Paróquias, Missões e
      Pontos Missionários, reunidos em Concílio Diocesano Extraordinário da Diocese Anglicana do Recife, no dia
      vinte e seis do mês de fevereiro do ano graça do Nosso Senhor Jesus Cristo de dois mil e cinco
  - source: darl3-setubal
    quote: >-
      continuamos, fortemente determinados, por unanimidade, a reconhecer o Revmo. Bispo Dom Edward Robinson de
      Barros Cavalcanti como nosso Bispo Diocesano
  - source: darl3-setubal
    quote: >-
      o apelo aos Instrumentos de Unidade da Comunhão Anglicana, por uma “Supervisão Episcopal Primacial Adequada
      Alternativa com Jurisdição”
- type: deposition
  date: 2005-06
  description: >-
    Segundo o relato diocesano, em junho de 2005 o Superior Tribunal Eclesiástico da IEAB manteve duas das dez acusações
    contra o bispo diocesano do Recife e o Primaz, com a anuência da Câmara dos Bispos, proferiu sentença de "Deposição
    de Ordem e Ministério" contra Robinson Cavalcanti; ele apelou no prazo canônico e, segundo o texto, o recurso
    nunca foi julgado. A DAR manteve o reconhecimento do seu bispo.
  status: confirmed
  sources:
  - source: darl3-hist6
    quote: >-
      o Superior Tribunal Eclesiástico, mesmo diante de um acusado primário e de sua consistente e sólida defesa,
      manteve duas das dez acusações, e o Primaz, com a anuência da Câmara dos Bispos, prolata sentença condenatória
      de “Deposição de Ordem e Ministério” do Bispo do Recife
- type: other
  date: 2005-09
  description: >-
    Em setembro de 2005 o bispo e os clérigos da Diocese Anglicana do Recife receberam, em cerimônia com o Cônego
    Bill Attwood (secretário-geral da Ekklesia), uma carta-documento do Primaz da Igreja Anglicana do Cone Sul,
    Gregory J. Venables, reconhecendo suas ordens e ministérios e colocando-os sob sua proteção e autoridade primacial.
  status: confirmed
  sources:
  - source: darl3-hist6
    quote: >-
      Carta-Documento do Primaz da Igreja Anglicana do Cone Sul, Revmo. Gregory J. Venables , reconhecendo as suas
      Ordens e Ministérios, e os colocando sob a sua proteção e autoridade primacial
- type: other
  date: 2005-08
  description: >-
    Em novo Concílio Diocesano Extraordinário (agosto, segundo o relato, no contexto de 2005) foram feitos ajustes
    canônicos e estatutários da DAR como ente legal com personalidade jurídica própria, oficializando a desvinculação
    da IEAB e o status especial de Diocese Extra-Provincial sob a autoridade primacial da Igreja Anglicana do Cone
    Sul da América e em comunhão com a Sé de Cantuária.
  status: probable
  sources:
  - source: darl3-hist6
    quote: >-
      Em agosto, em novo Concílio Diocesano Extraordinário, foram feitos os ajustes necessários ao nível canônico
      e estatutário, como um ente legal com Personalidade Jurídica própria, oficializando a sua desvinculação da
      IEAB e o seu status especial de Diocese Extra-Provincial sob a autoridade Primacial da Igreja Anglicana do
      Cone Sul da América, e em comunhão com a Sé de Cantuária
- type: other
  date: '2005'
  description: >-
    Em outubro de 2005 Robinson Cavalcanti esteve na Inglaterra como orador convidado do Conselho Evangélico da
    Igreja da Inglaterra, reuniu-se por quatro horas com membros do staff do Arcebispo de Cantuária em St. Andrew's
    House e foi recebido em audiência por Rowan Williams no Palácio de Lambeth; em novembro de 2005 compareceu ao
    III Encontro Sul-Sul (Egito) como convidado oficial, integrando a representação do Cone Sul, enquanto a Comissão
    Executiva do movimento Sul Global não aceitou representantes da IEAB.
  status: confirmed
  sources:
  - source: darl3-hist6
    quote: >-
      tendo sido recebido, no dia seguinte, por Sua Graça Rowan Williams em audiência no Palácio de Lambeth
  - source: darl3-hist6
    quote: >-
      enquanto que o Bispo Diocesano do Recife ali comparecia como convidado oficial, integrando a representação
      do Cone Sul
- type: other
  date: 2005-12
  description: >-
    No XXV Concílio Diocesano (início de dezembro de 2005, Paróquia Anglicana Emanuel, Olinda) a Paróquia Anglicana
    do Bom Samaritano (Recife) foi elevada ao status de Igreja-Catedral, com o Rev. Manoel S. Moraes de Almeida
    como Deão, e foram ordenados novos presbíteros e diáconos.
  status: probable
  sources:
  - source: darl3-hist6
    quote: >-
      com a elevação da Paróquia Anglicana do Bom Samaritano ( Revmo. Manuel Moraes – Deão) ao status de Igreja-Catedral
  - source: darl3-hist6
    quote: além da Ordenação de novos Presbíteros e Diáconos
- type: other
  date: 2006/2007
  description: >-
    Robinson Cavalcanti, ao completar 30 anos da diocese (2006), registrou ter ordenado em seu episcopado 68 diáconos
    e 59 presbíteros; em dezembro de 2007 a diocese noticiou que ele completaria o número de 80 ordenações diaconais
    e 65 presbiterais em uma década de episcopado.
  status: confirmed
  sources:
  - source: darl3-hist6
    quote: durante o seu Episcopado ordenou 68 Diáconos e 59 Presbíteros
  - source: darl3-idx-p15
    quote: o número recorde de 80 (oitenta) Ordenações Diaconais, além de 65 (sessenta e cinco) Presbiterais
- type: other
  date: '2006-09-30'
  description: >-
    Em 30/09/2006, durante o culto de ação de graças pelo nono aniversário da sagração episcopal de Dom Robinson
    Cavalcanti, na Catedral Anglicana do Bom Samaritano (Boa Viagem, Recife), representantes de seis jurisdições
    anglicanas brasileiras (mais a ICAE, do Equador, como associada extra-nacional) assinaram a "Declaração da Boa
    Viagem", criando o Movimento Anglicano "Por Uma Causa Comum", com base doutrinária que inclui a subscrição da
    Resolução 1.10 de Lambeth (1998); em 31/08/2006 Robinson Cavalcanti havia divulgado a "Declaração de Base Doutrinária"
    do movimento.
  status: confirmed
  sources:
  - source: darl3-cc-boaviagem
    quote: >-
      Representantes de seis diferentes jurisdições anglicanas brasileiras – em comunhão ou não com a Sé de Cantuária
      – assinaram ontem, 30.09.2006, a “Declaração da Boa Viagem” , criando o “Movimento Anglicano Por Uma Causa
      Comum”
  - source: darl3-cc-base
    quote: Recife (PE), 31 de agosto de 2006.
- type: other
  date: '2007-08-28'
  description: >-
    Entre 28/08 e 03/09/2007 Dom Robinson Cavalcanti viajou à África para participar das sagrações de bispos missionários
    nas Igrejas Anglicanas do Quênia e de Uganda; foi co-sagrante em ambas (Quênia: Bill Attwood e Bill Murdock;
    Uganda: John Guernsey e George Tibesigwa, em Mbarara).
  status: confirmed
  sources:
  - source: darl3-n4208
    quote: >-
      O Bispo irá participar de cerimônias de Sagração de Bispos Missionários nas Igrejas Anglicanas de Quênia e
      de Uganda
  - source: darl3-n4211
    quote: O Bispo Anglicano do Recife, Dom Robinson Cavalcanti, foi um dos co-Sagrantes
  - source: darl3-n4213
    quote: 60 bispos co-sagrantes ( entre eles o Bispo Anglicano do Recife Dom Robinson Cavalcanti, ose )
- type: other
  date: '2007-09-16'
  description: >-
    Em 16/09/2007 Robinson Cavalcanti presidiu, na Paróquia Anglicana Reformada (Copacabana, Rio de Janeiro), culto
    eucarístico em que o Rev. Carlos Alberto Chaves Fernandes e mais 65 pessoas foram confirmados e quatro seminaristas
    foram instalados como evangelistas; a comunidade é descrita como a mais nova da Diocese do Recife, sob supervisão
    primacial do Cone Sul.
  status: confirmed
  sources:
  - source: darl3-n4227
    quote: >-
      é a mais nova Comunidade Anglicana da Diocese do Recife - Comunhão Anglicana, sob Supervisão Primacial da
      Igreja do Cone Sul da América
  - source: darl3-n4227
    quote: >-
      quando o Rev. Carlos Alberto Chaves Fernandes ( veja foto à esquerda ) e mais 65 pessoas participarão do Culto
      Eucarístico e serão Confirmados
- type: other
  date: 2004-10
  description: >-
    Em outubro de 2004 Robinson Cavalcanti acolheu, por determinação da Rede da Comunhão Anglicana, as paróquias
    anglicanas de St. Charles (Poulsbo, WA) e St. Stephen (Oak Harbor, WA), que haviam deixado a Diocese de Olympia
    da Igreja Episcopal (EUA); o acordo de 2006 com a diocese de Olympia reconheceu o bispo do Recife como autoridade
    espiritual das duas paróquias, cujo reitor, Rev. Duncan Clark, tornou-se arcediago das paróquias norte-americanas
    do Recife.
  status: confirmed
  sources:
  - source: darl3-n4177
    quote: >-
      A Rede (ACN) determinou que ambas as paróquias se colocassem sob a supervisão do Bispo Robinson Cavalcanti,
      do Recife, e ele, generosamente, lhes deu as boas-vindas em outubro de 2004
  - source: darl3-n4177
    quote: >-
      Conquanto o Bispo Cavalcanti foi reconhecido pelo bispo Warner como a autoridade espiritual de ambas as paróquias
- type: other
  date: 2008-12
  description: >-
    O XXVIII Concílio Diocesano da Diocese do Recife (Jaboatão dos Guararapes, dezembro de 2008) homologou a criação
    de um Arcediagado para as comunidades do Sul e Sudeste do Brasil vinculadas à diocese, com o Rev. Carlos Alberto
    Chaves Fernandes (Rio de Janeiro) como arcediago; o território histórico da diocese é o Nordeste (9 estados),
    mas os cânones permitem incluir comunidades de outras regiões por necessidade missionária. Durante os quatro
    anos anteriores existiu um Arcediagado Norte-Americano (comunidades da Flórida, Oregon e Washington), vinculado
    provisoriamente ao Recife.
  status: confirmed
  sources:
  - source: darl3-n4622
    quote: >-
      O XXVIII Concílio da Diocese do Recife homologou a criação de um Arcediagado (sub-região eclesiástica) para
      coordenar as comunidades das regiões sul e sudeste do Brasil que a ela estão vinculadas
  - source: darl3-n4622
    quote: >-
      Durante os últimos quatro anos existiu um Arcediagado Norte-Americano para as comunidades dos Estados da Flórida,
      Oregon e Washington que estão vinculadas provisoriamente ao Recife
- type: other
  date: '2008-12-04'
  description: >-
    No sermão de abertura do XXVIII Concílio Diocesano (04/12/2008, Jaboatão dos Guararapes) Robinson Cavalcanti
    anunciou, entre outras medidas institucionais: criação de assembleias e conselhos arcediagais e designação de
    adjuntos aos arcediagos; cânon próprio para as ordens religiosas e para o Vicariato-Geral; criação do Arcediagado
    Missionário Brasil Sul/Sudeste; exame, pela Comissão de Ministério e pela Junta de Capelães Examinadores, dos
    clérigos incardinados (oriundos de igrejas com sucessão apostólica) em seus processos de reconhecimento de ordem;
    e a preservação da ordenação feminina ao diaconato e ao presbiterato, mas não ao episcopado.
  status: confirmed
  sources:
  - source: darl3-n4614
    quote: >-
      Estamos criando as assembléias arcediagais e os conselhos arcediagais, para cuidar, ao máximo, das questões
      locais. Estamos designando adjuntos aos Arcediagos
  - source: darl3-n4614
    quote: Incorporaremos um Cânon próprio para as Ordens Religiosas, e para a figura do Vicariato-Geral
  - source: darl3-n4614
    quote: >-
      Os novos clérigos incardinados (oriundos de Igrejas com sucessão apostólica) se submeterão aos exames da Comissão
      de Ministério e da Junta de Capelães Examinadores em seus processos de Reconhecimento de Ordem
  - source: darl3-n4614
    quote: nos levam a preservar a Ordenação feminina ao Diaconato e ao Presbiterato, mas não ao Episcopado
- type: other
  date: 2008-12
  description: >-
    O XXVIII Concílio Diocesano aprovou por unanimidade moção de congratulações pela criação da Igreja Anglicana
    na América do Norte (ACNA), cuja constituição foi divulgada em 03/12/2008 e que reuniria 700 comunidades e 100
    mil membros dos Estados Unidos e Canadá; o bispo canadense Donald Harvey pregou no culto de encerramento.
  status: confirmed
  sources:
  - source: darl3-n4612
    quote: >-
      O XXVIII Concílio de Diocese do Recife – Comunhão Anglicana aprovou, por unanimidade, moção em que se congratula
      com a criação da Igreja Anglicana na América do Norte
  - source: darl3-n4612
    quote: >-
      Um dos líderes da nova Província, o Bispo canadense Donald Harvey foi o pregador do Culto de Encerramento
      do XXVIII Concílio do Recife
- type: other
  date: '1997-11-17'
  description: >-
    A Paróquia Anglicana da Redenção (bairro de Rio Doce) foi fundada em 17/11/1997, quando o bispo Robinson Cavalcanti
    passou o bastão à Revda. Gorete Marques, após confirmar a primeira remessa de membros; em dezembro de 2008 Gorete
    era pároca e arcediaga da região Norte e o Rev. Tibério Marques, secretário diocesano de Homens e contador diocesano.
  status: confirmed
  sources:
