  - source: darl3-hist3
    quote: Em 05 de outubro de 1997
  - source: darl3-hist3
    quote: >-
      no Centro de Convenções de Pernambuco, em Olinda-PE, tendo como oficiantes os Bispos Glauco Soares de Lima
      (de São Paulo) – Primaz, Clóvis Erly Rodrigues, Almir dos Santos (de Brasília) e Edmundo Knox Sherrill (aposentado)
      se deu a Sagração do novo Bispo Coadjutor
  - source: darl3-hist3
    quote: >-
      foi eleito como terceiro Bispo da Diocese Anglicana do Recife (o primeiro eleito aqui e o primeiro nativo)
      o Rev. Robinson Cavalcanti
  notes: >-
    Relato do próprio sagrado: eleito, depois homologado, sagrado com imposição de mãos de pelo menos três bispos;
    sagrantes não nomeados nestes textos. Foi bispo coadjutor por 'apenas quinze dias'. Confirma a pista dos posteres
    (participacao de Edmund Sherrill). Eleito coadjutor em 28/06/1997 no Concilio Extraordinario em Vera Cruz, Ilha
    de Itaparica (BA); instalado como bispo diocesano em 19/10/1997. Uma nota da mesma tese (n. 225) cita "Teatro
    Beberibe". O proprio Robinson, em testemunho de 2004 hospedado no Projeto Cantuaria, confirma que Sherrill foi
    um dos seus co-sagrantes. O livro não nomeia os sagrantes. O pôster só diz que Sherrill 'participou'; sagrante
    principal desconhecido por esta fonte. O pôster da IAB (Meira) diz 'bispo coadjutor, que depois se tornaria
    diocesano'. Data exata e sagrantes não encontrados ainda. A tese diz 'sagrado pelo Primaz' sem nomeá-lo; Glauco
    Soares de Lima era Primaz de 1993 a 2003 segundo a mesma tese (inferência). Co-sagrantes não informados. Sagrado
    como bispo coadjutor da Diocese Anglicana do Recife; instalado como 3º diocesano em 19/10/1997. Na nota 225
    (p. 243) a própria tese diz 'Robinson Cavalcanti no Teatro Beberibe, no Recife' — divergência de local (ver
    dúvidas). A lista sucessória publicada pelo próprio Robinson (baseada em Aquino, 2004, p. 155-158) traça sua
    linha por Edmund Knox Sherrill e nomeia em nota os outros três bispos que impuseram as mãos: Glauco Soares de
    Lima, Almir dos Santos e Clóvis Erly Rodrigues. Não indica quem presidiu; outras fontes apontam o Primaz Glauco
    Soares de Lima como sagrante principal. Sagrado como bispo coadjutor; diocesano do Recife desde 19/10/1997.
    A página não informa dia, local nem sagrantes. O perfil, sem data de redação, não dá o dia nem os sagrantes;
    a data completa (05/10/1997) consta de outras fontes. Sagração como bispo coadjutor do Recife, com a presença
    do cônego John Peterson, secretário-geral da Comunhão Anglicana. O texto, do próprio sagrado, nomeia como oficiantes
    o primaz Glauco Soares de Lima, Clóvis Erly Rodrigues, Almir dos Santos e Edmund Knox Sherrill; a instalação
    como bispo diocesano foi em 19/10/1997, na Paróquia da Santíssima Trindade. O texto chama os quatro bispos de
    "oficiantes" e cita o Primaz Glauco Soares de Lima em primeiro lugar; não distingue expressamente sagrante principal
    e co-sagrantes. Estava presente o Rev. Cônego John Peterson, Secretário Geral da Comunhão Anglicana. Eleito
    na véspera da festa de São Pedro de 1997 (Concílio Extraordinário na Ilha de Itaparica, BA), foi instalado e
    empossado como bispo diocesano na Paróquia da Santíssima Trindade em 19/10/1997.
