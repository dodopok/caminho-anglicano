biography: >-
  Edward Robinson de Barros Cavalcanti nasceu no Recife em 21 de junho de 1944, cresceu em União dos Palmares (AL),
  fez mestrado em ciência política na Universidade Cândido Mendes (1974–75) e lecionou a disciplina em estabelecimentos
  de ensino religiosos. Confirmado na Igreja Evangélica Luterana do Brasil em 31 de outubro de 1963, filiou-se à
  Igreja Episcopal do Brasil em 21 de junho de 1976, recebido pelo bispo Edmund Knox Sherrill, e foi ordenado diácono
  em 1984 e presbítero em 1985. Como presbítero foi coadjutor da Paróquia da SS. Trindade, membro da JUNET (junta
  de educação teológica da igreja), da qual foi presidente, e em 1990 encabeçou o projeto que mudou o nome da denominação
  para Igreja Episcopal Anglicana do Brasil (IEAB). Eleito bispo coadjutor do Recife em 28 de junho de 1997, na
  Ilha de Itaparica, foi sagrado em 5 de outubro por Glauco Soares de Lima e instalado em 19 de outubro como terceiro
  bispo diocesano. Em 1998 foi o único bispo brasileiro a votar com a maioria a Resolução 1.10 de Lambeth; criou
  a catedral e seminários diocesanos e, em 1999, instituiu a Ordem de Santo Estêvão Mártir. Em 2004, após participar
  de confirmações na Diocese de Ohio (EUA) e recusar a supervisão episcopal especial decretada pela Câmara dos Bispos,
  respondeu a processo canônico; em 25 de janeiro de 2005 declarou suspensa a relação da diocese com a IEAB, foi
  suspenso em 18 de fevereiro e deposto em 10 de junho de 2005 (o ENS cita 17 de junho), deposição que a diocese
  rejeitou. Levou cerca de 90% dos clérigos, membros e templos e, em 23 de setembro de 2005, passou à autoridade
  primacial do Cone Sul, a cuja província a diocese aderiu formalmente em 2007. Liderou o Movimento Anglicano Por
  Uma Causa Comum, criado pela Declaração da Boa Viagem em 2006, integrou em 2008 a Equipe de Recursos Teológicos
  da GAFCON e assinou em 2009 e 2010 documentos de fundação da ACNA e o memorando de cooperação com ela. Segundo
  ele mesmo, ordenou 99 diáconos e 85 presbíteros até 2010, e participou de quatro sagrações episcopais, entre elas
  as de Bill Atwood e William Murdoch. Foi assassinado em Olinda em 26 de fevereiro de 2012; Evilásio Tenório assumiu
  interinamente, Miguel Uchôa foi eleito em seguida e a Igreja Anglicana no Brasil foi reorganizada a partir da
  diocese.
