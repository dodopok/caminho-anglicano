      em setembro de 2002, o Pr. Paulo Garcia declarou, oficialmente, a sua ruptura da Igreja Episcopal Anglicana.
  - source: queiroz-2004-ufpe
    quote: >-
      De um lado, a comunidade liderada pelo Pastor Paulo Garcia. Do outro, a Diocese local da Igreja Episcopal
