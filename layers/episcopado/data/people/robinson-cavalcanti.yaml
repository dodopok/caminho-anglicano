    por'. Ano 1984 de outras fontes (Kickhöfel; Costa, 2021). Em 24/06/2009 Robinson anota "25 anos de Ordenação";
    sem especificar a ordem, a data corresponde ao diaconato de 1984 (a ordenação presbiteral é de 06/01/1985).
