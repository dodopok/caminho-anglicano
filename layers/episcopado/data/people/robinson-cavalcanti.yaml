events:
- type: other
  date: '2004-09-16'
  description: >-
    Decreto de Supervisao Episcopal Especial sobre a Diocese Anglicana do Recife (16/09/2004), com supervisao do
    bispo Mauricio Andrade (DAB) e do sufraganeo Filadelfo Oliveira; Robinson Cavalcanti recusa acatar.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      a recusa do Bispo Diocesano, Dom Edward Robinson de Barros Cavalcanti, em acatar o Decreto de Supervisão Episcopal
      Especial de 16 de setembro de 2004
- type: other
  date: '2004-10-11'
  description: >-
    Abertura de processo canonico contra Robinson Cavalcanti no Superior Tribunal Eclesiastico (denuncia recebida
    em 11/10/2004); o tribunal era presidido pelo bispo emerito Clovis Erly Rodrigues.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      a abertura de um processo canônico contra o bispo no Superior Tribunal Eclesiástico, recebida no dia 11 de
      outubro de 2004.
  - source: costa2021
    quote: >-
      época, a Suprema Corte da Igreja Episcopal Anglicana do Brasil era presidida pelo bispo emérito, Clovis Erly
      Rodrigues.
- type: other
  date: '2004-11-26'
  description: >-
    Decreto Episcopal 001/2004 do primaz Orlando Santos de Oliveira (26/11/2004) suspende o Concilio da Diocese
    do Recife marcado para 2-4/12/2004.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em 26 de novembro de 2004 o Bispo Primaz emitiu um Decreto Episcopal suspendendo a realização do Concílio
      da Diocese Anglicana do Recife que estava marcado para acontecer em dezembro.
- type: other
  date: '2005-01-25'
  description: >-
    Robinson Cavalcanti declara, em carta de 25/01/2005, a suspensao do relacionamento da Diocese do Recife com
    a IEAB (diocese "autonoma da Comunhao Anglicana").
  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      em carta publicada em 25 de janeiro de 2005, o bispo declarou a suspensão do relacionamento da Diocese Anglicana
      do Recife com a IEAB
  - source: ptwp-dar
    quote: >-
      Em 25 de janeiro de 2005, Robinson Cavalcanti, então bispo da Diocese Anglicana do Recife, opondo-se à predominância
      da ala liberal na igreja, promoveu um cisma na IEAB.
- type: other
  date: '2005-02-22'
  description: >-
    Resolucao 001/2005 (18/02/2005) suspende preventivamente Robinson Cavalcanti; Resolucao 002/2005 (22/02/2005)
    nomeia Filadelfo Oliveira Neto Autoridade Eclesiastica da Diocese do Recife; Mauricio Andrade instituido "bispo
    interventor" em marco de 2005.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      foi emitida a Resolução 001/2005, em 18 de fevereiro de 2005208, suspendendo o bispo diocesano em caráter
      preventivo.
  - source: costa2021
    quote: No mês seguinte, o bispo Maurício Andrade, foi instituído como “bispo interventor”
- type: deposition
  date: '2005-06-10'
  description: >-
    Deposicao de Edward Robinson de Barros Cavalcanti do ministerio ordenado da IEAB (Processo Canonico 001/2005),
    decretada pelo primaz Orlando Santos de Oliveira perante a Camara dos Bispos em Porto Alegre, apos decisao unanime
    do Tribunal Superior Eclesiastico.
  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      Como consequência do contínuo enfrentamento às decisões da Câmara Episcopal, em 10 de junho de 2005, Edward
      Robinson de Barros Cavalcanti foi deposto de todos os seus cargos na Igreja Episcopal Anglicana do Brasil
  - source: costa2021
    quote: >-
      Tendo em vista os fatos articulados acima, e que o Tribunal Superior Eclesiástico, por unanimidade de seus
      membros, reconhece a culpabilidade do Bispo Dom Edward Robinson de Barros Cavalcanti, o Bispo Primaz decreta
  - source: ptwp-dar
    quote: >-
      Apesar de constituir ato raro e extremo, o bispo foi expulso da IEAB em 10 de junho de 2005 pelo Tribunal
      Superior Eclesiástico.
  - source: ens-102306-1-a
    quote: was elected as bishop of Recife to replace Robinson Cavalcanti, who was deposed on June 10, 2005.
  - source: ens-040908-04
    quote: >-
      As it is known by all the Anglican Communion, Mr. Cavalcanti was deposed through a lawful and canonical process
      due to his breaking of ordination vows.
- type: other
  date: '2005'
  description: >-
    Decreto Diocesano no 01/2005: os 32 clerigos signatarios da Carta de Setubal (lealdade a Robinson) sao desligados
