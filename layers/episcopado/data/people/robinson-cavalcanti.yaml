  status: confirmed
  sources:
  - source: ieab-2005-carta-venables
    quote: Lamento profundamente vossa carta, reconhecendo e acolhendo para supervisão o bispo
  - source: ieab-2005-carta-venables
    quote: deposto e um grupo de clérigos depostos que pertenceram à Diocese Anglicana do Recife.
  - source: ieab-2005-carta-venables
    quote: foi condenado pelo Tribunal Superior Eclesiástico
- type: other
