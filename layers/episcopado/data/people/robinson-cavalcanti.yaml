- type: other
  date: 2008-08
  description: >-
    Em agosto de 2008, em viagem missionária pelo Brasil, Robinson Cavalcanti recebeu a Paróquia Anglicana Fruto
    do Espírito, em Bandeirantes (Paraná), comunidade proveniente da Renovação Carismática Católica.
  status: confirmed
  sources:
  - source: darl3-idx-p6
    quote: >-
      Minha última ação missionária nessa viagem foi a recepção da Paróquia Anglicana Fruto do Espírito, em Bandeirantes,
      Paraná
- type: other
  date: '2007'
  description: >-
    Em 2007, em viagem de cerca de um mês aos Estados Unidos, Robinson Cavalcanti visitou as paróquias e missões
    sob a supervisão da diocese nos estados de Washington, Oregon e Flórida, com confirmações e ordenações, e ordenou
    dois pastores na Flórida (os nomes não constam do texto); depois foi ao Quênia e a Uganda para as sagrações
    de bispos missionários.
  status: confirmed
  sources:
