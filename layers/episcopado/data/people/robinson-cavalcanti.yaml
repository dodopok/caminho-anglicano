- type: other
  date: 2005-02
  description: >-
    O primaz da IEAB, Orlando Santos de Oliveira, suspende preventivamente o bispo Robinson Cavalcanti e nomeia
    o bispo Filadelfo de Oliveira Neto autoridade eclesiástica da Diocese do Recife; em 26/02/2005 um concílio extraordinário
    da diocese (38 presbíteros presentes) reconhece Cavalcanti como diocesano em pleno exercício
  status: probable
  sources:
  - source: alc-2005-03-06
    quote: >-
      An Extraordinary Council Session of the Anglican Diocese of Recife, meeting in this capital in the state of
      Pernambuco last February 26, unanimously agreed to recognize Edward Robinson de Barros Cavalcanti as diocesan
      bishop in full exercise of his ministry.
  - source: alc-2005-03-06
    quote: >-
      to preventively suspend Cavalcanti, adopted four days earlier in an Extraordinary Council and to name Bishop
      Filadelfo de Oliveira Neto as Church authority for this diocese in eastern Brazil.
  - source: alc-2005-03-06
    quote: A total of 38 priests, 58 lay delegates and 15 observers participated in the Extraordinary Council
- type: other
  date: 2005-03
  description: >-
    Divisão do clero da Diocese do Recife em 2005: segundo Robinson Cavalcanti, 32 clérigos e 90% dos fiéis permaneceram
    em comunhão com ele; para a IEAB, a catedral passa a ser a Igreja da Santíssima Trindade (Espinheiro), e para
    os seguidores de Cavalcanti, a Igreja do Bom Samaritano (Boa Viagem)
  status: probable
  sources:
  - source: alc-2005-03-06
    quote: >-
      "The great majority, 90 percent of the faithful and 32 clergy are in parishes that remain in communion with
      me," according to Cavalcanti.
  - source: alc-2005-03-06
    quote: >-
      For the IEAB, said Oliveira Neto, the Anglican Cathedral is the Holy Trinity Church in Espinheiro. Those who
      follow Cavalcanti consider the Anglican Cathedral to the Good Samaritan Church in the Buen Viaje neighborhood.
