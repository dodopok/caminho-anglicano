    quote: Dom Edward Robinson de Barros Cavalcanti - Bispo Diocesano
  notes: >-
    Fonte o apresenta como terceiro bispo da diocese (após Sherrill e Clóvis Erly Rodrigues), primeiro nativo e
    primeiro eleito localmente. Instituição como titular em 19/10/1997, na Catedral da Santíssima Trindade, Recife,
    após a renúncia de Clóvis Erly Rodrigues. Robinson considerou a deposição nula e manteve-se como bispo da maioria
    das paróquias. Anexo D da tese (bispos por diocese). Anexo D marca "(Deposto)"; o dia 10/06/2005 vem do Anexo
    Q (Processo Canônico nº 001/2005). Antes disso: suspensão preventiva em 18/02/2005 (Anexo N). Eleito bispo coadjutor
    em 28/06/1997 (Concílio Extraordinário em Vera Cruz, Itaparica), sagrado 05/10/1997, instalado 19/10/1997. Suspenso
    preventivamente em 18/02/2005 (Resolução 001/2005); deposto em 10/06/2005 pelo Primaz Orlando Santos de Oliveira
    após o Tribunal Superior Eclesiástico reconhecer sua culpabilidade (Processo Canônico 001/2005). Sucedeu Clóvis
    Erly Rodrigues; primeira eleição feita pelo concílio local, já com a diocese autônoma. O fim do vínculo com
    a IEAB (deposição de 2005) é descrito pelo próprio autor como 'processo politicamente motivado e espúrio'. Instalado
    e empossado na Paróquia (depois Catedral) da Santíssima Trindade, Recife. Consta assim na carta aberta de 08/12/2002.
