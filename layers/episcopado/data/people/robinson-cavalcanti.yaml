    a ruptura foi gradual (concílio de dez/2004, carta de jan/2005, concílio extraordinário de 26/02/2005). Em 25/01/2005
    declarou suspenso o relacionamento da Diocese com a IEAB; em 23/09/2005 o Cone Sul (Venables) aceitou o pedido
    de supervisão primacial. Início pode ser datado de 25/01/2005 (ruptura) ou 23/09/2005 (acolhida pelo Cone Sul).
