  sources:
  - source: drv-10-anos-sagracao
    quote: naquela manhã do domingo de 05 de outubro de 1997, tinha lugar o Rito Sacramental da minha Sagração
  - source: drv-10-anos-sagracao
    quote: E lá estavam as luzes do palco iluminado do Teatro Guararapes (Centro de Convenções – Olinda – PE)
  - source: drv-peregrino-posse
    quote: Foi o que aconteceu comigo no dia 05 de outubro de 1997.
  - source: costa2021
    quote: >-
      O novo bispo coadjutor foi sagrado no dia 05 de outubro de 1997, em cerimônia realizada no Teatro Guararapes183,
      do Centro de Convenções de Pernambuco, pelo Primaz, Glauco Soares de Lima, tendo como co-sagrantes os bispos
      Edmund Sherrill, Almir dos Santos e Clovis Erly Rodrigues.
  - source: costa2021
    quote: >-
      No dia 05 de outubro de 1997, Edward Robinson de Barros Cavalcanti95 foi sagrado pelo Primaz em cerimônia
      realizada no Centro de Convenções de Pernambuco
  - source: cant-meninos-eu-vi-2004
    quote: >-
      Com ele fui “leitor” (ministro leigo), postulante, candidato, diácono e presbítero (e ele seria um dos co-sagrantes
      do meu episcopado).
  - source: cant-novas-igrejas-2024
    quote: >-
      Em uma grande cerimônia realizada em 05 de outubro de 1997, no Teatro Guararapes, na capital pernambucana,
      dom Robinson Cavalcanti se tornou o primeiro bispo do Nordeste da Comunhão Anglicana.
    page: '25'
  - source: iab-poster-linhagem-meira
    quote: >-
      Em 1997, Edmund participou da consagração de Edward Robinson de Barros Cavalcanti como bispo coadjutor, que
      depois se tornaria diocesano.
  - source: lrec-ultimato-robinson-bio
    quote: Em 1997 foi eleito, sagrado e instituído Bispo da Diocese Anglicana do Recife
  - source: tlc-2012-02-27
    quote: Cavalcanti was consecrated as Bishop of Recife in 1997.
  - source: wp-en-cavalcanti
    quote: >-
      In 1997 he was elected and consecrated Bishop of the Diocese of Recife, attending the Lambeth Conference of
      1998
  - source: costa2021
    quote: >-
      O novo bispo coadjutor foi sagrado no dia 05 de outubro de 1997, em cerimônia realizada no Teatro Guararapes
    page: '186'
  - source: costa2021
    quote: >-
      Centro de Convenções de Pernambuco, pelo Primaz, Glauco Soares de Lima, tendo como co-sagrantes os bispos
      Edmund Sherrill, Almir dos Santos e Clovis Erly Rodrigues.
    page: '186'
  notes: >-
    Relato do próprio sagrado: eleito, depois homologado, sagrado com imposição de mãos de pelo menos três bispos;
    sagrantes não nomeados nestes textos. Foi bispo coadjutor por 'apenas quinze dias'. Confirma a pista dos posteres
    (participacao de Edmund Sherrill). Eleito coadjutor em 28/06/1997 no Concilio Extraordinario em Vera Cruz, Ilha
    de Itaparica (BA); instalado como bispo diocesano em 19/10/1997. Uma nota da mesma tese (n. 225) cita "Teatro
    Beberibe". O proprio Robinson, em testemunho de 2004 hospedado no Projeto Cantuaria, confirma que Sherrill foi
    um dos seus co-sagrantes. O livro não nomeia os sagrantes. O pôster só diz que Sherrill 'participou'; sagrante
    principal desconhecido por esta fonte. O pôster da IAB (Meira) diz 'bispo coadjutor, que depois se tornaria
    diocesano'. Data exata e sagrantes não encontrados ainda. A tese diz 'sagrado pelo Primaz' sem nomeá-lo; Glauco
    Soares de Lima era Primaz de 1993 a 2003 segundo a mesma tese (inferência). Co-sagrantes não informados. Sagrado
    como bispo coadjutor da Diocese Anglicana do Recife; instalado como 3º diocesano em 19/10/1997. Na nota 225
    (p. 243) a própria tese diz 'Robinson Cavalcanti no Teatro Beberibe, no Recife' — divergência de local (ver
    dúvidas).
