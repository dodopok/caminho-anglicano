- type: other
  date: '2009-12-03'
  description: >-
    XXIX Concílio Diocesano da Diocese Anglicana do Recife, realizado em Jaboatão dos Guararapes (PE) entre 3 e
    5 de dezembro de 2009. No sermão de abertura o bispo diocesano agradece, entre os feitos do ano, a publicação
    do Livro de Oração Comum Brasileiro (LOCb), a criação dos IATs (Institutos Anglicanos de Teologia), a consolidação
    do Arcediagado Sul/Sudeste e o relacionamento com os segmentos ortodoxos da Comunhão Anglicana. O sermão de
    encerramento anuncia, para o mesmo culto, a profissão de votos de um noviço de ordem religiosa, a formatura
    e investidura da primeira turma de capelães, o reconhecimento de ordem diaconal e ordenações diaconais, e fixa
    as vocações como tema do ano seguinte.
