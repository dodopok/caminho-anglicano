    Em 01/07/2009 (atualizada em 24/12/2009) a página "Arcediagados" do site da Diocese lista 54 comunidades em
    seis arcediagados: Extraterritorial Internacional-EUA (5), Centro (7), Norte (7, página sem o rótulo "Norte"),
    PB-RN-CE (14), Sul (8) e Extraterritorial Nacional Sul/Sudeste (13). Em jan/2009 os arcediagados extraterritoriais
    constavam como "Arcediagado Especial da América do Norte - EUA" e "Arcediagado Brasil Sul/Suldeste".
  status: confirmed
  sources:
