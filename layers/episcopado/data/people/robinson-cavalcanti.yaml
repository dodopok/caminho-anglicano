- type: other
  date: '2012-02-26'
  description: Robinson Cavalcanti e a esposa, Miriam, são mortos a facadas em casa, em Olinda, pelo filho adotivo.
  status: probable
  sources:
  - source: wp-en-cavalcanti
    quote: >-
      Archbishop Robinson Cavalcanti and his wife, Miriam Nunes Machado Cotias Cavalcanti, where both murdered in
