    quote: Fundada em 17 de novembro de 1997
  - source: darl3-n4616
    quote: >-
      quando passava o bastão para a Revda. Gorete Marques, ose, após ter Confirmado a primeira remessa de membros
  - source: darl3-n4616
    quote: >-
      Revda. Gorete é Pároca e Arcediaga na região Norte da Diocese; Rev. Tibério Marques é Secretário Diocesano
      de Homens e Contador Diocesano
- type: other
  date: '2008-02-29'
  description: >-
    Em 29/02/2008 a Diocese do Recife noticiou que o seu bispo, Robinson Cavalcanti, foi convidado a integrar a
    Equipe de Recursos Teológicos da GAFCON (conferência de anglicanos ortodoxos prevista para junho de 2008, em
    Jerusalém).
