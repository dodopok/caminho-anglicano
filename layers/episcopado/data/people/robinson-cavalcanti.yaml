  status: probable
  sources:
  - source: costa2021
    quote: >-
      todos estes clérigos e clérigas foram desligados da Igreja Episcopal Anglicana do Brasil e destituídos das
      suas Sagradas Ordens, por meio do Decreto Diocesano nº 01 de 2005.
