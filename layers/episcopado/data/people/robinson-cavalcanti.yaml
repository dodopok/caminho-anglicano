    quote: Foi criada a Igreja Catedral, com seu Deão e Cabido
  - source: drv-resgatando-iv
    quote: >-
      Dois Seminários Menores foram estabelecidos: o ITAR, em João Pessoa-PB e o IAT, em Recife, depois em Olinda-PE.
- type: other
  date: 1999/2000
  description: >-
    Depois de uma 'Confraternização de Natal' em 1999, Paulo Garcia e Sebastião Gameleira teriam instigado clérigos
    e ministros leigos contra o bispo diocesano; houve audiência presidida pelo bispo primaz, em que quase todo
    o clero declarou solidariedade ao bispo. Segundo a fonte, nesse período era criada a Igreja Episcopal Carismática
    do Brasil, para a qual saíram o Rev. Antônio Carlos (João Pessoa) e o ministro leigo Antônio Eça (Recife).
  status: probable
  sources:
  - source: drv-resgatando-iv
    quote: >-
      os reverendos: Paulo Garcia e Sebastião Gameleira instigaram clérigos e ministros leigos contra o Bispo Diocesano
  - source: drv-resgatando-iv
    quote: >-
      enquanto (na surdina) era criada a Igreja Episcopal Carismática do Brasil, saindo para ela – no primeiro episódio
      cismático – o Rev. Antônio Carlos, em João Pessoa-PB e o ML. Antônio Eça, no Recife-PE
- type: other
  date: '2003'
  description: >-
    Em junho de 2003 os bispos e o Conselho Diocesano do Recife emitiram 'A Afirmação do Recife', condenando as
    decisões de New Westminster (Canadá) e New Hampshire (EUA) e reiterando a Resolução 1.10 de Lambeth; em dezembro
    de 2003 o Concílio Diocesano (João Pessoa) aprovou dispositivo canônico limitando relações institucionais a
    entidades que subscrevessem a Resolução 1.10.
  status: probable
  sources:
  - source: drv-resgatando-v
    quote: >-
      Os Bispos e o Conselho Diocesano da DAR, em junho daquele ano, emitiram um documento “A Afirmação do Recife”
  - source: drv-resgatando-v
    quote: No Concílio Diocesano de dezembro de 2003, em João Pessoa-PB, foi aprovado um dispositivo canônico
- type: other
  date: '2004'
  description: >-
    Em 2004 Robinson Cavalcanti participou, em Akron (Ohio, EUA), de confirmação coletiva de 111 pessoas, ao lado
    de bispos aposentados, para famílias de paróquias da Diocese de Ohio que não aceitavam a confirmação pelo bispo
    local, que votara a favor e participara da sagração de Gene Robinson.
  status: probable
  sources:
  - source: drv-resgatando-v
    quote: >-
      para realizar uma cerimônia pública e coletiva de Confirmação de 111 pessoas, no recinto do auditório da Igreja
      Ortodoxa Romena, na cidade de Akkron
- type: other
  date: 2004-12
  description: >-
    O XXIV Concílio Diocesano do Recife foi 'suspenso' por decreto do Primaz da IEAB 48 horas antes de começar;
    os delegados presentes decidiram realizá-lo mesmo assim, aprovaram artigo doutrinário nos cânones e enviaram
    carta aberta ao arcebispo de Cantuária e aos primazes pedindo 'Supervisão Primacial Adequada Alternativa com
    Jurisdição'. Bispos de São Paulo e Curitiba e dois clérigos e dois leigos requereram processo disciplinar contra
    o bispo diocesano.
  status: probable
  sources:
  - source: drv-resgatando-v
    quote: >-
      o XXIV Concílio Diocesano, convocado publicamente um ano antes, foi “suspenso” por um Decreto do Primaz
  - source: drv-resgatando-v
    quote: >-
      Os Bispos Diocesanos de São Paulo e Curitiba, mais dois clérigos e dois leigos “opinionistas” da DAR entram
      com um pedido de abertura de Processo Disciplinar contra o Bispo Diocesano da DAR
- type: other
  date: '2005-04-09'
  description: >-
    Em 09/04/2005 o bispo Robinson comunicou ao clero que o relatório da Comissão Provincial de Investigação, acolhido
    pelo Primaz e pelo Procurador Geral da IEAB (Celso Franco de Oliveira), fora encaminhado ao Tribunal Superior
    Eclesiástico, presidido pelo bispo aposentado Clóvis Erly Rodrigues, citando como acusados vários clérigos do
    Recife (Miguel Uchoa, Estevão Menezes, Fernando Acosta, Ian Meldrum, Siméa Meldrum, Juciara, Luiz Souza, Manoel
    Almeida, Maria Gorete, Maurício Coelho, Raniere Almeida) e recomendando protesto à SAMS pela atuação dos missionários
    Marcus Throup, Ian e Siméa Meldrum.
  status: confirmed
  sources:
  - source: drv-carta-clero-processo-2005
    quote: >-
      Relatório esse acolhido pelo Primaz e pelo Procurador Geral da IEAB Dom Celso Franco de Oliveira, e ora encaminhado
      ao Tribunal Superior Eclesiástico, presidido pelo Bispo aposentado Dom Clóvis Erly Rodrigues, para julgamento.
- type: other
  date: '2005-06-27'
  description: >-
    Em carta de 27/06/2005 ao arcebispo de Cantuária e aos primazes, a Diocese Anglicana do Recife (Robinson Cavalcanti
    e Maurício R. Fernandes Coelho, presidente do Conselho Diocesano) pede a revogação da deposição do bispo diocesano,
    a transferência da diocese a outra província, a criação de um arcediagado especial não territorial para a minoria
    e uma comissão bilateral; afirma que o Primaz depôs o bispo antes de qualquer ação do Painel de Referência e
    convoca Concílio Extraordinário para 6 de agosto.
  status: confirmed
  sources:
  - source: drv-carta-cantuaria
    quote: Recife, 27 de junho de 2005.
  - source: drv-carta-cantuaria
    quote: >-
      e depôs o Bispo Diocesano do Recife antes que qualquer ação do Painel de Referência pudesse ser tomada
  - source: drv-carta-cantuaria
    quote: Revogação imediata da deposição do Bispo Diocesano
- type: other
  date: 2005-06
  description: >-
    Segundo entrevista do Rev. Estevão Menezes ao FolhaGospel.com (21/06/2005), logo após a notícia da deposição
    o bispo Robinson manteve a agenda: ordenou cinco novos pastores na Con-Catedral da Ressurreição (João Pessoa)
    e confirmou mais de 90 pessoas na Paróquia do Espírito Santo (Jaboatão); a sentença foi atribuída ao bispo primaz
    Orlando Santos de Oliveira.
  status: probable
  sources:
  - source: drv-entrevista-estevao-2005
    quote: >-
      ordenou 5 novos pastores na Con-Catedral da Ressurreição, João Pessoa, e confirmou (profissão de fé) mais
      de 90 novos membros na Paróquia Anglicana do Espírito Santo, em Jaboatão.
  - source: drv-entrevista-estevao-2005
    quote: Das alegações do bispo primaz, Dom Orlando Santos de Oliveira
- type: other
  date: '2005-07-28'
  description: >-
    Em 28/07/2005, 38 clérigos do Recife responderam ao bispo sufragâneo Filadelfo Oliveira Neto que as decisões
    institucionais haviam sido tomadas em concílio e que suspendiam o relacionamento com o 'estamento de poder'
    da IEAB, não com a instituição, mantendo plena comunhão com o bispo diocesano Robinson Cavalcanti.
  status: confirmed
  sources:
  - source: drv-carta-filadelfo
    quote: >-
      Em resposta a vossa carta de 04 de julho de 2005, dirigida aos clérigos desta Diocese, abaixo relacionados
  - source: drv-carta-filadelfo
    quote: mantendo plena comunhão com o bispo diocesano Revmo Dom Edward Robinson de Barros Cavalcanti
- type: other
  date: '2005-11-14'
  description: >-
    Em 2005 a Câmara dos Bispos da IEAB apresentou ao arcebispo de Cantuária (carta de 14/11/2005, assinada por
    doze bispos) a versão de que a deposição de Robinson Cavalcanti decorreu de julgamento do Tribunal Superior
    Eclesiástico, homologado unanimemente pela Câmara, e de que os 32 clérigos incorreram em abandono da comunhão;
    criticou a recepção do bispo por Gregory Venables (Cone Sul).
  status: confirmed
  sources:
  - source: drv-pronunciamento-ieab-2005
    quote: acatou e homologou unanimemente a decisão do Tribunal
  - source: drv-pronunciamento-ieab-2005
    quote: nossos Cânones Provinciais prevêem o abandono da comunhão da Igreja
  - source: drv-pronunciamento-ieab-2005
    quote: É a primeira vez na história da IEAB que isso acontece.
- type: other
  date: '2006-09-30'
  description: >-
    Declaração da Boa Viagem (30/09/2006, Catedral Anglicana do Bom Samaritano, Recife): representantes de seis
    jurisdições anglicanas brasileiras (Diocese do Recife sob autoridade do Cone Sul, IAB-Lorite, Igreja Episcopal
    Reformada, Igreja Anglicana Missionária do Redentor, Igreja Anglicana Ortodoxa e Igreja Anglicana Brasileira,
    mais a Iglesia Católica Anglicana del Ecuador como associada extranacional) criaram o Movimento Anglicano 'Por
    Uma Causa Comum'; o ato ocorreu no culto pelo nono aniversário de sagração de Robinson Cavalcanti.
  status: confirmed
  sources:
  - source: drv-comunicado-imprensa-2006
    quote: >-
      Representantes de seis diferentes jurisdições anglicanas brasileiras – em comunhão ou não com a Sé de Cantuária
      – assinaram ontem, 30.09.2006, a “Declaração da Boa Viagem”, criando o “Movimento Anglicano Por Uma Causa
      Comum”.
  - source: drv-comunicado-imprensa-2006
    quote: >-
      lido solenemente no Culto de Ação de Graças pelo nono aniversário de Sagração Episcopal de Dom Robinson Cavalcanti
- type: other
  date: '2006-11-09'
  description: >-
    Nota de 09/11/2006 lista 33 comunidades da 'legítima Diocese do Recife' (catedral no Bom Samaritano, Boa Viagem;
    con-catedral da Ressurreição, João Pessoa), 44 ministros ordenados no Brasil e 16 com domicílio canônico na
    diocese residentes no exterior, e informa comunidades associadas sob supervisão do bispo do Recife em Washington,
    Oregon e Flórida (EUA) e dois seminários (SAT-PB, SAT-PE).
  status: confirmed
  sources:
  - source: drv-nota-esclarecimento-2006
    quote: >-
      Comunidades associadas, sob Supervisão Episcopal do Recife, se encontram nos Estados de: Washington, Oregon
      e Flórida, nos Estados Unidos.
  - source: drv-nota-esclarecimento-2006
    quote: A Diocese possui dois Seminários Teológicos Anglicanos (SAT-PB, em João Pessoa e SAT-PE, no Recife).
- type: other
  date: '2006-10-13'
  description: >-
    Decisão episcopal de 13/10/2006: Robinson Cavalcanti declara-se disponível a permanecer como bispo diocesano
    até o limite canônico de 68 anos (no máximo mais seis anos), adia a discussão da sucessão para depois do Concílio
    de dezembro de 2008 e prevê criar condições para eventual eleição de bispo(a) coadjutor(a); menciona a 'Diocese
    B' da IEAB com titular instalado.
  status: confirmed
  sources:
  - source: drv-decisao-episcopal-2006
    quote: >-
      até o limite máximo da atual compulsória canônica de 68 anos, ou seja, o limite máximo de mais 6 (seis) anos
  - source: drv-decisao-episcopal-2006
    quote: a eventual eleição de um(a) Bispo(a) Coadjutor(a)
- type: other
  date: '2007-11-12'
  description: >-
    Comunicado de 12/11/2007: o Sínodo da Igreja Anglicana do Cone Sul, por seis delegações diocesanas (uma abstenção),
    recomendou à Câmara dos Bispos e ao Conselho Executivo as medidas para a recepção permanente da Diocese do Recife;
    o primaz pretendia visitar o Recife em fevereiro de 2008.
  status: confirmed
  sources:
  - source: drv-comunicado-episcopal-2007
    quote: >-
      deliberou recomendar à Câmara dos Bispos e ao Conselho Executivo que sejam tomadas as medidas Constitucionais,
      Canônicas e Administrativas cabíveis visando à recepção permanente da Diocese do Recife
- type: other
  date: '2007-11-30'
  description: >-
    Em 30/11/2007 Robinson Cavalcanti informa que a Diocese do Recife recebeu a Constituição e os Cânones Gerais
    do Cone Sul e que os cânones diocesanos seriam ajustados no Concílio Extraordinário de 08/12/2007; a ordenação
    feminina seria matéria de resolução sinodal, não de cânon.
  status: confirmed
  sources:
  - source: drv-adequacao-cone-sul
    quote: recebemos da Secretaria Provincial um exemplar da Constituição e dos Cânones Gerais do Cone Sul
  - source: drv-adequacao-cone-sul
    quote: A questão da Ordenação feminina não é matéria constitucional ou canônica, mas de Resolução Sinodal.
- type: other
  date: '2008-09-09'
  description: >-
    Em 09/09/2008, após a conferência Crescendo Juntos (Buenos Aires), Robinson relata que o primaz Gregory Venables
    reiterou apoio e admitiu vínculo a outra província do GAFCON caso houvesse dificuldade no Cone Sul, com provável
    fórmula de diocese extraprovincial; relata também sugestão de um bispo de eliminar dos cânones diocesanos a
    possibilidade de ordenar mulheres ao episcopado.
  status: confirmed
  sources:
  - source: drv-informe-confidencial-2008
    quote: O Primaz reiterou o seu apoio irrestrito à nossa Diocese
  - source: drv-informe-confidencial-2008
    quote: eliminássemos dos nossos Cânones a possibilidade de Ordenação de mulheres ao Episcopado
- type: other
  date: '2008-07-16'
  description: >-
    Em 2008 Robinson Cavalcanti descreve a Diocese do Recife com 32 anos e 34 comunidades, 24 delas surgidas no
    seu episcopado, clero majoritariamente aposentado ou 'fazedor de tendas' e dependente de doações no exterior;
    recorda que Dom Clóvis Erly Rodrigues exigia que os ordenandos assinassem termo de ausência de compromisso de
    sustento.
  status: confirmed
  sources:
  - source: drv-papel-clovis
    quote: A Diocese do Recife tem apenas 32 anos, 24 de suas 34 comunidades surgiram no presente Episcopado
  - source: drv-papel-clovis
    quote: >-
      o meu predecessor, Dom Clóvis Erly Rodrigues, exigia das pessoas que ele ia Ordenar que assinassem um papel
- type: other
  date: '2002-07-28'
  description: >-
    Em 28/07/2002, o Diário de Pernambuco publicou a matéria "Liberal vai dirigir a Igreja Anglicana" (sobre a escolha
    de Rowan Williams como arcebispo de Cantuária); no mesmo dia, em culto, o deão Paulo Garcia declarou-se contrário
    ao que chamou de comportamentos antibíblicos, como a ordenação de sacerdotes homossexuais. A dissertação de
    Queiroz data dessa matéria o início do clima de desconforto com o bispo Robinson Cavalcanti.
  status: probable
  sources:
  - source: queiroz-2004-ufpe
    quote: >-
      uma matéria publicada no Diário de Pernambuco em 28 de julho de 2002 (domingo), cuja manchete era “Liberal
      vai dirigir a Igreja Anglicana”
  - source: queiroz-2004-ufpe
    quote: neste mesmo dia o Pr. Paulo declarou em culto que não era a favor de tal postura do clero anglicano
- type: other
  date: '2002'
  description: >-
    Motivos da ruptura de Paulo Garcia com a IEAB (2002), em duas versões. Segundo o ACNS e Queiroz, a comunidade
    alegou divergências com o bispo sobre divórcio, casais sem casamento civil e a postura de setores da Comunhão
    Anglicana quanto à homossexualidade. Segundo lideranças anglicanas citadas por Queiroz e Costa, os argumentos
    doutrinários foram pretexto: pesariam o convite para ingressar na Igreja Episcopal Carismática, a proximidade
    da aposentadoria e a dificuldade em seguir as regras da Igreja.
  status: contested
  sources:
  - source: lpg-acns-2002
    quote: >-
      the cathedral took the decision based on disagreements with the bishop on issues such as divorce and non-legally
      married couples in the Church
  - source: queiroz-2004-ufpe
    quote: >-
      Os argumentos doutrinários para o cisma da comunidade da Santíssima Trindade, segundo lideranças da Igreja
      Anglicana, foram apenas pretextos.
  - source: costa2021
    quote: >-
      as dificuldades que tinha em seguir as regras da religião – pois ele não se submetia à autoridade hierárquica
      de Robinson; e a sua proximidade para se aposentar
- type: other
  date: 2002-10
  description: >-
    Entrevista do deão Garcia à Revista Eclésia (25/10/2002), na qual falou da relação tensa com o bispo Robinson
    Cavalcanti e dos motivos do rompimento; em 27/10/2002, o Diário de Pernambuco noticiou "Catedral é disputada
    na Justiça": a comunidade de Garcia alegava direito ao templo porque, desde 1999, a igreja deixara de ser nomeada
    Holy Trinity Church e passara a Igreja da Santíssima Trindade, e porque as reformas teriam sido custeadas por
    membros.
  status: probable
  sources:
  - source: queiroz-2004-ufpe
    quote: >-
      Numa entrevista realizada pela Revista Eclésia, em 25 de outubro de 2002, o Deão Garcia mencionou a sua relação
      tensa com o bispo Dom Robinson
  - source: queiroz-2004-ufpe
    quote: >-
      O grupo dos carismáticos diz que tem direito à posse do templo, pois, desde 1999, a igreja deixou de ser nomeada
      Holy Trinity Church
  - source: queiroz-2004-ufpe
    quote: Diário de Pernambuco – Recife, domingo, 27 de outubro de 2002.
- type: other
  date: '2002-11-14'
  description: >-
    Carta de Dom Robinson Cavalcanti à comunidade diocesana, datada de 14/11/2002, sobre o momento doloroso vivido
    pela diocese após a saída da Catedral da Santíssima Trindade.
  status: probable
  sources:
  - source: queiroz-2004-ufpe
    quote: Vejamos uma carta de Dom Robinson à comunidade, datada em 14 de novembro de 2002
- type: other
  date: '2012'
  description: >-
    O canal do YouTube hoje chamado 'Igreja Episcopal Unida' tem como últimos vídeos (jan-mar/2012) a série 'Pergunte
    ao Bispo', da Diocese do Recife, com o bispo Robinson Cavalcanti; o feed não lista vídeos posteriores.
  status: probable
  sources:
  - source: her-ieub-yt-rss
    quote: Programa Pergunte ao Bispo, da Igreja Anglicana - Diocese do Recife
  - source: her-ieub-yt-rss
    quote: HEROIS DA FÉ / DOM ROBINSON CAVALCANTI
- type: other
  date: '2012-03-17'
  description: >-
    Eleito bispo sufragâneo em 2011, Evilásio Tenório teria sido sagrado, segundo a Wikipédia, por Robinson Cavalcanti,
    mas a sagração ficou para depois da morte do bispo (26/02/2012) e ocorreu em 17/03/2012. Ainda segundo a Wikipédia,
    Evilásio permaneceu provisoriamente como bispo diocesano até a eleição do novo líder em 19/05/2012.
  status: probable
  sources:
  - source: lrec-ptwp-evilasio
    quote: >-
      Em virtude da morte de Dom Robinson, em 26 de fevereiro de 2012, Dom Evilásio permaneceu provisoriamente como
      bispo diocesano, até a eleição do novo líder da Igreja Anglicana, em 19 de maio de 2012.
- type: other
  date: '2010'
  description: >-
    Como bispo diocesano do Recife, Robinson Cavalcanti afirma ter ordenado 99 diáconos e 85 presbíteros em sete
    anos de governo (texto de 2010); no mesmo texto, diz que 34 das 44 comunidades então existentes na diocese foram
    abertas nesse período.
  status: confirmed
  sources:
  - source: lrec-ultimato-robinson-bio
    quote: Como Bispo Diocesano, ordenou 99 Diáconos e 85 Presbíteros.
  - source: lrec-ultimato-robinson-bio
    quote: Nesses sete anos foram abertas 34 das presentes 44 comunidades da Diocese Anglicana do Recife
- type: other
  date: '2004-09-15'
  description: >-
    Em diretrizes episcopais datadas de 15/09/2004, o bispo Robinson Cavalcanti afirma que a Diocese Anglicana do
    Recife 'é uma Igreja Local Autônoma da Comunhão Anglicana, sob a Sé de Cantuária, vinculada provincialmente
    à Igreja Episcopal Anglicana do Brasil', com a Constituição e os Cânones da IEAB em plena vigência, enquanto
    aguarda o relatório da Comissão de Lambeth (Comissão Eames).
  status: confirmed
  sources:
  - source: rta-dar-diretrizes-2004
    quote: >-
      A Diocese Anglicana do Recife é uma Igreja Local Autônoma da Comunhão Anglicana, sob a Sé de Cantuária, vinculada
      provincialmente à Igreja Episcopal Anglicana do Brasil.
  - source: rta-dar-diretrizes-2004
    quote: Recife (PE), 15 de Setembro de 2004.
- type: other
  date: '2005-02-18'
  description: >-
    Em 18/02/2005 o Bispo Primaz Orlando Santos de Oliveira suspendeu preventivamente do ofício e ministério o bispo
    Edward Robinson de Barros Cavalcanti, pela Resolução 001/2005, no âmbito do processo instaurado pela Câmara
    dos Bispos.
  status: confirmed
  sources:
  - source: rta-sn-resolucao-2005
    quote: >-
      Pela Suspensão do exercício do Ofício e Ministério, em caráter preventivo, de Dom Edward Robison de Barros
      Cavalcanti
  - source: rta-sn-resolucao-2005
    quote: Porto Alegre,  18 de fevereiro de 2005.
- type: deposition
  date: '2005-06-10'
  description: >-
    Em 10/06/2005, em Porto Alegre, o Bispo Primaz Orlando Santos de Oliveira, com a Câmara dos Bispos reunida extraordinariamente
    e o parecer unânime do Tribunal Superior Eclesiástico, decretou a deposição de Edward Robinson de Barros Cavalcanti
    do exercício do ministério ordenado da IEAB; a nota foi publicada no SNIEAB em 17/06/2005. Entre os fatos, o
    decreto cita a declaração unilateral de 25/01/2005 de que a Diocese Anglicana do Recife seria autônoma e sem
    vínculo com a IEAB. Segundo a IEAB, 'cessam todos os seus vínculos canônicos'.
  status: confirmed
  sources:
  - source: rta-sn-deposicao-2005
    quote: >-
      o Bispo Primaz decreta, na forma do Capítulo IV, Cânon 4, Artigo 1º, alínea D, dos Cânones Gerais da Igreja
      Episcopal Anglicana do Brasil, a sua deposição do exercício do ministério ordenado desta Igreja
  - source: rta-sn-deposicao-2005
    quote: >-
      Dado e passado sob nosso selo e assinatura, na cidade de Porto Alegre, no dia 10 de junho de 2005, Anno Domini.
- type: other
  date: 2001-12
  description: >-
    Segundo o sermão de 15/12/2001, o Concílio da Diocese Anglicana do Recife, realizado em Paripueiras (litoral
    de Alagoas) na semana anterior, elegeu Filadelfo de Oliveira Neto bispo auxiliar; o texto menciona ainda o recém-designado
    arcediago para a Paraíba e o Rio Grande do Norte, Luiz Souza de França (Paróquia da Ressurreição, João Pessoa).
  status: confirmed
  sources:
  - source: rta-orildo-lilian-2001
    quote: >-
      D. Filadelfo de Oliveira Neto, eleito Bispo Auxiliar na última Reunião Conciliar, realizada na aprazível Paripueiras,
      lá no litoral das Alagoas, na semana passada
  - source: rta-orildo-lilian-2001
    quote: >-
      recém designado Venerável Arcediago para a Paraíba e Rio Grande do Norte, Reverendo Luiz Souza de França,
      da Paróquia da Ressurreição em João Pessoa
- type: other
  date: '1998'
  description: >-
    Na Conferência de Lambeth de 1998, segundo a cronologia da Diocese Anglicana do Recife, o bispo Robinson Cavalcanti
    foi o único bispo do Brasil a votar com a maioria a Resolução 1.10 (prática homossexual incompatível com as
    Escrituras) e, de volta a Recife, editou uma Resolução Diocesana aplicando os princípios em sua jurisdição.
  status: confirmed
  sources:
  - source: rta-ier-cronologia
    quote: >-
      o Bispo Robinson Cavalcanti é o único bispo do Brasil que vota com a maioria, e, ao regressar ao Recife, edita
      uma Resolução Diocesana tornando esses princípios válidos em sua jurisdição
- type: other
  date: 2006-12
