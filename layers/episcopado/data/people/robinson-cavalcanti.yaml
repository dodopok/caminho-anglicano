  notes: >-
    O pôster da IAB (Meira) diz 'bispo coadjutor, que depois se tornaria diocesano'. Data exata e sagrantes não
    encontrados ainda. Confirma a pista dos posteres (participacao de Edmund Sherrill). Eleito coadjutor em 28/06/1997
    no Concilio Extraordinario em Vera Cruz, Ilha de Itaparica (BA); instalado como bispo diocesano em 19/10/1997.
    Uma nota da mesma tese (n. 225) cita "Teatro Beberibe". O pôster só diz que Sherrill 'participou'; sagrante
    principal desconhecido por esta fonte.
