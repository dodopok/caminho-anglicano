biography: >-
  Cientista politico; bispo coadjutor (1997) e diocesano do Recife (1997-2005); deposto pela IEAB em 2005; liderou
  a diocese dissidente ligada ao Cone Sul.
sources:
- source: costa2021
  quote: Edward Robinson de Barros Cavalcanti nasceu no Recife, em 21 de junho de 1944.
- source: costa2021
