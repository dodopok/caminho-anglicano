  - source: ieab-2005-cbispos-cantuaria
    quote: Provinciais prevêem o abandono da comunhão da Igreja.
  - source: ieab-2005-cbispos-cantuaria
    quote: >-
      Recebemos uma resposta coletiva de que todos estavam solidários com a atitude de Robinson Cavalcanti.
  - source: ieab-2005-cbispos-cantuaria
    quote: Brasil recebendo Robinson Cavalcanti e os 32 clérigos dissidentes, de forma unilateral.
