  discrepancies:
  - field: office
    value: coadjutor
    sources:
    - source: iab-poster-linhagem-meira
      quote: >-
        Em 1997, Edmund participou da consagração de Edward Robinson de Barros Cavalcanti como bispo coadjutor,
        que depois se tornaria diocesano.
    - source: costa2021
      quote: >-
        O novo bispo coadjutor foi sagrado no dia 05 de outubro de 1997, em cerimônia realizada no Teatro Guararapes183,
        do Centro de Convenções de Pernambuco, pelo Primaz, Glauco Soares de Lima, tendo como co-sagrantes os bispos
        Edmund Sherrill, Almir dos Santos e Clovis Erly Rodrigues.
