events:
- type: other
  date: 2002-09
  description: >-
    Paulo Garcia declara oficialmente a ruptura com a IEAB; disputa judicial pelo templo da Catedral da Santíssima
    Trindade (Rua Carneiro Vilela, Espinheiro, Recife) entre a comunidade dele e a Diocese do Recife liderada por
    Robinson Cavalcanti
  status: probable
  sources:
  - source: queiroz-2004-ufpe
    quote: >-
      em setembro de 2002, o Pr. Paulo Garcia declarou, oficialmente, a sua ruptura da Igreja Episcopal Anglicana.
  - source: queiroz-2004-ufpe
    quote: >-
      De um lado, a comunidade liderada pelo Pastor Paulo Garcia. Do outro, a Diocese local da Igreja Episcopal
      Anglicana do Brasil (IEAB), liderada por Dom Robinson Cavalcanti.
- type: death
  date: '2012'
  description: Robinson Cavalcanti assassinado em 2012
  status: probable
  sources:
  - source: iab-poster-linhagem-meira
    quote: Robinson foi assassinado em 2012, sem deixar sucessores diretos
- type: other
  date: '2005-01-25'
  description: >-
    Robinson Cavalcanti declara unilateralmente a suspensão da relação da Diocese do Recife com a Província do Brasil
    (IEAB), proclamando-a 'diocese autônoma da Comunhão Anglicana'.
  status: probable
  sources:
  - source: wp-en-cavalcanti
    quote: >-
      On 25 January 2005, Bishop Robinson Cavalcanti, then bishop of the Anglican Diocese of Recife, opposing the
      predominance of the liberal wing in the church, promoted a schism.
- type: deposition
  date: '2005-06-10'
  description: Robinson Cavalcanti é excluído/deposto da IEAB por decisão do Tribunal Eclesiástico Superior.
  status: probable
  sources:
  - source: wp-en-cavalcanti
    quote: he was expelled from the IEAB on 10 June 2005, by decision of the Superior Ecclesiastical Court.
  - source: ai-2018-05-15-uchoa-installed
    quote: >-
      In 2005, the Bishop of Recife, The Rt. Rev. Robinson Cavalcanti, and ninety percent of the clergy of the diocese
      were excommunicated by the liberal Episcopal Church of Brazil.
- type: other
  date: '2012-02-26'
  description: Robinson Cavalcanti e a esposa, Miriam, são mortos a facadas em casa, em Olinda, pelo filho adotivo.
  status: probable
  sources:
  - source: wp-en-cavalcanti
    quote: >-
      Archbishop Robinson Cavalcanti and his wife, Miriam Nunes Machado Cotias Cavalcanti, where both murdered in
      Olinda on February 26, 2012, being stabbed to death by their adoptive son, Eduardo Cavalcanti.
  - source: virtueonline-2026-08-25
    quote: >-
      On the night of February 26, 2012, Robinson Cavalcanti and his wife, Miriam, were stabbed to death in their
      home in Olinda by their adopted son
