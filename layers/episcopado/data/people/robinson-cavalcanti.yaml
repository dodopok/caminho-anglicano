        do meu episcopado).
    - source: cant-novas-igrejas-2024
      quote: >-
        Em uma grande cerimônia realizada em 05 de outubro de 1997, no Teatro Guararapes, na capital pernambucana,
        dom Robinson Cavalcanti se tornou o primeiro bispo do Nordeste da Comunhão Anglicana.
      page: '25'
  notes: >-
    Sagrado como bispo coadjutor da Diocese Anglicana do Recife; instalado como 3º diocesano em 19/10/1997. Na nota
    225 (p. 243) a própria tese diz 'Robinson Cavalcanti no Teatro Beberibe, no Recife' — divergência de local (ver
    dúvidas). A tese diz 'sagrado pelo Primaz' sem nomeá-lo; Glauco Soares de Lima era Primaz de 1993 a 2003 segundo
    a mesma tese (inferência). Co-sagrantes não informados. O pôster da IAB (Meira) diz 'bispo coadjutor, que depois
    se tornaria diocesano'. Data exata e sagrantes não encontrados ainda. O pôster só diz que Sherrill 'participou';
    sagrante principal desconhecido por esta fonte. Confirma a pista dos posteres (participacao de Edmund Sherrill).
    Eleito coadjutor em 28/06/1997 no Concilio Extraordinario em Vera Cruz, Ilha de Itaparica (BA); instalado como
    bispo diocesano em 19/10/1997. Uma nota da mesma tese (n. 225) cita "Teatro Beberibe". O proprio Robinson, em
    testemunho de 2004 hospedado no Projeto Cantuaria, confirma que Sherrill foi um dos seus co-sagrantes. O livro
    não nomeia os sagrantes.
