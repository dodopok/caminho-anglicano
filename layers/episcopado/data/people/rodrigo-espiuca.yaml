id: rodrigo-espiuca
name: Rodrigo Espiúca
biography: >-
  Rodrigo Espiúca dos Anjos Siqueira, membro da TSSF, foi ordenado diácono em 10/09/2005, na Catedral Anglicana
  da Santíssima Trindade, por Filadelfo Oliveira Neto, com outros sete diáconos da Diocese Anglicana do Recife (IEAB).
  Listas da diocese o registram como diácono, secretário administrativo diocesano e auxiliar, e por volta de 2006
  integrava, como reverendo, um grupo de trabalho da diocese. Consta também entre as pessoas ordenadas atuantes
  da DAB.
sources:
