biography: >-
  Daniel Sylvester Tuttle (1837–1923) foi sagrado em 1º de maio de 1867, na Trinity Chapel, em Nova York, por John
  Henry Hopkins, com Horatio Potter e Odenheimer entre os sagrantes, como bispo missionário de Montana, Idaho e
  Utah. Mais tarde foi bispo de Missouri e Presiding Bishop da TEC, e foi o sagrante de W. C. Brown, em 1914. Participou
  de quatro sagrações episcopais, entre elas as de Ethelbert Talbot e Frederick Foote Johnson.
