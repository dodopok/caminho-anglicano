      03 de março de 2013- Dia da Assembleia Geral Extraordinária da Catedral Anglicana de São Paulo na qual ocorre
      a Eleição de Dom Roger Douglas Bird como Bispo da Congregação e de Dom Glauco Soares de Lima.
  - source: lbd-carta-aberta-declaracao
    quote: >-
      Nós, Bispos da Comunhão Anglicana, Dom Roger Douglas Bird e Dom Glauco Soares de Lima, declaramos para os
      devidos fins e a quem interessar possa, que aceitamos e exercemos a supervisão episcopal, pastoral e espiritual
      do reverendo anglicano:
  - source: lbd-anglicanink-2013
    quote: >-
      The Bishop of São Paulo and the former primate of Brazil have quit the Anglican Episcopal Church of Brazil
      (IEAB), taking with them the largest Anglican congregation in South America.
  - source: costa2021
    quote: Atualmente ela possui apenas um bispo, Roger Bird
  - source: lq-ieab-acoes
    quote: >-
      03 de março de 2013- Dia da Assembleia Geral Extraordinária da Catedral Anglicana de São Paulo na qual ocorre
      a Eleição de Dom Roger Douglas Bird como Bispo da Congregação e de Dom Glauco Soares de Lima.
  - source: lq-cat-carta-aberta
    quote: >-
      confirma os Bispos anglicanos Dom Roger Douglas Bird e Dom Glauco Soares de Lima como seus líderes espirituais.
  - source: cant-novas-igrejas-2024
    quote: >-
      Os dois bispos passaram a exercer supervisão episcopal sobre o reverendo e a comunidade através do Movimento
      Anglicano no Brasil.
    page: '93'
  notes: >-
    A Assembleia Geral Extraordinária da Catedral de 03/03/2013 elegeu Bird (e Glauco) como bispos da congregação
    (fonte IEAB). Em 06/04/2013 os dois bispos assinaram declarações de supervisão episcopal sobre Aldo Quintão
    e outros seis clérigos. A IEAB registra em 01/05/2013 a criação da 'Diocese do Movimento Anglicano'. Em 2016
    o MAnB passou a se chamar Diocese Anglicana no Brasil. Fim=2016 indica a mudança de nome da jurisdição, não
    saída do bispo. Versão da IEAB para a assembleia de 03/03/2013 da Catedral; a carta aberta de 19/04/2013 menciona
    a confirmação dos dois bispos por nova Assembleia Geral.
