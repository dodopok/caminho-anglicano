  - source: wp-pt-roger-bird
    quote: >-
      Bird foi eleito quinto bispo da Diocese Anglicana de São Paulo (DASP) no concílio extraordinário de 7 de junho
      de 2007 em São Paulo e foi consagrado no dia 7 de setembro do mesmo ano.
  - source: ec-2007-07
    quote: >-
      Seis bispos estavam na Catedral de São Paulo: o Primaz da IEAB, dom Maurício Andrade, dom Hiroshi Ito, dom
      Celso Franco, da Darj, dom Naudal Gomes, da DAC, dom Glauco Soares de Lima, bispo emérito e dom Nathan Baxter,
      da Diocese da Pensilvânia Central (EUA).
  - source: ec-2007-07
    quote: era 7 de Setembro
  - source: lbd-estandarte-2007-07
    quote: >-
      Foi bela e concorrida a solenidade de sagração do rev. Roger Douglas Bird como bispo da Diocese Anglicana
      de São Paulo - Dasp. Seis bispos estavam na Catedral de São Paulo: o Primaz da IEAB, dom Maurício Andrade,
      dom Hiroshi Ito, dom Celso Franco, da Darj, dom Naudal Gomes, da DAC, dom Glauco Soares de Lima, bispo emérito
      e dom Nathan Baxter, da Diocese da Pensilvânia Central (EUA). Numa tarde linda, [...] era 7 de Setembro.
  - source: wp-pt-roger-bird
    quote: >-
      A solenidade de sagração, na Catedraç Anglicana de São Paulo, foi dirigida pelo Primaz da IEAB, dom Maurício
      José Araújo de Andrade
  - source: lbd-dasp-falecimento
    quote: >-
      Sagrado no dia 7 de setembro do mesmo ano, exerceu o episcopado na Diocese Anglicana de São Paulo até 2012,
      sucedendo o Bispo Hiroshi Ito.
  - source: lbd-danb-falecimento
    quote: >-
      quando foi eleito bispo, no concílio extraordinário (da Igreja Episcopal Anglicana do Brasil - IEAB) de 7
      de junho de 2007 em São Paulo. Sagrado no dia 7 de setembro do mesmo ano, exerceu o episcopado na Diocese
      Anglicana de São Paulo (IEAB) até 2012, sucedendo o Bispo Hiroshi Ito.
  - source: rtb-sn-2007-bird-sagr
    quote: >-
      A cerimônia contou com a participação dos bispos Hiroshi Ito, que na mesma cerimônia transmitiu o pastorado
      da Diocese ao novo bispo, e dos bispos das Dioceses do Rio de Janeiro e Curitiba e de D.Glauco Soares de Lima.
  - source: rtb-sn-2007-bird-sagr
    quote: D. Nathan Baxter , bispo da Diocese Companheira de Pensilvânia Central foi o pregador.
  - source: cant-novas-igrejas-2024
    quote: >-
      Sagrado no dia 7 de setembro do mesmo ano, exerceu o episcopado na Diocese Anglicana de São Paulo (IEAB) até
      2012, sucedendo o Bispo Hiroshi Ito.
    page: '96'
  - source: costa2021
    quote: >-
      A sagração aconteceu na sé diocesana, no feriado nacional de 07 de setembro do mesmo ano, tendo como sagrante
      principal o Bispo Primaz da IEAB, Maurício Andrade, e como co-sagrantes os bispos Hiroshi Ito, Celso Franco,
      Naudal Alves Gomes, Glauco Soares de Lima, e Nathan Baxter, da Diocese da Pensilvânia Central, da Igreja Episcopal
      dos Estados Unidos.
    page: '111'
  notes: >-
    A Wikipedia PT cita o Estandarte Cristao jul-ago/2007 (fonte primaria, nao aberta aqui) para a lista de co-sagrantes.
    O Estandarte Cristão (jul-ago/2007), publicação oficial da IEAB, confirma data (7 de setembro de 2007), local
    (Catedral de São Paulo) e os seis bispos presentes; a identificação do Primaz Maurício Andrade como sagrante
    principal vem da Wikipédia PT e da tese de Costa (2021), não do trecho do Estandarte. Eleito no Concílio Extraordinário
    de 7 de junho de 2007; Bird era deão da Igreja de São Paulo (Saint Paul's Church). Eleição em 07/06/2007; sagração
    em 07/09/2007 (sagrantes não indicados nesta nota). Nota da Diocese Anglicana no Brasil diz que exerceu o episcopado
    em SP até 2012; a IEAB registra aposentadoria compulsória em 16/03/2013. Notícia de 09/09/2007; o primaz Maurício
    Andrade presidiu. Os bispos do Rio de Janeiro (Celso Franco) e de Curitiba (Naudal Gomes) não são nomeados na
    matéria. A lista nominal de co-sagrantes consta do Estandarte Cristão (jul-ago/2007). Eleito no concílio extraordinário
    de 07/06/2007 em São Paulo; o livro não cita os sagrantes.
