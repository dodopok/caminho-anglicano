- type: death
  date: '2023-02-13'
  description: >-
    Falecimento de Roger Douglas Bird na noite de 13/02/2023 (segunda-feira). A nota da DASP diz que 'fez a sua
    Páscoa na noite do dia 13 de fevereiro de 2023'; missa de corpo presente na Catedral Anglicana de São Paulo
    em 15/02/2023 (título de vídeo do canal da catedral). Deixou a esposa Elizabeth Alison Bird, filhas, filho e
    netos. Em 17/02/2024 a Prefeitura de São Paulo inaugurou o CEI Bispo Roger Douglas Bird em sua homenagem (Jardim
    São Jorge, Cidade Ademar; creche administrada pelo IAET).
