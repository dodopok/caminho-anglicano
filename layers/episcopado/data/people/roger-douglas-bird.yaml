  notes: >-
    Local: Diocese Anglicana de São Paulo. Segundo a cronologia oficial da IEAB, o mandato terminou por aposentadoria
    compulsória aos 68 anos (16/03/2013; Bird nasceu em 16/03/1945), e o Primaz assumiu a diocese no dia seguinte.
    Antes, em 21/11/2012, Bird apresentou carta de resignação com efeito a partir de 31/12/2012, mas, segundo a
    IEAB, em 14/12/2012 comunicou por carta registrada em cartório que não resignaria mais. A galeria de bispos
    da DASP (e a nota de falecimento da própria DASP) registram o fim como 2012. Ver evento da carta de resignação.
    Sucedeu Hiroshi Ito. O livro dá fim em 2012 na nota 32, mas no texto o chama 'então diocesano' no desligamento
    de 06/04/2013.
