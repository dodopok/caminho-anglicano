    quote: 2007-2012 – Roger Douglas Bird
  - source: wp-pt-dioc-saopaulo
    quote: >-
      Em 21 de novembro de 2012, o então bispo Roger Bird apresentou sua carta de resignação do cargo de bispo da
      DASP
  - source: lq-ieab-acoes
    quote: >-
      venho, em caráter irrevogável e irretratável e observando todas as formalidades canônicas, renunciar ao cargo
      de Bispo Emérito da Diocese Anglicana de São Paulo-DASP e de membro da Câmara de Bispos da IEAB, bem como
      requerer minha desvinculação da qualidade de clero e membro da DASP.
  - source: lq-ieab-acoes
    quote: 17 de março de 2013- Bispo Primaz Dom Maurício Andrade assume a Diocese Anglicana de São Paulo.
  - source: costa2021
    quote: Diocese Anglicana de São Paulo … 2007-2012 – Roger Douglas Bird
    page: 521-522
  - source: costa2021
    quote: >-
      Assim, a comunidade, junto com o reverendo Aldo Quintão e os bispos Roger Douglas Bird – então diocesano –
      e Glauco Soares de Lima – emérito da DASP –, se desligaram formalmente da Igreja Episcopal Anglicana do Brasil.
    page: '147'
  notes: >-
    Saída formal da IEAB: carta de 10/05/2013 renunciando ao cargo de bispo emérito da DASP, à Câmara de Bispos
    e ao clero da IEAB, citada na cronologia oficial da IEAB. Nas fontes consultadas não há registro de deposição
    concluída; o Tribunal Eclesiástico de Bispos tinha o caso em exame e fixou 11/05/2013 como prazo final de defesa.
    A IEAB lista a saída como pedido do próprio bispo. Depois uniu-se ao Movimento Anglicano no Brasil (fora da
    IEAB). Compulsória em 16/03/2013 (68 anos); em 10/05/2013 carta de desvinculação da IEAB. Anexo D da tese (bispos
    por diocese).
