biography: >-
  André Novaes de Albuquerque Cavalcanti foi sagrado bispo da IECB em 16/11/2009 por Paulo Garcia e atuou como bispo
  auxiliar da Diocese do Recife, sendo descrito como primaz da América Latina. Em 24/03/2019 um comunicado informou
  a separação da IECB da Comunhão Internacional da Igreja Episcopal Carismática (ICCEC), após o rompimento de Garcia
  com o patriarca Craig Bates por problemas de sucessão. Participou de quatro sagrações episcopais, entre elas as
  de Jean Clayton de Albuquerque do Nascimento (2020) e Sérgio Luiz Bezerra Presta (2022).
