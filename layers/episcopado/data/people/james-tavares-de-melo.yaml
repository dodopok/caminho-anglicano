id: james-tavares-de-melo
name: James Tavares de Melo
aliases:
- Dom James Tavares
- James Tavares
biography: >-
  Frei James Tavares de Melo, OFS, foi ordenado em maio de 2016 por Theodoro A. C. de Oliveira, em Votorantim. Escolhido
  bispo sucessor no 2º Concílio da diocese, foi sagrado em 14 de outubro de 2018, na Catedral Santa Mãe de Deus,
  em Votorantim, por Theodoro Oliveira, James Antônio Roque, Frederick Haas e Rafael Ribeiro Campos, e é o segundo
  bispo diocesano de Votorantim.
sources:
- source: cant-novas-igrejas-2024
  quote: No mesmo mês, o frei James Tavares de Melo, OFS, foi ordenado por dom Theodoro em Votorantim.
- source: costa2021
  quote: >-
    Durante o 2º Concílio da Diocese, James Tavares foi escolhido como o bispo sucessor, sendo ordenado ao episcopado
    em 14 de outubro de 2018, na Catedral da Santa Mãe de Deus, em Votorantim.
- source: cant-anglo-catolicismo-2026
  quote: >-
    Sua sagração ocorreu em 14 de outubro de 2018, na Catedral Santa Mãe de Deus, tendo como 171 sagrantes Dom Theodoro
    Oliveira, Dom James Antônio Roque, Dom Frederick Haas e Dom Rafael Ribeiro Campos.
- source: cant-novas-igrejas-2024
