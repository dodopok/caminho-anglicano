biography: >-
  Líder (ministro auxiliar, depois reverendo) da Missão/Paróquia Betânia da Diocese do Recife (IEAB) desde 1996;
  levou a comunidade para fora da IEAB em 2002, foi sagrado bispo em 2006 na comunhão CEEC e eleito arcebispo primaz
  da província das Igrejas Cristãs Episcopais do Brasil em 2021.
sources:
- source: ciceb-betania-historia
  quote: >-
    Em dezembro de 2006, a Paróquia Betânia foi elevada à Catedral da Diocese Missionária do Nordeste do Brasil
    (DMNB), e o Rev. Leonides foi sagrado Bispo dessa diocese.
