      Cristã Episcopal), a partir do desligamento da Paróquia Betânia da Diocese do Recife.
    page: '202'
  notes: >-
    Lista de jan/2002 o traz como presidente da Junta de Capelães Examinadores. Saída em out/2002 (Igreja Episcopal
    Evangélica Betânia → CEEC 2003; eleito bispo abr/2007). Ver frente de jurisdições menores. Em 1996 era "Ministro
    Auxiliar" (não está claro se já ordenado); depois "Rev." como líder da Paróquia Betânia (Cordeiro, Recife).
    Data/ordenante de suas ordenações na IEAB não encontrados. Saída com a paróquia em 2002. Em 1996 era 'Ministro
    Auxiliar'; os pôsteres da IAB e a Wikipédia o chamam de reverendo/presbítero ao tempo da saída. Local: Paróquia
    Betânia.
