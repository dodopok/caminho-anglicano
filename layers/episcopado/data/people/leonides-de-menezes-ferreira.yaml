biography: >-
  Leônides de Menezes liderou a Missão Betânia, instalada em 11/07/1996 na Diocese do Recife da IEAB, sob sua liderança
  como ministro auxiliar. Em 2002 a então Paróquia Betânia decidiu em assembleia desligar-se da IEAB e filiou-se
  à Communion of Evangelical Episcopal Churches, e ele passou a conduzi-la fora da IEAB. Em março de 2004 foi instituído
  cônego e supervisor do 1º Distrito Missionário do Brasil, da CEEC. Foi sagrado bispo diocesano, em dezembro de
  2006 ou abril de 2007 conforme a fonte, em cerimônia oficiada por William Paul Mikler, Hermes Carvalho Fernandes
  e Francisco Buzzo, à frente da Diocese Missionária do Nordeste do Brasil, cuja catedral é a Betânia. Em dezembro
  de 2021, com a constituição da Província das Igrejas Cristãs Episcopais do Brasil, foi eleito arcebispo e primaz.
  Participou de três sagrações episcopais, entre elas as de Gervásio Cavalcante Neto (2014) e Helson Paulo Cruz
  (2020).
