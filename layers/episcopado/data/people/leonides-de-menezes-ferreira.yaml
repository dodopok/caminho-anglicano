  notes: >-
    O texto institucional da CIEEB/CICEB de c. 2008 (site antigo) separa dois momentos: eleição como bispo diocesano
    em dezembro de 2006 e sagração em abril de 2007, oficiada por Mikler, Hermes Carvalho Fernandes e Francisco
    Buzzo, sem apontar sagrante principal. O texto atual do site da CICEB e a tese de Costa (2021) resumem "em dezembro
    de 2006 ... foi sagrado", o que parece fundir eleição e sagração; o blog de 2011 (cópia do texto da CICEB) e
    os pôsteres da IAB trazem abril/2007. Dia exato não informado. O local (Recife) é inferido do contexto; o texto
    não o nomeia. Fonte primária (site da CICEB) nomeia três bispos oficiantes; a ordem em que aparecem (Mikler
    primeiro) sugere Mikler como sagrante principal, mas o site não diz isso explicitamente. CONFLITO: a Wikipédia
    (Diocese Anglicana do Recife) diz eleição em abril de 2007 'ordenado em seguida', e os pôsteres da IAB dizem
    'consagrado em 2007 pela CEEC' com autorização de Russell McClanahan. Sucessão declarada: CEEC. Notável: Francisco
    Buzzo (fundador da IARB) aparece como co-sagrante, ligando a IARB à rede CEEC já em 2006. Costa (2021, nota
    193) reproduz a mesma versão (dez/2006, Mikler/Fernandes/Buzzo). Versão alternativa (Wikipédia, citando o antigo
    site ciceb.com.br/DnossaIgreja.html): eleição em abril de 2007. Ver a versão de dez. 2006 do site atual. O livro
    não identifica os sagrantes; diz apenas que teve 'apoio' de William Paul Mikler, Hermes Carvalho Fernandes e
    Francisco Buzzo. O Distrito Missionário foi elevado a Diocese Missionária. 'Um dos primeiros atos' de Buzzo
    como bispo (após 2005, data não informada). Igreja Cristã Episcopal = ICEB (Igreja Cristã Episcopal Betânia)
    da base. O pôster diz que Russell McClanahan 'autorizou a consagração'; os sagrantes não são nomeados. Igreja
    Episcopal Evangélica (hoje Igreja Cristã Episcopal / CICEB), então filiada à CEEC. A tese diz 'oficiada pelos
    bispos' sem distinguir o sagrante principal. 'Francisco Buzzo' identificado com 'Francisco Buzzo Rodrigues'
    da base.
