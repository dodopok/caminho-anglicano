      Em dezembro de 2006, em cerimônia oficiada pelos bispos William Paul Mikler, Hermes Carvalho Fernandes e Francisco
      Buzzo, o Rev. Leonides foi sagrado bispo diocesano e o 1º Distrito Missionário foi alçado à condição de Diocese
      Missionária.
    page: '202'
  discrepancies:
  - field: date
    value: '2007'
    sources:
    - source: ptwp-dar
      quote: >-
        A Igreja, inserida nessa citada Comunhão, elegeu em abril de 2007 o reverendo Leonides Menezes como o seu
        bispo, ordenado em seguida.
    - source: iab-poster-linhagem-meira
      quote: Para se tornar bispo, foi consagrado em 2007 pela CEEC, comunhão criada nos EUA em 1995
  - field: principal_consecrator
    value: francisco-buzzo-rodrigues
    sources:
    - source: cant-novas-igrejas-2024
      quote: >-
        Um dos primeiros atos do bispo Buzzo foi a sagração do bispo Leonides Menezes na Igreja Cristã Episcopal,
        em Recife, onde iniciou o seu ministério pela Catedral Betânia.
      page: '133'
  notes: >-
    O livro não identifica os sagrantes; diz apenas que teve 'apoio' de William Paul Mikler, Hermes Carvalho Fernandes
    e Francisco Buzzo. O Distrito Missionário foi elevado a Diocese Missionária. Fonte primária (site da CICEB)
    nomeia três bispos oficiantes; a ordem em que aparecem (Mikler primeiro) sugere Mikler como sagrante principal,
    mas o site não diz isso explicitamente. CONFLITO: a Wikipédia (Diocese Anglicana do Recife) diz eleição em abril
    de 2007 'ordenado em seguida', e os pôsteres da IAB dizem 'consagrado em 2007 pela CEEC' com autorização de
    Russell McClanahan. Sucessão declarada: CEEC. Notável: Francisco Buzzo (fundador da IARB) aparece como co-sagrante,
    ligando a IARB à rede CEEC já em 2006. Costa (2021, nota 193) reproduz a mesma versão (dez/2006, Mikler/Fernandes/Buzzo).
    Versão alternativa (Wikipédia, citando o antigo site ciceb.com.br/DnossaIgreja.html): eleição em abril de 2007.
    Ver a versão de dez. 2006 do site atual. 'Um dos primeiros atos' de Buzzo como bispo (após 2005, data não informada).
    Igreja Cristã Episcopal = ICEB (Igreja Cristã Episcopal Betânia) da base. O pôster diz que Russell McClanahan
    'autorizou a consagração'; os sagrantes não são nomeados. Igreja Episcopal Evangélica (hoje Igreja Cristã Episcopal
    / CICEB), então filiada à CEEC. A tese diz 'oficiada pelos bispos' sem distinguir o sagrante principal. 'Francisco
    Buzzo' identificado com 'Francisco Buzzo Rodrigues' da base.
