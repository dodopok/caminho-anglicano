biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Porto Alegre,
  RGS, Brasil (1900-12-08). Ordenado diácono em abr/1926 e presbítero em jul/1927. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
