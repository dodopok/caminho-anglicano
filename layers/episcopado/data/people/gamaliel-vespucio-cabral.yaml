biography: >-
  Gamaliel Vespúcio Cabral foi ordenado diácono em abril de 1926 pelo bispo Lucien Lee Kinsolving e presbítero em
  julho de 1927 pelo bispo William Matthews Merrick Thomas. Clérigo do Distrito Missionário do Sul do Brasil (SBra),
  foi transferido para a Igreja Episcopal do Brasil em 25 de abril de 1965.
