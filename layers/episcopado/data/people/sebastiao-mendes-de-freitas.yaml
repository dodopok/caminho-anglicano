# yaml-language-server: $schema=../../schemas/person.json
id: sebastiao-mendes-de-freitas
name: Sebastião Mendes de Freitas
aliases:
- Rev. Sebastião Mendes
- Sebastião Mendes
biography: >-
  Sagrado bispo por bispos brasileiros, foi primaz e presidente da Igreja Episcopal Reformada (IER), tendo Francisco
  Buzzo Rodrigues como bispo auxiliar, e cônego da Diocese Missionária da Igreja Episcopal Reformada no Brasil.
  Em 06/08/2004 encerrou, por decisão sua, o processo de integração com o grupo de Ricardo Lorite; depois ficou
  como bispo emérito da denominação, que terminou extinta.
sources:
- source: cant-novas-igrejas-2024
  quote: Buzzo e Mendes foram sagrados por bispos brasileiros, mas seguiram caminhos distintos
  page: '133'
- source: drv-comunicado-imprensa-2006
  quote: Dom Sebastião Mendes de Freitas, Bispo Primaz
- source: cant-novas-igrejas-2024
  quote: >-
    Por um tempo, teve o bispo Sebastião Mendes de Freitas43 como seu primaz e Francisco Buzzo Rodrigues, como bispo
    auxiliar.
  page: '168'
- source: cant-novas-igrejas-2024
  quote: O bispo Sebastião Mendes de Freitas como emérito da denominação, a qual terminou extinta.
  page: '168'
- source: yt-raizes-da-fe-ep4
  quote: E ele se tornou lá o o o presidente da igreja.
- source: darl3-fibra
  quote: Rev. Dr. Sebastião Mendes de Freitas - Cônego
- source: cant-novas-igrejas-2024
  quote: >-
    configuração permaneceu vigente até 6 de agosto do mesmo ano, quando o processo de integração foi encerrado
    por decisão do reverendo Sebastião Mendes.
  page: '117'
