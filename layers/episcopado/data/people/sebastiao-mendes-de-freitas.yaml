events:
- type: other
  date: '2004-08-06'
  description: >-
    Em abril de 2004 Ricardo Lorite iniciou aproximação com a missão brasileira da Igreja Episcopal Reformada (REC),
    organizando o ponto de pregação que viria a ser a Paróquia Anglicana Thomas Cranmer; a integração foi encerrada
    em 06/08/2004 por decisão do reverendo Sebastião Mendes (de Freitas), por divergências doutrinárias e eclesiológicas.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em abril de 2004, teve início um processo de aproximação entre Lorite e a missão brasileira da Igreja Episcopal
      Reformada (Reformed Episcopal Church – REC).
    page: '117'
  - source: cant-novas-igrejas-2024
    quote: >-
      configuração permaneceu vigente até 6 de agosto do mesmo ano, quando o processo de integração foi encerrado
      por decisão do reverendo Sebastião Mendes.
    page: '117'
- type: other
  date: '2004-10-31'
  description: >-
    Lançamento oficial do Livro de Oração Comum da Igreja Episcopal Reformada (Editora Clássica Anglicana), adaptado
    do da REC, no 455º aniversário do primeiro LOC
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
