  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti, que 'recebeu a Diocese do Recife' em 1997) na ordenação diaconal
    de Adonias, Edgar e Edmar. Identificação pelos primeiros nomes: Adonias Ramos de Souza e Edgar Batista Ferreira
    Neto (ambos presbíteros da diocese em 2002 e depois bispos da IECB) e Edmar Pimentel. Ordenação conjunta de
    três diáconos, citados só pelo primeiro nome (Adonias, Edgar e Edmar). A identificação de Adonias com Adonias
    Ramos de Souza apoia-se na sua instalação como reitor da Paróquia do Calvário (Janga, Paulista) e na ordenação
    presbiteral de 'Adonias & Edgar' em 05/08/2000. No sermão, o bispo informa que recebeu a diocese com 20 pastores
    e 13 paróquias e missões e que, em dezembro de 1999, a diocese tinha 27 (14 novas). O texto é o sermão do bispo
    diocesano, que fala em primeira pessoa como quem confere a ordem; a página não traz assinatura, e o bispo diocesano
    em exercício era Robinson Cavalcanti (instalado em 19/10/1997).
