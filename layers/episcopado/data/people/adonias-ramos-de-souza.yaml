biography: >-
  Adonias Ramos de Souza foi ordenado diácono em 18/12/1999 e presbítero em 05/08/2000 por Robinson Cavalcanti,
  na Diocese do Recife (IEAB). Deixou a IEAB em 2002, com Leonides de Menezes e as paróquias Betânia e Calvário,
  e foi sagrado bispo da IECB em 30/11/2007 por Paulo Garcia, tornando-se bispo diocesano de Paulista e Paraíba.
