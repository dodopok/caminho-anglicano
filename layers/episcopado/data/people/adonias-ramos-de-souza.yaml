    diocesano (Robinson Cavalcanti) na ordenação presbiteral de Adonias e Edgar, 'dois ex-batistas', que já haviam
    servido como diáconos. Identificação: Adonias Ramos de Souza e Edgar Batista Ferreira Neto (ordenados diáconos
    em 18/12/1999). Ordenação presbiteral conjunta de Adonias e Edgar, ambos ex-batistas e ex-diáconos da diocese
    ('Vocês honraram o espírito de serviço do diaconato'). O bispo fala de 'estes ordinandos, este bispo, e esta
    diocese em formação'. Edgar aparece só pelo primeiro nome. O texto é o sermão do bispo diocesano, que fala em
    primeira pessoa como quem confere a ordem; a página não traz assinatura, e o bispo diocesano em exercício era
    Robinson Cavalcanti (instalado em 19/10/1997).
