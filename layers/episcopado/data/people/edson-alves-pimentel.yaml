id: edson-alves-pimentel
name: Edson Alves Pimentel
biography: >-
  Edson Alves Pimentel foi ordenado diácono em 8/5/1999 por Robinson Cavalcanti, na Paróquia do Bom Samaritano,
  e permaneceu como diácono permanente e educador. Foi um dos membros fundadores da Ordem Evangélica de Santo Estêvão
  Mártir (OSE, 1998) e, em 2001, já como ex-prior da ordem, foi designado coordenador da fraternidade do diaconato
  permanente. Na Diocese Anglicana do Recife atuou como coordenador pedagógico do seminário e integrou a Comissão
  de Ministério. Consta no clero diocesano e foi instituído cônego honorário da Catedral do Bom Samaritano, com
  Josafá Batista dos Santos.
sources:
- source: rcor-drv-diac-edson-pimentel
  quote: MENSAGEM DE ORDENAÇÃO AO DIACONAT0 (08/05/99)
- source: rcor-drv-diac-edson-pimentel
  quote: Ordenação esta que se dá no esforço pluriclassista da Paróquia do Bom Samaritano
- source: costa2021
  quote: >-
    Teve como membros fundadores o bispo Robinson Cavalcanti e o então reverendo Filadelfo Oliveira, junto com outros
    clérigos e clérigas, como Daniel Barbosa, Edson Pimentel, Tibério Marques, Gorete Marques, Manoel Moraes, Ivaldo
