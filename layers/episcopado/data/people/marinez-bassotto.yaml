biography: >-
  Marinez Rosa dos Santos Bassotto nasceu em Canguçu (RS) em 9 de março de 1971 e ingressou em 1991 no Seminário
  Nacional da IEAB, em Porto Alegre. Foi ordenada diácona em 14 de maio de 1995 e presbítera em março de 1996, na
  Catedral Nacional da Santíssima Trindade, onde se tornou deã em 1999, a primeira mulher no cargo. Foi depois pároca
  em Cachoeirinha (RS) e ministra encarregada de uma missão em Glorinha, na Diocese Meridional, e responsável pela
  custódia do Livro de Oração Comum. Concorreu ao episcopado em 2012 e em 2017 e foi eleita bispa da Diocese Anglicana
  da Amazônia em 20 de janeiro de 2018, a primeira mulher eleita bispa na IEAB. Foi sagrada em 21 de abril de 2018,
  na Catedral de Santa Maria, em Belém, por Francisco de Assis da Silva, que presidiu a cerimônia; Linda Nicholls,
  bispa de Huron (Canadá), pregou, e Griselda Delgado, bispa de Cuba, esteve presente. Foi instalada como bispa
  diocesana em 22 de abril. Em março de 2022 recebeu a Cruz de Santo Agostinho, do arcebispo da Cantuária. Em 13
  de novembro de 2022 foi eleita primaz da IEAB, sucedendo Naudal Alves Gomes, e em setembro de 2024 foi eleita
  primaz regional das Américas, a primeira mulher no cargo, com assento no Comitê Permanente dos Primazes da Comunhão
  Anglicana. Em 2026 preside a Rede Ambiental da Comunhão Anglicana (ACEN) e pregou na sagração de Susan Wallace,
  na Nova Zelândia.
