events:
- type: other
  date: '2018-01-20'
  description: >-
    Marinez Santos Bassotto é eleita bispa da Diocese da Amazônia no Concílio em Belém, primeira mulher eleita bispa
    na IEAB, para suceder Saulo Maurício de Barros.
  status: confirmed
  sources:
  - source: acns-2018-01-marinez-eleita
    quote: >-
      A Revda. Canon Marinez Santos Bassoto foi eleita no dia 20 de janeiro (sábado) de 2018 como a próxima Bispa
      da Diocese da Amazônia durante o Concílio em Belém, no estado do Pará.
- type: other
  date: '2018-04-22'
  description: >-
    Instalação de Marinez Rosa Bassotto como bispa da Diocese Anglicana da Amazônia, às 9h do domingo 22 de abril
    de 2018, com a presença do primaz Francisco de Assis da Silva.
  status: confirmed
  sources:
  - source: lic-psj-marinez-2018
    quote: >-
      A cerimônia de instalação como Bispa da Diocese Anglicana da Amazônia, momento em que efetivamente toma posse
      em seu novo cargo, foi às 9h de domingo, dia 22 de abril.
  - source: lic-psj-marinez-2018
    quote: >-
      Bispa Marinez Rosa Bassotto e Bispo Francisco de Assis, Primaz da IEAB, na cerimônia de instalação em 22 de
      abril
- type: other
  date: '2018-01-20'
  description: >-
    Marinez Bassotto concorreu ao episcopado em 2012 (Diocese Meridional) e em 2017 (Diocese Anglicana da Amazônia);
    em ambos os concílios extraordinários houve empate nas primeiras sessões, e ela foi eleita bispa da Amazônia
    no primeiro escrutínio da segunda sessão, em 20 de janeiro de 2018.
  status: confirmed
  sources:
  - source: lic-livro35
    quote: >-
      Em ambas as Dioceses houve empate nas primeiras sessões dos Concílios Extraordinários, mas fui eleita bispa
      diocesana, em primeiro escrutínio, na Segunda Sessão do Concílio Extraordinário da Diocese Anglicana da Amazônia,
      em 20 de janeiro de 2018
  - source: lic-livro35
    quote: no ano de 2012, concorri ao episcopado com dois clérigos
- type: other
  date: '2025-06-01'
  description: >-
    Em 1º de junho de 2025, a IEAB celebrou 135 anos de existência e 40 anos da ordenação feminina na Catedral Nacional
    (Porto Alegre), em celebração presidida pela bispa primaz Marinez Bassotto, com a bispa Jo Bailey Wells como
    pregadora; o encontro "Mulheres Tecendo Justiça" reuniu cerca de 45 mulheres de todas as dioceses (29-31 de
    maio).
  status: confirmed
  sources:
  - source: lic-ieab-135anos-2025
    quote: >-
      Presidida pela bispa primaz Marinez Bassotto , a celebração teve como pregadora a bispa Jo Bailey Wells
  - source: lic-ieab-135anos-2025
    quote: Esse encontro reuniu, também em Porto Alegre, cerca de 45 mulheres de todas as dioceses da IEAB
