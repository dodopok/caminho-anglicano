      Santa Maria, em Belém do Pará, com a presença maciça do clero feminino da Igreja, dos bispos
    page: '117'
  - source: costa2021
    quote: da Câmara Episcopal, e das bispas Griselda (Cuba) e Linda Nicholls (Canadá), que fez a homilia.
    page: '118'
  - source: cabs-anglicanjournal-2018
    quote: >-
      The primate of Brazil, Bishop Francisco de Assis da Silva, presided at the service; and the bishop of the
      diocese of Huron, Linda Nicholls, from the Anglican Church of Canada, preached a sermon.
  - source: cabs-anglicanjournal-2018
    quote: Bishop Griselda Delgado del Carpio, of the Episcopal diocese of Cuba, was also present.
  - source: cabs-oliberal-2018
    quote: a sagração dela como bispo ou bispa se deu com a imposição das mãos de no mínimo três bispos.
  notes: >-
    Primeira bispa da IEAB e da America do Sul. Eleita em 20/01/2018. Sagrante principal nao explicitado nas fontes
    lidas (primaz da epoca: Francisco de Assis da Silva). Sábado de Tiradentes (21/04/2018). A bispa de Cuba, Griselda
    Delgado del Carpio, esteve presente; a notícia não diz se foi co-sagrante. Fecha a lacuna de sagrante (ieab-1965-hoje.json
    tinha SP nulo). Os dois livros são do mesmo autor (Costa), por isso "provavel". Pregadora: bispa Linda Nicholls
    (Huron, Canadá); presente a bispa Griselda Delgado del Carpio (Cuba). Francisco de Assis da Silva, primaz, esteve
    na instalação em 22 de abril. A ACNS descreve o local como a quadra esportiva do complexo da catedral. A tese
    NÃO nomeia o sagrante principal; fala na presença 'dos bispos da Câmara Episcopal' e das bispas Griselda (Cuba)
    e Linda Nicholls (Canadá, pregadora), listadas como co-sagrantes por inferência. Nenhuma fonte aberta nomeia
    os co-sagrantes. A ACNS diz que Francisco de Assis da Silva presidiu e que Linda Nicholls pregou, e que Griselda
    Delgado del Carpio estava presente; O Liberal (antes da cerimônia) diz apenas que a imposição de mãos é feita
    por no mínimo três bispos. Por isso o campo de co-sagrantes fica vazio aqui; os nomes de Linda Nicholls e Griselda
    Delgado del Carpio como co-sagrantes são inferência, não fato sustentado.
