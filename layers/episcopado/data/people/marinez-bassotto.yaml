- order: episcopate
  date: '2018-04-21'
  place: Quadra esportiva do complexo da Catedral Anglicana de Santa Maria, Belém (PA)
  jurisdiction: ieab
  office: diocesan
  principal_consecrator: francisco-de-assis-da-silva
  co_consecrators:
  - griselda-bispa-de-cuba
  - linda-nicholls
  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      A cerimônia de ordenação e sagração episcopal ocorreu no dia 21 de abril, nas dependências da Catedral de
      Santa Maria, em Belém do Pará, com a presença maciça do clero feminino da Igreja, dos bispos da Câmara Episcopal,
      e das bispas Griselda (Cuba) e Linda Nicholls (Canadá), que fez a homilia.
  - source: wp-pt-marinez
    quote: >-
      Sua sagração episcopal aconteceu em 21 de abril de 2018, na Catedral de Santa Maria, em Belém do Pará.
  - source: ec-2018-04
    quote: >-
      Belém, do outro lado do país foi o lugar onde aconteceu a histó- rica sagração de nossa primeira bispa: Marinez
      Bassotto.
  - source: ec-2018-04
    quote: Em destaque, as bispas Linda Nichols (de Huron, Canadá) e Griselda del Cappio (de Cuba)
  - source: acns-2018-04-marinez-sagrada
    quote: >-
      Thousands of people from Brazil and around the world attended the service at the sports court of St Mary’s
      Anglican Cathedral compound in Belém do Pará.
  - source: acns-2018-04-marinez-sagrada
    quote: >-
      The Primate of Brazil, Bishop Francisco de Assis da Silva, presided at the service; and the Bishop of Huron
      from the Anglican Church of Canada, Linda Nicholls, preached a sermon.
  - source: acns-2018-04-marinez-sagrada
    quote: Bishop Marinez’ consecration, on Saturday, was on Tiradentes Day
  - source: cant-identidades-numeros-2024
    quote: >-
      No dia 21 de abril de 2018, Marinez foi ordenada e sagrada na Catedral de Santa Maria, em Belém do Pará, em
      celebração transmitida para todo o país. O rito foi presidido pelo Bispo Primaz, Francisco de Assis da Silva
  - source: cant-temas-anglicanismo-2024
    quote: >-
      A ordenação e sagração foi presidida pelo Bispo Francisco de Assis da Silva, da Diocese Sul Ocidental (com
      sé em Santa Maria, Rio Grande do Sul).
  - source: lic-psj-marinez-2018
    quote: >-
      Em 21 de abril, sábado, foi ordenada e sagrada ao episcopado a Reverenda Cônega Marinez Rosa Bassotto, na
      cidade de Belém do Pará.
  - source: lic-psj-marinez-2018
    quote: >-
      A cerimônia que se deu na Catedral Anglicana de Santa Maria, teve a presença de bispos, irmãos e irmãs das
      várias dioceses da Igreja Episcopal Anglicana do Brasil (IEAB), assim como a presença da Bispa Griselda Delgado
      del Carpio, da Diocese Episcopal de Cuba e da Bispa Linda Nicholls, da Igreja Anglicana do Canadá.
  - source: lic-livro35
    quote: Fui Ordenada e Sagrada bispa em 21 de abril de 2018, na Catedral de Santa maria, em Belém/PA.
  - source: costa2021
    quote: >-
      A cerimônia de ordenação e sagração episcopal ocorreu no dia 21 de abril, nas dependências da Catedral de
      Santa Maria, em Belém do Pará, com a presença maciça do clero feminino da Igreja, dos bispos
    page: '117'
  - source: costa2021
    quote: da Câmara Episcopal, e das bispas Griselda (Cuba) e Linda Nicholls (Canadá), que fez a homilia.
    page: '118'
  notes: >-
    Primeira bispa da IEAB e da America do Sul. Eleita em 20/01/2018. Sagrante principal nao explicitado nas fontes
    lidas (primaz da epoca: Francisco de Assis da Silva). Sábado de Tiradentes (21/04/2018). A bispa de Cuba, Griselda
    Delgado del Carpio, esteve presente; a notícia não diz se foi co-sagrante. Fecha a lacuna de sagrante (ieab-1965-hoje.json
    tinha SP nulo). Os dois livros são do mesmo autor (Costa), por isso "provavel". Pregadora: bispa Linda Nicholls
    (Huron, Canadá); presente a bispa Griselda Delgado del Carpio (Cuba). Francisco de Assis da Silva, primaz, esteve
    na instalação em 22 de abril. A ACNS descreve o local como a quadra esportiva do complexo da catedral. A tese
    NÃO nomeia o sagrante principal; fala na presença 'dos bispos da Câmara Episcopal' e das bispas Griselda (Cuba)
    e Linda Nicholls (Canadá, pregadora), listadas como co-sagrantes por inferência.
