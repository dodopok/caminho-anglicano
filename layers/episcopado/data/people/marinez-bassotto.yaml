events:
- type: other
  date: '2018-01-20'
  description: >-
    Marinez Santos Bassotto é eleita bispa da Diocese da Amazônia no Concílio em Belém, primeira mulher eleita bispa
    na IEAB, para suceder Saulo Maurício de Barros.
  status: confirmed
  sources:
  - source: acns-2018-01-marinez-eleita
    quote: >-
      A Revda. Canon Marinez Santos Bassoto foi eleita no dia 20 de janeiro (sábado) de 2018 como a próxima Bispa
      da Diocese da Amazônia durante o Concílio em Belém, no estado do Pará.
- type: other
  date: '2018-04-22'
  description: >-
    Instalação de Marinez Rosa Bassotto como bispa da Diocese Anglicana da Amazônia, às 9h do domingo 22 de abril
    de 2018, com a presença do primaz Francisco de Assis da Silva.
  status: confirmed
  sources:
  - source: lic-psj-marinez-2018
    quote: >-
      A cerimônia de instalação como Bispa da Diocese Anglicana da Amazônia, momento em que efetivamente toma posse
      em seu novo cargo, foi às 9h de domingo, dia 22 de abril.
  - source: lic-psj-marinez-2018
    quote: >-
      Bispa Marinez Rosa Bassotto e Bispo Francisco de Assis, Primaz da IEAB, na cerimônia de instalação em 22 de
      abril
- type: other
  date: '2018-01-20'
  description: >-
    Marinez Bassotto concorreu ao episcopado em 2012 (Diocese Meridional) e em 2017 (Diocese Anglicana da Amazônia);
    em ambos os concílios extraordinários houve empate nas primeiras sessões, e ela foi eleita bispa da Amazônia
    no primeiro escrutínio da segunda sessão, em 20 de janeiro de 2018.
  status: confirmed
  sources:
  - source: lic-livro35
    quote: >-
      Em ambas as Dioceses houve empate nas primeiras sessões dos Concílios Extraordinários, mas fui eleita bispa
      diocesana, em primeiro escrutínio, na Segunda Sessão do Concílio Extraordinário da Diocese Anglicana da Amazônia,
      em 20 de janeiro de 2018
  - source: lic-livro35
    quote: no ano de 2012, concorri ao episcopado com dois clérigos
- type: other
  date: '2025-06-01'
  description: >-
    Em 1º de junho de 2025, a IEAB celebrou 135 anos de existência e 40 anos da ordenação feminina na Catedral Nacional
    (Porto Alegre), em celebração presidida pela bispa primaz Marinez Bassotto, com a bispa Jo Bailey Wells como
    pregadora; o encontro "Mulheres Tecendo Justiça" reuniu cerca de 45 mulheres de todas as dioceses (29-31 de
    maio).
  status: confirmed
  sources:
  - source: lic-ieab-135anos-2025
    quote: >-
      Presidida pela bispa primaz Marinez Bassotto , a celebração teve como pregadora a bispa Jo Bailey Wells
  - source: lic-ieab-135anos-2025
    quote: Esse encontro reuniu, também em Porto Alegre, cerca de 45 mulheres de todas as dioceses da IEAB
- type: other
  date: '2022-11-13'
  description: >-
    Marinez Bassotto é eleita primaz da IEAB no 35º Sínodo, realizado em Belém (PA) de 11 a 14 de novembro de 2022:
    a Câmara dos Bispos a elegeu em 13 de novembro, sucedendo Naudal Alves Gomes, e a eleição foi confirmada pela
    Câmara de Clérigos e Leigos. Primeira mulher primaz da IEAB e da América do Sul e Central.
  status: confirmed
  sources:
  - source: ieab-nova-primaz
    quote: >-
      Neste domingo, 13 de novembro, penúltimo dia do 35° Sínodo da Igreja Episcopal Anglicana do Brasil, a bispa
      Marinez Bassotto (foto acima, ao centro), atual bispa da Diocese Anglicana da Amazônia, foi eleita a nova
      primaz da Igreja.
  - source: cabs-anglicanink-2022
    quote: >-
      Meeting in Belém on 13 November 2022, the House of Bishops elected her primate in succession to the Most Rev.
      Naudal Alves Gomes. Her election was confirmed by the church’s lower house of clergy and lay deputies to synod.
  - source: ieab-secretaria
    quote: Em 13 de novembro de 2022, durante o 35° Sínodo da Igreja, foi eleita primaz.
  - source: cabs-ieab-sinodo-inicio-2022
    quote: >-
      Começou nesta sexta-feira, 11 de novembro, o 35° Sínodo da #nossaIEAB, Igreja Episcopal Anglicana do Brasil.
  - source: cabs-livingchurch-2022
    quote: >-
      Bassotto, who will continue to serve as bishop of the Diocese of the Amazon, succeeds the Most Rev. Naudal
      Gomes, who has been presiding bishop of the IEAB since 2018.
- type: other
  date: '2022-11-13'
  description: >-
    Investidura e instalação de Marinez Bassotto como primaz da IEAB, em celebração na Catedral de Santa Maria,
    em Belém, no mesmo dia da eleição (13 de novembro de 2022).
  status: probable
  sources:
  - source: cabs-anglicanink-2022
    quote: >-
      Archbishop Bassotto was installed in office later that day at a service in the Catedral de Santa Maria in
      Belém.
  - source: ieab-nova-primaz
    quote: Celebração de investidura/instalação
- type: other
  date: 2022-03
  description: >-
    Em março de 2022, Marinez Bassotto recebe a Cruz de Santo Agostinho, concedida pelo arcebispo da Cantuária,
    Justin Welby, por serviços à Comunhão na defesa da criação e da justiça climática.
  status: confirmed
  sources:
  - source: ieab-nova-primaz
    quote: Em março deste ano, Marinez foi condecorada com a Cruz de Santo Agostinho
- type: other
  date: 2024-01
  description: >-
    Em janeiro de 2024, a primaz participa da cúpula 'Growing Together', de bispos anglicanos e católicos romanos,
    em Roma e Cantuária (22 a 29 de janeiro de 2024), organizada pela IARCCUM.
  status: confirmed
  sources:
  - source: cabs-ieab-growing-together-2024
    quote: 'A primaz da #nossaIEAB, bispa Marinez Bassotto, estará presente.'
- type: other
  date: '2026-02-13'
  description: >-
    Em 13 de fevereiro de 2026, a primaz discursa no Sínodo Geral da Igreja da Inglaterra como representante da
    Comunhão Anglicana.
  status: confirmed
  sources:
  - source: cabs-ieab-sinodo-inglaterra-2026
    quote: >-
      Convidada a se dirigir à assembleia como representante da Comunhão Anglicana, ela abordou o tema da justiça
      socioambiental
- type: other
  date: 2026-06
  description: >-
    Em junho de 2026, a primaz prega na sagração e instalação de Susan Wallace como bispa de Te Hui Amorangi ki
    Te Waipounamu (Nova Zelândia), em Christchurch.
  status: confirmed
  sources:
  - source: cabs-ieab-wallace-2026
    quote: >-
      Representando a IEAB, a bispa Marinez teve participação de destaque na celebração ao ser convidada para proferir
      o sermão.
- type: other
  date: '2018-01-20'
  description: >-
    Eleição de Marinez Bassotto como bispa da Diocese Anglicana da Amazônia em 20 de janeiro de 2018, na segunda
    sessão do Concílio extraordinário, em primeiro escrutínio. Os dois candidatos na votação final foram ela (Diocese
    Meridional) e o deão Sílvio Freitas (Diocese Sul Ocidental); a sessão foi dirigida pelo bispo João Peixoto.
    Ela sucedeu Saulo Maurício de Barros, que anunciou sua renúncia em 2017.
  status: confirmed
  sources:
  - source: f8mar-psj-eleicao-2018
    quote: >-
      O fato ocorreu na segunda sessão do Concílio da Diocese Anglicana da Amazônia (DAA), o qual elegeu no primeiro
      escrutínio a Reverenda Cônega Marinez R. Santos Bassotto.
  - source: f8mar-psj-eleicao-2018
    quote: >-
      O Bispo João Câncio Peixoto fez o pronunciamento após a confirmação dos votos entre as duas pessoas candidatas:
      Reverenda Cônega Marinez (Diocese Meridional) e o Reverendíssimo Deão Sílvio Freitas (Diocese Sul Ocidental).
  - source: f8mar-psj-eleicao-2018
    quote: >-
      Em 2017, Dom Saulo Barros anunciou sua resignação, que abriu o processo eleitoral para a escolha de um (a)
      novo (a) pastor (a).
  - source: f8mar-ink-eleicao-2018
    quote: >-
      On 20 Jan 2018 the Rev. Canon Eleita Marinez Bassotto was elected on the first ballot by the diocesan electoral
      synod meeting in Belém to succeed the Rt. Rev. Mauricio de Barros, the first bishop of the diocese elected
      in 2006.
- type: other
  date: '2025-10-13'
  description: >-
    Reunião anual do Comitê Permanente do Conselho Consultivo Anglicano (ACC), em Amã (Jordânia), de 13 a 15 de
    outubro de 2025. A IEAB foi representada pela reverenda Inamar Corrêa de Souza (integrante do Comitê) e pela
    bispa primaz Marinez Bassotto.
  status: confirmed
  sources:
  - source: f8mar-ieab-acc-comite-2025
    quote: >-
      O Comitê Permanente do Conselho Consultivo Anglicano (ACC) esteve reunido, entre os dias 13 e 15 de outubro,
      em Amã, na Jordânia, para seu encontro presencial anual. Nossa IEAB esteve representada pela reverenda Inamar
      Corrêa de Souza e pela bispa primaz, Marinez Bassotto.
  - source: cabs-ieab-acc19-encerramento
    quote: >-
      A eleição marca também o encerramento do mandato da reverenda Inamar Correa de Souza, da IEAB, que integrou
      o Comitê Permanente nos últimos anos, representando a Igreja brasileira nesse importante organismo da Comunhão
      Anglicana.
- type: other
  date: '2026-03-25'
  description: >-
    Em 25 de março de 2026, Marinez Bassotto esteve na instalação de Sarah Mullally como 106ª Arcebispa da Cantuária,
    na Catedral de Cantuária, entre os primazes das províncias da Comunhão Anglicana, e, na terça-feira anterior
    à instalação, dialogou com lideranças da Igreja da Inglaterra sobre justiça racial.
  status: confirmed
  sources:
  - source: f8mar-ieab-mullally-relato-2026
    quote: Entre eles, a bispa primaz da Igreja Episcopal Anglicana do Brasil (IEAB), Marinez Bassotto.
  - source: f8mar-ieab-mullally-relato-2026
    quote: >-
      Na tarde de 25 de março de 2026, as portas centenárias da Catedral de Cantuária se abriram para receber um
      momento que a História não esquecerá.
  - source: f8mar-ieab-mullally-previa-2026
    quote: Nossa bispa primaz, Marinez Bassotto, estará presente.
  - source: f8mar-ieab-mullally-relato-2026
    quote: >-
      Na terça-feira que antecedeu a Instalação, nossa bispa primaz teve a oportunidade de dialogar com lideranças
      da Igreja da Inglaterra sobre Justiça Racial e os possíveis links entre ambas as Províncias nesta área.
- type: other
  date: 2026-03
  description: >-
    Posição de Marinez Bassotto sobre a escolha de Sarah Mullally como Arcebispa da Cantuária: declarou-se amiga
    dela e a apoiou publicamente. Segundo The Living Church (24/03/2026), considera que a eleição 'traz uma nova
    perspectiva à liderança' e 'desafia as dúvidas e medos' sobre a ordenação de mulheres.
  status: probable
  sources:
  - source: f8mar-lc-mullally-2026
    quote: >-
      considers herself a friend of the new Archbishop of Canterbury and has met with her since her appointment.
  - source: f8mar-lc-mullally-2026
    quote: >-
      “This election brings a new perspective to leadership in the midst of time of challenges, ruptures and crises,
      both in the church and in the world,” she said.
  - source: f8mar-lc-mullally-2026
    quote: It also challenges the doubts and fears there have been in relation to the ordination of women.
  - source: f8mar-lc-mullally-2026
    quote: >-
      Bassotto, one of Archbishop Sarah’s greatest supporters in the Anglican church in Latin America has stated
      with great enthusiasm:
- type: other
  date: '2024-08-19'
  description: >-
    Visita de Sarah Mullally, então bispa de Londres, ao Brasil em agosto de 2024, recebida em São Paulo pela primaz
    Marinez Bassotto e pela secretária-geral Christina Winnischofer; houve encontro com as três bispas brasileiras
    (Magda Guedes, Meriglei Simim e Marinez Bassotto) em Curitiba, nos 40 anos da ordenação feminina na IEAB.
  status: confirmed
  sources:
  - source: f8mar-ieab-visita-mullally-2024
    quote: >-
      A bispa Sarah e seu esposo Eamonn Mullally desembarcaram em São Paulo na segunda-feira, 19 de agosto, e foram
      recepcionados pela bispa Primaz da IEAB, Marinez Bassotto, e pela secretária-geral, Christina Winnischofer.
  - source: f8mar-ieab-visita-mullally-2024
    quote: >-
      onde estiveram presentes no Encontro às três bispas brasileiras Magda Guedes, Meriglei Simim e Marinez Bassotto
- type: other
  date: 2025-04
  description: >-
    Em abril de 2025, Marinez Bassotto chefiou a delegação da Comunhão Anglicana ao funeral do papa Francisco, em
    Roma.
  status: probable
  sources:
  - source: cabs-trinity-2025
    quote: Recently she led the Anglican Communion delegation to the funeral of Pope Francis in Rome.
- type: other
  date: '2025-05-04'
  description: >-
    Em 4 de maio de 2025, Marinez Bassotto pregou como convidada na Trinity Church (Nova York), durante visita de
    4 a 7 de maio.
  status: confirmed
  sources:
  - source: cabs-trinity-2025
    quote: >-
      Bishop Bassotto comes to Trinity on May 4–7 as part of the church's program to host leading voices from across
      the Anglican Communion
  - source: cabs-trinity-2025
    quote: On Sunday, May 4, she joins the 11:15am service as guest preacher.
- type: other
  date: 2022-03
  description: >-
    Em março de 2022, integrou uma delegação de mulheres da Comunhão Anglicana para representar a IEAB na Comissão
    sobre a Situação da Mulher das Nações Unidas.
  status: probable
  sources:
  - source: wp-pt-marinez
    quote: >-
      No mesmo mês, integrou uma delegação de mulheres de toda a Comunhão Anglicana para representar a IEAB na Comissão
      sobre a Situação da Mulher das Nações Unidas.
