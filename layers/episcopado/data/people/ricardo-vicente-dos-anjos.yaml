# yaml-language-server: $schema=../../schemas/person.json
id: ricardo-vicente-dos-anjos
name: Ricardo Vicente dos Anjos
full_name: Ricardo Vicente dos Anjos
aliases:
- Dom Ricardo
- Padre Vicente dos Anjos
- Rev. Côn. Ricardo Vicente dos Anjos
biography: >-
  Presbítero egresso da Igreja Católica Apostólica Brasileira (Belém), incardinado na IATB em 2009, cônego da Diocese
  do Pará (24/08/2010) e bispo diocesano do Pará desde a sagração de 15/07/2012, em substituição a Eduardo Mota.
sources:
- source: lia-iatb-noticias-2010
  quote: >-
    Foi recebido o pedido de incardinação do Rev. Pe. Ricardo Vicente dos Anjos, egresso da Igreja Católica Apostólica
    Brasileira, de Belém do Pará.
- source: lia-iatb-noticias-2012
  quote: >-
    a Igreja Anglicana Tradicional do Brasil ordenou e consagrou o Rev. Côn. Ricardo Vicente dos Anjos, ao terceiro
    grau das ordens sagradas, tornando-o bispo da Diocese do Pará.
ordinations:
- order: episcopate
  date: '2012-07-15'
  place: São Paulo (SP), após o II Encontro Provincial da IATB
  jurisdiction: iatb
  office: diocesan
  principal_consecrator: rui-costa-barbosa
  co_consecrators:
  - jorge-costa
  - orvandil-moreira-barbosa
  status: confirmed
  sources:
  - source: lia-iatb-noticias-2012
    quote: >-
      No dia 15 de julho de 2012, domingo, seguindo-se ao II Encontro Provincial, a Igreja Anglicana Tradicional
      do Brasil ordenou e consagrou o Rev. Côn. Ricardo Vicente dos Anjos, ao terceiro grau das ordens sagradas,
      tornando-o bispo da Diocese do Pará.
  - source: lia-iatb-noticias-2012
    quote: 'Consagrantes: Dom Rui Costa Barbosa Dom Orvandil Moreira Barbosa Dom Jorge dos Santos Costa'
  - source: lia-aeci-news
    quote: Archbishop Primate of Brazil, The Most Rev’d. Dr. Rui CostaBarbosa.
  - source: lia-aeci-news
    quote: >-
      The said Consecration will take place at Sao Paulo-SP, Brazil on the Fifteenth day of July in the Blessed
      year of our Lord 2012.
  - source: lia-aeci-news
    quote: >-
      Reverend Ricardo Vicente Dos Anjos of whose pious, sober and honest life and conversation, competent learning
      and knowledge of Holy Scriptures, and soundness in the Faith we have been assured, being Consecrated and Appointed
      as a Bishop in The Traditional Anglican Church of Brazil to serve in the Diocese in the State of Para (North).
  notes: >-
    Mandato de consagração emitido pelo arcebispo John Langley (AECI), com Rui Costa Barbosa como Principal Consecrator;
    a IATB lista como consagrantes Rui, Orvandil e Jorge dos Santos Costa, sem distinguir hierarquia (as duas fontes
    concordam em Rui como principal). O Mandato Apostólico da IATB foi emitido em 12/03/2012 e previa a sagração
    em 08/07/2012 no estado de SP; a data realizada, segundo a IATB posterior e a AECI, foi 15/07/2012 (o II Encontro
    Provincial ocorreu em 13-14/07, na Paróquia São Judas Tadeu, São Paulo). Substituiu Eduardo Mota (falecido em
    01/01/2012), que já o havia indicado. Trata-se de um MANDATO de sagração emitido pelo arcebispo metropolitano
    eleito da AECI, Melvyn John Langley (a página diz 'will take place'): confirma o plano e a data, não a realização.
    Diocese do Estado do Pará (Norte) da 'Traditional Anglican Church of Brazil' (= IATB, hoje de Rui Costa Barbosa).
    Ricardo Vicente dos Anjos foi depois cofundador da Igreja Católica Anglicana (2017) e primaz da ICA-Brasil (2023)
    — dados já na base.
affiliations:
- jurisdiction: iatb
  role: other
  role_description: clero (presbítero, cônego)
  diocese: diocese-do-para
  start: 2009-06
  end: '2012-07-15'
  status: confirmed
  sources:
  - source: lia-iatb-noticias-2010
    quote: >-
      Após consultas com os presbitérios, o Rev. Pe. Ricardo Vicente dos Anjos obteve o deferimento da incardinação
      solicitada para a Diocese do Norte-Nordeste do Brasil
  - source: lia-iatb-noticias-2010
    quote: >-
      Padre Vicente do Anjos recebeu o título de Cônego da Diocese do Pará, em reconhecimento dos bispos aos seus
      esforços na consolidação da Diocese. As nomeações foram a partir do dia 24 de agosto de 2010.
  notes: >-
    Pedido registrado em 03/06/2009 (egresso da ICAB, Belém); deferido pelos presbitérios. Foi Administrador Diocesano
    da Diocese do Pará após a morte de Mota (01/01/2012).
