events:
- type: other
  date: '2012-01-01'
  description: >-
    Eduardo Mota sofreu um AVC em 24/12/2011 e morreu em 01/01/2012 no Hospital Regional de Cametá (PA); o administrador
    diocesano passou a ser o cônego Ricardo Vicente dos Anjos.
  status: confirmed
  sources:
  - source: lia-iatb-noticias-2012
    quote: >-
      Dom Eduardo Mota já em idade provecta, sofreu um AVC no dia 24 de dezembro de 2011 e desde então esteve internado
      no mesmo Hospital Regional de Cametá.
- type: other
  date: '2017'
  description: >-
    A página inicial da IATB capturada em outubro de 2017 reproduz a Carta de Salvador (julho de 2015) com os bispos
    do Centro-Oeste e do Pará substituídos por 'Dom X' e 'Dom Y'; em agosto de 2023 a IATB declarou que a Igreja
    Católica Anglicana do Brasil (ICA) 'não se confunde' com a IATB.
  status: probable
  sources:
  - source: lia-iatb-home-2017-10
    quote: >-
      Nós, Dom Rui Costa Barbosa, Dom X, Dom Washington Luis, Dom José Aparecido e Dom Y, respectivamente bispos
      das Dioceses do Sudeste, do Centro-Oeste, do Sergipe, do Sul e do Pará
  - source: lia-iatb-home-2024
    quote: >-
      Católica Anglicana do Brasil (ICA), que não se confunde com a Igreja Anglicana Tradicional do Brasil.
- type: other
  date: '2018-05-24'
  description: >-
    Notificação da Câmara Episcopal e Arcebispado Primaz da ICA: Altamiro Pereira do Amaral, Jorge dos Santos Costa
    e Ricardo Vicente dos Anjos "não mais integram esta Mitra Primacial"; as dioceses de Belém e de Santa Cruz de
    Salvador passam à responsabilidade do arcebispo primaz e a Diocese de Mato Grosso do Sul é extinta e reintegrada
    à do Centro Oeste.
  status: confirmed
  sources:
  - source: lica-ica-notificacao
    quote: >-
      A Diocese de Mato Grosso do Sul é extinta e reintegrada à Diocese Católica Anglicana do Centro Oeste.
  - source: lica-ica-notificacao
    quote: Goiânia, 24 de maio de 2018
- type: other
  date: 2018-07
  description: >-
    1º Sínodo da Província Católica Anglicana do Brasil (ICA-Brasil), em São Paulo, em julho de 2018, com aprovação
    dos primeiros cânones e "Sagrações episcopais"; em 29/07/2018 foi sagrado José Fernando de Faria. A ICA (de
    Orvandil) reagiu em 30/07/2018 negando ter sagrado qualquer bispo após seu registro em cartório e designado
    bispos para Rio Grande do Sul, Espírito Santo, São Paulo e Amazônia.
  status: probable
  sources:
  - source: lica-iaces-historia
    quote: com nosso Primeiro Sínodo em São Paulo Brasil, em Julho de 2018
  - source: lica-ica-nota-esclarecimento
    quote: nem a ninguém designou para o Rio Grande do Sul, Espírito Santo, São Paulo e Amazônia
