    ordenação e sagração para 30/08, às 19h30, e a investidura (instalação) para 31/08, às 10h, na Catedral Anglicana
    da Ressurreição. Participaram a bispa Catherine Waynick (Indianápolis, EUA), que pregou na instalação, Orlando
    Guerreiro (Venezuela) e Julio Houlguin; Glauco Soares de Lima foi o pregador da sagração. Co-sagrantes não nomeados.
