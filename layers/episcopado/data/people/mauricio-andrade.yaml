  date: '2013-05-15'
  description: >-
    Em 15/05/2013 o SNIEAB anunciou que o Primaz Maurício Andrade, bispo pró-tempore da Diocese Anglicana de São
    Paulo (DASP/IEAB), convocou o 47º Concílio Ordinário e um Concílio Extraordinário para 9 e 10/08/2013, em São
    Paulo, para eleger o próximo bispo diocesano, em razão da ação anulatória de novembro de 2012. Foi nomeada a
    reverenda Carmen Kawano para a Secretaria Diocesana.
  status: confirmed
  sources:
  - source: rta-sn-sinais-dasp
    quote: >-
      Foi anunciado oficialmente pelo Primaz Dom Maurício Andrade, bispo pró-têmpore da Diocese Anglicana de São
      Paulo-DASP, as convocatórias para a realização do 47º Concílio Ordinário e Concílio Extraordinário, que ocorrerão
      na cidade de São Paulo, entre os dias 09 a 10 de agosto de 2013
  - source: rta-sn-sinais-dasp
    quote: >-
      O Concílio Extraordinário foi convocado especificamente para proceder a eleição do próximo bispo diocesano
      devido a ação anulatória em novembro de 2012.
- type: other
  date: '2006-10-11'
  description: >-
    Sebastião Armando Gameleira Soares, bispo de Pelotas desde fevereiro de 2000, é instalado em 11/10/2006 como
    quarto bispo da Diocese do Recife (IEAB), eleito no Sínodo Geral de julho de 2006 para suceder Robinson Cavalcanti,
    deposto em 10/06/2005; o primaz Maurício Andrade presidiu a investidura.
  status: probable
  sources:
  - source: ens-102306-1-a
    quote: >-
      celebrated the start of a new chapter in its complicated life with the installation on October 11 of its fourth
      bishop, the Rt. Rev. Sebastiao Armando Gameleira Soares. The newly elected primate of Brazil, the Most Rev.
      Mauricio Andrade, presided over the investiture
- type: other
  date: '2006-10-11'
  description: >-
    Sebastião Armando Gameleira Soares é investido, em 11/10/2006, como bispo diocesano da Diocese Anglicana do
    Recife em cerimônia presidida pelo primaz Maurício Andrade e acompanhada de mais quatro bispos, após os cismas
    de 2002 e 2005.
  status: confirmed
  sources:
  - source: rtb-sn-2006-dar
    quote: >-
      Uma bonita cerimônia, presidida pelo Primaz, D. Mauricio Andrade, e partilhada por mais quatro bispos, além
      do clero e povo de várias partes da diocese
- type: other
  date: '2004-09-16'
  description: >-
    Câmara dos Bispos da IEAB (Porto Alegre, 16/09/2004) decreta supervisão episcopal especial para o clero e comunidades
    da Diocese do Recife em dissidência com o bispo Robinson Cavalcanti, nomeando o bispo Maurício Andrade (Brasília),
    e mantém o bispo sufragâneo Filadelfo Oliveira em funções.
  status: confirmed
  sources:
  - source: acns-3885-2004
    quote: >-
      Appoint the Rt Revd Dom Mauricio Andrade, the diocesan bishop of Brasilia, to perform the task of special
      episcopal oversight
  - source: acns-3885-2004
    quote: >-
      the Suffragan Bishop Dom Filadelfo Oliveira, according to his canonical prerogatives, continues to exert his
      pastoral ministry to the communities of the Anglican Diocese of Recife.
- type: other
  date: '2004-09-16'
  description: >-
    Decreto da Câmara dos Bispos da IEAB (reunião extraordinária em Porto Alegre, presidida pelo Primaz Orlando
    Santos de Oliveira): institui supervisão episcopal especial para as comunidades e o clero da Diocese Anglicana
    do Recife em dissenso com o bispo diocesano Robinson Cavalcanti, nomeia Dom Maurício Andrade (bispo de Brasília)
    supervisor episcopal especial e mantém o ministério do bispo sufragâneo Dom Filadelfo Oliveira. Atendeu a pedido
    de 13 clérigos e clérigas da diocese.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      A Câmara dos Bispos, reunida extraordinariamente na cidade de Porto Alegre, sob a Presidência do Bispo Primaz,
      diante da solicitação de clérigos e clérigas da Diocese Anglicana do Recife
    page: '545'
  - source: costa2021
    quote: >-
      1. Decretar a supervisão episcopal especial das comunidades e clérigos e clérigas da Diocese Anglicana do
      Recife que se sentem pastoralmente desassistidos por seu Bispo diocesano, face a divergências teológicas e
      pastorais.
    page: '546'
  - source: costa2021
    quote: >-
      2. Nomear o Revmo. Bispo Dom Mauricio Andrade, bispo diocesano de Brasília para desempenhar a função de supervisor
      episcopal especial
    page: '546'
  - source: costa2021
    quote: >-
      3. A presente decisão, naturalmente supõe que o Bispo Sufragâneo, Dom Filadelfo Oliveira, de acordo com suas
      prerrogativas canônicas, continua seu ministério pastoral junto às comunidades da Diocese Anglicana do Recife.
    page: '546'
  - source: costa2021
    quote: Porto Alegre, 16 de setembro de 2004.
    page: '546'
- type: other
  date: 2006-07
  description: >-
    Eleição de Maurício Andrade como 6º Bispo Primaz no 30º Sínodo Geral (Curitiba, 26-30/7/2006), que também aprova
    a criação da Diocese Anglicana da Amazônia
  status: probable
  sources:
  - source: costa2021
    quote: >-
      O primeiro ato do novo Primaz foi a criação da mais recente unidade territorial da Província: a Diocese Anglicana
      da Amazônia.
    page: '109'
- type: other
  date: '1997-06-28'
  description: >-
    Eleição de Robinson Cavalcanti como bispo coadjutor da Diocese Anglicana do Recife no Concílio Extraordinário
    de Vera Cruz (Ilha de Itaparica, BA), após sete escrutínios; concorreram Maurício Andrade e Ian Meldrum (que
    retirou a candidatura).
  status: probable
  sources:
  - source: costa2021
    quote: >-
      O Concílio Extraordinário da Diocese Anglicana do Recife aconteceu em 28 de junho de 1997, na cidade de Vera
      Cruz, na Ilha de Itaparica (BA)
    page: '186'
  - source: costa2021
    quote: >-
      A disputa foi resolvida com o voto de um delegado de Belém do Pará, o que garantiu a eleição de Robinson Cavalcanti.
    page: '186'
- type: other
  date: '2004-09-16'
  description: >-
    A Câmara Episcopal da IEAB, na pessoa do Primaz, decretou supervisão episcopal especial para comunidades e clérigos
    da Diocese Anglicana do Recife em dissenso com o bispo Robinson, nomeando Maurício Andrade (bispo de Brasília)
    supervisor, sem prejuízo do sufragâneo Filadelfo Oliveira.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Diante de outras situações semelhantes, em 16 de setembro de 2004, mediante solicitação de 13 clérigos e clérigas,
      a Câmara Episcopal, na pessoa do Primaz, decretou uma supervisão episcopal para as comunidades e parte do
      clero da DAR.
    page: '218'
- type: other
  date: '2005-02-22'
  description: >-
    Resolução 002/2005 nomeou Filadelfo Oliveira Autoridade Eclesiástica da Diocese Anglicana do Recife; em março,
    Maurício Andrade foi instituído 'bispo interventor'.
  status: probable
  sources:
  - source: costa2021
    quote: Ato contínuo, a Resolução 002/2005, de 22 de fevereiro
    page: '223'
  - source: costa2021
    quote: >-
      nomeou o bispo Filadelfo Oliveira como Autoridade Eclesiástica da Diocese Anglicana do Recife. No mês seguinte,
      o bispo Maurício Andrade, foi instituído como “bispo interventor”
    page: '223'
- type: other
  date: '1997-06-28'
  description: >-
    Eleição de Robinson Cavalcanti como bispo coadjutor da Diocese do Recife (IEAB), por maioria absoluta do clero
    e dos leigos, em Concílio Extraordinário na casa de retiro dos jesuítas na Ilha de Itaparica (BA); concorreram
    também Maurício Andrade e Ian Meldrum. A eleição foi depois homologada pela maioria dos bispos e conselhos diocesanos
    da Província.
  status: confirmed
  sources:
  - source: drv-resgatando-iv
    quote: >-
      Um Concílio Extraordinário foi, então, convocado para o final de junho de 1997, na casa de retiro dos Jesuítas,
      na Ilha de Itaparica, na Bahia, para eleger um Bispo Coadjutor (auxiliar com direito à sucessão).
  - source: drv-resgatando-iv
    quote: >-
      Na ocasião foram indicados 3 nomes: os reverendos Maurício Andrade, Ian Meldrum e Robinson Cavalcanti
  - source: drv-resgatando-iv
    quote: >-
      Na véspera da festa de São Pedro de 1997, foi eleito como terceiro Bispo da Diocese Anglicana do Recife (o
      primeiro eleito aqui e o primeiro nativo) o Rev. Robinson Cavalcanti, por maioria absoluta das urnas do clero
      e dos leigos, posteriormente homologado pela maioria dos Bispos e dos Conselhos Diocesanos da Província
