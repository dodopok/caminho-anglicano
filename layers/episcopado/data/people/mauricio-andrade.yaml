    Orlando Santos de Oliveira como sagrante e Glauco Soares de Lima como pregador; Costa (2021) dá Glauco como
    sagrante. A mesma notícia confirma a data de 31/08 (o site do Distrito Missionário diz 30/08). Entre os presentes:
