id: stephen-taylor
name: Stephen Taylor
biography: >-
  Presbítero listado pela Diocese Anglicana do Recife, em documento de 2002, entre os clérigos que passaram da diocese
  para a Diocese Anglicana do Rio de Janeiro.
sources:
- source: d2s24-documento-estudo
  quote: 'Diocese Anglicana do Rio de Janeiro: Rev. Stephen Taylor;'
- source: d2s25-paudalho
  quote: >-
    De 28/02 a 01/03 de 1997, em uma fazenda de propriedade do Sr. Carlos Alberto Gueiros, no município de Paudalho
    – PE
- source: d2s25-paudalho
  quote: >-
    reuniu-se o clero diocesano para um retiro, Revs. Maurício Andrade, Robinson Cavalcanti, Miguel Uchôa, Sebastião
    Gameleira, Alberto Blandón, Paulo Garcia, Ian Meldrum, Simêa Meldrum, Evanilza Barros, Francisco de Assis, Stephen
    Taylor, Mitsuo Noyama e Washington Franco.
- source: d2s31-nazare
  quote: >-
    contamos com a presença do Missionário da USPG, Rev. Stephen Taylor, que designado por nosso Bispo Diocesano
    para nossa comunidade
