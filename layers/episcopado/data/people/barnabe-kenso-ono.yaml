biography: >-
  Barnabé Kenso Ono, nascido em Fukushima (Japão) em 07/01/1901, foi ordenado diácono em janeiro de 1934 e presbítero
  em maio de 1938 por William M. M. Thomas, e atuou no Distrito Missionário do Brasil Central até morrer, em 01/12/1964.
