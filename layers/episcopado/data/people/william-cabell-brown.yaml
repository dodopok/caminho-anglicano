wikidata: Q10393674
biography: >-
  Missionário no RS a partir de 1891, tradutor da Bíblia e do Livro de Oração Comum para o português; fundou a obra
  no Rio (1908); sagrado em 1914 bispo assistente da Virgínia, depois 7º bispo da Virgínia.
sources:
