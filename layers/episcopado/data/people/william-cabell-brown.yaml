biography: >-
  Ordenado presbítero em 02/08/1891 por Francis McNeece Whittle, chegou ao Brasil em outubro de 1891 e atuou no
  Distrito Missionário do Sul do Brasil até 1914. Participou em 1892 da primeira convocação da missão, em Porto
  Alegre, e em 1898 recebeu dois votos na ordem clerical na eleição do primeiro bispo. Foi o primeiro reitor do
  Seminário Teológico, inaugurado em 13/06/1903 em Rio Grande, e iniciou o trabalho da igreja no Rio de Janeiro,
  com o primeiro culto em vernáculo em 31/05/1908. Em julho de 1914 voltou aos Estados Unidos e foi sagrado bispo
  em 28/10/1914 por Daniel Tuttle; morreu em 25/07/1927.
