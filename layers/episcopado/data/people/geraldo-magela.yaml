id: geraldo-magela
name: Geraldo Magela
full_name: Geraldo Santos de Magela Neto
aliases:
- Geraldo Santos de Magela
- Geraldo Santos de Magela Neto
- bispo Magela
- reverendo Magela
biography: >-
  Geraldo Santos de Magela Neto foi bispo e dirigente da Igreja Anglicana Latino Americana do Brasil (IALAB), aberta
  em 14 de novembro de 2006 e encerrada em 6 de novembro de 2018, e representou-a na Declaração da Boa Viagem (2006).
  Ingressou na IEAB pela Diocese Anglicana do Recife, onde serviu como ministro leigo em 2014, e em 2017 teve suas
  ordens presbiterais reconhecidas, abrindo mão da função episcopal. Transferido para a Diocese Anglicana de Brasília,
  atua na Missão Cristo Redentor, em Palmas (TO).
sources:
- source: cant-novas-igrejas-2024
  quote: a Igreja Anglicana Latino Americana no Brasil (IALAB), pelo bispo Geraldo Santos de Magela Neto
  page: '119'
- source: cant-novas-igrejas-2024
  quote: >-
    A Igreja Anglicana Latino Americana do Brasil (também chamada por sua sigla IALAB) teve origem na figura do
    bispo Geraldo Santos de Magela Neto. Nos registros jurídicos ela foi aberta em 14 de novembro de 2006 e teve
    as suas atividades encerradas em 06 de novembro de 2018.
  page: '158'
- source: cant-novas-igrejas-2024
  quote: >-
    Junto com a Diocese do Recife, liderada pelo bispo Robinson Cavalcanti, outras Igrejas assinaram o documento,
    como a Igreja Anglicana do Brasil, Igreja Episcopal Reformada, Igreja Anglicana Ortodoxa no Brasil (IAOB), Igreja
    Anglicana Missionária do Redentor (IAMR), Igreja Anglicana Brasileira (IABRA), Igreja Episcopal do Evangelho
    Pleno (IEEP), e a Igreja Anglicana Latino Americana do Brasil (IALAB), representada pelo bispo Geraldo Magela.
  page: '158'
- source: cant-novas-igrejas-2024
  quote: >-
    ingressou na Igreja Episcopal Anglicana do Brasil, através da Diocese Anglicana do Recife. Em 2014, servia em
    comunidades como ministro leigo. Em 2017, suas ordens presbiterais foram reconhecidas, abrindo mão da função
    episcopal que exercia.
  page: '158'
- source: cant-novas-igrejas-2024
  quote: Após um tempo na DAR, o reverendo Magela foi transferido para a Diocese Anglicana de Brasília
  page: '158'
- source: dab-ministerio-ordenado
  quote: Rev. Geraldo Magela
- source: cant-novas-igrejas-2024
  quote: >-
    Atualmente o clérigo exerce o seu ministério na cidade de Palmas, Tocantins, na Missão Cristo Redentor, da IEAB.
  page: '159'
