biography: >-
  Bispo anglicano canadense, nascido em 13/09/1939, foi elevado ao episcopado em 1993 como bispo da Diocese de Eastern
  Newfoundland and Labrador (Igreja Anglicana do Canadá), com as fontes divergindo quanto ao sagrante principal
  (Michael Peers ou Stewart Payne). Em novembro de 2007 deixou o ministério na Igreja Anglicana do Canadá e transferiu-se
  para a Igreja Anglicana do Cone Sul. Como moderador da Rede da Comunhão Anglicana no Canadá, pregou nos 30 anos
  da Diocese do Recife (20/05/2006), como representante do primaz Gregory Venables, e no encerramento do XXVIII
  Concílio da diocese, em dezembro de 2008. Em janeiro de 2010 foi designado deão da ACNA pelo arcebispo Robert
  Duncan, cargo equivalente a vigário-geral provincial.
