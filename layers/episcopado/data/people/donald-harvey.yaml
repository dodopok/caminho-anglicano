events:
- type: other
  date: 2008-12
  description: >-
    XXVIII Concílio da Diocese do Recife: por unanimidade, exclui dos Cânones o dispositivo que permitia eleger
    bispas (herança da IEAB), mantendo a ordenação de mulheres ao diaconato e presbiterato; a diocese tinha 14 'reverendas'
  status: confirmed
  sources:
  - source: dar-2008-pastoras-nao-bispas
    quote: >-
      A Diocese do Recife, que conta com 14 reverendas (pastoras), ao nível de Presbíteras e Diáconas, ocupando
      todos os tipos de cargos e funções, deliberou, por unanimidade do plenário do seu XXVIII Concílio, excluir
      o dispositivo canônico que permitia a eleição de Bispas (Episcopisas), como um gesto de maior integração à
      maioria ortodoxa do Anglicanismo (o dispositivo era uma herança da IEAB).
- type: other
  date: null
  description: >-
    Festividades dos 30 anos da Diocese do Recife em 19-20 de maio de 2006, com jantar e culto de ação de graças
    na Paróquia Anglicana do Espírito Santo; pregou o bispo Donald Harvey (Rede da Comunhão Anglicana, Canadá),
    representante pessoal do primaz Gregory Venables.
  status: confirmed
  sources:
  - source: drv-breves-episcopais-07
    quote: Aconteceram nos dias 19 e 20 próximos passados, as festividades do aniversário da nossa Diocese.
  - source: drv-breves-episcopais-07
    quote: o representante pessoal do nosso Primaz, Revmo. Bispo Gregório J. Venables
