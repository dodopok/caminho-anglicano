  notes: >-
    Michael Peers era o primaz do Canadá em 1993. Só a infobox da Wikipédia nomeia o sagrante; data exata e co-sagrantes
    não encontrados. VERSÃO A (fonte primária, jornal diocesano do mês seguinte, testemunho): sagrante principal
    Stewart Payne, arcebispo de Western Newfoundland e metropolita da Província Eclesiástica do Canadá; nove co-sagrantes,
    todos impuseram as mãos. O OCR traz 'Le~mon of Fredericto~' (= George C. Lemmon, de Fredericton) e quebra 'Bishop
    A. / Arthur / Bruce Stavert' (= Bishops Arthur G. Peters ... e A. Bruce Stavert). Michael Peers (primaz do Canadá)
    NÃO aparece entre os bispos citados. Contradiz a Wikipédia (versão B). VERSÃO B (só a infobox da Wikipédia,
    sem nota): Michael Peers, primaz do Canadá. O relato primário do Newfoundland Churchman (versão A) dá Stewart
    Payne como 'Chief Consecrator' e não cita Peers; a versão B é provavelmente um palpite pela função de primaz.
    Já registrada em pontes-estrangeiras.json como 'provavel'; recomenda-se rebaixar.
