id: mary-douglas-glasspool
name: Mary Douglas Glasspool
aliases:
- Mary Glasspool
biography: >-
  Sagrada bispa sufragânea da Diocese de Los Angeles (Igreja Episcopal, TEC) em 15 de maio de 2010; sua sagração
  foi objeto de protesto da Diocese Anglicana do Recife.
sources:
- source: d2s15-glasspool-pt
  quote: >-
    que foi, no dia de hoje a sagração de uma lésbica praticante, a Revda. Mary Douglas Glasspool como Bispa Sufragânea
    da Diocese de Los Angeles, da Igreja Episcopal (TEC) dos EUA
ordinations:
- order: episcopate
  date: '2010-05-15'
  jurisdiction: tec
  office: suffragan
  status: probable
  sources:
  - source: d2s15-glasspool-pt
    quote: >-
      que foi, no dia de hoje a sagração de uma lésbica praticante, a Revda. Mary Douglas Glasspool como Bispa Sufragânea
      da Diocese de Los Angeles, da Igreja Episcopal (TEC) dos EUA
  - source: d2s15-glasspool-en
    quote: >-
      with the consecration of a practicing Lesbian, Rev. Mary Douglas Glasspool as Bishop Suffragan of the Diocese
      of Los Angeles
  notes: >-
    Sagrada bispa sufragânea da Diocese de Los Angeles (TEC). A data (15/05/2010) e o cargo vêm da nota de protesto
    da Diocese Anglicana do Recife, que não informa o local nem os sagrantes.
affiliations:
- jurisdiction: tec
  role: suffragan_bishop
  diocese: diocese-de-los-angeles
  start: '2010-05-15'
  status: probable
  sources:
  - source: d2s15-glasspool-pt
    quote: >-
      que foi, no dia de hoje a sagração de uma lésbica praticante, a Revda. Mary Douglas Glasspool como Bispa Sufragânea
      da Diocese de Los Angeles, da Igreja Episcopal (TEC) dos EUA
  notes: Bispa sufragânea da Diocese de Los Angeles a partir da sagração, segundo a nota diocesana do Recife.
events:
- type: other
  date: '2010-05-15'
  description: >-
    A Diocese Anglicana do Recife, por nota diocesana assinada pelo bispo Robinson Cavalcanti em Olinda (PE), protesta
    contra a sagração de Mary Douglas Glasspool como bispa sufragânea de Los Angeles (TEC); cita o voto do bispo
    diocesano na Resolução de Lambeth 1998 sobre sexualidade humana, o documento Afirmação do Recife e os cânones
    diocesanos, e se associa às correntes ortodoxas do Anglicanismo em demandar reunião urgente dos Primazes, a
    não presença de representantes da TEC em instâncias oficiais da Comunhão Anglicana, o apoio à minoria fiel na
    TEC e o reconhecimento da ACNA como Província Anglicana legítima.
  status: confirmed
  sources:
  - source: d2s15-glasspool-pt
    quote: >-
      A Diocese do Recife reafirma a sua mais veemente condenação à supracitada sagração, e se associa às correntes
      ortodoxas do Anglicanismo em demandar uma reunião urgente do Encontro dos Primazes, a não-presença de representação
      da TEC em instâncias oficiais da Comunhão Anglicana, o apoio à minoria fiel à palavra de Deus ainda subsistente
      na TEC, e o reconhecimento da Igreja Anglicana na América do Norte (ACNA) como legítima Província Anglicana.
  - source: d2s15-glasspool-pt
    quote: >-
      Coerente com o voto do seu Bispo Diocesano em favor da Resolução sobre Sexualidade Humana da Conferência de
      Lambeth, 1998;
