# yaml-language-server: $schema=../../schemas/person.json
id: mary-douglas-glasspool
name: Mary Douglas Glasspool
aliases:
- Mary Glasspool
biography: >-
  Mary Douglas Glasspool foi sagrada bispa sufragânea da Diocese de Los Angeles, da Igreja Episcopal (TEC), em 15/05/2010;
  as fontes não informam o sagrante. A Diocese Anglicana do Recife, em nota assinada por Robinson Cavalcanti, condenou
  a sagração, por tratar-se, nos termos da nota, de uma lésbica praticante, e pediu reunião urgente dos Primazes
  e o reconhecimento da ACNA como província anglicana.
sources:
- source: d2s15-glasspool-pt
  quote: >-
    que foi, no dia de hoje a sagração de uma lésbica praticante, a Revda. Mary Douglas Glasspool como Bispa Sufragânea
    da Diocese de Los Angeles, da Igreja Episcopal (TEC) dos EUA
- source: d2s15-glasspool-en
  quote: >-
    with the consecration of a practicing Lesbian, Rev. Mary Douglas Glasspool as Bishop Suffragan of the Diocese
    of Los Angeles
- source: d2s15-glasspool-pt
  quote: >-
    A Diocese do Recife reafirma a sua mais veemente condenação à supracitada sagração, e se associa às correntes
    ortodoxas do Anglicanismo em demandar uma reunião urgente do Encontro dos Primazes, a não-presença de representação
    da TEC em instâncias oficiais da Comunhão Anglicana, o apoio à minoria fiel à palavra de Deus ainda subsistente
    na TEC, e o reconhecimento da Igreja Anglicana na América do Norte (ACNA) como legítima Província Anglicana.
ordinations:
- order: episcopate
  date: '2010-05-15'
  jurisdiction: tec
  office: suffragan
  status: probable
  sources:
