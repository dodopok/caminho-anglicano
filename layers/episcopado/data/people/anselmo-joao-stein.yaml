  sources:
  - source: costa2021
    quote: >-
      CLÉRIGOS: Dom Edmund Knox Sherrill, bispo da Diocese Setentrional e presidente do concílio … Anselmo João
      Stein, da Paróquia de Santa Maria, Belém, Pará
    page: '529'
  notes: >-
    Anexo G: clérigo participante do primeiro concílio da Diocese Setentrional (Recife, 25-27/06/1976), ligado à
