# yaml-language-server: $schema=../../schemas/person.json
id: anselmo-joao-stein
name: Anselmo João Stein
full_name: Anselmo João Stein
aliases:
- STEIN, ANSELMO JOAO
biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Ordenado diácono em
  nov/1958 e presbítero em out/1959. Transferido para a Igreja Episcopal do Brasil em 25/04/1965 (Clerical Directory
  1968).
sources:
- source: cd1965
  quote: STEIN, ANSELMO JOAO (SBra)
- source: cd1968
  quote: STEIN, Anselmo Joao (SBra) Trans to Brazil Ch 25 Apr 65.
ordinations:
