  date: 1958-11
  jurisdiction: dmsb
  ordained_by: egmont-krischke
  status: confirmed
  sources:
  - source: cd1965
    quote: D Nov 58 P Oct
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1958 - … Anselmo João Stein
    page: '371'
  notes: >-
    Ordenante no diretório: 'Bp Krischke'. Colunas do OCR intercaladas: "D Nov 58 P Oct" numa linha e "59 Bp Krischke"
    na seguinte; o ano 59 do presbiterato é reconstruído por essa continuidade. Ano tirado da lista do clero nacional
    por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
