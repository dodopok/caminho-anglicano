# yaml-language-server: $schema=../../schemas/person.json
id: valtair-zuqui
name: Valtair Zuqui
full_name: Valtair Zuqui
aliases:
- Dom Valtair Zuchi
biography: >-
  Bispo da Diocese do Espírito Santo da IATB (sede em Piúma), sagrado em 20/10/2018 em Salvador por Alfredo Dórea.
sources:
- source: lia-iatb-clerigos-2019
  quote: Dom Valtair Zuchi Diocese do Espírito Santo
ordinations:
- order: episcopate
  date: '2018-10-20'
  place: Capela do Instituto Frei Ludovico, Santa Tereza, Salvador (BA)
  jurisdiction: iatb
  office: diocesan
  principal_consecrator: alfredo-dorea
  co_consecrators:
  - jose-da-santa-cruz
  - washington-luis-nascimento-santos
  status: confirmed
  sources:
  - source: lia-iatb-home-2018-12
    quote: >-
      No dia 20 de outubro de 2018 às 18 horas, presidindo a Santa Eucaristia no Capela do Instituto Frei Ludovico,
      na Rua Hélio nde Oliveira - Santa Tereza - Salvador - Bahia, o Arcebispo Provincial da IATB conferiu a Ordem
      do Episcopado ao Rev. Padre Valtair Zuqui.
  - source: lia-iatb-home-2018-12
    quote: >-
      Foram co-celebrantes os Reverendíssimos bispos Dom Washingtom Luis da Diocese de Sergipe e Dom José, da Diocese
      de Pernambuco.
  notes: >-
    Novo bispo da recém criada Diocese do Espírito Santo (sede em Piúma-ES; decreto arquiepiscopal de 20/10/2018).
    A página de clérigos grafa 'Dom Valtair Zuchi'. O 'Arcebispo Provincial' em 2018 era Alfredo Dórea.
