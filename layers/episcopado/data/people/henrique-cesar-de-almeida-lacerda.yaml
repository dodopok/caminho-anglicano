id: henrique-cesar-de-almeida-lacerda
name: Henrique César de Almeida Lacerda
aliases:
- Henrique Lacerda
biography: >-
  Henrique César de Almeida Lacerda foi ordenado diácono em 27 de novembro de 2004, em João Pessoa, por Robinson
  Cavalcanti, na Diocese Anglicana do Recife. Em 23 de agosto de 2005 foi incluído entre os clérigos excluídos da
  comunhão da IEAB, tendo declarado manter plena comunhão com Robinson Cavalcanti. Na Diocese do Recife foi coadjutor
  da Paróquia Anglicana Comunhão, professor do Seminário Anglicano Teológico (SAT-PB) e coordenador da Escola de
  Levitas, além de ministro encarregado do Ponto Missionário Anglicano Adoração (Mangabeira VII, João Pessoa); em
  2011 e 2012 constava como secretário diocesano de Educação. Aparece também como mestrando em Teologia Bíblica
  no Trinity School for Ministry (Ambridge, EUA).
