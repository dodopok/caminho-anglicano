biography: >-
  Ordenado presbítero em fevereiro de 1943 pelo bispo Athalício Pithan, serviu no Distrito Missionário do Sudoeste
  do Brasil até ser transferido para a Igreja Episcopal do Brasil em 25/04/1965. O diaconato é datado de dezembro
  de 1941, por William M. M. Thomas, no Clerical Directory 1965, enquanto outra fonte o lista em 1939.
