biography: >-
  Nascido em Andradas (MG) em 1909, foi ordenado diácono em fevereiro de 1946, por William Matthews Merrick Thomas,
  e presbítero em setembro de 1946, por Athalício Pithan. Clérigo do Distrito Missionário do Brasil Central, foi
  transferido para a Igreja Episcopal do Brasil em 25/04/1965; em 1984 registrou em ata seu voto contrário à aprovação
  da ordenação de mulheres no XXI Sínodo.
