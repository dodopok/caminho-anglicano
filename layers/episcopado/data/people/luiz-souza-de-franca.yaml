biography: >-
  Luiz Souza de França foi ordenado ao diaconato por Clóvis Erly Rodrigues e atuou na Diocese Anglicana do Recife
  (DAR) como primeiro secretário administrativo diocesano. Designado arcediago para a Paraíba e o Rio Grande do
  Norte em 2001, foi deão da Con-Catedral Anglicana da Ressurreição, em João Pessoa, e arcediago do arcediagado
  PB/RN/CE. Em 25/06/2004 assinou, com outros arcediagos da DAR, carta aberta ao primaz da IEAB repudiando palavras
  contidas em um documento. Em 23/08/2005 foi excluído da comunhão da IEAB, tendo declarado manter comunhão com
  o bispo diocesano Robinson Cavalcanti. Foi instituído cônego em 03/01/2010 e atuou como ministro encarregado da
  Missão Anglicana do Consolador.
