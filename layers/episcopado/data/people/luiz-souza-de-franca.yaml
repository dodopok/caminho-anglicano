events:
- type: other
  date: 2001-12
  description: >-
    Segundo o sermão de 15/12/2001, o Concílio da Diocese Anglicana do Recife, realizado em Paripueiras (litoral
    de Alagoas) na semana anterior, elegeu Filadelfo de Oliveira Neto bispo auxiliar; o texto menciona ainda o recém-designado
    arcediago para a Paraíba e o Rio Grande do Norte, Luiz Souza de França (Paróquia da Ressurreição, João Pessoa).
  status: confirmed
  sources:
  - source: rta-orildo-lilian-2001
    quote: >-
      D. Filadelfo de Oliveira Neto, eleito Bispo Auxiliar na última Reunião Conciliar, realizada na aprazível Paripueiras,
      lá no litoral das Alagoas, na semana passada
  - source: rta-orildo-lilian-2001
    quote: >-
      recém designado Venerável Arcediago para a Paraíba e Rio Grande do Norte, Reverendo Luiz Souza de França,
      da Paróquia da Ressurreição em João Pessoa
- type: other
  date: 1996-10
  description: >-
    Em outubro de 1996 o bispo Clóvis Erly Rodrigues comunicou a decisão de se aposentar e de convocar a eleição
    de um coadjutor. Segundo Dom Robinson Cavalcanti, seu nome foi proposto inicialmente pelos reverendos Washington
    Franco e Miguel Uchoa, com o apoio decidido do reverendo Luiz Souza; a eleição se deu no Concílio Extraordinário
    de Itaparica (BA), precedida de cinco meses de reuniões do clero, que redigiu a "Carta de Paudalho" como programa
    comum, e de debates com paróquias e missões de Belém, João Pessoa, Recife e Salvador.
  status: confirmed
  sources:
  - source: darb2-projeto-i
    quote: >-
      O meu nome foi proposto, inicialmente, pelos reverendos Washington Franco e Miguel Uchoa, tendo, em seguida,
      o apoio decidido do reverendo Luiz Souza
  - source: darb2-projeto-i
    quote: >-
      entre outubro de 1996 (quando o Bispo Clóvis comunicou sua decisão de se aposentar e convocar a eleição de
      um coadjutor), até a minha sagração e posterior instituição e posse, em outubro de 1997
  - source: darb2-projeto-i
    quote: cinco meses de reunião do clero, culminando com o retiro que elaborou a “Carta de Paudalho”
  - source: darb2-projeto-i
    quote: Concílio Extraordinário de Itaparica (onde houve a eleição)
- type: other
  date: '2004-06-25'
  description: >-
    Em 25/06/2004 os arcediagos da DAR (Maurício Coelho, Quintino Orengo, Maria Gorete Marques e Luiz Souza de França)
    enviaram carta aberta ao Primaz da IEAB, Dom Orlando Santos de Oliveira, repudiando o texto da Comissão Especial
    designada por ele para estudar a conjuntura eclesial, no que se referia ao bispo diocesano do Recife.
  status: confirmed
  sources:
  - source: darl3-primaz-0406
    quote: >-
      vimos por meio desta explicitar de forma indignada nosso público repúdio às palavras injuriosas contidas no
      citado documento
  - source: darl3-primaz-0406
    quote: Recife, 25 de junho de 2004.
- type: other
  date: 2003-12
  description: >-
    Concílio Diocesano da Diocese Anglicana do Recife (provavelmente o de dezembro de 2003) recebeu documentos de
    16 paróquias e missões com abaixo-assinado de mais de 800 membros em plena comunhão, que apoiavam o bispo diocesano,
    o bispo sufragâneo e o Conselho Diocesano, em especial a 'Afirmação do Recife' e a Resolução 1.10 de Lambeth
    (1998), conforme carta de arcediagos e do deão de 25/06/2004.
  status: probable
  sources:
  - source: darl3-primaz-0406
    quote: >-
      quando foi-lhe entregue solenemente documentos oriundos de 16 paróquias e missões contendo um "abaixo-assinado"
      com mais de 800 assinaturas de membros em plena comunhão dessas comunidades diocesanas
  - source: darl3-primaz-0406
    quote: >-
      hipotecamos o mais amplo e sólido apoio às posturas e deliberações do nosso bispo diocesano, bispo sufragâneo
      e Conselho Diocesano
- type: other
