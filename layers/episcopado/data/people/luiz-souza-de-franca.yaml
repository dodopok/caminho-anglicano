biography: >-
  Deão e arcediago da Diocese Anglicana do Recife; em 2006 deão da Con-Catedral da Ressurreição (João Pessoa) e
  arcediago de PB/RN/CE.
sources:
- source: drp-calendario-2004
  quote: Ven. Arced. Rev. Luiz Souza de França
- source: drp-carta-venables-pt-2005
  quote: Ven. Arc. Revmo. Deão Luiz Souza de França
ordinations:
- order: diaconate
  date: null
  jurisdiction: ieab-dar
  ordained_by: clovis-erly-rodrigues
  status: probable
  sources:
  - source: dard2-hist3
    quote: >-
      e, apenas ao Diaconato: Luiz Souza de França (Arcediago e Deão da Con-Catedral Anglicana da Ressurreição,
      João Pessoa-PB)
  - source: darl3-hist3
    quote: >-
      apenas ao Diaconato: Luiz Souza de França (Arcediago e Deão da Con-Catedral Anglicana da Ressurreição, João
      Pessoa-PB)
  - source: darl3-hist3
    quote: 'e, apenas ao Diaconato: Luiz Souza de França'
  notes: >-
    Ordenado diácono no período do bispo Clóvis Erly Rodrigues (1986-1997), segundo Robinson Cavalcanti, que o apresenta
    em 2006 como arcediago e deão da Con-Catedral da Ressurreição, em João Pessoa. Data e local não constam; o ordenante
    é entendido como o bispo diocesano da época. Ordenação durante o episcopado de Clóvis Erly Rodrigues na diocese
    (1986-1997), conforme lista de Dom Robinson Cavalcanti; o texto não dá data nem local e não diz expressamente
    "ordenado por"; ordenante inferido do período. Ordenado apenas ao diaconato nesse período.
affiliations:
