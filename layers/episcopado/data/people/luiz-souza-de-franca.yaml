- type: other
  date: 2003-12
  description: >-
    Concílio Diocesano da Diocese Anglicana do Recife (provavelmente o de dezembro de 2003) recebeu documentos de
    16 paróquias e missões com abaixo-assinado de mais de 800 membros em plena comunhão, que apoiavam o bispo diocesano,
    o bispo sufragâneo e o Conselho Diocesano, em especial a 'Afirmação do Recife' e a Resolução 1.10 de Lambeth
    (1998), conforme carta de arcediagos e do deão de 25/06/2004.
