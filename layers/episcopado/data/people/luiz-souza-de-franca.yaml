events:
- type: other
  date: 2001-12
  description: >-
    Segundo o sermão de 15/12/2001, o Concílio da Diocese Anglicana do Recife, realizado em Paripueiras (litoral
    de Alagoas) na semana anterior, elegeu Filadelfo de Oliveira Neto bispo auxiliar; o texto menciona ainda o recém-designado
    arcediago para a Paraíba e o Rio Grande do Norte, Luiz Souza de França (Paróquia da Ressurreição, João Pessoa).
  status: confirmed
  sources:
  - source: rta-orildo-lilian-2001
    quote: >-
      D. Filadelfo de Oliveira Neto, eleito Bispo Auxiliar na última Reunião Conciliar, realizada na aprazível Paripueiras,
      lá no litoral das Alagoas, na semana passada
  - source: rta-orildo-lilian-2001
    quote: >-
      recém designado Venerável Arcediago para a Paraíba e Rio Grande do Norte, Reverendo Luiz Souza de França,
      da Paróquia da Ressurreição em João Pessoa
