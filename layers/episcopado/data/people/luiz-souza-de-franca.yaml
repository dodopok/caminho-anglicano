- type: other
  date: 2010-01
  description: >-
    O Ponto Missionário Anglicano Água Viva, em Arez (RN), foi criado pelo Arcediagado PB/RN em janeiro de 2010
    e tinha 28 membros em outubro de 2010; o arcediago Luiz Souza de França representou o bispo na inauguração do
    novo espaço de cultos, em 17/10/2010. O ponto missionário pretendia pedir, no Concílio Diocesano seguinte, a
    mudança de status para Missão, e o seminarista William Sá, seu dirigente, deveria ser instituído evangelista
    pelo bispo na mesma ocasião.
  status: confirmed
  sources:
  - source: d2s20-agua-viva-out
    quote: >-
      Este Ponto Missionário foi criado pelo Arcediagado PB/RN em janeiro deste ano e já conta com uma membresia
      de 28 membros
  - source: d2s20-agua-viva-out
    quote: >-
      vai solicitar sua mudança de status para Missão, no próximo Concílio Diocesano, quando também o seminarista
      William Sá , dirigente desta comunidade, será instituído como Evangelista pelo Bispo Dom Robinson
  - source: d2s20-agua-viva-out
    quote: >-
      No dia 17.10 o Venerável Arcediago e Cônego, Rev. Luiz Souza de França , esteve representando nosso Bispo
      Diocesano na inauguração do novo espaço de cultos do Ponto Missionário Anglicano Água Viva , na cidade de
      Arez, Rio Grande do Norte.
