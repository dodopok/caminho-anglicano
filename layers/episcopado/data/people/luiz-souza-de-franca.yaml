# yaml-language-server: $schema=../../schemas/person.json
id: luiz-souza-de-franca
name: Luiz Souza de França
aliases:
- Deão Luiz Souza de França
- Luiz de Souza França
- Rev. Souza
- Revmo. Luiz de Souza França
biography: >-
  Deão e arcediago da Diocese Anglicana do Recife; em 2006 deão da Con-Catedral da Ressurreição (João Pessoa) e
  arcediago de PB/RN/CE.
sources:
- source: drp-calendario-2004
  quote: Ven. Arced. Rev. Luiz Souza de França
- source: drp-carta-venables-pt-2005
  quote: Ven. Arc. Revmo. Deão Luiz Souza de França
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Revmo. Arc. Deão Luiz Souza de França
  - source: drv-nota-esclarecimento-2006
    quote: Luiz Souza de França
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revmo. Deão Luiz Souza de França … Os clérigos não atenderam à
      convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: ieab-dar
  role: other
  role_description: arcediago
  status: confirmed
  sources:
  - source: drp-calendario-2004
    quote: Ven. Arced. Rev. Luiz Souza de França
  notes: >-
    Local: Diocese Anglicana do Recife. Título de arcediago atestado no calendário diocesano de 2004 (publicado
    em 2003).
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: deao
  status: confirmed
  sources:
  - source: drp-carta-venables-pt-2005
    quote: Ven. Arc. Revmo. Deão Luiz Souza de França
  - source: drp-boletim-oracao-2006
    quote: >-
      Orar pela Con-Catedral Anglicana da Ressurreição (PB); pelo Revmo. Deão Luiz Souza de França, pelo Coadjutor
      Rev. Raimundo
  - source: drp-calendario-2007
    quote: Ven. Arc. Revmo. Deão Luiz Souza de França
  notes: >-
    Assina a carta a Venables (17/10/2005) como deão e arcediago ("Ven. Arc. Revmo. Deão"). Local: Con-Catedral
    Anglicana da Ressurreição, João Pessoa. Deão da Con-Catedral da Ressurreição (PB) em out/nov de 2006; o calendário
    de 2007 o titula "Ven. Arc. Revmo. Deão Luiz Souza de França". Título de deão e arcediago no calendário diocesano
    de 2007.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: arcediago
  status: confirmed
  sources:
  - source: drp-boletim-oracao-2006
    quote: PB/RN/CE – Ven. Arc. Revmo. Deão Luiz Souza de França
  - source: drv-carta-clero-primaz
    quote: Rev. Arc. Luiz Souza de França
  - source: drp2-breves-03-2006
    quote: O ato foi oficiado pelo Revmo. Deão Luiz Souza de França, Arcediago da região
  - source: drp2-breves-03-2006
    quote: Notícias do Arcediagado PB/RN/CE
  notes: >-
    Local: Arcediagado PB/RN/CE. Arcediagos e arcediagados em out/nov de 2006: PB/RN/CE (Luiz Souza de França),
    Norte (Maria Gorete), Centro (Evilásio Tenório), Sul (Miguel Uchoa). Cargo exercido em julho de 2007 (carta
    do clero ao primaz do Cone Sul); início e fim não informados. Local: Arcediagado PB/RN/CE. Deão e arcediago
    da região Paraíba/Rio Grande do Norte/Ceará em fevereiro de 2006.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revmo. Deão Luiz Souza de França … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: deão
  status: confirmed
  sources:
  - source: drp2-instalacao-deao-2005
    quote: >-
      seu colega, o Deão da Con-Catedral da Ressurreição, em João Pessoa, Reverendíssimo Luiz França de Souza
  notes: >-
    Local: Con-Catedral Anglicana da Ressurreição, João Pessoa. Já era deão da Con-Catedral em fevereiro de 2005.
