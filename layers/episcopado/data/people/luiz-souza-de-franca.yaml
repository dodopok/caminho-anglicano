- type: other
  date: '2010-11-13'
  description: >-
    Em 13/11/2010 nasce o Ponto Missionário Anglicano Vida Renovada, em Mituaçú (município de Conde, PB), primeiro
    'filho' da futura Paróquia Anglicana do Consolador (Rev. Côn. Souza). O culto de inauguração contou com o arcediago,
    Rev. Côn. Luiz Souza de França, e com o arcediago adjunto, Rev. Raimundo Figueiredo.
  status: confirmed
  sources:
