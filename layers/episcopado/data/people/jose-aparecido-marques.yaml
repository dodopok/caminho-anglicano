id: jose-aparecido-marques
name: José Aparecido Marques
full_name: José Aparecido Marques
aliases:
- Bispo + José Marques
- Dom José Aparecido
- José Marques
biography: >-
  Um 'Bispo + José Marques' consta entre os quatro sagrandos do convite à sagração episcopal de 10/11/2012 (a identificação
  com José Aparecido Marques vem do relato de Costa/Cant 2024, que lista os cinco postulantes).
sources:
- source: lac-cnbp-convite2012
  quote: Episcopisa + Eliane Helena Bispo + Reinaldo Tavares Bispo + José Marques Bispo + Elcemir Durans
ordinations:
- order: presbyterate
  date: '2009-10-24'
  jurisdiction: null
  status: confirmed
  sources:
  - source: lia-iatb-clerigos-2016
    quote: >-
      No dia 24 de Outubro de 2009 foi ordenado Prebítero e 02 de outubro de 2011 Sagrado bispo na Igreja Vétero
      Católica do Brasil.
  notes: >-
    Igreja/ordenante do presbiterato não informados (a frase conjuga presbiterato e sagração na mesma igreja).
- order: episcopate
  date: '2012-11-10'
  place: Igreja Pentecostal Caminho da Fé, Rua Botânica 70, Jardim Boa Esperança, Belford Roxo (RJ)
  jurisdiction: oafip
  principal_consecrator: elias-batista-nogueira
  co_consecrators:
  - jose-demontier
  - josue-sousa-torres
  status: confirmed
  sources:
  - source: lia-iatb-clerigos-2016
    quote: >-
      No dia 24 de Outubro de 2009 foi ordenado Prebítero e 02 de outubro de 2011 Sagrado bispo na Igreja Vétero
      Católica do Brasil.
  - source: lia-iatb-clerigos-2016
    quote: >-
      No dia 10 de novembro de 2012 teve suas ordens confirmadas pela CEFIP (Convenção Eclesiástica Filhos da Promessa)
      de tradição Anglicana.
  - source: lac-cnbp-convite2012
    quote: >-
      SAGRANTE: Monsenhor ++Elias Batista Nogueira (IEFP) CO-SAGRANTES: Monsenhor ++Josué Souza Torres (IEEP) Monsenhor
      +Cláudio Lucena (Igreja Metodista) No dia 10 de Novembro do ano da graça de Nosso Senhor Jesus Cristo de 2012
      às 18:30 horas na Igreja Pentecostal Caminho da Fé, sito à Rua Botânica, nº 70 – Jardim Boa Esperança – Belford
      Roxo – Rio de Janeiro – Brasil.
  - source: lac-cnbp-convite2012
    quote: Episcopisa + Eliane Helena Bispo + Reinaldo Tavares Bispo + José Marques Bispo + Elcemir Durans
  - source: cant-novas-igrejas-2024
    quote: >-
      Sagração Episcopal dos seguintes postulantes: Eliane Helena da Silva Nogueira, Reinaldo da Silva Tavares,
      José Aparecido Marques, José Kennedy de Freitas e Elcemir Durans Mendonça, a realizar-se no dia 10 de Novembro
      de 2012 na Igreja Pentecostal Caminho da Fé, sito à Rua Botânica, nº 70 – Jardim Boa Esperança – 145 NOVAS
      IGREJAS ANGLICANAS E EPISCOPAIS NO BRASIL Belford Roxo – Rio de Janeiro - Brasil, tendo Como Sagrante Principal
      Sua Exª Mons. Elias Batista Nogueira e como co-sagrantes: Sua Exª Bispo Josué Souza Torres e Sua Exª Bispo
      José Demontier
  - source: cant-novas-igrejas-2024
    quote: >-
      Sob a Presidência de seu Venerável Irmão Elias Batista Nogueira se aprovou fazer pela OAFIP a Sagração Episcopal
      dos seguintes postulantes: Eliane Helena da Silva Nogueira, Reinaldo da Silva Tavares, José Aparecido Marques,
      José Kennedy de Freitas e Elcemir Durans Mendonça, a realizar-se no dia 10 de Novembro de 2012 na Igreja Pentecostal
      Caminho da Fé
    page: '145'
  - source: cant-novas-igrejas-2024
    quote: >-
      tendo Como Sagrante Principal Sua Exª Mons. Elias Batista Nogueira e como co-sagrantes: Sua Exª Bispo Josué
      Souza Torres e Sua Exª Bispo José Demontier
    page: '146'
  notes: >-
    A IATB dá a sagração em 02/10/2011, na Igreja Vétero Católica do Brasil, e diz que em 10/11/2012 ele 'teve suas
    ordens confirmadas pela CEFIP'; outras fontes registram a sagração de 10/11/2012 como a sagração dele. Fonte
    é o convite (imagem publicada em 09/10/2012 no blog do CNBP) para a solenidade de sagração episcopal de 10/11/2012
    às 18h30, ou seja, anúncio do ato e não relato da cerimônia. O convite nomeia como co-sagrantes Josué Souza
    Torres (IEEP) e Cláudio Lucena (Igreja Metodista); o documento transcrito por Costa/Cant (2024) nomeia Josué
    Souza Torres e José Demontier — os dois coincidem em Josué. Os sagrandos listados no convite são quatro (Eliane
    Helena, Reinaldo Tavares, José Marques, Elcemir Durans); José Kennedy de Freitas, citado por Costa/Cant entre
    os cinco postulantes, não consta do convite. Costa (2024) transcreve a convocação da Província Brasileira de
    Confissão Anglicana (10/11/2012); é a previsão do ato, não um relato da cerimônia. O documento citado (Província
    Brasileira de Confissão Anglicana, 10/11/2012) é a aprovação da sagração 'a realizar-se' nessa data; o livro
    não confirma explicitamente a realização.
