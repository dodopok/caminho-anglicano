biography: >-
  Ordenada presbítera em 17/7/2010 por Robinson Cavalcanti, na Paróquia Anglicana Santo Estevão (Assentamento Antônio
  Conselheiro, São Miguel de Taipu-PB), da qual foi pároca; consta depois como clériga da Igreja Anglicana Salvação
  (IAB, Diocese de João Pessoa).
