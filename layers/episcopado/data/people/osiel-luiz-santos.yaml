id: osiel-luiz-santos
name: Osiel Luiz Santos
full_name: Osiel Luiz dos Santos
aliases:
- Dom João Paulo
- Osiel Luiz dos Santos
- Padre Osiel
biography: Pessoa citada em documentos históricos da Diocese do Recife e da IEAB (ver afirmações).
sources:
- source: drv-ata-iaob-2014
  quote: Dom Osiel Luiz Santos, Primaz da Igreja Católica Apostólica Libertadora da cidade de Goiânia
ordinations:
- order: presbyterate
  date: '1981-06-29'
  place: Catedral Metropolitana de Goiânia (GO)
  jurisdiction: icr
  ordained_by: fernando-gomes-dos-santos
  status: probable
  sources:
  - source: lvc-icalib-blog-2011
    quote: >-
      Fui ordenado Padre em 29 de junho de 1981 na Catedral Metropolitana de Goiânia pelo o Arcebispo Dom Fernando
      Gomes dos Santos.
  notes: Declaração do próprio Osiel em seu blog (padre católico romano à época).
- order: episcopate
  date: '2011-06-26'
  jurisdiction: icalib
  office: diocesan
  principal_consecrator: iranildo-macieira-da-silva
  co_consecrators:
  - geovanne-chrisostomos
  - jorge-costa
  - josue-sousa-torres
  - rogerio-carlos-vaz
  status: probable
  sources:
  - source: lvc-icalib-blog-2011
    quote: >-
      Fui Sagrado Bispo em 26 de junho de 2011 para a Igreja Católica Apostólica Libertadora (ICAL), pelo o Presidente
      da Conferência Episcopal dos Bispos Independentes, Dom Lucas Macieira
  - source: lvc-icalib-blog-2011
    quote: >-
      Dom Geovanne Chrisostomos, Bispo Eparquial Geral no Brasil da Igreja Ortodoxa Bizantina de Imperatriz, Dom
      Jesué Torres Bispo Primaz da Igreja Episcopal do Evangelho Pleno de São Paulo, Dom Rogério Carlos Vaz  Bispo
      de Sete Lagoas e Dom Jorge Costa Bispo da Igreja Ortodoxa Bielorússia de Salvador
  notes: >-
    Relato do próprio sagrado, em dois textos do blog dele ('Dom João Paulo' foi o nome adotado por ser 26 de junho
    dia de São João e São Paulo). O blog descreve Lucas Macieira como presidente da Conferência Episcopal dos Bispos
    Independentes e arcebispo primaz de Belo Horizonte da Igreja Episcopal Latina do Brasil, e diz que a sucessão
    de Macieira vem de Antônio José da Costa Raposo, de Portugal. Em 2011 o blog conta que outros bispos (Jorge
    Costa, Crisóstomo) tinham se oferecido para sagrá-lo e que ele recusou sagrações para igrejas alheias; o local
    da cerimônia não é dito (menciona-se casa cheia de bispos e visita ao santuário de Trindade, GO). O co-sagrante
    'Jesué Torres' é identificado como Josué Sousa Torres, da Igreja Episcopal do Evangelho Pleno.
