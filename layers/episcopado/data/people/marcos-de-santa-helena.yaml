id: marcos-de-santa-helena
name: Marcos de Santa Helena
aliases:
- Dom Marcos de Santa Helena, OSC
biography: >-
  Marcos de Santa Helena é listado entre os bispos da Igreja Episcopal Latina do Brasil; uma página de sucessão
  registra sagração em 15/01/2006 por Barry Frank Peachey e instalação como arcebispo da Communion of Evangelical
  Episcopal Churches para o Brasil em 20/10/2007.
sources:
- source: lielb-arquiabadia
  quote: Consecrated as Bishop in 15th January 2006
- source: lielb-arquiabadia
  quote: >-
    The Most Rev’d. Iranildo Macieira da Silva (Dom Lucas) Metropolitan Primate Archbishop of The Latin Episcopal
    Church of Brazil
- source: lielb-arquiabadia
  quote: >-
    Installed Archbishop of The Communion of Evangelical Episcopal Churches for Brazil in 20th Octuber 2007
- source: cant-novas-igrejas-2024
  quote: >-
    Após a sua fundação, a Igreja Episcopal Latina do Brasil teve como bispos o bispo Ricardo Lorite de Lima, como
    o Arcebispo Primaz e Metropolitano, Lorite de Lima, dom Rogério Belmiro Tampellini, dom Marcos de Santa Helena
    e dom Adauto Pereira.
  page: '167'
ordinations:
- order: episcopate
