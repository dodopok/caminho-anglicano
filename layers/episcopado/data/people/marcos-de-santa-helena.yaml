# yaml-language-server: $schema=../../schemas/person.json
id: marcos-de-santa-helena
name: Marcos de Santa Helena
aliases:
- Dom Marcos de Santa Helena, OSC
biography: >-
  Marcos de Santa Helena é listado entre os bispos da Igreja Episcopal Latina do Brasil; uma página de sucessão
  registra sagração em 15/01/2006 por Barry Frank Peachey e instalação como arcebispo da Communion of Evangelical
  Episcopal Churches para o Brasil em 20/10/2007.
sources:
- source: lielb-arquiabadia
  quote: Consecrated as Bishop in 15th January 2006
- source: lielb-arquiabadia
  quote: >-
    The Most Rev’d. Iranildo Macieira da Silva (Dom Lucas) Metropolitan Primate Archbishop of The Latin Episcopal
    Church of Brazil
- source: lielb-arquiabadia
  quote: >-
    Installed Archbishop of The Communion of Evangelical Episcopal Churches for Brazil in 20th Octuber 2007
- source: cant-novas-igrejas-2024
  quote: >-
    Após a sua fundação, a Igreja Episcopal Latina do Brasil teve como bispos o bispo Ricardo Lorite de Lima, como
    o Arcebispo Primaz e Metropolitano, Lorite de Lima, dom Rogério Belmiro Tampellini, dom Marcos de Santa Helena
    e dom Adauto Pereira.
  page: '167'
ordinations:
- order: episcopate
  date: '2006-01-15'
  jurisdiction: null
  principal_consecrator: barry-frank-peachey
  co_consecrators:
  - iranildo-macieira-da-silva
  - norman-dutton
  status: probable
  sources:
  - source: lielb-arquiabadia
    quote: Consecrated as Bishop in 15th January 2006
  - source: lielb-arquiabadia
    quote: >-
      The Most Rev’d. Iranildo Macieira da Silva (Dom Lucas) Metropolitan Primate Archbishop of The Latin Episcopal
      Church of Brazil
  notes: >-
    A página replica os dados da sagração de Ricardo Lorite de Lima (mesma data, sagrante e co-sagrantes); pode
    ter sido copiada do modelo de Lorite. Ver dúvidas.
affiliations:
- jurisdiction: ordem-de-santa-cecilia
  role: founder
  start: '1998'
  status: probable
  sources:
  - source: perd08-fides-2007
    quote: Brother Marcos of Santa Helena, founder and prior of the Priory
  - source: perd08-fides-2007
    quote: >-
      The Monastic Congregation of Saint Cecilia, registered as the Order of Santa Cecilia, was founded on 11 October
      in 1998
  notes: >-
    Fundador e prior do priorado da Congregação Monástica de Santa Cecília (registrada como Ordem de Santa Cecília),
    em Caçapava do Sul (RS), fundada em 11/10/1998; em 2007 o bispo diocesano católico de Caçapava do Sul, Irineu
    Silvio Wilges, presidiria a profissão perpétua de um monge. A ficha já traz o apelido 'OSC'; a identificação
    do 'Frei Marcos de Santa Helena' da Agência Fides com o bispo da IELB baseia-se no nome e na sigla OSC, sem
    fonte que ligue as duas fases explicitamente.
- jurisdiction: ielb
  role: bishop
  status: probable
  sources:
  - source: lielb-arquiabadia
    quote: >-
      Installed Archbishop of The Communion of Evangelical Episcopal Churches for Brazil in 20th Octuber 2007
  - source: cant-novas-igrejas-2024
    quote: >-
      Após a sua fundação, a Igreja Episcopal Latina do Brasil teve como bispos o bispo Ricardo Lorite de Lima,
      como o Arcebispo Primaz e Metropolitano, Lorite de Lima, dom Rogério Belmiro Tampellini, dom Marcos de Santa
      Helena e dom Adauto Pereira.
    page: '167'
  notes: >-
    A página o descreve também como Arcebispo Primaz da "Anglican Church of Brazil" e da Comunhão Anglicana Independente
    para o Brasil (2010). Vínculo com a IELB vem do livro "Novas igrejas" (listado entre bispos da IELB).
