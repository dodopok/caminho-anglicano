    Marinez Bassotto é eleita primaz da IEAB no 35º Sínodo, realizado em Belém (PA) de 11 a 14 de novembro de 2022:
    a Câmara dos Bispos a elegeu em 13 de novembro, sucedendo Naudal Alves Gomes, e a eleição foi confirmada pela
    Câmara de Clérigos e Leigos. Primeira mulher primaz da IEAB e da América do Sul e Central.
  status: confirmed
  sources:
  - source: ieab-nova-primaz
    quote: >-
      Neste domingo, 13 de novembro, penúltimo dia do 35° Sínodo da Igreja Episcopal Anglicana do Brasil, a bispa
      Marinez Bassotto (foto acima, ao centro), atual bispa da Diocese Anglicana da Amazônia, foi eleita a nova
      primaz da Igreja.
  - source: cabs-anglicanink-2022
    quote: >-
      Meeting in Belém on 13 November 2022, the House of Bishops elected her primate in succession to the Most Rev.
      Naudal Alves Gomes. Her election was confirmed by the church’s lower house of clergy and lay deputies to synod.
  - source: ieab-secretaria
    quote: Em 13 de novembro de 2022, durante o 35° Sínodo da Igreja, foi eleita primaz.
  - source: cabs-ieab-sinodo-inicio-2022
    quote: >-
      Começou nesta sexta-feira, 11 de novembro, o 35° Sínodo da #nossaIEAB, Igreja Episcopal Anglicana do Brasil.
  - source: cabs-livingchurch-2022
    quote: >-
      Bassotto, who will continue to serve as bishop of the Diocese of the Amazon, succeeds the Most Rev. Naudal
      Gomes, who has been presiding bishop of the IEAB since 2018.
