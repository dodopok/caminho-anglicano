biography: >-
  Naudal Alves Gomes nasceu em Sant'Ana do Livramento (RS) em 19/06/1953, concluiu a formação teológica no Seminário
  de Porto Alegre em 1979 e foi ordenado diácono em 29/12/1979 e presbítero em 08/12/1980. Foi sagrado em 08/04/2000,
  na Catedral Metropolitana de Santa Maria, bispo sufragâneo da Diocese Anglicana Sul-Ocidental, tendo Glauco Soares
  de Lima como sagrante segundo uma fonte. De 2003 a dezembro de 2021 foi o primeiro bispo diocesano da Diocese
  Anglicana do Paraná, passando a emérito, e entre 2018 e 2020 foi bispo interino da Diocese Anglicana de São Paulo.
  Eleito primaz da IEAB em 02/06/2018, no 34º Sínodo Geral, exerceu o cargo até 2022. Depois atuou na Igreja Episcopal
  (TEC), como bispo encarregado na Diocese de Los Angeles e bispo interino responsável pela St. Mark's. Sua irmã,
  Carmen Etel Alves Gomes, foi a primeira diácona da IEAB, em 1985. Participou de cinco ordenações de diáconos ou
  presbíteros e de sete sagrações episcopais, entre elas as de Hiroshi Ito, Roger Douglas Bird e Francisco de Assis
  da Silva, como co-sagrante.
