  notes: >-
    Presenca da bispa Barbara Harris (TEC) registrada; sagrante principal nao informado nas fontes lidas. O Anglican
    Journal de setembro de 2000 não nomeia o consagrado; a identificação com Naudal Alves Gomes (sufragâneo da Diocese
    Sul-Ocidental, Santa Maria, 2000) decorre de outras fontes sobre a diocese. A matéria confirma o local (catedral
    católica, com cerca de mil pessoas, a convite do bispo católico) porque a catedral anglicana comporta apenas
    150. Artigo de pesquisador local (membro da Federação Ecumênica de Santa Maria) que cita o jornal A Razão (Santa
    Maria, 8-9/04/2000) para o pedido da catedral católica; o artigo diz que o consagrado foi 'ordenado' pelo bispo
    primaz Glauco Soares de Lima, pelos demais bispos das dioceses anglicanas do Brasil e pela bispa norte-americana
    Barbara Harris, sem distinguir sagrante principal e co-sagrantes. Barbara Harris é listada aqui como participante
    da imposição de mãos conforme o texto. A catedral usada foi a católica, a pedido da Diocese Sul-Ocidental, porque
    a anglicana (Mediador) seria pequena. DATA: este artigo situa a celebração na manhã do domingo 9 de abril de
    2000; a tese de Costa (2021) e a Wikipédia em português dão 8 de abril de 2000 (sábado). O jornal A Razão citado
    é a edição de 8 e 9/04/2000 (fim de semana), o que não decide a questão. A tese NÃO nomeia sagrante principal
    nem co-sagrantes; menciona a participação de representantes de outras Províncias, 'como a bispa Barbara Harris'
    (Igreja Episcopal dos EUA), sem dizer que impôs as mãos.
