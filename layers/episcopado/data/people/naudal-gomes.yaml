    (12/12/2021). A tese também diz que a sagração dele como bispo de Curitiba (sic, instalação) foi na catedral
    católica da cidade. Local: Paraná. Antes bispo auxiliar da Diocese Sul-Ocidental. Data inferida do contexto
    (eleição contemporânea à de Sebastião para o Recife, 2006).
