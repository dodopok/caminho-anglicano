id: franciney-rodrigues-pantoja
name: Franciney Rodrigues Pantoja
full_name: Franciney Rodrigues Pantoja
aliases:
- Dom Franciney
- Dom Franciney Pantoja
biography: >-
  Bispo titular da Diocese Católica Anglicana do Baixo Tocantins (Pará), com atuação em Cametá; na Câmara Episcopal
  da ICA aparece como "Arcebispo Primaz Sufragâneo e Presidente do Conselho Executivo Administrativo Primacial"
  (2017). Signatário do Manifesto à Nação Brasileira (Cametá, 12/11/2017).
sources:
