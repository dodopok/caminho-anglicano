# yaml-language-server: $schema=../../schemas/person.json
id: franciney-rodrigues-pantoja
name: Franciney Rodrigues Pantoja
full_name: Franciney Rodrigues Pantoja
aliases:
- Dom Franciney
- Dom Franciney Pantoja
biography: >-
  Bispo titular da Diocese Católica Anglicana do Baixo Tocantins (Pará), com atuação em Cametá; na Câmara Episcopal
  da ICA aparece como "Arcebispo Primaz Sufragâneo e Presidente do Conselho Executivo Administrativo Primacial"
  (2017). Signatário do Manifesto à Nação Brasileira (Cametá, 12/11/2017).
sources:
- source: lica-ica-manifesto
  quote: >-
    Dom Franciney Rodrigues Pantoja – Bispo Titular da Diocese Católica Anglicana do Baixo Tocantins do Pará
- source: lica-ica-franciney-templo
  quote: >-
    + Dom Franciney Pantoja: Arcebispo Primaz Sufragâneo e Presidente do Conselho Executivo Administrativo Primacial.
ordinations:
- order: episcopate
  date: '2016-07-17'
  place: dependências da UFPA, Cametá (PA)
  jurisdiction: iatb
  office: auxiliary
  principal_consecrator: rui-costa-barbosa
  co_consecrators:
  - orvandil-moreira-barbosa
  - ricardo-vicente-dos-anjos
  status: confirmed
  sources:
  - source: lia-iatb-home-2016-08
    quote: >-
      para a Igreja Indivisa de Cristo: Dom Franciney Pantoja, de Cametá-PA e Dom Alfredo Dorea, de Salvador-BA.
  - source: lia-iatb-clero-2017
    quote: Revmº Dom Franciney Rodrigues Pantoja Bispo Auxiliar de Cametá—PA
  notes: >-
    Sagrado no mesmo ato de Alfredo Dórea (presidente: Rui Costa Barbosa; co-celebrantes: Ricardo Vicente dos Anjos
    e Orvandil Moreira Barbosa). Em nov/2015 constava ainda como 'Rev. Franciney Rodrigues Pantoja, Cametá-PA'.
