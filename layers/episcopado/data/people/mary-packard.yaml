id: mary-packard
name: Mary Packard
aliases:
- Miss Packard
biography: >-
  Diaconisa treinada, chegou à missão brasileira no outono de 1891, junto com William Cabell Brown e John Gaw Meem,
  para se somar a Kinsolving e Morris. Atuou em serviço social e aconselhamento familiar, e dedicou à missão o resto
  de sua vida ativa.
sources:
- source: liv-stokes-kinsolving
  quote: >-
    In the autumn of 1891 Kinsolving and Morris had been joined by the Rev. and Mrs. William Cabell Brown, and the
    Rev. John Gaw Meem, both from Virginia Seminary, as well as by Mary Packard, the daughter of the dean of the
    seminary.
  page: '12'
- source: liv-stokes-kinsolving
  quote: Miss Packard, a trained deaconess, was in- valuable.
  page: '13'
- source: liv-stokes-kinsolving
  quote: The remainder of her active life was devoted to the mission.
  page: '13'
- source: liv-stokes-kinsolving
  quote: Mary Packard, the daughter of the dean of the seminary
  page: '12'
