  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: ORDENAÇÕES DIACONAIS - 29/12/2001 (Karla, Lilian e Quintino)
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: Hoje recebem o diaconato, ordem para o serviço
  - source: rcor-drv-diac-karla-lilian-quintino
    quote: Vocês sabem que não me chamo Edmund ou Clóvis, mas Robinson.
  - source: testemunho-mantenedor-2026-10-09-sermoes
    quote: Karla é a Patriota
  notes: >-
    Sermão assinado por Dom Robinson Cavalcanti, bispo diocesano. O sermão diz só 'Karla'; a identificação com Karla
    Patriota foi confirmada pelo mantenedor.
