# yaml-language-server: $schema=../../schemas/person.json
id: karla-patriota
name: Karla Patriota
biography: >-
  Ordenada diácona em 29/12/2001 por Robinson Cavalcanti, atuou como presbítera na Diocese do Recife (IEAB). Em
  2002, em razão da ordenação feminina, saiu com Leônides de Menezes e a Paróquia Betânia para a Comunhão das Igrejas
  Episcopais Evangélicas, no cisma de 2002 da diocese.
sources:
- source: rcor-drv-diac-karla-lilian-quintino
  quote: ORDENAÇÕES DIACONAIS - 29/12/2001 (Karla, Lilian e Quintino)
- source: rcor-drv-diac-karla-lilian-quintino
  quote: Hoje recebem o diaconato, ordem para o serviço
- source: drp2-memorias-decada-vii
  quote: >-
    Os Reverendos Leonides Menezes e Karla Patriota, com a Paróquia Betânia, saem também, mas, em virtude da Ordenação
    feminina, vão para a Comunhão das Igrejas Episcopais Evangélicas = CIEE
- source: cant-novas-igrejas-2024
  quote: Depois houve a saída do rev. Leonides Menezes, com a rev. Karla Patriota
  page: '65'
- source: cant-novas-igrejas-2024
  quote: >-
    Depois houve a saída do rev. Leonides Menezes, com a rev. Karla Patriota e Adonias Ramos Souza e as paróquias
    Betânia e Calvário
  page: '65'
- source: drv-resgatando-iv
  quote: 'os reverendos: Leonides e Karla, com a Paróquia Betânia, para a Igreja Episcopal Evangélica'
ordinations:
- order: diaconate
