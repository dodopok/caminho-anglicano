events:
- type: other
  date: '2002'
  description: >-
    Cisma de 2002 na Diocese do Recife, descrito como 'trifonte' por Dom Robinson: (1) o deão da Catedral e comunidades
    do Janga, Timbaúba e Vitória de Santo Antão foram para a Igreja Episcopal Carismática; (2) os Revs. Leonides
    e Karla, com a Paróquia Betânia, para a Igreja Episcopal Evangélica; (3) o Rev. Múcio, com a comunidade do Parnamirim,
    de volta à Igreja Presbiteriana do Brasil.
  status: probable
  sources:
  - source: drv-resgatando-iv
    quote: 'os reverendos: Leonides e Karla, com a Paróquia Betânia, para a Igreja Episcopal Evangélica'
  - source: drv-resgatando-iv
    quote: >-
      o Rev. Múcio, com a comunidade do Parnamirim, de volta – mais uma vez – para a Igreja Presbiteriana do Brasil
      (IPB)
- type: other
  date: '2002'
  description: >-
    Segundo o histórico do site da IEAB, no segundo cisma de 2002 deixaram a Diocese Anglicana do Recife os reverendos
    Leonides Menezes Ferreira e Adonias Ramos de Souza, a reverenda Karla Patriota e as Paróquias Betânia e do Calvário
    (relato da fonte, que atribui os cismas à gestão do bispo diocesano).
  status: confirmed
  sources:
  - source: d2s31-hist
    quote: >-
      No segundo cisma, deixaram a Igreja o Rev. Leonides Menezes Ferreira, Revda. Karla Patriota o Rev. Adonias
      Ramos de Souza e as Paróquias Betânea e do Calvário.
