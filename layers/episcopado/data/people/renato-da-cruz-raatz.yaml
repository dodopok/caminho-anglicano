      quote: então deão da Catedral do Redentor, foi eleito o novo bispo diocesano.
      page: '110'
    - source: costa2021
      quote: >-
        que substituiu o bispo Renato da Cruz Raatz, que havia atingido a idade da aposentadoria compulsória.
      page: '119'
  notes: Anexo D da tese (bispos por diocese). Fim = posse de Meriglei (14/3/2020).
events:
- type: other
  date: '2019-04-27'
  description: >-
    Meriglei Borges Simin foi eleita bispa coadjutora da Diocese Anglicana de Pelotas em concílio extraordinário
    na Catedral do Redentor, em 27 de abril de 2019, no primeiro escrutínio, com 6 votos do clero e 42 do laicato;
    o concílio foi presidido pelo bispo Francisco de Assis da Silva, a convite do bispo diocesano Renato da Cruz
    Raatz.
  status: confirmed
  sources:
  - source: lic-psj-meriglei-2019
    quote: >-
      A eleição aconteceu na Catedral do Redentor, no dia 27 de abril, em concílio extraordinário, presidido pelo
      Bispo Francisco de Assis da Silva, da Diocese Sul-Ocidental, de Santa Maria/RS que atendeu ao convite do Bispo
      Renato da Cruz Raatz, Diocesano da Diocese Anglicana de Pelotas.
  - source: lic-psj-meriglei-2019
    quote: Foi eleita no primeiro escrutínio com 6 votos do clero e 42 votos do laicato.
- type: other
  date: '2007-01-13'
  description: >-
    Renato da Cruz Raatz, deão da Catedral do Redentor (Pelotas), é eleito bispo da Diocese Anglicana de Pelotas
    em concílio extraordinário de 13/01/2007, presidido por Orlando Santos de Oliveira (8 votos do clero e 25 dos
    leigos). Nascido em Canguçu (RS), foi ordenado diácono em dezembro de 1979 e presbítero em julho de 1980.
  status: probable
  sources:
  - source: rtb-sn-2007-raatz-eleito
    quote: >-
      foi eleito bispo da Diocese Anglicana de Pelotas, em reunião do Concílio Extraordinário, realizada no dia
      13 de janeiro, na Catedral, sob a presidência de Dom Orlando Santos de Oliveira
  - source: rtb-sn-2007-raatz-eleito
    quote: Ordenado diácono em dezembro de 1979 e presbítero em julho de 1980.
- type: other
  date: '2019-04-27'
  description: >-
    Meriglei Borges Simin (51 anos, natural de Canguçu/RS, clériga da Diocese Anglicana do Rio de Janeiro) é eleita
    bispa coadjutora da Diocese Anglicana de Pelotas em 27/04/2019, no primeiro escrutínio (6 votos do clero e 42
    do laicato), em concílio extraordinário presidido por Francisco de Assis da Silva a convite de Renato Raatz;
    a sagração foi prevista para 17/11/2019.
  status: confirmed
  sources:
  - source: rtb-sn-2019-meriglei-eleita
    quote: >-
      A Revda. Meriglei Borges Simin, foi eleita Bispa Coadjutora da Diocese Anglicana de Pelotas – DAP. A eleição
      aconteceu na Catedral do Redentor, no dia 27 de abril, em concílio extraordinário
  - source: rtb-sn-2019-meriglei-eleita
    quote: Foi eleita no primeiro escrutínio com 6 votos do clero e 42 votos do laicato.
