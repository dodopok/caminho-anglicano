ordinations:
- order: diaconate
  date: '1979-12-30'
  place: Catedral da Santíssima Trindade, Porto Alegre
  jurisdiction: ieab-dm
  status: probable
  sources:
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1979 - … Renato da Cruz Raatz
    page: '372'
  - source: costa2021
    quote: >-
      sendo ordenado diácono em 30 de dezembro de 1979, na Catedral da Santíssima Trindade, em Porto Alegre, e presbítero
      em 20 de julho de 1980, na Paróquia da Bênção Divina, em São Francisco de Paula.
    page: '110'
  notes: >-
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
- order: presbyterate
  date: '1980-07-20'
  place: Paróquia da Bênção Divina, São Francisco de Paula
  jurisdiction: ieab-dm
  status: probable
  sources:
  - source: costa2021
    quote: >-
      sendo ordenado diácono em 30 de dezembro de 1979, na Catedral da Santíssima Trindade, em Porto Alegre, e presbítero
      em 20 de julho de 1980, na Paróquia da Bênção Divina, em São Francisco de Paula.
    page: '110'
- order: episcopate
  date: '2007-04-15'
  place: Catedral do Redentor, Pelotas (RS)
  jurisdiction: ieab
  office: diocesan
  principal_consecrator: mauricio-andrade
  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      A sagração ocorreu no dia 15 de abril de 2007, em cerimônia presidida pelo bispo Primaz, Maurício Andrade.
      O pregador foi o bispo Naudal Gomes, seu colega de seminário.
  - source: cant-ec-2007-03
    quote: >-
      A cerimônia, presidida pelo bispo Primaz, dom Maurício de Andrade, aconteceu na Cate- dral do Redentor, no
      dia 15 de abril.
  - source: rtb-sn-2007-raatz-sagr
    quote: >-
      O Primaz ao presidir a cerimônia de sagração de D. Renato frisou que a celebração e a alegria dos presentes
      representavam verdadeiras cartas vivas
  - source: rtb-sn-2007-raatz-eleito
    quote: A cerimônia de sagração está prevista para 15 de abril de 2007.
  notes: >-
    Bispo da Diocese Anglicana de Pelotas. "Presidida" pelo primaz = sagrante principal presumido. O SNIEAB de 16/04/2007
    diz que a cerimônia foi presidida pelo primaz (Maurício Andrade, primaz desde 2006) e que a pregação foi de
    Naudal Gomes; a data de 15/04 vem do aviso de janeiro de 2007 (a notícia de 16/04 não repete o dia). Co-sagrantes
    e local não informados; Naudal Gomes foi o pregador.
affiliations:
- jurisdiction: ieab
  role: bishop
  start: '2007'
  end: '2020'
  status: probable
  sources:
  - source: costa2021
    quote: Bispos e Bispas da Igreja Episcopal Anglicana do Brasil … 2007-2020 – Renato da Cruz Raatz
    page: 518-519
  notes: >-
    Anexo C da tese (lista 'Bispos e Bispas da Igreja Episcopal Anglicana do Brasil'). Interpretação: o par de anos
    foi lido como período de exercício episcopal na IEAB (e antecessoras), e não necessariamente o ano de sagração,
    pois o anexo não diz que o primeiro ano é a sagração. Por isso não foi criada afirmação de ordenação. O Anexo
    D dá 2006-2019 em Pelotas.
