biography: >-
  Nascido em 1938, foi ordenado diácono em dezembro de 1961 pelo bispo Egmont Krischke e presbítero em junho de
  1962, no Distrito Missionário do Brasil Central, e foi transferido para a Igreja Episcopal do Brasil em 25 de
  abril de 1965.
