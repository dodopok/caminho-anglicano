biography: >-
  Arcebispo colombiano, nascido em 1949, sagrado em 30/06/1991 por William Carson Thompson e sagrado sob condição
  em 06/05/1993 por William O. Lewis (ACC). Foi bispo da Diocese do Caribe e Nova Granada na ACC (1994–2003), que
  deixou para se unir à Holy Catholic Church Anglican Rite em 2004, e depois arcebispo metropolitano da Província
  Católica de Rito Anglicano da América Latina (IACNG), então vinculada à Igreja Católica de Rito Anglicano (Quakertown,
  EUA). Conduziu o estabelecimento do Movimento Contínuo entre as igrejas latino-americanas; em 2015 emitiu decreto
  elevando Theodoro Oliveira a bispo ordinário no Brasil e firmou acordo de comunhão com a Igreja Anglicana do Brasil.
  Consta também como arcebispo da AECI desde 2011. Participou de quatro sagrações episcopais, entre elas as de James
  Antônio Roque (2013) e Theodoro A. C. de Oliveira (2015).
