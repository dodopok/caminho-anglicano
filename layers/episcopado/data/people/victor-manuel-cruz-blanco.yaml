events:
- type: other
  date: '2015-08-15'
  description: >-
    Decreto de 15/08/2015 da Província Católica de Rito Anglicano de América Latina (Iglesia Anglicana del Caribe
    y la Nueva Granada), assinado por Victor Manuel Cruz Blanco (Barranquilla) e pelo chanceler Enrique Jiménez
    Sarta, que desmembra da diocese do JAPI-Jundiaí/SP o território da 'Diocese Católica Anglicana Santa Mãe de
    Deus' (Votorantim/SP), com Theodoro Oliveira como bispo ordinário do Brasil. A página do site da província diz
    que o decreto elevou Theodoro a bispo ordinário e que 'Brasil ya cuenta con dos diócesis ordinarias y dos obispos
    ordinarios con el obispo James Roque, ordinario de Jundiá'.
  status: probable
  sources:
  - source: cont-pciacng-theodoro
    quote: >-
      La Sede Metropolitana De La Provincia Catolica De Rito Anglicano De America Latina, Elevo Al Obispo Monseñor
      Theodoro Oliveira A Obispo Ordinario De La Diócesis Catolica Anglicana Santa Madre De Dios.
  - source: cont-pciacng-theodoro
    quote: >-
      El Decrero Correspondinte Fue Emirido Por El Arzobispo Metropolitano , Su Gracia Victor Cruz Blanco Y Fue
      Notarizado Por La Curia Metropolitana Con La Firma Del Canciller De La Provincia De America Latina , Obispo
      Enrique Jiménez Sarta.
  - source: cont-pciacng-theodoro
    quote: >-
      Con Esta Nueva Situación Brasil Ya Cuenta Con Dos Diócesis Ordinaria Y Y Dos Obispos Ordinarios Con El Obispo
      James Roque, Ordinario De Jundia, Sao Paulo. Brasil.
- type: other
  date: '2015'
  description: >-
    Acordo de Comunhão e Cooperação entre a 'Igreja Anglicana do Brasil' (bispo Ricardo Lorite de Lima) e a 'Província
    Católica de Rito Anglicano – Iglesia Anglicana del Caribe y la Nueva Granada' (arcebispo metropolitano Victor
    Manuel Cruz Blanco). O site da província intitula a página 'Iglesia Anglicana De Brasil Con Su Obispo Ricardo
    Lorite'.
  status: probable
  sources:
  - source: cont-pciacng-lorite
    quote: Iglesia Anglicana De Brasil Con Su Obispo Ricardo Lorite
  - source: cont-pciacng-viaje
    quote: >-
      Viaje Del Arzobispo Cruz Blanco A Brasil El Nuevo Obispo Theodoro Y La Nueva Diócesis Anglicana Madre De Dios
