events:
- type: other
  date: null
  description: >-
    A SICB relata que Bernardo da Ressurreição foi, por dois anos, bispo de uma 'Igreja Celta com sede na Europa'
    e saiu dela, com seminaristas e padres, por divergir da formação dos seminaristas e da multiplicidade de ritos;
    esse grupo fundou a Igreja Celta do Brasil. A página não nomeia a igreja de origem.
  status: probable
  sources:
  - source: lvc-sicb-faq
    quote: Dom Bernardo da Ressureição foi Bispo de uma Igreja Celta com sede na Europa por dois anos
  - source: lvc-sicb-faq
    quote: >-
      Por não concordar com os rumos desta instituição, especialmente na formação dos seminaristas e na multiplicidade
      de ritos
