# yaml-language-server: $schema=../../schemas/person.json
id: bernardo-da-ressurreicao
name: Bernardo da Ressurreição
aliases:
- Dom Bernardo
- Dom Bernardo da Ressureição
- Dom Bernardo da Ressurreição, O.S.C.
biography: >-
  Arcebispo primaz da Santa Igreja Celta do Brasil (SICB) até abril de 2025, hoje primaz emérito; residente em Feira
  de Santana (BA). Segundo o site da SICB, foi monge cisterciense na década de 1990, tem mestrado em História pela
  UFBA e foi sagrado bispo por Eduardo Quintella, em Belo Horizonte. A SICB diz que ele trouxe a Igreja Celta ao
  Brasil.
sources:
- source: lvc-sicb-emerito
  quote: >-
    Dom Bernardo da Ressurreição, OSC, reside na cidade de Feira de Santana, Estado da Bahia, onde encontra-se o
    Hesicastério Primazial do Brasil
- source: lvc-sicb-emerito
  quote: foi monge da Ordem Cisterciense na década de 90
- source: lvc-sicb-emerito
  quote: Mestrado em História pela Universidade Federal da Bahia
- source: lvc-sicb-sucessao
  quote: Dom Bernardo foi quem trouxe a Santa Igreja Celta para o Brasil.
ordinations:
- order: episcopate
  date: null
  place: Belo Horizonte (MG)
  jurisdiction: null
  principal_consecrator: eduardo-rocha-quintella
  status: probable
  sources:
  - source: lvc-sicb-emerito
    quote: Dom Bernardo foi Sagrado Bispo através de Dom Eduardo Quintella, em Belo Horizonte-MG.
  - source: lvc-sicb-sucessao
    quote: Dom Bernardo recebeu a Sucessão Apostólica através de Dom Eduardo Quintella, em Belo Horizonte.
  notes: >-
    Data, co-sagrantes e jurisdição de origem não são informados pela SICB. A SICB diz ainda que Quintella foi sagrado
    por Emmanuel Milingo, que teria sido sagrado por Paulo VI em 1969. Como Quintella diz ter sido sagrado em 10/09/2011,
    a sagração de Bernardo é posterior a essa data. A SICB afirma que Bernardo foi antes bispo, por dois anos, de
    uma 'Igreja Celta com sede na Europa' (sem nome na página).
