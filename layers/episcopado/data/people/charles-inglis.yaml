biography: >-
  Charles Inglis, nascido em 1734 em Glencolmcille, condado de Donegal (Irlanda), foi sagrado em 1787 como primeiro
  bispo anglicano da América do Norte, para a Diocese da Nova Escócia, da qual se tornou o primeiro bispo em 12
  de agosto de 1787. Morreu em 24 de fevereiro de 1816.
