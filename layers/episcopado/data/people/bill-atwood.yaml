id: bill-atwood
name: Bill Atwood
ordinations:
- order: episcopate
  date: '2007'
  jurisdiction: anglican-church-of-kenya
  office: suffragan
  principal_consecrator: peter-beckwith
  status: probable
  sources:
  - source: iab-poster-linhagem-uchoa
    quote: >-
      162c. Peter Hess Beckwith (1992-2010) que, em 2007, sagrou Bill Atwood como bispo sufragâneo da Diocese de
      All Saints' e, em 2012, sagrou Dom Evilásio Tenório da Silva Júnior como bispo (ver 162c).
  notes: >-
    O pôster põe Beckwith como sagrante principal; na sagração de Atwood no Quênia (2007) o sagrante principal provavelmente
    foi o arcebispo Benjamin Nzimbi — verificar.
