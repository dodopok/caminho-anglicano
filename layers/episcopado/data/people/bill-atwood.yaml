id: bill-atwood
name: Bill Atwood
full_name: William Atwood
aliases:
- Bp. Bill Atwood
- William Atwood
wikidata: Q85515490
biography: >-
  Bill Atwood foi sagrado bispo em 30/08/2007, em Nairóbi, pelo arcebispo Benjamin Nzimbi, da Igreja Anglicana do
  Quênia, junto com William Murdoch. Como cônego e secretário-geral da Ekklesia e da CAPAC, visitou o Recife em
  27 a 29/09/2005 e representou o primaz do Cone Sul na entrega do credenciamento ao bispo Robinson Cavalcanti e
  a 40 clérigos da diocese; em dezembro de 2015 participou do sínodo da Diocese do Recife, em ordenações.
sources:
- source: ta-2007-08-30-kenya
  quote: >-
    William Atwood and William Murdoch were today ordained bishops by Kenya’s Archbishop Benjamin Nzimbi (and, one
    assumes, at least two other bishops).
- source: mg-2007-08-31
  quote: >-
    Bernard Nzimbi, head of the Anglican Church in Kenya, entrenched his anti-gay position by consecrating Anglican
    clerics Bill Atwood and Bill Murdoch as bishops last Thursday in Kenya.
- source: nbc-ap-2007-08-30
  quote: >-
    American Bishops Will Atwood, right, and William Murdoch, left, are ordained at All Saints Cathedral in Nairobi,
    Kenya on Thursday.
- source: drp-convite-bill-2005
  quote: Com o Rev. Côn. BILL ATWOOD, Secretário Geral da Ekklesia e da CAPAC. TERÇA-FEIRA, dia 27/09
- source: drp-convite-bill-2005
  quote: O Rev. Côn. Bill Atwood estará conosco no período de 27 a 29/09/2005.
- source: drp2-carta-venables-2005
  quote: >-
    o Reverendo Cônego Bill Attwood, Secretário Geral da Ekklesia, representando o Primaz do Cone Sul, entregou
    ao Revmo. Bispo Robinson Cavalcanti, e aos 40 clérigos dessa Diocese, cópia do documento de credenciamento
- source: drp-carta-venables-pt-2005
  quote: >-
    Nós, 40 clérigos da Diocese do Recife queremos manifestar a nossa gratidão a V.Revma., por sua decisão de nos
    ter sob a sua autoridade.
- source: aac-2015-recife
  quote: >-
    On Friday, I preached at the Eucharist that opened the Synod and participated in the Ordination, laying hands
    on one of the four Deacons. they also ordained three priests and licensed a number of lay ministers.
- source: iabord-ancora-sinodo-2015
  quote: >-
    Neste mesmo evento o nosso pastor Eric (peruca) foi ordenado Diácono, e o nosso pastor Pedro Muniz foi instituído
    Ministro Local, cerimonia presidida pelos Bispos + Miguel Uchoa, +Evilásio e + Flávio Adair, e Bill Atwood (Acna/Gafcon).
