biography: >-
  Sagrado bispo em 18/11/1621 por George Montaigne, foi bispo de St David's, depois de Bath and Wells (1626) e de
  Londres (1628), e arcebispo de Cantuária de 1633 até morrer, em 10/01/1645.
sources:
