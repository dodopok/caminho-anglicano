      at London House by George of London, John of Worcester, Nicolas of Ely, George of Chichester, John of Oxford,
      and Theophilus of Llandaff;
  notes: >-
    Stubbs (Registrum Sacrum Anglicanum, 1897) segue os registros dos arcebispos (citados no fim de cada verbete)
    e nomeia o sagrante que presidiu primeiro. Os co-sagrantes aparecem só como 'Prenome of Sé'; a identificação
    dos nomes completos foi feita cruzando com os próprios verbetes de Stubbs (quem ocupava a sé na data). Sagrado
    bispo de St David's, junto com Davenant e Carey. Quem presidiu foi George (Montaigne), bispo de Londres, e não
    o arcebispo Abbot. John of Worcester = John Thornborough; Nicolas of Ely = Nicholas Felton; George of Chichester
    = George Carleton; John of Oxford = John Howson; Theophilus of Llandaff = Theophilus Field.
