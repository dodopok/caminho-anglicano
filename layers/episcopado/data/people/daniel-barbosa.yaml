biography: >-
  Daniel Barbosa da Silva foi ordenado diácono em 15 de fevereiro de 2004, na Catedral da Santíssima Trindade (Recife),
  por Robinson Cavalcanti, de quem foi secretário por muitos anos, e em junho de 2004 foi designado coordenador
  dos diáconos permanentes da Diocese do Recife. Integrou os fundadores da Ordem Evangélica de Santo Estevão Mártir
  (OSE), da qual foi prior, e na diocese foi ministro encarregado da Missão Anglicana Comunidade da Paz (Paulista,
  PE), secretário diocesano de Cidadania e de Ação Social e membro do Conselho Diocesano. Em 23 de agosto de 2005
  constou numa lista de clérigos excluídos da IEAB, que declararam manter comunhão com Cavalcanti. Em 2014 deixou
  a diocese com outros clérigos, por discordar da condução do novo bispo, e em 25 de novembro de 2017 ingressou
  na IAOB, que reconheceu suas ordens, como cônego para o Nordeste.
