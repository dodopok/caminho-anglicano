# yaml-language-server: $schema=../../schemas/person.json
id: daniel-barbosa
name: Daniel Barbosa
aliases:
- cônego Daniel Barbosa
- reverendo cônego Daniel Barbosa
biography: >-
  Reverendo, secretário de Robinson Cavalcanti por muitos anos; deixou a IAB em 2014 e ingressou na IAOB em 2017.
sources:
- source: cant-novas-igrejas-2024
  quote: Entre eles, estava o reverendo Daniel Barbosa, que foi secretário de Robinson por muitos anos.
  page: '34'
affiliations:
- jurisdiction: iaob-2013
  role: clergy
  start: '2017-11-25'
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 25 de novembro de 2017, em cerimônia realizada no templo da Igreja Evangélica Pernambucana (Congregacional),
      eles ingressaram na Igreja Anglicana Ortodoxa no Brasil
    page: '34'
  - source: cant-novas-igrejas-2024
    quote: >-
      A partir de então, a Igreja agregou alguns clérigos, como os reverendos Cleiton Nerys, João Malheiros, Calebe
      Malheiros, Samuel Stanley, Helder Marcelino, Frei Amaro e Daniel Barbosa, Conêgo para o Nordeste
    page: '132'
  - source: cant-novas-igrejas-2024
    quote: >-
      a Igreja Anglicana Ortodoxa no Brasil (IAOB), com a Comunidade Anglicana da Paz, com o reverendo cônego Daniel
      Barbosa
    page: '174'
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana Ortodoxa no Brasil (IAOB) [2014]
    page: '172'
  - source: costa2021
    quote: >-
      Em 25 de novembro de 2017, em cerimônia realizada na Igreja Evangélica Congregacional Pernambucana, eles ingressaram
      na Igreja Anglicana Ortodoxa no Brasil
    page: '259'
  notes: >-
    O livro diz que 'alguns deles' vieram da Diocese Anglicana do Recife, ordenados por dom Robinson Cavalcanti,
    sem dizer quais. Local: Comunidade Anglicana da Paz. Sigla escolhida pela coincidência do nome 'Igreja Anglicana
    Ortodoxa no Brasil' com o registro IAOB-2013 da base; ver dúvidas.
- jurisdiction: diocese-anglicana-recife
  role: clergy
  end: '2014'
  end_reason: left
  status: contested
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Na primeira delas, em 2014, um grupo de clérigos se desligou da denominação, por não concordar com a forma
      de condução da Diocese pelo novo bispo. Entre eles, estava o reverendo Daniel Barbosa
    page: '34'
  - source: costa2021
    quote: Entre eles, estava o reverendo Daniel Barbosa, que foi secretário de Robinson por muitos anos.
    page: '259'
  discrepancies:
  - field: end
    value: '2017-11-25'
    sources:
    - source: costa2021
      quote: Entre eles, estava o reverendo Daniel Barbosa, que foi secretário de Robinson por muitos anos.
      page: '259'
  notes: Saiu da igreja de Miguel Uchôa (então em transição para IAB) para a IAOB.
events:
- type: other
  date: '2017-11-25'
  description: >-
    Clérigos saídos da IAB em 2014 (entre eles Daniel Barbosa) ingressam na IAOB, que reconhece suas ordens, em
    cerimônia no templo da Igreja Evangélica Pernambucana (Congregacional).
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 25 de novembro de 2017, em cerimônia realizada no templo da Igreja Evangélica Pernambucana (Congregacional),
      eles ingressaram na Igreja Anglicana Ortodoxa no Brasil e suas ordens foram reconhecidas pelo então Bispo
      Primaz da IAOB, Dom Adolfo Batista Teodoro Júnior.
    page: '34'
- type: other
  date: '1998'
  description: >-
    Filadelfo Oliveira e Robinson Cavalcanti foram membros fundadores da Ordem Evangélica de Santo Estêvão Mártir
    (OSE), fundada em 1998.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Teve como membros fundadores o bispo Robinson Cavalcanti e o então reverendo Filadelfo Oliveira, junto com
      outros clérigos e clérigas, como Daniel Barbosa, Edson Pimentel, Tibério Marques, Gorete Marques, Manoel Moraes,
      Ivaldo Sales, Estevão Menezes, Gustavo Gilson Oliveira
    page: '211'
  - source: costa2021
    quote: Fundada em 1998, a OSE
    page: '211'
- type: other
  date: '2017-11-25'
  description: >-
    Um grupo de clérigos (entre eles Daniel Barbosa, ex-secretário de Robinson) deixou a Igreja de Miguel Uchôa
    e ingressou na Igreja Anglicana Ortodoxa no Brasil, tendo as ordens reconhecidas pelo Primaz Adolfo Batista
    Teodoro Júnior, em cerimônia na Igreja Evangélica Congregacional Pernambucana.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Entre eles, estava o reverendo Daniel Barbosa, que foi secretário de Robinson por muitos anos. Em 25 de novembro
      de 2017, em cerimônia realizada na Igreja Evangélica Congregacional Pernambucana, eles ingressaram na Igreja
      Anglicana Ortodoxa no Brasil
    page: '259'
  - source: costa2021
    quote: e suas ordens foram reconhecidas pelo Bispo Primaz da IAOB, Dom Adolfo Batista Teodoro Júnior.
    page: '259'
