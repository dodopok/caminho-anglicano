  - source: drp2-ord-diac-daniel-fred-2004
    quote: >-
      Ordenação Diaconal de Daniel Barbosa e Fred Souto Catedral Anglicana da Santíssima Trindade Recife – PE 15
      de fevereiro de 2004
  - source: drp2-ord-diac-daniel-fred-2004
    quote: >-
      Esta festa inclui duas ordenações diaconais: uma ao diaconato permanente e outra ao diaconato do clero regular
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti). Daniel Barbosa, prior da OSE, ordenado ao diaconato permanente
    ou regular (o texto fala de 'uma ao diaconato permanente e outra ao diaconato do clero regular', sem dizer qual
    é qual). Prior da Ordem Evangélica de Santo Estevão Mártir (OSE) na ocasião. O sermão não diz qual dos dois
    foi ao diaconato permanente.
