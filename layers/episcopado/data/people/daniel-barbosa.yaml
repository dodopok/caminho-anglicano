- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Daniel Barbosa da Silva
  - source: drv-nota-esclarecimento-2006
    quote: Daniel Barbosa da Silva, ose
  - source: drp-boletim-oracao-2006
    quote: >-
      Orar pela Paróquia Anglicana da Redenção. Pela Ven. Arc. Revda. Gorete, pelos Reverendos: Tibério e Daniel
      Barbosa
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Daniel Barbosa da Silva … Os clérigos não atenderam à convocação
      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Paróquia Anglicana da Redenção. Clérigo citado
    como pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão). Anexo
    R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti,
    ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005 é a da exclusão
    pela IEAB, e a adesão à DAR é anterior, sem data exata.
- jurisdiction: iaob-2013
  role: clergy
  start: '2017-11-25'
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 25 de novembro de 2017, em cerimônia realizada no templo da Igreja Evangélica Pernambucana (Congregacional),
      eles ingressaram na Igreja Anglicana Ortodoxa no Brasil
    page: '34'
  - source: cant-novas-igrejas-2024
    quote: >-
      A partir de então, a Igreja agregou alguns clérigos, como os reverendos Cleiton Nerys, João Malheiros, Calebe
      Malheiros, Samuel Stanley, Helder Marcelino, Frei Amaro e Daniel Barbosa, Conêgo para o Nordeste
    page: '132'
  - source: cant-novas-igrejas-2024
    quote: >-
      a Igreja Anglicana Ortodoxa no Brasil (IAOB), com a Comunidade Anglicana da Paz, com o reverendo cônego Daniel
      Barbosa
    page: '174'
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana Ortodoxa no Brasil (IAOB) [2014]
    page: '172'
  - source: costa2021
    quote: >-
      Em 25 de novembro de 2017, em cerimônia realizada na Igreja Evangélica Congregacional Pernambucana, eles ingressaram
      na Igreja Anglicana Ortodoxa no Brasil
    page: '259'
  notes: >-
    O livro diz que 'alguns deles' vieram da Diocese Anglicana do Recife, ordenados por dom Robinson Cavalcanti,
    sem dizer quais. Local: Comunidade Anglicana da Paz. Sigla escolhida pela coincidência do nome 'Igreja Anglicana
    Ortodoxa no Brasil' com o registro IAOB-2013 da base; ver dúvidas.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Daniel Barbosa da Silva … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
