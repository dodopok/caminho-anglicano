- reverendo cônego Daniel Barbosa
biography: >-
  Reverendo, secretário de Robinson Cavalcanti por muitos anos; deixou a IAB em 2014 e ingressou na IAOB em 2017.
sources:
- source: cant-novas-igrejas-2024
  quote: Entre eles, estava o reverendo Daniel Barbosa, que foi secretário de Robinson por muitos anos.
  page: '34'
ordinations:
- order: diaconate
