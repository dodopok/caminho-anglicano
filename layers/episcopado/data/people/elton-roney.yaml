      Além do Rito de Confirmações, no Culto festivo Eucarístico, o Bispo Instituiu Elton Roney ao Ministério Local.
  notes: >-
    Instituído ao Ministério Local pelo bispo Robinson Cavalcanti em 15/12/2010, na Concatedral Anglicana da Ressurreição
