    Em 15/12/2010, na Concatedral Anglicana da Ressurreição (João Pessoa-PB), o bispo Robinson Cavalcanti confirmou
    43 novos membros num culto unificado das comunidades Concatedral da Ressurreição, Cristo Libertador e Comunhão,
    e instituiu Elton Roney ao Ministério Local.
  status: confirmed
  sources:
  - source: d2s20-elton
    quote: >-
      o Bispo Robinson Cavalcanti confirmou hoje (quarta-feira), 15.12, no Arcediagado PB/RN, 43 (quarenta e três)
      novos membros
  - source: d2s20-elton
    quote: >-
      Além do Rito de Confirmações, no Culto festivo Eucarístico, o Bispo Instituiu Elton Roney ao Ministério Local.
