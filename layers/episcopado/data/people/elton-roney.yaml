# yaml-language-server: $schema=../../schemas/person.json
id: elton-roney
name: Elton Roney
full_name: Elton Roney Carvalho
aliases:
- Elton Carvalho
- Elton Roney Carvalho
biography: >-
  Foi ordenado diácono em 1/5/2013 por Miguel Uchôa, na Diocese Anglicana do Recife, após constar como postulante
  e ministro local.
sources:
- source: dar-2013-ordenacoes-1maio
  quote: >-
    deu-se inicio o Culto de ordenação dos novos 04 Diáconos de nossa Diocese, por ordem: Rev. Elton Roney, Revda.
    Lindiane Meira, Revda Rosemary Gomes e Rev. Valdolírio Junior.
- source: dar-2013-ordenacoes-1maio
  quote: o culto de ordenação Presidido pelo nosso Bispo Diocesano
- source: dar-2013-ordenacoes-1maio
  quote: sermão proferido pelo Nosso Bispo Diocesano, Revmo. Miguel Uchoa
- source: dard1-com-pbrnce-2009a
  quote: 'Ministro Local: Post. Elton Roney'
- source: d2s17-elton-33
  quote: Estou nessa Diocese desde 2005
- source: d2s17-elton-33
  quote: é Postulante e, também, Seminarista do SAT-PB
ordinations:
- order: diaconate
  date: '2013-05-01'
  place: Paraíba (após a Assembleia Arcediagal)
  jurisdiction: diocese-anglicana-recife
  ordained_by: miguel-uchoa
  status: confirmed
  sources:
  - source: dar-2013-ordenacoes-1maio
    quote: >-
      deu-se inicio o Culto de ordenação dos novos 04 Diáconos de nossa Diocese, por ordem: Rev. Elton Roney, Revda.
      Lindiane Meira, Revda Rosemary Gomes e Rev. Valdolírio Junior.
  - source: dar-2013-ordenacoes-1maio
    quote: o culto de ordenação Presidido pelo nosso Bispo Diocesano
  - source: dar-2013-ordenacoes-1maio
