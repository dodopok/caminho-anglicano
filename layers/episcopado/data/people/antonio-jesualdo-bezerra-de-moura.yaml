# yaml-language-server: $schema=../../schemas/person.json
id: antonio-jesualdo-bezerra-de-moura
name: Antônio Jesualdo Bezerra de Moura
full_name: Antônio Jesualdo Bezerra de Moura
aliases:
- Bishop Antonio Jesualdo Bezerra
- Dom Jesualdo
- Jesualdo Moura
- Reverendo Jesualdo
biography: >-
  Bispo ligado à Diocese do Pará (Santa Maria do Pará/Belém). A WAC internacional o lista como bispo da Província
  do Brasil. Uma publicação do perfil Templos Anglicanos Brasil (jun/2026) diz que foi sagrado bispo em 2019 pela
  Igreja Católica Anglicana do Brasil e que a paróquia que fundou em 2015 foi elevada a catedral em 2025.
sources:
- source: lwac-wac-hob
  quote: Bishop Antonio Jesualdo Bezerra Bishop Ecclesiastical Province of Brazil
- source: lwac-ig-templos-para
  quote: >-
    Em 2019, o Reverendo Jesualdo foi sagrado bispo pela Igreja Católica Anglicana do Brasil, assumindo posteriormente
    o cuidado pastoral da Diocese do Pará.
ordinations:
- order: episcopate
  date: '2019'
  jurisdiction: null
  office: diocesan
  status: probable
  sources:
  - source: lwac-ig-templos-para
    quote: >-
      Em 2019, o Reverendo Jesualdo foi sagrado bispo pela Igreja Católica Anglicana do Brasil, assumindo posteriormente
      o cuidado pastoral da Diocese do Pará.
  notes: >-
    Informação de uma página de divulgação de templos anglicanos (fonte secundária, jun/2026). Dia, local e sagrantes
    não informados. A "Igreja Católica Anglicana do Brasil" é uma jurisdição independente, distinta da WAC; a mesma
    publicação ainda a indica como denominação da Catedral Anglicana Divina Misericórdia, em Santa Maria do Pará.
affiliations:
- jurisdiction: wac
  role: bishop
  diocese: wac-br
