    quote: Bishop Antonio Jesualdo Bezerra Bishop Ecclesiastical Province of Brazil
- jurisdiction: wac-br
  role: diocesan_bishop
  diocese: wac-br-pa
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: Dom Antônio Jesualdo Bezerra de Moura, bispo diocesano do Pará
    page: '129'
events:
- type: other
  date: '2025'
  description: >-
    A paróquia fundada em 2015 pelo reverendo Jesualdo Moura em Santa Maria do Pará (Paróquia Anglicana Jesus Misericordioso)
    foi elevada a Catedral Anglicana Divina Misericórdia, sede da Diocese do Pará, em 2025.
  status: probable
  sources:
