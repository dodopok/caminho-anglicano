# yaml-language-server: $schema=../../schemas/person.json
id: marco-antonio-vieira-da-mota
name: Marco Antonio Vieira da Mota
biography: >-
  Marco Antonio Vieira da Mota consta como ordenado diácono por Robinson Cavalcanti, em data não informada, e aparece
  no clero da Diocese Anglicana do Recife em 2002. Em 2004 figurava entre os clérigos aposentados e como ministro
  auxiliar de uma comunidade da diocese.
sources:
- source: rcor-drv-ord-celio-filadelfo
  quote: Marco Antonio, Maurício, Vera, Nadja, Filadelfo e Juciara, meus irmãos e irmãs
- source: rcor-drv-ord-celio-filadelfo
  quote: seu bispo, no exercício apostólico, igualmente os reconhece, e os consagra
- source: rta-ier-clero-2002
  quote: Marco Antonio Vieira da Mota (18/08)
- source: d2s28-clero04
  quote: Clérigos(as) Aposentados (as) - (04) ... Ven. Arcp. Rev. Marco Antonio Vieira da Mota (18/08)
- source: d2s28-comun04
  quote: 'Auxiliares: Rev. Marco Antonio Mota e ML. André Luiz de Souza'
ordinations:
- order: diaconate
  date: null
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-ord-celio-filadelfo
    quote: Marco Antonio, Maurício, Vera, Nadja, Filadelfo e Juciara, meus irmãos e irmãs
  - source: rcor-drv-ord-celio-filadelfo
    quote: seu bispo, no exercício apostólico, igualmente os reconhece, e os consagra
  notes: >-
    Sermão de ordenação (tema: o diaconato, Atos 6-7) pregado pelo bispo diocesano, entendido como Robinson Cavalcanti,
    que se diz o bispo que os 'consagra'. A página não traz data; o diaconato de Filadelfo Oliveira Neto é datado
    de 28/02/1999 por Costa (2021), o que sugere a mesma cerimônia. Identificação de 'Marco Antonio' com Marco Antonio
    Vieira da Mota (diretório do clero de 2002) é provável.
