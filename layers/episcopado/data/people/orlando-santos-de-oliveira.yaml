biography: >-
  Orlando Santos de Oliveira (1945-2023) foi ordenado diácono em fevereiro de 1969 e presbítero em 1970 na Igreja
  Episcopal Anglicana do Brasil (IEAB), e de 1985 a 1997 foi deão da Catedral da Santíssima Trindade, em Porto Alegre.
  Eleito em agosto de 1997 sétimo bispo da Diocese Meridional, foi sagrado em 30 de novembro de 1997 pelo primaz
  Glauco Soares de Lima e foi bispo diocesano de 1998 a 2013. Em 2003 foi bispo interino da Diocese Anglicana de
  Brasília e, a partir de junho, primaz da IEAB, até 2006. Nesse cargo, em março de 2004 desaprovou por carta a
  participação de Robinson Cavalcanti em confirmações em Ohio (EUA) sem autorização do bispo local. Em 26 de novembro
  de 2004 decretou a suspensão do Concílio da Diocese Anglicana do Recife; em fevereiro de 2005 suspendeu preventivamente
  Cavalcanti (Resolução 001/2005) e nomeou Filadelfo Oliveira Neto autoridade eclesiástica da diocese (Resolução
  002/2005); e em 10 de junho de 2005 decretou a deposição de Cavalcanti do ministério ordenado, após o Tribunal
  Superior Eclesiástico reconhecer sua culpabilidade (o ENS indica 17 de junho). A diocese do Recife rejeitou as
  resoluções e a deposição. Em 12 de outubro de 2005 protestou, em carta ao primaz do Cone Sul, Gregory Venables,
  contra o acolhimento do bispo e de clérigos depostos. Em 2007 presidiu o concílio extraordinário que elegeu Renato
  Raatz bispo de Pelotas. Faleceu em 16 de março de 2023. Participou de duas ordenações de diáconos ou presbíteros
  e de três sagrações episcopais, entre elas a de Maurício José Araújo de Andrade, de quem foi sagrante principal,
  e a de Hiroshi Ito.
