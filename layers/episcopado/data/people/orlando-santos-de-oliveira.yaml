      em Porto Alegre, pelo Primaz Glauco Soares de Lima, acompanhado pelos bispos da IEAB, mais o bispo William
      Godfrey, do Uruguai.
  notes: >-
    Eleito em 30/08/1997 como 7o bispo da Diocese Meridional; sucedeu Gastal em 1998. Co-sagrantes brasileiros nao
    nomeados. Wikipedia PT deriva de Costa.
