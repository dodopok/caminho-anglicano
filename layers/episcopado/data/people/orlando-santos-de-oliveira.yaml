    quote: >-
      Foi sagrante o entao Primaz, Bispo Glauco Soares de Lima, e co-sagrantes os bispos do episcopado brasileiro
      da época, mais o bispo William Godfrey, do Uruguai.
  - source: costa2021
    quote: >-
      Já na Diocese Meridional, em 30 de novembro de 1997, Orlando Santos de Oliveira96 foi sagrado na Catedral
