    quote: Primaz da IEAB, Dom Orlando Santos de Oliveira
  notes: >-
    Signatário da carta da Câmara dos Bispos da IEAB ao arcebispo de Cantuária (Brasília, 14/11/2005); data de início
    do cargo não é informada. Citado nesse cargo em documento de 14/11/2005. Data da entronização como primaz (1º
    de junho de 2003), anunciada pelo ACNS em 4 de junho de 2003. Em 20 de maio de 2003 o ACNS já o descrevia como
    bispo da Diocese Meridional, anfitrião da Reunião dos Primazes. Anexo E da tese (primazes da IEAB). A nota 96
    diz Primaz 'de 2003 a 2009'; o texto (p. 107) diz 2003-2006 e Maurício Andrade foi eleito Primaz em julho de
    2006. Versão da nota 96; ver afirmação 2003-2006. Primaz em 2004-2005; decretou a deposição de Robinson em Porto
    Alegre, 10/06/2005. Em exercício como primaz da IEAB quando assinou esta mensagem sobre a confirmação da eleição
    de Gene Robinson (a página não traz data; é posterior à Convenção Geral de 2003 e anterior à captura de agosto
    de 2004). Em exercício em outubro de 2004 (página capturada em 29/10/2004). Eleito bispo primaz da IEAB pelo
    XXIX Sínodo Geral (2003); na ocasião era bispo da Diocese Meridional (Porto Alegre). Atestado como Bispo Primaz
    da IEAB em 10/06/2005, ao assinar o decreto de deposição de Robinson Cavalcanti. Atestado como Bispo Primaz
    da IEAB em março de 2004.
