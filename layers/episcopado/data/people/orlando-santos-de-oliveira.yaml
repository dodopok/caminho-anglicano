- type: other
  date: '2005-06-10'
  description: >-
    Em 10 de junho de 2005, em Porto Alegre, o Bispo Primaz da IEAB, Orlando Santos de Oliveira, na presença da
    Câmara dos Bispos reunida extraordinariamente e com o parecer unânime do Tribunal Superior Eclesiástico, decretou
    a deposição de Edward Robinson de Barros Cavalcanti do exercício do ministério ordenado da IEAB (Processo Canônico
    nº 001/2005). O decreto cita, entre os fatos, a carta de 25/01/2005 em que Robinson declarou a diocese autônoma
    da Comunhão Anglicana; Robinson e a diocese sob sua liderança contestaram a decisão.
  status: confirmed
  sources:
  - source: d2s31-depo
    quote: >-
      o Bispo Primaz decreta, na forma do Capítulo IV, Cânon 4, Artigo 1º, alínea D, dos Cânones Gerais da Igreja
      Episcopal Anglicana do Brasil, a sua deposição do exercício do ministério ordenado desta Igreja.
  - source: d2s31-depo
    quote: Dado e passado sob nosso selo e assinatura, na cidade de Porto Alegre, no dia 10 de junho de 2005
- type: other
  date: '2004-03-16'
  description: >-
    Em 16 de março de 2004, em Porto Alegre, reuniu-se pela primeira vez a Comissão Especial nomeada pelo Primaz
    da IEAB para refletir sobre os sinais de crise na Comunhão Anglicana e seus desdobramentos na IEAB; presidida
    por Dom Jubal Pereira Neves, definiu três eixos: eclesiologia anglicana (Carlos Eduardo Calvani e Joanildo Burity),
    colegialidade (Maurício Andrade e Erika Furukawa) e implicações canônicas da sagração de Gene Robinson (Jubal
    Pereira Neves e Francisco de Assis da Silva).
  status: confirmed
  sources:
  - source: d2s31-comis
    quote: >-
      Reuniu-se na tarde de ontem (16/03/04), em Porto Alegre a Comissão Especial nomeada pelo Primaz da IEAB para
      refletir sobre os sinais de crise na Comunhão Anglicana e, particularmente dos desdobramentos dessa crise
      na IEAB.
  - source: d2s31-comis
    quote: A reunião foi presidida pelo Revmo Bispo Dom Jubal Pereira Neves
  - source: d2s31-comis
    quote: Implicações canônicas (Dom Jubal Pereira Neves e Rev. Francisco de Assis da Silva).
- type: other
  date: '2004-09-16'
  description: >-
    A Câmara dos Bispos da IEAB, reunida extraordinariamente em Porto Alegre sob a presidência do Primaz, decretou
    em 16/09/2004 a supervisão episcopal especial das comunidades e clérigos da Diocese Anglicana do Recife que,
    segundo o decreto, se sentiam pastoralmente desassistidos pelo bispo diocesano, e nomeou o bispo diocesano de
    Brasília, Maurício Andrade, supervisor episcopal especial; o bispo sufragâneo Filadelfo Oliveira continuava
    seu ministério junto às comunidades da diocese. O decreto cita pedido de clérigos e do bispo sufragâneo. Segundo
    nota jurídica publicada no portal da IEAB, Robinson Cavalcanti, bispo diocesano, declarou não reconhecer a validade
    da decisão por falta de amparo canônico e por entender a DAR como diocese autônoma.
  status: confirmed
  sources:
  - source: d2s32-decreto-camara
    quote: >-
      Decretar a supervisão episcopal especial das comunidades e clérigos e clérigas da Diocese Anglicana do Recife
      que se sentem pastoralmente desassistidos por seu Bispo diocesano
  - source: d2s32-decreto-camara
    quote: >-
      A Câmara dos Bispos, reunida extraordinariamente na cidade de Porto Alegre, sob a Presidência do Bispo Primaz,
      diante da solicitação de clérigos e clérigas da Diocese Anglicana do Recife, e de seu Bispo Sufragâneo
  - source: d2s32-esclarecimento
    quote: >-
      A Câmara dos Bispos acolheu a solicitação do Bispo Sufragâneo, de 14 clérigos, 9 paróquias e 6 missões, todos
      evangélicos, para uma supervisão alternativa
  - source: d2s32-verdade-canonica
    quote: >-
      Após ser cientificado da decisão, o Bispo Diocesano, Dom Robinson Cavalcanti, expressou não reconhecer a sua
      validade, "por falta de amparo canônico" e sob a alegação de que "a DAR é uma Diocese autônoma"
- type: other
  date: '2004-11-26'
  description: >-
    Decreto Episcopal nº 001/2004 do Primaz da IEAB (Porto Alegre, 26/11/2004), aprovado pelo Conselho Executivo
    do Sínodo com assessoria da Comissão de Constituição e Cânones, suspendeu a realização do Concílio Diocesano
    da Diocese Anglicana do Recife, convocado para 2 a 4 de dezembro de 2004, enquanto durassem os conflitos que
    motivaram a supervisão episcopal especial; declarou ato de insubordinação grave a não observância da determinação
    e nulos perante a IEAB os atos contrários. O decreto cita a recusa do bispo diocesano em acatar o decreto de
    supervisão de 16/09/2004.
  status: confirmed
  sources:
  - source: d2s32-decreto-episcopal
    quote: >-
      Determinar a suspensão da realização do Concílio Diocesano da Diocese Anglicana do Recife, convocado para
      os dias 02, 03 e 04 de dezembro de 2004, enquanto perdurarem os conflitos pastorais ensejadores da medida
      especial de Supervisão Episcopal.
  - source: d2s32-decreto-episcopal
    quote: >-
      o Conselho Executivo do Sínodo, com a assessoria da Comissão de Constituição e Cânones Provincial, aprovou
      as medidas tomadas através do seguinte Decreto do Primaz
- type: other
  date: '2004-12-14'
  description: >-
    Em carta de 14/12/2004 ao Arcebispo de Cantuária e aos Primazes da Comunhão Anglicana, o Primaz da IEAB relatou
    ter recebido cópia de carta do bispo Robinson Cavalcanti pedindo para ser recebido com sua diocese em outra
    jurisdição eclesiástica que não a Província do Brasil, e informou que, após denúncia assinada por dois bispos,
    dois clérigos e dois leigos, fora instaurado processo disciplinar contra Robinson. A carta expressa a posição
    da IEAB.
  status: confirmed
  sources:
  - source: d2s32-carta-cantuaria
    quote: >-
      solicitando ser recebido juntamente com sua diocese em uma outra jurisdição eclesiástica que não a Província
      da Igreja Episcopal Anglicana do Brasil
  - source: d2s32-carta-cantuaria
    quote: >-
      Diante de denúncia apresentada, assinada, por dois bispos, dois clérigos e dois leigos, seguindo os trâmites
      legais, instaurou-se processo disciplinar contra Dom Robinson.
- type: other
  date: '2005-06-10'
  description: >-
    O Primaz da IEAB, Orlando Santos de Oliveira, decretou em 10/06/2005, na presença da Câmara dos Bispos reunida
    extraordinariamente em Porto Alegre (Processo Canônico nº 001/2005), a deposição do bispo Edward Robinson de
    Barros Cavalcanti do exercício do ministério ordenado da IEAB, após denúncia do Procurador Eclesiástico e parecer
    unânime do Tribunal Superior Eclesiástico; o decreto cita, entre os fundamentos, carta de 25/01/2005 declarando
    a Diocese Anglicana do Recife autônoma, a realização do concílio diocesano de dezembro de 2004 e a participação
    em confirmações em Ohio em março de 2004. Posição da IEAB; a posição de Robinson Cavalcanti sobre o decreto
    não consta da fonte.
  status: confirmed
  sources:
  - source: d2s32-robinson-deposto
    quote: >-
      o Bispo Primaz decreta, na forma do Capítulo IV, Cânon 4, Artigo 1º, alínea D, dos Cânones Gerais da Igreja
      Episcopal Anglicana do Brasil, a sua deposição do exercício do ministério ordenado desta Igreja
  - source: d2s32-robinson-deposto
    quote: >-
      na presença da Câmara dos Bispos reunida extraordinariamente na cidade de Porto Alegre, no dia 10 de junho
      do ano de dois mil e cinco
  - source: d2s32-robinson-deposto
    quote: >-
      o Tribunal Superior Eclesiástico, por unanimidade de seus membros, reconhece a culpabilidade do Bispo Dom
      Edward Robinson de Barros Cavalcanti
- type: other
  date: 2005-09
  description: >-
    Em setembro de 2005, segundo o portal da IEAB, o Primaz da Nigéria, Peter Akinola, comunicou por carta ao Primaz
    do Brasil que a IEAB não era mais bem-vinda ao III Encontro Anglicano do Sul Global, citando declarações do
    bispo Jubal Neves em relatório ao concílio diocesano e afirmando que a deposição de Robinson Cavalcanti fora
    precipitada. O Primaz Orlando Santos de Oliveira respondeu, com cópia ao Arcebispo de Cantuária, que a IEAB
    era discriminada pela organização do encontro e que Robinson Cavalcanti fora deposto por problemas disciplinares,
    éticos e morais.
  status: confirmed
  sources:
  - source: d2s32-akinola
    quote: a IEAB foi notificada de que não é mais bem-vinda ao III Encontro Anglicano do Sul Global
  - source: d2s32-akinola
    quote: Akinola, afirmou que a deposição de Robinson Cavalcanti foi precipitada
  - source: d2s32-akinola
    quote: Bispo Cavalcanti foi deposto por problemas disciplinares, éticos e morais.
- type: other
  date: 2005-10
  description: >-
    Segundo artigo de Jaci Maraschin publicado no portal da IEAB (05/10/2005), o primaz do Cone Sul acolheu o ex-bispo
    Robinson Cavalcanti e, de uma só vez, o clero deposto da Diocese do Recife. A Declaração do Panamá (outubro
    de 2005), de bispos latino-americanos incluindo o Primaz do Brasil, lamentou a recepção e o reconhecimento,
    pelo primaz do Cone Sul, do bispo e dos clérigos depostos da diocese do Recife, e expressou a esperança de plena
    reconciliação com o Cone Sul. A perspectiva é a dos autores IEAB.
  status: probable
  sources:
  - source: d2s32-jaci
    quote: O primaz do Cone Sul (sediado na Argentina) acaba de acolher o ex-bispo
  - source: d2s32-jaci
    quote: Recebeu também, de uma só vez, todo o clero deposto da Diocese de Recife
  - source: d2s32-panama
    quote: >-
      a recepção e reconhecimento do bispo e clérigos depostos, procedentes da diocese do Recife, por parte do bispo
      primaz da Província do Cone Sul da América
- type: other
  date: 2005-10
  description: >-
    Declaração do Panamá (outubro de 2005): bispos latino-americanos reunidos durante o Congresso Anglicano de Teologia,
    entre eles os do Brasil (Orlando Santos de Oliveira, Jubal Neves, Naudal Gomes, Sebastião Gameleira, Filadelfo
    de Oliveira e Maurício Andrade), comprometeram-se a retomar o Conselho Anglicano Latino-Americano (CALA), propuseram
    uma tendência de "Centro Global" entre o Norte e o Sul Global e confiaram aos primazes do México, Brasil e IARCA
    e ao presidente da IX Província da Igreja Episcopal a coordenação dos esforços; lamentaram a exclusão da Província
    do Brasil da Conferência Sul Global.
  status: confirmed
  sources:
  - source: d2s32-panama
    quote: >-
      Como bispos latino-americanos, nos comprometemos a retomar o Conselho Anglicano Latino-Americano (CALA)
  - source: d2s32-panama
    quote: >-
      Os primazes do México, Brasil e IARCA, e o presidente da IX Província da Igreja Episcopal, coordenarão os
      esforços e os mecanismos necessários para que o CALA possa dar início às suas atividades
  - source: d2s32-panama
    quote: >-
      lamentamos a exclusão forçada da Província do Brasil da Conferência Sul Global, a ser realizada no Egito
