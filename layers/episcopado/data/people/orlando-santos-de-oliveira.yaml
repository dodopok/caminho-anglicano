    XXIX Sínodo Geral da IEAB: criação da Diocese Missionária de Curitiba e eleição de seu primeiro bispo, Naudal
    Alves Gomes; eleição de Maurício José Araújo de Andrade como bispo da Diocese Missionária de Brasília; eleição
    de Orlando Santos de Oliveira como bispo primaz; eleição de Cristina Winnishofer como secretária-geral; decisão
    de convocar um sínodo extraordinário para reformas canônicas, inclusive adequação ao novo Código Civil.
