    quote: >-
      The Primate of Brazil, the Most Rev. Orlando de Oliveira, and a House of Bishops' committee deposed Robinson
      Cavalcanti for contumacy (resistance to authority) June 17, directing his suffragan, the Rt. Rev. Filadelfo
      Oliveira Neto, to assume ecclesiastical authority for the diocese.
- type: other
