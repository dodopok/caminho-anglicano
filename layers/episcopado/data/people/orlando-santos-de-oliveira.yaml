  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      Como consequência do contínuo enfrentamento às decisões da Câmara Episcopal, em 10 de junho de 2005, Edward
      Robinson de Barros Cavalcanti foi deposto de todos os seus cargos na Igreja Episcopal Anglicana do Brasil
  - source: costa2021
    quote: >-
      Tendo em vista os fatos articulados acima, e que o Tribunal Superior Eclesiástico, por unanimidade de seus
      membros, reconhece a culpabilidade do Bispo Dom Edward Robinson de Barros Cavalcanti, o Bispo Primaz decreta
  - source: ptwp-dar
    quote: >-
      Apesar de constituir ato raro e extremo, o bispo foi expulso da IEAB em 10 de junho de 2005 pelo Tribunal
      Superior Eclesiástico.
  - source: ens-102306-1-a
    quote: was elected as bishop of Recife to replace Robinson Cavalcanti, who was deposed on June 10, 2005.
  - source: ens-040908-04
    quote: >-
      As it is known by all the Anglican Communion, Mr. Cavalcanti was deposed through a lawful and canonical process
      due to his breaking of ordination vows.
- type: other
  date: '2005-06-17'
  description: >-
    Versao divergente da data da deposicao: o ENS (citando ACNS) diz que o primaz e um comite da Camara dos Bispos
    depuseram Robinson Cavalcanti "por contumacia" em 17 de junho [2005], determinando que o sufraganeo Filadelfo
    Oliveira Neto assumisse a autoridade eclesiastica.
  status: contested
  sources:
