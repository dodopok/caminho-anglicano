  - source: d2s32-noticias-p13
    quote: XXIX Sínodo da IEAB criou Departamento de Informática
- type: other
  date: '2004-03-16'
  description: >-
    Em 16/03/2004 o Primaz da IEAB nomeou, a pedido da Câmara dos Bispos, uma Comissão Especial (assessoria e recomendação
    ao Primaz e à Câmara dos Bispos, sem poder de decisão), com ênfase em eclesiologia, colegialidade e implicações
    canônicas; presidida por Jubal Pereira Neves e composta pelos bispos Jubal Neves e Maurício Andrade, pelos presbíteros
    Francisco de Assis da Silva e Carlos Eduardo Brandão Calvani e por dois leigos (Joanildo Burity e Érica Furukawa).
  status: confirmed
  sources:
  - source: d2s32-carta-esclarecimento
    quote: >-
      Desde a nomeação e início do trabalho, em 16 de março de 2004, da Comissão Especial da IEAB, nomeada pelo
      Bispo Primaz, a pedido da Câmara dos Bispos
  - source: d2s32-carta-esclarecimento
    quote: >-
      a Comissão não tem nenhum mandato de decisão, mas tão somente de assessoria e recomendação ao Bispo Primaz
      e à Câmara dos Bispos
  - source: d2s32-carta-esclarecimento
    quote: 'com ênfase em três eixos: eclesiologia, colegialidade e implicações canônicas'
- type: other
  date: 2004-03
  description: >-
    Carta do Primaz da IEAB ao Bispo Presidente da Igreja Episcopal dos EUA, Frank Griswold, lamentando a participação
    do bispo Robinson Cavalcanti, bispo diocesano do Recife, em ofício de confirmação de 110 pessoas em Ohio, com
    cinco bispos aposentados da ECUSA, sem permissão do bispo diocesano local; a carta afirma que Robinson não representou
    oficialmente a Província e informa que o assunto seria examinado na reunião da Câmara dos Bispos de 22 e 23
    de março de 2004. Posição oficial da IEAB.
  status: confirmed
  sources:
  - source: d2s32-carta-ecusa
    quote: >-
      em um Ofício de Confirmação de 110 pessoas em Ohio, juntamente com cinco Bispos aposentados da ECUSA, sem
      a permissão do Bispo Diocesano
  - source: d2s32-carta-ecusa
    quote: >-
      Bispo Cavalcanti, neste ato e em qualquer outro durante sua presença nos USA, não representou oficialmente
      a Província Anglicana da Igreja Episcopal Anglicana do Brasil.
  - source: d2s32-carta-ecusa
    quote: >-
      tal assunto será examinado em nossa próxima reunião da Câmara dos Bispos, em 22 e 23 de março de 2004
- type: other
  date: '2004-07-15'
  description: >-
    I Simpósio de Teologia Anglicana (julho de 2004), sobre o conceito de Inclusividade: em 15/07/2004 foi prestada
    homenagem ao Rev. Dr. Jaci Maraschin pelos 50 anos de ministério ordenado; em 16/07/2004 a Comissão de Sistematização
    (revs. Ramacés Hartwig, Elias Vergara e Jorge Aquino, com a inclusão de Eduardo Grillo e Gustavo Gilson) apresentou
    a versão inicial do documento final, e o Primaz concedeu entrevista a emissora de TV local.
  status: confirmed
  sources:
  - source: d2s32-simposio
    quote: >-
      As atividades do dia encerraram com uma homenagem ao Rev. Dr. Jaci Maraschin, por ocasião dos seus 50 anos
      de ministério ordenado.
  - source: d2s32-simposio
    quote: a Comissão de Sistematização, formada pelos reverendos Ramacés Hartwig, Elias Vergara e Jorge Aquino
  - source: d2s32-simposio
    quote: >-
      decidiu-se pela inclusão de mais dois integrantes, Rev. Eduardo Grillo e Rev. Gustavo Gilson, para auxiliar
      no trabalho de redação
