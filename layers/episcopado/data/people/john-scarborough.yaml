id: john-scarborough
name: John Scarborough
full_name: John Scarborough
aliases:
- Bp. Scarborough
wikidata: Q6256840
biography: >-
  Sagrado bispo em 2 de fevereiro de 1875, em Burlington (Nova Jersey), por Horatio Potter, com William Bacon Stevens
  e John Barrett Kerfoot entre os sagrantes, e atuou como bispo de Nova Jersey na Igreja Episcopal dos Estados Unidos.
  Impôs as mãos na sagração de Kinsolving.
sources:
- source: perry-1895
  quote: >-
    His consecration took place in St. Mary's, Burlington, N. J., Feb. 2, 1875. His consecrators were Bishops H.
    Potter, Stevens, Kerfoot, Littlejohn, Doane, M. A. De Wolfe Howe, and Paddock.
- source: wp-en-histlist
