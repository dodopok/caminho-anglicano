id: fabio-antonio-de-oliveira-rego
name: Fábio Antônio de Oliveira Rêgo
aliases:
- Rev. Fábio Rêgo
biography: >-
  Fábio Antônio de Oliveira Rêgo foi ordenado diácono em 16/6/2007 por Robinson Cavalcanti, na Catedral Anglicana
  do Bom Samaritano, em Recife, e presbítero em 12/4/2008, em Caruaru (PE), também por Robinson Cavalcanti, na Diocese
  Anglicana do Recife. É pároco da Paróquia Anglicana do Advento, em Caruaru, no Arcediagado Centro, e membro da
  Comissão de Liturgia e Música. Em 2014 a paróquia tinha pontos missionários em Caruaru (Cristo Rei) e em São Caetano.
sources:
- source: drp2-ord-diac-2007-06-16
  quote: 'Sermão de Ordenação Diaconal de: Dinamérico Wanderley, Fábio Rego, João Peixoto e Ricardo Melo'
- source: drp2-ord-diac-2007-06-16
  quote: >-
    Dom Robinson Cavalcanti, ose Bispo Diocesano Catedral Anglicana do Bom Samaritano Recife (PE), 16 de junho de
    2007.
- source: dar-2008-sermao-fabio
  quote: >-
    Sermão da Ordenação Presbiteral do Rev. Fábio Antônio de Oliveira Rêgo Salão de Festas Grupo Familiar Shalom
    Caruaru (PE), 12 de abril de 2008.
- source: drp2-novas-ordenacoes-2008-1sem
  quote: >-
    A Diocese do Recife agradece ao Senhor pelas novas Ordenações e a abertura de novos trabalhos ocorridos no primeiro
