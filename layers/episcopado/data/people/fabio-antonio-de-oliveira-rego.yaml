id: fabio-antonio-de-oliveira-rego
name: Fábio Antônio de Oliveira Rêgo
aliases:
- Rev. Fábio Rêgo
biography: >-
  Ordenado diácono em 16/06/2007 por Robinson Cavalcanti, na Catedral Anglicana do Bom Samaritano (Recife), e presbítero
  em 12/04/2008, em Caruaru (PE), na Diocese Anglicana do Recife. É pároco da Paróquia Anglicana do Advento, em
  Caruaru, no Arcediagado Centro, e membro da Comissão de Liturgia e Música.
