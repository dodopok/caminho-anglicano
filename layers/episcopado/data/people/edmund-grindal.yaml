biography: >-
  Edmund Grindal foi sagrado em 21/12/1559 em Lambeth, pelo arcebispo Matthew Parker, e tornou-se bispo de Londres.
  Foi transferido para o arcebispado de York em 1570 e para o de Cantuária em 1576, onde permaneceu até morrer,
  em 6/7/1583.
