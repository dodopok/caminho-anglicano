name: Martin Samuel Firth
events:
- type: other
  date: '1936'
  description: >-
    Assinou o memorial aprovado pelo concílio de 1936 pedindo um bispo sufragâneo escolhido segundo a vontade dos
    brasileiros
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Os brasileiros, entretanto, não estavam dispostos a deixar o assunto morrer e voltaram ao tema de 1936. O
