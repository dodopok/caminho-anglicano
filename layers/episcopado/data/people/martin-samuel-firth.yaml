    quote: >-
      Este segundo memorial foi assinado pelos reverendos George Upton Krischke, Orlando Batista, Athalício Theodoro
      Pithan e Martin Samuel Firth. Destes, três haviam assinado o memorial de 1934.
    page: '189'
