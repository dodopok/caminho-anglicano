biography: >-
  Albino Alfredo Winkler, nascido no Rio Grande do Sul em 15/06/1912, foi ordenado diácono em dezembro de 1941 e
  presbítero em fevereiro de 1943 por William M. M. Thomas, e consta como clérigo do Distrito Missionário do Sul
  do Brasil, em Porto Alegre.
