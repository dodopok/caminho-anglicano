# yaml-language-server: $schema=../../schemas/person.json
id: magna-barbosa
name: Magna Barbosa
biography: >-
  Ministra local do Ponto Missionário Anglicano em Maceió (AL), primeira a receber o título de Ministra Local Honorária
  da Diocese do Recife, em maio de 2012.
sources:
- source: darn2-ministra-honoraria-2012
  quote: está sendo a primeira Ministra Local a receber o título de Ministra Local Honorária
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: ministro local
  status: confirmed
  sources:
  - source: darn2-ministra-honoraria-2012
    quote: >-
      Ministra Local do Ponto Missionário Anglicano em Maceió que, sendo homenageada, está sendo a primeira Ministra
      Local a receber o título de Ministra Local Honorária
  - source: darn2-maceio-visita-2012
    quote: Ponto Missionário Anglicano em Maceió ( ML. Magna Barbosa )
  notes: >-
    Local: Ponto Missionário Anglicano em Maceió, AL. Ministra Local do ponto missionário em Maceió em maio de 2012;
    recebe em 27/05/2012 o título de Ministra Local Honorária, o primeiro concedido na diocese, em reconhecimento
    a quase quinze anos de serviço como secretária episcopal e diocesana.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: secretaria_diocesana_maceio
  status: confirmed
  sources:
  - source: darl3-setubal
    quote: Sem. Magna Barbosa – Secretária Diocesana (Maceió)
  notes: >-
    Local: Maceió. Listada entre os observadores do Concílio Diocesano Extraordinário de 26/02/2005, como seminarista
    (Sem.) e Secretária Diocesana (Maceió). Em exercício em fev/2005.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: secretária diocesana episcopal
  status: confirmed
  sources:
  - source: d2s03-hom-secretarios
    quote: Magna Barbosa Secretária Diocesana Episcopal e
  - source: d2s02-peregrinacao-50anos
    quote: Magna Barbosa , Secretária Diocesana
  notes: >-
    Assina a mensagem dos secretários de 05/10/2010; o relato da peregrinação de 21/04/2010 também a chama de Secretária
    Diocesana. Não é clériga nos textos.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: secretária diocesana de comunicação social (nacional)
  status: confirmed
  sources:
