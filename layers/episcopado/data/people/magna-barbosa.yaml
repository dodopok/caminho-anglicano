# yaml-language-server: $schema=../../schemas/person.json
id: magna-barbosa
name: Magna Barbosa
biography: >-
  Magna Barbosa dos Santos, seminarista, foi ministra local do Ponto Missionário Anglicano em Maceió (AL), na Diocese
  Anglicana do Recife (DAR), e a primeira ministra local a receber o título de Ministra Local Honorária, em maio
  de 2012. Atuou como secretária diocesana, em Maceió, e como secretária episcopal diocesana. Em 2011 constava como
  secretária diocesana de Comunicação Social (nacional) e como secretária de atas do Concílio Diocesano.
sources:
