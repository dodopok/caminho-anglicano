    quote: 'celebração da Ordenação Presbiteral dos Reverendos: Michael La Cagnina e Henry Morris'
  notes: >-
    Ordinal clássico anglicano; pregador Rev. Christopher Leighton; presente o arcediago para os EUA, Duncan Clark.
    Cerimônia com liturgia do Ordinal clássico do anglicanismo, na sede da Igreja Vineyard; pregador: Rev. Christopher
    Leighton (St. Paul, Darien, Connecticut). Estiveram presentes o arcediago Duncan Clark, o presidente do Conselho
    Diocesano, Rev. Maurício Coelho, e o representante da rede da Comunhão Anglicana, Rev. James McCaslin. O ano
    de 2007 vem da agenda de Breves Episcopais 12 (viagem de 15 a 23/07).
