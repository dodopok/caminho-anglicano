# yaml-language-server: $schema=../../schemas/person.json
id: michael-la-cagnina
name: Michael La Cagnina
aliases:
- Michael LaCagnina
biography: >-
  Ordenado diácono em 8 de dezembro de 2006, em Conde (PB), a primeira ordenação diaconal para o Arcediagado Norte-Americano,
  e presbítero em 21 de julho de 2007, ambas por Robinson Cavalcanti, na Diocese Anglicana do Recife. Foi ministro
  encarregado da Missão Anglicana do Cristo, em High Springs (Flórida).
sources:
- source: dar-2006-convite-diaconal
  quote: >-
    convida V.Sa. para o Culto Solene de Ordenação Diaconal dos Candidatos : José Roseno da Silva Irmão Keyla Maria
    Pereira Camargo Maria do Carmo Farias Brito Michael La Cagnina Local: Chácara Porta da Fonte  Município de Conde-PB
    Data: 08 de dezembro de 2006
- source: drp2-ord-diac-xxvi-concilio-2006
  quote: >-
    às Ordenações Diaconais de: Roseno, Keyla, Maria do Carmo e Michael. E um momento histórico, quando estamos
    procedendo à Ordenação Diaconal de Michael, a primeira para o nosso Arcediagado Norte-americano.
- source: drp2-breves-16-2007
  quote: >-
    tivemos no último sábado, dia 21 de julho, a Ordenação ao Presbiterado dos Reverendos: Michael L. La Cagnina,
    Ministro Encarregado da Missão Anglicana do Cristo, em High Springs, Fla, e Henry M. Morris, auxiliar na Paróquia
    St. Charles, em Poulsbo, Estado de Washington. Tendo como Ordenante o Bispo da Diocese do Recife, Dom Robinson
    Cavalcanti
- source: drp2-breves-16-2007
  quote: Michael L. La Cagnina, Ministro Encarregado da Missão Anglicana do Cristo, em High Springs, Fla
