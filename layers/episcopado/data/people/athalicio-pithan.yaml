biography: >-
  Bispo ligado ao Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Santa
  Maria, RGS, Brasil (1898-09-20). Sagrado em 1940-04-21. Transferido para a Igreja Episcopal do Brasil em 25/04/1965
  (Clerical Directory 1968).
