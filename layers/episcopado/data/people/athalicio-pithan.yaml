biography: >-
  Primeiro bispo nascido no Brasil; reitor em Bagé, eleito sufragâneo do Sul do Brasil em 1939, sagrado em 21/04/1940;
  bispo do Sul do Brasil após a divisão de 1949; aposentou-se por doença em 1955.
