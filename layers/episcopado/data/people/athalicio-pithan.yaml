  - source: rtb-revjbs-pithan
    quote: >-
      Em 1924 foi ordenado diácono pelo Bispo Kinsolving. Serviu mais dois anos no Cruzeiro e foi elevado ao presbiterado
      pelo Bispo Thomas
  - source: ieablac-cd1950
    quote: D—Oct., 1924, Bp. L. L. Kinsolving ; P— Apr., 1926, Bp. W. M. M. Thomas.
  - source: ieablac-cd1953
    quote: D—Oct., 1924, Bp. L. L. Kinsolving ; P— cae 1926, Bp. W. M. M. Thomas.
  - source: ieablac-cd1956
    quote: D—Oct., 1924, Bp. Lae Kinsolving ; P— Apr., 1926, Bp. W. M. M. Thomas;
  - source: costa2021
    quote: sendo ordenado ao diaconato em 1924 e, dois anos depois, ao presbiterato pelo bispo Kinsolving.
    page: '69'
  discrepancies:
  - field: ordained_by
    value: lucien-lee-kinsolving
    sources:
    - source: costa2021
      quote: sendo ordenado ao diaconato em 1924 e, dois anos depois, ao presbiterato pelo bispo Kinsolving.
      page: '69'
  notes: >-
    Ordenante no diretório conforme o verbete. Biografia do Santoral (dados extraídos de Marçal Lopes de Oliveira,
    Dados Biográficos do clero da Igreja Episcopal do Brasil, 1988) atribui o diaconato (1924) a Kinsolving e o
    presbiterato a Thomas, o que coincide com os diretórios clericais americanos e diverge de Costa (2021), que
    cita apenas Kinsolving. CONFLITO com a base, que dá Lucien Lee Kinsolving como ordenante do presbiterato (1926).
    Os três diretórios (1950, 1953, 1956) trazem Thomas para o presbiterato e Kinsolving só para o diaconato. As
    três edições não são independentes entre si (mesma coleta de dados). Ver duvidas.
- order: episcopate
  date: '1940-04-21'
  place: Catedral da Santíssima Trindade, Porto Alegre
  jurisdiction: dmsb
  office: suffragan
  principal_consecrator: william-matthews-merrick-thomas
  co_consecrators:
  - efrain-salinas-y-velasco
  - hugo-blankingship
  status: confirmed
  sources:
  - source: cd1965
    quote: Con Suffr Bp of SBra 21 Apr 40.
  - source: wit-1940-04-18
    quote: >-
      The climax of the celebration will be the consecration on April 21 of the Rev. A. T. Pithan, suffragan- bishop-elect,
      with Bishop Thomas as consecrator, and the Bishops of Cuba and Mexico as co-consecrators.
  - source: wp-en-histlist
    quote: '[[William M. M. Thomas|348]] [[Efraín Salinas|380]] [[Hugo Blankingship|415]]'
  - source: calvani-2005
    quote: O primeiro bispo brasileiro (Athalicio Theodoro Pithan) só foi sagrado em 1940
  - source: kickhofel
    quote: '1940 - Primeiro bispo brasileiro: Athalício Theodoro Pithan. Ano do Jubileu.'
  - source: ieab-sobre
    quote: >-
      Mas o primeiro bispo brasileiro só veio em 1940, com a sagração do revmo. Athalício Theodoro Pithan como bispo
      sufragâneo, quando a Igreja Episcopal completou 50 anos de atividades no Brasil.
  - source: lc-1940-05-08
    quote: >-
      Cable advices from Porto Alegre, Brazil, informed the Pre- siding Bishop that the consecration of the Rt.
      Rev. Athalicio T. Pithan, D.D., as Suffragan Bishop of Southern Brazil, took place as scheduled, April 21st
  - source: lc-1940-05-08
    quote: >-
      Bishop Thomas of Southern Brazil was consecrator, assisted by Bishop Blankingship of Cuba, and Bishop Sali-
      nas of Mexico, who was also the con- secration preacher.
  - source: rtb-revjbs-pithan
    quote: >-
      Eleito para o Episcopado Sufragâneo, foi solenemente sagrado Bispo no dia 21 de abril de 1940, no mesmo dia
      da chegada dos dois primeiros missionários 50 anos atrás. À solenidade, além do Bispo Thomas, tomaram parte
      também os Bispos Hugo Blankingship, de Cuba, e Efrain Salinas Y Velasco do México, que foi o pregador.
  - source: kickhofel-1995
    quote: >-
      O motivo foi o atraso do avião que trazia os bispos Alexander Hugo Blankingship, de Cuba, e Efrayn Salinas
      y Velasco, do México. A sagração estava marcada para às 9 horas do dia 21 de abril de 1940, na Catedral da
      SS.Trindade.
    page: '191'
  - source: kickhofel-1995
    quote: >-
      Não houve outra alternativa senão correr para a igreja, onde a congregação aguardava pacientemente, vestir
      os paramentos litúrgicos e dar início à cerimônia, a primeira no gênero realizada no Brasil, que só terminou
      às 15h30min.
    page: '192'
  - source: iab-poster-linhagem-meira
    quote: >-
      Em 1940, Athalício Theodoro Pithan foi consagrado como o primeiro bispo brasileiro, marcando a transição para
      uma liderança nacional.
  - source: costa2021
    quote: >-
      Assim, no dia 21 de abril de 1940, ano em que a Igreja Episcopal dos Estados Unidos celebrava seus 50 anos
      de missão no país, Athalício Theodoro Pithan 54 foi sagrado na Catedral da Santíssima Trindade, em Porto Alegre,
      tornando-se o primeiro bispo brasileiro da Comunhão Anglicana.
    page: '69'
  - source: costa2021
    quote: >-
      O motivo foi o atraso do avião que trazia os bispos Alexander Hugo Blankingship, de Cuba, e Efrayn Salinas
      y Velasco, do México.
    page: '69'
  notes: >-
    Sagração: 'Suffr Bp of SBra' no verbete. O diretório não nomeia sagrante nem local. Anúncio (Witness 18/04/1940)
    e relato pós-evento (Living Church 08/05/1940: 'took place as scheduled, April 21st') concordam. Salinas também
    foi o pregador. Confirma data, sagrante principal (Thomas) e os dois bispos que participaram; o texto não usa
    a palavra 'co-sagrante'. Primeira sagração episcopal realizada no Brasil (Kickhöfel, 1995, p. 192). O avião
    com Blankingship e Salinas y Velasco só pousou às 11h30; à noite pregou o bispo de Cuba. Trecho citado pela
    tese de KICKHÖFEL, Notas para uma História da IEAB (1995), pp. 191-192. A tese não nomeia o sagrante principal;
    Blankingship e Salinas y Velasco são os bispos cuja chegada era necessária para a cerimônia (listados como co-sagrantes
    por inferência). O bispo Thomas presidiu o culto do dia.
