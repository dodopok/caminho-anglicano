ordinations:
- order: diaconate
  date: 1924-10
  jurisdiction: dmsb
  ordained_by: lucien-lee-kinsolving
  status: confirmed
  sources:
  - source: cd1965
    quote: D Oct 24 Bp L L Kinsolving P Apr 26 Bp W M M Thomas,
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1924 - … Athalício Theodoro Pithan
    page: '369'
  - source: costa2021
    quote: sendo ordenado ao diaconato em 1924 e, dois anos depois, ao presbiterato pelo bispo Kinsolving.
    page: '69'
  notes: >-
    Ordenante no diretório conforme o verbete. Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato
    (Kickhöfel, 1995); ordenante não informado. A frase pode atribuir a Kinsolving apenas o presbiterato; diaconato
    sob o mesmo bispo é leitura provável.
- order: presbyterate
