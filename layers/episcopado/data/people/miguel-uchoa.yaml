  notes: >-
    "Rev." na lista do clero de jan/2002; já "Rev." no processo sucessório que elegeu Robinson Cavalcanti (Concílio
    de junho de 1997). Data de ordenação diaconal/presbiteral NÃO encontrada em nenhuma fonte acessível; fundou
    a PAES em 1996, ainda na IEAB. Reitor da Paróquia Anglicana do Espírito Santo (Jaboatão dos Guararapes) desde
    agosto de 1996; antes "pastor da juventude" e coadjutor de Paulo Garcia por 5 anos na Catedral do Espinheiro.
    Fim do vínculo com a IEAB não coberto por esta fonte (provavelmente 2005, com a separação da diocese). Anexo
    R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado. Reitor da Paróquia Anglicana
    do Espírito Santo (Jaboatão). Em 2005 alinhado a Robinson (convidado com ele ao Encontro Sul-Sul por Akinola);
    a tese não o lista nominalmente entre os 32 desligados (lista no Anexo R, fora do capítulo).
