  - source: wp-en-uchoa
    quote: Consecration December 8, 2012 by Roger Ames
  - source: wp-pt-uchoa
    quote: >-
      Em dezembro de 2012, foi consagrado e empossado como bispo de Recife. Sua sagração episcopal aconteceu na
      PAES.
  - source: costa2021
    quote: >-
      Após o Concílio, o reverendo Miguel Uchôa, escolhido para ser o novo bispo, foi sagrado na Paróquia Anglicana
      do Espírito Santo, em Jaboatão dos Guararapes, no dia 08 de dezembro de 2012.
    page: '252'
  - source: testemunho-mantenedor-2026-10-08-uchoa
    quote: >-
      Miguel Uchôa foi sagrado em 2012, mas instalado como arcebispo da "nova província" considerada pela GAFCON
      2018
  - source: mu-blog-2012-11-29
    quote: >-
      Hoje a Diocese de Recife possui dois Bispos Sufragâneos, um Bispo Diocesano Eleito. Fomos reconhecidos pela
      maioria esmagadora da Comunhão Anglicana como Legítima Igreja Anglicana. Recebemos o Status de “Extra Provincial”
      sob a Supervisão de dois Arcebispos, e iremos concluir nosso ano com um Sínodo muito especial com a Sagração
      de um Bispo Diocesano e a presença oficial dos representantes do GAFCON, do Cone Sul, da CMS, de SOMA e da
      ACNA, nossos parceiros na missão.
  - source: ipco-2012-paroquias-anglicanas
    quote: >-
      Finalmente o Rev. Miguel Uchôa foi sagrado Bispo por sete bispos anglicanos. A Diocese do Recife caminha tranquilamente
      com dois Bispos Sufragâneos (Evilásio Tenório e Flavio Adair) e o Bispo Diocesano (Dom Miguel Uchôa).
  notes: >-
    Data confirmada por Anglican Ink e Wikipedia; sagrante principal (Roger Ames) apenas pela Wikipedia (terciária)
    e pelo pôster da IAB. O próprio Uchoa (2016) diz ter sido sagrado 'por 7 bispos de 3 continentes e 5 diferentes
    países', sem nomeá-los. O livro não nomeia os sagrantes. Os dois pôsteres da IAB dão 2012 nos ramos; o rodapé
    do pôster de Uchoa dá 8/12/2018, provavelmente erro de ano (8/12/2012 e 8/12/2018 caíram num sábado). A data
    2012-12-08 é confirmada por notícia do G1 do próprio dia; a investidura como arcebispo/primaz da IAB foi em
    12/05/2018 (ver vínculo de primaz). Data do rodapé ('8 de dezembro de 2018') descartada: erro de ano; a sagração
    foi em 8/12/2012. DATA e LOCAL confirmados: G1 Pernambuco de 08/12/2012 (publicado às 12h40 do próprio dia;
    'sábado (8)') + comunicado do GAFCON de maio/2018. A data '8 de dezembro de 2018' do rodapé do pôster é erro:
    8/12/2012 e 8/12/2018 caíram ambos num sábado, o que favorece um erro de digitação no ano. SAGRANTE PRINCIPAL:
    Roger Ames só na infobox da Wikipédia EN (sem nota) e no pôster; o GAFCON diz apenas que 'arranged for the consecration'.
    CO-SAGRANTES (Kevin Allen, Bill Atwood, David Onuoha, Donald Harvey, Evilásio Tenório, Flávio Soares): não confirmados
    por fonte independente. Sucessor de Robinson Cavalcanti na diocese dissidente (Diocese do Recife sob o Cone
    Sul / GAFCON). A tese não informa sagrantes. Em 29/11/2012 o próprio Uchôa, ainda 'Bispo Diocesano Eleito',
    anuncia a sagração no sínodo de fim de ano; um comentário no IPCO (25/06/2013) diz que já fora sagrado 'por
    sete bispos anglicanos'. Segundo o mantenedor, 2018 é o ano da instalação como arcebispo e primaz da nova província
    (12/05/2018), não da sagração.
