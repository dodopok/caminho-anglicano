    Esclarecimento); início e fim do vínculo não informados. Wikipedia (terciária). Antes disso era clérigo da IEAB
    (Diocese do Recife), reitor da PAES desde 1996. Local: Paróquia Anglicana Espírito Santo, reitor/fundador. Em
    1996 a PAES era da Diocese do Recife da IEAB; jurisdição posta como DAR por simplificação — ajustar (IEAB 1996–2005,
    DAR 2005–2018, IAB 2018–). Deixou a reitoria em 23/08/2026 (filho Gabriel instalado deão). Anexo R: o(a) clérigo(a)
    declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja,
    estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela
    IEAB, e a adesão à DAR é anterior, sem data exata. Local: Arcediagado Sul. Em exercício em outubro de 2010,
    conforme a mensagem publicada em 05/10/2010 no site da Diocese do Recife; listado entre os signatários da mensagem
    do Arcediagado Sul
