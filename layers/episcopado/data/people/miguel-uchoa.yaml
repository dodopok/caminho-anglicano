    bispo Clóvis (1986–1997), Uchoa foi por anos 'Candidato' às ordens com prazos 'dilatados'; mas a lista que ele
    dá dos ordenados por Clóvis NÃO inclui Uchoa (ver dúvidas). Ano tirado da lista do clero nacional por ordem
    de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado. O autor assinala em 7 de maio de 2013
    os 20 anos de ministério ordenado, o que situa o diaconato em maio de 1993 (o dia exato não é dado; outras fontes
    indicam 8 de maio). Diz que o bispo a quem chama 'Sherril' pregou na ordenação diaconal, e que Robinson Cavalcanti
    o apresentou ao bispo na ordenação presbiteral; o texto não nomeia o ordenante.
