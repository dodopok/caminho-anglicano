    quote: On December 8, 2012, The Rt. Rev. Miguel Uchoa was consecrated as Diocesan Bishop.
  - source: virtueonline-2026-08-25
    quote: Elected to succeed the martyred bishop later in 2012 and consecrated that December
  - source: wp-en-uchoa
    quote: 'Consecration

      December 8, 2012

      by Roger Ames'
  - source: ai-new-province-backed
    quote: On December 8, 2012, The Rt. Rev. Miguel Uchoa was consecrated as Diocesan Bishop.
  - source: wp-en-uchoa
    quote: ConsecrationDecember 8, 2012 by Roger Ames
  - source: iab-poster-linhagem-uchoa
    quote: >-
      162a. Roger Copeland Ames (2011-2016) que, em 8 de dezembro de 2012, sagrou Miguel Ângelo de Andrade Uchôa
      Cavalcanti como bispo diocesano do Recife, sucedendo à cátedra de Robinson Cavalcanti (ver 163a).
  - source: iab-poster-linhagem-uchoa
    quote: >-
      Em 8 de dezembro de 2018, na PAES, em Recife, o bispo Roger C. Ames, juntamente com os bispos Kevin Allen,
      Bill Atwood, David Onuoha, Donald Harvey, Evilásio Tenório e Flávio Soares, sagraram: Miguel Ângelo de Andrade
      Uchôa Cavalcanti como bispo diocesano da Sé do Recife, da Igreja Anglicana no Brasil.
  - source: iab-poster-linhagem-meira
    quote: >-
      163a. Miguel Ângelo de Andrade Uchôa (2012-atualmente) que, em 2012, foi sagrado bispo por Roger Ames e se
      tornou o primaz do que viria a ser, seis anos depois, uma nova província: a Igreja Anglicana do Brasil.
  discrepancies:
  - field: place
    value: Catedral PAES, Recife
    sources:
    - source: ai-new-province-backed
      quote: On December 8, 2012, The Rt. Rev. Miguel Uchoa was consecrated as Diocesan Bishop.
    - source: wp-en-uchoa
      quote: ConsecrationDecember 8, 2012 by Roger Ames
    - source: iab-poster-linhagem-uchoa
      quote: >-
        162a. Roger Copeland Ames (2011-2016) que, em 8 de dezembro de 2012, sagrou Miguel Ângelo de Andrade Uchôa
        Cavalcanti como bispo diocesano do Recife, sucedendo à cátedra de Robinson Cavalcanti (ver 163a).
    - source: iab-poster-linhagem-uchoa
      quote: >-
        Em 8 de dezembro de 2018, na PAES, em Recife, o bispo Roger C. Ames, juntamente com os bispos Kevin Allen,
        Bill Atwood, David Onuoha, Donald Harvey, Evilásio Tenório e Flávio Soares, sagraram: Miguel Ângelo de Andrade
        Uchôa Cavalcanti como bispo diocesano da Sé do Recife, da Igreja Anglicana no Brasil.
    - source: iab-poster-linhagem-meira
      quote: >-
        163a. Miguel Ângelo de Andrade Uchôa (2012-atualmente) que, em 2012, foi sagrado bispo por Roger Ames e
        se tornou o primaz do que viria a ser, seis anos depois, uma nova província: a Igreja Anglicana do Brasil.
  notes: >-
    DATA: 2012-12-08 confirmada pelo comunicado do GAFCON de 2018 (primário) e por VirtueOnline; a data '8 de dezembro
    de 2018' do rodapé do pôster da IAB é erro (em 12/05/2018 ele já foi instalado primaz como bispo). SAGRANTE
    PRINCIPAL: Roger Ames só na Wikipédia EN (infobox) e no pôster. CO-SAGRANTES: não confirmados por fonte independente.
    LOCAL: só no pôster ('Catedral PAES'), não confirmado. Data confirmada por Anglican Ink e Wikipedia; sagrante
    principal (Roger Ames) apenas pela Wikipedia (terciária) e pelo pôster da IAB. Os dois pôsteres da IAB dão 2012
    nos ramos; o rodapé do pôster de Uchoa dá 8/12/2018. Hipótese editorial (ainda sem fonte): 2018 seria a investidura
    de Uchoa como arcebispo/primaz da nova província ligada à GAFCON, quando nasceu o nome Igreja Anglicana no Brasil
    — o pôster de Márcio Meira diz que ele 'se tornou o primaz do que viria a ser, seis anos depois, uma nova província'.
affiliations:
- jurisdiction: ieab
  role: clergy
  diocese: ieab-diocese-recife
  start: 1996-08
  end: '2004'
  end_reason: schism
  status: probable
  sources:
  - source: wp-en-uchoa
    quote: >-
      Uchôa joined two-thirds of the clergy and roughly 95 percent of the laity in disaffiliating from the IEAB
  - source: iab-primaz
    quote: É fundador da PAES (Paróquia Anglicana Espírito Santo) em 1996
  - source: queiroz-2004-ufpe
    quote: >-
      Ao se desvincular da Catedral Anglicana do Espinheiro, o Pr. Miguel e mais um grupo de 30 a 40 pessoas, com
      o apoio do Pr. Paulo Garcia, fundaram, em agosto de 1996, a Paróquia Anglicana do Espírito Santo, em Jaboatão
      dos Guararapes
  - source: queiroz-2004-ufpe
    quote: De lá pra cá, eu sou o reitor dessa paróquia
  notes: >-
    Data de ordenação diaconal/presbiteral NÃO encontrada em nenhuma fonte acessível; fundou a PAES em 1996, ainda
    na IEAB. Reitor da Paróquia Anglicana do Espírito Santo (Jaboatão dos Guararapes) desde agosto de 1996; antes
    "pastor da juventude" e coadjutor de Paulo Garcia por 5 anos na Catedral do Espinheiro. Fim do vínculo com a
    IEAB não coberto por esta fonte (provavelmente 2005, com a separação da diocese).
