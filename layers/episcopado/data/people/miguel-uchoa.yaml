    equipe pastoral da Paróquia do Espírito Santo em outubro de 2005. Local: Arcediagado Sul. Assina como arcediago
    da Região Sul em textos reproduzidos no site em 2009. Local: Arcediagado da Região Sul. Consta no artigo publicado
    no Jornal do Commercio em 21/08/2005 e em textos do mesmo ano. Delegado clerical ao Concílio Diocesano Extraordinário
    de 26/02/2005 (Carta de Setúbal), com o cargo indicado na lista de delegados. Local: Arcediagado Sul (Região
    Sul). Assina o artigo como arcediago da Região Sul; texto sem data, cópia capturada em 15/10/2007. Local: Arcediagado
    Sul. Arcediago da Região Sul em 21/08/2005 e, em nota de junho de 2008, reitor da paróquia 'no Arcediagado Sul'.
    Local: Arcediagado Sul. O deão Luiz de Souza França o chama de 'Venerável Arcediago' em artigo reproduzido no
    site em 20/08/2009 e capturado em abril de 2011.
