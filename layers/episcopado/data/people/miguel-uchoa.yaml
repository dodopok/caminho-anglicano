wikidata: Q116960395
biography: >-
  Fundador e reitor da Paróquia Anglicana Espírito Santo (1996); bispo diocesano do Recife desde 2012 e primeiro
  arcebispo e primaz da IAB desde 2018.
sources:
- source: iab-primaz
  quote: É fundador da PAES (Paróquia Anglicana Espírito Santo) em 1996
- source: wp-en-uchoa
  quote: Miguel Uchôa Cavalcanti is a Brazilian Anglican bishop and author.
ordinations:
- order: episcopate
  date: '2012-12-08'
  place: Paróquia Anglicana Espírito Santo (PAES), Jaboatão dos Guararapes (Grande Recife)
  jurisdiction: diocese-anglicana-recife
  office: diocesan
  principal_consecrator: roger-ames
  co_consecrators:
