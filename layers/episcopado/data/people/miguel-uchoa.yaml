biography: >-
  Miguel Ângelo de Andrade Uchôa Cavalcanti foi ordenado diácono em 1993 na Igreja Episcopal Anglicana do Brasil
  (IEAB) e, depois, presbítero, apresentado por Robinson Cavalcanti. Fundou em 1996 a Paróquia Anglicana do Espírito
  Santo (PAES), em Jaboatão dos Guararapes, da qual foi reitor; na Diocese do Recife foi também capelão de seminário,
  arcediago sul, presidente da Junta de Capelães, membro da Comissão de Relações Internacionais e, por um mandato,
  do Conselho Executivo do Sínodo da IEAB. Em 2004 acompanhou Robinson Cavalcanti na confirmação coletiva em Akron
  (Ohio) e, em 2005, discursou em nome da diocese perante o grupo Anglican Mainstream, na Inglaterra. Com a maior
  parte do clero e dos leigos, deixou a IEAB para a Diocese do Recife independente. Eleito em 15 de setembro de
  2012 quarto bispo diocesano, em sucessão a Robinson Cavalcanti, foi sagrado em 8 de dezembro de 2012 por Roger
  Ames e outros bispos, na PAES. Em 8 de setembro de 2015 o Tribunal de Justiça de Pernambuco reconheceu a facção
  ligada à IEAB como a verdadeira diocese e dona do patrimônio, e em 12 de março de 2016 foi fundada juridicamente
  a Igreja Anglicana – Diocese do Recife. Em 2017 o sínodo extraordinário elegeu, sob sua liderança, Márcio Simões
  e Márcio Meira bispos auxiliares. Em abril de 2018 os primazes do GAFCON, reunidos em Entebbe, reconheceram a
  diocese como província e aprovaram sua instalação; em 12 de maio de 2018 foi instalado primeiro arcebispo e primaz
  da Igreja Anglicana no Brasil, permanecendo bispo diocesano do Recife. Foi vice-presidente do Conselho de Primazes
  do GAFCON de 21 de abril de 2023 a março de 2026 e, desde 5 de março de 2026, é vice-presidente do Global Anglican
  Council, criado em Abuja no lugar daquele conselho. Em agosto de 2026 instalou seu filho Gabriel Moreira Uchoa
  Cavalcanti, também clérigo, como deão da Catedral Anglicana do Espírito Santo. Participou de 15 ordenações de
  diáconos ou presbíteros e de cinco sagrações episcopais, entre elas, como sagrante principal, as de Márcio Meira
  e Márcio Simões (2017).
