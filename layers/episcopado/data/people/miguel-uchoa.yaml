  notes: >-
    Local: Paróquia Anglicana do Espírito Santo, Jaboatão dos Guararapes. Reitor da Paróquia Anglicana do Espírito
    Santo (PAES) atestado em outubro de 2005 e em 21/10/2007; também é arcediago (Arcediagado Sul) em 2006. Local:
    Paróquia Anglicana do Espírito Santo, Jaboatão dos Guararapes-PE. Reitor e arcediago em junho de 2007. Local:
    Paróquia Anglicana Espírito Santo (PAES), Jaboatão dos Guararapes-PE. Reitor em 2009-07 (Arcediagado Sul), 2012-05-02
    e 2012-09-19. Local: Paróquia Anglicana Espírito Santo, Jaboatão dos Guararapes-PE. Reitor da PAES em 19/09/2012,
    na ocasião da eleição episcopal. Local: Paróquia Anglicana do Espírito Santo (Piedade, Jaboatão dos Guararapes-PE;
    Arcediagado Sul). Página "Comunidades" do arcediagado, criada em 20/08/2009 e capturada em 29/11/2010; cargo
    atestado nesse intervalo, sem data de posse. Local: Paróquia Anglicana do Espírito Santo (Jaboatão dos Guararapes).
    Em 16/10/2004 e em 21/08/2005. Na assinatura de 2004 consta ainda como representante da agência missionária
    SOMA. Local: Paróquia Anglicana do Espírito Santo (Jaboatão dos Guararapes). Consta na página de comunidades
    do Arcediagado Sul capturada em 03/01/2009 (sem data de publicação visível). A página traz "(22/08)" ao lado
    do nome da paróquia, sem explicar (provável data de aniversário). Local: Paróquia Anglicana do Espírito Santo
    (Jaboatão dos Guararapes, PE). Reitor da PAES em dezembro de 2008 (confirmação de 23/11/2008). Local: Paróquia
    Anglicana do Espírito Santo (Jaboatão dos Guararapes-PE). Em dezembro de 2010 como presbítero; em 2013 assina
    como bispo e reitor da mesma paróquia (ver o vínculo de bispo diocesano). Local: Paróquia Anglicana do Espírito
    Santo (Jaboatão dos Guararapes-PE). Reitor da paróquia, já como bispo diocesano, em janeiro e fevereiro de 2013.
    Local: Paróquia Anglicana do Espírito Santo (PAES), Jaboatão dos Guararapes. Em 21/03/2013 assinava a mensagem
    'Hosana, celebremos!' como bispo (+Dom, Igreja Anglicana - Diocese do Recife) e, ao mesmo tempo, reitor da PAES,
    cargo que mantinha após a sagração episcopal de dezembro de 2012. Em exercício em março de 2013. Local: Paróquia
    Anglicana do Espírito Santo (Piedade, Jaboatão dos Guararapes-PE). Em exercício em ago/2010, segundo a página
    "Um Projeto Missionário Anglicano Ortodoxo para o Brasil IV – Estado de Pernambuco" (publicada e atualizada
    em 27/08/2010; cópia capturada em 25/12/2010). Local: Paróquia Anglicana do Espírito Santo (Piedade, Jaboatão
    dos Guararapes-PE). Local: Paróquia Anglicana do Espírito Santo (Piedade, Jaboatão dos Guararapes-PE). Texto
    sem data, cópia capturada em 15/10/2007. Local: Paróquia Anglicana Espírito Santo (PAES), Jaboatão dos Guararapes.
    Em exercício em maio de 2013, já como bispo diocesano; o autor descreve a paróquia com cerca de 1300 pessoas
    ou mais. Local: Paróquia Anglicana do Espírito Santo (Piedade, Jaboatão dos Guararapes-PE). Assina como reitor
    da Paróquia Anglicana do Espírito Santo e arcediago da Região Sul em artigo publicado no Jornal do Commercio
    de 21/08/2005; a mesma assinatura, sem data, aparece em outro artigo reproduzido no site. A paróquia tinha então
    nove anos de vida comunitária, segundo o autor. Local: Paróquia Anglicana Espírito Santo (Jaboatão dos Guararapes,
    PE); Arcediagado Sul/Recife. Reitor em novembro de 2009 e outubro de 2010.
