id: fred-de-melo-souto-lima
name: Fred de Melo Souto Lima
full_name: Fred de Melo Souto Lima
aliases:
- Fred Souto
- Rev. Fred Souto
- Ven. Arc. Rev. Fred Souto
biography: >-
  Fred de Melo Souto Lima foi ordenado diácono em 15 de fevereiro de 2004 e presbítero em 4 de dezembro de 2004,
  ambos por Robinson Cavalcanti, na Diocese Anglicana do Recife. Foi secretário administrativo diocesano (2005-2006)
  e ministro encarregado, depois pároco, da Missão (Paróquia) Anglicana de Gravatá. Em 23 de agosto de 2005 constou
  entre os clérigos que o decreto da autoridade eclesiástica Filadelfo Oliveira Neto excluiu da comunhão da IEAB;
  os clérigos responderam que mantinham plena comunhão com Robinson. Mais tarde foi arcediago do Centro e arcediago
  adjunto, e presidiu a comissão coordenadora do Concílio Diocesano de 2008.
