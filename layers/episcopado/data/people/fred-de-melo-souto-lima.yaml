# yaml-language-server: $schema=../../schemas/person.json
id: fred-de-melo-souto-lima
name: Fred de Melo Souto Lima
biography: Secretário Administrativo Diocesano em 2005; pastor da Missão Gravatá em 2006.
sources:
- source: drp-carta-venables-pt-2005
  quote: Rev. Fred de Melo Souto Lima – Secretário Administrativo Diocesano
- source: drp-boletim-oracao-2006
  quote: Orar pela Missão Anglicana Gravatá; pelo Rev. Fred Souto e família
ordinations:
- order: diaconate
  date: '2004-02-15'
  place: Catedral Anglicana da Santíssima Trindade (congregação fora do templo), Recife-PE
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-diac-daniel-fred
    quote: Ordenação Diaconal de Daniel Barbosa e Fred Souto
  - source: rcor-drv-diac-daniel-fred
    quote: Catedral Anglicana da Santíssima Trindade / Recife – PE 15 de fevereiro de 2004
  - source: rcor-drv-diac-daniel-fred
    quote: Com eles completamos 55 Diáconos nesses seis anos e meio
  - source: drp2-ord-diac-daniel-fred-2004
    quote: >-
      Ordenação Diaconal de Daniel Barbosa e Fred Souto Catedral Anglicana da Santíssima Trindade Recife – PE 15
      de fevereiro de 2004
  - source: drp2-ord-diac-daniel-fred-2004
    quote: A Daniel e a Fred a minha saudação em nome do povo da nossa Diocese
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti). Identificação de 'Fred Souto' com Fred de Melo Souto Lima provável.
- order: presbyterate
  date: 2004-12
  place: Paróquia Anglicana Emanuel, Olinda-PE (culto de encerramento do XXIV Concílio Diocesano)
  jurisdiction: ieab-dar
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: drp2-concilio-xxiv-2004
    quote: >-
      foi celebrado um Culto Eucarístico com a Ordenação Presbiteral dos Reverendos: Décio da Silva, Fred Souto,
      Marconi Oliveira, Solange Cristina Pereira e Raniere Oliveira
  - source: drp2-ord-presb-xxiv-concilio-2004
    quote: Ordenação presbiteral XXIV C Diocesano- Olinda PE
  - source: drp2-ord-presb-xxiv-concilio-2004
    quote: hoje a igreja estará recebendo 5 novos presbíteros
  - source: drp2-ord-presb-xxiv-concilio-2004
    quote: Fred,Ranieri,Solange,Marconi, Décio
  notes: >-
    Ordenação no culto eucarístico após os Concílios Ordinário (XXIV) e Extraordinário da diocese, em Olinda. O
    informe diocesano é datado de 02/12/2004 e fala do 'último fim de semana'; o cabeçalho do sermão do Rev. Miguel
    Uchôa traz 10/12/2004. Dia exato incerto.
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Fred de Melo Souto Lima
  - source: drv-nota-esclarecimento-2006
    quote: Fred de Melo Souto Lima
  - source: drp-boletim-oracao-2006
    quote: Orar pela Missão Anglicana Gravatá; pelo Rev. Fred Souto e família
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Fred de Melo Souto Lima … Os clérigos não atenderam à convocação
      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Missão Anglicana Gravatá. Clérigo citado como
    pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão). Anexo R:
    o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti,
    ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005 é a da exclusão
    pela IEAB, e a adesão à DAR é anterior, sem data exata.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: secretario_diocesano
  status: confirmed
  sources:
  - source: drp-carta-venables-pt-2005
    quote: Rev. Fred de Melo Souto Lima – Secretário Administrativo Diocesano
  notes: Assina a carta a Venables (17/10/2005) como Secretário Administrativo Diocesano.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Fred de Melo Souto Lima … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
