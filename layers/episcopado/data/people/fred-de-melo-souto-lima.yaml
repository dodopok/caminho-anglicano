    Sermão do bispo diocesano (Robinson Cavalcanti). O sermão diz 'Fred Souto'; os calendários diocesanos de 2002
    e 2004 listam o mesmo postulante como 'Fred Souto' e 'Fred de Melo Souto Lima'. O sermão diz só "Fred Souto".
    Identidade documentada: na lista de jan/2002 "Fred Souto" é postulante; o calendário diocesano de 2004 lista
    "Post. Fred de Melo Souto Lima"; em 2005 o cargo de Secretário Administrativo Diocesano é atribuído a "Rev.
    Fred de Melo Souto Lima" (Carta de Setúbal, 26/02/2005) e a "Rev. Fred Souto" (carta ao clero assinada por ele,
    11/07/2005); em 2007 a nota biográfica de "Rev. Fred Souto" o dá como pároco em Gravatá e Secretário Administrativo
    Diocesano.
