biography: >-
  Juciara Maria Rodrigues do Nascimento foi ordenada diácona por Robinson Cavalcanti, em data não registrada, e
  atuou na Diocese do Recife como ministra encarregada do Ponto Missionário Betesda, líder da equipe pastoral e
  pároca da Paróquia Anglicana São Paulo, onde em 2008 e 2010 constava como pároca ou reitora. Foi também vice-presidente
  do Conselho Diocesano. Em 23/08/2005 constou entre os clérigos excluídos da comunhão da IEAB por decreto, os quais
  declararam em carta manter comunhão com Robinson Cavalcanti, e passou a aparecer como clériga da Diocese Anglicana
  do Recife. Faleceu em março de 2015.
