  notes: >-
    Local: Paróquia Anglicana São Paulo, Nova Descoberta, Recife. Pároca em agosto de 2008 (citada como "Revda Juciara
    Rodrigues"). Local: Paróquia Anglicana São Paulo (Recife). Consta na página de comunidades do Arcediagado Centro
