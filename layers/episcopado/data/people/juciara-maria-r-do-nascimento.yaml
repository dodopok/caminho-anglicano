    quote: 'Paróquia Anglicana São Paulo Pároca: Revda. Juciara Rodrigues'
  notes: >-
    Local: Paróquia Anglicana São Paulo (Alto do Eucalipto, Recife-PE; Arcediagado Centro). Página "Comunidades"
    do arcediagado, criada em 20/08/2009 e capturada em 29/11/2010; cargo atestado nesse intervalo, sem data de
    posse. A página a chama "Juciara Rodrigues"; a identificação com a Revda. Juciara M. R. Nascimento é pelo nome
