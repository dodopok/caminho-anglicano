biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em 1937-08-27.
  Ordenado diácono em dez/1961 e presbítero em jun/1962. Transferido para a Igreja Episcopal do Brasil em 25/04/1965
  (Clerical Directory 1968).
