# yaml-language-server: $schema=../../schemas/person.json
id: fernando-antonio-goncalves
name: Fernando Antônio Gonçalves
aliases:
- Rev. Fernando Gonçalves
biography: >-
  Fernando Antônio Gonçalves foi ordenado diácono em 10/9/2005, na Catedral Anglicana da Santíssima Trindade, por
  Filadelfo Oliveira Neto, na Diocese Anglicana do Recife (IEAB). Nas listas da diocese consta como diácono, secretário
  do Conselho Diocesano e ministro responsável pelo Ponto Missionário Anglicano Jesus de Nazaré.
sources:
- source: d2s31-diacs
  quote: a Diocese conta com oito novos diáconos ordenados por Dom Filadelfo
- source: d2s31-diacs
  quote: >-
    Rev. Rodrigo Espiúca, Rev. Senomar Teixeira, Rev. Adilson Ferreira, Rev. Fernando Gonçalves, Rev. Rodson Ricardo,
    Rev. Júlio Gomes, Rev. Sílvio Freitas e Rev. Ricardo Domingos
- source: d2s31-diacs
  quote: >-
    estiveram na Catedral Anglicana da Santíssima Trindade e participaram do culto presidido pelo Bispo Dom Filadelfo
    Neto
- source: d2s31-carta
  quote: Rev. Fernando Antônio Gonçalves Secretário do Conselho Diocesano
- source: d2s31-comun
  quote: PONTO MISSIONÁRIO ANGLICANO JESUS DE NAZARÉ Rev. Fernando Antônio Gonçalves
