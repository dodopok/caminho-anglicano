# yaml-language-server: $schema=../../schemas/person.json
id: simea-de-souza-meldrum
name: Simea de Souza Meldrum
full_name: Simea de Souza Meldrum
biography: Clérigo da Diocese Anglicana do Recife citado em documento oficial da própria Diocese.
sources:
- source: drp-boletim-oracao-2006
  quote: 'Orar pela Paróquia Anglicana Água Viva; pelos Reverendos: Siméa e Ian Meldrum'
ordinations:
- order: diaconate
  date: '1990'
  jurisdiction: ieab
  status: probable
  sources:
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1990 - … Simea de Souza Meldrum
    page: '373'
  notes: >-
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
- order: presbyterate
  date: null
  jurisdiction: ieab-dar
  ordained_by: clovis-erly-rodrigues
  status: probable
  sources:
  - source: dard2-hist3
    quote: >-
      Foram ordenados, durante o seu período os seguintes reverendos: Washington Franco e Siméa Meldrum (os únicos
      dos seus Presbíteros que continuam conosco)
  - source: darl3-hist3
    quote: Washington Franco e Siméa Meldrum (os únicos dos seus Presbíteros que continuam conosco)
  - source: darl3-hist3
    quote: Foram ordenados, durante o seu período os seguintes reverendos
  notes: >-
    Robinson Cavalcanti lista Siméa Meldrum entre os presbíteros ordenados no período do bispo Clóvis Erly Rodrigues
    (1986-1997); data e local não constam. O ordenante é entendido como o bispo diocesano da época. Ordenação durante
    o episcopado de Clóvis Erly Rodrigues na diocese (1986-1997), conforme lista de Dom Robinson Cavalcanti; o texto
    não dá data nem local e não diz expressamente "ordenado por"; ordenante inferido do período. A lista separa
    os ordenados ao presbiterado (aqui incluídos) dos ordenados "apenas ao Diaconato".
affiliations:
- jurisdiction: ieab
  role: clergy
  start: '1990'
  status: probable
  sources:
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1990 - … Simea de Souza Meldrum
    page: '373'
  notes: Consta da lista do clero nacional da IEAB (Kickhöfel, 1995); início = ano do diaconato.
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Revda. Siméa de Souza Meldrum
  - source: drv-nota-esclarecimento-2006
    quote: Siméa de Souza Meldrum
  - source: drp-boletim-oracao-2006
    quote: 'Orar pela Paróquia Anglicana Água Viva; pelos Reverendos: Siméa e Ian Meldrum'
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Siméa de Souza Meldrum … Os clérigos não atenderam à convocação
      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  - source: dard1-com-norte-2009a
    quote: Revda. Siméa Meldrum Rev. Ian Meldrum
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Paróquia Anglicana Água Viva (Olinda). Clérigo
    citado como pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão).
    Anexo R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson
    Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005
    é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data exata. Local: Paróquia Anglicana Água Viva
    (Olinda). Consta na página de comunidades do Arcediagado Norte capturada em 03/01/2009 (sem data de publicação
    visível). A página lista os dois sem indicar função.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Siméa de Souza Meldrum … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
