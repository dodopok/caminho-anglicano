events:
- type: other
  date: 2013-04
  description: >-
    Delegação da Diocese do Recife, chefiada pelo bispo sufragâneo Flávio Adair e com a Revda. Siméa Meldrum como
    palestrante, participou de 4 a 7 de abril de 2013 da Conferência Global de Missões Anglicanas (New Wineskins),
    em Asheville (Carolina do Norte), e depois visitou Pittsburgh, onde o arcebispo da ACNA, Robert Duncan, a recebeu
    para almoço e transmitiu ao bispo diocesano Miguel Uchôa sua solidariedade; a diocese discutiu com a ACNA e
    a SAMS a parceria para envio e recebimento de missionários.
  status: confirmed
  sources:
  - source: d2s22-acna-2013
    quote: >-
      Nossa Diocese foi representada pelo Bispo Sufragâneo Flávio Adair, pela Revda. Siméa Meldrum que foi palestrante
      no evento
  - source: d2s22-acna-2013
    quote: >-
      O Arcebispo da ACNA, Revmo. Robert Duncan, também fez questão de nos receber em um almoço no seu escritório
      em Pittsburgh
  - source: d2s22-acna-2013
    quote: >-
      visitamos os escritórios da ACNA e da SAMS, onde reunidos com o staff, discutimos nossa parceira especialmente
      no que diz respeito a recebimento e envio de Missionários
