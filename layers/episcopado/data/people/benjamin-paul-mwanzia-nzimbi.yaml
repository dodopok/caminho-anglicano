      |consecrated_by = [[Festo Olang'']]'
  notes: >-
    Ano 1985 (primeiro bispo de Machakos) apoiado pela ACK. O sagrante dado pela infobox da Wikipédia (Festo Olang')
    é duvidoso: Olang' se aposentou como arcebispo em 1980 (o arcebispo em 1985 era Manasses Kuria). Nenhuma fonte
    primária sobre o sagrante foi achada. NOVO: data exata 14/04/1985 (antes só "1985"). Sagrante principal continua
    não encontrado. O arcebispo do Quênia em 1985 era Manasses Kuria (eleito em 1980, segundo o mesmo livro e o
    Journal da Convenção Geral de 1982, que registra sua instalação em 29/06/1980) — o que torna improvável a infobox
    da Wikipédia (Festo Olang', já aposentado). Os trechos vêm da busca de texto completo do Internet Archive (livro
    de empréstimo controlado). VERSÃO DA WIKIPÉDIA (infobox, sem nota). Contestada por incoerência cronológica com
    a própria Wikipédia: Festo Olang' foi arcebispo do Quênia até 1980, e o arcebispo em 1985 era Manasses Kuria
    (1980-1994, segundo wp-en-kuria). Não há fonte que nomeie Kuria (ou outro) como sagrante: não registrei versão
    alternativa com sagrante. Ver dúvidas.
