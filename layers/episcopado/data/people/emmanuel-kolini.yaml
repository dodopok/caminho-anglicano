birth:
  date: '1945'
  sources:
  - source: gacl-wp-kolini
    quote: '''''''Emmanuel Mbona Kolini'''''' (born [[Belgian Congo]], 1945) is a Congolese-Rwandan Anglican bishop.'
biography: >-
  Emmanuel Mbona Kolini nasceu em 1945 no Congo Belga e foi sagrado em 1980 bispo assistente de Bukavu (Zaire).
  Foi bispo de Katanga de 1986 a 1997 e, de 1998 a janeiro de 2011, primaz de Ruanda e bispo de Kigali; em abril
  de 2010 era vice-presidente do Conselho dos Primazes do GAFCON/FCA. Em setembro de 2010 a Câmara dos Bispos elegeu
  Onesphore Rwafe para sucedê-lo como primaz. Sagrou um bispo, Laurent Mbanda, para a Diocese de Shyira em 2010.
