- order: episcopate
  date: '1988-06-07'
  place: Altoona, Pensilvânia (EUA)
  jurisdiction: null
  principal_consecrator: luiz-fernando-castillo-mendez
  co_consecrators:
  - josivaldo-pereira-de-oliveira
  - melquiades-rosa-garcia
  - walbert-rommel-coelho-galvao-barros
  mode: conditional
  status: probable
  sources:
  - source: lin-tjb-ingram
    quote: >-
      Later consecrated a bishop, sub conditione, on 06/07/1988 at Altoona, Pennsylvania, by Luís Fernando Castillo-Méndez,
      a bishop of the Igreja Católica Apostólica Brasileira, assisted by Melquiades Rosa Garcia, a bishop of the
      Igreja Católica Apostólica Brasileira, by Josivaldo Pereira de Oliveira, a bishop of the Igreja Católica Apostólica
      Brasileira, by Galvao Barros, a bishop of the Igreja Católica Apostólica Brasileira, and by Walbert Rommel
      Coehlo, a bishop of the Igreja Católica Apostólica Brasileira
  notes: >-
    Consagração condicional por bispos da ICAB. Castillo Mendez, principal sagrante, foi sagrado por Carlos Duarte
    Costa em 03/05/1948; esse ramo da linha de Compton-Caputo chega portanto a Duarte Costa. Fonte única (Boyle).
    A fonte lista "Galvao Barros" e "Walbert Rommel Coehlo" como dois bispos; o blog de sucessão da ICAB registra
    um só, Dom Walbert Rommel Coelho Galvão Barros.
