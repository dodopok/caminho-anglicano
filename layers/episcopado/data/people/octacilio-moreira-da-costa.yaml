biography: >-
  Clérigo do Distrito Missionário do Brasil Central, ordenado diácono em junho de 1939 pelo bispo William Matthews
  Merrick Thomas e presbítero em fevereiro de 1943 pelo bispo Athalício Pithan. Foi transferido para a Igreja Episcopal
  do Brasil em 25 de abril de 1965.
