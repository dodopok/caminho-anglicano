  notes: >-
    Perry (1895) lista os sagrantes começando pelo que presidiu; a lista da Wikipédia (que cita Perry) põe o mesmo
    bispo em primeiro. Co-sagrantes sem prenome em Perry ficam só com o sobrenome, como na fonte. Perry diz 'Moore,
    Chase, the two Onderdonks, Smith, and Doane'; os prenomes de Moore e Chase vêm da lista da Wikipédia (Richard
    Channing Moore, Philander Chase). 'the two Onderdonks' foram lidos como H. U. e B. T. Onderdonk, os dois bispos
    desse sobrenome que Perry menciona em outras sagrações; isso é inferência e deve ser conferido. Smith e Doane
    ficam só com o sobrenome.
