id: jackson-kemper
name: Jackson Kemper
full_name: Jackson Kemper
aliases:
- Bp. Kemper
wikidata: Q6117197
biography: >-
  Sagrado em 25/09/1835, na Igreja de São Pedro, Filadélfia, por William White e outros bispos, como bispo missionário
  para Missouri e Indiana, o primeiro bispo missionário da Igreja Episcopal. Foi a última sagração de que White
  participou.
sources:
- source: perry-1895
  quote: RIGHT REVEREND JACKSON KEMPER, D.D.
- source: perry-1895
  quote: >-
    He was consecrated, Sept. 25, 1835, missionary bishop for Missouri and Indiana, in St. Peter's Church, Philadelphia,
    by Bishops White, Moore, Chase, the two Onderdonks, Smith, and Doane, — the last consecration in which the venerable
    White took part.
- source: wp-en-histlist
  quote: >-
    | [[Jackson Kemper]] | [[William White (Bishop of Pennsylvania)|2]] [[Richard Channing Moore|14]] [[Philander
    Chase|18]] | 1835
- source: perry-1895
