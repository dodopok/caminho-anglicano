# yaml-language-server: $schema=../../schemas/person.json
id: paulo-cesar-telles-mendizabal
name: Paulo César Telles Mendizabal
biography: >-
  Bispo da Igreja Católica Apostólica Brasileira (ICAB), identificado como Bispo de Niterói (RJ) em legenda de foto
  com Luis Fernando Castillo Méndez e como Conselheiro Tesoureiro do Conselho Episcopal da ICAB em página sem data.
  Um blog de sucessão apostólica da ICAB o lista entre os consagrados por Castillo Méndez, com a data 2004. Não
  consta na lista de conselheiros nem de dioceses do site oficial da ICAB em 2026.
sources:
- source: lvc-ioh-castillo
  quote: Sua Exª Rev.ma D. Paulo César Telles Mendizabal, Bispo de Niterói - RJ, Brasil
- source: lvc-icab-conselho-eev
  quote: 'CONSELHEIRO TESOUREIRO: Dom Paulo César Telles Mendizabal'
- source: lvc-icab-sucessao-blog
  quote: Dom Paulo César Telles Mendizabal. (2004).
ordinations:
- order: episcopate
  date: '2004'
  jurisdiction: icab
  principal_consecrator: luiz-fernando-castillo-mendez
  status: probable
  sources:
  - source: lvc-icab-sucessao-blog
    quote: '4 - Dom Luis Fernando Castillo Méndez, SAGROU:'
  - source: lvc-icab-sucessao-blog
    quote: 4.55. Dom Paulo César Telles Mendizabal. (2004).
  notes: >-
    Blog 'Sucessão Apostólica' (ICAB, 2011) lista Mendizabal na relação dos sagrados por Castillo Méndez, sem dia,
    local nem co-sagrantes; a numeração segue a de Castillo Méndez como consagrante de nº 4 da linhagem. Fonte única
    e secundária.
affiliations:
- jurisdiction: icab
  role: bishop
  status: probable
  sources:
  - source: lvc-ioh-castillo
    quote: Sua Exª Rev.ma D. Paulo César Telles Mendizabal, Bispo de Niterói - RJ, Brasil
  - source: lvc-icab-conselho-eev
    quote: 'CONSELHEIRO TESOUREIRO: Dom Paulo César Telles Mendizabal'
  - source: cant-novas-igrejas-2024
    quote: pelo bispo de Niterói (RJ), dom Paulo César telles Mendizabal, da ICAB
    page: '141'
  notes: >-
    Local: Niterói, RJ. Duas páginas sem data o mostram como Bispo de Niterói (legenda de foto com Castillo Méndez)
    e conselheiro tesoureiro do Conselho Episcopal da ICAB. Não consta em 2026 no Conselho Episcopal nem nas 26
    dioceses do site oficial da ICAB; o fim do vínculo, se houve, não está documentado. Local: Niterói, RJ.
