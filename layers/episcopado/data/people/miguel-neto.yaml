    quote: >-
      a Câmara dos Bispos ganhou novos membros com a ordenação dos bispos Miguel Neto (auxiliar para a Diocese de
      João Pessoa)
    page: '34'
  - source: testemunho-mantenedor-2026-10-08-videos
    quote: >-
      Sagrante principal precisamos corrigir, vi no vídeo que foi Miguel Uchoa. Cosagrantes foram Eric Rodrigues,
      Marcio Simões, Marcio Meira, Evilásio e Flavio Adair. Foi uma live, então foi dia 31/05/2023. Minuto da sagração
      foi 1:10:29, foi na igreja Comunhão Boqueirão.
  discrepancies:
  - field: place
    value: Igreja Anglicana Comunhão, Boqueirão (PB)
    sources:
    - source: testemunho-mantenedor-2026-10-08-videos
      quote: >-
        Sagrante principal precisamos corrigir, vi no vídeo que foi Miguel Uchoa. Cosagrantes foram Eric Rodrigues,
        Marcio Simões, Marcio Meira, Evilásio e Flavio Adair. Foi uma live, então foi dia 31/05/2023. Minuto da
        sagração foi 1:10:29, foi na igreja Comunhão Boqueirão.
  notes: >-
    Eleito bispo auxiliar no Sínodo Extraordinário online de 13/03/2023 (a matéria da Buzz News traz '13 de março',
    sem o ano, na mesma notícia que anuncia para 08/05/2023 a sagração de Eric Rodrigues). A sagração, anunciada
    para 31/05 em Boqueirão, aparece em vídeo do canal Comunhão Boqueirão com data 31/05/2023 e o nome de Miguel
    Uchôa no título; a Igreja Anglicana Comunhão em Patos comemorou 'um ano da sagração' em 31 de maio (2024). Sagrante
    principal e co-sagrantes não foram localizados em texto: o título do vídeo associa o nome do primaz Miguel Uchôa
    à cerimônia, mas não declara sua função. Data, local e sagrantes NÃO encontrados. Eleito em 13/03/2023 (Diocese
    de João Pessoa). Indício: os títulos do canal Comunhão Campina passam de "PR. MIGUEL NETO" (26/03/2023) a "BISPO
    MIGUEL NETO" (06/04/2023 e 09/04/2023), o que sugere sagração entre 27/03 e 06/04/2023 (pode ser apenas uso
    do título de bispo eleito). Não foi sagrado junto com Eric Rodrigues em 08/05/2023 (as notícias daquela sagração
    não o mencionam). Data não informada (contexto: a partir de 2020). Transmissão ao vivo (YouTube S08hN-XZPWY);
    imposição das mãos em 1:10:29.
