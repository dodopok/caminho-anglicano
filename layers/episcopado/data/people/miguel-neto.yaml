    quote: Com apenas 4 anos de ordenação presbiteral ele sonha em consolidar a igreja a qual dirige
  notes: >-
    Ano deduzido: página capturada pelo Wayback em 27/09/2020 diz "4 anos de ordenação presbiteral" (o texto pode
    ser anterior à captura). Jurisdição em c.2016 = Igreja Anglicana – Diocese do Recife (pré-IAB). Ordenante não
    informado.
- order: episcopate
  date: null
  jurisdiction: iab
  office: auxiliary
  status: probable
  sources:
