    quote: elegeu dois novos bispos auxiliares, Bp. Miguel Neto e Bp. Eric Rodrigues
  - source: djp-bispos-aux-2024
    quote: >-
      Atualmente, está comissionado para exercer o Episcopado e coordenar uma região de igrejas na Paraíba e no
      Ceará.
  - source: yt-campina-lista-2023
    quote: CRESCER NA MORDOMIA - PR. MIGUEL NETO - 26/03/2023
  - source: yt-campina-lista-2023
    quote: CULTO LAVA PÉS - BISPO MIGUEL NETO - 06/04/2023
  notes: >-
    Data, local e sagrantes NÃO encontrados. Eleito em 13/03/2023 (Diocese de João Pessoa). Indício: os títulos
    do canal Comunhão Campina passam de "PR. MIGUEL NETO" (26/03/2023) a "BISPO MIGUEL NETO" (06/04/2023 e 09/04/2023),
    o que sugere sagração entre 27/03 e 06/04/2023 (pode ser apenas uso do título de bispo eleito). Não foi sagrado
    junto com Eric Rodrigues em 08/05/2023 (as notícias daquela sagração não o mencionam).
