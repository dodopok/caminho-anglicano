    quote: elegeu dois novos bispos auxiliares, Bp. Miguel Neto e Bp. Eric Rodrigues
  - source: djp-bispos-aux-2024
    quote: >-
      Atualmente, está comissionado para exercer o Episcopado e coordenar uma região de igrejas na Paraíba e no
      Ceará.
  - source: yt-campina-lista-2023
    quote: CRESCER NA MORDOMIA - PR. MIGUEL NETO - 26/03/2023
