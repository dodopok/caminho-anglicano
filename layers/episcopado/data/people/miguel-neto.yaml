    quote: Junto com os Bispos Márcio Meira (Diocesano da DJP) e Miguel Neto (Bispo Auxiliar da DJP)
  - source: iab-jornada-pbce-2025
    quote: >-
      A Igreja Anglicana Comunhão tem como líderes o Bispo Miguel Neto e sua esposa Revda. Priscilla Abrantes auxiliados
      pelo Post. Adylson.
  - source: djp-igrejas-2025
    quote: Comunhão Patos – PB Bispo Miguel Neto Revda. Priscilla
  - source: spotify-juliane
    quote: >-
      Essa é a história do Bispo auxiliar da Igreja Anglicana no Brasil, Miguel Neto. Neste episódio o Bispo Miguel,
      que está a frente da Igreja Anglicana Comunhão Campina Grande
  - source: ac-boqueirao-2020
    quote: 'Pastor: Revdo. Miguel Neto'
  - source: yt-cc-2022-12-08
    quote: SEMANA DA VIRADA - DIA 04 | REV. MIGUEL NETO | 08.12.2022 - 20h
  notes: >-
    Local: Igreja Anglicana Comunhão, Campina Grande-PB e Patos-PB. Bispo auxiliar da Diocese de João Pessoa em
    2023–2025; antes, à frente da Igreja Anglicana Comunhão Campina Grande (podcast de jul/2023) e, em 2025, da
    Comunhão Patos. Data e sagrantes da sagração episcopal (eleito em 13/03/2023) NÃO encontrados. Trajetória: 'De
    mecânico a um Pastor plantador de Igrejas' (podcast). Presbítero na DJP antes do episcopado; pastor da Comunhão
    Boqueirão (igreja nascida em jan/2018), depois da Igreja Anglicana Comunhão em Patos.
