id: joao-peixoto-de-siqueira-filho
name: João Peixoto de Siqueira Filho
aliases:
- Rev. João Peixoto
- Ven. Arc. Rev. João Peixoto de Siqueira Filho+
biography: >-
  Ordenado diácono em 16/06/2007, na Catedral Anglicana do Bom Samaritano (Recife), e presbítero em 08/03/2008,
  na Paróquia Anglicana Emanuel (Olinda), por Robinson Cavalcanti, na Diocese Anglicana do Recife. Foi coadjutor
  da Paróquia Anglicana Emanuel e arcediago do Norte, integrou a Comissão de Direito Canônico e, como secretário
  da Comissão Especial de Assessoria Institucional (posse em 31/07/2009), trabalhou pelo status estável da diocese
  na Comunhão Anglicana. Em 2019 consta como reitor da Igreja Anglicana Emanuel, na IAB.
