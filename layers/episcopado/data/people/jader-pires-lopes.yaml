id: jader-pires-lopes
name: Jader Pires Lopes
biography: >-
  Jader Pires Lopes foi ministro leigo na IAB até dezembro de 2024 e passou à Rede Episcopal Brasileira (REB), como
  postulante, atuando na Estação Casa até junho de 2026. Desde 1º de agosto de 2026 planta, na REB, a Igreja Anglicana
  Caminho, em Belo Horizonte.
sources:
- source: testemunho-mantenedor-2026-10-08-jader
  quote: Jader era ministro leigo na IAB, não postulante
- source: testemunho-mantenedor-2026-10-08-jader
  quote: >-
    Ele era postulante da Trindade sob o Pedro Muniz, saiu pra REB e estava na Estação Casa como postulante do Jaime
    Sepulcro
