# yaml-language-server: $schema=../../schemas/person.json
id: luiz-fernando-castillo-mendez
name: Luiz Fernando Castillo Mendez
aliases:
- Dom Luis Fernando Castillo Mendez
- Luis Fernando Castillo Méndez
biography: >-
  Bispo da linhagem da ICAB (sagrado em 03/05/1948, em Balboa, Zona do Canal do Panamá, segundo o blog de sucessão
  da ICAB), de origem venezuelana; aparece como consagrante de Paulo César Telles Mendizabal na lista do blog.
sources:
- source: lvc-icab-sucessao-blog
  quote: Mas somente em 3/05/1948, em Balboa, na Zona do Canal do Panamá é que Dom Luis pode ser sagrado.
ordinations:
- order: presbyterate
  date: '1944-08-10'
  place: Espanha
  jurisdiction: null
  status: probable
  sources:
  - source: dioc-california-velandia
    quote: >-
      Bishop Carlos Duarte Costa on May 3, 1948 consecrated Luis Fernando Castillo Mendez (1922- ordained Roman
      Catholic priest in Spain on August 10, 1944 patriarch of the church since 1961.
  - source: lvc-icab-sucessao-blog
    quote: Sacerdote em 10/08/1944.
  notes: Ordenado padre na Igreja Católica Romana.
- order: episcopate
  date: '1948-05-03'
  place: Balboa, Zona do Canal do Panamá
  jurisdiction: icab
  principal_consecrator: carlos-duarte-costa
  status: confirmed
  sources:
  - source: enwiki-duarte-costa
    quote: >-
      In the years immediately after founding the church, Duarte Costa consecrated four bishops, [[Salomão Barbosa
      Ferraz]] (August 15, 1945), Jorge Alves de Souza and Antidio Jose Vargas (both in 1946) and [[Luis Fernando
      Castillo Mendez]] (May 3, 1948); and Castillo Mendez was the youngest bishop consecrated by Duarte Costa,
      at the age of 25.
  - source: icac-san-carlos
    quote: Es consagrado obispo en Balboa, Zona del Canal de Panamá.
  - source: dioc-california-velandia
    quote: >-
      Bishop Carlos Duarte Costa on May 3, 1948 consecrated Luis Fernando Castillo Mendez (1922- ordained Roman
      Catholic priest in Spain on August 10, 1944 patriarch of the church since 1961.
  - source: lvc-icab-sucessao-blog
    quote: de Caracas e Primaz da Venezuela. 03/05/1948.
  notes: >-
    A Wikipédia cita Edward Jarvis, God, Land & Freedom: The True Story of ICAB (2018), pp. 77-109. Segundo a mesma
    fonte, Duarte Costa depois denunciou Castillo Mendez repetidas vezes como impostor e charlatão. A página traz
    a linhagem de uma igreja vétero-católica da Califórnia; a seção sobre Duarte Costa está em boa parte embaralhada,
    mas esta frase é inteira. Sagrado Patriarca de Caracas e Primaz da Venezuela.
