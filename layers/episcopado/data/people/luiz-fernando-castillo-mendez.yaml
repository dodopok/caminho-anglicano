# yaml-language-server: $schema=../../schemas/person.json
id: luiz-fernando-castillo-mendez
name: Luiz Fernando Castillo Mendez
aliases:
- Dom Luis Fernando Castillo Mendez
- Luis Fernando Castillo Méndez
biography: >-
  Bispo de origem venezuelana, ordenado sacerdote em 10/08/1944 e sagrado em 3/05/1948, em Balboa (Zona do Canal
  do Panamá), por Carlos Duarte Costa, na linhagem da ICAB; consta como consagrante de cinco bispos, entre eles
  Eduardo Mota, Antônio José da Costa Raposo e Paulo César Telles Mendizabal.
sources:
- source: dioc-california-velandia
  quote: >-
    Bishop Carlos Duarte Costa on May 3, 1948 consecrated Luis Fernando Castillo Mendez (1922- ordained Roman Catholic
    priest in Spain on August 10, 1944 patriarch of the church since 1961.
- source: lvc-icab-sucessao-blog
  quote: Mas somente em 3/05/1948, em Balboa, na Zona do Canal do Panamá é que Dom Luis pode ser sagrado.
- source: lin-wp-en-costa
  quote: >-
    In the years immediately after founding the church, Duarte Costa consecrated four bishops, [[Salomão Barbosa
    Ferraz]] (August 15, 1945), Jorge Alves de Souza and Antidio Jose Vargas (both in 1946) and [[Luis Fernando
    Castillo Mendez]] (May 3, 1948); and Castillo Mendez was the youngest bishop consecrated by Duarte Costa, at
    the age of 25.
- source: icac-san-carlos
  quote: Es consagrado obispo en Balboa, Zona del Canal de Panamá.
- source: lvc-icab-sucessao-blog
  quote: Sacerdote em 10/08/1944.
- source: lvc-icab-sucessao-blog
  quote: de Caracas e Primaz da Venezuela. 03/05/1948.
- source: lia-iatb-noticias-2012
  quote: >-
    Dom Eduardo Mota foi ordenado ao episcopado na ICAB, na Cidade de Brasília, pelo Eminente Dom Luiz Fernando
    Castilho Mendez no dia 23 de março de 1980, portanto exerceu o episcopado por mais de três décadas.
- source: lvc-icab-sucessao-blog
  quote: Diocesano de Cametá – PA em 21/03/1980
- source: lvc-icab-sucessao-blog
  quote: >-
    À frente de cada nome de bispo consta um código, colocado em relação a linhagem de SUCESSÃO APOSTÓLICA de São
    Carlos do Brasil( Dom Carlos Duarte Costa).
- source: lielb-raposo-bio
  quote: Em 28 de Novembro de 1982, recebe a Sagrada Ordenação Episcopal , em Brasília, Brasil
- source: lielb-raposo-bio
  quote: >-
    sendo Co-Consagrantes: Sua Exª Rev.ma D. Bartolomeu Sebastião Vilela, Bispo Coadjutor de Brasília e Vigário
    Geral; e Sua Exª Rev.ma D. Josivaldo Pereira de Oliveira, Bispo Diocesano de Fortaleza.
- source: lielb-plwiki-raposo
  quote: 28 listopada 1982
- source: rta-iae-sucessao
  quote: >-
    D.Luis Fernando Castillo-Mendez, D.Josivaldo Pereira de Oliveira, D.Bartolomeu Sebastião Vilela e D.Rainer Laufers
    sagraram Dom António José da Costa Raposo a 22 de Novembro de 1982
