events:
- type: other
  date: '2007-07-01'
  description: >-
    Consulta Anglicana "Seguindo a Cristo Como Senhor - Na Comunhão, No Pacto e na Missão", realizada em Oxford
    (Inglaterra) de 1 a 6 de julho de 2007, sob patrocínio do Instituto da Comunhão Anglicana e do seminário Wycliffe
    Hall, com 110 participantes de 15 países, entre eles Dom Robinson Cavalcanti, o bispo Peter Beckwith (diocese
    companheira de Springfield) e o bispo Donald Harvey (moderador da Rede da Comunhão Anglicana do Canadá).
  status: confirmed
  sources:
  - source: darb2-breves-13
    quote: >-
      foi um dos 110 participantes, de 15 países convidados da Consulta Anglicana "Seguindo a Cristo Como Senhor
      - Na Comunhão, No Pacto e na Missão", realizada em Oxford, Inglaterra, de 01 a 06 do corrente mês
  - source: darb2-breves-13
    quote: >-
      O Bispo da Diocese Companheira de Springfield, Bispo Peter Beckwith, o Moderador da Rede da Comunhão Anglicana
      do Canadá, Bispo Donald Harvey
  - source: darb2-breves-12
    quote: Dia 01 a 10.07 - Viagem à Inglaterra - quando participará das reuniões do Wicliffe Hall, em Oxford
- type: other
  date: 2007-07
  description: >-
    XXVII Sínodo da Diocese do Recife (julho de 2007) aprova por unanimidade a moção de filiar-se oficialmente à
    Igreja Anglicana do Cone Sul como diocese extraterritorial, sujeita à sua autoridade, constituição e cânones,
    e pede a aceitação; vota emendas canônicas conformes ao Cone Sul; termina com Eucaristia e ordenação de três
    diáconos, com o bispo Peter Beckwith (Diocese de Springfield) como pregador e co-celebrante. Em agosto de 2009
    a diocese se descreve como sob autoridade primacial do Cone Sul
  status: confirmed
  sources:
  - source: darn2-sinodo-cone-sul-2007
    quote: >-
      we deliberate to join, officially, the Church of the Southern Cone, as an extra-territorial diocese, subject
      to its Authority, Constitution and Canons
  - source: darn2-sinodo-cone-sul-2007
    quote: >-
      The house reflected favorable on the last two years in which the diocese has been under the supervision of
      Primate Gregory J. Venables
  - source: darn2-cone-sul-nota-2009
    quote: A Diocese do Recife, hoje sob autoridade primacial da Igreja Anglicana no Cone Sul da Am
  - source: darn2-sinodo-cone-sul-2007
    quote: >-
      The XXVII Synod of the Diocese of Recife voted canonical amendments consonant with the Constitution and Canons
      of the Southern Cone, concluded with a Eucaristic Service, with the ordination of three deacons. Bishop Peter
      Beckwith of the companion diocese of Springfield (TEC) preached and co-celebrated.
- type: other
  date: 2009-11
  description: >-
    A Diocese de Springfield (TEC), liderada pelo bispo Peter Beckwith, renova por unanimidade em seu sínodo o status
    de Diocese Companheira da Diocese do Recife, vínculo de cinco anos; o rev. Maurício Coelho representa a Diocese
    do Recife e oficializa o status de Paróquias Companheiras entre Gravatá (PE) e High Springs (Flórida)
  status: confirmed
  sources:
  - source: darn2-springfield-2009
    quote: >-
      deliberou, por unanimidade, renovar o seu status de Diocese Companheira com a Diocese do Recife, vínculo fraterno
      que já dura há cinco anos
  - source: darn2-springfield-2009
    quote: >-
      Representou a Diocese do Recife naquele evento o reverendo Maurício Coelho , que também oficializou o status
      de Paróquia Companheira entre Gravatá, Pernambuco e High Springs, Flórida
