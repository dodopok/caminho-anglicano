biography: >-
  Peter Hess Beckwith (1939-2019) foi ordenado diácono em 29 de junho de 1964, em Detroit (Michigan), e presbítero
  em 6 de janeiro de 1965, em Plymouth (Michigan), na TEC. Eleito bispo de Springfield em setembro de 1991 e sagrado
  em 1992, foi bispo diocesano de Springfield (Illinois) até 2010; em 2009 a diocese renovou o vínculo de Diocese
  Companheira com a Diocese do Recife. Em 10 de outubro de 2014 foi recebido pelo Colégio de Bispos da ACNA, como
  bispo assistente da Diocese dos Grandes Lagos.
