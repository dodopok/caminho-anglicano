  place: Catedral de Detroit, Michigan
  jurisdiction: tec
  status: probable
  sources:
  - source: rtb-beckwith-oral
    quote: >-
      I was ordained Deacon on the twenty-ninth of June—that’s the Feast of Saint Peter and Saint Paul—in Detroit,
      Michigan, at the cathedral there.
  - source: rtb-beckwith-oral
    quote: I was ordained a deacon and was a deacon for a little over six months
  notes: >-
    O ano (1964) é deduzido: ele diz que foi diácono 'um pouco mais de seis meses' e ordenado presbítero em 6 de
