    quote: The Rev. Peter H. Beckwith, 52, was elected bishop of the Diocese of Springfield on September 14.
  - source: ens-1991-10-04
    quote: If Beckwith accepts the election, he will be consecrated on February 29, 1992.
  - source: ens-rip-beckwith-2019
    quote: >-
      The Rt. Rev. Peter Beckwith, who served as bishop of the Diocese of Springfield in Illinois from 1992 to 2010,
