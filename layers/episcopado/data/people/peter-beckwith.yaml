    quote: >-
      | 872 | [[Peter H. Beckwith]] | [[Edmond L. Browning|630]] [[Herbert Thompson Jr.|829]] [[Frank T. Griswold|794]]
      | 1991 | [[Episcopal Diocese of Springfield|X Springfield]] |
