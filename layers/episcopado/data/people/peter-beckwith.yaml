      161c. Edmond Lee Browning (1959-1997) que, em 1992, sagrou Peter Hess Beckwith como bispo de Springfield.
  notes: >-
    Pôster: Browning "em 1992, sagrou Peter Hess Beckwith como bispo de Springfield". Ano 1992 apoiado pela ENS
