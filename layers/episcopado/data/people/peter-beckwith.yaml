- order: presbyterate
  date: '1965-01-06'
  place: St. John's, Plymouth, Michigan
  jurisdiction: tec
  status: probable
  sources:
  - source: rtb-beckwith-oral
    quote: >-
      Then I was ordained a priest on the sixth of January, the Feast of the Epiphany, in Plymouth, Michigan, where
      I was the Assistant Rector at St. John’s, Plymouth.
  - source: rtb-beckwith-oral
    quote: >-
      I was ordained priest on the sixth, and I was married to Melinda on the tenth of July that same year.
  notes: O entrevistador situa o fato em 1965. Ordenante não informado.
