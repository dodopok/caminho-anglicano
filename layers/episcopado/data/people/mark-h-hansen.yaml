id: mark-h-hansen
name: Mark H. Hansen
biography: >-
  Presbítero (Rev. Dr.) recebido pela Diocese Anglicana do Recife em fevereiro de 2006, a pedido da Rede da Comunhão
  Anglicana dos EUA, para residência canônica e lotação no Arcediagado Norte-Americano; foi reitor da Paróquia de
  St. John.
