id: senomar-teixeira-junior
name: Senomar Teixeira Júnior
aliases:
- Senomar Teixeira
biography: >-
  Advogado (OAB-PE, DF e SP) especialista em Direito Processual Civil, Senomar Teixeira Júnior foi ordenado diácono
  em 10/09/2005 por Filadelfo Oliveira Neto, na Diocese Anglicana do Recife (IEAB), e atuou como advogado da IEAB
  e da diocese. É autor da nota de esclarecimento "A Verdade Canônica na DAR", que defende o amparo canônico das
  medidas da Câmara Episcopal.
