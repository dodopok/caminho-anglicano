events:
- type: other
  date: null
  description: >-
    Nota de esclarecimento 'A Verdade Canônica na DAR', do advogado Senomar Teixeira Júnior, defendendo a base canônica
    da supervisão episcopal decretada para a Diocese Anglicana do Recife e afirmando que quem estiver fora da comunhão
    com a IEAB está fora da Comunhão Anglicana.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      o Dr. Senomar Teixeira, que está acompanhando juridicamente a situação vivida na DAR, divulgou a seguinte
      nota de esclarecimento
    page: '547'
  - source: costa2021
    quote: >-
      Após ser cientificado da decisão, o Bispo Diocesano, Dom Robinson Cavalcanti, expressou não reconhecer a sua
      validade, “por falta de amparo canônico”
    page: '547'
  - source: costa2021
    quote: >-
      Fonte: Bel. Senomar Teixeira Júnior (Advogado, OAB-PE – DF – SP, especialista em Direito Processual Civil,
      seminarista do SAET)
    page: '550'
- type: other
  date: '2005-09-12'
  description: >-
    Em 12 de setembro de 2005, a juíza da 31ª Vara Cível do Recife revogou a liminar com que Robinson Cavalcanti
    pedia a suspensão do XXIV Concílio da Diocese Anglicana do Recife; segundo a nota do Departamento de Comunicação
    da diocese reorganizada pela IEAB, ele não informou à juíza que fora deposto, e decisões anteriores da 16ª Vara
    da Capital e do Tribunal de Justiça de Pernambuco já reconheciam seu afastamento das funções episcopais. A nota
    dá voz ao advogado da diocese, Rev. Senomar Teixeira, e traduz a posição desse lado do conflito.
  status: confirmed
  sources:
  - source: d2s31-liminar
    quote: >-
      a liminar apresentada por Robinson Cavalcanti com o objetivo de suspender o XXIV Concílio da DAR caiu nesta
      segunda-feira, 12 de setembro
  - source: d2s31-liminar
    quote: >-
      que reconheceram sua suspensão e seu afastamento das funções episcopais e de representação como tal da Diocese
      Anglicana do Recife
  - source: d2s31-liminar
    quote: O Bispo Dom Filadelfo Neto é a legítima autoridade da Diocese e tem poderes para convocar Concílios.
