id: frank-tracy-griswold-iii
name: Frank Tracy Griswold III
aliases:
- Dom Frank T. Griswold
- Frank T. Griswold
biography: >-
  Frank Tracy Griswold III foi bispo presidente da Igreja Episcopal dos Estados Unidos. Participou de duas sagrações
  episcopais: a de Peter Beckwith, bispo de Springfield (1992), como co-sagrante, e a de Gene Robinson, bispo de
  New Hampshire (2 de novembro de 2003), como sagrante principal. Em 2004 recebeu carta do primaz da IEAB, Orlando
  Santos de Oliveira, sobre a participação de Robinson Cavalcanti em confirmações na Diocese de Ohio.
sources:
