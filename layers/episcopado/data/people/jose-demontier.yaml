id: jose-demontier
name: José Demontier
biography: >-
  Bispo co-sagrante na sagração da OAFIP de 10/11/2012. Participou de cinco sagrações episcopais, entre elas as
  de Elcemir Durans Mendonça e Reinaldo da Silva Tavares, em 2012.
