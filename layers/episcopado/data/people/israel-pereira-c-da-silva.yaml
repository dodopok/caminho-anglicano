id: israel-pereira-c-da-silva
name: Israel Pereira C. da Silva
biography: >-
  Israel Pereira Cardoso da Silva, OSF, foi presbítero da Diocese Anglicana do Recife (IEAB) e pároco da Paróquia
  Anglicana Boas Novas. Em 2004 está entre os clérigos relacionados em decreto da IEAB que considera a solicitação
  desses clérigos. Aparece como guardião da Ordem de São Francisco (Fraternidade Paraíba) e como membro da Comissão
  de Novas Paróquias e Missões da diocese.
