biography: >-
  Frederick Cornwallis foi sagrado em 19 de fevereiro de 1750, em Lambeth, pelo arcebispo Thomas Herring, para a
  diocese de Lichfield, e em 1768 foi transferido para a sé de Cantuária, da qual foi arcebispo até sua morte, em
  19 de março de 1783.
