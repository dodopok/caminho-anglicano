  notes: >-
    Primeira mulher ordenada na IEAB. Ordenante e local não informados nestas fontes. Participaram os bispos Cláudio
    Gastal e Plínio Simões. O texto chama Olavo de "Bispo Primaz" em 1985 (era primaz interino após a morte de Kratz).
    Dois textos independentes (um norte-americano de 1986, outro de Oswaldo Kickhöfel) nomeiam Olavo Ventura Luiz
    como bispo ordenante. Kickhöfel acrescenta que os bispos Cláudio Gastal e Plínio Lauer Simões o coadjuvaram.
    Relato autobiográfico da própria ordenada, publicado no livro comemorativo dos 35 anos de ordenação de mulheres
    na IEAB. Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante
    não informado. Primeira mulher ordenada na IEAB. Participaram também os bispos Cláudio Gastal e Plínio Lauer
    Simões. Trecho citado pela tese de KICKHÖFEL, Notas para uma História da IEAB (1995), p. 319. Participaram também
    os bispos Gastal e Simões.
