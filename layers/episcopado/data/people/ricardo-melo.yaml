# yaml-language-server: $schema=../../schemas/person.json
id: ricardo-melo
name: Ricardo Melo
biography: >-
  Ricardo Antônio da Silva Melo foi ordenado diácono em 16 de junho de 2007 e presbítero em fevereiro de 2008, ambas
  as vezes por Robinson Cavalcanti, na Diocese Anglicana do Recife. Nessa diocese atuou como ministro auxiliar,
  integrou a Equipe Pastoral e a comissão de credenciais e diplomacia e foi secretário diocesano de educação.
sources:
- source: drp2-ord-diac-2007-06-16
  quote: 'Sermão de Ordenação Diaconal de: Dinamérico Wanderley, Fábio Rego, João Peixoto e Ricardo Melo'
- source: drp2-ord-diac-2007-06-16
  quote: >-
    Dom Robinson Cavalcanti, ose Bispo Diocesano Catedral Anglicana do Bom Samaritano Recife (PE), 16 de junho de
    2007.
- source: drp2-breves-01-2008
