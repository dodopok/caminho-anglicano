id: raniere-almeida-de-oliveira
name: Raniere Almeida de Oliveira
biography: >-
  Foi ordenado diácono em 27 de dezembro de 2003, na Paróquia Anglicana Emanuel, em Olinda, e presbítero em 4 de
  dezembro de 2004, durante o XXIV Concílio Diocesano, ambas as vezes pelo bispo Robinson Cavalcanti, na Diocese
  Anglicana do Recife. Atuou na Paróquia Anglicana do Semeador, foi ministro auxiliar e, em documentos de 2007,
  aparece como secretário diocesano de educação. Em 23 de agosto de 2005 foi excluído da comunhão da IEAB e, por
  consequência, das Sagradas Ordens, com outros clérigos que, em carta, declararam manter plena comunhão com o bispo
  diocesano Robinson Cavalcanti. Depois disso continuou a constar como clérigo da Diocese Anglicana do Recife.
