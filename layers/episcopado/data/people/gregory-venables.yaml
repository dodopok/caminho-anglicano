- type: other
  date: '2005-10-12'
  description: >-
    O primaz Orlando Santos de Oliveira protesta junto ao primaz do Cone Sul, Gregory Venables, contra o acolhimento
    do "bispo deposto" e de clerigos depostos da Diocese do Recife (carta de 12/10/2005).
  status: confirmed
  sources:
  - source: orlando-venables-2005
    quote: >-
      Lamento profundamente vossa carta, reconhecendo e acolhendo para supervisão o bispo deposto e um grupo de
      clérigos depostos que pertenceram à Diocese Anglicana do Recife.
- type: other
  date: '2005-10-12'
  description: >-
    Carta oficial do primaz da IEAB a Gregory Venables (Cone Sul) protestando contra a acolhida, sob supervisão
    do Cone Sul, do bispo deposto Robinson Cavalcanti e de um grupo de clérigos depostos da Diocese do Recife; afirma
    que a deposição se deu por processo canônico no Tribunal Superior Eclesiástico
  status: confirmed
  sources:
  - source: ieab-2005-carta-venables
    quote: Lamento profundamente vossa carta, reconhecendo e acolhendo para supervisão o bispo
  - source: ieab-2005-carta-venables
    quote: deposto e um grupo de clérigos depostos que pertenceram à Diocese Anglicana do Recife.
  - source: ieab-2005-carta-venables
    quote: foi condenado pelo Tribunal Superior Eclesiástico
- type: other
  date: '2005'
  description: >-
    A Câmara dos Bispos da IEAB declara que 32 clérigos da Diocese do Recife, solidários com Robinson Cavalcanti,
    incorreram em abandono da comunhão da Igreja segundo os cânones provinciais, e protesta contra seu acolhimento
    pelo arcebispo Gregory Venables (Cone Sul)
  status: confirmed
  sources:
  - source: ieab-2005-cbispos-cantuaria
    quote: >-
      Quanto aos 32 clérigos que foram alegadamente condenados sem julgamento prévio, alertamos para o fato de que
      nossos Cânones
  - source: ieab-2005-cbispos-cantuaria
    quote: Provinciais prevêem o abandono da comunhão da Igreja.
  - source: ieab-2005-cbispos-cantuaria
    quote: >-
      Recebemos uma resposta coletiva de que todos estavam solidários com a atitude de Robinson Cavalcanti.
  - source: ieab-2005-cbispos-cantuaria
    quote: Brasil recebendo Robinson Cavalcanti e os 32 clérigos dissidentes, de forma unilateral.
- type: other
  date: '2005-11-14'
  description: >-
    Em 2005 a Câmara dos Bispos da IEAB apresentou ao arcebispo de Cantuária (carta de 14/11/2005, assinada por
    doze bispos) a versão de que a deposição de Robinson Cavalcanti decorreu de julgamento do Tribunal Superior
    Eclesiástico, homologado unanimemente pela Câmara, e de que os 32 clérigos incorreram em abandono da comunhão;
    criticou a recepção do bispo por Gregory Venables (Cone Sul).
  status: confirmed
  sources:
  - source: drv-pronunciamento-ieab-2005
    quote: acatou e homologou unanimemente a decisão do Tribunal
  - source: drv-pronunciamento-ieab-2005
    quote: nossos Cânones Provinciais prevêem o abandono da comunhão da Igreja
  - source: drv-pronunciamento-ieab-2005
    quote: É a primeira vez na história da IEAB que isso acontece.
- type: other
  date: null
  description: >-
    Festividades dos 30 anos da Diocese do Recife em 19-20 de maio de 2006, com jantar e culto de ação de graças
    na Paróquia Anglicana do Espírito Santo; pregou o bispo Donald Harvey (Rede da Comunhão Anglicana, Canadá),
    representante pessoal do primaz Gregory Venables.
  status: confirmed
  sources:
  - source: drv-breves-episcopais-07
    quote: Aconteceram nos dias 19 e 20 próximos passados, as festividades do aniversário da nossa Diocese.
  - source: drv-breves-episcopais-07
    quote: o representante pessoal do nosso Primaz, Revmo. Bispo Gregório J. Venables
- type: other
  date: '2007-07-14'
  description: >-
    Em 14/07/2007 o clero da Diocese do Recife, reunido em retiro, escreve ao primaz do Cone Sul, Gregory Venables,
    agradecendo o 'gesto histórico' de colocá-los sob sua autoridade e proteção e de reconhecer suas ordens, queixando-se
    da criação de uma 'diocese paralela' para o Nordeste e pedindo visita do primaz, status de observadores no Sínodo
    e autorização para eleger bispos sufragâneos e depois um coadjutor.
  status: confirmed
  sources:
  - source: drv-carta-clero-primaz
    quote: >-
      a nossa mais profunda gratidão por seu gesto histórico de nos colocar sob sua autoridade e proteção, reconhecendo
      as nossas Ordens e Ministérios
  - source: drv-carta-clero-primaz
    quote: a mesma cria uma Diocese paralela para o Nordeste do Brasil, nomeando um Bispo concorrente
  - source: drv-carta-clero-primaz
    quote: >-
      Autorização para que possamos proceder as eleições, dentro dos devidos procedimentos, de Bispos Sufragâneos,
      e, posteriormente, de um Bispo Coadjutor
- type: other
  date: '2007-11-12'
  description: >-
    Comunicado de 12/11/2007: o Sínodo da Igreja Anglicana do Cone Sul, por seis delegações diocesanas (uma abstenção),
    recomendou à Câmara dos Bispos e ao Conselho Executivo as medidas para a recepção permanente da Diocese do Recife;
    o primaz pretendia visitar o Recife em fevereiro de 2008.
  status: confirmed
  sources:
  - source: drv-comunicado-episcopal-2007
    quote: >-
      deliberou recomendar à Câmara dos Bispos e ao Conselho Executivo que sejam tomadas as medidas Constitucionais,
      Canônicas e Administrativas cabíveis visando à recepção permanente da Diocese do Recife
- type: other
  date: '2008-09-09'
  description: >-
    Em 09/09/2008, após a conferência Crescendo Juntos (Buenos Aires), Robinson relata que o primaz Gregory Venables
    reiterou apoio e admitiu vínculo a outra província do GAFCON caso houvesse dificuldade no Cone Sul, com provável
    fórmula de diocese extraprovincial; relata também sugestão de um bispo de eliminar dos cânones diocesanos a
    possibilidade de ordenar mulheres ao episcopado.
  status: confirmed
  sources:
  - source: drv-informe-confidencial-2008
    quote: O Primaz reiterou o seu apoio irrestrito à nossa Diocese
  - source: drv-informe-confidencial-2008
    quote: eliminássemos dos nossos Cânones a possibilidade de Ordenação de mulheres ao Episcopado
- type: other
  date: 2005-09
  description: Venables estende sua supervisão arquiepiscopal à Diocese do Recife após a saída desta da IEAB
  status: probable
  sources:
  - source: ink-venables-2016
    quote: >-
      in September 2005 extended his archiepiscopal oversight to the Diocese of Recife after it withdrew from the
      Anglican Episcopal Church of Brazil.
- type: other
  date: '2008-03-27'
  description: >-
    Venables visita a Diocese do Recife (27/03–01/04/2008); a Câmara dos Bispos da IEAB, em Curitiba (declaração
    de 09/04/2008), repudia a visita como violação da autonomia provincial e do Relatório de Windsor.
  status: confirmed
  sources:
