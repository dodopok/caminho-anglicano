biography: >-
  Primaz da Igreja Anglicana do Cone Sul da América; recebeu o clero da Diocese Anglicana do Recife sob sua autoridade
  em setembro/outubro de 2005 e enviou mensagem ao XXVI Concílio em dezembro de 2006.
