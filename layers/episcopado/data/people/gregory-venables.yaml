    page: '563'
  - source: costa2021
    quote: Porto Alegre, 12 de outubro de 2005.
    page: '563'
  - source: costa2021
    quote: oficialmente protestamos e repudiamos essa ação de ingerência em nossa jurisdição.
    page: '565'
- type: other
  date: '2005-09-23'
  description: >-
    O Cone Sul (Primaz Gregory Venables) aceitou o pedido de supervisão primacial de Robinson, reconhecendo as ordens
    do bispo e do clero desligados e exercendo jurisdição extra-provincial sobre eles; Rowan Williams não atendera
    ao pedido.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Todavia, em 23 de setembro de 2005, a Igreja Anglicana do Cone Sul, por meio do seu Primaz, o bispo Gregory
      Venables, aceitou o pedido, criando uma estrutura canônica para acolher os clérigos excomungados, passando
      a exercer jurisdição extra-provincial dentro de seu ministério.
    page: '225'
