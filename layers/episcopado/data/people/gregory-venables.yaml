    após decisão do arcebispo Gregory Venables com apoio dos bispos do Sul Global, e que o Conselho Diocesano apoiou
    essa decisão; afirma vir de uma diocese que "teve o seu Bispo cassado" pela liderança provincial.
  status: confirmed
  sources:
