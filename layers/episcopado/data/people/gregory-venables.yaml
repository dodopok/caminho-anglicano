- type: other
  date: '2005-10-12'
  description: >-
    Carta oficial do primaz da IEAB a Gregory Venables (Cone Sul) protestando contra a acolhida, sob supervisão
    do Cone Sul, do bispo deposto Robinson Cavalcanti e de um grupo de clérigos depostos da Diocese do Recife; afirma
    que a deposição se deu por processo canônico no Tribunal Superior Eclesiástico
  status: confirmed
  sources:
  - source: ieab-2005-carta-venables
    quote: Lamento profundamente vossa carta, reconhecendo e acolhendo para supervisão o bispo
  - source: ieab-2005-carta-venables
    quote: deposto e um grupo de clérigos depostos que pertenceram à Diocese Anglicana do Recife.
  - source: ieab-2005-carta-venables
    quote: foi condenado pelo Tribunal Superior Eclesiástico
- type: other
  date: '2005'
  description: >-
    A Câmara dos Bispos da IEAB declara que 32 clérigos da Diocese do Recife, solidários com Robinson Cavalcanti,
    incorreram em abandono da comunhão da Igreja segundo os cânones provinciais, e protesta contra seu acolhimento
    pelo arcebispo Gregory Venables (Cone Sul)
  status: confirmed
  sources:
  - source: ieab-2005-cbispos-cantuaria
    quote: >-
      Quanto aos 32 clérigos que foram alegadamente condenados sem julgamento prévio, alertamos para o fato de que
      nossos Cânones
  - source: ieab-2005-cbispos-cantuaria
    quote: Provinciais prevêem o abandono da comunhão da Igreja.
  - source: ieab-2005-cbispos-cantuaria
    quote: >-
      Recebemos uma resposta coletiva de que todos estavam solidários com a atitude de Robinson Cavalcanti.
  - source: ieab-2005-cbispos-cantuaria
    quote: Brasil recebendo Robinson Cavalcanti e os 32 clérigos dissidentes, de forma unilateral.
- type: other
  date: '2005-09-24'
  description: >-
    Segundo o requerimento-modelo distribuído às paróquias e missões, a Diocese Anglicana do Recife vivia em outubro
    de 2005 uma suspensão do Bispo Diocesano Robinson Cavalcanti pelo Primaz da IEAB, Orlando Santos de Oliveira
    (processo canônico 001/2005); uma "excomunhão" dos clérigos da DAR pelo Bispo Sufragâneo Filadelfo Oliveira
    Neto (Decreto Diocesano nº 001/2005); e o acolhimento de Robinson e de todo o clero pelo Primaz do Cone Sul,
    Gregory J. Venables, a partir de 24/9/2005, em "status de acolhimento extraprovincial" até decisão do Painel
    de Referência.
  status: confirmed
  sources:
  - source: drp-requerimento-age-2005
    quote: >-
      em virtude da suspensão imposta ao Bispo Diocesano da DAR, Revmo. Dom Edward Robinson de Barros Cavalcanti
      pelo Bispo Primaz da IEAB, Revmo. Orlando Santos de Oliveira, conforme processo canônico 001/2005
  - source: drp-requerimento-age-2005
    quote: >-
      em virtude da excomunhão dos clérigos da DAR pelo Bispo Sufragâneo da DAR, Revmo. Filadelfo Oliveira Neto,
      conforme Decreto Diocesano nº001/2005
  - source: drp-requerimento-age-2005
    quote: >-
      recebendo o Bispo Robinson e todo o Clero da DAR sob seu ministério pastoral, a partir do dia 24 de setembro
      de 2005, criando um status de acolhimento extraprovincial
- type: other
  date: '2005-10-17'
  description: >-
    Carta de 40 clérigos da Diocese do Recife ao Arcebispo Gregory Venables, Primaz do Cone Sul, agradecendo sua
    decisão de tê-los sob sua autoridade; a notícia fora anunciada pelo Rev. Bill Atwood em culto na Catedral do
    Bom Samaritano e a carta cita a conferência "Crescendo Juntos".
  status: confirmed
  sources:
  - source: drp-carta-venables-pt-2005
    quote: >-
      Nós, 40 clérigos da Diocese do Recife queremos manifestar a nossa gratidão a V.Revma., por sua decisão de
      nos ter sob a sua autoridade.
  - source: drp-carta-venables-pt-2005
    quote: Quando o Rev. Bill Attwood anunciou a notícia em um culto na Catedral do Bom Samaritano
  - source: drp-carta-venables-en-2005
    quote: >-
      We, the 40 clergy from the diocese of Recife want to manifest our gratitude to you for the decision to have
      us under your authority.
- type: other
  date: 2006-12
  description: >-
    Mensagem do Primaz do Cone Sul, Gregory J. Venables, ao XXVI Concílio da Diocese do Recife (dezembro de 2006),
    no papel timbrado "Diocese do Recife – Comunhão Anglicana, sob Autoridade Primacial da Igreja Anglicana do Cone
