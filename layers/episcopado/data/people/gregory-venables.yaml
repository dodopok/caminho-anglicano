biography: >-
  Gregory Venables foi sagrado bispo em novembro de 1993, como bispo auxiliar do Peru e Bolívia, e é primaz da Igreja
  Anglicana do Cone Sul da América; uma fonte o indica também como primeiro bispo da Bolívia, em 1995. Em 23 de
  setembro de 2005 aceitou o pedido de supervisão primacial de Robinson Cavalcanti, reconhecendo as ordens do bispo
  e do clero que haviam deixado a Diocese Anglicana do Recife e passando a exercer jurisdição extraprovincial sobre
  eles; em 12 de outubro de 2005 o primaz da IEAB, Orlando Santos de Oliveira, protestou por carta contra essa acolhida.
  No mesmo mês, 40 clérigos do Recife lhe agradeceram por carta, e o encontro Sul-Sul no Egito apoiou sua ação.
  Em maio de 2006 foi representado pelo bispo Donald Harvey nos 30 anos da diocese e, em dezembro, enviou mensagem
  ao XXVI Concílio. O XXVII Sínodo do Recife aprovou, em julho de 2007, a filiação ao Cone Sul como diocese extraterritorial,
  e o Sínodo do Cone Sul recomendou, em novembro, a recepção permanente da diocese. Visitou o Recife de 27 de março
  a 1º de abril de 2008, e a Câmara dos Bispos da IEAB repudiou a visita. Em 2009, na fundação da ACNA, foi anunciada
  a passagem das comunidades sob sua autoridade à supervisão da ACNA. Em abril de 2010 foi eleito presidente do
  Conselho dos Primazes do GAFCON/FCA.
