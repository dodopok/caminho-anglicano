  status: confirmed
  sources:
  - source: drp-mensagem-primaz-2006
    quote: XXVI Concílio da Diocese do Recife
  - source: drp-mensagem-primaz-2006
    quote: Revmo. Gregory J. Venables
  - source: drp-mensagem-primaz-2006
