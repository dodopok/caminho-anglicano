    em virtude da suspensão imposta ao Bispo Diocesano da DAR, Revmo. Dom Edward Robinson de Barros Cavalcanti pelo
    Bispo Primaz da IEAB, Revmo. Orlando Santos de Oliveira, conforme processo canônico 001/2005
- source: drp-requerimento-age-2005
  quote: >-
    em virtude da excomunhão dos clérigos da DAR pelo Bispo Sufragâneo da DAR, Revmo. Filadelfo Oliveira Neto, conforme
    Decreto Diocesano nº001/2005
