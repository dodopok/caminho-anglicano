- type: other
  date: 2006-10
  description: >-
    Boletim de oração (out/nov de 2006) pede orações pelo Primaz Gregory Venables, pela Província do Cone Sul e
    pelo "fortalecimento dos vínculos com a Diocese do Recife", e pelo companheirismo com a "Diocese de Springfield".
  status: confirmed
  sources:
  - source: drp-boletim-oracao-2006
    quote: >-
      Orar pelo Revmo. Bispo Primaz Gregory Venables; pela Província do Cone Sul da América; pela sua família e
