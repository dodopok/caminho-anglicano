events:
- type: other
  date: '2008-04-03'
  description: >-
    Camara dos Bispos da IEAB (Curitiba, carta de 03/04/2008, divulgada 09/04/2008) repudia visita do arcebispo
    Gregory Venables (Cone Sul) ao Recife.
  status: confirmed
  sources:
  - source: ens-040908-04
    quote: >-
      The House of Bishops of the Episcopal Anglican Church of Brazil gathered in Curitiba unanimously express their
