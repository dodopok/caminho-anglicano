    quote: PITTSBURGH, PA, 10 a 12 de novembro de 2005
  - source: darb2-pittsburgh-2005
    quote: Venho de uma Diocese que teve o seu Bispo cassado
  - source: darb2-pittsburgh-2005
    quote: >-
      Nosso clero e nosso laicato têm convictamente apoiado o Bispo e o Conselho Diocesano em sua decisão de receber
      clérigos e congregações discriminadas e perseguidas desse país
  - source: darb2-pittsburgh-2005
    quote: >-
      agora sob a autoridade primacial da Igreja Anglicana do Cone Sul da América , após a decisão corajosa do Arcebispo
