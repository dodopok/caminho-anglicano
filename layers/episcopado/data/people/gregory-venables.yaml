    quote: >-
      Between March 27 and April 1, Archbishop of the Southern Cone, Greg Venables, visited the Diocese of Recife
      in Brazil.
  - source: ta-2008-04-10-ieab-bishops
    quote: >-
      The House of Bishops of the Episcopal Anglican Church of Brazil gathered in Curitiba unanimously express their
      strong repudiation of the recent visit by the Archbishop of the Southern Cone to the city of Recife
- type: other
  date: '2005-10-12'
  description: >-
    Carta do Primaz da IEAB, Orlando Santos de Oliveira, ao Primaz do Cone Sul, Gregory Venables, em nome da Câmara
    dos Bispos e do clero e laicato da IEAB, protestando contra a carta em que Venables reconheceu e acolheu para
