- type: other
  date: '2007-07-14'
  description: >-
    Em 14/07/2007 o clero da Diocese do Recife, reunido em retiro, escreve ao primaz do Cone Sul, Gregory Venables,
    agradecendo o 'gesto histórico' de colocá-los sob sua autoridade e proteção e de reconhecer suas ordens, queixando-se
    da criação de uma 'diocese paralela' para o Nordeste e pedindo visita do primaz, status de observadores no Sínodo
    e autorização para eleger bispos sufragâneos e depois um coadjutor.
  status: confirmed
  sources:
  - source: drv-carta-clero-primaz
    quote: >-
      a nossa mais profunda gratidão por seu gesto histórico de nos colocar sob sua autoridade e proteção, reconhecendo
      as nossas Ordens e Ministérios
  - source: drv-carta-clero-primaz
    quote: a mesma cria uma Diocese paralela para o Nordeste do Brasil, nomeando um Bispo concorrente
  - source: drv-carta-clero-primaz
    quote: >-
      Autorização para que possamos proceder as eleições, dentro dos devidos procedimentos, de Bispos Sufragâneos,
      e, posteriormente, de um Bispo Coadjutor
- type: other
  date: '2007-11-12'
  description: >-
    Comunicado de 12/11/2007: o Sínodo da Igreja Anglicana do Cone Sul, por seis delegações diocesanas (uma abstenção),
    recomendou à Câmara dos Bispos e ao Conselho Executivo as medidas para a recepção permanente da Diocese do Recife;
