    quote: D Dec 55 Bp Krischke P Oct 56 Bp Simoes
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1955 - … João Assis dos Reis
    page: '370'
  notes: >-
    Ordenante no diretório: 'Bp Krischke'. Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato
    (Kickhöfel, 1995); ordenante não informado.
