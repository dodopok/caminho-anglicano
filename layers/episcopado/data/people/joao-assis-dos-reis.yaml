id: joao-assis-dos-reis
name: João Assis dos Reis
full_name: João Assis dos Reis
aliases:
- Joao Assis Reis
- REIS, JOAO ASSIS
biography: >-
  Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra) segundo o Clerical Directory 1965. Ordenado diácono
  em dez/1955 e presbítero em out/1956. Transferido para a Igreja Episcopal do Brasil em 25/04/1965 (Clerical Directory
  1968).
sources:
- source: cd1965
  quote: REIS, JOAO ASSIS (SwBra)
- source: cd1968
  quote: RE IS, Joao Assis (SwBra) Trans to Brazil Ch 25 Apr 65.
ordinations:
