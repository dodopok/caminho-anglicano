  notes: >-
    Local: Arcediagado Sul/Sudeste. Arcediago do Sul/Sudeste em 2010-04-09 e em 2011-07-23. Local: Arcediagado Sul-Sudeste.
    Cargo atestado em 14/10/2009, 08/05/2011 e 25/08/2011. Local: Arcediagado Extraterritorial Nacional Sul/Sudeste.
    Lista de arcediagos e adjuntos na página "Comunidades" capturada em 13/10/2009 e nas páginas de cada arcediagado
    capturadas em 09/10/2010; início e fim dos cargos não informados. Em 2012 (captura de 02/03/2012) o mesmo arcediago
    e o mesmo adjunto constam com o nome "Arcediagado Sul-Sudeste". Local: Arcediagado Extraterritorial Sul/Sudeste
    do Brasil. Consta na lista de "Cargos Diocesanos" capturada em jan/2009 e na de jul/2009 (atualizada em 28/09/2010);
    a página não informa a data de início. Local: Arcediagado Missionário Brasil Sul-Sudeste. Arcediago do novo
    Arcediagado (sub-região eclesiástica) do Sul e Sudeste do Brasil, cuja criação foi homologada no XXVIII Concílio
    Diocesano (dezembro de 2008). Local: Arcediagado Sul-Sudeste. Com o título de Venerável Arcediago Sul-Sudeste
    do Brasil em outubro e novembro de 2010. Em exercício em novembro de 2010: a página capturada em 15/11/2010
    lista matéria assinada pelo Ven. Arc. Rev. Carlos Alberto Chaves Fernandes; o arcediagado não é indicado nessa
    página. Local: Arcediagado Extraterritorial Sul-Sudeste; Paróquia Anglicana da Santíssima Trindade (Rio de Janeiro-RJ).
    Em exercício em outubro de 2010, conforme a mensagem publicada em 05/10/2010 no site da Diocese do Recife; signatário
    da mensagem do Arcediagado Extraterritorial Sul-Sudeste Local: Arcediagado Sul/Sudeste. Em exercício em 30 de
    março de 2010; assina a homenagem do Arcediagado Sul/Sudeste com o Rev. Ivo Oliveira. Em relato de outubro de
    2009, o arcediago do Sul/Sudeste é citado apenas como 'Rev. Beto'. Local: Arcediagado Sul-Sudeste. Arcediago
    Sul-Sudeste em setembro e outubro de 2010; o título completo na mensagem é "Arcediagado Extra-territorial Sul-Sudeste".
    Em exercício em dezembro de 2010 (banner da 3ª Assembleia Arcediagal Sul-Sudeste, anunciada para 06 a 08/05/2011,
    em Mogi das Cruzes-SP). Local: Arcediagado Sul-Sudeste. Em exercício de abr a dez/2010: arcediago na 2ª Assembleia
    Arcediagal (São José do Rio Preto, 30/04/2010), nota biográfica de 18/11/2010 e anúncio da 3ª Assembleia (mai/2011).
    Local: Arcediagado Sul/Sudeste. Cargo para 2011 constante da relação de cargos diocesanos publicada em 10/12/2010
    (captura de dez/2010), após o XXX Concílio Diocesano. Local: Arcediagado Sul/Sudeste. Em exercício em 25/06/2010.
    Local: Arcediagado Sul/Sudeste. Cargo constante da Relação dos Cargos Diocesanos 2011, publicada em 10/12/2010
    (captura de 28/12/2010); designação para o exercício de 2011.
