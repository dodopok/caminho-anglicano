- Ven. Arc. Rev. Carlos Alberto
biography: >-
  Ordenado diácono (MOA) em 10/02/2008 em Maceió-AL; em 2010 'Ven. Arc. Rev.' na lista de presbíteros da Diocese
  do Recife.
sources:
- source: dar-2008-sermao-carlos-alberto
  quote: >-
    Sermão de Ordenação Diaconal (MOA) de Carlos Alberto Chaves Fernandes Ponto Missionário Anglicano da Santíssima
    Trindade Maceió (AL), 10 de fevereiro de 2008
- source: dar-clero-presbiteros-2010
  quote: Ven. Arc. Rev. Carlos Alberto Chaves Fernandes
