- type: other
  date: '2009-07-31'
  description: >-
    O bispo diocesano Robinson Cavalcanti dá posse, em 31/07/2009, à Comissão Especial de Assessoria Institucional,
    criada por recomendação do Encontro do Clero para encaminhar um status estável da Diocese do Recife na Comunhão
    Anglicana; integram-na Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente do Conselho
    Diocesano) e os arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório e Carlos Alberto
    Fernandes
  status: confirmed
  sources:
  - source: darn2-comissao-2009
    quote: >-
      o Bispo Diocesano, Dom Robinson Cavalcanti, deu posse à Comissão Especial de Assessoria Institucional criada
      por recomendação do recente Encontro do Clero, visando os encaminhamentos necessários a um status estável
      para a Diocese do Recife na Comunhão Anglicana
  - source: darn2-comissao-2009
    quote: >-
      Integram essa comissão os reverendos Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente
      do Conselho Diocesano) e os Arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório
      e Carlos Alberto Fernandes
- type: other
