- type: other
  date: 2008-12
  description: >-
    O XXVIII Concílio Diocesano da Diocese do Recife (Jaboatão dos Guararapes, dezembro de 2008) homologou a criação
    de um Arcediagado para as comunidades do Sul e Sudeste do Brasil vinculadas à diocese, com o Rev. Carlos Alberto
    Chaves Fernandes (Rio de Janeiro) como arcediago; o território histórico da diocese é o Nordeste (9 estados),
    mas os cânones permitem incluir comunidades de outras regiões por necessidade missionária. Durante os quatro
    anos anteriores existiu um Arcediagado Norte-Americano (comunidades da Flórida, Oregon e Washington), vinculado
    provisoriamente ao Recife.
