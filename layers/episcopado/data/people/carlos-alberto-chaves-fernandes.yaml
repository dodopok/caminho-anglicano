- type: other
  date: '2009-07-31'
  description: >-
    O bispo diocesano Robinson Cavalcanti dá posse, em 31/07/2009, à Comissão Especial de Assessoria Institucional,
    criada por recomendação do Encontro do Clero para encaminhar um status estável da Diocese do Recife na Comunhão
    Anglicana; integram-na Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente do Conselho
    Diocesano) e os arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório e Carlos Alberto
    Fernandes
  status: confirmed
  sources:
  - source: darn2-comissao-2009
    quote: >-
      o Bispo Diocesano, Dom Robinson Cavalcanti, deu posse à Comissão Especial de Assessoria Institucional criada
      por recomendação do recente Encontro do Clero, visando os encaminhamentos necessários a um status estável
      para a Diocese do Recife na Comunhão Anglicana
  - source: darn2-comissao-2009
    quote: >-
      Integram essa comissão os reverendos Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente
      do Conselho Diocesano) e os Arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório
      e Carlos Alberto Fernandes
- type: other
  date: '2010-11-28'
  description: >-
    Culto inaugural do Ponto Missionário Anglicano Cristo Rei, em Santo André (SP), com o arcediago Sul-Sudeste,
    o arcediago adjunto e os clérigos do ponto missionário; a mensagem episcopal do bispo Robinson Cavalcanti foi
    lida na programação
  status: confirmed
  sources:
  - source: darn2-santo-andre-2010
    quote: >-
      Aconteceu hoje (28/11), às 10h30, o Culto Inaugural do Ponto Missionário Anglicano Cristo Rei , em Santo André-SP
  - source: darn2-santo-andre-2010
    quote: >-
      Estiveram presentes o Venerável Arcediago Sul-Sudeste, Rev. Carlos Alberto ( Paróquia Anglicana da Santíssima
      Trindade ), o Arcediago Adjunto, Rev. Ivo Oliveira ( PMA da Transfiguração )
- type: other
  date: '2007-09-16'
  description: >-
    Em 16/09/2007 Robinson Cavalcanti presidiu, na Paróquia Anglicana Reformada (Copacabana, Rio de Janeiro), culto
    eucarístico em que o Rev. Carlos Alberto Chaves Fernandes e mais 65 pessoas foram confirmados e quatro seminaristas
    foram instalados como evangelistas; a comunidade é descrita como a mais nova da Diocese do Recife, sob supervisão
    primacial do Cone Sul.
  status: confirmed
  sources:
  - source: darl3-n4227
    quote: >-
      é a mais nova Comunidade Anglicana da Diocese do Recife - Comunhão Anglicana, sob Supervisão Primacial da
      Igreja do Cone Sul da América
  - source: darl3-n4227
    quote: >-
      quando o Rev. Carlos Alberto Chaves Fernandes ( veja foto à esquerda ) e mais 65 pessoas participarão do Culto
      Eucarístico e serão Confirmados
- type: other
  date: 2008-12
  description: >-
    O XXVIII Concílio Diocesano da Diocese do Recife (Jaboatão dos Guararapes, dezembro de 2008) homologou a criação
    de um Arcediagado para as comunidades do Sul e Sudeste do Brasil vinculadas à diocese, com o Rev. Carlos Alberto
    Chaves Fernandes (Rio de Janeiro) como arcediago; o território histórico da diocese é o Nordeste (9 estados),
    mas os cânones permitem incluir comunidades de outras regiões por necessidade missionária. Durante os quatro
    anos anteriores existiu um Arcediagado Norte-Americano (comunidades da Flórida, Oregon e Washington), vinculado
    provisoriamente ao Recife.
  status: confirmed
  sources:
  - source: darl3-n4622
    quote: >-
      O XXVIII Concílio da Diocese do Recife homologou a criação de um Arcediagado (sub-região eclesiástica) para
      coordenar as comunidades das regiões sul e sudeste do Brasil que a ela estão vinculadas
  - source: darl3-n4622
    quote: >-
      Durante os últimos quatro anos existiu um Arcediagado Norte-Americano para as comunidades dos Estados da Flórida,
      Oregon e Washington que estão vinculadas provisoriamente ao Recife
- type: other
