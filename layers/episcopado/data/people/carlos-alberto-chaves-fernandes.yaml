    quote: >-
      Ordenou dois Diáconos: Rev. Ivo Xavier, Mogi das Cruzes, SP e Rev. Carlos Alberto, Rio de Janeiro, Rj;
  notes: >-
    Sermão do bispo diocesano Robinson Cavalcanti publicado na seção 'Bispo – Sermões' do site da Diocese; presidência
    da ordenação inferida do sermão episcopal. 'MOA' = Ministério Ordenado Auxiliar (cânon diocesano). Em 2010 já
    'Ven. Arc. Rev.' (presbítero e arcediago). Ministro vindo da Igreja Presbiteriana; o sermão o chama de 'Rev.'
    e explica a ordenação como integração ao anglicanismo. '(MOA)' no título não é explicado. Ordenação ocorrida
    entre 03/01 e 11/02/2008; o texto identifica o ordenando como 'Rev. Carlos Alberto, Rio de Janeiro, Rj'.
