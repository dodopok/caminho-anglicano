id: carlos-alberto-chaves-fernandes
name: Carlos Alberto Chaves Fernandes
aliases:
- Ven. Arc. Rev. Carlos Alberto
biography: >-
  Egresso do presbiterianismo, foi confirmado em 16 de setembro de 2007 em Copacabana (Rio de Janeiro), em comunidade
  da Diocese do Recife. Segundo os registros, foi ordenado diácono (MOA) em 10 de fevereiro de 2008, em Maceió (AL),
  e presbítero em 2 de agosto de 2008, no Rio de Janeiro, por Robinson Cavalcanti. Pároco da Paróquia Anglicana
  da Santíssima Trindade, em Copacabana, foi arcediago do Sul-Sudeste a partir de dezembro de 2008, esteve na primeira
  assembleia arcediagal, em Bandeirantes (PR), em 2009 e esteve no culto inaugural do ponto missionário Cristo Rei,
  em Santo André (SP), em 2010. É frei da Ordem Franciscana Anglicana.
