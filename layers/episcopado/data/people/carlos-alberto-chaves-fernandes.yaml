    José do Rio Preto (SP), aberta por celebração eucarística dirigida pelo arcediago Carlos Alberto Fernandes e
    pelo vigário geral Maurício Amazonas; o bispo Robinson Cavalcanti pregou, com palestra sobre a conjuntura anglicana,
    e houve reunião com aspirantes, postulantes e candidatos às Sagradas Ordens no "Ano das Vocações"
  status: confirmed
