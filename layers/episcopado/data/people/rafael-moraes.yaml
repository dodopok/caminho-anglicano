id: rafael-moraes
name: Rafael Moraes
aliases:
- Dom Rafael
- Moraes
biography: >-
  Rafael Moraes, formado em filosofia, teologia e história, foi sagrado bispo por Antônio Bessa na Igreja Católica
  Apostólica de Confissão Anglicana e liderou a diocese de Nova Friburgo (RJ), depois chamada Arquidiocese Metropolitana
  Anglo-Católica do Rio de Janeiro, após o fracasso da jurisdição por falta de consenso entre os bispos. Até 2021
  havia dois bispos nessa jurisdição, Bessa e Moraes. Em 2021 é apresentado como bispo titular da Província Anglo-Católica
  da Santíssima Trindade do Brasil e mantém canal próprio no YouTube, que o descreve como bispo anglo-católico,
  não romano.
sources:
- source: lac-yt-rmoraes-canal
  quote: É formado em Filosofia, Teologia e História
- source: cant-novas-igrejas-2024
  quote: Dom Antônio Bessa sagrou ao episcopado dom Rafael Moraes
- source: cant-novas-igrejas-2024
  quote: >-
    Em Nova Friburgo, no Rio de Janeiro, a Diocese sob a liderança de Moraes era chamada de Diocese Católica Apostólica
    de Confissão Anglicana.
  page: '161'
- source: cant-novas-igrejas-2024
  quote: >-
    A então Diocese Católica de Confissão Anglicana em Nova Friburgo passou a ser chamada de Arquidiocese Metropolitana
    Anglo-Católica do Rio de Janeiro, continuando sob a liderança do bispo Rafael Moraes.
  page: '162'
- source: cant-novas-igrejas-2024
  quote: falhou em pouco tempo, pois não houve consenso ou unidade entre seus bispos
  page: '162'
- source: cant-novas-igrejas-2024
