    quote: Dom Antônio Bessa sagrou ao episcopado dom Rafael Moraes
  - source: cant-novas-igrejas-2024
    quote: >-
      Na mesma época, outro bispo, Rafael Moraes, havia sido eleito para o episcopado e sagrado por dom Antônio
      Bessa.
    page: '105'
  - source: cant-novas-igrejas-2024
    quote: >-
      Dom Antônio Bessa sagrou ao episcopado dom Rafael Moraes, e pretendia conferir Ordens a novos bispos, para
      organizar a nova denominação intitulada Igreja Católica Apostólica de Confissão Anglicana.
    page: '161'
  notes: Data não informada (entre 2019 e 2021).
