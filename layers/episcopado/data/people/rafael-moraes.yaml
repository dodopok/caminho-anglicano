biography: >-
  Bispo em Nova Friburgo (RJ), sagrado por Antônio Bessa; co-presidiu a sagração de Rafael Mendes Martins (2021)
  e sagrou Cristiano Alves (2022).
sources:
- source: cant-novas-igrejas-2024
