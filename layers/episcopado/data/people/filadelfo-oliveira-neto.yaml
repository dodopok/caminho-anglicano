events:
- type: other
  date: '2004-09-16'
  description: >-
    Decreto de Supervisao Episcopal Especial sobre a Diocese Anglicana do Recife (16/09/2004), com supervisao do
    bispo Mauricio Andrade (DAB) e do sufraganeo Filadelfo Oliveira; Robinson Cavalcanti recusa acatar.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      a recusa do Bispo Diocesano, Dom Edward Robinson de Barros Cavalcanti, em acatar o Decreto de Supervisão Episcopal
      Especial de 16 de setembro de 2004
- type: other
  date: '2005-02-22'
  description: >-
    Resolucao 001/2005 (18/02/2005) suspende preventivamente Robinson Cavalcanti; Resolucao 002/2005 (22/02/2005)
    nomeia Filadelfo Oliveira Neto Autoridade Eclesiastica da Diocese do Recife; Mauricio Andrade instituido "bispo
    interventor" em marco de 2005.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      foi emitida a Resolução 001/2005, em 18 de fevereiro de 2005208, suspendendo o bispo diocesano em caráter
      preventivo.
  - source: costa2021
    quote: No mês seguinte, o bispo Maurício Andrade, foi instituído como “bispo interventor”
- type: deposition
  date: '2005-06-17'
  description: >-
    Versao divergente da data da deposicao: o ENS (citando ACNS) diz que o primaz e um comite da Camara dos Bispos
    depuseram Robinson Cavalcanti "por contumacia" em 17 de junho [2005], determinando que o sufraganeo Filadelfo
    Oliveira Neto assumisse a autoridade eclesiastica.
  status: contested
  sources:
  - source: ens-100705-2-a
    quote: >-
      The Primate of Brazil, the Most Rev. Orlando de Oliveira, and a House of Bishops' committee deposed Robinson
      Cavalcanti for contumacy (resistance to authority) June 17, directing his suffragan, the Rt. Rev. Filadelfo
      Oliveira Neto, to assume ecclesiastical authority for the diocese.
- type: other
  date: 2002-10
  description: >-
    Saida do Rev. Paulo Garcia, deao da Catedral da Santissima Trindade do Recife (2002); o bispo Robinson nomeia
    Filadelfo Oliveira deao interino.
  status: confirmed
  sources:
  - source: ens-2002-241-15
    quote: >-
      the bishop of the Anglican Diocese of Recife, Robinson Cavalcanti, has appointed the Rev. Filadelfo Oliveira
      as acting dean of the cathedral
  - source: costa2021
    quote: Em setembro de 2002, ocorreu o que chamamos de “Pequena Crise do Recife”105
- type: other
  date: 2004-09
  description: >-
    Decreto da Camara dos Bispos (set/2004) acolhe pedido do bispo sufraganeo do Recife (Filadelfo Oliveira Neto),
    de 14 clerigos, 9 paroquias e 6 missoes por supervisao episcopal alternativa a Robinson Cavalcanti.
  status: confirmed
  sources:
  - source: ieab-esclarecimento-2004
    quote: >-
      A Câmara dos Bispos acolheu a solicitação do Bispo Sufragâneo, de 14 clérigos, 9 paróquias e 6 missões, todos
      evangélicos, para uma supervisão alternativa
  - source: costa2021
    quote: >-
      a recusa do Bispo Diocesano, Dom Edward Robinson de Barros Cavalcanti, em acatar o Decreto de Supervisão Episcopal
      Especial de 16 de setembro de 2004
- type: other
  date: '2004-09-16'
  description: >-
    Câmara dos Bispos da IEAB (Porto Alegre, 16/09/2004) decreta supervisão episcopal especial para o clero e comunidades
    da Diocese do Recife em dissidência com o bispo Robinson Cavalcanti, nomeando o bispo Maurício Andrade (Brasília),
    e mantém o bispo sufragâneo Filadelfo Oliveira em funções.
  status: confirmed
  sources:
  - source: acns-3885-2004
    quote: >-
      Appoint the Rt Revd Dom Mauricio Andrade, the diocesan bishop of Brasilia, to perform the task of special
      episcopal oversight
  - source: acns-3885-2004
    quote: >-
      the Suffragan Bishop Dom Filadelfo Oliveira, according to his canonical prerogatives, continues to exert his
      pastoral ministry to the communities of the Anglican Diocese of Recife.
- type: deposition
  date: '2005-10-01'
  description: >-
    Comissão Permanente da Diocese do Recife fiel à IEAB publica carta aberta: Robinson Cavalcanti foi julgado e
    deposto das Ordens Sagradas; o sínodo diocesano sob o bispo sufragâneo Filadelfo Oliveira foi considerado válido
    pela justiça; o grupo que permaneceu na IEAB corresponde a um terço da diocese.
  status: confirmed
  sources:
  - source: ta-2005-10-01-ieab-recife
    quote: >-
      He was, consequently, tried and condemned, and after all the right proceedings were fulfilled, he was deposed
      form Holy Orders from the Episcopal Anglican Church of Brazil.
  - source: ta-2005-10-01-ieab-recife
    quote: >-
      The diocesan synod, under the ecclesiastical authority of the suffragan bishop Filadelfo Oliveira as well
      as the decisions and resolutions taken there were considered legitimate and valid by the court.
