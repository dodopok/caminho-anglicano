  notes: >-
    Bispo sufragâneo da Diocese Anglicana do Recife em 2004; signatário da carta da Câmara dos Bispos de 14/11/2005.
    Autoridade eclesiástica nomeada pelo primaz para a Diocese do Recife durante a crise de 2005; depois bispo emérito
    ativo na diocese (pregou em ordenações de 2020–2023). Fim do papel: eleição de Sebastião Gameleira (data não
    verificada aqui). Bispo colaborador da DAR (2026). Lado IEAB da cisão (continuidade da Diocese do Recife na
    IEAB). Bispo sufragâneo. Permaneceu na IEAB: assinou 'Não sairemos' (01/09/2004); manteve seu ministério sob
    a supervisão especial (16/09/2004); nomeado Autoridade Eclesiástica da diocese (Resolução 002/2005, 22/02/2005).
    Fim do vínculo com a diocese não informado; em 2017 'retornou ao Recife' para assumir a Paróquia da Trindade.
