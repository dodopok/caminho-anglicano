id: rosimael-losasi
name: Rosimael Losasi
aliases:
- Rosimael
biography: >-
  Fundador da Igreja Episcopal do Brasil, em Pernambuco, organizada juridicamente em 13/11/2017; passou depois a
  denominar-se arcebispo, sem angariar clero nem novas comunidades. Aparece como arcebispo em vídeos de 2018 do
  canal da igreja e tem canal pessoal no YouTube, que o descreve como empresário, professor e jornalista.
