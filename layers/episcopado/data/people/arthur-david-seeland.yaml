  notes: >-
    A lista da IAL numera os bispos e indica os consagrantes pelos números (002 Mote, 006 Lewis, 013 Kleppinger,
    014 Stephens, 016 Deyman, 022 McNeley); não distingue o principal. Na mesma data (6/05/1993), o currículo de
    Cruz-Blanco dá William O. Lewis como "Chief Consecrator" de outra consagração (sub conditione) com Seeland entre
    os co-sagrantes, o que sugere que a data de Seeland na lista da IAL pode ser a da cerimônia conjunta ou um erro;
    Wikipédia (HCCAR) o dá como bispo da Diocese do Pacífico Sudoeste desde 1993. A cadeia pára aqui: Mote (sagrado
    em 28/01/1978 por Albert Arthur Chambers, assistido por Francisco Pagtakhan) é o sagrante numerado 002 e tem
    sagração já documentada.
