id: eliane-helena-da-silva-nogueira
name: Eliane Helena da Silva Nogueira
aliases:
- Dona + Eliane Helena
- Eliane Helena Nogueira
- Episcopisa Eliane Helena
biography: >-
  Foi sagrada episcopisa em 10 de novembro de 2012, em Belford Roxo (RJ), por Elias Batista Nogueira, com Josué
  Souza Torres e Cláudio Lucena como co-sagrantes, entre outros postulantes. Consta como episcopisa coadjutora e
  diretora administrativa da Convenção Eclesiástica Filhos da Promessa (CEFIP), com matrícula 0201-2012, e como
  bispa da OAFIP.
sources:
- source: lac-cnbp-bispos
  quote: >-
    Dona. + Eliane Helena da Silva Nogueira – Episcopisa Coadjutora Diretora Administrativa da Convenção Eclesiástica
    Filhos da Promessa - CEFIP Mat. 0201-2012
- source: lac-pbca-clero
  quote: Revma Episcopisa Eliane Helena Nogueira, OAFIP
- source: lac-cnbp-convite2012
  quote: >-
