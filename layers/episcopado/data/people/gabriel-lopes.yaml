id: gabriel-lopes
name: Gabriel Lopes
aliases:
- Gabriel S. D. Lopes
- Post. Gabriel Lopes
- Pr. Gabriel Lopes
biography: >-
  Pregador da Igreja Anglicana Verbo (Teresópolis-RJ), que atuou como seminarista na Diocese de João Pessoa (IAB)
  em 2023. Foi ordenado diácono em 02/05/2026 por Miguel Uchôa, após o Sínodo Diocesano. O tratamento passou de
  "Post." para "Rev." entre 2025 e 2026, e um vídeo da igreja de 06/07/2026 já o identifica como "Rev."; nenhuma
  fonte informa data, ordem ou ordenante de outra ordenação.
sources:
- source: anglicanismo-visita-2023
  quote: >-
    A presença do Bispo proporcionou um momento de celebração e crescimento espiritual para os membros da comunidade
    liderada pelo seminarista Gabriel Lopes e sua esposa, Ana Caroline.
- source: anglicanismo-visita-2023
  quote: >-
    Em seguida, o Bispo Márcio Meira seguiu para Teresópolis, onde mais duas pessoas foram batizadas e oito membros
    da Igreja Anglicana Verbo receberam a confirmação, também conhecida como crisma.
