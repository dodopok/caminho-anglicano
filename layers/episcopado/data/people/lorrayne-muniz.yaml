id: lorrayne-muniz
name: Lorrayne Muniz
full_name: Lorrayne Pires Freitas Muniz (provável)
aliases:
- Lorraine Muniz
- Lorrayne Pires Freitas Muniz (provável)
- Revda. Lorrayne
biography: >-
  Lorrayne Muniz foi ordenada diácona em 12/11/2022 e presbítera em 27/04/2024, ambas por Márcio Meira, na Igreja
  Anglicana do Brasil (IAB). Atua na Igreja Anglicana Trindade, em Vitória (ES), ligada à Diocese de João Pessoa.
sources:
- source: testemunho-mantenedor-2026-10-08-ancora-2022
  quote: >-
    o Cícero também foi ordenado diácono nesse dia, eu estava lá. Weiden também. E a Lorrayne Muniz (esposa do Rev.
    Pedro Muniz) também
- source: testemunho-mantenedor-2026-10-08-ordenante-ancora
  quote: Quem ordenou lorrayne, cícero e weiden foi marcio meira
- source: iabord-yt-juqrsmo82ny
  quote: >-
    Sermão ministrado na Ordenação Pastoral do Rev. Cícero (Igreja Âncora), Revª. Elionai (Igreja Âncora), Revª.
    Lorrayne (Anglicana Trindade) e Rev. Weiden (Anglicana Metamorfose).
- source: iabord-ig-anglicanatrindade-c6rulisp-nh
  quote: >-
    Nesse sábado a @rev.lorrayne foi consagrada as ordens plenas, confirmando assim a vocação com a qual, com dedicação,
    zelo e amor, tem servido a nossa comunidade.
- source: testemunho-mantenedor-2026-10-08-ordenantes-pedro-lorrayne
  quote: >-
    Quem ordenou pedro ao diaconato foi Miguel Uchoa e Flavio Adair como cosagrante, quem ordenou lorrayne foi marcio
    meira
- source: iabord-yt-nyqty3agmk0
  quote: CONFERÊNCIA SOBRENATURAL | ORDENAÇÃO PRESBITERAL | 27.04.2024 | 08:30h | CATEDRAL COMUNHÃO
- source: djp-igrejas-2025
  quote: >-
    Igreja Anglicana Trindade – ES Rev. Pedro Muniz Revda. Lorrayne Rua Pres. Nilo Peçanha, n. 2 – Bairro República
    – Vitória – ES
ordinations:
- order: diaconate
  date: '2022-11-12'
  place: Igreja Anglicana Âncora, Vitória (ES)
  jurisdiction: iab
  ordained_by: marcio-meira
  status: confirmed
  sources:
  - source: testemunho-mantenedor-2026-10-08-ancora-2022
    quote: >-
      o Cícero também foi ordenado diácono nesse dia, eu estava lá. Weiden também. E a Lorrayne Muniz (esposa do
      Rev. Pedro Muniz) também
  - source: testemunho-mantenedor-2026-10-08-ordenante-ancora
    quote: Quem ordenou lorrayne, cícero e weiden foi marcio meira
  - source: iabord-yt-juqrsmo82ny
    quote: >-
      Sermão ministrado na Ordenação Pastoral do Rev. Cícero (Igreja Âncora), Revª. Elionai (Igreja Âncora), Revª.
      Lorrayne (Anglicana Trindade) e Rev. Weiden (Anglicana Metamorfose).
  notes: >-
    Ordenações diaconais no mesmo culto de 12/11/2022 na Âncora (Elionai Rodrigues, Cícero Pontara, Weiden Mendes
    e Lorrayne Muniz), segundo testemunho presencial do mantenedor. Bispo ordenante: Márcio Meira, segundo o mantenedor.
    Fonte nova que corrobora o culto de nov/2022 (vídeo publicado em 16/11/2022 no canal da Catedral Anglicana Âncora,
    sermão do Rev. Eric Rodrigues). A descrição fala em 'Ordenação Pastoral' sem dizer a ordem; o diaconato em 12/11/2022
    e o bispo Márcio Meira vêm do testemunho do mantenedor/convite já na base.
- order: presbyterate
  date: '2024-04-27'
  place: Catedral Comunhão (Catedral Anglicana Comunhão, Bessa, João Pessoa-PB) - inferido
  jurisdiction: iab
  ordained_by: marcio-meira
  status: confirmed
  sources:
  - source: iabord-ig-anglicanatrindade-c6rulisp-nh
    quote: >-
      Nesse sábado a @rev.lorrayne foi consagrada as ordens plenas, confirmando assim a vocação com a qual, com
      dedicação, zelo e amor, tem servido a nossa comunidade.
  - source: testemunho-mantenedor-2026-10-08-ordenantes-pedro-lorrayne
    quote: >-
      Quem ordenou pedro ao diaconato foi Miguel Uchoa e Flavio Adair como cosagrante, quem ordenou lorrayne foi
      marcio meira
  - source: iabord-ig-anglicanatrindade-c6rulisp-nh
    quote: >-
      Nesse sábado a @rev.lorrayne foi consagrada as ordens plenas, confirmando assim a vocação com a qual, com
      dedicação, zelo e amor,  tem servido a nossa comunidade.
  - source: iabord-yt-nyqty3agmk0
    quote: CONFERÊNCIA SOBRENATURAL | ORDENAÇÃO PRESBITERAL | 27.04.2024 | 08:30h | CATEDRAL COMUNHÃO
  notes: >-
    'Ordens plenas' = presbiterato. Post da Igreja Anglicana Trindade (Vitória-ES), publicado no próprio sábado,
    27/04/2024. Ordenante: Márcio Meira, segundo o mantenedor. Hipótese de local: o post da Igreja Anglicana Trindade
    (Vitória-ES) foi publicado em 27/04/2024 (sábado) e o canal da Catedral Comunhão (sé da Diocese de João Pessoa,
    bispo diocesano Márcio Meira) transmitiu ao vivo, nesse mesmo dia 27/04/2024 às 08:30h, uma 'Ordenação Presbiteral'
    (Conferência Sobrenatural). Nenhuma das duas páginas cita Lorrayne no vídeo nem o bispo ordenante; a coincidência
    de data e a jurisdição são inferência. O ordenante Márcio Meira vem do testemunho do mantenedor (já na base),
    não destas fontes. Confirmar com o post/vídeo.
affiliations:
- jurisdiction: iab
  role: clergy
  diocese: iab-diocese-joao-pessoa
  status: probable
  sources:
