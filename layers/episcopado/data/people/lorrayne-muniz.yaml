  jurisdiction: iab
  status: confirmed
  sources:
  - source: ig-anglicanatrindade-2024-04-27-lorrayne
    quote: >-
      Nesse sábado a @rev.lorrayne foi consagrada as ordens plenas, confirmando assim a vocação com a qual, com
      dedicação, zelo e amor, tem servido a nossa comunidade.
  notes: >-
    'Ordens plenas' = presbiterato. Post da Igreja Anglicana Trindade (Vitória-ES), publicado no próprio sábado,
