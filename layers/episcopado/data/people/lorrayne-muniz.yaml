  status: probable
  sources:
  - source: djp-igrejas-2025
    quote: >-
      Igreja Anglicana Trindade – ES Rev. Pedro Muniz Revda. Lorrayne Rua Pres. Nilo Peçanha, n. 2 – Bairro República
      – Vitória – ES
  - source: ancorabh-lideranca-2018
    quote: Rev. Pedro Muniz e Lorraine Muniz
  notes: >-
    Local: Igreja Anglicana Trindade, Vitória-ES. Em jul/2025 a Igreja Anglicana Trindade (Vitória-ES) continuava
    na IAB (Diocese de João Pessoa), ao passo que a Igreja Âncora (mesma cidade) passou à REB em dez/2024. Identificação
    com 'Lorrayne Pires Freitas Muniz', ordenada pastora em Vitória em 2022 segundo a ES360 (não aberta, ver dúvidas),
