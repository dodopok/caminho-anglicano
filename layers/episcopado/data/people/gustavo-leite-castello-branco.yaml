# yaml-language-server: $schema=../../schemas/person.json
id: gustavo-leite-castello-branco
name: Gustavo Leite Castello Branco
aliases:
- Gustavo Leite Castelo Branco
- Rev. Gustavo Leite
biography: >-
  Diácono permanente por vários anos; ordenado presbítero por Robinson Cavalcanti em ago/2011 em João Pessoa.
sources:
- source: dar-2011-dois-presbiteros
  quote: >-
    O Bispo Dom Robinson Cavalcanti estará conferindo a Ordem Presbiteral, nos dias 13 e 14 de agosto próximo, a
    mais dois Diáconos, os Reverendos: Davi Amado – de Campina Grande – e Gustavo Leite Castello Branco – de João
    Pessoa
ordinations:
- order: diaconate
  date: '2005-06-18'
  place: Con-Catedral Anglicana da Ressurreição, João Pessoa-PB
  jurisdiction: diocese-anglicana-recife
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: drp2-ord-diac-jp-2005
    quote: >-
      Sermão de Ordenações Diaconais Cláudio Brito, Flávio Adair Torres, Gustavo Leite Castello Branco, Lindinalva
      Medeiros e Raimundo Figueiredo Con-Catedral Anglicana da Ressurreição João Pessoa (PB), 18 de Junho de 2005.
  - source: drp2-ord-diac-jp-2005
    quote: >-
      Este é um momento especial para o Anglicanismo na Paraíba, com a Ordenação de cinco Diáconos – todos provados
      e aprovados – e, pela primeira vez, uma lídima representante do sexo feminino.
  notes: >-
    Uma de cinco ordenações diaconais na mesma cerimônia, na Diocese Anglicana do Recife sob Dom Robinson após o
    rompimento com a IEAB.
- order: presbyterate
  date: 2011-08
  place: Paróquia Anglicana Cristo Libertador, Valentina Figueiredo, João Pessoa-PB
  jurisdiction: diocese-anglicana-recife
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: dar-2011-dois-presbiteros
    quote: >-
      O Bispo Dom Robinson Cavalcanti estará conferindo a Ordem Presbiteral, nos dias 13 e 14 de agosto próximo,
      a mais dois Diáconos, os Reverendos: Davi Amado – de Campina Grande – e Gustavo Leite Castello Branco – de
      João Pessoa
  - source: dar-2011-gustavo
    quote: >-
      foi Ordenado pelo Bispo Robinson Cavalcanti ao Presbiterado o reverendo Gustavo Leite Castello Branco , no
      templo recém-construído da Paróquia Anglicana Cristo Libertador , no Bairro de Valentina Figueiredo, João
      Pessoa, PB
  notes: >-
    Notícia de 15/08/2011; o anúncio prévio fala em 13 e 14/08/2011. Antes, diácono permanente por vários anos (lista
    de 2010). Pregador: o bispo-eleito Flávio Adair.
