biography: >-
  Gustavo Leite Castello Branco foi ordenado diácono em 18 de junho de 2005, em João Pessoa, e presbítero em agosto
  de 2011, na Paróquia Anglicana Cristo Libertador, ambas as vezes por Robinson Cavalcanti, na Diocese Anglicana
  do Recife. Foi coadjutor dessa paróquia, membro da equipe pastoral da Con-Catedral Anglicana da Ressurreição e
  coordenador pedagógico do Seminário Teológico da Paraíba (SAT-PB). Em 2009 e 2010 constava como secretário diocesano
  de Missão e Evangelismo e, em 2011, como procurador diocesano. Em fontes diocesanas aparece como diácono permanente
  e estudante de mestrado em História da Igreja no Trinity School for Ministry, em Ambridge (PA).
