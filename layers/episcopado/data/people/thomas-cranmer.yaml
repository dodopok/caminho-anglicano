id: thomas-cranmer
name: Thomas Cranmer
full_name: Thomas Cranmer
aliases:
- Archbishop Cranmer
death:
  date: '1556-03-21'
  sources:
  - source: stubbs-1897
    quote: Thomas Cranmer. Canterbury; d. 1556, March 21.
  - source: wikidata-api-2
    quote: '"Q199894": enwiki "Thomas Cranmer"'
wikidata: Q199894
biography: >-
  Sagrado bispo em 30/03/1533, em Westminster, por John Longland e outros bispos, foi arcebispo de Cantuária até
  morrer, em 21/03/1556. O registro da sagração de William Barlow, sagrante principal de Parker, não consta no registro
  de Cranmer: Stubbs a fixa por prova indireta em junho de 1536, e autores católicos apontam a ausência dos documentos
  que deveriam registrá-la.
sources:
- source: stubbs-1897
  quote: >-
    a. d. 1533, Mar. 30. Thomas Cranmer. Canterbury; d. 1556, March 21. Consecrated at S. Stephen's, Westminster,
    by John of Lincoln, John of Exeter, and Henry of S. Asaph ; Reg. Cranmer, fo. 4.
- source: stubbs-1897
  quote: Thomas Cranmer. Canterbury; d. 1556, March 21.
- source: stubbs-1897
  quote: >-
    Record not forthcoming ; the date is fixed, by collateral proof, to June 1 1, 18, or 26. Barlow's precedence
    is between Norwich (Repps) and S. Asaph (Parfew);
- source: ce-anglican-orders
  quote: >-
    The Catholic writers, on the other hand, point out that it is not merely the absence of just a single entry
    in Cranmer's "Register" which stands against him, but the absence of an entire set of documents which should
    have borne reference to his consecration if it occurred;
ordinations:
- order: episcopate
  date: '1533-03-30'
  place: St Stephen's, Westminster
  jurisdiction: church-of-england
  office: primate
  principal_consecrator: john-longland
  co_consecrators:
  - henry-standish
  - john-veysey
  status: confirmed
  sources:
  - source: stubbs-1897
    quote: >-
      a. d. 1533, Mar. 30. Thomas Cranmer. Canterbury; d. 1556, March 21. Consecrated at S. Stephen's, Westminster,
      by John of Lincoln, John of Exeter, and Henry of S. Asaph ; Reg. Cranmer, fo. 4.
  notes: >-
    Stubbs (Registrum Sacrum Anglicanum, 1897) segue os registros dos arcebispos (citados no fim de cada verbete)
    e nomeia o sagrante que presidiu primeiro. Os co-sagrantes aparecem só como 'Prenome of Sé'; a identificação
    dos nomes completos foi feita cruzando com os próprios verbetes de Stubbs (quem ocupava a sé na data). John
    of Lincoln = John Longland (Stubbs: Longlands); John of Exeter = John Veysey (Voysey); Henry of S. Asaph = Henry
    Standish. Daqui para cima a Wikidata já tem a cadeia (Longland, Warham ... Henry Beaufort), segundo o relatório
    Wikidata do projeto.
affiliations:
- jurisdiction: church-of-england
  role: archbishop
  diocese: diocese-of-canterbury
  start: '1533-03-30'
  end: '1556-03-21'
  end_reason: death
  status: confirmed
  sources:
  - source: stubbs-1897
    quote: Thomas Cranmer. Canterbury; d. 1556, March 21.
  notes: >-
    Datas de Stubbs: início = sagração ou ano da transferência; fim = ano da transferência seguinte, ou falecimento/deposição.
events:
- type: other
  date: '1536'
  description: >-
    Falta o registro da sagração de William Barlow (sagrante principal de Parker) no registro de Cranmer. Stubbs
    fixa a data por prova indireta em junho de 1536 (dia 11, 18 ou 26), pela precedência de Barlow entre os bispos
    de Norwich (Repps) e St Asaph (Parfew). Autores anglicanos atribuem a falta ao registro malcuidado. Autores
    católicos apontam que falta todo um conjunto de documentos, mas não afirmam que a sagração com certeza não ocorreu.
  status: contested
  sources:
  - source: stubbs-1897
    quote: >-
      Record not forthcoming ; the date is fixed, by collateral proof, to June 1 1, 18, or 26. Barlow's precedence
      is between Norwich (Repps) and S. Asaph (Parfew);
  - source: ce-anglican-orders
    quote: >-
      The Catholic writers, on the other hand, point out that it is not merely the absence of just a single entry
      in Cranmer's "Register" which stands against him, but the absence of an entire set of documents which should
      have borne reference to his consecration if it occurred;
  - source: ce-anglican-orders
    quote: >-
      Still the Catholic writers do not maintain on these grounds that it is certain he was not consecrated,
  - source: wp-barlow
    quote: >-
      However, that register does record his election as bishop, the royal assent to it and his confirmation.
