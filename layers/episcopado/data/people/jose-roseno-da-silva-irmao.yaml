id: jose-roseno-da-silva-irmao
name: José Roseno da Silva Irmão
aliases:
- José Roseno da Silva
- Rev. José Roseno da Silva
biography: >-
  Ordenado diácono em 8/12/2006, em Conde (PB), por Robinson Cavalcanti, e presbítero em 2008, na Diocese do Recife.
  Foi ministro auxiliar e membro da equipe pastoral da Paróquia Anglicana Cristo Redentor, em Gravatá (PE), tomou
  posse como pároco efetivo em 21/08/2010 e foi historiador-arquivista diocesano. Consta como licenciado em 2017.
