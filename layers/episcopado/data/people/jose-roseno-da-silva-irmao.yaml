events:
- type: other
  date: '2011-05-21'
  description: >-
    Em 21/05/2011 foi realizada a colação de grau do Curso Ministerial em Teologia do Instituto Anglicano Teológico
    (IAT) de Gravatá (PE), presidida pelo bispo Robinson Cavalcanti, com a presença do coordenador do instituto,
    Rev. José Roseno, do reitor do SAT-PE e arcediago Centro Evilásio Tenório, do arcediago adjunto Centro Márcio
    Simões e do vigário geral Maurício Amazonas.
  status: confirmed
  sources:
  - source: d2s21-iat-gravata
    quote: >-
      ocorreu no sábado (21/05), à noite, a cerimônia de Colação de Grau do Curso Ministerial em Teologia do Instituto
      Anglicano Teológico ( IAT ), de Gravatá , presidido pelo Bispo Robinson Cavalcanti
