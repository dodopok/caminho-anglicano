biography: >-
  Ordenado diácono em dezembro de 1960 e presbítero em junho de 1961 por Plínio Lauer Simões, serviu no Distrito
  Missionário do Sudoeste do Brasil até ser transferido para a Igreja Episcopal do Brasil em 25/04/1965.
