biography: >-
  Nascido em Mogi Guaçu (SP) em 1931, foi ordenado diácono em dezembro de 1962 e presbítero em junho de 1963, ambos
  por Egmont Krischke. Clérigo do Distrito Missionário do Sul do Brasil, foi transferido para a Igreja Episcopal
  do Brasil em 25/04/1965.
