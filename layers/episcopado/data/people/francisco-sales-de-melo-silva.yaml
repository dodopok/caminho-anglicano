  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. OSF Listado no clero
    diocesano da DAR (página consultada em 2026-10). Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife
    e foi um dos 13 que pediram à Câmara dos Bispos supervisão episcopal alternativa (decreto de 16/09/2004), mantendo
    a comunhão com a IEAB. Início e fim do vínculo não informados. Signatário de 'Não sairemos' (01/09/2004): permaneceu
    na IEAB na crise de 2004-2005. Em exercício em outubro de 2004 (página capturada em 24/10/2004). Listado entre
    os clérigos licenciados. Relacionado no decreto da Câmara dos Bispos da IEAB (16/09/2004) entre os clérigos
    da Diocese Anglicana do Recife que, segundo o decreto, solicitaram supervisão episcopal especial; em exercício
    em setembro de 2004. O decreto não indica paróquia.
