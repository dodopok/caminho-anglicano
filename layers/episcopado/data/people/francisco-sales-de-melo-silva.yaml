      Bispo tenho a alegria e a satisfação de conferir a ordem do diaconato a Arthur Cavalcante e Francisco Sales
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti). Um dos dois seguia para o diaconato permanente e o outro para
    o presbiterato (o texto não diz qual). Identificação com Francisco Sales de Melo Silva provável (nome completo
    não dado). Ordenação conjunta com Arthur Cavalcante; a página cita apenas 'Francisco Sales'. Ex-católico romano,
    segundo o sermão. O texto é o sermão do bispo diocesano, que fala em primeira pessoa como quem confere a ordem;
    a página não traz assinatura, e o bispo diocesano em exercício era Robinson Cavalcanti (instalado em 19/10/1997).
