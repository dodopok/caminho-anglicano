id: francisco-sales-de-melo-silva
name: Francisco Sales de Melo Silva
biography: >-
  Francisco Sales de Melo Silva foi ordenado diácono em 3 de fevereiro de 2001 por Robinson Cavalcanti, na Paróquia
  do Bom Samaritano, na Diocese Anglicana do Recife (IEAB). Aparece depois como presbítero da diocese, pároco e
  membro da Junta de Capelães Examinadores. Pertence à Ordem de São Francisco (OSF), na qual foi guardião da Fraternidade
  Recife. Em 2004 figurou entre os clérigos que pediram supervisão episcopal alternativa, segundo decreto da IEAB
  sobre a diocese.
