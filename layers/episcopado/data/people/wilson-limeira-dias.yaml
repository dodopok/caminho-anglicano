# yaml-language-server: $schema=../../schemas/person.json
id: wilson-limeira-dias
name: Wilson Limeira Dias
full_name: Wilson Limeira Dias
aliases:
- Dom Wilson
- Monsenhor Wilson
- Padre Wilson Limeira
- Wilson Dias
biography: >-
  Bispo auxiliar de São Paulo da WAC no Brasil e reitor do Seminário São Filipe Apóstolo. Ordenado presbítero em
  02/10/1993 (jurisdição não informada); sagrado bispo em 14/07/2024, no encerramento do Sínodo Provincial em Imbituba
  (SC). Os sagrantes não são nomeados nas fontes consultadas.
sources:
- source: lwac-wacbr-clerigos
  quote: >-
    Dom Wilson Limeira Dias Bispo Auxiliar de São Paulo - Reitor do Seminário São Filipe Apóstolo Cidade: São Paulo
    - SP Ordenação Presbiteral: 02/10/1993 Sagração Episcopal: 14/07/2024
ordinations:
- order: presbyterate
  date: '1993-10-02'
  jurisdiction: null
  status: probable
  sources:
  - source: lwac-wacbr-clerigos
    quote: >-
      Dom Wilson Limeira Dias Bispo Auxiliar de São Paulo - Reitor do Seminário São Filipe Apóstolo Cidade: São
      Paulo - SP Ordenação Presbiteral: 02/10/1993
  notes: >-
    Data informada pelo site da WAC-BR; jurisdição de origem e ordenante não constam (a ordenação é muito anterior
    à sagração episcopal na WAC).
- order: episcopate
  date: '2024-07-14'
  place: Imbituba (SC)
  jurisdiction: wac-br
  office: auxiliary
  status: confirmed
  sources:
  - source: lwac-wacbr-clerigos
    quote: 'Sagração Episcopal: 14/07/2024'
  - source: lwac-wacbr-sinodo
    quote: >-
      Na mesma data, ainda, tivemos a Sagração Episcopal de ANTÔNIO CARLOS SILVA SANTOS e WILSON LIMEIRA DIAS, novos
      Bispos que servirão no Estado de São Paulo.
  - source: lwac-ig-wilson-sagracao
    quote: >-
      neste domingo dia 14/07 serei sagrado bispo para Igreja Anglicana Mundial - WAC  do Brasil esta celebração
      está na prigramação do nosso  sinodo em Ibiguçu - Santa Catarina.
  - source: lwac-wacbr-clerigos
    quote: >-
      Dom Wilson Limeira Dias Bispo Auxiliar de São Paulo - Reitor do Seminário São Filipe Apóstolo Cidade: São
      Paulo - SP Ordenação Presbiteral: 02/10/1993 Sagração Episcopal: 14/07/2024
  - source: cant-novas-igrejas-2024
    quote: >-
      encerramento do Sínodo, ocorreram duas sagrações episcopais: os novos bispos Antônio Carlos Silva Santos e
      Wilson Limeira Dias foram consagrados para o Estado de São Paulo.
    page: '129'
  notes: >-
    Realizada no Sínodo Provincial (11 a 14/07/2024, em Imbituba, SC; o site da WAC-BR grafa "Ibituba" e o próprio
    Wilson escreveu "Ibiguçu"). Os sagrantes não são nomeados; estava presente o arcebispo Felix Nzeyimana, núncio
    apostólico, representando o patriarca Lwanga Tusubira. Os cânones da WAC exigem ao menos três bispos consagrantes.
    Fecha o dia (antes só 2024-07, Sínodo de Imbituba). Presbiterato em 02/10/1993 (jurisdição anterior não informada).
    No encerramento do Sínodo (11–14/07/2024); o livro não nomeia os sagrantes (estava presente o arcebispo Felix
    Nzeyimana, representando o patriarca).
