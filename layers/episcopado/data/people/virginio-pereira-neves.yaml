biography: >-
  Nascido em Tacuarembó, Uruguai, em 21/09/1906, foi ordenado diácono em janeiro de 1938 e presbítero em janeiro
  de 1939 por William Matthews Merrick Thomas, no Distrito Missionário do Sudoeste do Brasil. Em 1949 esteve entre
  os mais votados (quinze votos) na indicação de nomes para o episcopado e, em 1952, como arcediago, criou missões
  em Júlio de Castilhos, Tupanciretã e Ijuí. Foi transferido para a Igreja Episcopal do Brasil em 25/04/1965.
