biography: >-
  Frei Gecionny Rodrigo Pinto de Souza, natural de Natal (RN), é franciscano (OSF) e foi guardião da junta paroquial,
  catequista e auxiliar da Paróquia Anglicana da Natividade, na Diocese Anglicana do Recife (IEAB), quando era seminarista
  e aspirante ao ministério ordenado. Outra fonte o descreve como reverendo responsável pelo Arcediagado Norte da
  diocese.
