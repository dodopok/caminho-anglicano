id: andy-lines
name: Andy Lines
full_name: Andrew John Lines
aliases:
- Andrew John Lines
- Andrew Lines
- The Rt Revd Andrew John Lines
birth:
  date: '1960'
  sources:
  - source: gacl-wp-lines
    quote: '''''''Andrew John Lines'''''' (born 1960) is a British [[Anglican]] bishop.'
biography: >-
  Andrew John (Andy) Lines, britânico nascido em 1960, foi sagrado em 30 de junho de 2017 bispo missionário para
  os anglicanos da Escócia, do Reino Unido e da Europa, por Foley Beach e pelo colégio de bispos da ACNA, com a
  presença de primazes e bispos de outras partes da Comunhão Anglicana. Em 2020 tornou-se o primeiro bispo presidente
  da Anglican Network in Europe (ANiE). Em março de 2026 figura como conselheiro regional do Global Anglican Council
  e, em agosto de 2026, como bispo presidente da ACE e membro do conselho.
sources:
- source: gacl-wp-lines
  quote: '''''''Andrew John Lines'''''' (born 1960) is a British [[Anglican]] bishop.'
- source: gace-gac-page
  quote: >-
    On June 30, 2017, the Anglican Church in North America’s College of Bishops was joined by 27 Primates, Archbishops,
    Bishops from around the Anglican Communion to consecrate The Rev. Canon Andy Lines as a missionary bishop for
    Anglicans in Scotland, the UK, and Europe.
- source: gacl-wp-lines
  quote: '| consecration     = 30 June 2017

    | consecrated_by   = [[Foley Beach]]'
- source: gacl-wp-lines
  quote: In 2020, he became the first presiding bishop of the [[Anglican Network in Europe]]
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Its regional advisers all lead “extra-provincial or missionary districts connected to the GAFCON movement.”
    They are Archbishop Kanishka Raffel of Sydney (a diocesan bishop in the Anglican Church of Australia), and Bishops
    Andy Lines of the Anglican Network in Europe, Jay Behan of the Church of Confessing Anglicans in Aotearoa New
    Zealand, Glenn Davies of the Diocese of the Southern Cross (which serves parishes that have broken away from
    the Anglican Church of Australia), and Yassir Eric of EKKIOS, a missionary movement forming congregations in
    predominantly Muslim regions.
- source: gacm-gafcon-2026-08-28-ace
  quote: the Rt Revd Andy Lines, Presiding Bishop of ACE and a member of the Global Anglican Council
