biography: >-
  Lauro Borba da Silva nasceu em Bagé (RS) em 21/8/1923. Foi ordenado diácono em março de 1950 e presbítero em outubro
  de 1950 pelo bispo Egmont Krischke e atuou no Distrito Missionário do Sul do Brasil até ser transferido para a
  Igreja Episcopal do Brasil em 25/4/1965. Fundou oficialmente a Missão da Ressurreição, em Passo Fundo, em 19/10/1951,
  foi enviado a Lisboa em março de 1967 como missionário na Igreja Lusitana e, em 13/5/1977, foi instituído ministro
  encarregado da Missão do Cristo Redentor.
