    quote: D Feb 47 Bp W M M Thomas P Apr 48 Bp Pithan
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1947 - … Diamantino Ferreira Bueno
    page: '370'
  notes: >-
    Ordenante no diretório: 'Bp W M M Thomas'. O verbete é do distrito criado em 1949; antes disso o clero era do
    Distrito do Sul do Brasil. Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel,
    1995); ordenante não informado.
- order: presbyterate
