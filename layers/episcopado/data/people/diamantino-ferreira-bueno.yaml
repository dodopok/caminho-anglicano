      Frs. Bueno, Rocha, and Séria were ordained by Bishop Pit- han, Suffragan of Brazil; Frs. Kainuma, Kratz, and
      de Mattos, by Bishop Thomas of Southern Brazil.
  notes: >-
    Ordenante no diretório: 'Bp Pithan'. O verbete é do distrito criado em 1949; antes disso o clero era do Distrito
    do Sul do Brasil. Nomes completos segundo outro trecho do mesmo número ("Bueno, Samuel Kumpei Kainuma, Arthur
    Rodolpho Kratz, Nadir Simées de Mattos, Silvano Rocha, and Agostinho [Soria]"); "Diamantino Ferraira Bueno"
    no OCR.
