biography: >-
  Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra) segundo o Clerical Directory 1965. Nascido em São
  Gabriel, Brasil (1923-11-23). Ordenado diácono em fev/1947 e presbítero em abr/1948. Transferido para a Igreja
  Episcopal do Brasil em 25/04/1965 (Clerical Directory 1968).
sources:
- source: cd1965
  quote: b Sao Gabriel Braz 23 Nov 23
- source: cd1968
  quote: BUENO, Diamantino Ferreira (SwBra) Trans to Brazil Ch 25 Apr 65.
