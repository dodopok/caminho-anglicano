  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      (193) Um concílio extraordinário foi realizado em Santa Maria no dia 24 de julho de 1976, que elegeu o rev.
      Diamantino Bueno, médico hematologista, que trabalhava no Rio de Janeiro. Bueno não aceitou a indicação, preferindo
      aguardar o concílio extraordinário da Diocese Central, realizado no dia 13 de novembro daquele ano, quando
      disputou a eleição ao episcopado com o rev. Agostinho Sória, que foi eleito.
