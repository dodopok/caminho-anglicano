id: joao-de-deus-da-silva
name: João de Deus da Silva
full_name: João de Deus da Silva
aliases:
- Dom João de Deus
biography: >-
  João de Deus da Silva é natural de Santana do Mundaú (AL). Foi ordenado diácono em 28/3/1995 e presbítero em 6/7/1997
  na Igreja Católica Apostólica Brasileira, uniu-se à Igreja Episcopal Latino do Brasil em 2005 e foi sagrado bispo
  por Lucas Macieira da Silva em 15/11/2010. É bispo prelado e abade da Prelazia Anglicana Sagrada Face (Curitiba,
  PR) e consta como um dos bispos da DAC, junto com Lucas Macieira, Antônio Santana Neto e Daniel Araújo. É fundador
  da Ordem dos Padres e Irmãos Samaritas, da qual é abade, e consta como bispo auxiliar da Diocese Anglicana Livre
  de Belo Horizonte para o Sul do Brasil.
