biography: >-
  Eduardo Coelho Grillo nasceu em Porto Alegre em 19/11/1964, em família anglicana. Foi ordenado diácono em 8/1/1989
  por Cláudio Gastal, na Diocese Meridional, e presbítero em 20/8/1989 por Luiz Osório Pires Prado, em Pelotas,
  onde foi ministro encarregado da Paróquia do Divino Semeador por quatro anos. De 1993 a 2001 foi pároco da Paróquia
  da Ressurreição, em Porto Alegre, e de março de 2001 a setembro de 2017 foi reitor da Paróquia de São Lucas, na
  Diocese Anglicana do Rio de Janeiro, a convite de Celso Franco de Oliveira. Eleito bispo coadjutor em 2/11/2016,
  após a renúncia de Filadelfo Oliveira, foi sagrado em 8/4/2017 na Catedral do Redentor, com Francisco de Assis
  da Silva como sagrante principal, e instituído bispo diocesano em 29/7/2017.
sources:
- source: darj-episcopado
  quote: >-
    Eduardo nasceu em Porto Alegre, Rio Grande do Sul, Brasil, em 19 de novembro de 1964, no seio de uma família
    anglicana
- source: darj-episcopado
  quote: >-
    Foi ordenado diácono em 08 de janeiro de 1989 (em Porto Alegre) pelo Cláudio Vinicius de Senna Gastal, na Diocese
    Meridional
- source: darj-episcopado
  quote: >-
    Foi ordenado presbítero sete meses depois, em 20 de agosto de 1989, na Diocese Anglicana de Pelotas, pelo Revmo
    Bispo Luiz Osório Pires Prado.
- source: darj-episcopado
  quote: >-
    Logo após sua ordenação diaconal, em 1989, foi nomeado ministro encarregado da Paróquia do Divino Semeador,
    na cidade de Pelotas, por 4 anos.
- source: darj-episcopado
  quote: >-
    Em 1993, retornou à Diocese Meridional, onde foi Pároco da Paróquia da Ressurreição, em Porto Alegre, RS, por
    oito anos.
- source: darj-episcopado
  quote: >-
    Em 2000, recebeu um convite do Bispo Celso Franco de Oliveira para se transferir para a Diocese Anglicana do
    Rio de Janeiro e substituí-lo como reitor na Paróquia de São Lucas, o que aconteceu de março de 2001 e setembro
    de 2017.
- source: costa2021
  quote: >-
    foi convidado pelo mesmo para substituí-lo como reitor na Paróquia de São Lucas, cargo que ocupou de março de
    2001 a setembro de 2017
  page: '117'
- source: darj-episcopado
  quote: >-
    Eduardo foi eleito bispo coadjutor em 02 de novembro de 2016, pelo Concílio extraordinário da Diocese Anglicana
    do Rio de Janeiro e, posteriormente, sagrado ao episcopado na IEAB, em 08 de abril de 2017, na Igreja Catedral
    do Redentor, na Tijuca, cidade do Rio de Janeiro, RJ.
- source: costa2021
  quote: >-
    Na manhã do dia 08 de abril de 2017, ocorreu a cerimônia de sagração episcopal na Catedral do Redentor, que
    ficou lotada para a cerimônia, sendo o principal sagrante o Bispo Primaz, Francisco de Assis da Silva, e co-sagrantes
    os demais bispos da Província.
- source: darj-episcopado
  quote: >-
    Em 29 de julho de 2017, Eduardo foi instituído bispo diocesano da Diocese Anglicana do Rio de Janeiro, pelo
    Bispo Primaz da IEAB, à época, o Revmo Francisco de Assis da Silva.
- source: costa2021
  quote: >-
    Em 02 de novembro de 2016, o reverendo Eduardo Coelho Grillo117 foi eleito bispo coadjutor pelo Concílio extraordinário
    da DARJ, após a resignação do bispo Filadelfo Oliveira.
  page: '117'
- source: costa2021
  quote: Em 29 de julho de 2017, Eduardo foi instituído como o novo diocesano.
