- type: other
  date: 2021-05
  description: >-
    Em maio de 2021 um padre da Diocese Católica Apostólica de Confissão Anglicana foi preso em Nova Friburgo (RJ);
    o bispo Eduardo Coelho Grillo (DARJ/IEAB) esclareceu publicamente que o sacerdote e o grupo não pertencem à
    IEAB.
  status: probable
  sources:
