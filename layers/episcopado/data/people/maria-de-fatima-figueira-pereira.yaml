id: maria-de-fatima-figueira-pereira
name: Maria de Fátima Figueira Pereira
aliases:
- Revda. Fátima F. Pereira
death:
  date: 2009-04
  sources:
  - source: dard1-aniversario-2009
    quote: 'Alocução do Bispo Diocesano: Ofício Fúnebre da Revda. Maria de Fátima F. Pereira (17/04/2009)'
biography: >-
  Maria de Fátima Figueira Pereira foi ordenada diácona em 05/07/2008, no encerramento do Retiro do Clero em Recife
  (PE), por Robinson Cavalcanti, bispo diocesano da Diocese Anglicana do Recife (DAR). Em 2009 constava como ministra
  auxiliar na DAR. Faleceu em abril de 2009, e o ofício fúnebre foi realizado em 17/04/2009.
sources:
- source: drv-ordenacoes-diaconais-2008
  quote: >-
    apresentamos Josean, Lúcia Helena, Márcia, Márcio e Maria de Fátima para serem Ordenados ao Diaconato na Santa
    Igreja de Cristo.
- source: drp2-ord-diac-2008-07-05
  quote: >-
    Sermão de Ordenações Diaconais Reverendos: Josean, Lúcia Helena, Márcia Coelho, Márcio Simões e Maria de Fátima
    Encerramento do Retiro do Clero Catedral Anglicana do Bom Samaritano Boa Viagem, Recife (PE), 05/07/2008
- source: drp2-ord-diac-2008-07-05
  quote: +Dom Robinson Cavalcanti Bispo Diocesano
- source: dard1-com-norte-2009a
