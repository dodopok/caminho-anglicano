biography: >-
  Alfred Lee foi sagrado bispo de Delaware em 12 de outubro de 1841, na Capela de São Paulo, em Nova York, por Alexander
  Viets Griswold e outros bispos, e dirigiu a diocese até morrer, em Wilmington, em 12 de abril de 1887. Em 1884
  sucedeu o bispo Smith como bispo presidente da Igreja Episcopal.
