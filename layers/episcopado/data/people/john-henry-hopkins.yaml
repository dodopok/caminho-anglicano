biography: >-
  John Henry Hopkins (30/1/1792 – 9/1/1868) foi sagrado em 31/10/1832, na Capela de St. Paul, em Nova York, por
  William White, Alexander Viets Griswold e Nathaniel Bowen, e foi bispo de Vermont a partir de então. Em 13/1/1865,
  com a morte de Thomas Church Brownell, tornou-se Bispo Presidente da Igreja Episcopal, posição que manteve até
  morrer. Participou de cinco sagrações episcopais, entre elas as de John Williams (1851) e Horatio Potter (1854),
  e foi o sagrante principal de John Barrett Kerfoot (1866).
