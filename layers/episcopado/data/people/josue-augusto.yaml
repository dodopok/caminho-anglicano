id: josue-augusto
name: Josué Augusto
aliases:
- José Augusto
biography: >-
  Origem e primaz da Igreja Anglicana Unida do Brasil, depois ingressou na Igreja Anglicana Episcopal Brasileira
  (IAEBr). Esteve na sagração de Fernando Nobile, da Igreja Anglicana Cristo Redentor (Ribeirão Preto), e aparece
  em celebração com Ricardo Lorite, primaz da Igreja Anglicana do Brasil.
sources:
