    quote: >-
      A Catedral Anglicana de São Paulo, por exemplo, fundada em 1873, tinha apenas três reverendos até 2016. No
      espaço de dois anos, saltou para 23 — e todos, sem exceção, são egressos da Igreja Católica.
- type: other
  date: '2013'
  description: >-
