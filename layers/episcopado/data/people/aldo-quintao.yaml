- jurisdiction: ordem-dos-carmelitas
  role: clergy
  start: '1979'
  end_reason: transfer
  status: probable
  sources:
  - source: lq-cat-aldo
    quote: >-
      entrou para o seminário carmelita da Igreja Romana em 1979, na cidade de Itu (SP). Depois estudou em Camocim
      de São Félix (PE), em Curitiba e em São Paulo, tornando-se frade carmelita. Entrando na Igreja Anglicana,
      e já ordenado sacerdote, estudou e morou em Toronto, no Canadá.
  notes: >-
    Entrada no seminário em 1979; data de saída da Ordem/Igreja Católica Romana e data de ordenação não informadas
    pelo site.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dasp
  start: '1998'
  end: '2013-04-17'
  end_reason: schism
  status: confirmed
  sources:
  - source: lq-ieab-acoes
    quote: Dos 34 membros clericais vinculados canonicamente à DASP/Igreja Episcopal Anglicana do Brasil (IEAB)
  - source: lbd-snieab-sinais
    quote: >-
      declara publicamente, em 17 de abril de 2013, o Abandono de Comunhão com a IGREJA EPISCOPAL ANGLICANA DO BRASIL/COMUNHÃO
      ANGLICANA dos seguintes clérigos: Reverendo Aldo Pereira Quintão
  - source: lbd-snieab-sinais
    quote: >-
      Após um período de sete meses de recusa de reconciliação pastoral e de insistência em manter as ações de insubordinação
      e de desobediência aos Cânones e à Constituição
  - source: lq-vejasp-2016
    quote: >-
      Depois de fazer um curso no Canadá, assumiu o cargo de pároco da igreja da Zona Sul em 1998. Quinze anos depois,
      rompeu com a Igreja Episcopal Anglicana do Brasil
  - source: lq-vejasp-2016
    quote: >-
      “Ele não se submetia às regras eclesiásticas, discordava da hierarquia”, afirma o reverendo Arthur Cavalcante,
      secretário‑geral da entidade.
  - source: lq-vejasp-2016
    quote: Aldo Quintão comemora que seis colegas o acompanharam na cisão
  - source: rta-alesp-2018-integra
    quote: Narra sua chegada à Igreja Anglicana, há 23 anos.
  - source: rta-alesp-2018-integra
    quote: Entrando na Igreja Anglicana, e já ordenado sacerdote, estudou e morou em Toronto, no Canadá.
  notes: >-
    A IEAB descreve o desligamento como 'abandono de comunhão' declarado pelo Bispo Primaz em 17/04/2013. A Catedral,
    por sua vez, afirma em carta aberta de 19/04/2013 que sua filiação à igreja nacional era apenas espiritual e
    que se mantém anglicana sob bispos da Comunhão Anglicana (Roger Bird e Glauco Soares de Lima). Outras fontes
    datam o desligamento formal em 06/04/2013 (alteração de estatutos). Local: Catedral Anglicana de São Paulo.
    Segundo a Veja São Paulo (16/12/2016), Aldo assumiu a paróquia (Catedral, Alto da Boa Vista) em 1998, depois
    de um curso no Canadá, e rompeu com a IEAB quinze anos depois. Esta data de 1998 contrasta com a fala de Aldo
    na Alesp em 2018, noticiada como 'cerca de 23 anos' de Igreja Anglicana (c. 1995), página não verificada. Em
    19/03/2018 Quintão, então pároco da Catedral Anglicana de São Paulo, diz ter chegado à Igreja Anglicana 'há
    23 anos' (c. 1995) e menciona que o reverendo César foi ordenado na mesma época com sermão de Monsenhor Tarcísio
    Loro. A Veja SP (2016) indica que assumiu a paróquia da Zona Sul em 1998.
  discrepancies:
