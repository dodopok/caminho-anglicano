    Quintão e por Bird, alterou o estatuto da igreja.
  status: confirmed
  sources:
  - source: lbd-ieab-acoes
    quote: >-
      02 de dezembro de 2012- Realização da Assembleia Geral Extraordinária da Catedral Anglicana de São Paulo,
      sem a ciência do Bispo Primaz, convocada pelo Deão Aldo Quintão e pelo Bispo Dom Roger Bird
  - source: lbd-ieab-acoes
