      A comunidade da Catedral – liderada pelo reverendo Aldo Quintão –, apoiava a candidatura do reverendo Francisco
      Cézar Fernandes Alves, e os demais delegados conciliares, a candidatura do reverendo Flávio Augusto Borges
      Irala.
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: >-
      a eleição foi considera irregular pelo bispo Roger Douglas Bird 30, declarando o cancelamento do Concílio.
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: >-
      Durante o 47º Concílio da DASP o reverendo Flávio Irala foi eleito bispo desta diocese por 19 a 18 votos na
