biography: >-
  Elias Batista Nogueira foi sagrado bispo em 12 de novembro de 2011, em Mallet (RJ), por Josué Souza Torres, bispo
  primaz da Igreja Episcopal do Evangelho Pleno. Em 5 de março de 2011 já assinava como diretor presidente da Convenção
  Eclesiástica Filhos da Promessa (CEFIP), da qual é patriarca presidente, e é bispo-primaz da Igreja Episcopal
  Filhos da Promessa. Preside desde 2012 o Conselho Nacional de Bispos Protestantes do Brasil e fundou nesse ano,
  com Roberto de Avelar Coelho da Silva, a Ordem Anglicana Filhos da Promessa. Participou de cinco sagrações episcopais,
  entre elas as de Elcemir Durans Mendonça, Reinaldo da Silva Tavares e José Kennedy de Freitas, em 10 de novembro
  de 2012. Em 1º de maio de 2026, como bispo primaz da Comunhão Episcopal Protestante no Brasil, recebeu na Convenção
  José Carlos Berti Junior, fundador da Igreja Episcopal Brasileira. É casado com a bispa Eliane Helena da Silva
  Nogueira.
