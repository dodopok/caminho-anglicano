id: ramaces-hartwig
name: Ramacés Hartwig
full_name: Ramacés Hartwig
biography: >-
  Consta em lista do clero nacional como ordenado diácono na IEAB em 1982. Em 15 de julho de 2004 integrava a Comissão
  de Sistematização do I Simpósio de Teologia Anglicana, na Diocese Anglicana do Recife. Em 19 de agosto de 2007,
  após o pedido de licença ministerial do Rev. Cláudio, foi empossado pelo bispo diocesano como novo pároco de uma
  comunidade da diocese.
