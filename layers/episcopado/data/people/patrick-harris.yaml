  notes: A página de 22/05/2011 o chama de "Bispo da Igreja da Inglaterra"; não informa a diocese.
events:
- type: other
  date: 2011-05
  description: >-
    Segundo o site da Diocese do Recife, o bispo Patrick Harris, da Igreja da Inglaterra, foi um dos enviados especiais
    do arcebispo de Cantuária, Rowan Williams, ao Brasil para estudar no local o conflito da Província (IEAB) com
    a Diocese do Recife, ouvindo todas as partes; segundo a mesma fonte, o relatório nunca foi divulgado pelo Palácio
    de Lambeth. Em 22/05/2011 ele enviou ao bispo Robinson Cavalcanti uma mensagem de congratulações pelo 35º aniversário
    da diocese.
  status: probable
