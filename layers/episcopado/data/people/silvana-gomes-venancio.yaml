ordinations:
- order: diaconate
  date: '2009-12-05'
  place: Jaboatão dos Guararapes (PE)
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: darn1-concilio09
    quote: Quero parabenizar e saudar a nova Revdª Silvana+, Ordenada ao Diaconato
  - source: darn1-concilio09
    quote: A Ordenação da Silvana foi muito bonita.
  - source: darn1-concilio09
    quote: Revda. Silvana Venancio+
  - source: darb2-sermao-xxix-encerramento
    quote: >-
      Nele teremos a profissão de votos de um Noviço de ordem religiosa, teremos a formatura e a investidura de
      nossa primeira turma de Capelães, teremos reconhecimento de Ordem Diaconal e Ordenações Diaconais.
  - source: darb2-sermao-xxix-encerramento
    quote: >-
      Edilson e Silvana , Uma palavra especial para vocês nessa data tão importante e inesquecível de resposta ao
      chamado do Senhor.
  notes: >-
    Ordenada diácona durante o concílio diocesano de dezembro de 2009 (as mensagens foram publicadas em 14/12/2009).
    Os textos não informam o dia exato nem o bispo ordenante; ela é apresentada como ligada ao Ponto Missionário
    Anglicano Caminho de Emaús (Niterói-RJ). Em 2010 aparece como candidata ao presbiterato. O sermão de encerramento
    do XXIX Concílio Diocesano (05/12/2009, Jaboatão dos Guararapes) anuncia para o culto 'Ordenações Diaconais'
    e dirige-se a Edilson e Silvana; a identificação de Silvana com Silvana Gomes Venâncio se apoia em outras fontes
    da diocese que a dão como ordenada ao diaconato em dezembro de 2009. O sermão não nomeia o ordenante, mas é
    do bispo diocesano, que presidia o culto; a data fina (05/12) é inferida do dia do culto.
- order: presbyterate
  date: '2010-07-31'
  place: Paróquia Anglicana da Santíssima Trindade, Copacabana, Rio de Janeiro-RJ
  jurisdiction: diocese-anglicana-recife
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: dar-2010-silvana-convite
    quote: >-
      convida V.Sa. e família para o Culto Solene de Ordenação Presbiteral da Diácona : Silvana Gomes Venancio Local:
      Paróquia Anglicana Santíssima Trindade Rua Guimarães Natal, 31 – Copacabana Rio de Janeiro-RJ
  - source: dar-2010-silvana-convite
    quote: 'Data: 31 de julho de 2010'
  - source: dar-clero-diaconos-2010
    quote: Revda. Silvana Gomes Venâncio
  - source: darb2-sermao-silvana
    quote: >-
      Sermão de Ordenação Presbiteral da Revda. Silvana Gomes Venancio Paróquia Anglicana da Santíssima Trindade
      Copacabana (RJ), 31.07.2010
  - source: darb2-sermao-silvana
    quote: Silvana é Ordenada em uma determinada conjuntura histórica
  - source: darb2-sermao-silvana
    quote: >-
      A Ordenação de uma pastora, de uma anglicana mulher no Rio de Janeiro, que foi a última Diocese a realizá-la
      na velha Província brasileira
  - source: darb2-sermao-silvana
    quote: +Bispo Robinson Cavalcanti
  - source: d2s20-silvana-niteroi
    quote: Depois de ter Ordenado ao Presbiterado a Reverenda Silvana Venancio
  - source: d2s21-silvana-convite
    quote: 'Local: Paróquia Anglicana Santíssima Trindade'
  - source: d2s21-silvana-convite
    quote: 'Data: 31 de julho de 2010'
  notes: >-
    Fonte é o convite (anúncio prévio). Em fev/2010 constava como diácona (PMA Caminho de Emaús, Niterói). Em ago/2010
    o site diz que Robinson 'em apenas um mês Ordenou o segundo Presbítero no Arcediagado sul-sudeste' (Jorge Torres),
    compatível com esta ordenação ter ocorrido. Em 2013 aparece como 'Rev.' Silvana Venâncio. Sermão proferido pelo
    bispo diocesano na própria cerimônia, que ele descreve como a ordenação de uma presbítera no Rio de Janeiro;
    a página traz local e data (31/07/2010) e é assinada por Dom Robinson Cavalcanti, que preside o rito. Confirma,
    com o relato do próprio ato, a ordenação antes conhecida só pelo convite. Notícia de 01/08/2010 relata a ordenação
    presbiteral de Silvana Venancio pelo bispo Robinson Cavalcanti como fato já ocorrido; a data e o local vêm do
    convite publicado pela diocese. A matéria de 01/08/2010 relata, no passado, que o bispo Robinson Cavalcanti
    ordenou ao presbiterado a Revda. Silvana Venancio antes de seguir para Niterói; local e data (31/07/2010) vêm
    do convite oficial publicado em 22/07/2010. O relato não repete a data.
