id: silvana-gomes-venancio
name: Silvana Gomes Venâncio
full_name: Silvana Gomes Venancio Cabral
aliases:
- Revda. Silvana Venâncio
- Silvana Gomes Venancio Cabral
biography: >-
  Silvana Gomes Venâncio foi ordenada diácona em 05/12/2009, no 29º Concílio da Diocese Anglicana do Recife, e presbítera
  em 31/07/2010, por Robinson Cavalcanti, em culto na Paróquia Anglicana da Santíssima Trindade, em Copacabana (RJ).
  Antes de ser ordenada, era ministra local e candidata às Sagradas Ordens à frente do Ponto Missionário Anglicano
  Caminho de Emaús, em Niterói (RJ). Passou a ministra encarregada desse ponto missionário, no Arcediagado Sul-Sudeste,
  e em 2011 foi designada para a Comissão de Credenciais e Diplomacia da diocese.
