# yaml-language-server: $schema=../../schemas/person.json
id: silvana-gomes-venancio
name: Silvana Gomes Venâncio
full_name: Silvana Gomes Venancio Cabral
aliases:
- Revda. Silvana Venâncio
- Silvana Gomes Venancio Cabral
biography: >-
  Ordenada diácona em dezembro de 2009, na Diocese Anglicana do Recife, e presbítera em 31/07/2010, em cerimônia
  na Paróquia Anglicana da Santíssima Trindade, em Copacabana (RJ), por Robinson Cavalcanti. É ministra encarregada
  do Ponto Missionário Anglicano Caminho de Emaús (RJ), no Arcediagado Sul-Sudeste.
sources:
- source: darn1-concilio09
  quote: Quero parabenizar e saudar a nova Revdª Silvana+, Ordenada ao Diaconato
- source: dar-2010-silvana-convite
  quote: >-
    convida V.Sa. e família para o Culto Solene de Ordenação Presbiteral da Diácona : Silvana Gomes Venancio Local:
    Paróquia Anglicana Santíssima Trindade Rua Guimarães Natal, 31 – Copacabana Rio de Janeiro-RJ
- source: dar-2010-silvana-convite
  quote: 'Data: 31 de julho de 2010'
- source: darb2-sermao-silvana
  quote: >-
    Sermão de Ordenação Presbiteral da Revda. Silvana Gomes Venancio Paróquia Anglicana da Santíssima Trindade Copacabana
    (RJ), 31.07.2010
- source: dard2-com-extra
  quote: 'PONTO MISSIONÁRIO ANGLICANO CAMINHO DE EMAÚS Ministra Encarregada: Revda. Silvana Cabral Venâncio'
- source: darn1-xxx
  quote: Revda. Silvana Venancio (Ponto Missionário Anglicano Caminho de Emaús) do Arcediagado Sul-Sudeste
ordinations:
- order: diaconate
  date: 2009-12
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: darn1-concilio09
    quote: Quero parabenizar e saudar a nova Revdª Silvana+, Ordenada ao Diaconato
  - source: darn1-concilio09
    quote: A Ordenação da Silvana foi muito bonita.
  - source: darn1-concilio09
    quote: Revda. Silvana Venancio+
  notes: >-
    Ordenada diácona durante o concílio diocesano de dezembro de 2009 (as mensagens foram publicadas em 14/12/2009).
    Os textos não informam o dia exato nem o bispo ordenante; ela é apresentada como ligada ao Ponto Missionário
    Anglicano Caminho de Emaús (Niterói-RJ). Em 2010 aparece como candidata ao presbiterato.
- order: presbyterate
  date: '2010-07-31'
  place: Paróquia Anglicana Santíssima Trindade, Copacabana, Rio de Janeiro-RJ
  jurisdiction: diocese-anglicana-recife
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: dar-2010-silvana-convite
    quote: >-
      convida V.Sa. e família para o Culto Solene de Ordenação Presbiteral da Diácona : Silvana Gomes Venancio Local:
      Paróquia Anglicana Santíssima Trindade Rua Guimarães Natal, 31 – Copacabana Rio de Janeiro-RJ
  - source: dar-2010-silvana-convite
    quote: 'Data: 31 de julho de 2010'
  - source: dar-clero-diaconos-2010
    quote: Revda. Silvana Gomes Venâncio
  - source: darb2-sermao-silvana
    quote: >-
      Sermão de Ordenação Presbiteral da Revda. Silvana Gomes Venancio Paróquia Anglicana da Santíssima Trindade
      Copacabana (RJ), 31.07.2010
  - source: darb2-sermao-silvana
    quote: Silvana é Ordenada em uma determinada conjuntura histórica
  - source: darb2-sermao-silvana
    quote: >-
      A Ordenação de uma pastora, de uma anglicana mulher no Rio de Janeiro, que foi a última Diocese a realizá-la
      na velha Província brasileira
  - source: darb2-sermao-silvana
    quote: +Bispo Robinson Cavalcanti
  notes: >-
    Fonte é o convite (anúncio prévio). Em fev/2010 constava como diácona (PMA Caminho de Emaús, Niterói). Em ago/2010
    o site diz que Robinson 'em apenas um mês Ordenou o segundo Presbítero no Arcediagado sul-sudeste' (Jorge Torres),
    compatível com esta ordenação ter ocorrido. Em 2013 aparece como 'Rev.' Silvana Venâncio. Sermão proferido pelo
    bispo diocesano na própria cerimônia, que ele descreve como a ordenação de uma presbítera no Rio de Janeiro;
    a página traz local e data (31/07/2010) e é assinada por Dom Robinson Cavalcanti, que preside o rito. Confirma,
    com o relato do próprio ato, a ordenação antes conhecida só pelo convite.
