- type: other
  date: '2010-11-30'
  description: >-
    Em 30/11/2010, na Assembleia de Fundação da Aliança Cristã Evangélica do Brasil (ACEB), em São Paulo, o bispo
    Robinson Cavalcanti foi eleito para o Conselho de Referência da entidade; a Diocese do Recife enviou pedido
    de filiação como entidade fundadora e foi representada também pela Revda. Silvana Venancio.
  status: confirmed
  sources:
  - source: d2s21-aceb
