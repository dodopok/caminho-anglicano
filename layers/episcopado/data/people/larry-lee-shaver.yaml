# yaml-language-server: $schema=../../schemas/person.json
id: larry-lee-shaver
name: Larry E. Shaver
aliases:
- Larry Lee Shaver
ordinations:
- order: episcopate
  date: '1972'
  jurisdiction: null
  principal_consecrator: frederick-littler-pyman
  status: probable
  sources:
  - source: lin-melton-arsa
    quote: >-
      He was elected and consecrated a bishop by Abp. Frederick Littler Pyman of the Evangelical Orthodox (Catholic)
      Church in America (Non-Papal Catholic) while still a Lutheran pastor (1972)
  notes: >-
    Primeira consagração de Shaver segundo Melton. Em 1985 ele foi "reconsecrated sub conditione" por Gerald Wayne
    Craig, Robert Q. Kennaugh e Ogden Miller (Holy Catholic Church, Anglican Rite Jurisdiction) e depois pelos arcebispos
    filipinos Francisco Pagtakhan e Macario V. Ga. Pyman consta na lista da AECI (Frederick Littler Pyman c1943),
    na linhagem de Antioquia que passa por Vilatte.
- order: episcopate
  date: '1985'
  jurisdiction: null
  principal_consecrator: gerald-wayne-craig
  co_consecrators:
  - ogden-miller
  - robert-q-kennaugh
  mode: conditional
  status: probable
  sources:
  - source: lin-melton-arsa
    quote: >-
      In 1985, Shaver was reconsecrated sub conditione by Abp. Gerald Wayne Craig Abp. Robert Q. Kennaugh, and Bp.
      Ogden Miller of the Holy Catholic Church, Anglican Rite Jurisdiction.
  notes: Consagração condicional; Melton não nomeia o sagrante principal (cita Craig primeiro).
events:
- type: other
  date: '1989'
  description: >-
    Fundação do Anglican Rite Synod in the Americas (1989), por David Marion-Davis, William C. Thompson e Larry
    L. Shaver, com permissão da Philippine Independent Catholic Church; Davis e Thompson eram "formerly of the Philippine
    Independent Catholic Church".
  status: probable
  sources:
  - source: lin-melton-arsa
    quote: >-
      The Anglican Rite Synod in the Americas was founded in 1989 by David Marion-Davis, William C. Thompson, and
      Rt. Rev. Larry L. Shaver (b. 1936)
  - source: lin-melton-arsa
    quote: >-
      Cofounders in this effort were Bps. Davis and Thompson, both formerly of the Philippine Independent Catholic
      Church.
