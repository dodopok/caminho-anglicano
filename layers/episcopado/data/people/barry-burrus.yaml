id: barry-burrus
name: Barry Burrus
death:
  date: '2009-10-21'
  sources:
  - source: lia-iatb-noticias-2010
    quote: >-
      Tivemos contato com o Bispo Barry Burrus no início da organização da nossa Jurisdição e por esse motivo o
      primeiro nome da nossa Igreja era Igreja Anglicana Católica no Brasil.
events:
- type: death
  date: '2009-10-21'
  description: >-
    Morte do arcebispo Barry Burrus (Igreja Católica Anglicana, EUA), em 21/10/2009; a IATB informa que o contato
    com ele no início de sua organização levou ao primeiro nome da Igreja, 'Igreja Anglicana Católica no Brasil'.
  status: confirmed
  sources:
  - source: lia-iatb-noticias-2010
    quote: >-
      Tivemos contato com o Bispo Barry Burrus no início da organização da nossa Jurisdição e por esse motivo o
      primeiro nome da nossa Igreja era Igreja Anglicana Católica no Brasil.
- type: other
  date: '2006'
  description: >-
    Rui Costa Barbosa conta que, ao deixar a Igreja Anglicana do Brasil de Ricardo Lorite, organizou com dois clérigos
    uma nova igreja, primeiro ligada a Barry Burrus e chamada Igreja Anglicana Católica do Brasil (registrada em
    Araraquara), depois rebatizada Igreja Anglicana Tradicional do Brasil e registrada em 2006 em Santo André.
  status: probable
  sources:
  - source: yt-raizes-da-fe-ep4
    quote: usássemos então igreja Igreja Anglicânica Católica do Brasil.
  - source: yt-raizes-da-fe-ep4
    quote: >-
      As pessoas eram as mesmas, mas mudamos o nome e registramos a igreja. Isso aconteceu em 2006 e registramos
      já com esse nome.
