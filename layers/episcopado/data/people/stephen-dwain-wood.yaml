birth:
  date: '1963-10-12'
  sources:
  - source: gacl-acna-wood-bio
    quote: Born October 12, 1963, Archbishop Wood is the oldest of two sons
biography: >-
  Nascido em 1963, foi ordenado diácono em 15/06/1991 e presbítero em 01/02/1992 por James R. Moodey (TEC, Ohio).
  Eleito primeiro bispo da Diocese das Carolinas (ACNA), foi sagrado em 25/08/2012 por Robert Duncan. Eleito terceiro
  arcebispo e primaz da ACNA em junho de 2024, sucedendo Foley Beach, assumiu em 28/06/2024; em 16/11/2025 foi inibido
  do ministério pelo deão da província, Julian Dobbs, e seu julgamento foi concluído em 11/09/2026, com decisão
  prevista até 21/12/2026.
sources:
- source: gacl-acna-wood-bio
  quote: Born October 12, 1963, Archbishop Wood is the oldest of two sons
- source: gacl-acna-wood-bio
  quote: >-
    Archbishop Wood was ordained to the diaconate on June 15, 1991 and to the priesthood on February 1, 1992 by
    Bishop James R. Moodey, VIII Bishop of Ohio.
- source: gacl-acna-wood-bio
  quote: >-
    Archbishop Wood was elected as the first Bishop of the Diocese of the Carolinas by the College of Bishops on
    June 5, 2012. He was consecrated Bishop at St. Andrew’s Anglican Church in Mt. Pleasant, SC by Archbishop Robert
    Duncan on August 25, 2013. Co-Consecrators included ACNA Bishops Roger Ames, Alphonza Gadsen, and John Guernsey.
- source: gacl-wp-wood
  quote: >-
    Wood was consecrated on August 25, 2012, at St. Andrew's by Archbishop [[Robert Duncan (bishop)|Robert Duncan]].
    Co-consecrators included Archbishop-elect [[Stanley Ntagali]] of Uganda and Bishops Guernsey, [[Roger Ames]],
    and [[Alphonza Gadsden]].
- source: gacl-acna-wood-bio
  quote: >-
    Archbishop Wood was elected as the first Bishop of the Diocese of the Carolinas by the College of Bishops on
    June 5, 2012.
- source: gacl-acna-wood-bio
  quote: >-
    The Most Rev. Stephen D. Wood was elected as the third Archbishop of the Province of the Anglican Church in
    North America on June 22, 2024.
- source: gacl-wp-wood
  quote: He formally took office on June 28, at the conclusion of the ACNA's provincial assembly.
- source: cant-novas-igrejas-2024
  quote: Stephen Dwain Wood sucedeu o arcebispo Foley Beach, na primazia da denominação
  page: '22'
- source: gacl-acna-trial-page
  quote: >-
    On Sunday, November 16 Bishop Julian Dobbs who serves as Dean of the Province, inhibited Archbishop Stephen
    D. Wood from the exercise of ordained ministry in the Anglican Church in North America, in accordance with the
    canons of our Church.
- source: gacl-acna-trial-page
  quote: >-
    The trial of Archbishop Stephen Wood concluded September 11, 2026, following five days of testimony from 38
    witnesses. The Court expects ... an opinion due no later than December 21, 2026.
