biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Montgomery,
  Alabama, EUA (1930-07-20). Ordenado diácono em jun/1959 e presbítero em jun/1960. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
