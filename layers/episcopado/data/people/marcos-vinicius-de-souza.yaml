id: marcos-vinicius-de-souza
name: Marcos Vinícius de Souza
full_name: Marcos Vinícius de Souza
aliases:
- Dom Marcos Vinícius
biography: >-
  Marcos Vinícius de Souza formou-se em filosofia em 2006, com formação nos seminários São José, em Assis (SP),
  e Sagrado Coração de Jesus, em Marília (SP), e desde 2007 é professor da rede pública estadual de São Paulo. Em
  2012 iniciou o bacharelado em teologia na Igreja Católica Anglicana, foi ordenado diácono em 2015 e presbítero
  em 2016 e foi sagrado bispo em 2018 por Ricardo Vicente dos Anjos, com Altamiro Pereira do Amaral e Jorge dos
  Santos Costa. É bispo da Prelazia Anglicana de São Paulo, na Igreja Católica Anglicana do Brasil, e da Comunidade
  Anglicana Sagrada Família.
sources:
- source: lica-marcos-quemsou
  quote: >-
    formou-se em filosofia no ano de 2006 e teve ampla formação intelectual no Seminário São José em Assis/SP e
    Seminário Provincial Sagrado Coração de Jesus em Marília/SP
- source: lica-marcos-quemsou
  quote: >-
    Em 2007 iniciou sua carreira como professor de filosofia, sociologia e história onde imediatamente se tornou
    efetivo na rede pública Estadual de São Paulo.
- source: lica-marcos-quemsou
  quote: Em 2012, iniciou sua trajetória na Igreja Católica Anglicana onde cursou o Bacharelado em Teologia.
- source: lica-marcos-quemsou
  quote: Foi ordenado diácono em 2015, presbítero em 2016
- source: lica-marcos-quemsou
  quote: >-
    que transmitiu sua sucessão apóstólica para Dom Ricardo Vicente dos Anjos que ordenou Dom Marcos Vinicius de
    Souza, juntamente com Dom Altamiro Pereira do Amaral e por Dom Jorge dos Santos Costa.
- source: lica-marcos-quemsou
  quote: foi ordenado Bispo em 2018
- source: lica-icabr-quemsomos
  quote: Dom Marcos Vinícius de Souza Bispo da Prelazia Anglicana de São Paulo/SP
- source: lica-marcos-quemsou
  quote: Sou bispo da Comunidade Anglicana Sagrada Família, parte da Igreja Católica Anglicana do Brasil.
