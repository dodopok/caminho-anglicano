  notes: >-
    Registro oficial do Journal de 1970 (n.º DCXXX da lista de bispos). O texto acrescenta 'assisted by the following
    Bishops': James C. L. Wong (Taiwan), David S. Rose (Sul da Virgínia), I. H. Nosse (Yokohama, aposentado), Benito
    C. Cabanban (Filipinas), Paul C. Lee (Seul), David M. Goto (Tóquio) e Kenneth Abbott Vaill (Tóquio, aposentado).
    CORRIGIDO o ano: o pôster diz que Hines sagrou Browning "em 1959" como bispo de Okinawa; 1959 é o ano em que
    Browning chegou a Okinawa como presbítero. A sagração foi em 5/01/1968 (ENS). Sagrante principal Hines CONFIRMADO.
    A Wikipédia lista ainda como bispos assistentes James C. L. Wong, David S. Rose, Isaac H. Nosse, Benito Cabanban,
    Paul C. Lee, David M. Goto e Kenneth A. Viall (citando o Journal of the General Convention de 1970); a lista
    de sucessão da Wikipédia põe Francis C. Rowinski (PNCC) como co-sagrante, com "citation needed".
