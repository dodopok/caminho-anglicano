biography: >-
  Horatio Potter foi sagrado bispo provisório de Nova York em 22/11/1854, na Trinity Church, por Thomas Church Brownell,
  com outros bispos como co-consagrantes, e tornou-se bispo diocesano em 1861, com a morte de Onderdonk. Permaneceu
  no cargo até morrer, em 2/1/1887; seu sobrinho Henry Codman Potter foi seu sucessor na diocese. Participou de
  cinco sagrações episcopais, entre elas a de Abram Newkirk Littlejohn, de quem foi sagrante principal, e a de Daniel
  Tuttle.
sources:
