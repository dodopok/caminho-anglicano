    quote: da Ven. Arc. Revda. Gorete
  - source: darl1-3091
    quote: >-
      Revda. Gorete é Pároca e Arcediaga na região Norte da Diocese; Rev. Tibério Marques é Secretário Diocesano
      de Homens e Contador Diocesano;
  notes: 'Citada como arcediaga em agosto de 2005. Local: Arcediagado Norte. Em dezembro de 2008.'
- jurisdiction: diocese-anglicana-recife
