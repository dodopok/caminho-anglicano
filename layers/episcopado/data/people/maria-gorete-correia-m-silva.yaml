# yaml-language-server: $schema=../../schemas/person.json
id: maria-gorete-correia-m-silva
name: Maria Gorete Correia M. Silva
biography: >-
  Arcediaga da Diocese Anglicana do Recife em 2004 e 2005, titular do Arcediagado Norte em 2006; Secretária Diocesana
  de Ação Social em 2005.
sources:
- source: drp-calendario-2004
  quote: Ven. Arced. Revda. Maria Gorete C. M. Silva
- source: drp-carta-venables-pt-2005
  quote: Ven. Arc. Revda. Maria Gorete Correia M. da Silva – Séc. Diocesana de Ação Social
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Ven. Arc. Revda. Maria Gorete C.M. Silva
  - source: drv-nota-esclarecimento-2006
    quote: Maria Gorete C. Marques da Silva, ose
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Maria Gorete Correia M. Silva … Os clérigos não atenderam
      à convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: ieab-dar
  role: other
  role_description: arcediago
  status: confirmed
  sources:
  - source: drp-calendario-2004
    quote: Ven. Arced. Revda. Maria Gorete C. M. Silva
  notes: >-
    Local: Diocese Anglicana do Recife. Título de arcediaga atestado no calendário diocesano de 2004 (publicado
    em 2003).
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: arcediago
  status: confirmed
  sources:
  - source: drp-carta-venables-pt-2005
    quote: Ven. Arc. Revda. Maria Gorete Correia M. da Silva – Séc. Diocesana de Ação Social
  - source: drp-boletim-oracao-2006
    quote: Norte – Ven. Arc. Revda. Maria Gorete C. Marques Silva
  - source: drv-carta-clero-primaz
    quote: Revda. Arc. Maria Gorete C. Marques da Silva, ose
  notes: >-
    Assina a carta a Venables (17/10/2005) como arcediaga e Secretária Diocesana de Ação Social. Local: Arcediagado
    Norte. Arcediagado Norte em out/nov de 2006; também pastoreia a Paróquia Anglicana da Redenção. Cargo exercido
    em julho de 2007 (carta do clero ao primaz do Cone Sul); início e fim não informados.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Maria Gorete Correia M. Silva … Recife, 23 de agosto de
      2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: arcediaga
  status: confirmed
  sources:
