events:
- type: other
  date: '2004-06-25'
  description: >-
    Em 25/06/2004 os arcediagos da DAR (Maurício Coelho, Quintino Orengo, Maria Gorete Marques e Luiz Souza de França)
    enviaram carta aberta ao Primaz da IEAB, Dom Orlando Santos de Oliveira, repudiando o texto da Comissão Especial
    designada por ele para estudar a conjuntura eclesial, no que se referia ao bispo diocesano do Recife.
  status: confirmed
  sources:
  - source: darl3-primaz-0406
    quote: >-
      vimos por meio desta explicitar de forma indignada nosso público repúdio às palavras injuriosas contidas no
      citado documento
  - source: darl3-primaz-0406
    quote: Recife, 25 de junho de 2004.
- type: other
  date: '1997-11-17'
  description: >-
    A Paróquia Anglicana da Redenção (bairro de Rio Doce) foi fundada em 17/11/1997, quando o bispo Robinson Cavalcanti
    passou o bastão à Revda. Gorete Marques, após confirmar a primeira remessa de membros; em dezembro de 2008 Gorete
    era pároca e arcediaga da região Norte e o Rev. Tibério Marques, secretário diocesano de Homens e contador diocesano.
  status: confirmed
  sources:
  - source: darl3-n4616
    quote: Fundada em 17 de novembro de 1997
  - source: darl3-n4616
    quote: >-
      quando passava o bastão para a Revda. Gorete Marques, ose, após ter Confirmado a primeira remessa de membros
  - source: darl3-n4616
    quote: >-
      Revda. Gorete é Pároca e Arcediaga na região Norte da Diocese; Rev. Tibério Marques é Secretário Diocesano
      de Homens e Contador Diocesano
- type: other
  date: '1997-11-17'
  description: >-
    A Paróquia Anglicana da Redenção (Olinda-PE) completou treze anos em 17/11/2010 (fundação em 17/11/1997); o
    texto de 21/11/2010 diz que o trabalho foi iniciado por Robinson Cavalcanti quando ainda era presbítero.
  status: probable
  sources:
  - source: d2s04-gorete-13anos
    quote: >-
      A Paróquia Anglicana da Redenção completou dia 17 de novembro de 2010, treze anos de bem servir a DEUS-PAI
      e à comunidade em que está inserida.
  - source: d2s04-gorete-13anos
    quote: trabalho por ele iniciado quando, então, Presbítero
- type: other
  date: '1997-11-17'
  description: >-
    A Paróquia Anglicana da Redenção (Olinda-PE) teve seu primeiro culto público em 17 de novembro de 1997, em prédio
    alugado em Rio Doce, com 22 confirmados (8 novos e 14 vindos da Paróquia Emanuel); no Concílio de 1997 passou
    ao status de Missão. O texto diz que Robinson Cavalcanti foi o primeiro pároco do trabalho.
  status: confirmed
  sources:
  - source: d2s05-redencao-12anos
    quote: >-
      A Paróquia Anglicana da Redenção teve seu primeiro culto púbico no dia 17 de novembro de 1997, em um prédio
      alugado, situado na Av. das Garças, nº.726 – IV Etapa de Rio Doce, Olinda-PE.
  - source: d2s05-redencao-12anos
    quote: >-
      formando, assim, um grupo de 22 Confirmados, passando no Concílio do mesmo ano (1997) ao status de Missão
  - source: d2s05-redencao-12anos
    quote: nosso Pai em Deus, que foi o primeiro Pároco deste trabalho
- type: other
  date: '2004'
  description: >-
    A Paróquia Anglicana da Redenção (Olinda-PE) passou ao status de Paróquia Subvencionada em 2000 e, em 2004,
    à condição de Paróquia Autônoma; em 2003 mudou-se para prédio próprio, adquirido por financiamento.
  status: confirmed
  sources:
  - source: d2s05-redencao-12anos
    quote: Em 2000, passamos ao status de Paróquia Subvencionada .
  - source: d2s05-redencao-12anos
    quote: Em 2004, passamos à condição de Paróquia Autônoma
  - source: d2s05-redencao-12anos
    quote: >-
      Em 2003, saímos deste local, para a II Etapa, no atual endereço, só que desta feita, para um prédio já de
      propriedade da Paróquia
- type: other
  date: 2003-12
  description: >-
    Concílio Diocesano da Diocese Anglicana do Recife (provavelmente o de dezembro de 2003) recebeu documentos de
    16 paróquias e missões com abaixo-assinado de mais de 800 membros em plena comunhão, que apoiavam o bispo diocesano,
    o bispo sufragâneo e o Conselho Diocesano, em especial a 'Afirmação do Recife' e a Resolução 1.10 de Lambeth
    (1998), conforme carta de arcediagos e do deão de 25/06/2004.
  status: probable
  sources:
  - source: darl3-primaz-0406
    quote: >-
      quando foi-lhe entregue solenemente documentos oriundos de 16 paróquias e missões contendo um "abaixo-assinado"
      com mais de 800 assinaturas de membros em plena comunhão dessas comunidades diocesanas
  - source: darl3-primaz-0406
    quote: >-
      hipotecamos o mais amplo e sólido apoio às posturas e deliberações do nosso bispo diocesano, bispo sufragâneo
      e Conselho Diocesano
- type: other
  date: '1997-11-17'
  description: >-
    Primeiro culto público da Paróquia Anglicana da Redenção, em Olinda (PE), em 17/11/1997, em prédio alugado na
    Av. das Garças, Rio Doce IV, com 22 confirmados (8 novos e 14 vindos da Paróquia Anglicana Emanuel); no Concílio
    de 1997 o grupo passou ao status de Missão. Segundo o relato da própria paróquia, passou a Paróquia Subvencionada
    em 2000 e a Paróquia Autônoma em 2004; em 2003 mudou-se para prédio próprio. Revda. Maria Gorete Marques é a
    reitora.
  status: confirmed
  sources:
  - source: d2s05-redencao-12anos
    quote: A Paróquia Anglicana da Redenção teve seu primeiro culto púbico no dia 17 de novembro de 1997
  - source: d2s05-redencao-12anos
    quote: passando no Concílio do mesmo ano (1997) ao status de Missão
  - source: d2s05-redencao-12anos
    quote: Em 2000, passamos ao status de Paróquia Subvencionada
  - source: d2s05-redencao-12anos
    quote: Em 2004, passamos à condição de Paróquia Autônoma
