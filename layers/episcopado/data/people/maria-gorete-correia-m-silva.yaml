id: maria-gorete-correia-m-silva
name: Maria Gorete Correia M. Silva
biography: >-
  Maria Gorete Correia M. Silva é pároca da Paróquia Anglicana da Redenção, fundada em 17/11/1997, e foi arcediaga
  da região Norte da Diocese Anglicana do Recife (DAR), além de secretária diocesana de Ação Social. Em 25/06/2004
  assinou, com outros arcediagos, carta aberta ao primaz da IEAB repudiando palavras contidas em um documento. Em
  23/08/2005 foi excluída da comunhão da IEAB, tendo declarado manter comunhão com o bispo diocesano Robinson Cavalcanti.
  Membro e capelã da Ordem Evangélica de Santo Estevão Mártir, foi arcediaga adjunta nos anos seguintes.
