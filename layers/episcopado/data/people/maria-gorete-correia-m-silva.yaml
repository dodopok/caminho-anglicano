      Revda. Gorete é Pároca e Arcediaga na região Norte da Diocese; Rev. Tibério Marques é Secretário Diocesano
      de Homens e Contador Diocesano;
  - source: dard2-com-norte
    quote: >-
      Paróquia Anglicana da Redenção Pároca: Revda. Maria Gorete Correia, OSE Auxiliar: Rev. Tibério Marques, OSE
  notes: >-
    Local: Paróquia Anglicana da Redenção, Rio Doce, Olinda-PE. Em dezembro de 2008; já era a responsável pela comunidade
    desde a confirmação dos primeiros membros, em 17 de novembro de 1997, segundo o texto da própria paróquia. Local:
    Paróquia Anglicana da Redenção (Rio Doce, Olinda-PE; Arcediagado Norte). Página "Comunidades" do arcediagado,
    criada em 20/08/2009 e capturada em 29/11/2010; cargo atestado nesse intervalo, sem data de posse.
