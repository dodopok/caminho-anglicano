# yaml-language-server: $schema=../../schemas/person.json
id: josias-pereira-de-souza-junior
name: Josias Pereira de Souza Júnior
biography: >-
  Ordenado diácono em 28/08/2004, em Jaboatão dos Guararapes, e presbítero em 27/08/2005, no Recife, ambos por Robinson
  Cavalcanti, atuou na Diocese do Recife como secretário diocesano de juventude, auxiliar e membro da equipe pastoral.
  Em 23/08/2005 constou entre os clérigos excluídos da comunhão da IEAB por decreto, e eles declararam em carta
  manter comunhão com Robinson Cavalcanti.
sources:
