wikidata: Q7347251
biography: >-
  Robert Machray foi sagrado bispo de Rupert's Land em 24 de junho de 1865, na capela de Lambeth Palace, por Charles
  Thomas Longley, arcebispo de Cantuária.
sources:
- source: life-machray-1909
  quote: >-
    The Consecration took place in the chapel of Lambeth Palace on Saturday, June 24, the day being the Festival
    of St. John the Baptist. At eleven o'clock in the morning a procession, which had been formed in the Palace,
    entered the chapel ; it consisted of the consecrating prelates, who were the Archbishop of Canterbury (Dr. Longley),
    the Bishops of London (Dr. Tait) and Ely (Dr. Browne), the Bishop of Aber- deen (Dr. Suther), and Bishop Anderson
- source: life-machray-1909
  quote: >-
    Dr. Machray was presented to the Archbishop by the Bishops of London and Ely, and duly and canonically consecrated
    Bishop of Rupert's Land.
- source: iab-poster-linhagem-uchoa
  quote: >-
    156d. Charles Longley (1862-1868) que, em 1865, sagrou Robert Machray como bispo da Igreja Anglicana do Canadá.
