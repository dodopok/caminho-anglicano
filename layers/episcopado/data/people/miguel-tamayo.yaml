events:
- type: other
  date: '2010-11-12'
  description: >-
    Em 12/11/2010 a Igreja Anglicana do Uruguai, em Sínodo Extraordinário em Montevidéu sob a presidência do bispo
    Miguel Tamayo, delibera por maioria simples de clérigos e leigos se desvincular da Igreja Anglicana do Cone
    Sul e se transferir para outra Província da Comunhão Anglicana; pede a anuência do Cone Sul em até um ano ou,
    do contrário, uma Supervisão Primacial Alternativa. A decisão veio uma semana depois de o Sínodo Provincial
    do Cone Sul rejeitar a moção que permitia a 'solução local' (diocesana) para a ordenação feminina.
  status: confirmed
