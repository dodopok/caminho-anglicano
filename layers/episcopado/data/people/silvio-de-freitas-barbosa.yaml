id: silvio-de-freitas-barbosa
name: Sílvio de Freitas Barbosa
aliases:
- Silvio Freitas
- Silvio Freitas Barbosa
biography: >-
  Seminarista em 2004, Sílvio de Freitas Barbosa foi ordenado diácono em 10/09/2005, na Diocese Anglicana do Recife
  (IEAB), por Filadelfo Oliveira Neto. Membro da TSSF, consta como diácono e auxiliar e, por volta de 2006, integrava
  como reverendo um grupo de trabalho da diocese.
