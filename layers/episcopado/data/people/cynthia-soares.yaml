id: cynthia-soares
name: Cynthia Muniz Soares
full_name: Cynthia Muniz Soares
aliases:
- Cynthia Muniz
- Cynthia Soares
- Revda. Cynthia Muniz
biography: >-
  Cynthia Muniz Soares era da IAB, de onde saiu no fim de 2024 para a Rede Episcopal Brasileira (REB), na qual foi
  postulante a partir de 20 de dezembro de 2024. Com Douglas Araújo plantou a Igreja Anglicana Porto, em São Paulo,
  iniciada em 1º de junho de 2024 e aberta ao público em 9 de setembro de 2024. Foi ordenada diácona em 9 de março
  de 2025 e presbítera em 24 de outubro de 2025, ambas por Eric Rodrigues, a segunda no sínodo diocesano em Vitória
  (ES). Pastora da Porto, preside a Comissão de Teologia da REB, que indicou a FLAM e a FTSA como instituições de
  formação teológica. É bacharela em Teologia pela FTSA, especialista em Novo Testamento e mestranda em Estudos
  Bíblicos e Teológicos do Novo Testamento no STJE. Palestrou na 1ª Conferência Teológica e no 1º Sínodo da REB,
  em 2025.
