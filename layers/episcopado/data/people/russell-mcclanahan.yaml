# yaml-language-server: $schema=../../schemas/person.json
id: russell-mcclanahan
name: Russell McClanahan
aliases:
- Abp. Dr. Russell McClanahan
- Bishop Russ
biography: >-
  Um dos dois primeiros bispos sagrados na fundação da CEEC/EECI em 1995; depois arcebispo da Província de São Pedro
  da CEEC e patriarca da Evangelical Episcopal Communion (EEC).
sources:
- source: enwiki-ceec
  quote: >-
    The first two bishops consecrated included Vincent McCall (who later seceded from the EEC) and Russell McClanahan,
    former archbishop of the CEEC Province of St. Peter
ordinations:
- order: episcopate
  date: '1995-10-03'
  place: Hylton Memorial Chapel, Fredericksburg, Virginia (EUA)
  jurisdiction: ceec
  principal_consecrator: michael-owen
  co_consecrators:
  - daniel-c-gincig
  - owen-augustine
  status: probable
  sources:
  - source: enwiki-ceec
    quote: >-
      He was consecrated on October 3, 1995 by the Right Reverend Michael Owen (Chief Consecrator), The Most Reverend
      Owen Augustine, and The Most Reverend Daniel C. Gincig at Hylton Memorial Chapel in Fredericksburg, VA.
  - source: geec-ourstory
    quote: >-
      On October 3, 1995, the founding convention was held in Fredericksburg, Virginia. At that gathering, priests
      and deacons were ordained, bishops were consecrated in historic apostolic succession
  - source: rtb-ceec-succession
    quote: >-
      Michael D. Owen Bishop of The Communion of Evangelical Episcopal Churches who on the 3rd of October, 1995,
      consecrated Russell McClanahan
  - source: cant-novas-igrejas-2024
    quote: >-
      Em outubro de 1995, representantes de cerca de 25 congregações independentes de origens diversas, reuniram-se
      em Dale City, Virgínia, para consagração de dois primeiros bispos da denominação: Vincent McCall e Russell
      McClanahan
    page: '47'
  - source: iab-poster-linhagem-meira
    quote: >-
      Michael Owen, primeiro primaz da CEEC, foi consagrado em 1995 por um colégio misto de bispos dessas tradições.
      Ele consagrou Russell McClanahan, que autorizou a consagração de Leônides.
  discrepancies:
  - field: place
    value: Dale City, Virgínia (EUA)
    sources:
    - source: cant-novas-igrejas-2024
      quote: >-
        Em outubro de 1995, representantes de cerca de 25 congregações independentes de origens diversas, reuniram-se
        em Dale City, Virgínia, para consagração de dois primeiros bispos da denominação: Vincent McCall e Russell
        McClanahan
      page: '47'
  notes: >-
    Trecho com os sagrantes é citação (na Wikipédia EN) da antiga página eec1.org/leadership, hoje fora do ar; o
    site atual da EEC (globaleec.org) confirma a data e o fato das sagrações. Segundo a Wikipédia EN, entre os bispos
    presentes havia linhagens da International Free Catholic Communion e derivadas da Igreja Católica Apostólica
    Brasileira (ICAB). Os pôsteres da IAB dizem que Michael Owen 'foi consagrado em 1995'; a CEEC diz que em 1995
    foram sagrados seus dois primeiros bispos (McCall e McClanahan) e que Owen já era 'Bishop' presente — divergência
    registrada em dúvidas. Linha de sucessão autodeclarada pela CEEC (tabela 'Anglican Succession – Table One');
    a página lista só o sagrante principal e a data. Não verificada por fonte independente. Sagrantes não nomeados.
