  notes: >-
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
    Data de 1981 conflita com a aprovação da ordenação feminina (1984) e com Carmen Etel ser a primeira mulher ordenada
    (1985) — ver dúvidas.
