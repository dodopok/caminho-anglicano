# yaml-language-server: $schema=../../schemas/person.json
id: maria-nylde-amaral-da-cunha
name: Maria Nylde Amaral da Cunha
aliases:
- Irmã Maria
- Maria Nilde Cunha
biography: >-
  Única integrante da Ordem de Santa Maria; diácona (1981) e presbítera (1990), atuou na Diocese de Pelotas.
sources:
- source: costa2021
  quote: >-
    Das cinco candidatas que fizeram o teste vocacional, apenas uma senhora, Maria Nylde Amaral da Cunha, deu continuidade
    ao projeto.
  page: '93'
ordinations:
- order: diaconate
  date: '1989'
  jurisdiction: ieab
  ordained_by: luiz-osorio-pires-prado
  status: contested
  sources:
  - source: cant-identidades-numeros-2024
    quote: >-
      A Ordem foi dissolvida e a Irmã Nylde foi ordenada ao diaconato e ao presbiterato pelo bispo Prado, exercendo
      seu ministério na Diocese de Pelotas.
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1989 - … Maria Nilde Cunha
    page: '373'
  - source: kickhofel-1995
    quote: >-
      Das cinco candidatas que fizeram o teste vocacional, apenas a senhora Nilde Cunha, viúva e presidente, na
      época, da diretoria diocesana e nacional da Sociedade Auxiliadora de Senhoras, perseverou, tornando-se a primeira
      e única freira da Igreja Episcopal. Sem novas candidatas, a Comunidade não poderia vingar, e irmã Maria, mais
      tarde foi ordenada ao diaconato e ao presbiterado pelo bispo Luiz Osório Pires Prado, da Diocese Anglicana
      de Pelotas, onde passou a exercer o seu ministério regular.
    page: '318'
  - source: costa2021
    quote: >-
      nome religioso pelo qual era conhecida –, foi ordenada ao diaconato em 1981 e ao presbiterato em 1990, exercendo
      o seu ministério na Diocese de Pelotas.
    page: '94'
  discrepancies:
