biography: >-
  Maria Nylde Amaral da Cunha recebeu em 02/03/1980 do bispo Arthur Kratz a primeira ordem religiosa feminina, a
  Comunidade de Santa Maria, e em 18/05/1980 proferiu seus votos, tornando-se a primeira freira da Ordem de Santa
  Maria. Foi ordenada diácona em 07/05/1989 e presbítera em 10/05/1990 por Luiz Osório Pires Prado, na Diocese Anglicana
  de Pelotas, onde exerceu seu ministério (uma fonte data o diaconato em 1981), e faleceu em 02/04/2002.
