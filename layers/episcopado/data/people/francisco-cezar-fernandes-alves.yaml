biography: >-
  Francisco Cézar Fernandes Alves é natural de Quixeramobim (CE) e estudou no Instituto Anglicano de Estudos Teológicos
  (IAET). Foi ordenado diácono em julho de 1995 e presbítero em 6 de junho de 1996, na antiga Catedral Anglicana
  de São Paulo, por Glauco Soares de Lima, e é reitor da Paróquia de São João, em São Paulo, desde 2002. Na eleição
  episcopal da Diocese Anglicana de São Paulo, a comunidade da Catedral apoiou sua candidatura, mas Flávio Irala
  foi eleito por 19 a 18 votos na ordem leiga e 15 a 13 na clerical, eleição que o bispo Roger Bird considerou irregular.
  Eleito bispo coadjutor em 9 de julho de 2019, foi sagrado em 25 de janeiro de 2020, na Paróquia da Santíssima
  Trindade, por Naudal Alves Gomes, primaz da IEAB, e investido bispo diocesano da DASP em 31 de outubro de 2021.
  Participou de cinco ordenações de diáconos ou presbíteros.
