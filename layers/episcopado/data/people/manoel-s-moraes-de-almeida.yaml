# yaml-language-server: $schema=../../schemas/person.json
id: manoel-s-moraes-de-almeida
name: Manoel S. Moraes de Almeida
aliases:
- Manoel Moraes
biography: Deão em 2005 e cônego em 2007; Secretário Diocesano de Direitos Humanos em 2005.
sources:
- source: drp-carta-venables-pt-2005
  quote: Revmo. Deão Manoel S. Moraes de Almeida – Séc. Diocesano de Direitos Humanos
- source: drp-calendario-2007
  quote: Rev. Côn. Manoel S. Moraes de Almeida, ose
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Manoel S. Moraes de Almeida
  - source: drv-nota-esclarecimento-2006
    quote: Manoel S. Moraes de Almeida, ose
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Manoel S. Moraes de Almeida … Os clérigos não atenderam à
      convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: deão
  start: '2005-02-12'
  end: 2006-08
  end_reason: term_end
  status: confirmed
  sources:
  - source: drp2-instalacao-deao-2005
    quote: >-
      Instalação Do Deão: Revmo. Manoel Almeida CATEDRAL ANGLICANA DO BOM SAMARITANO Recife (PE), 12 de Fevereiro
      de 2005
  - source: drp2-instalacao-deao-2005
    quote: estamos dando posse ao novo Deão, o Reverendíssimo Manoel Severino Moraes de Almeida
  notes: >-
    Local: Catedral Anglicana do Bom Samaritano, Boa Viagem, Recife. Primeiro deão da Catedral do Bom Samaritano.
    Não pleiteou reeleição; em agosto de 2006 foi instituído o deão seguinte, Estevão Chiappetta.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: deão
  start: '2008-06-15'
  status: confirmed
  sources:
  - source: drp2-posse-deao-2008
    quote: >-
      Sermão do Culto de Posse do Deão Rev. Cônego Manoel Moraes Catedral Anglicana do Bom Samaritano Boa Viagem,
      Recife, PE 15 de junho de 2008
  - source: drp2-posse-deao-2008
    quote: >-
      Em duas “dispensações” diferentes de sua ainda breve, mas muito fecunda existência, esse deado é ocupado pelo
      Revmo. Manoel Almeida, que como Cônego está permanentemente vinculado a esta casa.
  notes: >-
    Local: Catedral Anglicana do Bom Samaritano, Boa Viagem, Recife. Segunda posse como deão; acumulava a titularidade
    da paróquia Jesus de Nazaré, em Gaibu.
