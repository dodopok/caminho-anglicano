id: manoel-s-moraes-de-almeida
name: Manoel S. Moraes de Almeida
aliases:
- Manoel Moraes
biography: >-
  Manoel Severino Moraes de Almeida, presbítero e membro da Ordem Evangélica de Santo Estevão Mártir (OSE), era
  reitor da Paróquia Anglicana Bom Samaritano e secretário de Direitos Humanos da Diocese Anglicana do Recife (DAR)
  em 2004, ano em que, em 06/07/2004, constou entre os signatários do documento 'Para além das trincheiras', e constava
  na Comissão de Direitos Humanos da IEAB em 2003. Foi instalado deão da Catedral Anglicana do Bom Samaritano, em
  Recife, em 12/02/2005. Em 23/08/2005 foi excluído da comunhão da IEAB e, em carta, declarou manter plena comunhão
  com o bispo diocesano Robinson Cavalcanti. Em 2007 era cônego e secretário diocesano de Direitos Humanos. Em 2008
  era presbítero, cônego e vigário geral da diocese, assessor direto do bispo, secretário diocesano de Cidadania
  e pároco da Paróquia Anglicana Jesus de Nazaré, em Gaibu (PE), no Arcediagado Norte, e em 15/06/2008 tomou posse
  novamente como deão. Em 2009 constava ainda como arcediago adjunto e secretário diocesano administrativo.
