    page: '215'
  - source: costa2021
    quote: >-
      Assinaram este documento: Rev. Gustavo Gilson S. de Oliveira, ose; Rev. Fábio S. Vasconcelos; Rev. Elias Leôncio
      de B. Filho, ose; Rev. João Câncio Peixoto Filho; Rev. Manoel S. Moraes de Almeida, ose; Rev. Sérgio F. Lomeu
      de Andrade
    page: '216'
- type: other
  date: '2005-02-12'
  description: >-
    O XXIV Concílio Diocesano (dezembro de 2004) definiu a Paróquia Anglicana do Bom Samaritano, em Boa Viagem,
    como Igreja Catedral da Diocese Anglicana do Recife; a catedral foi instalada solenemente em 12/02/2005.
  status: confirmed
  sources:
  - source: drp2-instalacao-deao-2005
    quote: >-
      Deliberou, soberanamente, o nosso XXIV Concílio Diocesano – legal e legítimo – definir a Paróquia Anglicana
      do Bom Samaritano, em Boa Viagem, como a Igreja Catedral da Diocese Anglicana do Recife
  - source: drp2-instalacao-deao-2005
    quote: Declaramos, solenemente, instalada esta Igreja Catedral Anglicana do Bom Samaritano
