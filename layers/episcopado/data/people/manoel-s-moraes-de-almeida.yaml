  start: 2008-05
  status: confirmed
  sources:
  - source: rclv-anglicanismo-comparado-2008
    quote: >-
      Rev. Manoel Moraes é Presbítero, Cônego e Vigário Geral da Diocese do Recife; Secretário Diocesano de Cidadania;
    page: '80'
  - source: rclv-anglicanismo-comparado-2008
    quote: Pároco da Paróquia Anglicana Jesus de Nazaré, em Gaibu-PE, no Arcediagado Norte.
    page: '80'
  notes: >-
    Local: Cone Sul / IAB. Cargos em 19/05/2008 (data da aula): presbítero, cônego, vigário geral da Diocese do
    Recife, secretário diocesano de Cidadania e pároco em Gaibu. 'Início' = data em que o cargo é atestado, não
    a posse.
