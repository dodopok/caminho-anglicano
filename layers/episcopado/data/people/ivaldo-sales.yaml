id: ivaldo-sales
name: Ivaldo Sales
full_name: Ivaldo Sales da Silva
aliases:
- Frei Ivaldo Sales da Silva
- Ivaldo Sales da Silva
biography: >-
  Ivaldo Sales foi ordenado diácono em dezembro de 2007, por Robinson Cavalcanti, no encerramento do XXVII Concílio
  da Diocese do Recife. É presbítero dessa diocese, onde atuou como ministro auxiliar, inclusive na Paróquia Anglicana
  São Paulo, e como assessor diocesano para Defesa da Vida e da Criação, e presidiu o CVC Pró-Vida. Integra a Ordem
  de Santo Estevão (OSE), da qual foi secretário.
sources:
- source: drp2-colheita-ministerial-2007
  quote: >-
    Ao conferir a sagrada ordem do Diaconato aos reverendos: Ivaldo Sales (Recife), José Fernandes Filho (João Pessoa)
    e John Nuzum (EUA) no Culto de Encerramento do XXVII Concílio da Diocese do Recife
- source: darl1-6968
  quote: >-
    Rev. Ivaldo Sales da Silva é Presbítero na Diocese do Recife; Assessor Diocesano para Defesa da Vida e da Criação;
