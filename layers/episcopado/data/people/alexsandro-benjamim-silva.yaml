id: alexsandro-benjamim-silva
name: Alexsandro Benjamim Silva
full_name: Alexsandro Benjamim Silva
aliases:
- Alexsandro Benjamim
- Bispo Alexsandro
- Pr. Alexsandro Benjamim
biography: >-
  Em 16 de novembro de 2006 abriu seu lar, com Ana Janaina Tavares, para um grupo familiar que deu origem à Paróquia
  Monte Moriá (Aldeia, Camaragibe), inaugurada em 11 de maio de 2007 com a presença do arcebispo Paulo Garcia e
  vinculada à Igreja Episcopal Carismática do Brasil até 2021. Nesse ano a comunidade, hoje Igreja Episcopal Monte
  Moriá, passou a chamá-lo de bispo, título que ele detém sem nunca ter sido sagrado ao episcopado.
