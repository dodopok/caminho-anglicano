id: michael-owen
name: Michael Owen
biography: >-
  Sagrado em 26/02/1995 por Michael Rivers Milner Jr., foi o primeiro bispo presidente da CEEC e sagrante principal
  de Russell McClanahan em 3/10/1995.
sources:
- source: rtb-ceec-succession
  quote: >-
    Michael Rivers Milner Jr. Bishop of The International Free Catholic Communion, who on the 26th of February,
    1995, consecrated Michael D. Owen
- source: ceec-history
  quote: Bishop Michael Owen served as the first Presiding Bishop.
ordinations:
- order: episcopate
  date: '1995-02-26'
  place: Igreja do Espírito Santo, Oklahoma City, Oklahoma (EUA)
  jurisdiction: ceec
  principal_consecrator: michael-rivers-milner-jr
  status: probable
  sources:
  - source: rtb-ceec-succession
    quote: >-
      Michael Rivers Milner Jr. Bishop of The International Free Catholic Communion, who on the 26th of February,
      1995, consecrated Michael D. Owen
  - source: lin-aoci-hayes
    quote: >-
      Primate Garner did on the 5th of January, 1989, in St. Augustine’s American Catholic Church, Brooklyn, New
      York consecrate Owen J. Augustine Who on the 26th of February, 1995, in the Church of the Holy Spirit, Oklahoma
      City, Oklahoma, consecrated Michael Owen Bishop of The Communion of Evangelical Episcopal Churches
  - source: iab-poster-linhagem-meira
    quote: >-
      Michael Owen, primeiro primaz da CEEC, foi consagrado em 1995 por um colégio misto de bispos dessas tradições.
  discrepancies:
  - field: principal_consecrator
    value: owen-augustine
    sources:
    - source: lin-aoci-hayes
      quote: >-
        Primate Garner did on the 5th of January, 1989, in St. Augustine’s American Catholic Church, Brooklyn, New
        York consecrate Owen J. Augustine Who on the 26th of February, 1995, in the Church of the Holy Spirit, Oklahoma
        City, Oklahoma, consecrated Michael Owen Bishop of The Communion of Evangelical Episcopal Churches
  notes: >-
    Linha de sucessão autodeclarada pela CEEC (tabela 'Anglican Succession – Table One'); a página lista só o sagrante
    principal e a data. Não verificada por fonte independente. Versão da lista de sucessão da Apostolic Orthodox
    Church International (AOCI): Owen Augustine seria o sagrante, com local e data (26/02/1995, Oklahoma City).
    A própria CEEC (página de sucessão de Russell McClanahan) atribui a sagração de Owen à mesma data a Michael
    Rivers Milner Jr. Os dois relatos coincidem na data.
