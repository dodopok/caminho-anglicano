      quote: Em 2013, Dom James Roque recebeu o episcopado pelas mãos de Dom Victor Manuel Cruz-Blanco
    - source: cant-novas-igrejas-2024
      quote: A sua sagração aconteceu na cidade de Barranquila, na Colômbia.
  notes: >-
    O livro não informa sagrantes nem a jurisdição sagrante nesta parte. Atenção: a criação jurídica da Diocese
    do Japi pelo 'bispo' Roque é datada de 14/10/2012, antes da sagração de 2013. Jurisdição do sagrante; Roque
    organizou em seguida a Diocese Anglicana do Japi. Fonte é o próprio site da IACC, assinado por James Roque (autodeclaração).
    Quatro co-sagrantes não nomeados. Sucessão declarada: Chambers/Pagtakhan/Pae (St. Louis 1977) via Cruz-Blanco.
    Registro neutro do que a jurisdição declara. Costa (2021) confirma a data e o sagrante, e também que Roque 'ordenou
    muitas pessoas ao episcopado' (Kennedy de Freitas, Mattos, Barreiros, Ferreira, Itabira Jonas, Pinho, Barbosa
    da Silva). Já registrado em jurisdicoes-menores.json; aqui com fonte Costa. Jurisdição: Movimento Contínuo (Província
    Católica de Rito Anglicano da América Latina); sigla TAC é aproximada.
