      quote: >-
        Rogério Ribeiro Campos, bispo da diocese de São João Batista no Brasil, posteriormente bispo do Centro-Oeste
        do Brasil da Comunhão Independente Anglicana, após primeiro Abade do Mosteiro Cisterciense de São Rafael,
        em Aparecida de Goiânia, Estado de Goiás, Brasil que em 31 de janeiro de 2014 consagrou;
  notes: >-
    Fonte é o próprio site da IACC, assinado por James Roque (autodeclaração). Quatro co-sagrantes não nomeados.
    Sucessão declarada: Chambers/Pagtakhan/Pae (St. Louis 1977) via Cruz-Blanco. Registro neutro do que a jurisdição
    declara. Costa (2021) confirma a data e o sagrante, e também que Roque 'ordenou muitas pessoas ao episcopado'
    (Kennedy de Freitas, Mattos, Barreiros, Ferreira, Itabira Jonas, Pinho, Barbosa da Silva). Já registrado em
    jurisdicoes-menores.json; aqui com fonte Costa. Jurisdição: Movimento Contínuo (Província Católica de Rito Anglicano
    da América Latina); sigla TAC é aproximada. Versão da lista de sucessão da IVCM. Fontes do movimento anglicano
    continuante dizem que Roque foi sagrado em 2013, em Barranquilla (Colômbia), por Victor Manuel Cruz-Blanco;
    ver dúvidas. RESPOSTA À DÚVIDA 'por qual igreja': segundo o próprio site da IACC (assinado por James Roque),
    a sagração foi na sede da 'Igreja Anglicana Continuante da República da Colômbia (Diocese Anglicana del Caribe
    y La Nueva Granada)' e Cruz-Blanco agia como arcebispo da 'Província Católica de Rito Anglicano da América Latina',
    'então vinculada à Igreja Católica de Rito Anglicano' (= Holy Catholic Church Anglican Rite / Anglican Rite
    Catholic Church, Quakertown, PA; primaz Thomas Justin Kleppinger). Portanto NÃO foi a IACC (criada depois pelo
    próprio Roque), NÃO foi a TAC (nenhuma fonte liga Cruz-Blanco à TAC), e a jurisdição mais precisa é PCRA-AL/HCCAR.
    Quatro co-sagrantes não nomeados. Ano 2013 sem dia. Jurisdição do sagrante; Roque organizou em seguida a Diocese
    Anglicana do Japi. O livro não informa sagrantes nem a jurisdição sagrante nesta parte. Atenção: a criação jurídica
    da Diocese do Japi pelo 'bispo' Roque é datada de 14/10/2012, antes da sagração de 2013.
