    page: '154'
  - source: cant-novas-igrejas-2024
    quote: >-
      O primeiro brasileiro a ser sagrado dentro do Movimento Contínuo foi o bispo James Antônio Roque, em cerimônia
      ocorrida em 2013, tendo recebido a sagração episcopal pelas mãos do bispo Victor Manuel Cruz-Blanco.
    page: '76'
  - source: iacc-continuante
    quote: >-
      Dom †James Roque foi ordenado e sagrado pelo citado arcebispo assistido por mais quatro bispos, na Pró-Catedral
      da Sé Metropolitana.
  - source: costa2021
    quote: >-
      O primeiro brasileiro a ser sagrado dentro do Movimento Continuante foi o bispo James Roque, em cerimônia
      ocorrida em 2013, tendo recebido a sagração episcopal pelas mãos do bispo colombiano Victor Manuel Cruz-Blanco.
  - source: cant-anglo-catolicismo-2026
    quote: Em 2013, Dom James Roque recebeu o episcopado pelas mãos de Dom Victor Manuel Cruz-Blanco
  - source: cant-novas-igrejas-2024
    quote: A sua sagração aconteceu na cidade de Barranquila, na Colômbia.
