# yaml-language-server: $schema=../../schemas/person.json
id: enrique-lago-zugadi
name: Enrique Lago Zugadi
full_name: Enrique Lago Zugadi
aliases:
- Enrique Lago
- The Most Revd Enrique Lago Zugadi
biography: >-
  Pastor da Iglesia Providencia, em Santiago, de 1994 a 2017, foi sagrado bispo em 15 de julho de 2018, na Catedral
  de São Paulo, em Valparaíso, com Gregory Venables, primaz do Cone Sul, como sagrante, e tornou-se bispo diocesano
  da Diocese do Sul do Chile, antes Concepción. Em 12 de janeiro de 2025 foi entronizado arcebispo e primaz da Igreja
  Anglicana do Chile, sucedendo Tito Zavala, e desde março de 2026 integra o Global Anglican Council.
sources:
- source: gace-gac-page
  quote: From 1994 to 2017, Archbishop Enrique was pastor of Iglesia Providencia in Santiago.
- source: gace-gac-page
  quote: >-
    He was consecrated to the episcopacy at St. Paul’s Cathedral, Valparaíso in 2018, and became diocesan bishop
    upon the formation of the diocese that year.
- source: gacl-cj-2018-chile
  quote: >-
    Next Sunday, July 15 at 11:00 a.m., the Ceremony of Consecration and Recognition of Diocesan Bishops of the
    Anglican Church of Chile will be held. ... The priests who will be consecrated by laying on hands are the reverends
    Samuel Morrison for the Diocese of Valparaíso and Enrique Lago for the Diocese of Concepción.
- source: gacl-stpaul-valpo-2018
  quote: >-
    The present Presiding bishop of the Province of the Southern Cone The Revmo. Gregory Venables will be with us
    for the Service of celebration and thanksgiving
- source: gace-gac-page
  quote: >-
    In 2018 he was elected as the future diocesan bishop of Concepción (later called the Diocese of the South of
    Chile).
- source: gace-gac-page
  quote: >-
    In January 2025, Archbishop Enrique succeeded Tito Zavala as the second archbishop of the Anglican Church of
    Chile.
- source: gacl-dd-2025-santiago
  quote: >-
    12 January 2025 ... At the same service Bishop Enrique Lago will be enthroned as Archbishop of Iglesia Anglicana
    de Chile.
- source: gace-gac-page
  quote: Archbishop of the Anglican Church of Chile
- source: gace-gac-page
  quote: The Most Revd Enrique Lago Zugadi Archbishop of the Anglican Church of Chile
