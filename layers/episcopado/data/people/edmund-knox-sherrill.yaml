- type: other
  date: '1976'
  description: >-
    Criação da Diocese Setentrional (missionária) da Igreja Episcopal do Brasil pelo desmembramento da Diocese Central
    (decidida no Sínodo de 1975; primeiro concílio em Recife, 25-27 de junho de 1976, sé na Igreja da SS. Trindade).
