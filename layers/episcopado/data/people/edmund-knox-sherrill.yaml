  notes: >-
    Sagração: 'Bp of CBra' no verbete. O diretório não nomeia sagrante nem local. Christ Church do Rio era a capela
    anglicana inglesa (Botafogo). Presbíteros assistentes: Rev. Henry W. Sherrill e Rev. Franklin G. Sherrill (irmãos);
    pregador: Krischke; litanista: G. Vergara dos Santos. Relato contemporâneo do Hawaiian Church Chronicle (mar.
    1959): presbíteros assistentes foram seus irmãos, os revs. Henry W. Sherrill (Cincinnati) e Franklin G. Sherrill
    (Ipswich, Mass.), o primeiro como vice-registrador da cerimônia; Krischke e Simões atuaram como co-sagrantes
    e bispos apresentadores. Este relato não nomeia Athalício Pithan nem Daniel Ivor Evans, que Kickhöfel (1995,
    p. 275) lista como co-sagrantes. Pôster: "em 1959, seu próprio filho, Edmund Knox Sherrill, no Rio de Janeiro"
    — CONFIRMADO (sagrante, ano e local), mas só por Wikipédia, que cita Hawaiian Church Chronicle (mar. 1959) e
    J. B. Simpson, The Long Shadows of Lambeth X (1969), p. 301 — fontes não abertas por mim. Co-sagrantes (Krischke
    e Simões) apenas pela lista de sucessão. Em jan. 1959 H. K. Sherrill já era Presiding Bishop aposentado. A tese
    não dá data nem sagrantes; eleito em 1958 e já sagrado ao visitar Brasília em 1959. Nota 137: número de registro
    560 na Igreja Episcopal dos EUA. Bispo da Diocese Central (Igreja Episcopal Brasileira, hoje IEAB). A tese não
    dá a data da sagração; diz que foi eleito pela Convenção Geral de 1958 (da Igreja Episcopal dos EUA) e que foi
    bispo diocesano no Rio de 1959 a 1976. 'Seu próprio pai' = Henry Knox Sherrill, bispo presidente da Igreja Episcopal
    dos EUA. A tese cita KICKHÖFEL, 1995, p. 274-275. Nomes na tese: 'Athalício Theoro Pithan', 'Egmont Machado
    Krischke'.
