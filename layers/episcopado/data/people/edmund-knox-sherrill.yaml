  - source: iab-poster-linhagem-meira
    quote: >-
      Henry Knox Sherrill, Presiding Bishop dos EUA (1947-1958), teve papel decisivo ao consagrar missionários como
      Louis Chester Melcher e, em 1959, seu próprio filho, Edmund Knox Sherrill, no Rio de Janeiro.
  - source: costa2021
