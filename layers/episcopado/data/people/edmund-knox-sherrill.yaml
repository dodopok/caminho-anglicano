    quote: >-
      A primeira foi a Diocese Sul Central em 1969; a segunda foi a Diocese Setentrional em 1976; e a terceira a
      Diocese Missionária de Brasília em 1982 (KICKHÖFEL, 1995, p. 305).
    page: '170'
  - source: costa2021
    quote: >-
      Durante o Sínodo de 1975 foi criada a nova diocese missionária, com o nome de Diocese Setentrional, dada a
      sua localização geográfica.
    page: '173'
  - source: costa2021
