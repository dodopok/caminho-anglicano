  notes: >-
    Datas de residência no Recife (mudança em 1977; saída no início de 1986), conforme Dom Robinson Cavalcanti;
    o episcopado diocesano começa com a criação da diocese em 1976. Datas divergem (1975/1976 a 1985/1986). Os comunicados
    do Episcopal News Service o chamam de bispo da "recém-formada Diocese do Norte do Brasil" em jan. 1978, bispo
    do Norte do Brasil em mai. 1980 e bispo da Diocese Setentrional em set. 1984. Em out. de 1975 ainda era chamado
    de bispo do Brasil Central; portanto a mudança de título ocorreu depois disso, o que combina com o início em
    1976/1977 (e não em 1975) indicado em outras fontes. O comunicado de 1984 informa que ele alcançaria a idade
    de aposentadoria em dois anos (1986). O livro diz que ele optou pela nova diocese e se mudou para Recife em
    1977; aposentou-se em 1985 (p. 298). Anexo D da tese (bispos por diocese). Em 1976 a diocese chamava-se Diocese
    Setentrional (Anexo G: Sherrill como 'bispo da Diocese Setentrional'). Sucedido por Clóvis Erly Rodrigues (coadjutor
    sagrado em 1985). Local: depois Diocese Anglicana do Recife. 1º bispo da Diocese Setentrional (criada no Sínodo
    de 1975; 1º concílio em junho de 1976). Renunciou no início de 1986 (ano seguinte a 1985); a citação de Kickhöfel
    diz que 'se aposentou em 1985'.
