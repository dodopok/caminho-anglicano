biography: >-
  Bispo ligado ao Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Boston,
  Massachusetts, EUA (1925-05-23). Sagrado em 1959-01-25. Transferido para a Igreja Episcopal do Brasil em 25/04/1965
  (Clerical Directory 1968).
