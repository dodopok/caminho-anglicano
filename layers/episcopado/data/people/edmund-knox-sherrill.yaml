      The House of Bishops approved by a standing vote the resolution granting autonomy to the Brazilian Episcopal
      Church.
  - source: ens-xxvi-1
    quote: >-
      For Brazil: Independence - In action pointing the way for greater impact of MRI proposals on the life of the
      Church, the Brazilian Episcopal Church became the 19th independent church in the world-wide Anglican Communion.
