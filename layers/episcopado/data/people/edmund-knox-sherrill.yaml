events:
- type: other
  date: '1985'
  description: >-
    Robinson Cavalcanti, então diácono da Diocese Setentrional, foi "apresentador" na sagração do novo bispo (Clóvis
    Erly Rodrigues) em Porto Alegre e afirma que Edmund Sherrill seria um dos co-sagrantes do seu próprio episcopado
    (1997).
  status: probable
  sources:
  - source: cant-meninos-eu-vi-2004
    quote: Eu vi – e fui “apresentador” (de quem não conhecia) na sagração do novo Bispo, em Porto Alegre
  - source: cant-meninos-eu-vi-2004
    quote: (e ele seria um dos co-sagrantes do meu episcopado)
  - source: cant-resgatando-2006
    quote: >-
      Tive, por determinação do Bispo Sherrill, juntamente com a irmã Dalila, da Paróquia Anglicana do Bom Samaritano,
      de me deslocar para a cerimônia de Sagração na Catedral de Porto Alegre (não havia qualquer clima para que
      a mesma se desse aqui) e saudar o consagrado na festa que se seguiu no Teresópolis Tênis Clube.
- type: other
  date: 1964-10
  description: >-
    61ª Convenção Geral (St. Louis, out. 1964) concede autonomia à Igreja Episcopal Brasileira, 19ª igreja da Comunhão
    Anglicana; os três bispos brasileiros (Krischke, Simões, Sherrill) recebem assento na Câmara dos Bispos dos
    EUA.
  status: confirmed
  sources:
  - source: ens-xxvi-8
    quote: >-
      The House of Bishops approved by a standing vote the resolution granting autonomy to the Brazilian Episcopal
      Church.
  - source: ens-xxvi-1
    quote: >-
      For Brazil: Independence - In action pointing the way for greater impact of MRI proposals on the life of the
      Church, the Brazilian Episcopal Church became the 19th independent church in the world-wide Anglican Communion.
- type: other
  date: '1976-05-20'
  description: >-
    Segundo Dom Robinson Cavalcanti, a Diocese Setentrional (Recife), desmembrada da Diocese Central e com jurisdição
    sobre o Norte e o Nordeste, foi criada pelo Sínodo Geral da Igreja Episcopal do Brasil em 20 de maio de 1976,
    com Edmund Knox Sherrill designado bispo.
  status: probable
  sources:
  - source: drv-resgatando-i
    quote: >-
      com a criação, pelo Sínodo Geral da agora Igreja Episcopal do Brasil, da Diocese Setentrional, com sede no
      Recife, desmembrada da Diocese Central
  - source: drv-resgatando-ii
    quote: >-
      A Diocese Setentrional foi criada pelo Sínodo Geral da Igreja Episcopal do Brasil em 20 de Maio de 1976
- type: other
  date: null
  description: >-
    Sherrill, bispo da Diocese do Brasil Central, negociou a integração das capelanias britânicas e japonesas à
    Igreja Episcopal do Brasil nos anos 1960; a Holy Trinity do Recife decidiu em assembleia pela filiação.
  status: probable
  sources:
  - source: drv-resgatando-i
    quote: >-
      Esse trabalho foi feito por Dom Edmund Knox Sherrill, Bispo da Diocese do Brasil Central, com sede no Rio
      de Janeiro, e com jurisdição do Paraná à Amazônia.
  - source: drv-resgatando-i
    quote: Uma assembléia paroquial da Capelania do Recife, Holy Trinity Church, decidiu por essa filiação
- type: other
  date: 1977/1985
  description: >-
    Sob o bispo Sherrill abriram-se pontos missionários que viriam a ser missões ou paróquias: São Lucas (Nova Marambaia-PA),
    Ressurreição (João Pessoa-PB), O Salvador (Itaparica-BA), Bom Samaritano (Boa Viagem, Recife), Redentor (Várzea,
    Recife) e Emanuel (Olinda-PE).
  status: probable
  sources:
  - source: drv-resgatando-ii
    quote: >-
      São Lucas, em Nova Marambaia-PA; Ressurreição, em João Pessoa-PB; O Salvador, em Itaparica-BA; Bom Samaritano,
      em Boa Viagem e Redentor, na Várzea, ambos no Recife-PE; e Emanuel, em Olinda-PE
- type: other
  date: 1977/1985
  description: >-
    O bispo Sherrill criou o NAET (Núcleo de Estudos Anglicanos), onde estudaram Ian Meldrum, Robinson Cavalcanti
    e Antônio Carlos (da Bahia); também foram ordenados no período Sherrill Josephino Lobato (Belém) e um fazendeiro
    japonês, ministro local. Washington Franco foi deixado já preparado para a ordenação.
  status: probable
  sources:
  - source: drv-resgatando-ii
    quote: >-
      onde estudaram três dos seus ordinandos, os futuros reverendos: Ian Meldrum, Robinson Cavalcanti e Antônio
      Carlos (da Bahia)
  - source: drv-resgatando-ii
    quote: >-
      Os outros Ministros Ordenados durante o período Sherrill foram: Josephino Lobato, de Belém-PA e um fazendeiro
      japonês
  - source: drv-resgatando-ii
    quote: Deixou o Bispo, ao final, já preparado o processo do Postulante e depois Rev. Washington Franco.
- type: other
  date: '1985'
  description: >-
    Na eleição do sucessor de Sherrill pelo Sínodo Geral da IEAB, o candidato do bispo, Paulo Garcia, foi derrotado,
    e foi eleito bispo coadjutor Clóvis Erly Rodrigues, então deão da Catedral de Santa Maria (RS); a sagração ocorreu
    na Catedral de Porto Alegre.
  status: probable
  sources:
  - source: drv-resgatando-ii
    quote: >-
      sendo eleito Bispo Coadjutor da nossa Diocese o então Deão da Catedral de Santa Maria-RS (e que não conhecia
      o Nordeste nem como turista) o Revmo. Clóvis Erly Rodrigues
  - source: drv-resgatando-ii
    quote: para a cerimônia de Sagração na Catedral de Porto Alegre
- type: other
  date: '1955'
  description: >-
    Acordo de 1955 entre a Igreja da Inglaterra e a Igreja Episcopal dos EUA sobre as capelanias inglesas no Brasil,
    obtido por Louis Chester Melcher, reconhecendo a Igreja Episcopal dos EUA como responsável pela Comunhão Anglicana
    no Brasil; os resultados práticos só surgiram sob Edmund Knox Sherrill, com a incorporação das capelanias à
    igreja brasileira.
  status: probable
  sources:
  - source: drv-apontamentos-kickhofel
    quote: Melcher conseguiu o acordo de 1955 entre a igreja americana e a Igreja da Inglaterra.
  - source: drv-apontamentos-kickhofel
    quote: >-
      Os resultados práticos só vão surgir no episcopado do bispo Edmund Knox Sherrill, quando começou o processo
      da incorporação das capelanias à igreja brasileira.
- type: other
  date: '1977'
  description: >-
    Clóvis Erly Rodrigues é descrito como sucessor de Edmund Knox Sherrill no episcopado do Recife e, segundo o
    Glossário Anglicano, teria levado com o Rev. Jubal Pereira Neves o trabalho missionário da IEAB ao Uruguai (Santana
    do Livramento) em 1977, e formado com Marston Price os primeiros seminaristas do NAET (1976); como sua sagração
    é de 1985, a atribuição do título de bispo a essas datas é retrospectiva.
  status: probable
  sources:
  - source: lrec-caminho-glossario-clovis
    quote: >-
      Em 1977, junto com o Rev. Jubal Pereira Neves, levou o trabalho missionário da IEAB ao Uruguai, trabalhando
      em Santana do Livramento.
  - source: ptwp-dar
    quote: >-
      O então nomeado bispo diocesano Clovis Erly Rodrigues e o Reverendo Marston Price ficaram responsáveis pela
      formação dos primeiros seminaristas.
- type: other
  date: 1958-10
  description: >-
    Na Convenção Geral de 1958 (Miami Beach, 6 a 17/10/1958), a Câmara dos Bispos elegeu, na primeira votação, o
    Rev. Edmund Knox Sherrill, reitor da Igreja da Santíssima Trindade em São Paulo, bispo do Distrito Missionário
    do Brasil Central, sujeito à confirmação da Câmara dos Deputados.
  status: confirmed
  sources:
  - source: rta-gcj1958
    quote: >-
      the Rev. Edmund Knox Sherrill, Rector of Holy Trinity Church, Sao Paulo, Brazil, was found, on the first ballot,
      to have received a majority of votes and was thereupon declared by the Chair to have been chosen Bishop of
      the Missionary District of Central Brazil.
- type: deposition
  date: '1962-08-27'
  description: >-
    O Bispo E. K. Sherrill depôs o clérigo Paulo Dallfollo em 27/08/1962 (relação de Depositions do Clerical Directory
    1965, período desde a edição de 1962 até set. de 1964).
  status: probable
  sources:
  - source: cd1965
    quote: DEPOSITIONS For the period since the 1962 edition through September, 1964
  - source: cd1965
    quote: DALLFOLLO, PAULO, by Rt Rev E K Sherrill, 27 Aug 62
- type: death
  date: '2015-10-02'
  description: >-
    Falecimento de Edmund Knox Sherrill no Rio de Janeiro; velado na Christ Church e sepultado no Cemitério dos
    Ingleses. Data indicada: 2 de outubro de 2015 (Costa, 2021); a Wikipédia em inglês e o Wikidata dão apenas "2016".
  status: probable
  sources:
  - source: lsh-costa2021-n114
    quote: >-
      Dois anos depois, faleceu, em 02 de outubro de 2015, no Rio de Janeiro, gerando grande comoção em toda a Igreja.
      Foi velado na Christ Church, sendo sepultado no Cemitério dos Ingleses.
  - source: wp-pt-sherrill
    quote: >-
      Dom Edmund Knox Sherrill faleceu em 2 de outubro de 2015, no Rio de Janeiro, gerando grande comoção em toda
      a Igreja. Foi velado na Christ Church, sendo sepultado no [[Cemitério dos Ingleses (Rio de Janeiro)|Cemitério
      dos Ingleses]].
  - source: wp-en-esherrill
    quote: '''''''Edmund Knox Sherrill'''''' (died 2016)'
- type: other
  date: '1962-07-22'
  description: >-
    Representante episcopal-anglicano na Conferência do Nordeste "Cristo e o processo revolucionário brasileiro"
    (Recife, 22 a 29 de julho de 1962, promovida pela Confederação Evangélica do Brasil), ao lado de Almir dos Santos,
    Joaquim Beato e João Dias de Araújo.
  status: probable
  sources:
