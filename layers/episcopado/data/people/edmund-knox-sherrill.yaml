    quote: >-
      entre os dias 22 e 29 de julho de 1962, a Conferência do Nordeste: Cristo e o processo revolucionário brasileiro
  - source: lsh-bdf-2025
    quote: >-
      Almir dos Santos (metodista), Joaquim Beato e João Dias de Araújo (presbiterianos) e Edmund Knox Sherrill
      (episcopal-anglicano)
- type: other
  date: 1975-10
  description: >-
    Em out. de 1975 o Bispo E. K. Sherrill participou, como representante do Conselho de Bispos Anglicanos da América
    do Sul, da reunião do Conselho Anglicano da América do Norte e Caribe (ACNAC), em John's Island, Carolina do
    Sul.
  status: confirmed
  sources:
  - source: lsh-ens-75359
    quote: >-
      the Rt. Rev. Edmund K. Sherrill, Bishop of Central Brazil, representing the Council of Anglican Bishops of
      South America
- type: other
  date: '1958'
  description: Eleito pela Convenção Geral de 1958 bispo da Diocese Central (Rio de Janeiro), sucedendo Melcher
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Em seu lugar, a Convenção Geral de 1958 elegeu o reverendo Edmund Knox Sherrill, que há cinco anos trabalhava
      no Brasil como missionário junto à comunidade americana e como coadjutor e depois como pároco da Igreja da
      Santíssima Trindade em São Paulo.
    page: '274'
- type: other
  date: '1976-06-25'
  description: >-
    Primeiro Concílio da Diocese Setentrional da Igreja Episcopal do Brasil, em Recife, de 25 a 27 de junho de 1976,
    convocado e presidido pelo bispo diocesano Edmund Knox Sherrill, com representantes da Paróquia da SS. Trindade
    (Recife), da Paróquia de Santa Maria (Belém) e da Missão Cristo Redentor (Salvador). Participaram cinco clérigos
    (Sherrill, Anselmo João Stein, Joselino Lobato de Souza, Paulo Ruiz Garcia, Stuart Roger Broughton), quatro
    delegados leigos e dois suplentes. Aprovou-se proposta de orçamento para 1977; o culto de encerramento foi pregado
    pelo Rev. Stuart Broughton.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Teve lugar em Recife, Pernambuco, do período de 25 a 27 de junho passado, o primeiro concílio da Diocese Setentrional
      da Igreja Episcopal do Brasil.
    page: '528'
  - source: costa2021
    quote: '(Fonte: Estandarte Cristão, nº 1595, 1976, p. 8)'
    page: '528'
  - source: costa2021
    quote: em boa hora convocado pelo bispo diocesano Edmund Knox Sherrill
    page: '528'
  - source: costa2021
    quote: >-
      Participaram do histórico concílio cinco clérigos, quatro delegados leigos, dois suplentes e diversos membros
      da congregação local e da Missão do Salvador.
    page: '529'
- type: other
  date: '1958'
  description: Convenção Geral elege Edmund Knox Sherrill bispo da Diocese Central
