    quote: ter sobrevivido sete anos, foi um milagre maior
  - source: drp2-breves-09-2004
    quote: >-
      Será no próximo sábado, dia 26, às 19h30, na Paróquia Anglicana Jardim das Oliveiras, a cerimônia de Ordenação
      ao Diaconato do candidato Marcus Throup, professor e Capelão Adjunto do SAET.
  - source: drp2-convite-ordenacao-marcus
    quote: >-
      Convidamos toda a família diocesana para o Culto de Ordenação Diaconal do Cand. Marcus Throup a ter lugar
      no dia 26 de Junho de 2004, às 19h30, na Paróquia Anglicana Jardim das Oliveiras
  - source: d2s29-m46
    quote: >-
      Sermão de Ordenação Diaconal Marcus Throup Paróquia Anglicana Jardim das Oliveiras Recife (PE), 26 de Junho
      de 2004
  - source: d2s29-m46
    quote: Embora você seja o 56º Diácono que ordeno, é sempre uma emoção renovada
  notes: >-
    Sermão do bispo diocesano Robinson Cavalcanti ('nunca aspirei o episcopado... ter sobrevivido sete anos'), que
    diz ordenar Marcus Throup como seu 56º diácono. Anúncio de 21/06/2004; o ordenante não é nomeado (a diocese
    tinha então o diocesano Robinson Cavalcanti e o sufragâneo Filadelfo Oliveira Neto). O bispo diz que, naquele
    semestre, 'entre transferidos e licenciados', a diocese tinha dez ministros ordenados a menos e que Marcus era
    a única nova ordenação; recebe-o como alguém vindo para o Brasil, com presentes que 'viajaram desde a velha
    Britânia'. O texto é o sermão do bispo diocesano, que fala em primeira pessoa como quem confere a ordem; a página
    não traz assinatura, e o bispo diocesano em exercício era Robinson Cavalcanti (instalado em 19/10/1997).
