    no site da Diocese do Recife; listado entre os signatários da mensagem do Arcediagado PB/CE/RN Local: Arcediagado
    PB/CE/RN. Consta entre os clérigos que assinam a mensagem do Arcediagado PB/CE/RN de 05/10/2010 (grafia do site:
    "Rev. Marcus Oliver Throup"); em exercício em outubro/2010.
