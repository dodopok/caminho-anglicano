biography: >-
  Marcus Throup foi ordenado diácono em 26/06/2004 por Robinson Cavalcanti, na Paróquia Anglicana Jardim das Oliveiras,
  em Recife, e atuou como reitor do Seminário Anglicano Teológico de Pernambuco (SAT-PE). Em 23/08/2005 foi excluído
  da comunhão da IEAB, tendo declarado manter comunhão com o bispo diocesano Robinson Cavalcanti. Presbítero da
  Diocese do Recife, foi secretário diocesano de Relações Internacionais, professor no SAT-PB e capelão do seminário,
  e em julho de 2010 foi eleito coadjutor da Concatedral.
