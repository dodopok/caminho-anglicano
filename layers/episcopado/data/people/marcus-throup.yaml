# yaml-language-server: $schema=../../schemas/person.json
id: marcus-throup
name: Marcus Throup
biography: Reitor do SAT-PE em 2004-2005.
sources:
- source: drp-comissao-educacao-2004
  quote: confirmem com o Reitor – Rev. Marcus Throup – a sua presença
- source: drp-jornada-vocacoes-2005
  quote: ASSUNTOS ESBOÇADOS DA FALA DO REITOR
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Marcus Throup
  - source: drv-nota-esclarecimento-2006
    quote: Marcus O. Throup
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Marcus Throup … Os clérigos não atenderam à convocação e
      declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: iacs
  role: priest
  diocese: diocese-anglicana-recife
  start: 2008-05
  status: confirmed
  sources:
  - source: rclv-anglicanismo-comparado-2008
    quote: >-
      Rev. Marcus O. Throup é Presbítero da Diocese do Recife; Secretário Diocesano de Relações Internacionais;
      professor no SAT-PB
    page: '77'
  notes: >-
    Local: Cone Sul / IAB. Em 12/05/2008 (data da aula): presbítero da Diocese do Recife e secretário diocesano
    de Relações Internacionais. 'Início' = data em que o cargo é atestado.
- jurisdiction: ieab-dar
  role: other
  role_description: reitor_seminario
  status: confirmed
  sources:
  - source: drp-comissao-educacao-2004
    quote: confirmem com o Reitor – Rev. Marcus Throup – a sua presença
  - source: drp-jornada-vocacoes-2005
    quote: ASSUNTOS ESBOÇADOS DA FALA DO REITOR
  - source: drp-carta-venables-pt-2005
    quote: Rev. Marcus Throup – Reitor do SAT-PE
  notes: >-
    Local: Diocese Anglicana do Recife, SAT-PE, Olinda. Reitor do Seminário Anglicano Teológico de Pernambuco (SAT-PE)
    em 30/12/2004, 8/10/2005 e 17/10/2005. Em outubro/novembro de 2006 o SAT-PE tem outro reitor (Evilásio Tenório).
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Marcus Throup … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
events:
- type: other
  date: '2004-12-30'
  description: >-
    A Comissão Diocesana de Educação Teológica anuncia o novo Projeto Diocesano para Educação Teológica, a iniciar
    em 2006 em parceria com o Seminário SEUT, de Madri (Espanha), e a manutenção do SAT-PB (antigo IAT II) em 2005.
  status: confirmed
  sources:
  - source: drp-comissao-educacao-2004
    quote: em parceria com o Seminário SEUT, em Madrid, Espanha
  - source: drp-comissao-educacao-2004
    quote: Recife (PE), 30 de dezembro de 2004.
