id: adriano-oliveira
name: Adriano Oliveira
biography: >-
  Adriano Oliveira consta, em 2006, entre os reverendos da Igreja Anglicana Ortodoxa do Brasil (IAOB) signatários
  da Declaração da Boa Viagem. Nas listas da Diocese do Recife aparece como ministro auxiliar, como ministro encarregado
  do Ponto Missionário Anglicano em Maceió e entre os presbíteros em reconhecimento de ordens.
