  sources:
  - source: henson-1921-01-25
    quote: >-
      The consecration of William Temple to be Bishop of Manchester took place in the Choir of York Minster . There
      was a very large gathering of Bishops. The Archbishop was vested in a white cope, and performed his central
      function with characteristic dignity.
  - source: henson-1921-01-25
    quote: >-
      It was observed that Archbishop Temple had consecrated Lang, & now Archbishop Lang had consecrated Temple
      .
  - source: henson-1921-01-25
    quote: The Bishop–elect was presented by the Bishops of Ripon and Southwark.
  - source: wp-william-temple
    quote: >-
      Temple was consecrated bishop at [[York Minster]] on 25 January 1921 and enthroned at [[Manchester Cathedral]]
      on 15 February.
  notes: >-
    Fonte primária: diário de Herbert Hensley Henson, bispo de Durham, testemunha presente (leu o Evangelho). Cosmo
    Gordon Lang era arcebispo de York (1909-1928). Os bispos de Ripon (Thomas Wortley Drury) e de Southwark (Cyril
    Garbett) apresentaram o eleito; havia 'a very large gathering of Bishops', mas o diário não lista quem impôs
    as mãos, por isso não registrei co-sagrantes. A Wikipédia deixa 'consecrated_by' vazio. Fecha a lacuna Fisher
    -> W. Temple -> Lang -> F. Temple -> Jackson -> Sumner -> ... -> Parker.
