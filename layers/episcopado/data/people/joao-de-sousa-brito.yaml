name: João de Sousa Brito
full_name: João de Sousa Brito
aliases:
- Diácono Paládio do Getsêmani
- Ir. Paládio do Getsêmani, O.S.C.
biography: >-
  Clérigo da SICB (nome religioso Paládio do Getsêmani, O.S.C.): ordenado diácono em 04/01/2025 e presbítero em
  10/01/2026 por Basílio da Santa Cruz, em Cascavel (CE).
sources:
- source: lvc-sicb-n-presb-2026
  quote: o irmão João de Sousa Brito, nome religioso Ir. Paládio do Getsêmani, O.S.C.
ordinations:
- order: diaconate
  date: '2025-01-04'
  place: Cascavel (CE)
  jurisdiction: sicb
  ordained_by: basilio-da-santa-cruz
  status: probable
  sources:
  - source: lvc-sicb-n-diac-2025-01
    quote: >-
      No dia 04 de janeiro de 2025, em Cascavel/CE, ocorreram as Ordenações Diaconais dos irmãos Mauro (Diácono
      Matias Evangelista) e João (Diácono Paládio do Getsêmani). Ambos foram consagrados pelas abençoadas mãos de
      Dom Basílio da Santa Cruz, O.S.C., Bispo da região Nordeste.
  notes: >-
    A notícia de 2025 cita só 'João (Diácono Paládio do Getsêmani)'; o nome civil vem da notícia de 26/01/2026.
- order: presbyterate
  date: '2026-01-10'
  place: Cascavel (CE)
  jurisdiction: sicb
  ordained_by: basilio-da-santa-cruz
  status: probable
  sources:
  - source: lvc-sicb-n-presb-2026
    quote: >-
      Em uma belíssima Celebração realizada no dia 10 de janeiro de 2026, na cidade de Cascavel/CE, o irmão Tayslan
      Santos da Nóbrega, nome religioso Ir. João Crisóstomo da Anunciação, O.S.C. e o irmão João de Sousa Brito,
      nome religioso Ir. Paládio do Getsêmani, O.S.C. receberam a ORDENAÇÃO PRESBITERAL pelas consagradas mãos de
      Dom Basílio da Santa Cruz, Bispo Provincial para a região Nordeste.
