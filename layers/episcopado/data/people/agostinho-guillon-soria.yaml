wikidata: Q97180655
biography: >-
  Agostinho Guillon Sória (Bagé, 28/08/1922 – 27/06/1996) foi ordenado diácono em 09/02/1947 por William M. M. Thomas
  e presbítero em 11/04/1948 por Athalício Pithan, no Distrito Missionário do Sul do Brasil, e foi deão da Catedral
  da Santíssima Trindade, em Porto Alegre, por 15 anos. Eleito bispo da Diocese Central em novembro de 1976, foi
  sagrado em 24/04/1977 por Arthur Rodolpho Kratz, com Edmund Sherrill, Elliott Sorge e Olavo Ventura Luiz como
  co-sagrantes, e dirigiu a diocese do Rio de Janeiro até 1984. Foi o primeiro bispo da Diocese de Brasília, de
  1985 a 1988, e se aposentou em 1989, segundo uma das fontes.
