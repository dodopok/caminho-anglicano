id: daniel-h-martins
name: Daniel H. Martins
full_name: Daniel H. Martins
aliases:
- Daniel Martins
biography: >-
  Brasileiro nascido no Rio de Janeiro e criado em Chicago, ex-batista, formou-se no seminário anglo-católico Nashotah
  House e é sacerdote da Igreja Episcopal dos Estados Unidos (TEC). Foi eleito, em setembro de 2010, bispo da Diocese
  de Springfield (Illinois), faltando ainda a homologação pela Província antes da sagração.
