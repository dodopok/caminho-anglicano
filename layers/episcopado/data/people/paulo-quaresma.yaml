# yaml-language-server: $schema=../../schemas/person.json
id: paulo-quaresma
name: Paulo Quaresma
full_name: Paulo da Silva Quaresma
aliases:
- Paulo da Silva Quaresma
biography: >-
  Ex-padre católico romano, foi recebido pela Diocese do Recife em julho de 2010, no Ponto Missionário Anglicano
  da Transfiguração (Mogi das Cruzes-SP), com a intenção de requerer incardinação e, depois, reconhecimento de ordem.
  Em 2013 listas do clero diocesano o incluíam, como Rev. Paulo da Silva Quaresma, entre os clérigos em reconhecimento
  de ordens, com referência a Itaquaquecetuba (SP).
sources:
- source: darn2-ex-padre-2010
  quote: >-
    foi recebido pela Diocese do Recife, onde pretende requerer Incardinação e posterior Reconhecimento de Ordem
- source: darn2-santo-andre-2010
  quote: Paulo Quaresma (também do PMA da Transfiguração )
- source: d2s17-clero-recon-2013
  quote: Rev. Paulo Quaresma Itaquaquecetuba- SP
- source: d2s17-clero-presb2-2013
  quote: Revdo. Paulo da Silva Quaresma
