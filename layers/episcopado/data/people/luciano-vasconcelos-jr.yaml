  - source: d2s20-acao-social
    quote: os Secretários Diocesanos, Revda. Teresa Catão (de Ação Social) e ML Luciano Júnior (de Juventude)
  notes: >-
    Nomeado pelo bispo diocesano (Robinson Cavalcanti) no Concílio Diocesano anterior a abril de 2008; o texto não
    data o concílio. Exercia o cargo em 07/04/2008 e em 12/05/2008, datas das matérias no site da diocese; ainda
    seminarista. Apresentado como Secretário Diocesano de Juventude em textos de 13/11/2010 (palestra no Encontro
    Diocesano de Ação Social e Juventude, de 06/11/2010) e de 21/12/2010; início não informado. Local: Secretaria
    Diocesana Anglicana de Juventude. Cargo para 2011 constante da relação de cargos diocesanos publicada em 10/12/2010
    (captura de dez/2010), após o XXX Concílio Diocesano. "ML" = Ministro Local. Local: Secretaria Diocesana de
    Juventude. Em exercício em 06/11/2010 ("ML Luciano Júnior"; identificado com Luciano Bezerra de Vasconcelos
    Júnior pela relação de cargos de 2011).
