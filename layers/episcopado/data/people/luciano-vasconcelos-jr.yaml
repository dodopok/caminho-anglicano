id: luciano-vasconcelos-jr
name: Luciano Vasconcelos Jr.
aliases:
- Frei Luciano Vasconcelos Jr., OSE
- Sem. Frei Luciano Vasconcelos Jr.
biography: >-
  Seminarista do SAT-PE e frade da Ordem de Santo Estevão Mártir (OSE), foi nomeado pelo bispo Robinson Cavalcanti
  Secretário Diocesano de Juventude da Diocese Anglicana do Recife, cargo que exercia em abril e maio de 2008.
sources:
- source: d2s09-meu-proposito
  quote: No Concílio Diocesano passado, fui nomeado Secretário Diocesano de Juventude pelo Bispo.
- source: d2s09-calendario-liturgico
  quote: >-
    Sem. Frei Luciano Vasconcelos Jr. , OSE é membro da Diocese do Recife; Frade da Ordem de Santo Estevão Mártir
    (OSE), Seminarista do SAT-PE e Secretário Diocesano de Juventude. Colabora com a Paróquia Anglicana do Redentor
    e Paróquia Anglicana do Semeador.
