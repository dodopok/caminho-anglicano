biography: >-
  Keyla Maria Pereira Camargo foi ordenada diácona em 08/12/2006, em Conde (PB), e presbítera em 02/06/2007, ambas
  por Robinson Cavalcanti, na Diocese Anglicana do Recife. Atuou como ministra auxiliar da Paróquia Anglicana Jardim
  das Oliveiras, no Arcediagado Centro, em Recife, e é membro da Ordem Franciscana Anglicana (OFA). Em 2009, 2010
  e 2011 constava como médica diocesana e em 2012 como coordenadora do Escritório Diocesano de Capelanias Anglicanas.
  Em 2019 constava como coadjutora na Diocese do Recife, da Igreja Anglicana no Brasil.
