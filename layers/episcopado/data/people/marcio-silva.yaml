# yaml-language-server: $schema=../../schemas/person.json
id: marcio-silva
name: Márcio Silva
biography: >-
  Márcio Silva é registrado como sagrado bispo em 07/03/2014 por Edivaldo dos Santos e consta como clérigo da IAB,
  ligado à Igreja Anglicana Garanhuns. Participou de três sagrações episcopais, entre elas as de Diego Scarmeloto
  Peral e Leonildo Fernandes, em 2024.
sources:
- source: lwac-diego-bio
  quote: 2014, 7 de março – Dom Edivaldo dos Santos sagrou Márcio Silva.
- source: dv-pastores
  quote: Rev. Márcio Silva Igreja Anglicana Garanhuns e Conselheiro
- source: lwac-wacbr-clerigos
  quote: 'Sagração Episcopal: 25/05/2024'
- source: lwac-diego-bio
  quote: >-
    2024, 25 de maio – Dom Lucas Macieira, Dom Márcio Silva e Dom Josué Torres sagraram Dom Diego Scarmeloto Peral.
- source: rtf-gazzeta-diego
  quote: Na tarde do último dia, 25 de maio de 2024* na Cidade de Taboão da Serra
- source: rtf-gazzeta-diego
  quote: >-
    na Cidade de Taboão da Serra em uma cerimônia marcada pela fé e pela união, a Igreja Carismática Luz do Senhor
    foi palco das ordenações episcopais dos reverendos Diego Scarmeloto Peral, João Paulo Miguel de Oliveira e Leonildo
    Fernandes, membros da Diocese Anglicana Católica do Brasil
- source: rtf-gazzeta-diego
  quote: >-
    foi conduzida pelo Arcebispo Dom Frei Lucas Macieira, com a assistência dos Bispos-coordenantes Dom Márcio Silva
    e Dom Josué Torres
ordinations:
- order: episcopate
  date: '2014-03-07'
  jurisdiction: null
  principal_consecrator: edivaldo-dos-santos
  status: probable
  sources:
  - source: lwac-diego-bio
    quote: 2014, 7 de março – Dom Edivaldo dos Santos sagrou Márcio Silva.
  notes: >-
    Linhagem declarada no site de Diego Peral (terceira linha); jurisdição não informada. A identidade deste Márcio
    Silva não foi confirmada por outra fonte.
