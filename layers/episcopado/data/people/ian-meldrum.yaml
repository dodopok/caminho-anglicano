id: ian-meldrum
name: Ian Meldrum
biography: >-
  Ian Meldrum foi ordinando do bispo Edmund Knox Sherrill e estudou no Núcleo de Estudos Anglicanos (NAET). Em 1997,
  o retiro do clero em Paudalho (PE) sugeriu seu nome, com os de Maurício Andrade e Robinson Cavalcanti, para a
  escolha do novo bispo da Diocese Anglicana do Recife, e no Concílio Extraordinário de Itaparica (BA) esteve entre
  os três indicados; foi eleito Robinson Cavalcanti. Foi presbítero da diocese, cooperador internacional da SAMS
  UK e presidente do Conselho Diocesano. Em 23 de agosto de 2005 foi incluído entre os clérigos excluídos da comunhão
  da IEAB, tendo declarado manter plena comunhão com Robinson Cavalcanti. Integrou a equipe pastoral da Paróquia
  Anglicana Água Viva e se aposentou em maio de 2009.
