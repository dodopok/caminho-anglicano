# yaml-language-server: $schema=../../schemas/person.json
id: ian-meldrum
name: Ian Meldrum
biography: Clérigo da Diocese Anglicana do Recife citado em documento oficial da própria Diocese.
sources:
- source: drp-boletim-oracao-2006
  quote: 'Orar pela Paróquia Anglicana Água Viva; pelos Reverendos: Siméa e Ian Meldrum'
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Ian Meldrum
  - source: drv-nota-esclarecimento-2006
    quote: Ian Meldrum
  - source: drp-boletim-oracao-2006
    quote: 'Orar pela Paróquia Anglicana Água Viva; pelos Reverendos: Siméa e Ian Meldrum'
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Ian Meldrum … Os clérigos não atenderam à convocação e declararam,
      via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo plena comunhão
      com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Paróquia Anglicana Água Viva (Olinda). Clérigo
    citado como pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão).
    Anexo R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson
    Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005
    é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data exata.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Ian Meldrum … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
- jurisdiction: diocese-anglicana-recife
  role: priest
  end: 2009-05
  end_reason: retirement
  status: confirmed
  sources:
  - source: darn2-ian-meldrum-2009
    quote: >-
      quando da aposentadoria do Rev. Ian Meldrum , vem expressar Ações de Graças por sua vida e profícuo ministério
  notes: >-
    Aposentadoria do ministério presbiteral comunicada em nota do bispo diocesano Robinson Cavalcanti datada de
    22/05/2009; o mês é o da nota.
events:
- type: other
  date: 1977/1985
  description: >-
    O bispo Sherrill criou o NAET (Núcleo de Estudos Anglicanos), onde estudaram Ian Meldrum, Robinson Cavalcanti
    e Antônio Carlos (da Bahia); também foram ordenados no período Sherrill Josephino Lobato (Belém) e um fazendeiro
    japonês, ministro local. Washington Franco foi deixado já preparado para a ordenação.
  status: probable
  sources:
  - source: drv-resgatando-ii
    quote: >-
      onde estudaram três dos seus ordinandos, os futuros reverendos: Ian Meldrum, Robinson Cavalcanti e Antônio
      Carlos (da Bahia)
  - source: drv-resgatando-ii
    quote: >-
      Os outros Ministros Ordenados durante o período Sherrill foram: Josephino Lobato, de Belém-PA e um fazendeiro
      japonês
  - source: drv-resgatando-ii
    quote: Deixou o Bispo, ao final, já preparado o processo do Postulante e depois Rev. Washington Franco.
- type: other
  date: '1997-06-28'
  description: >-
    Eleição de Robinson Cavalcanti como bispo coadjutor da Diocese Anglicana do Recife no Concílio Extraordinário
    de Vera Cruz (Ilha de Itaparica, BA), após sete escrutínios; concorreram Maurício Andrade e Ian Meldrum (que
    retirou a candidatura).
  status: probable
  sources:
  - source: costa2021
    quote: >-
      O Concílio Extraordinário da Diocese Anglicana do Recife aconteceu em 28 de junho de 1997, na cidade de Vera
      Cruz, na Ilha de Itaparica (BA)
    page: '186'
  - source: costa2021
    quote: >-
      A disputa foi resolvida com o voto de um delegado de Belém do Pará, o que garantiu a eleição de Robinson Cavalcanti.
    page: '186'
- type: other
  date: '1997-06-28'
  description: >-
    Eleição de Robinson Cavalcanti como bispo coadjutor da Diocese do Recife (IEAB), por maioria absoluta do clero
    e dos leigos, em Concílio Extraordinário na casa de retiro dos jesuítas na Ilha de Itaparica (BA); concorreram
    também Maurício Andrade e Ian Meldrum. A eleição foi depois homologada pela maioria dos bispos e conselhos diocesanos
    da Província.
  status: confirmed
  sources:
  - source: drv-resgatando-iv
    quote: >-
      Um Concílio Extraordinário foi, então, convocado para o final de junho de 1997, na casa de retiro dos Jesuítas,
      na Ilha de Itaparica, na Bahia, para eleger um Bispo Coadjutor (auxiliar com direito à sucessão).
  - source: drv-resgatando-iv
    quote: >-
      Na ocasião foram indicados 3 nomes: os reverendos Maurício Andrade, Ian Meldrum e Robinson Cavalcanti
  - source: drv-resgatando-iv
    quote: >-
      Na véspera da festa de São Pedro de 1997, foi eleito como terceiro Bispo da Diocese Anglicana do Recife (o
      primeiro eleito aqui e o primeiro nativo) o Rev. Robinson Cavalcanti, por maioria absoluta das urnas do clero
      e dos leigos, posteriormente homologado pela maioria dos Bispos e dos Conselhos Diocesanos da Província
- type: other
  date: '1997-06-28'
  description: >-
    Eleição de Robinson Cavalcanti como bispo da Diocese Anglicana do Recife (IEAB), no Concílio reunido numa casa
    de retiro dos jesuítas na Ilha de Itaparica-BA, no sábado véspera de São Pedro de 1997, no décimo escrutínio;
    os outros candidatos eram Ian Meldrum e Maurício Andrade. O bispo diocesano Clóvis Erly Rodrigues proclamou
    o eleito, na presença do Primaz Glauco Soares de Lima.
  status: probable
  sources:
  - source: drp2-memorias-decada-ii
    quote: >-
      Chegamos à Ilha de Itaparica na tarde da sexta-feira. Tivemos uma Eucaristia, celebrada pelo Primaz, Dom Glauco
      Soares de Lima
  - source: drp2-memorias-decada-ii
    quote: Manhã do sábado, véspera de São Pedro. Votações por ordem, com chamada nominal.
  - source: drp2-memorias-decada-ii
    quote: >-
      No décimo escrutínio, tensão para a leitura do último e decisivo voto: consegui a maioria. O Bispo Clóvis
      proclama o eleito.
