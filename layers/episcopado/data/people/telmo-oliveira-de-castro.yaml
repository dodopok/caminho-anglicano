biography: >-
  Ordenado diácono em novembro de 1958 e presbítero em outubro de 1959, ambos por Egmont Krischke, no Distrito Missionário
  do Sudoeste do Brasil, foi transferido para a Igreja Episcopal do Brasil em 25/04/1965.
