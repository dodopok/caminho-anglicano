wikidata: Q6915936
biography: Bispo de Serra Leoa (1961–1981) e arcebispo da Província da África Ocidental (1969–1981).
sources:
- source: wp-scott
  quote: >-
    '''Moses Nathanael Christopher Omobiala Scott'''  [[Order of the British Empire|CBE]] (18 August 1911 – 9 May
    1988)
ordinations:
- order: episcopate
  date: '1961-11-12'
  place: Catedral de São Jorge (Cathedral Church of St. George), Freetown, Serra Leoa
  jurisdiction: province-of-west-africa
  office: diocesan
  principal_consecrator: cecil-john-patterson
  status: confirmed
  sources:
  - source: ia-gc-journal-1964
    quote: >-
      Christophe Omobiala Scott, Dip. Th., as Bishop of Sierra Leone, on November 12, 1961, in the Cathedral Church
      of St. George, Freetown, Sierra Leone
  - source: ia-church-times-1988-05-13
    quote: >-
      He was Archdeacon of Bonthe and Bo from 1959 to 1961, when he was consecrated to be Bishop of Sierra Leone
      in succession to the Most Rev. J. L. C. Horstead.
  - source: cam-cms-consecrations-1961
    quote: >-
      Bishop Scott (left) with Archbishop Patterson and Assistant Bishop P.J. Jones outside Cathedral House after
      consecration, 1961
  - source: cam-cms-consecrations-1961
    quote: Bishop Scott accompanied by the Most Rev. C.J. Patterson, Archbishop of West Africa, 1961
  - source: cam-cms-consecrations-1961
    quote: Rev. H.R. Tilbury heading the procession from the Cathedral after the consecration, 1961
  - source: gc-journal-1964
    quote: >-
      June 1, 1964—Received notice from Cecil John, Archbishop of West Africa, of the consecration of: the Ven.
      Moses Nathaniel Christophe Omobiala Scott, Dip. Th., as Bishop of Sierra Leone, on November 12, 1961, in the
      Cathedral Church of St. George, Freetown, Sierra Leone;
  - source: anglican-digest-1961-winter
    quote: The Venerable Moses Nathan- iel Christopher Omobiala Scott, former Archdeacon of Bonthe and Bo
  - source: whoswho-1962
    quote: SIERRA  LEONE,  Bishop  of,  since  1961; Rt.  Rev.  Moses  Natfianael  Christopher Otnobiala  Scott
  notes: >-
    O registro da Convenção Geral da TEC (1964) transcreve a notificação da sagração enviada por 'Cecil John, Archbishop
    of West Africa' (Cecil John Patterson, arcebispo metropolitano da África Ocidental de 1961 a 1969). Na mesma
    série foram notificados Agori Iwe (Benin, 30/11/1961) e Rogers Nathaniel Bara Hart (Niger Delta, 10/12/1961).
    Nenhuma fonte diz literalmente quem sagrou Scott. Patterson aparece como sagrante principal por inferência:
    era o arcebispo metropolitano da província em 1961, foi ele quem notificou a sagração à Igreja Episcopal dos
    EUA, e as fotografias da CMS da pasta 'Consecrations, 1961' (itens GBR/0115/RCS/CMS/11/3/1-15) o mostram com
    Scott depois da sagração. As mesmas fotos mostram o bispo assistente P. J. Jones e o bispo da Gâmbia, prováveis
    co-sagrantes, também sem confirmação.
