biography: >-
  Sagrado bispo de Connecticut em 14/11/1784, em Aberdeen, por Robert Kilgour, Arthur Petrie e John Skinner, bispos
  escoceses; foi também bispo de Rhode Island e faleceu em 25/02/1796.
