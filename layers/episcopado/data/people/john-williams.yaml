id: john-williams
name: John Williams
full_name: John Williams
aliases:
- Bp. J. Williams
- Bp. John Williams (Connecticut)
wikidata: Q6264336
biography: >-
  Sagrado em 29 de outubro de 1851, em Hartford, como bispo coadjutor de Connecticut, por Thomas Church Brownell,
  com John Henry Hopkins e William H. DeLancey entre os sagrantes; tornou-se bispo de Connecticut com a morte de
  Brownell. Foi Presiding Bishop da Igreja Episcopal e sagrante principal de William Lawrence.
sources:
- source: perry-1895
  quote: >-
    Williams was consecrated to the coadjutor bishopric of Connecticut, Oct. 29, 185 1, in St. John's Church, Hartford,
    b\- Bishops Brownell, Hopkins, Eastburn, Henshaw, Carlton Chase, Burgess, and De Lancey.
