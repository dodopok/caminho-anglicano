wikidata: Q6264336
biography: >-
  Sagrado em 29 de outubro de 1851, em Hartford, como bispo coadjutor de Connecticut, por Thomas Church Brownell,
  com John Henry Hopkins e William H. DeLancey entre os sagrantes; tornou-se bispo de Connecticut com a morte de
  Brownell. Foi Presiding Bishop da Igreja Episcopal e sagrante principal de William Lawrence. Participou de quatro
  sagrações episcopais, entre elas as de Horatio Potter e John Barrett Kerfoot, como co-sagrante.
