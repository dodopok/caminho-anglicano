biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Alemanha
  (1917-05-14). Ordenado diácono em mai/1946 e presbítero em mai/1947. Transferido para a Igreja Episcopal do Brasil
  em 25/04/1965 (Clerical Directory 1968).
