id: josephino-lobato-de-souza
name: Josephino Lobato de Souza
aliases:
- Joselino Lobato de Souza
biography: >-
  Primeiro paraense ordenado, foi ordenado diácono em 1974 por Elliott Sorge, bispo de Ohio (EUA), a pedido do bispo
  Sherrill, e presbítero em 4 de dezembro de 1975 por Edmund Knox Sherrill. Atuou em Belém (PA), na Paróquia de
  Santa Maria, e participou do primeiro Concílio da Diocese Setentrional, em Recife, em junho de 1976. Recebeu o
  título de Venerável Arcipreste e, em 2000, figura entre os clérigos que permaneceram no Distrito Missionário da
  Amazônia.
sources:
- source: cant-amazonia
  quote: >-
    conato o primeiro paraense, Rev. Josephino Lobato de Souza, por Elliot Sorge, na época bispo da Diocese de Ohio
    Estados Unidos, atendendo solicitação do bispo Sherrill
- source: kickhofel-1995
  quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1974 - … Josephino Lobato de Souza
  page: '372'
- source: cant-amazonia
  quote: O Rev. Lobato vai ser ordenado ao presbiterado, pelo bispo Sherril, em 04 de dezembro de 1975.
- source: costa2021
