biography: >-
  Geoffrey Francis Fisher (5/5/1887 – 15/9/1972) foi sagrado em 21/9/1932, em York Minster, por William Temple,
  como bispo de Chester, e foi entronizado na Catedral de Chester. Foi arcebispo de Cantuária de 1945 a 1961, quando
  se aposentou. Nessa função assinou em 1955, com o Bispo Presidente Henry Knox Sherrill, o acordo entre a Igreja
  da Inglaterra e a Igreja Episcopal dos Estados Unidos sobre as capelanias inglesas no Brasil.
