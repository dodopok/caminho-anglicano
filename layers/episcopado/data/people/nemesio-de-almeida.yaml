  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1908 - … Nemésio de Almeida
    page: '369'
  notes: >-
    Datas e bispo do verbete do anuário; 'Bp.' no verbete vale para as duas ordenações quando citado uma só vez.
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
- order: presbyterate
