# yaml-language-server: $schema=../../schemas/person.json
id: nemesio-de-almeida
name: Nemésio de Almeida
full_name: Nemésio de Almeida
biography: >-
  Clérigo da IEAB, ordenado diácono em outubro de 1908 e presbítero em setembro de 1911 pelo bispo Lucien Lee Kinsolving;
  em 1934, assinou o memorial do concílio que pedia a escolha do novo bispo entre o clero nativo.
sources:
- source: rta-ecd1950
  quote: D—Oct., 1908, P—Sept., 1911, Bp. L. L. Kinsolving
- source: kickhofel-1995
  quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1908 - … Nemésio de Almeida
  page: '369'
- source: kickhofel-1995
  quote: >-
    Assinaram o histórico memorial os reverendos Salomão Ferraz, George Upton Krischke, Nemésio de Almeida, João
    Batista Barcellos da Cunha, Orlando Batista e Athalício Theodoro Pithan e os leigos Frontino Peixoto da Silveira
    e José Luiz Albuquerque.
  page: '188'
ordinations:
- order: diaconate
  date: 1908-10
  jurisdiction: ieab
  ordained_by: lucien-lee-kinsolving
  status: confirmed
  sources:
  - source: rta-ecd1950
