events:
- type: other
  date: '2019'
  description: >-
    Lista de bispos da IAL registra em Fortaleza (CE), em 2019, as sagrações/ratificações dos brasileiros José Fernando
    de Faria (ratificação), Paulo Cesar Gomes (ratificação) e Antonio Jose Pereira-Bessa, além do argentino Cristian
    Gerardo Romero, também em Fortaleza.
  status: confirmed
  sources:
  - source: lac-ial-sucessao
    quote: >-
      40th (Fortieth) Bishop consecrated by IAL USA/Canada: -066. GOMES Paulo Cesar. - Single. (Ratification) -
      Brazilian Citizen - In 2019 - Fortaleza city, Ceara, Brazil - (Still living).
  - source: lac-ial-sucessao
    quote: >-
      39th ( Thirty-Nineth ) Bishop consecrated by IAL USA/Canada: -065. ROMERO Cristian Gerardo. - Married. - Argentinean
      Citizen - in 2019 - Fortaleza city, Ceara, Brazil - (Still living).
- type: other
  date: 2018-07
  description: >-
    1º Sínodo da Província Católica Anglicana do Brasil (ICA-Brasil), em São Paulo, em julho de 2018, com aprovação
    dos primeiros cânones e "Sagrações episcopais"; em 29/07/2018 foi sagrado José Fernando de Faria. A ICA (de
    Orvandil) reagiu em 30/07/2018 negando ter sagrado qualquer bispo após seu registro em cartório e designado
    bispos para Rio Grande do Sul, Espírito Santo, São Paulo e Amazônia.
  status: probable
  sources:
  - source: lica-iaces-historia
    quote: com nosso Primeiro Sínodo em São Paulo Brasil, em Julho de 2018
  - source: lica-ica-nota-esclarecimento
    quote: nem a ninguém designou para o Rio Grande do Sul, Espírito Santo, São Paulo e Amazônia
- type: other
  date: '2018-10-11'
  description: >-
    José Fernando de Faria é "elevado ao encargo de Arcebispo do Brasil e Primaz de toda a América do Sul" em 11/10/2018
    pelo patriarca Heigo Ritsbek ("AngloCatholic of Estonia"), dando origem à Igreja Anglo-Católica do Brasil e
    América do Sul (IACES).
  status: probable
  sources:
  - source: lica-iaces-historia
    quote: fora elevado ao encargo de Arcebispo do Brasil e Primaz de toda a América do Sul em 11/10/2018
