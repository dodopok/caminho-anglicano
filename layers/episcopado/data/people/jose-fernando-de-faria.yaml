biography: >-
  Sagrado bispo em 29/07/2018, em São Paulo, por Ricardo Vicente dos Anjos, da ICA-Brasil, com Jorge dos Santos
  Costa e Altamiro Pereira do Amaral como co-ordenantes; a ICA negou que os sagrados em São Paulo falassem em seu
  nome, a página da IACES situa a ordenação em Fortaleza em 01/11/2019 e outra fonte atribui a sagração a Leonardo
  Marin-Saavedra. Em 11/10/2018 foi elevado a arcebispo do Brasil e primaz da América do Sul, tendo sido arcebispo
  primaz da PACES, hoje extinta, cuja criação propôs. Fundou em 13/04/2021 a Igreja Veterocatólica Missionária (IVCM),
  registrada em Vila Velha (ES), da qual foi aclamado patriarca em 25/08/2023.
