  notes: >-
    Data e cidade concordam entre a lista de clero da IACES (que nomeia os sagrantes) e a nota da ICA de 30/07/2018,
    que nega que a ICA tenha sagrado qualquer bispo após seu registro em cartório. A nota da ICA não nomeia os sagrados.
    Por outro lado, a história da jurisdição afirma que Faria foi sagrado por Leonardo Marin Saavedra; o site da
    IACES registra a ratificação em 02/11/2019 por ele. Na lista da IAL consta como 'Ratification' em Fortaleza,
    2019: a IAL ratificou ordens que ele já tinha, em vez de conferir sagração nova. Cant (2024) diz que ele foi
    'sagrado bispo por dom Leonardo Marin-Saavedra'. Sagrante inferido do contexto da lista (consagrações da IAL).
    Primaz da extinta Província Anglicana Católica do Espírito Santo. Ratificação da ordenação episcopal de 29/07/2018,
    segundo o site da própria IACES. Lista de sucessão publicada pela IVCM: James Roque consagrou José Fernando
    de Faria em 22/11/2020 (a data aparece na frase sobre Roque e o local na frase seguinte). O site da própria
    igreja anterior de Faria (IACES) dá outra versão: ordenação episcopal em 29/07/2018, em São Paulo, por Ricardo
    Vicente dos Anjos, ratificada em 02/11/2019 por Leonardo Marin-Saavedra. A IVCM não menciona essas duas cerimônias;
    pode se tratar de uma terceira consagração (condicional ou de nova linhagem) ou de uma versão simplificada.
    Informação publicada pelo próprio site da IACES (captura de 22/10/2020). O local é descrito como espaço das
    Irmãs da Consolata, ligado à Igreja Católica Apostólica Romana. Ratificação da ordenação episcopal de 29/07/2018,
    segundo a IACES; local não informado. Coincide com a versão de obra de 2024, que diz que Faria foi sagrado por
    Marin-Saavedra.
