    parte do clero da IACES migrou para a IVCM.
  status: probable
  sources:
  - source: lvc-iaces-clero
    quote: >-
      Vagner Antônio Nunes Reverendo Presbítero Ordenado em 21/07/2019 em SP Natural: Piedade - SP Bispo Ordenante:
      + Dom Marcos Vinicius de Souza, CASF
  - source: rta-ivcm-clerigos
