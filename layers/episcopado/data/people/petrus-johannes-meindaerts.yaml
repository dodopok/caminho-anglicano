id: petrus-johannes-meindaerts
name: Petrus Johannes Meindaerts
ordinations:
- order: episcopate
  date: '1739-10-18'
  place: Utrecht
  jurisdiction: null
  office: diocesan
  principal_consecrator: dominique-marie-varlet
  status: confirmed
  sources:
  - source: lin-wp-en-meindaerts
    quote: >-
      On 18 October 1739 he was consecrated by Bishop Dominique Marie Varlet , former Roman Catholic Bishop of the
      Diocese of Babylon.
  - source: lin-neale
    quote: 4 Peter John Meindaerts Oct. 18, 1739 Oct. 31, 1767 Dominic Varlet, Bishop of Babylon.
  - source: lin-wp-nl-meindaerts
