events:
- type: other
  date: '2004-06-03'
  description: >-
    Robinson Cavalcanti subscreveu, entre outros, o documento "Chamados ao testemunho e à Fraternidade" (Documento
    das Bahamas, Nassau, 03/06/2004), encaminhado à Comissão de Lambeth, que declara consumada a ruptura da Comunhão
    Anglicana provocada pela Igreja Episcopal dos EUA e pela Igreja Anglicana do Canadá e conclama o Arcebispo de
    Cantuária e os Primazes a responder; Robinson Cavalcanti também o traduziu.
  status: confirmed
  sources:
  - source: darl2-bahamas
    quote: Nassau, Bahamas, 03 de Junho de 2004.
  - source: darl2-bahamas
    quote: Robinson Cavalcanti (Brasil)
  - source: darl2-bahamas
    quote: '(Tradução: Dom Robinson Cavalcanti)'
- type: other
  date: '2004-05-30'
  description: >-
    Entre 30/05 e 05/06/2004 Dom Robinson Cavalcanti participou, em Nassau (Bahamas), de uma consulta teológica
    de 15 pessoas presidida pelo arcebispo Drexel Gómez (primaz das Índias Ocidentais), com os arcebispos Bernard
    Malango e Josiah Fearon e os bispos Michael Nazir-Ali, James Stanton e Robert Duncan, que redigiu o texto "Chamados
    ao Testemunho e à Fraternidade" como subsídio à Comissão de Lambeth (Comissão Eames).
  status: confirmed
  sources:
  - source: darb2-bahamas
    quote: >-
      De 30 de maio a 05 de junho próximo passado estive em Nassau, capital das Bahamas, em uma Consulta Teológica,
      com 15 (quinze) participantes de diversos países
  - source: darb2-bahamas
    quote: >-
      A Consulta foi presidida pelo Arcebispo Drexel Gómez, Diocesano das Bahamas e Primaz da Província das Índias
      Ocidentais
  - source: darb2-bahamas
    quote: >-
      os bispos Michael Nazir-Ali, Diocesano de Rochester (Inglaterra, e 2º na última lista para Arcebispo de Cantuária),
      James Stanton, Diocesano de Dallas (EUA) e Robert Duncan, Diocesano de Pittisburg e Moderador da Rede de Dioceses
      e Paróquias Anglicanas (EUA)
- type: other
  date: '2010-06-11'
  description: >-
    A Diocese do Recife e o Colégio dos Bispos da ACNA assinam o Memorando de Compreensão e Entendimento 2010 (observadores
    recíprocos, aceitação mútua das ordens ministeriais, parcerias); Robinson Cavalcanti participa da reunião do
    Colégio dos Bispos em Amesbury (Massachusetts).
  status: confirmed
  sources:
  - source: darn1-acna-memo
    quote: Memorando de Cooperação com a Diocese do Recife
  - source: darn1-acna-memo
    quote: 'Pelo Colégio: Revmo. Robert Duncan'
  - source: darn1-acna-memo
    quote: 'Pela Diocese: Revmo. Robinson Cavalcanti'
  - source: darn1-acna-esclar
    quote: >-
      inclusive sua presença na recente reunião do Concílio Provincial e do Colégio dos Bispos da Igreja Anglicana
      na América do Norte (ACNA)
- type: other
  date: 2010-06
  description: >-
    Em Amesbury (Massachusetts) é inaugurada a Diocese Anglicana da Nova Inglaterra (ACNA) e empossado seu primeiro
    bispo, William (Bill) Murdoch, com pregação de John Guernsey; no mesmo dia o Colégio dos Bispos da ACNA cria
    duas novas dioceses (Great Lakes e South). Durante a reunião do Colégio, Robinson Cavalcanti tem almoço de trabalho
    com o arcebispo primaz Robert Duncan.
  status: probable
  sources:
  - source: darn1-novainglaterra
    quote: >-
      Tratava-se da inauguração da Diocese Anglicana da Nova Inglaterra , em Amesbury, Massachussets, e a instalação
      e posse do seu primeiro Bispo, o Revmo. William (Bill) Leo Murdoch, tendo como pregador o Revmo. John Guernsey
  - source: darn1-novainglaterra
    quote: >-
      Durante o dia havia se reunido o Colégio dos Bispos da ACNA que criou duas novas Dioceses: Great lakes – Bispo
      Robert Aemes e South – Bispo Folley Beach
  - source: darn1-novainglaterra
    quote: teve, a convite, um almoço privado de trabalho com o Arcebispo Primaz Robert Duncan
