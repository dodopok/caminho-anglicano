      A Consulta foi presidida pelo Arcebispo Drexel Gómez, Diocesano das Bahamas e Primaz da Província das Índias
      Ocidentais
  - source: darb2-bahamas
    quote: >-
      os bispos Michael Nazir-Ali, Diocesano de Rochester (Inglaterra, e 2º na última lista para Arcebispo de Cantuária),
      James Stanton, Diocesano de Dallas (EUA) e Robert Duncan, Diocesano de Pittisburg e Moderador da Rede de Dioceses
      e Paróquias Anglicanas (EUA)
