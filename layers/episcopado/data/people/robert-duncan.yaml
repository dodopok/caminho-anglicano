    quote: >-
      Com a finalidade de participar, como observador, das reuniões do Conselho Executivo e do Colégio dos Bispos
      da Igreja Anglicana na América do Norte (ACNA), na cidade de Amesbury, Massachussets, objetivando um estreitamento
      de relações institucionais, viajou na madrugada de hoje, para os Estados Unidos, o Bispo Robinson Cavalcanti
  - source: d2s19-acna-concilio
