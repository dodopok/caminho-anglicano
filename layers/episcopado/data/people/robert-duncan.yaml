biography: >-
  Robert Duncan, eleito bispo coadjutor de Pittsburgh em 1995, foi sagrado em 1996 por Edmond Browning. Em junho
  de 2009 foi eleito o primeiro arcebispo e primaz da Igreja Anglicana na América do Norte (ACNA), instalado em
  25 de junho, e deixou a primazia em 2014. Em 2010 assinou, pelo Colégio dos Bispos da ACNA, um memorando de cooperação
  com a Diocese do Recife. Participou de três sagrações episcopais, entre elas as de Foley Beach (2010) e Kevin
  Allen (2011).
