events:
- type: other
  date: '2004-06-03'
  description: >-
    Robinson Cavalcanti subscreveu, entre outros, o documento "Chamados ao testemunho e à Fraternidade" (Documento
    das Bahamas, Nassau, 03/06/2004), encaminhado à Comissão de Lambeth, que declara consumada a ruptura da Comunhão
    Anglicana provocada pela Igreja Episcopal dos EUA e pela Igreja Anglicana do Canadá e conclama o Arcebispo de
    Cantuária e os Primazes a responder; Robinson Cavalcanti também o traduziu.
