id: hermes-carvalho-fernandes
name: Hermes Carvalho Fernandes
full_name: Hermes Carvalho Fernandes
aliases:
- Bispo Hermes C. Fernandes
- Hermes Fernandes
biography: >-
  Psicólogo, teólogo, ativista e autor; fundador e presidente do colégio episcopal da REINA; declara-se bispo sagrado
  pela International Christian Communion (CCI); co-sagrante de Leonides de Menezes (dez/2006). Segundo seu próprio
  blog (não acessível), sagrado em 25/3/2005 na Crossroads Cathedral Church, Sparta (Tennessee).
sources:
- source: ciceb-quemsomos
  quote: em cerimônia oficiada pelos bispos William Paul Mikler, Hermes Carvalho Fernandes e Francisco Buzzo
- source: tiagolinno-hermes
  quote: >-
    presidente do colégio episcopal da REINA-Igreja do Futuro, bispo consagrado pela International Christian Communion
    (comunhão que reúne bispos de tradição anglicana/episcopal dos cinco continentes)
ordinations:
- order: episcopate
  date: '2005-03-25'
  place: Crossroads Cathedral Church, Sparta, Tennessee (EUA)
  jurisdiction: cci
  status: probable
  sources:
  - source: rtb-hermes-editor
    quote: >-
      Em 25 de Março de 2005 foi sagrado bispo com sucessão apostólica na Crossroads Cathedral Church, em Sparta,
      TN, por bispos de várias partes do mundo, ligados à Christian Communion International, tornando-se parte da
      College of Bishops.
  - source: fb-hermes-20-anos-sagracao
    quote: >-
      Vinte anos atrás, fui sagrado bispo com sucessão apostólica pela International Christian Communion—comunhão
      que reúne bispos de tradição anglicana/episcopal dos cinco continentes—em um lindo rito celta realizado na
      catedral em Sparta, Tennessee (EUA).
