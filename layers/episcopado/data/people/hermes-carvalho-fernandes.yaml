biography: >-
  Psicólogo, teólogo, ativista e autor; fundador e presidente do colégio episcopal da REINA; declara-se bispo sagrado
  pela International Christian Communion (CCI); co-sagrante de Leonides de Menezes (dez/2006). Segundo seu próprio
  blog (não acessível), sagrado em 25/3/2005 na Crossroads Cathedral Church, Sparta (Tennessee).
