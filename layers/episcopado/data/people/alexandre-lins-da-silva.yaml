id: alexandre-lins-da-silva
name: Alexandre Lins da Silva
full_name: Alexandre Lins da Silva
aliases:
- Dom Alexandre Lins
- Dom Alexandre Silva
biography: >-
  Alexandre Lins da Silva, reitor da Paróquia Betânia, em Natal, já chamado bispo eleito em junho de 2014, foi sagrado
  bispo da IECB em 02/10/2014, como auxiliar para missões no Rio Grande do Norte, e consta como bispo diocesano
  de Natal.
sources:
- source: isg-betesda-betania-natal-2014
  quote: >-
    No ultimo dia 29 de Junho o nosso Arcebispo Dom Paulo Ruiz Garcia inaugurou a IECB - Paróquia Betânia em Natal
    - Rio Grande do Norte.
- source: isg-betesda-betania-natal-2014
  quote: esta Paróquia e seu Reitor Dom Alexandre Lins (Bispo Eleito).
- source: ptwiki-iecb
  quote: Alexandre Lins da Silva (2014)
- source: costa2021
