- source: isg-betesda-alexandre-lins
  quote: >-
    No dia 02 de outubro o Rev. Alexandre Lins foi consagrado Bispo Diocesano do Estado do Rio Grande do Norte.
- source: lie-betesda-paroquias
  quote: 'Bispo Diocesano: Dom Alexandre Lins'
