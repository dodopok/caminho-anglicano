biography: >-
  Nascido em 31/10/1864 e falecido em 05/12/1945, foi sagrado bispo em 01/05/1901, na Catedral de São Paulo, por
  Frederick Temple, e nomeado bispo sufragâneo de Stepney em 1901. Chegou a arcebispo da Cantuária e sagrou William
  Temple.
