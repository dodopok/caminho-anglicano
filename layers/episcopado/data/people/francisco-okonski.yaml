biography: >-
  Francisco Okonski foi ordenado diácono em dezembro de 1956 e presbítero em agosto de 1957, pelo bispo Plínio Lauer
  Simões. Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra), foi transferido para a Igreja Episcopal
  do Brasil em 25 de abril de 1965.
