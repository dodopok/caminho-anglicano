- Teresa Julieta de Paula Menezes Catão
biography: >-
  Ministra leiga da Missão Anglicana da Salvação em 2004, foi ordenada diácona em 27/08/2005 e presbítera em 07/04/2006,
  ambas por Robinson Cavalcanti, na Diocese Anglicana do Recife. Integra a equipe pastoral da Paróquia Anglicana
  do Semeador, no Arcediagado Norte, onde foi coadjutora, e é secretária diocesana de Ação Social.
