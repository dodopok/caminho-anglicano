biography: >-
  Sagrado em 04/02/1787, na capela de Lambeth Palace, por John Moore, com William of York, Charles of Bath and Wells
  e John of Peterborough, e ao mesmo tempo que William White, tornou-se primeiro bispo de Nova York (TEC).
