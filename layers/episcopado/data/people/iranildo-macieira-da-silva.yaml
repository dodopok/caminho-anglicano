  notes: >-
    O site chama Jelinek e Chadwick ("Arcebispo da França") de co-celebrantes da sagração. CONTESTADO: o mesmo livro
    (cap. Igreja Episcopal Latina do Brasil) diz "A sagração episcopal dom Lucas Macieira ocorreu em 26 de setembro
    de 2004 em Portugal, por bispos da Igreja Apostólica Episcopal Portuguesa". Houve também uma sagração anterior
    no Brasil (2004), contestada. A lista de sagrantes no trecho continua (truncada). Versão do capítulo "Igreja
    Episcopal Latina do Brasil" do mesmo livro. Data e sucessão segundo a lista 'Brazilian Catholic Line' da IATB
    (a lista não nomeia o sagrante explicitamente; a ordem sucessória indica José Ricardo Ferreira de Souza, consagrado
    em 05/05/2002). Data de 24/10/2004 (Instagram do próprio sagrado, Wikipédia polonesa, livro "Novas igrejas..."
    citado em outras fichas). O cadastro oficial da DAC e blogs da IELB trazem 25/10/2004 (afirmação separada).
    A Wikipédia polonesa lista Macieira entre os consagrados por Raposo em 24/10/2004, no mesmo dia que Célio Spinelli
    e José Moisés Moncada Quevedo (sagração múltipla). O Instagram nomeia ainda Moncada Quevedo (Colômbia) na foto
    da cerimônia; não se sabe se foi co-sagrante. Versão com 25/10/2004, do cadastro oficial da DAC (que informa
    também o local exato: Capela do Lar Santa Clara) e de blogs da IELB de 2008-2012. Mesma cerimônia da afirmação
    de 24/10/2004; a divergência é só de um dia. Primeira sagração, anterior à de Portugal, por José Ricardo Ferreira
    de Souza (primaz da Iglesia Viejo Católica en América, linha argentina Mascolo-Morizio Dominguez-Tenca Rusconi,
    derivada de Duarte Costa). Sagrado em 05/05/2002 por Tenca Rusconi segundo as mesmas páginas. Parece ser a sagração
    "no Brasil" depois contestada e repetida em Portugal; o livro "Novas igrejas" cita 26/09/2004 mas atribui-a
    a Portugal. Outra linha de sucessão divulgada por Macieira: Old Catholic Church (EUA), Jas F. A. Lashley ->
    Wanderley Gonçalves de Almeida -> Rafael Linuesa Peres -> José Carlos Teodoro -> Paulo Pereira -> Cícero Cruz
    de Souza -> Iranildo Macieira. Não informa data nem local; a linha da IAOB (Cícero Cruz de Souza, 2001 -> Iranildo,
    2004) coincide. Em post de 20/11/2025 a própria Diocese Anglicana Católica do Brasil dá 25/10/2004 como data
    da sagração de Lucas Macieira, em Murgeira (Portugal), na lista de sucessão apostólica; outras fontes já consultadas
    apontam 24/10/2004 para o mesmo ato. O post não nomeia o sagrante principal nem os co-sagrantes desse ato. Linhagem
    declarada no site de Diego Peral (primeira linha). Outra fonte (a segunda linha do mesmo site) dá a sagração
    de Macieira em Portugal em 25/10/2004 por António José da Costa Raposo. Registrado como contestado por haver
    duas sagrações distintas no mesmo ano. Linhagem declarada no site de Diego Peral (segunda linha). Outros registros
    datam a mesma sagração de 24/10/2004; diferença de um dia entre fontes. Primeira sagração, no Brasil, contestada;
    sagrantes não citados. Seguiu-se nova sagração em Portugal (24/10/2004). O livro não distingue o sagrante principal
    entre os três bispos de tradição vétero-católica. Sagrantes não nomeados ('por bispos da Igreja Apostólica Episcopal
    Portuguesa').
