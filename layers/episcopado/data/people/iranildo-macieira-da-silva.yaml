  - source: pasc-arcebispo-primaz
    quote: >-
      Já em dezembro do mesmo ano o mesmo funda a Igreja Episcopal Latina do Brasil, uma Igreja de corrente Anglo-Católica
      independente no Brasil.
  - source: cant-novas-igrejas-2024
    quote: Em dezembro do mesmo ano o mesmo fundo a Igreja Episcopal Latina do Brasil
    page: '101'
  - source: cant-novas-igrejas-2024
    quote: >-
      Fundada em dezembro de 2004 a Igreja Episcopal Latina do Brasil (de sigla IELB, a qual não deve ser confundida
      com a Igreja Luterana) teve origem na liderança de dom Lucas Macieira da Silva e o frei Antonio Santana Neto,
      ambos advindos da Igreja Católica Romana e Igreja Católica Brasileira no Ceará.
    page: '166'
  - source: cant-novas-igrejas-2024
    quote: >-
      Em dezembro de 2004, dom Lucas instituiu formalmente a IELB como igreja autônoma de identidade anglo-católica,
      organizando também a Província Anglicana “Sagrado Coração”, com a sede jurídica da Igreja se estabelecendo
      na cidade de Belo Horizonte.
    page: '166'
