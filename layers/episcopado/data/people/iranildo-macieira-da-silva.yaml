biography: >-
  Lucas Macieira da Silva (nascido Iranildo Macieira da Silva) foi seminarista da Arquidiocese de Fortaleza e recebeu
  o diaconato em 23 de janeiro de 1999, na Igreja Católica Apostólica Brasileira, por Fernando Cabral de Barros;
  retirou-se dessa igreja em 2000 e passou a uma igreja vétero-católica. Em 2003 foi confirmado presbítero por Dirceu
  Milani, na Igreja Católica Apostólica Missionária de Evangelização. Sagrado bispo no Brasil em 2004, teve a sagração
  contestada e foi sagrado novamente em Portugal, em 24 de outubro de 2004 (outra fonte indica 26 de setembro),
  por Antônio José da Costa Raposo e Antonin Jelinek. Em dezembro de 2004 fundou a Igreja Episcopal Latina do Brasil,
  da qual foi arcebispo primaz e que deixou depois. Atua hoje como arcebispo e primaz da Diocese Anglicana Católica
  do Brasil, em Esmeraldas (MG). Ordenou oito diáconos e presbíteros e participou de 13 sagrações episcopais, entre
  elas as de Marcos de Santa Helena e Rui Costa Barbosa.
