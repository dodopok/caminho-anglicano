      mesmo período tem sua sagração contestada e é novamente sagrado em Portugal pelas mãos dos bispos Vétero Católicos
      Dom Antônio José da Costa Raposo (de Portugal) e Dom Antonin Jelinek, bispo primaz da República Checa.
