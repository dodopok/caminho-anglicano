  notes: >-
    Sagrantes não nomeados ('por bispos da Igreja Apostólica Episcopal Portuguesa'). O livro não distingue o sagrante
    principal entre os três bispos de tradição vétero-católica. O site chama Jelinek e Chadwick ("Arcebispo da França")
    de co-celebrantes da sagração. CONTESTADO: o mesmo livro (cap. Igreja Episcopal Latina do Brasil) diz "A sagração
    episcopal dom Lucas Macieira ocorreu em 26 de setembro de 2004 em Portugal, por bispos da Igreja Apostólica
    Episcopal Portuguesa". Houve também uma sagração anterior no Brasil (2004), contestada. A lista de sagrantes
    no trecho continua (truncada). Versão do capítulo "Igreja Episcopal Latina do Brasil" do mesmo livro. Primeira
    sagração, no Brasil, contestada; sagrantes não citados. Seguiu-se nova sagração em Portugal (24/10/2004).
