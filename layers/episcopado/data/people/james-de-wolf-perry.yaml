biography: >-
  James De Wolf Perry foi sagrado em 6 de janeiro de 1911 bispo de Rhode Island, tendo Daniel Tuttle como sagrante
  principal. Foi Bispo Presidente da Igreja Episcopal dos EUA, cargo que ocupava em 1930, e morreu em 20 de março
  de 1947.
