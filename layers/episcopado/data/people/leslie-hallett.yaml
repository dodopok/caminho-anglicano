id: leslie-hallett
name: Leslie Hallett
biography: >-
  Leslie Hallett, missionário americano trazido pelo bispo Melcher, iniciou em 1956 o trabalho entre os brasileiros
  em Belém do Pará, com cultos em casa alugada e uma escola primária.
sources:
