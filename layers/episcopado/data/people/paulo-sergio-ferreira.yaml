id: paulo-sergio-ferreira
name: Paulo Sérgio Ferreira
full_name: Paulo Sérgio Ferreira
aliases:
- Dom Paulo Sérgio
- Don Paul Sergio Ferreir
biography: >-
  Paulo Sérgio Ferreira foi ordenado diácono em 9 de junho de 2012, presbítero em 28 de janeiro de 2018 e bispo
  em 15 de dezembro de 2018, segundo o site da província da Igreja Anglicana Mundial (WAC) no Brasil; o convite
  à ordenação episcopal partiu da Igreja Católica Apostólica de Confissão Anglicana (Arquidiocese Santo Inácio de
  Antioquia, Província da Colômbia). Em 19 de março de 2019 foi criada em Serra (ES) a Missão São José, primeira
  paróquia da WAC no Brasil, da qual é pároco. A WAC do Brasil foi registrada em 27 de novembro de 2020, com ele
  como presidente, e ele é arcebispo primaz da Província Eclesiástica do Brasil.
sources:
- source: lwac-wacbr-clerigos
  quote: Ordenação Diaconal 09/06/2012 Ordenação Presbiteral 28/01/2018 Sagração Episcopal 15/12/2018
- source: icc-documentos-jonas
  quote: >-
    A Igreja Católica Apostólica de Confissão Anglicana, a Arquidiocese Santo Inácio de Antioquia - Província da
    Colômbia, com imensa alegria, convidam V. Sa. e Família para a Solene Celebração Eucarística da Ordenação Episcopal
    de Dom Paulo Sérgio Ferreira Dia 15 de dezembro de 2018 Horário ás 09:00 Local: Capela São Francisco de Assis
    Rua Francisco Eugênio, 180 Sobrado São Cristóvão - Rio de Janeiro, RJ
- source: lwac-wacbr-sjose
