id: daniel-araujo
name: Daniel Araújo
full_name: Daniel Marchese Araújo
aliases:
- Daniel Marchese Araújo
- Dom Daniel Marchese Araújo
biography: >-
  Daniel Marchese Araújo foi ordenado diácono em 29 de outubro de 2017 e presbítero em 15 de abril de 2018 na DAC,
  e sagrado bispo em 26 de junho de 2022, na Paróquia Anglicana Nossa Senhora Aparecida, em Viamão (RS), por Lucas
  Macieira da Silva. É bispo prelado da Prelazia Anglicana dos Pampas, e a DAC o conta entre seus bispos.
