    da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão). Consta como clérigo da Diocese
    Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de Esclarecimento); início e fim
    do vínculo não informados.
