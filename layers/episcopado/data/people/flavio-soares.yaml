# yaml-language-server: $schema=../../schemas/person.json
id: flavio-soares
name: Flávio Soares
full_name: Flávio Adair Torres Soares
aliases:
- Bispo Flávio A. T. Soares
- Bispo Flávio Adair
- Dom Flávio Adair
- Flavio Adair
- Flávio A. T. Soares
- Flávio Adair
- Flávio Adair Torres Soares
biography: >-
  Natural de Passo Fundo (RS), radicado em João Pessoa; diácono 2005, presbítero 2006, bispo 2012; bispo missionário/auxiliar
  na Diocese do Recife e na IAB.
sources:
- source: iab-regiao-missionaria
  quote: Flávio é um gaúcho, natural de  Passo Fundo
ordinations:
- order: diaconate
  date: '2005-05-18'
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: Foi ordenado ao Diaconato em 18/05/2005 quando já era Ministro encarregado de uma Igreja (Missão)
  notes: >-
    Ordenante não informado pela fonte (em 2005 o bispo diocesano era Robinson Cavalcanti). Data coincide com o
    período de ruptura com a IEAB. Jurisdição inferida pela data (já após a ruptura de jan/2005); a fonte não a
    nomeia nem o ordenante.
- order: presbyterate
  date: '2006-04-08'
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: Presbítero em 08/04/2006
  notes: >-
    Ordenante não informado pela fonte. Ordenante não informado (provavelmente Robinson Cavalcanti, não confirmado).
- order: episcopate
  date: '2012-03-17'
  jurisdiction: diocese-anglicana-recife
  office: auxiliary
  status: probable
  sources:
  - source: iab-regiao-missionaria
    quote: Eleito ao Episcopado em 04/06/2011 , Ordenado e Sagrado em 17/03/2012.
  - source: iab-poster-linhagem-uchoa
    quote: >-
      que, em 2012 foi sagrado bispo auxiliar por bispos do Cone-Sul, após a morte de Dom Robinson Cavalcanti, sem
      sucessores diretos. Embora não existam registros públicos detalhando os consagrantes
  notes: >-
    Eleito em 04/06/2011, ainda no episcopado de Robinson Cavalcanti; sagrado 3 semanas após a morte dele. Sagrantes
    não informados pela fonte. O pôster da IAB diz 'sagrado bispo auxiliar por bispos do Cone-Sul, após a morte
    de Dom Robinson'. Sagrantes não informados. Pôster da IAB diz apenas "em 2012 foi sagrado bispo auxiliar por
    bispos do Cone-Sul".
affiliations:
- jurisdiction: iab
  role: bishop
  diocese: iab-regiao-missionaria
  start: '2018'
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: atua também como Bispo na região Missionaria da Província
  - source: iab-church-planting-bishops
    quote: Bishop Flavio Soares – Missionary Bishop of the Diocese of Recife
  - source: iab-comunicado-oficial-2018
    quote: Flavio Adair Bispo Auxiliar de Recife
  - source: iab-regiao-missionaria
    quote: >-
      Mora em João Pessoa onde lidera uma igreja local, mas atua também como Bispo na região Missionaria da Província.
  notes: >-
    Bispo missionário; mora em João Pessoa. Em 2019 listado como "Bispo Auxliar" no clero da Diocese de Recife.
events:
- type: other
  date: '2011-06-04'
  description: Flávio Adair Torres Soares eleito ao episcopado
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: Eleito ao Episcopado em 04/06/2011
- type: other
  date: '2011-06-04'
  description: Flávio Adair Torres Soares é eleito ao episcopado (Diocese Anglicana do Recife).
  status: probable
  sources:
  - source: iab-regiao-missionaria
    quote: Eleito ao Episcopado em 04/06/2011
