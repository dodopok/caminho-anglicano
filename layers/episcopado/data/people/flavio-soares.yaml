# yaml-language-server: $schema=../../schemas/person.json
id: flavio-soares
name: Flávio Soares
full_name: Flávio Adair Torres Soares
aliases:
- Bispo Flávio A. T. Soares
- Bispo Flávio Adair
- Dom Flávio Adair
- Flavio Adair
- Flávio A. T. Soares
- Flávio Adair
- Flávio Adair Torres Soares
biography: >-
  Natural de Passo Fundo (RS), radicado em João Pessoa; diácono 2005, presbítero 2006, bispo 2012; bispo missionário/auxiliar
  na Diocese do Recife e na IAB.
sources:
- source: iab-regiao-missionaria
  quote: Flávio é um gaúcho, natural de  Passo Fundo
ordinations:
- order: diaconate
  date: '2005-05-18'
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: Foi ordenado ao Diaconato em 18/05/2005 quando já era Ministro encarregado de uma Igreja (Missão)
  notes: >-
    Ordenante não informado pela fonte (em 2005 o bispo diocesano era Robinson Cavalcanti). Data coincide com o
    período de ruptura com a IEAB. Jurisdição inferida pela data (já após a ruptura de jan/2005); a fonte não a
    nomeia nem o ordenante.
- order: presbyterate
  date: '2006-04-08'
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: Presbítero em 08/04/2006
  notes: >-
    Ordenante não informado pela fonte. Ordenante não informado (provavelmente Robinson Cavalcanti, não confirmado).
- order: episcopate
  date: '2012-03-17'
  jurisdiction: diocese-anglicana-recife
  office: auxiliary
  status: contested
  sources:
  - source: iab-regiao-missionaria
    quote: Eleito ao Episcopado em 04/06/2011 , Ordenado e Sagrado em 17/03/2012.
  - source: iab-poster-linhagem-uchoa
    quote: >-
      que, em 2012 foi sagrado bispo auxiliar por bispos do Cone-Sul, após a morte de Dom Robinson Cavalcanti, sem
      sucessores diretos. Embora não existam registros públicos detalhando os consagrantes
  discrepancies:
  - field: jurisdiction
    value: iacs
    sources:
    - source: iab-poster-linhagem-uchoa
      quote: >-
        que, em 2012 foi sagrado bispo auxiliar por bispos do Cone-Sul, após a morte de Dom Robinson Cavalcanti,
        sem sucessores diretos. Embora não existam registros públicos detalhando os consagrantes
  notes: >-
    Eleito em 04/06/2011, ainda no episcopado de Robinson Cavalcanti (a Living Church diz que em junho [de 2011]
    Cavalcanti pediu a eleição de um coadjutor, planejando aposentar-se em 2014); sagrado 3 semanas após a morte
    dele, no MESMO DIA da sagração de Evilásio Tenório (17/03/2012, segundo Wikipédia PT: Peter Beckwith com Alexander
    Barroso e Martin Morrison) — provavelmente cerimônia conjunta, mas nenhuma fonte nomeia os sagrantes de Flávio.
    O pôster da IAB diz 'sagrado bispo auxiliar por bispos do Cone-Sul, após a morte de Dom Robinson'. Sagrantes
    não informados. Pôster da IAB diz apenas "em 2012 foi sagrado bispo auxiliar por bispos do Cone-Sul".
