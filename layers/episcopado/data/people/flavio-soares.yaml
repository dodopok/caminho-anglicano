  notes: >-
    Ordenado por Robinson Cavalcanti na Con-Catedral da Ressurreição (João Pessoa), uma de cinco ordenações diaconais
    na mesma cerimônia. O sermão do bispo e o artigo de Márcio Meira (2011) dão 18 de junho de 2005; a página da
    Região Missionária da IAB dá 18/05/2005, provável troca de mês. Um ano depois foi ordenado presbítero.
