biography: >-
  Natural de Passo Fundo (RS), radicado em João Pessoa. Atuou como ministro leigo na Missão Anglicana Cristo Libertador
  (2004) e foi ordenado diácono em 18/06/2005 e presbítero em 08/04/2006, ambos por Robinson Cavalcanti, na Con-Catedral
  Anglicana da Ressurreição (João Pessoa), na Diocese Anglicana do Recife. Foi pároco da Paróquia Anglicana Cristo
  Libertador, ministro encarregado na região PB/RN, capelão e professor do Seminário Anglicano de Teologia (SAT-PB)
  e membro da Comissão de Ministério. Eleito bispo sufragâneo em 04/06/2011, com Evilásio Tenório, foi sagrado em
  17/03/2012 na Paróquia Anglicana Espírito Santo (Jaboatão dos Guararapes-PE), por Peter Beckwith, com Alexander
  Barroso e Martin Morrison como co-sagrantes. Foi bispo sufragâneo da 1ª Região Eclesiástica (Olinda-PE, Paraíba
  e Rio Grande do Norte) até 2018; desde então atua como bispo missionário na Região Missionária da IAB e como bispo
  auxiliar da Diocese do Recife (Recife Norte). Em 03/2025 foi empossado Secretário Regional do GAFCON para a América
  Latina. Participou de quatro sagrações episcopais, entre elas as de Miguel Uchôa, Márcio Meira e Eric Rodrigues,
  como co-sagrante.
