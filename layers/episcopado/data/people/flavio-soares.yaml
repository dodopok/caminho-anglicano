  notes: >-
    Sagração conjunta com Evilásio Tenório. Sagrante e co-sagrantes segundo o site da Diocese do Recife (mar/2012).
    Bispos visitantes (não co-sagrantes): Antônio José da Costa Raposo (Igreja Apostólica Episcopal, Portugal),
    Antônio Pessoa Leite (Igreja Anglicana Missionária do Redentor), Francisco Buzzo Rodrigues e Josep Rosselo (Igreja
    Anglicana Reformada). A fonte grafa 'Morrinson' no texto e 'Morrison' no quadro. Sobre o título: 'Bispo Sufragâneo,
    1ª Região Eclesiástica'. Eleito em 04/06/2011, ainda no episcopado de Robinson Cavalcanti (a Living Church diz
    que em junho [de 2011] Cavalcanti pediu a eleição de um coadjutor, planejando aposentar-se em 2014); sagrado
    3 semanas após a morte dele, no MESMO DIA da sagração de Evilásio Tenório (17/03/2012, segundo Wikipédia PT:
    Peter Beckwith com Alexander Barroso e Martin Morrison) — provavelmente cerimônia conjunta, mas nenhuma fonte
    nomeia os sagrantes de Flávio. O pôster da IAB diz 'sagrado bispo auxiliar por bispos do Cone-Sul, após a morte
    de Dom Robinson'. Sagração dos dois bispos sufragâneos da Diocese do Recife na PAES. Bispos visitantes presentes,
    segundo a lista do site: Antônio José da Costa Raposo (Igreja Apostólica Episcopal, Portugal), Antônio Pessoa
    Leite (Igreja Anglicana Missionária do Redentor, Recife), Francisco Buzzo Rodrigues e Josep Rosselo (Igreja
    Anglicana Reformada, São Paulo). Alexander Barroso é identificado como da Igreja Anglicana Carismática (Venezuela)
    e Martin Morrison como da Igreja da Inglaterra na África do Sul. Flávio Adair Torres Soares foi bispo-eleito
    da Região Eclesiástica Missionária I (Paraíba) antes da sagração.
