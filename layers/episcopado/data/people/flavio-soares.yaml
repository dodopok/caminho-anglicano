biography: >-
  Natural de Passo Fundo (RS), radicado em João Pessoa; diácono 2005, presbítero 2006, bispo 2012; bispo missionário/auxiliar
  na Diocese do Recife e na IAB.
sources:
- source: iab-regiao-missionaria
  quote: Flávio é um gaúcho, natural de  Passo Fundo
ordinations:
- order: diaconate
  date: '2005-05-18'
  jurisdiction: diocese-anglicana-recife
  status: contested
  sources:
  - source: iab-regiao-missionaria
    quote: Foi ordenado ao Diaconato em 18/05/2005 quando já era Ministro encarregado de uma Igreja (Missão)
  - source: dar-2011-meira-sobre-flavio
    quote: >-
      Por isso, no dia 18 de junho, fui testemunha da sua Ordenação Diaconal, quando o vi, diante do Bispo, afirmar
      sua convicção e disponibilidade em servir ao Senhor da Igreja e Igreja do Senhor.
  - source: dar-2011-meira-sobre-flavio
    quote: ali ele estava como um dos formandos no ano de 2005. Neste mesmo ano, presidido pelo Rev. Souza
  discrepancies:
  - field: date
    value: '2005-06-18'
    sources:
    - source: dar-2011-meira-sobre-flavio
      quote: >-
        Por isso, no dia 18 de junho, fui testemunha da sua Ordenação Diaconal, quando o vi, diante do Bispo, afirmar
        sua convicção e disponibilidade em servir ao Senhor da Igreja e Igreja do Senhor.
    - source: dar-2011-meira-sobre-flavio
      quote: ali ele estava como um dos formandos no ano de 2005. Neste mesmo ano, presidido pelo Rev. Souza
  notes: >-
    Jurisdição inferida pela data (já após a ruptura de jan/2005); a fonte não a nomeia nem o ordenante. Ordenante
    não informado pela fonte (em 2005 o bispo diocesano era Robinson Cavalcanti). Data coincide com o período de
    ruptura com a IEAB. CONTESTADO: artigo de Márcio Meira (2011) dá 18 de junho de 2005 ('no dia 18 de junho, fui
    testemunha da sua Ordenação Diaconal'). Versão do artigo de Márcio Meira (2011): '18 de junho' do mesmo ano
    da formatura (2005). O site da IAB dá 18/05/2005. Outro clérigo (Raimundo Figueiredo) é dado como 'ordenado
    em 18/06/2005', o que sugere uma cerimônia de ordenação nessa data. O artigo acrescenta: 'Um ano depois, nós,
    os Presbíteros, impomos nossas mãos sobre ele consagrando-o para o ministério presbiteral.' Bispo não nomeado
    (diocesano: Robinson Cavalcanti).
- order: presbyterate
  date: '2006-04-08'
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: Presbítero em 08/04/2006
  notes: >-
    Ordenante não informado pela fonte. Ordenante não informado (provavelmente Robinson Cavalcanti, não confirmado).
- order: episcopate
  date: '2012-03-17'
  place: Paróquia Anglicana Espírito Santo (PAES), Piedade, Jaboatão dos Guararapes-PE
  jurisdiction: iacs
  office: suffragan
  principal_consecrator: peter-beckwith
  co_consecrators:
  - alexander-barroso
  - martin-morrison
  status: confirmed
  sources:
  - source: iab-regiao-missionaria
    quote: Eleito ao Episcopado em 04/06/2011 , Ordenado e Sagrado em 17/03/2012.
  - source: dar-sagracao-2012
    quote: >-
      O Bispo Sagrante foi o Revmo. Dom Peter Beckwith (TEC – Estados Unidos) que presidiu a Cerimônia e proferiu
      o Sermão; os Bispos Co-Sagrantes foram: Revmo. Dom Alexander Barroso (Igreja Anglicana Carismática – Venezuela)
      e Dom Martin Morrinson (Igreja da Inglaterra na África do Sul)
  - source: dar-sagracao-2012
    quote: >-
      a Sagração dos Bispos Sufragâneos da Diocese do Recife no último sábado (17/03/2012), na Paróquia Anglicana
      Espírito Santo (PAES), no bairro de Piedade, em Jaboatão dos Guararapes (PE)
  - source: dar-sagracao-2012-quadro
    quote: >-
      Bispo Sagrante e Pregador: Revmo. Bispo Peter Beckwith Igreja Episcopal (Estados Unidos) Bispos Co-Sagrantes:
      Revmo. Bispo Alexander Barroso Igreja Anglicana Carismática (Venezuela) Revmo. Bispo Martin Morrison Igreja
      da Inglaterra na África do Sul
  - source: iab-poster-linhagem-uchoa
    quote: >-
      que, em 2012 foi sagrado bispo auxiliar por bispos do Cone-Sul, após a morte de Dom Robinson Cavalcanti, sem
      sucessores diretos. Embora não existam registros públicos detalhando os consagrantes
  notes: >-
    Sagração conjunta com Evilásio Tenório. Sagrante e co-sagrantes segundo o site da Diocese do Recife (mar/2012).
    Bispos visitantes (não co-sagrantes): Antônio José da Costa Raposo (Igreja Apostólica Episcopal, Portugal),
    Antônio Pessoa Leite (Igreja Anglicana Missionária do Redentor), Francisco Buzzo Rodrigues e Josep Rosselo (Igreja
    Anglicana Reformada). A fonte grafa 'Morrinson' no texto e 'Morrison' no quadro. Sobre o título: 'Bispo Sufragâneo,
    1ª Região Eclesiástica'. Eleito em 04/06/2011, ainda no episcopado de Robinson Cavalcanti (a Living Church diz
    que em junho [de 2011] Cavalcanti pediu a eleição de um coadjutor, planejando aposentar-se em 2014); sagrado
    3 semanas após a morte dele, no MESMO DIA da sagração de Evilásio Tenório (17/03/2012, segundo Wikipédia PT:
    Peter Beckwith com Alexander Barroso e Martin Morrison) — provavelmente cerimônia conjunta, mas nenhuma fonte
    nomeia os sagrantes de Flávio. O pôster da IAB diz 'sagrado bispo auxiliar por bispos do Cone-Sul, após a morte
    de Dom Robinson'.
