biography: >-
  Natural de Passo Fundo (RS), radicado em João Pessoa; diácono 2005, presbítero 2006, bispo 2012; bispo missionário/auxiliar
  na Diocese do Recife e na IAB.
sources:
- source: iab-regiao-missionaria
  quote: Flávio é um gaúcho, natural de  Passo Fundo
ordinations:
