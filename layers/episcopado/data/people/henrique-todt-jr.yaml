biography: >-
  Henrique Todt Jr. foi ordenado diácono em março de 1931 e presbítero em junho de 1937, por William Matthews Merrick
  Thomas, no Distrito Missionário do Sul do Brasil, e foi transferido para a Igreja Episcopal do Brasil em 25 de
  abril de 1965. Foi deão da Catedral da Santíssima Trindade e esteve entre os indicados ao episcopado no concílio
  de 1949, com treze votos.
