biography: >-
  Sagrado em 25/01/1866, em Pittsburgh, como primeiro bispo da diocese de Pittsburgh, com John Henry Hopkins entre
  os sagrantes, morreu em 10/07/1881. Participou de cinco sagrações episcopais, entre elas as de George David Cummins
  e Daniel Tuttle.
