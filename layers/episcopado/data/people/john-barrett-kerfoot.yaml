- source: lin-fce-lista
  quote: >-
    4. GEORGE DAVID CUMMINS DD born 11 December, 1822. Consecrated by Bishops Hopkins, Smith, H. W. Lee, Talbot,
    Quintard, Clarkson and Kerfoot, of the Protestant Episcopal Church, Louisville, Kentucky, 15 November, 1866.
    Elected Presiding Bishop of the Reformed Episcopal Church, 2 December 1873. Died 1876.
- source: perry-1895
  quote: >-
    It was not until May I, 1867, that he was set apart for his work. The service took place in Trinity Chapel,
    New York. The consecrators were Bishops Hopkins, Horatio Potter, Odenheimer, Randall, Kerfoot, and Neely.
