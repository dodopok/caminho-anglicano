wikidata: Q16206490
biography: >-
  Sagrado em 09/12/1537, em St. Paul's, por John Stokesley (Londres), John Hilsey (Rochester) e Robert Parfew (St.
  Asaph), foi bispo sufragâneo de Bedford até sua morte, em 1560. Participou de quatro sagrações episcopais, entre
  elas a de John Scory (1551) e a de Matthew Parker, em 17/12/1559, na capela de Lambeth, sagração cuja autenticidade
  e validade foram objeto de controvérsia entre católicos e anglicanos.
