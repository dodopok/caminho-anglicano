biography: >-
  Sagrado em 30/05/1878, em Wheeling (Virgínia Ocidental), por Gregory Bedell, com Kerfoot e Whittle entre os sagrantes,
  foi bispo da Diocese de West Virginia e bispo provisório das missões da Igreja Episcopal no Brasil até 1899. Em
  1893, enviado pelo Bispo Presidente, visitou as missões, confirmou cerca de 150 pessoas e ordenou os quatro primeiros
  diáconos brasileiros; depôs um deles, e em 1897 Waite Stirling ordenou os três primeiros presbíteros nacionais.
  Participou de quatro ordenações de diáconos ou presbíteros e de duas sagrações episcopais, como co-sagrante, uma
  delas a de Lucien Lee Kinsolving.
