    by the Archbishop of Canterbury in Uganda.
- source: wp-olang
  quote: >-
    Olang' and Obadiah Kariuki were consecrated the first two African assistant bishops in Kenya by the Archbishop
    of Canterbury, [[Geoffrey Fisher]], at Namirembe Cathedral, in [[Kampala]], [[Uganda]], on 15 March 1955.
