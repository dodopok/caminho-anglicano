wikidata: Q18389909
biography: >-
  Festo Habakkuk Olang' (c. 1914–2004) foi sagrado em 15/3/1955, na Catedral de Namirembe, em Kampala, por Geoffrey
  Fisher, arcebispo de Cantuária, como um dos dois primeiros bispos assistentes africanos do Quênia, com Obadiah
  Kariuki. Foi arcebispo do Quênia de 1970 até 1979/1980, quando Manasses Kuria foi instalado, em 29/6/1980.
