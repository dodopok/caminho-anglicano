  Bispo da Diocese de Sergipe (Aracaju) da IATB desde 2015 pelo menos; vice-presidente eleito da IATB em 2017.
sources:
- source: lia-iatb-home-2016-11
  quote: Dom Washington Luis Nascimento Santos
affiliations:
- jurisdiction: iatb
  role: other
  role_description: bispo diocesano
  diocese: iatb-diocese-de-sergipe
  start: '2015'
  status: confirmed
  sources:
  - source: lia-iatb-salvador-2015
    quote: >-
      Dom Washington Luis, Dom José Aparecido e Dom Ricardo Vicente dos Anjos, respectivamente bispos das Dioceses
      do Sudeste, do Centro-Oeste, do Sergipe, do Sul e do Pará
  - source: lia-iatb-clerigos-2019
    quote: Dom Washington Luis Diocese de Sergipe
  notes: >-
    Em 2016 aparece como 'Dom Washington Luis Nascimento Santos'; eleito vice-presidente da IATB em 2017; ainda
