- order: episcopate
  date: '2017-06-10'
  jurisdiction: diocese-anglicana-recife
  office: missionary
  principal_consecrator: miguel-uchoa
  status: confirmed
  sources:
  - source: dv-bispo
    quote: foi sagrado ao episcopado no dia 10 de junho de 2017
  - source: iab-dois-novos-bispos
    quote: 'elegeu dois novos Bispos auxiliares: Rev. Márcio Simões e Rev. Márcio Meira'
  - source: gafcon-2017-two-bishops
    quote: >-
      The Anglican Church in Brazil and the Diocese of Recife have announced that Revd. Márcio Simões and Revd.
      Márcio Medeiros Meira are to be ordained and consecrated as missionary bishops.
  - source: gafcon-2017-two-bishops
    quote: >-
      The ceremony will be conducted by The Right Revd. Miguel Uchôa Cavalcanti, Bishop of Recife, with proceedings
      due to begin at 10am, Saturday June 10th 2017.
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2017, foram sagrados dois bispos para liderar novas dioceses: Márcio Simões, para a Diocese de Vitória
      de Santo Antão e Márcio Meira, para a Diocese de João Pessoa.
    page: '31'
  - source: cant-novas-igrejas-2024
    quote: O bispo Márcio Simões foi sagrado em 10 de junho de 2017.
    page: '33'
  - source: dv-bispo
    quote: O Bispo Márcio José de Sousa Simões foi sagrado ao episcopado no dia 10 de junho de 2017
  - source: iab-dois-novos-bispos
    quote: Em Junho acontecerá a  Sagração Episcopal
  - source: costa2021
    quote: >-
      Em 2017, foram sagrados dois bispos para liderar novas dioceses: Márcio Simões, para a Diocese de Vitória
      de Santo Antão e Márcio Meira, para a Diocese de João Pessoa.
    page: '253'
  notes: >-
    Eleito bispo auxiliar em 06/05/2017; sagração conjunta com Márcio Meira. Sagrante principal segundo o anúncio
    prévio do GAFCON ('conducted by ... Miguel Uchôa Cavalcanti'); co-sagrantes não confirmados. Diocesano de Vitória
    a partir da criação da província (2018). Diocese de Vitória de Santo Antão. Sagrantes não nomeados. Eleito bispo
    auxiliar em 06/05/2017 (o GAFCON chama-os de 'missionary bishops'); tornou-se bispo da Diocese de Vitória com
    a formação da província. Sagrante principal = quem 'conduz' a cerimônia segundo o anúncio prévio do GAFCON;
    co-sagrantes não informados por fonte independente. Data confirmada (anúncio GAFCON + site da Diocese de Vitória).
    Diocese de Vitória de Santo Antão (Igreja Anglicana – Diocese do Recife, que em 2018 virou a IAB). Data exata,
    local e sagrantes não informados.
