      de Santo Antão e Márcio Meira, para a Diocese de João Pessoa.
    page: '253'
  notes: >-
    Eleito bispo auxiliar em 06/05/2017; sagração conjunta com Márcio Meira. Sagrante principal segundo o anúncio
    prévio do GAFCON ('conducted by ... Miguel Uchôa Cavalcanti'); co-sagrantes não confirmados. Diocesano de Vitória
    a partir da criação da província (2018). Diocese de Vitória de Santo Antão. Sagrantes não nomeados. Eleito bispo
    auxiliar em 06/05/2017 (o GAFCON chama-os de 'missionary bishops'); tornou-se bispo da Diocese de Vitória com
    a formação da província. Sagrante principal = quem 'conduz' a cerimônia segundo o anúncio prévio do GAFCON;
    co-sagrantes não informados por fonte independente. Data confirmada (anúncio GAFCON + site da Diocese de Vitória).
    Diocese de Vitória de Santo Antão (Igreja Anglicana – Diocese do Recife, que em 2018 virou a IAB). Data exata,
    local e sagrantes não informados.
