id: marcio-simoes
name: Márcio Simões
full_name: Márcio José de Sousa Simões
aliases:
- Márcio José de Sousa Simões
biography: Bispo diocesano da Diocese de Vitória (PE) da IAB; diácono e presbítero em 2008, bispo em 2017.
sources:
- source: dv-bispo
  quote: O Bispo Márcio José de Sousa Simões foi sagrado ao episcopado no dia 10 de junho de 2017
ordinations:
- order: diaconate
  date: '2008'
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: dv-bispo
    quote: ordenado diácono e presbítero em 2008
  notes: 'Ordenante não informado (bispo diocesano em 2008: Robinson Cavalcanti).'
- order: presbyterate
  date: '2008'
  jurisdiction: diocese-anglicana-recife
  status: confirmed
  sources:
  - source: dv-bispo
    quote: ordenado diácono e presbítero em 2008
- order: episcopate
  date: '2017-06-10'
  jurisdiction: diocese-anglicana-recife
  office: missionary
  principal_consecrator: miguel-uchoa
  status: confirmed
  sources:
  - source: dv-bispo
    quote: foi sagrado ao episcopado no dia 10 de junho de 2017
  - source: iab-dois-novos-bispos
    quote: 'elegeu dois novos Bispos auxiliares: Rev. Márcio Simões e Rev. Márcio Meira'
  - source: gafcon-2017-two-bishops
    quote: >-
      The Anglican Church in Brazil and the Diocese of Recife have announced that Revd. Márcio Simões and Revd.
      Márcio Medeiros Meira are to be ordained and consecrated as missionary bishops.
  - source: gafcon-2017-two-bishops
    quote: >-
      The ceremony will be conducted by The Right Revd. Miguel Uchôa Cavalcanti, Bishop of Recife, with proceedings
      due to begin at 10am, Saturday June 10th 2017.
  - source: dv-bispo
    quote: O Bispo Márcio José de Sousa Simões foi sagrado ao episcopado no dia 10 de junho de 2017
  - source: iab-dois-novos-bispos
    quote: Em Junho acontecerá a  Sagração Episcopal
  notes: >-
    Eleito bispo auxiliar em 06/05/2017; sagração conjunta com Márcio Meira. Sagrante principal segundo o anúncio
    prévio do GAFCON ('conducted by ... Miguel Uchôa Cavalcanti'); co-sagrantes não confirmados. Diocesano de Vitória
    a partir da criação da província (2018). Eleito bispo auxiliar em 06/05/2017 (o GAFCON chama-os de 'missionary
    bishops'); tornou-se bispo da Diocese de Vitória com a formação da província. Sagrante principal = quem 'conduz'
    a cerimônia segundo o anúncio prévio do GAFCON; co-sagrantes não informados por fonte independente. Data confirmada
    (anúncio GAFCON + site da Diocese de Vitória).
