id: marcio-simoes
name: Márcio Simões
full_name: Márcio José de Sousa Simões
aliases:
- Márcio José de Sousa Simões
biography: >-
  Márcio Simões serviu como ministro local desde 2002, foi postulante na Diocese Anglicana do Recife (DAR) e foi
  ordenado diácono em 05/07/2008 por Robinson Cavalcanti e presbítero no mesmo ano. Foi pároco da Paróquia Anglicana
  da Ressurreição, em Vitória de Santo Antão, arcediago do Centro e presidente do Conselho Diocesano; após a morte
  de Robinson Cavalcanti, em 26/02/2012, ficou encarregado do processo eleitoral. Eleito bispo auxiliar em 06/05/2017,
  foi sagrado em 10/06/2017 por Miguel Uchôa e é, desde 2018, bispo diocesano da Diocese de Vitória de Santo Antão,
  da IAB. Participou de sete ordenações de diáconos ou presbíteros e de duas sagrações episcopais, as de Eric Rodrigues
  e Miguel Neto.
