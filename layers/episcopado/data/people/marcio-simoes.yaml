    o anúncio prévio do GAFCON ('conducted by ... Miguel Uchôa Cavalcanti'); co-sagrantes não confirmados. Diocesano
    de Vitória a partir da criação da província (2018). Diocese de Vitória de Santo Antão. Sagrantes não nomeados.
