# yaml-language-server: $schema=../../schemas/person.json
id: pedro-muniz
name: Pedro Muniz
full_name: Pedro Muniz Ferreira de Almeida
aliases:
- Pedro Muniz Ferreira de Almeida
biography: >-
  Diácono (antes de 2018) na Comunidade Anglicana Âncora (Vitória-ES); em 2025 à frente da Igreja Anglicana Trindade
  (Vitória-ES), que ficou na IAB.
sources:
- source: ancorabh-lideranca-2018
  quote: >-
    Rev. Pedro Muniz e Lorraine Muniz Ele é diácono ordenado pela Igreja Anglicana no Brasil, pastor coadjutor da
    C. A. A. em Vitória - ES
ordinations:
- order: diaconate
  date: '2017-12-01'
  place: Paróquia Anglicana Jardim das Oliveiras, Setúbal, Recife (PE)
  jurisdiction: diocese-anglicana-recife
  ordained_by: miguel-uchoa
  status: confirmed
  sources:
  - source: ig-pedromuniz-2017-11-29-convite-diaconato
    quote: Ordenação Diaconal de Pedro Muniz Ferreira de Almeida
  - source: ig-pedromuniz-2017-11-29-convite-diaconato
    quote: 'Sexta-feira, 1 de Dezembro de 2017 - Horário 19:30h - Local: Paróquia Anglicana Jardim das Oliveiras'
  - source: ig-pedromuniz-2017-11-29-convite-diaconato
    quote: Na sexta me tornarei Reverendo Anglicano.
  - source: testemunho-mantenedor-2026-10-08-ordenantes-pedro-lorrayne
    quote: >-
      Quem ordenou pedro ao diaconato foi Miguel Uchoa e Flavio Adair como cosagrante, quem ordenou lorrayne foi
      marcio meira
  notes: >-
    Convite emitido pela 'Igreja Anglicana no Brasil - Diocese do Recife' em nome do bispo diocesano Miguel Uchoa
    Cavalcanti e do bispo auxiliar Flávio Adair Torres Soares; o convite não nomeia o bispo ordenante. Ordenante:
    Miguel Uchôa, com o bispo auxiliar Flávio Adair Torres Soares participando da imposição de mãos, segundo o mantenedor.
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  status: confirmed
  sources:
  - source: ancorabh-lideranca-2018
    quote: >-
      Rev. Pedro Muniz e Lorraine Muniz Ele é diácono ordenado pela Igreja Anglicana no Brasil, pastor coadjutor
      da C. A. A. em Vitória - ES
  notes: >-
    Local: Comunidade Anglicana Âncora, Vitória-ES. Diácono antes de jan/2018. Em jul/2025 está à frente da Igreja
    Anglicana Trindade (Vitória-ES), que permaneceu na IAB (Diocese de João Pessoa), com a 'Revda. Lorrayne' — não
    seguiu Eric Rodrigues para a REB.
- jurisdiction: iab
  role: clergy
  diocese: iab-diocese-joao-pessoa
  status: confirmed
  sources:
  - source: djp-igrejas-2025
    quote: Igreja Anglicana Trindade – ES Rev. Pedro Muniz Revda. Lorrayne
  - source: iabord-yt-quyaaryozea
    quote: PASTOR DA IGREJA ANGLICANA TRINDADE.
  - source: iabord-yt-j4few-ujbjw
    quote: '#AREÓPAGO #7 - REV. PEDRO MUNIZ (IGREJA ÂNCORA)'
  - source: iabord-yt-mqjewcnrldq
    quote: A Verdadeira Liberdade - Reverendo Pedro Muniz (Igreja Anglicana Trindade)
  - source: iabord-djp-pastores-2025
    quote: Rev. Pedro Muniz Igreja Anglicana Trindade Vitória – ES
  - source: iabord-ancora-sinodo-2015
    quote: o nosso pastor Pedro Muniz foi instituído Ministro Local
  notes: >-
    Local: Igreja Anglicana Trindade, Vitória-ES. Local: a partir de 2025. Títulos de vídeo tratam-no por 'Rev.'
    desde 29/05/2021 (Teologueiros) e como pastor da Igreja Anglicana Trindade em 21/08/2021 (Somos PAES, ARCA).
    Atenção: 'Rev.' também é usado para diáconos na IAB; estes títulos NÃO provam o presbiterato nem sua data (ver
