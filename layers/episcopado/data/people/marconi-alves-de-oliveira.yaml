    quote: para retomar o seu papel de Supervisor da OFA
  notes: >-
    Supervisor da OFA, ordem em formação autorizada a funcionar em caráter experimental pelo bispo diocesano.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: ministro itinerante
  status: confirmed
  sources:
  - source: darn2-consolacao-2012
    quote: Marcone Alves (Ministro Itinerante)
  notes: Cargo atestado em 06/02/2012.
