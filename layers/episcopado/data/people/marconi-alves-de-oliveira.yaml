# yaml-language-server: $schema=../../schemas/person.json
id: marconi-alves-de-oliveira
name: Marconi Alves de Oliveira
aliases:
- Marcone Alves de Oliveira
biography: Pessoa citada em documentos históricos da Diocese do Recife e da IEAB (ver afirmações).
sources:
- source: drv-declaracao-32
  quote: Rev. Marconi Alves de Oliveira
ordinations:
- order: presbyterate
  date: '2004-12-04'
  place: Paróquia Anglicana Emanuel, Olinda-PE (culto de encerramento do XXIV Concílio Diocesano)
  jurisdiction: ieab-dar
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: drp2-concilio-xxiv-2004
    quote: >-
      foi celebrado um Culto Eucarístico com a Ordenação Presbiteral dos Reverendos: Décio da Silva, Fred Souto,
      Marconi Oliveira, Solange Cristina Pereira e Raniere Oliveira
  - source: drp2-ord-presb-xxiv-concilio-2004
    quote: Ordenação presbiteral XXIV C Diocesano- Olinda PE
  - source: drp2-ord-presb-xxiv-concilio-2004
    quote: hoje a igreja estará recebendo 5 novos presbíteros
  - source: drp2-ord-presb-xxiv-concilio-2004
    quote: Fred,Ranieri,Solange,Marconi, Décio
  - source: darl2-sermao-ord-274
    quote: Hoje a Igreja estará recebendo cinco novos Presbíteros.
  - source: darl2-sermao-ord-274
    quote: Décio, Fred, Marcone, Solange e Raniere,
  - source: darl2-sermao-ord-274
    quote: Culto de Encerramento do XXIV Concílio Diocesano Olinda(PE), 04 de Dezembro de 2004
  notes: >-
    Ordenação no culto eucarístico após os Concílios Ordinário (XXIV) e Extraordinário da diocese, em Olinda. O
    informe diocesano é datado de 02/12/2004 e fala do 'último fim de semana'; o cabeçalho do sermão do Rev. Miguel
    Uchôa traz 10/12/2004. Dia exato incerto. O sermão do culto de encerramento do XXIV Concílio Diocesano, pregado
    por Miguel Uchôa, saúda cinco novos presbíteros pelos primeiros nomes (Décio, Fred, Marcone, Solange e Raniere);
    a identificação com Marconi Alves de Oliveira segue o registro das ordenações presbiterais desse concílio (grafia
    "Marcone" no sermão). O sermão não nomeia o ordenante.
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Marconi Alves de Oliveira
  - source: drv-nota-esclarecimento-2006
    quote: Marcone Alves de Oliveira, ofa
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Marconi Alves de Oliveira … Os clérigos não atenderam à convocação
      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Marconi Alves de Oliveira … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: missionário sacramental itinerante
  status: confirmed
  sources:
