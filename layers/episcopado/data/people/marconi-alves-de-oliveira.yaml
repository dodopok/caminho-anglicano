id: marconi-alves-de-oliveira
name: Marconi Alves de Oliveira
aliases:
- Marcone Alves de Oliveira
biography: >-
  Marconi Alves de Oliveira foi ordenado presbítero em 04/12/2004 por Robinson Cavalcanti, no XXIV Concílio Diocesano,
  em Olinda, e atuava antes como diácono do Ponto Missionário Anglicano Nova Vida. Em 23/08/2005 foi excluído da
  comunhão da IEAB, tendo declarado manter comunhão com o bispo diocesano Robinson Cavalcanti. Na Diocese Anglicana
  do Recife (DAR), foi supervisor da Ordem dos Franciscanos Anglicanos, missionário sacramental itinerante para
  os pontos missionários do Arcediagado Paraíba/Rio Grande do Norte e apoio pastoral de um ponto missionário em
  Natal.
