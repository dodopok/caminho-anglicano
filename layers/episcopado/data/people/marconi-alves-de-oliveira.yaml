      O Rev. Marcone Alves foi designado pelo Bispo como Missionário Sacramental Itinerante para os Pontos Missionários
      do Arcediagado Paraíba/Rio Grande do Norte
  notes: >-
    Designado pelo bispo diocesano para os pontos missionários do Arcediagado PB/RN (comunicado de 03/11/2009);
    em fevereiro de 2012 aparece como "Ministro Itinerante".
- jurisdiction: ofa
  role: other
  role_description: supervisor da Ordem dos Franciscanos Anglicanos
  status: confirmed
  sources:
