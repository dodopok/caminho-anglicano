  - source: darl2-sermao-ord-274
    quote: Culto de Encerramento do XXIV Concílio Diocesano Olinda(PE), 04 de Dezembro de 2004
  notes: >-
    Ordenação no culto eucarístico após os Concílios Ordinário (XXIV) e Extraordinário da diocese, em Olinda. O
    informe diocesano é datado de 02/12/2004 e fala do 'último fim de semana'; o cabeçalho do sermão do Rev. Miguel
    Uchôa traz 10/12/2004. Dia exato incerto. O sermão do culto de encerramento do XXIV Concílio Diocesano, pregado
    por Miguel Uchôa, saúda cinco novos presbíteros pelos primeiros nomes (Décio, Fred, Marcone, Solange e Raniere);
    a identificação com Marconi Alves de Oliveira segue o registro das ordenações presbiterais desse concílio (grafia
    "Marcone" no sermão). O sermão não nomeia o ordenante.
