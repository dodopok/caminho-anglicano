      24 de setembro de 2022.
biography: >-
  Esdras Gusmão de Holanda Peixoto nasceu em Maceió (AL) em 1978. Foi ordenado diácono em 24/9/2022, na Catedral
  Anglicana do Bom Samaritano (Boa Viagem, Recife), e presbítero em 30/9/2023, em ordenação presidida pelo bispo
  diocesano João Câncio Peixoto. Consta no clero da Diocese Anglicana do Recife, onde exerce a função de coadjutor
  da Catedral do Bom Samaritano, e é professo da Terceira Ordem da Sociedade de São Francisco (TSSF).
