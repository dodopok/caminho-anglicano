biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Ordenado diácono em
  mar/1931 e presbítero em dez/1933. Transferido para a Igreja Episcopal do Brasil em 25/04/1965 (Clerical Directory
  1968).
