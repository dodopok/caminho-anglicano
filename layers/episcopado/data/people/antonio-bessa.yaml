# yaml-language-server: $schema=../../schemas/person.json
id: antonio-bessa
name: Antônio Bessa
full_name: Antônio José Pereira Bessa
aliases:
- Antônio José Pereira Bessa
- Bessa
- dom Antônio José Pereira Bessa
biography: >-
  Bispo em Fortaleza (CE); auxiliou José Fernando de Faria na proposta da Província Anglicana Católica do Espírito
  Santo; sagrado por Leonardo Marin-Saavedra; sagrou Rafael Moraes; integrou a Província Anglo-Católica da Santíssima
  Trindade.
sources:
- source: cant-novas-igrejas-2024
  quote: Dom Antônio José Pereira Bessa, em Fortaleza (CE)
  page: '105'
ordinations:
- order: episcopate
  date: '2019'
  place: Fortaleza (CE)
  jurisdiction: null
  principal_consecrator: leonardo-marin-saavedra
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2019, o arcebispo Leonardo Marin-Saavedra da Igreja Anglicana Latino-Americana realizou algumas visitas
      ao Brasil, consagrando novos bispos para o continente, ratificando as Ordens de clérigos com sucessão apostólica
      considerada duvidosa, e ordenando novos diáconos e presbíteros para diferentes Igrejas. Uma dessas sagrações
      episcopais realizadas foi a de Antônio Bessa, na cidade de Fortaleza.
  - source: cant-novas-igrejas-2024
    quote: >-
      Este bispo foi sagrado bispo por dom Leonardo Marin-Saavedra, do Movimento Anglicano Contínuo dos Estados
      Unidos.
    page: '105'
  notes: >-
    Frase ambígua: 'Este bispo' segue imediatamente a menção a 'dom Antônio Bessa' (antecedente mais próximo), mas
    pode referir-se a José Fernando de Faria. Ver dúvidas. Sagração durante visitas de Marin-Saavedra (Igreja Anglicana
    Latino-Americana) ao Brasil em 2019. Co-sagrantes não informados.
