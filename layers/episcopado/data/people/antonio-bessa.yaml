id: antonio-bessa
name: Antônio Bessa
full_name: Antônio José Pereira Bessa
aliases:
- Antonio Jose Pereira Bessa
- Antônio José Pereira Bessa
- Bessa
- Pereira-Bessa Antonio Jose
- dom Antônio José Pereira Bessa
biography: >-
  Bispo de Fortaleza (CE). A lista de bispos da Iglesia Anglicana Latino-Americana (IAL) registra um bispo brasileiro
  'Pereira-Bessa Antonio Jose' consagrado em Fortaleza em 2019. Em seu canal no YouTube, apresenta-se em 2021 como
  arcebispo da Província Anglo-Católica da Santíssima Trindade do Brasil; um vídeo do canal, enviado em 12/05/2021,
  tem o título 'Ordenação Episcopal de Dom Antônio Bessa.'
sources:
- source: lac-ial-sucessao
  quote: >-
    42nd (Fortieth-Second) Bishop consecrated by IAL USA/Canada: -067. PEREIRA-Bessa Antonio Jose. – Married - Brazilian
    Citizen - In 2019 - Fortaleza city, Ceara, Brazil - (Still living).
- source: lac-yt-bessa-nf
  quote: Arcebispo da Província Anglo-católica da Santíssima Trindade do Brasil!
- source: lac-yt-bessa-ord
  quote: Ordenação Episcopal de Dom Antônio Bessa.
ordinations:
- order: episcopate
  date: '2019'
  place: Fortaleza (CE)
  jurisdiction: icala
  principal_consecrator: leonardo-marin-saavedra
  status: confirmed
  sources:
  - source: lac-ial-sucessao
    quote: >-
      42nd (Fortieth-Second) Bishop consecrated by IAL USA/Canada: -067. PEREIRA-Bessa Antonio Jose. – Married -
      Brazilian Citizen - In 2019 - Fortaleza city, Ceara, Brazil - (Still living).
  - source: lac-yt-bessa-ord
    quote: Ordenação Episcopal de Dom Antônio Bessa.
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2019, o arcebispo Leonardo Marin-Saavedra da Igreja Anglicana Latino-Americana realizou algumas visitas
      ao Brasil, consagrando novos bispos para o continente, ratificando as Ordens de clérigos com sucessão apostólica
      considerada duvidosa, e ordenando novos diáconos e presbíteros para diferentes Igrejas. Uma dessas sagrações
      episcopais realizadas foi a de Antônio Bessa, na cidade de Fortaleza.
  - source: cant-novas-igrejas-2024
    quote: >-
      Este bispo foi sagrado bispo por dom Leonardo Marin-Saavedra, do Movimento Anglicano Contínuo dos Estados
      Unidos.
    page: '105'
  notes: >-
    A lista de bispos consagrados pela Iglesia Anglicana Latino-Americana (IAL), cujo primaz é Leonardo Marin-Saavedra,
    traz Bessa sem a marca 'Ratification' (que aparece nos casos de bispos já ordenados antes), isto é, como consagração
    nova. A lista não nomeia quem presidiu cada rito; a atribuição a Marin-Saavedra vem de Cant (2024), que relata
    visitas dele ao Brasil em 2019. Um vídeo do canal de Bessa, enviado ao YouTube em 12/05/2021, intitula-se 'Ordenação
    Episcopal de Dom Antônio Bessa.' (a data da cerimônia não consta da descrição). A mesma lista anota que Bessa
    tem 'ecclesiastical impediment to consecrate New Bishops' (por ser casado, segundo a regra da própria IAL) —
    ponto relevante para a sagração de Rafael Moraes por ele. Frase ambígua: 'Este bispo' segue imediatamente a
    menção a 'dom Antônio Bessa' (antecedente mais próximo), mas pode referir-se a José Fernando de Faria. Ver dúvidas.
    Sagração durante visitas de Marin-Saavedra (Igreja Anglicana Latino-Americana) ao Brasil em 2019. Co-sagrantes
    não informados.
