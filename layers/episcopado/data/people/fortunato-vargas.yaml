# yaml-language-server: $schema=../../schemas/person.json
id: fortunato-vargas
name: Fortunato Vargas
biography: Arcebispo primaz com sede em Santa Cruz de la Sierra (Bolívia), segundo os documentos de 2018.
sources:
- source: icc-documentos-jonas
  quote: >-
    Fora da Cidade Arquiepiscopal de Santa Cruz de La Sierra - Bolívia , recebe a Ordenação episcopal onde desejares,
    por qualquer Bispo, observando as normas litúrgicas estabelecidas. … Dado em Santa Cruz de La Sierra - Bolívia
    , junto a São Pedro, no dia 16 de setembro do ano do Senhor de 2018, primeiro ano do nosso Arcebispado. ++ Fortunato
    Vargas
events:
- type: other
  date: '2018-09-16'
  description: >-
    Mandato apostólico de Fortunato Vargas (Santa Cruz de la Sierra, Bolívia) que o elege bispo primaz do Brasil
    e autoriza sua ordenação episcopal por qualquer bispo
  status: probable
  sources:
  - source: icc-documentos-jonas
    quote: >-
      Fortunato, Bispo, Servo de Deus,pela sua infinita bondade e misericórdia, ao querido filho Jonas Santana Moreira,
      membro da Ordem dos Irmãos de Jesus, até o presente momento, Ministro provincial da Província Sagrado Coração
      de Jesus, na cidade de Criciúma, estado de Santa Catarina no Brasil, eleito Bispo Primaz do Brasil, saúde
      e Bênção Apostólica. … Fora da Cidade Arquiepiscopal de Santa Cruz de La Sierra - Bolívia , recebe a Ordenação
      episcopal onde desejares, por qualquer Bispo, observando as normas litúrgicas estabelecidas. … Dado em Santa
      Cruz de La Sierra - Bolívia , junto a São Pedro, no dia 16 de setembro do ano do Senhor de 2018, primeiro
      ano do nosso Arcebispado. ++ Fortunato Vargas
