    quote: Em 2022, o monsenhor Cristiano Alves também foi sagrado, por dom Rafael Moraes e dom Rafael Mendes.
  - source: cant-novas-igrejas-2024
    quote: >-
      No Rio de Janeiro, a IATB está representada pelo bispo dom Cristiano Alves, sagrado em 2022, por dom Rafael
      Moraes e dom Rafael Mendes.
    page: '136'
  notes: >-
    Hoje bispo da Diocese Anglo-Católica Cristo Bom Pastor (IATB), Rio de Janeiro. O livro não distingue o sagrante
