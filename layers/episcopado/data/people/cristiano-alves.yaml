  - source: cant-novas-igrejas-2024
    quote: >-
      Após a saída de dom Cristiano da Província, este bispo foi convidado por dom Rui Barbosa para retornar para
      a Igreja Anglicana Tradicional do Brasil (IATB).
    page: '106'
  - source: cant-novas-igrejas-2024
    quote: >-
      Esta segunda Província a ser organizada, foi intitulada Província Anglo-Católica da Santíssima Trindade, sendo
      era formada pelos bispos dom Antônio Bessa (bispo do Ceará) e dom Rafael Moraes (hoje bispo da Província Anglo-Católica
      da Santíssima Trindade, em Nova Friburgo), dom Cristiano Alves (hoje bispo da Diocese Anglo-Católica Cristo
      Bom Pastor, no Rio de Janeiro, ligada à Igreja Anglicana Tradicional do Brasil - IATB) e dom Rafael Mendes
      (hoje bispo da Diocese Anglo-Católica de Minas Gerais, como uma igreja autocéfala local).
    page: '162'
  notes: Membro na formação da província; hoje na Diocese Anglo-Católica Cristo Bom Pastor (IATB).
