# yaml-language-server: $schema=../../schemas/person.json
id: cristiano-alves
name: Cristiano Alves
aliases:
- Cristiano Carvalho
- Dom Cristiano
- Dom Cristiano Carvalho
- dom Cristiano
- monsenhor Cristiano Alves
biography: >-
  Bispo da Igreja Anglicana Tradicional do Brasil (IATB) responsável pela Diocese Anglo-Católica Cristo Bom Pastor,
  no Rio de Janeiro, segundo o site da IATB (janeiro de 2024). Assinou em 16/11/2025 a Carta de Nova Iguaçu, junto
  com Rui Costa Barbosa e José da Santa Cruz.
sources:
- source: lac-iatb-visita
  quote: Dom Cristiano, bispo responsável pela Diocese local
- source: iatb-home
  quote: >-
    Nós, Dom Rui Costa Barbosa, Dom José da Santa Cruz, Dom Cristiano Alves, presbíteros, diáconos e leigos da Igreja
    Anglicana Tradicional do Brasil
ordinations:
- order: diaconate
  date: '2016-11-13'
  place: Igreja Luterana de Vila Valqueire, Rio de Janeiro (RJ)
  jurisdiction: iatb
  ordained_by: rui-costa-barbosa
  status: confirmed
  sources:
  - source: lia-iatb-home-2017-02
    quote: >-
      No dia 13 de novembro de 2.016 às 10 hs durante a Celebração da Santa Eucaristia, no Templo da Igreja Luterana
      de Vila Valqueire na cidade do Rio de Janeiro, o Revmo. Bispo Dom Rui Costa procedeu a ordenação diaconal
      do irmão Cristiano Alves.
  notes: Anunciada em 05/11/2016 como parte da visita pastoral de 11 a 14/11/2016 e relatada em 2017.
- order: presbyterate
  date: '2017-08-27'
  place: Capela Nossa Senhora Conceição Aparecida, Clube Várzea, Rio de Janeiro (RJ)
  jurisdiction: iatb
  ordained_by: rui-costa-barbosa
  status: confirmed
  sources:
  - source: lia-iatb-home-2017-10
    quote: >-
      No domingo dia 27 de agosto de 2017 durante a celebração da Santa Eucaristia na Capela Nossa Senhora Conceição
      Aparecida, no Cluve Várzea, Rio de Janeiro, foi realizada a ordenação presbiteral do então diácono Rev. Cristiano
      Alves. A cerimônia foi presidida por Dom Rui e co-celebrada pelo Bispo Eleito Rev. Oswaldo Botelho.
  notes: >-
    Concelebrante: Oswaldo (Luiz) Botelho, então 'Bispo Eleito' (reincardinado em 25/06/2016; sagração não localizada).
- order: episcopate
  date: '2022'
  jurisdiction: null
  principal_consecrator: rafael-moraes
  co_consecrators:
  - rafael-mendes-martins
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: Em 2022, o monsenhor Cristiano Alves também foi sagrado, por dom Rafael Moraes e dom Rafael Mendes.
  - source: cant-novas-igrejas-2024
    quote: >-
      No Rio de Janeiro, a IATB está representada pelo bispo dom Cristiano Alves, sagrado em 2022, por dom Rafael
      Moraes e dom Rafael Mendes.
    page: '136'
  notes: >-
    Hoje bispo da Diocese Anglo-Católica Cristo Bom Pastor (IATB), Rio de Janeiro. O livro não distingue o sagrante
    principal. O livro diz 'por dom Rafael Moraes e dom Rafael Mendes' sem indicar quem foi o sagrante principal;
    Moraes posto como principal por ser citado primeiro.
affiliations:
- jurisdiction: pacst
  role: bishop
  start: '2021'
  end: c.2022
  end_reason: left
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: Dom Cristiano Alves, no Rio de Janeiro (RJ)
    page: '105'
  - source: cant-novas-igrejas-2024
    quote: >-
      Após a saída de dom Cristiano da Província, este bispo foi convidado por dom Rui Barbosa para retornar para
      a Igreja Anglicana Tradicional do Brasil (IATB).
    page: '106'
  - source: cant-novas-igrejas-2024
    quote: >-
      Esta segunda Província a ser organizada, foi intitulada Província Anglo-Católica da Santíssima Trindade, sendo
      era formada pelos bispos dom Antônio Bessa (bispo do Ceará) e dom Rafael Moraes (hoje bispo da Província Anglo-Católica
      da Santíssima Trindade, em Nova Friburgo), dom Cristiano Alves (hoje bispo da Diocese Anglo-Católica Cristo
      Bom Pastor, no Rio de Janeiro, ligada à Igreja Anglicana Tradicional do Brasil - IATB) e dom Rafael Mendes
      (hoje bispo da Diocese Anglo-Católica de Minas Gerais, como uma igreja autocéfala local).
    page: '162'
  - source: costa2021
    quote: >-
      atualmente formada por quatro bispos: Dom Antônio Bessa, em Fortaleza (CE), Primaz; Dom Rafael Moraes, em
      Nova Friburgo (RJ); Dom Cristiano Alves, no Rio de Janeiro (RJ); e Dom Rafael Mendes Martins, em Paraisópolis
      (MG).
    page: '139'
  notes: >-
    Membro na formação da província; hoje na Diocese Anglo-Católica Cristo Bom Pastor (IATB). Local: Rio de Janeiro
    (RJ). Situação em 2021.
- jurisdiction: iatb
  role: other
  role_description: bispo diocesano
  diocese: dacbp
  start: '2023'
  status: confirmed
  sources:
  - source: lia-iatb-home-2024
    quote: >-
      Informamos que toda a equipe liderada pelo Revmo. Bispo Dom Cristiano Alves conta com a maior confiança da
      cúpula da Igreja que o conhece desde muito tempo tendo recebido nesta igreja os graus de diácono e presbítero.
  - source: lia-iatb-clerigos-2023
    quote: Dom Cristiano Carvalho - RJ
  - source: iatb-comunidades
    quote: >-
      Paróquia Anglo-Católica Santa Mãe de Deus Rio de Janeiro - RJ Rua Torres de Oliveira 436, Água Santa - Rio
      de Janeiro, RJ Dom Cristiano
  notes: >-
    Início = primeira lista da IATB que o inclui como bispo (dez/2023); a lista de maio/2021 não o trazia. O episcopado
    ('três graus em legítima sucessão apostólica', 2022) foi recebido fora da IATB (Província Anglo-Católica da
    Santíssima Trindade, segundo o livro de Costa/Cant 2024). Visita de Rui Costa Barbosa à diocese em 18-21/01/2024.
