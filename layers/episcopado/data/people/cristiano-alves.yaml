  description: >-
    Carta de Nova Iguaçu: Rui Costa Barbosa, José da Santa Cruz e Cristiano Alves, em nome da IATB, declaram unidade
    da igreja após sínodo em Nova Iguaçu (RJ), em novembro de 2025.
  status: confirmed
  sources:
  - source: iatb-home
