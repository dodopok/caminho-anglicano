events:
- type: other
  date: '2025-11-16'
  description: >-
    Carta de Nova Iguaçu: Rui Costa Barbosa, José da Santa Cruz e Cristiano Alves, em nome da IATB, declaram unidade
    da igreja após sínodo em Nova Iguaçu (RJ), em novembro de 2025.
  status: confirmed
  sources:
  - source: iatb-home
    quote: Declaramos que seguimos unidos em um único propósito eclesiástico
- type: other
  date: '2026'
  description: >-
    A página de clero da AECI lista, sob 'BRAZIL - Churches in Communion - AIC-W', Rui Costa Barbosa (Primate Archbishop),
    'Jose Maciel' (Bishop and Abbot, Pernambuco), Jeferson Nilson Santos (Bishop, Paraná) e 'Cristiano Carvalho'
    (Bishop, Rio de Janeiro).
  status: confirmed
  sources:
  - source: lia-aeci-clergy
    quote: The Rt. Rev. Jose Maciel Bishop and Abbot Pernaambuco State
  - source: lia-aeci-clergy
    quote: The Rt. Rev. Jeferson Nilson Santos Bishop Parana State
  - source: lia-aeci-clergy
    quote: The Rt. Rev. Cristiano Carvalho Bishop Rio de Janeiro State
- type: other
  date: '2025-11-16'
  description: >-
    Carta de Nova Iguaçu: bispos Rui Costa Barbosa, José da Santa Cruz e Cristiano Alves, com presbíteros, diáconos
    e leigos, reunidos em Nova Iguaçu (RJ) em novembro de 2025, declaram unidade da IATB e retomada de uma tradição
    sinodal 'interrompida'.
  status: confirmed
  sources:
  - source: iatb-home
    quote: >-
      Nós, Dom Rui Costa Barbosa, Dom José da Santa Cruz, Dom Cristiano Alves, presbíteros, diáconos e leigos da
      Igreja Anglicana Tradicional do Brasil, reunidos na Cidade de Nova Iguaçu-RJ, no mês de novembro de 2025
