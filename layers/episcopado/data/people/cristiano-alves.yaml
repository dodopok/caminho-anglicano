id: cristiano-alves
name: Cristiano Alves
aliases:
- dom Cristiano
- monsenhor Cristiano Alves
biography: >-
  Bispo no Rio de Janeiro; sagrado em 2022 por Rafael Moraes e Rafael Mendes; integrou a Província Anglo-Católica
  da Santíssima Trindade e voltou à IATB a convite de Rui Barbosa; bispo da Diocese Anglo-Católica Cristo Bom Pastor
  (IATB).
sources:
- source: cant-novas-igrejas-2024
  quote: Dom Cristiano Alves, no Rio de Janeiro (RJ)
  page: '105'
- source: cant-novas-igrejas-2024
  quote: >-
    No Rio de Janeiro, a IATB está representada pelo bispo dom Cristiano Alves, sagrado em 2022, por dom Rafael
    Moraes e dom Rafael Mendes.
  page: '136'
ordinations:
- order: episcopate
  date: '2022'
  jurisdiction: null
  principal_consecrator: rafael-moraes
  co_consecrators:
  - rafael-mendes-martins
  status: probable
  sources:
