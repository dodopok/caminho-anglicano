id: heitor-coll-de-oliveira
name: Heitor Coll de Oliveira
full_name: Heitor Coll de Oliveira
aliases:
- Heitor Coll Oliveira
- OLIVEIRA, HEITOR COLL
biography: >-
  Heitor Coll de Oliveira foi ordenado diácono em dezembro de 1960 e presbítero em novembro de 1961, ambas por Egmont
  Krischke, no Distrito Missionário do Sul do Brasil. Foi transferido para a Igreja Episcopal do Brasil em 25 de
  abril de 1965.
sources:
- source: cd1965
  quote: D Dec 60 P Nov 61 Bp Krischke
- source: kickhofel-1995
  quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1960 - … Heitor Coll de Oliveira
  page: '371'
- source: cd1968
  quote: OLi VEIRA, Heitor Coll (SBra) Trans to Brazil Ch 25 Apr 65.
ordinations:
- order: diaconate
  date: 1960-12
  jurisdiction: dmsb
  ordained_by: egmont-krischke
  status: confirmed
