id: orvandil-moreira-barbosa
name: Orvandil Moreira Barbosa
full_name: Orvandil Moreira Barbosa
aliases:
- Dom Orvandil
- Dom Orvandil M. Barbosa
biography: >-
  Arcebispo primaz e presidente da Mitra Primacial da Igreja Católica Anglicana (Goiânia). Segundo matéria de 2008,
  foi padre anglicano desde 1972 e deixou a Igreja Anglicana em 2004; foi sagrado bispo da Igreja Católica Carismática
  em Belém (27/07/2008) e incardinado na Província Anglicana Tradicional do Brasil em 09/07/2009 como bispo da Diocese
  Meridional Thomas More. Edita o site e canal Cartas Proféticas.
sources:
- source: lica-ica-sobre
  quote: '++ Dom Orvandil M. Barbosa: Arcebispo Primaz e bispo da Diocese Anglicana Centro Oeste;'
- source: lica-cnpj-ica
  quote: '"nome_socio":"ORVANDIL MOREIRA BARBOSA"'
- source: lica-brasil247-orvandil
  quote: >-
    Bispo Primaz da Igreja Católica Anglicana, Editor e apresentador do Site e do Canal Cartas Proféticas
