biography: >-
  Orvandil Moreira Barbosa, de Campo Grande (MS), foi presbítero da IEAB, com diaconato registrado em 1989 (uma
  matéria de 2008 o diz padre anglicano desde 1972), e em 2004 deixou a Igreja Anglicana. Foi sagrado bispo em 27/07/2008,
  em Belém (PA), por Edilson Vinagre, primaz da ICC, com Manoel Queiroz, Nilton Santos, Eduardo Mota e Raymundo
  Costa como cossagrantes, e assumiu a Diocese Nossa Senhora do Perpétuo Socorro. Em 09/07/2009 foi recebido na
  Igreja Anglicana Tradicional do Brasil (IATB) como bispo da Diocese Meridional Thomas More, depois bispo diocesano
  da Diocese Brasil Central, em Goiânia, e em 2010 era vice-presidente da Mitra Provincial. Em 2017 deixou a IATB
  e, com Ricardo Vicente dos Anjos, fundou a Igreja Católica Anglicana (ICA), cuja Mitra Primacial foi registrada
  em 31/10/2017 em Goiânia, da qual é arcebispo primaz e bispo da Diocese Centro-Oeste; convocou o II Sínodo Nacional,
  realizado em Cametá (PA) em novembro de 2017. Em 24/05/2018 a ICA notificou que Altamiro Pereira do Amaral, Jorge
  dos Santos Costa e Ricardo Vicente dos Anjos não integravam mais a Mitra Primacial, e a Diocese de Mato Grosso
  do Sul foi reintegrada à do Centro-Oeste. Uma fonte atribui ao ativismo político de Orvandil a ruptura de clérigos
  que deu origem à ICA-Brasil.
