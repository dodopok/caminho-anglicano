events:
- type: other
  date: '2017-10-31'
  description: >-
    Registro da Mitra Primacial Católica Anglicana (nome fantasia "Igreja Católica Anglicana") no CNPJ 29.104.811/0001-14,
    em Goiânia (GO), organização religiosa, com Orvandil Moreira Barbosa como presidente. Atividade iniciada em
    31/10/2017; situação cadastral "inapta" desde 30/05/2019 por omissão de declarações.
  status: confirmed
  sources:
  - source: lica-cnpj-ica
    quote: '"razao_social":"MITRA PRIMACIAL CATOLICA ANGLICANA"'
  - source: lica-cnpj-ica
    quote: '"data_inicio_atividade":"2017-10-31"'
  - source: lica-cnpj-ica
    quote: '"motivo_situacao_cadastral":63'
- type: other
  date: '2017-11-09'
  description: >-
    II Sínodo Nacional da Igreja Católica Anglicana, em Cametá (PA), de 9 a 12 de novembro de 2017, convocado pelo
    arcebispo primaz em 09/10/2017 (designado "II Sínodo"). Dele saiu o "Manifesto à Nação Brasileira", assinado
    por Orvandil Moreira Barbosa e Franciney Rodrigues Pantoja.
  status: confirmed
  sources:
  - source: lica-ica-sinodo-convocacao
    quote: a realizar-se na cidade de Cametá, Estado do Pará dos dias 09 a 12 de novembro
  - source: lica-ica-manifesto
    quote: reunidos em Sínodo Nacional em Cametá, Pará, de 09 – 12 de novembro  de 2017
- type: other
  date: '2018-05-24'
  description: >-
    Notificação da Câmara Episcopal e Arcebispado Primaz da ICA: Altamiro Pereira do Amaral, Jorge dos Santos Costa
    e Ricardo Vicente dos Anjos "não mais integram esta Mitra Primacial"; as dioceses de Belém e de Santa Cruz de
    Salvador passam à responsabilidade do arcebispo primaz e a Diocese de Mato Grosso do Sul é extinta e reintegrada
    à do Centro Oeste.
  status: confirmed
  sources:
  - source: lica-ica-notificacao
    quote: >-
      A Diocese de Mato Grosso do Sul é extinta e reintegrada à Diocese Católica Anglicana do Centro Oeste.
  - source: lica-ica-notificacao
    quote: Goiânia, 24 de maio de 2018
- type: other
  date: '2004'
  description: >-
    Segundo matéria do Midiamax (25/07/2008), Orvandil Moreira Barbosa deixou a Igreja Anglicana em 2004, ficou
    sem denominação e foi convidado para o clero da Igreja Católica Carismática de Belém para expandi-la ao Centro-Oeste
    e Sul.
  status: probable
  sources:
  - source: lica-domomb-midiamax
    quote: Em 2004, Orvandil abandonou a Igreja Anglicana e ficou até o início do ano sem uma denominação.
- type: other
  date: '2018-07-23'
  description: >-
    Em julho de 2018 a Câmara Episcopal da Igreja Católica Anglicana (reunida em Cametá, PA) aprovou pedir habeas
    corpus ao STF/STJ para o ex-presidente Lula; o ativismo político de dom Orvandil causou ruptura com clérigos
    que originaram a ICA-Brasil.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      aprovou o encaminhamento do pedido de habeas corpus no STF ou no STJ para o ex presidente Luis Inácio Lula
      da Silva (Igreja Católica Anglicana, 23 de julho de 2018).
    page: '138'
  - source: cant-novas-igrejas-2024
    quote: >-
      Esse ativismo político por parte de dom Orvandil – oriundo da IATB – causou uma ruptura com clérigos dando
      origem à Igreja Católica Anglicana do Brasil (ICA-Brasil).
    page: '138'
