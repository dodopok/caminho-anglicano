  notes: >-
    Os textos de 2008 são anúncios da cerimônia (ofício da ICC à imprensa e matéria do Midiamax de 25/07/2008);
    a realização é corroborada pela reportagem de TV de 31/07/2008 sobre "a sagração e ordenações" e pelo fato de,
    em 2009, a IATB recebê-lo "no grau de BISPO". O ofício da ICC indica como local o Clube Alegria (Av. Marques
    do Herval, bairro da Pedreira); outro convite do próprio Orvandil cita a Rodovia Augusto Montenegro, Rua Bragança,
    46 (bairro da Cabanagem). Seria bispo diocesano de Campo Grande (MS), Diocese Nossa Senhora do Perpétuo Socorro.
