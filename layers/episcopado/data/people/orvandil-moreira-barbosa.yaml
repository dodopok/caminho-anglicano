    quote: Será sagrado bispo o Reverendíssimo Padre ORVANDIL MOREIRA BARBOSA, da cidade de Campo Grande, MS
  - source: lica-domomb-sagracao
    quote: >-
      Será sagrante/ordenante DOM EDILSON VINAGRE, bispo primaz da ICC e co-sagrantes/ordenantes DOM MANOEL QUEIROZ,
      bispo auxiliar da ICC , Dom NILTON SANTOS , bispo diocesano de Rio Maria, PA, Dom EDUARDO MOTA, bispo diocesano
      de Cametá, PA e Dom Raymundo Costa , bispo diocesano de Araguaina( TO)
  - source: lica-domomb-midiamax
    quote: >-
      O bispo da Católica Carismática, Orvandil Moreira Barbosa, será sagrado neste domingo (27) em Belém do Pará
  - source: lica-domomb-entrevista
