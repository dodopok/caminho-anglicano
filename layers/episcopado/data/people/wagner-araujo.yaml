# yaml-language-server: $schema=../../schemas/person.json
id: wagner-araujo
name: Wagner Cipriano Araújo
aliases:
- Wagner Araújo
- Wagner Cipriano
biography: >-
  Presbítero em reconhecimento de ordem na Diocese Anglicana do Recife, o Rev. Wagner Cipriano Araújo atuou em Santo
  André (SP), onde um ponto missionário anglicano foi inaugurado em novembro de 2010, com o Rev. Sérgio Henrique.
  Em fevereiro de 2011, nota sobre o Ponto Missionário Anglicano São Judas, na Zona Norte de São Paulo, o cita,
  com outro clérigo, em processo de incardinação para reconhecimento de ordem.
sources:
- source: dard2-com-extra
  quote: >-
    PONTO MISSIONÁRIO ANGLICANO EM SANTO ANDRÉ (INAUGURAÇÃO EM NOVEMBRO/2010) Rev. Wagner Cipriano Araújo + e Rev.
    Sérgio Henrique +
