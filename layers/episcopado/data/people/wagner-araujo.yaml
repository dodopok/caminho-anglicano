    quote: >-
      PONTO MISSIONÁRIO ANGLICANO EM SANTO ANDRÉ (INAUGURAÇÃO EM NOVEMBRO/2010) Rev. Wagner Cipriano Araújo + e
      Rev. Sérgio Henrique +
  notes: >-
    Local: Ponto Missionário Anglicano em Santo André (SP; Arcediagado Extraterritorial). Página "Comunidades" do
