# yaml-language-server: $schema=../../schemas/person.json
id: veralucia-lins-silva
name: Veralúcia Lins Silva
full_name: Veralúcia Lins Silva
aliases:
- Revda. Vera Lins
- Vera Lins
- Vera Lucia lins Silva
biography: >-
  Ordenada diácona em 1999, na IEAB, por Robinson Cavalcanti, consta como membro da OSE desde ao menos 2002. Em
  2005 tomou posse como reitora da Paróquia Anglicana do Redentor e, em 23/08/2005, foi incluída entre os clérigos
  excluídos da Comunhão da IEAB, passando a integrar a Diocese Anglicana do Recife (DAR). Na DAR foi procuradora
  diocesana e, em 2008 e 2009, pároca do Redentor.
