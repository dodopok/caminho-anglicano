# yaml-language-server: $schema=../../schemas/person.json
id: veralucia-lins-silva
name: Veralúcia Lins Silva
biography: Clérigo da Diocese Anglicana do Recife citado em documento oficial da própria Diocese.
sources:
- source: drp-boletim-oracao-2006
  quote: 'Orar pela Paróquia Anglicana do Redentor, pelas Reverendas: Nadja e Veralúcia Lins'
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Revda. Veralúcia Lins Silva
  - source: drv-nota-esclarecimento-2006
    quote: Veralúcia Lins Silva
  - source: drp-boletim-oracao-2006
    quote: 'Orar pela Paróquia Anglicana do Redentor, pelas Reverendas: Nadja e Veralúcia Lins'
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Veralúcia Lins Silva … Os clérigos não atenderam à convocação
      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Paróquia Anglicana do Redentor. Clérigo citado
    como pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão). Anexo
    R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti,
    ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005 é a da exclusão
    pela IEAB, e a adesão à DAR é anterior, sem data exata.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: reitora
  start: '2005'
  status: confirmed
  sources:
  - source: drp2-breves-04-2005
    quote: >-
      na Paróquia Anglicana do Redentor, além do aniversário da comunidade, foi dado posse a Reitora – Revda. Vera
      Lins, e a Coadjutora – Revda. Nadja Lins em clima festivo e acolhedor
  notes: >-
    Local: Paróquia Anglicana do Redentor. Empossada no primeiro trimestre de 2005, em visita de Dom Robinson.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Veralúcia Lins Silva … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
