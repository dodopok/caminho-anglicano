id: antonio-santana-neto
name: Antônio Santana Neto
full_name: Antonio Santana Neto
aliases:
- Antônio Santana
- Dom Frei Antonio Santana
birth:
  date: '1973-04-18'
  sources:
  - source: lielb-radiopasc
    quote: Nasceu na cidade de São Paulo, aos 18 de abril de 1973
  - source: lielb-gaz-santana
    quote: >-
      A cerimônia de ordenação, realizada em 14 de janeiro de 2024, às 9h30 na histórica Sé Primacial de Esmeraldas,
      Minas Gerais
biography: >-
  Antônio Santana Neto, nascido em São Paulo em 18/04/1973, fundou com Lucas Macieira da Silva, em dezembro de 2004,
  a Igreja Episcopal Latina do Brasil (IELB), implantou em 20/02/2005 a Missão Episcopal Latina Santo Expedito e
  São Sebastião, em Barbalha (CE), e criou em 2010 a Província Anglicana Sagrado Coração. Foi sagrado bispo em 14/01/2024,
  em Esmeraldas (MG), em cerimônia presidida por Lucas Macieira, e integra a Diocese Anglicana Católica do Brasil.
sources:
- source: lielb-radiopasc
  quote: Nasceu na cidade de São Paulo, aos 18 de abril de 1973
- source: cant-novas-igrejas-2024
  quote: >-
    Fundada em dezembro de 2004 a Igreja Episcopal Latina do Brasil (de sigla IELB, a qual não deve ser confundida
    com a Igreja Luterana) teve origem na liderança de dom Lucas Macieira da Silva e o frei Antonio Santana Neto,
    ambos advindos da Igreja Católica Romana e Igreja Católica Brasileira no Ceará.
  page: '166'
- source: lielb-radiopasc
  quote: >-
    No  ano de 2004 junatamente com Dom Lucas Macieira da Silva da inicio aos trabalhos eclesiasticos  de implantação
    e fundação da Igreja Episcopal Latina do Brasil.
- source: cant-novas-igrejas-2024
  quote: >-
    No dia 20 de fevereiro de 2005, Antônio Santana implantou a Missão Episcopal Latina Santo Expedito e São Sebastião,
    na cidade de Barbalha, ficando responsável pela jurisdição da região sul do estado e com os estados do Pernambuco,
    Piauí e Paraíba.
  page: '166'
- source: lielb-radiopasc
  quote: >-
    Em 2010 uni tudo criando a Província Anglicana Sagrado Coração, a primeira e unica província anglicana da Igreja
    Episcopal Latina do Brasil de rito anglicano.
- source: lielb-gaz-santana
  quote: >-
    A cerimônia de ordenação, realizada em 14 de janeiro de 2024, às 9h30 na histórica Sé Primacial de Esmeraldas,
    Minas Gerais
- source: lielb-gaz-santana
  quote: >-
    A cerimônia foi presidida pelo arcebispo Primaz da The Anglicana Free Communion Internacional e da Diocese Anglicana
    Católica do Brasil, o Dom Frei Lucas Macieira e concentrada por outro bispos pertencentes a mesma diocese
- source: cant-novas-igrejas-2024
  quote: >-
    Atualmente, a DAC possui três bispos: dom Lucas Macieira (Arcebispo e Primaz), dom João de Deus da Silva, Dom
    Antônio Santana Neto e dom Daniel Araújo.
  page: '102'
- source: cant-novas-igrejas-2024
  quote: >-
    No dia 20 de fevereiro de 2005, Antônio Santana implantou a Missão Episcopal Latina Santo Expedito e São Sebastião,
    na cidade de Barbalha
  page: '166'
- source: cant-novas-igrejas-2024
  quote: >-
    Sua formação religiosa teve início no Seminário Diocesano São José, na cidade de Crato (CE), e foi concluída
    sob a orientação da Pia Sociedade Missionária de São Carlos – os Padres Scalabrinianos – na cidade de São Paulo
    (SP).
  page: '165'
