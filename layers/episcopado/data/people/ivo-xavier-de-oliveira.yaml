biography: >-
  Ordenado diácono em 06/01/2008, no Ponto Missionário Anglicano da Santíssima Trindade (Maceió-AL), e presbítero
  em 05/08/2008, em Mogi das Cruzes (SP), por Robinson Cavalcanti, na Diocese Anglicana do Recife. Foi ministro
  encarregado do Ponto Missionário Anglicano da Transfiguração (Mogi das Cruzes), arcediago adjunto do Arcediagado
  Sul/Sudeste e membro da Comissão de Credenciais e Diplomacia. Participou da 1ª Assembleia Arcediagal do Sul/Sudeste
  (Bandeirantes-PR, 11 a 13/06/2009) e do culto inaugural do Ponto Missionário Anglicano Cristo Rei (Santo André-SP,
  28/11/2010). O Arcediagado do Sul/Sudeste foi dissolvido em 2018, com a saída do arcediago Ivo Oliveira.
