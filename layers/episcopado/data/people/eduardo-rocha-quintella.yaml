full_name: Eduardo Rocha Quintella
aliases:
- Dom Eduardo Quintella
- Dom Quintella
- Eduardo Quintella
birth:
  date: '1945-11-03'
  sources:
  - source: lvc-quintella-bio
    quote: Nascido em 03 de Novembro de 1945.
  - source: lvc-quintella-2016-04
    quote: >-
      Dom Eduardo Rocha Quintella (Nascido em 03 de Novembro de 1945) Foi Sagrado Bispo em 10 de Setembro de 2011,
      por Sua Exc. Rev. Dom Emmanuel Millingo em Belém-PA.
  - source: lvc-sicb-sucessao
    quote: Dom Bernardo recebeu a Sucessão Apostólica através de Dom Eduardo Quintella, em Belo Horizonte.
biography: >-
  Bispo católico independente, apresentado em seu blog como bispo diocesano de Belo Horizonte (MG) da Igreja Católica
  Apostólica Missionária (patriarca: Emmanuel Milingo). Diz ter sido sagrado por Milingo em 10/09/2011, em Belém
  (PA). Pelo site da SICB, transmitiu a sucessão apostólica a Bernardo da Ressurreição; pelo seu blog, sagrou Ronaldo
  Melo em 05/04/2016.
