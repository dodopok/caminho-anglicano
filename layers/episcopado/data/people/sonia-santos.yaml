id: sonia-santos
name: Sônia Santos
full_name: Sônia Maria dos Santos
aliases:
- Revda. Sônia Santos
- Sônia Maria dos Santos
biography: >-
  Ordenada presbítera em 04/12/2010, por Robinson Cavalcanti, é pároca da Paróquia Anglicana Restauração, em Goianinha
  (RN), à frente da comunidade desde antes da ordenação. Em 2025 consta como clériga da Igreja Anglicana do Amor,
  em Goianinha, na Diocese de João Pessoa (IAB).
sources:
- source: dar-2010-centesimo
  quote: >-
    o Bispo Robinson Cavalcanti ao conceder a Ordem Diaconal ao Candidato às Sagradas Ordens Davi Amado , de Campina
    Grande, Paraíba, estará ordenando o centésimo clérigo do seu ministério episcopal de treze anos. Na mesma ocasião
    a Revda. Sônia Santos , de Goianinha, Rio Grande do Norte, será a 86ª a receber a Ordem Presbiteral.
- source: darn1-sonia11
  quote: Nós da Paróquia Anglicana Restauração , em Goianinha (RN)
