id: sonia-santos
name: Sônia Santos
full_name: Sônia Maria dos Santos
aliases:
- Revda. Sônia Santos
- Sônia Maria dos Santos
biography: >-
  Sônia Maria dos Santos foi ordenada presbítera em 04/12/2010, por Robinson Cavalcanti, no 30º Concílio da Diocese
  Anglicana do Recife, a 86ª pessoa a receber a ordem presbiteral em seu episcopado. É pároca da Paróquia Anglicana
  da Restauração, em Goianinha (RN), comunidade que já dirigia em 2009, e em 2011 foi designada para a Comissão
  de Credenciais e Diplomacia da diocese. Em 2025 consta como clériga da Igreja Anglicana do Amor, em Goianinha,
  na Diocese de João Pessoa (IAB).
sources:
- source: dar-2010-centesimo
  quote: >-
    o Bispo Robinson Cavalcanti ao conceder a Ordem Diaconal ao Candidato às Sagradas Ordens Davi Amado , de Campina
    Grande, Paraíba, estará ordenando o centésimo clérigo do seu ministério episcopal de treze anos. Na mesma ocasião
    a Revda. Sônia Santos , de Goianinha, Rio Grande do Norte, será a 86ª a receber a Ordem Presbiteral.
- source: dar-2010-sermao-xxx-concilio
  quote: >-
    A Ordenação Diaconal de Davi , a Ordenação Presbiteral de Sônia e a instituição como Evangelista de Williams
    se dão dentro de um espírito eminentemente missionário.
