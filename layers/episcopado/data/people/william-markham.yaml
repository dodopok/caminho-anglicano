    Markham of York, John of Durham, Edmund of Carlisle, and Shute of Llandaff; Reg. Cornwallis, 225.
- source: perry-1895
  quote: >-
    on the fourth day of February, 1787, at Lambeth Chapel, at the hands of the archbishop of Canterbury, Dr. Moore,
    the archbishop of York, Dr. Markham, the bishop of Bath and Wells, Dr. Moss, and the bishop of Peterborough,
    Dr. Hinchcliffe, William White and Samuel Provoost were duly and canonically, by the laying on of hands, made
    bishops of the Church of God.
