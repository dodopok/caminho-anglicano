biography: >-
  Sagrado em 17/02/1771 por Robert Hay Drummond, foi bispo de Chester e, de 1777 até morrer em 03/11/1807, arcebispo
  de York. Participou de quatro sagrações episcopais, entre elas as de Beilby Porteus e William White.
