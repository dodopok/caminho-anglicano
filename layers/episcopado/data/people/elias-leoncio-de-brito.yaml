- Elias Leôncio de Brito Filho
biography: >-
  Foi ordenado diácono em 27/12/2003 por Robinson Cavalcanti, na Paróquia Anglicana Emanuel (Olinda), e consta como
  clérigo da Diocese Anglicana do Recife, da Paróquia do Bom Samaritano e da Ordem de Santo Estêvão Mártir (OSE),
  e entre os signatários do texto "Para além das trincheiras" (2004). Em 23/8/2005 foi incluído entre os clérigos
  excluídos da comunhão da IEAB, que declararam manter comunhão com Robinson Cavalcanti; a lista do clero diocesano
  o registra como emérito.
