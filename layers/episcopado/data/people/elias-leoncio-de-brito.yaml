id: elias-leoncio-de-brito
name: Elias Leôncio de Brito
full_name: Elias Leôncio de Brito Filho
aliases:
- Elias Leôncio de B. Filho
- Elias Leôncio de Brito Filho
biography: Pessoa citada em documentos históricos da Diocese do Recife e da IEAB (ver afirmações).
sources:
- source: drv-declaracao-32
  quote: Rev. Elias Leôncio de Brito Filho
ordinations:
- order: diaconate
  date: '2003-12-27'
  place: Paróquia Anglicana Emanuel, Olinda-PE
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-ord-decio-2003
    quote: >-
      Décio da Silva, Elias Leôncio de Brito Filho, ose, Raniere Almeida de Oliveira, Solange Cristina Pereira e
      Tibério Marques da Silva, ose
  - source: rcor-drv-ord-decio-2003
    quote: Paróquia Anglicana Emanuel - Olinda/PE — 27/12/2003
  - source: rcor-drv-ord-decio-2003
    quote: Esta noite, na qualidade de Bispo, e sucessor dos apóstolos
  - source: rcor-drv-ord-decio-2003
    quote: >-
      Hoje, seis anos depois da nossa instituição como Diocesano, estamos completando a ordenação de 53 Diáconos.
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti, 'seis anos depois da nossa instituição como Diocesano'), que
    anuncia impor as mãos sobre os ordinandos. Elias Leôncio e Tibério optaram pelo diaconato permanente; Décio,
    Raniere e Solange aspiravam ao presbiterato.
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Elias Leôncio de Brito Filho
  - source: drv-nota-esclarecimento-2006
    quote: Elias Leôncio de Brito Filho, ose
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Elias Leôncio de Brito Filho … Os clérigos não atenderam
      à convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: retirement
  status: contested
  sources:
  - source: dar-clero-diocesano
    quote: Revdo. Elias Leôncio de Brito (Emérito)
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Elias Leôncio de Brito Filho … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Emérito (página consultada em 2026-10). Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo
    Oliveira Neto, Autoridade Eclesiástica da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão
    da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão.
    motivo_fim 'deposicao' porque o efeito é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos
    depostos'; o fato de fundo é a adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
  discrepancies:
  - field: end_reason
    value: deposition
    sources:
    - source: costa2021
      quote: >-
        Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
        Ordens, os clérigos a seguir mencionados: … Rev. Elias Leôncio de Brito Filho … Recife, 23 de agosto de
        2005.
      page: 560-561
- jurisdiction: ose
  role: member
  status: confirmed
  sources:
  - source: rcor-drv-ordens-dar
    quote: Rev. Elias Leôncio
  notes: >-
    Membro clerical da OSE. Lista da página 'Ordens Religiosas' do site da Diocese do Recife, arquivada em 24/10/2004.
events:
