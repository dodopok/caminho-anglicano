id: arthur-selden-lloyd
name: Arthur Selden Lloyd
biography: >-
  Reitor em Norfolk (Virgínia), esteve presente em 31 de agosto de 1889 no culto de despedida de Morris e Kinsolving.
  Mais tarde bispo sufragâneo de Nova York, foi secretário da Junta de Missões, favorável à missão brasileira, à
  qual foram transferidos os fundos da American Church Missionary Society; em 1907 a Convenção Geral estabeleceu
  o Distrito Missionário do Brasil.
sources:
- source: liv-stokes-kinsolving
  quote: Arthur Selden Lloyd, later Suffragan Bishop of New York
  page: '8'
- source: liv-stokes-kinsolving
  quote: Arthur Selden Lloyd, strongly sympathetic to the Brazilian Mission, was now the secretary
  page: '16'
- source: liv-stokes-kinsolving
  quote: >-
    The night before there had been a small service at which a few friends had gathered to bid them godspeed.
  page: '7'
- source: liv-stokes-kinsolving
  quote: >-
    Beverley Dandridge Tucker, later Bishop of Southern Virginia; William Loyall Gravatt, later Bishop of West Virginia;
    and Arthur Selden Lloyd, later Suffragan Bishop of New York.
  page: '8'
- source: liv-stokes-kinsolving
  quote: >-
    arrangements were made for the transfer of the funds of the American Church Mission- ary Society Board to the
    Board of Missions
  page: '16'
- source: liv-stokes-kinsolving
  quote: In 1907 the General Convention established the Missionary District of Brazil
  page: '16'
