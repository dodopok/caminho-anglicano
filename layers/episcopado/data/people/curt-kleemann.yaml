  sources:
  - source: cd1965
    quote: b Ijui RGS Braz 30 KLEEMAN, H. - KNEEBONE, E. T. 218 Aug 26
  - source: cd1968
    quote: KLEEMANN, Curt (CBra) Trans to Brazil Ch 25 Apr 65.
biography: >-
  Nascido em Ijuí (RS) em 30/08/1926, foi ordenado diácono em fevereiro de 1950 e presbítero em dezembro de 1950
  pelo bispo Athalício Pithan, no Distrito Missionário do Brasil Central, e foi transferido para a Igreja Episcopal
  do Brasil em 25/04/1965.
