    dos nomes completos foi feita cruzando com os próprios verbetes de Stubbs (quem ocupava a sé na data). Sagrado
    bispo de Londres. Também impuseram as mãos os bispos da Jamaica e de Rupert's Land. A Wikidata dá Sumner (relatório
    do projeto, com data de 22/11/1856, um dia antes de Stubbs).
