biography: >-
  Archibald Campbell Tait foi sagrado bispo em 23/11/1856, em Whitehall, pelo arcebispo John Bird Sumner, e foi
  bispo de Londres até 1868, quando se tornou arcebispo de Cantuária, cargo que ocupou até morrer, em 03/09/1882.
