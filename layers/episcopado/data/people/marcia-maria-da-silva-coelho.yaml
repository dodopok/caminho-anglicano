id: marcia-maria-da-silva-coelho
name: Márcia Maria da Silva Coelho
aliases:
- Revda. Márcia Coelho
biography: >-
  Márcia Maria da Silva Coelho foi ordenada diácona por Robinson Cavalcanti em 05/07/2008, na Catedral Anglicana
  do Bom Samaritano, em Recife, e presbítera em 07/03/2009, na Paróquia Anglicana Emanuel, em Olinda, ambas na Diocese
  Anglicana do Recife (DAR). Foi ministra encarregada do Ponto Missionário Anglicano Sarça Ardente, em Abreu e Lima
  (PE), no Arcediagado Norte. Em 2009 e 2010 constava na comissão de novas paróquias e missões da diocese e, a partir
  de dezembro de 2009, aparece como secretária diocesana de Intercessão, função que ainda exercia em 2012.
