# yaml-language-server: $schema=../../schemas/person.json
id: marcia-maria-da-silva-coelho
name: Márcia Maria da Silva Coelho
aliases:
- Revda. Márcia Coelho
biography: >-
  Márcia Maria da Silva Coelho foi ordenada diácona em 05/07/2008 e presbítera em 07/03/2009 por Robinson Cavalcanti,
  na Diocese Anglicana do Recife (DAR). Atuou como ministra encarregada do Ponto Missionário Anglicano Sarça Ardente,
  em Abreu e Lima (PE), no Arcediagado Norte, e como secretária diocesana de Intercessão, além de integrar a comissão
  de novas paróquias e missões.
sources:
- source: drv-ordenacoes-diaconais-2008
  quote: >-
    apresentamos Josean, Lúcia Helena, Márcia, Márcio e Maria de Fátima para serem Ordenados ao Diaconato na Santa
    Igreja de Cristo.
- source: drv-ordenacoes-diaconais-2008
