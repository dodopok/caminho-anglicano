biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Guaíba,
  RGS, Brasil (1899-12-22). Ordenado diácono em mar/1957 e presbítero em mai/1959. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
