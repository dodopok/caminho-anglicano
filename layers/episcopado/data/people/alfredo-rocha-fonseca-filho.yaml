- FONSECA FILHO, ALFREDO ROCHA da
biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Ordenado diácono em
  dez/1957 e presbítero em mai/1959. Transferido para a Igreja Episcopal do Brasil em 25/04/1965 (Clerical Directory
  1968).
sources:
