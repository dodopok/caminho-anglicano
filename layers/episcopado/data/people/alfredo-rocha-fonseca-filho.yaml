id: alfredo-rocha-fonseca-filho
name: Alfredo Rocha Fonseca Filho
full_name: Alfredo Rocha Fonseca Filho
aliases:
- Alfredo Rocha da Fonseca Filho
- FONSECA FILHO, ALFREDO ROCHA da
biography: >-
  Alfredo Rocha Fonseca Filho foi ordenado diácono em dezembro de 1957 por Louis Chester Melcher e presbítero em
  maio de 1959 por Edmund Knox Sherrill, no Distrito Missionário do Brasil Central, e foi transferido para a Igreja
  Episcopal do Brasil em 25/04/1965. Transferido em 1966 para o Recife, foi o primeiro capelão brasileiro da Paróquia
  da SS. Trindade e pioneiro dos ofícios em português; em 1968 teve de deixar a cidade, perseguido pela ditadura
  militar por dar assistência pastoral a presos políticos.
sources:
- source: cd1965
  quote: D Dec 57 Bp Melcher P May 59 Bp E I Sherrill
- source: cd1968
  quote: FONSECA Fl LHO, Alfredo Rocha da (CBra) Trans to Brazil Ch 25 Apr 65.
- source: kickhofel-1995
  quote: >-
    Quase uma década depois, o bispo Sherrill transferiu para Recife o rev. Alfredo Rocha Fonseca Filho, que veio
    a ser o primeiro capelão brasileiro da Paróquia da SS.Trindade, iniciando o lento processo de integração.
  page: '295'
- source: costa2021
  quote: >-
    Em 1966, ocorreu a transferência do reverendo Alfredo Rocha Fonseca para o Recife. Este foi o primeiro pároco
    brasileiro a realizar ofícios em língua portuguesa.
  page: '171'
- source: drv-resgatando-i
  quote: >-
    O trabalho de evangelização para brasileiros, em língua portuguesa, tem como pioneiro, em 1966, o Rev. Alfredo
    Rocha da Fonseca Filho
- source: drv-resgatando-i
  quote: >-
    teve de fugir do Recife perseguido pela ditadura militar, por dar assistência pastoral aos presos políticos
    da Casa de Detenção
- source: costa2021
  quote: >-
    Porém, no ano de 1968, devido à sua atuação política, teve que sair escondido da cidade para não ser preso pelos
    agentes da Ditadura Militar.
  page: '172'
