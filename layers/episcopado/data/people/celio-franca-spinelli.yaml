# yaml-language-server: $schema=../../schemas/person.json
id: celio-franca-spinelli
name: Célio França Spinelli
aliases:
- Célio Spineli
- Célio Spinelli
biography: Pessoa citada em documentos históricos da Diocese do Recife e da IEAB (ver afirmações).
sources:
- source: drv-resgatando-iv
  quote: >-
    Leva com ele as comunidades do Janga, Timbaúba e Vitória do Santo Antão-PE, e os reverendos: Frederico, Célio,
    Adonias e Edgar.
ordinations:
- order: diaconate
  date: null
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-ord-celio-filadelfo
    quote: (Célio, Filadelfo, Juciara, Marco, Maurício, Nadja e Vera)
  - source: rcor-drv-ord-celio-filadelfo
    quote: seu bispo, no exercício apostólico, igualmente os reconhece, e os consagra
  notes: >-
    Sermão de ordenação (tema: o diaconato, Atos 6-7) pregado pelo bispo diocesano, entendido como Robinson Cavalcanti,
    que se diz o bispo que os 'consagra'. A página não traz data; o diaconato de Filadelfo Oliveira Neto é datado
    de 28/02/1999 por Costa (2021), o que sugere a mesma cerimônia. Identificação de 'Célio' com Célio França Spinelli
    (clero da Diocese do Recife em 2002) é provável, não explícita.
- order: episcopate
  date: '2004-10-24'
  jurisdiction: null
  principal_consecrator: antonio-jose-da-costa-raposo
  status: probable
  sources:
  - source: lielb-plwiki-raposo
    quote: '{{Sukcesja apostolska infobox/wiersz|[[Célio Spinelli]]|24 października 2004}}'
  notes: >-
    A Wikipédia polonesa lista Célio Spinelli entre os bispos sagrados por Raposo em 24/10/2004, mesmo dia de José
    Moises Moncada Quevedo e Iranildo Lukas Macieira da Silva.
affiliations:
- jurisdiction: iecb
  role: clergy
  diocese: iecb-diocese-recife
  start: 2002-09
  end: '2004-05-30'
  end_reason: left
  status: probable
  sources:
  - source: drv-resgatando-iv
    quote: >-
      Leva com ele as comunidades do Janga, Timbaúba e Vitória do Santo Antão-PE, e os reverendos: Frederico, Célio,
      Adonias e Edgar.
  - source: drv-spinelli-carta-2004
    quote: >-
      me levou a decisão de me DESLIGAR em caráter definitivo e irrevogável da Igreja Episcopal Carismática do Brasil.
  - source: drv-spinelli-carta-2004
    quote: Recife, 30 de maio de 2004.
  notes: >-
    Carta de desligamento da IECB assinada 'Reverendo Célio Spinelli' e dirigida a Paulo Garcia em 30/05/2004. A
    identificação do 'Célio' de Resgatando IV (2002) com Célio Spinelli é inferência (primeiro nome apenas na fonte
    de 2002). Mais tarde Spinelli aparece como bispo da Igreja Anglicana do Brasil (Lorite) em 2006.
- jurisdiction: iadb-lorite
  role: bishop
  diocese: diocese-anglicana-thomas-becket
  start: '2006'
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Célio França Spinelli, como bispo da Diocese Anglicana Thomas Becket e vigário geral da Arquidiocese Thomas
      Cranmer
    page: '119'
  notes: >-
    Também vigário geral da Arquidiocese Thomas Cranmer. Data = época da Declaração da Boa Viagem (2006).
- jurisdiction: iadb-lorite
  role: bishop
  status: confirmed
  sources:
  - source: drv-comunicado-imprensa-2006
    quote: Dom Célio França Spinelli, Vigário Geral
  notes: >-
    Consta com esse cargo na lista de fundadores da Declaração da Boa Viagem (30/09/2006); início do cargo não informado.
    Em Célio Spinelli, o texto acrescenta 'Bispo de Diocese Anglicana Thomas Becket e Vigário Geral da Arquidiocese
    Thomas Cranmer'. Citado nesse cargo em documento de 30/09/2006.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2002'
  end_reason: schism
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Primeiro aconteceu a saída do rev. Paulo Garcia, acompanhado dos reverendos Célio Spineli, Edgar Ferreira
      e Frederico Bastos
    page: '65'
  - source: costa2021
    quote: >-
      Primeiro aconteceu a saída do rev. Paulo Garcia, acompanhado dos reverendos Célio Spineli, Edgar Ferreira
      e Frederico Bastos, que ficaram na posse do templo da Catedral Episcopal Anglicana
    page: '191'
  notes: Saiu com Paulo Garcia (para a Igreja Episcopal Carismática). Tese cita PEREIRA, 2013, p. 28.
- jurisdiction: iadb-lorite
  role: other
  role_description: vigário geral
  status: confirmed
  sources:
  - source: darl3-cc-boaviagem
    quote: Dom Célio França Spinelli, Vigário Geral
  notes: >-
    Signatário/representante da jurisdição na Declaração da Boa Viagem (30/09/2006), com o título indicado na notícia.
events:
- type: other
  date: '2004-05-30'
  description: >-
    Célio Spinelli, em carta de 30/05/2004 a Paulo Garcia, comunica seu desligamento definitivo da Igreja Episcopal
    Carismática do Brasil, listando clérigos que se afastaram de Garcia nos dez anos anteriores (entre eles Miguel
    Uchoa, Robinson Cavalcanti, Sérgio Andrade, Teobaldo Barbosa, Aldenor Soares, Antônio Eça, Fred Lubambo, César
    Romero, Getúlio Gutemberg e Pedro Silva) e menciona a sagração de Garcia 'em 8 de setembro'.
  status: probable
  sources:
  - source: drv-spinelli-carta-2004
    quote: >-
      me levou a decisão de me DESLIGAR em caráter definitivo e irrevogável da Igreja Episcopal Carismática do Brasil.
  - source: drv-spinelli-carta-2004
    quote: >-
      Particularmente após a sua sagração em 8 de setembro, quando você passou a ignorar todos os pastores da sua
      diocese.
