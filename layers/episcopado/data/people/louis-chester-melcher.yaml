biography: >-
  Louis Chester Melcher foi ordenado diácono em outubro de 1924 e presbítero em setembro de 1925 por James Craik
  Morris, na Igreja Episcopal dos EUA. Eleito em novembro de 1947 bispo coadjutor do Sul do Brasil, foi sagrado
  em 05/02/1948 por Henry Knox Sherrill, recebeu de William M. M. Thomas a jurisdição da igreja brasileira em maio
  de 1949 e foi bispo diocesano do Sul do Brasil em 1949-1950. Com a divisão do distrito missionário, em vigor em
  01/01/1950, tornou-se bispo do Brasil Central, sediado no Rio de Janeiro, cargo que ocupou até a aposentadoria
  em outubro de 1958. Foi o primeiro presidente do Conselho Nacional e obteve o acordo de 1955 sobre as capelanias
  inglesas. Morreu em 21/09/1965, como bispo aposentado.
