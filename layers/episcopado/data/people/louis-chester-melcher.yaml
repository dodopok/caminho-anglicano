  notes: >-
    Eleito em 1948 'primeiro bispo coadjutor do Brasil'. Sagrantes não informados. Sagrado bispo coadjutor do Sul
    do Brasil. Apresentantes: bispos Jackson (Louisiana) e Carruthers (South Carolina); litanista Keeler (Minnesota);
    epistoleiro Phillips (SW Virginia); evangelista Wright (East Carolina); pregador Middleton Barnwell (Georgia)
    — Living Church 15/02/1948. A Wikipédia EN (artigo Melcher) cita Living Church de '15/02/1947' — erro de ano.
    Pôster: Henry Knox Sherrill "teve papel decisivo ao consagrar missionários como Louis Chester Melcher" — data,
    local e cargo CONFIRMADOS por fonte primária (The Witness, 12/02/1948), que não nomeia o sagrante; Sherrill
    como sagrante principal (com Dandridge e Gravatt) só pela lista de sucessão da Wikipédia — PROVÁVEL. Sherrill
    era Presiding Bishop em 1948. Observação: a lista da Wikipédia o põe como "I Central Brazil", mas na sagração
    era coadjutor do Sul do Brasil.
