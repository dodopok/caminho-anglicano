  - source: ens-xxxvi-7
    quote: The Rt. Rev. Louis Chester Melcher, retired Bishop of Central Brazil, died Sept. 21.
- type: other
  date: '1947'
  description: >-
    Eleito pela Câmara dos Bispos bispo coadjutor para o Brasil, com direito à sucessão, contrariando o desejo dos
    brasileiros por um bispo nacional
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Thomas e Pithan participaram da reunião da Câmara dos Bispos que elegeu o reverendo Louis Chester Melcher,
      um desconhecido pároco da Carolina do Sul, para ser o primeiro bispo coadjutor no Brasil. A eleição de Melcher
      contrariou a vontade dos brasileiros que queriam um bispo nacional
    page: '197'
- type: other
  date: 1949-09
  description: >-
    Eleito pela Câmara dos Bispos e pela Convenção Geral bispo da Diocese do Brasil Central (Rio de Janeiro), na
    divisão do distrito missionário (vigente a partir de 01/01/1950)
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Certificada de que o futuro da igreja brasileira estava assegurado, a Câmara dos Bispos e a Convenção Geral
      aprovaram, em setembro de 1949, o plano brasileiro e elegeram
    page: '199'
  - source: kickhofel-1995
    quote: >-
      Pithan para a Diocese do Brasil Meridional, com sede em Porto Alegre; Egmont Machado Krischke para a Diocese
      do Brasil Sul-Ocidental, com sede em Santa Maria; e Louis Chester Melcher para a Diocese do Brasil Central,
      com sede no Rio de Janeiro. Antes de se aposentar em 30 de setembro de 1949, Thomas transferiu a jurisdição
      da igreja brasileira ao bispo Melcher, em maio daquele ano, conforme dispunha os cânones, ou seja, antes de
      se efetuar a divisão, cuja vigência teve seu início em 01 de janeiro de 1950.
    page: '200'
- type: other
  date: 1949-05
  description: Recebeu de Thomas a jurisdição da igreja brasileira, antes da divisão do distrito
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Antes de se aposentar em 30 de setembro de 1949, Thomas transferiu a jurisdição da igreja brasileira ao bispo
      Melcher, em maio daquele ano
    page: '200'
- type: other
  date: null
  description: >-
    Melcher, primeiro presidente do Conselho Nacional; rev. Curtis Fletcher, primeiro secretário-executivo
  status: probable
  sources:
