events:
- type: other
  date: 1947-11
  description: >-
    Eleição de Melcher como coadjutor do Sul do Brasil pela Câmara dos Bispos (Winston-Salem, nov. 1947).
  status: probable
  sources:
  - source: wit-1947-11-13
    quote: Melcher, rector of Trinity, Columbia, S. C., was chosen to he coadjutor of Southern Brazil.
