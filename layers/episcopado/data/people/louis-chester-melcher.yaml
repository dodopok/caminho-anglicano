      da incorporação das capelanias à igreja brasileira.
- type: other
  date: 1958-10
  description: >-
    Na Convenção Geral de 1958 (Miami Beach, 6 a 17/10/1958), a Câmara dos Bispos elegeu, na primeira votação, o
    Rev. Edmund Knox Sherrill, reitor da Igreja da Santíssima Trindade em São Paulo, bispo do Distrito Missionário
    do Brasil Central, sujeito à confirmação da Câmara dos Deputados.
  status: confirmed
  sources:
