biography: >-
  Sagrado em 18/10/1945 como bispo coadjutor do Texas, por Henry St. George Tucker, com Quin e Block como co-sagrantes.
  Como bispo presidente da Igreja Episcopal dos EUA (22º), proclamou em 25/04/1965, no Sínodo de Porto Alegre, a
  autonomia da Igreja Episcopal do Brasil como 19ª província da Comunhão Anglicana.
