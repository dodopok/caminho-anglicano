  notes: >-
    CORRIGIDO: o pôster diz que Henry Knox Sherrill sagrou Hines em 1945; a fonte primária (The Witness, 1/11/1945)
    diz que o sagrante foi "The Presiding Bishop" — em outubro de 1945 o Presiding Bishop era Henry St. George Tucker
    (1938–1946, cf. wp-tucker) —, com Quin (Texas) e Block (Califórnia) como co-sagrantes. A Wikipédia nomeia Tucker
    explicitamente. Sherrill não aparece.
events:
- type: other
  date: '1965-04-25'
  description: >-
    Autonomia: a Igreja Episcopal Brasileira torna-se a 19a provincia da Comunhao Anglicana; proclamacao pelo Bispo
    Presidente John E. Hines no Sinodo de Porto Alegre (25/04/1965) e investidura de Egmont Machado Krischke como
    primeiro primaz.
  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      O projeto do Sínodo foi levado à votação na 61ª Convenção Geral, realizada de 11 a 23 de outubro do mesmo
      ano, na cidade de St. Louis, no Missouri, sendo aprovada a autonomia plena da Igreja Brasileira.
  - source: wp-en-ieab
    quote: >-
      The Anglican community of Brazil was a missionary district of the Episcopal Church until 1965, when it gained
      its ecclesiastical independence and became a separate province of the Anglican Communion.
- type: other
  date: '1965-04-25'
  description: >-
