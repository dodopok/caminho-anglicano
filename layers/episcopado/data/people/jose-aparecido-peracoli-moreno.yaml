id: jose-aparecido-peracoli-moreno
name: José Aparecido Peraçoli Moreno
full_name: José Aparecido Peraçoli Moreno
aliases:
- Bispo Moreno
- Dom José Moreno
- José Moreno
- bispo Moreno
biography: >-
  Ex-pastor da Igreja Pentecostal de Nova Vida, organizou em 1999 a Igreja Episcopal Anglicana Livre, depois chamada
  Igreja Anglicana das Américas por causa de seu vínculo com o Conselho Anglicano Americano (ACC). Foi ordenado
  bispo em 2004, em Belo Horizonte, por um único bispo, o que é considerado irregular, e recebeu nova sagração sub
  conditione em 2009, em Salta (Argentina), por três bispos. Declara-se membro do GAFCON.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Foi organizada em 1999, pelo bispo José Aparecido Peraçoli Moreno, que havia sido pastor da Igreja Pentecostal
    de Nova Vida, do bispo Robert McAlister.
  page: '114'
- source: cant-novas-igrejas-2024
  quote: Foi organizada em 1999, pelo bispo José Aparecido Peraçoli Moreno
  page: '114'
- source: cant-novas-igrejas-2024
  quote: >-
    O bispo José Moreno também foi membro do Conselho Anglicano Americano (ACC), ligado à Igreja Anglicana da América
    Latina (EUA). Por causa deste vínculo, a denominação foi intitulada Igreja Anglicana das Américas.
  page: '114'
- source: nigweb-moreno-identidade-2026
  quote: Embora seja bispo da Igreja Anglicana das Américas
- source: nigweb-moreno-sucessao-2012
  quote: >-
    eu havia sido ordenado ao episcopado em Belo Horizonte por um único bispo, em 2004, o que é considerado irregular
- source: nigweb-moreno-sucessao-2012
  quote: A nova sagração deu-se em Salta, na Argentina, em 2009, através de três bispos
- source: nigweb-moreno-sucessao-2012
  quote: >-
    A minha própria jurisdição, a Anglican Church of the Americas, requereu de mim uma nova sagração, sub conditione
- source: nigweb-moreno-identidade-2026
  quote: Hoje, o GAFCON (Global Anglican Future Conference), do qual participo
- source: cant-novas-igrejas-2024
  quote: Por causa de sua formação como psicanalista, o bispo publica textos no seu blog pessoal.
  page: '114'
