biography: >-
  Frederico Carneiro Rêgo Bastos iniciou sua caminhada com a família na Catedral da Santíssima Trindade, em Recife,
  onde foi ordenado por Robinson Cavalcanti; o diaconato é registrado em 17 de fevereiro de 2001, na Diocese Anglicana
  do Recife (IEAB). Em 2002, quando Paulo Garcia deixou a IEAB com outros clérigos e ficou com o templo da Catedral
  na Rua Carneiro Vilela, Frederico estava entre os que saíram. Segundo a carta pastoral do bispo diocesano de setembro
  de 2002, enviou carta de desvinculação junto com membros do Conselho da Missão Bem-Aventuranças, de Timbaúba (PE).
  Foi então transferido para Vitória de Santo Antão. Em 14 de abril de 2007 foi sagrado na Igreja Episcopal Carismática
  do Brasil (IECB) por Randolph Austin Adler, como bispo diocesano de Vitória de Santo Antão. Participou de sete
  sagrações episcopais, entre elas as de Adonias Ramos de Souza (2007), André Novaes de Albuquerque Cavalcanti (2009)
  e Jean Clayton de Albuquerque do Nascimento (2020). Em 2024 Paulo Garcia anunciou sua escolha para sucedê-lo na
  primazia da IECB e na liderança plena da Igreja, e em 2025 ele constava como coadjutor do arcebispo e da Diocese
  do Recife.
