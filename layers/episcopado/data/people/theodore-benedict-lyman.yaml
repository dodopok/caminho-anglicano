id: theodore-benedict-lyman
name: Theodore Benedict Lyman
full_name: Theodore Benedict Lyman
aliases:
- Bp. Lyman
- Theodore B. Lyman
wikidata: Q7781686
biography: >-
  Sagrado em 11/12/1873, em Raleigh, por William Rollinson Whittingham, com Atkinson e Lay, como bispo coadjutor
  da Carolina do Norte, tornou-se bispo da diocese com a morte de Atkinson (TEC).
sources:
- source: perry-1895
  quote: >-
    He was consecrated bishop coadjutor of North Carolina in Christ Church, Raleigh, Dec. 11, 1873. The consecrators
    were Bishops Whittingham, Atkinson, and Lay.
- source: wp-en-histlist
  quote: >-
    | [[Theodore B. Lyman]] | [[William Rollinson Whittingham|36]] [[Thomas Atkinson (bishop)|58]] [[Henry C. Lay|69]]
    | 1873
- source: perry-1895
  quote: On the death of Bishop Atkinson, his coadjutor became the bishop of the see.
- source: perry-1895
  quote: RIGHT REVEREND THEODORE BENEDICT LYMAN, D.D.
ordinations:
- order: episcopate
  date: '1873-12-11'
  place: Christ Church, Raleigh
  jurisdiction: tec
  office: coadjutor
  principal_consecrator: william-rollinson-whittingham
  co_consecrators:
  - henry-c-lay
  - thomas-atkinson
  status: confirmed
  sources:
  - source: perry-1895
    quote: >-
      He was consecrated bishop coadjutor of North Carolina in Christ Church, Raleigh, Dec. 11, 1873. The consecrators
