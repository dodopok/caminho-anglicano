biography: >-
  Presbítero norte-americano nascido em Chicago em 1926, foi ordenado diácono em maio de 1951 e presbítero em maio
  de 1952, por Wallace Edmonds Conkling, e consta como clérigo do Distrito Missionário do Brasil Central entre 1959
  e 1960.
