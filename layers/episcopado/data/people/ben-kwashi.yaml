    quote: >-
      gentilmente autorizado pelo ordinário local, pregou e celebrou ontem o Rito Sacramental da Confirmação de
      novos membros na Missão Emanuel, Diocese de Oxford, da Igreja da Inglaterra
  - source: darb2-breves-15
    quote: >-
      juntamente com o Bispo Benjamin Kwashi, da Diocese de Jos, na Nigéria, Dom Robinson irá até a cidade de York
  - source: darb2-breves-15
    quote: Seu retorno ao Recife, pela TAP, está previsto para a próxima terça-feira, dia 10
