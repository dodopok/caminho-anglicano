events:
- type: other
  date: 2007-07
  description: >-
    Em julho de 2007, na Inglaterra, Dom Robinson Cavalcanti, autorizado pelo ordinário local, pregou e celebrou
    a confirmação de novos membros na Missão Emanuel, Diocese de Oxford (Igreja da Inglaterra), cujo ministro encarregado,
    Rev. John Shephard, foi missionário na Diocese do Recife; em seguida, com o bispo Benjamin Kwashi (Diocese de
    Jos, Nigéria), falaria sobre a diocese em York, num dos seminários paralelos ao Sínodo Geral da Igreja da Inglaterra,
    com retorno ao Recife previsto para terça-feira, dia 10.
  status: confirmed
  sources:
