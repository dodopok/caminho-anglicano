biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Rio Grande
  do Sul, Brasil (1938-11-24). Ordenado diácono em set/1963 e presbítero em jul/1964. Transferido para a Igreja
  Episcopal do Brasil em 25/04/1965 (Clerical Directory 1968).
