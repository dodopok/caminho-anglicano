biography: >-
  Francisco Jassnicker foi ordenado diácono em maio de 1938, pelo bispo William Matthews Merrick Thomas, e presbítero
  em fevereiro de 1943, pelo bispo Athalício Pithan. Atuou como clérigo do Distrito Missionário do Sudoeste do Brasil
  (SwBra) e foi transferido para a Igreja Episcopal do Brasil em 25 de abril de 1965.
