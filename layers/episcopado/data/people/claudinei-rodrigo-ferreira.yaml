# yaml-language-server: $schema=../../schemas/person.json
id: claudinei-rodrigo-ferreira
name: Claudinei Rodrigo Ferreira
biography: Ordenado ao episcopado por James Antônio Roque (Diocese Anglicana do Japi).
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da Silva.
  page: '76'
ordinations:
- order: episcopate
  date: '2019-07-26'
  jurisdiction: iacc
  office: diocesan
  principal_consecrator: james-antonio-roque
  status: probable
  sources:
  - source: cont-wacbr-clerigos
    quote: >-
      Dom Claudinei Rodrigo Ferreira Bispo da Cidade: Florianópolis - SC Contato: +55 (48) 98844-7000 Ordenação:
      Presbiteral: Sagração Episcopal: 26/07/2019
  - source: cant-novas-igrejas-2024
    quote: >-
      Como seus primeiros atos litúrgicos episcopais, o bispo James Roque, ordenou outros clérigos ao episcopado,
      a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de Sousa Barreiros, Claudinei Rodrigo Ferreira,
      Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da Silva.
    page: '76'
  - source: cant-novas-igrejas-2024
    quote: uma vez que já era ordenado bispo anglicano, desde 2019.
    page: '129'
  - source: cant-novas-igrejas-2024
    quote: >-
      Entre os bispos ordenados por James estavam: Dom José Kennedy de Freitas, organizador da Igreja Anglicana
      de Confissão Continuante; Dom Marcos Mattos, nomeado bispo da Diocese Anglicana Continuante do Rio de Janeiro
      (falecido prematuramente, antes da consolidação da diocese); Dom Albertino de Sousa Barreiros, da Diocese
      Anglicana do Natal; Dom Claudinei Rodrigo Ferreira, da Diocese Anglicana de Santa Catarina; Dom Itabira Jonas,
      da Diocese Anglicana de São Paulo e Paraná; Dom Francisco de Assis Coelho e Pinho, bispo eleito e delegado
      episcopal da Pró-Diocese Anglicana do Amazonas; e dom José Barbosa da Silva, da Diocese Anglicana de Portugal,
      na União Europeia.
    page: '157'
  - source: costa2021
    quote: >-
      ordenou muitas pessoas ao episcopado, a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de Sousa
      Barreiros, Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da
      Silva.
    page: '138'
  notes: >-
    DATA NOVA: o site da WAC-BR dá 26/07/2019 para a sagração de Claudinei; Cant (2024) diz apenas 'desde 2019'
    e que foi ordenado por James Roque (Japi). Jurisdição do ato: o site da diocese (dasc.iacc) diz que ela era
    ligada à Igreja Anglicana Continuante em 2017-2019. Sagrante não informado nesta página. Data não informada;
    entre os 'primeiros atos' episcopais de James Roque (após 2013), no contexto da Diocese Anglicana do Japi. O
    livro não informa jurisdição nem sagrantes. 'da Diocese Anglicana de Santa Catarina'. Data não informada. Datas
    não informadas; a Diocese do Japí foi depois extinta e esses bispos fundaram igrejas anglicanas independentes.
affiliations:
- jurisdiction: wac-br
  role: diocesan_bishop
  start: '2024'
  status: confirmed
  sources:
  - source: cont-iacc-santacatarina
    quote: >-
      No ano de 2024, Dom Ferreira, solicitou a incardinação na Igreja Anglicana Mundial - WAC Brasil, atualmente
      presidida por Dom Paulo Sergio Ferreira, arcebispo Primaz da WAC - Brasil.
  - source: cont-iacc-santacatarina
    quote: >-
      A Diocese Anglicana Mundial de Santa Catarina, iniciou seus trabalhos no ano de 2017, época em que era ligada
      a Igreja Anglicana Continuante, foi designado como bispo eleito Monsenhor Dom Claudinei Rodrigo Ferreira,
      que assumiu o episcopado no ano de 2019.
  - source: cont-wacbr-clerigos
    quote: 'Dom Claudinei Rodrigo Ferreira Bispo da Cidade: Florianópolis - SC'
  notes: >-
    Local: Diocese Anglicana (Mundial) de Santa Catarina (São Teófilo). Duas fontes primárias concordam (site da
    diocese e da WAC-BR). O site 'dasc-iacc.webnode.page', citado como site da IACC, hoje é o site da Diocese de
    Santa Catarina já em WAC-BR (parte do conteúdo do site é texto institucional da WAC).
- jurisdiction: wac-br
  role: bishop
  diocese: florianopolis
  start: 2024-07
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      a celebração foi encerrada com a incardinação do bispo dom Claudinei Rodrigo Ferreira, que passa a servir
      ao episcopado em Florianópolis
    page: '129'
  notes: 'Local: SC.'
