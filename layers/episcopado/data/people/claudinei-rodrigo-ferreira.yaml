# yaml-language-server: $schema=../../schemas/person.json
id: claudinei-rodrigo-ferreira
name: Claudinei Rodrigo Ferreira
full_name: Claudinei Rodrigo Ferreira
aliases:
- Dom Claudinei
- Dom Ferreira
biography: >-
  Bispo da Diocese Anglicana Mundial de Santa Catarina (Florianópolis). Segundo o site da diocese, pastor ordenado
  aos 19 anos na Igreja do Evangelho Quadrangular, seminarista do SETEK (IEAB, Porto Alegre) e depois pastor de
  comunidade própria em Cachoeirinha (RS); a diocese começou em 2017 e ele assumiu o episcopado em 2019 (site da
  WAC-BR: sagração em 26/07/2019). Incardinado na WAC no Brasil em julho de 2024.
sources:
- source: lwac-dasc
  quote: >-
    A Diocese Anglicana Mundial de Santa Catarina, iniciou seus trabalhos no ano de 2017, época em que era ligada
    a Igreja Anglicana Continuante, foi designado como bispo eleito Monsenhor Dom Claudinei Rodrigo Ferreira, que
    assumiu o episcopado no ano de 2019.
- source: lwac-wacbr-clerigos
  quote: >-
    Dom Claudinei Rodrigo Ferreira Bispo da Cidade: Florianópolis - SC Contato: +55 (48) 98844-7000 Ordenação: Presbiteral:
    Sagração Episcopal: 26/07/2019
ordinations:
- order: episcopate
  date: '2019-07-26'
  jurisdiction: iacc
  office: diocesan
  principal_consecrator: james-antonio-roque
  status: probable
  sources:
  - source: lwac-wacbr-clerigos
    quote: 'Sagração Episcopal: 26/07/2019'
  - source: lwac-wacbr-sinodo
    quote: Bispo desde 2019, pediu sua incardinação e iniciou sua caminhada conosco
  - source: lwac-wacbr-clerigos
    quote: >-
      Dom Claudinei Rodrigo Ferreira Bispo da Cidade: Florianópolis - SC Contato: +55 (48) 98844-7000 Ordenação:
      Presbiteral: Sagração Episcopal: 26/07/2019
  - source: cant-novas-igrejas-2024
    quote: >-
      Como seus primeiros atos litúrgicos episcopais, o bispo James Roque, ordenou outros clérigos ao episcopado,
      a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de Sousa Barreiros, Claudinei Rodrigo Ferreira,
      Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da Silva.
    page: '76'
  - source: cant-novas-igrejas-2024
    quote: uma vez que já era ordenado bispo anglicano, desde 2019.
    page: '129'
  - source: cant-novas-igrejas-2024
    quote: >-
      Entre os bispos ordenados por James estavam: Dom José Kennedy de Freitas, organizador da Igreja Anglicana
      de Confissão Continuante; Dom Marcos Mattos, nomeado bispo da Diocese Anglicana Continuante do Rio de Janeiro
      (falecido prematuramente, antes da consolidação da diocese); Dom Albertino de Sousa Barreiros, da Diocese
      Anglicana do Natal; Dom Claudinei Rodrigo Ferreira, da Diocese Anglicana de Santa Catarina; Dom Itabira Jonas,
      da Diocese Anglicana de São Paulo e Paraná; Dom Francisco de Assis Coelho e Pinho, bispo eleito e delegado
      episcopal da Pró-Diocese Anglicana do Amazonas; e dom José Barbosa da Silva, da Diocese Anglicana de Portugal,
      na União Europeia.
    page: '157'
  - source: costa2021
    quote: >-
      ordenou muitas pessoas ao episcopado, a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de Sousa
      Barreiros, Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da
      Silva.
    page: '138'
  notes: >-
    Data do site da WAC-BR. Sagrantes, local e jurisdição do ato não informados nestas páginas; a diocese de Santa
    Catarina estava então ligada à "Igreja Anglicana Continuante", segundo o site da diocese. DATA NOVA: o site
    da WAC-BR dá 26/07/2019 para a sagração de Claudinei; Cant (2024) diz apenas 'desde 2019' e que foi ordenado
    por James Roque (Japi). Jurisdição do ato: o site da diocese (dasc.iacc) diz que ela era ligada à Igreja Anglicana
    Continuante em 2017-2019. Sagrante não informado nesta página. Data não informada; entre os 'primeiros atos'
    episcopais de James Roque (após 2013), no contexto da Diocese Anglicana do Japi. O livro não informa jurisdição
    nem sagrantes. 'da Diocese Anglicana de Santa Catarina'. Data não informada. Datas não informadas; a Diocese
    do Japí foi depois extinta e esses bispos fundaram igrejas anglicanas independentes.
