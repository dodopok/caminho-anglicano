id: jaime-sepulcro-jr
name: Jaime Sepulcro Jr.
full_name: Jaime Magalhães Sepulcro Júnior
aliases:
- Jaime Magalhães Sepulcro Júnior
biography: >-
  Pastor e fundador da Estação Casa (Belo Horizonte), plantada em 11/06/2017 como Comunidade Anglicana Âncora, missão
  da IAB supervisionada pelo bispo Márcio Meira (Diocese de João Pessoa). Aparece como "Pr." em 27/09/2020, como
  postulante na lista de outubro de 2020 e como "Rev." em 01/11/2020; a igreja registra a ordenação do Rev. Jaime
  Sepulcro, mas ordem, data e ordenante não foram localizados em fonte aberta. Constou como clérigo da Diocese de
  João Pessoa até 2024 e integrou a Rede Episcopal Brasileira de 23/12/2024 a 27/06/2026, quando saiu com a Estação
  Casa, hoje independente. Proferiu palestra no 1º Sínodo da REB (outubro de 2025).
