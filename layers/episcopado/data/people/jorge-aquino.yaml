# yaml-language-server: $schema=../../schemas/person.json
id: jorge-aquino
name: Jorge Aquino
aliases:
- Cônego Jorge Aquino
- Reverendo Cônego Jorge Aquino
biography: >-
  De tradição presbiteriana, transferiu-se para a Igreja Episcopal Anglicana do Brasil (IEAB) com a eleição de Robinson
  Cavalcanti como bispo diocesano, que o ordenou diácono em 31/07/1999 e presbítero em 19/04/2000. Em cerca de 12
  anos na IEAB foi pároco na Capela do Campus da UFRN, reitor do Seminário Anglicano de Recife e arcediago da sub-região
  norte da Diocese do Recife; em julho de 2003 acompanhou Robinson Cavalcanti à Consulta da EFAC, no Quênia. Depois
  atuou como cônego teológico na Diocese do Japi, no Movimento Anglicano no Brasil, como diretor de formação da
  Free Church of England, coordenador de teologia na Free Protestant Episcopal Church e cônego teológico e chanceler
  na Prelazia Católico Anglicana da Sagrada Família; hoje está na Igreja Anglicana Ortodoxa Missionária, onde também
  foi cônego teológico.
sources:
- source: aquino-quem-e
  quote: >-
    O Reverendo Jorge, vem de tradição presbiteriana – onde atuou como pastor por sete (7) anos -, mas transferiu-se
    para a Igreja Episcopal Anglicana do Brasil quando da Eleição de D. Robinson Cavalcanti como seu bispo diocesano.
    Ordenado diácono e presbítero por ele
- source: aquino-ordenacao-2000
  quote: >-
    Minha ordenação presbiterial na Igreja Anglicana ocorreu no dia 19 de abril de 2000, na Capela do Campus Universitário
    do Rio Grande do Norte. O bispo ordinante foi D. Robinson Cavalcanti, da Diocese de Recife
- source: rcor-drv-ord-ose-1999
  quote: ORDENAÇÃO DE DIÁCONOS E INSTITUIÇÃO DA ORDEM EVANGÉLICA DE SANTO ESTEVÃO MÁRTIR - 31/07/99.
- source: aquino-quem-e
  quote: >-
    Foi Ministro da Igreja Episcopal Anglicana do Brasil (IEAB) por 12 anos, assumindo os cargos de Pároco na Capela
    do Campus da UFRN, de ministro encarregado da Missão Jesus Cristo Libertador, em João Pessoa/PB, Reitor do Seminário
    Anglicano de Recife/PE, Arcediago da sub-região norte da Diocese do Recife
- source: drp2-memorias-decada-iv
  quote: >-
    atingindo, no seu apogeu, um máximo de 54 alunos, tendo como Reitor o Rev. Jorge Aquino; como coordenador pedagógico
    o Diácono Edson Pimentel, e como Capelão o Rev. Miguel Uchoa.
- source: drp2-memorias-decada-viii
  quote: >-
    Em julho de 2003, sete clérigos e Ministros Leigos (Reverendos: Maurício Coelho, Siméa Meldrum, Estevão Menezes,
    Jorge Aquino e Fábio Vasconcelos, Gustavo Gilson e a ML Roberta Araújo) foram comigo a Limuru, Quênia, África,
    para participar da Consulta da EFAC
- source: aquino-quem-e
  quote: >-
    o Rev. Jorge foi nomeado e atuou como Cônego teológico pela Diocese do Japi até sua fusão com a Diocese Anglicana
    de Votorantim, fez parte do Movimento Anglicano no Brasil (Atual Diocese Anglicana no Brasil), e Diretor de
    Formação da Free Church of England.
- source: aquino-quem-e
  quote: >-
    Ao ser recepcionado pela Free Protestant Episcopal Church Worldwide Communion, foi nomeado como Coordenador
    Geral de Teologia e Educação Cristã na Comunhão Mundial.
- source: aquino-quem-e
  quote: >-
    O Reverendo Jorge foi incardinado à Prelazia Católico Anglicana da Sagrada Família, onde atuou como Cônego Teológico,
    Chanceler e Reitor do Centro Paulista de Estudos Anglicanos (EaD).
- source: aquino-quem-e
  quote: >-
    Convidado para atuar na Igreja Anglicana Ortodoxa, também serviu como Cônego teológico, se envolvendo na formação
    do clero por meio de seu curso de imersão no anglicanismo, na criação de seus novos Cânones e na elaboração
    de seu Livro de OraçãoComum, na condiçãode Custódio do Livro.
- source: testemunho-mantenedor-2026-10-08-aquino
  quote: Hoje aquino está na IGREJA ANGLICANA ORTODOXA MISSIONÁRIA, do Bispo Jonas Santana Moreira
