  - source: rcor-drv-ord-ose-1999
    quote: >-
      Jorge Aquino, freqüentador assíduo desta catedral desde o seu tempo de seminarista, de há muito queria fazer-se
      anglicano.
  notes: >-
    Ordenação diaconal de quatro 'ministros em trânsito' vindos de outras denominações (Severino Abel, ex-capuchinho;
    Ricardo Múcio, Luiz Marcos e Jorge Aquino, ex-presbiterianos), no culto em que se instituiu a Ordem de Santo
    Estêvão. O pregador fala como bispo diocesano ('Em 17 meses do nosso episcopado'), isto é, Robinson Cavalcanti.
    Local não informado (o texto menciona 'esta catedral').
- order: presbyterate
  date: '2000-04-19'
  place: Capela do Campus Universitário da UFRN, Natal (RN)
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: aquino-ordenacao-2000
    quote: >-
      Minha ordenação presbiterial na Igreja Anglicana ocorreu no dia 19 de abril de 2000, na Capela do Campus Universitário
      do Rio Grande do Norte. O bispo ordinante foi D. Robinson Cavalcanti, da Diocese de Recife
  - source: aquino-quem-e
    quote: >-
      O Reverendo Jorge, vem de tradição presbiteriana – onde atuou como pastor por sete (7) anos -, mas transferiu-se
      para a Igreja Episcopal Anglicana do Brasil quando da Eleição de D. Robinson Cavalcanti como seu bispo diocesano.
      Ordenado diácono e presbítero por ele
  - source: rcor-drv-presb-jorge-abel
    quote: MENSAGEM AO PRESBITERADO DE JORGE & ABEL
  - source: rcor-drv-presb-jorge-abel
    quote: Natal, 19/04/2000.
  - source: rcor-drv-presb-jorge-abel
    quote: >-
      Como bispo, sinto-me honrado em presidir este momento histórico, das primeiras ordenações anglicanas em terras
      potiguares.
  notes: >-
    Celebração ecumênica, com padres católicos romanos e pastores evangélicos presentes. Sermão do bispo diocesano
    (Robinson Cavalcanti), que preside as primeiras ordenações anglicanas no Rio Grande do Norte. 'Jorge' e 'Abel'
    são Jorge Aquino e Severino Abel da Silva, ordenados diáconos juntos em 31/07/1999.
