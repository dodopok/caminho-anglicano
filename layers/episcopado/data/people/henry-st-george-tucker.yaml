        157c. Frederick Foote Johnson (1905-1932) que, em 1912, sagrou Henry St. George Tucker como bispo de Kyoto.
  notes: >-
    CORRIGIDO: o pôster diz que Frederick Foote Johnson sagrou Tucker em 1912; as fontes dizem que o sagrante principal
    foi John McKim, bispo de Tóquio, em Kyoto, na festa da Anunciação (25/03/1912). Johnson não aparece. Co-sagrantes
    divergem: a Spirit of Missions menciona os bispos Cecil (South Tokyo), Foss (Osaka) e Andrews (Hokkaido) participando
    do rito e "the laying-on of hands by the four bishops present"; a lista da Wikipédia dá McKim, Rollestone Fyffe
    (Rangoon) e Arthur Lea (Kyushu). Os co_sagrantes aqui (Cecil, Foss, Andrews, só com os sobrenomes dados pela
    fonte) são inferência de que os "four bishops present" foram McKim + esses três, que tiveram papéis no rito;
    ver dúvidas. Confirma o registro de pontes-estrangeiras.json (som-1912-06) com uma segunda fonte primária. O
    Living Church Annual não dá os nomes dos co-sagrantes, só as sés (South Tokyo e Osaka, ambas inglesas). A lista
    da Wikipédia dá Fyffe (Rangoon) e Arthur Lea (Kyushu), o que NÃO bate com a fonte primária.
