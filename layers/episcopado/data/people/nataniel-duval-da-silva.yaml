biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Pelotas,
  RGS, Brasil (1911-10-28). Ordenado diácono em nov/1932 e presbítero em fev/1936. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
