biography: >-
  Diácono na Igreja da Ascensão, foi ordenado presbítero em 15/04/1940; foi depois reitor da igreja São Lucas e
  primeiro secretário-executivo do Conselho Nacional.
sources:
- source: wit-1940-04-18
  quote: the Rev. Curtis Fletcher, Jr., deacon at the Ascension, were advanced to the priesthood.
- source: cant-novas-igrejas-2024
  quote: >-
    a São Lucas teve como reitores os reverendos Osborn, Custis Fletcher Jr., Gaudêncio Vergara dos Santos, Diamantino
    Bueno, os cônegos Jorge Macedo e Celso Franco de Oliveira (hoje bispo emérito da DARJ), e os reverendos Eduardo
    Coelho Grillo (atual bispo diocesano) e Luiz Caetano Grecco Teixeira.
  page: '100'
- source: costa2021
