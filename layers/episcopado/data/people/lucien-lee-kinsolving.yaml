    em 1/06/1890 (domingo da Trindade).
  status: probable
  sources:
  - source: wp-en-kinsolving
    quote: The young Americans arrived at Porto Alegre on April 21, 1890, accompanied by four Brazilians
  - source: wp-en-ieab
    quote: where they held the first Anglican Mass in Portuguese on 1 June 1890.
- type: other
  date: '1892-05-23'
  description: >-
    Primeira convocação (não autorizada) da missão, Casa da Missão, Porto Alegre, 23-26/05/1892: presentes os revs.
    Morris, Brown, Meem e Kinsolving e os catequistas Boaventura, Brande e Cabral.
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Presentes: reverendos Morris, Brown, Meem e Kinsolving, e catequistas Boaventura, Brande e Cabral. Presidida
      por Kinsolving e secretariada por Cabral.
- type: other
  date: '1898-05-31'
  description: >-
    Convocação extraordinária de 31/05/1898 elege Kinsolving bispo (eleição brasileira como indicação, validada
    pela igreja americana).
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Assunto: eleição de Kinsolving. A eleição dos brasileiros era apenas um indicação. Kinsolving foi oficialmente
      eleito pela igreja americana.
- type: other
  date: 1898-10
  description: >-
    Eleição de Kinsolving: convocação em Porto Alegre (30/05/1898) e Câmara dos Bispos (out. 1898) como 'Bishop
    for the United States of Brazil' (Art. X da Constituição).
  status: confirmed
  sources:
  - source: som-1898-11
    quote: >-
      Also, that the Bev. Lucien Lee Kinsolving has been duly elected, in accordance with Article X. of the Constitution,
      a Bishop for the United States of Brazil.
  - source: wp-en-kinsolving
    quote: >-
      On May 30, 1898, pursuant to Bishop Peterkin's advice, clergy and laity gathered in Porto Alegre and elected
      Kinsolving to become their bishop
- type: other
  date: '1898'
  description: >-
    Em 1898 uma convocação em Porto Alegre elegeu por unanimidade, no primeiro escrutínio, o Rev. Lucien Lee Kinsolving
    como bispo; a Câmara dos Bispos, reunida em Washington, considerou a eleição irregular e procedeu a nova eleição,
    que o escolheu por unanimidade.
  status: probable
  sources:
  - source: drv-kinsolving-ivo
    quote: No primeiro escrutinio saiu eleito unânimemente o Rev. Lucien Lee Kinsolving.
  - source: drv-kinsolving-ivo
    quote: procederam a nova eleição conforme a maneira usual
- type: other
  date: '1903-06-13'
  description: >-
    O Seminário Teológico da Igreja Episcopal Brasileira foi inaugurado em 13/06/1903 na Igreja do Salvador, Rio
    Grande (RS), com William Cabell Brown como primeiro reitor; foi fechado temporariamente por Kinsolving em 1910
    e reaberto cerca de dez anos depois sob Morris. Três de seus alunos chegaram ao episcopado: Athalício Pithan,
    Egmont Krischke e Plínio Lauer Simões.
  status: probable
  sources:
  - source: drv-kinsolving-ivo
    quote: >-
      Afinal, a 13 de Junho de 1903, justa, 13 anos após ter sido estabelecida a Igreja Episcopal Brasileira, concretizou-se
      a sua alta pretensão.
  - source: drv-kinsolving-ivo
    quote: >-
      Dêsse número, três, já atingiram o episcopado: os Revmos. Drs. Athalicio Pithan, Egmont Machado Krischke e
      Plínio Lauer Simões
- type: other
  date: '1905-01-01'
  description: >-
    Segundo a biografia, a transferência da missão da Sociedade Missionária da Igreja Americana para a Junta de
    Missões ocorreu em 1º/01/1905 e a Convenção Geral criou então o distrito missionário do Brasil Meridional, com
    Kinsolving como primeiro bispo; outras fontes datam a criação do distrito em 1907.
  status: contested
  sources:
  - source: drv-kinsolving-ivo
    quote: Esse arranjo efetuou-se em 1º de Janeiro de 1905.
  - source: drv-kinsolving-ivo
    quote: >-
      a Convenção Geral criou um distrito missionário no Brasil Meridional, e designou o mesmo Revmo. Kinsolving
      como seu primeiro Bispo
- type: other
  date: '1908-05-31'
  description: >-
    Primeiro culto da Igreja Episcopal Brasileira em vernáculo no Rio de Janeiro: 31/05/1908, celebrado pelo Rev.
    William Cabell Brown em templo anglicano emprestado; no ano seguinte instalou-se a Capela do Redentor (rua Haddock
    Lobo).
  status: probable
  sources:
  - source: drv-kinsolving-ivo
    quote: >-
      Em 31 de Maio de 1908, 20 anos depois de se fixar no Rio Grande do Sul, realizou a Igreja Episcopal o seu
      primeiro ofício divino em vernáculo, na Capital da República.
- type: other
  date: '1929-12-18'
  description: >-
    Lucien Lee Kinsolving faleceu em 18/12/1929 em Forest Hills (Nova York); nascera em 14/05/1862 em Middleburg
    (Virgínia). O prefácio do livro, assinado por Egmont Machado Krischke em Porto Alegre, Páscoa de 1961, informa
    que o autor usa o pseudônimo 'Ivo'.
  status: confirmed
  sources:
  - source: drv-kinsolving-ivo
    quote: A 18 de Dezembro de 1929, em Forest Hills, passou dos trabalhos da terra
  - source: drv-kinsolving-ivo
    quote: Nasceu Lucien Lee Kinsolving a 14 de Maio de 1862, em Middleburgo
  - source: drv-kinsolving-ivo
    quote: Pôrto Alegre, Páscoa de 1961.
