  discrepancies:
  - field: principal_consecrator
    value: george-william-peterkin
    sources:
    - source: costa2021
      quote: >-
        Em 06 de janeiro de 1899, doze bispos participaram da consagração de Kinsolving na Igreja de São Bartolomeu
        (Nova York), em cerimônia liderada pelo bispo George Peterkin, então presidente da Igreja Episcopal dos
        Estados Unidos.
      page: '55'
  notes: >-
    Fonte primária (Spirit of Missions, fev. 1899): Dudley presidiu; Potter e Lawrence 'imediatamente' assistentes
    (co-sagrantes formais); Doane e Peterkin apresentantes; G. H. Kinsolving pregador; Scarborough, Walker, Talbot,
    Wells e McVickar 'taking part in the laying-on of hands'. A lista da Wikipédia dá Dudley, Doane e Scarborough
    como sagrantes. Kinsolving foi eleito 'Bishop for the United States of Brazil' sob o Art. X da Constituição
    (bispo para igreja estrangeira), não para distrito missionário (criado só em 1907). Epifania = 6 de janeiro.
    A biografia não nomeia o sagrante principal; pregador: George Herbert Kinsolving, bispo do Texas (grafado 'Henbert').
    Pôster: Kinsolving "consagrado em 6 de janeiro de 1899" — CONFIRMADO por fonte primária. Sagrante principal:
    Thomas Underwood Dudley, bispo de Kentucky ("presided"). Co-sagrantes imediatos: Potter (Nova York) e Lawrence
    (Massachusetts); também impuseram as mãos Doane, Peterkin, G. H. Kinsolving, Scarborough, Walker, Talbot, Wells
    e McVickar. A Wikipédia diz "led by the Presiding Bishop" (impreciso) e a lista de sucessão dá Dudley, Doane
    e Scarborough. Nomes completos de Potter (Henry Codman Potter) e Lawrence (William Lawrence) inferidos das sés
    em 1899. A tese diz que doze bispos participaram, sem nomeá-los; a citação de Ivo (1962) fala em 8 bispos presentes
    e no sermão de George Herbert Kinsolving, bispo do Texas. A afirmação de que Peterkin era 'presidente da Igreja
    Episcopal' é da tese.
