  place: St. Bartholomew's Church, Nova York
  jurisdiction: dmsb
  office: missionary
  principal_consecrator: thomas-underwood-dudley
  co_consecrators:
  - ethelbert-talbot
  - george-herbert-kinsolving
  - george-william-peterkin
