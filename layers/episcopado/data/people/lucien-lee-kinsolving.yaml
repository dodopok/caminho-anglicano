biography: >-
  Missionário norte-americano (VTS) que chegou ao Brasil em 1889/1890 com James W. Morris; sagrado em 1899 primeiro
  bispo episcopal para o Brasil; bispo missionário do Sul do Brasil até 1928.
sources:
- source: wp-en-kinsolving
  quote: >-
