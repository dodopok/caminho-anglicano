      SAID, John Lewis (lnd)c/o Rt Rev E K Sherrill, Caixa Postal 549, ZC-OO, Rio de Janeiro, GB, Brazil Mssy Overseas
      Dept to Central Bra 66
  notes: >-
    Missionário enviado pelo Departamento de Missões no exterior da Igreja Episcopal dos EUA ao Brasil Central em
    1966, com correspondência aos cuidados do Bispo Sherrill (Caixa Postal 549, Rio de Janeiro). Antes: cura em
    Muncie (1958-60), reitor em Plainfield, Indiana (1960-64) e capelão/cura em Indianápolis (1964-66), conforme
    o verbete de 1968 (a edição de 1965 o dava ainda reitor de St. Mark, Plainfield).
