id: bianca-daebs-seixas-almeida
name: Bianca Daebs Seixas Almeida
biography: >-
  Bianca Daebs Seixas Almeida foi ordenada diácona em 09/12/2017, na Capela do Cemitério Britânico, no episcopado
  de João Câncio Peixoto Filho, e presbítera em 08/12/2018, e integra o clero da Diocese Anglicana do Recife (IEAB-DAR).
sources:
- source: rta-livro35
  quote: 'Diaconato: 9 dezembro de 2017.'
- source: rta-livro35
  quote: >-
    em dezembro de 2017, no episcopado de Dom João Câncio Peixoto Filho, fui ordenada Reverenda da Igreja Episcopal
    Anglicana do Brasil, na Capela do Cemitério Britânico
- source: rta-livro35
  quote: 'Presbiterado: 8 de dezembro de 2018.'
- source: dar-clero-diocesano
  quote: Revda. Bianca Daebs Seixas Almeida
ordinations:
- order: diaconate
  date: '2017-12-09'
  place: Capela do Cemitério Britânico, Ladeira da Barra, Salvador (BA)
  jurisdiction: ieab
  status: confirmed
  sources:
  - source: rta-livro35
    quote: 'Diaconato: 9 dezembro de 2017.'
  - source: rta-livro35
    quote: >-
      em dezembro de 2017, no episcopado de Dom João Câncio Peixoto Filho, fui ordenada Reverenda da Igreja Episcopal
      Anglicana do Brasil, na Capela do Cemitério Britânico
  notes: >-
    O texto menciona o episcopado de Dom João Câncio Peixoto Filho (Diocese Anglicana do Recife/Bahia) sem dizer
    expressamente quem ordenou.
- order: presbyterate
  date: '2018-12-08'
  jurisdiction: ieab
