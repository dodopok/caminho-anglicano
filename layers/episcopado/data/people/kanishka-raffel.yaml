birth:
  date: '1964-11-06'
  sources:
  - source: gacl-wp-raffel
    quote: '| birth_date       = {{birth date and age|1964|11|6|df=y}}'
biography: >-
  Ordenado diácono em 1996, em Sydney, por Harry Goodhew, e presbítero no mesmo ano, em Canberra-Goulburn, por George
  Browning, foi sagrado em 28/05/2021 por Geoffrey Smith como 13º arcebispo de Sydney. Em abril de 2023 passou a
  co-vice-presidente do Conselho dos Primazes da GAFCON e, em 2026, é conselheiro do Global Anglican Council.
sources:
- source: gace-gac-page
  quote: He was ordained deacon in 1996 in Sydney and priest in 1996 in Canberra-Goulburn
- source: gacl-wp-raffel
  quote: 1996 (as deacon)<br>by [[Harry Goodhew]]
- source: gacl-wp-raffel
  quote: 1996 (as priest)<ref name="ACR 2021" /> <br>by [[George Browning (bishop)|George Browning]]
- source: gacl-wp-raffel
  quote: >-
    On 28 May 2021, Raffel was consecrated a bishop by [[Geoffrey Smith (bishop)|Geoffrey Smith]], and installed
    as archbishop in Sydney's St Andrew's Cathedral.
- source: gace-gac-page
  quote: He was consecrated as the thirteenth Archbishop of Sydney in May 2021.
- source: ai-2023-04-22-gafcon-chair
  quote: >-
    and a co-vice chair, the Most Rev. Kiniska Raffel, Archbishop of Sydney. ... Hands were laid upon Archbishops
    Uchoa and Raffel in prayer for their new ministries by the other primates.
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Its regional advisers all lead “extra-provincial or missionary districts connected to the GAFCON movement.”
    They are Archbishop Kanishka Raffel of Sydney (a diocesan bishop in the Anglican Church of Australia), and Bishops
    Andy Lines of the Anglican Network in Europe, Jay Behan of the Church of Confessing Anglicans in Aotearoa New
    Zealand, Glenn Davies of the Diocese of the Southern Cross (which serves parishes that have broken away from
    the Anglican Church of Australia), and Yassir Eric of EKKIOS, a missionary movement forming congregations in
    predominantly Muslim regions.
- source: gace-gac-page
  quote: Advisors ... The Most Revd Kanishka Raffel Archbishop of the Diocese of Sydney
