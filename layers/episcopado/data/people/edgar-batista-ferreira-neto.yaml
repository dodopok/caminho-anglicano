biography: >-
  Edgar Batista Ferreira Neto foi ordenado diácono em 18/12/1999, na Paróquia do Espírito Santo, e presbítero em
  05/08/2000, na Paróquia do Calvário (Janga, Paulista, PE), ambas por Robinson Cavalcanti, na Diocese do Recife
  (IEAB). Em 2002 deixou a IEAB, no primeiro dos dois cismas que, segundo o histórico da IEAB, a diocese sofreu
  naquele ano, junto com Paulo Garcia e outros clérigos. Foi sagrado bispo da IECB em 18/07/2019 e é bispo diocesano
  da Diocese da Mata Norte, em Pernambuco. Participou como co-sagrante da sagração de Jean Clayton de Albuquerque
  do Nascimento, auxiliar da Diocese de Vitória de Santo Antão, em 06/02/2020.
