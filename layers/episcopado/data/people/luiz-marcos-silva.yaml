  start: '1998-10-03'
  status: confirmed
  sources:
  - source: d2s31-reconc
    quote: >-
      O Rev. Luiz Marcos da Silva, ose, tornou-se o primeiro ministro residente a partir de 3 de outubro de 1998.
  - source: d2s31-reconc
    quote: Em 15 de novembro de 1995 foi estabelecido oficialmente um Ponto Missionário na cidade de Caruaru.
  notes: >-
    Local: Diocese Anglicana do Recife, Paróquia Anglicana da Reconciliação (Caruaru, PE). Primeiro ministro residente
    da comunidade de Caruaru, que fora estabelecida como ponto missionário em 15/11/1995 por iniciativa da Paróquia
    da Santíssima Trindade (hoje Catedral). A página o chama de "Rev." já em 1998; outras fontes datam suas ordenações
    em 1999 e 2000.
