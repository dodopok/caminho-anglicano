# yaml-language-server: $schema=../../schemas/person.json
id: luiz-marcos-silva
name: Luiz Marcos Silva
aliases:
- Luis Marcos
- Luiz Marco
- Luiz Marcos
- Rev. Luiz Marcos
biography: >-
  Luiz Marcos Silva, originário da ABU de Maceió, foi ordenado diácono em 31/07/1999, na cerimônia que instituiu
  a Ordem Evangélica de Santo Estevão Mártir, e presbítero em 06/05/2000, em Caruaru, por Robinson Cavalcanti, na
  Diocese Anglicana do Recife. É membro da Ordem Evangélica de Santo Estevão Mártir.
sources:
- source: rcor-drv-ord-ose-1999
  quote: Luiz Marcos é cria da ABU de Maceió
- source: rcor-drv-ord-ose-1999
  quote: ORDENAÇÃO DE DIÁCONOS E INSTITUIÇÃO DA ORDEM EVANGÉLICA DE SANTO ESTEVÃO MÁRTIR - 31/07/99.
- source: rcor-drv-presb-luiz-marcos
  quote: ORDENAÇÃO PRESBITERAL – REV. LUIZ MARCOS, CARUARÚ, 06 DE MAIO DE 2000
- source: rcor-drv-presb-luiz-marcos
  quote: a primeira cerimônia de ordenação presbiteral da nossa Igreja na cidade de Caruaru
- source: rcor-drv-ordens-dar
  quote: Rev. Luiz Marcos Silva
- source: d2s28-m15
  quote: Os outros três ordinandos são todos ex-pastores presbiterianos
- source: d2s29-m19
  quote: ORDENAÇÃO PRESBITERAL – REV. LUIZ MARCOS
- source: d2s29-m19
  quote: um servo de Deus, de profícuo pastorado presbiteriano e assessoria a evangelização estudantil na ABU
ordinations:
- order: diaconate
  date: '1999-07-31'
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-ord-ose-1999
    quote: ORDENAÇÃO DE DIÁCONOS E INSTITUIÇÃO DA ORDEM EVANGÉLICA DE SANTO ESTEVÃO MÁRTIR - 31/07/99.
  - source: rcor-drv-ord-ose-1999
    quote: Luiz Marcos é cria da ABU de Maceió
  notes: >-
    Ordenação diaconal de quatro 'ministros em trânsito' vindos de outras denominações (Severino Abel, ex-capuchinho;
    Ricardo Múcio, Luiz Marcos e Jorge Aquino, ex-presbiterianos), no culto em que se instituiu a Ordem de Santo
    Estêvão. O pregador fala como bispo diocesano ('Em 17 meses do nosso episcopado'), isto é, Robinson Cavalcanti.
    Local não informado (o texto menciona 'esta catedral').
- order: presbyterate
  date: '2000-05-06'
  place: Caruaru-PE
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-presb-luiz-marcos
    quote: ORDENAÇÃO PRESBITERAL – REV. LUIZ MARCOS, CARUARÚ, 06 DE MAIO DE 2000
  - source: rcor-drv-presb-luiz-marcos
    quote: a primeira cerimônia de ordenação presbiteral da nossa Igreja na cidade de Caruaru
  - source: rcor-drv-presb-luiz-marcos
    quote: Esta cerimônia se reveste de uma alegria maior pela longa amizade que une o bispo ao ordinando
  - source: d2s29-m19
    quote: ORDENAÇÃO PRESBITERAL – REV. LUIZ MARCOS
  - source: d2s29-m19
    quote: a primeira cerimônia de ordenação presbiteral da nossa Igreja na cidade de Caruaru
  - source: d2s29-m19
    quote: 06 DE MAIO DE 2000
  - source: d2s29-m19
    quote: >-
      Rev. Luiz Marcos, você foi um aspirante, um postulante, um candidato, um ministro leigo e um diácono exemplar
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti). Luiz Marcos, ex-pastor presbiteriano e membro da OSE, ordenado
    diácono em 31/07/1999; sobrenome não informado. Primeira ordenação presbiteral da IEAB realizada em Caruaru
    (véspera do 3º domingo da Páscoa). Ordenando que era ex-pastor presbiteriano e assessor da evangelização estudantil
    da ABU, membro da Ordem Evangélica de Santo Estevão Mártir. O bispo agradece o tempo que Luiz Marcos dedicou
    à Missão do Amor Cristão em Maceió, à Secretaria Diocesana de Educação, ao seminário (SAET) e ao departamento
    de Missão da IEAB, e à paróquia local, a seu pároco e ao coadjutor 'Rev. Edmar' pelo apoio na 'lamentável crise'
    recente da diocese. O texto é o sermão do bispo diocesano, que fala em primeira pessoa como quem confere a ordem;
    a página não traz assinatura, e o bispo diocesano em exercício era Robinson Cavalcanti (instalado em 19/10/1997).
