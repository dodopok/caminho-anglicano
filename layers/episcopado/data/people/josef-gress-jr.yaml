biography: >-
  Josef Gress Jr. nasceu em Memmingen (Alemanha) em 11/6/1921. Foi ordenado diácono em dezembro de 1953, por Athalício
  Pithan, e presbítero em dezembro de 1961, por Egmont Krischke, no Distrito Missionário do Sul do Brasil, e foi
  transferido para a Igreja Episcopal do Brasil em 25/4/1965.
