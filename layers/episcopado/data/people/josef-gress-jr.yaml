biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Memmingen,
  Alemanha (1921-06-11). Ordenado diácono em dez/1953 e presbítero em dez/1961. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
