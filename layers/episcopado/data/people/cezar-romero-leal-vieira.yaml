# yaml-language-server: $schema=../../schemas/person.json
id: cezar-romero-leal-vieira
name: Cézar Romero Leal Vieira
biography: Pessoa citada em documentos históricos da Diocese do Recife e da IEAB (ver afirmações).
sources:
- source: drv-declaracao-32
  quote: Rev. Cézar Romero Leal Vieira
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Cézar Romero Leal Vieira
  - source: drv-nota-esclarecimento-2006
    quote: César Romero Leal Vieira
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Cézar Romero Leal Vieira … Os clérigos não atenderam à convocação
      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Cézar Romero Leal Vieira … Recife, 23 de agosto de 2005.
    page: 560-561
  - source: dard1-carta-bispos-2004
    quote: Rev. Cézar Romero Leal Vieira Paróquia Anglicana Jardim das Oliveiras
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado. Local: Paróquia Anglicana
    Jardim das Oliveiras. Consta na carta aberta de 17/09/2004, assinada pela Diocese do Recife (então ainda da
    IEAB); a carta indica a paróquia ou missão de cada signatário. Listado entre os ministros em reconhecimento
    de ordem (nome na carta: Cézar Romero Leal Vieira).
- jurisdiction: ieab-dar
  role: other
  role_description: ministro em reconhecimento de ordem
  status: confirmed
  sources:
  - source: darl3-carta-0904
    quote: >-
      Ministros em Reconhecimento de Ordem: Rev. Cézar Romero Leal Vieira Paróquia Anglicana Jardim das Oliveiras
  notes: >-
    Local: Diocese Anglicana do Recife, Paróquia Anglicana Jardim das Oliveiras. Listado entre os "Ministros em
    Reconhecimento de Ordem" (clérigos vindos de outras igrejas) na carta de 17/09/2004.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: secretário diocesano de Missão e Evangelismo
  status: confirmed
  sources:
  - source: darl3-setubal
    quote: Rev. Cezar Romero de L. Vieira – Secretário Diocesano de Missão e Evangelismo
  notes: >-
    Delegado clerical ao Concílio Diocesano Extraordinário de 26/02/2005 (Carta de Setúbal), com o cargo indicado
    na lista de delegados.
