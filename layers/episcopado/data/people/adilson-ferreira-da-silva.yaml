name: Adilson Ferreira da Silva
aliases:
- Rev. Adilson Ferreira
biography: >-
  Diácono ordenado em 10/09/2005 na Diocese Anglicana do Recife (IEAB); em 2006, responsável pela Missão Anglicana
  Monte Sião (Umbuzeiro, PB).
sources:
- source: d2s31-diacs
  quote: >-
    Rev. Rodrigo Espiúca, Rev. Senomar Teixeira, Rev. Adilson Ferreira, Rev. Fernando Gonçalves, Rev. Rodson Ricardo,
    Rev. Júlio Gomes, Rev. Sílvio Freitas e Rev. Ricardo Domingos
ordinations:
- order: diaconate
  date: '2005-09-10'
  place: Catedral Anglicana da Santíssima Trindade, Recife (PE)
