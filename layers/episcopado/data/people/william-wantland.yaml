id: william-wantland
name: William Wantland
biography: >-
  Bispo aposentado da Igreja Episcopal (ECUSA), ex-diocesano de Eau Claire; um dos celebrantes da confirmação coletiva
  de Akron (Ohio), em 14/03/2004.
sources:
- source: darb2-akron
  quote: William Wantland, ex-diocesano de Eau Claire
events:
- type: other
  date: '2004-03-14'
  description: >-
    Em 14/03/2004 (domingo), em Akron (Ohio, EUA), Dom Robinson Cavalcanti foi, a convite de leigos, um dos celebrantes
    de uma confirmação coletiva de 110 pessoas de paróquias da Diocese de Ohio (Igreja Episcopal), realizada no
    auditório da paróquia ortodoxa romena local, junto com cinco bispos aposentados da Igreja Episcopal: Maurice
    Benitez (ex-diocesano do Texas), C. FitzSimmons Allison (ex-diocesano da Carolina do Sul), William Wantland
    (ex-diocesano de Eau Claire), Alex Dickson (ex-diocesano de West Tennessee) e William Fox (ex-assistente em
    Oklahoma e Texas). O bispo diz ter comunicado o evento previamente ao arcebispo de Cantuária; o bispo primaz
    da IEAB escreveu à Igreja Episcopal sobre a participação.
  status: confirmed
  sources:
