      Amanhã, com a ordenação do Rev. Giuliano Arraes Luna Cruz, estaremos atingindo a marca de 42 Presbíteros.
  - source: drp2-ord-diac-2003-12-27
    quote: Olinda/PE — 27/12/2003
  - source: d2s29-m41
    quote: >-
      Amanhã, com a ordenação do Rev. Giuliano Arraes Luna Cruz, estaremos atingindo a marca de 42 Presbíteros.
  notes: >-
    Ordenação presbiteral anunciada no sermão de 27/12/2003 para o dia seguinte ('Amanhã'); a fonte não relata a
    cerimônia em si. Anunciada no sermão da véspera como 42º presbítero do episcopado de Dom Robinson; o sermão
    não confirma que a cerimônia ocorreu nem o local. Ordenação anunciada, no sermão de 27/12/2003, para o dia seguinte
    (28/12/2003), sem o local; a página não registra o ato em si. O texto é o sermão do bispo diocesano, que fala
    em primeira pessoa como quem confere a ordem; a página não traz assinatura, e o bispo diocesano em exercício
    era Robinson Cavalcanti (instalado em 19/10/1997).
