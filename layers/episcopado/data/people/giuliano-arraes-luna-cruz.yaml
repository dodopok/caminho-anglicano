id: giuliano-arraes-luna-cruz
name: Giuliano Arraes Luna Cruz
full_name: Giuliano Arraes Luna Cruz
biography: >-
  Giuliano Arraes Luna Cruz foi ordenado diácono em 28 de dezembro de 2002 e presbítero em 28 de dezembro de 2003,
  por Robinson Cavalcanti, na Diocese Anglicana do Recife (IEAB). Em 2004 constava entre os clérigos licenciados
  da diocese e integrou a Comissão de Arquitetura e Arte Eclesiástica.
