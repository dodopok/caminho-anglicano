biography: >-
  Emmanuel Milingo nasceu em 13/6/1930, foi ordenado padre em 31/8/1958 e sagrado bispo em 1/8/1969 pelo papa Paulo
  VI, com Sergio Pignedoli e Emmanuel Nsubuga como co-sagrantes. Foi excomungado em 24/9/2006 e reduzido ao estado
  leigo em 17/12/2009. Bispo católico independente, participou de três sagrações episcopais, entre elas as de Eduardo
  Rocha Quintella (2011) e Ronaldo Melo (2014).
