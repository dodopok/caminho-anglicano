biography: >-
  Ex-arcebispo católico romano de Lusaka (Zâmbia), nascido em 13/06/1930; sagrado bispo em 01/08/1969 por Paulo
  VI em Kampala (Uganda); excomungado após sagrar quatro bispos em 24/09/2006 e reduzido ao estado leigo em 17/12/2009.
