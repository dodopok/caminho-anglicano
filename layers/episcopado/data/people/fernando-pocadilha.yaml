# yaml-language-server: $schema=../../schemas/person.json
id: fernando-pocadilha
name: Fernando Poçadilha
biography: >-
  Presbítero citado entre os clérigos que permaneceram no Distrito Missionário da Amazônia (IEAB) quando este foi
  criado, em 2000, desmembrado da Diocese Anglicana do Recife.
sources:
- source: darl3-hist4
  quote: >-
    Ficaram no DAM os reverendos: Amaro Daniel, Abimael Rodrigues, Fernando Poçadilha, Raimundo Nonato e Josephino
    Lobato
affiliations:
- jurisdiction: ieab-dam
  role: priest
  start: '2000'
  status: probable
  sources:
  - source: darl3-hist4
    quote: >-
      Ficaram no DAM os reverendos: Amaro Daniel, Abimael Rodrigues, Fernando Poçadilha, Raimundo Nonato e Josephino
      Lobato
  notes: >-
    O texto diz que esses clérigos permaneceram no Distrito Missionário da Amazônia quando o Sínodo Geral da IEAB
    aprovou sua criação, em 2000, e o território da diocese do Recife passou a ser os nove estados do Nordeste.
    Sem sobrenome completo nem ordem recebida na fonte; a ordem (presbítero) é a que o texto atribui a todos os
    'reverendos' da lista.
