biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Vera Cruz,
  SP, Brasil (1932-10-20). Ordenado diácono em dez/1957 e presbítero em mar/1959. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
