id: alberto-batista-pires
name: Alberto Batista Pires
full_name: Alberto Batista Pires
biography: >-
  Alberto Batista Pires consta como ordenado presbítero por Clóvis Erly Rodrigues, em São Luís (MA), com vínculo
  eclesiástico desconhecido, e como ex-padre admitido na IEAB em 1991.
sources:
- source: dard2-hist3
  quote: Alberto Pires ( em São Luís-MA , vínculo eclesiástico desconhecido)
- source: kickhofel-1995
  quote: >-
    CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1991 - … Alberto Batista Pires (ex-padre, admitido)
  page: '373'
ordinations:
- order: presbyterate
  date: null
  jurisdiction: ieab-dar
  ordained_by: clovis-erly-rodrigues
  status: probable
  sources:
  - source: dard2-hist3
    quote: Alberto Pires ( em São Luís-MA , vínculo eclesiástico desconhecido)
  - source: darl3-hist3
    quote: Alberto Pires ( em São Luís-MA , vínculo eclesiástico desconhecido)
  - source: darl3-hist3
    quote: Foram ordenados, durante o seu período os seguintes reverendos
  notes: >-
    Citado por Robinson Cavalcanti entre os ordenados no período do bispo Clóvis Erly Rodrigues (1986-1997); em
    2006 em São Luís (MA), com vínculo eclesiástico desconhecido para o autor. A identificação com Alberto Batista
    Pires é por nome apenas. Data e local não constam; o ordenante é entendido como o bispo diocesano da época.
    Ordenação durante o episcopado de Clóvis Erly Rodrigues na diocese (1986-1997), conforme lista de Dom Robinson
    Cavalcanti; o texto não dá data nem local e não diz expressamente "ordenado por"; ordenante inferido do período.
    A lista separa os ordenados ao presbiterado (aqui incluídos) dos ordenados "apenas ao Diaconato".
