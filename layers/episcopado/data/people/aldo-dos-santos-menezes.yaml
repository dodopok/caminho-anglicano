biography: >-
  Aldo dos Santos Menezes é formado em Filosofia pela Universidade de São Paulo, professor de Religiões e Crenças,
  autor e antigo editor das editoras Vida Nova e Mundo Cristão. Foi ordenado presbítero por Robinson Cavalcanti
  na Diocese Anglicana do Recife em 2006, provavelmente em 01/07. Atuou como ministro auxiliar em João Pessoa (PB)
  e, em 2009, constava na junta de capelães examinadores da diocese. Foi instituído em 03/01/2010 deão da Con-Catedral
  Anglicana da Ressurreição, em João Pessoa. Fontes posteriores o descrevem também como ministro ordenado da Igreja
  Anglicana do Cone Sul da América.
