    Orar pelos Ministros no Brasil ligados canonicamente a Diocese do Recife: Rev. Aldo Menezes e Rev. Gilberto
    Hinkel
- source: d2s04-aldo-esperanza
  quote: >-
    Formado em Filosofia pela Universidade de São Paulo (USP), é professor de Religiões e Crenças, pesquisador e
    palestrante no campo da religião.
