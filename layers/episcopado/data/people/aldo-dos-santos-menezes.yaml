  notes: >-
    Local: Concatedral Anglicana da Ressurreição, João Pessoa-PB. A posse foi anunciada para 2010-01-03 em texto
    de 2009-12-08 (data de início conforme o anúncio); em 2010-06-14 já assina como deão. Em 2010-11-29 ainda é
    deão; em 2011-10-25 o artigo o apresenta apenas como presbítero do Arcediagado PB/RN, na Região Eclesiástica
    1. Local: Concatedral Anglicana da Ressurreição, João Pessoa, PB. Instituição e posse como deão da Concatedral
    Anglicana da Ressurreição (João Pessoa), em culto presidido por Dom Robinson Cavalcanti, que descreve o ato
    como "troca de guarda" na direção espiritual da comunidade. O sermão cita apenas "Aldo Menezes"; a identificação
    com Aldo dos Santos Menezes (presbítero da diocese, ordenado em 2006) se apoia no nome. Local: Concatedral Anglicana
    da Ressurreição (João Pessoa). Assinatura de artigo datado de 14/06/2010. Local: Concatedral Anglicana da Ressurreição,
    João Pessoa-PB. A posse é noticiada em 24/03/2010 (com vídeo); a nota não informa a data da cerimônia. Julho
    de 2010: a Concatedral é "uma Paróquia Emancipada da Diocese do Recife". Local: Concatedral Anglicana da Ressurreição
    (João Pessoa-PB; Arcediagado PB/CE). Em exercício em outubro e novembro de 2010 (a posse como deão fora em 03/01/2010).
    Em exercício em outubro/novembro de 2010: a página de 30/10/2010, capturada em 01/11/2010, lista matéria assinada
    pelo Revmo. Deão Aldo Menezes.
