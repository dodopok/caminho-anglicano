# yaml-language-server: $schema=../../schemas/person.json
id: aldo-dos-santos-menezes
name: Aldo dos Santos Menezes
biography: >-
  Aldo dos Santos Menezes foi ordenado presbítero por Robinson Cavalcanti na Diocese Anglicana do Recife (DAR) em
  2006, provavelmente em 01/07. Foi instituído em 03/01/2010 deão da Con-Catedral Anglicana da Ressurreição, em
  João Pessoa (PB), e atuou como ministro auxiliar e membro da junta de capelães examinadores da diocese.
sources:
- source: drp2-breves-08-2006
  quote: >-
    Aconteceu na Paróquia Anglicana Jardim das Oliveiras o 1º Retiro do Clero, no primeiro semestre de 2006, no
    dia 01/07.
- source: drp2-breves-08-2006
  quote: no Culto Solene de Ordenação Presbiteral do Rev. Aldo Menezes
- source: darl1-9500
  quote: >-
    Rev. Aldo Menezes é Presbítero da Diocese do Recife; Deão da Con-Catedral Anglicana da Ressurreição, em João
    Pessoa-PB, e que tomará posse dia 03/01/2010.
- source: darb2-sermao-deao-conego
  quote: >-
    Sermão de Instituição do Deão Aldo Menezes e do Cônego Luiz Souza de França Concatedral Anglicana da Ressurreição
    João Pessoa (PB), 03.01.2010
- source: dard2-com-pb
  quote: CON-CATEDRAL ANGLICANA DA RESSURREIÇÃO Revmo. Deão Aldo Menezes
- source: dard1-com-pbrnce-2009a
  quote: 'Ministro Encarregado: Ven. Arc. Rev. Luiz de Souza França Auxiliar: Rev. Aldo Menezes'
- source: dard1-eletivos-2009a
  quote: Rev. Aldo dos Santos Menezes (3 anos)
- source: drp-boletim-oracao-2006
