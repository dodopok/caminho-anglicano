# yaml-language-server: $schema=../../schemas/person.json
id: jeferson-nilson-santos
name: Jeferson Nilson Santos
full_name: Jeferson Nilson Santos
aliases:
- Dom Jefferson Nilson
- Jefferson Nilson
- Jefferson Nilson Santos
- Monsenhor Reverendo Jefferson Nilson Santos
biography: >-
  Pároco da Paróquia Sublime Peregrino (Boqueirão, Curitiba), incardinado na IATB em 2010 e sagrado Bispo Prelado
  da Prelazia Anglicana Ortodoxa/Anglicana Tradicional de Curitiba em 08/12/2013 por Rui Costa Barbosa.
sources:
- source: lia-iatb-noticias-2014
  quote: >-
    No domingo dia 08 de dezembro de 2013, realizou-se na Cidade de Curitiba, na Paróquia do Sublime Peregrino a
    ordenação episcopal do Monsenhor Reverendo Jefferson Nilson Santos.
- source: lia-aeci-clergy
  quote: The Rt. Rev. Jeferson Nilson Santos Bishop Parana State
ordinations:
- order: episcopate
  date: '2013-12-08'
  place: Paróquia do Sublime Peregrino, Boqueirão, Curitiba (PR)
  jurisdiction: iatb
  principal_consecrator: rui-costa-barbosa
  co_consecrators:
  - fabiano-padilha
  - jose-aparecido-marques
  status: confirmed
  sources:
  - source: lia-iatb-noticias-2014
    quote: >-
      A celebração foi presidida pelo Arcebispo Provincial, Dom Rui, tendo sido concelebrada pelo Bispo da Diocese
      Thomas More, Dom +José Aparecido Marques e por Dom Fabiano Padilha, Bispo Auxiliar da Igreja Católica Antiga.
  - source: lia-iatb-noticias-2014
    quote: >-
      O Reverendíssimo Bispo Dom Jeferson foi ordenado como Bispo Prelado e cuidará da recém instituída Prelazia
      Ortodoxa Anglicana Tradicional, com sede na Cidade de Curitiba-PR.
  notes: >-
    Presidente: Rui Costa Barbosa; concelebrantes José Aparecido Marques (bispo da Diocese Thomas More) e Fabiano
    Padilha (bispo auxiliar da 'Igreja Católica Antiga'). A IATB não usa o termo 'co-sagrantes'; os dois concelebrantes
    são listados como tais com essa ressalva. Em abril/2014 a Prelazia aparece como 'Prelazia ortodoxa Anglicana
    de Curitiba', com Padilha como bispo auxiliar.
affiliations:
- jurisdiction: iatb
  role: other
  role_description: presbítero (incardinado)
  start: '2010'
  end: '2013-12-08'
  status: probable
  sources:
  - source: lia-iatb-noticias-2010
    quote: >-
      O Rev. Jefferson na oportunidade confirmou o seu desejo de incardinar-se e à sua comunidade na IATB, tendo
      aproveitado a oportunidade da visita para consolidar sua incardinação.
  notes: >-
    Local: Paróquia Sublime Peregrino, Curitiba. Notícia da visita pastoral de Rui Costa Barbosa à região de Curitiba
    (agrupada entre as de julho de 2010); o texto não traz a data da incardinação.
