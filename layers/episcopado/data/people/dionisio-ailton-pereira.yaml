biography: >-
  Nascido em Cachoeira de Minas (MG) em 12/03/1969, foi ordenado sacerdote católico em 27/07/2000 por Ricardo Pedro
  Chaves Pinto Filho, arcebispo de Pouso Alegre, e atuou por 14 anos na Igreja Católica Romana, que deixou em 2014
  para tornar-se sacerdote anglicano na Paróquia de São Jorge, em Pouso Alegre; foi também um dos fundadores da
  Igreja Católica da Fé. Foi sagrado bispo sufragâneo da Diocese Anglicana no Brasil em 12/10/2021, na Catedral
  Anglicana de São Paulo, tendo Roger Douglas Bird como ordenante principal e Bernardo da Ressurreição e Rafael
  de Emaús como co-ordenantes. Após o falecimento de Bird, em fevereiro de 2023, assumiu o governo da diocese como
  bispo diocesano.
