biography: >-
  Nascido em 12/03/1969 em Cachoeira de Minas (MG); padre católico romano ordenado em 27/07/2000; cofundador da
  Igreja Católica da Fé; sagrado bispo sufragâneo/auxiliar da Diocese Anglicana no Brasil em 12/10/2021; assumiu
  o governo da Diocese após a morte de Roger Bird (2023) e a desvinculou da Catedral no fim de 2023; vereador em
  Pouso Alegre.
