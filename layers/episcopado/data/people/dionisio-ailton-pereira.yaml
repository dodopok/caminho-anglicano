    bispo 'pela Catedral Anglicana de São Paulo'. Diocese Anglicana no Brasil (Movimento Anglicano no Brasil, ligado
    à Catedral Anglicana de São Paulo). O trecho segue com "sendo auxiliado por dom Bernardo ..." (nome incompleto
    no OCR do trecho capturado). Notícia da SICB datada de 13/10/2021; a data exata (12/10/2021) consta em obra
    de 2024 sobre as novas igrejas anglicanas e não na notícia. A SICB diz ter sido convidada a participar como
    co-sagrante e ter sido recebida 'de forma muito digna e respeitosa' pelo clero anglicano e por Roger Bird. Na
