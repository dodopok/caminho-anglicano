id: raimundo-francisco-de-figueiredo
name: Raimundo Francisco de Figueiredo
biography: >-
  Raimundo Francisco de Figueiredo foi ordenado diácono em 18 de junho de 2005 e presbítero em 8 de abril de 2006
  pelo bispo Robinson Cavalcanti, na Con-Catedral Anglicana da Ressurreição, em João Pessoa, na Diocese Anglicana
  do Recife. Foi coadjutor da Con-Catedral em 2006, arcediago adjunto e, depois, deão e arcediago do Arcediagado
  PB/RN, além de pároco da Paróquia Anglicana Vida Nova e membro da Comissão de Direito Canônico. Desde agosto de
  2021 integra a equipe pastoral da Catedral Anglicana Comunhão, em João Pessoa.
sources:
- source: drp2-ord-diac-jp-2005
  quote: >-
    Sermão de Ordenações Diaconais Cláudio Brito, Flávio Adair Torres, Gustavo Leite Castello Branco, Lindinalva
    Medeiros e Raimundo Figueiredo Con-Catedral Anglicana da Ressurreição João Pessoa (PB), 18 de Junho de 2005.
- source: drp2-convite-presb-jp-2006
  quote: >-
    convida V.Sa. para o Culto Solene de Ordenação Presbiteral dos Reverendos: Cláudio Luiz Figueiredo de Brito
    Flávio Adair Torres Soares Lindinalva Medeiros de Oliveira Raimundo Francisco de Figueiredo Local: Con-Catedral
    Anglicana da Ressurreição
- source: drp-boletim-oracao-2006
  quote: >-
