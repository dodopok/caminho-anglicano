  - source: f8cal-incl-paroco
    quote: Seus quatro anos de pastorado e testemunho profético junto com sua família
  notes: >-
    Em novembro de 2010 atuava em Campo Grande (MS), onde a Capela da Inclusão existia havia sete meses; a missão
    pertence ao Distrito Missionário do Oeste. A notícia de 2010 não informa o distrito nem o cargo exato, e Fronteiras
    & Debates (2022) não nomeia o reverendo da Capela da Inclusão. Gospelmais (c. 2013) liga o reverendo Carlos
    Eduardo Calvani a artigo publicado no Campo Grande News, o que sustenta a identificação com o clérigo da ficha.
    Fundou o ponto de pregação que virou a Capela da Inclusão (hoje Paróquia Anglicana da Inclusão), em Campo Grande
    (MS). A primeira missa foi noticiada em 14/03/2010; em 2014 mudou-se para Aracaju e a capela passou a ser atendida
    mensalmente pelo Rev. Hugo Armando Sanchez.
