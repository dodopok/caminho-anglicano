biography: >-
  Carlos Eduardo Brandão Calvani é teólogo, graduado em Teologia (FUV/UNIDA), mestre e doutor em Ciências da Religião
  pela Universidade Metodista de São Paulo e professor da Universidade Federal de Sergipe; lecionou também na Unifil,
  em Londrina (PR). Clérigo anglicano da IEAB, atuou em paróquias e missões em Curitiba, São Paulo, Londrina, Vitória
  e Campo Grande e assumiu em 2001 a coordenação do Centro de Estudos Anglicanos. Como clérigo da Diocese Anglicana
  de São Paulo, integrou em 2004 a comissão especial dos bispos sobre sexualidade humana. Em 2010 mudou-se para
  Campo Grande (MS), onde a Paróquia Anglicana da Inclusão teve início e onde se colocou à disposição para celebrar
  casamentos entre pessoas do mesmo sexo. Em 2014, ao mudar-se para Aracaju (SE), passou à Diocese Anglicana do
  Recife.
