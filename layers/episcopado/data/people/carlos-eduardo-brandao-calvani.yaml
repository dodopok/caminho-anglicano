- Revdo. Dr. Carlos Calvani
biography: >-
  Carlos Eduardo Brandão Calvani é doutor em Ciências da Religião pela Universidade Metodista de São Paulo e professor
  efetivo da Universidade Federal de Sergipe, tendo também lecionado na Unifil, em Londrina (PR). Clérigo anglicano
  da IEAB, atuou em paróquias e missões em Curitiba, São Paulo, Londrina, Vitória e Campo Grande e coordenou o Centro
  de Estudos Anglicanos. Como clérigo da Diocese Anglicana de São Paulo, integrou em 2004 a comissão especial dos
  bispos sobre sexualidade humana. Em 2010, em Campo Grande (MS), colocou-se à disposição para celebrar casamentos
  entre pessoas do mesmo sexo.
sources:
- source: cabs-estudos-religiao-2009
