events:
- type: other
  date: '2004-03-16'
  description: >-
    Em 16 de março de 2004, em Porto Alegre, reuniu-se pela primeira vez a Comissão Especial nomeada pelo Primaz
    da IEAB para refletir sobre os sinais de crise na Comunhão Anglicana e seus desdobramentos na IEAB; presidida
    por Dom Jubal Pereira Neves, definiu três eixos: eclesiologia anglicana (Carlos Eduardo Calvani e Joanildo Burity),
    colegialidade (Maurício Andrade e Erika Furukawa) e implicações canônicas da sagração de Gene Robinson (Jubal
    Pereira Neves e Francisco de Assis da Silva).
  status: confirmed
  sources:
  - source: d2s31-comis
    quote: >-
      Reuniu-se na tarde de ontem (16/03/04), em Porto Alegre a Comissão Especial nomeada pelo Primaz da IEAB para
      refletir sobre os sinais de crise na Comunhão Anglicana e, particularmente dos desdobramentos dessa crise
      na IEAB.
  - source: d2s31-comis
    quote: A reunião foi presidida pelo Revmo Bispo Dom Jubal Pereira Neves
  - source: d2s31-comis
    quote: Implicações canônicas (Dom Jubal Pereira Neves e Rev. Francisco de Assis da Silva).
- type: other
  date: '2004-03-16'
  description: >-
    Em 16/03/2004 o Primaz da IEAB nomeou, a pedido da Câmara dos Bispos, uma Comissão Especial (assessoria e recomendação
    ao Primaz e à Câmara dos Bispos, sem poder de decisão), com ênfase em eclesiologia, colegialidade e implicações
    canônicas; presidida por Jubal Pereira Neves e composta pelos bispos Jubal Neves e Maurício Andrade, pelos presbíteros
    Francisco de Assis da Silva e Carlos Eduardo Brandão Calvani e por dois leigos (Joanildo Burity e Érica Furukawa).
  status: confirmed
  sources:
  - source: d2s32-carta-esclarecimento
    quote: >-
      Desde a nomeação e início do trabalho, em 16 de março de 2004, da Comissão Especial da IEAB, nomeada pelo
      Bispo Primaz, a pedido da Câmara dos Bispos
  - source: d2s32-carta-esclarecimento
    quote: >-
      a Comissão não tem nenhum mandato de decisão, mas tão somente de assessoria e recomendação ao Bispo Primaz
      e à Câmara dos Bispos
  - source: d2s32-carta-esclarecimento
    quote: 'com ênfase em três eixos: eclesiologia, colegialidade e implicações canônicas'
