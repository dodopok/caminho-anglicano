  - source: dard2-us-v
    quote: >-
      Domingo, dia 14.06. Com o templo superlotado, tivemos a festa das Ordenações Presbiterais dos reverendos:
      Roger Verhorn e Michael Hickenbotham
  notes: >-
    Ordenação anunciada em 25/05/2009, quando o bispo Robinson Cavalcanti viajou aos Estados Unidos (retorno previsto
    para 27 de junho) para visitar paróquias sob a jurisdição e supervisão episcopal da Diocese do Recife, na Flórida
    e no Estado de Washington; a nota não traz data nem local exatos da ordenação, e o trecho de local ("em Jeffrey
    Thimsen") é ambíguo. Registrada como provável por ser um anúncio. Ordenação presbiteral no domingo 14/06/2009,
    junto com Roger Verhorn. O mesmo diário grafa o nome como Michael Hickenbotham e, na véspera, como "Mark" Hickinbotham
    entre os ordinandos; o prenome permanece em dúvida. O templo não é nomeado (relato datado de Oak Harbor); a
    autoria da ordenação por Robinson Cavalcanti é inferida do relato.
