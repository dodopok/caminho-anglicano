    Silva bispo coadjutor, no primeiro escrutínio, para suceder Jubal Neves.
  status: confirmed
  sources:
  - source: acns-2010-10-xico-eleito
    quote: >-
      No domingo, dia 25 de outubro de 2010, foi realizado concílio extraordinário da Diocese Sul-Ocidental (DSO),
      com sé em Santa Maria, RS, para a eleição de novo bispo coadjutor, que a seu tempo, sucederá o atual bispo
      (Dom Jubal Neves) como diocesano.
  - source: acns-2010-10-xico-eleito
    quote: >-
      Ganhou a eleição, no primeiro escrutínio, o Rev. Cônego Francisco de Assis da Silva, atual secretário geral
      da IEAB.
- type: other
