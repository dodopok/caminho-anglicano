  - source: ieab-secretaria
    quote: Revmo. Bispo Jubal Neves, Emérito
biography: >-
  Ordenado diácono em janeiro de 1966, em Santa Maria, e presbítero em 1967, em Jaguarão, assinou em 1974 o "Parecer
  Sul-Ocidental" sobre as mulheres e as ordens sacras e foi enviado ao Uruguai em 1977, com Clóvis Erly Rodrigues.
  Foi secretário-geral da IEAB de 1983 a 1993. Eleito em 1993, no 45º Concílio Extraordinário, para suceder Olavo
  Ventura Luiz, foi sagrado em 19/09/1993 por Sumio Takatsu e outros bispos, e foi bispo diocesano da Diocese Sul-Ocidental
  (Santa Maria, RS) até 2011, passando a emérito. Em 25/10/2010 a diocese elegeu Francisco de Assis da Silva bispo
  coadjutor para sucedê-lo.
