  notes: >-
    Pároca da Paróquia das Boas Novas (Caaporã, PB) e encarregada da Missão Maria Madalena (João Pessoa); transferida
    para a DAA em c.2025. Nome completo: Eliane Cristina Vieira. Formalmente da DAR, em disponibilidade para a Diocese
    da Amazônia. Presbítera em 2021.
events:
- type: other
