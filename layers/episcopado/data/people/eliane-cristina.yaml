id: eliane-cristina
name: Eliane Cristina
full_name: Eliane Cristina Vieira
aliases:
- Eliane Cristina Vieira
- Revda. Eliane Cristina
biography: >-
  Presbítera da Diocese Anglicana do Recife, foi ministra encarregada em João Pessoa (2021) e serviu na Paróquia
  Anglicana Boas Novas, em Caaporã (PB), e na Missão Maria Madalena; em 2025 foi transferida para a Diocese Anglicana
  da Amazônia.
sources:
- source: dar-2021-joaopessoa
  quote: Ministra Encarregada, Revda. Eliane Cristina.
- source: ieab-2021-eliane
  quote: >-
    sou Eliane Cristina Vieira, professora e presbítera da Igreja Episcopal Anglicana do Brasil, servindo na Paróquia
    Anglicana Boas Novas, em Caaporã/PB, e à Missão Maria Madalena, em João Pessoa/PB.
- source: dar-clero-diocesano
  quote: Revda. Eliane Cristina Vieira (Em disponibilidade para a Diocese da Amazônia)
- source: dar-2025-paulino-diac
