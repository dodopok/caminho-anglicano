biography: >-
  Sagrado em 13/10/1842, em Richmond, bispo assistente da Virgínia, por Alexander Viets Griswold, William Meade,
  Ives e Whittingham; tornou-se bispo da Virgínia em 1862, com a morte de Meade.
sources:
