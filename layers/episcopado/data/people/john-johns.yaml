id: john-johns
name: John Johns
full_name: John Johns
aliases:
- Bp. Johns
wikidata: Q6241907
biography: >-
  Sagrado em 13/10/1842, em Richmond, bispo assistente da Virgínia, por Alexander Viets Griswold, William Meade,
  Ives e Whittingham; tornou-se bispo da Virgínia em 1862, com a morte de Meade. Participou de quatro sagrações
  episcopais, entre elas as de Gregory Thurston Bedell e Francis McNeece Whittle.
sources:
- source: perry-1895
  quote: RIGHT REVEREND JOHN JOHNS, D.D., LL.D.
- source: perry-1895
  quote: >-
    Johns was consecrated assistant bishop of Virginia, in the Monumental Church, Richmond, Oct. 13, 1842. His consecrators
    were Bishops Griswold, Meade, Ives, and Whittingham.
- source: wp-en-histlist
  quote: >-
    | [[John Johns]] | [[Alexander Viets Griswold|12]] [[William Meade|22]] [[Levi Silliman Ives|25]] | 1842
- source: perry-1895
  quote: On the death of Meade (1862) he became bishop of Virginia.
- source: perry-1895
  quote: >-
    His consecration as coadjutor bishop of Ohio took place in St. Paul's Church, Richmond, Va., Oct. 13, 1859.
    The consecrators were Bishops Meade, Mcllvaine, Johns, Eastburn, Upfold, Rutledge, Horatio Potter, and Payne.
- source: wp-en-histlist
  quote: >-
    | [[Gregory T. Bedell]] | [[William Meade|22]] [[Charles Pettit McIlvaine|28]] [[John Johns|39]] | 1859
- source: perry-1895
  quote: >-
    His consecration took place at St. Paul's, Alexandria, Va., April 30, 1868. His consecrators were Bishops Johns,
    Alfred Lee, and Bedell.
- source: wp-en-histlist
  quote: >-
    | [[Francis McNeece Whittle]] | [[John Johns|39]] [[Alfred Lee (bishop)|38]] [[Gregory T. Bedell|67]] | 1868
