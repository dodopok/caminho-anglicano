  quote: RIGHT REVEREND JOHN JOHNS, D.D., LL.D.
- source: perry-1895
  quote: >-
    Johns was consecrated assistant bishop of Virginia, in the Monumental Church, Richmond, Oct. 13, 1842. His consecrators
    were Bishops Griswold, Meade, Ives, and Whittingham.
