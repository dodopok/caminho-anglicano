biography: >-
  Ordenado diácono em setembro de 1940, por Athalício Pithan, e presbítero em fevereiro de 1943, por William Matthews
  Merrick Thomas, atuou no distrito missionário do Brasil Central (DMCB) e foi transferido para a Igreja Episcopal
  do Brasil em 25/04/1965.
