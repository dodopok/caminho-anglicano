biography: >-
  Ordenado diácono em outubro de 2000 por Robinson Cavalcanti, em João Pessoa (PB), e presbítero em dezembro de
  2001, foi clérigo da Diocese Anglicana do Recife (IEAB), na Paróquia da Reconciliação. Membro da Ordem de São
  Francisco (OSF), foi seu guardião.
