  - field: date
    value: '2000-10-29'
    sources:
    - source: rcor-drv-ord-marcio-claudio-lilian
      quote: Paróquia da Ressurreição – João Pessoa, PB 29 de Outubro de 2000.
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti) na ordenação diaconal de Márcio, Cláudio e Lílian, todos membros
    de ordens religiosas (OSE ou franciscana). O sermão diz só 'Cláudio'; é Cláudio de Souza Linhares, OSF: em 15/12/2001
    um sermão ainda o chama 'Diácono Cláudio Linhares', à espera do presbiterado, e em janeiro de 2002 ele era o
    único Cláudio entre os reverendos da diocese, enquanto Cláudio Norberto da Silva ainda era postulante (foi ordenado
    diácono em 13/07/2002). A data do cabeçalho do sermão é 29/10/2000, mas o texto cita a festa de São Simão e
    São Judas (28/10), a data que Lílian Linhares, ordenada na mesma cerimônia, dá para o seu diaconato; o mantenedor
    adotou 28/10/2000. Datas da biografia do pároco na página da Paróquia da Reconciliação (julho de 2004); a página
    não indica local nem ordenante (bispo diocesano à época: Robinson Cavalcanti).
