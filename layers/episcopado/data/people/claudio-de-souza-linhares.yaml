  - source: rta-orildo-lilian-2001
    quote: o Diácono Cláudio Linhares será ordenado somente no próximo sábado, na Paróquia Boas Novas,
  - source: rta-orildo-lilian-2001
    quote: na formosa Caaporã, na vizinha Paraíba, juntamente com o Reverendo Israel Cardoso
  - source: ieabrecife-clero-2002
    quote: Cláudio de Souza Linhares, OSF
  notes: >-
