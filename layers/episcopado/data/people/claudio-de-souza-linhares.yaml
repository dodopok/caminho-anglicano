events:
- type: other
  date: '2004-09-01'
  description: >-
    Documento 'Não sairemos', assinado pelo bispo sufragâneo Filadelfo Oliveira e clérigos e leigos da Diocese Anglicana
    do Recife, reafirmando o vínculo com a IEAB independentemente das decisões do diocesano.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em 1º de setembro de 2004, foi publicado o texto intitulado Não sairemos, o primeiro documento que enfrentou
      Robinson quando este sinalizou que romperia com a Província, assinado pelo bispo sufragâneo, Filadelfo Oliveira,
      e vários outros clérigos e leigos da Diocese
    page: '217'
  - source: costa2021
    quote: >-
      Assinaram este documento: Dom Filadelfo Oliveira Neto, ose (Bispo Sufragâneo da DAR); Revmo. Sérgio L. Andrade
      (Deão da Catedral Anglicana da SS. Trindade)
    page: '217'
- type: other
  date: 2003-06
  description: >-
    Em junho de 2003, as duas paróquias de Caruaru (Videira Verdadeira e Reconciliação) se juntaram numa única paróquia,
    que manteve o nome Paróquia Anglicana da Reconciliação por escolha dos membros.
  status: confirmed
  sources:
  - source: d2s31-reconc
    quote: >-
      Em Junho de 2003, as duas Paróquias de Caruaru (Videira Verdadeira e Reconciliação) se juntaram e formaram
      uma única Paróquia, e foi escolhido pelos membros a permanência do nome Paróquia Anglicana da Reconciliação.
  - source: d2s31-reconc
    quote: Seu primeiro ministro foi o Rev. Edmar Pimentel
