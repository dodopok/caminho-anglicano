  - source: d2s31-reconc
    quote: 'Diaconal: 28/10/2000 - Ordenação Presbiteral: 22/12/2001'
  - source: d2s31-reconc
    quote: 'Pároco: Rev. Claudio de Souza Linhares, OSF'
  notes: >-
    Ordenação anunciada, num sermão de 15/12/2001, para o sábado seguinte (22/12/2001) em Caaporã-PB; em janeiro
    de 2002 ele já consta como "Rev." na lista do clero. Ordenante não informado (bispo diocesano: Robinson Cavalcanti).
    Cerimônia anunciada no sermão de 15/12/2001 (sábado) para “o próximo sábado”, isto é, 22/12/2001; o texto é
    anterior ao ato e não confirma que ele ocorreu nessa data nem nomeia o ordenante. O sermão associa o evento
    ao Rev. Israel Cardoso, autor do rito, sem dizer que este também seria ordenado. Datas da biografia do pároco
    na página da Paróquia da Reconciliação (julho de 2004); a página não indica local nem ordenante (bispo diocesano
    à época: Robinson Cavalcanti).
