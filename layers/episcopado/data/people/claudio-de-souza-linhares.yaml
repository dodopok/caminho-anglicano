  - source: costa2021
    quote: Rev. Cláudio Linhares, osf (Paróquia da Reconciliação)
    page: '217'
  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Paróquia da Reconciliação;
    OSF. Em 2020–2026 arcediago da Região Norte da DAR Listado no clero diocesano da DAR (página consultada em 2026-10).
    Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife e foi um dos 13 que pediram à Câmara dos Bispos
    supervisão episcopal alternativa (decreto de 16/09/2004), mantendo a comunhão com a IEAB. Início e fim do vínculo
    não informados. Signatário de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise de 2004-2005. Tese: 'Cláudio
    Linhares' (Paróquia da Reconciliação, Caruaru); hoje arcediago do Arcediagado Oeste. Identificação com o nome
    da base é inferência.
