id: nerva-cot-aguilera
name: Nerva Cot Aguilera
ordinations:
- order: episcopate
  date: '2007-06-10'
  place: Catedral da Santíssima Trindade, Havana (Cuba)
  jurisdiction: null
  office: suffragan
  principal_consecrator: andrew-hutchison
  co_consecrators:
  - jubal-pereira-neves
  - katharine-jefferts-schori
  status: confirmed
  sources:
  - source: cant-ec-2007-05
    quote: >-
      foi sagrada na catedral da Santíssima Trindade, na cidade de Hava- na, Cuba — a primeira mulher bispa da América
      Latina, - Nerva Cot Aguilera.
  - source: cant-ec-2007-05
    quote: Mas também para d. Jubal Neves, da Diocese Sul-Ocidental, foi um privilégio ser bispo co-sagrante.
  - source: cant-ec-2007-05
    quote: >-
      O Primaz da Igreja Anglicana do Canadá, D, Andrew Hutchinson, presi- diu a cerimônia (Bispo Sagrante). A bispa
      presidente dos Estados Unidos também es- tava presente, como co-sagrante.
  notes: >-
    Relato de testemunhas (Carmen Etel Gomes e Jubal Neves) no Estandarte Cristão. Sagrante principal: Andrew Hutchison,
    primaz do Canadá (OCR: "Hutchinson"); co-sagrantes: Jubal Neves (IEAB) e a bispa presidente da TEC (Katharine
    Jefferts Schori, não nomeada no trecho). Primeira bispa anglicana da América Latina. Mostra Jubal Neves (IEAB)
    como co-sagrante fora do Brasil.
