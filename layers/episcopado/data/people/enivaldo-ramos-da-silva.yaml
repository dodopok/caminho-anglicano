# yaml-language-server: $schema=../../schemas/person.json
id: enivaldo-ramos-da-silva
name: Enivaldo Ramos da Silva
aliases:
- Enivaldo
- Enivaldo Ramos
- Rev. Enivaldo
biography: >-
  Postulante vinculado ao PMA da Transfiguração (Mogi das Cruzes-SP), foi ordenado diácono em 6/4/2013 por Miguel
  Uchôa, na primeira ordenação presidida por esse bispo diocesano, e consta na lista de pastores da Diocese do Recife
  em 2017.
sources:
- source: darn2-assembleia-sulsudeste-2009
  quote: Rev. Ivo Xavier de Oliveira e Postulante Enivaldo Ramos da Silva
- source: darn2-santo-andre-2010
  quote: o Postulante Enivaldo Ramos e Paulo Quaresma (também do PMA da Transfiguração )
- source: dar-2013-diaconos-mogi
  quote: >-
    A noite, no templo da Igreja Metodista em Mogi das Cruzes – SP, em um culto abençoado, o bispo diocesano, Dom
    Miguel Uchôa, ordenou ao diaconato os postulantes Enivaldo (PM da Transfiguração - Mogi das Cruzes – SP) e Fernando
    Henrique (Missão Betesda – Belo Horizonte – MG). Foi a primeira ordenação presidida por nosso diocesano.
- source: dar-2013-bispos-mogi
  quote: >-
    No domingo, o bispo diocesano estará ordenando as sagradas ordens de diácono, Fernando Henrique "Missão Betesda
    – Minas Gerais" e Enivaldo Ramos "PM da Transfiguração – São Paulo".
- source: adr-pastores-2017
  quote: Enivaldo Ramos da Silva
ordinations:
- order: diaconate
  date: '2013-04-06'
  place: Templo da Igreja Metodista, Mogi das Cruzes-SP (5ª Assembleia Arcediagal)
  jurisdiction: diocese-anglicana-recife
  ordained_by: miguel-uchoa
  status: confirmed
  sources:
  - source: dar-2013-diaconos-mogi
    quote: >-
      A noite, no templo da Igreja Metodista em Mogi das Cruzes – SP, em um culto abençoado, o bispo diocesano,
      Dom Miguel Uchôa, ordenou ao diaconato os postulantes Enivaldo (PM da Transfiguração - Mogi das Cruzes – SP)
      e Fernando Henrique (Missão Betesda – Belo Horizonte – MG). Foi a primeira ordenação presidida por nosso diocesano.
  - source: dar-2013-bispos-mogi
    quote: >-
      No domingo, o bispo diocesano estará ordenando as sagradas ordens de diácono, Fernando Henrique "Missão Betesda
      – Minas Gerais" e Enivaldo Ramos "PM da Transfiguração – São Paulo".
  - source: adr-pastores-2017
    quote: Enivaldo Ramos da Silva
  notes: >-
    Primeira ordenação presidida por Miguel Uchoa como bispo diocesano; o bispo sufragâneo Evilásio Tenório estava
    'ao seu lado'. Sobrenome não informado. O anúncio prévio (05/04/2013) previa a ordenação 'no domingo'; a notícia
    posterior situa-a na noite de sábado, 06/04/2013.
