  notes: >-
    Fato (4 diáconos por Peterkin em 1893) confirmado por várias fontes; o nome deste ordenando consta só em Kickhofel.
    Data e local conforme a biografia. A monografia não informa a data: apenas que Fraga foi o segundo 'Reverendo'
    brasileiro da Igreja Episcopal, depois de Vicente Brande (1893). Ano tirado da lista do clero nacional por ordem
    de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado. A nota 42 traz '1983', erro evidente por
    1893 (visita de Peterkin em ago./set. de 1893). Citado entre os primeiros diáconos brasileiros da missão episcopal
    no Rio Grande do Sul, em 1893; a cronologia não dá dia, local nem ordenante.
