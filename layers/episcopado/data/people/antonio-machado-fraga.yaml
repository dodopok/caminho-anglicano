death:
  date: '1934'
  sources:
  - source: drv-efemerides-reb
    quote: Fundador do Anglicanismo Brasileiro (IEAB), Sacerdote e Missionário, 1934
biography: >-
  Antônio Machado Fraga foi um dos catequistas brasileiros que acompanharam os missionários americanos a Porto Alegre
  em 1890. Foi ordenado diácono em 01/09/1893 por George W. Peterkin, entre os quatro primeiros diáconos brasileiros,
  e presbítero em 13/05/1897 por Waite H. Stirling, entre os três primeiros presbíteros brasileiros. Descrito como
  fundador do Anglicanismo brasileiro, sacerdote e missionário, morreu em 1934.
