  - source: d2s20-zavala
    quote: >-
      o novo Primaz da Igreja Anglicana do Cone Sul da América (nossa Autoridade Primacial) Revmo. Hector (Tito)
      Zavala
  notes: >-
    Bispo primaz (Presiding Bishop) da Igreja Anglicana do Cone Sul da América; sucedido por Gregory Venables. Fim
    (2016) só pela Wikipédia. Primaz do Cone Sul em dezembro de 2010 (descrito como "novo" primaz), autoridade primacial
    da Diocese do Recife; enviou mensagem ao XXX Concílio (02 a 04/12/2010). Local: Igreja Anglicana do Cone Sul
    da América. Signatário da declaração como "Arcebispo do Cone Sul e Bispo de Chile". Declaração dos primazes
    do Sul Global e da FCA/GAFCON publicada no site diocesano (matéria de 15/10/2014), datada de Atlanta, 9 de outubro
    de 2014. Em exercício em out/2014. Local: Igreja Anglicana do Cone Sul da América. Matéria de 2/12/2010: o novo
    primaz do Cone Sul, a quem a Diocese do Recife chama "nossa Autoridade Primacial", enviou mensagem ao XXX Concílio
    Diocesano do Recife (2 a 4/12/2010). Eleito pelo Sínodo Provincial reunido em Buenos Aires, Argentina, de 01
    a 05/11/2010, quando era bispo da Diocese do Chile; mandato renovável de três anos. Em 02/12/2010 o site da
    Diocese do Recife o chama de "novo Primaz" e de "nossa Autoridade Primacial", ao divulgar a mensagem dele ao
    XXX Concílio Diocesano.
