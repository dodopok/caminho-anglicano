biography: >-
  Nascido em 16/10/1954, no Chile, foi ordenado diácono em 1982 e presbítero em 1984 para a Diocese do Chile. Eleito
  bispo coadjutor em 1998, foi sagrado por Maurice Sinclair e instalado como bispo diocesano em 2000. Em 04/11/2010
  foi eleito primaz da Igreja Anglicana do Cone Sul, posto que ocupou até 2016. No início de 2018 sua diocese foi
  dividida em quatro, e ele se tornou bispo de Santiago; em 04/11/2018, com a criação da Igreja Anglicana do Chile,
  foi o primeiro primaz da nova província, até se aposentar em 12/01/2025. Integrou o Conselho dos Primazes do GAFCON.
