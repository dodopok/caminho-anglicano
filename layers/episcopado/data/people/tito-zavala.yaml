id: tito-zavala
name: Tito Zavala
full_name: Héctor Zavala Muñoz
aliases:
- Archbishop Tito
- Hector Zavala Muñoz
- Héctor "Tito" Zavala Muñoz
- Héctor Zavala Muñoz
birth:
  date: '1954-10-16'
  sources:
  - source: gacl-ai-2016-zavala
    quote: Bishop Tito Zavala was born on 16 October 1954 in Chile.
biography: >-
  Ordenado diácono em 1982 e presbítero em 1984, na Diocese do Chile, foi eleito bispo coadjutor em 1998, sagrado
  por Maurice Sinclair, e instalado bispo diocesano do Chile em 2000. Foi primaz da Igreja Anglicana do Cone Sul
  de 04/11/2010 a 2016 e, com a divisão da diocese em quatro e a criação da Igreja Anglicana do Chile, em 04/11/2018,
  tornou-se bispo de Santiago e primeiro primaz da nova província, até se aposentar em 12/01/2025. Integrou o Conselho
  dos Primazes do GAFCON.
sources:
- source: gacl-wp-zavala
  quote: was ordained deacon in 1982, and priest in 1984
- source: gacl-ai-2016-zavala
  quote: >-
    He served as a parish priest in the diocese and was elected bishop-coadjutor in 1998 and was installed as diocesan
    bishop in 2000.
- source: gacl-wp-zavala
  quote: '| consecration = 1998

    | consecrated_by = [[Maurice Sinclair]]'
- source: gacl-ai-2016-zavala
  quote: was installed as diocesan bishop in 2000
- source: gacl-ai-2016-zavala
  quote: >-
    The province’s House of Bishops unanimously elected him the province’s first native-born Latin American primate
    at the 10th meeting of the General Synod on 4 November 2010. He was re-elected to a second term in 2013.
- source: gacl-wp-zavala
  quote: >-
    In early 2018 his diocese of Chile was split into four dioceses, whereupon he became the Bishop of Santiago.
- source: gacl-wp-zavala
  quote: >-
    On 4 November 2018 the four Chilean dioceses were inaugurated as a new province of the Anglican Communion, named
    the Anglican Church of Chile. Zavala was commissioned by Archbishop Justin Welby
- source: gacl-sydney-2025-chile
  quote: >-
    The occasion was the retirement of Héctor (Tito) Zavala as Primate of Chile, the consecration of Juan Esteban
    Saravia as Bishop of Santiago, and the installation of Bishop Enrique Lago as Primate of Chile.
- source: gacl-ai-2023-uxbridge
