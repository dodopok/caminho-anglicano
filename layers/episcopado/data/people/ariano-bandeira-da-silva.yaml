biography: >-
  Ariano Bandeira da Silva, nascido em Canguçu (RS) em 29/05/1970, foi ordenado diácono em dezembro de 2005 e presbítero
  em março de 2007 na Igreja Católica Romana. Foi recebido na IEAB em 2017 pelo bispo Renato Raatz e teve as ordens
  reconhecidas em 28/02/2021 pela bispa Meriglei Borges Simin.
