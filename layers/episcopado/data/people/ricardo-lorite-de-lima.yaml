- jurisdiction: iau
  role: archbishop
  status: probable
  sources:
  - source: ig-iau-2025-12-18
    quote: >-
      A Igreja Anglicana Unida (IAU) é a Província Sul-Americana da The Free Episcopal Protestant Church of England
      (FPEC). Com 128 anos de história contínua, cujo o líder éo Arcebispo Primaz, Revmo. Dom Ricardo Lorite de
      Lima. A IAU tem como Bispo moderador o Revmo. Dom Virgílio Cezar Henrique Pereira Torres.
  notes: >-
    A IAU o chama de "Arcebispo Primaz" e líder; o site da IAU o apresenta como Arcebispo Primus da FPEC, à qual
    a IAU pertence.
events:
- type: other
  date: '2004-08-06'
  description: >-
    Em abril de 2004 Ricardo Lorite iniciou aproximação com a missão brasileira da Igreja Episcopal Reformada (REC),
    organizando o ponto de pregação que viria a ser a Paróquia Anglicana Thomas Cranmer; a integração foi encerrada
    em 06/08/2004 por decisão do reverendo Sebastião Mendes (de Freitas), por divergências doutrinárias e eclesiológicas.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Em abril de 2004, teve início um processo de aproximação entre Lorite e a missão brasileira da Igreja Episcopal
      Reformada (Reformed Episcopal Church – REC).
    page: '117'
  - source: cant-novas-igrejas-2024
    quote: >-
      configuração permaneceu vigente até 6 de agosto do mesmo ano, quando o processo de integração foi encerrado
      por decisão do reverendo Sebastião Mendes.
    page: '117'
- type: other
  date: '2023-07-01'
  description: >-
    A Igreja Anglicana do Brasil (Lorite) retomou suas atividades em 01/07/2023, após tratativas com a Igreja Católico
    Anglicana Latino Americana, sob a liderança de Frei Eduardo Faria (primaz) e com Ricardo Lorite como primaz
    emérito; passou a se apresentar como 'Igreja Inclusiva'.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Através de Tratativas entre a Igreja Anglicana do Brasil e a Igreja Católico Anglicana Latino Americana, reassume
      a Igreja Anglicana do Brasil seu carisma Missionário e
    page: '120'
  - source: cant-novas-igrejas-2024
    quote: Evangelizador e retoma suas atividades a partir de 1º de Julho de 2023
    page: '121'
