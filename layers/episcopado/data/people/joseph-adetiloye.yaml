  notes: >-
    CORRIGIDO: o pôster diz que Moses Scott "consagrou Joseph Abiodun Adetiloye como bispo da diocese da Lagos";
    Adetiloye foi sagrado em 1970 como bispo de EKITI (só foi transladado para Lagos em 1985). O SAGRANTE NÃO FOI
    ENCONTRADO: nenhuma fonte (Igreja da Nigéria, DACB, Wikipédia, Wikidata) nomeia quem o sagrou. Scott era arcebispo
    da África Ocidental em 1970 (1969–1981, cf. wp-scott), o que torna a afirmação do pôster plausível, mas não
    comprovada. FECHA A LACUNA: sagrante principal = arcebispo da Província da África Ocidental M. N. (C. O.) Scott,
    isto é, Moses Scott. Fonte: Africa Research Bulletin, out/1970, p. 30 (resumo de imprensa que cita "NSP 4/10"
    — jornal nigeriano de 4/10/1970). Lido como trecho da busca de texto completo do Internet Archive (OCR; "B 1913"
    é ruído de OCR, provavelmente o número da página do boletim). A data exata não está no trecho: a notícia é de
    outubro de 1970 e a fonte citada é de 4 de outubro; a pista de "18 de outubro de 1970" (sucessao-lacunas) fica
    em dúvida. Jurisdição: Igreja da Nigéria (Província da África Ocidental em 1970). Confirma a pista do pôster
    da IAB (Scott -> Adetiloye). Ano inferido do início do episcopado indicado no pôster (1970); verificar.
