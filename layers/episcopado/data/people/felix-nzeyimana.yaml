id: felix-nzeyimana
name: Felix Nzeyimana
aliases:
- Núncio Apostólico Felix Nzeyimana
biography: >-
  Arcebispo da Igreja Anglicana Mundial (WAC) residente no Canadá, representou o patriarca Lwanga Tusubira, como
  núncio apostólico, no Sínodo Provincial de Imbituba (SC), de 11 a 14/7/2024. Em abril de 2026 foi nomeado primaz
  do Canadá.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    O evento contou com a presença arcebispo Felix Nzeyimana, residente no Canadá, que representou o Patriarca da
    Comunhão, o Arcebispo Lwanga Tusubira.
  page: '128'
- source: lwac-wacbr-sinodo
  quote: >-
    tivemos a presença do nosso Núncio Apostólico, Arcebispo Felix Nzeyimana, que reside no Canadá e que veio representando
    nosso Patriarca, o Arcebispo Dr. C Lwanga Tusubira.
- source: cant-novas-igrejas-2024
  quote: >-
    Nos dias 11 a 14 de julho de 2024, a cidade de Imbituba, Santa Catarina, sediou o Sínodo Provincial da Igreja
    Anglicana Mundial no Brasil.
  page: '128'
- source: lwac-wac-primates
  quote: >-
    The Most Reverend Dr. Felix Nzeyimana , formerly serving as Apostolic Nuncio to French-speaking nations , is
    appointed Primate of Canada
