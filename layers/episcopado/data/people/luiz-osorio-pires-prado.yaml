  place: Catedral da Santissima Trindade, Porto Alegre
  jurisdiction: ieab
  office: suffragan
  status: probable
  sources:
  - source: ia-wmn-1988-01
    quote: Bishop Prado, who was consecrated in July in Pérto Alegre, has the task of creating
  - source: ia-whoswho-lambeth-1988
    quote: 'PRADO PIRES: LUIZ OSORIO Born: 1943 Diocese: Southern Brazil (Suffragan 1987) Province: Brazil'
  - source: costa2021
    quote: >-
      Três anos depois, o reverendo Luiz Osório Pires Prado85 foi eleito no primeiro escrutínio – fato inédito nas
      eleições de bispos na Igreja. Foi sagrado bispo sufragâneo da Meridional, na Catedral de Santíssima Trindade,
      em Porto Alegre.
  - source: wp-pt-dioc-pelotas
    quote: >-
      Em 1987 o reverendo Luiz Osório Pires Prado foi eleito e sagrado para ser bispo sufragâneo da Diocese Meridional.
  - source: kickhofel-1995
    quote: >-
      Antes de sua sagração ao episcopado em julho de 1987, o bispo Prado trabalhou como pároco em São Leopoldo
      e como professor no Seminário Teológico, na Universidade Federal do Rio Grande do Sul, na UNISINOS e na Faculdade
      Lassalista de Canoas.
    page: '312'
  notes: >-
    Novo dado: mês (julho de 1987) e cidade (Porto Alegre). Sagrante não nomeado. World Mission News (jan/1988)
    diz que ele tinha a tarefa de criar a nova diocese no extremo sul (Pelotas); o Who's who de Lambeth 1988 o dá
    como sufragâneo da Diocese Meridional (1987).
