      bispo diocesano Cláudio Gastal nas atividades pastorais e organizar uma nova diocese com sede na cidade de
      Pelotas.
    page: '311'
  notes: >-
    Depois primeiro diocesano de Pelotas. Encarregado de organizar a futura Diocese Anglicana de Pelotas.
