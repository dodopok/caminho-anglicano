biography: >-
  Luiz Osório Pires Prado foi ordenado diácono em dezembro de 1966 e presbítero em 1967, na IEAB, e atuou como pároco
  em São Leopoldo e professor no Seminário Teológico. Eleito em 28/03/1987 bispo sufragâneo da Diocese Meridional,
  foi sagrado em julho de 1987 em Porto Alegre e encarregado de organizar a Diocese Anglicana de Pelotas. Em 1988
  foi eleito seu primeiro bispo diocesano, e resignou em janeiro de 2000. Ordenou cinco diáconos e presbíteros.
  Morreu em dezembro de 2009, como reitor do Seminário Teológico da IEAB.
