biography: >-
  Presbítero; em 2006 ligado à Igreja Anglicana Ortodoxa do Brasil (IAOB), depois secretário administrativo da Diocese
  do Recife (2009) e clérigo da Diocese de Recife da IAB (2019). Um site paroquial da IAOB o chama de "nosso Primaz
  Dom Hermany".
