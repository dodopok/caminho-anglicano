biography: >-
  Em 2006 aparece como clérigo da Igreja Anglicana Ortodoxa do Brasil (IAOB), na Paróquia Cristo Redentor, e priest-in-charge
  da igreja no Brasil; foi sagrado bispo pela IAOB em 2007, e um site paroquial da igreja o chama de primaz. Em
  28/12/2007 a IAOB deixou de existir no Brasil, com a transferência de igrejas e clérigos para a Diocese do Recife
  – Cone Sul, e ele renunciou ao episcopado para exercer o ministério presbiteral. Na Diocese do Recife foi secretário
  administrativo diocesano (2009-2012), assessor de relações inter-eclesiásticas, pároco da Paróquia Anglicana Jesus
  de Nazaré (Gaibu-PE), ministro encarregado do ponto missionário de Maceió, arcediago adjunto do Arcediagado Sul
  e deão pró-tempore da Catedral Anglicana do Bom Samaritano. Em 2019 consta como clérigo da Diocese do Recife da
  IAB, ligado à Igreja Anglicana Graça, e saiu da IAB em 2023, com o surgimento da Igreja Episcopal Unida do Brasil
  (IEUB), da qual é fundador; nela ordenou diáconos (2023) e, desde 03/2024, é bispo diocesano, em uma diocese com
  arcediagados do Nordeste e do Sudeste.
