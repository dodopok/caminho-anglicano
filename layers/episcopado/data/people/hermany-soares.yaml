events:
- type: other
  date: '2024'
  description: >-
    A Igreja Episcopal Unida do Brasil se organiza como 'Diocese do Brasil', com arcediagados do Nordeste e do Sudeste,
    e tem igreja em implantação em Assunção (Paraguai, 'Igreja Episcopal da Santa Face'); defende continuidade da
    linha de Robinson Cavalcanti e tem os antigos vídeos de Robinson Cavalcanti no canal que foi do reverendo Hermany.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: A Igreja se organiza como a Diocese do Brasil e os arcediagados do Nordeste e Sudeste.
  - source: cant-novas-igrejas-2024
    quote: Também há uma igreja sendo implantada, em Assunção no Paraguai (Igreja Episcopal da Santa Face).
  - source: cant-novas-igrejas-2024
    quote: >-
      Os antigos vídeos do bispo Robinson, publicados no antigo canal do reverendo Hermany, hoje, são mantidos no
      canal oficial da IEUB no Youtube.
- type: other
  date: null
  description: >-
    Segundo o site de uma paróquia da Província Anglicana Ortodoxa, o bispo Robinson Cavalcanti mantinha reuniões
    com o primaz da Igreja Anglicana Ortodoxa do Brasil, Dom Hermany (Soares), para uma fusão completa dessa igreja
    com a Diocese do Recife, em que Robinson atuaria como supervisor episcopal.
  status: probable
  sources:
  - source: rta-iaob-fusao
    quote: >-
      Sua Excelência Dom Robinson Cavalcanti, está mantendo reuniões com nosso Primaz Dom Hermany no sentido de
      haver uma fusão completa entre a IGREJA ANGLICANA ORTODOXA DO BRASIL e a DIOCESE DO RECIFE.
  - source: rta-iaob-fusao
    quote: agindo Dom Robinson como Supervisor Episcopal
- type: other
  date: '2026-06-16'
  description: >-
    Bispo da Rede Episcopal Brasileira (não nomeado no post) visita em Recife o bispo Hermany Soares, da Igreja
    Episcopal Unida do Brasil, e o 'pastor reverendo Tony'; a REB chama a IEUB de 'igreja irmã'.
  status: probable
  sources:
  - source: rti-ig-reb-recife-2026
    quote: >-
      Nosso bispo esteve em Recife e encontrou bispo Hermany, nosso amigo da Igreja Episcopal Unida, junto com o
      querido pastor reverendo Tony.
- type: other
  date: null
  description: >-
    Hermany Soares, como Alexandre Macedo Maia, ingressa na Igreja Anglicana – Diocese do Recife abrindo mão das
    ordens episcopais (comparação feita pelo autor)
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Alexandre Macedo Maia foi convidado pelo mesmo para ingressar na Igreja Anglicana – Diocese do Recife, porém,
      abrindo mão das ordens episcopais (à semelhança do que aconteceu com o bispo Hermany Soares).
    page: '156'
- type: resignation
  date: '2007-12-28'
  description: >-
    Extinção da Igreja Anglicana Ortodoxa (IAOB) no Brasil: igrejas e clérigos transferidos para a Diocese do Recife
    – Cone Sul por decisão do bispo Hermany Soares, que no mesmo ato renunciou ao episcopado ("abandono do episcopado"
    referido pelo usuário).
  status: probable
  sources:
  - source: fandom-iaob
    quote: >-
      A Igreja Anglicana Ortodoxa deixou de existir no Brasil, em virtude de seus membros (igrejas e clérigos) terem
      se transferido para a Diocese do Recife - Cone Sul, em 28/12/2007, por decisão de seu então bispo Hermany
      Soares, o qual no mesmo ato renunciou ao episcopado.
- type: other
  date: '2025-10-24'
  description: >-
    Hermany Soares, como bispo, prega na abertura do 1º Sínodo Diocesano Ordinário da Rede Episcopal Brasileira
    (24/10/2025, Vitória/ES) – sinal de relação fraterna IEUB–REB.
  status: confirmed
  sources:
  - source: ivoox-planando
    quote: Sermão de abertura do 1º Sínodo Diocesano Ordinário (24/10/25), 29ª Semana do Tempo Comum.
- type: resignation
  date: '2007-12-28'
  description: >-
    Pelo Termo de Adesão à Diocese do Recife, os bispos da Igreja Anglicana Ortodoxa (entre eles Dom Hermany Soares)
    renunciaram ao status e à função episcopal na IAO.
  status: confirmed
  sources:
  - source: drp2-termo-adesao-iao-2007
    quote: Os Bispos da IAO resignam “ipso facto” a esse status e função.
- type: other
  date: '2009-10-05'
  description: >-
    Balanço institucional da Diocese do Recife em outubro de 2009, apresentado pelo clero ao bispo Robinson Cavalcanti
    nos 12 anos de seu episcopado: estrutura de secretariados e arcediagados (Norte, Centro, Sul e Paraíba, mais
    o Sul/Sudeste com nove comunidades); crescimento de 14 comunidades (1997) para 45; membros de 4.371 (2005) para
    6.033 (final de 2008); aceitação do clero ordenado e reconhecimento de suas ordens pelo primaz do Cone Sul;
    e a expectativa de a diocese deixar o status de "Diocese Extraterritorial" no Cone Sul e de eleger um bispo
    sufragâneo.
  status: confirmed
  sources:
  - source: darl1-167
    quote: >-
      03. A criação estratégica do Secretariado Diocesano e Arcediagados (Norte, Centro, Sul e Paraíba), como forma
      de ter uma grande e coesa equipe de trabalho para as diversas frentes missionárias da Diocese
  - source: darl1-167
    quote: >-
      14. Ter recebido de Deus o compromisso de alargar as tendas até o sul e sudeste do Brasil, criando o Arcediagado
      Sul/Sudeste com 09 comunidades e 10 novos, dinâmicos, dedicados e abençoadores líderes.
  - source: darl1-167
    quote: >-
      Juntando o norte-nordeste, em 1997, éramos 14 comunidades (só no nordeste eram 11), e hoje somos 45 comunidades
      a maioria nascida nesse episcopado;
  - source: darl1-167
    quote: >-
      12. Ter saído de um quantitativo de 4.371 membros diocesanos em 2005, e ter podido fechar o ano de 2008 com
      6.033.
  - source: darl1-167
    quote: >-
      11. Ter tido o discernimento do Espírito para, em momento oportuno, mesmo debaixo de muita pressão emocional,
      psicológica e espiritual, ter conduzido o clero Ordenado a ser aceito pelo Primaz do Cone Sul, e ter suas
      ordens e ministérios reconhecidos.
  - source: darl1-167
    quote: >-
      21. E, desde já, agradecemos a Deus pelos projetos que caminham para a concretização, muito em breve, de nossa
      saída do status de “Diocese Extraterritorial” no Cone Sul com indicativo sinodal de caráter “Permanente e
      Regular”, além da eleição de um Bispo Sufragâneo.
- type: other
  date: 2009-10
  description: >-
    Caravana missionária de cerca de 10 dias ao Arcediagado Sul/Sudeste, com visitas ao Rio de Janeiro, Niterói,
    interior de São Paulo, Paraná, Rio Grande do Sul e Belo Horizonte, com confirmações e recepções nas comunidades;
    integraram-na o bispo Robinson Cavalcanti, o arcediago, Maurício Amazonas e Hermany Soares.
  status: probable
  sources:
  - source: d2s05-viagem-23
    quote: Foi muito bom conviver de perto com o Bispo, Rev. Beto e Rev. Hermany.
  - source: d2s05-viagem-4
    quote: >-
      Hoje temos um Arcediagado com nove comunidades, cinco Presbíteros, dois Diáconos em vias de reconhecimento
      de Ordens, e mais uma possível Ordenação Diaconal ainda para este ano.
