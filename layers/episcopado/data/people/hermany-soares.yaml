# yaml-language-server: $schema=../../schemas/person.json
id: hermany-soares
name: Hermany Soares
aliases:
- Dom Hermany
biography: >-
  Clérigo pernambucano. Em 2007 aparece como reverendo da Igreja Anglicana Ortodoxa do Brasil (IAOB, ligada à Comunhão
  Anglicana Ortodoxa); a partir de 2009 aparece como secretário administrativo da Diocese do Recife (sob o Cone
  Sul) e depois como reverendo da IAB. Associado pelo site Caminho Anglicano/usuário à fundação da IEUB.
sources:
- source: blog-joaodeca-2007-05
  quote: Igreja Anglicana Ortodoxa do Brasil (IAOB) – Distrito Missionário
- source: blog-betesda-2009-10
  quote: >-
    Dom Robinson Cavalcanti veio acompanhado do secretário administrativo da diocese, Rev. Hermany Soares
- source: iab-autor-hermany
  quote: Rev. Hermany Soares | Igreja Anglicana no Brasil
affiliations:
