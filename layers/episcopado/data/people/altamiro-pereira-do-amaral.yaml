- Dom Altamiro
biography: >-
  Bispo da Igreja Católica Anglicana (ICA) até 24/05/2018, quando a Câmara Episcopal o declarou fora da Mitra Primacial;
  co-fundador da ICA-Brasil e co-sagrante de José Fernando de Faria (29/07/2018) e de Marcos Vinícius de Souza.
