# yaml-language-server: $schema=../../schemas/person.json
id: altamiro-pereira-do-amaral
name: Altamiro Pereira do Amaral
full_name: Altamiro Pereira do Amaral
aliases:
- Dom Altamiro
biography: >-
  Bispo da Igreja Católica Anglicana (ICA) até 24/05/2018, quando a Câmara Episcopal o declarou fora da Mitra Primacial;
  co-fundador da ICA-Brasil e co-sagrante de José Fernando de Faria (29/07/2018) e de Marcos Vinícius de Souza.
sources:
- source: lica-ica-notificacao
  quote: >-
    os Bispos Dom Altamiro Pereira do Amaral, Dom Jorge dos Santos Costa e Dom Ricardo Vicente dos Anjos não mais
    integram esta Mitra Primacial
- source: lica-iaces-clero
  quote: 'Bispo co-ordenante: + Dom Altamiro Pereira do Amaral, ICA-Brasil'
affiliations:
- jurisdiction: iatb
  role: other
  role_description: bispo diocesano
  diocese: iatb-diocese-de-santa-catarina
  start: '2016'
  status: probable
  sources:
  - source: lia-iatb-home-2016-11
    quote: >-
      A Diocese do Oeste Catarinense passa a se chamar Diocese de Santa Catarina, com a extensão de sua jurisdição
      para todo estado catarinense, mantendo-se o seu bispo diocesano, Revmo. Dom Altamiro Pereira do Amaral.
  - source: lia-iatb-clerigos-2016
    quote: Revmº Dom Altamiro Pereira do Amaral Bispo Diocesano da Diocese do Oeste Catarinense
  notes: >-
    Início = primeira lista que o traz (out/2016, já como bispo diocesano); sagração não localizada nas páginas
    da IATB. Outras fontes o ligam depois à Igreja Católica Anglicana (2018).
- jurisdiction: ica-brasil
  role: bishop
  start: '2018'
  status: probable
  sources:
  - source: lica-iaces-historia
    quote: >-
      Nós, Dom Ricardo Vicente dos Anjos, Dom Jorge dos Santos Costa, Dom Altamiro Pereira do Amaral e Padre Marcos
      Vinicius de Souza
  - source: lica-iaces-clero
    quote: 'Bispo co-ordenante: + Dom Altamiro Pereira do Amaral, ICA-Brasil'
  notes: Não consta na lista de bispos do site da ICA-Brasil em 2024-2025; destino posterior não encontrado.
- jurisdiction: ica
  role: bishop
  end: '2018-05-24'
  end_reason: schism
  status: confirmed
  sources:
  - source: lica-ica-notificacao
    quote: >-
      os Bispos Dom Altamiro Pereira do Amaral, Dom Jorge dos Santos Costa e Dom Ricardo Vicente dos Anjos não mais
      integram esta Mitra Primacial
events:
- type: other
  date: '2018-05-24'
  description: >-
    Notificação da Câmara Episcopal e Arcebispado Primaz da ICA: Altamiro Pereira do Amaral, Jorge dos Santos Costa
    e Ricardo Vicente dos Anjos "não mais integram esta Mitra Primacial"; as dioceses de Belém e de Santa Cruz de
    Salvador passam à responsabilidade do arcebispo primaz e a Diocese de Mato Grosso do Sul é extinta e reintegrada
    à do Centro Oeste.
  status: confirmed
  sources:
  - source: lica-ica-notificacao
    quote: >-
      A Diocese de Mato Grosso do Sul é extinta e reintegrada à Diocese Católica Anglicana do Centro Oeste.
  - source: lica-ica-notificacao
    quote: Goiânia, 24 de maio de 2018
