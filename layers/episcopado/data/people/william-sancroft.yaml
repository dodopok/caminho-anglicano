      Joseph of Peterborough, John of Rochester, Peter of Ely, Guy of Bristol, Thomas of Lincoln, and Thomas of
      Exeter ; Reg. Sancroft, 7 ;
  notes: >-
    Stubbs (Registrum Sacrum Anglicanum, 1897) segue os registros dos arcebispos (citados no fim de cada verbete)
    e nomeia o sagrante que presidiu primeiro. Os co-sagrantes aparecem só como 'Prenome of Sé'; a identificação
    dos nomes completos foi feita cruzando com os próprios verbetes de Stubbs (quem ocupava a sé na data). Sagrado
    diretamente arcebispo de Cantuária, junto com William Thomas (St David's). Henry of London = Henry Compton;
    Seth of Sarum = Seth Ward; Joseph of Peterborough = Joseph Henshaw; John of Rochester = John Dolben; Peter of
    Ely = Peter Gunning; Guy of Bristol = Guy Carleton; Thomas of Lincoln = Thomas Barlow; Thomas of Exeter = Thomas
    Lamplugh. Para datas de janeiro a março antes de 1752, o ano segue Stubbs; pode haver diferença de um ano em
    fontes que usam o estilo antigo.
