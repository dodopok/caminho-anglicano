biography: >-
  Sagrado em Lambeth, em 27/01/1678, por Henry Compton e outros bispos, foi arcebispo de Cantuária até ser suspenso
  e deposto em 01/02/1690 por recusar o juramento de fidelidade a Guilherme III e Maria II; depois apoiou a sagração
  de novos bispos não-juramentados. Morreu em 24/11/1693.
sources:
- source: stubbs-1897
  quote: >-
    a. d. 1678, Jan. 27. William Sancroft. Canterbury; dep. 1690, Feb. 1; d. 1693, Nov. 24 ; and William Thomas.
    S. David's ; Worcester, 1683 ; d. 1689, June 25. Consecrated at Lambeth by Henry of London, Seth of Sarum, Joseph
    of Peterborough, John of Rochester, Peter of Ely, Guy of Bristol, Thomas of Lincoln, and Thomas of Exeter ;
    Reg. Sancroft, 7 ;
- source: stubbs-1897
  quote: William Sancroft. Canterbury; dep. 1690, Feb. 1; d. 1693, Nov. 24
- source: perd10-wp-sancroft
  quote: >-
    Deprived of his office in 1690 for refusing to swear allegiance to [[William III of England|William III]] and
    [[Mary II]]
- source: perd10-wp-sancroft
  quote: >-
    he [[Nonjuring schism|refused to take the oath]] to them, and was accordingly suspended and deprived in 1690.
