  status: probable
  sources:
  - source: costa2021
    quote: >-
      reverendo Cláudio Vinícius de Senna Gastal81, que foi sagrado como novo bispo da Diocese Meridional, na Catedral
      da Santíssima Trindade, em Porto Alegre.
  - source: costa2021
    quote: Atuou como Bispo Diocesano da Diocese Meridional de 1984 a 1998.
  - source: ens-84063
    quote: >-
      The Very Rev. Claudio Gastal, Dean of Holy Trinity Cathedral in Porto Alegre, was elected to that position,
      and his consecration is slated for the end of March.
  - source: sinopse-2003
    quote: 1984 - Cláudio Vinícius de Senna Gastal (Porto Alegre)
  - source: kickhofel-1995
    quote: >-
      Gastal foi eleito em outubro de 1983 e sagrado em março de 1984 para ser inicialmente bispo coadjutor com
      direito a sucessão.
    page: '251'
  - source: ieablac-ame23-1984
    quote: >-
      Numa bonita e bem organizada cerimônia litúrgica, que lotou completamente as dependências da Catedral da SS.
      Trindade de Porto Alegre, o deão Cláudio Vinicius de Sema Gastal, foi sagrado em março último, bispo da Diocese
      Meridional
  - source: costa2021
    quote: >-
      Em outubro de 1983, a reunião do Concílio da Diocese Meridional elegeu o reverendo Cláudio Vinícius de Senna
      Gastal 81, que foi sagrado como novo bispo da Diocese Meridional, na Catedral da Santíssima Trindade, em Porto
      Alegre.
    page: '95'
  notes: >-
    Eleito bispo coadjutor (Kratz pediu coadjutor por saude); ENS de 22/03/1984 diz sagracao prevista para o fim
    de marco de 1984. Data exata nao confirmada. Fonte nova (jun/1984) que confirma mês (março de 1984) e local,
    antes só deduzidos de ENS 22/03/1984 (sagração 'prevista para o fim de março') e da tese de Costa. SAGRANTES
    NÃO NOMEADOS. O boletim reproduz notícia do Estandarte Cristão; 'Sema' é erro de OCR/digitação para Senna. Cargo:
    o texto diz 'bispo da Diocese Meridional' (outras fontes dão coadjutor, eleito em out/1983, e a nota diz que
    sucede Kratz, falecido em 4/3/1984). A tese NÃO informa a data nem os sagrantes. Eleito em out. 1983; diocesano
    'de 1984 a 1998'; já era bispo em 17/3/1985 (co-sagrante de Clóvis). Nota 138: nº 06.
