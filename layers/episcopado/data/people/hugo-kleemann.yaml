biography: >-
  Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra) segundo o Clerical Directory 1965. Ordenado diácono
  em dez/1953 e presbítero em nov/1954. Transferido para a Igreja Episcopal do Brasil em 25/04/1965 (Clerical Directory
  1968).
