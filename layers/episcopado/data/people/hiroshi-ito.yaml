- type: other
  date: '2005'
  description: >-
    Processo disciplinar da IEAB contra Robinson Cavalcanti: pedido pelos bispos Hiroshi Ito (São Paulo) e Naudal
    Alves Gomes (Curitiba), além de dois clérigos e dois leigos da diocese; a Câmara dos Bispos o suspendeu e o
    Tribunal Superior Eclesiástico, presidido pelo ex-bispo do Recife Clóvis Erly Rodrigues, aplicou a cassação
    de ordem e ministério, prolatada pelo Primaz.
  status: confirmed
  sources:
  - source: drp2-memorias-decada-ix
    quote: >-
      Dois bispos (Ito, de São Paulo, e Naudal, de Curitiba), mas dois clérigos e dois leigos da DAR requerem ao
      Primaz a abertura de um processo disciplinar contra o Bispo do Recife, acusado de insubordinação e não cumprimento
      dos seus votos de Ordenação.
  - source: drp2-memorias-decada-ix
    quote: >-
      O Tribunal Superior Eclesiástico da IEAB, presidido pelo ex-Bispo da DAR, Clóvis, opta pela pena máxima: cassação
      de Ordem e Ministério, que é prolatada pelo Primaz.
- type: other
  date: '2004'
  description: >-
    A Câmara dos Bispos da IEAB nomeou uma Supervisão Episcopal Especial para a Diocese do Recife, que Robinson
    Cavalcanti não aceitou; por isso a JUNET, presidida por Hiroshi Ito, decidiu que a dotação mensal da diocese
    passasse a ser administrada pela Supervisão Episcopal por meio do bispo sufragâneo Filadelfo Oliveira Neto (relato
    em carta do presidente da JUNET reproduzida em artigo de dezembro de 2004).
  status: probable
  sources:
  - source: darl2-reflexao-273
    quote: >-
      Considerando sua posição em não aceitar a Supervisão Episcopal Especial nomeada pela Câmara dos Bispo;
  - source: darl2-reflexao-273
    quote: >-
      a dotação mensal da JUNET será enviada para ser administrada pela Supervisão Episcopal através do Bispo Sufragâneo,
      Dom Filadelfo de Oliveira Neto.
- type: other
  date: '2004-12-26'
  description: >-
    A JUNET (Junta Nacional de Estudos Teológicos), por carta do seu presidente, o bispo Hiroshi Ito (2003-2006),
