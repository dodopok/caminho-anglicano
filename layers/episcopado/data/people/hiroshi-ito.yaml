biography: >-
  Hiroshi Ito nasceu em Nara (Japão) em 7 de setembro de 1939 e foi ordenado diácono em 1967 e presbítero em 1968,
  na IEAB. Eleito bispo diocesano de São Paulo em Concílio Extraordinário em 6 de abril de 2002, foi sagrado em
  28 de julho de 2002, na Catedral Anglicana de São Paulo, tendo como sagrante o primaz Glauco Soares de Lima; a
  lista de bispos da IEAB registra seu episcopado como 2002-2006, e presidiu a JUNET de 2003 a 2006. Nessa função
  comunicou a Robinson Cavalcanti, em dezembro de 2004, que a dotação mensal da junta à Diocese do Recife seria
  enviada à Supervisão Episcopal, e em 2005 foi um dos dois bispos que pediram a abertura de processo disciplinar
  contra ele. Foi co-sagrante de Roger Douglas Bird, em 7 de setembro de 2007. Faleceu em 15 de novembro de 2015.
