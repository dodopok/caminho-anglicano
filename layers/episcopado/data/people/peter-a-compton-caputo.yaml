id: peter-a-compton-caputo
name: Peter A. Compton-Caputo
full_name: Peter Anthony Compton-Caputo
aliases:
- Bishop Peter Compton Caputo
- Peter Anthony Compton-Caputo
- Peter Compton Caputo
biography: >-
  Bispo da Anglican Independent Communion (Presiding Bishop of the Americas), sagrante de Norman Dutton (AECI);
  segundo a AECI, Cruz-Blanco foi um dos seus co-sagrantes. Listado como sagrado c.1993 na linhagem publicada pela
  AECI.
sources:
- source: cont-aeci-news
  quote: >-
    Archbishop Victor Manuel Cruz-Blanco was one of the consecrators of Bishop Peter Compton Caputo who in turn
    was Consecrator of Norman S Dutton.
- source: cont-aeci-succession
  quote: Peter A. Compton-Caputo c.1993
events:
- type: other
  date: '2013-01-12'
  description: >-
    Linhagem declarada pela IAOB para Adolfo Batista Teodoro Júnior: Pedro A. Compton-Caputo (1993) -> Norman Sydney
    Dutton (1999) -> Barry Frank Peachey (2005) -> Josué Souza Torres (15/01/2006) -> Adolfo Batista Teodoro Junior
    (12/01/2013); linha 'Old Catholic' paralela: Cícero Cruz de Souza (2001) -> Iranildo Macieira da Silva (2004)
    -> Josué Souza Torres (2006) -> Adolfo (2013). Mesma cadeia Compton-Caputo/Dutton que a AECI publica para Rui
    Costa Barbosa.
  status: probable
