biography: >-
  Bispo ordinário da Anglican Independent Communion (Annapolis, Maryland), foi ordenado presbítero em 6 de setembro
  de 1980 por Charles Dale Doren e sagrado bispo em 31 de outubro de 1993, em Crownsville (Maryland), por Donald
  Wharton, com Michel LaRoque; em 25 de janeiro de 1997, passou por nova cerimônia de sagração, celebrada por Larry
  E. Shaver. Segundo a lista de sucessão da AECI, Victor Manuel Cruz-Blanco foi um dos sagrantes. Sagrou um bispo,
  Norman Dutton (c. 1999), na linhagem declarada pela IAOB para Adolfo Batista Teodoro Júnior.
