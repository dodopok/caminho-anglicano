# yaml-language-server: $schema=../../schemas/person.json
id: eduardo-mota
name: Eduardo Mota
full_name: Eduardo Mota
death:
  date: '2012-01-01'
  sources:
  - source: lia-iatb-noticias-2012
    quote: >-
      Com profundo pesar noticiamos o falecimento de Dom Eduardo Mota, Bispo Diocesano da Diocese do Pará. O passamento
      ocorreu nas primeiras horas do dia 1º de janeiro de 2012
  - source: lia-aeci-news
    quote: Bishop +Mota was promoted to Glory on January 1st 2012.
  - source: lia-aeci-news
    quote: >-
      It is with sadness we announce the death of Bishop +Eduardo Mota, Ordinary of the Diocese of PARA for The
      Traditional Anglican Church of Brazil.
  - source: lia-iatb-noticias-2012
    quote: >-
      Dom Eduardo Mota já em idade provecta, sofreu um AVC no dia 24 de dezembro de 2011 e desde então esteve internado
      no mesmo Hospital Regional de Cametá.
biography: >-
  Bispo diocesano do Pará (sede em Cametá) da IATB; sagrado em 23/03/1980 em Brasília na Igreja Católica Apostólica
  Brasileira por Luiz Fernando Castilho Mendez, segundo a IATB; faleceu em Cametá em 01/01/2012, após um AVC em
  24/12/2011.
sources:
- source: lia-iatb-noticias-2012
  quote: >-
    Com profundo pesar noticiamos o falecimento de Dom Eduardo Mota, Bispo Diocesano da Diocese do Pará. O passamento
    ocorreu nas primeiras horas do dia 1º de janeiro de 2012
- source: lia-aeci-news
  quote: Bishop +Mota was promoted to Glory on January 1st 2012.
ordinations:
- order: episcopate
  date: '1980-03-23'
  place: Brasília (DF)
  jurisdiction: icab
  principal_consecrator: luiz-fernando-castillo-mendez
  status: probable
  sources:
  - source: lia-iatb-noticias-2012
    quote: >-
      Dom Eduardo Mota foi ordenado ao episcopado na ICAB, na Cidade de Brasília, pelo Eminente Dom Luiz Fernando
      Castilho Mendez no dia 23 de março de 1980, portanto exerceu o episcopado por mais de três décadas.
  notes: >-
    Fonte única (nota necrológica da IATB, por Dom Rui). O sagrante aparece como 'Luiz Fernando Castilho Mendez';
    a lista 'Brazilian Catholic Line' da IATB traz 'Luis Castilho-Mendez' (consagrado em 03/05/1948) em outra linhagem.
affiliations:
