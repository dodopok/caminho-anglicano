id: eduardo-mota
name: Eduardo Mota
full_name: Eduardo Mota
death:
  date: '2012-01-01'
  sources:
  - source: lia-iatb-noticias-2012
    quote: >-
      Com profundo pesar noticiamos o falecimento de Dom Eduardo Mota, Bispo Diocesano da Diocese do Pará. O passamento
      ocorreu nas primeiras horas do dia 1º de janeiro de 2012
  - source: lia-aeci-news
    quote: Bishop +Mota was promoted to Glory on January 1st 2012.
  - source: lia-aeci-news
    quote: >-
      It is with sadness we announce the death of Bishop +Eduardo Mota, Ordinary of the Diocese of PARA for The
      Traditional Anglican Church of Brazil.
