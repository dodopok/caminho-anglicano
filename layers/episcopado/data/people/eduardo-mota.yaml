  notes: >-
    Fonte única (nota necrológica da IATB, por Dom Rui). O sagrante aparece como 'Luiz Fernando Castilho Mendez';
    a lista 'Brazilian Catholic Line' da IATB traz 'Luis Castilho-Mendez' (consagrado em 03/05/1948) em outra linhagem.
    A numeração do blog indica a linhagem: os bispos com código 4.x descendem do bispo nº 4 da lista, Luís Fernando
    Castillo Méndez; a fonte não diz com todas as letras 'sagrado por'. O blog diz que ele foi depois 'Expulso da
    Igreja'. Cametá é a sede da diocese para a qual foi sagrado, não necessariamente o local da cerimônia.
