  notes: >-
    Local: sede em Cametá. Início inferido: a Diocese do Pará (sede em Cametá) foi constituída pelo Decreto Arquiepiscopal
    018/2009 (28-29/10/2009); a primeira menção a Mota na IATB que consultamos é de 2010 ('nova fase do seu episcopado
    na IATB'). A Diocese do Pará já aparece com Mota como bispo em 2010.
