biography: >-
  Foi bispo diocesano do Pará (sede em Cametá) da Igreja Anglicana Tradicional do Brasil (IATB), de 2009 até a morte.
  Segundo a IATB, foi sagrado em 23/3/1980, em Brasília, na ICAB, por Luiz Fernando Castillo Mendez (uma lista de
  sucessão registra 21/3/1980). Sofreu um AVC em 24/12/2011 e morreu em 1/1/2012, no Hospital Regional de Cametá.
sources:
- source: lia-iatb-juris-2010
  quote: 'DIOCESE DO PARÁ Bispo Diocesano: Dom Eduardo Mota'
- source: lia-iatb-noticias-2012
  quote: Com profundo pesar noticiamos o falecimento de Dom Eduardo Mota, Bispo Diocesano da Diocese do Pará.
- source: lia-iatb-noticias-2012
