biography: >-
  Lourenço Takeo Shimanuki nasceu em Tóquio, Japão, em 20/10/1904, filho do Rev. Paul Hiodayu Shimanuki, e estudou
  na Escola de Teologia de Porto Alegre em 1932. Foi ordenado diácono em novembro de 1932 e presbítero em janeiro
  de 1934 por William Matthews Merrick Thomas, e serviu a igreja no estado de São Paulo. Atuou no Distrito Missionário
  do Brasil Central até ser transferido para a Igreja Episcopal do Brasil em 25/04/1965.
