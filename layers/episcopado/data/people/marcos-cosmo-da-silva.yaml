name: Marcos Cosmo da Silva
biography: >-
  Marcos Cosmo da Silva constava em 2004 entre os clérigos licenciados da Diocese do Recife. Em outra lista diocesana,
  de data não informada, aparece entre os presbíteros e como presidente da Comissão de Eleição.
