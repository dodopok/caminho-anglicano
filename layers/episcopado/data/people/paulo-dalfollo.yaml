birth:
  date: '1926-09-18'
  sources:
  - source: rta-ecd1962
    quote: b Santa Maria Braz 18 Sep 26
biography: >-
  Nascido em Santa Maria (RS) em 1926, foi ordenado diácono em março de 1950 e presbítero em fevereiro de 1951,
  ambos pelo bispo Egmont Krischke, na IEAB. Foi deposto pelo bispo E. K. Sherrill em 27 de agosto de 1962.
