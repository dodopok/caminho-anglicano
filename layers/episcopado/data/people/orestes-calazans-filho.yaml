id: orestes-calazans-filho
name: Orestes Calazans Filho
full_name: Orestes Calazans Filho
aliases:
- Dom Orestes
biography: >-
  Bispo que, com José Fernando de Faria e Jorge dos Santos Costa, decidiu deixar a Província Católica Anglicana
  do Brasil, em texto da IACES (c. 2018–2020). É apresentado como bispo diocesano de Minas Gerais da ICA-Brasil
  (2024–2025).
sources:
- source: lica-iaces-historia
  quote: >-
    Nós + Dom José Fernando de Faria, + Dom Jorge dos Santos Costa, + Dom Orestes Calazans Filho achamos por bem
- source: lica-iaces-historia
  quote: >-
    Nós + Dom José Fernando de Faria, + Dom Jorge dos Santos Costa, + Dom Orestes Calazans Filho achamos por bem
    e para maior glória de Deus nos desligarmos da Província Católica Anglicana do Brasil
- source: lica-icabr-quemsomos
  quote: Dom Orestes Calazans Filho Bispo diocesano Minas Gerais
- source: cant-novas-igrejas-2024
