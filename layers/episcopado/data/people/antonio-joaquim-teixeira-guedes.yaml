biography: >-
  Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra) segundo o Clerical Directory 1965. Nascido em Pelotas,
  RGS, Brasil (1919-05-07). Ordenado diácono em dez/1941 e presbítero em jun/1943. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
