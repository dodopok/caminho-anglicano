biography: >-
  Bispo diocesano da CEEC/Christian Communion (EUA) que supervisionou a Betânia a partir de 2004 e foi sagrante
  (citado primeiro) de Leonides de Menezes em 2006.
sources:
- source: ciceb-quemsomos
  quote: >-
    Em março de 2004 a Paróquia Betânia passou a estar sob a autoridade do bispo Diocesano +William Paul Mikler
ordinations:
- order: episcopate
  date: '2003-09-12'
  jurisdiction: null
  principal_consecrator: wayne-boosahda
  co_consecrators:
  - robert-hoyt
  - thomas-corey
  status: confirmed
  sources:
  - source: lin-basileians-mikler
    quote: >-
      Bishop William Paul Mikler ("Bill) was consecrated as a Bishop of the Church in apostolic succession on the
      12th of September, 2003 by Bishops Paul Wayne Boosahda (Chief Consecrator), Robert Hoyt and Thomas Corey.
  - source: lin-ms-boosahda
    quote: >-
      12th September 2003 20030912 Consecrated William Paul Mikler Assisted by Robert Hoyt and Thomas Corey.
  notes: >-
    Página pessoal da própria organização (Basileians) e Morningstar concordam; Morningstar parece derivar da mesma
    informação. Identidade com o Mikler da Paróquia Betânia (Recife) inferida: a página o descreve em 2014 no Rio
    de Janeiro, presidindo a Communio Christiana.
