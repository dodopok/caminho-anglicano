  - source: rcor-drv-presb-gustavo
    quote: >-
      Como Bispo e sucessor dos apóstolos, a mim me cabe, também em temor e humildade, presidir essa cerimônia,
      e, juntamente com os Presbíteros, reconhecer a vocação, impor as mãos
  - source: rcor-drv-presb-gustavo
    quote: o quadragésimo terceiro (43º) do nosso episcopado
  - source: drp2-ord-presb-gustavo-2004
    quote: >-
      Ordenação Presbiteral do Rev. Gustavo Gilson S. Oliveira. Paróquia Anglicana da Natividade Natal – RN Em 25
      de janeiro de 2004
  - source: drp2-ord-presb-gustavo-2004
    quote: >-
      procedermos à solene e festiva Ordenação Presbiteral do nosso querido Diácono, Rev. Gustavo Gilson, o quadragésimo
      terceiro (43º) do nosso episcopado.
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti), que preside e impõe as mãos; 43º presbítero do seu episcopado.
    43º presbítero ordenado no episcopado de Dom Robinson Cavalcanti.
affiliations:
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  start: '1999'
  status: confirmed
  sources:
  - source: dar-2026-gilson
    quote: >-
      é presbítero da Diocese Anglicana do Recife e deão da Catedral Anglicana do Bom Samaritano, ministério que
      exerce de forma voluntária e vocacional há mais de duas décadas.
  - source: dar-2026-gilson
    quote: Essa busca o conduziu ao Recife em 1999, ano decisivo em sua vida.
  - source: dar-2026-gilson
    quote: Entre 2002 e 2008, Gustavo foi reitor do SAET
  - source: ieab-2004-decreto-recife
    quote: 'Considerando a solicitação dos clérigos e clérigas a seguir relacionados:'
  - source: ieab-2004-decreto-recife
    quote: Rev. Gustavo Gilson S. de Oliveira, ose (Reitor do Seminário Anglicano de Estudos Teológicos)
  - source: dar-clero-diocesano
    quote: CLERO DIOCESANO
  - source: dar-clero-diocesano
    quote: Revdmo. Deão Gustavo Gilson
  - source: costa2021
    quote: >-
      Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Rev. Gustavo Gilson S. de Oliveira,
      ose (Reitor do Seminário Anglicano de Estudos Teológicos)
    page: '545'
  - source: costa2021
    quote: Rev. Gustavo Gilson S. de Oliveira, ose (Reitor do Seminário Anglicano de Estudos Teológicos)
    page: '217'
  notes: >-
    Início = chegada a Recife e ingresso na Igreja Anglicana (1999), não ordenação. Permaneceu na IEAB no cisma
    de 2005 ("o Seminário Anglicano de Estudos Teológicos tornou-se um espaço de refúgio para clérigos, seminaristas,
    jovens e lideranças que decidiram permanecer na IEAB"). Nome completo "Gustavo Gilson de Oliveira" segundo dar-2023-esdras-presb.
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Reitor do SAET; membro
    da OSE Listado no clero diocesano da DAR (página consultada em 2026-10). Anexo K: em 2004 era clérigo(a) da
    Diocese Anglicana do Recife e foi um dos 13 que pediram à Câmara dos Bispos supervisão episcopal alternativa
    (decreto de 16/09/2004), mantendo a comunhão com a IEAB. Início e fim do vínculo não informados. Signatário
    de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise de 2004-2005. Reitor do SAET em 2004; suspenso por
    Robinson em set/2004; homilia na instalação de Sebastião (2006); instalado deão da Catedral do Bom Samaritano
    em junho de 2017.
