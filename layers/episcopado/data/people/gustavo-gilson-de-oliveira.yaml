id: gustavo-gilson-de-oliveira
name: Gustavo Gilson de Oliveira
full_name: Gustavo Gilson Sousa de Oliveira
aliases:
- Gustavo Gilson Oliveira
- Gustavo Gilson S. de Oliveira
