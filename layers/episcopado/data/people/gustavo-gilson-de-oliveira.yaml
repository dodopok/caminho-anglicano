  - source: d2s29-m42
    quote: >-
      Ordenação Presbiteral do nosso querido Diácono, Rev. Gustavo Gilson, o quadragésimo terceiro (43º) do nosso
      episcopado
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti), que preside e impõe as mãos; 43º presbítero do seu episcopado.
    43º presbítero ordenado no episcopado de Dom Robinson Cavalcanti. Sermão do bispo diocesano, no 3º domingo da
    Epifania; diz que, com Gustavo Gilson, são '43 Presbíteros desses seis anos'. O bispo cita as ordens instituídas
    (acólitos, evangelistas e ministros leigos). O texto é o sermão do bispo diocesano, que fala em primeira pessoa
    como quem confere a ordem; a página não traz assinatura, e o bispo diocesano em exercício era Robinson Cavalcanti
    (instalado em 19/10/1997).
