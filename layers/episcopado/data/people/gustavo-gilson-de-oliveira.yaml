- Revdmo. Deão Gustavo Gilson
biography: >-
  Natural de Natal (RN) e criado na Assembleia de Deus, conheceu o anglicanismo durante a universidade e passou
  a integrar a Igreja Anglicana ao se mudar para o Recife, em 1999. É graduado em Psicologia pela UFRN (1998), mestre
  (2001) e doutor (2009) em Sociologia pela UFPE e professor associado da UFPE. Foi ordenado diácono em 03/11/2002
  e presbítero em 25/01/2004 (na Paróquia Anglicana da Natividade, em Natal), ambos por Robinson Cavalcanti, na
  Diocese Anglicana do Recife (IEAB), e é membro da Ordem Evangélica de Santo Estêvão Mártir (OSE). Foi reitor do
  SAET (entre 2002 e 2008, segundo a Diocese). Em 2004, assinou o documento "Para além das trincheiras" (06/07/2004),
  pedindo reconciliação; em setembro foi suspenso por Robinson e destituído do cargo paroquial após um sermão crítico,
  e esteve no confronto de 19/09/2004 na Paróquia do Mediador. Na crise da diocese a partir de 2005, permaneceu
  na IEAB. Em 2016, convidado pelo bispo João Câncio Peixoto, ajudou a reorganizar a Paróquia do Bom Samaritano,
  reaberta em 29/05/2016 e instituída catedral em 18/06/2016, e é deão desde essa data (Costa situa a elevação a
  catedral e a instalação como deão no XXXII Concílio, em junho de 2017). Presidiu o Conselho Diocesano em mais
  de um mandato, é procurador eclesiástico da diocese e foi delegado ao XXXV Sínodo da IEAB, em 2022.
