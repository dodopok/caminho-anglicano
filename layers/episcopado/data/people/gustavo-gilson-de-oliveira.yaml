  - source: costa2021
    quote: Rev. Gustavo Gilson S. de Oliveira, ose (Reitor do Seminário Anglicano de Estudos Teológicos)
    page: '217'
  notes: >-
    Início = chegada a Recife e ingresso na Igreja Anglicana (1999), não ordenação. Permaneceu na IEAB no cisma
    de 2005 ("o Seminário Anglicano de Estudos Teológicos tornou-se um espaço de refúgio para clérigos, seminaristas,
    jovens e lideranças que decidiram permanecer na IEAB"). Nome completo "Gustavo Gilson de Oliveira" segundo dar-2023-esdras-presb.
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Reitor do SAET; membro
    da OSE Listado no clero diocesano da DAR (página consultada em 2026-10). Anexo K: em 2004 era clérigo(a) da
    Diocese Anglicana do Recife e foi um dos 13 que pediram à Câmara dos Bispos supervisão episcopal alternativa
    (decreto de 16/09/2004), mantendo a comunhão com a IEAB. Início e fim do vínculo não informados. Signatário
    de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise de 2004-2005. Reitor do SAET em 2004; suspenso por
    Robinson em set/2004; homilia na instalação de Sebastião (2006); deão da Catedral do Bom Samaritano.
