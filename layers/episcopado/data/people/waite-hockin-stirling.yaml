id: waite-hockin-stirling
name: Waite Hockin Stirling
full_name: Waite Hockin Stirling
aliases:
- Bp. Stirling (Falklands)
- Waite H. Stirling
- Waite Stirling
- bispo Stirling
wikidata: Q7960486
biography: >-
  Sagrado em 21/12/1869, em Westminster, bispo das Ilhas Falkland (Igreja da Inglaterra), assumiu em 1874 a administração
  das capelanias da América Latina. Em 1897, em visita à missão episcopal no Brasil, ordenou presbíteros os três
  primeiros diáconos brasileiros e confirmou 159 membros.
sources:
- source: stubbs-1897
  quote: >-
    The Falkland Islands. A.D. 1869, Dec. 21. Waite Hockin Stirling. Consecrated at Westminster by J. London, C.
    S. David's, H. Worcester, E. H. Ely ; Reg. Tait.
- source: stubbs-1897
  quote: The Falkland Islands. A.D. 1869, Dec. 21. Waite Hockin Stirling.
- source: costa2021
  quote: >-
    Embora em 1874, o bispo Waite Kockin Stirling, das Ilhas Malvinas, tenha assumido a administração das capelanias
    da América Latina
  page: '163'
- source: wp-en-ieab
  quote: >-
    Four years later, the Brazilian mission was visited by Waite Hockin Stirling, who ordained three priests and
    confirmed 159 members.
- source: wp-en-kinsolving
  quote: >-
    Bishop Stirling ordained three of the Brazilian deacons to the priesthood (Peterkin having deposed the fourth).
- source: wp-pt-ieab
  quote: >-
    foi a vez da comunidade receber Waite Hockin Stirling, bispo das Ilhas Falkland, que ordenou os três primeiros
    presbíteros nacionais
- source: kickhofel-1995
  quote: BISPOS VISITANTES 1897 - Waite Hockin Stirling
  page: '368'
