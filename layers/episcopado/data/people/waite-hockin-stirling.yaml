  notes: >-
    Stubbs (Registrum Sacrum Anglicanum, 1897) segue os registros dos arcebispos (citados no fim de cada verbete)
    e nomeia o sagrante que presidiu primeiro. Os co-sagrantes aparecem só como 'Prenome of Sé'; a identificação
    dos nomes completos foi feita cruzando com os próprios verbetes de Stubbs (quem ocupava a sé na data). Bispo
    colonial das Ilhas Falkland. Mesma data e mesmos sagrantes de Frederick Temple: J. London = John Jackson; C.
    S. David's = Connop Thirlwall; H. Worcester = Henry Philpott; E. H. Ely = Edward Harold Browne.
