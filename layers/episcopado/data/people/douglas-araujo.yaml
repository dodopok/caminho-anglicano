  jurisdiction: reb
  ordained_by: eric-rodrigues
  status: probable
  sources:
  - source: ig-anglicanaporto-2025-03-10-diaconato-1
    quote: 09 de março de 2025, o dia em que nossos pastores foram ordenados ao diaconato.
  - source: ig-anglicanaporto-2025-03-10-diaconato-2
    quote: 09 de março de 2025, o dia em que nossos pastores foram ordenados ao diaconato.
