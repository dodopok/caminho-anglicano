# yaml-language-server: $schema=../../schemas/person.json
id: douglas-araujo
name: Douglas de Araujo Silva
full_name: Douglas de Araujo Silva
aliases:
- Douglas Araujo
- Douglas Araújo
- Rev. Douglas Araujo
biography: >-
  Pastor da Igreja Anglicana Porto (São Paulo, SP) e presbítero da REB; apresentado como presidente do Conselho
  Diocesano em 2026 e como palestrante do 1º Sínodo da REB; formado no Seminário Anglicano de Teologia, produz conteúdo
  teológico (canal Teologueiros) e mantém o aplicativo Ordo e o portal Caminho Anglicano.
sources:
- source: porto-lideranca
  quote: >-
    Produtor de conteúdo teológico a mais de 7 anos no YouTube com o canal Teologueiros e formado no Seminário Anglicano
    de Teologia, estudioso de Anglicanismo e Liturgia.
- source: rbc-reb-api-autores
  quote: >-
    Um dos pastores da Igreja Anglicana Porto. Mantenedor do projeto Caminho Anglicano e do aplicativo Ordo para
    Ofício Diário.
ordinations:
