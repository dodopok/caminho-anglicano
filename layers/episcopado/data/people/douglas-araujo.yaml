    não distingue diaconato e presbiterato; a REB tinha um único bispo).
- order: presbyterate
  date: '2025-10-24'
  place: Vitória (ES)
  jurisdiction: reb
  ordained_by: eric-rodrigues
  status: confirmed
  sources:
  - source: ig-reb-2025-10-25-presbiteros
    quote: celebramos as ordenações presbiterais realizadas em nosso Sínodo Diocesano.
  - source: ig-reb-2025-10-25-presbiteros
    quote: "Dêmos graças aos novos presbíteros da Rede Episcopal Brasileira. \n\n- Reverendo Douglas Araújo (SP)\n\
      - Reverenda Cynthia Soares (SP)\n- Reverendo Elias Valentim (ES)\n- Reverenda Joyce Baiense (ES)"
  - source: testemunho-mantenedor-2026-10-07-reb
    quote: Foi ordenado Douglas de Araujo Silva e Cynthia Muniz Soares, pelo bispo Eric Rodrigues, da REB
  - source: ecs-eric-blog-10meses
    quote: E um sínodo diocesano ordinário presencial, realizado em Vitória, Espírito Santo.
  - source: ecs-eric-blog-10meses
    quote: Nosso primeiro Sínodo acabou de acontecer
  - source: testemunho-mantenedor-2026-10-08-porto
    quote: >-
      Ordenacao diaconal de douglas e cynthia foi realizada na IPI Tatuapé, e a presbiteral em vitória no sínodo
      que você já tem informação
  - source: testemunho-mantenedor-2026-10-08-reb-sinodo-2025
    quote: Elias e Joyce foram ordenados presbíteros junto comigo e Cynthia, pelo bispo Eric, mesmo dia
  - source: testemunho-mantenedor-2026-10-08-reb-sinodo-2025
    quote: >-
      Na mesma data foi ordenado ao diaconato o Rafael Rodrigues (de Brasília), Paula Pires e Andreia Nogueira (esposa
      do Reinaldo, de Jacareí, da Anglicana Família)
  notes: >-
    O post não nomeia o bispo ordenante. Data = mês do Sínodo Diocesano (post de 25/10/2025). Bispo ordenante informado
    por testemunho do mantenedor do projeto (a mensagem não distingue diaconato e presbiterato; a REB tinha um único
    bispo). Local inferido: a REB informa que as ordenações presbiterais ocorreram "em nosso Sínodo Diocesano" e
    o blog do bispo (28/10/2025) diz que o primeiro sínodo ordinário foi presencial, em Vitória (ES). A data (24/10/2025)
    e o ordenante constam de outras fontes já reunidas; a fonte aqui só sustenta o local. No Sínodo Diocesano da
    REB. Ordenações no Sínodo Diocesano da REB; o calendário da REB dá 24/10/2025 para as ordenações diaconais da
    mesma celebração. Post da REB sobre a celebração: https://www.instagram.com/p/DQSr0ENjmrg/ (publicado em 26/10/2025).
