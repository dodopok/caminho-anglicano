  - source: testemunho-mantenedor-2026-10-07-reb
    quote: Foi ordenado Douglas de Araujo Silva e Cynthia Muniz Soares, pelo bispo Eric Rodrigues, da REB
  - source: reb-calendario-2026
    quote: 09/03/2025 – Aniversário de Ordenação • Rev. Douglas
  notes: >-
    Celebrada no templo da Igreja Presbiteriana Independente do Tatuapé. Os posts da Igreja Anglicana Porto citam
