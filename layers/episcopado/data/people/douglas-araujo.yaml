  date: '2025-03-09'
  place: IPI Tatuapé, São Paulo (SP)
  jurisdiction: reb
  ordained_by: eric-rodrigues
  status: confirmed
  sources:
  - source: testemunho-mantenedor-2026-10-08-porto
