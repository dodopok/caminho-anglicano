    bispo).
- order: presbyterate
  date: '2025-10-24'
  jurisdiction: reb
  ordained_by: eric-rodrigues
  status: confirmed
  sources:
  - source: ig-reb-2025-10-25-presbiteros
    quote: celebramos as ordenações presbiterais realizadas em nosso Sínodo Diocesano.
  - source: ig-reb-2025-10-25-presbiteros
    quote: "Dêmos graças aos novos presbíteros da Rede Episcopal Brasileira. \n\n- Reverendo Douglas Araújo (SP)\n\
      - Reverenda Cynthia Soares (SP)\n- Reverendo Elias Valentim (ES)\n- Reverenda Joyce Baiense (ES)"
  - source: testemunho-mantenedor-2026-10-07-reb
    quote: Foi ordenado Douglas de Araujo Silva e Cynthia Muniz Soares, pelo bispo Eric Rodrigues, da REB
  - source: testemunho-mantenedor-2026-10-08-reb-sinodo-2025
    quote: Elias e Joyce foram ordenados presbíteros junto comigo e Cynthia, pelo bispo Eric, mesmo dia
  - source: testemunho-mantenedor-2026-10-08-reb-sinodo-2025
    quote: >-
      Na mesma data foi ordenado ao diaconato o Rafael Rodrigues (de Brasília), Paula Pires e Andreia Nogueira (esposa
      do Reinaldo, de Jacareí, da Anglicana Família)
  notes: >-
    O post não nomeia o bispo ordenante. Data = mês do Sínodo Diocesano (post de 25/10/2025). Bispo ordenante informado
    por testemunho do mantenedor do projeto (a mensagem não distingue diaconato e presbiterato; a REB tinha um único
    bispo). Ordenações no Sínodo Diocesano da REB; o calendário da REB dá 24/10/2025 para as ordenações diaconais
    da mesma celebração. Post da REB sobre a celebração: https://www.instagram.com/p/DQSr0ENjmrg/ (publicado em
    26/10/2025).
