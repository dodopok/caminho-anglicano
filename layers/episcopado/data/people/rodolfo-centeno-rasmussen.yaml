biography: >-
  Nascido em Rio Grande (RS) em 1901, foi ordenado diácono em novembro de 1923, por Lucien Lee Kinsolving, e presbítero
  em maio de 1927, por William Matthews Merrick Thomas. Constava como clérigo do Distrito Missionário do Brasil
  Central em 1965 e foi transferido para a Igreja Episcopal do Brasil em 25/04/1965.
