id: ethelbert-talbot
name: Ethelbert Talbot
full_name: Ethelbert Talbot
aliases:
- Bp. Talbot
wikidata: Q5403253
biography: >-
  Ethelbert Talbot foi sagrado em 27 de maio de 1887, em St. Louis, por Henry Benjamin Whipple, como bispo missionário
  de Wyoming e Idaho. Depois foi bispo de Central Pennsylvania e Presiding Bishop da Igreja Episcopal, impôs as
  mãos em Kinsolving em 1899 e foi sagrante principal em 1925 de W. M. M. Thomas, na St. Paul's Church, em Baltimore.
sources:
- source: perry-1895
  quote: >-
    He was consecrated to the missionary episcopate of Wyoming and Idaho in Christ Church, St. Louis, May 27, 1887,
    by Bishops Whipple, Quintard, Tuttle, Spalding, Perry, Burgess, and Seymour.
- source: perry-1895
  quote: missionary episcopate of Wyoming and Idaho
- source: som-1899-02
