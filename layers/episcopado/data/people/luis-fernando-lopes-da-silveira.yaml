id: luis-fernando-lopes-da-silveira
name: Luis Fernando Lopes da Silveira
full_name: Luis Fernando Lopes da Silveira
aliases:
- Dom Luis Fernando
- Dom Luis Silveira
biography: >-
  Luis Fernando Lopes da Silveira foi postulante e depois ministro encarregado da Missão Anglicana de Cristo, em
  Cachoeirinha (RS), na Diocese Anglicana do Recife. Foi sagrado bispo em 12/10/2023 na IECB e é bispo da Diocese
  Missionária Sul.
