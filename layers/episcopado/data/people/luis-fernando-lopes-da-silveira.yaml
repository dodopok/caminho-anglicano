id: luis-fernando-lopes-da-silveira
name: Luis Fernando Lopes da Silveira
full_name: Luis Fernando Lopes da Silveira
aliases:
- Dom Luis Fernando
- Dom Luis Silveira
biography: >-
  Luis Fernando Lopes da Silveira é bacharel em Teologia pela Escola Superior de Teologia. Em junho de 2008 procurou
  o bispo Robinson Cavalcanti para pedir acolhida na Diocese Anglicana do Recife (DAR), onde figurou como postulante
  ao ministério ordenado e como clérigo em reconhecimento de ordem. Atuou como ministro local e ministro encarregado
  da Missão (ou Ponto Missionário) Anglicana de Cristo, depois também chamada Paróquia Anglicana de Cristo, em Cachoeirinha
  (RS), no Arcediagado Sul/Sudeste. Foi sagrado bispo em 12/10/2023, na IECB, junto com Carlos Henrique, como missionário
  para a Região Sul do Brasil, e consta como bispo da Diocese Missionária Sul.
