biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Cincinnati,
  Ohio, EUA (1922-06-28). Ordenado diácono em jun/1959 e presbítero em jan/1960. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
