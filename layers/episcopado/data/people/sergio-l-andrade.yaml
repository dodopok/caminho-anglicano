biography: >-
  Coadjutor da Catedral da Santíssima Trindade em 2002 e deão (título "Revmo. Deão") no calendário diocesano de
  2004.
sources:
- source: drp-carta-pastoral-2002
  quote: >-
    mantendo como coadjutor o Rev. Sérgio Andrade, que permaneceu leal à Igreja Episcopal Anglicana do Brasil
- source: drp-calendario-2004
  quote: Revmo. Deão Sérgio Fernando L. de Andrade
