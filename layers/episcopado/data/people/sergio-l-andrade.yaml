      de pessoas
  - source: d2s23-carta-pastoral-2002
    quote: O Bispo Diocesano nomeou o Bispo Sufragâneo como seu deão
  - source: d2s23-carta-pastoral-2002
    quote: >-
      mantendo como coadjutor o Rev. Sérgio Andrade, que permaneceu leal à Igreja Episcopal Anglicana do Brasil
  - source: d2s23-carta-pastoral-2002
    quote: >-
      Dos dias 25 a 27 de setembro, o Revmo. Primaz Dom Glauco Soares de Lima e o Secretário Geral da Província
