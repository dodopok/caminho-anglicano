  status: probable
  sources:
  - source: rcor-drv-diac-sergio-lomeu
    quote: >-
      CULTO DE AÇÃO DE GRAÇAS PELA REFORMA PROTESTANTE (1517/1999) ORDENAÇÃO AO DIACONATO DE SÉRGIO LOMEU DE ANDRADE
  - source: rcor-drv-diac-sergio-lomeu
    quote: Em breves momentos, como teu Bispo, te conferirei a Ordem dos Diáconos.
  notes: >-
    Culto da Reforma de 1999; o texto fala da festa de Richard Hooker 'no dia 03/11' na 'semana que se inicia',
    o que situa a ordenação no fim de outubro de 1999 (provavelmente 30 ou 31/10). Ex-pastor presbiteriano. Ordenante:
    o bispo diocesano, Robinson Cavalcanti (que fala de seus 24 anos no anglicanismo).
