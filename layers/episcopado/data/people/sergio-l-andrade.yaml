      Nos últimos seis anos, nós crescemos de 10 para mais de 40 Paróquias, Missões e Pontos Missionários, com a
      ordenação de quarenta sacerdotes e a instituição de cinqüenta pessoas ao ministério leigo.
  - source: d2s23-carta-primazes-2003
    quote: >-
      Nosso seminário teológico está constantemente recebendo novas vocações, com mais de oitenta estudantes
- type: other
  date: 2002/2004
  description: >-
    Em texto sem data (provavelmente de 2002 a 2004), o bispo diocesano Robinson Cavalcanti descreve que, após um
    cisma e a ocupação das instalações da Catedral, a Catedral Anglicana da Santíssima Trindade passava por reorganização
    com o 'remanescente fiel', sob a liderança do coadjutor Sérgio Andrade, em instalações provisórias na antiga
    Pró-Catedral do Bom Samaritano, e afirma que a Catedral é reconhecida como tal pela Comunhão Anglicana e pela
    IEAB. A qualificação do episódio como cisma e ocupação ilegal é a do autor do texto.
