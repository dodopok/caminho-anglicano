      Após a saída do grupo ligado ao reverendo Sérgio, foi assumido o nome de “Igreja Anglicana da Santíssima Trindade”
    page: '247'
  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Deão da Catedral Anglicana
    da SS. Trindade Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife e foi um dos 13 que pediram à
    Câmara dos Bispos supervisão episcopal alternativa (decreto de 16/09/2004), mantendo a comunhão com a IEAB.
    Início e fim do vínculo não informados. Ficou na IEAB em 2002 e em 2004-2005 (assinou 'Para além das trincheiras'
    e 'Não sairemos'). Deão da Catedral da SS. Trindade desde 17/08/2003. No fim de 2016 liderou a 'Aliança de Comunidades
    Anglicanas' e em 2017 rompeu com a IEAB, fundando a Igreja Anglicana da Santíssima Trindade (independente).
