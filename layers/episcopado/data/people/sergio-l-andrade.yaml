- type: other
  date: '2003-05-23'
  description: >-
    Em carta aberta aos primazes da Comunhão Anglicana (23/05/2003), o bispo diocesano Robinson Cavalcanti relatou
    que, nos seis anos anteriores, a diocese passara de 10 para mais de 40 paróquias, missões e pontos missionários,
    com a ordenação de quarenta sacerdotes e a instituição de cinquenta pessoas ao ministério leigo, e que o seminário
    contava com mais de oitenta estudantes; descreveu o remanescente da Catedral, liderado pelo Rev. Sérgio Andrade,
    como a verdadeira congregação anglicana da Catedral.
  status: confirmed
  sources:
