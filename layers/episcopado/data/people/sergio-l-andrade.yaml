  - source: d2s29-m18
    quote: Em breves momentos, como teu Bispo, te conferirei a Ordem dos Diáconos.
  notes: >-
    Culto da Reforma de 1999; o texto fala da festa de Richard Hooker 'no dia 03/11' na 'semana que se inicia',
    o que situa a ordenação no fim de outubro de 1999 (provavelmente 30 ou 31/10). Ex-pastor presbiteriano. Ordenante:
    o bispo diocesano, Robinson Cavalcanti (que fala de seus 24 anos no anglicanismo). Ordenação ao diaconato no
    culto de ação de graças pela Reforma Protestante ('1517/1999'). A página não dá a data exata nem o local; o
    texto situa o culto na semana de 31 de outubro/1º de novembro de 1999 e diz que a Festa de Richard Hooker (3
    de novembro) é na semana seguinte. Ministro presbiteriano que passou à Igreja Episcopal Anglicana do Brasil,
    era obreiro da obra social da Diaconia. O bispo diz que não convida nem induz ministros de outras denominações
    a se tornarem anglicanos, mas acolhe os que o procuram, exigindo adequação aos Cânones e um período de transição.
    O texto é o sermão do bispo diocesano, que fala em primeira pessoa como quem confere a ordem; a página não traz
    assinatura, e o bispo diocesano em exercício era Robinson Cavalcanti (instalado em 19/10/1997).
