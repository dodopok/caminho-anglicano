biography: >-
  Ordenado diácono em outubro de 1999 por Robinson Cavalcanti, foi coadjutor da Catedral Anglicana da Santíssima
  Trindade, no Recife; após a ruptura do deão Paulo Garcia com a diocese, em setembro de 2002, liderou o grupo remanescente
  que permaneceu leal à IEAB, cuja primeira celebração ocorreu em 13/10/2002. Foi instituído deão da catedral em
  17/08/2003 e, em 01/09/2004, assinou o documento "Não sairemos", reafirmando o vínculo com a IEAB. Deão até 2017,
  passou então a pastorear a Igreja Anglicana da Santíssima Trindade, congregação independente em Recife.
