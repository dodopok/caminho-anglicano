- type: other
  date: 2002-09
  description: >-
    Em setembro de 2002 o deão da Catedral da Santíssima Trindade (Recife), Rev. Paulo Garcia, rompeu com a diocese
    e filiou-se à Igreja Episcopal Carismática, levando as comunidades do Janga, Timbaúba e Vitória de Santo Antão
    e os reverendos Frederico, Célio, Adonias e Edgar; segundo o relato diocesano o cisma foi "trifonte": o grupo
    do Deão (Igreja Episcopal Carismática), os reverendos Leonides e Karla com a Paróquia Betânia (Igreja Episcopal
    Evangélica) e o Rev. Múcio com a comunidade do Parnamirim (de volta à Igreja Presbiteriana do Brasil). Parte
    da Catedral, liderada pelo Coadjutor Sérgio, permaneceu na DAR.
  status: confirmed
  sources:
  - source: darl3-hist4
    quote: rompe com a Diocese e se filia, em setembro de 2002, àquele grupo
  - source: darl3-hist4
    quote: >-
      Leva com ele as comunidades do Janga, Timbaúba e Vitória do Santo Antão-PE, e os reverendos: Frederico, Célio,
      Adonias e Edgar
  - source: darl3-hist4
    quote: O cisma foi, na realidade, trifonte
  - source: darl3-dout-hist
    quote: primeiro Deão, Rev. Paulo Ruiz Garcia
- type: other
  date: 2002-09
  description: >-
    Em 22/09/2002 foi redigida carta de desvinculação do deão da Catedral da Santíssima Trindade (Recife), Rev.
    Paulo Ruiz Garcia, da Diocese Anglicana do Recife e da IEAB; em 29/09/2002 o culto dominical da Catedral foi
    convertido em assembleia que homologou a decisão. O bispo diocesano nomeou o bispo sufragâneo Filadelfo Oliveira
    Neto deão pro tempore, manteve como coadjutor o Rev. Sérgio Andrade, que permaneceu leal à IEAB, e relatou que
    o Primaz Dom Glauco Soares de Lima e o Secretário Geral da Província estiveram no Recife de 25 a 27/09/2002
    tentando reverter a decisão. A descrição é a da carta pastoral do bispo diocesano Robinson Cavalcanti (01/10/2002).
  status: confirmed
  sources:
