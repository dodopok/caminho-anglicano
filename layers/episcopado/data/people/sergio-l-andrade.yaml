  - source: costa2021
    quote: >-
      Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Revmo. Sérgio L. Andrade (Deão
      da Catedral Anglicana da SS. Trindade)
    page: '545'
  - source: costa2021
    quote: >-
      Dentre essas pessoas que permaneceram na IEAB, se encontravam os reverendos Sérgio Andrade e João Câncio Peixoto.
    page: '203'
