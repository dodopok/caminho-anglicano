id: lilian-conceicao-da-silva
name: Lilian Conceição da Silva
biography: >-
  Lilian Conceição da Silva foi ordenada diácona em 29/12/2001 por Robinson Cavalcanti e presbítera em 29/11/2015,
  na IEAB. Consta como diretora do Departamento de Missão da IEAB.
sources:
- source: rta-livro35
  quote: 'Daiconato: 29 de dezembro de 2001.'
- source: rcor-drv-diac-karla-lilian-quintino
  quote: ORDENAÇÕES DIACONAIS - 29/12/2001 (Karla, Lilian e Quintino)
- source: rcor-drv-diac-karla-lilian-quintino
  quote: Hoje recebem o diaconato, ordem para o serviço
- source: rta-livro35
  quote: 'Presbiterado: 29 de novembro de 2015.'
- source: d2s32-ieab-estrutura
  quote: 'Diretora do Departamento de Missão: Lilian Conceição da Silva'
ordinations:
- order: diaconate
  date: '2001-12-29'
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rta-livro35
    quote: 'Daiconato: 29 de dezembro de 2001.'
  - source: rcor-drv-diac-karla-lilian-quintino
