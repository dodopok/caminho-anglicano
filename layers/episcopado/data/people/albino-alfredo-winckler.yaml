biography: >-
  Albino Alfredo Winckler, nascido no Rio Grande do Sul em 15/06/1912, foi ordenado diácono em dezembro de 1941
  e presbítero em fevereiro de 1943 por William M. M. Thomas, no Distrito Missionário do Sul do Brasil. Foi transferido
  para a Igreja Episcopal do Brasil em 25/04/1965.
