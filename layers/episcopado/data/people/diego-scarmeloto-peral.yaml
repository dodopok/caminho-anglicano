biography: >-
  Nascido em São Paulo em 27/04/1984; ex-religioso dehoniano (Igreja Católica Romana, cerca de 12-13 anos, com passagem
  como missionário em Moçambique), depois professor e fundador da Capelania Cruz de Amor. Bispo auxiliar de São
  Paulo na lista da WAC no Brasil, com presbiterato em 26/02/2023 e sagração em 25/05/2024. Em seu site pessoal,
  declara ter sido sagrado em 25/05/2024 por Lucas Macieira, Márcio Silva e Josué Torres.
