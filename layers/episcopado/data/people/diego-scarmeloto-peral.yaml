  notes: >-
    Data em dupla fonte primária (site da WAC-BR e site pessoal do bispo). Segundo o site pessoal, os sagrantes
    foram Lucas Macieira (Igreja Episcopal Latina do Brasil), Márcio Silva e Josué Torres, sem distinguir principal
    e co-sagrantes. Local e jurisdição do ato não informados; o site da WAC-BR o lista como bispo auxiliar de São
    Paulo. Notícia enviada pela assessoria de comunicação da diocese e publicada pela imprensa local em 27/05/2024.
    O texto chama Márcio Silva e Josué Torres de 'bispos-coordenantes' (assistentes) e diz que a cerimônia, às 15h,
    foi 'conduzida' por Lucas Macieira. A mesma notícia relata a ordenação episcopal simultânea de três reverendos.
