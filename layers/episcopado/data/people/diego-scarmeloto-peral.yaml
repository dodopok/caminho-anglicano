biography: >-
  Diego Scarmeloto Peral nasceu em São Paulo em 27 de abril de 1984 e passou cerca de 12 anos na Congregação dos
  Padres do Sagrado Coração de Jesus (dehonianos), na Igreja Católica Romana, como aspirante, religioso e missionário
  em Moçambique; foi professor na rede de ensino, inclusive em cursos de extensão em Teologia na Faculdade Dehoniana.
  Ordenado anglicano, fundou a Capelania Cruz de Amor, que presta serviço espiritual a clínicas de idosos em São
  Paulo. Consta presbítero desde 26 de fevereiro de 2023 e bispo auxiliar de São Paulo na WAC no Brasil, sagrado
  em 25 de maio de 2024 em Taboão da Serra (SP), com sagrantes indicados como Lucas Macieira, Márcio Silva e Josué
  Torres; outra fonte descreve a cerimônia como ordenação de membros da Diocese Anglicana Católica do Brasil, de
  modo que as fontes divergem quanto à igreja de origem.
sources:
- source: lwac-diego-bio
  quote: Reverendo Dom Diego Scarmeloto Peral nasceu em São Paulo/SP, no dia 27 de abril de 1984.
- source: lwac-diego-bio
  quote: >-
    Sua caminhada religiosa começou na Igreja Católica Apostólica Romana, na Congregação dos Padres do Sagrado Coração
    de Jesus (Dehonianos – SCJ) . Ao longo de 12 anos, desempenhou diferentes funções, passando pelas etapas de
    aspirante à vida religiosa, religioso (frater) e missionário em Moçambique .
- source: lwac-diego-bio
  quote: >-
    Lecionou no ensino fundamental, no ensino médio e também em cursos de extensão em Teologia na Faculdade Dehoniana,
    contribuindo para a formação de futuros diáconos.
- source: lwac-diego-bio
  quote: tornou-se professor na rede estadual e particular de ensino.
- source: lwac-diego-bio
  quote: >-
    Foi ordenado reverendo anglicano e fundou a Capelania Cruz de Amor , por meio da qual presta serviço espiritual
    a clínicas de idosos.
- source: lwac-diego-bio
  quote: >-
    Graças ao seu trabalho pioneiro , atendendo mais de 15 clínicas na cidade de São Paulo, foi ordenado bispo anglicano
