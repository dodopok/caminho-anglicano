  description: >-
    Trajetória anterior de Diego Scarmeloto Peral: formação e cerca de 12 anos na Congregação dos Padres do Sagrado
    Coração de Jesus (dehonianos), na Igreja Católica Romana, incluindo missão em Moçambique, antes de se tornar
    professor e ministro anglicano.
  status: confirmed
  sources:
  - source: lwac-diego-bio
    quote: >-
      Sua caminhada religiosa começou na Igreja Católica Apostólica Romana, na Congregação dos Padres do Sagrado
      Coração de Jesus (Dehonianos – SCJ) . Ao longo de 12 anos, desempenhou diferentes funções, passando pelas
      etapas de aspirante à vida religiosa, religioso (frater) e missionário em Moçambique .
