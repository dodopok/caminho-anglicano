biography: >-
  Jaci Correia Maraschin nasceu em Bagé (RS) em 12/12/1929. Foi ordenado diácono em novembro de 1953 e presbítero
  em agosto de 1954, por Egmont Krischke, no Distrito Missionário do Sul do Brasil, e foi transferido para a Igreja
  Episcopal do Brasil em 25/4/1965. Foi um dos dois mais votados no concílio extraordinário de 26/3/1977 para eleger
  o bispo da Diocese Sul Central, sem eleição após oito escrutínios, e candidato na eleição episcopal da Diocese
  Central em 24/11/1984, vencida por Sydney Alcoba Ruiz. Presbítero da Diocese Anglicana de São Paulo, depois aposentado,
  é doutor em Ciências da Religião pela Universidade de Strasbourg e professor titular da Universidade Metodista
  de São Paulo; foi assessor teológico de duas conferências de Lambeth e, em julho de 2004, recebeu homenagem pelos
  50 anos de ministério ordenado.
sources:
- source: cd1965
  quote: b Bage RGS Braz 12 Dec 29
- source: cd1965
  quote: D Nov 53 P Aug 54 Bp Krischke
- source: cd1968
  quote: MARASCHIN, Jaci Correia (SBra) Trans to Brazil Ch 25 Apr 65.
- source: kickhofel-1995
  quote: >-
    Antes de voltar aos Estados Unidos, convocou um concílio extraordinário em 26 de março do mesmo ano para eleger
    o seu sucessor, não obtendo sucesso depois de oito escrutínios. Os candidatos mais votados foram os reverendos
    Jaci Correia Maraschin e Saulo Marques da Silva, que não alcançaram o número de votos necessários nas duas ordens.
  page: '287'
- source: kickhofel-1995
  quote: >-
    Sydney Alcoba Ruiz, que foi eleito para o episcopado na segunda sessão do concílio extraordinário especialmente
    convocado para o dia 24 de novembro de 1984, na Paróquia da SS.Trindade (rua Carolina Mayer, 61). Ruiz alcançou
    o número de votos necessários nas duas ordens (clérigos e leigos) no terceiro escrutínio, tendo disputado a
    eleição com os colegas Jaci Correia Maraschin e Paulo Ruiz Garcia.
  page: '278'
- source: d2s32-jaci
  quote: >-
    Por Jaci Maraschin, presbítero da Diocese Anglicana de São Paulo e professor titular da Faculdade de Filosofia
    e Ciências da Religião da Universidade Metodista de São Paulo. É doutor em Ciências da Religião pela Universidade
    de Strasbourg , França, com pós-doutoramento no Union Theological Seminary e na Columbia University de Nova
    York, Estados Unidos.
- source: d2s32-jaci
  quote: >-
    Fui duas vezes assessor teológico das últimas conferências de Lambeth, membro do Conselho Consultivo Anglicano,
    membro da Comissão Anglicana Internacional de Teologia e Doutrina, e, por fim, membro da Comissão Internacional
    de Diálogo com a Igreja Católica Romana.
- source: d2s32-jaci
  quote: Sou clérigo aposentado da Diocese Anglicana de São Paulo
- source: d2s32-simposio
  quote: >-
    As atividades do dia encerraram com uma homenagem ao Rev. Dr. Jaci Maraschin, por ocasião dos seus 50 anos de
    ministério ordenado.
