biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Bagé, RGS,
  Brasil (1929-12-12). Ordenado diácono em nov/1953 e presbítero em ago/1954. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
