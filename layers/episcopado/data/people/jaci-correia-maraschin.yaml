events:
- type: other
  date: '1984-11-24'
  description: Candidato na eleição episcopal da Diocese Central (Rio de Janeiro) vencida por Sydney Alcoba Ruiz
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Sydney Alcoba Ruiz, que foi eleito para o episcopado na segunda sessão do concílio extraordinário especialmente
      convocado para o dia 24 de novembro de 1984, na Paróquia da SS.Trindade (rua Carolina Mayer, 61). Ruiz alcançou
      o número de votos necessários nas duas ordens (clérigos e leigos) no terceiro escrutínio, tendo disputado
      a eleição com os colegas Jaci Correia Maraschin e Paulo Ruiz Garcia.
    page: '278'
- type: other
  date: '1977-03-26'
  description: >-
    Um dos dois mais votados nos concílios de 1977 para eleger o bispo da Diocese Sul Central (26/03, sem eleição
    após oito escrutínios; 30/04, vencido por Sumio Takatsu)
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Antes de voltar aos Estados Unidos, convocou um concílio extraordinário em 26 de março do mesmo ano para eleger
      o seu sucessor, não obtendo sucesso depois de oito escrutínios. Os candidatos mais votados foram os reverendos
      Jaci Correia Maraschin e Saulo Marques da Silva, que não alcançaram o número de votos necessários nas duas
      ordens.
    page: '287'
