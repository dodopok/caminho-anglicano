id: raquel-fernandes
name: Raquel Fernandes
aliases:
- Pastora Raquel Fernandes
biography: >-
  Pastora da Igreja Anglicana Rio, gerente de projetos e graduanda em Teologia pela FTSA; casada com Jorge Alcino.
  Foi confirmada anglicana junto com Jorge em 5/04/2026 em Vitória (ES) (post de Jorge: 'Eu e Raquel...').
sources:
- source: arj-site
  quote: >-
    Pastora, Gerente de Projetos e graduanda em Teologia pela FTSA. Há mais de 10 anos serve na plantação de igrejas
    e no cuidado de pessoas.
- source: arj-ig-raquel
  quote: Pastora na @igrejaanglicanario
