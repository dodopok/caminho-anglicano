events:
- type: other
  date: '2026-04-05'
  description: >-
    Em 5 de abril de 2026 (domingo de Páscoa), em Vitória (ES), Jorge Alcino e Raquel Fernandes foram confirmados
    anglicanos na Igreja (Catedral) Âncora e tiveram o ministério pastoral reconhecido pelo bispo Eric Rodrigues,
    pelos clérigos e pela Rede Episcopal Brasileira, sendo autorizados a plantar a Igreja Anglicana Rio, primeira
    igreja da REB no Rio de Janeiro. Equivale à recepção do casal e da igreja na REB.
  status: confirmed
  sources:
  - source: arj-ig-jorge-5abr
    quote: 5 de abril de 2026 — uma data que ficará em nossas memórias para sempre.
  - source: arj-ig-jorge-5abr
    quote: >-
      Eu e Raquel desembarcamos cedinho em Vitória - ES e fomos acolhidos pela nossa nova família de fé, a @igrejaancora
  - source: arj-ig-jorge-5abr
    quote: >-
      Voltamos ao RJ com os corações radiando fé, alegria e esperança — oficialmente legitimados a plantar a @igrejaanglicanario
      - a primeira igreja da @redeepiscopalbrasileira no Rio de Janeiro!
  - source: arj-ig-igreja-tbt
    quote: >-
      Em pleno domingo da ressurreição, fomos confirmados como anglicanos, tivemos nosso ministério pastoral reconhecido
      diante da nossa amada diocese @igrejaancora e em seguida, enviados como ministros locais para uma missão que
      ainda estava começando: plantar a Igreja Anglicana Rio.
