    quote: Roberto José Schuler, em 19 de maio de 2012
    page: '57'
  notes: >-
    Data completa segundo Costa (2021, p. 245); ano confirmado pela Wikipédia PT. Sagrantes não informados; sucessão
    via Paulo Garcia/ICCEC. Informação extraída de boletins e convite anteriores à cerimônia (anúncio prospectivo):
    Paulo Garcia como sagrante, "coadjuvado pelos demais colegas" (bispos da arquidiocese, não nomeados). O ano
    de 2012 e o dia 19 de maio batem com a data já conhecida de outras fontes; o relato posterior da cerimônia não
    foi localizado. Cargo e sagrantes não informados. Igreja Episcopal Carismática do Brasil. A tese não informa
    local nem sagrantes.
