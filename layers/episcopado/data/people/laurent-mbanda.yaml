events:
- type: other
  date: '2026-08-23'
  description: >-
    Miguel Uchôa instala o filho, Gabriel Moreira Uchôa Cavalcanti, como deão da Catedral Anglicana do Espírito
    Santo, em cerimônia com Laurent Mbanda (presidente do Global Anglican Council).
  status: confirmed
  sources:
  - source: ai-2026-08-24-mbanda
    quote: >-
      It has been a great joy to gather this weekend in Recife, Brazil, with leaders of the Global Anglican Communion
      to celebrate the installation of the Very Revd Gabriel Moreira Uchoa Cavalcanti as Dean of the Catedral Anglicana
      do Espírito Santo.
  - source: portal-catedral-30anos
    quote: >-
      O encerramento ocorrerá no domingo, às 10h, com um culto solene que marcará a instituição do reverendo Gabriel
      Uchoa como novo deão
- type: other
  date: '2025-10-03'
  description: >-
    O GAFCON (Laurent Mbanda, presidente do Conselho de Primazes) reage à nomeação de Sarah Mullally para arcebispo
    de Cantuária com a carta "Canterbury Appointment Abandons Anglicans": declara que Cantuária já não pode liderar
    a Comunhão e confirma a convocação dos bispos para a G26 em Abuja (3–6/03/2026).
  status: confirmed
  sources:
  - source: gace-canterbury-abandons
    quote: >-
      it is with sorrow that Gafcon receives the announcement today of the appointment of Dame Sarah Mullally as
      the next Archbishop of Canterbury.
  - source: gace-canterbury-abandons
    quote: >-
      The reset of our beloved Communion is now uniquely in the hands of Gafcon, and we are ready to take the lead.
  - source: gace-canterbury-abandons
    quote: >-
      Gafcon has summoned global orthodox Anglican bishops to Abuja, Nigeria, from 3 to 6 March, 2026, for the G26
      Bishops Assembly.
- type: other
  date: '2025-10-16'
  description: >-
    Martyrs’ Day Statement ("The Future Has Arrived"): os primazes do GAFCON declaram a Comunhão Anglicana "reordenada",
    rejeitam os quatro Instrumentos de Comunhão (arcebispo de Cantuária, Conferência de Lambeth, Conselho Consultivo
    Anglicano, Reunião dos Primazes), proíbem as províncias de participar de reuniões convocadas por Cantuária e
    de financiar o Conselho Consultivo Anglicano, exigem assentimento à Declaração de Jerusalém para ser membro
    e anunciam: "we are now the Global Anglican Communion".
  status: confirmed
  sources:
  - source: gace-future-has-arrived
    quote: Our Gafcon Primates gathered this hour to fulfil our mandate to reform the Anglican Communion
  - source: gace-future-has-arrived
    quote: >-
      To be a member of the Global Anglican Communion, a province or a diocese must assent to the Jerusalem Declaration
      of 2008, the contemporary standard for Anglican identity.
  - source: gace-future-has-arrived
    quote: >-
      As has been the case from the very beginning, we have not left the Anglican Communion; we are the Anglican
      Communion.
  - source: gace-abuja-affirmation
    quote: >-
      announced the inauguration of the Global Anglican Communion in the October 2025 Martyrs’ Day Statement (MDS).
  - source: gace-we-are-gac
    quote: We rejoice that we have not left the Communion… we are the Communion!
  - source: gace-council-of-primates
    quote: >-
      the initiative approved by the Gafcon Primates’ Council on 16th October to form a new Council of Primates
      for the Global Anglican Communion
- type: other
  date: '2026-03-03'
  description: >-
    Conferência G26 (Gafcon Global G26 Bishops Conference), em Abuja (Nigéria), 3–6/03/2026, sediada pela Igreja
    da Nigéria em St Matthias House: 347 bispos e 121 líderes leigos e clérigos de 27 províncias; não é uma assembleia
    GAFCON plena (a próxima, GAFCON V, está marcada para Atenas em 2028).
  status: confirmed
  sources:
  - source: gace-abuja-affirmation
    quote: >-
      Greetings from Abuja, Nigeria where 347 Anglican bishops and 121 lay and clerical Anglican leaders from 27
      provinces met from 3-6 March 2026, generously hosted by our brothers and sisters in the Church of Nigeria.
  - source: gace-g26-day-two
    quote: >-
      the second day of the Gafcon Global G26 Conference at St Matthias House, the national headquarters of the
      Church of Nigeria (Anglican Communion).
  - source: gace-ai-kaziimba-abuja
    quote: >-
      The G26 gathering, held March 3-6 in Abuja, was a specialised bishops conference — not a full GAFCON Assembly.
- type: other
  date: '2026-03-05'
  description: >-
    Em Abuja (G26), os primazes do GAFCON dissolvem o Conselho de Primazes do GAFCON (em funcionamento desde 2008)
    e criam o Global Anglican Council, com primazes, conselheiros (advisors) e garantidores (guarantors), todos
    com voto; o presidente será um primaz, mas não "primus inter pares". Eleitos por unanimidade: Laurent Mbanda
    (presidente), Miguel Uchôa (vice-presidente) e Paul Donison (secretário-geral), com mandatos até o fim do GAFCON
    V (Atenas, 2028).
  status: confirmed
  sources:
  - source: gace-council-to-lead
    quote: >-
      the Gafcon Primates have dissolved the Gafcon Primates Council, which has faithfully led and served the Gafcon
      movement since 2008.
  - source: gace-council-to-lead
    quote: >-
      creating the Global Anglican Council which includes primates, advisors, and guarantors, which will include
      bishops, clergy, and lay members each with full voting privileges.
  - source: gace-council-to-lead
    quote: >-
      While the Chairman of the Council will be a Primate, he will not be primus inter pares (first amongst equals).
  - source: gace-council-to-lead
    quote: Our terms will conclude at the end of GAFCON V in Athens in 2028.
  - source: gafcon-2026-03-04-gac
    quote: >-
      We give thanks to God for a historic announcement made on Thursday in Abuja, Nigeria, on the third day of
      the Gafcon Global G26 Conference.
  - source: gace-ai-kaziimba-abuja
    quote: The GAFCON Primates Council was transitioned into the newly established Global Anglican Council
- type: other
  date: '2026-03-06'
  description: >-
    Publicada a Abuja Affirmation, documento final da G26 (tema "Choose this day whom you will serve"), assinada
    por Laurent Mbanda como presidente do Global Anglican Council: define a GAC como comunhão confessional baseada
    na Declaração de Jerusalém, exige "principled disengagement" dos Instrumentos de Cantuária para quem ocupa cargo
    na GAC e atribui ao Global Anglican Council reconhecer províncias e dioceses e convidar novos primazes.
  status: confirmed
  sources:
  - source: gace-abuja-affirmation
    quote: Chairman, Global Anglican Council
  - source: gace-abuja-affirmation
    quote: >-
      The Global Anglican Council will also authenticate newly formed provinces and dioceses who seek recognition
      as Global Anglicans.
  - source: gace-abuja-affirmation
    quote: >-
      The Global Anglican Communion is not a new Communion, but the historic Anglican Communion reordered from within.
  - source: gace-gazette-abuja
    quote: >-
      A significant administrative shift was also announced, with the “Gafcon Primates Council” being officially
      replaced by the Global Anglican Council.
- type: other
  date: '2026-08-22'
  description: >-
    Reunido em Recife (Brasil), o Global Anglican Council decide estabelecer a sede (headquarters) da Global Anglican
    Communion em Abuja, Nigéria.
  status: confirmed
  sources:
  - source: gace-home-for-communion
    quote: This decision was made at our meeting in Recife, Brazil, on Saturday 22 August 2026
  - source: gace-faithfulness-brazil
    quote: >-
      During our time in Recife, members of the Global Anglican Council also met for important discussions as we
      continue the transition and development of the Global Anglican Communion.
- type: other
  date: '2026-09-11'
  description: >-
    Manasseh Gahima, bispo de Gahini, é eleito pela Câmara dos Bispos o quinto arcebispo e primaz da Igreja Anglicana
    de Ruanda, sucessor de Laurent Mbanda.
  status: confirmed
  sources:
  - source: gace-gahima-elected
    quote: >-
      I am delighted to congratulate The Rt Revd Dr Manasseh Gahima, Bishop of Gahini, on his election as the next
      Archbishop and Primate of the Anglican Church of Rwanda.
  - source: gacm-ai-2026-09-11-rwanda
    quote: >-
      The House of Bishops of the Province de l’Eglise Anglicane du Rwanda (EAR) is to meet today (11 September
      2026) to elect the fifth Archbishop and Primate of the province
