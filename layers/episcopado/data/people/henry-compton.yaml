biography: >-
  Henry Compton foi sagrado em 6 de dezembro de 1674, em Lambeth, por Gilbert Sheldon, como bispo de Oxford. Em
  1675 foi transferido para a diocese de Londres, que ocupou até morrer, em 7 de julho de 1713.
