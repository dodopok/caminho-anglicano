events:
- type: other
  date: '2007-01-14'
  description: >-
    Em janeiro de 2007 Dom Robinson Cavalcanti fez uma visitação de cerca de 18 dias ao Arcediagado Norte-Americano
    da Diocese do Recife (arcediago: Rev. Duncan Clark), passando por St. Stephens (Oak Harbor, Washington), Christ
    the King (Spokane), Walla Walla, St. Charles (Poulsbo), a missão de Eugene (Oregon), o Seminário Trinity (Ambridge,
    Pensilvânia) e as missões da Flórida; em Poulsbo houve confirmações e uma ordenação diaconal, apresentada como
    a primeira em território norte-americano da diocese (o Rev. Michael La Cagnina fora ordenado no Brasil), e o
    bispo entrevistou nove aspirantes às ordens sagradas.
  status: confirmed
  sources:
  - source: darb2-breves-06
    quote: >-
      A primeira Confirmação desde o episódio dos 11, de Ohio, em 2004, e a primeira Ordenação em território norte-americano
      (o Michael La Cagnina foi Ordenado no Brasil)
  - source: darb2-breves-06
    quote: Dezoito dias de abençoado trabalho
  - source: darb2-breves-06
    quote: entrevistar mais um (o nono) Aspirante às Sagradas Ordens
  - source: darb2-breves-05
    quote: A noite foi o ensaio para as Confirmações e Ordenação Diaconal do próximo domingo
  - source: darb2-breves-08
    quote: Missão Anglicana da Santíssima Trindade
