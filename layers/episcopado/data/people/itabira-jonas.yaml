# yaml-language-server: $schema=../../schemas/person.json
id: itabira-jonas
name: Itabira Jonas
aliases:
- Dom Itabira
biography: >-
  Bispo ordinário da Diocese Anglicana de São Paulo e Paraná (TAC); recebido no anglicanismo em 1997, diácono e
  padre no Movimento Anglicano Continuante, sagrado bispo em 11/1/2018.
sources:
- source: tac-sppr-diocese
  quote: >-
    Dom Itabira Jonas foi recebido no anglicanismo em 1997; Tornou-se Diácono e Sacerdote no Movimento Anglicano
    Continuante, e foi Sagrado Bispo em 11 de janeiro de 2018.
ordinations:
- order: episcopate
  date: '2018-01-11'
  jurisdiction: iacc
  principal_consecrator: james-antonio-roque
  status: contested
  sources:
  - source: tac-sppr-diocese
    quote: >-
      e foi Sagrado Bispo em 11 de janeiro de 2018.  É um dos 2 Bispos da Igreja Anglicana Tradicional – TAC no
      Brasil
  - source: costa2021
    quote: >-
      em seguida, ordenou muitas pessoas ao episcopado, a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino
      de Sousa Barreiros, Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa
      da Silva.
  - source: cant-novas-igrejas-2024
    quote: >-
      Como seus primeiros atos litúrgicos episcopais, o bispo James Roque, ordenou outros clérigos ao episcopado,
      a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de Sousa Barreiros, Claudinei Rodrigo Ferreira,
      Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da Silva.
    page: '76'
  - source: cant-novas-igrejas-2024
    quote: >-
      Entre os bispos ordenados por James estavam: Dom José Kennedy de Freitas, organizador da Igreja Anglicana
      de Confissão Continuante; Dom Marcos Mattos, nomeado bispo da Diocese Anglicana Continuante do Rio de Janeiro
      (falecido prematuramente, antes da consolidação da diocese); Dom Albertino de Sousa Barreiros, da Diocese
      Anglicana do Natal; Dom Claudinei Rodrigo Ferreira, da Diocese Anglicana de Santa Catarina; Dom Itabira Jonas,
      da Diocese Anglicana de São Paulo e Paraná; Dom Francisco de Assis Coelho e Pinho, bispo eleito e delegado
      episcopal da Pró-Diocese Anglicana do Amazonas; e dom José Barbosa da Silva, da Diocese Anglicana de Portugal,
      na União Europeia.
    page: '157'
  - source: costa2021
    quote: >-
      ordenou muitas pessoas ao episcopado, a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de Sousa
      Barreiros, Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa da
      Silva.
    page: '138'
  discrepancies:
  - field: jurisdiction
    value: da-japi
    sources:
    - source: costa2021
      quote: >-
        ordenou muitas pessoas ao episcopado, a exemplo de José Kennedy de Freitas, Marcos Mattos, Albertino de
        Sousa Barreiros, Claudinei Rodrigo Ferreira, Itabira Jonas, Francisco de Assis Coelho e Pinho e José Barbosa
        da Silva.
      page: '138'
  notes: >-
    Sagrantes não informados. O site da IACC lista Itabira Jonas entre os bispos que receberam a 'linhagem episcopal'
    de James Roque (sucessão declarada: Cruz-Blanco → Roque). Em 2018 ainda não era TAC (as dioceses brasileiras
    foram recebidas na TAC em 2025); jurisdição na data provavelmente IACC. Costa (2021) e o site da IACC dizem
    que James Roque 'ordenou' estes bispos. Para Itabira Jonas, a data de 11/1/2018 vem do site da diocese (registro
    separado); para Barreiros, c. 2019. Pode tratar-se do mesmo evento já registrado. Data não informada; entre
    os 'primeiros atos' episcopais de James Roque (após 2013), no contexto da Diocese Anglicana do Japi. 'da Diocese
    Anglicana de São Paulo e Paraná'. Data não informada. Datas não informadas; a Diocese do Japí foi depois extinta
    e esses bispos fundaram igrejas anglicanas independentes.
