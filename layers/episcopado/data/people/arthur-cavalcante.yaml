id: arthur-cavalcante
name: Arthur Cavalcante
full_name: Arthur Pereira Cavalcante
aliases:
- Arthur Pereira Cavalcante
- Arthur Pereira Cavalcanti
biography: >-
  Arthur Cavalcante, graduado em Odontologia (1997), bacharel em Teologia pelo Seminário Anglicano de Estudos Teológicos
  (2002) e mestre em Ciências da Religião pela Universidade Metodista de São Paulo (2010), foi ordenado diácono
  em 3 de fevereiro de 2001, na Paróquia do Bom Samaritano, por Robinson Cavalcanti, e foi secretário executivo
  da Diocese Anglicana do Recife em 2002–2003. Em São Paulo, é professor do Instituto Anglicano de Estudos Teológicos
  desde 2004 e foi reitor da Paróquia da Santíssima Trindade a partir de 2005. Integra a Comissão Nacional de Liturgia
  da IEAB desde 2006 e foi secretário-geral da IEAB de 2011 a 2018. Em 24 de novembro de 2018, celebrou o primeiro
  casamento entre duas mulheres na Diocese Anglicana de São Paulo, após o Sínodo aprovar o matrimônio entre pessoas
  do mesmo sexo na IEAB. Desde 2022 é deão da Catedral Anglicana de São Paulo.
sources:
- source: artc-anglicanosms-2017
  quote: >-
    O Rev. Arthur é graduado em Odontologia pela Faculdade de Odontologia de Caruaru (1997) e Bacharel em Teologia
    no Seminário Anglicano de Estudos Teológicos - SAET (2002), com mestrado em Ciências da Religião pela Universidade
    Metodista de São Paulo-UMESP (2010).
- source: artc-ihu-secgeral-2011
  quote: >-
    graduado em Odontologia pela Faculdade de Caruaru, e em Teologia, desde 2002, pelo Seminário Anglicano de Estudos
