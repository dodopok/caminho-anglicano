biography: >-
  Arthur Cavalcante é graduado em Odontologia pela Faculdade de Caruaru (1997), bacharel em Teologia pelo Seminário
  Anglicano de Estudos Teológicos (2002) e mestre em Ciências da Religião pela Universidade Metodista de São Paulo
  (2010). Foi ordenado diácono em 3 de fevereiro de 2001, na Paróquia do Bom Samaritano, por Robinson Cavalcanti,
  e foi secretário executivo da Diocese Anglicana do Recife em 2002–2003. Ordenado presbítero pela IEAB, mudou-se
  para São Paulo, onde é professor do Instituto Anglicano de Estudos Teológicos desde 2004 e foi reitor da Paróquia
  da Santíssima Trindade a partir de 2005. Integra a Comissão Nacional de Liturgia da IEAB desde 2006 e foi secretário-geral
  da IEAB de 2011 a 2018. Em 24 de novembro de 2018, celebrou o primeiro casamento entre duas mulheres na Diocese
  Anglicana de São Paulo, após o Sínodo aprovar o matrimônio entre pessoas do mesmo sexo na IEAB. Em 17 de julho
  de 2022, com a instalação da Paróquia da Santíssima Trindade como catedral diocesana, foi instituído deão, função
  em que aparece em 2026.
sources:
