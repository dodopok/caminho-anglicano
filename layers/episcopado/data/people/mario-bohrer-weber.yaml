biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil, ordenado diácono em maio de 1923 e presbítero em outubro de
  1924 por Lucien Lee Kinsolving. Foi transferido para a Igreja Episcopal do Brasil em 25 de abril de 1965.
