# yaml-language-server: $schema=../../schemas/person.json
id: dylmar-balduino-correia-da-costa
name: Dylmar Balduino Correia da Costa
aliases:
- Dylmar Corrêa Baldoíno da Costa
biography: >-
  Arcebispo primaz da ICAJ (Igreja Católica Apostólica "J...", sigla na grafia da fonte), que sagrou Jorge Costa
  em 07/09/1980; segundo o site de Dom Marcos Vinícius, foi ordenado/sagrado por Luigi Máscolo e transmitiu a sucessão
  a José Elias Jácomo dos Santos. Variantes do nome: Dylmar Corrêa Baldoíno da Costa.
sources:
- source: lia-iatb-juris-2013
  quote: >-
    Em 07 de Setembro de 1980, foi Sagrado Bispo, por Dom Dylmar Balduino Correia da Costa, Arcebispo Primaz da
    ICAJ.
ordinations:
- order: episcopate
  date: null
  jurisdiction: icaj
  principal_consecrator: luigi-mascolo
  status: probable
  sources:
  - source: lica-marcos-quemsou
    quote: >-
      Dom Luigi Máscolo, que ordenou Dom Dylmar Corrêa Baldoíno da Costa, que ordenou Dom José Elias Jácomo dos
      Santos
  notes: >-
    Fonte única e autodeclarada (site pessoal de um bispo que reivindica a mesma linha). Sem data nem local. O mesmo
    site apresenta a cadeia Carlos Duarte Costa - Antídio José Vargas - Luigi Máscolo - Dylmar - José Elias Jácomo
    dos Santos - Ricardo Vicente dos Anjos. Um fragmento do periódico "Sinais dos Tempos" (consultado só por trecho
    de busca no Internet Archive) diz que "em 1980, D. Dylmar Corrêa Baldoíno da Costa proclamou-se..." (texto cortado).
