biography: >-
  Ordenado diácono e presbítero na Igreja Romana, foi recebido em dezembro de 1958 e passou a clérigo do distrito
  missionário do Sudoeste do Brasil (DMSOB). Em 25/04/1965 foi transferido para a Igreja Episcopal do Brasil.
