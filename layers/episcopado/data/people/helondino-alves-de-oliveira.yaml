biography: >-
  Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra) segundo o Clerical Directory 1965. Nascido em Piratini,
  RGS, Brasil (1913-08-29). Ordenado diácono em nov/1954 e presbítero em dez/1956. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
sources:
