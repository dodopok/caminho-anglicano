  sources:
  - source: stubbs-1897
    quote: >-
      a. d. 1617, Dec. 14. Nicolas Felton. Bristol ; Ely, 1619 ; d. 1626, Oct. 5 ; and George Monteigne. Lincoln
      ; London, 1621 ; Durham, 1628 ; York, 1628 ; d. 1628, Nov. 6. Consecrated at Lambeth by Archbishop Abbot,
      Marco Antonio of Spalato, John of London, Launcelot of Ely, John of Rochester, and John of Lichfield; Reg.
      Abbot, 96, 105 ;
  notes: >-
    Stubbs (Registrum Sacrum Anglicanum, 1897) segue os registros dos arcebispos (citados no fim de cada verbete)
    e nomeia o sagrante que presidiu primeiro. Os co-sagrantes aparecem só como 'Prenome of Sé'; a identificação
    dos nomes completos foi feita cruzando com os próprios verbetes de Stubbs (quem ocupava a sé na data). Sagrado
    bispo de Lincoln, junto com Nicholas Felton. Co-sagrante notável: Marco Antonio (de Dominis), arcebispo católico
    de Spalato, então na Inglaterra. John of London = John King; Launcelot of Ely = Lancelot Andrewes; John of Rochester
    = John Buckeridge; John of Lichfield = John Overall.
