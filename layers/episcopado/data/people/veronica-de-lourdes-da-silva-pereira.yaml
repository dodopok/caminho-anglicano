id: veronica-de-lourdes-da-silva-pereira
name: Veronica de Lourdes da Silva Pereira
biography: >-
  Ordenada diácona em novembro de 2008 na Diocese Anglicana do Recife (DAR), foi ministra encarregada do Ponto Missionário
  Anglicano Compaixão e integrou a Comissão de Novas Paróquias e Missões da DAR. Em 2025 consta como clériga da
  Diocese de João Pessoa (IAB).
