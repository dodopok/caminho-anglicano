id: veronica-de-lourdes-da-silva-pereira
name: Veronica de Lourdes da Silva Pereira
biography: >-
  Ordenada diácona em novembro de 2008 na Diocese Anglicana do Recife (DAR), foi ministra encarregada do Ponto Missionário
  Anglicano Compaixão, em Cabedelo (PB), no Arcediagado PB/CE/RN. Em listas de 2009 a 2011 consta nas comissões
  de Novas Paróquias e Missões e de Credenciais e Diplomacia da DAR. Em agosto de 2010 esteve presente à inauguração
  do novo espaço de cultos do Ponto Missionário Anglicano Vida, em Campina Grande (PB). Em 2025 consta como clériga
  da Diocese de João Pessoa (IAB).
