id: luis-fernando-salgado
name: Luis Fernando Salgado
ordinations:
- order: presbyterate
  date: '2005-03-27'
  place: Igreja Evangélica Congregacional de Ribeirão Preto (SP)
  jurisdiction: iadb-lorite
  ordained_by: iranildo-macieira-da-silva
  status: probable
  sources:
  - source: ig-josue-2025-03-28-presbiterato-2005
    quote: >-
      Na data de 27 de março de 2005, Domingo de Páscoa, os Rev. Diáconos Ricardo Lorite de Lima, Rui Costa Barbosa,
      Luis Fernando Salgado e Josué Souza Torres foram elevados ao Ministério Presbiteral da Igreja de Cristo, Una,
      Santa, Católica e Apostólica, através da imposição das mãos de Dom Iranildo Macieira das Silva (Dom Lucas).
      A cerimônia de Ordenação ocorreu na Igreja Evangélica Congregacional de Ribeirão Preto.
  notes: >-
    Também impuseram as mãos os padres Manuel (Igreja Antigo-Católica), João Ripoli e Mário Palumbo (Igreja Católica
    Romana). Ordenações autorizadas por Leonardo Marin-Saavedra (Anglican Independent Communion Worldwide).
