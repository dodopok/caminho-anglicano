- jurisdiction: aic-w
  role: bishop
  start: '2006-01-15'
  status: confirmed
  sources:
  - source: lia-iatb-arcebispo-2008
    quote: >-
      Consecrated as Bishop and Installed Coadjutor Bishop of The Anglican Independent Communion Worldwide - Brazil
      in 15th January 2006.
  - source: lia-iatb-pagina-2008-noticias
    quote: >-
      Historicamente esse fato é um ato reparador, pois D. Rui Costa Barbosa foi consagrado justamente para servir
      a AICW, porém, pelos caminhos insondáveis de Deus, por vários motivos, o mesmo passou quase um ano fora daquela
      comunhão.
