      Na data de 27 de março de 2005, Domingo de Páscoa, os Rev. Diáconos Ricardo Lorite de Lima, Rui Costa Barbosa,
      Luis Fernando Salgado e Josué Sousa Torres foram elevados ao Ministério Presbiteral da Igreja de Cristo, Una,
      Santa, Católica e Apostólica, através da imposição das mãos de Dom Iranildo Macieira das Silva (Dom Lucas).
  - source: cant-novas-igrejas-2024
    quote: e no dia 27 de março, os quatro diáconos foram ordenados presbíteros por bispos independentes.
    page: '118'
  - source: yt-raizes-da-fe-ep4
    quote: Esse bispo que brasileiro nos ordenaria ao diaconato e ao presbiterato
  - source: yt-raizes-da-fe-ep4
    quote: bispo de de brasileiro, ele nos nos ordenou diabo e depois presbíteros.
  - source: ig-josue-2025-03-28-presbiterato-2005
    quote: >-
      Na data de 27 de março de 2005, Domingo de Páscoa, os Rev. Diáconos Ricardo Lorite de Lima, Rui Costa Barbosa,
      Luis Fernando Salgado e Josué Souza Torres foram elevados ao Ministério Presbiteral da Igreja de Cristo, Una,
      Santa, Católica e Apostólica, através da imposição das mãos de Dom Iranildo Macieira das Silva (Dom Lucas).
      A cerimônia de Ordenação ocorreu na Igreja Evangélica Congregacional de Ribeirão Preto.
  notes: >-
    O livro diz apenas 'por bispos independentes', sem nomeá-los. Ordenante não nomeado: um bispo brasileiro sagrado
    por Raposo em Portugal. Também impuseram as mãos os padres Manuel (Igreja Antigo-Católica), João Ripoli e Mário
    Palumbo (Igreja Católica Romana). Ordenações autorizadas por Leonardo Marin-Saavedra (Anglican Independent Communion
    Worldwide).
