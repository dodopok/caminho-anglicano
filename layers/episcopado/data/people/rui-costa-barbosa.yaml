  - source: lia-iatb-noticias-2012
    quote: foi o pregador convidado no dia da ordenação episcopal e sagração de Dom Rui Costa Barbosa.
  - source: costa2021
    quote: >-
      Após receberem as ordens do diaconato e do presbiterato por bispos independentes, Ricardo Lorite e Rui Barbosa
      tiveram sua ordenação episcopal através dos bispos Norman Dutton, Frank Peachey e Iranildo Macieira da Silva
      (Igreja Episcopal Latina do Brasil).
  - source: cant-novas-igrejas-2024
    quote: >-
      Os reverendos Ricardo Lorite e Rui Barbosa tiveram sua ordenação episcopal através dos bispos Norman Dutton,
      Frank Peachey e Lucas Macieira da Silva (Igreja Episcopal Latina do Brasil), em 15 de janeiro de 2006.
    page: '118'
  - source: yt-raizes-da-fe-ep4
    quote: >-
      veio esse bispo que eu já citei o nome, é Barry Frank Pitt, que tá na minha na minha linha de sucessão, né?
  - source: yt-raizes-da-fe-ep4
    quote: ele fez a ordenação em na cidade de Tabuão da Serra, onde existe nosso bispo
  discrepancies:
  - field: jurisdiction
    value: iadb-lorite
    sources:
    - source: costa2021
      quote: >-
        Após receberem as ordens do diaconato e do presbiterato por bispos independentes, Ricardo Lorite e Rui Barbosa
        tiveram sua ordenação episcopal através dos bispos Norman Dutton, Frank Peachey e Iranildo Macieira da Silva
        (Igreja Episcopal Latina do Brasil).
    - source: cant-novas-igrejas-2024
      quote: >-
        Os reverendos Ricardo Lorite e Rui Barbosa tiveram sua ordenação episcopal através dos bispos Norman Dutton,
        Frank Peachey e Lucas Macieira da Silva (Igreja Episcopal Latina do Brasil), em 15 de janeiro de 2006.
      page: '118'
  notes: >-
    Fontes primárias da própria IATB (páginas de 2008 a 2017 arquivadas) coincidem: sagrante principal Barry Frank
    Peachey (Bispo in Anglia e Chanceler Metropolitano da AIC-W); co-sagrantes Norman Sydney Dutton, em ausência,
    e Iranildo (Lucas) Macieira da Silva, primaz da Igreja Episcopal Latina do Brasil. A sagração foi para servir
    como bispo coadjutor da AIC-W no Brasil. A IATB (2011) lembra que Dutton, por sua vez, sagrou Peachey. O pregador
    convidado da cerimônia foi Antonio Marcos Novaes Tavares, depois incardinado na IATB (vindo da Igreja Presbiteriana
    do Brasil). Data e sagrante principal não informados; a fonte lista três bispos sagrantes sem hierarquia. Iranildo
    Macieira da Silva é da 'Igreja Episcopal Latina do Brasil'. O livro diz 'através dos bispos' Norman Dutton,
    Frank Peachey e Lucas Macieira, sem indicar o sagrante principal. Na p. 119 Rui aparece como bispo coadjutor
    da IAdB. A IATB (p. 136) diz ter origem em 2006, 'após a sagração do bispo e atual primaz, Rui Costa Barbosa'.
    A tese lista os três bispos sem indicar o sagrante principal nem data. Diaconato e presbiterato recebidos de
    'bispos independentes' não nomeados. No podcast Rui diz que Peachey sagrou a ele e a Ricardo Lorite em Taboão
    da Serra, com apoio local de Josué Torres.
