# yaml-language-server: $schema=../../schemas/person.json
id: rui-costa-barbosa
name: Rui Costa Barbosa
full_name: Rui Costa Barbosa
aliases:
- Dom Rui Barbosa
- Dom Rui Costa
- Rui Barbosa
biography: >-
  Bispo primaz da Igreja Anglicana Tradicional do Brasil (IATB/AECI), São Paulo. Ex-membro da Diocese Anglicana
  de São Paulo (IEAB); sagrado por Norman Dutton, Frank Peachey e Iranildo Macieira da Silva (Costa 2021); fundador
  da 'Diocese Anglicana Católica do Brasil', depois IATB (Santo André).
sources:
- source: iatb-comunidades
  quote: sob a direção do Bispo Primaz do Brasil, Dom Rui Costa Barbosa.
- source: costa2021
  quote: >-
    Ricardo Lorite e Rui Barbosa tiveram sua ordenação episcopal através dos bispos Norman Dutton, Frank Peachey
    e Iranildo Macieira da Silva (Igreja Episcopal Latina do Brasil).
ordinations:
- order: diaconate
  date: '2005-03-26'
  place: Ribeirão Preto (SP)
  jurisdiction: iadb-lorite
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      No dia 26 de março de 2005, na cidade de Ribeirão Preto (SP), os ministros licenciados Ricardo Lorite de Lima,
      Rui Costa Barbosa, Luis Fernando Salgado e Josué Sousa Torres foram elevados ao Ministério Diaconal
    page: '118'
  notes: O livro não nomeia o ordenante.
- order: presbyterate
  date: '2005-03-27'
  place: Igreja Evangélica Congregacional de Ribeirão Preto (SP)
  jurisdiction: iadb-lorite
  ordained_by: iranildo-macieira-da-silva
  status: probable
  sources:
  - source: ig-josue-2025-03-28-presbiterato-2005
    quote: >-
      Na data de 27 de março de 2005, Domingo de Páscoa, os Rev. Diáconos Ricardo Lorite de Lima, Rui Costa Barbosa,
      Luis Fernando Salgado e Josué Souza Torres foram elevados ao Ministério Presbiteral da Igreja de Cristo, Una,
      Santa, Católica e Apostólica, através da imposição das mãos de Dom Iranildo Macieira das Silva (Dom Lucas).
      A cerimônia de Ordenação ocorreu na Igreja Evangélica Congregacional de Ribeirão Preto.
  - source: cant-novas-igrejas-2024
    quote: e no dia 27 de março, os quatro diáconos foram ordenados presbíteros por bispos independentes.
    page: '118'
  notes: >-
    Também impuseram as mãos os padres Manuel (Igreja Antigo-Católica), João Ripoli e Mário Palumbo (Igreja Católica
    Romana). Ordenações autorizadas por Leonardo Marin-Saavedra (Anglican Independent Communion Worldwide). O livro
    diz apenas 'por bispos independentes', sem nomeá-los.
- order: episcopate
  date: '2006-01-15'
  jurisdiction: iadb-lorite
  office: suffragan
  co_consecrators:
  - barry-frank-peachey
  - iranildo-macieira-da-silva
  - norman-dutton
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Após receberem as ordens do diaconato e do presbiterato por bispos independentes, Ricardo Lorite e Rui Barbosa
      tiveram sua ordenação episcopal através dos bispos Norman Dutton, Frank Peachey e Iranildo Macieira da Silva
      (Igreja Episcopal Latina do Brasil).
  - source: cant-novas-igrejas-2024
    quote: >-
      Os reverendos Ricardo Lorite e Rui Barbosa tiveram sua ordenação episcopal através dos bispos Norman Dutton,
      Frank Peachey e Lucas Macieira da Silva (Igreja Episcopal Latina do Brasil), em 15 de janeiro de 2006.
    page: '118'
  notes: >-
    Data e sagrante principal não informados; a fonte lista três bispos sagrantes sem hierarquia. Iranildo Macieira
    da Silva é da 'Igreja Episcopal Latina do Brasil'. O livro diz 'através dos bispos' Norman Dutton, Frank Peachey
    e Lucas Macieira, sem indicar o sagrante principal. Na p. 119 Rui aparece como bispo coadjutor da IAdB. A IATB
    (p. 136) diz ter origem em 2006, 'após a sagração do bispo e atual primaz, Rui Costa Barbosa'. A tese lista
    os três bispos sem indicar o sagrante principal nem data. Diaconato e presbiterato recebidos de 'bispos independentes'
    não nomeados.
