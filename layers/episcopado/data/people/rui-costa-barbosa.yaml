  - source: lia-iatb-clerigos-2015
    quote: >-
      Ordenado ao episcopado pelo Revmo. Bispo Dom Barry Frank Peachey, da Comunhão Anglicana Independente (AIC-W)
      em 15 de janeiro de 2006, no Centro de Esportes Municipal (CEMUR), cidade de Taboão da Serra, Estado de São
