    Local: Brasil, coadjutor. A própria IATB relata que, depois da sagração, Rui ficou 'quase um ano' fora da AIC-W,
    sendo a Igreja readmitida como província em 10/10/2007 (carta de Patricio Viveros Robles e Peter McInnes). Em
    07/12/2009 passou a integrar o Colégio Internacional de Arcebispos da AIC-W como arcebispo metropolitano para
    o Brasil.
