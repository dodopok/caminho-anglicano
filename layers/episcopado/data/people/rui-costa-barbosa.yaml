- Rui Barbosa
- Rui Da Costa Barbosa
biography: >-
  Bispo primaz da Igreja Anglicana Tradicional do Brasil (IATB/AECI), São Paulo. Ex-membro da Diocese Anglicana
  de São Paulo (IEAB); sagrado por Norman Dutton, Frank Peachey e Iranildo Macieira da Silva (Costa 2021); fundador
  da 'Diocese Anglicana Católica do Brasil', depois IATB (Santo André).
sources:
- source: iatb-comunidades
  quote: sob a direção do Bispo Primaz do Brasil, Dom Rui Costa Barbosa.
- source: costa2021
  quote: >-
    Ricardo Lorite e Rui Barbosa tiveram sua ordenação episcopal através dos bispos Norman Dutton, Frank Peachey
    e Iranildo Macieira da Silva (Igreja Episcopal Latina do Brasil).
ordinations:
- order: diaconate
  date: '2005-03-26'
  place: Ribeirão Preto (SP), Casa da Meditação Cristã "Disciplina Pacis"
  jurisdiction: iadb-lorite
  ordained_by: iranildo-macieira-da-silva
  status: probable
  sources:
  - source: lielb-iab-historia
    quote: >-
      No dia 26 de março de 2005, Sábado Santo, os ministros licenciados Ricardo Lorite de Lima, Rui Costa Barbosa,
      Luis Fernando Salgado e Josué Sousa Torres foram elevados ao Ministério Diaconal da Igreja de Cristo, Una,
      Santa, Católica e Apostólica, através da imposição das mãos do bispo vetero-católico Dom Iranildo Macieira
      das Silva (Dom Lucas).
  - source: cant-novas-igrejas-2024
    quote: >-
      No dia 26 de março de 2005, na cidade de Ribeirão Preto (SP), os ministros licenciados Ricardo Lorite de Lima,
      Rui Costa Barbosa, Luis Fernando Salgado e Josué Sousa Torres foram elevados ao Ministério Diaconal
    page: '118'
  - source: yt-raizes-da-fe-ep4
    quote: Esse bispo que brasileiro nos ordenaria ao diaconato e ao presbiterato
  - source: yt-raizes-da-fe-ep4
    quote: do Dom Raposo, que é um bispo que o mundo inteiro conheceu.
  notes: >-
    Ordenante identificado como "Bispo Primaz Metropolitano da Igreja Episcopal Latina do Brasil (vetero-católica)".
    Fonte: história da Igreja Anglicana do Brasil (Ricardo Lorite de Lima). O livro não nomeia o ordenante. Rui
    conta que ele e Ricardo Lorite foram ordenados diáconos e depois presbíteros por um bispo brasileiro sagrado
    por Raposo em Portugal, que ele não nomeia.
- order: presbyterate
