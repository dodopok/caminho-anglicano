biography: >-
  Pastor e fundador da igreja anglicana reformada em Santa Cruz do Capibaribe (PE); sagrado bispo em 19/11/2021;
  primaz da IARB desde 2023.
sources:
- source: neylima-2021-diogenes
  quote: >-
    o Reverendo Diógenes Monteiro, pastor e fundador da igreja em Santa Cruz do Capibaribe-PE, que foi eleito bispo
    esse ano e será ordenado nesta sexta (19) em Culto Solene no Teatro Municipal.
