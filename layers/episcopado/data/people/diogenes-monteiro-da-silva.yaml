  - source: ptwiki-iarb
    quote: 'Em 2021 foram sagrados dois novos bispos: Diógenes Monteiro e Magnael de Andrade.'
  notes: >-
    Notícia prévia (anúncio do evento no mesmo dia). Sagrantes não informados; provavelmente Francisco Buzzo, então
