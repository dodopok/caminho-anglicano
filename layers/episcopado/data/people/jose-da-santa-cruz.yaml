id: jose-da-santa-cruz
name: José da Santa Cruz
aliases:
- Abbas Dom José da Santa Cruz
- Dom Abade José da Santa Cruz
- Dom José de Santa Cruz
- Frei José Maciel
- José Maciel
biography: >-
  Frei José Maciel (José da Santa Cruz) foi ordenado diácono em 7/07/2013 por Rui Costa Barbosa e presbítero em
  27/07/2013, em Maceió (AL), na IATB. Nomeado prior da fraternidade em 2015, foi sagrado bispo em 28/07/2018, em
  Aracaju (SE), por Alfredo Dórea, com Washington Luis como cosagrante. É bispo diocesano da Diocese de Pernambuco
  e abade da Abadia Beneditina Anglicana Nossa Senhora da Imaculada Conceição, em Garanhuns. Em 16/11/2025 assinou,
  com Rui Costa Barbosa e Cristiano Alves, a Carta de Nova Iguaçu, que declara a unidade da IATB após o sínodo em
  Nova Iguaçu (RJ).
sources:
- source: lia-iatb-noticias-2014
  quote: >-
    No domingo 07 de julho de 2013 durante a celebração da Santa Eucaristia realizada na Capela da Casa das Irmãs
    Missionárias Jesus Misericordioso, foi ordenado à Ordem do Diaconato, o Frei José Maciel (Frei José da Santa
    Cruz).
- source: lia-iatb-noticias-2014
  quote: >-
    A cerimônia foi presidida pelo Arcebispo Dom Rui e concelebrada pelos bispos Dom +Orvandil, Dom Jorge e Dom
    Ricardo.
- source: lia-iatb-noticias-2014
  quote: >-
    No dia 27 de julho de 2013, sábado, o Arcebispo da IATB procedeu a ordenação presbiteral dos diáconos Rev. Dalmer
