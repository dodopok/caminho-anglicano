# yaml-language-server: $schema=../../schemas/person.json
id: salomao-ferraz
name: Salomão Ferraz
full_name: Salomão Barbosa Ferraz
aliases:
- Salomão Barbosa Ferraz
death:
  date: '1969-05-11'
  sources:
  - source: costa2021
    quote: vindo a falecer em 11 de maio de 1969, aos 89 anos, como epíscopo da Igreja Católica Romana.
    page: '67'
biography: >-
  Presbítero em São Paulo (Capela do Salvador); protagonista da 'controvérsia cerimonialista', destituído em 1936.
sources:
- source: kickhofel
  quote: >-
    em 1926, Salomão Ferraz começou a celebrar a santa comunhão todos os domingos na Capela do Salvador, em São
    Paulo
- source: kickhofel
  quote: >-
    Ferraz também começou a usar textos litúrgicos não autorizados, provocando uma crise que culminou na sua destituição
    em 1936.
ordinations:
- order: diaconate
  date: '1917'
  jurisdiction: null
  status: probable
  sources:
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1917 - … Salomão Barbosa Ferraz
    page: '369'
  notes: >-
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
- order: presbyterate
  date: '1945'
  jurisdiction: icab
  ordained_by: carlos-duarte-costa
  mode: reordination
  status: probable
  sources:
  - source: cant-temas-anglicanismo-2024
    quote: >-
      o então Reverendo Salomão Ferraz foi reordenado ao sacerdócio por Dom Carlos, doze dias após a fundação da
      Igreja Brasileira.
  notes: >-
    Reordenação (já era presbítero episcopal). Ano inferido de "doze dias após a fundação da Igreja Brasileira"
    (ICAB, 1945).
- order: presbyterate
  date: '1917'
  jurisdiction: dmsb
  ordained_by: lucien-lee-kinsolving
  status: probable
  sources:
  - source: costa2021
    quote: ingressou na Igreja Episcopal, sendo recebido pelo bispo Kinsolving e
    page: '64'
  - source: costa2021
    quote: ordenado ao presbiterado em 1917.
    page: '65'
  notes: >-
    A tese diz 'recebido pelo bispo Kinsolving e ordenado ao presbiterado em 1917'; ordenante inferido da construção
    da frase.
- order: episcopate
  date: '1945-08-15'
  place: Igreja Cristã de São Paulo, rua Baronesa de Itu, 48, São Paulo
  jurisdiction: icab
  principal_consecrator: carlos-duarte-costa
  status: confirmed
  sources:
  - source: testemunho-mantenedor-2026-10-08-ferraz
    quote: Salomão Ferraz foi sagrado bispo em 1945 por Duarte Costa na ICAB
  - source: clarke-2006-enrm
    quote: >-
      The Brazilian Apostolic Catholic Church was founded in 1945, by the former Roman Catholic bishop Don Carlos
      Duarte Costa
    page: '294'
  - source: cant-ferraz-ecumenismo-1995
    quote: >-
      Realizou-se hoje, dia quinze de agosto de mil novecentos e quarenta e cinco, Festa da Assunção de Nossa Senhora,
      às dez horas e trinta minutos, no templo da Igreja Cristã de São Paulo à rua Baronesa de Itu, número quarenta
      e oito, nesta cidade de São Paulo, a Sagração Episcopal de S. Excia. Revm°, Dom Salomão Ferraz, Bispo Eleito
      de São Paulo. Transmitiu a herança apostólica ao eleito, S. Excia. Revm° Dom Carlos Duarte Costa – Bispo do
      Rio de Janeiro
  - source: cant-temas-anglicanismo-2024
    quote: Dom Salomão Ferraz foi consagrado bispo por Dom Carlos Duarte Costa, em 1945.
  - source: costa2021
    quote: >-
      Em 1945 recebeu a consagração episcopal pelas mãos de Carlos Duarte Costa, após o seu rompimento com Roma.
    page: '66'
  notes: >-
    Sagração pela ICAB, fundada por Duarte Costa no mesmo ano (confirmado pelo mantenedor). Ferraz vinha da Igreja
    Católica Livre, que fundara em 1936; Costa (2021) não diz por qual igreja foi a sagração. Ex-presbítero da Igreja
    Episcopal Brasileira; sagrado como "Bispo Eleito de São Paulo" da Igreja Católica Livre / ICAB. O livro de 1995
    transcreve a ata da sagração. Sigla ICAB = Igreja Católica Apostólica Brasileira (criar se necessário). A tese
    diz depois que ele foi nomeado bispo titular de Eleutherna ao ser recebido na Igreja Católica Romana (1959)
    sem reordenação.
affiliations:
