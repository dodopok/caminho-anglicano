  role: clergy
  start: '1917'
  end: '1936'
  end_reason: left
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em 1925 foi designado pelo bispo Kinsolving para ser o segundo pároco da Capela do Salvador, na cidade de
      São Paulo.
    page: '65'
  notes: 'Local/função: Capela do Salvador, São Paulo.'
- jurisdiction: iclivre
  role: founder
  start: '1936'
  end: '1959'
  end_reason: left
  status: probable
  sources:
  - source: costa2021
    quote: A partir desse evento, fundou a “Igreja Católica Livre”, sendo ele eleito o seu primeiro bispo.
    page: '66'
  notes: Deixou a Igreja que fundara e converteu-se ao catolicismo em 1959.
events:
- type: other
  date: '1936'
  description: Destituição do Rev. Salomão Ferraz (1936) após a 'controvérsia cerimonialista'.
  status: probable
  sources:
  - source: kickhofel
    quote: provocando uma crise que culminou na sua destituição em 1936.
- type: other
  date: '1934'
  description: >-
    Assinou o memorial do concílio de 1934 (Paróquia do Salvador, Rio Grande) pedindo que o novo bispo fosse escolhido
    entre o clero nativo
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Assinaram o histórico memorial os reverendos Salomão Ferraz, George Upton Krischke, Nemésio de Almeida, João
      Batista Barcellos da Cunha, Orlando Batista e Athalício Theodoro Pithan e os leigos Frontino Peixoto da Silveira
      e José Luiz Albuquerque.
    page: '188'
- type: other
  date: '1936'
  description: >-
    Igreja Episcopal declara que o rev. Salomão Ferraz abandonou a comunhão eclesial; ele funda a Igreja Católica
    Livre
  status: probable
  sources:
  - source: costa2021
    quote: em 1936 a Igreja declarou que o reverendo abandonou a comunhão eclesial.
    page: '66'
  - source: costa2021
    quote: A partir desse evento, fundou a “Igreja Católica Livre”, sendo ele eleito o seu primeiro bispo.
    page: '66'
- type: other
  date: '1959'
  description: Salomão Ferraz é recebido na Igreja Católica Romana pelo Cardeal Motta, com ordens reconhecidas
  status: probable
  sources:
  - source: costa2021
    quote: >-
      se consolidaram na sua conversão ao Catolicismo, em 1959, sendo este recebido e tendo as suas ordens reconhecidas
      pelo arcebispo de São Paulo, o Cardeal Motta.
    page: '66'
