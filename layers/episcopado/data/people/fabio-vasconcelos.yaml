    quote: Rev. Fábio Vasconcelos (Paróquia do Mediador e Capelão do Seminário Anglicano de Estudos Teológicos)
  - source: costa2021
    quote: >-
      Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Rev. Fábio Vasconcelos (Paróquia
      do Mediador e Capelão do Seminário Anglicano de Estudos Teológicos)
    page: '545'
  - source: costa2021
    quote: Rev. Fábio Vasconcelos (Capelão do Seminário Anglicano de Estudos Teológicos)
    page: '217'
  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Paróquia do Mediador;
    capelão do SAET Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife e foi um dos 13 que pediram à
    Câmara dos Bispos supervisão episcopal alternativa (decreto de 16/09/2004), mantendo a comunhão com a IEAB.
    Início e fim do vínculo não informados. Signatário de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise
    de 2004-2005. Capelão do SAET em 2004.
events:
- type: other
  date: '2004-09-01'
  description: >-
    Documento 'Não sairemos', assinado pelo bispo sufragâneo Filadelfo Oliveira e clérigos e leigos da Diocese Anglicana
    do Recife, reafirmando o vínculo com a IEAB independentemente das decisões do diocesano.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em 1º de setembro de 2004, foi publicado o texto intitulado Não sairemos, o primeiro documento que enfrentou
      Robinson quando este sinalizou que romperia com a Província, assinado pelo bispo sufragâneo, Filadelfo Oliveira,
      e vários outros clérigos e leigos da Diocese
    page: '217'
  - source: costa2021
    quote: >-
      Assinaram este documento: Dom Filadelfo Oliveira Neto, ose (Bispo Sufragâneo da DAR); Revmo. Sérgio L. Andrade
      (Deão da Catedral Anglicana da SS. Trindade)
    page: '217'
- type: other
  date: '2004-07-06'
  description: >-
    Documento 'Para além das trincheiras' (06/07/2004), assinado por doze clérigos e leigos moderados da Diocese
    Anglicana do Recife, pedindo reconciliação; tomado por Robinson como ataque pessoal.
  status: probable
  sources:
  - source: costa2021
    quote: em 06 de julho de 2004 foi publicado o texto Para além das trincheiras
    page: '215'
  - source: costa2021
    quote: >-
      Assinaram este documento: Rev. Gustavo Gilson S. de Oliveira, ose; Rev. Fábio S. Vasconcelos; Rev. Elias Leôncio
      de B. Filho, ose; Rev. João Câncio Peixoto Filho; Rev. Manoel S. Moraes de Almeida, ose; Rev. Sérgio F. Lomeu
      de Andrade
    page: '216'
- type: other
  date: '2004-09-19'
  description: >-
    'Noite de São Bartolomeu': confronto na Paróquia do Mediador (Tejipió, Jaboatão) entre o grupo de Robinson e
    lideranças do SAET (revs. Fábio Vasconcelos e Gustavo Oliveira), com agressões físicas.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Na noite de 19 de setembro, os reverendos Fábio Vasconcelos e Gustavo Oliveira e o então secretário do SAET,
      Joelson Félix, se preparavam para iniciar a celebração.
    page: '219'
- type: other
  date: 2003-07
  description: >-
    Em julho de 2003, Dom Robinson Cavalcanti levou sete clérigos e ministros leigos da Diocese do Recife à Consulta
    da EFAC em Limuru, Quênia.
  status: confirmed
  sources:
  - source: drp2-memorias-decada-viii
    quote: >-
      Em julho de 2003, sete clérigos e Ministros Leigos (Reverendos: Maurício Coelho, Siméa Meldrum, Estevão Menezes,
      Jorge Aquino e Fábio Vasconcelos, Gustavo Gilson e a ML Roberta Araújo) foram comigo a Limuru, Quênia, África,
      para participar da Consulta da EFAC
