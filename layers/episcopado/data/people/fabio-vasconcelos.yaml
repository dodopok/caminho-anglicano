id: fabio-vasconcelos
name: Fábio Vasconcelos
biography: >-
  Clérigo(a) da Diocese Anglicana do Recife que em 2004 pediu supervisão episcopal alternativa à Câmara dos Bispos
  da IEAB, permanecendo na IEAB.
sources:
- source: costa2021
  quote: >-
    Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Rev. Fábio Vasconcelos (Paróquia
    do Mediador e Capelão do Seminário Anglicano de Estudos Teológicos)
  page: '545'
ordinations:
- order: diaconate
  date: '2002'
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-presb-fabio
    quote: >-
      No ano passado, Fábio recebia a imposição de mãos do seu Bispo, sucessor dos apóstolos, invocando o Espírito
      Santo, e lhe conferindo a Ordem dos Diáconos
  notes: >-
    Diaconato 'no ano passado' em relação a 29/03/2003, pelo 'seu Bispo' — o mesmo pregador, o bispo diocesano Robinson
    Cavalcanti.
- order: presbyterate
  date: '2003-03-29'
  place: Paróquia Anglicana do Bom Samaritano, Recife-PE
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-presb-fabio
    quote: Paróquia Anglicana do Bom Samaritano Recife (PE), 29.03.2003
  - source: rcor-drv-presb-fabio
    quote: o seu Bispo e amigo, juntamente com os presbíteros presentes, iremos selar outro rito sacramental
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti), que menciona também o 'Bispo Sufragâneo' (Filadelfo Oliveira
    Neto).
