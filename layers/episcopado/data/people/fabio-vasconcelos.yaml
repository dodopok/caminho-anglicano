id: fabio-vasconcelos
name: Fábio Vasconcelos
biography: >-
  Fábio de Souza Vasconcelos, arquiteto de profissão e formado no Seminário Anglicano de Estudos Teológicos (SAET),
  foi ordenado diácono em 2002 e presbítero em 29/3/2003, por Robinson Cavalcanti, na Paróquia Anglicana do Bom
  Samaritano, em Recife. Em julho de 2003 integrou o grupo que acompanhou o bispo à Consulta da EFAC em Limuru (Quênia).
  Em 2004 era capelão do SAET e pároco da Paróquia do Mediador, na Diocese Anglicana do Recife. Foi um dos signatários
  de "Para além das trincheiras" (6/7/2004), esteve no confronto de 19/9/2004 na Paróquia do Mediador e consta entre
  os clérigos cuja solicitação foi considerada em decreto da IEAB de 2004.
sources:
- source: rcor-drv-presb-fabio
  quote: >-
    No ano passado, Fábio recebia a imposição de mãos do seu Bispo, sucessor dos apóstolos, invocando o Espírito
    Santo, e lhe conferindo a Ordem dos Diáconos
- source: rcor-drv-presb-fabio
  quote: Paróquia Anglicana do Bom Samaritano Recife (PE), 29.03.2003
- source: rcor-drv-presb-fabio
  quote: o seu Bispo e amigo, juntamente com os presbíteros presentes, iremos selar outro rito sacramental
- source: d2s29-m37
