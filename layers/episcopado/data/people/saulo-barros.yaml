  - source: costa2021
    quote: >-
      A cerimônia foi presidida pelo Bispo Primaz, Maurício Andrade, junto com outros bispos e membros do clero
    page: '110'
  notes: >-
    Notícia de 16/10/2006 (segunda-feira): sagração no sábado (14/10); em 15/10 a paróquia-mãe virou Catedral de
    Santa Maria e Saulo foi instalado em sua cátedra. A notícia não nomeia sagrante nem co-sagrantes; cerca de 500
    presentes, incluindo a Comissão Bilateral ECUSA-IEAB, a USPG e a Diocese da Venezuela. Primeiro bispo da Diocese
    Anglicana da Amazonia; eleito no Sinodo Geral de julho de 2006. A Wikipedia PT da a instalacao em 15/10/2006.
    Sagrantes nao informados. A tese fala apenas em 'cerimônia de instalação' (15/10/2006, Igreja de Santa Maria,
    Belém, presidida por Maurício Andrade); não diz explicitamente que foi a sagração. Nota 138: nº 21 no registro
    da IEAB.
