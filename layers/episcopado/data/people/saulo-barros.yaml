biography: Primeiro bispo da Diocese Anglicana da Amazonia (2006-2017); emerito.
sources:
- source: costa2021
  quote: Saulo Maurício de Barros nasceu em 10 de março de 1962, na cidade de Olinda, PE.
- source: ieab-secretaria
  quote: Revmo. Bispo Saulo de Barros, Emérito
ordinations:
- order: episcopate
  date: '2006-10-14'
  place: Belem (PA)
  jurisdiction: ieab
  office: diocesan
  status: probable
  sources:
  - source: ens-102306-1-a
    quote: >-
      The ordination and consecration of Barros, and the inauguration of the new diocese, took place in the city
      of Belém on October 14 with hundreds of participants.
  - source: costa2021
    quote: >-
      A cerimônia de instalação da Diocese e do seu novo pastor ocorreu no dia 15 de outubro de 2006, na Igreja
      de Santa Maria, em Belém do Pará.
    page: '110'
  - source: costa2021
    quote: >-
      A cerimônia foi presidida pelo Bispo Primaz, Maurício Andrade, junto com outros bispos e membros do clero
    page: '110'
  notes: >-
    Primeiro bispo da Diocese Anglicana da Amazonia; eleito no Sinodo Geral de julho de 2006. A Wikipedia PT da
    a instalacao em 15/10/2006. Sagrantes nao informados. A tese fala apenas em 'cerimônia de instalação' (15/10/2006,
    Igreja de Santa Maria, Belém, presidida por Maurício Andrade); não diz explicitamente que foi a sagração. Nota
    138: nº 21 no registro da IEAB.
affiliations:
- jurisdiction: ieab
  role: bishop
  start: '2006'
  end: '2017'
  status: probable
  sources:
  - source: costa2021
    quote: Bispos e Bispas da Igreja Episcopal Anglicana do Brasil … 2006-2017 – Saulo Maurício de Barros
    page: 518-519
  notes: >-
    Anexo C da tese (lista 'Bispos e Bispas da Igreja Episcopal Anglicana do Brasil'). Interpretação: o par de anos
    foi lido como período de exercício episcopal na IEAB (e antecessoras), e não necessariamente o ano de sagração,
    pois o anexo não diz que o primeiro ano é a sagração. Por isso não foi criada afirmação de ordenação.
- jurisdiction: ieab
  role: diocesan_bishop
  diocese: ieab-daa
  start: '2006-10-15'
  end: 2017-12
  end_reason: resignation
  status: probable
  sources:
  - source: wp-pt-dioc-amazonia
    quote: com a investidura e instalação de seu primeiro pastor bispo Saulo Maurício de Barros
  - source: wp-pt-dioc-amazonia
    quote: Sua eleição se deu na Diocese Anglicana da Amazônia por ocasião da resignação do bispo Saulo Barros.
  - source: costa2021
    quote: 2006-2017 – Saulo Maurício de Barros
  - source: ec-2018-04
    quote: >-
      Em 2017, Dom Saulo Barros anunciou sua resignação e que abriu o processo eleitoral para a escolha de um(a)
      novo(a) pastor(a).
  - source: ec-2018-04
    quote: >-
      No dia 15 de outubro de 2006, a Diocese Anglicana da Amazônia foi instalada solenemente, com a consagração
      da Catedral de Santa Maria e com a investidura e instalação de seu primeiro bispo Dom Saulo Maurício de Barros.
  - source: costa2021
    quote: Diocese Anglicana da Amazônia … 2006-2017 – Saulo Maurício de Barros
    page: '523'
  - source: costa2021
    quote: >-
      A cerimônia de instalação da Diocese e do seu novo pastor ocorreu no dia 15 de outubro de 2006, na Igreja
      de Santa Maria, em Belém do Pará.
    page: '110'
  notes: >-
    Data da sagracao episcopal de Saulo nao encontrada (provavelmente 15/10/2006, junto com a instalacao). Anexo
    D da tese (bispos por diocese). Fim inferido: Marinez Bassotto eleita e instalada em abril de 2018.
  discrepancies:
