biography: >-
  Saulo Maurício de Barros nasceu em 10 de março de 1962, em Olinda (PE). Eleito em julho de 2006, pelo 30º Sínodo,
  primeiro bispo da Diocese Anglicana da Amazônia, foi sagrado em 14 de outubro de 2006, em Belém, e instalado em
  15 de outubro. Dirigiu a diocese até se aposentar, em novembro de 2017, e foi sucedido por Marinez Santos Bassotto,
  eleita em 20 de janeiro de 2018, primeira mulher eleita bispa na IEAB. Participou como co-sagrante de duas sagrações
  episcopais, entre elas a de Francisco de Assis da Silva, em 2011.
