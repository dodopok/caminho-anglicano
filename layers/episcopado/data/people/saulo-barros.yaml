# yaml-language-server: $schema=../../schemas/person.json
id: saulo-barros
name: Saulo Maurício de Barros
full_name: Saulo Maurício de Barros
aliases:
- Dom Saulo Barros
- Saulo Barros
- Saulo de Barros
birth:
  date: '1962-03-10'
  sources:
  - source: costa2021
    quote: Saulo Maurício de Barros nasceu em 10 de março de 1962, na cidade de Olinda, PE.
  - source: ieab-secretaria
    quote: Revmo. Bispo Saulo de Barros, Emérito
biography: >-
  Eleito em julho de 2006, pelo 30º Sínodo, primeiro bispo da Diocese Anglicana da Amazônia, foi sagrado em 14/10/2006,
  em Belém, e instalado em 15/10/2006. Dirigiu a diocese até se aposentar, em novembro de 2017, e foi sucedido por
  Marinez Santos Bassotto, eleita em 20/01/2018, primeira mulher eleita bispa na IEAB.
sources:
- source: costa2021
  quote: >-
    No mesmo Sínodo também foi eleito o reverendo Saulo Maurício de Barros 106 para ser o primeiro bispo da nova
    unidade diocesana.
  page: '110'
- source: rtb-sn-2006-amazonia
  quote: a mais nova Diocese da IEAB teve seu primeiro bispo sagrado neste sábado.
- source: rtb-sn-2006-amazonia
  quote: >-
    ao sábado, com o Rito de Sagração de Dom Saulo Maurício de Barros e com a Instalação Diocese Anglicana da Amazônia,
    realizado na Paróquia da Santa Cruz, da Arquidiocese de Belém, Igreja Católica Romana
- source: costa2021
  quote: >-
    A cerimônia de instalação da Diocese e do seu novo pastor ocorreu no dia 15 de outubro de 2006, na Igreja de
    Santa Maria, em Belém do Pará.
  page: '110'
- source: acns-2018-01-marinez-eleita
  quote: Ela vai suceder o Bispo Saulo Maurício Barros, que se aposentou em Novembro de 2017.
- source: acns-2018-01-marinez-eleita
  quote: >-
    A Revda. Canon Marinez Santos Bassoto foi eleita no dia 20 de janeiro (sábado) de 2018 como a próxima Bispa
    da Diocese da Amazônia durante o Concílio em Belém, no estado do Pará.
- source: wp-pt-dioc-amazonia
  quote: com a investidura e instalação de seu primeiro pastor bispo Saulo Maurício de Barros
ordinations:
- order: episcopate
  date: '2006-10-14'
  place: Paróquia da Santa Cruz, Belém (PA) (Igreja Católica Romana)
  jurisdiction: ieab
  office: diocesan
  status: probable
  sources:
