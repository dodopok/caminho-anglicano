- type: other
  date: '2018-01-20'
  description: >-
    Eleição de Marinez Bassotto como bispa da Diocese Anglicana da Amazônia em 20 de janeiro de 2018, na segunda
    sessão do Concílio extraordinário, em primeiro escrutínio. Os dois candidatos na votação final foram ela (Diocese
    Meridional) e o deão Sílvio Freitas (Diocese Sul Ocidental); a sessão foi dirigida pelo bispo João Peixoto.
    Ela sucedeu Saulo Maurício de Barros, que anunciou sua renúncia em 2017.
  status: confirmed
  sources:
  - source: f8mar-psj-eleicao-2018
    quote: >-
      O fato ocorreu na segunda sessão do Concílio da Diocese Anglicana da Amazônia (DAA), o qual elegeu no primeiro
      escrutínio a Reverenda Cônega Marinez R. Santos Bassotto.
  - source: f8mar-psj-eleicao-2018
    quote: >-
      O Bispo João Câncio Peixoto fez o pronunciamento após a confirmação dos votos entre as duas pessoas candidatas:
      Reverenda Cônega Marinez (Diocese Meridional) e o Reverendíssimo Deão Sílvio Freitas (Diocese Sul Ocidental).
  - source: f8mar-psj-eleicao-2018
    quote: >-
      Em 2017, Dom Saulo Barros anunciou sua resignação, que abriu o processo eleitoral para a escolha de um (a)
      novo (a) pastor (a).
  - source: f8mar-ink-eleicao-2018
    quote: >-
      On 20 Jan 2018 the Rev. Canon Eleita Marinez Bassotto was elected on the first ballot by the diocesan electoral
      synod meeting in Belém to succeed the Rt. Rev. Mauricio de Barros, the first bishop of the diocese elected
      in 2006.
