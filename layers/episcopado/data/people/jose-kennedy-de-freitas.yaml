# yaml-language-server: $schema=../../schemas/person.json
id: jose-kennedy-de-freitas
name: José Kennedy de Freitas
biography: >-
  Bispo continuante na linha de James Roque; organizador da Igreja Anglicana Continuante do Brasil, onde permaneceu
  como bispo coadjutor.
sources:
- source: iacc-continuante
  quote: Dom †José Kennedy de Freitas permaneceu como coadjutor da Igreja.
ordinations:
- order: episcopate
  date: '2012-11-10'
  place: Igreja Pentecostal Caminho da Fé, Belford Roxo (RJ)
  jurisdiction: null
  principal_consecrator: elias-batista-nogueira
  co_consecrators:
  - jose-demontier
  - josue-souza-torres
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Sagração Episcopal dos seguintes postulantes: Eliane Helena da Silva Nogueira, Reinaldo da Silva Tavares,
      José Aparecido Marques, José Kennedy de Freitas e Elcemir Durans Mendonça, a realizar-se no dia 10 de Novembro
      de 2012 na Igreja Pentecostal Caminho da Fé, sito à Rua Botânica, nº 70 – Jardim Boa Esperança – 145 NOVAS
      IGREJAS ANGLICANAS E EPISCOPAIS NO BRASIL Belford Roxo – Rio de Janeiro - Brasil, tendo Como Sagrante Principal
      Sua Exª Mons. Elias Batista Nogueira e como co-sagrantes: Sua Exª Bispo Josué Souza Torres e Sua Exª Bispo
      José Demontier
  notes: >-
    Costa (2024) transcreve a convocação da Província Brasileira de Confissão Anglicana (10/11/2012); é a previsão
    do ato, não um relato da cerimônia.
affiliations:
- jurisdiction: iacb
  role: founder
  status: probable
  sources:
  - source: iacc-continuante
    quote: dom †José Kennedy de Freitas, organizador da Igreja Anglicana Continuante do Brasil
events:
- type: other
  date: null
  description: >-
    Bispos brasileiros que, segundo a IACC, receberam a linhagem episcopal de James Roque: José Kennedy de Freitas,
    Marcos Mattos, Albertino de Sousa Barreiros (Natal), Claudinei Rodrigo Ferreira (Santa Catarina), Itabira Jonas
    (São Paulo e Paraná), Francisco de Assis Coelho e Pinho (Amazonas, eleito) e José Barbosa da Silva (Portugal)
  status: probable
  sources:
  - source: iacc-continuante
    quote: >-
      Após, houve a transmissão da sua linhagem episcopal para poucas pessoas. Podem ser citadas como as mais atuantes
      no anglicanismo continuante brasileiro os bispos: dom †José Kennedy de Freitas
- type: other
  date: null
  description: >-
    Segundo Costa (2021), a Diocese Anglicana do Japí (James Roque) foi extinta, e os bispos sagrados por Roque
    seguiram caminhos distintos, fundando igrejas anglicanas independentes
  status: probable
  sources:
  - source: costa-2021-tese
    quote: >-
      Anos mais tarde, a Diocese Anglicana do Japí foi extinta e estes novos bispos seguiram caminhos distintos,
