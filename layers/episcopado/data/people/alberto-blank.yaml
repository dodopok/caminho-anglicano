biography: >-
  Alberto Blank, nascido em Santa Helena, Pelotas, em 26/04/1896, foi ordenado diácono em novembro de 1923 e presbítero
  em fevereiro de 1925 por Lucien Lee Kinsolving, no Distrito Missionário do Sul do Brasil. Foi transferido para
  a Igreja Episcopal do Brasil em 25/04/1965.
