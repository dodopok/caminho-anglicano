biography: >-
  Almir dos Santos nasceu em Bagé em 18/04/1942, foi ordenado diácono em 14/12/1969 e presbítero em 21/02/1971 na
  IEAB e integrou em 1973 a comissão de estudos sobre a ordenação feminina. Reitor da Paróquia de Jesus Cristo,
  em Erechim, foi eleito em 1988 pelo Sínodo, na quarta votação, bispo missionário de Brasília, disputando com Patricia
  Powers, a primeira mulher a concorrer ao episcopado na IEAB. Foi sagrado em 09/04/1989 por Olavo Ventura Luiz,
  com Clovis Erly Rodrigues, Agostinho Sória e Edmund Sherrill como co-sagrantes, dirigiu a Diocese de Brasília
  até 2002 e ficou três anos encarregado do Distrito Missionário do Oeste. Consta como bispo emérito, assim listado
  na Câmara Episcopal em 2017.
