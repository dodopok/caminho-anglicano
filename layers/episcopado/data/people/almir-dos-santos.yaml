- jurisdiction: ieab
  role: bishop
  start: '1989'
  end: '2002'
  status: confirmed
  sources:
  - source: drv-pronunciamento-ieab-2005
    quote: Dom Almir dos Santos
  - source: costa2021
    quote: Bispos e Bispas da Igreja Episcopal Anglicana do Brasil … 1989-2002 – Almir dos Santos
    page: 518-519
  notes: >-
    Signatário da carta da Câmara dos Bispos da IEAB ao arcebispo de Cantuária (Brasília, 14/11/2005); data de início
    do cargo não é informada. Citado nesse cargo em documento de 14/11/2005. Anexo C da tese (lista 'Bispos e Bispas
    da Igreja Episcopal Anglicana do Brasil'). Interpretação: o par de anos foi lido como período de exercício episcopal
    na IEAB (e antecessoras), e não necessariamente o ano de sagração, pois o anexo não diz que o primeiro ano é
    a sagração. Por isso não foi criada afirmação de ordenação. O Anexo D dá início em 1988 em Brasília.
