  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      O primeiro bispo missionário de Brasília foi substituído pelo rev. Almir dos Santos, eleito pelo Sínodo de
      1988, numa votação por ordens que foi interrompida por falta de consenso que perdurou por três escrutínios,
      só sendo eleito na quarta votação, depois de disputar o cargo com a reverenda Patrícia Powers, uma missionária
      americana que trabalhava no Brasil desde 1979.
    page: '307'
