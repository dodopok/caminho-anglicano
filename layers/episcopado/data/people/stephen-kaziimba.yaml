id: stephen-kaziimba
name: Stephen Kaziimba
full_name: Samuel Stephen Kaziimba Mugalu
aliases:
- Samuel Stephen Kaziimba Mugalu
- Stephen Kaziimba Mugalu
- Stephen Kazimba
- Stephen Samuel Kaziimba
- The Most Revd Samuel Stephen Kaziimba Mugalu
birth:
  date: '1962-08-15'
  sources:
  - source: gacl-wp-kaziimba
    quote: also spelled Kazimba; born 15 August 1962
biography: >-
  Ordenado em dezembro de 1990 por Livingstone Mpalanyi Nkoyoyo, foi sagrado em 26/10/2008 quarto bispo de Mityana,
  na Igreja de Uganda, cargo que ocupou até 2020. Em 01/03/2020 foi entronizado primaz da Igreja de Uganda e bispo
  de Kampala; integrou o Conselho dos Primazes do GAFCON até março de 2026 e é membro do Global Anglican Council,
  que o sucedeu.
sources:
- source: gace-gac-page
  quote: Kaziimba was ordained in December 1990 by Bishop Livingstone Mpalanyi Nkoyoyo.
- source: gacl-monitor-2019-kaziimba
  quote: >-
    Kaziimba was consecrated bishop on October 26, 2008, and has served as the Bishop of Mityana Diocese for almost
    11 years.
- source: gacl-wp-kaziimba
  quote: installed as 4th Bishop of Mityana Diocese, on 26 October 2008
- source: gace-gac-page
  quote: On 1st March 2020 he was enthroned as the Primate of the Church of Uganda and Bishop of Kampala.
- source: gacl-ai-2023-uxbridge
  quote: The Most Reverend Stepehen Kaziimba – Uganda
- source: gace-gac-page
  quote: The Most Revd Samuel Stephen Kaziimba Mugalu Primate of the Church of Uganda
- source: gace-ai-kaziimba-abuja
  quote: >-
    “The GAFCON Primates Council was transitioned into the newly established Global Anglican Council, which will
    bring together primates, advisors, and guarantors
