    quote: '| consecration = February 1535<ref name="DNB"/> or June 1536'
  notes: >-
    Hipótese de Jenkins: a sagração não está registrada, mas em 11/06/1536 (Domingo da Trindade) foram sagrados
    Sampson (Chichester) e Repps (Norwich), e nas atas da Convocação Barlow assina com a precedência de um bispo
    sagrado entre Repps e Warton (2/07/1536). Jenkins menciona Cranmer e os bispos de Exeter, Bath, Bangor e Norwich
    como participantes das sagrações de 11/06 e 2/07, sem dizer que sagraram Barlow. Não há registro da sagração
    de Barlow (bispo de St David's, 1536). Stubbs fixa a data por prova indireta em 11, 18 ou 26 de junho de 1536.
    A Wikipédia dá 'fevereiro de 1535 ou junho de 1536' e aponta Cranmer como sagrante, mas citando um documento
    particular (pelagios.net); por isso o sagrante fica nulo aqui. Ver dúvidas.
