      Em 17 de outubro de 2021, Dom Naudal consagrou a reverenda Magda Guedes Pereira como sua bispa coadjutora.
  - source: cant-identidades-numeros-2024
    quote: >-
      A nova bispa foi sagrada no dia 17 de outubro de 2021, pelo bispo Naudal Alves Gomes Primaz, 128 Igreja Episcopal
      Anglicana do Brasil: Identidades e(m) números Primaz da IEAB e Diocesano do Paraná.
  - source: ieab-magda-sagrada
    quote: Sediado na Catedral Anglicana de São Tiago, em Curitiba
  notes: >-
    Terceira bispa da IEAB; eleita em 24/04/2021; instalada 12/12/2021. Bispa coadjutora da Diocese Anglicana do
    Paraná, sucedendo Naudal Alves Gomes como diocesana a partir de dezembro de 2021. A notícia não nomeia sagrante
    principal nem co-sagrantes. A notícia da IEAB não nomeia o sagrante principal nem os co-sagrantes; a homilia
    foi da reverenda Anésia Nascimento de Jesus Cook (Paróquia St. Peter and St. Oswald, Diocese de Sheffield) e
    o primaz Naudal Alves Gomes agradeceu ao final. A tese diz 'pelo Bispo Primaz e Diocesano de Curitiba' — Naudal
    Alves Gomes era ambos (Primaz desde 2018, diocesano do Paraná). Co-sagrantes não informados.
