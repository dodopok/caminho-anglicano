biography: >-
  Nascida em Sant'Ana do Livramento (RS) em 03/09/1967, foi ordenada diácona em 24/03/1996 e presbítera em 1997
  (21/12, segundo Costa; 21/04, segundo ela própria), em Erechim (RS), na IEAB. Atuou nas dioceses Sul-Ocidental
  (1996-2006), do Paraná (2007-2010) e de Brasília (2011-2017). Em março de 2011 assumiu como deã a Catedral da
  Ressurreição, em Brasília, até fevereiro de 2017, quando foi eleita pároca na Diocese Anglicana de Pelotas. Desde
  julho de 2018 é secretária-geral da IEAB. Eleita em 24/04/2021 terceira bispa da IEAB, foi sagrada em 17/10/2021,
  na Catedral de São Tiago, por Naudal Alves Gomes, como bispa coadjutora da Diocese Anglicana do Paraná, e instalada
  como bispa diocesana em 12/12/2021. Em junho de 2023 foi eleita presidenta do CONIC, a primeira mulher no cargo.
