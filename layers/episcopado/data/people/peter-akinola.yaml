  notes: >-
    Só confirma o ano (1989) e a diocese (Abuja). Sagrante principal continua NÃO encontrado. Pela praxe seria o
    arcebispo da Nigéria, Joseph Adetiloye (o ENS de 26/04/1990 mostra Adetiloye sagrando bispos em Abuja), mas
    nenhuma fonte o diz. Pôster: Adetiloye "consagrou Peter Jasper Akinola como bispo da Diocese de Abuja" — data
    (16/11/1989) e sé confirmadas pela Wikipédia (que cita a tese de S. G. Kwashang, 2006, p. 35, não acessível
    daqui); SAGRANTE NÃO ENCONTRADO em fonte. Adetiloye era o primaz da Nigéria em 1989, o que torna o pôster plausível.
    Ano inferido do pôster (1989-2010); verificar. Data com fonte secundária acadêmica que se apoia em documento
    primário (carta sinodal de Ogbonyomi, 1990); a Wikipédia repete a mesma data. Sagrante não nomeado em nenhuma
    fonte aberta. Adetiloye era o primaz da Nigéria em 1989, o que torna plausível o pôster da IAB (Adetiloye ->
    Akinola), mas não comprovado.
