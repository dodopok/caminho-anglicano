biography: >-
  Peter Akinola foi sagrado bispo em 16 de novembro de 1989 por Joseph Adetiloye e, em 26 de novembro de 1989, entronizado
  como primeiro bispo da Diocese de Abuja. Foi arcebispo e primaz da Igreja da Nigéria de 2000 a 2010 e primeiro
  presidente do Conselho de Primazes do GAFCON. Em 2005, no III Encontro Anglicano Global Sul-Sul, que presidiu,
  convidou Robinson Cavalcanti e Miguel Uchôa, com a IEAB excluída do evento. Em março de 2026 passou a integrar
  o Global Anglican Council, como presidente dos Gafcon Guarantors. Participou de quatro sagrações episcopais, entre
  elas as de Nicholas Okoh e David Onuoha.
