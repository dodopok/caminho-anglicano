    quote: a Igreja Episcopal Reformada, liderada pelo bispo Sebastião Mendes de Freitas e Francisco Buzzo
    page: '118'
  notes: >-
    O livro o põe entre os líderes da Igreja Episcopal Reformada que assinaram a Declaração da Boa Viagem (2006),
    mas diz também (p. 133) que ele fundou a IARB em 2005 a partir de comunidade 'até então ligada à Igreja Episcopal
    Reformada do Brasil'.
