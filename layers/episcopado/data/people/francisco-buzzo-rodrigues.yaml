- jurisdiction: iarb
  role: diocesan_bishop
  start: '2009'
  end: 2012-04
  end_reason: retirement
  status: probable
  sources:
  - source: loc-iarb-2009
    quote: + Revmo. Dom Francisco Buzzo Rodrigues Bispo Diocesano
  - source: ptwiki-iarb
    quote: >-
      Em abril de 2012, o bispo Francisco Buzzo tornou-se bispo emérito, sendo eleito assim Josep Rossello, como
      o novo bispo primaz da IARB.
  notes: >-
    Data e sagrantes da sagração episcopal de Buzzo NÃO encontrados. Ele já era bispo em dez/2006, quando co-sagrou
    Leonides de Menezes (CEEC), segundo o site da CICEB.
- jurisdiction: iarb
  role: primate
  start: 2021-05
  end: '2023'
  end_reason: resignation
  status: contested
  sources:
  - source: ptwiki-iarb
    quote: >-
      No ano de 2021, a IARB separou-se da Igreja Livre da Inglaterra, voltando a funcionar como denominação independente.
      Desde então, o bispo emérito Francisco Buzzo voltou a exercer seu episcopado.
  - source: ptwiki-iarb
    quote: >-
      Em 2023 o bispo Francisco Buzzo renunciou à primazia da Igreja voltando a condição de bispo emérito enquanto
      continua pastoreando a Paróquia de Bragança Paulista.
  - source: costa2021
    quote: >-
      Desde então, Buzzo assumiu como Primaz da denominação, liderando um clero formado por dois bispos missionários
      e poucas lideranças presentes em São Paulo, Bahia, Pernambuco e Distrito Federal.
  - source: cant-novas-igrejas-2024
    quote: Desde então, Buzzo assumiu como Primaz da denominação
    page: '134'
  - source: cant-novas-igrejas-2024
    quote: >-
      o bispo emérito Francisco Buzzo reassumiu brevemente funções episcopais, mas logo retornou à condição de emérito
    page: '134'
  - source: costa2021
    quote: Desde então, Buzzo assumiu como Primaz da denominação
    page: '152'
  discrepancies:
