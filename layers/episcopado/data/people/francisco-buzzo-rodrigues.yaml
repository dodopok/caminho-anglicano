    - source: cant-novas-igrejas-2024
      quote: >-
        o bispo emérito Francisco Buzzo reassumiu brevemente funções episcopais, mas logo retornou à condição de
        emérito
      page: '134'
  - field: end_reason
    value: retirement
    sources:
    - source: cant-novas-igrejas-2024
      quote: Desde então, Buzzo assumiu como Primaz da denominação
      page: '134'
    - source: cant-novas-igrejas-2024
      quote: >-
        o bispo emérito Francisco Buzzo reassumiu brevemente funções episcopais, mas logo retornou à condição de
        emérito
      page: '134'
  notes: >-
    Assumiu a primazia após a renúncia de Rosselló (maio de 2021), brevemente; voltou à condição de emérito e foi
    sucedido por Diógenes Monteiro da Silva. Passou a pastorear só a Paróquia de Bragança Paulista.
- jurisdiction: ier
  role: auxiliary_bishop
  status: confirmed
  sources:
  - source: drv-comunicado-imprensa-2006
    quote: Dom Francisco Buzzo Rodrigues, Bispo Auxiliar
  - source: darl3-cc-boaviagem
    quote: Dom Francisco Buzzo Rodrigues, Bispo Auxiliar
  notes: >-
    Consta com esse cargo na lista de fundadores da Declaração da Boa Viagem (30/09/2006); início do cargo não informado.
    Em Célio Spinelli, o texto acrescenta 'Bispo de Diocese Anglicana Thomas Becket e Vigário Geral da Arquidiocese
    Thomas Cranmer'. Citado nesse cargo em documento de 30/09/2006. Signatário/representante da jurisdição na Declaração
    da Boa Viagem (30/09/2006), com o título indicado na notícia.
- jurisdiction: ierb
  role: bishop
  status: probable
  sources:
