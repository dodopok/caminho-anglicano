# yaml-language-server: $schema=../../schemas/person.json
id: francisco-buzzo-rodrigues
name: Francisco Buzzo Rodrigues
full_name: Francisco Buzzo Rodrigues
aliases:
- Buzzo
- Dom Francisco Buzzo
- Francisco Buzzo
biography: >-
  Fundador da IARB (2005, Bragança Paulista-SP); bispo diocesano em 2009; emérito em 2012; reassumiu o episcopado
  em 2021 após a saída da FCE e renunciou à primazia em 2023. Aparece como co-sagrante de Leonides de Menezes (CEEC)
  em dez/2006.
sources:
- source: loc-iarb-2009
  quote: + Revmo. Dom Francisco Buzzo Rodrigues Bispo Diocesano
- source: ptwiki-iarb
  quote: Em abril de 2012, o bispo Francisco Buzzo tornou-se bispo emérito
ordinations:
- order: episcopate
  date: null
  jurisdiction: null
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: Buzzo e Mendes foram sagrados por bispos brasileiros, mas seguiram caminhos distintos
    page: '133'
  notes: O livro diz apenas 'sagrados por bispos brasileiros', sem nomes nem data.
affiliations:
