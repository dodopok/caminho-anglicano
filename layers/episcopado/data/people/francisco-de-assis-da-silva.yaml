    quote: Estiveram presentes Maurício Andrade, Bispo Primaz e da Diocese de Brasília, que presidiu a
  - source: ihu-francisco-2011
    quote: >-
      A cerimônia de sagração, presidida pelo primaz da Igreja Episcopal Anglicana do Brasil (IEAB), dom Maurício
