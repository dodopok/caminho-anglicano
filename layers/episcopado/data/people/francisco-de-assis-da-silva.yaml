  - source: dap-2011-francisco-sagr
    quote: >-
      Os sinos da Catedral Anglicana do Mediador, em Santa Maria, anunciaram na manhã do dia 20 de março que mais
      um Bispo estava sendo sagrado para servir a Diocese Sul Ocidental
  - source: dap-2011-francisco-sagr
    quote: O Bispo Primaz da IEAB, Dom Maurício Andrade, presidiu a Cerimônia de Sagração
  - source: costa2021
    quote: >-
      Estiveram presentes Maurício Andrade, Bispo Primaz e da Diocese de Brasília, que presidiu a sagração; Orlando
      de Oliveira, da Diocese Meridional; Filadelfo Neto, da Diocese do Rio de Janeiro); Naudal Gomes, da Diocese
      de Curitiba; Sebastião Gameleira, da Diocese do Recife; Saulo Barros, da Diocese da Amazônia; Renato Raatz,
      da Diocese de Pelotas; Roger Bird, da Diocese São Paulo; e dois bispos eméritos, Clovis Rodrigues e Almir
      dos Santos.
    page: '113'
  - source: costa2021
    quote: >-
      A cerimônia também contou com a presença do bispo Julio Murray, da Diocese do Panamá; Miguél Tamayo, da Diocese
      do Uruguai, e Gilberto Porcal, bispo sufragâneo do Uruguai.
    page: '113'
  notes: >-
    Eleito bispo coadjutor da Diocese Sul-Ocidental em 25/10/2010. A tese lista os bispos "presentes" (nao necessariamente
