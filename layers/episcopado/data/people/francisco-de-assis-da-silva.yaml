    Ano 2011 pela data/URL da publicação (uploads/2011/03). Coadjutor. A nota 111 lista os bispos 'presentes' (Maurício
    Andrade 'presidiu a sagração'); a tese não diz expressamente que todos impuseram as mãos — co-sagrantes por
    inferência.
affiliations:
- jurisdiction: ieab
