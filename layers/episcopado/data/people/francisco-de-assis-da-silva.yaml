  discrepancies:
  - field: place
    value: Santa Maria (RS), Diocese Sul-Ocidental
    sources:
    - source: ihu-francisco-2011
      quote: >-
        O povo anglicano da Diocese Sul Ocidental recebeu, no domingo, 20, em Santa Maria, o seu novo bispo, Francisco
        de Assis Silva , 51 anos, ex-secretário geral da igreja. A cerimônia de sagração, presidida pelo primaz
        da Igreja Episcopal Anglicana do Brasil (IEAB), dom Maurício Andrade
    - source: ihu-francisco-2011
      quote: >-
        Do exterior, acompanharam a sagração de Assis Silva os bispos Miguel Tamayo e Gilberto Porcal, do Uruguai
  notes: >-
    Eleito bispo coadjutor da Diocese Sul-Ocidental em 25/10/2010. A tese lista os bispos "presentes" (nao necessariamente
    todos impuseram as maos). Eleito bispo coadjutor da Diocese Sul-Ocidental em 25/10/2010 (sucessor de Jubal Neves).
    Ano 2011 pela data/URL da publicação (uploads/2011/03). A notícia é de 23/03/2011 (ALC), e "domingo, 20" corresponde
    a 20 de março de 2011. Presentes também o presidente do CLAI, bispo Julio Murray, e o bispo católico local Hélio
    Adelar Rubert (ecumênico). Duas fontes independentes (IHU e Diocese Anglicana de Pelotas) concordam que o primaz
    Maurício Andrade presidiu; a segunda fala em 'Bispos Co-Sagrantes' sem nomeá-los. Um blog da Região Diocesana
    Noroeste lista os bispos presentes (Orlando de Oliveira, Filadelfo Neto, Naudal Gomes, Sebastião Gameleira,
    Saulo Barros, Renato Raatz, Roger Bird, Clóvis Rodrigues, Almir dos Santos, Julio Murray, Miguel Tamayo, Gilberto
    Porcal), mas sem dizer quais impuseram as mãos. Local: Catedral do Mediador, Santa Maria, segundo a dapsul e
    o blog. Coadjutor. A nota 111 lista os bispos 'presentes' (Maurício Andrade 'presidiu a sagração'); a tese não
    diz expressamente que todos impuseram as mãos — co-sagrantes por inferência.
