- type: other
  date: '1997'
  description: >-
    Segundo o Cônego Washington Franco, ele e o Rev. Miguel Uchoa formalizaram, no processo sucessório anterior
    ao Concílio de junho de 1997, a indicação de Robinson Cavalcanti para suceder o bispo Clóvis Erly Rodrigues,
    apoiados depois pelos Revs. Souza e Paulo Garcia; no balanço do episcopado, o autor registra a redação dos Cânones
    Diocesanos, a implantação do Secretariado e dos Arcediagos, a instituição do Ministério Leigo, do Diaconato
    Permanente e do Ministério Local e convênios com Fredericton, Boston e Pensilvânia Central.
  status: probable
  sources:
  - source: d2s23-anglicanismo-missao
    quote: >-
      Juntamente com o Rev. Miguel Uchoa, formalizamos essa indicação no processo Sucessório, posteriormente apoiados
      pelos Rev. Souza e Revmº. Paulo Garcia.
  - source: d2s23-anglicanismo-missao
    quote: Nossos Cânones Diocesanos foram redigidos. O Secretariado e os Arcediagos foram implantados.
  - source: d2s23-anglicanismo-missao
    quote: bem como os convênios com Fredericton, Boston e Pensilvânia Central
- type: other
  date: 1998-01
  description: >-
    Primeira eucaristia anglicana do grupo que formaria a Paróquia da Natividade, em Natal (RN), na Igreja Metodista
    do Natal, presidida pelo Rev. Washington Franco, com a presença do Rev. Jorge Aquino e de Frei Severino Abel.
  status: probable
  sources:
  - source: d2s30-historia
    quote: >-
      Era o primeiro Domingo de 1998 e presente, para presidir a primeira Eucaristia, estava o Rev. Washington Franco,
      então reitor da Paróquia da Ressurreição em João Pessoa, Paraíba.
- type: other
  date: '2004-02-15'
  description: >-
    Em 15/02/2004, na Paróquia da Santíssima Trindade (Recife), a 'Catedral no exílio', realizou-se a reorganização
    e instalação do Cabido da catedral, com a instituição do Cônego Quintino Orengo e o retorno do Cônego Washington
    Franco à atividade ministerial. O bispo diz que o templo da catedral está 'ocupado pelos invasores' (posição
    do bispo diocesano), que a diocese tinha 55 diáconos ordenados em seis anos e meio, 35 ministros leigos e cerca
    de 80 seminaristas na região, e registra a inauguração recente do Campus de João Pessoa (mais de 30 estudantes
    matriculados).
  status: confirmed
  sources:
  - source: d2s29-m44
    quote: >-
      A reorganização e instalação do seu Cabido implicam em uma continuidade no papel histórico dessa congregação
      pioneira, como Sé Episcopal
  - source: d2s29-m44
    quote: >-
      Gostaria de estender o meu abraço ao Cônego Washington Franco, por seu retorno à atividade ministerial, e
      ao novo Cônego, ora instalado, Venerável Rev. Quintino Orengo
  - source: d2s29-m44
    quote: Esta amada Catedral vive o seu exílio, com o seu templo ocupado pelos invasores.
