id: washington-santos-franco
name: Washington Santos Franco
full_name: Washington Santos Franco
biography: Cônego da Diocese Anglicana do Recife em 2005 e 2007.
sources:
- source: drp-carta-venables-pt-2005
  quote: Rev. Côn. Washington Franco
- source: drp-calendario-2007
  quote: Rev. Côn. Washington S. Franco
ordinations:
- order: diaconate
  date: '1986'
  jurisdiction: ieab
  status: probable
  sources:
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1986 - … Washington Santos Franco
    page: '373'
  notes: >-
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
- order: presbyterate
  date: null
  jurisdiction: ieab-dar
  ordained_by: clovis-erly-rodrigues
  status: probable
  sources:
  - source: dard2-hist3
    quote: >-
      Foram ordenados, durante o seu período os seguintes reverendos: Washington Franco e Siméa Meldrum (os únicos
      dos seus Presbíteros que continuam conosco)
  notes: >-
    Robinson Cavalcanti lista Washington Franco entre os presbíteros ordenados no período do bispo Clóvis Erly Rodrigues
    (1986-1997); data e local não constam. O texto diz apenas "durante o seu período", e o ordenante é entendido
    como o bispo diocesano da época.
affiliations:
- jurisdiction: ieab
  role: clergy
  start: '1986'
  status: probable
  sources:
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1986 - … Washington Santos Franco
    page: '373'
  notes: Consta da lista do clero nacional da IEAB (Kickhöfel, 1995); início = ano do diaconato.
