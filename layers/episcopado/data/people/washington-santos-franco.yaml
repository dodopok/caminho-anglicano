- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Côn. Washington Franco
  - source: drv-nota-esclarecimento-2006
    quote: Washington Santos Franco
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Washington Santos Franco … Os clérigos não atenderam à convocação
      e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação, mantendo
      plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: conego
  status: confirmed
  sources:
  - source: drp-carta-venables-pt-2005
    quote: Rev. Côn. Washington Franco
  - source: drp-calendario-2007
    quote: Rev. Côn. Washington S. Franco
  notes: >-
    Assina a carta a Venables (17/10/2005) como cônego. Título de cônego no calendário diocesano de 2007.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Washington Santos Franco … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
events:
- type: other
  date: 1977/1985
  description: >-
    O bispo Sherrill criou o NAET (Núcleo de Estudos Anglicanos), onde estudaram Ian Meldrum, Robinson Cavalcanti
    e Antônio Carlos (da Bahia); também foram ordenados no período Sherrill Josephino Lobato (Belém) e um fazendeiro
    japonês, ministro local. Washington Franco foi deixado já preparado para a ordenação.
  status: probable
  sources:
  - source: drv-resgatando-ii
    quote: >-
      onde estudaram três dos seus ordinandos, os futuros reverendos: Ian Meldrum, Robinson Cavalcanti e Antônio
      Carlos (da Bahia)
  - source: drv-resgatando-ii
    quote: >-
      Os outros Ministros Ordenados durante o período Sherrill foram: Josephino Lobato, de Belém-PA e um fazendeiro
      japonês
  - source: drv-resgatando-ii
    quote: Deixou o Bispo, ao final, já preparado o processo do Postulante e depois Rev. Washington Franco.
- type: other
  date: 1996-10
  description: >-
    Em outubro de 1996 o bispo Clóvis Erly Rodrigues comunicou a decisão de se aposentar e de convocar a eleição
    de um coadjutor. Segundo Dom Robinson Cavalcanti, seu nome foi proposto inicialmente pelos reverendos Washington
    Franco e Miguel Uchoa, com o apoio decidido do reverendo Luiz Souza; a eleição se deu no Concílio Extraordinário
    de Itaparica (BA), precedida de cinco meses de reuniões do clero, que redigiu a "Carta de Paudalho" como programa
    comum, e de debates com paróquias e missões de Belém, João Pessoa, Recife e Salvador.
  status: confirmed
  sources:
  - source: darb2-projeto-i
    quote: >-
      O meu nome foi proposto, inicialmente, pelos reverendos Washington Franco e Miguel Uchoa, tendo, em seguida,
      o apoio decidido do reverendo Luiz Souza
  - source: darb2-projeto-i
    quote: >-
      entre outubro de 1996 (quando o Bispo Clóvis comunicou sua decisão de se aposentar e convocar a eleição de
      um coadjutor), até a minha sagração e posterior instituição e posse, em outubro de 1997
  - source: darb2-projeto-i
    quote: cinco meses de reunião do clero, culminando com o retiro que elaborou a “Carta de Paudalho”
  - source: darb2-projeto-i
    quote: Concílio Extraordinário de Itaparica (onde houve a eleição)
