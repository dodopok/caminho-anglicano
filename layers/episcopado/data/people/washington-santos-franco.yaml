biography: >-
  Ordenado diácono em 1986, na IEAB, e presbítero na Diocese Anglicana do Recife pelo bispo Clóvis Erly Rodrigues.
  Em outubro de 1996, com Miguel Uchoa, propôs o nome de Robinson Cavalcanti na escolha de um coadjutor. Cônego
  desde 15/02/2004, atuava na Missão Anglicana Filadélfia; em 23/08/2005 consta entre os clérigos excluídos da Comunhão
  da IEAB, passando a integrar a Diocese Anglicana do Recife (DAR). Na DAR seguiu como cônego (2005 e 2007), foi
  membro da OSE e, em 2009, ministro encarregado de uma comunidade.
