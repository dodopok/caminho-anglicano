id: washington-santos-franco
name: Washington Santos Franco
full_name: Washington Santos Franco
biography: Cônego da Diocese Anglicana do Recife em 2005 e 2007.
sources:
- source: drp-carta-venables-pt-2005
  quote: Rev. Côn. Washington Franco
- source: drp-calendario-2007
  quote: Rev. Côn. Washington S. Franco
ordinations:
- order: diaconate
  date: '1986'
  jurisdiction: ieab
  status: probable
  sources:
