  role: other
  role_description: cônego
  start: '2004-02-15'
  status: confirmed
  sources:
  - source: drp2-ord-diac-daniel-fred-2004
    quote: >-
      Gostaria de estender o meu abraço ao Cônego Washington Franco, por seu retorno à atividade ministerial
  notes: >-
    Local: Diocese do Recife, Cabido da Catedral da Santíssima Trindade. Citado como cônego na instalação do Cabido,
