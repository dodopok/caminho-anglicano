events:
- type: other
  date: 1977/1985
  description: >-
    O bispo Sherrill criou o NAET (Núcleo de Estudos Anglicanos), onde estudaram Ian Meldrum, Robinson Cavalcanti
    e Antônio Carlos (da Bahia); também foram ordenados no período Sherrill Josephino Lobato (Belém) e um fazendeiro
    japonês, ministro local. Washington Franco foi deixado já preparado para a ordenação.
  status: probable
  sources:
  - source: drv-resgatando-ii
    quote: >-
      onde estudaram três dos seus ordinandos, os futuros reverendos: Ian Meldrum, Robinson Cavalcanti e Antônio
      Carlos (da Bahia)
  - source: drv-resgatando-ii
    quote: >-
      Os outros Ministros Ordenados durante o período Sherrill foram: Josephino Lobato, de Belém-PA e um fazendeiro
      japonês
  - source: drv-resgatando-ii
    quote: Deixou o Bispo, ao final, já preparado o processo do Postulante e depois Rev. Washington Franco.
- type: other
  date: 1996-10
  description: >-
    Em outubro de 1996 o bispo Clóvis Erly Rodrigues comunicou a decisão de se aposentar e de convocar a eleição
    de um coadjutor. Segundo Dom Robinson Cavalcanti, seu nome foi proposto inicialmente pelos reverendos Washington
    Franco e Miguel Uchoa, com o apoio decidido do reverendo Luiz Souza; a eleição se deu no Concílio Extraordinário
    de Itaparica (BA), precedida de cinco meses de reuniões do clero, que redigiu a "Carta de Paudalho" como programa
    comum, e de debates com paróquias e missões de Belém, João Pessoa, Recife e Salvador.
  status: confirmed
  sources:
  - source: darb2-projeto-i
    quote: >-
      O meu nome foi proposto, inicialmente, pelos reverendos Washington Franco e Miguel Uchoa, tendo, em seguida,
      o apoio decidido do reverendo Luiz Souza
  - source: darb2-projeto-i
    quote: >-
      entre outubro de 1996 (quando o Bispo Clóvis comunicou sua decisão de se aposentar e convocar a eleição de
      um coadjutor), até a minha sagração e posterior instituição e posse, em outubro de 1997
  - source: darb2-projeto-i
    quote: cinco meses de reunião do clero, culminando com o retiro que elaborou a “Carta de Paudalho”
  - source: darb2-projeto-i
    quote: Concílio Extraordinário de Itaparica (onde houve a eleição)
