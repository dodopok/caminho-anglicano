# yaml-language-server: $schema=../../schemas/person.json
id: claudio-luiz-figueiredo-de-brito
name: Cláudio Luiz Figueiredo de Brito
biography: >-
  Ordenado diácono em 18/06/2005, em João Pessoa, e presbítero em 08/04/2006, por Robinson Cavalcanti, foi clérigo
  da Diocese do Recife e pároco da Paróquia Anglicana do Salvador (PB) até 12/08/2007, quando houve pedido de licença
  ministerial. Consta como membro do conselho diocesano em 2009.
sources:
- source: drp2-ord-diac-jp-2005
  quote: >-
    Sermão de Ordenações Diaconais Cláudio Brito, Flávio Adair Torres, Gustavo Leite Castello Branco, Lindinalva
    Medeiros e Raimundo Figueiredo Con-Catedral Anglicana da Ressurreição João Pessoa (PB), 18 de Junho de 2005.
- source: drp2-convite-presb-jp-2006
  quote: >-
    convida V.Sa. para o Culto Solene de Ordenação Presbiteral dos Reverendos: Cláudio Luiz Figueiredo de Brito
    Flávio Adair Torres Soares Lindinalva Medeiros de Oliveira Raimundo Francisco de Figueiredo Local: Con-Catedral
    Anglicana da Ressurreição
- source: drp2-ord-presb-2006-04
  quote: >-
    Sermão de Ordenação Presbiteral Reverendos: Cláudio Brito, Flávio Adair, Jeane Coelho, Lindinalva Medeiros,
    Raimundo Figueiredo e Teresa Catão Paróquia Anglicana Emanuel Recife (PE), 07.04.2006 Con-Catedral Anglicana
    da Ressurreição João Pessoa (PB), 08.04.2006
- source: drv-nota-esclarecimento-2006
  quote: Cláudio Luiz Figueiredo de Brito
- source: darb2-breves-18
  quote: >-
    No dia 12.08 , Dom Robinson esteve na Paróquia Anglicana do Salvador, com o Rev. Cláudio Brito, para realizar
    várias Confirmações no último culto de sua gestão
- source: darb2-breves-18
