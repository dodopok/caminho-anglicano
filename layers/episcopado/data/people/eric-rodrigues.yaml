id: eric-rodrigues
name: Eric Rodrigues
aliases:
- Bispo Eric
- Bp. Eric Rodrigues
- Erick Rodrigues
- Erik Rodrigues
biography: >-
  Reitor da Igreja Anglicana Âncora (Vitória/ES); eleito bispo auxiliar da IAB (Diocese de João Pessoa, Região Sudeste)
  em 13/03/2023 e sagrado em 08/05/2023; desde dez/2024 bispo da Rede Episcopal Brasileira (REB).
sources:
- source: eshoje-eric-2023
  quote: Eric Rodrigues, Reverendo e Reitor da Paróquia Anglicana Âncora
- source: reb-estrutura
  quote: >-
    Bispo da Rede Episcopal Brasileira, artista visual, Casado com Elionai Rodrigues e pai da Maria, José e da Ana.
    Mora em Vitória/ES.
ordinations:
- order: diaconate
  date: '2015-12-04'
  place: Sínodo da Diocese do Recife (Recife/Jaboatão dos Guararapes-PE)
  jurisdiction: iacs
  status: probable
  sources:
  - source: reb-calendario-2026
    quote: 04/12/2015 -BISPO ERIC (ORDENAÇÃO)
  - source: reb-calendario-2026
    quote: 04/12/2015 – Ordenação Episcopal • Bispo Eric
  - source: aac-2015-recife
    quote: One of the new Deacons is Eric. He is a person of many surprises.
  - source: aac-2015-recife
    quote: The (just about to be) Rev. Eric rodrigues
  - source: aac-2015-recife
    quote: >-
      On Friday, I preached at the Eucharist that opened the Synod and participated in the Ordination, laying hands
      on one of the four Deacons. they also ordained three priests and licensed a number of lay ministers.
  - source: aac-2015-recife
    quote: participated in the Ordination, laying hands on one of the four Deacons
  notes: >-
    O calendário rotula a data como 'Ordenação Episcopal' num trecho e só 'Ordenação' noutro; a sagração foi em
    08/05/2023. A data bate com o diaconato de dez/2015 registrado por outra fonte. Ordenação na sexta-feira de
    abertura do Sínodo Diocesano, dias antes de 08/12/2015 (data do post). O bispo ordenante não é nomeado (bispo
    diocesano: Miguel Uchoa); Bill Atwood (ACNA) impôs as mãos sobre um dos quatro diáconos. Presbiterato de Eric
    Rodrigues: data e ordenante NÃO encontrados (já era 'Rev.' e reitor da Âncora antes de 2023). Ordenação no Sínodo
    da Diocese do Recife, dias antes de 08/12/2015 (data do post). Bill Atwood (ACNA) impôs as mãos sobre um dos
    quatro diáconos. O bispo ordenante não é nomeado. Em 2015 a diocese já era extra-provincial ligada à GAFCON;
    IACS é aproximação. Presbiterato: data e ordenante NÃO encontrados.
- order: presbyterate
  date: null
  jurisdiction: diocese-anglicana-recife
  status: probable
  sources:
  - source: ancorabh-lideranca-2018
    quote: >-
      Somos pastoreados pelo Rev. Eric Rodrigues (Peruca) e sua esposa Leo Rodrigues - Ele é Presbítero ordenado
      pela Igreja Anglicana no Brasil e o Pastor responsável pela Comunidade Anglicana Ancora (C.A.A)
  notes: >-
    Data e ordenante não informados. Diácono em dez/2015; já 'Presbítero ordenado pela Igreja Anglicana no Brasil'
    na página publicada em 11/01/2018 — logo, ordenado entre dez/2015 e jan/2018, quando a diocese se chamava 'Igreja
    Anglicana no Brasil – Diocese de Recife' (bispo diocesano Miguel Uchoa).
- order: episcopate
  date: '2023-05-08'
  place: Vitória (ES)
  jurisdiction: iab
  office: auxiliary
  principal_consecrator: marcio-meira
  co_consecrators:
  - flavio-soares
  - marcio-simoes
  - miguel-uchoa
  status: confirmed
  sources:
  - source: eshoje-eric-2023
    quote: O rito de sagração do Bispo Eric Rodrigues aconteceu no último dia 8 de maio, em Vitória
  - source: anglicanismo-visita-2023
    quote: >-
      A sagração foi conduzida pelo Bispo Márcio Meira, em conjunto com o Bispo Primaz Miguel Uchoa e os bispos
      Márcio Simões e Claudio Adair.
  - source: gafconpt-eric-2023
    quote: >-
      A Igreja Anglicana no Brasil consagrou um novo bispo na semana passada. O Rev. Eric Rodrigues é agora bispo
      auxiliar da Diocese de João Pessoa.
  - source: yt-sagracao-eric
    quote: Sagração Bispo Eric Rodrigues
  - source: eshoje-eric-2023
    quote: teve seu rito de sagração a Bispo Auxiliar realizado no último dia 8 de maio
  - source: cant-novas-igrejas-2024
    quote: >-
      a Câmara dos Bispos ganhou novos membros com a ordenação dos bispos Miguel Neto (auxiliar para a Diocese de
      João Pessoa) e Eric Rodrigues (para o Estado do Espírito Santo e a região Sudeste).
    page: '34'
  - source: reb-calendario-2026
    quote: 08/05/2023 – Sagração Episcopal • Bispo Eric
  - source: testemunho-mantenedor-2026-10-08-adair
    quote: Claudio Adair em Eric Rodrigues tá errado, é o Flávio Adair Torres Soares
  notes: >-
    Data e local confirmados por 2 fontes independentes; sagrantes por uma só (anglicanismo.com.br, que escreve
    "Claudio Adair" — quase certamente Flávio Adair). O GAFCON (23/05/2023) diz "na semana passada", o que não bate
    exatamente com 08/05. Data e local confirmados por duas fontes independentes (ES Hoje; anglicanismo.com.br;
    GAFCON-pt diz "na semana passada" em 22/05/2023). Sagrantes apenas pelo anglicanismo.com.br, que grafa "Claudio
    Adair" — quase certamente Flávio Adair (Torres Soares). Data não informada. Data e local confirmados por duas
    fontes independentes (ES Hoje e anglicanismo.com.br) e pelo Gafcon; sagrantes só em anglicanismo.com.br. "Claudio
    Adair" pode ser erro por Flávio Adair Torres Soares (bispo missionário da IAB) – não verificado. O "Claudio
    Adair" do anglicanismo.com.br é Flávio Adair Torres Soares, segundo o mantenedor.
