    um dos quatro diáconos. O bispo ordenante não é nomeado. Em 2015 a diocese já era extra-provincial ligada à
    GAFCON; IACS é aproximação. Presbiterato: data e ordenante NÃO encontrados. O calendário rotula a data como
    'Ordenação Episcopal' num trecho e só 'Ordenação' noutro; a sagração foi em 08/05/2023. A data bate com o diaconato
    de dez/2015 registrado por outra fonte.
