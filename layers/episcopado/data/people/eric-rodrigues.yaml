id: eric-rodrigues
name: Eric Rodrigues
aliases:
- Bispo Eric
- Bp. Eric Rodrigues
- Erick Rodrigues
- Erik Rodrigues
biography: >-
  Eric Rodrigues foi ordenado diácono em dezembro de 2015, no Sínodo da Diocese do Recife (Paróquia Anglicana Jardim
  das Oliveiras, Boa Viagem), em cerimônia presidida por Miguel Uchôa, Evilásio e Flávio Adair, com a presença de
  Bill Atwood (ACNA/Gafcon). Foi ordenado presbítero por Miguel Uchôa e, de 2015 a 2018, esteve no clero da Diocese
  do Recife como pastor responsável pela Comunidade Anglicana Âncora. De 2018 a 2023 integrou a IAB, como ministro
  encarregado da Região Missionária e reitor da Paróquia Anglicana Âncora, em Vitória (ES). Em 13/3/2023 o Primeiro
  Sínodo Extraordinário Online da IAB o elegeu bispo auxiliar, com Miguel Neto, e em 8/5/2023 foi sagrado em Vitória
  por Márcio Meira, com Miguel Uchôa, Márcio Simões e Claudio Adair. Como bispo auxiliar da Diocese de João Pessoa,
  coordenava as igrejas do Sudeste (ES, MG, SP e RJ). Em 21/11/2024 formalizou a saída da Província da Gafcon e,
  em 20/12/2024, nasceu a Rede Episcopal Brasileira (REB), com a saída da Igreja Âncora, da qual é bispo diocesano
  e presidente, reconhecendo as ordens de Cícero Pontara, Elionai Rodrigues, Reinaldo Pinto e Weiden Mendes. Em
  28/10/2025 descreveu a REB como diocese com um bispo, oito presbíteros, quatro diáconos, um ministro local e dois
  postulantes, após o primeiro sínodo diocesano ordinário, em Vitória, em outubro de 2025. Em março de 2026 escreveu
  como bispo de uma diocese fora da Comunhão Anglicana; o 2º Sínodo Diocesano da REB está marcado para 16 a 18 de
  outubro de 2026, na Catedral Anglicana Âncora. Participou de 11 ordenações de diáconos ou presbíteros e de uma
  sagração episcopal, a de Miguel Neto, como co-sagrante.
