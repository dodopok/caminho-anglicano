events:
- type: other
  date: '2019-04-27'
  description: >-
    Meriglei Borges Simin foi eleita bispa coadjutora da Diocese Anglicana de Pelotas em concílio extraordinário
    na Catedral do Redentor, em 27 de abril de 2019, no primeiro escrutínio, com 6 votos do clero e 42 do laicato;
    o concílio foi presidido pelo bispo Francisco de Assis da Silva, a convite do bispo diocesano Renato da Cruz
    Raatz.
  status: confirmed
  sources:
  - source: lic-psj-meriglei-2019
    quote: >-
      A eleição aconteceu na Catedral do Redentor, no dia 27 de abril, em concílio extraordinário, presidido pelo
      Bispo Francisco de Assis da Silva, da Diocese Sul-Ocidental, de Santa Maria/RS que atendeu ao convite do Bispo
      Renato da Cruz Raatz, Diocesano da Diocese Anglicana de Pelotas.
  - source: lic-psj-meriglei-2019
    quote: Foi eleita no primeiro escrutínio com 6 votos do clero e 42 votos do laicato.
- type: other
  date: '2019-04-27'
  description: >-
    Concílio da Diocese Anglicana de Pelotas elege Meriglei Borges Simin da Silva para suceder Renato Raatz
  status: probable
  sources:
  - source: costa2021
    quote: >-
      A Diocese Anglicana de Pelotas, em Concílio realizado no dia 27 de abril de 2019, elegeu a reverenda Meriglei
      Borges Simin da Silva122
    page: '119'
