- jurisdiction: ieab
  role: bishop
  start: '2019'
  status: probable
  sources:
  - source: costa2021
    quote: Bispos e Bispas da Igreja Episcopal Anglicana do Brasil … 2019- – Meriglei Borges Silva Simin
    page: 518-520
  notes: >-
    Anexo C da tese (lista 'Bispos e Bispas da Igreja Episcopal Anglicana do Brasil'). Interpretação: o par de anos
    foi lido como período de exercício episcopal na IEAB (e antecessoras), e não necessariamente o ano de sagração,
    pois o anexo não diz que o primeiro ano é a sagração. Por isso não foi criada afirmação de ordenação. Tese grafa
    'Simin'.
