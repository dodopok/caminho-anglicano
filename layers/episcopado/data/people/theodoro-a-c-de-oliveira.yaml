events:
- type: other
  date: '2015'
  description: >-
    Theodoro A. C. de Oliveira, padre ligado ao mosteiro da Eparquia Greco-Melquita (supervisionado pela Arquidiocese
    de Sorocaba), rompe com Roma e torna-se anglicano.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      No início de 2015 ocorreu o rompimento do padre Theodoro A. C. de Oliveira com a comunhão com Roma, diante
      de desentendimentos com seu bispo diocesano, no qual o clérigo decidiu tornar-se anglicano.
    page: '76'
- type: other
  date: 2016-05
  description: >-
    Frei James Tavares de Melo, OFS, é ordenado por Theodoro Oliveira em Votorantim (ordem não especificada).
  status: probable
  sources:
