- type: other
  date: '2017'
  description: >-
    James Roque (emérito do Japi) e Theodoro Oliveira recebem o bispo Frederick Haas, da Alemanha, ordinário da
    Anglican Catholic Diocese of Christ the Redeemer, em encontro da Igreja no Brasil
  status: probable
  sources:
