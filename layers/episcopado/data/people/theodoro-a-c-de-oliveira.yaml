  notes: >-
    O livro diz que a sagração marcou 'a fundação oficial da nova diocese' de Votorantim. A notícia citada (Gazeta
    de Votorantim, 18/02/2015) diz 'na noite da última segunda-feira (9)', i.e. provavelmente 09/02/2015. O livro
    diz que 'participaram da ordenação' os três bispos, sem identificar o sagrante principal (Cruz-Blanco é citado
    primeiro). Costa cita reportagem (GOUVEA, 18 fev. 2015). 'Segunda-feira (9)' em fevereiro de 2015 = 9/2/2015.
    A fonte diz que os três 'participaram'; a ordem sugere Cruz-Blanco como principal, sem confirmação. 'Rafael
    Ribeiro Campos' pode ter relação com Raniere Ribeiro Campos, ex-bispo da IECB — NÃO verificado. CONTESTADO:
    jurisdicoes-menores.json registra Victor Manuel Cruz-Blanco como sagrante principal e Roque como co-sagrante;
    Costa (2024) diz que Roque presidiu e Cruz-Blanco foi consagrante.
