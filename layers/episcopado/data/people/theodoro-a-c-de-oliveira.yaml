  notes: >-
    Imprensa local de época (Gazeta de Votorantim, 09/02/2015 e 18/02/2015): o anúncio identifica Cruz-Blanco como
    'Ordenante principal' e Roque e Campos como co-ordenantes; o relato posterior diz que eles 'participaram'. O
    título: 'Bispo Titular de Julinensis e Bispo da Diocese Anglicana Santa Mãe de Deus Votorantim'. A imprensa
    descreve Cruz-Blanco como 'Arcebispo Metropolitano da Província Católica de Rito Anglicano da Colômbia' — mesma
    'Província Católica de Rito Anglicano' que, segundo o site da IACC e o da província, sagrou Roque em 2013 (PCRA-AL).
    Costa cita reportagem (GOUVEA, 18 fev. 2015). 'Segunda-feira (9)' em fevereiro de 2015 = 9/2/2015. A fonte diz
    que os três 'participaram'; a ordem sugere Cruz-Blanco como principal, sem confirmação. 'Rafael Ribeiro Campos'
    pode ter relação com Raniere Ribeiro Campos, ex-bispo da IECB — NÃO verificado. CONTESTADO: jurisdicoes-menores.json
    registra Victor Manuel Cruz-Blanco como sagrante principal e Roque como co-sagrante; Costa (2024) diz que Roque
    presidiu e Cruz-Blanco foi consagrante. A notícia citada (Gazeta de Votorantim, 18/02/2015) diz 'na noite da
    última segunda-feira (9)', i.e. provavelmente 09/02/2015. O livro diz que 'participaram da ordenação' os três
    bispos, sem identificar o sagrante principal (Cruz-Blanco é citado primeiro). O livro diz que a sagração marcou
    'a fundação oficial da nova diocese' de Votorantim. Citação de GOUVEA (18 fev. 2015): 'segunda-feira (9)' de
    fevereiro de 2015. A tese só diz que 'participaram da ordenação'; sagrante principal não indicado (Cruz-Blanco
    é o mais graduado).
