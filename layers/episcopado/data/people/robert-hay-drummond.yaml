biography: >-
  Robert Hay Drummond foi sagrado em 24/04/1748, na igreja de Kensington, por Thomas Herring, e foi bispo de St
  Asaph até 1761, brevemente bispo de Salisbury em 1761 (11/06 a 23/10) e depois arcebispo de York, cargo que ocupou
  até morrer, em 10/12/1776.
