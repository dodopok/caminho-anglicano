id: rodson-ricardo-de-souza
name: Rodson Ricardo de Souza
aliases:
- ML Rodson Ricardo
- Rev. Rodson
- Rodson Ricardo
- Rodson Ricardo Souza do Nascimento
biography: >-
  Reverendo que liderou a Missão Anglicana da Natividade, com a qual a Diocese Anglicana de Votorantim iniciou seus
  trabalhos no Rio Grande do Norte em maio de 2016. Em 2018 figurava entre os clérigos da TAC em Natal e, em 2021,
  com Melque Ambrósio, contatou o arcebispo Michael Gill, iniciando o diálogo com a TAC.
sources:
- source: cant-novas-igrejas-2024
