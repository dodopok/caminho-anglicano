- Rodson Ricardo Souza do Nascimento
biography: >-
  Rodson Ricardo Souza do Nascimento, natural de Angicos (RN), é sociólogo graduado em Ciências Sociais pela UFRN
  e, quando descrito pela diocese, cursava mestrado em Desenvolvimento Regional na mesma universidade. Na Diocese
  Anglicana do Recife (IEAB) foi seminarista, postulante às Sagradas Ordens, membro da Ordem de Santo Estevão e
  ministro leigo encarregado da Paróquia da Natividade, em Natal; foi ordenado diácono em 10/09/2005 por Filadelfo
  Oliveira Neto. Em maio de 2016 liderava a Missão Anglicana da Natividade, com a qual a Diocese Anglicana de Votorantim
  iniciou seus trabalhos no Rio Grande do Norte, e em 2018 figurava entre os clérigos da TAC em Natal. Em 2021,
  com Melque Ambrósio, contatou o arcebispo Michael Gill, iniciando o diálogo com a TAC.
