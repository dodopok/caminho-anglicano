  page: '77'
- source: cant-novas-igrejas-2024
  quote: >-
    Em maio de 2016, a Diocese Anglicana de Votorantim iniciou seus trabalhos no Rio Grande do Norte, com a Missão
    Anglicana da Natividade, sob a liderança do reverendo Rodson Ricardo de Souza.
  page: '77'
- source: cant-novas-igrejas-2024
  quote: Clérigos como os Reverendos Rodson Ricardo e Melque Ambrósio, em Natal
  page: '82'
- source: cant-novas-igrejas-2024
  quote: >-
    Junto com o reverendo Melque, em 2021 foi feito contato com o Arcebispo da África do Sul, Michael Gill, de Joanesburgo,
    e assim, iniciou-se o diálogo com a TAC.
  page: '81'
- source: d2s30-equipe
  quote: É Seminarista e Postulante às Sagradas Ordens da Diocese do Recife.
- source: d2s30-equipe
  quote: >-
    Rodson Ricardo Souza do Nascimento, 29 anos, solteiro, natural de Angicos/RN. Sociólogo, graduado em Ciências
    Sociais pela UFRN e Mestrando na área de Desenvolvimento Regional pela mesma Universidade.
