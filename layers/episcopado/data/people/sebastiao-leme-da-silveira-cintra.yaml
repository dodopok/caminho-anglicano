biography: >-
  Sebastião Leme da Silveira Cintra nasceu em 20/01/1882 e foi ordenado presbítero em Roma em 28/10/1904, por Francisco
  do Rêgo Maia. Foi sagrado bispo em Roma por Joaquim Arcoverde de Albuquerque Cavalcanti, com a data dada como
  24/06/1911 por três fontes e como 04/06/1911 por uma quarta. Nomeado arcebispo coadjutor do Rio de Janeiro em
  1921, sucedeu como arcebispo em 18/04/1930, foi elevado a cardeal em 30/06/1930 e morreu em 17/10/1942, ainda
  arcebispo.
