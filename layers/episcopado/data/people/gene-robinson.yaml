id: gene-robinson
name: Gene Robinson
full_name: V. Gene Robinson
aliases:
- V. Gene Robinson
- Vicky Gene Robinson
biography: >-
  O cônego Vicky Gene Robinson foi eleito para a Diocese de New Hampshire (Igreja Episcopal dos EUA) e sagrado em
  2/11/2003, no campus da Universidade de New Hampshire, em Durham, pelo Bispo Presidente Frank Griswold e seis
  co-consagradores. É conhecido como o primeiro padre abertamente gay sagrado bispo em uma grande denominação cristã
  que crê no episcopado histórico.
sources:
- source: costa2021
  quote: a eleição do cônego Vicky Gene Robinson para a Diocese de New Hampshire
  page: '207'
- source: costa2021
  quote: >-
    em 02 de novembro de 2003 ele foi sagrado, no campus da Universidade de New Hampshire, na cidade de Durham,
    pelo Bispo Presidente, Frank Griswold, e mais seis bispos co-consagradores
  page: '208'
- source: perd05-wp-grobinson
  quote: >-
    Robinson is widely known for being the first openly gay priest to be consecrated a bishop in a major Christian
    denomination believing in the [[historic episcopate]]
ordinations:
- order: episcopate
  date: '2003-11-02'
  place: Campus da Universidade de New Hampshire, Durham
  jurisdiction: tec
  office: diocesan
  principal_consecrator: frank-tracy-griswold-iii
  status: probable
  sources:
  - source: costa2021
    quote: >-
      em 02 de novembro de 2003 ele foi sagrado, no campus da Universidade de New Hampshire, na cidade de Durham,
      pelo Bispo Presidente, Frank Griswold, e mais seis bispos co-consagradores
    page: '208'
  - source: d2s23-banana-2003
    quote: pantomima da “ Sagração ” do “ bispo ” Gene Robinson , no Estado de New Hampshire
  notes: >-
    Bispo coadjutor da Diocese de New Hampshire (Igreja Episcopal dos EUA). Os seis co-sagrantes não são nomeados.
    Fonte polêmica de Robinson Cavalcanti (03/11/2003), que contesta a legitimidade da sagração mas a situa em 02/11/2003
    ("ontem") em New Hampshire; o texto não informa sagrantes.
events:
- type: other
  date: '2004'
  description: >-
    Em 2004 Robinson Cavalcanti participou, em Akron (Ohio, EUA), de confirmação coletiva de 111 pessoas, ao lado
    de bispos aposentados, para famílias de paróquias da Diocese de Ohio que não aceitavam a confirmação pelo bispo
    local, que votara a favor e participara da sagração de Gene Robinson.
  status: probable
  sources:
  - source: drv-resgatando-v
    quote: >-
      para realizar uma cerimônia pública e coletiva de Confirmação de 111 pessoas, no recinto do auditório da Igreja
      Ortodoxa Romena, na cidade de Akkron
- type: other
  date: '2003-11-03'
  description: >-
    Em 03/11/2003, o bispo diocesano Robinson Cavalcanti divulgou nota em nome da Diocese Anglicana do Recife protestando
    contra a sagração de Gene Robinson como bispo de New Hampshire (Igreja Episcopal dos EUA), afirmando que indivíduos,
    paróquias e dioceses não permaneceriam sob autoridades de jurisdições que aprovem a prática homossexual e a
    bênção de uniões do mesmo sexo.
  status: confirmed
  sources:
  - source: d2s23-banana-2003
    quote: >-
      A Diocese Anglicana do Recife herdeira do legítimo anglicanismo histórico de Kinsolving , fiel à nossa fé
      e ordem, levanta sua voz de indignação e protesto
  - source: d2s23-banana-2003
    quote: Indivíduos, Paróquias e Dioceses não permanecerão sob autoridades ilegítimas
