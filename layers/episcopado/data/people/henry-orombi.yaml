id: henry-orombi
name: Henry Orombi
aliases:
- Henri Orombi
- Henry Luke Orombi
biography: >-
  Arcebispo Primaz da Igreja Anglicana de Uganda; presidiu a sagração de John Guernsey e do bispo de Ankole (Mbarara,
  2007).
sources:
- source: darl3-n4213
  quote: O Arcebispo Henri Orombi presidiu a cerimônia na Catedral de St. James, Ruharo, em Mbarara
events:
- type: other
  date: '2010-10-19'
  description: >-
    No Congresso Lausanne III (Cidade do Cabo), realiza-se em 19/10/2010 uma reunião sobre a crise da Comunhão Anglicana
    com os primazes Henri Orombi (Uganda), Mouneer Anis (Oriente Médio), John Chew (Sudeste da Ásia) e Robert Duncan
    (ACNA); Robinson Cavalcanti descreve a reunião como de caráter analítico e prospectivo. No mesmo dia ele relata
    ter encontrado Duncan e os bispos Bill Murdock e John Guernsey, além de Chris Sugden, que representava também
    a FCA.
  status: confirmed
  sources:
  - source: d2s13-viagem-v
    quote: >-
      Seguiu-se uma reunião bem concorrida e especial sobre a crise da Comunhão Anglicana, com os Primazes Orombi
      (Uganda), Anis (Oriente Médio), Chew (Sudeste da Ásia) e Duncan (ACNA).
  - source: d2s13-viagem-v
    quote: >-
      Um dia bem puxado, mas com muito conteúdo, além do valor da reunião dos anglicanos, por seu caráter analítico
      e prospectivo.
  - source: d2s13-viagem-iv
    quote: bem como o Primaz da ACNA Robert Duncan e os Bispos Bill Murdock e John Guernesey
  - source: d2s13-viagem-iv
    quote: representando, também, a FCA – Fraternidade dos Anglicanos Evangélicos
- type: other
  date: '2010-08-23'
  description: >-
    Conferência das Igrejas Anglicanas de Toda a África (CAPA) em Entebbe (Uganda), de 23 a 29/08/2010, em que primazes
    africanos apresentam ao arcebispo de Cantuária, Rowan Williams, suas insatisfações com o tratamento da crise
    da Comunhão Anglicana. Segundo o relato de Robinson Cavalcanti, baseado em reportagem do jornal The EastAfrican,
    10 das 12 províncias representadas sinalizavam permanência na Comunhão, mas com distanciamento de Cantuária;
    ele cita o Gafcon/FCA e a ACNA entre as novas articulações.
  status: probable
  sources:
  - source: d2s13-lideranca-africana
    quote: >-
      de 23 a 29 de Agosto passado, em Entebbe, Uganda, a Conferência das Igrejas Anglicanas de Toda a África (CAPA)
  - source: d2s13-lideranca-africana
    quote: >-
      10 das 12 Províncias representadas em Entebbe sinalizam um futuro de permanência na Comunhão Anglicana, mas
      em distanciamento de Cantuária
  - source: d2s13-lideranca-africana
    quote: novas articulações como o Gafcon/FCA, a CAPA, as Dioceses Companheiras
- type: other
  date: '2010-08-23'
  description: >-
    De 23 a 29/08/2010, em Entebbe (Uganda), realizou-se a II Conferência dos Bispos Anglicanos de Toda a África
    (CAPA), com os titulares das dioceses do continente. O presidente da CAPA, Ian Ernest, bispo de Maurício e primaz
    da Província do Oceano Índico, afirmou que as igrejas africanas haviam rompido o relacionamento com os episcopais
    dos Estados Unidos e do Canadá; o primaz de Uganda, Henry Orombi, era o anfitrião e o arcebispo de Cantuária,
    Rowan Williams, enviou mensagem de abertura.
  status: confirmed
  sources:
  - source: d2s20-entebbe1
    quote: >-
      Está se realizando, de 23 a 29.08, no Hotel Resort Imperial, em Entebbe, Uganda, a II Conferência dos Bispos
      Anglicanos de Toda a África
  - source: d2s20-entebbe2
    quote: o seu presidente Revmo. Ian Ernest , Bispo da Ilha Mauritius e Primaz da Província do Oceano Índico
  - source: d2s20-entebbe2
    quote: >-
      isso levou a que nós rompêssemos o relacionamento com os episcopais dos Estados Unidos e do Canadá, que permitem
      a entrada de clérigos gays
