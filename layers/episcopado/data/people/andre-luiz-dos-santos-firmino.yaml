# yaml-language-server: $schema=../../schemas/person.json
id: andre-luiz-dos-santos-firmino
name: André Luiz dos Santos Firmino
biography: >-
  André Luiz dos Santos Firmino foi ordenado diácono em janeiro de 2017, em Jundiaí (SP), por Roger Douglas Bird
  e Glauco Soares de Lima, e presbítero em agosto de 2018 por Bird, no MAnB. Em 29/05/2019 um decreto de Bird declarou
  nula, com efeito ex-tunc, sua ordenação presbiteral; em 16/10/2022 seria acolhido pelo bispo Eduardo Grillo na
  Diocese do Rio de Janeiro (IEAB).
sources:
- source: rta-firmino-blog
  quote: >-
    Em janeiro de 2017, André recebe a ordenação diaconal na cidade de Jundiaí – SP, pelas mãos dos Reverendíssimos
    Bispos Dom Roger Douglas Bird e Dom Glauco Soares de Lima
- source: rta-firmino-blog
  quote: Em agosto de 2018, recebeu das mãos de Dom Roger Douglas Bird a ordenação no grau de presbítero
- source: lq-gazeta-machadense-2019
  quote: São Paulo, 29 de maio de 2019.
- source: lq-gazeta-machadense-2019
  quote: >-
    Declaro nula a ordenação e sagração episcopal do bispo Ronaldo Robster de Melo e a ordenação presbiteral do
    reverendo André Luiz dos Santos Firmino, conferindo a esta decisão o efeito EX-TUNC.
- source: rta-firmino-blog
  quote: >-
    No dia 16 de outubro de 2022, será acolhido pelo Bispo Eduardo Grillo da Igreja Episcopal Anglicana do Brasil
    - IEAB (Diocese do Rio de Janeiro), como membro da Igreja
ordinations:
- order: diaconate
  date: 2017-01
  place: Jundiaí (SP)
  jurisdiction: manb
  ordained_by: roger-douglas-bird
  status: probable
  sources:
  - source: rta-firmino-blog
    quote: >-
      Em janeiro de 2017, André recebe a ordenação diaconal na cidade de Jundiaí – SP, pelas mãos dos Reverendíssimos
      Bispos Dom Roger Douglas Bird e Dom Glauco Soares de Lima
  notes: >-
    Relato autobiográfico, publicado no blog do próprio ordenado. Antes disso o texto diz que ele recebeu ordenação
    diaconal e presbiteral (2008) em outra linhagem independente (Ordem de São João da Mata), registradas na mesma
    biografia.
- order: presbyterate
  date: 2018-08
  jurisdiction: manb
  ordained_by: roger-douglas-bird
  status: probable
  sources:
  - source: rta-firmino-blog
    quote: Em agosto de 2018, recebeu das mãos de Dom Roger Douglas Bird a ordenação no grau de presbítero
  notes: >-
    Relato autobiográfico. Em 29/05/2019 Bird declarou nula esta ordenação presbiteral (decreto publicado na Gazeta
    Machadense).
affiliations:
- jurisdiction: ieab
  role: clergy
  diocese: ieab-darj
  start: '2022-10-16'
  status: probable
  sources:
  - source: rta-firmino-blog
    quote: >-
      No dia 16 de outubro de 2022, será acolhido pelo Bispo Eduardo Grillo da Igreja Episcopal Anglicana do Brasil
      - IEAB (Diocese do Rio de Janeiro), como membro da Igreja
  notes: >-
    Texto no futuro ('será acolhido'); o blog diz que ele ficaria habilitado a celebrar sacramentos em nome da IEAB
    'até o seu pleno reconhecimento de ordens'. Não confirma que a recepção tenha ocorrido.
events:
- type: other
  date: '2019-05-29'
  description: >-
    Decreto Episcopal ex-tunc do bispo diocesano Roger Douglas Bird (São Paulo, 29/05/2019) declarando nulas a ordenação
    e sagração episcopal de Ronaldo Robster de Melo e a ordenação presbiteral de André Luiz dos Santos Firmino,
    depois de eles afirmarem em rede social que eram independentes e não reconheciam Bird como superior; publicado
    na Gazeta Machadense em 12/06/2019.
  status: confirmed
  sources:
  - source: lq-gazeta-machadense-2019
    quote: São Paulo, 29 de maio de 2019.
  - source: lq-gazeta-machadense-2019
    quote: >-
      Declaro nula a ordenação e sagração episcopal do bispo Ronaldo Robster de Melo e a ordenação presbiteral do
      reverendo André Luiz dos Santos Firmino, conferindo a esta decisão o efeito EX-TUNC.
