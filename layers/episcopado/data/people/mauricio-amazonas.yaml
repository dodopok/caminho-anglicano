events:
- type: other
  date: '2011-05-05'
  description: >-
    Na eleição de bispos sufragâneos da Diocese do Recife (Sínodo Extraordinário de 04/06/2011), os 'episcopáveis'
    eram os reverendos Evilásio Tenório, Flávio Adair Torres Soares e Maurício Amazonas.
  status: confirmed
  sources:
  - source: drp2-episcopaveis-2011
    quote: 'Série: “O Povo Pergunta e os Episcopáveis Respondem”'
  - source: drp2-episcopaveis-2011
    quote: Rev. Evilásio Tenório | Rev. Flávio Adair | Rev. Maurício Amazonas
- type: other
  date: '2009-07-31'
  description: >-
    O bispo diocesano Robinson Cavalcanti dá posse, em 31/07/2009, à Comissão Especial de Assessoria Institucional,
    criada por recomendação do Encontro do Clero para encaminhar um status estável da Diocese do Recife na Comunhão
    Anglicana; integram-na Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente do Conselho
    Diocesano) e os arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório e Carlos Alberto
    Fernandes
  status: confirmed
  sources:
  - source: darn2-comissao-2009
    quote: >-
      o Bispo Diocesano, Dom Robinson Cavalcanti, deu posse à Comissão Especial de Assessoria Institucional criada
      por recomendação do recente Encontro do Clero, visando os encaminhamentos necessários a um status estável
      para a Diocese do Recife na Comunhão Anglicana
  - source: darn2-comissao-2009
    quote: >-
      Integram essa comissão os reverendos Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente
      do Conselho Diocesano) e os Arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório
      e Carlos Alberto Fernandes
- type: other
  date: '2009-10-04'
  description: >-
    A Diocese do Recife convoca para 04/10/2009, na Paróquia Anglicana Emanuel (Olinda), culto de ação de graças
    pelos 12 anos de episcopado de Dom Robinson Cavalcanti, tendo como pregador o presidente do Conselho Diocesano,
    Maurício Amazonas
  status: probable
  sources:
  - source: darn2-acao-gracas-2009
    quote: Culto de Ação de Graças pelos 12 anos de Episcopado de Dom Robinson
  - source: darn2-acao-gracas-2009
    quote: >-
      será celebrado no primeiro domingo de outubro, dia 04, às 18h30, na Paróquia Anglicana Emanuel, Olinda-PE
