      quer na condição anterior de Presidente do Conselho Diocesano, quer na condição atual de Vigário-Geral
  notes: Vigário-geral em maio de 2011; antes, presidente do Conselho Diocesano.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: presidente do Conselho Diocesano
  status: confirmed
  sources:
  - source: darl1-398
    quote: >-
      Rev. Maurício Amazonas, ose é Presbítero na Diocese do Recife; Presidente do Conselho Diocesano, Pároco da
      Paróquia Anglicana Jardim das Oliveiras, no Arcediagado Sul, em Recife-PE.
  - source: darl1-405
    quote: >-
      Quero agradecer ao nosso Bispo Diocesano pela honra que concede ao Presidente do seu Conselho Diocesano para
      proferir esta palestra
  notes: Nessa função em 2009-10-04 e 2009-10-06 (e nos artigos de 2009-11 do mesmo autor).
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: vigário-geral diocesano
  status: confirmed
  sources:
  - source: darl1-479
    quote: >-
      Rev. Maurício Amazonas, ose é Presbítero na Diocese do Recife; Vigário-Geral Diocesano, Pároco da Paróquia
      Anglicana Jardim das Oliveiras, no Arcediagado Sul, em Recife-PE.
  - source: darl1-5177
    quote: >-
      Vigário Geral Diocesano, Pároco da Paróquia Anglicana Jardim das Oliveiras , no Arcediagado Centro, em Recife
      (PE); Capelão do Seminário Anglicano Teológico, em Recife (SAT-PE).
  notes: >-
    Já assina como vigário-geral em 2009-12-25; em 2009-10-06 ainda se apresentava como presidente do Conselho Diocesano.
    Em 2012-05-05 continua vigário-geral e pároco da Paróquia Anglicana Jardim das Oliveiras, então no Arcediagado
    Centro. Em 2012-05-05.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: secretário diocesano de educação
  status: confirmed
  sources:
  - source: darl1-189
    quote: >-
      Presidente do Conselho Diocesano, Capelão do Seminário Anglicano Teológico em Recife (SAT-PE), Pároco da Paróquia
      Anglicana Jardim das Oliveiras, no bairro Setúbal, Recife-PE, e Secretário Diocesano de Educação.
  notes: Cargo citado na nota biográfica de artigo incluído no site em 2009-07-01.
