events:
- type: other
  date: '2011-05-05'
  description: >-
    Na eleição de bispos sufragâneos da Diocese do Recife (Sínodo Extraordinário de 04/06/2011), os 'episcopáveis'
    eram os reverendos Evilásio Tenório, Flávio Adair Torres Soares e Maurício Amazonas.
  status: confirmed
  sources:
  - source: drp2-episcopaveis-2011
    quote: 'Série: “O Povo Pergunta e os Episcopáveis Respondem”'
  - source: drp2-episcopaveis-2011
    quote: Rev. Evilásio Tenório | Rev. Flávio Adair | Rev. Maurício Amazonas
- type: other
  date: '2009-07-31'
  description: >-
    O bispo diocesano Robinson Cavalcanti dá posse, em 31/07/2009, à Comissão Especial de Assessoria Institucional,
    criada por recomendação do Encontro do Clero para encaminhar um status estável da Diocese do Recife na Comunhão
    Anglicana; integram-na Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente do Conselho
    Diocesano) e os arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório e Carlos Alberto
    Fernandes
  status: confirmed
  sources:
  - source: darn2-comissao-2009
    quote: >-
      o Bispo Diocesano, Dom Robinson Cavalcanti, deu posse à Comissão Especial de Assessoria Institucional criada
      por recomendação do recente Encontro do Clero, visando os encaminhamentos necessários a um status estável
      para a Diocese do Recife na Comunhão Anglicana
  - source: darn2-comissao-2009
    quote: >-
      Integram essa comissão os reverendos Miguel Uchoa (coordenador), Maurício Coelho, Maurício Amazonas (presidente
      do Conselho Diocesano) e os Arcediagos Luiz Souza, João Peixoto (secretário), Fred Souto, Evilásio Tenório
      e Carlos Alberto Fernandes
- type: other
  date: '2009-10-04'
  description: >-
    A Diocese do Recife convoca para 04/10/2009, na Paróquia Anglicana Emanuel (Olinda), culto de ação de graças
    pelos 12 anos de episcopado de Dom Robinson Cavalcanti, tendo como pregador o presidente do Conselho Diocesano,
    Maurício Amazonas
  status: probable
  sources:
  - source: darn2-acao-gracas-2009
    quote: Culto de Ação de Graças pelos 12 anos de Episcopado de Dom Robinson
  - source: darn2-acao-gracas-2009
    quote: >-
      será celebrado no primeiro domingo de outubro, dia 04, às 18h30, na Paróquia Anglicana Emanuel, Olinda-PE
- type: other
  date: '2005-08-13'
  description: >-
    Sermão de Maurício Amazonas na Paróquia Anglicana da Redenção (Olinda-PE), na noite de 13/08/2005, por ocasião
    do primeiro ano de ordenação de Daniel Barbosa; a página não informa a data da ordenação.
  status: confirmed
  sources:
  - source: d2s04-mauricio-estevao
    quote: >-
      Sermão proferido por ocasião do Primeiro Ano de Ordenação do Rev. Daniel Barbosa, ose, na noite de 13 de agosto
      de 2005. Paróquia Anglicana da Redenção, em Olinda-PE.
- type: other
  date: '1990-02-04'
  description: >-
    Maurício Amazonas relata, em texto de 04/02/2006, que foi ordenado pastor pela Igreja Evangélica Congregacional
    de Boa Viagem, no Ceará, em 04/02/1990, aos 23 anos, antes do ministério na Diocese Anglicana do Recife.
  status: confirmed
  sources:
  - source: d2s01-art-4323
    quote: >-
      Hoje faz 16 anos que fui ordenado Pastor pela Igreja Evangélica Congregacional de Boa Viagem, no Ceará. Era
      o dia 4 de fevereiro de 1990. Tinha eu 23 anos de idade.
- type: other
  date: '2009-10-04'
  description: >-
    Culto de ação de graças pelos 12 anos de sagração do bispo diocesano Robinson Cavalcanti, no Dia de São Francisco
    de Assis, na Paróquia Anglicana Emanuel (Olinda-PE); o sermão foi proferido pelo presidente do Conselho Diocesano,
    Maurício Amazonas.
  status: confirmed
  sources:
  - source: darl1-398
    quote: Paróquia Anglicana Emanuel, Olinda (PE), 04 de outubro de 2009.
  - source: darl1-398
    quote: 'Neste Dia de São Francisco de Assis, eu gostaria de Saudar:'
- type: other
  date: 2009-10
  description: >-
    Caravana missionária de cerca de 10 dias ao Arcediagado Sul/Sudeste, com visitas ao Rio de Janeiro, Niterói,
    interior de São Paulo, Paraná, Rio Grande do Sul e Belo Horizonte, com confirmações e recepções nas comunidades;
    integraram-na o bispo Robinson Cavalcanti, o arcediago, Maurício Amazonas e Hermany Soares.
  status: probable
  sources:
  - source: d2s05-viagem-23
    quote: Foi muito bom conviver de perto com o Bispo, Rev. Beto e Rev. Hermany.
  - source: d2s05-viagem-4
    quote: >-
      Hoje temos um Arcediagado com nove comunidades, cinco Presbíteros, dois Diáconos em vias de reconhecimento
      de Ordens, e mais uma possível Ordenação Diaconal ainda para este ano.
- type: other
  date: 2009-10
  description: >-
    Na reunião do Conselho Diocesano de outubro de 2009, a diocese recebeu mais dois processos de incardinação e
    um pedido de postulância às Sagradas Ordens, vindos do Arcediagado Sul/Sudeste; o presidente do Conselho defende
    ordenar ou reconhecer ordens apenas de quem trabalha ou inicia uma comunidade.
  status: probable
  sources:
  - source: d2s05-viagem-4
    quote: >-
      Na reunião do Conselho Diocesano de outubro, recebemos mais dois processos pedindo Incardinação e um pedido
      de Postulância às Sagradas Ordens.
  - source: d2s05-viagem-4
    quote: só se ordenar ou reconhecer ordens de quem estiver trabalhando ou iniciando uma comunidade
- type: other
  date: '2008-04-04'
  description: >-
    Culto do Dia do Episcopado na Paróquia Anglicana Jardim das Oliveiras (Recife), com a presença do bispo diocesano
    Robinson Cavalcanti e do primaz do Cone Sul, Gregory Venables, segundo o pároco Maurício Amazonas.
  status: probable
  sources:
  - source: d2s08-amaz-episc2
    quote: >-
      Nossa Paróquia tem hoje a honra de contar com as presenças do nosso Bispo Diocesano e do nosso Bispo Primaz.
  - source: d2s08-amaz-episc2
    quote: Vamos receber, com alegria, os nossos Bispos, nesta noite de festa.
