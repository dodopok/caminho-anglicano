    quote: >-
      a Ordem ficou restrita a um círculo muito específico de clérigos, sobrevivendo através deles, até hoje, como
      por exemplo, o reverendo Maurício Amazonas.
    page: '28'
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: pároco
  status: confirmed
  sources:
  - source: drp2-episcopaveis-2011
    quote: Sou pastor em tempo integral na Paróquia Anglicana Jardim das Oliveiras.
  notes: 'Local: Paróquia Anglicana Jardim das Oliveiras. Em maio de 2011.'
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: vigário geral
