# yaml-language-server: $schema=../../schemas/person.json
id: mauricio-amazonas
name: Maurício Amazonas
biography: Capelão do SAT-PE e pároco da Paróquia Jardim das Oliveiras em 2006.
sources:
- source: drp-boletim-oracao-2006
  quote: >-
    novo Seminário Anglicano Teológico (SAT-PE): Ven. Arc. Rev. Evilásio Tenório – Reitor, Rev. Maurício Amazonas,
    Capelão e a Coordenadora Pedagógica: Revda. Jeane Coelho
- source: drp-boletim-oracao-2006
  quote: Orar pela Paróquia Anglicana Jardim das Oliveiras; pelo Rev. Maurício Amazonas
ordinations:
- order: diaconate
  date: '2005-08-27'
  place: Paróquia Anglicana do Mediador, Recife-PE
  jurisdiction: diocese-anglicana-recife
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: drp2-ordenacoes-2005-08-27
    quote: SERMÃO DE ORDENAÇÕES Paróquia Anglicana do Mediador Recife (PE), 27/08/2005
  - source: drp2-ordenacoes-2005-08-27
    quote: >-
      Bem-vindos a Casa de Deus, para esse Culto de Adoração e Ações de Graças, e de Ordenação dos novos Diáconos:
      Jeane Coelho, Maurício Amazonas e Tereza Catão, e o novo Presbítero reverendo Josias de Souza Júnior.
- order: presbyterate
  date: '2006-02-04'
  place: Catedral Anglicana do Bom Samaritano, Recife-PE
  jurisdiction: diocese-anglicana-recife
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: drp2-ord-presb-amazonas-2006
    quote: >-
      Sermão de Ordenação Presbiteral Reverendo Maurício Amazonas Catedral Anglicana do Bom Samaritano Recife (PE),
      04.02.2006
  - source: drp2-ord-presb-amazonas-2006
    quote: Ao longo desses oito anos e meio de episcopado ordenei 68 Diáconos e 53 Presbíteros.
