    04/02/2006, fala de confirmação do autor para o sacerdócio diante da comunidade, da Igreja Anglicana e do seu
    bispo, na mesma data em que outras fontes situam a ordenação presbiteral; a página não descreve explicitamente
    a cerimônia.
