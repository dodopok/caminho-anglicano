# yaml-language-server: $schema=../../schemas/person.json
id: mauricio-amazonas
name: Maurício Amazonas
biography: >-
  Ordenado diácono em 27 de agosto de 2005 e presbítero em 4 de fevereiro de 2006 por Robinson Cavalcanti, na Diocese
  Anglicana do Recife (IEAB); antes, em 2004, figurava como ministro leigo da Paróquia Anglicana Bom Samaritano.
  Membro da OSE, foi capelão do Seminário Anglicano Teológico (SAT-PE), pároco da Paróquia Anglicana Jardim das
  Oliveiras, secretário diocesano de educação, estatístico diocesano e presidente do Conselho Diocesano, e depois
  vigário-geral diocesano (2009 a 2011). Em 2011, foi um dos três 'episcopáveis' na eleição de bispos sufragâneos
  da diocese.
