    quote: Ven. Arc. Rev. Côn. Luiz Souza de França (Arcediagado PB/CE/RN) … Rev. Antonio Costa de Oliveira
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Missão Anglicana do Consolador (PB). Clérigo
    citado como pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão).
    Anexo R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson
    Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005
    é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data exata. Local: Arcediagado PB/CE/RN. Em exercício
    em outubro de 2010, conforme a mensagem publicada em 05/10/2010 no site da Diocese do Recife; listado entre
    os signatários da mensagem do Arcediagado PB/CE/RN Local: Arcediagado PB/CE/RN. Consta entre os clérigos que
    assinam a mensagem do Arcediagado PB/CE/RN de 05/10/2010 (grafia do site: "Rev. Antonio Costa de Oliveira");
    em exercício em outubro/2010.
