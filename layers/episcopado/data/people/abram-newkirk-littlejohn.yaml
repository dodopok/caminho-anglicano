biography: >-
  Abram Newkirk Littlejohn foi sagrado bispo em 27 de janeiro de 1869, na Igreja Episcopal dos EUA (TEC), tendo
  Horatio Potter como sagrante principal, e atuou como bispo da Diocese de Long Island desde então.
