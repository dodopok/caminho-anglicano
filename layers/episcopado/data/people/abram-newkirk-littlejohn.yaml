    of Long Island.
- source: perry-1895
  quote: >-
    He was consecrated in his church, Jan. 27, 1869, by Bishops H. Potter, Johns, Odenheimer, Coxe, Clarkson, Randall,
    Kerfoot, Neely, and Morris.
