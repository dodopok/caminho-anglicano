id: abram-newkirk-littlejohn
name: Abram Newkirk Littlejohn
full_name: Abram Newkirk Littlejohn
aliases:
- Bp. Littlejohn
wikidata: Q4669375
biography: >-
  Abram Newkirk Littlejohn (1824–1901) foi sagrado bispo em 27 de janeiro de 1869, na Igreja Episcopal dos EUA (TEC),
  tendo Horatio Potter como sagrante principal. Primeiro bispo da Diocese de Long Island, dirigiu-a até a morte,
  em 1901. Participou de quatro sagrações episcopais, entre elas as de William Croswell Doane e John Scarborough,
  como co-sagrante.
sources:
