id: william-meade
name: William Meade
full_name: William Meade
aliases:
- Bp. Meade
wikidata: Q8015522
biography: >-
  Sagrado em 19/08/1829, na Filadélfia, por William White, foi bispo da Diocese da Virgínia (TEC), assumindo-a após
  a morte de Moore.
sources:
- source: perry-1895
  quote: >-
    He was consecrated in St. James's Church, Philadelphia, Aug. 19, 1829, by Bishops White, Hobart, Griswold, Channijig
    Moore, Croes, Brownell, and H. U. Onderdonk.
- source: wp-en-histlist
  quote: >-
    | [[William Meade]] | [[William White (Bishop of Pennsylvania)|2]] [[John Henry Hobart|11]] [[Alexander Viets
    Griswold|12]] | 1829
- source: perry-1895
  quote: On the death of Moore he became, without opposition, bishop of Virginia
- source: perry-1895
  quote: RIGHT REVEREND WILLIAM MEADE, D.D.
ordinations:
- order: episcopate
  date: '1829-08-19'
  place: St. James's Church, Filadélfia
  jurisdiction: tec
  office: auxiliary
  principal_consecrator: william-white
  co_consecrators:
  - alexander-viets-griswold
  - channing-moore
  - croes
  - h-u-onderdonk
  - john-henry-hobart
  - thomas-church-brownell
  status: confirmed
