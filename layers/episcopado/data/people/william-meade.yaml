  - source: wp-en-histlist
    quote: >-
      | [[William Meade]] | [[William White (Bishop of Pennsylvania)|2]] [[John Henry Hobart|11]] [[Alexander Viets
      Griswold|12]] | 1829
  notes: >-
    Perry (1895) lista os sagrantes começando pelo que presidiu; a lista da Wikipédia (que cita Perry) põe o mesmo
