  quote: >-
    Em 14 de abril de 2007, foram sagrados dois novos bispos: Alexandre Barbosa Monteiro Ximenes, responsável pela
    Diocese do Litoral Sul e Alagoas
ordinations:
- order: episcopate
  date: '2007-04-14'
  place: Centro de Convenções, Recife (PE)
  jurisdiction: iecb
  office: auxiliary
  principal_consecrator: randolph-austin-adler
  status: contested
  sources:
  - source: lie-trindade-ximenes-2009
    quote: >-
      Dom Alexandre Ximenes, foi sagrado, em Abril de 2007, Bispo da IECB, numa noite momoravel no Centro de Convenções
      em Recife, estavam lá Bispos de todo os continentes
  - source: lie-trindade-clero-2007
    quote: O Bispo Auxiliar Dom Alexandre Ximenes, sua esposa Carmen e os filhos Alexandre e Ariel
  - source: ptwiki-iecb
    quote: >-
      Em 14 de abril de 2007, foram sagrados dois novos bispos: Alexandre Barbosa Monteiro Ximenes, responsável
      pela Diocese do Litoral Sul e Alagoas
  - source: enwiki-iccec-bispos
    quote: '|54||14 April 2007||1||Alexandre Barbosa Monteiro Ximenes||Aux. Bp. Brazil||'
  - source: costa2021
    quote: >-
      Em 14 de abril de 2007 foram sagrados novos bispos para a denominação: Alexandre Barbosa Monteiro Ximenes
      (Diocesano do Litoral Sul e Estado de Alagoas)
  - source: ier-camara-recife-ximenes-2012
    quote: Em 2005 foi sagrado bispo pela mesma congregação
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 14 de abril de 2007 foram sagrados novos bispos para a denominação: Alexandre Barbosa Monteiro Ximenes
      (Diocesano do Litoral Sul e Estado de Alagoas)
    page: '55'
  discrepancies:
  - field: date
    value: '2005'
    sources:
    - source: ier-camara-recife-ximenes-2012
      quote: Em 2005 foi sagrado bispo pela mesma congregação
  notes: >-
    Fonte primária (site da Catedral da Trindade, 2009) confirma abril de 2007 e o local; a data de 2005 dada pela
    Câmara do Recife (2012) é contrariada por esta fonte e por outras de 2007: ainda em 2004 era "então Rev." e
    reitor do SETEC, e em outubro de 2007 o site da Catedral já o lista como bispo auxiliar. O dia 14/04/2007 vem
    de outras fontes já conhecidas. Lista da ICCEC (Wikipédia EN) dá como sagrante o nº 1, Austin Randolph Adler
    (patriarca da ICCEC). A Wikipédia PT dá a mesma data. Sucessão: ICCEC. Versão divergente: várias fontes dão
    2007-04-14 (Wikipédia PT, ICCEC/Wikipédia EN, Costa). A Câmara do Recife (2012, discurso do vereador autor da
    homenagem) diz 2005 para a sagração e 2007 para a condição de bispo auxiliar do Recife/diocesano da Zona Sul.
    Ver duvidas. Sagrantes não nomeados. Igreja Episcopal Carismática do Brasil — Diocesano do Litoral Sul e Estado
    de Alagoas. A tese não informa local nem sagrantes.
