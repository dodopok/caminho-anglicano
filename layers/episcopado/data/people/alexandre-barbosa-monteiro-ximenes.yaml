      Garcia instituiu, em 2004, o Seminário Teológico Episcopal Carismático (SETEC), tendo como Reitor o então
      reverendo Alexandre Ximenes.
    page: '260'
  notes: >-
    Local: Catedral da Trindade, Recife. Texto original do site: "No Recife desde 2003, quando foi recebido pelo
    então Bispo Dom Paulo Garcia, como pastor Carismático". Reitor do SETEC (seminário) desde sua implantação, em
    2004. Reitor do SETEC; antes pastor da Igreja Evangélica Congregacional. Reitor do SETEC; sagrado bispo em 2007.
