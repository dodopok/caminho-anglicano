    Beckwith'). Única fonte para data/sagrantes é a Wikipédia PT (cuja nota de rodapé é a notícia do G1 sobre o
    velório, que não trata da sagração). Mesmo dia da sagração de Flávio Adair (17/03/2012, site da IAB) — provavelmente
