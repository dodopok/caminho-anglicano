events:
- type: other
  date: '2012-09-15'
  description: >-
    Sínodo Diocesano Extraordinário da Diocese do Recife elege Miguel Ângelo de Andrade Uchoa Cavalcanti 4º bispo
    diocesano (52 delegados clericais e 58 leigos); o bispo sufragâneo Evilásio Tenório também foi candidato
  status: confirmed
  sources:
  - source: dar-2012-eleicao-uchoa
    quote: >-
      Neste sábado (15/09/2012), nas dependências da Paróquia Anglicana Espírito Santo , aconteceu o Sínodo Diocesano
      Extraordinário para eleição do Bispo Diocesano
  - source: dar-2012-eleicao-uchoa
    quote: >-
      Os 52 delegados clericais, e 58 delegados leigos votaram, escolhendo como o 4º Bispo Diocesano, o Rev. Miguel
      Ângelo de Andrade Uchoa Cavalcanti . O Bispo Sufragâneo da Região Eclesiástica 2, Dom Evilásio Tenório que,
      de forma canônica e democrática, também pleiteou o cargo
- type: other
  date: '2012-03-17'
  description: >-
    Eleito bispo sufragâneo em 2011, Evilásio Tenório teria sido sagrado, segundo a Wikipédia, por Robinson Cavalcanti,
    mas a sagração ficou para depois da morte do bispo (26/02/2012) e ocorreu em 17/03/2012. Ainda segundo a Wikipédia,
    Evilásio permaneceu provisoriamente como bispo diocesano até a eleição do novo líder em 19/05/2012.
  status: probable
  sources:
  - source: lrec-ptwp-evilasio
    quote: >-
      Em virtude da morte de Dom Robinson, em 26 de fevereiro de 2012, Dom Evilásio permaneceu provisoriamente como
      bispo diocesano, até a eleição do novo líder da Igreja Anglicana, em 19 de maio de 2012.
- type: other
  date: 2015-12
  description: >-
    Pedro Muniz instituído Ministro Local no Sínodo da Diocese do Recife (Paróquia Anglicana Jardim das Oliveiras,
    Boa Viagem, Recife), dez/2015 - antes do diaconato de 01/12/2017.
  status: confirmed
  sources:
  - source: iabord-ancora-sinodo-2015
    quote: >-
      Neste mesmo evento o nosso pastor Eric (peruca) foi ordenado Diácono, e o nosso pastor Pedro Muniz foi instituído
      Ministro Local, cerimonia presidida pelos Bispos + Miguel Uchoa, +Evilásio e + Flávio Adair, e Bill Atwood
      (Acna/Gafcon).
- type: other
  date: '2012-07-21'
  description: >-
    Retiro do clero da Igreja Anglicana–Diocese de Recife (21/07/2012): candidatam-se à sucessão de Robinson Cavalcanti
    o Revmo. Evilásio Tenório (bispo sufragâneo) e o Rev. Miguel Uchôa (reitor da PAES); eleição marcada para 15/09/2012
    por voto do clero e de delegados leigos.
  status: probable
  sources:
  - source: mu-blog-2012-07-22
    quote: >-
      Nesse momento colocaram seus nomes a disposição o Revmo Evilásio Tenório, Bispo sufraganeo (auxiliar) da DR
      e esse que vos escreve, Rev Miguel Uchôa, Reitor da PAES,(Paróquia Anglicana Espírito Santo) .
  - source: mu-blog-2012-07-22
    quote: será decidido no dia 15 de Setembro, pelo voto do clero e dos leigos.
- type: other
  date: '2012-02-29'
  description: >-
    Na véspera do sepultamento de Robinson Cavalcanti, o G1 informa que Evilásio Tenório substituirá interinamente
    o bispo até a escolha do novo líder; o culto fúnebre foi celebrado pelo presidente do Conselho Diocesano, Márcio
    Simões, e pelos 'bispos auxiliares' Flávio Adair e Evilásio Tenório.
  status: confirmed
  sources:
  - source: g1-2012-02-29-velorio
    quote: >-
      O culto foi celebrado pelo presidente do Conselho Diocesano, Márcio Simões, e pelos dois bispos auxiliares
      Flávio Aldair e Evilásio Tenório. Dom Evilásio vai substituir dom Robinson Cavalcanti até a escolha do novo
      líder da igreja, o que deve ocorrer no dia 19 de maio.
  - source: lrec-ptwp-evilasio
    quote: >-
      Em virtude da morte de Dom Robinson, em 26 de fevereiro de 2012, Dom Evilásio permaneceu provisoriamente como
      bispo diocesano, até a eleição do novo líder da Igreja Anglicana
- type: other
