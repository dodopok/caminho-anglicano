biography: >-
  Evilásio Tenório da Silva Júnior nasceu em Recife em 2/10/1950. Postulante em 2002, foi ordenado diácono em 13/7/2002
  e presbítero em 26/7/2003, por Robinson Cavalcanti, na Diocese Anglicana do Recife. Nela foi arcediago (Centro
  e, em 2009, Sul), deão pró-têmpore da Catedral Anglicana do Bom Samaritano, pároco da Paróquia Anglicana do Mediador,
  reitor do Seminário Anglicano Teológico (SAT-PE) e vigário-geral diocesano; em 23/8/2005 consta entre os clérigos
  excluídos da comunhão da IEAB. Eleito bispo sufragâneo em 4/6/2011, com Flávio Adair, foi sagrado em 17/3/2012
  por Peter Beckwith, com Alexander Barroso e Martin Morrison como co-sagrantes, para a 2ª Região Eclesiástica.
  Após a morte de Robinson Cavalcanti, em 26/2/2012, substituiu-o interinamente no comando da diocese; no sínodo
  extraordinário de 15/9/2012 concorreu à sucessão, e foi eleito Miguel Uchôa como 4º bispo diocesano. Desde 2018
  é bispo auxiliar da Diocese do Recife na Igreja Anglicana no Brasil (IAB). Participou de 4 ordenações de diáconos
  ou presbíteros e 4 sagrações episcopais, entre elas as de Miguel Uchôa (2012), Gervásio Cavalcante Neto (2014)
  e Márcio Meira (2017).
