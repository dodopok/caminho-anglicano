  - source: dar-2011-evilasio-eleicoes
    quote: >-
      Rev. Evilásio Tenório Junior é Presbítero na Diocese do Recife; Deão Pró-Têmpore da Catedral Anglicana do
      Bom Samaritano ; Pároco da Paróquia Anglicana do Mediador , em Recife-PE, Arcediago Centro da Diocese e Reitor
      do Seminário Anglicano Teológico (SAT-PE)
  - source: drv-declaracao-32
    quote: Ven. Arc. Rev. Evilásio Tenório da S Júnior
  - source: drv-nota-esclarecimento-2006
    quote: Evilásio Tenório da Silva
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Evilásio Tenório da Silva Junior … Os clérigos não atenderam
      à convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Presbítero e arcediago da Diocese do Recife (listas do clero de 2007 e 2010; artigo de 2011). Data e ordenante
    do diaconato/presbiterato não encontrados. Postulante em 2002 (vínculo IEAB já registrado). Consta como clérigo
    da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de Esclarecimento); início
    e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005,
    manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início dado só como
    ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data exata.
