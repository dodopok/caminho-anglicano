    05/10/2010; em 21/04/2010 o relato da peregrinação a Garanhuns o conta entre os arcediagos que saudaram o bispo
    (citado só como "Rev. Evilásio"). Local: Arcediagado Centro. Cargo para 2011 constante da relação de cargos
    diocesanos publicada em 10/12/2010 (captura de dez/2010), após o XXX Concílio Diocesano. Local: Arcediagado
