    (Carta de Setúbal), com o cargo indicado na lista de delegados. Local: Arcediagado Sul. Em exercício em agosto
    de 2010, conforme nota biográfica de 09/08/2010 Local: Arcediagado Sul. Em exercício em outubro de 2010, conforme
    a mensagem publicada em 05/10/2010 no site da Diocese do Recife; listado entre os signatários da mensagem do
