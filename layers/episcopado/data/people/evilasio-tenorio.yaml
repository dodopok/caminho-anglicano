  - source: lrec-iae-evilasio
    quote: Professor e Reitor no SAT-Recife
biography: >-
  Ordenado diácono (13/07/2002) e presbítero (2003) por Robinson Cavalcanti na Diocese do Recife, onde foi arcediago
  e deão pró-têmpore da Catedral do Bom Samaritano. Sagrado bispo sufragâneo em 17/03/2012 por Peter Beckwith, assumiu
  interinamente a diocese após a morte de Robinson, até a eleição de Miguel Uchôa; desde 2018 é bispo auxiliar da
  Diocese do Recife na IAB.
