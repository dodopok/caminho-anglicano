- type: other
  date: 2014-12
  description: >-
    XXXIV Sínodo Diocesano da Diocese do Recife (Igreja Anglicana), na Paróquia Anglicana Espírito Santo, com mais
    de 150 delegados clericais e leigos; culto de abertura oficiado pelo bispo diocesano Miguel Uchoa, com pregação
    do bispo Kevin Bond Allen (Cascádia, ACNA); registra a criação, em 2014, de diversos Pontos Missionários em
    Pernambuco e Paraíba e a elevação de duas comunidades a paróquias, e uma mensagem de apoio do arcebispo Foley
    Beach, primaz da ACNA
  status: confirmed
  sources:
  - source: d2s19-i24
    quote: >-
      XXXIV Sínodo da Igreja Anglicana – Diocese do Recife Nesta sexta e sábado, nas dependências da Paróquia Anglicana
      Espírito Santo(PE) , com a presença de mais de 150 pessoas entre delegados clericais e delegados leigos
  - source: d2s19-i24
    quote: >-
      Destacamos ainda, a criação no ano de 2014, de diversos Pontos Missionários em Pernambuco e Paraíba, e a Elevação
      de duas comunidades à Paróquias!
  - source: d2s19-i24
    quote: >-
      O Arcebispo Foley Beach, Primaz da Igreja Anglicana da América do Norte (ACNA) enviou uma mensagem a todos
      os presentes, manifestando apoio a Diocese.
- type: other
  date: '2014-10-15'
  description: >-
    Inauguração da Escola Municipal Bispo Robinson Cavalcanti, em Olinda (PE), em homenagem póstuma ao bispo diocesano
    Robinson Cavalcanti; pela diocese estiveram o bispo diocesano Miguel Uchôa, os bispos Flávio Adair e Evilásio
    Tenório e clérigos
  status: confirmed
  sources:
  - source: d2s19-i40
    quote: >-
      Na manhã dessa quarta-feira, 15 de outubro (dia do professor), foi inaugurada a Escola Municipal Bispo Robinson
      Cavalcanti.
  - source: d2s19-i40
    quote: >-
      a Prefeitura fará uma homenagem póstuma ao bispo diocesano da Igreja Anglicana Diocese do Recife, cientista
      político e ex-professor da Universidade Federal Rural de Pernambuco, Bispo Robinson Cavalcanti
  - source: d2s19-i40
    quote: >-
      Além dos presentes (mais de 200 pessoas), estavam ainda pela diocese o Bispo Evilásio Tenório, e os reverendos(as):
      Maurício Amazonas, Daniel Barbosa, Márcia Coelho, Keyla Camargo e Hermany Soares
