id: evilasio-tenorio
name: Evilásio Tenório
full_name: Evilásio Tenório da Silva Júnior
aliases:
- Evilasio Tenorio Silva
- Evilásio Tenório da Silva
- Evilásio Tenório da Silva Junior
- Evilásio Tenório da Silva Júnior
biography: >-
  Bispo auxiliar da Diocese de Recife (IAB), pároco da Paróquia Anglicana do Mediador (Recife) em 2019.
sources:
- source: ptwp-iab
  quote: como bispo auxiliar o Revmo. Evilásio Tenório da Silva Júnior
ordinations:
- order: episcopate
  date: '2012-03-17'
  place: Paróquia Anglicana do Espírito Santo (PAES), Jaboatão dos Guararapes
  jurisdiction: diocese-anglicana-recife
  office: suffragan
  principal_consecrator: peter-beckwith
  co_consecrators:
  - alexander-barroso
  - martin-morrison
  status: contested
  sources:
  - source: wp-pt-evilasio
    quote: >-
      Finalmente, no dia 17 de março de 2012, foi sagrado bispo sufragâneo, na Paróquia Anglicana do Espirito Santo
      pelo bispo Peter Beckwith, da Igreja Anglicana na América do Norte, e teve como co-sagrantes o bispo Alexander
      Barroso, da Igreja Anglicana Carismática da Venezuela e o bispo Martin Marrison, da Igreja da Inglaterra na
      África do Sul.
  - source: mu-blog-2012-07-22
    quote: o Revmo Evilásio Tenório, Bispo sufraganeo (auxiliar) da DR
  - source: iab-poster-linhagem-uchoa
    quote: em 2012, sagrou Dom Evilásio Tenório da Silva Júnior como bispo (ver 162c).
  discrepancies:
  - field: jurisdiction
    value: iacs
    sources:
    - source: iab-poster-linhagem-uchoa
      quote: em 2012, sagrou Dom Evilásio Tenório da Silva Júnior como bispo (ver 162c).
  notes: >-
    Única fonte para data/sagrantes é a Wikipédia PT (cuja nota de rodapé é a notícia do G1 sobre o velório, que
    não trata da sagração). Mesmo dia da sagração de Flávio Adair (17/03/2012, site da IAB) — provavelmente cerimônia
    conjunta. O pôster da IAB também dá Beckwith (2012). 'Martin Marrison' (grafia da fonte) provavelmente = Martin
    Morrison, bispo da Church of England in South Africa (CESA) — identificar. Em julho/2012 Uchôa já o chama 'Bispo
    sufraganeo (auxiliar)'.
