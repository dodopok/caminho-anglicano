  notes: >-
    Sermão de ordenação assinado por Dom Robinson Cavalcanti, bispo diocesano, que conta esta como parte das suas
    ordenações ('como bispo, estou completando a ordenação de 40 ministros'). Primeiro nome único no clero da diocese;
    identificado com o futuro bispo Evilásio Tenório (postulante em jan/2002).
- order: episcopate
  date: '2012-03-17'
  place: Paróquia Anglicana Espírito Santo (PAES), Piedade, Jaboatão dos Guararapes-PE
  jurisdiction: iacs
  office: suffragan
  principal_consecrator: peter-beckwith
  co_consecrators:
  - alexander-barroso
  - martin-morrison
  status: confirmed
  sources:
  - source: dar-sagracao-2012
    quote: >-
      O Bispo Sagrante foi o Revmo. Dom Peter Beckwith (TEC – Estados Unidos) que presidiu a Cerimônia e proferiu
      o Sermão; os Bispos Co-Sagrantes foram: Revmo. Dom Alexander Barroso (Igreja Anglicana Carismática – Venezuela)
      e Dom Martin Morrinson (Igreja da Inglaterra na África do Sul)
  - source: dar-sagracao-2012
    quote: >-
      a Sagração dos Bispos Sufragâneos da Diocese do Recife no último sábado (17/03/2012), na Paróquia Anglicana
      Espírito Santo (PAES), no bairro de Piedade, em Jaboatão dos Guararapes (PE)
  - source: dar-sagracao-2012-quadro
    quote: >-
      Bispo Sagrante e Pregador: Revmo. Bispo Peter Beckwith Igreja Episcopal (Estados Unidos) Bispos Co-Sagrantes:
      Revmo. Bispo Alexander Barroso Igreja Anglicana Carismática (Venezuela) Revmo. Bispo Martin Morrison Igreja
      da Inglaterra na África do Sul
  - source: dar-sagracao-2012-quadro
    quote: DOM EVILÁSIO TENÓRIO BISPO SUFRAGÂNEO 2ª REGIÃO ECLESIÁSTICA
  - source: iab-poster-linhagem-uchoa
    quote: em 2012, sagrou Dom Evilásio Tenório da Silva Júnior como bispo (ver 162c).
  - source: lrec-ptwp-evilasio
    quote: >-
      Finalmente, no dia 17 de março de 2012, foi sagrado bispo sufragâneo, na Paróquia Anglicana do Espirito Santo
      pelo bispo Peter Beckwith, da Igreja Anglicana na América do Norte, e teve como co-sagrantes o bispo Alexander
      Barroso, da Igreja Anglicana Carismática da Venezuela e o bispo Martin Marrison, da Igreja da Inglaterra na
      África do Sul.
  - source: mu-blog-2012-07-22
    quote: o Revmo Evilásio Tenório, Bispo sufraganeo (auxiliar) da DR
  notes: >-
    Sagração conjunta com Flávio Adair Torres Soares (bispos sufragâneos eleitos em 2011, sagrados após a morte
    de Robinson Cavalcanti em fev/2012). Confirma, com fonte primária, a informação do pôster da IAB ('por Peter
    Beckwith'). Única fonte para data/sagrantes é a Wikipédia PT (cuja nota de rodapé é a notícia do G1 sobre o
    velório, que não trata da sagração). Mesmo dia da sagração de Flávio Adair (17/03/2012, site da IAB) — provavelmente
    cerimônia conjunta. O pôster da IAB também dá Beckwith (2012). 'Martin Marrison' (grafia da fonte) provavelmente
    = Martin Morrison, bispo da Church of England in South Africa (CESA) — identificar. Em julho/2012 Uchôa já o
    chama 'Bispo sufraganeo (auxiliar)'.
