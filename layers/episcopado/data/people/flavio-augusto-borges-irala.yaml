events:
- type: other
  date: '2012-09-08'
  description: >-
    Eleicao de Flavio Irala para bispo da DASP em 08/09/2012, por 19 a 18 votos na ordem leiga e 15 a 13 na clerical
    (segundo Glauco); anulada pelo bispo Roger Bird e contestada, o que levou ao cisma.
  status: probable
  sources:
  - source: glauco-testemunho-2013
    quote: >-
      No dia 08/09/12 recebi a notícia que em Concílio da DASP o Rev. Flávio Irala havia sido eleito Bispo da mesma
      por 19 a 18 votos na ordem leiga e 15 a 13 votos na ordem clerical.
- type: other
  date: 2012-09
  description: >-
    Crise da eleição episcopal da DASP: concílio extraordinário de 08/09/2012 elege Flávio Augusto Borges Irala;
    em 13/09/2012 o bispo Bird declara nulo o concílio; em 17/09 a Comissão Nacional de Constituição e Cânones da
    IEAB emite parecer favorável à validade; em 20/09 Bird envia carta ao clero dizendo que acata o parecer e que
    o deão Flávio Borges Irala foi eleito seu sucessor.
  status: confirmed
  sources:
  - source: lbd-ieab-acoes
    quote: >-
      13 de setembro de 2012- Bispo Diocesano Dom Roger Douglas Bird emite uma Declaração de Nulidade do Concílio
      Extraordinário de Eleição do Bispo.
  - source: lbd-ieab-acoes
    quote: >-
      Portanto, enviarei a documentação canônica junto com esta carta para nosso Bispo Primaz, informando que o
      DEÃO FLÁVIO BORGES IRALA foi eleito nas eleições do Concílio Extraordinário para ser o meu sucessor.
- type: other
  date: '2012-09-08'
  description: >-
    Concílio Extraordinário da Diocese Anglicana de São Paulo elege o deão Flávio Borges Irala como bispo diocesano.
    Em 13/09/2012 o bispo Roger Bird emite declaração de nulidade da eleição; em 17/09/2012 a Comissão Nacional
    de Constituição e Cânones da IEAB emite parecer favorável à validade; em 20/09/2012 Bird comunica que acata
    o parecer.
  status: confirmed
  sources:
  - source: lq-ieab-acoes
    quote: 08 de setembro de 2012- Concílio Extraordinário para Eleição de Bispo de São Paulo.
  - source: lq-ieab-acoes
    quote: >-
      13 de setembro de 2012- Bispo Diocesano Dom Roger Douglas Bird emite uma Declaração de Nulidade do Concílio
      Extraordinário de Eleição do Bispo.
  - source: lq-ieab-acoes
    quote: >-
      enviarei a documentação canônica junto com esta carta para nosso Bispo Primaz, informando que o DEÃO FLÁVIO
      BORGES IRALA foi eleito nas eleições do Concílio Extraordinário para ser o meu sucessor.
