biography: >-
  Flávio Augusto Borges Irala nasceu em Bagé (RS) em 21/5/1954. Foi ordenado diácono em 1985 e designado para a
  Missão em Cubatão (SP); em 2008 tornou-se deão da Catedral Anglicana de São Tiago, em Curitiba. Eleito bispo da
  Diocese Anglicana de São Paulo em concílio extraordinário em 8/9/2012, por 19 a 18 votos na ordem leiga e 15 a
  13 na clerical, eleição que o bispo Roger Bird declarou nula em 13/9/2012, foi sagrado em setembro de 2013, com
  o primaz Maurício Andrade, como sexto bispo diocesano da DASP. Presidiu o Conselho Nacional de Igrejas Cristãs
  (CONIC). Permaneceu no cargo até outubro de 2021, quando se tornou bispo emérito, e faleceu em 9/1/2025.
