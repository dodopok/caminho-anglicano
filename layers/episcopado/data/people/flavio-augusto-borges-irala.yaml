- source: ieab-irala-falecimento
  quote: >-
    Nascido em 21 de maio de 1954, em Bagé, Rio Grande do Sul, bispo Flávio foi batizado e confirmado na IEAB.
- source: ieab-irala-falecimento
  quote: >-
    Desde jovem, demonstrou vocação para o serviço cristão, destacando-se como líder juvenil na Diocese Sul Ocidental
    nos anos 1970. Entre 1975 e 1978, residiu no Rio de Janeiro, servindo na Paróquia do Redentor e trabalhando
    com a juventude local.
- source: ieab-irala-falecimento
  quote: >-
    Em 1979, mudou-se para São Paulo, onde cursou teologia no Instituto Anglicano de Estudos Teológicos (IAET),
    bacharelando-se
- source: f8ira-hinologia-bio
  quote: >-
    Após alguns anos, mais precisamente em 1979, juntamente com o conterrâneo Xico Esvael, transferiu-se para São
    Paulo, para estudar teologia no Instituto Anglicano de Estudos Teológicos, onde se bacharelou.
- source: f8ira-cnbb-nota
  quote: >-
    Após formar-se em Teologia pelo Instituto Anglicano de Estudos Teológicos (IAET), dedicou-se com zelo pastoral
    a comunidades em São Paulo, Londrina e Curitiba
- source: ieab-irala-falecimento
  quote: >-
    Reconhecido liturgista e músico, bispo Flávio compôs inúmeras canções e antífonas salmodiais, incluindo os hinos
    “Canção da Chegada” e “Grão”, presentes no Hinário Luterano.
- source: f8ira-hinologia-bio
  quote: >-
    Em dezembro de 2007 o Rev. Flávio Irala é o coordenador de Recursos Litúrgicos da Rede Regional de Liturgia
    do CLAI (Conselho Latino Americano de Igrejas).
- source: f8ira-cnbb-nota
  quote: >-
    O bispo Flávio Ilara foi um grande entusiasta do movimento ecumênico e por vários anos membro da Comissão Nacional
    Bilateral Católica – Anglicana
- source: f8ira-wcc-noticia
  quote: >-
    We give special thanks for his ecumenical ministry, standing out as president of the National Council of Christian
    Churches between 2015 and 2017, and representative of his church in the network of ecumenical officers of the
    member churches of the World Council of Churches
- source: f8ira-ceseep-nota
  quote: Fez parte do quadro de associados do CESEEP e foi vice-presidente e, em seguida presidente do CONIC.
