events:
- type: other
  date: '2012-09-08'
  description: >-
    Eleicao de Flavio Irala para bispo da DASP em 08/09/2012, por 19 a 18 votos na ordem leiga e 15 a 13 na clerical
    (segundo Glauco); anulada pelo bispo Roger Bird e contestada, o que levou ao cisma.
  status: probable
  sources:
  - source: glauco-testemunho-2013
    quote: >-
      No dia 08/09/12 recebi a notícia que em Concílio da DASP o Rev. Flávio Irala havia sido eleito Bispo da mesma
      por 19 a 18 votos na ordem leiga e 15 a 13 votos na ordem clerical.
- type: other
  date: '2013'
  description: >-
    47º Concílio da Diocese Anglicana de São Paulo (2013): Flávio Augusto Borges Irala eleito sexto bispo diocesano
    (19 a 18 votos na ordem leiga e 15 a 13 na clerical) contra Francisco Cézar Fernandes Alves (apoiado pela Catedral);
    o bispo Roger Douglas Bird considerou a eleição irregular e declarou o cancelamento do Concílio.
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      A comunidade da Catedral – liderada pelo reverendo Aldo Quintão –, apoiava a candidatura do reverendo Francisco
      Cézar Fernandes Alves, e os demais delegados conciliares, a candidatura do reverendo Flávio Augusto Borges
      Irala.
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: >-
      a eleição foi considera irregular pelo bispo Roger Douglas Bird 30, declarando o cancelamento do Concílio.
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: >-
      Durante o 47º Concílio da DASP o reverendo Flávio Irala foi eleito bispo desta diocese por 19 a 18 votos na
      ordem leiga e 15 a 13 votos na ordem clerical.
    page: '93'
- type: other
