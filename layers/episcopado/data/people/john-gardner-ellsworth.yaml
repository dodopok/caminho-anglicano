biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Evanston,
  Illinois, EUA ("111" no OCR) (1927-11-21). Ordenado diácono em jun/1960 e presbítero em jun/1961. Transferido
  para a Igreja Episcopal do Brasil em 25/04/1965 (Clerical Directory 1968).
