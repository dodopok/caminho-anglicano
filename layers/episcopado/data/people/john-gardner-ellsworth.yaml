biography: >-
  John Gardner Ellsworth nasceu em Evanston (Illinois) em 21/11/1927. Foi ordenado diácono em junho de 1960 e presbítero
  em junho de 1961, este por Egmont Krischke, e atuou no Distrito Missionário do Brasil Central. Foi transferido
  para a Igreja Episcopal do Brasil em 25/4/1965 e, em janeiro de 1966, recebido na Igreja Episcopal dos EUA, na
  Diocese da Virgínia.
