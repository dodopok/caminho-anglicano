id: edmar-pimentel
name: Edmar Pimentel
biography: >-
  Clérigo(a) da Diocese Anglicana do Recife que em 2004 pediu supervisão episcopal alternativa à Câmara dos Bispos
  da IEAB, permanecendo na IEAB.
sources:
- source: costa2021
  quote: >-
    Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Rev. Edmar Pimentel (Catedral da
    SS. Trindade)
  page: '545'
ordinations:
- order: diaconate
  date: '1999-12-18'
  place: Paróquia do Espírito Santo (Recife)
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-ord-adonias-diac
    quote: SERMÃO DE ORDENAÇÃO AO DIACONATO DE ADONIAS, EDGAR E EDMAR
  - source: rcor-drv-ord-adonias-diac
    quote: PARÓQUIA DO ESPÍRITO SANTO – 18/12/99
  - source: rcor-drv-ord-adonias-diac
    quote: A Igreja os acolhe em alegria. O Bispo os ordena com satisfação.
  - source: rcor-drv-ord-adonias-diac
    quote: >-
      Recebi a Diocese do Recife, após 17 anos de sua existência, com 20 pastores. Hoje ordeno o 21º dos novos pastores
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti, que 'recebeu a Diocese do Recife' em 1997) na ordenação diaconal
    de Adonias, Edgar e Edmar. Identificação pelos primeiros nomes: Adonias Ramos de Souza e Edgar Batista Ferreira
    Neto (ambos presbíteros da diocese em 2002 e depois bispos da IECB) e Edmar Pimentel.
