# yaml-language-server: $schema=../../schemas/person.json
id: edmar-pimentel
name: Edmar Pimentel
biography: >-
  Edmar Carvalho Pimentel foi ordenado diácono em 18/12/1999, na Paróquia do Espírito Santo, por Robinson Cavalcanti.
  Foi o primeiro ministro da Missão Videira Verdadeira, ponto missionário criado em Caruaru a partir de dezembro
  de 1999. Em junho de 2003 essa missão se uniu à Paróquia Anglicana da Reconciliação. Como presbítero da Diocese
  Anglicana do Recife, assinou em 2002 como presidente do Conselho Diocesano. Consta em listas diocesanas como ministro
  auxiliar, membro do Conselho Diocesano e do Tribunal Eclesiástico. Em 2004 aparece, como clérigo da Catedral da
  SS. Trindade, entre os clérigos cuja solicitação foi considerada em decreto da IEAB.
sources:
- source: rcor-drv-ord-adonias-diac
  quote: SERMÃO DE ORDENAÇÃO AO DIACONATO DE ADONIAS, EDGAR E EDMAR
- source: rcor-drv-ord-adonias-diac
  quote: PARÓQUIA DO ESPÍRITO SANTO – 18/12/99
- source: d2s31-reconc
  quote: Seu primeiro ministro foi o Rev. Edmar Pimentel
- source: d2s31-reconc
  quote: >-
    dezembro de 1999 um grupo de irmãos decidiu criar um Ponto Missionário no centro de Caruaru. Surgiu assim a
    Missão Videira Verdadeira.
- source: d2s31-reconc
  quote: >-
    Em Junho de 2003, as duas Paróquias de Caruaru (Videira Verdadeira e Reconciliação) se juntaram e formaram uma
    única Paróquia, e foi escolhido pelos membros a permanência do nome Paróquia Anglicana da Reconciliação.
- source: dard1-carta-caluniadores-2002
  quote: Rev. Edmar Carvalho Pimentel - Presidente do Conselho Diocesano
- source: d2s31-sec
