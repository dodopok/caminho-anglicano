id: fernando-acosta-rodriguez
name: Fernando Acosta Rodriguez
biography: >-
  Ordenado diácono em 17/06/2000 por Robinson Cavalcanti, na Paróquia do Espírito Santo. Foi ministro encarregado
  do Ponto Missionário Anglicano Jesus de Nazaré (Gaibu, Cabo de Santo Agostinho-PE) e aparece, em 2003-2004, como
  presbítero da Paróquia Anglicana do Espírito Santo e desse ponto missionário, na Diocese Anglicana do Recife.
  Em 23/08/2005 foi excluído da comunhão da IEAB e das ordens sagradas, com outros clérigos que declararam, por
  carta, manter plena comunhão com o bispo diocesano Robinson Cavalcanti. Consta como clérigo da Diocese Anglicana
  do Recife desde 2005, com o título de cônego (2006-2007), e integrou a Comissão de Arquitetura e Arte (2009-2010).
