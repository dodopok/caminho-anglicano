id: fernando-acosta-rodriguez
name: Fernando Acosta Rodriguez
biography: >-
  Fernando Acosta Rodriguez foi ordenado diácono em 17/6/2000 por Robinson Cavalcanti, na Paróquia do Espírito Santo.
  Em 2003 e 2004 era presbítero, ministro encarregado do Ponto Missionário Anglicano Jesus de Nazaré (Gaibu, Cabo
  de Santo Agostinho, PE) e auxiliar da Paróquia Anglicana do Espírito Santo, na Diocese Anglicana do Recife. Em
  23/8/2005 foi incluído entre os clérigos excluídos da comunhão da IEAB, que declararam por carta manter plena
  comunhão com o bispo diocesano Robinson Cavalcanti. Em 2006 e 2007 aparece com o título de cônego e, entre 2009
  e 2011, como membro da Comissão de Arquitetura e Arte da diocese.
