  quote: Orar pela Paróquia Anglicana Jesus de Nazaré (Gaibu-PE); pela vida e saúde do Rev. Fernando Acosta
- source: drp-calendario-2007
  quote: Rev. Côn. Fernando A. Rodriguez
ordinations:
- order: diaconate
  date: '2000-06-17'
  place: Paróquia do Espírito Santo (Recife)
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
