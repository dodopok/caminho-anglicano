# yaml-language-server: $schema=../../schemas/person.json
id: vera-lucia-nascimento
name: Vera Lúcia Nascimento
full_name: Vera Lúcia Melo do Nascimento
aliases:
- Revda. Vera Nascimento
- Vera Lúcia Melo do Nascimento
biography: >-
  Presbítera ordenada em 2003 na Paróquia Anglicana Emanuel (Olinda), ainda na IEAB; seguiu com a Diocese do Recife
  e em 2019 era coadjutora da Igreja Anglicana Emanuel (IAB).
sources:
- source: ieabrecife-noticias-2003-08
  quote: a Ordenação ao Presbiterado da Revda. Vera Nascimento
- source: dr-igrejas-2019
  quote: 'Coadjutora: Revda. Vera Nascimento'
ordinations:
- order: presbyterate
  date: '2003-08-09'
  place: Paróquia Anglicana Emanuel (Olinda-PE)
  jurisdiction: ieab
  status: probable
  sources:
  - source: ieabrecife-noticias-2003-08
    quote: >-
      Será no sábado, dia 09/08, às 18h, na Paróquia Anglicana Emanuel, a Ordenação ao Presbiterado da Revda. Vera
      Nascimento.
  notes: >-
    Notícia antecipada (evento anunciado). Ordenante não informado (bispo diocesano: Robinson Cavalcanti; sufragâneo:
    Filadelfo Oliveira). Ordenação de mulher na Diocese do Recife antes do cisma.
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Revda. Vera Lúcia Melo do Nascimento
  - source: drv-nota-esclarecimento-2006
    quote: Vera Lúcia M. do Nascimento
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Vera Lúcia Melo do Nascimento … Os clérigos não atenderam
      à convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: iab
  role: clergy
  diocese: iab-diocese-recife
  start: '2019'
  status: confirmed
  sources:
  - source: dr-igrejas-2019
    quote: 'Coadjutora: Revda. Vera Nascimento'
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Revda. Vera Lúcia Melo do Nascimento … Recife, 23 de agosto de
      2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado. Identificada com 'Vera Lúcia
    Nascimento' da base pela semelhança do nome, sem confirmação.
