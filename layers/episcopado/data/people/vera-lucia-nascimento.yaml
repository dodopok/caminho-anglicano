id: vera-lucia-nascimento
name: Vera Lúcia Nascimento
full_name: Vera Lúcia Melo do Nascimento
aliases:
- Revda. Vera Nascimento
- Vera Lúcia Melo do Nascimento
biography: >-
  Ordenada diácona em 13/07/2002 por Robinson Cavalcanti, na Missão Jardim das Oliveiras, foi ordenada presbítera
  em 09/08/2003, na Paróquia Anglicana Emanuel (Olinda), ainda na IEAB. Em 23/08/2005 foi incluída entre os clérigos
  excluídos da Comunhão da IEAB, que declararam manter plena comunhão com Robinson Cavalcanti, e continuou na Diocese
  Anglicana do Recife (DAR). Na DAR, em 2010 era reitora da Paróquia Anglicana Emanuel, constou como diretora do
  Instituto Anglicano de Teologia (campus Olinda), em 2011 era coordenadora do IAT Olinda e, em 2009, integrava
  a junta de capelães examinadores. Em 2019 era coadjutora da Igreja Anglicana Emanuel, na Diocese do Recife (IAB).
