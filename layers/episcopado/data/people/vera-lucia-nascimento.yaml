  - source: d2s21-cursilho-masc
    quote: Além dos Reverendos João Peixoto (Arcediago) e Vera Nascimento ( Paróquia Emanuel )
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Local: Paróquia Anglicana Emanuel. Clérigo citado como
    pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão). Anexo R:
    o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti,
    ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005 é a da exclusão
    pela IEAB, e a adesão à DAR é anterior, sem data exata. Local: Paróquia Anglicana Emanuel. A matéria de 30/11/2010
    indica "Revda. Vera Nascimento" entre parênteses como responsável pela Paróquia Emanuel, sem o título de pároca;
    em mai/2010 aparece entre os reverendos do Arcediagado Norte. Local: Paróquia Anglicana Emanuel (Olinda-PE).
    Em 21/11/2010 aparece vinculada à Paróquia Emanuel.
