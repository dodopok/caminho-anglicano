id: vera-lucia-nascimento
name: Vera Lúcia Nascimento
full_name: Vera Lúcia Melo do Nascimento
aliases:
- Revda. Vera Nascimento
- Vera Lúcia Melo do Nascimento
biography: >-
  Ordenada diácona em 13/07/2002 por Robinson Cavalcanti e presbítera em 09/08/2003, na Paróquia Anglicana Emanuel
  (Olinda), ainda na IEAB, foi reitora dessa paróquia na Diocese Anglicana do Recife e integrou a junta de capelães
  examinadores. Em 23/08/2005 foi excluída da IEAB com outros clérigos, que declararam manter comunhão com Robinson
  Cavalcanti, e continuou na Diocese do Recife; em 2019 era coadjutora da Igreja Anglicana Emanuel (IAB).
