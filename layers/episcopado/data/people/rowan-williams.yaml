biography: >-
  Como arcebispo de Cantuária, foi destinatário em 2005 de cartas da Diocese Anglicana do Recife (27/06/2005, pedindo
  a revogação da deposição de Robinson Cavalcanti) e da Câmara dos Bispos da IEAB (14/11/2005), que apresentou a
  versão oposta.
