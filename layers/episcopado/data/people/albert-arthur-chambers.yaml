id: albert-arthur-chambers
name: Albert Arthur Chambers
aliases:
- Albert Chambers
- Chambres
biography: >-
  Bispo emérito da Diocese Episcopal de Springfield (TEC) e principal liderança do Movimento Contínuo. Em 28 de
  janeiro de 1978, já aposentado, foi sagrante principal de quatro bispos da Anglican Church in North America, com
  o consentimento in absentia de Mark Pae, da Igreja Anglicana da Coreia.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    A principal liderança do Movimento Contínuo foi o bispo emérito da Diocese Episcopal de Springfield, Albert
    Arthur Chambers.
  page: '70'
- source: cant-novas-igrejas-2024
  quote: o bispo emérito da Diocese Episcopal de Springfield, Albert Arthur Chambers.
  page: '70'
- source: ia-gc-journal-1979
  quote: >-
    On January 28, 1978, he was the chief consecrator of four bishops for the Anglican Church in North America.
- source: cant-novas-igrejas-2024
  quote: >-
    Mark Pae, que, embora não pôde participar presencialmente das sagrações, deu o seu consentimento para os atos
    litúrgicos in absentia.
  page: '71'
