biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Livramento
  (Santana do Livramento), RS, Brasil (1939-09-21). Ordenado diácono em dez/1961 e presbítero em set/1963. Transferido
  para a Igreja Episcopal do Brasil em 25/04/1965 (Clerical Directory 1968).
