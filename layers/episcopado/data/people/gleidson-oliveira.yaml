id: gleidson-oliveira
name: Gleidson Oliveira
aliases:
- Dom Gleydson
- Dom Gleydson Oliveira
- Gleydson
- Gleydson Oliveira
- bispo Gleydson
- dom Gleydson
biography: >-
  Gleydson Oliveira foi sagrado em 10 de abril de 2017 bispo diocesano de Pernambuco da Igreja Episcopal do Brasil,
  fundada por Rosimael Losasi, com a qual rompeu em 2019 ao fundar a Igreja Episcopal Sul Americana. Em 2022, após
  contato com a Igreja Anglicana Reformada do Brasil, passou a participar de celebrações com o primaz da IARB, Diógenes
  Monteiro, e consta como bispo missionário da IARB.
sources:
- source: lpq-yt-iebr
  quote: Sagração de Dom Gleydson na Diocese de Pernambuco da Igreja Episcopal do Brasil
- source: cant-novas-igrejas-2024
  quote: >-
    Em 10 de abril de 2017, com a participação de outros cinco bispos, Gleydson foi sagrado como Bispo Diocesano
    para o Estado de Pernambuco, com cerimônia realizada em uma das salas do Convento de Nossa Senhora da Conceição,
    em Olinda.
  page: '165'
- source: cant-novas-igrejas-2024
  quote: Em 2019, o mesmo rompeu com o bispo Rosimael Losasi, fundador da Igreja Episcopal do Brasil.
  page: '169'
- source: cant-novas-igrejas-2024
  quote: >-
    A origem da Igreja Episcopal Sul Americana está na figura do então bispo Igreja Episcopal do Brasil, Gleydson
    Oliveira. Em 2019, o mesmo rompeu com o bispo Rosimael Losasi, fundador da Igreja Episcopal do Brasil.
  page: '169'
- source: cant-novas-igrejas-2024
  quote: >-
    A atuação do bispo Gleydson na região o levou a entrar em contato com a Igreja Anglicana Reformada do Brasil.
  page: '169'
- source: cant-novas-igrejas-2024
  quote: >-
    perceber a presença de Gleydson participando de celebrações junto com o bispo e primaz da IARB, dom Diógenes
    Monteiro, na sede da Igreja em Santa Cruz do Capibaribe.
  page: '169'
- source: ptwiki-iarb
  quote: Gleidson Oliveira - Bispo missionário.
