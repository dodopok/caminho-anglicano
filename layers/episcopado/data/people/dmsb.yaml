# yaml-language-server: $schema=../../schemas/person.json
id: dmsb
name: DMSB
events:
- type: other
  date: '1893'
  description: >-
    Visita do bispo George W. Peterkin (Virgínia Ocidental) em 1893, enviado pelo Bispo Presidente: 142 confirmações,
    ordenação dos quatro primeiros diáconos brasileiros, nomeação de comissões e designações das capelas.
  status: confirmed
  sources:
  - source: wit-1952-03-20
    quote: >-
      the visit of Bishop Peterkin in 1893 when almost one hun- dred and fifty persons were confirmed and four Brazilians
      were ordained to the diaconate.
  - source: calvani-2005
    quote: Em 1893 foram ordenados os quatro primeiros diáconos brasileiros.
  - source: som-1893-11
    quote: >-
      The Presiding Bishop has sent one of our number, the Bishop of West Virginia, to visit the missions of this
      Church in the Republic of Brazil
  - source: wp-pt-ieab
    quote: >-
      No mesmo ano, a comunidade recebeu o bispo norte-americano George William Peterkin, que ordenou quatro diáconos.
- type: deposition
  date: '1897'
  description: >-
    Visita do bispo Waite H. Stirling (Falkland Islands) em 1897: ordenação dos três primeiros presbíteros brasileiros
    (um quarto diácono havia sido deposto por Peterkin).
  status: probable
  sources:
  - source: wp-en-kinsolving
    quote: >-
      Bishop Stirling ordained three of the Brazilian deacons to the priesthood (Peterkin having deposed the fourth).
  - source: wp-pt-ieab
    quote: >-
      foi a vez da comunidade receber Waite Hockin Stirling, bispo das Ilhas Falkland, que ordenou os três primeiros
      presbíteros nacionais
- type: other
  date: '1892-05-23'
  description: >-
    Primeira convocação (não autorizada) da missão, Casa da Missão, Porto Alegre, 23-26/05/1892: presentes os revs.
    Morris, Brown, Meem e Kinsolving e os catequistas Boaventura, Brande e Cabral.
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Presentes: reverendos Morris, Brown, Meem e Kinsolving, e catequistas Boaventura, Brande e Cabral. Presidida
      por Kinsolving e secretariada por Cabral.
- type: other
  date: '1898-05-31'
  description: >-
    Convocação extraordinária de 31/05/1898 elege Kinsolving bispo (eleição brasileira como indicação, validada
    pela igreja americana).
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Assunto: eleição de Kinsolving. A eleição dos brasileiros era apenas um indicação. Kinsolving foi oficialmente
      eleito pela igreja americana.
- type: other
  date: '1936'
  description: Destituição do Rev. Salomão Ferraz (1936) após a 'controvérsia cerimonialista'.
  status: probable
  sources:
  - source: kickhofel
    quote: provocando uma crise que culminou na sua destituição em 1936.
- type: other
  date: '1907'
  description: >-
    Pedido do concílio de Bagé (1907) para integrar a missão à igreja americana; criação do distrito missionário
    vinculado à Convenção Geral.
  status: probable
  sources:
  - source: kickhofel
    quote: O Departamento de Missão cria o distrito missionário vinculado a Convenção Geral.
  - source: kickhofel
    quote: >-
      Isso foi feito por um pedido, enviado em 1907, pela igreja brasileira, por decisão de um concílio realizado
      em Bagé.
- type: other
  date: '1907'
  description: Criação do Distrito Missionário (do Sul) do Brasil pela Convenção Geral de 1907.
  status: probable
  sources:
  - source: wp-en-ieab
    quote: >-
      In 1907, the missionary efforts resulted in the creation of the Missionary District of Brazil within the Episcopal
      Church.
  - source: calvani-2005
    quote: >-
      Em 1907, as comunidades passaram a ser um “distrito missionário” da Igreja Protestante Episcopal dos EUA
- type: other
  date: 1940-04
  description: >-
    Cinquentenário da Igreja Episcopal Brasileira celebrado em Porto Alegre (abril de 1940), com ordenações, dedicação
    do novo prédio do Seminário Teológico e sagração de Pithan.
  status: probable
  sources:
  - source: wit-1940-04-18
    quote: Celebration of the 50th anniversary of the founding of Brazilian Episco­ pal Church began April 15
- type: other
  date: '1946'
  description: Primeira divisão do distrito em 1946 (segundo ENS).
  status: probable
  sources:
  - source: ens-xxvi-24
    quote: >-
      By the middle of the next decade the need for a division of this district was evident and in 1946 it was cut
      in two.
- type: other
  date: '1949'
  description: >-
    Convenção Geral de 1949 (San Francisco) divide o Sul do Brasil em três distritos; Krischke eleito para o terceiro
    bispo; Pithan eleito bispo de um dos novos distritos.
  status: confirmed
  sources:
  - source: wit-1949-10-27
    quote: >-
      it was decided to divide the district of South- ern Brazil into three dioceses. In Brazil at present there
      are two bishops, one diocesan and a coadjutor. Election of the Rev. E. M. Krische as the third bish­ op will
      place the Brazilian Church on an independent basis, able to consecrate its own bish­ ops
  - source: wit-1949-10-20
    quote: >-
      The missionary district of Southern Brazil, having been di­ vided by General Convention in­ to three parts,
      will have the Rev. Egmont M. Krischke as the
