id: coa
name: COA
events:
- type: other
  date: 1965-05
  description: Início efetivo da província autônoma (maio de 1965).
  status: probable
  sources:
  - source: ens-41-5
    quote: >-
      The Episcopal Church in Brazil is the newest province in the Anglican Communion, having come into existence
      only last May.
- type: other
  date: '2018-05-18'
  description: >-
    Secretário-geral do Conselho Consultivo Anglicano, Josiah Idowu-Fearon, declara ao Church Times (18/05/2018)
    que a IAB não faz parte da Comunhão Anglicana por não estar em comunhão com a Sé de Cantuária; o secretário-geral
    do GAFCON, Peter Jensen, responde defendendo o reconhecimento.
  status: confirmed
  sources:
  - source: gafcon-2018-jensen-acb-ac
    quote: >-
      In the London Church Times (18th May 2018), Bishop Josiah Idowu-Fearon, the Secretary General of the Anglican
      Consultative Council claimed that Gafcon had been ‘inaccurate’ in describing the newly formed Anglican Church
      in Brazil as part of the Anglican Communion
  - source: christiantoday-2018-05-14
    quote: >-
      However there are officially still 39 provinces because neither the ACNA or the Anglican Church in Brazil
      are recognised.
