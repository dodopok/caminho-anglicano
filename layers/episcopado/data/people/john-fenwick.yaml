biography: Bispo Primaz da Free Church of England; supervisionou as congregações da IARB a partir de 2014.
sources:
- source: christiantoday-2014-fce
  quote: The Right Reverend John Fenwick, the Bishop Primus of the Free Church of England
affiliations:
- jurisdiction: fce
  role: primate
  start: '2014'
  status: confirmed
  sources:
  - source: ai-2014-fce-brazil
