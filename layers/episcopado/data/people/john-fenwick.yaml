# yaml-language-server: $schema=../../schemas/person.json
id: john-fenwick
name: John Fenwick
full_name: John Fenwick
aliases:
- Bishop Primus John Fenwick
- John Robert Kipling Fenwick
biography: Bispo Primaz da Free Church of England; supervisionou as congregações da IARB a partir de 2014.
sources:
- source: christiantoday-2014-fce
  quote: The Right Reverend John Fenwick, the Bishop Primus of the Free Church of England
ordinations:
- order: episcopate
  date: '2006-07-29'
  place: Christ Church, Liscard (Inglaterra)
  jurisdiction: fce
  office: diocesan
  principal_consecrator: john-daly-morton-mclean
  co_consecrators:
  - cyril-mar-basilios
  - john-mcowat
  - joseph-mar-koorilose
  - kenneth-john-wesley-powell
  - paul-nigel-hunt
  - ray-sutton
  - roy-u-grote-jr
  status: confirmed
  sources:
  - source: lin-fce-lista
    quote: >-
      42. JOHN ROBERT KIPLING FENWICK BSc BA MTh STh PhD was consecrated by Bishops McLean, Powell and Hunt, and
      by the same Bishops and Presbyters, at the same time and in the same place as Bishop Hunt on 29 July 2006.
  - source: lin-fce-lista
    quote: >-
      41. PAUL NIGEL HUNT BSc MSc DD was consecrated by Bishops Powell and McLean, the Right Rev’d Roy Grote and
      the Right Rev’d Ray Sutton of the Reformed Episcopal Church of America; the Most Rev’d Cyril Mar Basilios
      and the Most Rev’d Joseph Mar Koorilose of the Malabar Independent Syrian Church; and the Right Rev’d John
      McOwat of the Moravian Church; assisted by the Very Rev’d Yonan Yonan of the Church of the East, the Very
      Rev’d Richard Fenwick of the Church in Wales, the Very Rev’d Chorepiscopa Peter Hawkins of the Roman Catholic
      Church, the Rev’d Gerald Kirsch of the Countess of Huntingdon’s Connexion, and several Presbyters, at Christ
      Church, Liscard, on 29 July 2006.
  - source: lin-wp-en-fenwick
    quote: >-
      Consecrated by John McLean ( Free Church of England ), Kenneth Powell (FCofE), Paul Hunt (FCofE), Royal Grote
      ( Reformed Episcopal Church ), Ray Sutton (REC), Cyril Mar Basilios ( Malabar Independent Syrian Church ),
      Joseph Mar Koorilose (MISC), and John McOwat ( Moravian Church ) Date 29 July 2006 Place Christ Church, Liscard
  notes: >-
    A lista oficial da FCE diz que Fenwick foi sagrado "by Bishops McLean, Powell and Hunt", na mesma cerimônia
    (mesmos bispos e presbíteros) em que Paul Nigel Hunt (nº 41), que teve também Grote, Sutton, os bispos sírios
    de Malabar e McOwat (Moraviana). A lista não distingue o sagrante principal; McLean é o primeiro citado aqui
    e na Wikipédia EN, e foi o escolhido para subir a cadeia (Powell, bispo Primus à época, é o primeiro citado
    na sagração de Hunt).
affiliations:
- jurisdiction: fce
  role: primate
  start: '2014'
  status: confirmed
  sources:
  - source: ai-2014-fce-brazil
    quote: >-
      In the meantime, the local congregations of the IARB are under the oversight of the Bishop Primus, in accordance
      with the existing Canons.
events:
- type: other
  date: '2021-05-05'
  description: >-
    Sínodo extraordinário da Diocese da América do Sul da FCE (IARB) aprova por unanimidade deixar a Free Church
    of England
  status: confirmed
  sources:
  - source: ai-2021-fce-withdraw
    quote: >-
      the Synod of the Diocese of South America unanimously approved a motion and resolution to leave the Free Church
      of England.
- type: resignation
  date: '2021-04-14'
  description: >-
    Em abril de 2021, o Anglican Ink revela uma carta de fevereiro de 2021, assinada por 15 clérigos e churchwardens
    da Free Church of England (inclusive Josep Rosselló, bispo da Diocese da América do Sul), que pede ao Primus
    John Fenwick que renuncie; a notícia informa que o Sínodo sul-americano da FCE (Brasil e Venezuela) havia votado,
    na semana anterior, romper os vínculos com Fenwick.
  status: probable
  sources:
  - source: rtb-ai-petition-fce
    quote: >-
      The Bishop of the FCE Diocese in South America, Josep Rossello, was among the signatories. AI reported last
      week that the FCE South American Synod, representing growing churches in Brazil and Venezuela, voted to break
      links with Bishop Fenwick.
  - source: rtb-ai-petition-fce
    quote: >-
      A group of clergy and churchwardens in the Free Church of England has urged their Primus, John Fenwick, to
      step down this month.
