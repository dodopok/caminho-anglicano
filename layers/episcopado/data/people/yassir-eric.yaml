# yaml-language-server: $schema=../../schemas/person.json
id: yassir-eric
name: Yassir Eric
aliases:
- Yasser Eric
biography: >-
  Bispo presidente da EKKIOS, província em formação para convertidos do islamismo, comissionado em 2023 pelo Gafcon
  Primates Council e sagrado em 2024; é conselheiro do Global Anglican Council desde março de 2026.
sources:
- source: gacm-ai-2026-03-04-primus
  quote: >-
    Dr Yassir Eric, who was commissioned by the Gafcon Primates Council in 2023 and consecrated in 2024 to lead
    a non-geographic diocese
- source: gace-gac-page
  quote: Presiding Bishop of EKKIOS, a new Province in formation for MBB’s.
- source: gace-gac-page
  quote: >-
    The Rt Revd Dr Yassir Eric Presiding Bishop of EKKIOS Presiding Bishop of EKKIOS, a new Province in formation
    for MBB’s.
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Its regional advisers all lead “extra-provincial or missionary districts connected to the GAFCON movement.”
    They are Archbishop Kanishka Raffel of Sydney (a diocesan bishop in the Anglican Church of Australia), and Bishops
    Andy Lines of the Anglican Network in Europe, Jay Behan of the Church of Confessing Anglicans in Aotearoa New
    Zealand, Glenn Davies of the Diocese of the Southern Cross (which serves parishes that have broken away from
    the Anglican Church of Australia), and Yassir Eric of EKKIOS, a missionary movement forming congregations in
    predominantly Muslim regions.
