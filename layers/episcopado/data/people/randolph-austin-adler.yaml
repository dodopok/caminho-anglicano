biography: >-
  Randolph Austin Adler foi sagrado em 26/06/1992 primeiro bispo e primaz da Igreja Episcopal Carismática, tendo
  Timothy Michael Barker como sagrante principal, e em 1997 foi instituído seu primeiro patriarca. No mesmo ano
  a igreja determinou a reordenação de todos os seus clérigos por acordo com bispos da Igreja Católica Apostólica
  Brasileira (ICAB), que estabeleceu nova linha de sucessão (reconsagração de Adler em 05/11/1997, por Luiz Fernando
  Castillo Mendez); o acordo logo foi rompido pela ICCEC. Aposentou-se em outubro de 2007, quando a liderança passou
  a Craig W. Bates, e morreu em 09/12/2016. Participou de três sagrações episcopais, entre elas as de Paulo Garcia
  (2003) e Frederico Carneiro Rêgo Bastos (2007).
