id: randolph-austin-adler
name: Randolph Austin Adler
full_name: Randolph Austin Adler
aliases:
- Austin Randolph Adler
- Patriarca Randolph Adler
- Randolph Adler
- Randy Adler
wikidata: Q4823251
biography: >-
  Sagrado em 26/06/1992 como primeiro bispo e primaz da Igreja Episcopal Carismática, por Timothy Michael Barker,
  foi instituído em 1997 seu primeiro patriarca; no mesmo ano a igreja determinou a reordenação de seus clérigos
  por acordo com bispos da ICAB. Aposentou-se em 2007, quando a liderança passou a Craig W. Bates, e foi o sagrante
  principal de Paulo Garcia (2003).
sources:
- source: ptwiki-iecb
  quote: o qual foi sagrado o seu primeiro Bispo, pelo então Patriarca Randolph Austin Adler
- source: enwiki-iccec-bispos
  quote: On 26 June 1992, Austin Randolph Adler was consecrated the first bishop and primate of the CEC
- source: enwiki-iccec-bispos
  quote: >-
    On 26 June 1992, Austin Randolph Adler was consecrated the first bishop and primate of the CEC with Timothy
    Michael Barker of the International Free Catholic Communion (who was consecrated by Archbishop-Patriarch Herman
    Adrian Spruit) functioning as the principal consecrator.
- source: cant-novas-igrejas-2024
  quote: instituindo, em 1997, Adler como o seu primeiro Patriarca.
  page: '44'
- source: cant-novas-igrejas-2024
  quote: >-
    a Comunhão Episcopal Carismática determinou a reordenação de todos os seus clérigos, através de um acordo bilateral
    com os bispos da Igreja Católica Apostólica Brasileira, estabelecendo uma nova linha de sucessão apostólica
    a partir da ICAB
  page: '44'
- source: enwiki-iccec-bispos
  quote: >-
    In 1997, the Charismatic Episcopal Church sought and acquired reconsecration and reordination of all of its
    clergy by the Brazilian Catholic Apostolic Church, thus strengthening their lines of apostolic succession.
- source: costa2021
  quote: >-
    Com a aposentadoria de Adler, em 2007, a liderança da Comunhão Internacional da Igreja Episcopal Carismática
    passou para as mãos do bispo Craig W. Bates
