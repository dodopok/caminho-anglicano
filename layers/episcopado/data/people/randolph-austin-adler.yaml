biography: >-
  Primeiro bispo e primaz da Charismatic Episcopal Church (sagrado 26/6/1992), patriarca da ICCEC (1996-2007); sagrante
  principal de Paulo Garcia (2003) e de Ximenes e Bastos (2007). Aposentou-se em out/2007 e morreu em dez/2016 (segundo
  a Wikipédia).
