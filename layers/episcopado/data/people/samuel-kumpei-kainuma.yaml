biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em 1915-04-24.
  Ordenado diácono em fev/1947 e presbítero em abr/1948. Transferido para a Igreja Episcopal do Brasil em 25/04/1965
  (Clerical Directory 1968).
