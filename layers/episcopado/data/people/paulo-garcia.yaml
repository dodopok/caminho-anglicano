    presbiterato por ser o início do "pastorado" contado a partir de 1970, mas pode tratar-se do diaconato. Ordenante
    não informado. Formado no Seminário Teológico Anglicano de São Paulo. Data inferida do jubileu de 50 anos de
    "sacerdócio" celebrado em 28/02/2025 (artigo de opinião); a fonte não dá a data da ordenação. Diverge do "Ordenado
