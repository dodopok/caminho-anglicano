biography: >-
  Paulo Ruiz Garcia nasceu em 1939 em Presidente Prudente (SP), de origem presbiteriana, e é bacharel em Teologia,
  Direito e Filosofia. Foi ordenado diácono e presbítero da IEAB em 1970, pelo bispo Edmund Knox Sherrill, e serviu
  em paróquias de São Paulo e do Rio de Janeiro. Em março de 1975, a pedido de Sherrill, assumiu a Paróquia da Santíssima
  Trindade, no Recife, que se tornou catedral da Diocese Anglicana do Recife, da qual foi o primeiro deão. Entre
  1981 e 1982 residiu nos Estados Unidos, na St. Paul's Episcopal Church, em Darien (Connecticut). Foi candidato
  ao episcopado sem ser eleito: em 1984, na Diocese Setentrional (Recife), onde foi eleito Clóvis Erly Rodrigues
  (uma fonte data o episódio em 1985), e na Diocese Central (Rio de Janeiro); em 1989, em Brasília; e em 2000, no
  Rio de Janeiro. Em setembro de 2002 rompeu com a IEAB e a Comunhão Anglicana, levando a comunidade e o templo
  da catedral, outras comunidades e clérigos como Célio Spineli, Edgar Ferreira e Frederico Bastos. A comunidade
  alegou divergências com o bispo diocesano Robinson Cavalcanti, e lideranças anglicanas classificaram esses argumentos
  como pretexto. Filiou-se à Comunhão Internacional da Igreja Episcopal Carismática (ICCEC) e fundou no Recife a
  Igreja Episcopal Carismática do Brasil (IECB). Foi sagrado seu primeiro bispo em 8 de setembro de 2003 pelo patriarca
  Randolph Austin Adler e reconhecido como arcebispo e primaz da IECB em 2007. Em 2013 integrava o Conselho do Patriarca
  da ICCEC; em 24 de março de 2019 a IECB separou-se dessa comunhão e, em 14 de setembro do mesmo ano, ele foi instituído
  arcebispo do Recife e primaz da Comunhão Episcopal Internacional (CEI). Participou de seis ordenações de diáconos
  ou presbíteros e de nove sagrações episcopais, em três delas como sagrante principal, entre elas a de Roberto
  José Schuler, em 2012. Em 2024 anunciou o bispo Frederico Bastos como sucessor na primazia e, em 28 de fevereiro
  de 2025, celebrou o jubileu de ouro de ministério.
