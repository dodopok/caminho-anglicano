    quote: >-
      Após uma longa e tradicional cerimônia com vários pastores que vieram dos Estados Unidos exclusivamente para
      este fim
    page: '54'
  - source: darl3-primazes-2003
    quote: >-
      O ex-Deão e seus seguidores se juntaram à chamada “Igreja Episcopal Carismática”, com sede em San Clemente,
      Califórnia, USA. Ele será sagrado bispo no dia 08 de setembro de 2003.
  - source: d2s23-carta-primazes-2003
    quote: Ele será sagrado bispo no dia 08 de setembro de 2003.
  notes: >-
    Sucessão declarada: ICCEC (Randolph Adler). A própria Wikipédia diz 'Recife' e 'Teatro Guararapes, em Olinda'
    em trechos diferentes (o Centro de Convenções/Teatro Guararapes fica em Olinda). Co-sagrantes não informados.
    Fonte primária citada: GARCIA, Paulo Ruiz. Cerimonial Eclesiástico e Liturgia de Sagração. Recife: Comunigraf,
    2004. A lista de bispos da ICCEC (Wikipédia EN) dá como sagrantes os nº 1 (Austin Randolph Adler), 4 (Dale F.
    Howard, Abp. Southeast Province) e 6 (Loren Thomas Hines, Primate Asia), e anota 'Resigned' (deixou a ICCEC;
    data não informada). Status 'confirmado' pela concordância de duas fontes terciárias independentes quanto a
    data e sagrante principal. Costa (2021, nota 192, p. 200-201) lista 12 bispos sagrantes, com Adler à frente;
    a lista ICCEC da Wikipédia dá só três (Adler, Howard, Hines). Sagrantes não nomeados; a fonte diz apenas que
    houve "vários pastores que vieram dos Estados Unidos, exclusivamente para este fim". Testemunho ocular da autora.
    Autodescrição da Catedral da Trindade (Espinheiro, Recife); a página também diz que Garcia chegou à paróquia
    em 1975 e lista como bispos da IECB: arcebispo Paulo Garcia, bispo Roberto Schuler e bispo Alexandre Ximenes
    (auxiliares). Primeiro bispo brasileiro da Igreja Episcopal Carismática (ICCEC). Sagrantes não nomeados; o livro
    menciona apenas 'ministros estrangeiros' / pastores vindos dos EUA. Primeiro bispo da Igreja Episcopal Carismática
    do Brasil (ICCEC). A tese lista 12 'bispos sagrantes' sem dizer quem foi o principal; Adler aparece primeiro
    como 'Patriarca e Primaz' (atribuição do principal é inferência). Trecho da sagração citado de QUEIROZ, 2017,
    p. 167. 'Antônio Raposo' identificado com 'Antônio José da Costa Raposo' da base (ver dúvidas). Fato anunciado:
    a carta de 23/05/2003 diz que o ex-deão (não nomeado na carta; identificado como Paulo Garcia pelos demais textos
    do site) "será sagrado bispo no dia 08 de setembro de 2003" pela Igreja Episcopal Carismática (sede em San Clemente,
    Califórnia). A data é a anunciada na carta, anterior ao evento. Fato futuro em relação à carta (23/05/2003):
    o bispo diocesano anuncia a sagração do ex-deão, na Igreja Episcopal Carismática, para 08/09/2003; a carta não
    indica local nem sagrante.
