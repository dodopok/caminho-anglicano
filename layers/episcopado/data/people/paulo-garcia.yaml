      A consagração episcopal de Paulo Garcia ocorreu em 8 de setembro de 2003, no Teatro Guararapes, em Olinda.
  - source: enwiki-iccec-bispos
    quote: '|42||8 September 2003||1 4 6||Paulo Ruiz Garcia||Abp. and Primate Brazil|| Resigned'
  - source: costa2021
    quote: >-
      Os bispos sagrantes foram os seguintes: Austin Randolph Adler (Patriarca e Primaz), Douglas Kessler, Randolph
      Sly, Dale Franklin Howard, Loren Thomas Hines, Kenneth Myers, Craig Bates, Elmer Belmont, John Holloway, Michael
      Davidson, Frank Constantino e Antônio Raposo.
  - source: costa2021
    quote: >-
      O evento aconteceu no dia 08 de setembro de 2003, às 20h, no Teatro Guararapes, Centro de Convenções – Olinda.
  - source: queiroz-2004-ufpe
    quote: >-
      O evento aconteceu no dia 08 de setembro de 2003, às 20h no Teatro Guararapes, Centro de Convenções – Olinda.
  - source: queiroz-2004-ufpe
    quote: >-
      a vinculação do Pr. Paulo à Igreja Episcopal Carismática, na qual ele foi sagrado o primeiro Bispo do Brasil.
  - source: cant-novas-igrejas-2024
    quote: >-
      O evento aconteceu no dia 08 de setembro de 2003, às 20h, no Teatro Guararapes, Centro de Convenções – Olinda.
    page: '54'
  - source: cant-novas-igrejas-2024
    quote: >-
      Após uma longa e tradicional cerimônia com vários pastores que vieram dos Estados Unidos exclusivamente para
      este fim
    page: '54'
  notes: >-
    Sucessão declarada: ICCEC (Randolph Adler). A própria Wikipédia diz 'Recife' e 'Teatro Guararapes, em Olinda'
    em trechos diferentes (o Centro de Convenções/Teatro Guararapes fica em Olinda). Co-sagrantes não informados.
    Fonte primária citada: GARCIA, Paulo Ruiz. Cerimonial Eclesiástico e Liturgia de Sagração. Recife: Comunigraf,
    2004. A lista de bispos da ICCEC (Wikipédia EN) dá como sagrantes os nº 1 (Austin Randolph Adler), 4 (Dale F.
    Howard, Abp. Southeast Province) e 6 (Loren Thomas Hines, Primate Asia), e anota 'Resigned' (deixou a ICCEC;
    data não informada). Status 'confirmado' pela concordância de duas fontes terciárias independentes quanto a
    data e sagrante principal. Costa (2021, nota 192, p. 200-201) lista 12 bispos sagrantes, com Adler à frente;
    a lista ICCEC da Wikipédia dá só três (Adler, Howard, Hines). Sagrantes não nomeados; a fonte diz apenas que
    houve "vários pastores que vieram dos Estados Unidos, exclusivamente para este fim". Testemunho ocular da autora.
    Primeiro bispo brasileiro da Igreja Episcopal Carismática (ICCEC). Sagrantes não nomeados; o livro menciona
    apenas 'ministros estrangeiros' / pastores vindos dos EUA. Primeiro bispo da Igreja Episcopal Carismática do
    Brasil (ICCEC). A tese lista 12 'bispos sagrantes' sem dizer quem foi o principal; Adler aparece primeiro como
    'Patriarca e Primaz' (atribuição do principal é inferência). Trecho da sagração citado de QUEIROZ, 2017, p.
    167. 'Antônio Raposo' identificado com 'Antônio José da Costa Raposo' da base (ver dúvidas).
