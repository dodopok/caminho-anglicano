    page: '197'
  notes: >-
    Reitor da Catedral (Santíssima Trindade, Recife) em 1996, sob o bispo Clóvis Erly Rodrigues. Complementa o vínculo
    1975–2002. Antes de Recife serviu em São Paulo (Paróquia Cristo Salvador, ABC) e no Rio de Janeiro (Morro Dona
    Marta, São Lucas-Botafogo, Redentor-Tijuca, Cristo Rei-Cidade de Deus). Liderou a Catedral da Santíssima Trindade
    (Espinheiro), da qual é chamado "Deão". Reitor/deão da Igreja/Catedral da Trindade, Recife, desde março de 1975.
    Reitor da Paróquia da Santíssima Trindade, Recife. O livro grafa "Paulo Luiz Garcia" aqui e "Paulo Ruiz Garcia"
    nas pp. 278 e 300. Local: deão da Catedral da Santíssima Trindade. Antes, clérigo da IEAB no Rio de Janeiro
    na década de 1970 (p. 55). Anexo G: clérigo participante do primeiro concílio da Diocese Setentrional (Recife,
    25-27/06/1976), ligado à Paróquia da Santíssima Trindade, Recife (PE). Datas de início e fim do vínculo não
    informadas; o vínculo está apenas atestado em junho de 1976. Ordenado na Igreja Episcopal do Brasil em 1970
    (ordem não especificada; vinha da Igreja Presbiteriana). Reitor da Paróquia/Catedral da SS. Trindade (Recife)
    desde março de 1975 e deão. Levou o templo da Rua Carneiro Vilela e quase todos os membros para a Igreja Episcopal
    Carismática.
