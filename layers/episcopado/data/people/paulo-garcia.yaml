  date: '2003-04-20'
  description: >-
    Em 20/04/2003, o bispo diocesano Robinson Cavalcanti interpretou a saída do deão da Catedral como conflito entre
    modelos eclesiológicos (personalismo e congregacionalismo, de um lado, e a estrutura episcopal da IEAB, de outro),
    e disse que, quando do cisma, encontrou entre o clero três situações quanto aos votos de ordenação: os que permaneceram
    leais, os que os revogaram abandonando a IEAB e os que os mantinham seletivamente; alguns pastores e comunidades
    seguiram o deão e outros foram para outras denominações.
  status: confirmed
  sources:
  - source: d2s23-cisma-passado
    quote: O CISMA É PASSADO. E AGORA?
  - source: d2s23-cisma-passado
    quote: >-
      Alguns desses pastores e suas comunidades seguiram o cisma do líder maior, outros foram para outras denominações
- type: other
  date: 1984-07
  description: >-
    Em julho de 1984, no Sínodo Geral da IEAB (Porto Alegre), Clóvis Erly Rodrigues, então deão da Catedral de Santa
    Maria, foi eleito bispo coadjutor da Diocese Setentrional (Recife), com direito a sucessão de Edmund Knox Sherrill,
    que anunciara sua aposentadoria para o fim de 1985. Segundo o histórico do site da IEAB, a eleição contrariou
    o bispo Sherrill e a delegação do Recife, que desejava eleger Paulo Ruiz Garcia.
  status: confirmed
  sources:
  - source: d2s31-hist
    quote: >-
      Em 1984 o bispo Sherrill anuncia sua aposentadoria para o final de 1985, o que torna possível, em julho de
      1984, durante o Sínodo Geral da IEAB realizado em Porto Alegre, a eleição do Rev. Clovis Erly Rodrigues, então
      Deão da Catedral de Santa Maria, como bispo coadjutor da Diocese Setentrional (ainda diocese missionária)
      com direito a sucessão.
  - source: d2s31-hist
    quote: >-
      Esta eleição contrariou a vontade do bispo Sherrill e dos clérigos e leigos da delegação de Recife, que desejavam
      a eleição do Rev. Paulo Ruiz Garcia como o sucessor de D. Sherrill.
- type: other
  date: '2002'
  description: >-
    Segundo o histórico do site da IEAB, em 2002 a Diocese Anglicana do Recife sofreu dois cismas. No primeiro saíram
    Paulo Garcia, levando a comunidade da Catedral e o prédio, os Pontos Missionários Bem-aventuranças e Pedra Viva,
    e os reverendos Célio Spineli, Edgar B. Ferreira Neto e Frederico Carneiro Rego Bastos. O texto atribui os cismas
    à gestão do bispo diocesano; essa avaliação é da fonte (versão da IEAB).
  status: confirmed
  sources:
  - source: d2s31-hist
    quote: >-
      vindo a sair do seu quadro no primeiro cisma o Revmo Paulo Garcia, levando consigo a comunidade e o prédio
      que historicamente pertencia à Igreja Episcopal Anglicana do Brasil, os Pontos Missionários Bem-aventuranças
      e Pedra Viva, além do Rev. Célio Spineli, Edgar B. Ferreira Neto, Frederico Carneiro Rego Bastos;
  - source: d2s31-hist
    quote: >-
      De sua inabilidade no exercício do episcopado, no ano de 2002, a Diocese Anglicana do Recife sofreu dois cismas
