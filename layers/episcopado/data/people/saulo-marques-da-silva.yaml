events:
- type: other
  date: '1970'
  description: >-
    Hospedou o primeiro concílio da Diocese Sul Central (1970); em 1950, recém-ordenado diácono, era coadjutor do
    pároco Gaudêncio Vergara dos Santos em São Paulo
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      O rev. Saulo Marques da Silva, que havia hospedado o primeiro concílio em 1970, era em 1950 um diácono recém
      ordenado e coadjutor do pároco Gaudêncio Vergara dos Santos.
    page: '283'
- type: other
  date: '1977-03-26'
  description: >-
    Um dos dois mais votados nos concílios de 1977 para eleger o bispo da Diocese Sul Central (26/03, sem eleição
    após oito escrutínios; 30/04, vencido por Sumio Takatsu)
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Antes de voltar aos Estados Unidos, convocou um concílio extraordinário em 26 de março do mesmo ano para eleger
      o seu sucessor, não obtendo sucesso depois de oito escrutínios. Os candidatos mais votados foram os reverendos
      Jaci Correia Maraschin e Saulo Marques da Silva, que não alcançaram o número de votos necessários nas duas
      ordens.
    page: '287'
