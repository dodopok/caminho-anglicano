biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Rio Grande,
  RGS, Brasil (1926-03-25). Ordenado diácono em fev/1950 e presbítero em dez/1950. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
