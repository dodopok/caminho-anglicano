biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Medford,
  Oregon, EUA (1934-01-27). Ordenado diácono em jun/1959 e presbítero em dez/1959. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
