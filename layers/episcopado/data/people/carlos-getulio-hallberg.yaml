biography: >-
  Nascido em Cruz Alta (RS) em 22/08/1942, foi ordenado diácono em dezembro de 1964 pelo bispo Plínio Lauer Simões,
  no Distrito Missionário do Sudoeste do Brasil. Foi transferido para a Igreja Episcopal do Brasil em 25/04/1965.
