biography: >-
  Clérigo do Distrito Missionário do Sudoeste do Brasil (SwBra) segundo o Clerical Directory 1965. Nascido em Porto
  Alegre, RGS, Brasil (1906-03-27). Ordenado diácono em dez/1939 e presbítero em mar/1941. Transferido para a Igreja
  Episcopal do Brasil em 25/04/1965 (Clerical Directory 1968).
