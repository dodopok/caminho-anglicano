biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Chattanooga,
  Tennessee, EUA (1928-07-06). Ordenado diácono em jun/1958 e presbítero em abr/1959. Transferido para a Igreja
  Episcopal do Brasil em 25/04/1965 (Clerical Directory 1968).
