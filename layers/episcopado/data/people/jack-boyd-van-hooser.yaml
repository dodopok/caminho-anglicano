biography: >-
  Jack Boyd Van Hooser foi ordenado diácono em junho de 1958 e presbítero em abril de 1959, na Igreja Episcopal
  dos EUA, atuou no Distrito Missionário do Brasil Central e foi transferido para a Igreja Episcopal do Brasil em
  25 de abril de 1965.
