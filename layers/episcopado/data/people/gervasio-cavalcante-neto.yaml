id: gervasio-cavalcante-neto
name: Gervásio Cavalcante Neto
full_name: Gervásio Cavalcante Neto
aliases:
- Dom Gervásio
- Dom Gervásio Neto
- Gervásio Neto
- Rev. Gervásio Neto
biography: >-
  Gervásio Cavalcante Neto foi sagrado em 6 de dezembro de 2014 bispo auxiliar da Diocese Missionária do Nordeste
  do Brasil (ICEB), com William Paul Mikler, Leonides de Menezes Ferreira e Evilásio Tenório presentes, e figura
  depois como bispo diocesano da Catedral Betânia.
sources:
- source: lie-ciceb-sagra-2016
  quote: Sagração do Bispo Auxiliar Rev. Gervásio Neto em 06/12/2014
- source: cant-novas-igrejas-2024
  quote: >-
    Em dezembro de 2014, ocorreu a sagração episcopal do reverendo Gervásio Cavalcante Neto, como bispo auxiliar,
    com a presença do bispo William Paul Mikler – bispo presidente da CEEB –, junto com dom Leonides de Menezes
    Ferreira e dom Evilásio Tenório.
- source: lie-ciceb-catedral-2016
  quote: Bispo Diocesano Dom Leonides Bispo Auxiliar Dom Gervásio Pastor Helson Pastora Raquel
- source: ciceb-quemsomos
  quote: O corpo atual de clérigos é formado por 1 bispo diocesano (Revmo. Gervásio Neto)
