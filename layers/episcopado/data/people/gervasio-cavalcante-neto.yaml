  notes: >-
    A data completa (6/12/2014) vem da galeria de fotos hospedada no site antigo da Catedral Betânia/CICEB; a galeria
    não lista os sagrantes. Os nomes dos bispos presentes (Mikler, Leônides de Menezes, Evilásio Tenório) vêm do
    livro sobre as novas igrejas anglicanas (citado em outro registro) e não identificam o sagrante principal. O
    local é inferido do endereço da galeria (catedralbetania.html). CEEB/Catedral Betânia. A fonte diz "com a presença"
    dos bispos, sem indicar o principal; o local é inferido do capítulo (Catedral Betânia). O livro diz 'com a presença'
    desses bispos, sem identificar o sagrante principal; listados como co-sagrantes por inferência do contexto.
