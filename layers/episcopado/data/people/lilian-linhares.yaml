  - source: d2s25-orildo
    quote: >-
      Paróquia de Jesus de Nazaré, o bairro de Jardim Progresso, a cidade do Natal e o Estado do Rio Grande do Norte
      vivem hoje um momento muito importante, uma grande festa !
