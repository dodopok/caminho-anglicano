id: lilian-linhares
name: Lílian Linhares
full_name: Lílian Pereira da Costa Linhares
aliases:
- Lílian Pereira da Costa Linhares
- Revda. Lílian Linhares
biography: >-
  Lílian Pereira da Costa Linhares é natural do Rio Grande do Norte, ex-missionária batista, bacharel em Missiologia
  pelo Seminário Bíblico Betel (PB) e pós-graduada em Ciências da Religião pelo Instituto Metodista Bennett (RJ).
  Como ministra leiga, foi uma das dirigentes de seminários da Diocese Anglicana do Recife. Foi ordenada diácona
  em outubro de 2000 por Robinson Cavalcanti e presbítera em 15/12/2001, em Natal, descrita como a primeira mulher
  ordenada ao presbiterado pela IEAB no Rio Grande do Norte. Fez parte da equipe pastoral das Missões da Natividade
  (RN, hoje paróquia) e da Esperança (PB), da qual foi membro fundadora, foi pró-tempore na Paróquia Anglicana da
  Ressurreição (PB) e coadjutora da Paróquia Anglicana Jesus de Nazaré (RN). Também aparece como coadjutora da Paróquia
  Anglicana da Reconciliação e como membro da Junta de Capelães Examinadores da diocese. Consta do decreto de 2004
  e das listas do clero diocesano, com a sigla franciscana OSF ou TSSF.
