id: lilian-linhares
name: Lílian Linhares
full_name: Lílian Pereira da Costa Linhares
aliases:
- Lílian Pereira da Costa Linhares
- Revda. Lílian Linhares
biography: >-
  Lílian Linhares foi ordenada diácona em outubro de 2000 por Robinson Cavalcanti e presbítera em 15/12/2001, em
  Natal, descrita como a primeira mulher ordenada ao presbiterado pela IEAB no Rio Grande do Norte. É clériga da
  Diocese Anglicana do Recife (IEAB), constando do decreto de 2004 e da lista do clero diocesano.
