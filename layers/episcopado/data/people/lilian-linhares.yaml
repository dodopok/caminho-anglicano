    quote: >-
      a primeira mulher ordenada ao presbiterado, pela Igreja Episcopal Anglicana do Brasil, em terras potiguares
  - source: d2s25-orildo
    quote: Natal, 15 de Dezembro de 2001
  - source: d2s25-orildo
    quote: ao Presbiterado de Lílian Pereira da Costa Linhares
  - source: d2s25-orildo
    quote: >-
      Aqui estamos para louvar e celebrar a vida e o ministério cristão da primeira mulher ordenada ao presbiterado,
      pela Igreja Episcopal Anglicana do Brasil, em terras potiguares.
  - source: d2s25-orildo
    quote: >-
      Paróquia de Jesus de Nazaré, o bairro de Jardim Progresso, a cidade do Natal e o Estado do Rio Grande do Norte
      vivem hoje um momento muito importante, uma grande festa !
  notes: >-
    Datas informadas pela própria clériga no livro comemorativo '35 anos de Ordenação de Mulheres na IEAB' (2021).
    O sermão cita a presença do bispo diocesano Robinson Cavalcanti e do bispo auxiliar eleito Filadelfo de Oliveira
    Neto, sem dizer expressamente quem impôs as mãos. Pelo sermão, ela chegou a Natal em janeiro de 1999 vinda do
    Rio de Janeiro. O texto é o sermão proferido na cerimônia e não nomeia o bispo ordenante; menciona a presença,
    na ocasião, do bispo diocesano Robinson Cavalcanti.
