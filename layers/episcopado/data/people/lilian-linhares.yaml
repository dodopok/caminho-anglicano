- order: presbyterate
  date: '2001-12-15'
  place: Paróquia de Jesus de Nazaré, Jardim Progresso, Natal (RN)
  jurisdiction: ieab
  status: confirmed
  sources:
  - source: rta-livro35
    quote: 'Presbiterado: 15 de dezembro de 2001.'
  - source: rta-orildo-lilian-2001
    quote: Natal, 15 de Dezembro de 2001 Ordenação ao Presbiterado de Lílian Pereira da Costa Linhares
  - source: rta-orildo-lilian-2001
    quote: >-
      a primeira mulher ordenada ao presbiterado, pela Igreja Episcopal Anglicana do Brasil, em terras potiguares
  notes: >-
    Datas informadas pela própria clériga no livro comemorativo '35 anos de Ordenação de Mulheres na IEAB' (2021).
    O sermão cita a presença do bispo diocesano Robinson Cavalcanti e do bispo auxiliar eleito Filadelfo de Oliveira
    Neto, sem dizer expressamente quem impôs as mãos. Pelo sermão, ela chegou a Natal em janeiro de 1999 vinda do
    Rio de Janeiro.
