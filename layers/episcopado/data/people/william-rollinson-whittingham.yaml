- source: perry-1895
  quote: >-
    Johns was consecrated assistant bishop of Virginia, in the Monumental Church, Richmond, Oct. 13, 1842. His consecrators
    were Bishops Griswold, Meade, Ives, and Whittingham.
- source: wp-en-histlist
  quote: >-
    | [[John Johns]] | [[Alexander Viets Griswold|12]] [[William Meade|22]] [[Levi Silliman Ives|25]] | 1842
- source: perry-1895
  quote: >-
    Potter was consecrated provisional bishop of New York in Trinity Church, Nov. 22, 1854. His consecrators were
    Bishops Brownell, Hopkins, Doane, McCoskry, Whittingham, Eastburn, Alonzo Potter, Williams, Whitehouse, H, W.
    Lee, and the bishop of Montreal, Dr. Fulford.
- source: wp-en-histlist
  quote: >-
    | [[Horatio Potter]] | [[Thomas Church Brownell|19]] [[John Henry Hopkins|26]] [[George Washington Doane|29]]
    | 1854
