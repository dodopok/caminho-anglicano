id: william-rollinson-whittingham
name: William Rollinson Whittingham
full_name: William Rollinson Whittingham
aliases:
- Bp. Whittingham
wikidata: Q8017738
biography: >-
  Sagrado em 17/09/1840, em Baltimore, por Alexander Viets Griswold, com Channing Moore, B. T. Onderdonk e Doane,
  foi bispo da Diocese de Maryland (TEC). Participou de quatro sagrações episcopais, entre elas as de John Johns
  e Horatio Potter.
sources:
- source: perry-1895
  quote: >-
    His consecration to the episcopate of Maryland took place in St. Paul's Church, Baltimore, Sept. 17, 1840. His
    consecrators were Bishops Griswold, Channing Moore, B. T. Onderdonk, and Doane.
- source: wp-en-histlist
