ordinations:
- order: diaconate
  date: '1956-11-30'
  place: Paróquia da Ascensão, Porto Alegre
  jurisdiction: dmsb
  ordained_by: egmont-krischke
  status: probable
  sources:
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1956 - … Glauco Soares de Lima
    page: '371'
  - source: kickhofel-1995
    quote: >-
      O reverendo Glauco Soares de Lima foi eleito bispo coadjutor com direito a sucessão em concílio extraordinário
      realizado em julho de 1989, em São Paulo, obtendo a maioria dos votos nas duas ordens no segundo escrutínio.
      Foi ordenado ao diaconato em 1956 e ao presbiterado em 1958.
    page: '290'
  - source: costa2021
    quote: >-
      Foi ordenado diácono em 30 de novembro de 1956, na Paróquia da Ascensão, em Porto Alegre, pelo bispo Egmont
      Machado Krischke.
    page: '99'
  notes: >-
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
- order: presbyterate
  date: 1958-02
  jurisdiction: null
  ordained_by: plinio-lauer-simoes
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      O reverendo Glauco Soares de Lima foi eleito bispo coadjutor com direito a sucessão em concílio extraordinário
      realizado em julho de 1989, em São Paulo, obtendo a maioria dos votos nas duas ordens no segundo escrutínio.
      Foi ordenado ao diaconato em 1956 e ao presbiterado em 1958.
    page: '290'
  - source: ieablac-cd1959
    quote: D Nov 56 Bp Krischke P Feb 58 Bp Simdes.
  notes: >-
    OCR 'Simdes' = Simões (bispo Plínio Lauer Simões, que à época era bispo de Southwestern/Central Brazil; ele
    foi sagrado em 1956). A base tem 1958 sem ordenante. Confirma diaconato por Krischke (nov/1956) já na base.
- order: episcopate
  date: '1989-10-01'
  place: Catedral Anglicana de Sao Paulo
  jurisdiction: ieab
  office: coadjutor
  principal_consecrator: olavo-ventura-luiz
  status: contested
  sources:
  - source: kickhofel-1995
    quote: >-
      Foi elevado ao episcopado no dia primeiro de outubro de 1989 na mesma igreja que pastoreava na época de sua
      eleição. Foi sagrante o bispo primaz Olavo Ventura Luiz e co-sagrantes mais sete colegas. Assumiu o governo
      da diocese em janeiro de 1990.
    page: '291'
  - source: costa2021
    quote: >-
      Foi elevado ao episcopado em 1º de outubro no histórico templo da capital paulista, pelas mãos do Bispo Primaz,
      Olavo Ventura Luiz, tendo como co-sagrantes mais sete bispos.
  - source: wp-pt-glauco
    quote: >-
      Em 1° de julho de 1989, Lima foi sagrado bispo na Catedral Anglicana de São Paulo, sucedendo Dom Sumio Takatsu.
  - source: costa2021
    quote: >-
      Em julho de 1989, o reverendo Glauco Soares de Lima 88 foi eleito bispo coadjutor na Diocese Anglicana de
      São Paulo
    page: '99'
  discrepancies:
  - field: date
    value: '1989-07-01'
    sources:
    - source: wp-pt-glauco
      quote: >-
        Em 1° de julho de 1989, Lima foi sagrado bispo na Catedral Anglicana de São Paulo, sucedendo Dom Sumio Takatsu.
  notes: >-
    O livro diz que houve sete co-sagrantes, sem nomeá-los. Versao de Costa 2021: 01/10/1989, St. Paul's Church,
    eleito coadjutor em julho de 1989. Wikipedia PT diz 01/07/1989 na Catedral Anglicana de Sao Paulo (ver afirmacao
    contestada seguinte). Versao Wikipedia PT (sem fonte especifica). Conflita com Costa 2021 (eleito coadjutor
    em julho, sagrado em 1o de outubro). Coadjutor. A tese diz 'mais sete bispos' como co-sagrantes, sem nomeá-los.
    O templo é a St. Paul's Church, onde exercia o ministério.
