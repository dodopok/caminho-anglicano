  description: >-
    Em conferência regional preparatória para Lambeth realizada no Brasil, o primaz Glauco Soares de Lima lembra
    aos bispos latino-americanos que mais da metade dos 70 milhões de anglicanos do mundo vive em países de língua
    não inglesa.
  status: probable
  sources:
  - source: f8gla-ens-96-1586
    quote: >-
      Speaking in Brazil at a regional preparatory conference leading up to Lambeth, Archbishop Glauco Soares of
      Lima, primate of the Episcopal Church of Brazil, reminded Latin America's bishops that, of the world's 70
      million Anglicans, more than 50 percent live in non-English-speaking countries.
- type: other
  date: 1999-09
  description: >-
    Na reunião do Conselho Consultivo Anglicano (ACC) em Dundee, Escócia, em 1999, o primaz Glauco Soares de Lima
    critica o Relatório Virginia como sinal de "mente ainda colonial" nas estruturas descritas, e preocupa-se com
    o colonialismo entre as igrejas do Norte e do Sul.
  status: probable
  sources:
  - source: f8gla-ens-99-151
    quote: >-
      Archbishop Glauco Soares de Lima, primate of the Episcopal Church in Brazil, expressed his concern about the
      on-going colonialism between countries and churches in the North and the South. He said that the report "is
      a sign of a still-colonial mind, even in the structures described."
  - source: f8gla-ens-99-173
    quote: The consultation was announced at the ACC's meeting in Dundee, Scotland, in September.
- type: other
  date: 1999-11
  description: >-
    O arcebispo Glauco Soares de Lima, do Brasil, integra o grupo de bispos e primazes das Conversações Anglicanas
    Internacionais sobre Sexualidade Humana, presididas por Frank Griswold (primeira reunião em novembro de 1999,
    no Mosteiro de Holy Cross, West Park, Nova York; relatório final em 2002).
  status: confirmed
  sources:
  - source: f8gla-ens-99-173
    quote: >-
      Besides Griswold, those present at Holy Cross Monastery were Bishop Simon Chiwanga of Tanzania, president
      of the Anglican Consultative Council (ACC), Bishop Terence Finlay of Canada, Bishop Josiah Idowu-Fearon of
      Nigeria, Bishop Chilton Knudsen of Maine, Archbishop Peter Kwong of Hong Kong, Archbishop Glauco Soares de
      Lima of Brazil
  - source: f8gla-ens-2002-183
    quote: >-
      Primates in the group included Griswold of ECUSA; Peter Kwong, archbishop of Hong Kong; Glauco Soares de Lima,
      Primate of Brazil; Peter Watson, archbishop of Melbourne; and Rowan Williams, archbishop of Wales.
- type: other
  date: 2001-07
  description: >-
    O presiding bishop Frank Griswold visita o Brasil (São Paulo e Porto Alegre) em julho de 2001, em parte por
    amizade com o primaz Glauco Soares de Lima; Glauco expressa a esperança de que a visita lembre às duas igrejas
    que "o mundo inteiro é nosso campo missionário".
  status: probable
  sources:
  - source: f8gla-ens-2001-197
    quote: >-
      The Most Rev. Glauco Soares de Lima, Primate of the Anglican Episcopal Church of Brazil, expressed the hope
      that this visit would remind both churches that "the whole world is our mission field."
  - source: f8gla-ens-2001-197
    quote: >-
      Griswold said that he had come to Brazil in part because of a friendship with Bishop Soares de Lima, "a wonderful,
      wise and seasoned primate who has been a minister of encouragement to me."
- type: other
  date: '1999'
  description: >-
    O primaz Glauco Soares de Lima acompanha o primaz canadense Michael Peers numa visita de oito dias à Igreja
    Episcopal Anglicana do Brasil (Brasília e Porto Alegre, entre outros lugares), relatada em junho de 1999.
  status: probable
  sources:
  - source: lib-aj-1999-06
    quote: They were accompanied by Bishop Glauco Soares de Lima, Bishop of Sao Paulo and Primate of Brazil.
  - source: lib-aj-1999-06
    quote: >-
      Archbishop Michael Peers, left, Bishop Glauco Soares de Lima, Primate of Brazil, and Bishop Orlando Santos
      de Oliviera of the Southern Diocese join in a Sunday service near Porto Alegre.
- type: other
  date: 2003-05
  description: >-
    Reunião dos Primazes da Comunhão Anglicana no Brasil (maio de 2003, com sessões em Porto Alegre), em que se
    homenageia Glauco Soares de Lima, primaz que se aposentava.
  status: confirmed
  sources:
  - source: f8gla-ens-2003-121
    quote: The meeting also honored Glauco Soares de Lima, the retiring primate of the Brazilian church.
- type: other
  date: 1992-05
  description: >-
    A Igreja Episcopal e a Igreja Episcopal do Brasil, em reunião de cinco dias em Cincinnati (início de maio de
    1992), buscam uma relação de parceria entre irmãs; o então bispo de Sul-Central Brasil (São Paulo), Glauco Soares
    de Lima, é citado dizendo que "a velha relação passou" e que as duas igrejas discutem "talvez pela primeira
    vez" a si mesmas e à realidade uma da outra.
  status: probable
  sources:
  - source: lib-ens-92126
    quote: >-
      "It was a shock for the Brazilians," Bishop Glauco Soares de Lima of South-Central Brazil said in an interview.
  - source: lib-ens-92126
    quote: >-
      "The old relationship is past. We are now looking for a sister-to-sister relationship," Soares de Lima said.
- type: other
  date: 1994-02
  description: >-
    O Conselho Executivo da Igreja Episcopal dos EUA dá as boas-vindas ao bispo Glauco Soares de Lima, da Diocese
    de São Paulo, e recomenda um acordo bilateral entre a Igreja Episcopal e a Igreja Episcopal do Brasil como novo
    modelo de missão.
  status: probable
  sources:
  - source: f8gla-ens-94017
    quote: >-
      welcomed Bishop Glauco Soares de Lima of the Diocese of Sao Paulo, Brazil, and the Rev. Douglass Bailey of
      Calvary Church in Memphis, Tennessee. The council commended to dioceses, congregations, institutions and individuals
      a vision statement and bilateral agreement presented by a committee on relations between the Episcopal Church
      and Episcopal Church in Brazil as a new model for doing mission;
- type: other
  date: null
  description: >-
    Dom Glauco Soares de Lima, com Paulo Evaristo Arns, participa da celebração ecumênica na Catedral da Sé, em
    São Paulo, em memória do jornalista Vladimir Herzog, morto pela ditadura militar.
  status: probable
  sources:
  - source: f8gla-dab-facebook-obit-2017
    quote: >-
      Ao lado de Dom Paulo Evaristo Arns esteve presente por ocasião da Celebração Ecumênica em memória e honra
      a Vladimir Herzog, jornalista que foi morto pelo regime ditatorial, na Catedral da Sé.
- type: other
  date: '2000'
  description: >-
    O primaz Glauco Soares de Lima institui o Distrito Missionário da Amazônia e do Oeste (ano 2000), iniciando
    a expansão da IEAB para o Norte e o Centro-Oeste do país.
  status: probable
  sources:
  - source: f8gla-dab-facebook-obit-2017
    quote: >-
      Foi ele quem deu início a caminhada da Igreja para o Norte e para o Centro-Oeste do Brasil quando instituiu
      o Distrito Missionário da Amazônia e do Oeste no ano 2000.
  - source: f8gla-ens-2001-197
    quote: There are seven dioceses and two newly formed missionary districts in Amazônia and Rondônia
- type: other
  date: '1997'
  description: >-
    Eleição de Robinson Cavalcanti como bispo da diocese do Nordeste (então da IEAB), no Concílio realizado em 1997:
    segundo o relato do Arcediagado PB/CE/RN em 2010, foram 10 escrutínios, com ameaça de suspensão do processo
    por impasse entre três candidatos, e o Primaz Dom Glauco declarou a vitória de Robinson.
  status: probable
  sources:
  - source: d2s03-hom-pbcern
    quote: >-
      Depois de uma sofrida maratona de 10 escrutínios, no último voto e quando já se ameaçava a suspensão do processo
      eletivo por causa do impasse gerado pela impossibilidade de qualquer dos três candidatos disputantes vencer
      o pleito
  - source: d2s03-hom-pbcern
    quote: >-
      finalmente obteve-se a maioria canônica exigida e o Primaz Dom Glauco declarou oficialmente vitória do candidato
      Robinson
- type: other
  date: '1997'
  description: >-
    Eleição de Robinson Cavalcanti ao episcopado da Diocese Anglicana do Recife (1997), no Concílio realizado em
    um convento romano quase desativado na Ilha de Itaparica (BA), local escolhido pelo bispo diocesano Clóvis Erly
    Rodrigues. Segundo o relato do Arcediagado PB/CE/RN, houve 10 escrutínios entre três candidatos; no último,
    obteve-se a maioria canônica exigida e o primaz Glauco Soares de Lima declarou oficialmente a vitória de Robinson.
  status: confirmed
  sources:
  - source: d2s03-hom-pbcern
    quote: Depois de uma sofrida maratona de 10 escrutínios
  - source: d2s03-hom-pbcern
    quote: o Primaz Dom Glauco declarou oficialmente vitória do candidato Robinson
  - source: d2s03-hom-pbcern
    quote: >-
      o local escolhido pelo Bispo Clóvis Erly Rodrigues , Diocesano antecessor ao eleito, para realização do Concílio,
      era quase inacessível
  - source: d2s03-hom-pbcern
    quote: um convento romano quase desativado em um ermo local no interior da ilha de Itaparica – Bahia
- type: other
  date: '2003-05-24'
  description: >-
    Encontro dos Primazes da Comunhão Anglicana em Gramado (RS), presidido pelo arcebispo de Cantuária Rowan Williams,
    com 33 dos 38 primazes; em 24 de maio houve celebração eucarística no Cine Embaixador, presidida pelo primaz
    da IEAB, Glauco Soares de Lima. Os bispos Robinson Cavalcanti e Filadelfo Oliveira Neto, da Diocese Anglicana
    do Recife, participaram de reuniões e cultos; segundo o relato da diocese, houve sessão especial sobre o "cisma
    do Recife", dirigida por Glauco Soares de Lima, e os primazes expressaram apoio aos bispos e à diocese.
  status: confirmed
  sources:
  - source: d2s24-encontro-primazes
    quote: >-
      Com a presença do Arcebispo de Cantuária e de 33 dos 38 Primazes da Comunhão Anglicana, teve lugar em Gramado-RS,
      esse importante Encontro mundial
  - source: d2s24-encontro-primazes
    quote: >-
      Dom Robinson Cavalcanti e Dom Filadelfo Oliveira participaram de várias reuniões e cultos nos dois últimos
      dias
  - source: d2s24-encontro-primazes
    quote: >-
      Uma sessão especial foi, excepcionalmente, dedicada a estudar o cisma do Recife, dirigida pelo Primaz do Brasil,
      Dom Glauco Soares de Lima.
  - source: d2s24-encontro-primazes
    quote: Os primazes expressaram o seu decidido apoio aos nossos bispos e à DAR.
  - source: d2s24-cronologia
    quote: Primazes, reunidos em Gramado
