      por 19 a 18 votos na ordem leiga e 15 a 13 votos na ordem clerical.
- type: other
  date: '2013-03-17'
  description: >-
    Em 17/03/2013 a Junta Paroquial da Catedral Anglicana de São Paulo declara que a catedral volta ao status de
    capelania anterior a 1975, fora da supervisão da IEAB, permanecendo sob o oversight dos bispos Roger Bird e
    Glauco Soares de Lima. A imprensa anglicana noticia que o bispo de São Paulo e o ex-primaz deixaram a IEAB.
  status: confirmed
  sources:
  - source: lbd-anglicanink-2013
    quote: >-
      On 17 March 2013 parish council of St. Paul’s Cathedral in São Paulo stated that while they remained in the
      Anglican Communion they were reverting to their pre-1975 status as a Church of England chaplaincy and were
      no longer under the oversight of the IEAB.
  - source: lbd-geo-tag
    quote: >-
      The congregation also announced that it would remain under the spiritual oversight of Bishop Roger Bird of
      São Paulo and retired Archbishop Glauco Soares de Lima.
  - source: lbd-catedral-sobre
    quote: >-
      confirma os Bispos anglicanos Dom Roger Douglas Bird e Dom Glauco Soares de Lima como seus líderes espirituais.
- type: other
  date: '2013'
  description: >-
    Glauco Soares de Lima (bispo emérito, ex-primaz) escreve que o bispo diocesano Roger Bird resolveu anular a
    eleição de 2012, 'decisão com a qual eu concordei'.
  status: probable
  sources:
  - source: glauco-testemunho-2013
    quote: O bispo diocesano (Roger Bird) resolveu anular a eleição, decisão com a qual eu concordei.
- type: other
  date: '2005-09-22'
  description: >-
    Nota diocesana de 22/09/2005 afirma que o 'pseudo-concílio' da minoria dissidente realizado em 10/09/2005 não
    teve quórum, que a diocese nunca se desvinculou da IEAB, que o 'decreto' de excomunhão e deposição contra 32
    clérigos não foi notificado, e atribui ao ex-primaz Glauco Soares de Lima a declaração de que a sentença contra
    Robinson resultou de um 'discurso inflamado' do bispo sufragâneo.
  status: contested
  sources:
  - source: drv-fatos-verdadeira-dar
    quote: O pseudo-concílio realizado pela minoria dissidente da Diocese, em 10.09 passado
  - source: drv-fatos-verdadeira-dar
    quote: >-
      o ex-Primaz Glauco Soares de Lima, afirmou que a Sentença de Deposição não foi uma decisão objetiva do Superior
      Tribunal Eclesiástico, mas o resultado da influência de um “discurso inflamado” do Bispo Sufragâneo do Recife
- type: other
  date: '1988-10-12'
  description: >-
    Eleição de Almir dos Santos, reitor da Paróquia de Jesus Cristo (Erechim), como bispo da Diocese Missionária
    de Brasília pelo 23º Sínodo da Igreja Episcopal do Brasil, reunido em Porto Alegre, na quarta votação. Outros
    candidatos: Patricia Ann Powers, Jorge Macedo e Glauco Soares de Lima, então reitor de uma igreja em São Paulo.
    A sagração era prevista para março de 1989 em Brasília.
  status: probable
  sources:
  - source: ens-88234d
    quote: >-
      On October 12, the 23rd Synod of the Episcopal Church of Brazil, meeting at Porto Allegre, elected the Rev.
      Almir dos Santos, rector of Jesus Christ parish in Erechim, Brazil, bishop of the missionary diocese of Brasilia.
  - source: ens-88234d
    quote: >-
      The other candidates were the Rev. Patricia Ann Powers, a missionary from the United States working in Brasilia,
      the Rev. Jorge Macedo, rector of a church in Rio de Janeiro, and the Rev. Glauco Soares de Lima, rector of
      a church in Sao Paulo.
  - source: ens-88234d
    quote: The consecration of Bishop-elect Almir dos Santos will take place in Brasilia in March 1989.
- type: other
  date: '2013-04-19'
  description: >-
    Junta Paroquial da Catedral Anglicana de São Paulo publica carta aberta: afirma que a filiação à igreja nacional
    desde 1975 é espiritual e não patrimonial; que a Assembleia Geral ratifica por unanimidade ter sempre prioritariamente
    um Bispo da Comunhão Anglicana como líder espiritual; e confirma Dom Roger Douglas Bird e Dom Glauco Soares
    de Lima como líderes espirituais.
  status: confirmed
  sources:
  - source: lq-cat-carta-aberta
    quote: terá sempre prioritariamente um Bispo da Comunhão Anglicana como líder espiritual
  - source: lq-cat-carta-aberta
    quote: com ênfase na existência de laços espirituais, mas não patrimoniais
