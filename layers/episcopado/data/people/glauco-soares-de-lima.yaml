  notes: >-
    O livro diz que houve sete co-sagrantes, sem nomeá-los. Versao de Costa 2021: 01/10/1989, St. Paul's Church,
    eleito coadjutor em julho de 1989. Wikipedia PT diz 01/07/1989 na Catedral Anglicana de Sao Paulo (ver afirmacao
    contestada seguinte). Versao Wikipedia PT (sem fonte especifica). Conflita com Costa 2021 (eleito coadjutor
    em julho, sagrado em 1o de outubro). Coadjutor. A tese diz 'mais sete bispos' como co-sagrantes, sem nomeá-los.
    O templo é a St. Paul's Church, onde exercia o ministério. A diocese de Brasília, em nota de falecimento, situa
    a sagração em 1989 na Catedral Anglicana de São Paulo e o descreve como terceiro bispo diocesano de São Paulo;
    não dá dia nem sagrantes. Versão de 1º de julho de 1989 (biografia ligada ao Movimento Anglicano no Brasil,
    de 2013, repetida no glossário Caminho Anglicano e na Wikipédia). Conflita com Kickhöfel (1995) e Costa (2021),
    que dão 1º de outubro de 1989 e informam que julho foi o mês da eleição como coadjutor. Terceira versão de data
    (10 de julho de 1989), na biografia publicada em 27/12/2017 por comunidade anglicana de Tubarão, com o mesmo
    texto de 2013 mas dia diferente ("10" em vez de "1o"), possivelmente erro de transcrição.
