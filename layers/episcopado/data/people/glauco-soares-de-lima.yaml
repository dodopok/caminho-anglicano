  notes: >-
    Anexo E de Costa da 1994-2003 (com Gastal interino 1993-94). Em maio de 2003 a Reunião dos Primazes, em Gramado
    (RS), homenageou o primaz que se aposentava; a entronização do sucessor ocorreu em 1º de junho de 2003. O livro
    dá só o início de cada primado; o fim é o início do primado seguinte. Anexo E da tese (primazes da IEAB). Primaz
    em outubro de 1997. Também foi um dos interinos à frente da DAR (2004-2006). Maurício Andrade (secretário-geral
    da IEAB em todo o primado) data o início de ambos em maio de 1993, o que favorece 1993 sobre 1994 (data de outras
    fontes, que podem registrar a posse). A nota da Diocese de Brasília fala em três mandatos (1993, 1997, 2003).
    A cronologia dá 1994 como ano do novo primaz; outras fontes divergem quanto ao início do primado. Em exercício
    na data do texto (depois de outubro de 2003, sem data exata); a fonte cita só o nome 'D. Glauco', que no contexto
    (primaz da província, 2003-2004) corresponde a Glauco Soares de Lima.
