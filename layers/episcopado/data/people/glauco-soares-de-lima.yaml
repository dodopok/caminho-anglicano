biography: >-
  Bispo de Sao Paulo (1990-2002) e primaz (1993-2003); sagrante principal de Robinson Cavalcanti, Orlando, Celso
  Franco, Hiroshi Ito e Mauricio Andrade; em 2013 aderiu ao Movimento Anglicano no Brasil.
