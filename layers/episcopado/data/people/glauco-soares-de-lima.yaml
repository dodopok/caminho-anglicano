wikidata: Q21020068
biography: >-
  Glauco Soares de Lima nasceu em Pelotas (RS) em 28 de janeiro de 1934 e estudou filosofia na UFRGS e teologia
  em Porto Alegre e nos Estados Unidos. Foi ordenado diácono em 30 de novembro de 1956, por Egmont Krischke, e presbítero
  em fevereiro de 1958, por Plínio Lauer Simões, na IEAB; atuou em Jaguarão, Bagé e na Paróquia do Redentor (Rio
  de Janeiro), foi professor do Seminário Teológico Nacional e, em São Paulo, pároco da Igreja de São Paulo e deão
  da Catedral. Eleito bispo coadjutor da Diocese Anglicana de São Paulo em julho de 1989, foi sagrado em 1989 pelo
  primaz Olavo Ventura Luiz (a data registrada é 1º de outubro, mas há versão de 1º de julho) e governou a diocese
  de janeiro de 1990 a 2002, quando passou a emérito. Foi primaz da IEAB de 1993 a 2003 e, em 2003, bispo interino
  de Brasília. Como primaz, visitou o Recife em setembro de 2002, na crise da catedral, e entre 2004 e 2006 foi
  um dos bispos que exerceram interinamente a autoridade primacial sobre a Diocese do Recife. Em 2000 instituiu
  o Distrito Missionário da Amazônia e do Oeste. Participou de duas ordenações de diáconos ou presbíteros e de seis
  sagrações episcopais, entre elas as de Robinson Cavalcanti, Orlando Santos de Oliveira e Celso Franco de Oliveira,
  em que foi sagrante principal. Em 2013, após a anulação da eleição episcopal de 2012, com a qual concordou, apoiou
  o movimento de Roger Bird e Aldo Quintão, desligou-se da IEAB e tornou-se bispo do Movimento Anglicano no Brasil.
  Faleceu em São Paulo em 26 de dezembro de 2017.
