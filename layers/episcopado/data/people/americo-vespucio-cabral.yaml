# yaml-language-server: $schema=../../schemas/person.json
id: americo-vespucio-cabral
name: Américo Vespúcio Cabral
aliases:
- Americo V. Cabral
- Américo V. Cabral
- Cabral
death:
  date: '1937'
  sources:
  - source: drv-efemerides-reb
    quote: Fundador do Anglicanismo Brasileiro (IEAB), Sacerdote e Missionário, 1937
biography: >-
  Catequista brasileiro que acompanhou os missionários a Porto Alegre em 1890; um dos quatro primeiros diáconos
  (1893) e três primeiros presbíteros (1897); co-tradutor do Livro de Oração Comum com W. C. Brown.
sources:
- source: wp-en-kinsolving
  quote: >-
    of whom Vicente Brande, Antonio M. de Fraga and Americo V. Cabral would all serve the church for many years
ordinations:
- order: diaconate
  date: '1893-09-12'
  place: Sala de cultos da rua Riachuelo, Porto Alegre
  jurisdiction: dmsb
  ordained_by: george-william-peterkin
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Ordenação de quatro diáconos: Vicente Brande, Américo Vespúcio Cabral, Antônio Machado Fraga e Boaventura
      de Souza Oliveira.
  - source: wit-1952-03-20
    quote: >-
      the visit of Bishop Peterkin in 1893 when almost one hun- dred and fifty persons were confirmed and four Brazilians
      were ordained to the diaconate.
  - source: wp-en-kinsolving
    quote: >-
      West Virginia's bishop George Peterkin made an episcopal visit in 1893, during which he ordained four Brazilians
      as deacons
  - source: drv-kinsolving-ivo
    quote: A 12 de Setembro, na sala de cultos sita à rua Rachuelo
  - source: drv-kinsolving-ivo
    quote: a catequista Américo Vespúcio Cabral
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1893 - … Américo Vespúcio Cabral
    page: '369'
  - source: costa2021
    quote: >-
      Já Américo Vespúcio Cabral e Boaventura de Souza Oliveira foram ordenados no dia 08 de setembro de 1893, em
      Porto Alegre.
    page: '53'
  discrepancies:
  - field: date
    value: '1893-09-08'
    sources:
    - source: costa2021
      quote: >-
        Já Américo Vespúcio Cabral e Boaventura de Souza Oliveira foram ordenados no dia 08 de setembro de 1893,
        em Porto Alegre.
      page: '53'
  notes: >-
    Fato (4 diáconos por Peterkin em 1893) confirmado por várias fontes; o nome deste ordenando consta só em Kickhofel.
    A biografia (1961) diz 12/09/1893 na sala de cultos da rua Riachuelo (sentença com ruído de OCR, que nomeia
    'Américo Vespúcio Cabral'). Outra fonte (Costa, 2021, citada em outras páginas) dá 08/09/1893, em Porto Alegre.
    Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel, 1995); ordenante não informado.
- order: presbyterate
  date: '1897-05-13'
  jurisdiction: dmsb
  ordained_by: waite-hockin-stirling
  status: probable
  sources:
  - source: kickhofel
    quote: 'Ordenação dos três primeiros presbíteros: Cabral, Brande e Fraga.'
  - source: wp-en-kinsolving
    quote: >-
      Bishop Stirling ordained three of the Brazilian deacons to the priesthood (Peterkin having deposed the fourth).
  - source: drv-kinsolving-ivo
    quote: >-
      ordenou em presbíteros os diáconos Vicente Brande, Américo Vespúcio Cabral e Antônio Machado de Fraga.
  - source: costa2021
    quote: >-
      de maio de 1987, o bispo Stirling ordenou três dos diáconos brasileiros – Brande, Fraga e Cabral – para a
      ordem do presbiterato
    page: '54'
  notes: >-
    Stirling, bispo das Falkland (Igreja da Inglaterra), agiu a pedido de Peterkin. Nomes só em Kickhofel. Idem
    Vicente Brande. A tese escreve '13 de maio de 1987', erro evidente por 1897 (a visita de Stirling começou em
    6/5/1897).
events:
- type: other
  date: '1890-06-01'
  description: >-
    Chegada de Kinsolving e Morris (com quatro brasileiros) a Porto Alegre em 21/04/1890 e primeiro culto público
    em 1/06/1890 (domingo da Trindade).
  status: probable
  sources:
  - source: wp-en-kinsolving
    quote: The young Americans arrived at Porto Alegre on April 21, 1890, accompanied by four Brazilians
  - source: wp-en-ieab
    quote: where they held the first Anglican Mass in Portuguese on 1 June 1890.
- type: other
  date: '1893'
  description: >-
    Visita do bispo George W. Peterkin (Virgínia Ocidental) em 1893, enviado pelo Bispo Presidente: 142 confirmações,
    ordenação dos quatro primeiros diáconos brasileiros, nomeação de comissões e designações das capelas.
  status: confirmed
  sources:
  - source: wit-1952-03-20
    quote: >-
      the visit of Bishop Peterkin in 1893 when almost one hun- dred and fifty persons were confirmed and four Brazilians
      were ordained to the diaconate.
  - source: calvani-2005
    quote: Em 1893 foram ordenados os quatro primeiros diáconos brasileiros.
  - source: som-1893-11
    quote: >-
      The Presiding Bishop has sent one of our number, the Bishop of West Virginia, to visit the missions of this
      Church in the Republic of Brazil
  - source: wp-pt-ieab
    quote: >-
      No mesmo ano, a comunidade recebeu o bispo norte-americano George William Peterkin, que ordenou quatro diáconos.
- type: other
  date: '1892-05-23'
  description: >-
    Primeira convocação (não autorizada) da missão, Casa da Missão, Porto Alegre, 23-26/05/1892: presentes os revs.
    Morris, Brown, Meem e Kinsolving e os catequistas Boaventura, Brande e Cabral.
  status: probable
  sources:
  - source: kickhofel
    quote: >-
      Presentes: reverendos Morris, Brown, Meem e Kinsolving, e catequistas Boaventura, Brande e Cabral. Presidida
      por Kinsolving e secretariada por Cabral.
- type: other
  date: null
  description: >-
    Quatro brasileiros foram ordenados diáconos em 1893 pelo bispo Peterkin: Vicente Brande (28/08, Rio Grande),
    Antônio Machado Fraga (01/09, Pelotas), Américo Vespúcio Cabral (12/09, Porto Alegre) e Boaventura de Souza
    Oliveira (Santa Rita do Rio dos Sinos, após 12/09). A biografia dá datas diferentes da outra versão (08/09 para
    Cabral e Boaventura, em Porto Alegre).
  status: contested
  sources:
  - source: drv-kinsolving-ivo
    quote: >-
      Durante a sua permanência no Rio Grande do Sul, confirmara 142 pessoas e ordenara 4 mo- ços no diaconato.
