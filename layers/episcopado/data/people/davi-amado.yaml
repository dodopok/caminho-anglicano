# yaml-language-server: $schema=../../schemas/person.json
id: davi-amado
name: Davi Amado
full_name: Davi Amado de Souza
aliases:
- Davi Amado de Souza
biography: >-
  Davi Amado de Souza é de Campina Grande (PB). Como postulante, dirigia o Ponto Missionário Anglicano Vida, no
  bairro de Bodocongó, onde em 14/03/2010 ocorreu a primeira Confirmação de anglicanos na cidade. Foi ordenado diácono
  em 04/12/2010 por Robinson Cavalcanti, em ordenação que foi a centésima do episcopado deste. Foi ordenado presbítero
  em agosto de 2011. Em 2013 era ministro encarregado da Missão Anglicana Vida, em Campina Grande.
sources:
- source: d2s20-vida-confirma
  quote: O Ponto Missionário Anglicano Vida, no bairro de Bodocongó, dirigido pelo postulante Davi Amado
- source: d2s20-vida-confirma
  quote: >-
    A primeira Confirmação de anglicanos em Campina Grande, principal cidade do interior do Estado da Paraíba, aconteceu
    nesse domingo, 14 de marco.
- source: dar-2010-centesimo
  quote: >-
    o Bispo Robinson Cavalcanti ao conceder a Ordem Diaconal ao Candidato às Sagradas Ordens Davi Amado , de Campina
    Grande, Paraíba, estará ordenando o centésimo clérigo do seu ministério episcopal de treze anos. Na mesma ocasião
    a Revda. Sônia Santos , de Goianinha, Rio Grande do Norte, será a 86ª a receber a Ordem Presbiteral.
- source: dar-2010-sermao-xxx-concilio
