biography: >-
  Missionário da Igreja Episcopal Protestante dos EUA que tentou implantar o anglicanismo em português no Brasil
  entre 1860 e 1864 (Maranhão/Belém e Salvador), tradutor do Livro de Oração Comum; depois passou à Igreja Congregacional
  e ao movimento darbista. Nascido em Dundee (Escócia) em 1828; morreu em Lisboa em 1886.
