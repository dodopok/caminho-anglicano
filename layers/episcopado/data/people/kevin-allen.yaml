biography: >-
  Kevin Allen nasceu em 1954 e foi o primeiro bispo diocesano da Diocese de Cascadia (ACNA), sagrado em 30/9/2011,
  em Seattle, por Robert Duncan, arcebispo da ACNA. Anunciou em 2022 que se aposentaria e permaneceu no cargo até
  2024, quando seu sucessor foi sagrado.
