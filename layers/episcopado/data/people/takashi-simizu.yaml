id: takashi-simizu
name: Takashi Simizu
full_name: Takashi Simizu
aliases:
- SIMIZU, TAKASI
- Takasi Simizu
biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Pereira
  Barreto, São Paulo, Brasil. Ordenado diácono em fev/1962 e presbítero em jan/1963. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
sources:
- source: cd1965
  quote: b Pereira Barreto, SSo Paulo
- source: cd1968
  quote: SIMIZU, Takasi (CBra) Trans to Brazil Ch 25 Apr 65.
