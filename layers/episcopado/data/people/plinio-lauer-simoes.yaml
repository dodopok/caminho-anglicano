    quote: >-
      On March 4th the Rey. Plinio Lauer Simoes became the third, at a con- secration service at the Church of the
      Redeemer, Rio de Janeiro, where he had served as rector since 1950.
  - source: lc-1956-04-01
    quote: >-
      By appointment of the Presiding Bish- op, the consecrator was Bishop Melcher of Central Brazil. 'The co-consecrators
      were Bishop Bentley, Vice President of National Council, and Bishop Krischke of Southern Brazil.
  - source: ieab-sobre
    quote: >-
      A aposentadoria do bispo Pithan e a resignação do bispo Melcher levaram à sagração de mais dois bispos: o
      revmo. Plínio Lauer Simões, em 1956 e o revmo. Edmund Knox Sherrill, em 1959.
  - source: rta-gcj1958
    quote: >-
      we, Louis Chester Melcher, D.D., Bishop of Central Brazil; John Boyd Bentley, D.D., Vice President of the
      National Council; Egmont Machado Krischke, D.D., Bishop of Southern Brazil
  - source: rta-gcj1958
    quote: >-
      did on the Fourth Day of March, being the Third Sunday in Lent, in the year of Our Lord one thousand nine
      hundred and fifty-six, in the Church of the Redeemer in the City of Rio de Janeiro and the Country of Brazil
  - source: rta-gcj1958
    quote: Anglican Bishop of Argentina and Eastern South America with the Falkland Islands.
  - source: kickhofel-1995
    quote: >-
      Simões foi sagrado no dia quatro de março de 1956, no Rio de Janeiro, e recebeu o governo da diocese no concílio
      daquele ano realizado na Paróquia do Nazareno, em Santana do Livramento.
    page: '256'
  - source: costa2021
    quote: Em 04 de março de 1956 foi sagrado bispo da Diocese Sul-Ocidental.
    page: '73'
  notes: >-
    Sagração: 'Bp of SwBra' no verbete. O diretório não nomeia sagrante nem local. Anúncio (Witness 26/01/1956)
    e relato pós-evento (Living Church 01/04/1956) concordam. Apresentantes: Daniel Ivor Evans (bispo anglicano
    da Argentina e Falklands) e Krischke (substituindo Pithan, doente); Krischke também pregador. Presbíteros assistentes:
    J. Timóteo da Silva e Nemésio de Almeida; Edmund K. Sherrill foi registrador-adjunto. Certificado de sagração
    para o Distrito Missionário do Brasil Sudoeste. Daniel Ivor Evans, bispo anglicano da Argentina e América do
    Sul Oriental, assina como assistente; a posição de Melcher como principal vem do fato de ser o primeiro nome
    e de outras fontes. Sagrantes não informados.
