ordinations:
- order: diaconate
  date: 1941-12
  jurisdiction: dmsb
  ordained_by: william-matthews-merrick-thomas
  status: confirmed
  sources:
  - source: cd1965
    quote: D Dec 41 P Feb 43 Bp W M M Thomas,
  - source: kickhofel-1995
    quote: CLERO NACIONAL POR ORDEM DE ORDENAÇÃO AO DIACONATO … 1941 - … Plínio Lauer Simões
    page: '370'
  - source: kickhofel-1995
    quote: >-
      Cursou teologia no Seminário Teológico de Porto Alegre e foi ordenado ao diaconato em 1941 e ao presbiterado
      em 1943.
    page: '256'
  - source: ieablac-cd1947
    quote: D—Dec., 1941, P—Feb., 1943, Bp. W. M. M. Thomas.
  - source: ieablac-cd1950
    quote: D—Dec., 1941, P—Feb., 1943, Bp. W. M. M. Thom- as.
  - source: costa2021
    quote: >-
      Cursou Teologia no Seminário de Porto Alegre, sendo ordenado ao diaconato em 1941 e ao presbiterato em 1943.
    page: '73'
  notes: >-
    Ordenante no diretório conforme o verbete. O verbete é do distrito criado em 1949; antes disso o clero era do
    Distrito do Sul do Brasil. Ano tirado da lista do clero nacional por ordem de ordenação ao diaconato (Kickhöfel,
    1995); ordenante não informado. Um único 'Bp.' após D e P no diretório. A base tem apenas o ano (1941) e nenhum
    ordenante. Fonte: Clerical Directory (ed. 1947/1950), verbete de Simões. Convenção do diretório: 'D' = diácono,
    'P' = presbítero, 'Bp.' = bispo ordenante. Texto vindo de OCR do Internet Archive.
