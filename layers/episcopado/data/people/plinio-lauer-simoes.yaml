biography: >-
  Plínio Lauer Simões (1915-1994) foi ordenado diácono em dezembro de 1941 e presbítero em fevereiro de 1943, pelo
  bispo William Matthews Merrick Thomas, e de 1950 a 1956 pastoreou a Paróquia do Redentor, no Rio de Janeiro. Foi
  sagrado em 4 de março de 1956 bispo da Diocese Sul Ocidental por Louis C. Melcher, com Bentley e Egmont Krischke
  como cossagrantes, e a governou até 1975 (outra fonte indica dezembro de 1976). Foi primaz interino em 1971-1972
  e, eleito primaz em 1972, não aceitou o cargo; foi o primeiro bispo a propor que a Igreja estudasse a ordenação
  de mulheres. De 1977 a 1983 foi secretário-geral da IEAB, e aposentou-se no fim de 1983. Foi bispo sagrante do
  primeiro bispo da Igreja Lusitana, em Portugal. Faleceu em 6 de julho de 1994.
