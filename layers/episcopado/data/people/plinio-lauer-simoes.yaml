  - source: wit-1956-01-26
    quote: >-
      The Rev. Plinio Lauer Simoes will be consecrated bishop of Southwe'stern Brazil on March 4th at the Church
      of the Redeemer, Rio de Janeiro. Bishop Melcher of Central Brazil will be consecrator and Bishop Bentley,
      vice president of the National Council, and Bishop Krischke of Southern Brazil will be co-consecrators.
  - source: wp-en-histlist
    quote: '[[Louis C. Melcher|475]] [[John Boyd Bentley|379]] [[Egmont M. Kirschke|495]]'
  - source: lc-1956-04-01
    quote: >-
      On March 4th the Rey. Plinio Lauer Simoes became the third, at a con- secration service at the Church of the
      Redeemer, Rio de Janeiro, where he had served as rector since 1950.
  - source: lc-1956-04-01
    quote: >-
      By appointment of the Presiding Bish- op, the consecrator was Bishop Melcher of Central Brazil. 'The co-consecrators
      were Bishop Bentley, Vice President of National Council, and Bishop Krischke of Southern Brazil.
  - source: ieab-sobre
    quote: >-
      A aposentadoria do bispo Pithan e a resignação do bispo Melcher levaram à sagração de mais dois bispos: o
      revmo. Plínio Lauer Simões, em 1956 e o revmo. Edmund Knox Sherrill, em 1959.
  notes: >-
    Anúncio (Witness 26/01/1956) e relato pós-evento (Living Church 01/04/1956) concordam. Apresentantes: Daniel
    Ivor Evans (bispo anglicano da Argentina e Falklands) e Krischke (substituindo Pithan, doente); Krischke também
    pregador. Presbíteros assistentes: J. Timóteo da Silva e Nemésio de Almeida; Edmund K. Sherrill foi registrador-adjunto.
