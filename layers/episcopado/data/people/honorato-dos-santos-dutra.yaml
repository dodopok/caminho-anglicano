biography: >-
  Honorato dos Santos Dutra nasceu em Santa Helena (Pelotas) em 2/8/1899. Foi ordenado diácono em abril de 1951,
  por Athalício Pithan, no Distrito Missionário do Sul do Brasil, e foi transferido para a Igreja Episcopal do Brasil
  em 25/4/1965.
