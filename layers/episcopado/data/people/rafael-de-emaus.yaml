biography: >-
  Rafael de Emaús (Carlos Frederico Fiorino Carneiro), nascido em 05/02/1966, é formado em Direito pela Universidade
  do Estado do Rio de Janeiro, com habilitação em teologia pela Igreja Evangélica de Confissão Luterana no Brasil,
  e atua como juiz do trabalho em Chapecó (SC). Na Santa Igreja Celta do Brasil (SICB) foi ordenado diácono em 20/01/2018,
  presbítero em 21/04/2018 e consagrado bispo em 12/01/2019, segundo o site da SICB (outra página indica 13/05/2018
  como data em que se tornou bispo apostólico). Foi arcebispo da Região Sul e, em 27/04/2025, foi eleito arcebispo
  primaz da SICB, por aclamação, na I Reunião do Santo Sínodo Mundial.
sources:
