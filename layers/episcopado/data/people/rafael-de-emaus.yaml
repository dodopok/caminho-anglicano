- source: lvc-sicb-primaz
  quote: >-
    Na vida profissional, Dom Raphael de Emaús atua como Juiz do Trabalho, Titular da 1ª Vara do Trabalho de Chapecó,
    Santa Catarina.
- source: lvc-sicb-primaz
