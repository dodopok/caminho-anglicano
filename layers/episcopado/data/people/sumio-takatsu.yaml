    page: '288'
- type: other
  date: 1984-07
  description: >-
    Apresentou ao Sínodo de 1984 a proposta de ordenação feminina às três ordens, aprovada por unanimidade na Câmara
    dos Bispos
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Kratz faleceu em 4 de março de 1984, quatro meses antes do Sínodo aprovar a proposta da ordenação feminina,
      apresentada ao plenário sinodal pelo bispo Sumio Takatsu, por unanimidade na Câmara dos Bispos e com apenas
      dois votos contrários na Câmara dos Presbíteros e Leigos.
    page: '318'
