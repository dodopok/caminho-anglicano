      Paulo, pelo bispo primaz Arthur Rodolpho Kratz, sendo co-sagrantes os bispos Olavo Ventura Luiz, Plínio Lauer
      Simões, Elliot Lorenz Sorge e Agostinho Guilhon Sória.
    page: '288'
  notes: >-
    Confirma a data (12/06/1977) por fonte primária da TEC (notificação ao Presiding Bishop). Não nomeia sagrantes;
