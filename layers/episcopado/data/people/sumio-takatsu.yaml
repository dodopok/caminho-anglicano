  description: Eleito bispo da Diocese Sul Central na quinta votação; primeiro bispo celibatário da igreja
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Novo concílio foi realizado em 30 de abril de 1977, tendo desta vez sido eleito o reverendo Sumio Takatsu,
