      The Rev. Sumio Takatsu, 50, has been elected Bishop of South Central Diocese of the Episcopal Church in Brasil
      in Apostolic succession to the Rt. Rev. Elliott Sorge who resigned the see
  - source: sinopse-2003
    quote: 1977 - Sumio Takatsu (São Paulo)
  - source: kickhofel-1995
    quote: >-
      Sumio Takatsu foi sagrado no dia 12 de junho de 1977, na Igreja de São Paulo (Saint Paul's Church), em São
      Paulo, pelo bispo primaz Arthur Rodolpho Kratz, sendo co-sagrantes os bispos Olavo Ventura Luiz, Plínio Lauer
      Simões, Elliot Lorenz Sorge e Agostinho Guilhon Sória.
    page: '288'
  notes: >-
    Confirma a data (12/06/1977) por fonte primária da TEC (notificação ao Presiding Bishop). Não nomeia sagrantes;
    o sagrante principal Kratz continua dependendo só de Costa (2021). Costa cita Kickhofel 1995. Eleito em 30/04/1977
    (Costa) ou 20/04/1977 (Wikipedia PT, citando Kickhofel 2006). A tese cita KICKHÖFEL (1995, p. 288) para o fato.
