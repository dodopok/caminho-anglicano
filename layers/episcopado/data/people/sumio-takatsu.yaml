wikidata: Q138963123
biography: >-
  Nascido em Sapporo (Japão) em 1927, foi ordenado diácono em 05/11/1955 e presbítero em 30/09/1956, por Louis Chester
  Melcher, no Distrito Missionário do Brasil Central, e transferido para a Igreja Episcopal do Brasil em 25/04/1965.
  Eleito em 30/04/1977, na quinta votação, segundo bispo de São Paulo (Diocese Sul Central), foi sagrado em 12/06/1977
  por Arthur Rodolpho Kratz e dirigiu a diocese até renunciar, no final de 1989. Em 1979 recebeu o título de Doutor
  Honoris Causa do Seminário da Virgínia e, em 1984, apresentou ao Sínodo a proposta de ordenação de mulheres, aprovada.
  Faleceu em 23/01/2004, data em que o calendário da IEAB o comemora. Participou de duas ordenações de diáconos
  ou presbíteros e de três sagrações episcopais, entre elas a de Jubal Pereira Neves, de quem foi sagrante principal,
  e a de Sydney Alcoba Ruiz.
