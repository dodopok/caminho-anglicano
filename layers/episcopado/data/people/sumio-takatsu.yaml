events:
- type: other
  date: '1977-04-30'
  description: Eleito bispo da Diocese Sul Central na quinta votação; primeiro bispo celibatário da igreja
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Novo concílio foi realizado em 30 de abril de 1977, tendo desta vez sido eleito o reverendo Sumio Takatsu,
      que veio a ser o primeiro bispo celibatário (209) e que disputou o cargo com os dois candidatos mais votados
      no concílio anterior. O número de votos necessários saiu na quinta votação.
    page: '287'
- type: other
  date: '1979'
  description: Recebeu o título de Doutor Honoris Causa do Seminário da Virgínia
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      (210) Em 1979, recebeu o titulo de Doutor Honoris Causa do Seminário de Virginia por sua dedicação aos estudos
      teológicos e interesse na educação teológica no Brasil.
    page: '288'
- type: other
  date: 1984-07
  description: >-
    Apresentou ao Sínodo de 1984 a proposta de ordenação feminina às três ordens, aprovada por unanimidade na Câmara
    dos Bispos
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Kratz faleceu em 4 de março de 1984, quatro meses antes do Sínodo aprovar a proposta da ordenação feminina,
      apresentada ao plenário sinodal pelo bispo Sumio Takatsu, por unanimidade na Câmara dos Bispos e com apenas
      dois votos contrários na Câmara dos Presbíteros e Leigos.
    page: '318'
- type: other
  date: '1977-04-30'
  description: >-
    Sumio Takatsu eleito segundo bispo de São Paulo (após dois Concílios Extraordinários em 1976-1977 sem quórum
    para Jaci Maraschin e Saulo Marques da Silva)
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em 30 de abril de 1977, o reverendo Sumio Takatsu 74 foi eleito para se tornar o segundo bispo de São Paulo
    page: '87'
