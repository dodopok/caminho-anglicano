biography: >-
  Jesse Krebs Appel foi ordenado diácono em novembro de 1930 e presbítero em agosto de 1933, por William Matthews
  Merrick Thomas, e atuou como clérigo do Distrito Missionário do Brasil Meridional, em Porto Alegre, até morrer
  em 29 de julho de 1960.
