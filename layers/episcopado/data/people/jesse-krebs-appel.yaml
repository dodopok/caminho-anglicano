biography: >-
  Jesse Krebs Appel nasceu em 13/1/1909. Foi ordenado diácono em novembro de 1930 e presbítero em agosto de 1933,
  por William Matthews Merrick Thomas, e foi reitor da Igreja da Trindade, em Porto Alegre, a partir de 1936. Atuou
  como clérigo do Distrito Missionário do Sul do Brasil até morrer, em 29/7/1960.
