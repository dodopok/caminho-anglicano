name: Antônio Carlos Silva Santos
full_name: Antônio Carlos Silva Santos
biography: >-
  Bispo auxiliar de São Paulo e vigário judicial da província da WAC no Brasil. Ordenado presbítero em 07/08/2021;
  sagrado bispo em 14/07/2024 no Sínodo de Imbituba (SC). Os sagrantes não são nomeados nas fontes consultadas.
