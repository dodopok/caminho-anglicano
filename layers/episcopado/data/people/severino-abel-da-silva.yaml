events:
- type: other
  date: '2004-09-01'
  description: >-
    Documento 'Não sairemos', assinado pelo bispo sufragâneo Filadelfo Oliveira e clérigos e leigos da Diocese Anglicana
    do Recife, reafirmando o vínculo com a IEAB independentemente das decisões do diocesano.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em 1º de setembro de 2004, foi publicado o texto intitulado Não sairemos, o primeiro documento que enfrentou
      Robinson quando este sinalizou que romperia com a Província, assinado pelo bispo sufragâneo, Filadelfo Oliveira,
      e vários outros clérigos e leigos da Diocese
    page: '217'
  - source: costa2021
    quote: >-
      Assinaram este documento: Dom Filadelfo Oliveira Neto, ose (Bispo Sufragâneo da DAR); Revmo. Sérgio L. Andrade
      (Deão da Catedral Anglicana da SS. Trindade)
    page: '217'
- type: other
  date: 1998-01
  description: >-
    Primeira eucaristia anglicana do grupo que formaria a Paróquia da Natividade, em Natal (RN), na Igreja Metodista
    do Natal, presidida pelo Rev. Washington Franco, com a presença do Rev. Jorge Aquino e de Frei Severino Abel.
  status: probable
  sources:
  - source: d2s30-historia
    quote: >-
      Era o primeiro Domingo de 1998 e presente, para presidir a primeira Eucaristia, estava o Rev. Washington Franco,
      então reitor da Paróquia da Ressurreição em João Pessoa, Paraíba.
- type: other
  date: '1999-07-31'
  description: >-
    Recepção de quatro ministros oriundos de outras denominações, ordenados diáconos em 31/07/1999 após período
    de retreinamento e cumprimento dos requisitos canônicos: Severino Abel (ex-capuchinho) e três ex-pastores presbiterianos,
    entre eles Luiz Marcos e Jorge Aquino.
  status: probable
  sources:
  - source: d2s28-m15
    quote: Eles têm passado por um período de retreinamento e de cumprimento dos requisitos canônicos
  - source: d2s28-m15
    quote: Os outros três ordinandos são todos ex-pastores presbiterianos
