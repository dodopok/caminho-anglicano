  role: clergy
  diocese: ieab-dar
  status: confirmed
  sources:
  - source: ieab-2004-decreto-recife
    quote: 'Considerando a solicitação dos clérigos e clérigas a seguir relacionados:'
  - source: ieab-2004-decreto-recife
    quote: Rev. Severino Abel da Silva, ose (Paróquia Jesus de Nazaré)
  - source: dar-clero-diocesano
    quote: CLERO DIOCESANO
  - source: dar-clero-diocesano
    quote: Revdo. Severino Abel da Silva
  - source: costa2021
    quote: >-
      Considerando a solicitação dos clérigos e clérigas a seguir relacionados: … Rev. Severino Abel da Silva, ose
      (Paróquia Jesus de Nazaré)
    page: '545'
  - source: costa2021
    quote: Rev. Severino Abel da Silva, ose (Paróquia Jesus da Nazaré)
    page: '217'
  - source: d2s32-decreto-camara
    quote: Rev. Severino Abel da Silva, ose (Paróquia Jesus de Nazaré)
  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Paróquia Jesus de
    Nazaré; OSE Listado no clero diocesano da DAR (página consultada em 2026-10). Anexo K: em 2004 era clérigo(a)
    da Diocese Anglicana do Recife e foi um dos 13 que pediram à Câmara dos Bispos supervisão episcopal alternativa
    (decreto de 16/09/2004), mantendo a comunhão com a IEAB. Início e fim do vínculo não informados. Signatário
    de 'Não sairemos' (01/09/2004): permaneceu na IEAB na crise de 2004-2005. Local: Paróquia Jesus de Nazaré. Relacionado
    no decreto da Câmara dos Bispos da IEAB (16/09/2004) entre os clérigos da Diocese Anglicana do Recife que, segundo
    o decreto, solicitaram supervisão episcopal especial; em exercício em setembro de 2004.
