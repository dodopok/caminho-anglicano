# yaml-language-server: $schema=../../schemas/person.json
id: severino-abel-da-silva
name: Severino Abel da Silva
biography: >-
  Ordenado diácono em 31/07/1999 e presbítero em 19/04/2000, em Natal, ambos por Robinson Cavalcanti, foi clérigo
  da Paróquia Jesus de Nazaré, da Diocese Anglicana do Recife (IEAB), e consta entre os clérigos relacionados no
  decreto da IEAB de 2004 para essa diocese.
sources:
- source: rcor-drv-ord-ose-1999
  quote: ORDENAÇÃO DE DIÁCONOS E INSTITUIÇÃO DA ORDEM EVANGÉLICA DE SANTO ESTEVÃO MÁRTIR - 31/07/99.
- source: rcor-drv-presb-jorge-abel
  quote: MENSAGEM AO PRESBITERADO DE JORGE & ABEL
- source: rcor-drv-presb-jorge-abel
  quote: >-
    Como bispo, sinto-me honrado em presidir este momento histórico, das primeiras ordenações anglicanas em terras
    potiguares.
- source: ieab-2004-decreto-recife
  quote: Rev. Severino Abel da Silva, ose (Paróquia Jesus de Nazaré)
- source: ieab-2004-decreto-recife
  quote: 'Considerando a solicitação dos clérigos e clérigas a seguir relacionados:'
- source: dar-clero-diocesano
  quote: Revdo. Severino Abel da Silva
- source: d2s28-m15
  quote: >-
    Gostaria de destacar a Severino Abel, o ex capuchinho e incansável evangelizador da periferia de Natal, Rio
    Grande do Norte
ordinations:
- order: diaconate
  date: '1999-07-31'
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-ord-ose-1999
    quote: ORDENAÇÃO DE DIÁCONOS E INSTITUIÇÃO DA ORDEM EVANGÉLICA DE SANTO ESTEVÃO MÁRTIR - 31/07/99.
  - source: rcor-drv-ord-ose-1999
    quote: Os quatro primeiros estão aqui esta noite. Gostaria de destacar a Severino Abel
  notes: >-
    Ordenação diaconal de quatro 'ministros em trânsito' vindos de outras denominações (Severino Abel, ex-capuchinho;
    Ricardo Múcio, Luiz Marcos e Jorge Aquino, ex-presbiterianos), no culto em que se instituiu a Ordem de Santo
    Estêvão. O pregador fala como bispo diocesano ('Em 17 meses do nosso episcopado'), isto é, Robinson Cavalcanti.
    Local não informado (o texto menciona 'esta catedral').
- order: presbyterate
  date: '2000-04-19'
  place: Natal-RN
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: probable
  sources:
  - source: rcor-drv-presb-jorge-abel
    quote: MENSAGEM AO PRESBITERADO DE JORGE & ABEL
  - source: rcor-drv-presb-jorge-abel
    quote: Natal, 19/04/2000.
  - source: rcor-drv-presb-jorge-abel
    quote: >-
      Como bispo, sinto-me honrado em presidir este momento histórico, das primeiras ordenações anglicanas em terras
      potiguares.
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti), que preside as primeiras ordenações anglicanas no Rio Grande
    do Norte. 'Jorge' e 'Abel' são Jorge Aquino e Severino Abel da Silva, ordenados diáconos juntos em 31/07/1999.
affiliations:
- jurisdiction: ieab-dar
  role: other
  role_description: fundador (Missão da Natividade, Natal, RN)
  start: '1998'
  status: probable
  sources:
  - source: d2s30-historia
    quote: >-
      Juntamente com o Rev. Aquino, aquele culto marcou também a chegada do Frei Severino Abel, este oriundo da
      Ordem dos capuchinhos.
  - source: d2s30-historia
    quote: >-
      Rev. Jorge Aquino e o Rev. Severino Abel empreenderam mensalmente, durante todo o ano de 1998, viagens a Recife
  notes: >-
    Chegou à comunidade de Natal no primeiro culto anglicano, no primeiro domingo de 1998, vindo da Ordem dos Capuchinhos;
    com Jorge Aquino trabalhou na formação das comunidades que originaram a Missão da Natividade.
