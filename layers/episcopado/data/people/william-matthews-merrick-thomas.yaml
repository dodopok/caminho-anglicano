  discrepancies:
  - field: place
    value: Igreja de São Bartolomeu, Nova York (EUA)
    sources:
    - source: kickhofel-1995
      quote: >-
        O reverendo William M.M.Thomas que, durante 13 de seus 45 anos de Brasil, foi o fundador e diretor do Colégio
        Cruzeiro do Sul, foi indicado por Kinsolving e eleito pela Convenção Geral e sagrado no dia 28 de dezembro
        de 1925, na igreja de São Bartolomeu em Nova York.
  notes: >-
    Holy Innocents Day = 28 de dezembro. Apresentantes: John Gardner Murray (Maryland) e Philip Cook (Delaware);
    pregador: William Cabell Brown (bispo da Virgínia); litania: Henry St. George Tucker (Living Church 09/01/1926).
    Spirit of Missions e Living Church o chamam 'Suffragan'; Wikipédia (artigo Thomas) diz 'coadjutor'. Talbot teve
    sete bispos assistentes, entre eles Kinsolving e Brown (pregador). Pregador: William Cabell Brown, bispo da
    Virgínia e presidente da Câmara dos Bispos (Kickhöfel, 1995, p. 152). O próprio livro diverge: no capítulo "14.
    O Segundo Bispo" diz São Bartolomeu, em Nova York; na p. 152 (e nas demais fontes), Igreja de São Paulo, em
    Baltimore. São Bartolomeu, em Nova York, foi onde Kinsolving foi sagrado em 1899, o que sugere confusão no capítulo.
    Trecho citado pela tese de KICKHÖFEL, Notas para uma História da IEAB (1995), p. 152. 'Todos os oito bispos
    presentes participaram da tradicional imposição das mãos'; pregador William Cabell Brown.
