  - source: som-1926-01
    quote: >-
      The Right Rev. William M. M. Thomas, Suffragan for Southern Brazil, was consecrated on Holy Innocents Day
      in St. Paul's Church, Baltimore, by Bishops. Talbot, Kinsolving and Che­ shire.
  - source: wp-en-histlist
    quote: '[[Ethelbert Talbot|143]] [[Joseph Blount Cheshire|172]] [[Lucien Lee Kinsolving|MB1]]'
  - source: kickhofel
    quote: 1925 - Thomas é eleito e sagrado bispo sufragâneo.
  - source: lc-1926-01-09
    quote: >-
      Monday December 28, 1925, in St. Paul's Church, Baltimore, the Rev. William Matthew's Merrick Thomas, D.D.,
      was consecrated a Bishop in the Church of God, by the Most Rey. Ethelbert Talbot, D.D., LL.D., Bishop of Bethlehem
      and Presiding Bishop of the American Church, assisted by the Rt. Rev. Drs. Joseph Blount Cheshire, Bishop
      of North Carolina, and Lucien Lee Kinsolving, Bishop of South- ern Brazil.
  - source: ieab-sobre
    quote: >-
      Em 1925, a Igreja teve o seu segundo bispo: o revmo. William Matthew Merrick Thomas, um missionário que havia
      chegado ao Brasil em 1904. Primeiro como bispo sufragâneo e depois como bispo diocesano
  - source: kickhofel-1995
    quote: >-
      Thomas foi sagrado bispo no dia 28 de dezembro de 1925, na Igreja de São Paulo, em Baltimore, Estados Unidos,
      em cerimônia presidida pelo bispo presidente da Igreja Protestante Episcopal dos Estados Unidos, Ethelbert
      Talbot, sendo co-sagrantes Joseph Blount Chesire, de Carolina do Norte, e Lucien Lee Kinsolving, do Brasil.
      Todos os oito bispos presentes participaram da tradicional imposição das mãos.
    page: '152'
  - source: kickhofel-1995
    quote: >-
      O reverendo William M.M.Thomas que, durante 13 de seus 45 anos de Brasil, foi o fundador e diretor do Colégio
      Cruzeiro do Sul, foi indicado por Kinsolving e eleito pela Convenção Geral e sagrado no dia 28 de dezembro
      de 1925, na igreja de São Bartolomeu em Nova York.
  - source: costa2021
    quote: >-
      Thomas foi sagrado bispo no dia 28 de dezembro de 1925, na Igreja de São Paulo, em Baltimore, Estados Unidos,
      em cerimônia presidida pelo bispo presidente da Igreja Protestante Episcopal dos Estados Unidos, Ethelbert
      Talbot, sendo co-sagrantes Joseph Blount Cherise, de Carolina do Norte, e Lucien Lee Kinsolving, do Brasil.
    page: '61'
  discrepancies:
  - field: place
    value: Igreja de São Bartolomeu, Nova York (EUA)
    sources:
    - source: kickhofel-1995
      quote: >-
        O reverendo William M.M.Thomas que, durante 13 de seus 45 anos de Brasil, foi o fundador e diretor do Colégio
        Cruzeiro do Sul, foi indicado por Kinsolving e eleito pela Convenção Geral e sagrado no dia 28 de dezembro
        de 1925, na igreja de São Bartolomeu em Nova York.
  notes: >-
    Holy Innocents Day = 28 de dezembro. Apresentantes: John Gardner Murray (Maryland) e Philip Cook (Delaware);
    pregador: William Cabell Brown (bispo da Virgínia); litania: Henry St. George Tucker (Living Church 09/01/1926).
    Spirit of Missions e Living Church o chamam 'Suffragan'; Wikipédia (artigo Thomas) diz 'coadjutor'. Pregador:
    William Cabell Brown, bispo da Virgínia e presidente da Câmara dos Bispos (Kickhöfel, 1995, p. 152). O próprio
    livro diverge: no capítulo "14. O Segundo Bispo" diz São Bartolomeu, em Nova York; na p. 152 (e nas demais fontes),
    Igreja de São Paulo, em Baltimore. São Bartolomeu, em Nova York, foi onde Kinsolving foi sagrado em 1899, o
    que sugere confusão no capítulo. Trecho citado pela tese de KICKHÖFEL, Notas para uma História da IEAB (1995),
    p. 152. 'Todos os oito bispos presentes participaram da tradicional imposição das mãos'; pregador William Cabell
    Brown.
