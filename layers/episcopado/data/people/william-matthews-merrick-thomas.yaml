biography: >-
  Formado no Virginia Theological Seminary, chegou ao Brasil em 1904, quando foi ordenado diácono; foi ordenado
  presbítero em 1905 por Lucien Lee Kinsolving e lecionou na escola teológica de Rio Grande. Fundou em 1912 a Southern
  Cross School, em Porto Alegre. Eleito bispo sufragâneo em outubro de 1925, foi sagrado em 28/12/1925 por Ethelbert
  Talbot, em Baltimore, e de 1928 a 30/09/1949, quando se aposentou, foi bispo missionário do Sul do Brasil; em
  1939 pediu um bispo sufragâneo, e Athalício Pithan foi eleito. Ordenou 61 diáconos e presbíteros e sagrou um bispo,
  Athalício Pithan. Morreu em 18/09/1951.
