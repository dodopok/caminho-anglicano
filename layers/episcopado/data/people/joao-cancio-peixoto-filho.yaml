  description: >-
    Reconhecimento das sagradas ordens do Rev. Martorelli Dantas da Silva pelo bispo João Peixoto (Diocese Anglicana
    do Recife, IEAB), que o instalou como pároco da Paróquia Anglicana da Santíssima Trindade
  status: confirmed
  sources:
  - source: dar-2023-martorelli
    quote: >-
      No último dia 04 de junho, o nosso Bispo Diocesano Dom João Cancio Peixoto Filho, em solenidade celebrada
