id: joao-cancio-peixoto-filho
name: Joao Cancio Peixoto Filho
aliases:
- Bispo Peixoto
- Dom João Peixoto
- João C. Peixoto Filho
- João Peixoto
biography: >-
  Bispo diocesano da Diocese Anglicana do Recife (IEAB) desde 2013; ordenado diácono em 2003 e presbítero em 2005;
  ex-reitor do SAET.
sources:
- source: dar-2023-peixoto10
  quote: >-
    Ordenado ao diaconato no ano de 2003 e ao presbiterato em 2005, João Peixoto também foi reitor do Seminário
    Anglicano de Estudos Teológicos (SAET).
ordinations:
- order: diaconate
  date: '2003'
  jurisdiction: ieab
  status: confirmed
  sources:
  - source: dar-2023-peixoto10
    quote: >-
      Ordenado ao diaconato no ano de 2003 e ao presbiterato em 2005, João Peixoto também foi reitor do Seminário
      Anglicano de Estudos Teológicos (SAET).
  - source: dar-2026-peixoto-traj
    quote: até chegar à ordenação como diácono, em 2003, e posteriormente como presbítero.
  notes: >-
    Diocese do Recife (IEAB), então sob o bispo Robinson Cavalcanti. Ordenante não informado. | Segunda fonte (mesmo
    publicador) para o diaconato de 2003.
- order: presbyterate
  date: '2005'
  jurisdiction: ieab
  status: confirmed
  sources:
  - source: dar-2023-peixoto10
    quote: Ordenado ao diaconato no ano de 2003 e ao presbiterato em 2005
  notes: >-
    Ano da separação da Diocese do Recife; ordenante não informado (verificar se foi antes ou depois da divisão
    de 2005).
- order: episcopate
  date: '2013-12-14'
  place: Catedral Anglicana da Santíssima Trindade, Espinheiro, Recife (PE)
  jurisdiction: ieab
  office: diocesan
  principal_consecrator: francisco-de-assis-da-silva
  co_consecrators:
  - filadelfo-oliveira
  - filadelfo-oliveira-neto
  - mauricio-andrade
  - saulo-barros
  - saulo-mauricio-de-barros
  - sebastiao-gameleira
  status: contested
  sources:
  - source: dar-2023-peixoto10
    quote: >-
      A cerimônia de sagração aconteceu no dia 14 de dezembro de 2013, na Catedral Anglicana da Santíssima Trindade,
      no bairro do Espinheiro. Estiveram presentes o Primaz da Igreja Episcopal Anglicana do Brasil, Dom Francisco
      de Assis da Silva, que presidiu a liturgia. Os demais co-sagrantes foram os bispos Sebastião Gameleira, Maurício
      Andrade, Saulo Barros e Filadelfo Oliveira.
  - source: costa2021
    quote: >-
      A cerimônia foi presidida pelo Bispo Primaz, Francisco de Assis da Silva, e os demais co-sagrantes foram os
      bispos Sebastião Gameleira, Maurício Andrade, Saulo de Barros e Filadelfo Oliveira.
  - source: costa2021
    quote: >-
      sagração ocorreu na noite de 14 de dezembro de 2013, na Catedral da Santíssima Trindade, na capital pernambucana
  - source: wp-pt-joao-cancio
    quote: >-
      Em novembro de 2013 foi eleito Bispo da Diocese Anglicana do Recife, sendo sagrado em 14 de dezembro de 2013
  discrepancies:
  - field: place
    value: Catedral da Santissima Trindade, Recife (bairro do Espinheiro)
    sources:
    - source: costa2021
      quote: >-
        A cerimônia foi presidida pelo Bispo Primaz, Francisco de Assis da Silva, e os demais co-sagrantes foram
        os bispos Sebastião Gameleira, Maurício Andrade, Saulo de Barros e Filadelfo Oliveira.
    - source: costa2021
      quote: >-
        sagração ocorreu na noite de 14 de dezembro de 2013, na Catedral da Santíssima Trindade, na capital pernambucana
    - source: wp-pt-joao-cancio
      quote: >-
        Em novembro de 2013 foi eleito Bispo da Diocese Anglicana do Recife, sendo sagrado em 14 de dezembro de
        2013
  notes: >-
    Bispo diocesano da Diocese Anglicana do Recife (IEAB). Co-sagrantes na forma curta dada pela fonte (exceto Maurício
    Andrade, cujo nome completo consta da página de dioceses da IEAB); nomes completos a confirmar. Eleito em 16/11/2013
    no 32o Sinodo Geral (Rio de Janeiro).
