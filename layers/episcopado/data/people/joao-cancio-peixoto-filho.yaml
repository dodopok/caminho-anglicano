  - sebastiao-gameleira
  status: confirmed
  sources:
  - source: costa2021
    quote: >-
      A cerimônia foi presidida pelo Bispo Primaz, Francisco de Assis da Silva, e os demais co-sagrantes foram os
      bispos Sebastião Gameleira, Maurício Andrade, Saulo de Barros e Filadelfo Oliveira.
  - source: costa2021
    quote: >-
      sagração ocorreu na noite de 14 de dezembro de 2013, na Catedral da Santíssima Trindade, na capital pernambucana
  - source: wp-pt-joao-cancio
    quote: >-
      Em novembro de 2013 foi eleito Bispo da Diocese Anglicana do Recife, sendo sagrado em 14 de dezembro de 2013
  - source: ec-2017-01
    quote: >-
      No XXXII Sínodo Geral, foi eleito o Revmo. João Cancio Peixoto bispo coadjutor do Recife, sendo sagrado em
      dezembro de 2013.
  - source: dar-2023-peixoto10
    quote: >-
      A cerimônia de sagração aconteceu no dia 14 de dezembro de 2013, na Catedral Anglicana da Santíssima Trindade,
      no bairro do Espinheiro. Estiveram presentes o Primaz da Igreja Episcopal Anglicana do Brasil, Dom Francisco
      de Assis da Silva, que presidiu a liturgia. Os demais co-sagrantes foram os bispos Sebastião Gameleira, Maurício
      Andrade, Saulo Barros e Filadelfo Oliveira.
  - source: costa2021
    quote: >-
      O rito de sagração ocorreu na noite de 14 de dezembro de 2013, na Catedral da Santíssima Trindade, na capital
      pernambucana
    page: '115'
  - source: costa2021
    quote: >-
      A cerimônia de sagração aconteceu no dia 14 de dezembro de 2013, na Catedral da Santíssima Trindade, no bairro
      do Espinheiro.
    page: '243'
  - source: costa2021
    quote: >-
      Primaz da Igreja Anglicana no Brasil, dom Francisco de Assis da Silva, que presidiu a liturgia. Os demais
      co-sagrantes foram os bispos Sebastião Gameleira, Maurício Andrade, Saulo Barros e Filadelfo Oliveira.
    page: '243'
  notes: >-
    Eleito em 16/11/2013 no 32o Sinodo Geral (Rio de Janeiro). O Estandarte (jan/2017) diz que foi eleito "bispo
    coadjutor do Recife"; Costa e Wikipedia dizem bispo diocesano. Bispo diocesano da Diocese Anglicana do Recife
    (IEAB). Co-sagrantes na forma curta dada pela fonte (exceto Maurício Andrade, cujo nome completo consta da página
    de dioceses da IEAB); nomes completos a confirmar. Eleito no 32º Sínodo (nov. 2013). Local conforme a tese (o
    templo histórico da Trindade ficou com a IECB em 2002 — ver dúvidas). 5º bispo diocesano da Diocese Anglicana
    do Recife (IEAB), eleito no 32º Sínodo Geral (16/11/2013). A tese chama Francisco de Assis da Silva de 'Primaz
    da Igreja Anglicana no Brasil' (sic, é o Primaz da IEAB) e diz que ele presidiu; 'os demais co-sagrantes' sugere
    que ele também é contado como sagrante. Primeira sagração feita numa catedral da diocese.
