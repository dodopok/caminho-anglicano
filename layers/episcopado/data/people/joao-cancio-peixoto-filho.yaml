biography: >-
  Nascido no Recife em 17/05/1961, ingressou na IEAB em março de 1983 e foi ordenado diácono em 26/07/2003, por
  Robinson Cavalcanti, e presbítero em 2005. Em 2004 esteve entre os signatários de "Para além das trincheiras",
  que pedia reconciliação na Diocese Anglicana do Recife. Eleito bispo da diocese em novembro de 2013, foi sagrado
  em 14/12/2013, na Catedral da Santíssima Trindade, em cerimônia presidida pelo primaz Francisco de Assis da Silva,
  com Sebastião Gameleira, Maurício Andrade, Saulo de Barros e Filadelfo Oliveira como co-sagrantes, e é bispo diocesano
  desde então. Descreve a diocese recebida como fragilizada após o cisma, e em 2016 cinco templos ocupados pelo
  grupo de Robinson foram devolvidos à IEAB. Reconheceu as ordens de Martorelli Dantas da Silva (2023) e de Osiel
  Ferreira de Assunção (agosto de 2026).
