    page: '243'
  notes: >-
    Eleito em 16/11/2013 no 32o Sinodo Geral (Rio de Janeiro). O Estandarte (jan/2017) diz que foi eleito "bispo
    coadjutor do Recife"; Costa e Wikipedia dizem bispo diocesano. Bispo diocesano da Diocese Anglicana do Recife
    (IEAB). Co-sagrantes na forma curta dada pela fonte (exceto Maurício Andrade, cujo nome completo consta da página
    de dioceses da IEAB); nomes completos a confirmar. Eleito em 16 de novembro de 2013 no 32º Sínodo Geral (Rio
    de Janeiro), após escolha unânime do nome em concílio diocesano de abril de 2013. Nota do site da Diocese Anglicana
    do Recife por ocasião dos 10 anos de episcopado de Peixoto. Diz que o primaz Francisco de Assis da Silva 'presidiu
    a liturgia' e que os 'demais co-sagrantes' foram Gameleira, Maurício Andrade, Saulo Barros e Filadelfo Oliveira;
    a leitura de que Francisco de Assis foi o sagrante principal decorre dessa formulação. Peixoto foi eleito em
    16/11/2013, no 32º Sínodo Geral (Rio de Janeiro). Convite assinado pelo Bispo Primaz Dom Francisco de Assis
    da Silva; não lista sagrantes. Eleito no 32º Sínodo (nov. 2013). Local conforme a tese (o templo histórico da
    Trindade ficou com a IECB em 2002 — ver dúvidas). 5º bispo diocesano da Diocese Anglicana do Recife (IEAB),
    eleito no 32º Sínodo Geral (16/11/2013). A tese chama Francisco de Assis da Silva de 'Primaz da Igreja Anglicana
    no Brasil' (sic, é o Primaz da IEAB) e diz que ele presidiu; 'os demais co-sagrantes' sugere que ele também
    é contado como sagrante. Primeira sagração feita numa catedral da diocese.
