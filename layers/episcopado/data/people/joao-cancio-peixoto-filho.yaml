  discrepancies:
  - field: place
    value: Catedral Anglicana da Santíssima Trindade, Espinheiro, Recife (PE)
    sources:
    - source: dar-2023-peixoto10
      quote: >-
        A cerimônia de sagração aconteceu no dia 14 de dezembro de 2013, na Catedral Anglicana da Santíssima Trindade,
        no bairro do Espinheiro. Estiveram presentes o Primaz da Igreja Episcopal Anglicana do Brasil, Dom Francisco
