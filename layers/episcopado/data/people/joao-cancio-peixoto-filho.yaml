- order: episcopate
  date: '2013-12-14'
  place: Catedral da Santíssima Trindade (Rua Alfredo de Medeiros, Espinheiro), Recife
  jurisdiction: ieab
  office: diocesan
  principal_consecrator: francisco-de-assis-da-silva
  co_consecrators:
  - filadelfo-oliveira-neto
  - mauricio-andrade
