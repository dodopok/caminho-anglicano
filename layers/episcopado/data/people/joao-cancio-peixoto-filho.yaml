- type: other
  date: '2013'
  description: >-
    Dom João Peixoto descreve a Diocese do Recife (IEAB) recebida em 2013 como fragilizada após o cisma: sem patrimônio,
    com poucos clérigos e em crise financeira, seguida de batalhas judiciais
  status: confirmed
  sources:
  - source: dar-2026-peixoto-traj
    quote: >-
      “Recebemos uma Diocese fragilizada, sem patrimônio, com poucos clérigos e em crise financeira. Foi um período
      muito difícil”, afirma. A partir daí, iniciou-se um processo de reconstrução institucional que envolveu batalhas
      judiciais
