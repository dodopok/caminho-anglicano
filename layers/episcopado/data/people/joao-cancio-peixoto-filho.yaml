      João Câncio ingressou na IEAB em março de 1983, através de um Encontro de Jovens com Cristo da Catedral da
      Santíssima Trindade.
    page: '243'
  - source: costa2021
    quote: >-
      Dentre essas pessoas que permaneceram na IEAB, se encontravam os reverendos Sérgio Andrade e João Câncio Peixoto.
    page: '203'
  notes: >-
    Clérigo(a) da DAR em setembro de 2004, entre os 13 que pediram à Câmara dos Bispos supervisão episcopal especial
    por divergência com o bispo Robinson Cavalcanti — isto é, o grupo que permaneceu na IEAB. Futuro bispo diocesano
    do Recife (2013) Anexo K: em 2004 era clérigo(a) da Diocese Anglicana do Recife e foi um dos 13 que pediram
    à Câmara dos Bispos supervisão episcopal alternativa (decreto de 16/09/2004), mantendo a comunhão com a IEAB.
    Início e fim do vínculo não informados. Leigo desde 1983; diácono 2003, presbítero 2005. Ficou na IEAB em 2002
    (não seguiu Paulo Garcia) e em 2004-2005 (assinou 'Para além das trincheiras' e 'Não sairemos'). Reitor do SAET
    por sete anos no episcopado de Sebastião. Fim = sagração.
