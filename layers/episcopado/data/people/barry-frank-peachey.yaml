id: barry-frank-peachey
name: Barry Frank Peachey
full_name: Barry Frank Peachey
aliases:
- Barry Peachey
- Frank Peachey
biography: >-
  Barry Frank Peachey foi sagrado bispo em 5 de junho de 2005, em High Legh (Cheshire, Inglaterra), por Norman Sydney
  Dutton, e a Igreja Anglicana Tradicional do Brasil (IATB) o aponta como seu consagrante. Descrito como bispo in
  Anglia, bispo regionário dos Midland Counties da Inglaterra e chanceler metropolitano da Anglican Independent
  Communion Worldwide, foi também bispo titular de Vera Cruz e membro honorário da Câmara dos Bispos da IATB. Participou
  de quatro sagrações episcopais, entre elas, em 15 de janeiro de 2006, as de Marcos de Santa Helena, Josué Sousa
  Torres e Rui Costa Barbosa, nas quais foi sagrante principal. Na linhagem declarada pela Igreja Anglicana Ortodoxa
  no Brasil, antecede Josué Souza Torres (2006) e Adolfo Batista Teodoro Júnior (2013).
