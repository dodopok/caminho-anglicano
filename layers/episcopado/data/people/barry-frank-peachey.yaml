id: barry-frank-peachey
name: Barry Frank Peachey
full_name: Barry Frank Peachey
aliases:
- Barry Peachey
- Frank Peachey
biography: >-
  Bispo in Anglia e chanceler metropolitano da Anglican Independent Communion Worldwide (Inglaterra), foi sagrado
  em 5 de junho de 2005, em High Legh (Cheshire), por Norman Sydney Dutton, e a IATB o aponta como seu consagrante.
  Na linhagem declarada pela IAOB, antecede Josué Souza Torres (2006) e Adolfo Batista Teodoro Júnior (2013). Foi
  bispo titular de Vera Cruz e membro honorário da Câmara dos Bispos da IATB.
sources:
