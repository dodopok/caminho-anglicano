biography: >-
  Nascido em Jaguarão (RS) em 18/09/1935, foi ordenado diácono em dezembro de 1960 e presbítero em julho de 1961
  pelo bispo Plínio Lauer Simões, no Distrito Missionário do Sudoeste do Brasil, e foi transferido para a Igreja
  Episcopal do Brasil em 25/04/1965. Esteve à frente das paróquias de Jesus Cristo (Erechim), Crucificado (Bagé)
  e Nazareno (Santana do Livramento), foi missionário em Moçambique em 1971, na educação teológica, e em 1977 foi
  enviado ao Uruguai com Jubal Pereira Neves. Em 1980 tornou-se deão da Catedral do Mediador, em Santa Maria (RS).
  Eleito em 1984 bispo coadjutor da Diocese Setentrional, com direito a sucessão, foi sagrado em 17/03/1985, em
  Porto Alegre, por Edmund Knox Sherrill, primaz em exercício, e atuou como coadjutor nesse ano. A partir de 1986
  foi bispo diocesano; em 1994 a diocese passou a se chamar Diocese Anglicana do Recife, e ele deixou o cargo em
  19/10/1997, sucedido por Robinson Cavalcanti. Ordenou 12 diáconos e presbíteros e participou de quatro sagrações
  episcopais, entre elas as de Sydney Alcoba Ruiz e Almir dos Santos. Como bispo emérito presidiu o Superior Tribunal
  Eclesiástico da IEAB, que julgou o processo contra Cavalcanti em 2004-2005, e consta entre os eméritos da Câmara
  Episcopal em 2017.
