  notes: >-
    Eleito bispo coadjutor da Diocese Setentrional (Recife) pelo Sinodo de 1984. Co-sagrantes: "os bispos brasileiros"
    (nao nomeados) e David Leake. O livro diz que os "demais bispos brasileiros" foram co-sagrantes, sem nomeá-los.
    Coadjutor da Diocese Setentrional. A tese diz que 'os bispos brasileiros' foram co-sagrantes, sem nomeá-los;
    só David Leake é nominado. Sagrado como bispo coadjutor da Diocese Setentrional (Recife). Co-sagrantes: 'os
    demais bispos brasileiros' (não nomeados) e David Leake. A tese cita KICKHÖFEL, 1995, p. 300. Eleito pelo Sínodo
    Geral da IEAB como coadjutor da Diocese Setentrional (Recife), em substituição ao candidato apresentado por
    Sherrill; o texto situa a sagração em Porto Alegre em 1985 (ano em que trabalhou ao lado de Sherrill como coadjutor)
    e não nomeia os sagrantes.
