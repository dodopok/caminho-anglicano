  sources:
  - source: drv-apontamentos-kickhofel
    quote: 1971 - Clóvis Rodrigues e Hanz Krolow em Moçambique
- type: other
  date: '1974-08-06'
  description: >-
    O "Parecer Sul-Ocidental" sobre "as mulheres e as Ordens Sacras" foi apresentado em 6 de agosto de 1974, assinado
    pelos reverendos Orlando Oliveira, Jubal Neves e Clovis Rodrigues; a primeira ordenação feminina na IEAB só
    ocorreu em 1985.
  status: confirmed
  sources:
  - source: lic-livro35
    quote: >-
      E em 6 de agosto de 1974, é apresentado o famoso “Parecer Sul-Ocidental” a respeito “das mulheres e as Ordens
      Sacras”, assinado pelos Revdos. Orlando Oliveira, Jubal Neves e Clovis Rodrigues
- type: other
  date: '1977'
  description: >-
    Clóvis Erly Rodrigues é descrito como sucessor de Edmund Knox Sherrill no episcopado do Recife e, segundo o
    Glossário Anglicano, teria levado com o Rev. Jubal Pereira Neves o trabalho missionário da IEAB ao Uruguai (Santana
    do Livramento) em 1977, e formado com Marston Price os primeiros seminaristas do NAET (1976); como sua sagração
    é de 1985, a atribuição do título de bispo a essas datas é retrospectiva.
  status: probable
  sources:
  - source: lrec-caminho-glossario-clovis
    quote: >-
      Em 1977, junto com o Rev. Jubal Pereira Neves, levou o trabalho missionário da IEAB ao Uruguai, trabalhando
      em Santana do Livramento.
  - source: ptwp-dar
    quote: >-
      O então nomeado bispo diocesano Clovis Erly Rodrigues e o Reverendo Marston Price ficaram responsáveis pela
      formação dos primeiros seminaristas.
- type: other
  date: 1984-07
  description: >-
    Eleito pelo Sínodo bispo coadjutor da Diocese Setentrional, com direito à sucessão, no terceiro escrutínio,
    contrariando a expectativa de Sherrill, que esperava a indicação de Paulo Ruiz Garcia
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Quando em 1984 o bispo anunciou sua intenção de se aposentar no final de 1985, o Sínodo realizado em julho
      de 1984, em Porto Alegre, elegeu o deão da Catedral do Mediador de Santa Maria, Clóvis Erly Rodrigues, para
      ser bispo coadjutor da Diocese Setentrional com direito a sucessão.
    page: '299'
- type: other
  date: '1971'
  description: >-
    Primeiro brasileiro a trabalhar como missionário na África: quatro anos em Moçambique, na educação teológica
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Em 1971, tomou uma decisão que modificou o curso de sua vida: aceitou um convite para trabalhar como missionário
      em Moçambique. Foi o primeiro brasileiro a trabalhar na longínqua África, onde atuou por quatro anos no campo
      da educação teológica e nas relações de companheirismo.
    page: '300'
