  diocese: ieab-dso
  start: '1965'
  end: '1985'
  status: probable
  sources:
  - source: kickhofel-1995
    quote: >-
      Em 1965, foi transferido para Bagé para assumir o pastorado da Paróquia da Crucifixão e as missões de São
      Marcos e São Felipe … Em 1980, transferiu-se para Santa Maria (RS) para assumir a direção da histórica Catedral
      do Mediador, fundada em 1900, e assessorar o bispo na secretaria do bispado.
    page: '300'
  notes: >-
    Pároco da Crucifixão em Bagé (1965), missionário em Moçambique (1971-1974), pároco do Nazareno em Santana do
    Livramento (1974) e deão da Catedral do Mediador em Santa Maria (1980). O fim em 1985 é a sagração.
