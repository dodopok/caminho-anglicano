  description: >-
    Em 1971 'Clóvis Rodrigues e Hanz Krolow' atuaram em Moçambique como missionários enviados pela IEAB; a identificação
    de 'Clóvis Rodrigues' com Clóvis Erly Rodrigues, depois bispo de Recife, não é confirmada pelo texto.
