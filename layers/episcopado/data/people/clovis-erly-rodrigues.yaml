events:
- type: other
  date: '1985'
  description: >-
    Robinson Cavalcanti, então diácono da Diocese Setentrional, foi "apresentador" na sagração do novo bispo (Clóvis
    Erly Rodrigues) em Porto Alegre e afirma que Edmund Sherrill seria um dos co-sagrantes do seu próprio episcopado
    (1997).
  status: probable
  sources:
  - source: cant-meninos-eu-vi-2004
    quote: Eu vi – e fui “apresentador” (de quem não conhecia) na sagração do novo Bispo, em Porto Alegre
  - source: cant-meninos-eu-vi-2004
    quote: (e ele seria um dos co-sagrantes do meu episcopado)
  - source: cant-resgatando-2006
    quote: >-
      Tive, por determinação do Bispo Sherrill, juntamente com a irmã Dalila, da Paróquia Anglicana do Bom Samaritano,
      de me deslocar para a cerimônia de Sagração na Catedral de Porto Alegre (não havia qualquer clima para que
      a mesma se desse aqui) e saudar o consagrado na festa que se seguiu no Teresópolis Tênis Clube.
- type: other
  date: '2006-04-26'
  description: >-
    Segundo Robinson Cavalcanti (2006), foram ordenados no período do bispo Clóvis Erly Rodrigues (1986–1997) apenas:
    presbíteros Washington Franco, Siméa Meldrum, Maurício Andrade, Sebastião Gameleira, Alberto Blandon, Francisco
    de Assis, Raimundo Nonato, Alberto Pires e Evanilza Loureiro; e só ao diaconato Luiz Souza de França, Abimael
    Rodrigues e Josafá Batista
  status: probable
  sources:
  - source: dar-resgatando-historia-3
    quote: >-
      Foram ordenados, durante o seu período os seguintes reverendos: Washington Franco e Siméa Meldrum (os únicos
      dos seus Presbíteros que continuam conosco), Maurício Andrade (Bispo de Brasília), Sebastião Gameleira (Bispo
      de Pelotas)
  - source: dar-resgatando-historia-3
    quote: 'e, apenas ao Diaconato: Luiz Souza de França'
- type: other
  date: '2004-10-11'
  description: >-
    Abertura de processo canonico contra Robinson Cavalcanti no Superior Tribunal Eclesiastico (denuncia recebida
    em 11/10/2004); o tribunal era presidido pelo bispo emerito Clovis Erly Rodrigues.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      a abertura de um processo canônico contra o bispo no Superior Tribunal Eclesiástico, recebida no dia 11 de
      outubro de 2004.
  - source: costa2021
    quote: >-
      época, a Suprema Corte da Igreja Episcopal Anglicana do Brasil era presidida pelo bispo emérito, Clovis Erly
      Rodrigues.
- type: other
  date: 2017-04
  description: >-
