  - source: sinopse-2003
    quote: 1985 - Clóvis Erly Rodrigues
  - source: kickhofel-1995
    quote: >-
      Foi sagrado na Igreja do Redentor (rua Haddock Lobo, 258 - Tijuca) no dia 24 de março de 1985 pelo bispo Edmund
      Knox Sherrill, da Diocese de Recife e primaz em exercício, tendo atuado como co-sagrantes os bispos Agostinho
      Sória, Sumio Takatsu, Clóvis Rodrigues (sagrado uma semana antes em Porto Alegre) e Cláudio Vinicius de Senna
      Gastal, que foi o pregador.
    page: '278'
  - source: kickhofel-1995
    quote: >-
      Rodrigues foi elevado ao episcopado no dia 17 de março de 1985, na Catedral da SS.Trindade, em Porto Alegre,
      pelo primaz em exercício, Edmund Knox Sherrill, tendo participado como co-sagrantes os demais bispos brasileiros
      e o bispo argentino David Leake, primaz da Provínica Anglicana do Cone Sul, com sede em Salta, Argentina.
    page: '300'
  notes: >-
    Eleito bispo coadjutor da Diocese Setentrional (Recife) pelo Sinodo de 1984. Co-sagrantes: "os bispos brasileiros"
    (nao nomeados) e David Leake. O livro diz que os "demais bispos brasileiros" foram co-sagrantes, sem nomeá-los.
affiliations:
