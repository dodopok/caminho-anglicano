events:
- type: other
  date: '1985'
  description: >-
    Robinson Cavalcanti, então diácono da Diocese Setentrional, foi "apresentador" na sagração do novo bispo (Clóvis
    Erly Rodrigues) em Porto Alegre e afirma que Edmund Sherrill seria um dos co-sagrantes do seu próprio episcopado
    (1997).
  status: probable
  sources:
  - source: cant-meninos-eu-vi-2004
    quote: Eu vi – e fui “apresentador” (de quem não conhecia) na sagração do novo Bispo, em Porto Alegre
  - source: cant-meninos-eu-vi-2004
    quote: (e ele seria um dos co-sagrantes do meu episcopado)
  - source: cant-resgatando-2006
    quote: >-
      Tive, por determinação do Bispo Sherrill, juntamente com a irmã Dalila, da Paróquia Anglicana do Bom Samaritano,
      de me deslocar para a cerimônia de Sagração na Catedral de Porto Alegre (não havia qualquer clima para que
      a mesma se desse aqui) e saudar o consagrado na festa que se seguiu no Teresópolis Tênis Clube.
- type: other
  date: '2006-04-26'
  description: >-
    Segundo Robinson Cavalcanti (2006), foram ordenados no período do bispo Clóvis Erly Rodrigues (1986–1997) apenas:
    presbíteros Washington Franco, Siméa Meldrum, Maurício Andrade, Sebastião Gameleira, Alberto Blandon, Francisco
    de Assis, Raimundo Nonato, Alberto Pires e Evanilza Loureiro; e só ao diaconato Luiz Souza de França, Abimael
    Rodrigues e Josafá Batista
  status: probable
  sources:
  - source: dar-resgatando-historia-3
    quote: >-
      Foram ordenados, durante o seu período os seguintes reverendos: Washington Franco e Siméa Meldrum (os únicos
      dos seus Presbíteros que continuam conosco), Maurício Andrade (Bispo de Brasília), Sebastião Gameleira (Bispo
      de Pelotas)
  - source: dar-resgatando-historia-3
    quote: 'e, apenas ao Diaconato: Luiz Souza de França'
- type: other
  date: '2004-10-11'
  description: >-
    Abertura de processo canonico contra Robinson Cavalcanti no Superior Tribunal Eclesiastico (denuncia recebida
    em 11/10/2004); o tribunal era presidido pelo bispo emerito Clovis Erly Rodrigues.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      a abertura de um processo canônico contra o bispo no Superior Tribunal Eclesiástico, recebida no dia 11 de
      outubro de 2004.
  - source: costa2021
    quote: >-
      época, a Suprema Corte da Igreja Episcopal Anglicana do Brasil era presidida pelo bispo emérito, Clovis Erly
      Rodrigues.
- type: other
  date: 2017-04
  description: >-
    A Camara Episcopal em abril de 2017 (reuniao no Rio de Janeiro) inclui como emeritos Clovis Rodrigues, Almir
    dos Santos e Celso Franco.
  status: confirmed
  sources:
  - source: ec-2017-04
    quote: Clóvis Ro- drigues, Almir dos Santos e Celso Franco (eméritos)
- type: other
  date: '1985'
  description: >-
    Na eleição do sucessor de Sherrill pelo Sínodo Geral da IEAB, o candidato do bispo, Paulo Garcia, foi derrotado,
    e foi eleito bispo coadjutor Clóvis Erly Rodrigues, então deão da Catedral de Santa Maria (RS); a sagração ocorreu
    na Catedral de Porto Alegre.
  status: probable
  sources:
  - source: drv-resgatando-ii
    quote: >-
      sendo eleito Bispo Coadjutor da nossa Diocese o então Deão da Catedral de Santa Maria-RS (e que não conhecia
      o Nordeste nem como turista) o Revmo. Clóvis Erly Rodrigues
  - source: drv-resgatando-ii
    quote: para a cerimônia de Sagração na Catedral de Porto Alegre
- type: other
  date: '2005-04-09'
  description: >-
    Em 09/04/2005 o bispo Robinson comunicou ao clero que o relatório da Comissão Provincial de Investigação, acolhido
    pelo Primaz e pelo Procurador Geral da IEAB (Celso Franco de Oliveira), fora encaminhado ao Tribunal Superior
    Eclesiástico, presidido pelo bispo aposentado Clóvis Erly Rodrigues, citando como acusados vários clérigos do
    Recife (Miguel Uchoa, Estevão Menezes, Fernando Acosta, Ian Meldrum, Siméa Meldrum, Juciara, Luiz Souza, Manoel
    Almeida, Maria Gorete, Maurício Coelho, Raniere Almeida) e recomendando protesto à SAMS pela atuação dos missionários
    Marcus Throup, Ian e Siméa Meldrum.
  status: confirmed
  sources:
  - source: drv-carta-clero-processo-2005
    quote: >-
      Relatório esse acolhido pelo Primaz e pelo Procurador Geral da IEAB Dom Celso Franco de Oliveira, e ora encaminhado
      ao Tribunal Superior Eclesiástico, presidido pelo Bispo aposentado Dom Clóvis Erly Rodrigues, para julgamento.
- type: other
  date: '2008-07-16'
  description: >-
    Em 2008 Robinson Cavalcanti descreve a Diocese do Recife com 32 anos e 34 comunidades, 24 delas surgidas no
    seu episcopado, clero majoritariamente aposentado ou 'fazedor de tendas' e dependente de doações no exterior;
    recorda que Dom Clóvis Erly Rodrigues exigia que os ordenandos assinassem termo de ausência de compromisso de
    sustento.
  status: confirmed
  sources:
  - source: drv-papel-clovis
    quote: A Diocese do Recife tem apenas 32 anos, 24 de suas 34 comunidades surgiram no presente Episcopado
  - source: drv-papel-clovis
    quote: >-
      o meu predecessor, Dom Clóvis Erly Rodrigues, exigia das pessoas que ele ia Ordenar que assinassem um papel
- type: other
