  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti). O sermão o chama 'Estevão Menezes da Silva'; nos calendários
    diocesanos de 2004–2005 ele aparece como 'Meneses da Silva' e, a partir de 2006, como 'Menezes Chiappetta'.
    44º presbítero do episcopado de Dom Robinson. O sermão o chama 'Estevão Menezes da Silva'. O sermão (do bispo
    diocesano Robinson Cavalcanti) dá o nome "Estevão Menezes da Silva", grafia usada nas listas diocesanas até
    2005; a partir de 2005 os documentos da mesma diocese passam a grafar "Estevão Menezes Chiappetta" para o único
    Estevão do clero. A ordenação coincidiu com o culto de ação de graças pelos cinco anos da Paróquia Anglicana
    Jardim das Oliveiras. O texto é o sermão do bispo diocesano, que fala em primeira pessoa como quem confere a
    ordem; a página não traz assinatura, e o bispo diocesano em exercício era Robinson Cavalcanti (instalado em
    19/10/1997).
