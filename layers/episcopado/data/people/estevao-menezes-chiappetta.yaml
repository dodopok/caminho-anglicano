    quote: >-
      Ordenação Presbiteral de Estevão Menezes da Silva Culto em Ação de Graças – 5º Aniversário da Paróquia Anglicana
      Jardim das Oliveiras Recife – PE, 07 de Março de 2004
  - source: drp2-ord-presb-estevao-2004
    quote: Graças a Deus pelo Rev. Estevão (44º presbítero ordenado neste episcopado)
  - source: rcor-drv-presb-estevao
    quote: a realização do rito de Ordenação ao presbiterado do Diácono Rev. Estevão Menezes
  - source: rcid-calendario-2004
    quote: Rev. Estevão Meneses da Silva, ose
  - source: rcid-calendario-2006
    quote: Rev. Estevão Menezes Chiappetta – Secretário Diocesano (Recife)
  - source: rcid-calendario-2007
    quote: Revmo. Deão Estevão Menezes Chiappetta
  notes: >-
    Sermão do bispo diocesano (Robinson Cavalcanti). O sermão o chama 'Estevão Menezes da Silva'; nos calendários
    diocesanos de 2004–2005 ele aparece como 'Meneses da Silva' e, a partir de 2006, como 'Menezes Chiappetta'. 44º presbítero do episcopado de Dom Robinson. O sermão
    o chama 'Estevão Menezes da Silva'. O sermão (do bispo diocesano Robinson Cavalcanti) dá o nome "Estevão Menezes
    da Silva", grafia usada nas listas diocesanas até 2005; a partir de 2005 os documentos da mesma diocese passam
    a grafar "Estevão Menezes Chiappetta" para o único Estevão do clero.
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Estevão Menezes Chiappetta
  - source: drv-nota-esclarecimento-2006
    quote: Estevão Menezes Chiappetta
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Estevão Menezes Chiappetta … Os clérigos não atenderam à
      convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  - source: rcid-nota-desvinculacao-2007
    quote: na terça-feira da Semana Santa, o então Rev. Estevão Menezes Chiappetta
  - source: rcid-nota-desvinculacao-2007
    quote: >-
      comunicaram ao Bispo Diocesano e ao Conselho Diocesano da sua decisão de desvinculação da Diocese do Recife
  - source: rcid-nota-desvinculacao-2007
    quote: Recife, 26 de abril de 2007.
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata. Desvinculação comunicada na Semana Santa de 2007 e registrada em nota diocesana de 26/04/2007; a nota
    diz que passou a membro leigo de outra denominação.
  end: 2007-04
  end_reason: left
