ordinations:
- order: diaconate
  date: '2002-10-05'
  place: Missão Jardim das Oliveiras, Recife-PE
  jurisdiction: ieab
  ordained_by: robinson-cavalcanti
  status: confirmed
  sources:
  - source: rcor-drv-diac-estevao
    quote: Ordenação Diaconal de Estevão Menezes, OSE
  - source: rcor-drv-diac-estevao
    quote: Recife/PE – 05/10/2002
  - source: rcor-drv-diac-estevao
    quote: >-
      Você me concede a alegria de comemorar os cinco anos de minha sagração episcopal com a 41.ª ordenação ministerial.
  - source: rcor-drv-diac-estevao
    quote: Dom Robinson Cavalcanti, OSE
  - source: rcor-drv-diac-estevao
    quote: Hoje ordenamos um filho espiritual de Santo Estevão, o primeiro mártir da Igreja.
  - source: rcid-calendario-2004
    quote: Rev. Estevão Meneses da Silva, ose
  - source: rcor-drv-ordens-dar
    quote: Rev. Estevão Menezes
  notes: >-
    Sermão assinado por Dom Robinson Cavalcanti no 5º aniversário da sua sagração.
    Identificação documentada: o sermão chama o ordinando "Estevão Menezes, OSE" (2002) e "Estevão Menezes da Silva"
    (2004). Nas listas diocesanas há um único Estevão no clero: em jan/2002 "Estevão Meneses da Silva" é postulante;
    o calendário diocesano de 2004 traz "Rev. Estevão Meneses da Silva, ose"; na mesma posição da lista de aniversariantes,
    o calendário da Catedral de 2005 ainda traz "Rev. Estevão Meneses da Silva", e os calendários de 2006 e 2007
    trazem "Rev. Estevão Menezes Chiappetta – Secretário Diocesano (Recife)" e "Revmo. Deão Estevão Menezes Chiappetta";
    a Carta de Setúbal (26/02/2005) já o lista como "Rev. Estevão Menezes Chiappetta – Secretário Diocesano (Recife)".
    A página das Ordens Religiosas (2004) o lista como membro clerical da OSE ("Rev. Estevão Menezes").
