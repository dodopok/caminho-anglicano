  notes: >-
    Sermão assinado por Dom Robinson Cavalcanti no 5º aniversário da sua sagração. Identificação documentada: o
    sermão chama o ordinando "Estevão Menezes, OSE" (2002) e "Estevão Menezes da Silva" (2004). Nas listas diocesanas
    há um único Estevão no clero: em jan/2002 "Estevão Meneses da Silva" é postulante; o calendário diocesano de
    2004 traz "Rev. Estevão Meneses da Silva, ose"; na mesma posição da lista de aniversariantes, o calendário da
    Catedral de 2005 ainda traz "Rev. Estevão Meneses da Silva", e os calendários de 2006 e 2007 trazem "Rev. Estevão
    Menezes Chiappetta – Secretário Diocesano (Recife)" e "Revmo. Deão Estevão Menezes Chiappetta"; a Carta de Setúbal
    (26/02/2005) já o lista como "Rev. Estevão Menezes Chiappetta – Secretário Diocesano (Recife)". A página das
    Ordens Religiosas (2004) o lista como membro clerical da OSE ("Rev. Estevão Menezes"). Sermão assinado por Robinson
    Cavalcanti, OSE, véspera de eleições gerais; ordenação de Estevão Menezes, membro da OSE, na data em que o bispo
    comemorava cinco anos de sagração episcopal (41ª ordenação ministerial do seu episcopado). O bispo lamenta,
    no mesmo sermão, 'a quebra da unidade da nossa família eclesial' e decisões 'precipitadas e centralizadas' de
    grupos que deixaram a diocese.
