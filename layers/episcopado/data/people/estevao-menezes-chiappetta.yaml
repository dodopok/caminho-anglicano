biography: >-
  Estevão Menezes Chiappetta, também registrado como Estevão Menezes da Silva e membro da Ordem de Santo Estêvão
  Mártir (OSE), constava em 2002 entre os postulantes ao ministério ordenado da Diocese Anglicana do Recife, na
  Paróquia Anglicana Bom Samaritano. Foi ordenado diácono em 5/10/2002, em Recife, por Robinson Cavalcanti. O mesmo
  bispo o ordenou presbítero em 7/3/2004. Em 2004 era secretário administrativo da diocese e, em 2005 e 2006, secretário
  diocesano; também figurou como presidente da Comissão de Companheirismo e Intercâmbio. Em 23/8/2005 foi incluído
  entre os clérigos excluídos da comunhão da IEAB, que responderam por carta continuar em comunhão com o bispo diocesano
  Robinson Cavalcanti. Foi instituído deão da Catedral Anglicana do Bom Samaritano em 5/8/2006 e constava nesse
  cargo em 2006 e 2007. Em abril de 2007, na Semana Santa, deixou a diocese.
