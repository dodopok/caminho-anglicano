# yaml-language-server: $schema=../../schemas/person.json
id: estevao-menezes-chiappetta
name: Estevão Menezes Chiappetta
biography: Deão da Catedral Anglicana do Bom Samaritano (Recife) em 2006-2007.
sources:
- source: drp-boletim-oracao-2006
  quote: >-
    Orar pela Catedral Anglicana do Bom Samaritano e pelo Revmo. Deão Estevão Menezes e o Cabido da mesma
- source: drp-calendario-2007
  quote: Revmo. Deão Estevão Menezes Chiappetta
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: clergy
  start: '2005'
  status: confirmed
  sources:
  - source: drv-declaracao-32
    quote: Rev. Estevão Menezes Chiappetta
  - source: drv-nota-esclarecimento-2006
    quote: Estevão Menezes Chiappetta
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Estevão Menezes Chiappetta … Os clérigos não atenderam à
      convocação e declararam, via carta (anexo III), resposta que: continuamos a honrar os nossos votos de ordenação,
      mantendo plena comunhão com o bispo diocesano Revmo. Dom Edward Robinson Cavalcanti
    page: 560-562
  notes: >-
    Consta como clérigo da Diocese Anglicana do Recife em 29/08/2005 (Declaração dos 32) e/ou 09/11/2006 (Nota de
    Esclarecimento); início e fim do vínculo não informados. Anexo R: o(a) clérigo(a) declarou, em resposta à convocação
    de 04/07/2005, manter 'plena comunhão' com Robinson Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início
    dado só como ano (2005): a data de 23/08/2005 é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data
    exata.
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: deao
  status: confirmed
  sources:
  - source: drp-boletim-oracao-2006
    quote: >-
      Orar pela Catedral Anglicana do Bom Samaritano e pelo Revmo. Deão Estevão Menezes e o Cabido da mesma
  - source: drp-calendario-2007
    quote: Revmo. Deão Estevão Menezes Chiappetta
  notes: >-
    Local: Catedral Anglicana do Bom Samaritano, Recife. Deão da Catedral Anglicana do Bom Samaritano em out/nov
    de 2006; o calendário de 2007 o titula "Revmo. Deão Estevão Menezes Chiappetta". Título de deão no calendário
    diocesano de 2007.
- jurisdiction: ieab
  role: clergy
  diocese: ieab-dar
  end: '2005-08-23'
  end_reason: deposition
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Art. 1º – Ficam excluídos da Comunhão da Igreja Episcopal Anglicana do Brasil e, conseqüentemente, das Sagradas
      Ordens, os clérigos a seguir mencionados: … Rev. Estevão Menezes Chiappetta … Recife, 23 de agosto de 2005.
    page: 560-561
  notes: >-
    Anexo R: Decreto Diocesano nº 01/2005 (Recife, 23/08/2005) de Dom Filadelfo Oliveira Neto, Autoridade Eclesiástica
    da Diocese Anglicana do Recife (IEAB), exclui o(a) clérigo(a) 'da Comunhão da Igreja Episcopal Anglicana do
    Brasil e, conseqüentemente, das Sagradas Ordens' por abandono de comunhão. motivo_fim 'deposicao' porque o efeito
    é a perda das ordens na IEAB e a carta do Anexo S chama o grupo de 'clérigos depostos'; o fato de fundo é a
    adesão ao cisma de Robinson Cavalcanti. Início do vínculo com a IEAB não informado.
events:
- type: other
  date: 2005-06
  description: >-
    Segundo entrevista do Rev. Estevão Menezes ao FolhaGospel.com (21/06/2005), logo após a notícia da deposição
    o bispo Robinson manteve a agenda: ordenou cinco novos pastores na Con-Catedral da Ressurreição (João Pessoa)
    e confirmou mais de 90 pessoas na Paróquia do Espírito Santo (Jaboatão); a sentença foi atribuída ao bispo primaz
    Orlando Santos de Oliveira.
  status: probable
  sources:
  - source: drv-entrevista-estevao-2005
    quote: >-
      ordenou 5 novos pastores na Con-Catedral da Ressurreição, João Pessoa, e confirmou (profissão de fé) mais
      de 90 novos membros na Paróquia Anglicana do Espírito Santo, em Jaboatão.
  - source: drv-entrevista-estevao-2005
    quote: Das alegações do bispo primaz, Dom Orlando Santos de Oliveira
