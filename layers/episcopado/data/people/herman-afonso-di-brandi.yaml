id: herman-afonso-di-brandi
name: Herman Afonso Di Brandi
aliases:
- Herman Affonso Di Brandi
biography: >-
  Missionário e capelão do Colégio Cruzeiro do Sul (Porto Alegre) que, a partir de 1950, organizou a Capela de Cristo
  Rei e introduziu inovações litúrgicas (vestes eucarísticas, velas, incenso, crucifixo), sob a jurisdição do bispo
  Melcher.
