id: benjamin-bosworth-smith
name: Smith
full_name: Benjamin Bosworth Smith
aliases:
- B. B. Smith
- Benjamin B. Smith
- Benjamin Bosworth Smith
- Bp. Bosworth Smith
wikidata: Q4889238
biography: >-
  Benjamin Bosworth Smith (1794–1884), nascido em Bristol, Rhode Island, formou-se na Brown University em 1816.
  Foi sagrado em 31 de outubro de 1832, na Capela de São Paulo, em Nova York, por William White, com Brownell e
  H. U. Onderdonk, primeiro bispo da Diocese de Kentucky, e a partir de 1868 foi bispo presidente da Igreja Episcopal.
sources:
- source: perd04-wp-bbsmith
  quote: >-
    Benjamin Bosworth Smith (June 13, 1794 – May 31, 1884) was an American Protestant Episcopal bishop, and the
    Presiding Bishop of his Church beginning in 1868.
- source: perd04-wp-bbsmith
  quote: Smith was born in Bristol, Rhode Island.
- source: perd04-wp-bbsmith
  quote: Smith graduated from Brown University in 1816.
- source: perry-1895
  quote: >-
    was consecrated bishop of the diocese in St. Paul's Chapel, New York, Oct. 31, 1832, by Bishops White, Brownell,
    and H. U. Onderdonk.
- source: perry-1895
  quote: was consecrated bishop of the diocese in St. Paul's Chapel, New York, Oct. 31, 1832
- source: perd04-wp-bbsmith
  quote: >-
    The Life and Ministry of Benjamin Bosworth Smith, First Bishop of Kentucky: A Memorial Discourse delivered before
    the Fifty-sixth Annual Council of the Diocese of Kentucky
