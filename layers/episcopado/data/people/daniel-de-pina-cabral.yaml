id: daniel-de-pina-cabral
name: Daniel de Pina Cabral
aliases:
- Daniel da Pina Cabral
ordinations:
- order: episcopate
  date: '1967-05-25'
  place: Catedral de São Paulo, Lisboa (Igreja Lusitana)
  jurisdiction: null
  office: suffragan
  principal_consecrator: robert-selby-taylor-da-cidade-do-cabo
  status: probable
  sources:
  - source: cant-ec-1967-06
    quote: >-
      O nôvo Bispo foi sagrado na catedral da Igreja Lusitana, Católica, Apostólica, Evangélica de São Paulo, em
      Lisboa, As cerimônias efetuaram-se no dia 25 de maio, sob a presidência do Arcebispo da Cidade do Cabo. Participaram
      no solene ato, além do atual Bispo Diocesano da Igreja Lusitana, Revmo. Dom Luís C. R. Pereira, vários Bispos
      Anglicanos e um Bispo Velho-Católico.
  notes: >-
    Sufragâneo de Lebombo (Moçambique, Província da África do Sul). A fonte diz só "Arcebispo da Cidade do Cabo"
    (em 1967: Robert Selby Taylor — identificação NÃO dada pela fonte; conferir). Co-sagrante citado: bispo Luís
    C. R. Pereira (Igreja Lusitana) e "vários Bispos Anglicanos e um Bispo Velho-Católico". O Estandarte reproduz
    O Primeiro de Janeiro de 23/04/1967.
