biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em Douglas,
  Arizona, EUA (1929-06-12). Ordenado diácono em jun/1957 e presbítero em abr/1958. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
