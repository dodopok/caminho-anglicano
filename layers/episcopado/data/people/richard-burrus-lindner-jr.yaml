biography: >-
  Richard Burrus Lindner Jr. nasceu em Douglas, Arizona, em 12/06/1929 e foi ordenado diácono em junho de 1957 e
  presbítero em abril de 1958 na Igreja Episcopal dos EUA, pelos bispos Goodwin e Clements. Clérigo do Distrito
  Missionário do Sul do Brasil desde 1957, foi transferido para a Igreja Episcopal do Brasil em 25/04/1965.
