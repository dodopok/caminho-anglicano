    quote: Orar pelo Ponto Missionário da Liberdade, pelo ML Júlio Gomes e o Sem. Sílvio Freitas.
  notes: >-
    Local: Diocese Anglicana do Recife, Ponto Missionário da Liberdade. Atestado no calendário de intercessão da
    diocese de julho e agosto de 2004 (comunidade citada ao lado do nome). A página dá só "ML Júlio Gomes"; a lista
    de cargos de outubro de 2004 o traz como ML. Júlio Gomes (Secretaria de Jovens).
