    quote: MISSÃO ANGLICANA LIBERDADE ML. Júlio Gomes
  notes: >-
    Local: Missão Anglicana Liberdade (Jaboatão dos Guararapes-PE). Em exercício em outubro de 2004 (página capturada
    em 24/10/2004). Ministro leigo na data da página; a lista indica apenas "ML. Júlio Gomes" (o mesmo nome consta,
    com o sobrenome completo, entre os postulantes).
- jurisdiction: ieab-dar
