    quote: JÚLIO GOMES DA SILVA JÚNIOR (30/09) - Postulante Secretário Diocesano de Jovens
  notes: >-
    Local: Secretaria Diocesana de Jovens. Em exercício em outubro de 2004 (página capturada em 24/10/2004). Postulante
    ao ministério ordenado e ministro leigo na data da página.
- jurisdiction: ieab
  role: other
  role_description: ministro encarregado
  diocese: ieab-dar
  status: probable
  sources:
