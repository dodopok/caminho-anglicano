# yaml-language-server: $schema=../../schemas/person.json
id: julio-gomes-da-silva-junior
name: Júlio Gomes da Silva Júnior
aliases:
- Júlio Gomes
- Rev. Júlio Gomes
biography: >-
  Ministro leigo e postulante ao ministério ordenado na Diocese do Recife em 2004, secretário diocesano de Jovens
  e responsável pela Missão Liberdade.
sources:
- source: d2s28-clero04
  quote: JÚLIO GOMES DA SILVA JÚNIOR (30/09) - Postulante Secretário Diocesano de Jovens
- source: d2s31-diacs
  quote: >-
    Rev. Rodrigo Espiúca, Rev. Senomar Teixeira, Rev. Adilson Ferreira, Rev. Fernando Gonçalves, Rev. Rodson Ricardo,
    Rev. Júlio Gomes, Rev. Sílvio Freitas e Rev. Ricardo Domingos
ordinations:
- order: diaconate
  date: '2005-09-10'
  place: Catedral Anglicana da Santíssima Trindade, Recife (PE)
  jurisdiction: ieab-dar
  ordained_by: filadelfo-oliveira-neto
  status: confirmed
  sources:
  - source: d2s31-diacs
    quote: a Diocese conta com oito novos diáconos ordenados por Dom Filadelfo
  - source: d2s31-diacs
    quote: >-
      Rev. Rodrigo Espiúca, Rev. Senomar Teixeira, Rev. Adilson Ferreira, Rev. Fernando Gonçalves, Rev. Rodson Ricardo,
      Rev. Júlio Gomes, Rev. Sílvio Freitas e Rev. Ricardo Domingos
  - source: d2s31-diacs
    quote: >-
      estiveram na Catedral Anglicana da Santíssima Trindade e participaram do culto presidido pelo Bispo Dom Filadelfo
      Neto
  - source: d2s31-agenda
    quote: Ordenações Diaconais - Catedral da SS. Trindade
  - source: d2s31-clero
    quote: Rev. Júlio Gomes da Silva Júnior
  notes: >-
    Os oito diáconos aparecem juntos na nota do site, que dá o culto de encerramento do XXIV Concílio no sábado,
    10/09/2005, na Catedral da Santíssima Trindade, presidido por Filadelfo Oliveira Neto como autoridade eclesiástica
    da diocese que permaneceu na IEAB. A nota não cita co-ordenantes. A identificação dos nomes curtos com os nomes
    completos vem da lista do clero do mesmo site (abril de 2006), que traz todos entre os diáconos.
affiliations:
