id: edilson-augusto
name: Edilson Augusto
aliases:
- Edílson Augusto Pereira dos Santos
biography: >-
  Consta como ministro auxiliar da Paróquia Anglicana Comunhão, cujo pároco era Márcio Medeiros Meira, e foi empossado
  em 30/10/2011 como ministro encarregado de uma comunidade da Diocese Anglicana do Recife, em rito presidido por
  Márcio Meira por delegação de Robinson Cavalcanti.
sources:
- source: darn2-edilson-2011
  quote: recebeu festivamente o novo Ministro Encarregado da comunidade, o Rev. Edilson Augusto
- source: darn2-edilson-2011
  quote: >-
    Por delegação do Bispo Diocesano, Dom Robinson Cavalcanti , assessorado pelo Bispo Sufragâneo Eleito , Revmo.
    Flávio Adair , o Rito de Posse foi presidido pelo Arcediago Adjunto PB/RN, Rev. Márcio Meira
- source: dard2-com-pb
  quote: >-
    PARÓQUIA ANGLICANA COMUNHÃO Pároco: Rev. Márcio Medeiros Meira Ministro Auxiliar : Rev. Edílson Augusto Pereira
    dos Santos
- source: d2s03-edilson-igreja
  quote: é educador na área de filosofia, sociologia e empreendedorismo
