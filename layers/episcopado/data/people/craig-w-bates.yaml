events:
- type: other
  date: 2013-01
  description: >-
    Paulo Garcia integrava o Conselho do Patriarca da ICCEC: o boletim da Catedral da Trindade de 06/01/2013 informa
    que era convocado anualmente para as reuniões restritas do grupo, e o de 27/01/2013 que, convocado por Dom Craig
    Bates, viajou a Orlando (Flórida) para reunir-se com os demais membros do Conselho.
  status: confirmed
