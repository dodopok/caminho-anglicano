  - source: lpg-boletim-2013-01-27
    quote: >-
      Convocado que foi por Dom Craig Bates, Dom Paulo Garcia viajou para os Estados Unidos. A partir desta 2ª feira
      ele se reúne com outros membros do Conselho do Patriarca na cidade de Orlando, Florida
- type: other
  date: '2019-03-24'
  description: >-
    Separação da IECB em relação à ICCEC (24/03/2019). Segundo Costa (2021), em agosto de 2018 o patriarca Craig
    Bates reuniu-se no Recife com o clero e as lideranças da IECB, incluindo Garcia e o bispo Alexandre Ximenes,
    para tratar da padronização do culto e da aposentadoria compulsória de Garcia, que pelos cânones da ICCEC deveria
    ocorrer aos 80 anos (2019); Garcia teria resistido, culminando no rompimento. O comunicado de 24/03/2019, assinado
    pelo bispo André Novaes, informou que os bispos da IECB entenderam ter Deus estabelecido "uma nova orientação
    para a Igreja Brasileira", com cânones próprios, mantendo relação fraterna com a ICCEC. A separação foi mantida
    em discrição e revelada após o Encontro Nacional do Clero.
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Segundo os cânones da instituição, o arcebispo ao completar 80 anos deveria se aposentar, o que ocorreria
      no ano seguinte.
  - source: costa2021
    quote: Esse novo tempo implicará na elaboração de nossos próprios Cânones
  - source: costa2021
    quote: >-
      Por conta de problemas com a sucessão da liderança de Paulo Garcia, em 2019 o arcebispo brasileiro rompeu
      com o Patriarca Bates
