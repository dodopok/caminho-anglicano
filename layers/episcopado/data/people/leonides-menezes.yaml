# yaml-language-server: $schema=../../schemas/person.json
id: leonides-menezes
name: Leônides de Menezes
full_name: Leonides de Menezes
aliases:
- Cônego Leonides de Menezes
- Leonides Menezes
- Leônides Menezes
biography: >-
  Ministro auxiliar da IEAB que liderou a Missão (depois Paróquia) Betânia no Recife desde 1996; levou a paróquia
  para fora da IEAB em 2002; cônego da CEEC (2004), sagrado bispo em dezembro de 2006; arcebispo primaz da Província
  das Igrejas Cristãs Episcopais do Brasil desde dezembro de 2021.
sources:
- source: ciceb-betania-nossaigreja
  quote: >-
    a Missão Betânia foi instalada em 11/07/1996, na Av. Caxangá 1107, no bairro do Cordeiro, sob a liderança do
    Ministro Auxiliar Leonides de Menezes.
- source: ciceb-quemsomos
  quote: Eleito Arcebispo, Dom Leonides de Menezes tornou-se o bispo primaz da CICEB
ordinations:
- order: episcopate
  date: '2007'
  place: Recife (Catedral Betânia, presumivelmente)
  jurisdiction: ceec
  office: diocesan
  principal_consecrator: william-paul-mikler
  co_consecrators:
  - francisco-buzzo-rodrigues
  - hermes-carvalho-fernandes
  status: contested
  sources:
  - source: iab-poster-linhagem-meira
    quote: Para se tornar bispo, foi consagrado em 2007 pela CEEC, comunhão criada nos EUA em 1995
  - source: ciceb-quemsomos
    quote: >-
      Em dezembro de 2006, em cerimônia oficiada pelos bispos William Paul Mikler, Hermes Carvalho Fernandes e Francisco
      Buzzo, O Rev. Leonides foi sagrado bispo diocesano e o 1º Distrito Missionário foi alçado à condição de Diocese
      Missionária.
  - source: ciceb-betania-nossaigreja
    quote: >-
      Em dezembro de 2006, a Paróquia Betânia foi elevada à Catedral da Diocese Missionária do Nordeste do Brasil
      (DMNB), e o Rev. Leonides foi sagrado Bispo dessa diocese.
  - source: wp-pt-dioc-recife
    quote: >-
      A Igreja, inserida nessa citada Comunhão, elegeu em abril de 2007 o reverendo Leonides Menezes como o seu
      bispo, ordenado em seguida.
  discrepancies:
  - field: date
    value: 2006-12
    sources:
    - source: ciceb-quemsomos
      quote: >-
        Em dezembro de 2006, em cerimônia oficiada pelos bispos William Paul Mikler, Hermes Carvalho Fernandes e
        Francisco Buzzo, O Rev. Leonides foi sagrado bispo diocesano e o 1º Distrito Missionário foi alçado à condição
        de Diocese Missionária.
    - source: ciceb-betania-nossaigreja
      quote: >-
        Em dezembro de 2006, a Paróquia Betânia foi elevada à Catedral da Diocese Missionária do Nordeste do Brasil
        (DMNB), e o Rev. Leonides foi sagrado Bispo dessa diocese.
    - source: wp-pt-dioc-recife
      quote: >-
        A Igreja, inserida nessa citada Comunhão, elegeu em abril de 2007 o reverendo Leonides Menezes como o seu
        bispo, ordenado em seguida.
  - field: jurisdiction
    value: iceb
    sources:
    - source: ciceb-quemsomos
      quote: >-
        Em dezembro de 2006, em cerimônia oficiada pelos bispos William Paul Mikler, Hermes Carvalho Fernandes e
        Francisco Buzzo, O Rev. Leonides foi sagrado bispo diocesano e o 1º Distrito Missionário foi alçado à condição
        de Diocese Missionária.
    - source: ciceb-betania-nossaigreja
      quote: >-
        Em dezembro de 2006, a Paróquia Betânia foi elevada à Catedral da Diocese Missionária do Nordeste do Brasil
        (DMNB), e o Rev. Leonides foi sagrado Bispo dessa diocese.
    - source: wp-pt-dioc-recife
      quote: >-
        A Igreja, inserida nessa citada Comunhão, elegeu em abril de 2007 o reverendo Leonides Menezes como o seu
        bispo, ordenado em seguida.
  notes: >-
    O pôster diz que Russell McClanahan 'autorizou a consagração'; os sagrantes não são nomeados. Fonte primária
    (site da CICEB) nomeia três bispos oficiantes; a ordem em que aparecem (Mikler primeiro) sugere Mikler como
    sagrante principal, mas o site não diz isso explicitamente. CONFLITO: a Wikipédia (Diocese Anglicana do Recife)
    diz eleição em abril de 2007 'ordenado em seguida', e os pôsteres da IAB dizem 'consagrado em 2007 pela CEEC'
    com autorização de Russell McClanahan. Sucessão declarada: CEEC. Notável: Francisco Buzzo (fundador da IARB)
    aparece como co-sagrante, ligando a IARB à rede CEEC já em 2006. Versão alternativa (Wikipédia, citando o antigo
    site ciceb.com.br/DnossaIgreja.html): eleição em abril de 2007. Ver a versão de dez. 2006 do site atual.
affiliations:
- jurisdiction: ieab
