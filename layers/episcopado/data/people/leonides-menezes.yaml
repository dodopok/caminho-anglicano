  notes: >-
    O pôster diz que Russell McClanahan 'autorizou a consagração'; os sagrantes não são nomeados. Fonte primária
    (site da CICEB) nomeia três bispos oficiantes; a ordem em que aparecem (Mikler primeiro) sugere Mikler como
    sagrante principal, mas o site não diz isso explicitamente. CONFLITO: a Wikipédia (Diocese Anglicana do Recife)
    diz eleição em abril de 2007 'ordenado em seguida', e os pôsteres da IAB dizem 'consagrado em 2007 pela CEEC'
    com autorização de Russell McClanahan. Sucessão declarada: CEEC. Notável: Francisco Buzzo (fundador da IARB)
    aparece como co-sagrante, ligando a IARB à rede CEEC já em 2006. Costa (2021, nota 193) reproduz a mesma versão
    (dez/2006, Mikler/Fernandes/Buzzo). Versão alternativa (Wikipédia, citando o antigo site ciceb.com.br/DnossaIgreja.html):
    eleição em abril de 2007. Ver a versão de dez. 2006 do site atual.
affiliations:
- jurisdiction: ieab
  role: clergy
  diocese: ieab-diocese-recife
  start: '1996-07-11'
  end: '2002-07-08'
  end_reason: left
  status: contested
  sources:
  - source: ciceb-betania-historia
    quote: >-
      Por decisão do então Pastor e Reitor da Catedral, Rev. Paulo Garcia, em acordo com o bispo diocesano Dom Clóvis
      Erly, a Missão Betânia foi instalada em 11/07/1996, na Av. Caxangá 1107, no bairro do Cordeiro, sob a liderança
      do Ministro Auxiliar Leonides de Menezes.
  - source: ciceb-betania-historia
    quote: >-
      Em 8 de julho de 2002, a então Paróquia Betânia, da Igreja Episcopal Anglicana do Brasil, decidiu, em assembleia,
      desligar-se da Igreja Anglicana, passando a ser chamada Igreja Evangélica Betânia.
  notes: >-
    Em 1996 era "Ministro Auxiliar" (não está claro se já ordenado); depois "Rev." como líder da Paróquia Betânia
    (Cordeiro, Recife). Data/ordenante de suas ordenações na IEAB não encontrados. Saída com a paróquia em 2002.
    Em 1996 era 'Ministro Auxiliar'; os pôsteres da IAB e a Wikipédia o chamam de reverendo/presbítero ao tempo
    da saída.
  discrepancies:
  - field: end_reason
    value: schism
    sources:
