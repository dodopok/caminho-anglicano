events:
- type: other
  date: '2002'
  description: >-
    A Paróquia Betânia (Cordeiro, Recife), da Diocese do Recife da IEAB, liderada por Leônides de Menezes, decide
    em assembleia desligar-se da IEAB e filia-se à Communion of Evangelical Episcopal Churches (CEEC)
  status: probable
  sources:
  - source: ciceb-betania-historia
    quote: >-
      Em 8 de julho de 2002, a então Paróquia Betânia, da Igreja Episcopal Anglicana do Brasil, decidiu, em assembleia,
      desligar-se da Igreja Anglicana
  - source: ciceb-betania-historia
    quote: >-
      Em 8 de junho de 2002, em oração e busca sincera de direção de Deus, a comunidade filiou-se à Communio Evangelical
      Episcopal Churches (CECC)
- type: other
  date: '2008'
  description: 'Primeiro Concílio Diocesano (2008): Paróquia Betânia escolhida catedral e comunhão renomeada CICEB'
  status: confirmed
  sources:
  - source: ciceb-quemsomos
    quote: >-
      Em 2008 aconteceu o primeiro Concílio Diocesano, quando a Paróquia Betânia foi escolhida como a Catedral da
      diocese, passando a ser chamada Catedral Betânia.
- type: other
  date: 2021-12
  description: >-
    Constituição da Província das Igrejas Cristãs Episcopais do Brasil (PICEB), com três dioceses (DMNB, DCNB, DLNB)
  status: confirmed
  sources:
  - source: ciceb-quemsomos
    quote: >-
      uma Igreja de Sucessão Apostólica, Bíblica, Reformada, Litúrgica e Sacramental, formada por uma Província
      e três dioceses
- type: other
  date: '2002'
  description: >-
    Leonides de Menezes deixa a IEAB com a Rev. Karla Patriota e Adonias Ramos Souza e as paróquias Betânia e Calvário
    (Adonias depois aparece como bispo da IECB em Paulista, Catedral do Calvário)
  status: probable
  sources:
  - source: costa-2021-tese
    quote: >-
      Depois houve a saída do rev. Leonides Menezes, com a rev. Karla Patriota e Adonias Ramos Souza e as paróquias
      Betânia e Calvário (PEREIRA, 2013, p. 28).
