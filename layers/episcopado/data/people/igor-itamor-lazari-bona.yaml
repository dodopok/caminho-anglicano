id: igor-itamor-lazari-bona
name: Igor Itamor Lazari Bona
biography: >-
  Seminarista e postulante ao ministério ordenado na Diocese do Recife em 2009-2010, ligado à Paróquia Anglicana
  da Santíssima Trindade (RJ).
sources:
- source: dard2-clero-post
  quote: Sem. Igor Itamor Lazari Bona
affiliations:
- jurisdiction: diocese-anglicana-recife
  role: other
  role_description: postulante
  status: confirmed
  sources:
  - source: dard2-clero-post
    quote: Postulantes ao Ministério Ordenado … Sem. Igor Itamor Lazari Bona
  - source: d2s03-hom-sulsudeste
    quote: Sem. Igor Lazari (Postulante – Ministro Local da PA da SS Trindade – Rio de Janeiro-RJ)
  - source: d2s19-consulta-rj
    quote: >-
      A Revda. Silvana Venâncio, os Postulantes Igor Lazari e Elion Campos , e o ministro em Reconhecimento de Ordem,
      Rodrigo Condeixa, estiveram acompanhando o nosso Bispo
  notes: >-
    Lista "Postulantes ao Ministério Ordenado", publicada em 13/08/2009 e atualizada em 19/01/2010 (captura de 18/02/2010);
    o vínculo vale para esse período. A lista o titula "Sem." (seminarista) e o liga à Paróquia Anglicana da Santíssima
    Trindade (RJ). Local: Arcediagado Extraterritorial Sul-Sudeste; Paróquia Anglicana da Santíssima Trindade (Rio
    de Janeiro-RJ). Em exercício em outubro de 2010, conforme a mensagem publicada em 05/10/2010 no site da Diocese
    do Recife; seminarista e postulante, indicado como ministro local da paróquia Matéria de 3/06/2010: acompanhou
    o bispo Robinson Cavalcanti à consulta teológica da FTL-B (Rio de Janeiro); a matéria o chama "Igor Lazari".
    Em jun/2010.
