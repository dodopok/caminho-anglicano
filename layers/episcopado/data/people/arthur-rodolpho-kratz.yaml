  - source: costa2021
    quote: >-
      o reverendo Arthur Rodolpho Kratz72 foi eleito bispo para a Diocese Meridional, sendo sagrado na Catedral
      da Santíssima Trindade, em Porto Alegre.
  - source: ens-72149
    quote: >-
      He was ordained a priest in 1948 and was consecrated Bishop of the Diocese of Southern Brazil in 1971.
  - source: kickhofel-1995
    quote: >-
      O bispo Arthur R.Kratz assumiu a direção da Diocese Meridional logo após a sua sagração ao episcopado em 25
      de julho de 1971
    page: '250'
  - source: costa2021
    quote: >-
      No mesmo ano, o reverendo Arthur Rodolpho Kratz 72 foi eleito bispo para a Diocese Meridional, sendo sagrado
      na Catedral da Santíssima Trindade, em Porto Alegre.
    page: '85'
  notes: >-
    Sagrante principal NÃO encontrado. A Christian Century de 08/09/1971 noticia a sagração como recente, o que
    confirma 1971 (contra a hipótese de 1972) e o local (Porto Alegre). Costa (2021) dá a morte de Krischke em 28/06/1971;
    a sagração de Kratz seria, então, entre julho e agosto de 1971 — dedução, não dado de fonte. Ano inferido de
    "No mesmo ano" (1971, morte de Krischke). Sagrantes nao informados. 'No mesmo ano' = 1971 (ano da morte de Krischke).
    A tese NÃO informa data exata nem sagrantes. Nota 138: primeiro bispo do registro próprio da IEAB (nº 01).
