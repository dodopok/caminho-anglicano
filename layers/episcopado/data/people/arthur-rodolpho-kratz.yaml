      The Rt. Rev. Arthur R. Kratz, Bish- op of Southern Brazil since 1971, has been elected the second Primate
  - source: ens-72149
    quote: >-
      Born in Pelotas, R.S., Brazil in 1922, he graduated from Pelotense College in 1937, and received his B.D.
