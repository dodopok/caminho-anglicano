biography: >-
  Arthur Rodolpho Kratz nasceu em Pelotas em dezembro de 1920 (dia 19 ou 23, conforme a fonte). Foi ordenado diácono
  em 09/02/1947 e presbítero em 11/04/1948 por William M. M. Thomas, no Distrito Missionário do Sul do Brasil, e
  foi redator-chefe do Estandarte Cristão, em Porto Alegre, até 1968, quando se tornou pároco da Igreja do Redentor,
  em Pelotas. Eleito em 19/06/1971 em concílio extraordinário e sagrado em 25/07/1971, dirigiu a Diocese Meridional
  até morrer, em 04/03/1984 (uma lista indica 1971-1983), e foi sucedido por Cláudio Vinicius de Senna Gastal. Eleito
  em 1972 segundo primaz da IEAB, deu em 1980 a primeira ordem religiosa feminina da igreja e foi sagrante principal
  de dois bispos, Agostinho Guilhon Sória e Sumio Takatsu, em 1977.
