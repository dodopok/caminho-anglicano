biography: >-
  Elliott Lorenz Sorge nasceu em 31/1/1929 e morreu em 6/12/2011. Foi ordenado diácono em junho e presbítero em
  dezembro de 1954 pelo bispo Richard R. Emery, da Diocese de Dakota do Norte (TEC). Missionário norte-americano
  no Brasil desde 1965, era ministro encarregado de paróquias em Itariri e Santos quando foi eleito, em 1970, primeiro
  bispo da Diocese Sul Central (São Paulo), na primeira eleição de bispo por uma diocese brasileira. Sagrado em
  31/1/1971 na Paróquia da Santíssima Trindade por Plínio Lauer Simões, por delegação, com Edmund Sherrill e Daniel
  da Pina Cabral como co-sagrantes, renunciou à sé em 1977 para atuar junto ao Conselho Executivo da Igreja Episcopal
  dos EUA e foi sucedido por Sumio Takatsu. Foi bispo de Easton de 1983 a 1993.
