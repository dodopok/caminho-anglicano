biography: >-
  Líbero Venturini Córdova foi ordenado diácono em dezembro de 1939 e presbítero em março de 1941 pelo bispo William
  Matthews Merrick Thomas. Atuou no Distrito Missionário do Sul do Brasil até ser transferido para a Igreja Episcopal
  do Brasil em 25/04/1965.
