  - source: cd1968
    quote: ROCHA, Silvano (SBra) Trans to Brazil Ch 25 Apr 65.
biography: >-
  Clérigo do Distrito Missionário do Sul do Brasil (SBra) segundo o Clerical Directory 1965. Nascido em São Paulo,
  Brasil (1919-04-14). Ordenado diácono em set/1947 e presbítero em abr/1948. Transferido para a Igreja Episcopal
  do Brasil em 25/04/1965 (Clerical Directory 1968).
sources:
