biography: >-
  Nascido em Minas Gerais em 26/7/1889, foi ordenado diácono em março de 1926 por Lucien Lee Kinsolving e presbítero
  em abril de 1928 por William M. M. Thomas e, vinculado ao Distrito Missionário do Brasil Central, passou à Igreja
  Episcopal do Brasil em 25/4/1965.
