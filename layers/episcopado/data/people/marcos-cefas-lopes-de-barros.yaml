id: marcos-cefas-lopes-de-barros
name: Marcos Cefas Lopes de Barros
full_name: Marcos Cefas Lopes de Barros
aliases:
- Dom Marcos Barros
biography: >-
  Marcos Cefas Lopes de Barros foi sagrado bispo da IECB em 05/04/2011. Em outubro de 2017 foi anunciado como visitante
  da Paróquia Betesda, em Olinda; em data não informada deixou a IECB por divergências com a liderança de Paulo
  Garcia e filiou-se a outra igreja.
