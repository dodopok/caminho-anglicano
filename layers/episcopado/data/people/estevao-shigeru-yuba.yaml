biography: >-
  Clérigo do Distrito Missionário do Brasil Central (CBra) segundo o Clerical Directory 1965. Nascido em Kobe, Japão
  (1910-05-10). Ordenado diácono em jan/1938 e presbítero em abr/1940. Transferido para a Igreja Episcopal do Brasil
  em 25/04/1965 (Clerical Directory 1968).
