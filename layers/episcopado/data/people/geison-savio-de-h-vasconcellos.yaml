    do Norte (ACNA), em Palm Beach, e, nos dois dias seguintes, como Consultor da reunião do Colégio dos Bispos
    da ACNA; em seguida viaja à Nigéria. Relato de 04/07/2011; o mês do concílio não é indicado.
  status: confirmed
