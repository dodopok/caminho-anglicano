    Esclarecimento); início e fim do vínculo não informados. Local: Paróquia Anglicana do Espírito Santo. Clérigo
    citado como pastor/ministro da comunidade em out/nov de 2006 (boletim de oração da Secretaria de Intercessão).
    Anexo R: o(a) clérigo(a) declarou, em resposta à convocação de 04/07/2005, manter 'plena comunhão' com Robinson
    Cavalcanti, ou seja, estava na DAR dissidente em 2005. Início dado só como ano (2005): a data de 23/08/2005
    é a da exclusão pela IEAB, e a adesão à DAR é anterior, sem data exata. Local: Arcediagado Sul. Em exercício
    em outubro de 2010, conforme a mensagem publicada em 05/10/2010 no site da Diocese do Recife; listado entre
    os signatários da mensagem do Arcediagado Sul Local: Arcediagado Sul. Consta entre os clérigos que assinam a
    mensagem do Arcediagado Sul de 05/10/2010 (grafia do site: "Rev. Geison Vasconcellos"); em exercício em outubro/2010.
