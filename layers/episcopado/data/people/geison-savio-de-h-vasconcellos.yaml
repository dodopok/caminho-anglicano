id: geison-savio-de-h-vasconcellos
name: Geison Sávio de H. Vasconcellos
biography: >-
  Geison Sávio de H. Vasconcellos foi ordenado diácono em 17 de junho de 2000 por Robinson Cavalcanti, na Diocese
  Anglicana do Recife, e atuou na Paróquia Anglicana do Espírito Santo. Em 23 de agosto de 2005 constou entre os
  clérigos que o decreto de Filadelfo Oliveira Neto excluiu da comunhão da IEAB; os clérigos responderam que mantinham
  plena comunhão com Robinson. Na Diocese do Recife foi ministro encarregado do Ponto Missionário Anglicano Esperança,
  membro do conselho diocesano, coadjutor e arcediago adjunto do Centro.
sources:
- source: rcor-drv-diac-acosta-geison
  quote: FERNANDO ACOSTA E GEISON VASCONCELLOS
- source: rcor-drv-diac-acosta-geison
