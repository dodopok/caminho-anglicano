id: geison-savio-de-h-vasconcellos
name: Geison Sávio de H. Vasconcellos
biography: >-
  Geison Sávio de H. Vasconcellos foi ordenado diácono em 17 de junho de 2000 por Robinson Cavalcanti, na Paróquia
  do Espírito Santo, na Diocese Anglicana do Recife (IEAB). Em 2004 constava como presbítero da Paróquia Anglicana
  do Espírito Santo, onde foi coadjutor e ministro auxiliar. Em 23 de agosto de 2005 figurou entre os clérigos que
  o decreto de exclusão da IEAB atingiu; os clérigos responderam que mantinham plena comunhão com Robinson Cavalcanti.
  Na Diocese do Recife foi ministro encarregado do Ponto Missionário Anglicano Esperança, em Jaboatão dos Guararapes
  (Arcediagado Sul), e membro clerical do Conselho Diocesano, que presidiu por volta de 2010, sendo reeleito para
  o cargo. Em outubro de 2010 participou em Assunção, Paraguai, da consulta Crescendo Juntos, da Igreja Anglicana
  do Cone Sul. Em 2011 acompanhou Robinson Cavalcanti ao Concílio Provincial da Igreja Anglicana na América do Norte
  (ACNA), como observador. Em 2012 constava como arcediago adjunto do Centro e, em 2015, como arcediago.
