notes: >-
  Decreto do Primaz da IEAB datado de Porto Alegre, 10/06/2005, publicado no portal em 17/06/2005. Expressa a posição
  da IEAB; as razões de Robinson Cavalcanti e da diocese que liderava não constam desta fonte. Texto da captura
  com falhas de codificação de caracteres acentuados; os trechos foram transcritos com a acentuação correta.
