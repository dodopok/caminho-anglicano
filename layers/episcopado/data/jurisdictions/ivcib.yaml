description: >-
  A Igreja Vétero-Católica Independente do Brasil (IVCIB) tem registro com início de atividade em 19 de agosto de
  2024, em Ilhéus (BA), com Nildemar Andrade Santos como presidente e também descrito como arcebispo primaz. A ela
  se liga a Diocese Anglicana Católica Abu Ghosh da Paraíba, cujo bispo, Eddie Ferreira, foi consagrado em 2025
  em cerimônia presidida por Nildemar e nomeado chanceler da igreja.
