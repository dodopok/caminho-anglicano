    quote: >-
      Em 1985, por iniciativa do bispo Sydney Alcoba Ruiz, ela foi arrolada como uma das paróquias da Diocese Central
      (hoje Diocese Anglicana do Rio de Janeiro), após decisão do Concílio Diocesano.
    page: '98'
  notes: >-
    O patrimônio nunca foi incorporado à Província. Em junho de 2016 a Junta Paroquial excluiu a Paróquia São Lucas
    (IEAB) do templo; desde então a Christ Church Rio não pertence à IEAB.
