website: http://www.christchurchrio.org.br/
description: >-
  Capelania inglesa fundada em 1819 no Rio de Janeiro (templo atual de 1944, Botafogo); arrolada como paróquia da
  Diocese Central (hoje DARJ) em 1985; a partir de 2016 deixou de partilhar o templo com a Paróquia São Lucas (IEAB)
  e passou a funcionar como Igreja Anglicana Independente de governo congregacional, com capelães nomeados com ajuda
  da Intercontinental Church Society.
