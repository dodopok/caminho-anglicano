# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: scottish-episcopal-church
acronym: Scottish Episcopal Church
name: Scottish Episcopal Church (Igreja Episcopal Escocesa)
aliases:
- SEC
type: national_church
country: GB
founded:
  date: '1689'
  sources:
  - source: fund-wp-en-sec
    quote: >-
      With the 1689 refusal of the Scottish bishops to swear allegiance to William of Orange whilst James VII lived
      and had not abdicated, the Presbyterian polity was finally re-established in the Church of Scotland.
  - source: fund-wp-en-sec
    quote: >-
      Although not incorporated until 1712, the Scottish Episcopal Church traces its origins including but extending
      beyond the Reformation
website: https://www.scotland.anglican.org
description: >-
  Igreja anglicana da Escócia, que se vê em continuidade com a Igreja anterior à Reforma e foi incorporada em 1712;
  a data de 1689 marca a recusa dos bispos escoceses em jurar lealdade a Guilherme de Orange, quando o presbiterianismo
  foi restabelecido na Church of Scotland. Entre seus bispos estão Robert Kilgour (Aberdeen, primus), John Skinner
  (coadjutor de Aberdeen) e Arthur Petrie (Ross e Moray).
sources:
- source: fund-wp-en-sec
  quote: >-
    With the 1689 refusal of the Scottish bishops to swear allegiance to William of Orange whilst James VII lived
    and had not abdicated, the Presbyterian polity was finally re-established in the Church of Scotland.
