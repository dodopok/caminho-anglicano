id: icala
acronym: ICALA
name: >-
  Igreja Católico Anglicana Latino Americana (Província da América Latina da Comunhão Anglicana Independente)
aliases:
- Igreja Católico Anglicana Latino Americana
type: province
country: BR
description: >-
  Província latino-americana da Comunhão Anglicana Independente, também chamada Igreja Anglicana Latina, cujo arcebispo
  foi Leonardo Marin-Saavedra. A Igreja Anglicana do Brasil, de Ricardo Lorite, aparece como parte dela desde 2005,
  com a Paróquia Anglicana Thomas Cranmer elevada a diocese missionária; em 2023, o retorno das atividades dessa
  igreja foi fomentado após contato com a ICALA.
