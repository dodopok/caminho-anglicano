description: >-
  Igreja anglicana fundada em 2005 pelo bispo Francisco Buzzo Rodrigues a partir de uma paróquia de Bragança Paulista
  (SP), antes ligada à Igreja Episcopal Reformada do Brasil e à Reformed Episcopal Church; realizou o primeiro sínodo
  em 2009. Buzzo foi bispo diocesano até abril de 2012, quando se tornou emérito; as fontes divergem sobre a primazia,
  atribuindo-a a Josep Rosselló Ferrer de 2012 a maio de 2021. Em 2014 foi recebida pela Free Church of England
  (FCE) como missão e, em 5 de maio de 2021, o sínodo da diocese decidiu deixá-la, após declarar comunhão prejudicada
  com o Bishop Primus, voltando a ser independente. Segundo a Wikipédia em português, Buzzo reassumiu a primazia
  até 2023, quando Diógenes Monteiro da Silva foi eleito primaz; Gleidson Oliveira é bispo missionário.
sources:
- source: ptwiki-iarb
  quote: >-
    Foi fundada em 2005 pelo bispo Francisco Buzzo Rodrigues a partir de uma paróquia anglicana em Bragança Paulista,
    Estado de São Paulo.
- source: cant-novas-igrejas-2024
  quote: >-
    A Igreja Anglicana Reformada do Brasil (IARB) surgiu em 2005, a partir da liderança do bispo Francisco Buzzo
    Rodrigues, a partir de uma comunidade em Bragança Paulista, no estado de São Paulo, até então ligada à Igreja
    Episcopal Reformada do Brasil.
  page: '133'
- source: ptwiki-iarb
  quote: >-
    Após a fundação, a paróquia integrou-se à Igreja Episcopal Reformada, uma denominação anglicana norte-americana.
- source: ai-2014-fce-brazil
  quote: The IARB held its first Synod in 2009.
- source: ptwiki-iarb
  quote: >-
    Em abril de 2012, o bispo Francisco Buzzo tornou-se bispo emérito, sendo eleito assim Josep Rossello, como o
    novo bispo primaz da IARB.
- source: cant-novas-igrejas-2024
  quote: Em abril de 2012, o bispo missionário Josep Rossello foi eleito como o novo bispo da instituição.
  page: '133'
- source: ptwiki-iarb
  quote: sendo eleito assim Josep Rossello, como o novo bispo primaz da IARB.
- source: ai-2014-fce-brazil
  quote: >-
    The first Brazilian congregations were received on Easter Sunday 2014, and others are expected to be received
    during the course of the year.
- source: ai-2021-fce-withdraw
  quote: >-
    At the Extraordinary Synod that took place yesterday, May 5, 2021, the Synod of the Diocese of South America
    unanimously approved a motion and resolution to leave the Free Church of England.
- source: ai-2021-fce-impaired
  quote: >-
    In response to the above there was no option other than for the Synod of the South American Diocese to declare
    itself to be in IMPAIRED COMMUNION with Bishop Primus John Fenwick
- source: ptwiki-iarb
  quote: >-
    No ano de 2021, a IARB separou-se da Igreja Livre da Inglaterra, voltando a funcionar como denominação independente.
    Desde então, o bispo emérito Francisco Buzzo voltou a exercer seu episcopado.
- source: ptwiki-iarb
  quote: Como seu sucessor, a Câmara dos Bispos elegeu o bispo Diógenes Monteiro da Silva como novo primaz.
- source: ptwiki-iarb
  quote: Gleidson Oliveira - Bispo missionário.
relations:
