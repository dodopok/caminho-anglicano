description: >-
  Igreja anglicana que surgiu em 2005, por liderança do bispo Francisco Buzzo Rodrigues, a partir de uma paróquia
  de Bragança Paulista (SP) até então ligada à Igreja Episcopal Reformada do Brasil; após a fundação, a paróquia
  integrou-se à Igreja Episcopal Reformada, denominação anglicana norte-americana. Realizou seu primeiro sínodo
  em 2009. Em dezembro de 2011, o reverendo Virgílio Torres deixou a IARB e fundou a IEP. Em abril de 2012 Buzzo
  tornou-se bispo emérito e Josep Rosselló foi eleito novo bispo; as fontes divergem quanto ao seu título, citando-o
  como primaz de 2012 a maio de 2021 ou como bispo missionário. Em 2014 a IARB foi recebida pela Free Church of
  England (FCE) como missão no Brasil. Em 5 de maio de 2021, o sínodo da diocese da América do Sul, que declarara
  comunhão prejudicada com o Bishop Primus John Fenwick, decidiu por unanimidade deixar a FCE, e a IARB voltou a
  ser independente. Buzzo reassumiu o episcopado e a primazia, que deixou em 2023, quando a Câmara dos Bispos elegeu
  primaz Diógenes Monteiro da Silva, natural de Pesqueira (PE); Gleidson Oliveira é bispo missionário. Após o Sínodo
  de 2023, a paróquia de Santa Cruz do Capibaribe, implantada por Diógenes em 2011, foi elevada a catedral.
