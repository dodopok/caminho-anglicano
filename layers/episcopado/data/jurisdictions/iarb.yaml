    page: '152'
  notes: >-
    Páscoa de 2014 = 20/4/2014. Conversas informais desde 2011; o Sínodo Nacional da IARB aprovou a filiação em
    2012; a Convocação da FCE acolheu em 2013. As igrejas formaram depois a 'South American Diocese' da FCE (Brasil
    e Venezuela). Costa (2021) dá fevereiro de 2014; a FCE (Anglican Ink) dá a Páscoa de 2014 para a recepção das
    primeiras congregações.
