relations:
- type: member_of
  target: rec
  date: '2005'
  led_by:
  - francisco-buzzo-rodrigues
  status: probable
  sources:
  - source: ptwiki-iarb
    quote: >-
      Após a fundação, a paróquia integrou-se à Igreja Episcopal Reformada, uma denominação anglicana norte-americana.
  notes: >-
    Única fonte encontrada é a Wikipédia (citando a página 'Nossa história' do site da IARB, hoje fora do ar). Não
    achei confirmação em rechurch.org nem data de saída da REC. A capa do LOC da IARB de 2009 traz 'FREE CHURCH
    OF ENGLAND (EVANGELICAL CONNEXION)', o que indica que em 2009 a IARB se apresentava ligada à Evangelical Connexion
    — corpo distinto da FCE que é parceira da REC. A afirmação do usuário (IARB ⊂ REC) só tem apoio terciário até
    aqui.
- type: in_communion_with
  target: fce-ec
  date: '2009'
  led_by:
  - francisco-buzzo-rodrigues
  status: probable
  sources:
  - source: loc-iarb-2009
    quote: IGREJA ANGLICANA REFORMADA NO BRASIL FREE CHURCH OF ENGLAND (EVANGELICAL CONNEXION)
  notes: >-
    Inferido apenas do cabeçalho da capa do LOC de 2009 (fonte primária). Natureza exata do vínculo não descrita.
    O próprio site Caminho Anglicano descreve este LOC como 'Adotado pela Igreja Anglicana Reformada do Brasil,
    na época que era parte da Free Church of England'.
