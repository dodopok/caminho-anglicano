  - source: christiantoday-2014-fce
    quote: >-
      They are the first wave of a group of churches from the group Igreja Anglicana Reformada (IARB) to officially
      join, having established their support and alignment with the constitution and canons of the FCE.
  - source: ai-2021-fce-withdraw
    quote: >-
      At the Extraordinary Synod that took place yesterday, May 5, 2021, the Synod of the Diocese of South America
      unanimously approved a motion and resolution to leave the Free Church of England.
  - source: costa2021
    quote: >-
      Em fevereiro de 2014, a Igreja Anglicana Reformada foi recebida como uma missão oficial da Free Church of
      England para o Brasil e Josep Rossello tornou-se seu Bispo Primaz, permanecendo no cargo até maio de 2021
  - source: costa2021
    quote: >-
      Em fevereiro de 2014, a Igreja Anglicana Reformada foi recebida como uma missão oficial da Free Church of
