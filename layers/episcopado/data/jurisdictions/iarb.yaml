    quote: >-
      Após a fundação, a paróquia integrou-se à Igreja Episcopal Reformada, uma denominação anglicana norte-americana.
  notes: >-
    Única fonte encontrada é a Wikipédia (citando a página 'Nossa história' do site da IARB, hoje fora do ar). Não
    achei confirmação em rechurch.org nem data de saída da REC. A capa do LOC da IARB de 2009 traz 'FREE CHURCH
    OF ENGLAND (EVANGELICAL CONNEXION)', o que indica que em 2009 a IARB se apresentava ligada à Evangelical Connexion
    — corpo distinto da FCE que é parceira da REC. A afirmação do usuário (IARB ⊂ REC) só tem apoio terciário até
    aqui.
