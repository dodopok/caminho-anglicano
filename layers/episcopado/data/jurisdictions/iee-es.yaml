id: iee-es
acronym: IEE-ES
name: Igreja Evangélica Episcopal (Espanha), segundo o bispo Josep Rosselló
type: other
country: ES
description: >-
  Igreja que, segundo o currículo do próprio Rosselló, ele 'estabeleceu' na Espanha ao voltar da Inglaterra/EUA,
  antes de ir ao Brasil (2007). Costa (2021, já na base) diz que ele foi sagrado bispo missionário na 'Igreja Evangélica
  Episcopal'; a identidade desta com a EEC/CEEC da base NÃO está estabelecida. Registro provisório, só com a autodeclaração.
sources:
- source: cont-cafe-quemsou
  quote: Voltou para a Espanha, onde plantou igrejas e estabeleceu a Igreja Evangélica Episcopal.
