description: >-
  Rede de diálogo e cooperação entre jurisdições anglicanas ortodoxas brasileiras, criada com a assinatura da Declaração
  da Boa Viagem (Recife, 30/09/2006), com base doutrinária que adota o Quadrilátero de Lambeth, os Trinta e Nove
  Artigos e a Resolução 1.10 de Lambeth (1998), tendo em vista uma futura "Rede Anglicana do Brasil".
