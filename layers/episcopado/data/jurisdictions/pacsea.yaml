      as well as the Anglican Church of Brazil.
  notes: >-
    Também signatário do comunicado do GSFA de jan/2026, segundo o qual "GSFA is staying within the Anglican Communion".
    Posição reafirmada na declaração dos bispos da província (28/10/2025) em resposta ao GAFCON: questões "existenciais,
    estruturais e eclesiológicas" exigem discernimento pelo sínodo provincial; a província segue no GSFA.
