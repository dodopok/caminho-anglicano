description: >-
  Igreja de padres casados fundada, segundo Osiel Luiz Santos, em 03/02/1989 em Goiânia, registrada em cartório
  em 2009 (CNPJ 11.176.954/0001-76, aberto em 04/09/2009; situação 'inapta' desde 18/10/2018). Declara-se 'Sé Primacial
  Apostólica no Brasil' e filha da Igreja Romana, com celibato opcional e ordenação de mulheres. Mantinha comunhão
  plena com a Igreja Anglicana Ortodoxa no Brasil (2014).
