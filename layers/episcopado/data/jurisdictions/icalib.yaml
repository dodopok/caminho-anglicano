description: >-
  Igreja fundada, segundo Osiel Luiz Santos, em 3 de fevereiro de 1989 e registrada em cartório em 9 de agosto de
  2009; Osiel é seu bispo primaz. O CNPJ tem início de atividades em 4 de setembro de 2009 e situação inapta, e
  a igreja mantinha comunhão plena com a Igreja Anglicana Ortodoxa no Brasil em 2014.
