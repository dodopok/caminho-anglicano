id: fpec
acronym: FPEC
name: Free Protestant Episcopal Church of England
type: communion
country: GB
founded:
  date: '1897-11-02'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      É uma jurisdição que tem origem na Igreja Episcopal Protestante Livre, fundada na Inglaterra em 02 de novembro
      de 1897
    page: '101'
  - source: iau-historia
    quote: >-
      O momento decisivo ocorreu em 2 de novembro de 1897, quando representantes dessas diferentes comunidades reuniram-se
      na Igreja de Santo Estêvão (St. Stephen's Church), em East Ham, Londres.
  - source: iau-historia
    quote: a FPEC não integra a Comunhão Anglicana vinculada ao Arcebispo de Canterbury
description: >-
  Igreja fundada em 2 de novembro de 1897, quando representantes de comunidades diversas se reuniram na igreja de
  St. Stephen, em East Ham, Londres; não integra a Comunhão Anglicana ligada ao Arcebispo de Cantuária. Richard
  Arthur Palmer foi seu arcebispo até a destituição, em 2020, ano em que a Comunhão Anglicana Livre Internacional
  passou a ser apresentada como sucessora legal. A Igreja Anglicana Unida (IAU) é sua província sul-americana.
