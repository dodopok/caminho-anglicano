    page: '81'
  - source: cant-novas-igrejas-2024
    quote: A filiação definitiva das Dioceses brasileiras na TAC se concretizou durante o Sínodo Geral.
    page: '81'
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana Tradicional (TAC) [Filiação à TAC em 2025]
    page: '171'
