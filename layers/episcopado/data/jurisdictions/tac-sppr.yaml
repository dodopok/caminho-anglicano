description: >-
  A Diocese Anglicana de São Paulo e Paraná, criada em 2019, tem como sede e catedral a Paróquia da Anunciação da
  Virgem Maria, no Ipiranga (São Paulo). Seu bispo diocesano é Itabira Jonas, um dos bispos ordenados por James
  Roque e um dos dois bispos da Traditional Anglican Church (TAC) no Brasil. Integrou a Igreja Anglicana de Confissão
  Continuante e, em 2025, filiou-se à TAC, no Sínodo Geral. Tem também missões em Londrina e região norte do Paraná
  (Santa Maria Virgem), no Alto Tietê (Sagrada Família) e em Sorocaba e região (São Mateus).
