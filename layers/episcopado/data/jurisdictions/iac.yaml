website: https://gazetadaiac.blogspot.com/
description: >-
  Igreja anglicana independente baseada em Brasília. O blog oficial (Gazeta da IAC), administrado pelo "Ministério
  Amplitude" com autorização do arcebispo primaz, foi aberto em 30/12/2021 e publicou a Constituição e Cânones em
  19/02/2022, o que é compatível com a fundação em 2022 indicada por Costa (2024). O blog lista cinco bispos, dois
  presbíteros e três diáconos/diaconisas e afirma ter alcançado intercomunhão com a "província do Caribe e Nova
  Granada". O CNPJ impresso no rodapé do blog (03.658.648/0001-48) pertence, na base da Receita Federal, a outra
  entidade (ver dúvidas).
