description: >-
  Igreja anglicana independente fundada em 2022 em Brasília; primaz Valdiley Abadia da Silva; afirma associação
  à Província Anglicana del Caribe y la Nueva Granada (Colômbia) e à The Anglican Apostolic Communion in the Americas
  (Flórida); subscreve os 39 Artigos e a Afirmação de St. Louis; não ordena mulheres ao presbiterato/episcopado,
  mas ordena diaconisas.
