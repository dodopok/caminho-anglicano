website: https://gazetadaiac.blogspot.com/
description: >-
  Igreja anglicana continuante e de rito anglo-católico no Brasil, cujo blog oficial foi aberto em 30 de dezembro
  de 2021 e publicou a Constituição e os Cânones em 19 de fevereiro de 2022, data próxima à fundação em 2022; afirma
  não criar uma nova igreja, mas continuar o anglicanismo histórico. O clero reúne Valdiley Abadia da Silva (bispo
  primaz e presidente), Gleidson Antônio do Nascimento Alves (bispo eleito e vice-presidente), Sebastião Edilson
  de Alencar (bispo de Brasília), Emival Silva Ribeiro (emérito de Goiânia) e Éric Massaro Baptista (secretário-geral).
  Declara intercomunhão com a Província Anglicana del Caribe y la Nueva Granada e associação à Anglican Apostolic
  Communion in the Americas, com sede na Flórida.
