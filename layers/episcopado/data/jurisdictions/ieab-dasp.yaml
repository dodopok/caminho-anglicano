description: >-
  A Diocese Anglicana de São Paulo, inicialmente Diocese Sul Central, foi criada em 1969, abrangendo São Paulo,
  Paraná e Mato Grosso do Sul, e instalada em outubro de 1970. Seus bispos diocesanos foram Elliott Lorenz Sorge
  (1971–1977), que renunciou para integrar o Council on the Development of Ministry da Igreja Episcopal, e Sumio
  Takatsu (1977–1989). Glauco Soares de Lima, sagrado em 1º de outubro de 1989 pelo primaz Olavo Ventura Luiz, assumiu
  em janeiro de 1990 e foi bispo até 2002, seguido por Hiroshi Ito (2002–2006) e Roger Douglas Bird (2007–2013).
  Em 16 de março de 2013, data da compulsória de Bird, o primaz Maurício Andrade assumiu a diocese sob supervisão
  primacial temporária; em 10 de maio, Bird anunciou por carta sua saída da IEAB, e Glauco, então emérito, também
  se desligou da igreja em 2013. Flávio Augusto Borges Irala foi sagrado e investido em 14 de setembro de 2013 como
  6º bispo diocesano e passou a emérito em 2021. Francisco de Assis da Silva (2017–2018) e Naudal Alves Gomes (2018–2020)
  foram bispos interinos. Francisco Cézar Fernandes Alves, coadjutor desde 2020, foi investido bispo diocesano em
  31 de outubro de 2021.
