description: >-
  A Diocese Anglicana de São Paulo, inicialmente Diocese Sul Central, foi criada em 1969 e instalada em 1970 (Costa
  indica 1970). Seus bispos diocesanos foram Elliott Lorenz Sorge (1971–1977), Sumio Takatsu (1977–1989), Glauco
  Soares de Lima (coadjutor em 1989; diocesano de 1990 a 2002), Hiroshi Ito (2002–2006) e Roger Douglas Bird (2007–2013),
  cuja saída é registrada pela compulsória de 16 de março de 2013 e, em 10 de maio, pelo anúncio de sua saída da
  IEAB. Flávio Augusto Borges Irala foi sagrado em 14 de setembro de 2013 e tornou-se emérito em 2021; Francisco
  Cézar Fernandes Alves, coadjutor desde 2020, foi investido bispo diocesano em 31 de outubro de 2021.
