# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: province-of-west-africa
acronym: province-of-west-africa
name: Province of West Africa
type: province
founded:
  date: '1951'
  sources:
  - source: fund-wp-en-pwa
    quote: >-
      The Church of the Province of West Africa was established in 1951 by the bishops of five West African dioceses
      (Accra, Lagos, Niger, Sierra Leone and the Diocese of Gambia and Guinea) with the consent of the Archbishop
      of Canterbury.
  - source: perd03-wp-pwa
    quote: >-
      In 1977 they were joined by the Diocese of Liberia. In February 1979, the new Church of Nigeria was inaugurated
      as a separate province.
description: >-
  Província anglicana fundada em 1951 pelos bispos de cinco dioceses da África Ocidental (Accra, Lagos, Níger, Serra
  Leoa e Gâmbia e Guiné), da qual fazia parte a Diocese de Serra Leoa.
sources:
