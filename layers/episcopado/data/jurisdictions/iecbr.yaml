description: >-
  Igreja independente do bispo Markos Leal, datada de 2010 numa fonte e, segundo o próprio ministério, nascida em
  janeiro de 2011, presente no Recife por meio do Ministério Orando em Família. Tem laços de intercomunhão com a
  Pequena Igreja Apostólica Galicana.
