# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: dmsb
acronym: DMSB
name: >-
  Distrito Missionário do Sul do Brasil (Missionary District of Southern Brazil) — antes 'missão' e 'Bishop for
  Brazil'
aliases:
- Distrito Missionário do Sul do Brasil
- Distrito Missionário do Sul do Brasil (Missionary District of Southern Brazil)
type: diocese
country: BR
founded:
  date: '1907'
  sources:
  - source: wp-en-kinsolving
    quote: >-
      in 1907, the General Convention formally recognized the Brazilian Convocation as a Missionary District, which
      required Kinsolving's resignation and re-election as Missionary Bishop of Southern Brazil
  - source: ens-xxvi-24
    quote: >-
      The state of Rio Grande do Sul was cut into two parts; the eastern, which retained the old name "Southern
      Brazil"
  - source: liv-stokes-kinsolving
    quote: In 1907 the General Convention established the Missionary District of Brazil
    page: '16'
  - source: liv-stokes-kinsolving
    quote: the reorganization of the Brazil Mission in 1949 into three separate dio- ceses
    page: '21'
  - source: costa2021
    quote: a Convenção Geral da Igreja dos Estados Unidos elevou o país ao status de um Distrito Missionário.
    page: '58'
dissolved:
  date: '1965'
  sources:
  - source: costa2021
    quote: a Convenção Geral da Igreja dos Estados Unidos elevou o país ao status de um Distrito Missionário.
    page: '58'
description: >-
  Jurisdição missionária da TEC no Brasil: missão (1889/1890), bispo 'for Brazil' (1899), distrito missionário reconhecido
  em 1907 (chamado 'of Brazil'/'Southern Brazil'); dividido em 1949, mantendo o nome Southern Brazil para a parte
  leste do RS.
sources:
- source: wp-en-kinsolving
  quote: >-
    in 1907, the General Convention formally recognized the Brazilian Convocation as a Missionary District, which
    required Kinsolving's resignation and re-election as Missionary Bishop of Southern Brazil
- source: ens-xxvi-24
  quote: >-
    The state of Rio Grande do Sul was cut into two parts; the eastern, which retained the old name "Southern Brazil"
relations:
- type: part_of
  target: tec
  date: '1899'
  end: '1965'
  led_by:
  - lucien-lee-kinsolving
  status: contested
  sources:
  - source: ens-xxvi-24
    quote: >-
      At the end of the first decade of work, the Rev. Lucien Lee Kinsolving, one of the two original American missionaries,
      was elected Bishop of the District by the House of Bishops and Anglican work in Brazil, with the exception
      of a few Church of England chaplaincies, came formally under the direction of the Episcopal Church in the
      United States.
  - source: liv-stokes-kinsolving
    quote: >-
      the Brazilian Episcopal Church became officially related to the Prot- estant Episcopal Church in the United
      States of Amer- ica as a missionary district
    page: '16'
  - source: costa2021
    quote: a Convenção Geral da Igreja dos Estados Unidos elevou o país ao status de um Distrito Missionário.
    page: '58'
  notes: >-
    Distrito missionário formal desde 1907 (Wikipédia EN/PT). Relação como distrito missionário da Igreja Episcopal
    dos EUA a partir de 1907.
  discrepancies:
  - field: date
    value: '1907'
    sources:
    - source: liv-stokes-kinsolving
      quote: >-
        the Brazilian Episcopal Church became officially related to the Prot- estant Episcopal Church in the United
        States of Amer- ica as a missionary district
      page: '16'
    - source: costa2021
      quote: a Convenção Geral da Igreja dos Estados Unidos elevou o país ao status de um Distrito Missionário.
      page: '58'
- type: part_of
  target: acms
  date: '1889'
  end: '1905-01-01'
  status: confirmed
  sources:
  - source: wp-en-kinsolving
    quote: >-
      whereupon they set out on a stormy sea voyage to Brazil, sponsored by the American Church Missionary Society.
  - source: som-1899-02
    quote: The work in Brazil is supported by our auxiliary, The American Church Missionary Society
  notes: Patrocínio da missão pela ACMS até a transferência à DFMS em 1/1/1905 (Wikipédia).
