description: >-
  Jurisdição missionária da TEC no Brasil. Os missionários, apoiados desde 1889 pela American Church Missionary
  Society, estavam sob a jurisdição provisória do bispo George William Peterkin, da Diocese de West Virgínia, até
  1899, quando Lucien Lee Kinsolving passou a bispo; em 1907 a Convenção Geral reconheceu a convocação brasileira
  como distrito missionário. Kinsolving aposentou-se em 1928 e foi sucedido por William M. M. Thomas, sufragâneo
  desde 1925, bispo até 1949; Athalício Pithan foi sufragâneo desde 1940 e Louis Chester Melcher, coadjutor desde
  1948. Em 1949 o distrito foi dividido em três e este manteve o nome Southern Brazil (leste do Rio Grande do Sul),
  com Melcher como diocesano em 1949-1950, Pithan de 1950 a 1955 e Egmont Krischke de 1955 a 1965. Em 25 de abril
  de 1965 passou à Igreja Episcopal do Brasil.
