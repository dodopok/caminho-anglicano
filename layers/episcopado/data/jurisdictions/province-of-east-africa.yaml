id: province-of-east-africa
name: Province of East Africa
type: province
tradition: anglican
description: >-
  Província da qual a Igreja Anglicana do Quênia fez parte a partir de 1960, até que Quênia e Tanzânia foram divididas
  em províncias separadas em 1970.
sources:
- source: fund-wp-en-ack
  quote: >-
    The church became part of the Province of East Africa in 1960, but Kenya and Tanzania were divided into separate
    provinces in 1970.
