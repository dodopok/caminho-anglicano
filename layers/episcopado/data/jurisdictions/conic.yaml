# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: conic
acronym: CONIC
name: Conselho Nacional de Igrejas Cristãs do Brasil
type: network
country: BR
description: >-
  Conselho ecumênico nacional do qual a IEAB é membro; sua assembleia de junho de 2023, em Brasília, elegeu pela
  primeira vez uma mulher para a presidência: a bispa anglicana Magda Guedes.
sources:
- source: lic-ieab-magda-conic-2023
  quote: >-
    Brasília foi sede, nos dias 15, 16 e 17 de junho (2023), da XX Assembleia Geral Ordinária e da Assembleia Geral
    Extraordinária do Conselho Nacional de Igrejas Cristãs do Brasil (CONIC).
