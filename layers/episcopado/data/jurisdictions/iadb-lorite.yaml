website: https://anglicanchurch.weebly.com/
description: >-
  Igreja independente fundada em 2005 a partir de ex-membros da Diocese Anglicana de São Paulo (IEAB), tendo Ricardo
  Lorite de Lima como arcebispo primaz, Rui Costa Barbosa como bispo coadjutor (2006) e Célio França Spinelli como
  bispo da Diocese Anglicana Thomas Becket e vigário geral. Subscreveu em 30 de setembro de 2006 a Declaração da
  Boa Viagem. Dela saíram Rui Costa Barbosa, que criou a Diocese Anglicana Católica do Brasil, depois Igreja Anglicana
  Tradicional do Brasil, e Josué Torres, que fundou a Igreja Episcopal do Evangelho Pleno. Encerrou as atividades
  em 30 de outubro de 2017, e Lorite reorganizou o grupo como Igreja Protestante Unida; retomou-as em 1º de julho
  de 2023, após contato com a ICALA, com Frei Eduardo Faria como bispo primaz e Lorite como primaz emérito.
