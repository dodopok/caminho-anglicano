# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: iadb-lorite
acronym: IAdB-Lorite
name: Igreja Anglicana do Brasil (de Ricardo Lorite; não confundir com a IAB)
type: national_church
country: BR
founded:
  date: '2005-03-27'
  sources:
  - source: ig-josue-2025-03-28-presbiterato-2005
    quote: >-
      Na data de 27 de março de 2005, Domingo de Páscoa, os Rev. Diáconos Ricardo Lorite de Lima, Rui Costa Barbosa,
      Luis Fernando Salgado e Josué Souza Torres foram elevados ao Ministério Presbiteral da Igreja de Cristo, Una,
      Santa, Católica e Apostólica, através da imposição das mãos de Dom Iranildo Macieira das Silva (Dom Lucas).
      A cerimônia de Ordenação ocorreu na Igreja Evangélica Congregacional de Ribeirão Preto. … Foi um momento de
      muita alegria para todos, pois tal acontecimento iniciou as atividades da Igreja Anglicana do Brasil
dissolved:
  date: '2017-10-30'
  sources:
  - source: costa-2021-tese
    quote: >-
      Em 30 de outubro de 2017, a Igreja Anglicana do Brasil encerrou suas atividades, deixando uma mensagem em
      seu site
  - source: costa-2021-tese
    quote: >-
      originada a partir de um grupo formado por ex-membros da Diocese Anglicana de São Paulo (DASP), Ricardo Lorite
      de Lima, Rui Costa Barbosa, Luis Fernando Salgado e Josué Sousa Torres.
description: >-
  Igreja independente formada por ex-membros da Diocese Anglicana de São Paulo (IEAB): Ricardo Lorite de Lima, Rui
  Costa Barbosa, Luis Fernando Salgado e Josué Sousa Torres. Encerrou suas atividades em 30/10/2017, por decisão
  do Sínodo de abril de 2017.
sources:
- source: costa-2021-tese
  quote: >-
    Em 30 de outubro de 2017, a Igreja Anglicana do Brasil encerrou suas atividades, deixando uma mensagem em seu
    site
- source: costa-2021-tese
  quote: >-
    originada a partir de um grupo formado por ex-membros da Diocese Anglicana de São Paulo (DASP), Ricardo Lorite
    de Lima, Rui Costa Barbosa, Luis Fernando Salgado e Josué Sousa Torres.
