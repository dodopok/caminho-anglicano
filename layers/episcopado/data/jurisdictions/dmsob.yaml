    quote: the western, which became "Southwestern Brazil.
  - source: wit-1950-03-30
    quote: >-
      Bishop Krischke has named Santa Maria his see city, and plans to rpake the Church of the Mediator there his
      cathedral.
description: >-
  Distrito missionário da TEC criado em 1949 com a divisão do Distrito do Sul do Brasil, com sé em Santa Maria (RS).
  Egmont Machado Krischke foi seu bispo de 1950 a 1955, quando foi transferido para o Sul; Plínio Lauer Simões foi
  sagrado em 4 de março de 1956 e permaneceu bispo até 1976, à frente da jurisdição que passou à Igreja Episcopal
  do Brasil em 25 de abril de 1965.
sources:
