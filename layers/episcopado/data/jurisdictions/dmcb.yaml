name: Distrito Missionário do Brasil Central (Missionary District of Central Brazil)
aliases:
- Diocese do Brasil Central
type: diocese
country: BR
founded:
  date: '1949'
  sources:
  - source: ens-xxvi-24
    quote: >-
      The third district "Central Brazil" includes all the rest of the nation, although at the time there were no
      missions north of Rio de Janeiro.
  - source: wit-1952-03-20
    quote: Central Brazil; Rio de Janeiro; Rt. Rev. Louis C. Melcher, D.D., 18 clergy; 4 parishes;
description: >-
  Distrito missionário da TEC criado em 1949 para o restante do país, com sede no Rio de Janeiro. Louis Chester
  Melcher foi seu bispo de 1950 a 1958 e Edmund Knox Sherrill, eleito para sucedê-lo, de 1959 a 1965; em 25 de abril
  de 1965 a jurisdição passou à Igreja Episcopal do Brasil.
