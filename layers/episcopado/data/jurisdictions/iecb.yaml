  notes: >-
    Fundou a Igreja Episcopal Carismatica do Brasil (ICCEC). Fora do escopo episcopal da IEAB; registrado como contexto.
    A comunidade da Catedral da Santíssima Trindade (Recife) seguiu Paulo Garcia para a Igreja Episcopal Carismática.
    A sigla IECB designa a Igreja Episcopal Carismática do Brasil. A data do rompimento (2002) confirma os pôsteres
    da IAB quanto ao ano; a organização formal da IECB e a sagração de Garcia são de 2003. Ambas as fontes são Wikipédia
    (terciárias), apoiadas em Queiroz (2004) e Costa (2025). Paulo Garcia era o deão/reitor da Catedral da Trindade
    (Diocese do Recife). Saída da Catedral da Santíssima Trindade (Diocese Anglicana do Recife); três paróquias
    o seguiram (p. 55). Queiroz (2017) chama o episódio de 'primeiro cisma da Diocese do Recife'. Saída da Catedral
    da SS. Trindade (Rua Carneiro Vilela, Recife), com o templo e quase todos os membros; três paróquias o seguiram.
    Na orientação de 06/01/2003 o bispo diocesano trata como cisma a separação, em 2002, de parte da Diocese do
    Recife que passou à Igreja Episcopal Carismática; a página não nomeia seus líderes nem a data exata.
