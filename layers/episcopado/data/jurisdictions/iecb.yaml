id: iecb
acronym: IECB
name: Igreja Episcopal Carismática do Brasil
type: national_church
tradition: charismatic_episcopal
country: BR
founded:
  date: '2002'
  sources:
  - source: queiroz-2004-ufpe
    quote: >-
      a vinculação do Pr. Paulo à Igreja Episcopal Carismática, na qual ele foi sagrado o primeiro Bispo do Brasil.
  - source: ptwiki-iecb
    quote: >-
      No Brasil, a Igreja Episcopal Carismática organiza-se em 2003, a partir da saída do Reverendo Paulo Ruiz Garcia
      da Igreja Episcopal Anglicana do Brasil
  - source: ptwiki-iecb
    quote: A sede da IECB se encontra na Catedral da Trindade (Recife), localizada nos Aflitos (Recife).
  - source: costa-2021-tese
    quote: Esta denominação chegou ao Brasil no ano de 2002.
locator_slug: iecb
wikidata: Q138547121
website: https://novo.iecbrasil.com.br/
description: >-
  Igreja formada em 2002 a partir da comunidade da Catedral da Santíssima Trindade (Recife) liderada por Paulo Garcia,
  ligada à Igreja Episcopal Carismática.
sources:
- source: queiroz-2004-ufpe
  quote: >-
    a vinculação do Pr. Paulo à Igreja Episcopal Carismática, na qual ele foi sagrado o primeiro Bispo do Brasil.
relations:
- type: schism_from
  target: ieab
  date: '2002-09-20'
  led_by:
  - paulo-garcia
  status: probable
  sources:
  - source: costa2021
    quote: >-
      Em setembro de 2002, ocorreu o que chamamos de “Pequena Crise do Recife”105, quando o reverendo Paulo Garcia,
      então deão da Catedral da Santíssima Trindade, rompeu com a Diocese e a Província.
  - source: queiroz-2004-ufpe
    quote: >-
      O templo que está sendo disputado na justiça é o mesmo que o Pr. Paulo Garcia transformou na Igreja Episcopal
      Carismática.
  - source: queiroz-2004-ufpe
    quote: só foi trocar
  - source: queiroz-2004-ufpe
    quote: “episcopal anglicana” por “episcopal carismática”.
  - source: ptwiki-iecb
    quote: >-
      Em 20 de setembro de 2002, durante um culto noturno, Paulo Garcia anunciou seu rompimento com a IEAB. Por
      meio de uma assembleia paroquial, a comunidade aprovou a desvinculação da Comunhão Anglicana.
  - source: ptwp-dar
    quote: A primeira divisão ocorreu com o então deão da Catedral Anglicana do Recife, reverendo Paulo Garcia.
  - source: iab-poster-linhagem-meira
    quote: >-
      Em 2002, o deão Paulo Garcia, então líder da catedral em Recife, rompeu com a IEAB por divergências teológicas
      e fundou a Igreja Episcopal Carismática do Brasil (IECB)
  notes: >-
    Fundou a Igreja Episcopal Carismatica do Brasil (ICCEC). Fora do escopo episcopal da IEAB; registrado como contexto.
    A comunidade da Catedral da Santíssima Trindade (Recife) seguiu Paulo Garcia para a Igreja Episcopal Carismática.
    A sigla IECB designa a Igreja Episcopal Carismática do Brasil. A data do rompimento (2002) confirma os pôsteres
    da IAB quanto ao ano; a organização formal da IECB e a sagração de Garcia são de 2003. Ambas as fontes são Wikipédia
    (terciárias), apoiadas em Queiroz (2004) e Costa (2025). Paulo Garcia era o deão/reitor da Catedral da Trindade
    (Diocese do Recife).
- type: member_of
  target: iccec
  date: 2002/2003
  end: '2019-03-24'
  led_by:
  - paulo-garcia
  status: contested
  sources:
  - source: ptwiki-iecb
    quote: >-
      Posteriormente, ele se filiou à Comunhão Internacional da Igreja Episcopal Carismática e fundou, no Recife,
      a Igreja Episcopal Carismática do Brasil (IECB).
  - source: ptwp-dar
    quote: >-
      Este acabou fundando a Igreja Episcopal Carismática do Brasil (IECB) – parte da Comunhão Internacional da
      Igreja Episcopal Carismática (em inglês, International Communion of the Charismatic Episcopal Church - ICCEC)
      – no final de 2002
  - source: costa-2021-tese
    quote: >-
      No dia 24 de março de 2019 um comunicado foi publicado na página do Facebook e nos boletins das paróquias
      e catedrais, informando que a denominação brasileira havia se separado da Comunhão Internacional da Igreja
      Episcopal Carismática.
  - source: enwiki-iccec-bispos
    quote: '|42||8 September 2003||1 4 6||Paulo Ruiz Garcia||Abp. and Primate Brazil|| Resigned'
  notes: >-
    Data de saída da ICCEC não encontrada; a Wikipédia descreve a IECB 'atualmente' como igreja nacional autônoma
    organizada em torno da CEI, o que sugere desligamento ou autonomia posterior. Não confirmado em fonte da ICCEC.
    CORREÇÃO: segundo Costa (2021), a IECB só deixou a ICCEC em 24/3/2019, depois de atritos com o patriarca Craig
    Bates (visita ao Recife em ago/2018) por padronização litúrgica e pela aposentadoria compulsória de Garcia aos
    80 anos. A ausência de sagrações brasileiras na lista da Wikipédia após 2009 é, portanto, lacuna da lista, não
    indício de saída. Na lista oficial reproduzida pela Wikipédia EN, Garcia figura como 'Abp. and Primate Brazil'
    da ICCEC, com a nota 'Resigned'. As sagrações brasileiras até 16/11/2009 constam da lista; depois disso não
    aparecem, o que sugere saída da IECB da ICCEC após 2009 (data não encontrada). O site atual da ICCEC não menciona
    o Brasil. CORREÇÃO: segundo Costa (2021), a IECB só deixou a ICCEC em 24/3/2019, depois de atritos com o patriarca
    Craig Bates (visita ao Recife em ago/2018) por padronização litúrgica e pela aposentadoria compulsória de Garcia
    aos 80 anos. A ausência de sagrações brasileiras na lista da Wikipédia após 2009 é, portanto, lacuna da lista,
    não indício de saída.
  discrepancies:
  - field: date
    value: '2003-09-08'
    sources:
    - source: enwiki-iccec-bispos
      quote: '|42||8 September 2003||1 4 6||Paulo Ruiz Garcia||Abp. and Primate Brazil|| Resigned'
    - source: costa-2021-tese
      quote: >-
        No dia 24 de março de 2019 um comunicado foi publicado na página do Facebook e nos boletins das paróquias
        e catedrais, informando que a denominação brasileira havia se separado da Comunhão Internacional da Igreja
        Episcopal Carismática.
- type: member_of
  target: cei
  date: '2019'
  led_by:
  - paulo-garcia
  status: probable
  sources:
  - source: ptwiki-iecb
    quote: >-
      Atualmente, a Igreja Episcopal Carismática do Brasil é uma Igreja nacional autônoma, que se organiza em torno
      da Comunhão Episcopal Internacional (CEI).
- type: broke_communion_with
  target: iccec
  date: '2019-03-24'
  led_by:
  - andre-novaes-de-albuquerque-cavalcanti
  - paulo-garcia
  status: probable
  sources:
  - source: costa-2021-tese
    quote: >-
      Por solicitação do Arcebispo +Dom Paulo Garcia, comunico aos integrantes do Clero que os Bispos da Igreja
      Episcopal Carismática do Brasil-IECB, após vários dias de oração, compreenderam, clara e consensualmente,
      que Deus estabeleceu uma nova orientação para a Igreja Brasileira.
  - source: costa-2021-tese
    quote: >-
      Por conta de problemas com a sucessão da liderança de Paulo Garcia, em 2019 o arcebispo brasileiro rompeu
      com o Patriarca Bates e a denominação carismática se tornou uma Igreja independente no Brasil, formando a
      sua própria Comunhão
  notes: >-
    Comunicado assinado pelo bispo André Novaes (auxiliar do Recife), datado de 24/3/2019 e citado por Costa a partir
    da Catedral da Reconciliação. O comunicado diz desejar 'manter uma relação fraternal' com a ICCEC. A CEI foi
    criada para as missões da IECB em Angola e Portugal.
