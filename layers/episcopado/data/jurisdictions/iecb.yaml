description: >-
  Igreja formada em 2002 a partir da ruptura do deão Paulo Garcia com a Diocese do Recife e a Província, na chamada
  "Pequena Crise do Recife" de setembro de 2002, levando consigo a comunidade da Catedral da Santíssima Trindade,
  no Recife, e as do Janga, Timbaúba e Vitória de Santo Antão. Garcia vinculou-se à Comunhão Internacional da Igreja
  Episcopal Carismática (ICCEC), foi eleito primeiro bispo e depois reconhecido como arcebispo e primaz; a sede
  é a Catedral da Trindade. Em 14 de abril de 2007 foram sagrados novos bispos, entre eles Alexandre Ximenes (Diocese
  do Litoral Sul e Alagoas, depois Zona Sul, emérito em 2025) e Frederico Bastos (Vitória de Santo Antão), e Adonias
  Ramos de Souza ficou à frente da Diocese do Paulista. Seguiram-se André Novaes (2009), Alexandre Lins (2014),
  Edgar Batista (2019, Mata Norte) e Jean Clayton (2020). Em março de 2019 a IECB rompeu com a ICCEC e passou a
  se organizar em torno da Comunhão Episcopal Internacional (CEI); em 2021 a comunidade de Aldeia (futura IEMM)
  rompeu com a CEI. Surgiram ainda as dioceses de Olinda (Francisco Rubem da Silva), Petrolina (Tony Belo Pereira,
  2022) e, em 13 de outubro de 2024, Garanhuns e Limoeiro. Bispos como Raniere Campos, Marcos Cefas e Roberto Schuller
  saíram por divergências com Garcia.
