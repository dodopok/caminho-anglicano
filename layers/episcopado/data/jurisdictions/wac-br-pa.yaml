  quote: Dom Raimundo Cesar Oliveira Costa, bispo auxiliar da Diocese do Pará
  page: '129'
- source: lwac-wacbr-para
  quote: >-
    A Diocese Anglicana do Pará está situada na Região Norte do Brasil, sua sede fica na cidade de Belém - Pará.
    Seu governo está sob a administração do Reverendo Vanderli Martins Lopes.
