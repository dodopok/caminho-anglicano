name: Diocese Anglicana do Pará (WAC no Brasil)
aliases:
- Diocese do Pará
type: diocese
country: BR
description: >-
  Diocese do Pará, com sede em Belém, vinculada à WAC no Brasil em 21 de novembro de 2023, tendo Antônio Jesualdo
  Bezerra de Moura como bispo diocesano e Raimundo Cesar Oliveira Costa como bispo auxiliar.
sources:
