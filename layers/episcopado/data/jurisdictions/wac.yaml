id: wac
acronym: WAC
name: Igreja Anglicana Mundial (Worldwide Anglican Church)
type: communion
country: UG
founded:
  date: '1921-09-02'
  sources:
  - source: lwac-wac-about
    quote: >-
      The Worldwide Anglican Church began on September 2nd, 1921, and was called The African Orthodox Church.
  - source: lwac-wac-about
    quote: >-
      The Worldwide Anglican Church Central Office is incorporated in Uganda, and registered in Ohio, USA, South
      Sudan and India.
  - source: lwac-wac-canons
    quote: Consecration of Bishop – A Bishop must be consecrated by no less than three Bishops in attendance.
  - source: lwac-wac-about
    quote: >-
      In 1997, AOC implemented the reform and changed its name to the Anglican African Orthodox Church (AAOC).
  - source: lwac-wac-about
    quote: in 2002 there was a name change to Anglican Church Worldwide (ACW.)
  - source: lwac-wac-about
    quote: >-
      We serve across the world in the following countries: The USA, India, Nigeria, Kenya, Zambia, Rwanda, Uganda,
      Bolivia, Peru, Colombia
  discrepancies:
  - field: date
    value: '2017'
    sources:
    - source: cant-novas-igrejas-2024
      quote: >-
        A Igreja Anglicana Mundial (Worldwide Anglican Church – WAC) é uma comunidade internacional de tradição
        anglicana
      page: '128'
website: https://www.worldwideanglicanchurch.org/
description: >-
  A Igreja Anglicana Mundial (Worldwide Anglican Church, WAC) declara ter começado em 2 de setembro de 1921 como
  African Orthodox Church, passou a chamar-se Anglican African Orthodox Church em 1997 e Anglican Church Worldwide
  em 2002, e adotou o nome atual em julho de 2017. O escritório central está incorporado em Uganda, com registros
  em Ohio (EUA), Sudão do Sul e Índia; o patriarca e arcebispo primaz é Christopher Lwanga Tusubira, e Vincent Millard
  Waterman (1926–2019) consta como patriarca presidente. Em dezembro de 2018 estabeleceu intercomunhão com a Mercy
  Worldwide Ministries Anglican Church. No Brasil, sua província é a WAC-BR, presidida por Paulo Sérgio Ferreira.
