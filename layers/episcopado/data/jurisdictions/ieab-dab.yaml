website: https://dab.org.br/
description: >-
  A Diocese Anglicana de Brasília, ex-Diocese Missionária de Brasília, foi criada em 1982 e instalada em 9 de junho
  de 1985, com Agostinho Guillon Sória como primeiro bispo (1985–1988). Almir dos Santos foi bispo diocesano de
  abril de 1988 a dezembro de 2002 e hoje é emérito. Em 2003, Glauco Soares de Lima (janeiro a maio) e Orlando Santos
  de Oliveira (junho a agosto) foram bispos interinos. Maurício José Araújo de Andrade é bispo diocesano desde setembro
  de 2003.
