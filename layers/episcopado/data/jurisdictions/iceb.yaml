- Igreja Cristã Episcopal / Comunhão das Igrejas Cristãs Episcopais do Brasil (CICEB)
- Igreja Cristã Episcopal do Brasil
- >-
  Igreja Cristã Episcopal — Comunhão (hoje Província) de Igrejas Cristãs Episcopais do Brasil (CICEB/PICEB)
- iceb
type: national_church
country: BR
founded:
