  status: probable
  sources:
  - source: ptwp-dar
    quote: >-
      e de onde se originou a atual Comunhão Internacional Cristã (em inglês, The Christian Communion Internacional
      - CCI), com sede no Estado da Flórida, EUA.
  - source: ciceb-quemsomos
    quote: >-
      filiar-se à Comunion of Evangelical Episcopal Churches (CECC), com sede nos EUA e hoje chamada Communio Christiana
      Churches (CCC).
  notes: >-
    As fontes brasileiras tratam CEEC e CCI/CCC como a mesma comunhão em evolução. Pela CEEC, a CCI (ex-Communion
    of Convergence Churches USA) estava em 'co-comunhão' com a CEEC desde 2006 e fundiu-se à Província EUA em 2012.
    O sagrante William Paul Mikler e o co-sagrante Hermes Fernandes ligam-se a esse ambiente (CCI). Data de 2006
    é aproximada.
