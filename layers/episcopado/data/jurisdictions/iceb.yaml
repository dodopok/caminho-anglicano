relations:
- type: schism_from
  target: ieab
  date: 2002-10
  led_by:
  - leonides-de-menezes-ferreira
  status: confirmed
  sources:
  - source: ciceb-quemsomos
    quote: >-
      resolveu em assembleia com todos os membros, por unanimidade de votos, desligar-se da Igreja Anglicana. Sendo
      assim, a partir desta data passou a ser chamada Igreja Episcopal Evangélica Betânia.
  - source: ptwp-dar
    quote: >-
      Em outubro de 2002, os membros da então Paróquia Betânia da Diocese Anglicana do Recife, liderados pelo reverendo
      Leônides Menezes, decidiram por assembleia se separar da Igreja Episcopal Anglicana do Brasil
  - source: cant-novas-igrejas-2024
    quote: >-
      Em outubro de 2002, a Paróquia Betânia, até então pertencente à Igreja Episcopal Anglicana do Brasil, formalizou
      sua saída da Província anglicana
    page: '65'
  - source: costa2021
    quote: >-
      A Diocese do Recife sofreu, em 2002, um cisma, encabeçado pelo Rev. Paulo Garcia, que foi para a Igreja Episcopal
      Carismática, e outro pelo Rev. Leonides de Menezes para a Igreja Episcopal Evangélica
    page: '202'
  - source: costa2021
    quote: a partir do desligamento da Paróquia Betânia da Diocese do Recife.
    page: '202'
  notes: >-
    Mês divergente no próprio site: 'outubro de 2002' (Quem Somos da CICEB) vs '8 de julho de 2002' (Nossa Igreja
