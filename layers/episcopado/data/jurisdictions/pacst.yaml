id: pacst
acronym: PACST
name: Província Anglo-Católica da Santíssima Trindade
type: national_church
country: BR
founded:
  date: '2018'
  sources:
  - source: costa2021
    quote: >-
      Uma delas é a Província Anglo-Católica da Santíssima Trindade, atualmente formada por quatro bispos: Dom Antônio
      Bessa, em Fortaleza (CE), Primaz; Dom Rafael Moraes, em Nova Friburgo (RJ); Dom Cristiano Alves, no Rio de
      Janeiro (RJ); e Dom Rafael Mendes Martins, em Paraisópolis (MG).
description: >-
  Grupo continuante fundado em 2018, derivado da presença da ACC (Diocese de Nova Granada) no Brasil; quatro bispos,
  segundo Costa (2021): Antônio Bessa (primaz, Fortaleza), Rafael Moraes (Nova Friburgo), Cristiano Alves (Rio de
  Janeiro) e Rafael Mendes Martins (Paraisópolis-MG). 'Dom Cristiano Alves' aparece em 2025 entre os bispos da IATB.
sources:
- source: costa2021
  quote: >-
    Uma delas é a Província Anglo-Católica da Santíssima Trindade, atualmente formada por quatro bispos: Dom Antônio
    Bessa, em Fortaleza (CE), Primaz; Dom Rafael Moraes, em Nova Friburgo (RJ); Dom Cristiano Alves, no Rio de Janeiro
    (RJ); e Dom Rafael Mendes Martins, em Paraisópolis (MG).
