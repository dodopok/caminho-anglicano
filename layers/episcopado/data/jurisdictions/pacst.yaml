# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: pacst
acronym: PACST
name: Província Anglo-Católica da Santíssima Trindade
type: national_church
country: BR
founded:
  date: '2018'
  sources:
  - source: costa2021
    quote: >-
      Uma delas é a Província Anglo-Católica da Santíssima Trindade, atualmente formada por quatro bispos: Dom Antônio
      Bessa, em Fortaleza (CE), Primaz; Dom Rafael Moraes, em Nova Friburgo (RJ); Dom Cristiano Alves, no Rio de
      Janeiro (RJ); e Dom Rafael Mendes Martins, em Paraisópolis (MG).
  - source: costa2021
    quote: O grupo, fundado em 2018, afirma-se como parte do Movimento Anglicano Continuante
    page: '139'
description: >-
  Província anglo-católica continuante fundada em 2018, derivada do grupo ligado à Diocese colombiana (ACC) e sucessora
  da PACES, tendo Antônio Bessa, em Fortaleza, como arcebispo e primaz. Segundo Costa (2021), tinha quatro bispos:
  Bessa, Rafael Moraes (Nova Friburgo), Cristiano Alves (Rio de Janeiro) e Rafael Mendes Martins (Paraisópolis,
  MG); Cristiano Alves deixou a província e retornou à Igreja Anglicana Tradicional do Brasil.
sources:
- source: costa2021
  quote: >-
    atualmente formada por quatro bispos: Dom Antônio Bessa, em Fortaleza (CE), Primaz; Dom Rafael Moraes, em Nova
    Friburgo (RJ); Dom Cristiano Alves, no Rio de Janeiro (RJ); e Dom Rafael Mendes Martins, em Paraisópolis (MG).
  page: '139'
- source: costa2021
  quote: O grupo, fundado em 2018, afirma-se como parte do Movimento Anglicano Continuante
  page: '139'
- source: costa2021
  quote: >-
    Desse grupo, ligado à Diocese colombiana, surgiram outras Igrejas que seguem o Movimento Continuante.
- source: cant-novas-igrejas-2024
  quote: >-
    Essa jurisdição diocesana tem origem na proposta de criação da Província Anglicana Católica do Espírito Santo
    (hoje extinta) através do bispo José Fernando de Faria
  page: '105'
- source: cant-novas-igrejas-2024
  quote: >-
    A Província Anglo-Católica da Santíssima Trindade também continuou com o bispo Antônio Bessa como seu primaz.
  page: '162'
- source: lac-yt-bessa-nf
  quote: Arcebispo da Província Anglo-católica da Santíssima Trindade do Brasil!
- source: cant-novas-igrejas-2024
  quote: >-
    Após a saída de dom Cristiano da Província, este bispo foi convidado por dom Rui Barbosa para retornar para
    a Igreja Anglicana Tradicional do Brasil (IATB).
  page: '106'
- source: cant-novas-igrejas-2024
  quote: >-
    Esta segunda Província a ser organizada, foi intitulada Província Anglo-Católica da Santíssima Trindade, sendo
    era formada pelos bispos dom Antônio Bessa (bispo do Ceará) e dom Rafael Moraes (hoje bispo da Província Anglo-Católica
    da Santíssima Trindade, em Nova Friburgo), dom Cristiano Alves (hoje bispo da Diocese Anglo-Católica Cristo
    Bom Pastor, no Rio de Janeiro, ligada à Igreja Anglicana Tradicional do Brasil - IATB) e dom Rafael Mendes (hoje
    bispo da Diocese Anglo-Católica de Minas Gerais, como uma igreja autocéfala local).
  page: '162'
