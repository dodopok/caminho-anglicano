    quote: >-
      Em 26 de junho de 1992 Randolph Adler foi consagrado o primeiro bispo e primaz da Igreja Episcopal Carismática
    page: '134'
wikidata: Q3735771
website: https://iccec.org/
description: >-
  Comunhão da Igreja Episcopal Carismática, fundada em 1992 nos Estados Unidos, quando Randolph Adler foi consagrado
  primeiro bispo e primaz, em 26 de junho; com a aposentadoria de Adler, em 2007, Craig W. Bates foi instituído
  segundo patriarca em 9 de janeiro de 2008. Em 1997 buscou a reconsagração e a reordenação de todo o clero pela
  Igreja Católica Apostólica Brasileira, e Paulo Garcia, ligado a ela desde 2003, fundou a igreja carismática do
  Brasil, que depois se separou.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Em 26 de junho de 1992 Randolph Adler foi consagrado o primeiro bispo e primaz da Igreja Episcopal Carismática
  page: '44'
- source: ptwiki-iecb
  quote: A Igreja Episcopal Carismática, como denominação cristã, surge em 1992
- source: costa2021
  quote: >-
    Com a aposentadoria de Adler, em 2007, a liderança da Comunhão Internacional da Igreja Episcopal Carismática
    passou para as mãos do bispo Craig W. Bates
- source: costa2021
  quote: sendo instituído o seu segundo patriarca em 09 de janeiro de 2008.
- source: enwiki-iccec-bispos
  quote: >-
    In 1997, the Charismatic Episcopal Church sought and acquired reconsecration and reordination of all of its
    clergy by the Brazilian Catholic Apostolic Church, thus strengthening their lines of apostolic succession.
- source: costa2021
  quote: >-
    vinculou-se, depois, à Comunhão Internacional da Igreja Episcopal Carismática, e fundou, no Recife, a Igreja
    Episcopal Carismática do Brasil (IECB).
- source: costa2021
  quote: >-
    a denominação brasileira havia se separado da Comunhão Internacional da Igreja Episcopal Carismática.
relations:
