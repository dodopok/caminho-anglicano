id: iccec
acronym: ICCEC
name: >-
  International Communion of the Charismatic Episcopal Church (Comunhão Internacional da Igreja Episcopal Carismática)
type: communion
country: US
founded:
  date: '1992'
  sources:
  - source: ptwiki-iecb
    quote: A Igreja Episcopal Carismática, como denominação cristã, surge em 1992
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 26 de junho de 1992 Randolph Adler foi consagrado o primeiro bispo e primaz da Igreja Episcopal Carismática
    page: '44'
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2006, a Igreja nos Estados Unidos enfrentou uma grave crise que levou à saída de cerca de um terço de seu
      clero e de diversas congregações, entre elas sete bispos em atividade e um bispo emérito
    page: '47'
