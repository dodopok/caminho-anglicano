# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: diocese-of-canterbury
name: Diocese of Canterbury
type: diocese
description: >-
  Diocese da Igreja da Inglaterra, sede dos arcebispos de Canterbury. Entre eles estão Thomas Cranmer (1533-1556),
  Matthew Parker (1559-1575), Edmund Grindal (1576-1583), John Whitgift (1583-1604), Richard Bancroft (1604-1610),
  George Abbot (1611-1633) e William Laud (1633-1645). Seguiram-se Gilbert Sheldon (1663-1677) e William Sancroft
  (de 1678, deposto em 1690), e, no século XVIII, John Potter (1737-1747), Thomas Herring (1747-1757), Frederick
  Cornwallis (1768-1783) e John Moore (1783-1805). No século XIX, John Bird Sumner (1848-1862), Charles Thomas Longley
  (1862-1868), Archibald Campbell Tait (1868-1882) e, desde 1896, Frederick Temple.
