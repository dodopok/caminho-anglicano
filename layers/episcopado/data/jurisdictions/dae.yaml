description: >-
  A Diocese Anglicana de Esmeraldas (MG) é apresentada em seu site, com data de 2010, como estrutura da Igreja Episcopal
  Latina do Brasil (IELB), com Sé Primacial sob o arcebispo Lucas Macieira da Silva, e exibe o selo da Comunhão
  Anglicana Livre. É apontada como antecessora da Diocese Anglicana Católica do Brasil.
