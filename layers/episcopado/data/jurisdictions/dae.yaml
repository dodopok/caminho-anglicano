description: >-
  Estrutura da IELB sediada em Esmeraldas (MG), apresentada em seu site como "Diocese Anglicana de Esmeraldas -
  Igreja Anglo-Católica", com Sé Primacial do Brasil sob Lucas Macieira e a Província Anglicana Nossa Senhora de
  Guadalupe (Rua Santo Expedito, 650, Monte Sinai). O site (c. 2010-2015) reproduz o texto institucional e o rodapé
  "Copyright 2010 © Igreja Episcopal Latina do Brasil - Anglicana" e exibe o selo "Comunhão Anglicana Livre".
