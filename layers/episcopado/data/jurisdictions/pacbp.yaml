id: pacbp
acronym: PACBP
name: Província Anglicana de Cristo Bom Pastor
type: province
country: US
description: >-
  Província anglicana com sede nos Estados Unidos que acolheu comunidades chilenas e deu existência canônica à IEACH;
  o arcebispo Max Broussard foi seu primeiro bispo ordinário.
sources:
- source: cant-novas-igrejas-2024
  quote: O arcebispo Max Broussard tornou-se o primeiro bispo ordinário da nova província.
