type: diocese
tradition: anglican
country: BR
description: >-
  A Diocese do Recife da Igreja Episcopal Carismática do Brasil (IECB) tem André Novaes de Albuquerque Cavalcanti
  como bispo desde 2009, Frederico Carneiro Rêgo Bastos como coadjutor e Alexandre Barbosa Monteiro Ximenes como
  bispo colaborador; o primaz da IECB é o arcebispo Paulo Garcia.
