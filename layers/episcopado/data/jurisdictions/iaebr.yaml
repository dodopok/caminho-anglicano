description: >-
  Igreja anglicana independente iniciada em 2023, com a Diocese de Muzambinho (MG) como sede de seu bispo primaz,
  Welington Souza. Em janeiro de 2025 estabeleceu acordo de intercomunhão com a Comunhão Anglicana do Caribe e Nova
  Granada; o bispo Josué Augusto ingressou nela posteriormente.
