    page: '3'
description: >-
  Sociedade missionária auxiliar, fundada em 1860 como organização independente sob auspícios evangélicos. Patrocinou
  a viagem missionária ao Brasil em 1889 e sustentou o trabalho brasileiro até 1º de janeiro de 1905, quando o transferiu
  à Junta de Missões Doméstica e Estrangeira da Igreja Episcopal.
