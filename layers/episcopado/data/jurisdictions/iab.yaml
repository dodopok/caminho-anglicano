# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: iab
acronym: IAB
name: Igreja Anglicana no Brasil
type: province
tradition: anglican
country: BR
founded:
  date: '2018-05-12'
  sources:
  - source: ai-new-province-backed
    quote: >-
      On Saturday, 12 May 2018, Brazilians packed the Paróquia Anglicana do Espírito Santo (Anglican Church of the
      Holy Spirit) to celebrate the launch of the Anglican Church in Brazil
  - source: iab-quem-somos
    quote: >-
      Em 12 de Maio deste ano de 2018, devido ao crescimento da nossa Igreja no Brasil, tivemos o privilégio de
      formar a Província da Igreja Anglicana no Brasil, com 3 dioceses, 74 clérigos (as) e 54 comunidades.
  - source: iab-home-2026
    quote: DIOCESES RECIFE JOÃO PESSOA VÍTORIA REGIÃO MISSIONÁRIA
  - source: gafcon-2025-07-16-iab
    quote: it became a province with three dioceses, 54 communities, and roughly 74 clergy
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Anglicana no Brasil (IAB), anteriormente conhecida como Diocese do Recife, é uma das principais denominações
      anglicanas brasileiras, tendo surgido a partir de um dos cismas mais significativos da história da Igreja
      Episcopal Anglicana do Brasil
    page: '25'
  - source: cant-novas-igrejas-2024
    quote: >-
      No dia 12 de maio de 2018, Miguel Uchôa foi instalado como primeiro Arcebispo e Primaz da Igreja Anglicana
      no Brasil.
    page: '31'
  - source: cant-novas-igrejas-2024
    quote: até o ano de 2018, quando esta se tornou a Igreja Anglicana no Brasil (IAB), a Província da GAFCON.
    page: '124'
  - source: cant-novas-igrejas-2024
    quote: >-
      A propriedade do templo da Catedral Anglicana do Recife foi adquirido pela Igreja Anglicana no Brasil (IAB)
    page: '112'
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana no Brasil (IAB) [2018]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Clero originário da IEAB, reorganizado como Diocese do Recife após o cisma [2005]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: >-
      Realinhamento com o Sul Global, como diocese extra-provincial da Igreja Anglicana da América do Sul (com supervisão
      episcopal do bispo Gregory Venables) [2005-2018]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Criada como Província da GAFCON – Fellowship of Confessing Anglicans (FCA) [2018]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: >-
      hoje liderada pelo arcebispo Miguel Uchôa Cavalcanti, como Província da GAFCON, com sede na Paróquia Anglicana
      do Espírito Santo (PAES)
    page: '174'
  - source: iab-comunicado-oficial-2018
    quote: >-
      Em 12 de Maio deste ano de 2018, devido ao crescimento da nossa Igreja no Brasil, tivemos o privilégio de
      formar a Província da Igreja Anglicana no Brasil, com 3 dioceses, 74 clérigos (as) e 54 comunidades.
  - source: wp-en-iab
    quote: >-
      It is not a member of the Anglican Communion,[1] but is in full communion with other provinces of the Global
      Fellowship of Confessing Anglicans and the Global South Fellowship of Anglican Churches.
  - source: costa2021
    quote: >-
      No dia 12 de maio de 2018, Miguel Uchôa foi instalado como primeiro Arcebispo e Primaz da Igreja Anglicana
      no Brasil.
    page: '253'
locator_slug: iab
website: https://www.anglicananobrasil.com/on/
description: >-
  Província anglicana ligada ao GAFCON, formada em 2018 a partir da Diocese Anglicana do Recife, com dioceses de
  Recife, João Pessoa e Vitória e uma Região Missionária.
