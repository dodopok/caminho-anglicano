- type: broke_communion_with
  target: church-of-england
  date: 2023-02
  led_by:
  - miguel-uchoa
  status: confirmed
  sources:
  - source: iab-ao-clero-2025
    quote: >-
      Em fevereiro de 2023, após as decisões do Sínodo da Igreja da Inglaterra aprovar as mudanças na doutrina do
      casamento fugindo dos princípios bíblicos, emitimos juntos com o GSFA uma declaração na 4ª feira de cinzas
      que desconsiderava os instrumentos de comunhão e o arcebispo de Cantuária como líder da Comunhão. A partir
      de então, consideramos nossos laços com a Igreja da Inglaterra apenas históricos.
  - source: gacm-iab-2025-10-03-mullally
    quote: >-
      Declaramos, em fevereiro de 2023, em comunhão com as províncias filiadas ao GAFCON e ao GSFA (Global South
      Fellowship of Anglican Churches), que não reconhecemos mais a Sé de Cantuária nem o Arcebispo de Cantuária
      como símbolo de unidade da nossa fé.
  notes: >-
    Declaração de Quarta-feira de Cinzas de 2023 (com o GSFA). A IAB nunca foi província da Comunhão Anglicana de
    Cantuária: "não mantemos qualquer vínculo institucional com a Sé de Cantuária".
