    page: '253'
  - source: iab-ao-clero-2025
    quote: >-
      como parte do conselho de primazes e como Vice-Presidente do GAFCON, participei de uma consulta a pedido do
      Presidente e Arcebispo de Ruanda Laurent Mbanda.
  - source: gacm-tlc-2025-10-17-analysis
    quote: >-
      Three of the nine other churches represented on GAFCON’s Primates’ Council are not recognized by the Anglican
      Communion Office and have largely been formed under GAFCON’s auspices (the Anglican Church of Brazil, the
      Reformed Evangelical Anglican Church of South Africa, and the Anglican Church in North America). But such
      a total severing of connections with Canterbury and the Instruments of Communion would be a new development
      for the six other provinces represented on the council (Alexandria, Chile, Congo, Kenya, Myanmar, and South
      Sudan).
  - source: gacm-ai-2026-01-30-curiouser
