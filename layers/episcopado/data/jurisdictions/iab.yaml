- type: member_of
  target: gac
  date: '2026-03-05'
  led_by:
  - miguel-uchoa
  status: confirmed
  sources:
  - source: gace-faithfulness-brazil
    quote: >-
      It has been a great joy to gather this weekend in Recife, Brazil, with leaders of the Global Anglican Communion
  - source: gace-faithfulness-brazil
    quote: the Anglican Church in Brazil established as a faithful and growing province.
  - source: gace-g27-recife
    quote: >-
      It will be a particular joy to welcome you to my home city and to the Catedral Anglicana do Espírito Santo.
      Our Church is preparing to receive our Global Anglican family
  - source: gace-gac-page
    quote: Archbishop of the Anglican Church in Brazil, Vice Chairman
  - source: gace-ai-council-list
    quote: The Most Rev. Miguel Uchoa, Anglican Church in Brazil, who serves as Vice Chair
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      The council’s primates are Archbishops Laurent Mbanda of Rwanda (Chair), Miguel Uchoa of the Anglican Church
      of Brazil (Vice Chair), Henry Ndukuba of Nigeria, Stephen Kaziimba of Uganda, Enrique Lago of Chile, Presiding
      Bishop Siegfried Ngubane of the Reformed Evangelical Anglican Church of South Africa, and Bishop Julian Dobbs,
      acting primate of the Anglican Church in North America.
  - source: gacm-tlc-2025-10-27-inside
    quote: >-
      In addition to Donison, Mbanda, Jensen, and Akinola, the meeting included three other members of the GAFCON
      Primates’ Council: Archbishop Henry Ndukuba of Nigeria and the leaders of two churches largely formed and
      authenticated by GAFCON: Archbishop Miguel Ochoa Cavalcanti of the Anglican Church of Brazil, and Archbishop
      Steve Wood of the ACNA.
  - source: iab-ao-clero-2025
    quote: >-
      Historicamente, e sob a graça de Deus em 16 de outubro de 2025, dia dos Mártires Hugo Latimer e Nicholas Ridley,
      assinamos essa decisão.
  - source: iab-ao-clero-2025
    quote: >-
      Nunca deixamos a Comunhão Anglicana porque somos a herança legitima de suas raízes e a continuidade do que
      ela sempre creu, declarou e ensinou. Na realidade… Nós somos A COMUNHÃO ANGLICANA GLOBAL
  notes: >-
    Nenhum documento de adesão formal da IAB à GAC foi encontrado. A IAB era província do GAFCON desde 2018 e seu
    primaz tem assento no Global Anglican Council como vice-presidente desde a criação do conselho (5/03/2026);
    a G27 (abr/2027) será sediada pela IAB. Data adotada = criação do Global Anglican Council. Província cujo primaz
    integra o Global Anglican Council eleito em Abuja (G26, 3–6/03/2026), o que exige "desengajamento por princípio"
    dos Instrumentos da Comunhão de Cantuária. Uchôa é vice-presidente do Conselho. O primaz participou da consulta
    de Sydney que redigiu a declaração "The Future Has Arrived" (16/10/2025), aprovada pelo Conselho de Primazes
    do GAFCON.
