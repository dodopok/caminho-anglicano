website: https://anglican-nig.org/
description: >-
  Província da Comunhão Anglicana fundada em 24/02/1979, reunindo as dezesseis dioceses da Nigéria. Peter Akinola,
  sagrado e entronizado bispo de Abuja em novembro de 1989, foi primaz de 2000 a março de 2010. Nicholas Okoh, bispo
  de Asaba desde maio de 2001, foi instalado primaz em 25/03/2010 e se aposentou em 25/03/2020, quando Henry Ndukuba,
  antes bispo de Gombe (1999-2020) e arcebispo da Província Eclesiástica de Jos, assumiu a primazia. A igreja é
  membro do GAFCON e, desde outubro de 2025, do Global Anglican Council.
