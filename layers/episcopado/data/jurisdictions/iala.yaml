# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: iala
acronym: IALA
name: Igreja Anglicana Latino-Americana
type: national_church
description: >-
  Igreja do arcebispo Leonardo Marin-Saavedra, que em 2019 fez visitas ao Brasil sagrando bispos e ordenando clérigos
  para diferentes igrejas.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Em 2019, o arcebispo Leonardo Marin-Saavedra da Igreja Anglicana Latino-Americana realizou algumas visitas ao
    Brasil, consagrando novos bispos para o continente, ratificando as Ordens de clérigos com sucessão apostólica
    considerada duvidosa, e ordenando novos diáconos e presbíteros para diferentes Igrejas. Uma dessas sagrações
    episcopais realizadas foi a de Antônio Bessa, na cidade de Fortaleza.
  page: '161'
