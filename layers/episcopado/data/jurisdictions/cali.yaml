id: cali
acronym: CALI
name: Comunhão Anglicana Livre Internacional
type: communion
website: https://theanglicanfreecommunion.com/
description: >-
  Comunhão independente (The Free International Anglican Communion / The Anglican Free Communion International)
  que se apresenta como sucessora legal da Igreja Episcopal Protestante Livre (1897); cisma em 2020 com a remoção
  do arcebispo Richard Arthur Palmer; arcebispos presidentes Ronald Lee Firestone (2020–2021) e Raul E. Toro Jr.
  (desde 2022).
