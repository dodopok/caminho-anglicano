description: >-
  A Igreja Anglicana Porto foi plantada em São Paulo por Douglas de Araujo Silva e Cynthia Muniz Soares, com início
  em 1º de junho de 2024 na casa de Douglas, como nova igreja da Igreja Anglicana no Brasil (IAB), com o bispo diocesano
  Márcio Meira e o bispo auxiliar Eric Rodrigues. Abriu ao público em 9 de setembro de 2024 e, no fim de 2024, passou
  à Rede Episcopal Brasileira (REB), fundada nessa época, por divergências teológicas e eclesiológicas com a IAB.
