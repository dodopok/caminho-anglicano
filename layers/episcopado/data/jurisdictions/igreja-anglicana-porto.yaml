description: >-
  Igreja anglicana na zona sul de São Paulo, plantada por Douglas de Araujo Silva e Cynthia Muniz Soares. Começou
  em 01/06/2024, na casa de Douglas de Araujo Silva, como nova igreja da IAB, com o bispo auxiliar Eric Rodrigues
  e o bispo diocesano Márcio Meira; abriu ao público em 09/09/2024 e passou à Rede Episcopal Brasileira no fim de
  2024.
