id: ier
acronym: IER
name: Igreja Episcopal Reformada (Brasil)
type: national_church
country: BR
founded:
  date: '2001-07-29'
  sources:
  - source: cant-novas-igrejas-2024
    quote: A Igreja Episcopal Reformada tem origem em 29 de julho de 2001, na cidade de São Paulo
    page: '168'
  - source: cant-novas-igrejas-2024
    quote: >-
      foi responsável pela publicação em 2004 da sua edição do Livro de Oração Comum, pela Editora Clássica Anglicana.
    page: '168'
  - source: cant-novas-igrejas-2024
    quote: >-
      sua tradução foi feita a partir de adaptações do manual litúrgico da Igreja Episcopal Reformada dos Estados
      Unidos (REC). Aprovado no seu Sínodo em 2001, este LOC foi oficialmente lançado em 31 de outubro de 2004
    page: '168'
  - source: cant-novas-igrejas-2024
    quote: >-
      Por um tempo, teve o bispo Sebastião Mendes de Freitas43 como seu primaz e Francisco Buzzo Rodrigues, como
      bispo auxiliar.
    page: '168'
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja acabou sendo extinta, por falta de comunidades e de clero, uma vez que, ocorreu o estabelecimento
      da missão da Free Church of England no Brasil, a partir da chegada do bispo Josep Rosselo no Brasil.
    page: '168'
  - source: cant-novas-igrejas-2024
    quote: Igreja Episcopal Reformada [2001] (Extinta em 2009, com a criação da IARB)
    page: '172'
