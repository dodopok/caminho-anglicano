description: >-
  Igreja fundada em 29/07/2001 em São Paulo, que publicou em 2004 (Editora Clássica Anglicana) um Livro de Oração
  Comum adaptado do da Reformed Episcopal Church dos EUA, aprovado em Sínodo em 2001 e lançado em 31/10/2004. Teve
  Sebastião Mendes de Freitas como primaz e Francisco Buzzo Rodrigues como bispo auxiliar. Extinta por falta de
  comunidades e clero com o estabelecimento da missão da Free Church of England no Brasil (Apêndice 1: extinta em
  2009, com a criação da IARB).
