description: >-
  Fundada em 22/06/2009 por grupos que se desligaram da Igreja Episcopal (TEC), alinhada às demais Províncias do
  GAFCON, que a reconhecem; não é uma Província da Comunhão Anglicana. Robert Duncan, bispo de Pittsburgh, foi eleito
  o primeiro arcebispo e primaz e deixou a primazia em 2014; Foley Beach exerceu-a até junho de 2024 e Stephen Dwain
  Wood, eleito terceiro arcebispo, assumiu em 28/06/2024. Em 15/11/2025 Julian Dobbs, deão da Província, passou
  a exercer as funções de arcebispo, como primaz interino. Entre suas dioceses estão a Anglican Diocese of the South
  (Beach, desde 2010), a Great Lakes (Roger Ames, 2011), as Carolinas (Wood, 2012) e Quincy; é membro do Global
  Anglican Council desde março de 2026.
