description: >-
  Igreja formada em 2009 por membros e clérigos oriundos da Igreja Episcopal (TEC) dos Estados Unidos e da Igreja
  Anglicana do Canadá, com a aprovação de sua constituição e cânones em 22 de junho de 2009, em Bedford, Texas.
  Não é uma Província da Comunhão Anglicana, mas é alinhada às Províncias do GAFCON, que a reconhecem como a única
  expressão do Anglicanismo na América do Norte. Robert Duncan, bispo de Pittsburgh, foi eleito o primeiro arcebispo
  e primaz, foi instalado em 25 de junho de 2009 e deixou a primazia em 2014. Foley Beach, consagrado em 9 de outubro
  de 2010 primeiro bispo da Diocese do Sul, foi eleito segundo arcebispo em 21 de junho de 2014, instalado em 9
  de outubro e exerceu a primazia até junho de 2024. Stephen Dwain Wood, primeiro bispo da Diocese das Carolinas
  (eleito em junho de 2012), foi eleito terceiro arcebispo em 22 de junho de 2024 e assumiu em 28 de junho. Entre
  as dioceses estão a dos Grandes Lagos, cujo primeiro bispo, Roger Ames, foi instalado em 30 de abril de 2011,
  e Cascádia, com Kevin Allen como primeiro bispo de 2011 a 2024. Em 15 de novembro de 2025, Julian Dobbs foi nomeado
  deão da Província, função que autoriza assumir as responsabilidades do arcebispo, e atua como primaz interino.
  Em março de 2026 a ACNA passou a integrar o Global Anglican Council.
