description: >-
  Conferência de bispos anglicanos conservadores reunida pela primeira vez em Jerusalém (22–29/06/2008); outras
  conferências em Nairóbi (2013), Jerusalém (2018) e Kigali (2023). Em 16/10/2025 seus primazes declararam a Global
  Anglican Communion, que o GAFCON passou a liderar; em Abuja (05/03/2026) o Conselho de Primazes do GAFCON deu
  lugar ao Global Anglican Council. O GAFCON segue existindo como movimento: mantém as assembleias (GAFCON V, Atenas,
  2028), os garantidores (Gafcon Guarantors) e o secretariado.
sources:
- source: gace-future-has-arrived
  quote: Today, Gafcon is leading the Global Anglican Communion.
- source: gace-abuja-affirmation
  quote: >-
    Gafcon was originally formed as a fellowship within the Anglican Communion. Now that the Anglican Communion is
    being reordered, the Gafcon Primates Council has been replaced by the Global Anglican Council.
- source: gace-gahima-elected
  quote: >-
