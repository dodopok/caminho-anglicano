# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: ecs
acronym: ECS
name: Igreja Episcopal do Sudão (Province of the Episcopal Church of Sudan)
type: province
tradition: anglican
country: SD
description: >-
  Província anglicana do Sudão, cujo arcebispo, Ezekiel Kondo, integra o Conselho dos Primazes do GAFCON, e que
  inclui a Diocese de Maridi, da qual Justin Badi Arama foi bispo diocesano de 2001 a 2018. Em 2026 é citada entre
  as igrejas que afirmaram a Declaração de Jerusalém e permanecem na Global Anglican Communion, e assinou o comunicado
  do GSFA que afirma permanecer na Comunhão Anglicana.
sources:
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    They are archbishops Samy Shehata of Alexandria, Titre Ande of Congo, Jackson Ole Sapit of Kenya, Justin Badi
    Arama of South Sudan, and Ezekiel Kondo of Sudan, as well as Archbishop James Wong, the retired primate of the
    Indian Ocean.
- source: gacl-ai-2023-uxbridge
  quote: The Most Reverend Ezekiel Kondo – Sudan
- source: gacl-wp-badi
  quote: He became Bishop of the Diocese of Maridi in 2001
- source: gacl-ai-2018-badi-entron
  quote: who was previously the Bishop of the Anglican Diocese of Maridi in the western part of the country
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Important omissions from the council’s list were six former Gafcon primates who did not participate in the Abuja
    meetings. They are archbishops Samy Shehata of Alexandria, Titre Ande of Congo, Jackson Ole Sapit of Kenya,
    Justin Badi Arama of South Sudan, and Ezekiel Kondo of Sudan, as well as Archbishop James Wong, the retired
    primate of the Indian Ocean.
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Because their churches have publicly affirmed the Jerusalem Declaration, they remain part of the Global Anglican
    Communion.
- source: gace-tlc-gsfa-2026-01
  quote: >-
    The meeting’s communiqué , released January 21, was signed by nine primates, representing the Anglican Communion’s
    provinces of Alexandria, Congo, the Indian Ocean, Myanmar, South East Asia, South Sudan, Sudan, and Uganda,
    as well as the Anglican Church of Brazil.
relations:
- type: member_of
  target: gac
  date: 2026-03
  led_by:
  - ezekiel-kondo
  status: probable
  sources:
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      Important omissions from the council’s list were six former Gafcon primates who did not participate in the
      Abuja meetings. They are archbishops Samy Shehata of Alexandria, Titre Ande of Congo, Jackson Ole Sapit of
      Kenya, Justin Badi Arama of South Sudan, and Ezekiel Kondo of Sudan, as well as Archbishop James Wong, the
      retired primate of the Indian Ocean.
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      Because their churches have publicly affirmed the Jerusalem Declaration, they remain part of the Global Anglican
      Communion.
  notes: >-
    Segundo Paul Donison (mar/2026), a Igreja Episcopal do Sudão continua participante da GAC por ter afirmado a
    Declaração de Jerusalém; o primaz não foi a Abuja nem integra o Conselho. Não se localizou decisão própria da
    província.
- type: member_of
  target: anglican-communion
  date: null
  led_by:
  - ezekiel-kondo
  status: probable
  sources:
  - source: gacm-ai-2026-01-20-gsfa-mahe
    quote: >-
      GSFA is staying within the Anglican Communion, but more importantly, we are staying with Jesus to bear witness
      that we must choose life rather than death and light rather than darkness.
  - source: gace-tlc-gsfa-2026-01
    quote: >-
      The meeting’s communiqué , released January 21, was signed by nine primates, representing the Anglican Communion’s
      provinces of Alexandria, Congo, the Indian Ocean, Myanmar, South East Asia, South Sudan, Sudan, and Uganda,
      as well as the Anglican Church of Brazil.
  notes: >-
    Reafirmação de jan/2026: primaz signatário do comunicado dos primazes do GSFA (Seychelles, 14–17/01/2026), que
    afirma que o GSFA permanece na Comunhão Anglicana e continuará a dialogar com as propostas Nairobi-Cairo. O
    GSFA declara comunhão prejudicada com as províncias que mudaram o ensino sobre o casamento.
