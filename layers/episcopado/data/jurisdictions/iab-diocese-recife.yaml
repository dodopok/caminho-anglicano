description: >-
  A Diocese do Recife é a diocese-mãe da Igreja Anglicana no Brasil (IAB), constituída em 12 de maio de 2018. Sua
  sé é a Catedral Anglicana do Espírito Santo, em Piedade, Jaboatão dos Guararapes (PE), que também funciona como
  catedral nacional da IAB. Miguel Uchôa Cavalcanti é bispo diocesano de Recife e bispo primaz da IAB desde 2018,
  e Evilásio Tenório da Silva Júnior é bispo auxiliar. Em agosto de 2026, o GAFCON pediu orações pela multiplicação
  da diocese.
