  notes: >-
    As fontes divergem quanto à data-chave: assembleia que alterou os estatutos em 02/12/2012 (IEAB), 'organizou
    o Movimento' em 13/03/2013 e estatutos em 06/04/2013 (livro de Costa), declaração de abandono de comunhão em
    17/04/2013 e criação da 'Diocese do Movimento Anglicano' em 01/05/2013 (IEAB). A Wikipédia fala em cisma em
    2012. Data: 2012 (Wikipedia PT) ou 2013 (Costa; Glauco aderiu em 2013). Possível sobreposição com a frente IEAB;
    incluído por ser jurisdição menor independente. A Veja São Paulo registra ainda a resposta do secretário-geral
    da IEAB, Arthur Cavalcante. A Catedral Anglicana de São Paulo, catedral da Diocese Anglicana de São Paulo (IEAB)
    desde 1995, saiu da IEAB no 'cisma [2013]'; o MAnB data de 2013. MAnB organizado em 13/3/2013; desligamento
    formal após assembleia de 6/4/2013.
  discrepancies:
