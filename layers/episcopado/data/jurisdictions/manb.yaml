relations:
- type: schism_from
  target: ieab
  date: '2013-04-06'
  led_by:
  - aldo-quintao
  - glauco-soares-de-lima
  - roger-douglas-bird
  status: confirmed
  sources:
  - source: lbd-snieab-sinais
    quote: >-
      declara publicamente, em 17 de abril de 2013, o Abandono de Comunhão com a IGREJA EPISCOPAL ANGLICANA DO BRASIL/COMUNHÃO
      ANGLICANA dos seguintes clérigos
  - source: lq-ieab-acoes
    quote: 01 de maio de 2013- Criação da Diocese do Movimento Anglicano
  - source: lbd-wp-dasp
    quote: >-
      liderada pelo reverendo Aldo Quintão, e a paróquia de Todos os Santos, na cidade de Santos, liderada pelo
      reverendo Leandro Campos, desligaram-se da DASP
  - source: costa2021
    quote: >-
      os bispos Roger Bird e Glauco Soares, junto com o reverendo Aldo Quintão – que atuava como deão da Catedral
      –, romperam com a Província, fundando o Movimento Anglicano no Brasil (MAnB).
  - source: wp-pt-dioc-saopaulo
    quote: >-
      Em 2012, sofreu um cisma da IEAB, em que a Catedral Anglicana de São Paulo, com outras paróquias e missões,
      desligaram-se da diocese e da IEAB
  - source: glauco-testemunho-2013
    quote: O bispo diocesano (Roger Bird) resolveu anular a eleição, decisão com a qual eu concordei.
  - source: costa2021
    quote: >-
      Após realizar uma assembleia, foi votada a modificação dos estatutos da Catedral, em 06 de abril de 2013.
  - source: lq-vejasp-2016
    quote: >-
      Quinze anos depois, rompeu com a Igreja Episcopal Anglicana do Brasil, que possui sete templos em São Paulo.
  - source: lq-vejasp-2016
    quote: “A catedral dele, hoje, funciona de forma independente.”
  - source: cant-novas-igrejas-2024
    quote: >-
      em 13 de março de 2013 a Catedral Anglicana de São Paulo, junto com outras comunidades, organizou o Movimento
