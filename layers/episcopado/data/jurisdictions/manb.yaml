id: manb
acronym: MAnB
name: Movimento Anglicano no Brasil
aliases:
- Movimento Anglicano no Brasil (Diocese Anglicana no Brasil)
- Movimento Anglicano no Brasil / Diocese Anglicana no Brasil (Catedral Anglicana de São Paulo)
type: national_church
country: BR
founded:
  date: '2013-03-13'
  sources:
  - source: wp-pt-dioc-saopaulo
    quote: >-
      o Movimento Anglicano no Brasil é uma Igreja particular que não está ligada a nenhuma instância associativa
      anglicana, nem à Comunhão Anglicana.
  - source: costa2021
    quote: >-
      em 13 de março de 2013 a Catedral Anglicana de São Paulo, junto com outras comunidades, organizou o Movimento
      Anglicano no Brasil (MAnB).
  - source: costa2021
    quote: >-
      Assim, a comunidade, junto com o reverendo Aldo Quintão e os bispos Roger Douglas Bird – então diocesano –
      e Glauco Soares de Lima – emérito da DASP –, se desligaram formalmente da Igreja Episcopal Anglicana do Brasil.
  - source: lq-ieab-acoes
    quote: >-
      01 de maio de 2013- Criação da Diocese do Movimento Anglicano que inclui um grupo de clérigos disciplinados
      pela IEAB e apoiados pelos Bispos Dom Roger Bird e Dom Glauco Soares.
  - source: cant-novas-igrejas-2024
    quote: >-
      em 13 de março de 2013 a Catedral Anglicana de São Paulo, junto com outras comunidades, organizou o Movimento
      Anglicano no Brasil (MAnB)
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: Em 2016 o “Movimento Anglicano no Brasil” passou a se chamar “Diocese Anglicana no Brasil”.
    page: '95'
  - source: cant-novas-igrejas-2024
    quote: Catedral Anglicana de São Paulo [Origem no templo da Saint Paul’s Church, 1873]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Filiada à IEAB [1972], instituída catedral da DASP [1995], até o cisma [2013]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Movimento Anglicano no Brasil (MAnB) [2013] e Diocese Anglicana do Brasil [2017]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Origem no Movimento Anglicano no Brasil [2016], hoje independente.
    page: '171'
dissolved:
  date: '2016'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      em 13 de março de 2013 a Catedral Anglicana de São Paulo, junto com outras comunidades, organizou o Movimento
      Anglicano no Brasil (MAnB)
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: Em 2016 o “Movimento Anglicano no Brasil” passou a se chamar “Diocese Anglicana no Brasil”.
    page: '95'
website: https://www.catedral-anglicana.org.br/
description: >-
  Grupo da Catedral Anglicana de São Paulo que se desligou da IEAB em 2013, organizado em 13 de março de 2013 sob
  os bispos Roger Douglas Bird e Glauco Soares de Lima e o reverendo Aldo Quintão, sem vínculo com a Comunhão Anglicana.
  Os dois bispos foram eleitos em 3 de março de 2013 e, em 2016, o movimento passou a se chamar Diocese Anglicana
  no Brasil.
