  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      em 13 de março de 2013 a Catedral Anglicana de São Paulo, junto com outras comunidades, organizou o Movimento
      Anglicano no Brasil (MAnB)
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: Em 2016 o “Movimento Anglicano no Brasil” passou a se chamar “Diocese Anglicana no Brasil”.
    page: '95'
website: https://www.catedral-anglicana.org.br/
description: >-
  Grupo da Catedral Anglicana de Sao Paulo que deixou a IEAB em 2012/2013 sob os bispos Roger Bird e Glauco Soares
  de Lima; nao ligado a Comunhao Anglicana.
sources:
- source: wp-pt-dioc-saopaulo
  quote: >-
    o Movimento Anglicano no Brasil é uma Igreja particular que não está ligada a nenhuma instância associativa
    anglicana, nem à Comunhão Anglicana.
relations:
- type: schism_from
  target: ieab
  date: '2013-04-06'
  led_by:
  - aldo-quintao
  - glauco-soares-de-lima
  - roger-douglas-bird
  status: probable
  sources:
  - source: costa2021
    quote: >-
      os bispos Roger Bird e Glauco Soares, junto com o reverendo Aldo Quintão – que atuava como deão da Catedral
      –, romperam com a Província, fundando o Movimento Anglicano no Brasil (MAnB).
  - source: wp-pt-dioc-saopaulo
    quote: >-
      Em 2012, sofreu um cisma da IEAB, em que a Catedral Anglicana de São Paulo, com outras paróquias e missões,
      desligaram-se da diocese e da IEAB
  - source: glauco-testemunho-2013
    quote: O bispo diocesano (Roger Bird) resolveu anular a eleição, decisão com a qual eu concordei.
  - source: costa2021
    quote: >-
      Após realizar uma assembleia, foi votada a modificação dos estatutos da Catedral, em 06 de abril de 2013.
  - source: cant-novas-igrejas-2024
    quote: >-
      em 13 de março de 2013 a Catedral Anglicana de São Paulo, junto com outras comunidades, organizou o Movimento
      Anglicano no Brasil (MAnB)
    page: '93'
  - source: cant-novas-igrejas-2024
    quote: Catedral Anglicana de São Paulo [Origem no templo da Saint Paul’s Church, 1873]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Filiada à IEAB [1972], instituída catedral da DASP [1995], até o cisma [2013]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Movimento Anglicano no Brasil (MAnB) [2013] e Diocese Anglicana do Brasil [2017]
    page: '171'
  - source: costa2021
    quote: se desligaram formalmente da Igreja Episcopal Anglicana do Brasil.
    page: '147'
  notes: >-
    Data: 2012 (Wikipedia PT) ou 2013 (Costa; Glauco aderiu em 2013). Possível sobreposição com a frente IEAB; incluído
    por ser jurisdição menor independente. A Catedral Anglicana de São Paulo, catedral da Diocese Anglicana de São
    Paulo (IEAB) desde 1995, saiu da IEAB no 'cisma [2013]'; o MAnB data de 2013. MAnB organizado em 13/3/2013;
    desligamento formal após assembleia de 6/4/2013.
