id: diocese-of-kentucky
name: Diocese of Kentucky
type: diocese
description: >-
  Diocese da TEC em que Smith (B. B. Smith) foi consagrado bispo em 31 de outubro de 1832; Thomas Underwood Dudley,
  bispo desde 1875, tornou-se diocesano em 1884, com a morte de Smith.
sources:
