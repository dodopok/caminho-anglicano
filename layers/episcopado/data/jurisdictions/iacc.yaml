website: https://dasc-iacc.webnode.page/
description: >-
  A Igreja Anglicana de Confissão Continuante (IACC) teve origem na primeira onda de sagrações de bispos de linhagem
  sucessória ligados ao Movimento Contínuo; no Brasil, o episcopado das sucessões de Chambers, Pagtakhan e Pae foi
  transmitido aos continuantes pelo arcebispo colombiano Victor Manuel Cruz-Blanco. Formou-se em 2013 com dioceses
  em torno da Diocese Anglicana do Japí-Jundiaí, tendo James Roque como moderador e metropolita, primeiro bispo
  anglicano continuante do país; entre elas estão Natal (Albertino de Sousa Barreiros) e São Paulo e Paraná (Itabira
  Jonas). José Kennedy de Freitas, organizador da IACC, sagrou Genival Martins de Oliveira como primeiro bispo primaz
  e permaneceu coadjutor; a vertente de Freitas deu origem à IACB. Freitas morreu em 2021 e a IACC consta como extinta
  em 2022.
