id: diocese-of-london
name: Diocese of London
type: diocese
description: >-
  Diocese da Igreja da Inglaterra. Teve como bispos Edmund Grindal (1559-1570), Richard Bancroft (1597-1604), George
  Abbot (1610-1611), George Montaigne (1621-1628) e William Laud (1628-1633), vários deles depois arcebispos. Seguiram-se
  Gilbert Sheldon (1660-1663), Henry Compton (1675-1713), Beilby Porteus (1787-1809), Archibald Campbell Tait (1856-1868),
  John Jackson (1869-1885) e Frederick Temple (1885-1896).
