# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: diocese-of-springfield
name: Diocese of Springfield
aliases:
- Diocese de Springfield
- Diocese de Springfield (Illinois)
type: diocese
description: >-
  Diocese da Igreja Episcopal (TEC), em Illinois, cujo bispo diocesano foi Peter Beckwith, de 1992 a 2010, quando
  se aposentou. Para sucedê-lo foi eleito Daniel H. Martins, brasileiro nascido no Rio de Janeiro e criado em Chicago,
  ex-batista formado no seminário Nashotah House, cuja eleição ainda dependia de homologação pela Província antes
  da sagração.
sources:
- source: ens-rip-beckwith-2019
  quote: served as bishop of the Diocese of Springfield in Illinois from 1992 to 2010
- source: anglicanink-beckwith-acna-2014
  quote: most notably leading the Episcopal Diocese of Springfield from 1992 to 2010
- source: d2s20-springfield
  quote: para substituir o Revmo. Peter Beckwith , que se aposentou no início desse ano
- source: d2s20-springfield
  quote: >-
    foi eleito o novo bispo da Diocese de Springfield, Illinois, da Igreja Episcopal (TEC) dos Estados Unidos
- source: d2s20-springfield
  quote: O Bispo-Eleito ainda terá que ser homologado pela Província antes de sua sagração.
- source: d2s22-springfield-eleito
  quote: >-
    O Rev. Daniel H. Martins , um brasileiro, nascido no Rio de Janeiro e criado em Chicago, um ex-batista formado
    no Seminário Nashotah House (anglo-católico) foi eleito o novo bispo da Diocese de Springfield, Illinois, da
    Igreja Episcopal (TEC) dos Estados Unidos
relations:
