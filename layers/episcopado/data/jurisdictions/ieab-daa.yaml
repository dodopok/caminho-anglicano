website: https://dioceseamazonia.org.br/
description: >-
  A Diocese Anglicana da Amazônia tem origem no Distrito Missionário da Amazônia, constituído em 2000, e foi criada
  em 29 de julho de 2006 pelo 30º Sínodo Geral da IEAB, realizado em Curitiba, por desmembramento da DAR, com sede
  em Belém do Pará. Seu primeiro bispo foi Saulo Maurício de Barros (2006–2017), que se aposentou em novembro de
  2017. Marinez Bassotto foi instalada bispa diocesana em 22 de abril de 2018 e, em 2022, tornou-se também bispa
  primaz da IEAB.
