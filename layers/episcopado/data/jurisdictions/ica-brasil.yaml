website: https://www.icabrasil.net/
description: >-
  Igreja constituída por Ricardo Vicente dos Anjos, Jorge dos Santos Costa, Altamiro Pereira do Amaral e Marcos
  Vinícius de Souza, que propõem a "Província Católica Anglicana do Brasil" no 1º Sínodo (São Paulo, julho de 2018),
  depois de se afastarem da ICA (a ICA os declarou fora da Mitra Primacial em 24/05/2018). Sede primacial em Ananindeua
  (PA); arcebispo primaz Ricardo Vicente dos Anjos. O site (2024-2025) lista bispos em Minas Gerais, São Paulo (diocese
  e Prelazia Anglicana de São Paulo) e Rio Grande do Sul. Os sagrantes alegam linhagem de Carlos Duarte Costa via
  Antídio José Vargas, Luigi Máscolo, Dylmar Corrêa Baldoíno da Costa e José Elias Jácomo dos Santos.
