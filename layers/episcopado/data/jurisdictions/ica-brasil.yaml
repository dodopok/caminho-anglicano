description: >-
  Igreja originada em bispos que deixaram a Igreja Católica Anglicana (ICA): notificação de 24 de maio de 2018 declarou
  que Altamiro Pereira do Amaral, Jorge dos Santos Costa e Ricardo Vicente dos Anjos não integravam mais a Mitra
  Primacial. Após o cisma, o 1º Sínodo, em São Paulo, em julho de 2018, propôs a criação da Província Católica Anglicana
  do Brasil. Ricardo Vicente dos Anjos é arcebispo primaz desde 2018, tendo Jorge dos Santos Costa e Altamiro Pereira
  do Amaral como bispos co-ordenantes, e Marcos Vinícius de Souza é bispo da Prelazia Anglicana de São Paulo. O
  site lista também Agostinho de Jesus (Rio Grande do Sul), Benedito de Oliveira Martins (São Paulo) e Orestes Calazans
  Filho (Minas Gerais). Um documento de 2018 registra o desligamento de José Fernando de Faria, Jorge dos Santos
  Costa e Orestes Calazans Filho, que criaram a PACES. A sucessão apostólica é atribuída a Carlos Duarte Costa,
  via Antídio José Vargas, Luigi Máscolo, Dylmar Corrêa Baldoíno da Costa e José Elias Jácomo dos Santos, até Ricardo
  Vicente dos Anjos.
