id: aic-w
acronym: AIC-W
name: The Anglican Independent Communion - Worldwide
type: communion
founded:
  date: '1997'
  sources:
  - source: lia-iatb-aicw-2010
    quote: >-
      The late Bishop, The Rt. Rev´d. Dr. Peter A. Compton-Caputo founded the Anglican Independent Communion Worldwide
      in 1997.
  - source: lia-iatb-aicw-2010
    quote: was duly elected and installed as the first Metropolitan Archbishop of the Communion on the same day
  - source: lia-aeci-about
    quote: >-
      In May 2008 in consultation with other members of the bishops and clergy the Anglican Episcopal Church International
      was formed.
description: >-
  Comunhão de igrejas anglicanas independentes fundada por Peter A. Compton-Caputo (segundo a história publicada
  pela IATB, em 1997); Norman Dutton foi seu primeiro Metropolitano (2003) e a IATB integrou-a como província em
  10/10/2007. Dutton fundou a AECI em maio de 2008 (segundo a AECI).
sources:
- source: lia-iatb-aicw-2010
  quote: >-
    The late Bishop, The Rt. Rev´d. Dr. Peter A. Compton-Caputo founded the Anglican Independent Communion Worldwide
    in 1997.
- source: lia-iatb-aicw-2010
  quote: was duly elected and installed as the first Metropolitan Archbishop of the Communion on the same day
- source: lia-aeci-about
  quote: >-
    In May 2008 in consultation with other members of the bishops and clergy the Anglican Episcopal Church International
    was formed.
