# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: cai
acronym: CAI
name: >-
  Comunhão Anglicana Independente (Worldwide Anglican Independent Communion / The Anglican Independent Communion
  Worldwide)
type: communion
description: >-
  Comunhão independente (Worldwide Anglican Independent Communion), com sede na Inglaterra, cuja Província da América
  Latina, sob o arcebispo Leonardo Marin-Saavedra, também é conhecida como Igreja Católico Anglicana Latina Americana.
  No Brasil, Rafael Ribeiro Campos foi nomeado bispo ordinário da Diocese do Centro-Oeste em 2007, bispo-presidente
  em 2008 e bispo-prelado em 2009; o bispo Barry Frank Peachey era a ela filiado.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Leonardo Marin-Saavedra, que foi o Arcebispo da Província da América Latina da Comunhão Anglicana Independente
    (Worldwide Anglican Independent Communion)
  page: '117'
- source: cant-novas-igrejas-2024
  quote: >-
    bispo Barry Frank Peachey, filiado à The Anglican Independent Communion Worldwide, com sede na Inglaterra
  page: '145'
- source: cant-novas-igrejas-2024
  quote: >-
    então arcebispo da Província da América Latina da Comunhão Anglicana Independente (também conhecida como Igreja
    Católico Anglicana Latina Americana)
  page: '117'
- source: cont-frei-campos-sucessao
  quote: >-
    Nomeado como Bispo Ordinário da Província Anglicana Tradicional do Brasil, Diocese do Centro-Oeste, da Comunhão
    Anglicana Independente Mundial (The Anglican Independent Communion Worldwide – AICW) em 15 de outubro de 2007.
- source: cont-frei-campos-sucessao
  quote: >-
    Eleito e nomeado como Bispo-Presidente da Comunhão Anglicana Independente Mundial (The Anglican Independent
    Communion Worldwide – AICW) para o Brasil, de 02 de Junho de 2008 até 06 de Dezembro de 2009.
- source: cont-frei-campos-sucessao
  quote: >-
    Recepcionado e nomeado como Bispo-Prelado para as Instituições Religiosas da Província do Brasil (Igreja Anglicana
    Tradicional), da Comunhão Anglicana Independente (The Anglican Independent Communion Worldwide – AICW) em 07
    de Dezembro de 2009.
