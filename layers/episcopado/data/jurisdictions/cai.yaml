id: cai
acronym: CAI
name: >-
  Comunhão Anglicana Independente (Worldwide Anglican Independent Communion / The Anglican Independent Communion
  Worldwide)
type: communion
description: >-
  Comunhão independente (sede na Inglaterra, segundo a p. 145) cuja Província da América Latina, do arcebispo Leonardo
  Marin-Saavedra, acolheu a Paróquia/Diocese Missionária Thomas Cranmer, origem da Igreja Anglicana do Brasil (Lorite);
  o bispo Barry Frank Peachey era a ela filiado.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Leonardo Marin-Saavedra, que foi o Arcebispo da Província da América Latina da Comunhão Anglicana Independente
    (Worldwide Anglican Independent Communion)
  page: '117'
- source: cant-novas-igrejas-2024
  quote: >-
    bispo Barry Frank Peachey, filiado à The Anglican Independent Communion Worldwide, com sede na Inglaterra
  page: '145'
