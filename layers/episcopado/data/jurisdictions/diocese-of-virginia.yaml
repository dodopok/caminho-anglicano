description: >-
  Diocese da TEC. James Madison foi bispo de 1790 a 1812; William Meade tornou-se bispo em 1829, com a morte de
  Moore; John Johns, bispo desde 1842, tornou-se diocesano em 1862, com a morte de Meade; Francis McNeece Whittle,
  bispo desde 1868, tornou-se diocesano em 1876, com a morte de Johns.
