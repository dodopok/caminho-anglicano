id: iabp
acronym: IABP
name: Igreja Anglicana Bom Pastor
type: national_church
country: BR
description: >-
  A Igreja Anglicana Bom Pastor tem como bispo Megino Carneiro Souza e compreende a Diocese Anglicana de Nossa Senhora
  das Graças e São Jorge. Em 2018, a Iglesia Antigua – Diversidad Cristiana criou no Rio de Janeiro a Missão “El
  Buen Pastor”, que ficou a cargo de Megino. Em 2024, o reverendo José Carlos Berti Júnior buscou criar vínculo
  com ele.
