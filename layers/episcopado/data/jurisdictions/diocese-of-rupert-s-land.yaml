id: diocese-of-rupert-s-land
name: Diocese of Rupert's Land
type: diocese
tradition: anglican
country: CA
description: >-
  Diocese canadense em que Robert Machray foi bispo a partir de 1865 e, com a divisão da diocese em 1875, tornou-se
  arcebispo da província, até sua morte em 9 de março de 1904.
sources:
- source: wp-machray
  quote: >-
    In 1865, he became [[Anglican Diocese of Rupert's Land|Bishop of Rupert's Land]] (in [[Canada]]), becoming [[archbishop]]
    of [[Ecclesiastical Province of the Northern Lights|the province]] when his diocese was split in 1875.
- source: wp-machray
  quote: >-
    becoming [[archbishop]] of [[Ecclesiastical Province of the Northern Lights|the province]] when his diocese
    was split in 1875.
- source: wp-machray
