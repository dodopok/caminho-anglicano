id: iecab
acronym: IECAB
name: Igreja Episcopal Católica Brasileira
type: national_church
country: BR
founded:
  date: '2023-08-01'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Esta denominação tem origem em 2023, na pessoa do reverendo José Carlos Berti Júnior, professor de História,
      Geografia e Teólogo da cidade do Recife
    page: '163'
  - source: cant-novas-igrejas-2024
    quote: >-
      documento intitulado Ato de Nomeação, escrito pelo próprio reverendo, e datado de 1º de agosto de 2023, instituindo
      a Diocese de Olinda e apresentando-se como Supervisor Episcopal da IECAB.
    page: '163'
  - source: cant-novas-igrejas-2024
    quote: Somos uma Igreja herdeira do Catolicismo Nacional de Dom Duarte Costa
    page: '163'
  - source: cant-novas-igrejas-2024
    quote: >-
      Na prática, essa Igreja nunca saiu do papel, e até o momento, ainda permanece em processo de formação
    page: '163'
  - source: cant-novas-igrejas-2024
    quote: Igreja Episcopal Católica Brasileira [2023] (Não organizada de fato até hoje)
    page: '172'
description: >-
  Projeto de igreja episcopal anglo-católica e inclusiva, com sede declarada no Recife, originada em 2023 no reverendo
  José Carlos Berti Júnior, que por Ato de Nomeação de 01/08/2023 instituiu a Diocese de Olinda e se nomeou supervisor;
  declara-se herdeira do catolicismo nacional de Dom Duarte Costa. Sem bispo, nunca se organizou de fato; o autor
  a descreve como 'igreja virtual'.
