description: >-
  A Igreja Episcopal Católica Brasileira tem origem em 2023 no reverendo José Carlos Berti Júnior, professor de
  História e Geografia e teólogo do Recife, que em 1º de agosto de 2023 instituiu a Diocese de Olinda e se apresentou
  como Supervisor Episcopal. Declara-se herdeira do Catolicismo Nacional de Dom Duarte Costa, mas é descrita como
  uma igreja virtual, presente apenas nas redes sociais, que nunca saiu do papel.
