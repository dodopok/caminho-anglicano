# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: southern-brazil
name: Southern Brazil
type: diocese
description: >-
  Distrito missionário da Igreja Episcopal no sul do Brasil, com sede em Porto Alegre. William M. M. Thomas foi
  bispo sufragâneo (1925) e depois bispo missionário (1928-1949); Louis C. Melcher foi sagrado coadjutor em 1948
  e atuou como diocesano em 1949-1950. Em 1949 o distrito foi dividido em três, e Athalício Pithan foi bispo diocesano
  da Diocese Meridional de 1949 a 1955, quando Egmont Krischke foi transferido para sucedê-lo.
sources:
- source: som-1926-01
  quote: The Right Rev. William M. M. Thomas, Suffragan for Southern Brazil
- source: wp-en-thomas
  quote: >-
    Bishop William Thomas, missionary bishop of Southern Brazil from 1928 to 1949, when he retired, died at Bethesda,
    Maryland, September 18.
- source: ens-xxxvi-7
  quote: In 1948 he was consecrated Bishop Coadjutor of Southern Brazil and was Diocesan from 1949-50.
- source: lc-1949-10-16
  quote: >-
    Bishop of the third diocese will be the Rt. Rev. Louis C. Melcher, who suc- seeded Bishop Thomas as diocesan
    a few Jays earlier upon the acceptance of Bish- yp Thomas' resignation by the House of Bishops.
- source: wit-1942-03-12
  quote: Ninety-one Brazilians were con- firmed by the suffragan bishop of Brazil, Athalicio Pithan
- source: wit-1952-03-20
  quote: >-
    Southern Brazil; Porto Alegre, the oldest field includes Theological Seminary; Southern Cross School, 800 boys;
    St. Margaret's School, 225 girls; Rt. Rev. Athalico Pithan;
- source: lc-1955-09-25
  quote: >-
    Bishop Krischke of Southwestern Bra- zil was transferred to the district of Southern Brazil succeeding Bishop
    Pit- han, who has resigned because of ill health.
- source: wit-1955-09-29
  quote: Krischke who is transferring to Southern Brazil to replace Bishop Pithan
- source: costa2021
  quote: >-
    Em 1956, quando o Bispo Pithan se aposentou, a Câmara dos Bispos transferiu o Bispo Krischke para a Diocese
    Meridional com sede em Porto Alegre.
  page: '83'
