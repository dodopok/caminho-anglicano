description: >-
  A Igreja Anglicana Mundial no Brasil, província brasileira da WAC, foi estabelecida em 27 de novembro de 2020
  pelo reverendo Paulo Sérgio Ferreira, que a preside como arcebispo primaz; a primeira paróquia, da qual ele é
  pároco, foi criada em 19 de março de 2019. Sua cúria provincial fica em Serra (ES), e a província é descrita como
  formada por seis regiões missionárias e uma diocese, com missões como a de Ouro Preto (MG), a de Biguaçu (SC)
  e a de Piraquara (PR). Em 21 de novembro de 2023 foi vinculada a ela a Diocese do Pará (bispo diocesano Antônio
  Jesualdo Bezerra de Moura). Em julho de 2024 foi incardinado o bispo Claudinei Rodrigo Ferreira, da Diocese de
  Santa Catarina, que iniciou seus trabalhos em 2017, ligada à Igreja Anglicana Continuante, e que ele assumiu em
  2019. Inclui também a Diocese de Pernambuco, com Josinaldo Bezerra de Lima em Belo Jardim, e duas dioceses em
  São Paulo, São Francisco dos Pequenos e São Tiago Maior.
