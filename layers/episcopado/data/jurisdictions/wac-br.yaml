description: >-
  Província brasileira da Igreja Anglicana Mundial (WAC), estabelecida em 27 de novembro de 2020 pelo reverendo
  Paulo Sérgio Ferreira, que a preside como arcebispo primaz; a primeira paróquia foi criada em 19 de março de 2019.
  Em 21 de novembro de 2023 foi vinculada a ela a Diocese do Pará (bispo diocesano Antônio Jesualdo Bezerra de Moura),
  e em julho de 2024 foi incardinado o bispo Claudinei Rodrigo Ferreira, da Diocese de Santa Catarina, em Florianópolis.
  Inclui também a Diocese de Pernambuco, com Josinaldo Bezerra de Lima em Belo Jardim, e duas dioceses em São Paulo,
  São Francisco dos Pequenos e São Tiago Maior.
