description: >-
  Província brasileira da WAC, com sede (cúria provincial) em Serra (ES). Registrada na Receita Federal como "Igreja
  Anglicana Mundial WAC do Brasil" (organização religiosa), com início de atividade em 27/11/2020 e Paulo Sérgio
  Ferreira como presidente. O site lista missões em ES, MG, SP, CE, SC, PR e as dioceses de São Paulo (duas), Pará
  e Pernambuco; a primeira paróquia (Missão São José, Serra) foi criada em 19/03/2019.
