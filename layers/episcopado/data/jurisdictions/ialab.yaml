description: >-
  Igreja anglicana independente de São Luís (MA), originada na figura do bispo Geraldo Santos de Magela Neto, seu
  dirigente. Registrada juridicamente em 14 de novembro de 2006, subscreveu a Declaração da Boa Viagem, do movimento
  "Por Uma Causa Comum", e teve as atividades encerradas em 6 de novembro de 2018.
sources:
