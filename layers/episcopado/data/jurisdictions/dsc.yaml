# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: dsc
acronym: DSC
name: Diocese of the Southern Cross
type: diocese
tradition: anglican
country: AU
description: >-
  Diocese que atende paróquias separadas da Igreja Anglicana da Austrália, ligada ao GAFCON e integrante da Global
  Anglican Communion desde março de 2026. Glenn Davies é seu bispo diocesano desde agosto de 2022.
sources:
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Glenn Davies of the Diocese of the Southern Cross (which serves parishes that have broken away from the Anglican
    Church of Australia)
- source: gace-gac-page
  quote: Since August 2022 he has served as bishop of the Diocese of the Southern Cross.
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Its regional advisers all lead “extra-provincial or missionary districts connected to the GAFCON movement.”
    They are Archbishop Kanishka Raffel of Sydney (a diocesan bishop in the Anglican Church of Australia), and Bishops
    Andy Lines of the Anglican Network in Europe, Jay Behan of the Church of Confessing Anglicans in Aotearoa New
    Zealand, Glenn Davies of the Diocese of the Southern Cross (which serves parishes that have broken away from
    the Anglican Church of Australia), and Yassir Eric of EKKIOS, a missionary movement forming congregations in
    predominantly Muslim regions.
- source: gace-gac-page
  quote: Bishop of the Diocese of the Southern Cross
relations:
- type: member_of
  target: gac
  date: 2026-03
  led_by:
  - glenn-davies
  status: confirmed
  sources:
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      Its regional advisers all lead “extra-provincial or missionary districts connected to the GAFCON movement.”
