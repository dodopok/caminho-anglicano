id: icr
acronym: ICR
name: Igreja Católica Romana (Arquidiocese de Pouso Alegre / Diocese de Guaxupé)
type: other
country: BR
description: >-
  Referência usada para os vínculos anteriores de Dionísio Aílton Pereira (Pouso Alegre) e Ronaldo Melo (Guaxupé/Poços
  de Caldas).
sources:
- source: lq-g1-ronaldo-2015
  quote: >-
    Antes de fundar a igreja, padre Ronaldo estava em Poços de Caldas (MG), onde foi pároco durante nove anos pela
    Igreja Católica.
