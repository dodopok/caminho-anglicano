id: iab-regiao-missionaria
acronym: IAB-RegiaoMissionaria
name: Região Missionária (IAB)
aliases:
- Diocese de Recife (auxiliar) / Região Missionária (bispo missionário)
- Região Missionária
- Região Missionária (Igreja Anglicana no Brasil)
type: missionary_district
tradition: anglican
country: BR
website: https://www.anglicananobrasil.com/on/regiao-missionaria/
description: >-
  Região não diocesana da IAB (prioritariamente Sul e Sudeste, e exterior: Panamá, Colômbia), sob o bispo missionário
  Flávio Adair Torres Soares (página de 2018). Em ago/2026 o GAFCON fala em "one missionary diocese" na IAB.
sources:
