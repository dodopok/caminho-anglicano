    quote: Bishop Flavio Soares – Missionary Bishop of the Diocese of Recife
  - source: iab-regiao-missionaria
    quote: Ministro Encarregado:Rev. Eric Rodrigues
  - source: wp-en-iab
    quote: Miguel Neto, Eric Rodrigues (assistant)
  - source: iab-regiao-missionaria
    quote: 'Ministro Encarregado: Ministro Local: Reinaldo de Souza'
  - source: iab-regiao-missionaria
    quote: porém se você está localizado fora de nossas 3 Dioceses, considere-se parte de nossa missão
