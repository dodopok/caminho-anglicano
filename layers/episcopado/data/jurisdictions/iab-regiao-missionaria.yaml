  - source: iab-regiao-missionaria
    quote: atua também como Bispo na região Missionaria da Província
  - source: iab-church-planting-bishops
    quote: Bishop Flavio Soares – Missionary Bishop of the Diocese of Recife
  - source: iab-comunicado-oficial-2018
    quote: Flavio Adair Bispo Auxiliar de Recife
  - source: iab-regiao-missionaria
    quote: >-
      Mora em João Pessoa onde lidera uma igreja local, mas atua também como Bispo na região Missionaria da Província.
