  status: probable
  sources:
  - source: iacc-continuante
    quote: >-
      arcebispo colombiano ††Victor Manuel Cruz-Blanco, da Província Católica de Rito Anglicano da América Latina,
      então vinculada à Igreja Católica de Rito Anglicano, com sede em Quakertown, Pensilvânia, nos Estados Unidos
      da América, que tinha como Primaz o arcebispo ††Thomas Justin Kleppinger
  notes: >-
    Declaração do site da IACC ('então vinculada'); o vínculo era passado no momento em que o site foi escrito,
    o que sugere que a vinculação pode ter mudado depois de 2013 — ver dúvidas.
- type: in_communion_with
  target: aeci
  date: '2011-08-23'
  led_by:
  - norman-dutton
  - victor-manuel-cruz-blanco
  status: confirmed
  sources:
  - source: lia-aeci-news
    quote: >-
      The Anglican Episcopal Church International and The Holy Catholic Church -Western Rite (The Anglican Province
      of the Caribbean and New Granada) was agreed and signed on 23rd August 2011 by the respective Archbishops
      Most Rev'd Norman S Dutton and Most Rev'd Victor Manuel Cruz-Blanco.
  notes: >-
    Em 2011 a jurisdição de Cruz-Blanco aparece na AECI como 'The Holy Catholic Church - Western Rite (The Anglican
    Province of the Caribbean and New Granada)'. Concordato de comunhão plena. A Wikipédia (HCCAR) informa que em
    março de 2010 a HCC-Western Rite e a HCC-Anglican Rite entraram em plena comunhão como uma só igreja ('Anglican
    Rite Catholic Church, Original Province').
