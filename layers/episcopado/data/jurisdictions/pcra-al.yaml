# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: pcra-al
acronym: IACNG
name: >-
  Iglesia Anglicana del Caribe y la Nueva Granada (Diocese/Provincia Anglicana del Caribe y La Nueva Granada)
aliases:
- PCRA-AL
- Província Católica de Rito Anglicano (América Latina / Colômbia), de Victor Manuel Cruz-Blanco
- Província Católica de Rito Anglicano da América Latina
type: diocese
country: CO
description: >-
  Jurisdição continuante colombiana, com sede metropolitana em Barranquilla, presidida por Victor Manuel Cruz-Blanco,
  arcebispo metropolitano e primado da Província Católica de Rito Anglicano da América Latina, então vinculada à
  Igreja Católica de Rito Anglicano (HCCAR). Cruz-Blanco sagrou o bispo brasileiro James Roque em 2013 e, em 15
  de agosto de 2015, elevou Theodoro Oliveira a bispo ordinário da Diocese Católica Anglicana Santa Madre de Deus;
  em 23 de agosto de 2011 firmou plena comunhão com a AECI.
sources:
- source: iacc-continuante
  quote: >-
    na sede metropolitana da Igreja Anglicana Continuante da República da Colômbia (Diocese Anglicana del Caribe
    y La Nueva Granada), na cidade de Barranquilla
- source: lin-cruzblanco-cv
  quote: President, Anglican Church in the Caribbean and New Granada
- source: cont-pciacng-theodoro
  quote: El Decrero Correspondinte Fue Emirido Por El Arzobispo Metropolitano , Su Gracia Victor Cruz Blanco
- source: cont-pciacng-primado
  quote: >-
    Arzobispo Metropolitano. Su  Gracia Victor Cruz Blanco, Designado Primado De La Provincia Por La Comunion Apostolica
    De Iglesias Anglicanas.
- source: iacc-continuante
  quote: >-
    arcebispo colombiano ††Victor Manuel Cruz-Blanco, da Província Católica de Rito Anglicano da América Latina,
    então vinculada à Igreja Católica de Rito Anglicano, com sede em Quakertown, Pensilvânia, nos Estados Unidos
    da América, que tinha como Primaz o arcebispo ††Thomas Justin Kleppinger
- source: costa2021
  quote: tendo recebido a sagração episcopal pelas mãos do bispo colombiano Victor Manuel Cruz-Blanco.
  page: '138'
- source: cont-pciacng-theodoro
  quote: >-
    La Sede Metropolitana De La Provincia Catolica De Rito Anglicano De America Latina, Elevo Al Obispo Monseñor
    Theodoro Oliveira A Obispo Ordinario De La Diócesis Catolica Anglicana Santa Madre De Dios.
- source: lia-aeci-news
  quote: >-
    The Anglican Episcopal Church International and The Holy Catholic Church -Western Rite (The Anglican Province
    of the Caribbean and New Granada) was agreed and signed on 23rd August 2011 by the respective Archbishops Most
    Rev'd Norman S Dutton and Most Rev'd Victor Manuel Cruz-Blanco.
relations:
