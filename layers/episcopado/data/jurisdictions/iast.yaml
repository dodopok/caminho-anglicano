  led_by:
  - sergio-l-andrade
  status: probable
  sources:
  - source: costa2021
    quote: Isso levou a um racha na então catedral diocesana, a Catedral da Santíssima Trindade.
  - source: costa2021
    quote: Infelizmente, o ano de 2017 começou com movimentações negativas na Diocese do Recife.
    page: '246'
  - source: costa2021
    quote: >-
      Após a saída do grupo ligado ao reverendo Sérgio, foi assumido o nome de “Igreja Anglicana da Santíssima Trindade”
    page: '247'
  notes: Igreja anglicana independente, sem filiação nacional ou internacional.
- type: schism_from
  target: ieab-dar
  date: '2017'
  led_by:
  - sergio-l-andrade
  status: probable
  sources:
  - source: cant-novas-igrejas-2024
    quote: após a mesma ter rompido com a Igreja Episcopal Anglicana do Brasil, no ano de 2017
    page: '109'
  - source: cant-novas-igrejas-2024
    quote: >-
      Entretanto, alguns desses clérigos, sobretudo aqueles que se relacionavam ao staff da catedral diocesana,
      decidiram partir e romper a comunhão com nossa Igreja
    page: '111'
