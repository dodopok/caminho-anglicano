id: iast
acronym: IAST
name: Igreja Anglicana da Santíssima Trindade (Recife)
type: other
country: BR
founded:
  date: '2017'
  sources:
  - source: costa2021
    quote: >-
      Após a saída do grupo ligado ao reverendo Sérgio, foi assumido o nome de “Igreja Anglicana da Santíssima Trindade”,
      e eles passaram a apresentar-se como uma continuação da “Igrejinha dos Ingleses”
  - source: cant-novas-igrejas-2024
    quote: >-
      Atualmente, sob a liderança do reverendo Sérgio Andrade, a comunidade se tornou uma Igreja Anglicana independente,
      após a mesma ter rompido com a Igreja Episcopal Anglicana do Brasil, no ano de 2017, deixando de ser a Catedral
      diocesana da Província da Comunhão Anglicana no Recife.
    page: '109'
  - source: cant-novas-igrejas-2024
    quote: deu continuidade às raízes do grupo, sendo renomeada de Igreja Anglicana da Santíssima Trindade.
    page: '112'
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana da Santíssima Trindade (Recife) [2017]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Origem como catedral da Diocese Anglicana do Recife até o cisma; hoje independente
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: a Igreja Anglicana da Santíssima Trindade, independente, pastoreada pelo reverendo Sérgio Andrade
    page: '174'
  - source: costa2021
    quote: >-
      trata-se de uma Igreja Anglicana Independente que, até o momento, permanece como uma congregação isolada,
      sem nenhuma filiação a alguma instância associativa nacional ou mundial.
    page: '247'
description: >-
  Congregação independente formada em 2017 pelo grupo do Rev. Sérgio Andrade, que deixou a então catedral diocesana
  da IEAB no Recife; apresenta-se como continuação da Holy Trinity Church; sem filiação.
sources:
- source: costa2021
  quote: >-
    Após a saída do grupo ligado ao reverendo Sérgio, foi assumido o nome de “Igreja Anglicana da Santíssima Trindade”,
    e eles passaram a apresentar-se como uma continuação da “Igrejinha dos Ingleses”
relations:
- type: schism_from
  target: ieab
