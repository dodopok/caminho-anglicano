description: >-
  Congregação anglicana independente de Recife surgida em 2017, quando o grupo ligado ao reverendo Sérgio Andrade
  rompeu com a IEAB, após um racha na então catedral diocesana, e passou a se chamar Igreja Anglicana da Santíssima
  Trindade. Apresenta-se como continuação da Holy Trinity Church, a "Igrejinha dos Ingleses", fundada em 31 de maio
  de 1838. Permanece sob a liderança de Sérgio Andrade como congregação isolada, e Sebastião Armando Gameleira Soares
  aparece como bispo visitador da comunidade.
