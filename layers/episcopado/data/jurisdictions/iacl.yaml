id: iacl
acronym: IACL
name: Igreja Anglicana de Comunhão Livre
type: national_church
country: BR
founded:
  date: '2016'
  sources:
  - source: lpq-iacl-wb-capela
    quote: Missão Santa Mãe de Deus - Anglo Católica Reverendo Pe. Ezequiel Martins Garcia Júnior
  - source: lpq-iacl-wb-canones
    quote: >-
      Constituição dos Cânones da IACL Diretrizes canônicas constitutivas do 1º Sínodo Episcopal Conciliar e constituição
      do “Corpo Sagrante Conciliar” da Igreja Anglicana de Comunhão Livre e CONIE.
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Anglicana de Comunhão Livre tem origem no ano de 2016, na cidade de Joinville, Santa Catarina, a
      partir da figura de Ezequiel Martins Garcia Júnior
    page: '115'
  - source: cant-novas-igrejas-2024
    quote: Intitulada de “Capela Pessoal”, por estar localizada na sua residência.
    page: '115'
  - source: cant-novas-igrejas-2024
    quote: >-
      Atualmente, no Facebook, a página administrada pelo bispo Ezequiel, se chama Ordinariato Anglicano Católico
      Tradicional do Brasil. Todavia, no Brasil, não existe nenhuma instância de Ordinariato, ligada canonicamente
      à Igreja Católica Romana.
    page: '115'
  - source: cant-novas-igrejas-2024
    quote: Através dessa estrutura, criou o Ordinariato Anglo Católico Tradicional do Brasil.
    page: '115'
  - source: lpq-iacl-wb-canones
    quote: >-
      Cân. 1º - § 1. Por “Estado de Necessidade“ e “Direito de Necessidade” da Igreja Anglicana de Joinville e do
      CONIE
  - source: lpq-iacl-wb-sucessao
    quote: >-
      Ezequiel Martins Garcia Júnior - 2017 (Sínodo Episcopal Conciliar da Comunhão Nacional de Igrejas Episcopais
      o CONIE, conforme os 8 Decretos do CONIE
website: http://missaostamaededeus.comunidades.net/
description: >-
  Igreja anglo-católica de Joinville (SC), originada em 2016 da Missão Santa Mãe de Deus, criada por Ezequiel Martins
  Garcia Júnior quando presbítero. A partir de 2017 Ezequiel aparece como primaz e Wellington Pedroso Rodrigues
  como bispo coadjutor e chanceler; a sucessão de Ezequiel é atribuída ao Sínodo Episcopal Conciliar da CONIE, e
  a Constituição e os Cânones tratam do 1º Sínodo Episcopal Conciliar e do Corpo Sagrante Conciliar da IACL e da
  CONIE. Ezequiel criou também o Ordinariato Anglo Católico Tradicional do Brasil, nome da página que administra
  no Facebook, embora não exista no país ordinariato ligado canonicamente à Igreja Católica Romana.
