    page: '115'
website: http://missaostamaededeus.comunidades.net/
description: >-
  Igreja anglo-católica independente de Joinville (SC). O site (hoje fora do ar; lido pelo Internet Archive) mostra
  a origem na "Missão Anglicana Santa Mãe de Deus", uma "capela pessoal" do Rev. Pe. Ezequiel Martins Garcia Júnior
  (convites de 2016). Em 2017-2018 o site passa a falar em Primaz Ezequiel, bispo coadjutor Wellington Pedroso Rodrigues,
  "Ordinariato Anglo Católico Tradicional do Brasil" e na "Comunhão Nacional de Igrejas Episcopais" (CONIE). A Constituição
  e Cânones invoca "Estado de Necessidade" e um "Corpo Sagrante Conciliar" para fundamentar a sagração de bispos.
sources:
