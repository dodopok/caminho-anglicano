acronym: IACL
name: Igreja Anglicana de Comunhão Livre
type: national_church
country: BR
founded:
  date: '2016'
  sources:
  - source: lpq-iacl-wb-capela
    quote: Missão Santa Mãe de Deus - Anglo Católica Reverendo Pe. Ezequiel Martins Garcia Júnior
  - source: lpq-iacl-wb-canones
    quote: >-
      Constituição dos Cânones da IACL Diretrizes canônicas constitutivas do 1º Sínodo Episcopal Conciliar e constituição
      do “Corpo Sagrante Conciliar” da Igreja Anglicana de Comunhão Livre e CONIE.
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Anglicana de Comunhão Livre tem origem no ano de 2016, na cidade de Joinville, Santa Catarina, a
