description: >-
  Comunhão anglicana continuante anglo-católica (primaz atual Shane B. Janzen, Canadá). No Brasil tem a Diocese
  Anglicana do Natal (fundada em julho de 2019; bispo Albertino de Sousa Barreiros) e a Diocese Anglicana de São
  Paulo e Paraná (bispo Itabira Jonas, sagrado em 11/1/2018). As dioceses brasileiras foram recebidas oficialmente
  e por unanimidade no Sínodo Geral da TAC em Columbus, Geórgia (EUA), em 2025.
