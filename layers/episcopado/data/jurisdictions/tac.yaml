description: >-
  Comunhão anglicana continuante surgida em 1991 da separação de clérigos e comunidades da Comunhão Anglicana; Louis
  Wahl Falk III foi seu primeiro primaz (1991-2002) e o primaz atual é Shane B. Janzen. Em 2025, no Sínodo Geral
  em Columbus (Geórgia, EUA), foram recebidas as dioceses brasileiras do Natal (bispo Albertino de Sousa Barreiros)
  e de São Paulo e Paraná (bispo Itabira Jonas).
