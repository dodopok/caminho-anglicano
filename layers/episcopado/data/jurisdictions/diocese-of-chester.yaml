- source: stubbs-1897
  quote: John Bird Sumner. Chester ; Canterbury, 1848 ; d. Sept. 6, 1862.
- source: wp-fisher
  quote: the following week Fisher was enthroned as Bishop of Chester at [[Chester Cathedral]].
