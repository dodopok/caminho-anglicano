id: diocese-of-chester
name: Diocese of Chester
type: diocese
description: >-
  Diocese da Igreja da Inglaterra que teve como bispos William Markham (1771-1777, depois York), Beilby Porteus
  (1777-1787, depois Londres) e John Bird Sumner (1828-1848, depois Canterbury); Geoffrey Francis Fisher foi entronizado
  bispo em 1932.
sources:
