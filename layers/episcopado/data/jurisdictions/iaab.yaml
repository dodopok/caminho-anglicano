id: iaab
acronym: IAAB
name: Igreja Anglicana Abulense Brasileira
type: other
country: BR
founded:
  date: '2005'
  sources:
  - source: rta-abulense-historia
    quote: >-
      A Catholic Charismatic Church foi o nome pela qual a Igreja Católica Carismática provinda dos Estados Unidos
      e Europa registrou-se no Brasil em 2005.
  - source: rta-abulense-historia
    quote: >-
      fixa-se na Espanha, especialmente no território de Castilla y León, Cidade de Ávila donde lhe vêm o adjetivo
      Abulense.
description: >-
  Descendente da Catholic Charismatic Church, registrada no Brasil em 2005 sob o bispo Alexandre Macedo Maia; a
  ligação com Ávila (Castela e Leão, Espanha) dá origem ao adjetivo "Abulense".
sources:
- source: rta-abulense-historia
  quote: O Bispo Maia, ordenado e sagrado pela CCC
- source: rta-abulense-historia
  quote: Tendo por meio dele chegado ao Brasil, governada no ano de 2005 pelo Bispo Maia
- source: rta-abulense-historia
  quote: >-
    A Catholic Charismatic Church foi o nome pela qual a Igreja Católica Carismática provinda dos Estados Unidos
    e Europa registrou-se no Brasil em 2005.
- source: rta-abulense-historia
  quote: >-
    fixa-se na Espanha, especialmente no território de Castilla y León, Cidade de Ávila donde lhe vêm o adjetivo
    Abulense.
