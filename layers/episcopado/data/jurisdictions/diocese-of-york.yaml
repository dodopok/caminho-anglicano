id: diocese-of-york
name: Diocese of York
type: diocese
description: >-
  Diocese da Igreja da Inglaterra. Teve como arcebispos Edmund Grindal (1570-1576), George Montaigne (1628, falecido
  em 6 de novembro), Thomas Herring (1743-1747), Robert Hay Drummond (1761-1776), William Markham (1777-1807), Edward
  Venables-Vernon-Harcourt (1808-1847) e Charles Thomas Longley (1860-1862).
