description: >-
  A Igreja Episcopal do Brasil foi fundada pelo bispo Rosimael Losasi, em Pernambuco, e organizada juridicamente
  em 13 de novembro de 2017, com sede jurídica em Cachoeirinha, sem endereço fixo. Gleidson Oliveira, sagrado bispo
  diocesano para Pernambuco em 10 de abril de 2017, rompeu com Losasi em 2019, origem da Igreja Episcopal Sul Americana;
  Losasi passou a se denominar arcebispo, e a igreja encerrou as atividades em 7 de junho de 2022.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    A Igreja Episcopal do Brasil foi fundada pelo bispo Rosimael Losasi, no Estado de Pernambuco, sendo organizada
    juridicamente em 13 de novembro de 2017.
  page: '165'
- source: cant-novas-igrejas-2024
  quote: >-
    a sua sede jurídica encontrava-se no município de Cachoeirinha – interior de Pernambuco –, porém, sem endereço
    fixo ou determinado
  page: '165'
- source: cant-novas-igrejas-2024
  quote: >-
    Em 10 de abril de 2017, com a participação de outros cinco bispos, Gleydson foi sagrado como Bispo Diocesano
    para o Estado de Pernambuco, com cerimônia realizada em uma das salas do Convento de Nossa Senhora da Conceição,
    em Olinda.
  page: '165'
- source: cant-novas-igrejas-2024
  quote: Em 2019, o mesmo rompeu com o bispo Rosimael Losasi, fundador da Igreja Episcopal do Brasil.
  page: '169'
- source: cant-novas-igrejas-2024
  quote: >-
    A origem da Igreja Episcopal Sul Americana está na figura do então bispo Igreja Episcopal do Brasil, Gleydson
    Oliveira. Em 2019, o mesmo rompeu com o bispo Rosimael Losasi, fundador da Igreja Episcopal do Brasil.
  page: '169'
- source: cant-novas-igrejas-2024
  quote: >-
    Posteriormente, o bispo Rosimael passou a se denominar Arcebispo, porém, sem angariar nem clero, nem novas comunidades
  page: '165'
- source: cant-novas-igrejas-2024
  quote: >-
    Com o gradual afastamento do bispo Gleydson, a Igreja Episcopal do Brasil encerrou as suas atividades em 07
    de junho de 2022, como consta em registros jurídicos.
  page: '165'
