description: >-
  Igreja episcopal independente fundada por Rosimael Losasi em Pernambuco, organizada juridicamente em 13/11/2017,
  com sede jurídica em Cachoeirinha (PE) sem endereço fixo; presença sobretudo virtual, liturgia com muitos elementos
  católicos romanos. Encerrou atividades em 07/06/2022. Não confundir com o antigo nome da IEAB ('Igreja Episcopal
  do Brasil', anterior ao Sínodo de 1990).
