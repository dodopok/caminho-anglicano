id: hccar
acronym: HCCAR
name: >-
  Holy Catholic Church Anglican Rite (Anglican Rite Catholic Church; Igreja Católica de Rito Anglicano)
aliases:
- Holy Catholic Church (Anglican Rite)
type: national_church
country: US
founded:
  date: '1999'
  sources:
  - source: cont-wiki-hccar
    quote: >-
      The Holy Catholic Church Anglican Rite (HCCAR), also known as the Anglican Rite Catholic Church, is a body
      of Christians in the Continuing Anglican movement.
  - source: cont-wiki-hccar
    quote: >-
      By 1999, the dissenting bishops had separated into groups forming two new churches, the Holy Catholic Church
      Western Rite
website: https://holycatholicanglican.org
description: >-
  Corpo do movimento anglicano continuante surgido de uma disputa sucessória entre os bispos da ACC-OP em 1997,
  quando cinco bispos dissidentes (Kleppinger, McNeley, Seeland, Hamlett e Cruz-Blanco) se reuniram em sínodo em
  Allentown, na Pensilvânia; por volta de 1999 os dissidentes já formavam novas igrejas. Tem sede em Quakertown
  (PA), com Thomas Justin Kleppinger como primaz, e a Província Católica de Rito Anglicano da América Latina, do
  arcebispo colombiano Victor Manuel Cruz-Blanco, esteve vinculada a ela.
sources:
