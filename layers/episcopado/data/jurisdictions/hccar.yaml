website: https://holycatholicanglican.org
description: >-
  Corpo continuante anglo-católico dos EUA (Quakertown, PA), surgido da disputa sucessória de 1997 na ACC-OP; segundo
  o site da IACC, tinha uma 'Província Católica de Rito Anglicano da América Latina' liderada por Cruz-Blanco, de
  onde veio a sagração de James Roque. Distinta da TAC e da ACC.
