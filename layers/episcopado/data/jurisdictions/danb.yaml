id: danb
acronym: DAnB
name: Diocese Anglicana no Brasil
type: diocese
country: BR
founded:
  date: '2016'
  sources:
  - source: lbd-danb-falecimento
    quote: >-
      integrou o "Movimento Anglicano no Brasil", que em 2016 passaria a ser a nossa "Diocese Anglicana no Brasil"
      - com sede em Pouso Alegre Minas Gerais, passando a ser nosso bispo diocesano.
  - source: lq-danb-fb-manifesto-2023
    quote: Dom Dionísio Ailton Pereira – Bispo Sufragâneo da Diocese Anglicana no Brasil
  - source: cant-novas-igrejas-2024
    quote: Em 2016 o “Movimento Anglicano no Brasil” passou a se chamar “Diocese Anglicana no Brasil”.
    page: '95'
  - source: cant-novas-igrejas-2024
    quote: >-
      A Diocese Anglicana no Brasil tem origem em duas jurisdições: a primeira, o chamado Movimento Anglicano no
      Brasil (MAnB), ligado à Catedral Anglicana de São Paulo, do reverendo Aldo Quintão. A segunda é a Paróquia
      Anglicana de São Jorge, na cidade de Pouso Alegre, interior de Minas Gerais, hoje liderada pelo bispo Dionísio
      Ailton Pereira.
    page: '103'
  - source: cant-novas-igrejas-2024
    quote: >-
      Para organizar juridicamente a nova denominação, e por se tratar de uma Igreja de governo episcopal, foi criada
      a Diocese Anglicana no Brasil.
    page: '93'
website: https://www.facebook.com/profile.php?id=61574787623932
description: >-
  Nome adotado em 2016 pelo Movimento Anglicano no Brasil, segundo nota da própria Diocese; a nota de 2023 afirma
  que ela teria sede em Pouso Alegre (MG). Teve Roger Bird como bispo diocesano até a morte (13/02/2023); Dionísio
  Aílton Pereira, sagrado sufragâneo em 2021, aparece em janeiro de 2023 assinando como 'Bispo Sufragâneo da Diocese
  Anglicana no Brasil'. O site da Catedral Anglicana de São Paulo ainda descreve a Catedral como 'a cátedra da Diocese
  Anglicana no Brasil'.
