description: >-
  Igreja de Montevidéu (Uruguai) cujo bispo, Julio Vallarino, criou em 2018 missões em vários países, entre elas
  a Missão "El Buen Pastor" no Rio de Janeiro, entregue a Megino Carneiro Souza.
sources:
- source: meel-iadc-res-2018-25
  quote: >-
    habiendo recibido la solicitud de reconocimiento de una Misión de la IADC en Brasil, resuelvo: 1. Créanse una
    Misión de la Iglesia Antigua – Diversidad Cristiana denominada “El Buen Pastor” en Río de Janeiro (Brasil) a
    cargo del Rvdo. Megino Carneiro Souza.
