description: >-
  A Igreja Anglicana das Américas, chamada inicialmente Igreja Episcopal Anglicana Livre (IEAL), é uma das primeiras
  Igrejas Anglicanas Independentes do Brasil, organizada em 1999 pelo bispo José Aparecido Peraçoli Moreno. Moreno
  estabeleceu comunhão plena com o arcebispo Michael B. Simmons, da Igreja Anglicana da América Latina, e é membro
  do GAFCON e da CACI (Communion of Anglican Churches International).
