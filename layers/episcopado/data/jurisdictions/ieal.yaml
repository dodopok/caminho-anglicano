website: https://www.oocities.org/episcopalbh/
description: >-
  A Igreja Anglicana das Américas, chamada inicialmente Igreja Episcopal Anglicana Livre (IEAL), é uma das primeiras
  Igrejas Anglicanas Independentes do Brasil, organizada em 1999 pelo bispo José Aparecido Peraçoli Moreno. Inicialmente
  localizada em Belo Horizonte, adotava uma identidade de Renovação Carismática Anglicana, e Moreno estabeleceu
  comunhão plena com o arcebispo Michael B. Simmons, da Igreja Anglicana da América Latina, sediada nos EUA. Em
  4 de junho de 2002 adquiriu personalidade jurídica e tornou-se membro pleno do Conselho Nacional de Igrejas Cristãs
  em Minas Gerais; em 2007 publicou sua edição do Livro de Oração Comum. Hoje a sede é em Indaiatuba (SP), e Moreno
  é bispo da igreja e membro do GAFCON e da CACI (Communion of Anglican Churches International).
