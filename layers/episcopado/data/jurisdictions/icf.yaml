description: >-
  Criada em 2015 em Machado (MG) pelo padre Ronaldo Melo, após seu desligamento da Igreja Católica, que caracterizou
  o ato como cisma; Dionísio Aílton Pereira cofundou a Igreja Católica da Fé, em Pouso Alegre.
sources:
- source: lq-g1-ronaldo-2015
  quote: A Igreja Católica Apostólica da Fé, a ICAF, foi criada há três meses pelo padre Ronaldo Melo
- source: lq-g1-ronaldo-2015
  quote: Mas em maio deste ano, ele decidiu pedir seu desligamento da igreja.
- source: lvc-poscja-ronaldo
  quote: >-
    a criação da Igreja Católica Apostólica da Fé, em Machado (MG), foi caracterizada como cisma, separação completa
    da Igreja Católica Apostólica Romana.
- source: cant-novas-igrejas-2024
  quote: junto com Dionísio criaram a Igreja Católica da Fé, na cidade de Pouso Alegre.
  page: '103'
- source: lq-pocosja-2015
  quote: >-
    Em comunicado oficial, o bispo Dom José Lanza, da Diocese de Guaxupé, informa que a criação da Igreja Católica
    Apostólica da Fé, em Machado (MG), foi caracterizada como cisma, separação completa da Igreja Católica Apostólica
    Romana.
- source: lq-tvjc-presbitero-2022
  quote: em celebração ocorrida na Paróquia São Jorge, conhecida como a Igreja da Fé, em Pouso Alegre/MG.
