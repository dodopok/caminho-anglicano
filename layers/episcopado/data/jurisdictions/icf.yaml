id: icf
acronym: ICAF
name: Igreja Católica Apostólica da Fé
aliases:
- ICF
- Igreja Católica Apostólica da Fé (Igreja Católica da Fé)
- Igreja Católica da Fé
type: other
country: BR
founded:
  date: '2015'
  sources:
  - source: lq-g1-ronaldo-2015
    quote: A Igreja Católica Apostólica da Fé, a ICAF, foi criada há três meses pelo padre Ronaldo Melo
  - source: lq-pocosja-2015
    quote: a criação da Igreja Católica Apostólica da Fé, em Machado (MG), foi caracterizada como cisma
description: >-
  Igreja independente criada em Machado (MG) em 2015 pelo então padre Ronaldo Melo, após seu desligamento da Diocese
  de Guaxupé. A Diocese de Guaxupé considerou o ato um cisma. Em Pouso Alegre, a Paróquia São Jorge é conhecida
  como 'Igreja da Fé'.
