description: >-
  Diocese criada em jun/2026 por desmembramento da Diocese Anglicana Família (ex-João Pessoa), com catedral na Igreja
  Anglicana Comunhão em Patos (PB), elevada a Catedral Diocesana; primeiro bispo diocesano Miguel Neto (empossado).
  Território provável: sertão/interior da Paraíba e Ceará, região que Miguel Neto já supervisionava como auxiliar.
  Perfil oficial @dac.anglicananobrasil.
