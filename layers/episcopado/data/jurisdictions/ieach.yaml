website: https://www.igrejaanglicanaepiscopal.com/
description: >-
  A Igreja Episcopal Anglicana do Chile (IEACH) tem origem em comunidades anglocatólicas que, a partir de 1991,
  buscaram supervisão episcopal na tradição anglicana; a Província Anglicana de Cristo Bom Pastor, sediada nos Estados
  Unidos, as acolheu e deu existência canônica à nova igreja, que obteve autonomia como Igreja Nacional em 2006,
  elegendo Patricio Viveros Robles primeiro arcebispo. A Igreja Anglicana Episcopal do Brasil é o nome jurídico
  de sua província brasileira.
