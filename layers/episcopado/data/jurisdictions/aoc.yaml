name: African Orthodox Church
type: national_church
country: US
founded:
  date: '1921'
  sources:
  - source: lwac-wp-aoc
    quote: >-
      The African Orthodox Church ( AOC ) was a predominantly African-American Christian denomination which was
      founded in the United States in 1918 by the joint collaboration of its first patriarch
  - source: lwac-wac-about
    quote: >-
      In 1997, AOC implemented the reform and changed its name to the Anglican African Orthodox Church (AAOC).
