description: >-
  Denominação fundada nos EUA por George Alexander McGuire (com ligação ao movimento de Marcus Garvey), que reivindicava
  sucessão episcopal siríaca de Antioquia via Joseph René Vilatte. Renomeada Anglican African Orthodox Church (1997),
  Anglican Church Worldwide (2002) e Worldwide Anglican Church (2017).
