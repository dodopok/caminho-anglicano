description: >-
  A Igreja Veterocatólica Missionária (IVCM), também chamada Igreja Católica Apostólica do Espírito Santo, foi organizada
  em 13 de abril de 2021 e registrada em Vila Velha (ES) pelo patriarca José Fernando de Faria; declara-se sob a
  jurisdição dos bispos da Igreja Católica Antiga da Europa (Utrecht), com sucessão originada no patriarca André
  Léon Zotique Barbeau, da Igreja Veterocatólica Canadense. Entre seus bispos estão Nildemar Andrade Santos, consagrado
  bispo diocesano de Ilhéus (BA) em março de 2022, e Rodrigo Soares de Almeida, acolhido em 14 de março de 2022
  como bispo diocesano da Missão Rio de Janeiro.
