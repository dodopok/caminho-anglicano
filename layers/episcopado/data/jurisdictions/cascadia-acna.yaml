id: cascadia-acna
acronym: Cascádia (ACNA)
name: Diocese de Cascádia (Igreja Anglicana na América do Norte)
type: diocese
country: US
description: >-
  Diocese da ACNA no leste do estado de Washington. Aprovou em 02/07/2010 o status de "Diocese Companheira" com
  a Diocese do Recife; suas comunidades constituíram antes o Arcediagado Norte-Americano da Diocese do Recife, sob
  supervisão episcopal de Robinson Cavalcanti.
sources:
