website: https://traditionalanglicanchurch.com/tag/brazil
description: >-
  Diocese continuante formada em 2018 por clérigos de Natal ligados à Diocese Anglicana de Votorantim, que elegeram
  o padre Albertino de Sousa Barreiros como bispo; foi instalada em 15 de julho de 2019, com sede na Paróquia da
  Natividade da Bem-Aventurada Virgem Maria. Fez parte da Igreja Anglicana de Confissão Continuante e, em 2025,
  foi recebida na Traditional Anglican Church no Sínodo Geral em Columbus (Geórgia, EUA).
