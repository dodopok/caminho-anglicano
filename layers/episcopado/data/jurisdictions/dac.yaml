id: dac
acronym: DAC
name: Diocese Anglicana Católica do Brasil
type: diocese
country: BR
founded:
  date: '2010'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      A Diocese Anglicana Católica do Brasil (também chamada DAC) é uma unidade eclesiástica ligada à Comunhão Anglicana
      Livre Internacional34 (The Free Internacional Anglican Communion).
    page: '101'
  - source: cant-novas-igrejas-2024
    quote: >-
      O estabelecimento da DAC se deu a partir da chamada Diocese Anglicana de Esmeraldas, organizada em 2010, em
      Minas Gerais.
    page: '101'
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2024, ocorreu a aprovação da bênção de casais homoafetivos, à semelhança do que aconteceu na IEAB.
    page: '102'
website: https://www.dacbrasil.com.br/
description: >-
  Jurisdição de âmbito nacional integrante da Comunhão Anglicana Livre Internacional, com Sé Primacial em Esmeraldas
  (MG), na Paróquia Santo Expedito e Nossa Senhora Desatadora dos Nós. Surgiu da Diocese Anglicana de Esmeraldas,
  organizada em 2010, e a fase anglicana foi consolidada em 2012 com o Sínodo da Bolívia, com mudança do nome para
  Diocese Anglicana Católica do Brasil. É conduzida pelo arcebispo e primaz Lucas Macieira da Silva, cuja sagração
  é apontada como origem do corpo eclesiástico. Os bispos prelados incluem João de Deus da Silva (Prelazia Sagrada
  Face), Daniel Araújo (Prelazia dos Pampas, desde 2022) e Antônio Santana Neto (bispo desde janeiro de 2024). Em
  2024 aprovou a bênção de casais homoafetivos.
