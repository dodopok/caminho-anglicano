id: dac
acronym: DAC
name: Diocese Anglicana Católica do Brasil
type: diocese
country: BR
founded:
  date: '2010'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      A Diocese Anglicana Católica do Brasil (também chamada DAC) é uma unidade eclesiástica ligada à Comunhão Anglicana
      Livre Internacional34 (The Free Internacional Anglican Communion).
    page: '101'
  - source: cant-novas-igrejas-2024
    quote: >-
      O estabelecimento da DAC se deu a partir da chamada Diocese Anglicana de Esmeraldas, organizada em 2010, em
      Minas Gerais.
    page: '101'
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 2024, ocorreu a aprovação da bênção de casais homoafetivos, à semelhança do que aconteceu na IEAB.
    page: '102'
website: https://www.dacbrasil.com.br/
description: >-
  Jurisdição de âmbito nacional ("DACB"), integrante da Anglican Free Communion International (Comunhão Anglicana
  Livre Internacional). Sé Primacial na Paróquia Santo Expedito e Nossa Senhora Desatadora dos Nós, em Esmeraldas
  (MG); governo episcopal sob o Arcebispo Primaz Lucas Macieira, com quatro prelazias: dos Pampas (RS), Jesus Salvador
  (SP), Sagrada Face (PR) e São Jorge Guerreiro (BA); mais região Nordeste (Barbalha, CE). Um estudo da própria
  diocese (fev. 2026) data a consolidação da fase anglicana em 2012, com um "Sínodo da Bolívia" da comunhão anglicana
  livre, e a mudança de nome para DAC; outras fontes colocam a Diocese de Esmeraldas em 2010.
