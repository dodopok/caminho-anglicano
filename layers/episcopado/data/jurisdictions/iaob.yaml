  - source: drv-ata-iaob-2014
    quote: após três anos de realização de celebrações Anglicanas regulares nos lares dos irmãos
dissolved:
  date: '2007-12-28'
  sources:
  - source: lpg-ieab-comunicado-2005
    quote: >-
      As referidas igrejas são: Igreja Episcopal Reformada do Brasil, Igreja Episcopal Carismática do Brasil, Igreja
      Episcopal Evangélica do Brasil, Igreja Episcopal do Evangelho Pleno, Igreja Anglicana Ortodoxa do Brasil
  - source: lpg-ieab-comunicado-2005
    quote: Porto Alegre, 15 de janeiro de 2005.
description: >-
  Jurisdição anglicana independente que, em 2006 e 2007, foi Distrito Missionário da Comunhão Anglicana Ortodoxa;
  seu primaz, Dom Hermany Soares, assinou em 2006 a Declaração da Boa Viagem, que criou o Movimento Anglicano por
  uma Causa Comum. Robinson Cavalcanti manteve reuniões com ele para uma fusão completa com a Diocese do Recife,
  formalizada em 28 de dezembro de 2007, quando a Igreja Anglicana Ortodoxa renunciou ao status de continuante e
  se filiou à diocese, com incardinação do clero e recepção do laicato; Soares renunciou então ao episcopado para
  exercer o presbiterado na diocese. Uma ata de 20 de abril de 2014 registra Adolfo Batista Teodoro Junior como
  bispo primaz da IAOB, e em 8 de setembro de 2023 o primaz Thomas Gordon reconheceu a igreja como membro da Comunhão
  Anglicana Ortodoxa.
sources:
