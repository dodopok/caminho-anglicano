  sources:
  - source: blog-josue-2006-11
    quote: Igreja Anglicana Ortodoxa – IAO (Comunhão Anglicana Ortodoxa)
  - source: lpq-deca-2007
    quote: Igreja Anglicana Ortodoxa do Brasil (IAOB) – Distrito Missionário Comunhão Anglicana Ortodoxa
  notes: Datas = período em que as fontes a mostram ativa.
