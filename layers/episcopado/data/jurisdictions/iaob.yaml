description: >-
  Distrito missionário brasileiro da Comunhão Anglicana Ortodoxa (Orthodox Anglican Communion), ativo em Pernambuco
  por volta de 2007, ao qual pertencia Hermany Soares. Segundo resumo de mecanismo de busca do verbete do wiki Cristianismo
  (Fandom), não aberto, seus membros passaram à Diocese do Recife – Cone Sul em 28/12/2007. ATENÇÃO: não confundir
  com a "Igreja Anglicana Ortodoxa no Brasil" surgida em 2013 em Corumbá de Goiás (bispos Dirceu Falcão Ibaldo e
  Adolfo Batista Teodoro Júnior).
