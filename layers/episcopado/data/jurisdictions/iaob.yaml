id: iaob
acronym: IAOB
name: Igreja Anglicana Ortodoxa do Brasil
aliases:
- Igreja Anglicana Ortodoxa no Brasil
type: other
country: BR
founded:
  date: '2014-04-20'
  sources:
  - source: drv-ata-iaob-2014
    quote: No ano da graça de nosso Senhor Jesus Cristo de dois mil e quatorze, aos vinte dias do mês de Abril
  - source: drv-ata-iaob-2014
    quote: após três anos de realização de celebrações Anglicanas regulares nos lares dos irmãos
dissolved:
  date: '2007-12-28'
  sources:
  - source: lpg-ieab-comunicado-2005
    quote: >-
      As referidas igrejas são: Igreja Episcopal Reformada do Brasil, Igreja Episcopal Carismática do Brasil, Igreja
      Episcopal Evangélica do Brasil, Igreja Episcopal do Evangelho Pleno, Igreja Anglicana Ortodoxa do Brasil
  - source: lpg-ieab-comunicado-2005
    quote: Porto Alegre, 15 de janeiro de 2005.
description: >-
  Pequena jurisdição anglicana independente ("Comunhão Anglicana Ortodoxa") cujo primaz, Dom Hermany, negociou fusão
  com a Diocese do Recife de Robinson Cavalcanti (data não informada, antes de 2012).
sources:
- source: ultimato-manifesto-2006
  quote: Igreja Anglicana Ortodoxa do Brasil (IAOB) – Distrito Missionário
- source: iaob-site-2015
  quote: >-
    Sua Excelência Dom Robinson Cavalcanti, está mantendo reuniões com nosso Primaz Dom Hermany no sentido de haver
    uma fusão completa entre a IGREJA ANGLICANA ORTODOXA DO BRASIL e a DIOCESE DO RECIFE.
relations:
- type: merged_with
  target: diocese-anglicana-recife
  date: null
  led_by:
  - hermany-soares
  - robinson-cavalcanti
  status: probable
  sources:
  - source: iaob-site-2015
    quote: >-
      no sentido de haver uma fusão completa entre a IGREJA ANGLICANA ORTODOXA DO BRASIL e a DIOCESE DO RECIFE
  notes: Fusão em negociação ("vai ser concretizado muito brevemente"); conclusão e data não confirmadas.
- type: merged_with
  target: iacs
  date: '2007-12-28'
  led_by:
  - hermany-soares
  - robinson-cavalcanti
  status: probable
  sources:
  - source: fandom-iaob
    quote: terem se transferido para a Diocese do Recife - Cone Sul, em 28/12/2007
  notes: >-
    Incorporação da IAOB à Diocese do Recife (então sob a Igreja Anglicana do Cone Sul). Antes disso, ambas integravam
    o movimento "Por uma Causa Comum" (2006).
- type: member_of
  target: comunhao-anglicana-ortodoxa-orthodox-anglican-communion
  date: '2006'
  end: '2007-12-28'
