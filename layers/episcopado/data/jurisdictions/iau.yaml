id: iau
acronym: IAU
name: Igreja Anglicana Unida – Província da América do Sul
type: province
country: BR
website: https://sites.google.com/view/igreja-anglicana-unida
description: >-
  Jurisdição anglicana de tradição episcopal que ordena mulheres e pessoas LGBTQIA+ em todos os níveis e é a Província
  Sul-Americana da Free Protestant Episcopal Church of England (FPEC), cujo arcebispo primaz é Ricardo Lorite de
  Lima. O bispo moderador, Virgílio Cezar Henrique Pereira Torres, é também bispo do Sínodo do Brasil e reitor da
  Comunidade da Reconciliação em Ribeirão Preto (SP). Josué Augusto é citado como bispo desde 2018.
sources:
- source: iau-historia
  quote: A Igreja Anglicana Unida (IAU) é uma jurisdição episcopal de tradição anglicana
- source: iau-faq
  quote: Ordenamos mulheres e LGBTQUIA+ em todos os níveis de nossos ministérios.
- source: ig-iau-2025-12-18
  quote: >-
    A Igreja Anglicana Unida (IAU) é a Província Sul-Americana da The Free Episcopal Protestant Church of England
    (FPEC). Com 128 anos de história contínua, cujo o líder éo Arcebispo Primaz, Revmo. Dom Ricardo Lorite de Lima.
    A IAU tem como Bispo moderador o Revmo. Dom Virgílio Cezar Henrique Pereira Torres.
- source: rtb-iau-alta-igreja
  quote: >-
    A “ Free Protestant Episcopal Church of England” – Comunhão a que a “Igreja Anglicana Unida – Província da América
    do Sul” está vinculada - surgiu exatamente para acolher os anglicanos que queriam e querem continuar “anglicanos
    clássicos”.
- source: lpq-iau-clero
  quote: >-
    Dom Virgilio Cezar Henrique Pereira Torres Bispo Moderador da IGREJA ANGLICANA UNIDA - PROVÍNCIA DA AMÉRICA
    DO SUL e Bispo do Sínodo do Brasil Reitor da Comunidade da Reconciliação em Ribeirão Preto - SP
