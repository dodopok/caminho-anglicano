    quote: Arcebispo Primus da The Free Episcopal Protestante Church in England - Worldwide Communion
  notes: >-
    O site da IAU lista o Primus da FPEC entre seus bispos; snippet de busca do artigo "Anglicanos da Alta igreja"
    do mesmo site diz: "A 'Free Protestant Episcopal Church of England' - Comunhão a que a 'Igreja Anglicana Unida
    - Província da América do Sul' está vinculada".
