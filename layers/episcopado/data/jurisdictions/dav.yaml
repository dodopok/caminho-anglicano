description: >-
  A Diocese Anglicana de Votorantim (SP), Santa Mãe de Deus, foi erigida em 9 de janeiro de 2015, após Theodoro
  A. C. de Oliveira deixar o catolicismo romano; ele foi sagrado seu primeiro bispo diocesano em 9 de fevereiro.
  Apresenta-se como parte do Movimento Anglicano Continuante, filiada à Província Anglicana Cristo Salvador. James
  Tavares de Melo o sucedeu, sagrado em 14/10/2018, ano em que clérigos de Natal deixaram a diocese e formaram a
  Diocese Anglicana do Natal.
