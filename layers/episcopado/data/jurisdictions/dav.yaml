id: dav
acronym: DAV
name: Diocese Anglicana Santa Mãe de Deus (Votorantim)
type: diocese
country: BR
founded:
  date: '2015-01-09'
  sources:
  - source: costa-2021-tese
    quote: >-
      Após deixar o Catolicismo Romano, a Diocese Anglicana foi erigida em 09 de janeiro de 2015 e, no mês seguinte,
      o sacerdote foi sagrado como o seu primeiro bispo diocesano.
  - source: costa-2021-tese
    quote: >-
      A nova denominação apresenta-se como parte do Movimento Anglicano Continuante, filiada à Província Anglicana
      Cristo Salvador.
description: >-
  Diocese continuante erigida em 9/1/2015, em Votorantim (SP), em torno do ex-padre greco-melquita Theodoro A. C.
  de Oliveira; filiada à 'Província Anglicana Cristo Salvador'; tem um distrito missionário no Chile. O sucessor,
  James Tavares, foi sagrado em 14/10/2018.
