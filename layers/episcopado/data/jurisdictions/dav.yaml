id: dav
acronym: DAV
name: Diocese Anglicana Santa Mãe de Deus (Votorantim)
type: diocese
country: BR
founded:
  date: '2015-01-09'
  sources:
  - source: costa2021
    quote: >-
      Após deixar o Catolicismo Romano, a Diocese Anglicana foi erigida em 09 de janeiro de 2015 e, no mês seguinte,
      o sacerdote foi sagrado como o seu primeiro bispo diocesano.
  - source: costa2021
    quote: >-
      A nova denominação apresenta-se como parte do Movimento Anglicano Continuante, filiada à Província Anglicana
      Cristo Salvador.
  - source: cant-novas-igrejas-2024
    quote: Após deixar o Catolicismo Romano, a Diocese Anglicana foi erigida em 09 de janeiro de 2015
    page: '76'
  - source: cant-novas-igrejas-2024
    quote: >-
      A Diocese Anglicana de Votorantim apresenta-se como parte do Movimento Anglicano Contínuo, embora não esteja
      canonicamente filiada alguma de suas jurisdições ou Igrejas.
    page: '78'
  - source: cant-novas-igrejas-2024
    quote: Diocese Anglicana de Votorantim [2015]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: Província Anglicana Cristo Salvador [2017]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 09 de fevereiro de 2015, Theodoro A. C. de Oliveira foi sagrado bispo da Diocese Anglicana de Votorantim.
      A cerimônia ocorreu na Catedral Anglicana Santa Mãe de Deus e contou com a presidência do bispo James Roque,
      e tendo como consagrantes o arcebispo colombiano Victor Manuel Cruz-Blanco e o bispo dom Rafael Ribeiro Campos,
      abade da Abadia Cisterciense S. Raphael.
    page: '154'
  - source: costa2021
    quote: Após deixar o Catolicismo Romano, a Diocese Anglicana foi erigida em 09 de janeiro de 2015
    page: '139'
description: >-
  Diocese continuante erigida em 9/1/2015, em Votorantim (SP), em torno do ex-padre greco-melquita Theodoro A. C.
  de Oliveira; filiada à 'Província Anglicana Cristo Salvador'; tem um distrito missionário no Chile. O sucessor,
  James Tavares, foi sagrado em 14/10/2018.
