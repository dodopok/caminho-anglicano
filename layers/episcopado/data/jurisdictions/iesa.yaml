description: >-
  Igreja fundada em 2019 por Gleydson Oliveira, então bispo da Igreja Episcopal do Brasil, ao romper com o bispo
  Rosimael Losasi, mantendo as características da denominação anterior; concentrada em Caruaru (PE). Em 2020 foi
  lançado o projeto de um Templo Nacional em Camaragibe, e em junho de 2022 o templo já estava sem atividades; consta
  como extinta em 2022.
