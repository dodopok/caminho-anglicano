description: >-
  Igreja fundada em 2019 por Gleidson (Gleydson) Oliveira ao romper com Rosimael Losasi, mantendo as características
  da Igreja Episcopal do Brasil; 'anglo-católica', concentrada em Caruaru (PE), com sede na Paróquia da Redenção
  (inaugurada em 03/08/2020). Projeto de Templo Nacional em Camaragibe (2020) não realizado. Em junho de 2022 o
  templo estava sem atividades (Apêndice 1: [2019], extinta em 2022).
