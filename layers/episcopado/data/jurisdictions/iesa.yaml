description: >-
  A Igreja Episcopal Sul-Americana foi fundada em 2019 por Gleydson Oliveira, então bispo da Igreja Episcopal do
  Brasil, ao romper com o bispo Rosimael Losasi, fundador daquela igreja; manteve as características da denominação
  anterior e se concentrava em Caruaru (PE), onde a Paróquia da Redenção foi inaugurada em 3 de agosto de 2020 e
  se tornou a sede. Em 2020 foi lançado o projeto de um Templo Nacional em Camaragibe e, em junho de 2022, a fachada
  do templo já aparecia sem atividades; consta como extinta em 2022.
