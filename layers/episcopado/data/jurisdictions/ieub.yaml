locator_slug: ieub
website: https://www.instagram.com/episcopal.unidabr/
description: >-
  Igreja de tradição reformada e anglicana surgida em 2023, quando clérigos da IAB, discordando de posturas da denominação
  e do primaz Miguel Uchôa, romperam com ela; foi fundada por Hermany Soares, hoje bispo diocesano. Organiza-se
  como Diocese do Brasil, com arcediagados do Nordeste e do Sudeste e comunidades em Recife, Jaboatão dos Guararapes,
  Paulista, Mogi das Cruzes e Crato. Tem livro de oração próprio (2024) e permite a ordenação de mulheres ao diaconato
  e ao presbiterato.
