description: >-
  Igreja sediada em Goiânia (GO), mantida juridicamente pela "Mitra Primacial Católica Anglicana" (CNPJ 29.104.811/0001-14,
  atividade iniciada em 31/10/2017, tendo Orvandil Moreira Barbosa como presidente). Autodefine-se "de rito, tradição
  e episcopado histórico católicos-anglicanos", sem subordinação ao arcebispo de Cantuária, com ênfase na teologia
  da libertação. Dioceses declaradas: Centro Oeste, Baixo Tocantins (PA), Belém, São Paulo e Sudoeste, Santa Cruz
  de Salvador (BA) e Mato Grosso do Sul (extinta em 2018). A situação cadastral do CNPJ consta como inapta desde
  30/05/2019 (omissão de declarações). O site não é atualizado desde 2020.
