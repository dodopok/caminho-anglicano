description: >-
  Igreja mantida juridicamente pela Mitra Primacial Católica Anglicana, com sede cadastral em Goiânia, início de
  atividades em 31 de outubro de 2017 e situação cadastral inapta desde 30 de maio de 2019 por omissão de declarações,
  fundada por um grupo egresso da IATB liderado por Ricardo Vicente dos Anjos e Orvandil Moreira Barbosa. Descreve-se
  como igreja de rito, tradição e episcopado histórico católicos-anglicanos, com ênfase católica. Orvandil é arcebispo
  primaz e bispo da Diocese Católica Anglicana do Centro Oeste; há ainda as dioceses do Baixo Tocantins (Franciney
  Rodrigues Pantoja) e de São Paulo e Sudoeste (Izaias Rodrigues dos Santos), enquanto Belém e Santa Cruz de Salvador,
  Bahia e Nordeste constam vacantes sob responsabilidade do primaz; a Diocese de Mato Grosso do Sul foi extinta
  e reintegrada ao Centro Oeste. Em 24 de maio de 2018, notificação declarou que Altamiro Pereira do Amaral, Jorge
  dos Santos Costa e Ricardo Vicente dos Anjos não integravam mais a Mitra Primacial; eles formaram a ICA-Brasil,
  em cisma.
