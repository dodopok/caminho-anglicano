website: https://catolicaanglicana.wordpress.com/
description: >-
  Igreja mantida juridicamente pela Mitra Primacial Católica Anglicana, com início de atividades em 31 de outubro
  de 2017 e situação cadastral inapta, fundada por um grupo egresso da IATB liderado por Ricardo Vicente dos Anjos
  e Orvandil Moreira Barbosa. Orvandil é arcebispo primaz e bispo da Diocese Católica Anglicana do Centro Oeste;
  há ainda as dioceses do Baixo Tocantins (Franciney Rodrigues Pantoja) e de São Paulo e Sudoeste (Izaias). Em 24
  de maio de 2018, notificação declarou que Altamiro Pereira do Amaral, Jorge dos Santos Costa e Ricardo Vicente
  dos Anjos não integravam mais a Mitra Primacial; eles formaram a ICA-Brasil, em cisma.
