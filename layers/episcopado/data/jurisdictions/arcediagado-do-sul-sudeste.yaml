id: arcediagado-do-sul-sudeste
acronym: Arcediagado do Sul/Sudeste
name: Arcediagado Sul/Sudeste (Arcediagado Extraterritorial Nacional)
type: diocese
country: BR
founded:
  date: '2009'
  sources:
  - source: dard2-us-iv
    quote: >-
      Estou orando pela Assembleia do Arcediagado Sul/Sudeste, que está acontecendo em Bandeirantes, Paraná, até
      dia 13 próximo
  - source: dard2-us-viii
    quote: especialmente quando noticiei a criação de um Arcediagado Sul-Sudeste
