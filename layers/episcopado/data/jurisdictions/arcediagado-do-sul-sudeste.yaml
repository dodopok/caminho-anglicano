description: >-
  Arcediagado da Diocese do Recife para as comunidades fora do Nordeste (MG, RJ, SP, RS), chamado em 2009-2010 de
  Arcediagado Extraterritorial Nacional Sul/Sudeste e em 2012 de Arcediagado Sul-Sudeste, com Carlos Alberto Chaves
  Fernandes como arcediago e Ivo Xavier de Oliveira como adjunto. Já havia assembleia do arcediagado em junho de
  2009, e em 22/06/2009 Robinson Cavalcanti noticiou ao plenário da ACNA a criação do Arcediagado Sul-Sudeste.
