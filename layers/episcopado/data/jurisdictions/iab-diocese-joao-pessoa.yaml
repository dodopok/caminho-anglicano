type: diocese
tradition: anglican
country: BR
founded:
  date: '2018-04-27'
  sources:
  - source: djp-sobre-nos
    quote: >-
      A Diocese de João Pessoa é fruto da multiplicação da Diocese de Recife. No dia 27 de abril de 2018, na época
      com apenas dezenove igrejas, vinte e cinco clérigos
  - source: djp-sobre-nos
    quote: >-
      na Paraíba, que se expandiu para o Rio Grande do Norte, Ceará e, hoje, com as igrejas na região sudeste, já
      somos mais de 30 igrejas que compõem a Diocese de João Pessoa
  - source: djp-home-2026
    quote: Rua André Dias, S/N – Aeroclube Bessa – João Pessoa PB
  discrepancies:
