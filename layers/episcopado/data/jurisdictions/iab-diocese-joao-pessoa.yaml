description: >-
  Diocese da IAB fundada em 27 de abril de 2018 por multiplicação da Diocese de Recife, então com dezenove igrejas
  e vinte e cinco clérigos, e hoje com mais de 30 igrejas na Paraíba, no Rio Grande do Norte, no Ceará e no Sudeste.
  Márcio Meira é bispo diocesano desde a fundação e pastor da Catedral Anglicana Comunhão; em 2023 foram eleitos
  bispos auxiliares Miguel Neto, que coordena igrejas do sertão da Paraíba ao Ceará, e Eric Rodrigues (2023-2024),
  responsável pela Região Sudeste. Em 2026 a Diocese Anglicana Família aparece como sucessora.
