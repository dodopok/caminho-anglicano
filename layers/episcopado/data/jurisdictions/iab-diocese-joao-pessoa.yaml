website: https://djpanglicananobrasil.com/
description: >-
  Diocese desmembrada da Diocese de Recife em 27/04/2018, com sé na Catedral Anglicana Comunhão (Bessa, João Pessoa-PB);
  bispo diocesano Márcio Meira. Abrangia PB, RN, CE e igrejas no Sudeste. Em 2026 passou a ser chamada, nas redes
  oficiais, "Diocese Anglicana Família" (ver IAB-Familia); o site djpanglicananobrasil.com ainda usava "Diocese
  de João Pessoa" em out/2026.
