# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: iach
acronym: IACH
name: Igreja Anglicana do Chile
type: national_church
country: CL
founded:
  date: '2018'
  sources:
  - source: fund-wp-en-chile
    quote: Formed in 2018, the province is the 40th in the Anglican Communion.
description: >-
  Província criada em 4 de novembro de 2018, com a inauguração das quatro dioceses chilenas, e que tem presença
  no Conselho de Primazes do GAFCON. Héctor (Tito) Zavala foi seu primeiro primaz, até se aposentar em 12 de janeiro
  de 2025, quando Enrique Lago Zugadi, eleito em 2018 bispo diocesano de Concepción (Diocese do Sul do Chile), o
  sucedeu; Lago integra o Global Anglican Council desde março de 2026.
sources:
- source: gacl-wp-zavala
  quote: >-
    On 4 November 2018 the four Chilean dioceses were inaugurated as a new province of the Anglican Communion, named
    the Anglican Church of Chile. Zavala was commissioned by Archbishop Justin Welby
- source: fund-wp-en-chile
  quote: Formed in 2018, the province is the 40th in the Anglican Communion.
- source: gacl-sydney-2025-chile
  quote: >-
    The occasion was the retirement of Héctor (Tito) Zavala as Primate of Chile, the consecration of Juan Esteban
    Saravia as Bishop of Santiago, and the installation of Bishop Enrique Lago as Primate of Chile.
- source: gace-gac-page
  quote: >-
    In 2018 he was elected as the future diocesan bishop of Concepción (later called the Diocese of the South of
    Chile).
- source: gace-gac-page
  quote: >-
    In January 2025, Archbishop Enrique succeeded Tito Zavala as the second archbishop of the Anglican Church of
    Chile.
- source: gacm-tlc-2025-10-17-analysis
  quote: >-
    Three of the nine other churches represented on GAFCON’s Primates’ Council are not recognized by the Anglican
    Communion Office and have largely been formed under GAFCON’s auspices (the Anglican Church of Brazil, the Reformed
    Evangelical Anglican Church of South Africa, and the Anglican Church in North America). But such a total severing
    of connections with Canterbury and the Instruments of Communion would be a new development for the six other
    provinces represented on the council (Alexandria, Chile, Congo, Kenya, Myanmar, and South Sudan).
- source: gace-gac-page
  quote: Archbishop of the Anglican Church of Chile
relations:
- type: member_of
  target: gac
  date: '2026-03-05'
  led_by:
  - enrique-lago-zugadi
  status: confirmed
  sources:
  - source: gace-gac-page
    quote: Archbishop of the Anglican Church of Chile
  - source: gafcon-2026-01-02-sa
    quote: Gafcon-aligned churches include the Anglican Church in Brazil and the Anglican Church of Chile
  - source: gace-ai-council-list
    quote: The Most Rev. Enrique Lago, Archbishop of Chile
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      The council’s primates are Archbishops Laurent Mbanda of Rwanda (Chair), Miguel Uchoa of the Anglican Church
      of Brazil (Vice Chair), Henry Ndukuba of Nigeria, Stephen Kaziimba of Uganda, Enrique Lago of Chile, Presiding
      Bishop Siegfried Ngubane of the Reformed Evangelical Anglican Church of South Africa, and Bishop Julian Dobbs,
      acting primate of the Anglican Church in North America.
  - source: gacm-otherc-2026-03-28-list
    quote: >-
      Archbishop Enrique Lago was not present at the Abuja gathering. After receiving the Council’s decisions and
      affirming both the Jerusalem Declaration and the requirement of principled disengagement, he was welcomed
      into the Council’s leadership after G26 occurred.
  notes: >-
    O arcebispo do Chile figura entre os "Primates" do Global Anglican Council na página institucional (atualizada
    em 31/03/2026). Não foi encontrada decisão sinodal da Igreja Anglicana do Chile sobre a GAC nem sobre sair da
    Comunhão Anglicana de Cantuária. Província cujo primaz integra o Global Anglican Council eleito em Abuja (G26,
    3–6/03/2026), o que exige "desengajamento por princípio" dos Instrumentos da Comunhão de Cantuária. Lago não
    esteve em Abuja (participou da reunião do conselho por Zoom, segundo Donison) e foi acolhido no Conselho depois
    do G26, ao afirmar a Declaração de Jerusalém e o desengajamento. Um delegado chileno (Carlos Romero) ainda participou
    da ACC-19 em Belfast (jun–jul/2026).
- type: member_of
  target: gafcon
  date: null
  led_by:
  - enrique-lago-zugadi
  status: confirmed
  sources:
