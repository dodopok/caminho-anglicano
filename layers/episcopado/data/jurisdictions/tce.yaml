id: tce
acronym: TCE
name: Traditional Church of England
type: communion
country: GB
description: >-
  Jurisdição anglicana continuante inglesa (metropolita Michael Newman, bispo de Windlesham em 2007) com a qual
  a IATB declarou comunhão plena em 2007. Distinta da Church of England e da Traditional Anglican Church (TAC).
sources:
- source: lia-iatb-comunhao-2008
  quote: >-
    A Província Anglicana Tradicional do Brasil (Igreja Anglicana Tradicional do Brasil) está em comunhão com a
    Traditional Church of England (TCE)
