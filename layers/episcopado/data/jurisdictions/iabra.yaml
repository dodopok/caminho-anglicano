description: >-
  Igreja anglicana independente fundada por volta de 2005 pelo bispo Alexandre Macedo Maia, arcebispo primaz, organizada
  em uma única diocese, a Diocese Agostinho de Cantuária. Em 30 de setembro de 2006 subscreveu a Declaração da Boa
  Viagem, que criou o Movimento Anglicano Por Uma Causa Comum; a data de extinção não foi encontrada.
