id: cbp-pe
acronym: CBP-PE
name: Capelania Britânica de Pernambuco (Holy Trinity Church, Recife)
aliases:
- Capelania Britânica de Pernambuco
type: other
country: BR
founded:
  date: '1822'
  sources:
  - source: drv-resgatando-i
    quote: >-
      A Capelania Britânica de Pernambuco teve início no ano da nossa Independência, 1822, tendo como seu primeiro
      titular o Rev. John Penny
  - source: drv-resgatando-i
    quote: Em 20 de maio de 1976 encerra-se, definitivamente, o Ciclo da Capelania Britânica
dissolved:
  date: '1976-05-20'
  sources:
  - source: drv-resgatando-i
    quote: >-
      Em 20 de maio de 1976 encerra-se, definitivamente, o Ciclo da Capelania Britânica, com a criação, pelo Sínodo
      Geral da agora Igreja Episcopal do Brasil, da Diocese Setentrional, com sede no Recife, desmembrada da Diocese
      Central
description: >-
  Capelania anglicana inglesa do Recife (Holy Trinity Church), iniciada em 1822 com o Rev. John Penny como primeiro
  titular; uma assembleia paroquial decidiu filiá-la à Igreja Episcopal do Brasil. Seu ciclo encerrou-se em 20 de
  maio de 1976, com a criação da Diocese Setentrional, com sede no Recife, desmembrada da Diocese Central.
