  sources:
  - source: darl3-hist1
    quote: >-
      Uma assembléia paroquial da Capelania do Recife, Holy Trinity Church, decidiu por essa filiação, enviando
      como delegada ao Concílio da Diocese do Brasil Central a Sra. Conti
  notes: >-
    Década de 1960: por decisão de assembleia paroquial a Capelania do Recife (Holy Trinity Church) filiou-se à
    Diocese do Brasil Central da Igreja Episcopal Brasileira, no processo conduzido pelo bispo Edmund Knox Sherrill;
    a IEB assumiu o compromisso de atender os súditos britânicos. Cultos em inglês continuaram até o início da década
    de 1990.
