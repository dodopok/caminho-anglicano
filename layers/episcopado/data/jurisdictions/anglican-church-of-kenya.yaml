      of Rwanda Episcopal Church of South Sudan Church of Bangladesh Church of Nigeria Anglican Church of the Congo
      Province of the Indian Ocean Anglican Church of Kenya Anglican Church of Chile Church of the Province of South
      East Asia Church of Uganda Episcopal Church of Sudan Episcopal/Anglican Province of Alexandria Church of the
      Province of Myanmar Gafcon Jurisdictions Anglican Church of North America REACH-SA Anglican Church of Brazil
  notes: >-
    Província representada no Conselho de Primazes do GAFCON em out/2025 (pertença ao movimento GAFCON, anterior
    e distinta da adesão à GAC). A data de início da pertença não consta das fontes.
- type: member_of
  target: gac
  date: 2026-03
  led_by:
  - jackson-ole-sapit
  status: probable
  sources:
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      Important omissions from the council’s list were six former Gafcon primates who did not participate in the
      Abuja meetings. They are archbishops Samy Shehata of Alexandria, Titre Ande of Congo, Jackson Ole Sapit of
      Kenya, Justin Badi Arama of South Sudan, and Ezekiel Kondo of Sudan, as well as Archbishop James Wong, the
      retired primate of the Indian Ocean.
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      Because their churches have publicly affirmed the Jerusalem Declaration, they remain part of the Global Anglican
      Communion.
  notes: >-
    Segundo o secretário-geral Paul Donison (mar/2026), a província continua participante da Global Anglican Communion
    por ter afirmado publicamente a Declaração de Jerusalém, mas o primaz não foi a Abuja e não integra o Global
    Anglican Council (que exige desengajamento dos Instrumentos de Cantuária); foi convidado a integrá-lo. Não se
    localizou decisão própria da província aderindo à GAC.
