- anglican-church-of-kenya
type: province
tradition: anglican
country: KE
founded:
  date: '1970'
  sources:
  - source: fund-wp-en-ack
    quote: >-
      The province was divided into two, with Festo Olang' being the first African archbishop of the new province
      of Kenya in 1970.
website: https://www.ackenya.org/
description: >-
  Província criada em 1970 pela divisão em duas da província anterior, com Festo Olang' como primeiro arcebispo.
  Manasses Kuria foi arcebispo de 1980 a 1994, e Benjamin Nzimbi foi o primeiro bispo da nova Diocese de Machakos,
  a partir de 1985. Está representada no Conselho de Primazes do GAFCON.
sources:
- source: fund-wp-en-ack
  quote: >-
    The province was divided into two, with Festo Olang' being the first African archbishop of the new province
    of Kenya in 1970.
- source: wp-en-kuria
  quote: '| term             = 1980&ndash;1994'
- source: ky-house-2004
  quote: Bishop Nzimbi was first ordained in 1985 as Bishop of Machakos, before moving to Kitue;
- source: wp-nzimbi
  quote: >-
    Nzimbi was elected as the first bishop of the new Diocese of Machakos, which he served from 1985 to 1995.
- source: gacm-tlc-2025-10-17-analysis
  quote: >-
    Three of the nine other churches represented on GAFCON’s Primates’ Council are not recognized by the Anglican
    Communion Office and have largely been formed under GAFCON’s auspices (the Anglican Church of Brazil, the Reformed
    Evangelical Anglican Church of South Africa, and the Anglican Church in North America). But such a total severing
    of connections with Canterbury and the Instruments of Communion would be a new development for the six other
    provinces represented on the council (Alexandria, Chile, Congo, Kenya, Myanmar, and South Sudan).
relations:
