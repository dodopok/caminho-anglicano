id: ieab-diocese-recife
name: Diocese Anglicana do Recife (IEAB)
aliases:
- Diocese Anglicana do Recife
- Diocese do Recife
type: diocese
tradition: anglican
country: BR
relations:
- type: part_of
  target: ieab
  status: confirmed
  sources:
  - source: ieabrecife-clero-2002
    quote: Miguel Â. de A Uchôa Cavalcanti (29.12)
  - source: ieabrecife-franco
    quote: Juntamente com o Rev. Miguel Uchoa, formalizamos essa indicação no processo Sucessório
  - source: wp-en-uchoa
    quote: >-
      Uchôa joined two-thirds of the clergy and roughly 95 percent of the laity in disaffiliating from the IEAB
  - source: iab-primaz
    quote: É fundador da PAES (Paróquia Anglicana Espírito Santo) em 1996
  - source: ieabrecife-clero-2002
    quote: Márcio Medeiros Meira, OSE (28/03)
  - source: ieabrecife-clero-2002
