  - source: ieabrecife-clero-2002
    quote: Leonides de Menezes Ferreira (06.09)
  - source: ptwp-dar
    quote: >-
      liderados pelo reverendo Leônides Menezes, decidiram por assembleia se separar da Igreja Episcopal Anglicana
      do Brasil
  - source: queiroz-2004-ufpe
    quote: >-
      desde março do mesmo ano, o bispo Edmund Sherrill havia enviado para Recife o Rev. Paulo Garcia com a finalidade
      de incrementar o crescimento da igreja naquela região.
  - source: queiroz-2004-ufpe
    quote: >-
      setembro de 2002, o Pr. Paulo Garcia declarou, oficialmente, a sua ruptura da Igreja Episcopal Anglicana.
  - source: queiroz-2004-ufpe
    quote: >-
      Ao se desvincular da Catedral Anglicana do Espinheiro, o Pr. Miguel e mais um grupo de 30 a 40 pessoas, com
      o apoio do Pr. Paulo Garcia, fundaram, em agosto de 1996, a Paróquia Anglicana do Espírito Santo, em Jaboatão
      dos Guararapes
  - source: queiroz-2004-ufpe
    quote: De lá pra cá, eu sou o reitor dessa paróquia
  - source: dar-2023-peixoto10
    quote: >-
      nos alegramos com toda a Igreja pelos 10 anos de episcopado do Bispo João Câncio Peixoto Filho, à frente da
      Diocese Anglicana do Recife.
  - source: dar-2023-oldair-presb
    quote: O Revdo. Oldair Pena foi instituído como novo Pároco da Paróquia da Virgem Maria.
  - source: dar-2023-martorelli
    quote: >-
      Após a Eucaristia, o Bispo instalou o Rev. Martorelli Dantas como novo pároco da Paróquia Anglicana da Santíssima
      Trindade
  - source: dab-2017-izaias
    quote: O reverendo é oriundo da Diocese Anglicana do Recife
  - source: dar-2026-osiel
    quote: que passa oficialmente a ser parte do clero ordenado da Diocese Anglicana do Recife.
  - source: dar-2026-madalena
    quote: em março de 2026, o diácono Anderson Soares tornou-se ministro encarregado.
  - source: dar-2026-gilson
    quote: >-
      é presbítero da Diocese Anglicana do Recife e deão da Catedral Anglicana do Bom Samaritano, ministério que
      exerce de forma voluntária e vocacional há mais de duas décadas.
  - source: dar-2026-gilson
    quote: Essa busca o conduziu ao Recife em 1999, ano decisivo em sua vida.
  - source: dar-2026-gilson
    quote: Entre 2002 e 2008, Gustavo foi reitor do SAET
  - source: dar-2020-barbetta-diac
    quote: >-
      receberá Alfredo Barbetta, Diácono da Igreja Episcopal Anglicana. Ele é coordenador da Missão Episcopal Anglicana
      Amor Fraterno, em São Luís.
  - source: alc-2005-03-06
    quote: Bishop Oliveira Neto, recognized by the hierarchy as the head of Recife
  - source: ciceb-betania-historia
    quote: >-
      Por decisão do então Pastor e Reitor da Catedral, Rev. Paulo Garcia, em acordo com o bispo diocesano Dom Clóvis
      Erly, a Missão Betânia foi instalada em 11/07/1996, na Av. Caxangá 1107, no bairro do Cordeiro, sob a liderança
      do Ministro Auxiliar Leonides de Menezes.
  - source: ciceb-betania-historia
    quote: >-
      Em 8 de julho de 2002, a então Paróquia Betânia, da Igreja Episcopal Anglicana do Brasil, decidiu, em assembleia,
      desligar-se da Igreja Anglicana, passando a ser chamada Igreja Evangélica Betânia.
  - source: ciceb-betania-historia
    quote: >-
      Por decisão do então Pastor e Reitor da Catedral, Rev. Paulo Garcia, em acordo com o bispo diocesano Dom Clóvis
      Erly
