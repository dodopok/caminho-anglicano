description: >-
  Em 1534 a Igreja da Inglaterra renunciou à autoridade do papado, sob Henrique VIII, dando início à Reforma inglesa.
  Entre seus arcebispos de Cantuária estão Thomas Cranmer (1533-1556), Matthew Parker (desde 17/12/1559, até 1575),
  Edmund Grindal (arcebispo de York em 1570 e de Cantuária de 1576 a 1583), John Whitgift (1583-1604), Richard Bancroft
  (1604-1610), George Abbot (1611-1633) e William Laud (1633-1645), que foi antes bispo de St David's, Bath and
  Wells e Londres. William Barlow foi bispo de St David's, Bath and Wells e Chichester, e John Hodgkins, bispo sufragâneo
  de Bedford (1537-1560). Gilbert Sheldon ocupou Cantuária de 1663 a 1677, e William Sancroft a partir de 1678,
  até ser deposto em 1690. No século XVIII, foram arcebispos de Cantuária John Potter (1737-1747), Thomas Herring
  (1747-1757), Frederick Cornwallis (1768-1783) e John Moore (1783-1805); em York, Robert Hay Drummond (1761-1776),
  William Markham (1777-1807) e Edward Venables-Vernon-Harcourt (1808-1847). No século XIX, Cantuária teve John
  Bird Sumner (1848-1862), Charles Thomas Longley (1862-1868), Archibald Campbell Tait (1868-1882) e, desde 1896,
  Frederick Temple. A Christ Church Rio serve desde 1819 como capelania inglesa no Rio de Janeiro; em 21/12/1869
  Waite Hockin Stirling foi consagrado bispo das Ilhas Falkland. Cosmo Gordon Lang foi nomeado bispo sufragâneo
  de Stepney em 1901 e Geoffrey Francis Fisher assumiu como bispo de Chester em 1932.
