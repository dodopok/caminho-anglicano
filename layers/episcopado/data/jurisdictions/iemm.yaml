description: >-
  A Igreja Episcopal Monte Moriá tem origem em um grupo familiar iniciado em 16 de novembro de 2006 por Alexsandro
  Benjamim Silva e Ana Janaina Tavares, em Aldeia (Camaragibe, PE); foi estabelecida em 11 de maio de 2007 e esteve
  vinculada à Igreja Episcopal Carismática do Brasil, como paróquia, até 2021. No início de 2021, por divergências
  com a liderança da IECB, entre elas a ordenação de mulheres, Alexsandro rompeu com a Comunhão Episcopal Internacional
  e foi renomeado bispo da comunidade, sem nunca ter sido sagrado ao episcopado. Após o rompimento, a igreja ficou
  conhecida entre seus membros como Catedral Episcopal de Aldeia.
