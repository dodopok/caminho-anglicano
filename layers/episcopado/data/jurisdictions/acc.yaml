description: >-
  Corpo anglicano continuante fundado em 1977. Louis Wahl Falk III foi eleito arcebispo em 1983, e Mark David Haverland
  é o atual arcebispo. A Diocese de Nova Granada (Colômbia), liderada por Germán Orrego-Hurtado, integra a ACC e
  abrange também o Brasil, onde instituiu a Paróquia Anglicana Cristo Rei, em Anápolis (GO); Victor Manuel Cruz-Blanco
  foi seu bispo diocesano de 1994 a 2003. Em 1997 uma disputa de sucessão entre bispos levou à formação da HCCAR,
  e outras igrejas continuantes surgiram do grupo ligado à diocese colombiana.
