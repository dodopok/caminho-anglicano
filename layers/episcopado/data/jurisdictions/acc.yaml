description: >-
  Principal corpo continuante saído do Congresso de St. Louis (1977). No Brasil, aparece apenas via Diocese de Nova
  Granada (sede em Pereira, Colômbia; bispo Germán Orrego-Hurtado), cuja área declarada inclui o Brasil; o site
  da diocese lista uma 'Paróquia Bom Pastor ACC' em Itapuranga-GO (Rev. Pe. Fernando Carlos da Silva). Costa (2021)
  cita a Paróquia Anglicana Cristo Rei, em Anápolis-GO, instituída por Orrego.
