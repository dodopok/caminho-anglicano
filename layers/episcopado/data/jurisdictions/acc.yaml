description: >-
  Corpo anglicano continuante surgido do Congresso de St. Louis, de 1977; Louis Wahl Falk III foi eleito arcebispo
  em 1983 e Mark David Haverland é o atual arcebispo. Sua Diocese de Nova Granada, com sede na Colômbia e abrangendo
  também Venezuela, Chile e Brasil, é liderada por Germán Orrego-Hurtado e instituiu no Brasil a Paróquia Anglicana
  Cristo Rei, em Anápolis (GO); Victor Manuel Cruz-Blanco foi seu bispo diocesano de 1994 a 2003. Uma disputa de
  sucessão entre os bispos em 1997 levou à formação da Holy Catholic Church Anglican Rite, a que Cruz-Blanco aderiu
  em 2004, e do grupo ligado à diocese colombiana surgiram outras igrejas continuantes, como a Província Anglo-Católica
  da Santíssima Trindade.
