  notes: >-
    O livro (publicado em 2025) lista a Estação Casa (Belo Horizonte-MG) entre as igrejas que formavam a REB. A
    REB publicou fotos e relatos da igreja entre jul/2025 e abr/2026. A página "Nossas igrejas" da REB, em out/2026,
    já não a lista e, em seu lugar, aparece a Igreja Anglicana Caminho (BH). Entrou na REB por volta de 23/12/2024,
    depois da fundação da rede; saiu em 27/06/2026 e seguiu independente.
