description: >-
  Comunidade anglicana em Belo Horizonte (MG), na Rua Aarão Reis, 496, 2º andar, Centro, pastoreada por Jaime e
  Priscila Sepulcro. Nasceu como a Comunidade Anglicana Âncora em Belo Horizonte (blog "Âncora BH", com página datada
  de jun/2017), fruto da expansão da Comunidade/Paróquia Anglicana Âncora de Vitória (ES, Rev. Eric Rodrigues),
  dentro da Igreja Anglicana no Brasil (IAB). A própria igreja conta que "há 9 anos, dia 11 de junho" foi plantada
  a missão (ou seja, 11/06/2017). Aparece como "Âncora Belo Horizonte" nas listas da Diocese de João Pessoa da IAB
  até mai/2021 e como "Estação Casa" desde set/2021. Integrou a Rede Episcopal Brasileira (REB) de dez/2024 a jun/2026
  e hoje se apresenta como igreja autônoma. Perfis: Instagram @estacao.casa; canal YouTube @EstacaoCasa; Facebook
  estacaocasabh; podcast no Spotify. Endereços anteriores: Rua Lagoa da Prata, 358, Salgado Filho (2019). Perfil
  @estacao.casa no Instagram: 2.262 seguidores e 1.130 publicações em out/2026.
