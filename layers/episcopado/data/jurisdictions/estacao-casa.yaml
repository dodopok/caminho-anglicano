website: https://www.youtube.com/@EstacaoCasa
description: >-
  Missão anglicana plantada em Belo Horizonte em 11 de junho de 2017, pastoreada por Jaime e Priscila Sepulcro,
  que integrou a Igreja Anglicana no Brasil (IAB) até dezembro de 2024. Passou então à Rede Episcopal Brasileira
  (REB), da qual saiu em 27 de junho de 2026.
