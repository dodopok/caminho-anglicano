id: pbca
acronym: PBCA
name: Província Brasileira de Confissão Anglicana
type: province
country: BR
website: https://provinciabrasileiraanglicana.blogspot.com/
description: >-
  Província anglicana independente ('continuante', sem vínculo com Cantuária) que se declara parte da Igreja Episcopal
  do Evangelho Pleno (IEEP), da Comunhão Episcopal Protestante do Brasil (CEPB) e da Ordem Anglicana Filhos da Promessa
  (OAFIP). Seu clero listado inclui Elias Batista Nogueira (presidente provincial) e Eliane Helena Nogueira.
sources:
- source: lac-pbca-anglicanismo
  quote: >-
    A Província Brasileira de Confissão Anglicana é parte da Igreja Episcopal do Evangelho Pleno - IEEP , Comunhão
    Episcopal Protestante do Brasil (CEPB ) e da Ordem Anglicana Filhos da Promessa (OAFIP),
- source: lac-pbca-clero
  quote: Revmo Bispo Elias Batista Nogueira, OAFIP (Presidente Provincial)
relations:
- type: part_of
  target: ieep
  date: null
  led_by:
  - elias-batista-nogueira
  status: probable
  sources:
  - source: lac-pbca-anglicanismo
    quote: >-
      A Província Brasileira de Confissão Anglicana é parte da Igreja Episcopal do Evangelho Pleno - IEEP , Comunhão
      Episcopal Protestante do Brasil (CEPB ) e da Ordem Anglicana Filhos da Promessa (OAFIP),
  notes: >-
    Autodescrição da própria província; também se declara 'continuante, isto é, independente e sem vínculos com
    a Sé de Cantuária'.
