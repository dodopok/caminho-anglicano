description: >-
  Igreja independente surgida em 1997 como ministério evangélico em Taboão da Serra (SP), sob a liderança de Josué
  Sousa Torres, que a fundou e é seu bispo primaz. Dela fazem parte a OAFIP, ordem fundada por Elias Batista Nogueira
  em 22 de agosto de 2012, e a Província Brasileira de Confissão Anglicana. Aderiu ao Movimento Anglicano Por Uma
  Causa Comum e mantém comunhão plena com a IAOB.
