description: >-
  Igreja anglicana independente originada em dom Josué Augusto, seu bispo primaz; em 27/11/2017 a comunidade se
  reunia no Augustus Plaza Hotel, em São José do Rio Preto (SP). Por falta de registros, o autor conclui que deixou
  de existir (Apêndice 1: [2017], extinta em 2017). Não confundir com a IAU (Igreja Anglicana Unida – Província
  da América do Sul).
