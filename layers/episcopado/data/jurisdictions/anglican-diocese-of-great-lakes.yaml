- Diocese Anglicana dos Grandes Lagos
type: diocese
description: >-
  Diocese da ACNA cujo primeiro bispo, Roger Ames, foi empossado em 30/04/2011; Peter Beckwith é bispo a partir
  de 2014.
sources:
- source: wp-ames
  quote: >-
    with Ames being installed as their first bishop at 30 April 2011, at the diocese annual convention in Akron.
    He would be in office until 2016
- source: iab-poster-linhagem-uchoa
  quote: >-
    Em 2011, também consagrou Roger Copeland Ames como primeiro bispo da Diocese Anglicana dos Grandes Lagos (ver
    162a)
- source: anglicanink-beckwith-acna-2014
  quote: >-
    At their October 10, 2014, meeting in Atlanta, Georgia, the College of Bishops of the Anglican Church in North
    America received the Rt. Rev. Dr. Peter Beckwith.
