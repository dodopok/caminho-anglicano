description: >-
  A Diocese Anglicana Sul-Ocidental, sediada em Santa Maria (RS), foi fundada em 22 de março de 1950 e abrange a
  porção sul-ocidental dos estados de Santa Catarina e Rio Grande do Sul. Seus bispos diocesanos foram Plínio Lauer
  Simões (1956–1975) e Olavo Ventura Luiz (1976–1992). Seguiram-se Jubal Pereira Neves (1993–2011, hoje emérito)
  e, desde 2011, Francisco de Assis da Silva. Naudal Alves Gomes, eleito bispo sufragâneo em 2000, pastoreou a Catedral
  do Mediador até 2003.
