id: dcaca
acronym: DCACA
name: Diocese Católica Apostólica de Confissão Anglicana
type: diocese
country: BR
description: >-
  Jurisdição de Nova Friburgo (RJ) liderada por Rafael Moraes, que até 2021 tinha dois bispos (Bessa e Moraes);
  a ela pertencia um religioso preso na cidade em 2021.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    O religioso em questão era membro de uma jurisdição intitulada Diocese Católica Apostólica de Confissão Anglicana.
  page: '89'
- source: cant-novas-igrejas-2024
  quote: 'Até 2021 existiam dois bispos nesta jurisdição: Bessa e Moraes.'
  page: '161'
- source: cant-novas-igrejas-2024
  quote: >-
    Em Nova Friburgo, no Rio de Janeiro, a Diocese sob a liderança de Moraes era chamada de Diocese Católica Apostólica
    de Confissão Anglicana.
  page: '161'
