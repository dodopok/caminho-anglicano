website: https://www.igrejacelta.org/
description: >-
  Igreja católica independente, de espiritualidade celta e 'ortodoxa ocidental', sem estrutura diocesana (hesicastérios
  e províncias), com sede em Feira de Santana (BA) segundo o CNPJ, aberto em 09/12/2015. Diz-se autocéfala e membro
  da União Internacional das Igrejas Ortodoxas Autocéfalas; ordena mulheres. A linhagem declarada vem de Eduardo
  Quintella, de Emmanuel Milingo e de Paulo VI. O primaz é Raphael de Emaús desde 27/04/2025; Bernardo da Ressurreição,
  que implantou a igreja no Brasil, é primaz emérito.
