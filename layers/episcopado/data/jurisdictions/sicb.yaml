website: https://www.igrejacelta.org/
description: >-
  A Santa Igreja Celta do Brasil (SICB) é uma igreja católica independente de espiritualidade celta, ligada à União
  Internacional das Igrejas Ortodoxas Autocéfalas, com atividade iniciada em 9 de dezembro de 2015 segundo o CNPJ;
  o celibato é opcional e aceita homens e mulheres. Sua linhagem sucessória vem de Dom Bernardo da Ressurreição,
  O.S.C., que trouxe a igreja ao Brasil com seminaristas e padres que o acompanharam e foi arcebispo primaz até
  27 de abril de 2025, hoje primaz emérito. Nessa data o Santo Sínodo Mundial elegeu por aclamação Dom Raphael de
  Emaús, antes arcebispo da Região Sul, como novo arcebispo primaz. A Província Nordeste tem Dom Basílio da Santa
  Cruz como bispo provincial.
