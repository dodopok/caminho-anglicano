# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: ccaanz
acronym: CCAANZ
name: Church of Confessing Anglicans Aotearoa/New Zealand
type: diocese
tradition: anglican
country: NZ
description: >-
  Diocese confessante da Nova Zelândia, tem Jay Behan como primeiro bispo e bispo presidente, e integra o Global
  Anglican Council desde março de 2026.
sources:
- source: gace-gac-page
  quote: Bishop Jay Behan is the first bishop of the CCAANZ.
- source: gace-gac-page
  quote: Presiding Bishop of the Diocese of the Church of Confessing Anglicans Aotearoa/New Zealand
- source: gacm-tlc-2026-03-27-who-leads
  quote: >-
    Its regional advisers all lead “extra-provincial or missionary districts connected to the GAFCON movement.”
    They are Archbishop Kanishka Raffel of Sydney (a diocesan bishop in the Anglican Church of Australia), and Bishops
    Andy Lines of the Anglican Network in Europe, Jay Behan of the Church of Confessing Anglicans in Aotearoa New
    Zealand, Glenn Davies of the Diocese of the Southern Cross (which serves parishes that have broken away from
    the Anglican Church of Australia), and Yassir Eric of EKKIOS, a missionary movement forming congregations in
    predominantly Muslim regions.
relations:
- type: member_of
  target: gac
  date: 2026-03
  led_by:
  - jay-behan
  status: confirmed
  sources:
  - source: gacm-tlc-2026-03-27-who-leads
    quote: >-
      Its regional advisers all lead “extra-provincial or missionary districts connected to the GAFCON movement.”
      They are Archbishop Kanishka Raffel of Sydney (a diocesan bishop in the Anglican Church of Australia), and
