website: http://dapar.org/
description: >-
  A Diocese Anglicana do Paraná, antes chamada Diocese Anglicana de Curitiba, foi organizada em 2003, com Naudal
  Alves Gomes como primeiro bispo e sede na Catedral de São Tiago, em Curitiba. Magda Guedes Pereira foi sagrada
  bispa coadjutora em outubro de 2021 e instalada bispa diocesana em 12 de dezembro de 2021, quando Naudal se tornou
  bispo emérito.
