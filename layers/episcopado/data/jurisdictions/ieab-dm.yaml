  Area 1.
sources:
- source: ieab-dioceses
  quote: Área 1- formada pelas Dioceses Meridional, Sul Ocidental e de Pelotas.
- source: wp-pt-dioc-meridional
  quote: A sede diocesana está localizada na cidade de Porto Alegre.
relations:
