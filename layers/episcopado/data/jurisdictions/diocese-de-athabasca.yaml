id: diocese-de-athabasca
acronym: Diocese de Athabasca
name: Diocese de Athabasca (Canadá)
type: diocese
country: CA
description: >-
  Diocese no Canadá que, por decisão conciliar, reconheceu o caráter anglicano das paróquias e clérigos expulsos
  por sua Província (Rede Anglicana) e deliberou manter comunhão com eles e com a Província do Cone Sul; Robinson
  Cavalcanti a grafa 'Attabasca'.
