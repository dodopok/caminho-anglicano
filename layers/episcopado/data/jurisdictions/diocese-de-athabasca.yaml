    expulsos por sua Província (Rede Anglicana)
- source: d2s12-xxiv-b
  quote: >-
    A Diocese de Attabasca, no Canadá, por decisão conciliar reconheceu o caráter anglicano das Paróquias e clérigos
    expulsos por sua Província (Rede Anglicana), deliberando manter comunhão com os mesmos e com a Província do
    Cone Sul.
