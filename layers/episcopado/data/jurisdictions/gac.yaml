# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: gac
acronym: GAC
name: Global Anglican Communion
type: communion
tradition: anglican
founded:
  date: '2025-10-16'
  sources:
  - source: gace-future-has-arrived
    quote: >-
      Therefore, Gafcon has re-ordered the Anglican Communion by restoring its original structure as a fellowship
      of autonomous provinces bound together by the Formularies of the Reformation, as reflected at the first Lambeth
      Conference in 1867, and we are now the Global Anglican Communion.
  - source: gace-abuja-affirmation
    quote: >-
      The Chair of the Gafcon Primates’ Council, Archbishop Laurent Mbanda, announced the inauguration of the Global
      Anglican Communion in the October 2025 Martyrs’ Day Statement (MDS).
  - source: gace-abuja-affirmation
    quote: >-
      We gathered to celebrate the inauguration of the reordered Global Anglican Communion, with this gospel at
      its heart.
  - source: gace-home-for-communion
    quote: >-
      the Global Anglican Council has agreed that the headquarters of the Global Anglican Communion will be established
      in Abuja, Nigeria.
  - source: gace-future-has-arrived
    quote: >-
      To be a member of the Global Anglican Communion, a province or a diocese must assent to the Jerusalem Declaration
      of 2008, the contemporary standard for Anglican identity.
website: https://gafcon.org/about/global-anglican-council/
description: >-
  Comunhão anglicana confessional declarada pelos primazes do GAFCON em 16/10/2025 (Martyrs’ Day Statement), que
  se apresenta como a Comunhão Anglicana "reordenada" a partir da Declaração de Jerusalém (2008), sem os Instrumentos
  de Comunhão de Cantuária; inaugurada formalmente na conferência G26 (Abuja, 3–6/03/2026) e dirigida pelo Global
  Anglican Council; sede decidida em Abuja (Nigéria) em 22/08/2026.
sources:
- source: gace-future-has-arrived
  quote: >-
    Therefore, Gafcon has re-ordered the Anglican Communion by restoring its original structure as a fellowship
    of autonomous provinces bound together by the Formularies of the Reformation, as reflected at the first Lambeth
    Conference in 1867, and we are now the Global Anglican Communion.
- source: gace-abuja-affirmation
  quote: >-
    The Chair of the Gafcon Primates’ Council, Archbishop Laurent Mbanda, announced the inauguration of the Global
    Anglican Communion in the October 2025 Martyrs’ Day Statement (MDS).
- source: gace-abuja-affirmation
  quote: >-
    We gathered to celebrate the inauguration of the reordered Global Anglican Communion, with this gospel at its
