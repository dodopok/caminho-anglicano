description: >-
  Igreja anglicana continuante e independente, fundada em 20 de abril de 2014 em assembleia presidida por Adolfo
  Batista Teodoro Júnior, que passou a atuar como primaz; a origem remete a um encontro de 2012 com Cleiton Evangelista
  Nerys. Dirceu Falcão Ibaldo integrou-se como primaz emérito e bispo da Região Sul, com a Diocese Anglicana Ortodoxa
  Sul Brasileira em Santa Maria (RS). Em 2017 recebeu clérigos saídos da IAB em 2014, reconhecendo suas ordens,
  e em 29 de julho de 2018 incardinou dom Fabiano como bispo missionário na região de Luziânia (GO). Mantém comunhão
  plena com a IEEP e a ICALib e é associada à World Anglican Catholic Communion.
