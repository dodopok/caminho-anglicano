website: https://www.anglicanacatolica.com/
description: >-
  Província proposta pelo bispo José Fernando de Faria, arcebispo metropolitano e primaz para a América do Sul (elevado
  a arcebispo do Brasil em 11 de outubro de 2018). Faria, Jorge dos Santos Costa e Orestes Calazans Filho desligaram-se
  em 2018 da Província Católica Anglicana do Brasil; a PACES, situada entre 2019 e 2021, incluía a Diocese do Ceará,
  de que Antônio Bessa se desligou. Hoje extinta, teve como sucessora a Província Anglo-Católica da Santíssima Trindade
  (PACST).
