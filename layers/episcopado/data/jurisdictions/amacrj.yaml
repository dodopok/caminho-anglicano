id: amacrj
acronym: AMACRJ
name: Arquidiocese Metropolitana Anglo-Católica do Rio de Janeiro
type: diocese
country: BR
description: >-
  Nome posterior da diocese de Nova Friburgo (RJ) liderada por Rafael Moraes, antes chamada Diocese Católica Apostólica
  de Confissão Anglicana (ICACA).
sources:
