description: >-
  Igreja Episcopal dos Estados Unidos, cuja constituição inicial foi ratificada em 1789 por clérigos de nove dioceses
  reunidos na Filadélfia, que então adotaram o nome Protestant Episcopal Church; a primeira Convenção Geral é datada
  de 1785. Seus primeiros bispos foram Samuel Seabury (Connecticut, 1784), William White (Pensilvânia) e Samuel
  Provoost (Nova York), ambos em 1787, e James Madison (Virgínia, 1790). Entre os bispos do século seguinte estão
  Thomas Church Brownell (Connecticut), William Meade (Virgínia), John Henry Hopkins (Vermont), Jackson Kemper (bispo
  missionário para Missouri e Indiana), William Whittingham (Maryland), Horatio Potter e depois Henry Codman Potter
  (Nova York), Henry Whipple (Minnesota) e William Lawrence (Massachusetts). Daniel Tuttle foi bispo missionário
  de Montana, Idaho e Utah (1867) e bispo presidente; Ethelbert Talbot dirigiu Wyoming e Idaho (1887), John McKim
  o distrito de Yedo (1893) e Henry St. George Tucker o de Kyoto (1912). No Brasil, o trabalho anglicano passou
  à direção da igreja como distrito missionário, vinculação datada de 1899 com divergência entre fontes; em 1949
  o Distrito Meridional foi dividido em três, em 1955 assumiu as capelanias da Igreja da Inglaterra e em 1965 o
  distrito deu lugar à IEAB. Em 2009 a ACNA separou-se dela.
