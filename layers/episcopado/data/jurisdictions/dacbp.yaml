# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: dacbp
acronym: DACBP
name: Diocese Anglo-Católica Cristo Bom Pastor
aliases:
- Diocese Anglo-Católica Cristo Bom Pastor (Rio de Janeiro)
type: diocese
country: BR
website: https://www.anglicanatradicional.com.br/
description: >-
  A Diocese Anglo-Católica Cristo Bom Pastor, no Rio de Janeiro, integra a Igreja Anglicana Tradicional do Brasil
  (IATB) e tem como bispo diocesano Cristiano Alves, que teria sido convidado por Rui Barbosa a retornar à IATB.
  Em 18-21 de janeiro de 2024 recebeu a visita do bispo primaz, Dom Rui.
sources:
- source: iatb-home
  quote: >-
    Nós, Dom Rui Costa Barbosa, Dom José da Santa Cruz, Dom Cristiano Alves, presbíteros, diáconos e leigos da Igreja
    Anglicana Tradicional do Brasil
- source: iatb-home
  quote: Nova Iguaçu-RJ, 16 de novembro de 2025
- source: lac-iatb-visita
  quote: >-
    Nos dias 18 a 21 de janeiro de 2024 , a Diocese Anglo Católica Cristo Bom Pastor recebeu a visita do Bispo Primaz
    da Igreja, Dom Rui.
- source: lac-iatb-visita
  quote: Além de celebrar três missas em conjunto com Dom Cristiano, bispo responsável pela Diocese local
- source: cant-novas-igrejas-2024
  quote: >-
    este bispo foi convidado por dom Rui Barbosa para retornar para a Igreja Anglicana Tradicional do Brasil (IATB).
  page: '106'
- source: cant-novas-igrejas-2024
  quote: Diocese Anglo-Católica Cristo Bom Pastor (Rio de Janeiro), com dom Cristiano Alves
  page: '136'
