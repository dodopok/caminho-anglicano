wikidata: Q4411083
website: https://fcofe.org.uk/
description: >-
  Igreja inglesa cujas primeiras congregações se formaram em 1844, como reação ao Movimento de Oxford, e se uniram
  sob uma constituição comum em 1863. Em fevereiro de 2014 recebeu a Igreja Anglicana Reformada do Brasil como missão
  oficial para o Brasil, organizada como Diocese da América do Sul, cujo bispo foi Josep Rosselló Ferrer até sua
  renúncia em maio de 2021; a missão foi encerrada em 2021. John Fenwick aparece como primaz (Bishop Primus) desde
  2014.
