description: >-
  Ministério fundado no Maranhão por Elcemir Durans Mendonça, que o preside, e por sua esposa; Elcemir foi comissionado
  para exercer o episcopado e coordenar uma região de igrejas no Maranhão. Em setembro de 2026, celebrava 17 anos
  de ministério em Penalva (MA), e suas publicações a identificam com a tradição anglicana.
