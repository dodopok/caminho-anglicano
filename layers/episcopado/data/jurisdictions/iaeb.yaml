id: iaeb
acronym: IAEB
name: Igreja Anglicana Episcopal do Brasil
type: province
country: BR
founded:
  date: '2023'
  sources:
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana Episcopal do Brasil (IAEB) [2023]
    page: '172'
  - source: cant-novas-igrejas-2024
    quote: Filiada à Iglesia Episcopal Anglicana de Chile (IEACH) [1991]
    page: '172'
description: >-
  Nome jurídico da província brasileira da Igreja Episcopal Anglicana do Chile (IEACH), à qual é filiada, organizada
  em 2023; o clero declara-se sob a autoridade canônica do arcebispo provincial Patricio Viveros Robles. O bispo
  diocesano é Fernando Nobile (nome religioso de Luiz Fernando Salgado), recebido em 2020, segundo os cânones da
  Igreja da Inglaterra, como bispo sacramental. Em julho de 2023, na Paróquia Anglicana de São Jorge, os bispos
  Patricio Robles e James Tavares estiveram na instituição de Nobile como diocesano da Diocese Sul/Sudeste, cuja
  catedral é a Igreja Anglicana Cristo Redentor, em Ribeirão Preto.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    A Igreja Anglicana Episcopal do Brasil é o nome jurídico da província brasileira da Igreja Episcopal Anglicana
    do Chile (IEACH)
  page: '123'
- source: cant-novas-igrejas-2024
  quote: Igreja Anglicana Episcopal do Brasil (IAEB) [2023]
  page: '172'
- source: perd05-iaeb-clero
  quote: >-
    Estamos sob a autoridade canônica da Igreja Episcopal Anglicana do Chile, na figura do Arcebispo Provincial
    Patrício Viveros Robles. No Brasil possuímos um Bispo Diocesano Fernando Nobile, na cidade de Ribeirão Preto/SP.
- source: cant-novas-igrejas-2024
  quote: >-
    O bispo diocesano que atende à IAEB é dom Fernando Nobile (nome religioso de Luiz Fernando Salgado), cuja catedral
    é a Igreja Anglicana Cristo Redentor, localizada na cidade de Ribeirão Preto.
  page: '124'
- source: cant-novas-igrejas-2024
  quote: >-
    Seguindo os Cânones da Igreja da Inglaterra ele foi recebido como um bispo sacramental, responsável por administrar
    os sacramentos.
  page: '125'
- source: cant-novas-igrejas-2024
  quote: >-
    Somente em julho de 2023, na Paróquia Anglicana de São Jorge, o bispo Patricio Robles e o bispo James Tavares
    estiveram na instituição de dom Fernando Nobile como diocesano da Diocese Sul/Sudeste, da IAEB.
  page: '125'
