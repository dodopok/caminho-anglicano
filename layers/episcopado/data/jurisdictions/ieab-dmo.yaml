id: ieab-dmo
acronym: IEAB-DMO
name: Distrito Missionario do Oeste (hoje Distrito Missionario Anglicano)
aliases:
- Distrito Missionario do Oeste / Distrito Missionario Anglicano
- Distrito Missionário Anglicano
- Distrito Missionário do Oeste
type: diocese
country: BR
description: >-
  Distrito Missionário da Igreja Episcopal Anglicana do Brasil (IEAB), 19ª Província da Comunhão Anglicana, hoje
  chamado Distrito Missionário Anglicano, que cobre os estados de Rondônia, Mato Grosso e Mato Grosso do Sul. Almir
  dos Santos ficou encarregado dele por três anos. Em 2018, o primaz Naudal Alves Gomes nomeou Maurício José Araújo
  de Andrade bispo visitador do distrito, e o bispo da Diocese Anglicana de Brasília é o responsável por ele. Em
  2026 o distrito aparece sob a bispa primaz Marinez Bassotto.
