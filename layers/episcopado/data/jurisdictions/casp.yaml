id: casp
acronym: CASP
name: Catedral Anglicana de São Paulo
type: other
country: BR
founded:
  date: '1873'
  sources:
  - source: lq-cat-historia
    quote: >-
      Somente em 1873 quando Vitória era Rainha do Reino Unido e Irlanda e Sua Graça Archibald Campbell Tait era
      arcebispo da Cantuária, era construído e consagrado como Saint Paul’s Anglican Church, o primeiro Templo Anglicano
      em São Paulo
  - source: lq-cat-historia
    quote: Hoje a Catedral Anglicana de São Paulo é a cátedra da Diocese Anglicana no Brasil
  - source: lq-cat-carta-aberta
    quote: >-
      Em 1975 a Saint Paul’s Anglican Church (atual Catedral Anglicana de São Paulo) se filia ESPIRITUALMENTE à
      igreja nacional
  - source: cant-novas-igrejas-2024
    quote: >-
      A Catedral Anglicana de São Paulo é uma Igreja Anglicana no coração da capital paulista, liderada pelo reverendo
      Aldo Quintão
    page: '92'
  - source: cant-novas-igrejas-2024
    quote: Saint Paul’s Church, erigido em 1873
    page: '92'
  - source: cant-novas-igrejas-2024
    quote: >-
      Em 1972, a Saint Paul’s se filiou à Igreja Episcopal do Brasil, sendo elevada ao status de Catedral da Diocese
      Anglicana de São Paulo em 1995.
    page: '92'
website: https://www.catedral-anglicana.org.br/
description: >-
  Comunidade anglicana de São Paulo registrada em 1873, associou-se à Igreja Episcopal do Brasil em 1972 e tornou-se
  catedral da Diocese Anglicana de São Paulo em 1995. Em 2013, com o Rev. Aldo Quintão e os bispos Roger Douglas
  Bird e Glauco Soares de Lima, desligou-se formalmente da IEAB; em 2018 passou à Diocese Anglicana no Brasil, tendo
  Dionísio Aílton Pereira como bispo de 2021 a 2023.
sources:
- source: lq-cat-historia
  quote: >-
    Somente em 1873 quando Vitória era Rainha do Reino Unido e Irlanda e Sua Graça Archibald Campbell Tait era arcebispo
    da Cantuária, era construído e consagrado como Saint Paul’s Anglican Church, o primeiro Templo Anglicano em
    São Paulo
- source: cant-novas-igrejas-2024
  quote: >-
    Em 1972, nossa Igreja se associou à Igreja Episcopal do Brasil e, em 1995, se tornou a Catedral da Diocese Anglicana
    de São Paulo
  page: '92'
- source: cant-novas-igrejas-2024
  quote: >-
    Assim, a comunidade, junto com o reverendo Aldo Quintão e os bispos Roger Douglas Bird – então diocesano – e
    Glauco Soares de Lima – emérito da DASP –, se desligaram formalmente da Igreja Episcopal Anglicana do Brasil.
  page: '93'
- source: cant-novas-igrejas-2024
  quote: >-
    Em 18 de novembro de 2018, o bispo Ronaldo Melo foi elevado ao episcopado da então criada Diocese Anglicana
    no Brasil, a nova jurisdição da Catedral Anglicana de São Paulo.
  page: '103'
- source: cant-novas-igrejas-2024
  quote: >-
    Todavia, ao deixar a Catedral, logo após a morte de dom Roger, dom Dionísio também deixou uma lacuna episcopal
    na Catedral Anglicana de São Paulo
  page: '97'
