description: >-
  Comunidade anglicana independente no centro de São Paulo (origem na Saint Paul's Church, 1873), liderada pelo
  Rev. Aldo Quintão; filiou-se à Igreja Episcopal do Brasil em 1972, foi catedral da Diocese Anglicana de São Paulo
  (IEAB) a partir de 1995 e desligou-se da IEAB em 06/04/2013.
