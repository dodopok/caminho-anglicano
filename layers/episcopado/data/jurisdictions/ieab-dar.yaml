- type: broke_communion_with
  target: iecb
  date: '2003-02-20'
  led_by:
  - robinson-cavalcanti
  status: confirmed
  sources:
  - source: d2s31-resol
    quote: >-
      Suspender, totalmente, e por tempo indeterminado, qualquer relacionamento institucional entre a Diocese Anglicana
      do Recife e a supra citada entidade religiosa
  - source: d2s31-resol
    quote: Disciplina Relacionamento Institucional com a chamada
  - source: d2s31-resol
    quote: Recife, 20 de fevereiro de 2003. Dom Robinson
  notes: >-
    Resolução Diocesana nº 02/2003 do bispo diocesano Robinson Cavalcanti: suspende o relacionamento institucional
    da diocese com a chamada Igreja Episcopal Carismática, incluindo intercâmbio em cultos e atividades. A resolução
    justifica a medida por ataques e apropriação de bens atribuídos àquela igreja e por proselitismo; essa é a posição
    da diocese, e a outra parte não se manifesta na fonte.
