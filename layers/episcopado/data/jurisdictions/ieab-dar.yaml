    quote: >-
      Um segundo capelão brasileiro foi designado em 1968, que passou a trabalhar com os missionários americanos
      John Said e Phillip Getchell, que atendiam a congregação dos estrangeiros, formada principalmente por americanos
      e ingleses, até março de 1975
    page: '295'
  - source: kickhofel-1995
    quote: >-
      até março de 1975, quando o bispo Sherrill determinou a transferência para Recife do rev. Paulo Luiz Garcia
      para assumir a reitoria da paróquia. Essa transferência significou o início do projeto que deu origem a nova
      unidade eclesiástica, que recebeu o complicado nome de Diocese Setentrional.
    page: '295'
  - source: kickhofel-1995
    quote: >-
      com a diferença de que o bispo Sherrill que como diocesano tinha o direito de opção, optou pela nova diocese,
      transferindo-se para Recife em 1977.
    page: '296'
  - source: kickhofel-1995
    quote: >-
      Cento e doze anos depois, a capelania passou a jurisdição da Diocese Central sob o pastorado dos missionários
      Roger Blankley e Stuart Broughton, quando começou o trabalho missionário entre os brasileiros, surgindo as
      primeiras conversões.
    page: '297'
  - source: kickhofel-1995
    quote: >-
      Em treze de maio de 1977, o bispo Sherrill instituiu o rev. Lauro Borba da Silva como ministro encarregado
      da Missão do Cristo Redentor, enquanto o rev. Broughton permanecia no pastorado da comunidade inglesa.
    page: '297'
  - source: kickhofel-1995
