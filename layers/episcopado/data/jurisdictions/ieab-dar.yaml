    page: '295'
  - source: kickhofel-1995
    quote: >-
      até março de 1975, quando o bispo Sherrill determinou a transferência para Recife do rev. Paulo Luiz Garcia
      para assumir a reitoria da paróquia. Essa transferência significou o início do projeto que deu origem a nova
      unidade eclesiástica, que recebeu o complicado nome de Diocese Setentrional.
    page: '295'
  - source: kickhofel-1995
    quote: >-
