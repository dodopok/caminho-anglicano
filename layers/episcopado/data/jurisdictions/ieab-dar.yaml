- type: broke_communion_with
  target: tec
  date: '2003'
  led_by:
  - robinson-cavalcanti
  status: probable
  sources:
  - source: rclv-anglicanismo-identidade
    quote: >-
      No Brasil, os Bispos – Diocesano e Sufragâneo – e o Conselho Diocesano da Diocese do Recife, publicaram a
      “Afirmação do Recife”, reiterando o apoio à Resolução 1.10 da Conferência de Lambeth, 1998, condenando a Sagração
      de Gene Robinson e suspendendo o seu relacionamento institucional com a Igreja Episcopal (EUA) e com a Diocese
      de New Westminster
    page: '149'
  notes: >-
    'Afirmação do Recife', publicada após a sagração de Gene Robinson (nov/2003); o livro não data o documento (ano
    inferido do contexto). A diocese tinha então um bispo sufragâneo, não nomeado no texto.
- type: broke_communion_with
  target: diocese-de-new-westminster
  date: '2003-12-06'
  led_by:
  - robinson-cavalcanti
  status: confirmed
  sources:
  - source: drp2-cronologia-2004
    quote: >-
      Os bispos e o Conselho Diocesano da Diocese Anglicana do Recife emitem a “Afirmação do Recife”, suspendendo
      comunhão com New Westminster e New Hampshire
  - source: d2s31-resol
    quote: >-
      Afirmamos - pelo reconhecimento formal e oficial da ruptura de comunhão promovida pelas Dioceses supra citadas
      - suspender, por tempo indeterminado, e enquanto durar tais irregularidades, quaisquer relações institucionais
      com as mesmas
  - source: d2s31-resol
    quote: João Pessoa (PB), 06 de Dezembro de 2003.
  notes: >-
    Suspensão de comunhão pela 'Afirmação do Recife' (2003), homologada pelo Concílio Diocesano em dezembro de 2003.
    Afirmação do Recife (Resolução Conciliar 002/2003), aprovada pelo bispo diocesano e pelo Conselho Diocesano
    em João Pessoa (PB): suspende as relações institucionais com as dioceses de New Westminster (Canadá), por rito
    de bênção de uniões do mesmo sexo, e de New Hampshire (EUA), por eleição de bispo diocesano; mantém contato
    pastoral com fiéis dessas dioceses que se oponham a essas decisões. Posição da diocese, expressa na resolução.
