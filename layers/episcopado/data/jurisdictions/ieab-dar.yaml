- source: costa2021
  quote: 2006-2013 – Sebastião Armando Gameleira Soares
- source: ieab-dioceses
  quote: Bispo Diocesano – Revmo. João Cancio Peixoto Filho
- source: cant-novas-igrejas-2024
  quote: >-
    a Diocese Anglicana do Recife (DAR), da Igreja Episcopal Anglicana do Brasil (IEAB), ligada à Comunhão Anglicana,
    atualmente pastoreada pelo seu quinto bispo, João Câncio Peixoto Filho, com sé na Catedral Anglicana do Bom
