description: >-
  A Diocese do Recife foi criada em 20 de maio de 1976 pelo Sínodo Geral da Igreja Episcopal do Brasil como Diocese
  Setentrional, com sede no Recife, desmembrada da Diocese Central e com jurisdição sobre o Norte e o Nordeste.
  Seu primeiro bispo, Edmund Knox Sherrill, renunciou no início de 1986, e as fontes divergem sobre as datas de
  seu período. Clóvis Erly Rodrigues, sagrado em 17 de março de 1985 por Sherrill, foi coadjutor nesse ano, bispo
  diocesano de 1986 a outubro de 1997 e hoje é emérito. Robinson Cavalcanti, coadjutor desde 5 de outubro de 1997,
  foi instalado em 19 de outubro como terceiro bispo diocesano. Em 2002, Paulo Garcia saiu da diocese e fundou a
  Igreja Episcopal Carismática do Brasil. Em 2003, a Afirmação do Recife suspendeu a comunhão com as dioceses de
  New Westminster e de New Hampshire, e foi rescindido o companheirismo com a Diocese da Pensilvânia Central. Em
  2004, a diocese voltou ao status de missionária sob autoridade primacial, com bispos interinos até 2006, entre
  eles Filadelfo Oliveira Neto, nomeado autoridade eclesiástica; em junho de 2005, Cavalcanti foi deposto por ter
  rompido a comunhão com a IEAB, no que um texto chama de segundo cisma. Sebastião Armando Gameleira Soares, quarto
  bispo, foi instalado em 11 de outubro de 2006 e atuou até 2013; desde dezembro de 2013, o bispo diocesano é João
  Câncio Peixoto Filho, o quinto. Em 2017, clérigos ligados à catedral romperam a comunhão com a IEAB.
