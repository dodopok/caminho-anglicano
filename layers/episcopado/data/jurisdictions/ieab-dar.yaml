- type: in_communion_with
  target: diocese-de-central-pennsylvania
  date: 1998/2002
  end: 2003-12
  led_by:
  - robinson-cavalcanti
  status: contested
  sources:
  - source: drp2-cronologia-2004
    quote: >-
      Em decorrência, é rescindido o relacionamento de companheirismo com a Diocese da Pensilvânia Central (ECUSA).
  - source: drp2-memorias-decada-v
    quote: >-
      Assinamos convênios com duas Dioceses Companheiras: Fredericton, no Canadá, e Pensilvânia Central, nos Estados
      Unidos.
  - source: darl3-hist4
    quote: >-
      Estabeleceu convênio como “Dioceses Companheiras” com a Diocese de Pensilvânia Central (ECUSA) e de Fredericton
      (Canadá)
  - source: d2s29-m40
    quote: >-
      bem como outro que abre uma excepcionalidade provisória para nosso já existente companheirismo com a Diocese
      de Pensilvânia Central, por tempo determinado
  notes: >-
    Relação de diocese companheira (companion diocese) com a Diocese de Central Pennsylvania (Igreja Episcopal dos
    EUA), rescindida pelo Concílio Diocesano de dezembro de 2003. Convênio de "Dioceses Companheiras" estabelecido
    no período do episcopado de Robinson Cavalcanti (texto de "Resgatando Nossa História IV", período 1998-2002);
    o texto diz ter visitado ambas as dioceses e recebido o bispo de Fredericton em um Concílio Diocesano. Companheirismo
    (diocese companheira) já existente em 04/12/2003, quando o bispo diocesano submeteu ao XXIII Concílio Diocesano
    um projeto de resolução de exceção provisória, 'por tempo determinado', diante do projeto que estabelece 'fronteiras'
    para o relacionamento da diocese com a ECUSA.
  discrepancies:
  - field: date
    value: '2003-12-04'
    sources:
    - source: d2s29-m40
      quote: >-
        bem como outro que abre uma excepcionalidade provisória para nosso já existente companheirismo com a Diocese
        de Pensilvânia Central, por tempo determinado
