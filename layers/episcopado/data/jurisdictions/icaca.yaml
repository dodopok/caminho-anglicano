description: >-
  Projeto de igreja anglicana independente anglo-católica, com Antônio José Pereira Bessa como arcebispo, gestado
  entre 2019 e 2021 após a Província Anglicana Católica do Espírito Santo, para unir dioceses anglo-católicas numa
  província. Até 2021 teve dois bispos (Bessa e Rafael Moraes). Não chegou a sair do papel por falta de consenso
  entre os bispos (Apêndice 1: [2021], extinta em 2021).
