id: icaca
acronym: ICACA
name: Igreja Católica Apostólica de Confissão Anglicana
type: national_church
country: BR
founded:
  date: '2021'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Católica Apostólica de Confissão Anglicana trata-se de uma Igreja Anglicana Independente, que teve
      como seu arcebispo a figura de dom Antônio José Pereira Bessa.
    page: '161'
  - source: cant-novas-igrejas-2024
    quote: >-
      O contexto de criação dessa Igreja se situa entre os anos de 2019 e 2021, através do surgimento, em primeiro
      momento, da extinta Província Anglicana Católica do Espírito Santo.
    page: '161'
  - source: cant-novas-igrejas-2024
    quote: >-
      Após tantas sagrações e divisões, a ideia de fundar a Igreja Católica Apostólica de Confissão Anglicana não
      chegou a sair do papel, apenas existindo na intenção dos diocesanos, sendo igualmente extinta após um tempo.
    page: '162'
  - source: cant-novas-igrejas-2024
    quote: Igreja Católica Apostólica de Confissão Anglicana [2021] (Extinta em 2021)
    page: '172'
