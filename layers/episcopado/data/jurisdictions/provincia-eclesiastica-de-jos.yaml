id: provincia-eclesiastica-de-jos
name: Província Eclesiástica de Jos
type: diocese
description: >-
  Província eclesiástica da Igreja da Nigéria, cujo arcebispo Henry Ndukuba foi eleito em 22 de setembro de 2017
  e apresentado em 12 de janeiro de 2018.
sources:
- source: gacl-ai-2019-ndukuba
  quote: >-
    on the 22nd September 2017, the Rt Revd Henry Chukwudum Ndukuba was elected as Archbishop of the Ecclesiastical
    Province of Jos.
- source: gacl-con-primate-page
  quote: he was elected Archbishop of Jos Ecclesiastical province and presented January 12, 2018
relations:
- type: part_of
  target: church-of-nigeria
  status: probable
