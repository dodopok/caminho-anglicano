description: >-
  Missão brasileira da Reformed Episcopal Church dos Estados Unidos, liderada pelos bispos Sebastião Mendes de Freitas
  e Francisco Buzzo Rodrigues; teve origem em 29 de julho de 2001 e foi extinta em 2009. Em 2005, uma comunidade
  de Bragança Paulista ligada a ela, sob a liderança de Buzzo Rodrigues, deu origem à Igreja Anglicana Reformada
  do Brasil (IARB).
