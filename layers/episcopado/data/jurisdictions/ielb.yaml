- source: lielb-radiopasc
  quote: Em 2010 uni tudo criando a Província Anglicana Sagrado Coração
- source: cant-novas-igrejas-2024
  quote: >-
    Posteriormente, dom Lucas Macieira deixou a IELB para atuar em novas frentes e iniciar novos movimentos e igrejas.
  page: '167'
- source: cant-novas-igrejas-2024
  quote: >-
    Após a sua fundação, a Igreja Episcopal Latina do Brasil teve como bispos o bispo Ricardo Lorite de Lima, como
    o Arcebispo Primaz e Metropolitano, Lorite de Lima, dom Rogério Belmiro Tampellini, dom Marcos de Santa Helena
