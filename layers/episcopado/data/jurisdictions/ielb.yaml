  page: '167'
- source: cant-novas-igrejas-2024
  quote: Juridicamente, a denominação encerrou suas atividades desde 09 de fevereiro de 2015.
  page: '167'
- source: lia-iatb-sudeste-2008
  quote: >-
    Dom Iranildo Macieira da Silva (Dom Lucas Macieira), Arcebispo Primaz da Igreja Episcopal Latina do Brasil.
