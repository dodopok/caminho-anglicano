description: >-
  A Igreja Episcopal Latina do Brasil (IELB), igreja anglo-católica independente, foi fundada em dezembro de 2004
  a partir da liderança de dom Lucas Macieira da Silva (Iranildo Macieira da Silva, nascido em Fortaleza) e do frei
  Antônio Santana Neto, ambos vindos da Igreja Católica Romana e da Igreja Católica Brasileira no Ceará; declarava
  plena comunhão com a Iglesia Viejo Católica en América. Lucas foi arcebispo primaz, com Antonio Rodrigues como
  bispo auxiliar da Arquidiocese Nossa Senhora de Guadalupe e João de Deus como bispo da Regional Sul; em 2010 Santana
  Neto criou a Província Anglicana Sagrado Coração. Lucas deixou depois a IELB, que teve como bispos Ricardo Lorite
  de Lima (arcebispo primaz e metropolitano), Rogério Belmiro Tampellini, Marcos de Santa Helena e Adauto Pereira.
  Juridicamente, encerrou as atividades em 9 de fevereiro de 2015.
sources:
- source: cant-novas-igrejas-2024
  quote: >-
    Fundada em dezembro de 2004 a Igreja Episcopal Latina do Brasil (de sigla IELB, a qual não deve ser confundida
    com a Igreja Luterana) teve origem na liderança de dom Lucas Macieira da Silva e o frei Antonio Santana Neto,
    ambos advindos da Igreja Católica Romana e Igreja Católica Brasileira no Ceará.
  page: '166'
- source: pasc-arcebispo-primaz
  quote: >-
    Já em dezembro do mesmo ano o mesmo funda a Igreja Episcopal Latina do Brasil, uma Igreja de corrente Anglo-Católica
    independente no Brasil.
- source: pasc-arcebispo-primaz
  quote: >-
    Nascido Iranildo Macieira da Silva, (Fortaleza, 17 de abril de 1974) é um bispo da Igreja Episcopal Latina do
    Brasil. … Já em dezembro do mesmo ano o mesmo funda a Igreja Episcopal Latina do Brasil, uma Igreja de corrente
    Anglo-Católica independente no Brasil.
- source: lielb-netministries
  quote: >-
    Nossa Igreja esta em plena comunhão com a Iglesia Viejo Católica en América, com sede nos Estados Unidos.
- source: cant-novas-igrejas-2024
  quote: >-
    À época da fundação, a IELB teve como arcebispo provincial Lucas Macieira da Silva, juntamente com dom Antonio
    Rodrigues, como bispo auxiliar da Arquidiocese Nossa Senhora de Guadalupe, e dom João de Deus como Bispo da
    Regional Sul.
