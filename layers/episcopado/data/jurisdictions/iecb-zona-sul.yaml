- Diocese da Zona Sul de Pernambuco (Catedral da Reconciliação, Boa Viagem)
type: diocese
tradition: charismatic_episcopal
country: BR
description: >-
  Diocese da IECB com a Catedral da Reconciliação (Boa Viagem, Recife), criada em 2007, segundo a Câmara do Recife
  (2012), como Diocese da Zona Sul do Recife e Estado de Alagoas. Alexandre Barbosa Monteiro Ximenes é bispo diocesano
  e deão da catedral, e Ivan Barreto de Lima Rocha é bispo adjutor.
