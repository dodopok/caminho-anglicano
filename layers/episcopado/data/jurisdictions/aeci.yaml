# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: aeci
acronym: AECI
name: Anglican Episcopal Church International
aliases:
- The Anglican Episcopal Church International
type: communion
founded:
  date: 2008-05
  sources:
  - source: lia-aeci-about
    quote: >-
      In May 2008 in consultation with other members of the bishops and clergy the Anglican Episcopal Church International
      was formed.
  - source: lia-aeci-about
    quote: >-
      This branch of the Traditional Anglican Communion was introduced to the UK by Bishop Norman Dutton, who formed
      the first Diocese of the AIC in these islands.
website: https://aeci.weebly.com/
description: >-
  Comunhão internacional de anglicanos tradicionais, formada em maio de 2008 em consulta com bispos e clero, tendo
  Norman Dutton como fundador, e reunindo desde anglo-católicos até evangélicos e carismáticos; a IATB declara intercomunhão
  com ela. Entre seus arcebispos constam Victor Manuel Cruz-Blanco, desde 2011, e Rui Costa Barbosa, primaz da Província
  da América Latina e membro do conselho consultivo do arcebispo.
sources:
- source: lia-aeci-about
  quote: >-
    In May 2008 in consultation with other members of the bishops and clergy the Anglican Episcopal Church International
    was formed.
- source: lia-aeci-news
  quote: Norman was the founding father of AECI and was greatly revered within our community.
- source: iatb-intercomunhoes
  quote: >-
    A Igreja Episcopal Anglicana Internacional é uma grande grupo de Anglicanos tradicionais de grande variedade
    de segmentos Anglicanos, desde os Anglo-Católicos (como a IATB) até os Evangelicais e Carismáticos
- source: lia-aeci-news
  quote: >-
    The Most Rev'd Dr Victor Manuel Cruz Blanco CJ., Hon DD. as The Grand Prior of the Priestly Order of the Companions
    of Jesus for the whole of Latin America.
- source: lia-aeci-news
  quote: >-
    Membership status of The International Chaplains Corps has been granted to all the Archbishops of AECI. Metropolitan
    Archbishop Emeritus Norman S Dutton Metropolitan Archbishop-Elect John Langley Archbishop Clive Read Archbishop
    Victor Manuel Cruz-Blanco
- source: lia-aeci-news
  quote: >-
    Archbishop ++Rui Barbosa - Primate of the Province of Latin America as a member of 'The Archbishop's Advisory
    Council'.
- source: lia-aeci-clergy
  quote: The Most Rev. Rui Costa Barbosa Primate Archbishop
relations:
- type: successor_of
  target: aic-w
  date: 2008-05
  led_by:
  - norman-dutton
  status: probable
  sources:
  - source: lia-aeci-about
    quote: >-
      In May 2008 in consultation with other members of the bishops and clergy the Anglican Episcopal Church International
      was formed.
  - source: lia-aeci-about
    quote: out of this movement the AIC (later to be reformed as the AEC) was born.
  notes: >-
    A AECI foi formada em maio de 2008, em consulta com bispos e clero; a própria AECI descreve a AIC como reformada
    depois na AEC.
