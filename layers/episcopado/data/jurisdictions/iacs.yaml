description: >-
  Província formada em 1981, tendo a Diocese do Chile entre as dioceses fundadoras; Héctor (Tito) Zavala, bispo
  diocesano do Chile desde 2000, foi seu primaz de 2010 a 2016. Em 23 de setembro de 2005, o primaz Gregory Venables
  acolheu a Diocese Anglicana do Recife, de Robinson Cavalcanti, que atuou como diocese extraprovincial sob sua
  supervisão até 2018. Em 2007, o bispo Donald Harvey transferiu-se para a província e, em 28 de dezembro de 2007,
  clérigos da Igreja Anglicana Ortodoxa passaram para a Diocese do Recife, Cone Sul; em 2012 Evilásio Tenório foi
  primaz interino dessa diocese até a eleição de Miguel Uchôa. A província participa do GAFCON e de seus conselhos,
  sem ter transferido formalmente sua lealdade institucional.
