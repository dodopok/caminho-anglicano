locator_slug: ieab
website: https://www.ieab.org.br
description: >-
  Nome adotado nos anos 1950 pela igreja formada pelos três distritos; Conselho Nacional criado em 1950, primeiro
  Sínodo em 1952; autonomia aprovada pela Convenção Geral da TEC em 1964 e província autônoma (19ª da Comunhão Anglicana)
  a partir de 1965.
sources:
- source: ens-xxvi-24
  quote: >-
    In the 1950's the Brazilian Church took the name "Igreja Episcopal Brasileira" (Brazilian Episcopal Church)
    and, while still under the jurisdiction of the Episcopal Church in the United States, assumed much of the responsibility
    for its own affairs.
- source: ens-41-5
  quote: >-
