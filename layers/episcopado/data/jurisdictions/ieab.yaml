id: ieab
acronym: IEAB
name: Igreja Episcopal Anglicana do Brasil
aliases:
- IEB
- Igreja Episcopal do Brasil / Igreja Episcopal Brasileira (hoje Igreja Episcopal Anglicana do Brasil)
type: province
tradition: anglican
country: BR
founded:
  date: '1965-04-25'
  sources:
  - source: ens-xxvi-24
    quote: >-
      In the 1950's the Brazilian Church took the name "Igreja Episcopal Brasileira" (Brazilian Episcopal Church)
      and, while still under the jurisdiction of the Episcopal Church in the United States, assumed much of the
      responsibility for its own affairs.
  - source: ens-41-5
    quote: >-
      The Episcopal Church in Brazil is the newest province in the Anglican Communion, having come into existence
      only last May.
  - source: ieab-dioceses
    quote: A IEAB é composta por nove Dioceses e um Distrito Missionário, sendo pastoreadas por bispos.
locator_slug: ieab
website: https://www.ieab.org.br
description: >-
  Nome adotado nos anos 1950 pela igreja formada pelos três distritos; Conselho Nacional criado em 1950, primeiro
  Sínodo em 1952; autonomia aprovada pela Convenção Geral da TEC em 1964 e província autônoma (19ª da Comunhão Anglicana)
  a partir de 1965.
sources:
- source: ens-xxvi-24
  quote: >-
    In the 1950's the Brazilian Church took the name "Igreja Episcopal Brasileira" (Brazilian Episcopal Church)
    and, while still under the jurisdiction of the Episcopal Church in the United States, assumed much of the responsibility
    for its own affairs.
- source: ens-41-5
  quote: >-
    The Episcopal Church in Brazil is the newest province in the Anglican Communion, having come into existence
    only last May.
relations:
