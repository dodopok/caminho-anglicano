    quote: >-
      voted autonomy for the 45,000 member Brazilian Episcopal Church and, by the same decision, created the 19th
      independent church in the world-wide Anglican Communion.
  notes: Os três distritos (Sul, Sudoeste, Central) passaram a formar a igreja autônoma.
- type: member_of
  target: anglican-communion
  date: '1965'
  status: confirmed
  sources:
  - source: ens-41-5
    quote: >-
      The Episcopal Church in Brazil is the newest province in the Anglican Communion, having come into existence
      only last May.
  - source: wp-en-ieab
    quote: >-
      In 1965, the Anglican Episcopal Church of Brazil (Igreja Episcopal Anglicana do Brasil; IEAB) gained its autonomy,
      becoming the 19th ecclesiastical province of the Anglican Communion
  - source: wp-en-ieab
    quote: is the 19th province of the Anglican Communion, covering the country of Brazil.
  notes: >-
    Aprovada pela Convenção Geral da TEC em out. 1964; existência como província a partir de maio de 1965 (ENS).
