description: >-
  A Igreja Episcopal Anglicana do Brasil (IEAB) tem como data oficial de fundação 1º de junho de 1890 e foi missão
  da Igreja Episcopal dos Estados Unidos até 1965; em 1950 foi dividida em três dioceses, com a criação do Conselho
  Nacional, e em 1952 realizou seu primeiro Sínodo. Em 25 de abril de 1965, no Sínodo de Porto Alegre, tornou-se
  autônoma como a 19ª província da Comunhão Anglicana, sucedendo os três distritos missionários, e Egmont Krischke
  foi investido como primeiro bispo primaz (1965–1971). Seguiram-se Plínio Lauer Simões (interino, 1971–1972), Arthur
  Rodolpho Kratz (1972–1984, falecido no cargo), Edmund Knox Sherrill (interino, 1984–1986), Olavo Ventura Luiz
  (com datas divergentes entre as fontes, até sua morte em março de 1993), Cláudio Gastal (interino, 1993–1994),
  Glauco Soares de Lima (1993–2003), Orlando Santos de Oliveira (2003–2006), Maurício Andrade (2006–2013), Francisco
  de Assis da Silva (2013–2018), Naudal Alves Gomes (2018–2022) e, desde 13 de novembro de 2022, Marinez Bassotto,
  até então bispa da Diocese Anglicana da Amazônia. A província reúne as dioceses Meridional, Sul-Ocidental, do
  Rio de Janeiro, de São Paulo, do Recife, de Brasília, de Pelotas, do Paraná e da Amazônia, além do Distrito Missionário
  do Oeste. Em 2002, o Recife teve dois cismas: o de Paulo Garcia, que levou à Igreja Episcopal Carismática do Brasil,
  e o da Paróquia Betânia, que formou a Igreja Episcopal Evangélica. Em 2005, o bispo do Recife, Robinson Cavalcanti,
  foi deposto sob a alegação de ter rompido a comunhão com a IEAB, e a divisão da diocese originou a Igreja Anglicana
  no Brasil; nesse ano houve também ruptura de comunhão com a Província do Cone Sul. Em 2013, os bispos Roger Bird
  e Glauco Soares de Lima romperam com a província e fundaram o Movimento Anglicano no Brasil, e em 2017 um grupo
  ligado à catedral do Recife saiu e originou a Igreja Anglicana da Santíssima Trindade.
