# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: diocese-de-shyira
name: Diocese de Shyira
type: diocese
description: >-
  Diocese da Igreja Anglicana de Ruanda em que Laurent Mbanda foi entronizado bispo em 14 de novembro de 2010, no
  lugar de John Rucyahana (bispo desde 1997), e que ele ocupava ao ser eleito 4º arcebispo e primaz.
sources:
- source: gacl-newtimes-2010-shyira
  quote: >-
    MUSANZE - The Anglican Church of Rwanda, Sunday, enthroned Dr Laurent Mbanda as the new Bishop of Shyira Diocese,
    replacing the retiring Bishop John Rucyahana, who has been at the helm of the Diocese since 1997. Monday, November
    15, 2010
- source: gacl-wp-mbanda
  quote: He was the bishop of the Diocese of Shyira when he was elected the fourth archbishop and primate
relations:
- type: part_of
  target: pear
  status: confirmed
  sources:
  - source: gacl-newtimes-2010-shyira
    quote: >-
      MUSANZE - The Anglican Church of Rwanda, Sunday, enthroned Dr Laurent Mbanda as the new Bishop of Shyira Diocese,
      replacing the retiring Bishop John Rucyahana, who has been at the helm of the Diocese since 1997. Monday,
      November 15, 2010
  - source: gacl-wp-mbanda
    quote: He was the bishop of the Diocese of Shyira when he was elected the fourth archbishop and primate
