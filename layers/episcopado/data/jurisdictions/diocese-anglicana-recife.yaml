    site ainda a apresenta nessa situação. Em dezembro de 2007 (XXVII Concílio Diocesano) os delegados aprovaram
    a filiação institucional da diocese à Igreja Anglicana do Cone Sul como diocese extraterritorial; a visita pastoral
    do Primaz Gregory Venables (28 a 31/03/2008) foi noticiada como "A Diocese do Recife já está na Igreja Anglicana
    do Cone Sul". Desde setembro de 2005 a diocese estava sob a autoridade primacial do Cone Sul. O texto é da Paróquia
    Anglicana da Redenção e declara que a paróquia tem vínculo canônico com a Diocese do Recife e com a Província
    do Cone Sul; a ligação da diocese ao Cone Sul é inferida dessa declaração. Descrição feita pelo bispo diocesano
    em 30/06/2010: a diocese se define como parte da Comunhão Anglicana sob a autoridade primacial da Igreja Anglicana
    no Cone Sul da América. Em 21/11/2010, a Paróquia Anglicana da Redenção declara vínculo canônico com a Diocese
    do Recife e com a Província do Cone Sul, e identifica Robinson Cavalcanti como seu bispo diocesano. Texto doutrinário
    publicado em 18/09/2009 que, ao explicar as dioceses extraprovinciais (ligadas diretamente a um primaz), cita
