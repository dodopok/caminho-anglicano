- type: in_communion_with
  target: acna
  date: '2010-06-11'
  led_by:
  - robert-duncan
  - robinson-cavalcanti
  status: probable
  sources:
  - source: darn1-acna-memo
    quote: >-
      Colégio dos Bispos da Igreja Anglicana na América do Norte (ACNA), por unanimidade dos seus membros, e celebrado
      com aplausos, firmou um Memorando de Cooperação com a Diocese do Recife
  - source: darn1-acna-memo
    quote: >-
      Aceitamos mutuamente nossas Ordens Ministeriais e reconhecemos que essas Santas Ordens podem ser intercambiadas
      entre nós
  - source: darn1-acna-memo
    quote: >-
      Aceito pelo Colégio dos Bispos da Igreja Anglicana na América do Norte, reunido em Amesbury, Massachusetts,
      Dia de São Barnabé, 2010 A.D.
  notes: >-
    Memorando de Compreensão e Entendimento 2010 entre a ACNA e a Diocese do Recife: observadores nos concílios
    anuais, aceitação mútua das ordens ministeriais, parcerias entre dioceses e paróquias e exame de um pedido do
    29º Concílio Diocesano do Recife não previsto na constituição e cânones da ACNA. Assinado por Robert Duncan
    (pelo Colégio) e Robinson Cavalcanti (pela Diocese); a diocese ainda devia ratificá-lo. O texto descreve cooperação,
    não a plena comunhão; a relação foi classificada como em_comunhao_com por falta de tipo mais próximo. O mesmo
    colégio decidiu não aceitar filiação de organizações de fora da América do Norte (esclarecimento de 20/06/2010).
