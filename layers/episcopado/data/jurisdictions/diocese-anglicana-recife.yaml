    Jurisdição extra-provincial ('supervisão primacial'), não diocese plena do Cone Sul. Fim = criação da IAB (inferido).
    A Diocese do Recife, desligada da IEAB em 2005, passou à autoridade primacial do Cone Sul; em 2010 e 2011 o
    site ainda a apresenta nessa situação.
