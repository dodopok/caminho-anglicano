  notes: >-
    Anglican Ink (2018-04-17) e Wikipédia EN (Uchôa) datam a saída em 2004; IAB, GAFCON e Wikipédia (Cavalcanti/IAB)
    em 2005 (declaração 25/01/2005, exclusão 10/06/2005). Grupo que formou a "Igreja Anglicana - Diocese do Recife",
    depois Igreja Anglicana no Brasil (IAB). Cisma na Diocese Anglicana do Recife (IEAB-DAR). Ruptura da maioria
    das comunidades da Diocese Anglicana do Recife com a IEAB, por divergências sobre sexualidade, autoridade bíblica
    e identidade eclesiástica. Liderança de Robinson Cavalcanti inferida do Apêndice 2 ('reorganizada pelo bispo
    Robinson Cavalcanti a partir da Diocese do Recife'). Data da carta em que Robinson Cavalcanti declarou a Diocese
    Anglicana do Recife autônoma e sem vínculos com a IEAB, segundo o processo canônico da IEAB (Anexo Q). Antes
    disso o concílio de dezembro de 2004 pedira o desligamento da Província. Para a IEAB, a diocese canônica continuou
    nela (Resoluções 001 e 002/2005, Anexos N e O), e quem seguiu Robinson formou a DAR dissidente. 'Grande Crise
    do Recife'. Robinson deposto em 10/06/2005; 32 clérigos desligados pelo Decreto Diocesano 01/2005 (Carta de
    Setúbal). O grupo levou os templos (exceto o da Carneiro Vilela, já com a IECB) e o CNPJ da diocese.
