description: >-
  Diocese que, em 25 de janeiro de 2005, sob o bispo Robinson Cavalcanti, declarou suspensas as relações com a IEAB,
  que excomungou o clero e os membros que o seguiram (cerca de 90% dos clérigos, membros e templos). Em setembro
  de 2005, o primaz Gregory Venables, da Igreja Anglicana do Cone Sul, reconheceu suas ordens e a acolheu como diocese
  extraprovincial; o vínculo é descrito ora como acolhimento, ora como filiação. Relacionou-se ao GAFCON a partir
  de 2008, rompeu comunhão com New Hampshire e New Westminster e firmou parcerias com a Diocese de Springfield (TEC),
  com a ACNA (memorando de 2010) e com a Diocese de Cascádia. Em 28 de dezembro de 2007 incorporou a Igreja Anglicana
  Ortodoxa. Em 2011 elegeu Flávio Soares e Evilásio Tenório bispos sufragâneos de duas regiões eclesiásticas, e
  com o fim do episcopado de Cavalcanti, em 26 de fevereiro de 2012, Tenório assumiu como primaz interino. Miguel
  Uchôa foi eleito em setembro de 2012 como 4º bispo diocesano e sagrado em 8 de dezembro. Em 12 de maio de 2018
  a diocese originou a Igreja Anglicana no Brasil (IAB), província do GAFCON, após 14 anos sem filiação provincial.
