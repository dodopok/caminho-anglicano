  notes: >-
    A Diocese Anglicana do Recife passa a usar, em seu papel timbrado, a fórmula "Diocese do Recife – Comunhão Anglicana,
    sob Autoridade Primacial da Igreja Anglicana do Cone Sul da América". O documento de outubro de 2005 fala em
    "status de acolhimento extraprovincial" até o Painel de Referência resolver o relacionamento com a IEAB. Carta
    de Venables de 24/09/2005 (ACNS 4040, 03/10/2005): 'extra-provincial recognition' pelo seu ofício de primaz,
    provisória ('until such time as the Panel of Reference ... has ... addressed this crisis'). A Living Church
    (2012) diz que 'two years later' (c. 2007) o Cone Sul designou a diocese como 'extra-territorial diocese'; ver
    vínculo seguinte. Fim do vínculo não documentado: em dez/2015 Atwood escreve que a diocese estava sem filiação
    provincial, sob o Conselho de Primazes do GAFCON. O Primaz do Cone Sul, Gregory Venables, reconheceu e acolheu
    para supervisão Robinson Cavalcanti e o grupo de clérigos depostos, por carta anterior a 12/10/2005 (data exata
    não informada no Anexo S). A IEAB protestou contra o que chamou de ingerência em sua jurisdição. Carta do Primaz
    Gregory Venables de 24/09/2005. Os credenciamentos foram entregues ao bispo e a 40 clérigos no Centro Diocesano
    Arcebispo George Carey, no Recife, pelo Cônego Bill Atwood, secretário-geral da Ekklesia, representando o Primaz.
