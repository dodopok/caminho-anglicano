# yaml-language-server: $schema=../../schemas/jurisdiction.json
id: diocese-anglicana-recife
acronym: DAR
name: Diocese Anglicana do Recife (Cone Sul / IAB)
aliases:
- Diocese Anglicana do Recife
- Diocese Anglicana do Recife (Igreja Anglicana – Diocese do Recife)
- Diocese do Recife
type: diocese
tradition: anglican
country: BR
founded:
  date: '2005'
  sources:
  - source: wp-en-cavalcanti
    quote: >-
      Expelled from the Anglican Episcopal Church of Brazil, Robinson Cavalcanti created the Diocese of Recife,
      which tried to join the Anglican Church of the Southern Cone of America.
  - source: ai-recife-received-gafcon
    quote: >-
      “The Anglican Diocese of Recife, Brazil has been a diocese that has related extra-provincially to GAFCON since
      2008.
dissolved:
  date: '2018-05-12'
  sources:
  - source: wp-en-cavalcanti
    quote: >-
      Expelled from the Anglican Episcopal Church of Brazil, Robinson Cavalcanti created the Diocese of Recife,
      which tried to join the Anglican Church of the Southern Cone of America.
  - source: ai-recife-received-gafcon
    quote: >-
      “The Anglican Diocese of Recife, Brazil has been a diocese that has related extra-provincially to GAFCON since
      2008.
website: https://www.dr.anglicananobrasil.com/
description: >-
  Diocese que rompeu com a IEAB em 2004/2005 sob Robinson Cavalcanti, ficou sob supervisão extraprovincial do Cone
  Sul e depois do GAFCON, e em 2018 originou a IAB, da qual segue como diocese.
sources:
- source: dr-historia
  quote: O clero e membros dessa diocese foram excomungados em 2005 pela Igreja Episcopal Anglicana do Brasil
- source: iab-quem-somos
  quote: >-
    Depois disso, durante 14 anos a Diocese Anglicana do Recife funcionou como uma diocese sem uma Província a que
    filiar-se.
relations:
- type: broke_communion_with
  target: ieab
  date: '2005'
  led_by:
  - robinson-cavalcanti
  status: confirmed
  sources:
  - source: iab-quem-somos
    quote: que foram excomungadas da Igreja Episcopal Anglicana do Brasil em 2005
  - source: ai-new-province-backed
    quote: >-
      In 2005, the Bishop of Recife, The Rt. Rev. Robinson Cavalcanti, and ninety percent of the clergy of the diocese
      were excommunicated by the liberal Episcopal Church of Brazil.
  notes: >-
    Anglican Ink (2018-04-17) e Wikipedia datam a saída em 2004; IAB e Anglican Ink (2018-05-15) falam em excomunhão
    em 2005.
- type: part_of
  target: iacs
  status: probable
  sources:
  - source: betesda-2009-10
    quote: >-
      Dom Robinson Cavalcanti veio acompanhado do secretário administrativo da diocese, Rev. Hermany Soares e do
      presidente do Conselho Diocesano, Rev. Maurício Amazonas.
  - source: fandom-iaob
    quote: terem se transferido para a Diocese do Recife - Cone Sul, em 28/12/2007
  - source: aac-2015-recife
    quote: One of the new Deacons is Eric.
  - source: iab-poster-linhagem-uchoa
    quote: >-
      163f. Evilásio Tenório da Silva Júnior (2012) que, em 2012, assumiu como primaz interino da Diocese do Recife
      - Cone Sul, até a eleição de Miguel Uchoa
  - source: tlc-2012-02-27
    quote: >-
      Two years later, the Southern Cone province designated the Anglican Diocese of Recife as an extra-territorial
      diocese of the Church of the Province of the Southern Cone.
  - source: acl-2010-01-10-doubles
    quote: >-
      the Diocese of Recife, under the Primatial Authority of the Anglican Church of the Southern Cone of America,
      continues to grow.
  - source: ta-2008-04-10-ieab-bishops
    quote: >-
      What at the beginning of those regrettable events of the schism in Recife was seen as a pastoral care provision
      for the deposed bishop and those who followed him, has become a formal primatial reception of those deposed.
  date: c.2007
  notes: >-
    Data só aproximada ('two years later' após 2005). Fontes posteriores divergem sobre o vínculo ter sido de fato
    provincial: pt-wiki diz que Robinson 'tentou filiar' a diocese ao Cone Sul; Atwood (dez/2015) diz 'Lacking a
    Provincial affiliation'.
- type: schism_from
  target: ieab
  date: '2005'
  led_by:
  - robinson-cavalcanti
  status: confirmed
  sources:
  - source: iab-comunicado-oficial-2018
    quote: >-
      nasce a partir das comunidades, pastores e pastoras que foram excomungadas da Igreja Episcopal Anglicana do
      Brasil em 2005
  - source: ai-recife-forms-iab
    quote: >-
      In 2004 the Diocese of Recife led by its bishop, the Rt. Rev. Robinson Cavalcanti, withdrew from the Anglican
      Episcopal Church of Brazil
  - source: wp-en-iab
    quote: >-
      The church had its origin in a 2005 split in which the Diocese of Recife, led by Robinson Cavalcanti, left
      the Anglican Episcopal Church of Brazil
  notes: >-
    Anglican Ink (2018-04-17) e Wikipédia EN (Uchôa) datam a saída em 2004; IAB, GAFCON e Wikipédia (Cavalcanti/IAB)
    em 2005 (declaração 25/01/2005, exclusão 10/06/2005).
- type: recognized_by
  target: iacs
  date: '2005-09-24'
  led_by:
  - gregory-venables
  status: confirmed
  sources:
  - source: acns-4040-2005-venables
    quote: >-
      I am issuing this statement of support to continue to recognize these ordinations and ministries, and provide
      a special status of extra-provincial recognition by my office as Primate of the Southern Cone
  - source: tlc-2012-02-27
    quote: >-
      In 2005, Presiding Bishop Gregory Venables of the Anglican Church of the Southern Cone extended his personal
      primatial oversight to Bishop Cavalcanti and 40 priests of the Diocese of Recife after they were deposed.
  - source: ai-recife-forms-iab
    quote: >-
      The Primate of the Anglican Church of the Southern Cone, the Most Rev. Gregory Venables provided archiepiscopal
      oversight for the diocese
  notes: >-
    Carta de Venables de 24/09/2005 (ACNS 4040, 03/10/2005): 'extra-provincial recognition' pelo seu ofício de primaz,
    provisória ('until such time as the Panel of Reference ... has ... addressed this crisis'). A Living Church
    (2012) diz que 'two years later' (c. 2007) o Cone Sul designou a diocese como 'extra-territorial diocese'; ver
    vínculo seguinte. Fim do vínculo não documentado: em dez/2015 Atwood escreve que a diocese estava sem filiação
    provincial, sob o Conselho de Primazes do GAFCON.
- type: recognized_by
  target: gafcon
  date: '2008'
  end: '2018-05-12'
  status: contested
  sources:
  - source: ai-recife-received-gafcon
    quote: >-
      “The Anglican Diocese of Recife, Brazil has been a diocese that has related extra-provincially to GAFCON since
      2008.
  - source: ai-recife-forms-iab
    quote: in 2008 the newly formed GAFCON movement extended its oversight to the diocese.
  - source: aac-2015-recife
    quote: >-
      Lacking a Provincial affiliation after being booted from IEAB, the Diocese is under the oversight of the GAFCON
      Primates Council.
  - source: gafcon-2017-anglican-renewal
    quote: >-
      The GAFCON Primates have authorized Bishop Miguel Uchoa to provide episcopal oversight throughout central
      and northern South America for Anglican churches who are unable to continue as part of revisionist dioceses.
  notes: >-
    A frase entre aspas na Anglican Ink de 21/04/2018 é citação do comunicado dos primazes do GAFCON (Entebbe).
    Complementa a relação de 2008: em dez/2015 a diocese estava sob supervisão do Conselho de Primazes do GAFCON,
    sem filiação provincial (registra o fim prático do vínculo com o Cone Sul, data não documentada).
  discrepancies:
  - field: date
    value: '2015'
    sources:
    - source: aac-2015-recife
      quote: >-
        Lacking a Provincial affiliation after being booted from IEAB, the Diocese is under the oversight of the
        GAFCON Primates Council.
    - source: gafcon-2017-anglican-renewal
      quote: >-
        The GAFCON Primates have authorized Bishop Miguel Uchoa to provide episcopal oversight throughout central
        and northern South America for Anglican churches who are unable to continue as part of revisionist dioceses.
