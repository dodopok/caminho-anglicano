      the Anglican Episcopal Church of Brazil
  - source: costa2021
    quote: Robinson levou consigo cerca de 90% dos clérigos, membros e templos.
  - source: wp-en-ieab
    quote: The Diocese of Recife, led by Bishop Robinson Cavalcanti, withdrew from IEAB in 2005
  - source: cant-novas-igrejas-2024
    quote: rompeu com a sua denominação de origem e com a Comunhão Anglicana através do Grande Cisma do Recife.
    page: '35'
  - source: cant-novas-igrejas-2024
    quote: Clero originário da IEAB, reorganizado como Diocese do Recife após o cisma [2005]
    page: '171'
  - source: cant-novas-igrejas-2024
    quote: >-
      No ano de 2005, essas divergências culminaram no rompimento da maioria das comunidades da Diocese com sua
      Igreja Nacional
    page: '173'
  - source: iab-poster-linhagem-meira
    quote: >-
      Em 2005, Robinson Cavalcanti liderou a separação definitiva da Diocese do Recife da IEAB, vinculando-se ao
      Cone Sul.
  - source: costa2021
    quote: >-
      O acusado, de forma deliberada, fez declarações unilaterais de suspensão do relacionamento da Diocese Anglicana
      do Recife com a Província do Brasil, proclamando a Diocese Anglicana de Recife como uma Diocese autônoma da
      Comunhão Anglicana, sem mais vínculos com a Igreja Episcopal Anglicana do Brasil conforme carta de sua autoria,
      datada de 25 de janeiro de 2005.
    page: '556'
  - source: costa2021
    quote: >-
      em carta publicada em 25 de janeiro de 2005, o bispo declarou a suspensão do relacionamento da Diocese Anglicana
      do Recife com a IEAB
    page: '222'
  - source: costa2021
    quote: >-
      Agora existiam duas dioceses dentro de um mesmo território, uma ligada à Igreja Episcopal Anglicana do Brasil
      e outra ligada à Igreja Anglicana do Cone Sul.
    page: '225'
  notes: >-
    Anglican Ink (2018-04-17) e Wikipédia EN (Uchôa) datam a saída em 2004; IAB, GAFCON e Wikipédia (Cavalcanti/IAB)
    em 2005 (declaração 25/01/2005, exclusão 10/06/2005). Grupo que formou a "Igreja Anglicana - Diocese do Recife",
    depois Igreja Anglicana no Brasil (IAB). Cisma na Diocese Anglicana do Recife (IEAB-DAR). Ruptura da maioria
    das comunidades da Diocese Anglicana do Recife com a IEAB, por divergências sobre sexualidade, autoridade bíblica
    e identidade eclesiástica. Liderança de Robinson Cavalcanti inferida do Apêndice 2 ('reorganizada pelo bispo
    Robinson Cavalcanti a partir da Diocese do Recife'). Data da carta em que Robinson Cavalcanti declarou a Diocese
    Anglicana do Recife autônoma e sem vínculos com a IEAB, segundo o processo canônico da IEAB (Anexo Q). Antes
    disso o concílio de dezembro de 2004 pedira o desligamento da Província. Para a IEAB, a diocese canônica continuou
    nela (Resoluções 001 e 002/2005, Anexos N e O), e quem seguiu Robinson formou a DAR dissidente. 'Grande Crise
    do Recife'. Robinson deposto em 10/06/2005; 32 clérigos desligados pelo Decreto Diocesano 01/2005 (Carta de
    Setúbal). O grupo levou os templos (exceto o da Carneiro Vilela, já com a IECB) e o CNPJ da diocese.
