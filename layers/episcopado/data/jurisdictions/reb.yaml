  notes: >-
    Nenhuma fonte usa a palavra cisma/saída: inferido de Eric Rodrigues (bispo auxiliar da IAB em 2023) e da Igreja
    Âncora (IAB em 2018) estarem na REB fundada em 20/12/2024. A REB ordena mulheres ao episcopado; a IAB não (ptwp-iab).
    Igrejas da antiga Região Missionária da IAB (Âncora/Vitória, Família/Jacareí, Francisco Beltrão-PR) aparecem
    na REB. O livro diz 'Origem na Igreja Anglicana no Brasil, hoje independente' — 'cisma_de' é a categoria mais
    próxima. A REB foi fundada por um bispo da IAB e tem sede na antiga paróquia IAB dele (Âncora, Vitória). Nenhuma
    fonte aberta usa a palavra "cisma" nem descreve o processo de saída; a relação é inferida da trajetória do fundador.
    Pode também ser lida como fundação nova, não cisma formal.
- type: in_communion_with
  target: ieub
  date: '2026-01-27'
  led_by:
  - eric-rodrigues
  - hermany-soares
  status: confirmed
  sources:
  - source: rti-ig-reb-ieub-comunhao
    quote: >-
      a Rede Episcopal Brasileira e a Igreja Episcopal Unida do Brasil afirmam, em comunhão, o compromisso com o
      testemunho do Evangelho e o crescimento da Igreja de Cristo.
  - source: rti-ig-reb-recife-2026
    quote: Orem por essa igreja irmã.
  - source: ivoox-planando
    quote: Planando como águias | Bispo Hermany Soares
  notes: >-
    Declaração publicada no perfil oficial da REB em 27/01/2026; o texto não nomeia signatários. Em 16/06/2026 outro
    post da REB chama a IEUB de 'igreja irmã' e relata visita de 'nosso bispo' ao bispo Hermany em Recife. Declaração
    de comunhão vista APENAS em snippet de busca de post do Instagram @redeepiscopalbrasileira de 27/01/2026: "Atendendo
    ao chamado de nosso Senhor Jesus Cristo à unidade da Igreja, a Rede Episcopal Brasileira e a Igreja Episcopal
    Unida do Brasil afirmam, em comunhão, o compromisso com o testemunho do Evangelho...". A fonte citada aqui só
    comprova a participação de Hermany no sínodo da REB (out/2025). Outro snippet (16/06/2026) chama a IEUB de "igreja
    irmã".
