  notes: >-
    Nenhuma fonte usa a palavra cisma/saída: inferido de Eric Rodrigues (bispo auxiliar da IAB em 2023) e da Igreja
    Âncora (IAB em 2018) estarem na REB fundada em 20/12/2024. A REB ordena mulheres ao episcopado; a IAB não (ptwp-iab).
    Igrejas da antiga Região Missionária da IAB (Âncora/Vitória, Família/Jacareí, Francisco Beltrão-PR) aparecem
    na REB. A REB foi fundada por um bispo da IAB e tem sede na antiga paróquia IAB dele (Âncora, Vitória). Nenhuma
    fonte aberta usa a palavra "cisma" nem descreve o processo de saída; a relação é inferida da trajetória do fundador.
    Pode também ser lida como fundação nova, não cisma formal.
