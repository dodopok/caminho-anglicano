id: iamr
acronym: IAMR
name: Igreja Anglicana Missionária do Redentor
type: national_church
country: BR
founded:
  date: '1991'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      Esta singela comunidade foi fundada como comunidade em 1991 e juridicamente em 13 de dezembro de 1996.
    page: '126'
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana Missionária do Redentor (IAMR) [1991]
    page: '172'
  - source: cant-novas-igrejas-2024
    quote: >-
      o templo da Igreja Anglicana Missionária do Redentor (IAMR) marca presença junto à comunidade local, sob a
      liderança do bispo Marcos Fradique
    page: '174'
description: >-
  Pequena igreja anglicana independente do Nordeste. Em novembro de 2006 aparece, com um primaz e um bispo auxiliar,
  entre as signatárias do Manifesto Anglicano redigido em Recife (movimento "Por uma Causa Comum"). Não foram achados
  site, redes sociais ou notícias próprias da igreja; as datas de fundação (comunidade em 1991, registro jurídico
  em 13/12/1996) vêm apenas do livro de Costa (2024).
sources:
- source: ultimato-manifesto-2006
  quote: Igreja Anglicana Missionária do Redentor(IAMR)
relations:
- type: member_of
  target: movimento-anglicano-por-uma-causa-comum
  date: '2006-09-30'
  status: confirmed
  sources:
  - source: darl3-cc-boaviagem
    quote: >-
      Igreja Anglicana Missionária do Redentor – IAMR : Dom Marcos Fradique Bezerra, Bispo Primaz e Dom Antonio
      Pessoa Leite, Bispo Auxiliar
  - source: darl3-cc-boaviagem
    quote: >-
      assinaram ontem, 30.09.2006, a “Declaração da Boa Viagem” , criando o “Movimento Anglicano Por Uma Causa Comum”
  notes: >-
    Signatária fundadora da Declaração da Boa Viagem (Catedral Anglicana do Bom Samaritano, Boa Viagem, Recife,
    30/09/2006), que criou o Movimento Anglicano "Por Uma Causa Comum", durante o culto de ação de graças pelo nono
    aniversário de sagração episcopal de Dom Robinson Cavalcanti.
