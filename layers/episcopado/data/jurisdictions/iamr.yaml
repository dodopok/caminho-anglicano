description: >-
  Pequena igreja anglicana independente do Nordeste, fundada como comunidade em 1991 e juridicamente em 13 de dezembro
  de 1996 por Marcos Fradique Bezerra, eleito bispo primaz, com Antônio Pessoa Leite como bispo auxiliar. Em 2006
  está entre as signatárias da Declaração da Boa Viagem e do Manifesto Anglicano redigido em Recife, e em 2014 Carlos
  Augusto Alves de Souza aparece como seu bispo.
