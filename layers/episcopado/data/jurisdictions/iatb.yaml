description: >-
  Igreja anglo-católica continuante, originada em 2006 com a sagração de Rui Costa Barbosa, que, com outros clérigos,
  criou a Diocese Anglicana Católica do Brasil (primeiro nome: Igreja Anglicana Católica no Brasil), depois renomeada
  Igreja Anglicana Tradicional do Brasil, em Santo André (SP); Barbosa foi nomeado bispo diocesano em 26 de dezembro
  de 2006 e é o primaz. Entrou em comunhão com a Traditional Church of England em 2007, foi recebida na Comunhão
  Anglicana Independente (AICW) em 10 de outubro de 2007 e em 2 de setembro de 2011 em plena comunhão com a AECI,
  da qual faz parte. Em 2009 incardinou Orvandil Moreira Barbosa como bispo da Diocese Meridional Thomas More (depois
  Brasil Central, Goiânia); James Roque foi sufragâneo do Sudeste (2009–2010), e Eduardo Mota, bispo do Pará, morreu
  em 1º de janeiro de 2012, sendo sucedido por Ricardo Vicente dos Anjos. Jorge dos Santos Costa foi recebido em
  2012 e assumiu o Nordeste em 2014; Alfredo Dórea, bispo da Bahia em 2016, foi empossado arcebispo provincial em
  25 de janeiro de 2018. Em 2017 um grupo liderado por Ricardo Vicente dos Anjos e Orvandil Moreira Barbosa fundou
  a Igreja Católica Anglicana. Entre seus bispos constam José da Santa Cruz, bispo diocesano de Pernambuco e abade
  em Garanhuns, Cristiano Alves, da Diocese Anglo-Católica Cristo Bom Pastor (Rio de Janeiro), e Jeferson Nilson
  Santos, bispo prelado em Curitiba; Hélio Augusto foi sagrado bispo do Pará em novembro de 2025.
