id: iatb
acronym: IATB
name: Igreja Anglicana Tradicional do Brasil
type: national_church
country: BR
founded:
  date: '2006'
  sources:
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Anglicana Tradicional do Brasil (IATB) tem origem em 2006, após a sagração do bispo e atual primaz,
      Rui Costa Barbosa. Ela possui um vínculo no estrangeiro com a The Anglican Episcopal Church International.
    page: '136'
  - source: cant-novas-igrejas-2024
    quote: >-
      o bispo Rui Costa Barbosa, em parceria com outros clérigos, criou a Diocese Anglicana Católica do Brasil,
      que sequer saiu do papel e, posteriormente, foi renomeada Igreja Anglicana Tradicional do Brasil, em Santo
      André
    page: '118'
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Anglicana Tradicional do Brasil (IATB) tem origem em 2006, após a sagração do bispo e atual primaz,
      Rui Costa Barbosa.
    page: '136'
