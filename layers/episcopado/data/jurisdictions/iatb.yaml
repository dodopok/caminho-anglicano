id: iatb
acronym: IATB
name: Igreja Anglicana Tradicional do Brasil
type: national_church
country: BR
founded:
  date: 2006-12
  sources:
  - source: lia-iatb-bispos-2011
    quote: Appointed as Diocesan Bishop of The Catholic Anglican Diocese of Brazil on December 26, 2006.
  - source: lia-iatb-noticias-2010
    quote: por esse motivo o primeiro nome da nossa Igreja era Igreja Anglicana Católica no Brasil.
  - source: lia-iatb-pagina-2008-noticias
    quote: >-
      Passará a ser "Província Anglicana Tradicional do Brasil". E serão instituídas quatro Dioceses: Meridional,
      Sudeste, Centro-Oeste e Norte-Nordeste.
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Anglicana Tradicional do Brasil (IATB) tem origem em 2006, após a sagração do bispo e atual primaz,
      Rui Costa Barbosa. Ela possui um vínculo no estrangeiro com a The Anglican Episcopal Church International.
    page: '136'
  - source: cant-novas-igrejas-2024
    quote: >-
      o bispo Rui Costa Barbosa, em parceria com outros clérigos, criou a Diocese Anglicana Católica do Brasil,
      que sequer saiu do papel e, posteriormente, foi renomeada Igreja Anglicana Tradicional do Brasil, em Santo
      André
    page: '118'
  - source: cant-novas-igrejas-2024
    quote: >-
      A Igreja Anglicana Tradicional do Brasil (IATB) tem origem em 2006, após a sagração do bispo e atual primaz,
      Rui Costa Barbosa.
    page: '136'
  - source: cant-novas-igrejas-2024
    quote: Igreja Anglicana Tradicional do Brasil (IATB) [2006]
    page: '172'
  - source: cant-novas-igrejas-2024
    quote: The Anglican Episcopal Church International (AECI)
    page: '172'
website: https://www.anglicanatradicional.com.br/
description: >-
  Igreja anglo-católica continuante ligada à Anglican Episcopal Church International (AECI); bispo primaz Dom Rui
  Costa Barbosa; outros bispos: José da Santa Cruz (Diocese de Pernambuco, abade em Garanhuns), Cristiano Alves,
  Jefferson Nilson (Curitiba). NÃO é a TAC (apesar do nome em português coincidir com o usado pela TAC no Brasil).
  Declara intercomunhão com a AECI e com a 'Igreja Ortodoxa Ucraniana no México'. Origem, segundo Costa (2021):
  'Diocese Anglicana Católica do Brasil', de Rui Costa Barbosa (ex-membro da Diocese Anglicana de São Paulo da IEAB),
  depois renomeada IATB, com sede em Santo André-SP.
sources:
- source: iatb-home
  quote: >-
    Nós, Dom Rui Costa Barbosa, Dom José da Santa Cruz, Dom Cristiano Alves, presbíteros, diáconos e leigos da Igreja
    Anglicana Tradicional do Brasil, reunidos na Cidade de Nova Iguaçu-RJ, no mês de novembro de 2025
- source: iatb-intercomunhoes
  quote: Comunhões e Igrejas com Intercomunhão com IATB The Anglican Episcopal Church—International
- source: costa2021
  quote: >-
    o bispo Rui Costa Barbosa, em parceria com outros clérigos, criou a Diocese Anglicana Católica do Brasil, que
    sequer saiu do papel e, posteriormente, foi renomeada Igreja Anglicana Tradicional do Brasil, em Santo André.
relations:
- type: in_communion_with
  target: aeci
  date: '2011-09-02'
  led_by:
  - norman-dutton
  - rui-costa-barbosa
  status: confirmed
  sources:
  - source: iatb-intercomunhoes
    quote: Comunhões e Igrejas com Intercomunhão com IATB The Anglican Episcopal Church—International
  - source: lia-iatb-noticias-2012
    quote: >-
      a partir do dia 02 de setembro de 2011 nossa Província foi recebida em plena comunhão com a Igreja Episcopal
      Anglicana Internacional, da Inglaterra (The Anglican Episcopal Church-International).
  - source: lia-aeci-news
    quote: >-
      A CONCORDAT OF FULL COMMUNION has been agreed and signed by the respective spiritual leaders of The Anglican
      Episcopal Church International (Archbishop Norman S Dutton) and The Traditional Anglican Church of Brazil
      (Archbishop Rui Costa Barbosa).
  - source: lia-iatb-home-2017-10
    quote: >-
      A AECI (Anglican Episcopal Church-International) da qual a IATB faz parte, foi recebida na Conferência em
      02 de abril de 2011.
  notes: >-
    A IATB data a comunhão plena em 02/09/2011; a AECI lista o concordato sob o cabeçalho 2011 (sem dia). A IATB
    justifica: 'O Arcebispo Dutton está na nossa linha de sucessão apostólica, pois sagrou o Bispo Barry Peachey,
    nosso consagrante... uma espécie de volta para casa'. Desde então a IATB se declara 'associada à AECI' e, por
    meio dela, parte da GAFCON/FCA (AECI foi recebida na Conferência/FCA em 02/04/2011, segundo a IATB). O site
    atual da IATB mantém o menu 'AECI' e a ligação para a página de clero da AECI. A página de notícias da AECI
    lista o concordato sob o cabeçalho '2011' (a data exata não é dada; pode ser anterior). Concordato de comunhão
    plena e 'intercomunhão fraterna' entre as duas igrejas; a AECI aceita os princípios da Afirmação de St. Louis.
- type: in_communion_with
  target: tce
  date: '2007-08-28'
  led_by:
  - rui-costa-barbosa
  status: confirmed
  sources:
  - source: lia-iatb-pagina-2008-noticias
    quote: >-
      Com muito prazer anexo à presente a Bula de Plena Comunhão, confirmando que o senhor e o povo de vossa Igreja
      no Brasil estão em comunhão com a Traditional Church of England
  - source: lia-iatb-comunhao-2008
    quote: >-
      A Província Anglicana Tradicional do Brasil (Igreja Anglicana Tradicional do Brasil) está em comunhão com
      a Traditional Church of England (TCE)
  notes: >-
    Carta do metropolita Michael Newman (Bishop of Windlesham) a Rui Costa Barbosa datada de 28/08/2007; a IATB
    a divulgou em 16/09/2007 e passou a 'representar a TCE em todo o território nacional'. As páginas da IATB entre
    2007 e 2013 exibem o selo 'In Full Communion with The Traditional Church of England'. Esta é a única 'Traditional'
    com a qual a IATB declara comunhão nas fontes consultadas; não há, nelas, vínculo com a Traditional Anglican
    Church (TAC).
- type: member_of
  target: aic-w
  date: '2007-10-10'
  led_by:
  - rui-costa-barbosa
  status: confirmed
  sources:
  - source: lia-iatb-pagina-2008-noticias
    quote: >-
      O Bispo D. Rui Costa Barbosa e toda a Igreja Anglicana Católica foram recebidos na Comunhão Anglicana Independente
      no dia 10 de outubro de 2007.
  - source: lia-iatb-aicw-2010
    quote: >-
      A Igreja Anglicana Tradicional do Brasil está inserida na The Anglican Independent Communion - Worldwide (AICW)
      como uma de suas Províncias Eclesiásticas.
  notes: >-
    Carta de 10/10/2007 assinada por Patricio Viveros Robles (Metropolita) e Peter McInnes (Chanceler Metropolitano).
    Em 07/12/2009 Rui voltou a ser arcebispo metropolitano da AIC-W para o Brasil (notícia da IATB). A partir de
    2011 a IATB se associa à AECI, e a IATB descreve a AECI como organizada por Dutton 'com a colaboração de um
    grupo de bispos remanescentes' da antiga comunhão.
