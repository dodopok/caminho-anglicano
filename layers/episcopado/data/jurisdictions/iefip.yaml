id: iefip
acronym: IEFIP
name: Igreja Episcopal Filhos da Promessa
type: national_church
country: BR
description: >-
  Igreja do bispo-primaz Elias Batista Nogueira, com Roberto de Avelar Coelho da Silva como bispo-missionário, sediada
  em Engenheiro Pedreira, Japeri (RJ). Liga-se à Convenção Eclesiástica Filhos da Promessa (CEFIP, estatuto de 5
  de março de 2011), à OAFIP (22 de agosto de 2012) e ao Conselho Nacional de Bispos Protestantes.
sources:
